4:
  title: "Exigences générales"
  1_label: "Questions juridiques"
  1_desc: "L'organisme de certification doit être une entité juridique ou une partie définie d'une entité juridique, de façon à ce qu'il puisse assumer la responsabilité juridique de ses activités de certification. Un organisme gouvernemental est considéré comme une entité juridique en vertu de son statut gouvernemental."
  2_label: "Responsabilité en matière de décision de certification"
  2_desc: "L'organisme de certification doit être responsable et doit conserver son pouvoir décisionnel, qu'il ne doit pas déléguer, en matière de certification, notamment en ce qui concerne la délivrance, le maintien, le renouvellement, l'extension et la réduction du périmètre, la suspension ou le retrait de la certification."
  3:
    title: "Management de l'impartialité"
    1_desc: "L'organisme de certification doit documenter sa structure, ses politiques et ses procédures pour manager l'impartialité et garantir que les activités de certification sont entreprises avec impartialité. La direction de l'organisme de certification doit s'engager à exercer ses activités de certification en toute impartialité. L'organisme de certification doit disposer d'une déclaration accessible au public sans demande préalable, par laquelle il reconnaît l'importance de l'impartialité dans l'exercice de ses activités de certification, il assure la gestion des conflits d'intérêts et il garantit l'objectivité de ses activités de certification."
    2_desc: "L'organisme de certification doit agir en toute impartialité avec les demandeurs, les candidats et les personnes certifiées."
    3_desc: "Les politiques et les procédures de certification de personnes doivent être équitables pour tous les demandeurs, les candidats et les personnes certifiées."
    4_desc: "L'accès à la certification ne doit pas être restreint pour des raisons financières ou autres conditions limitatives inacceptables, comme l'adhésion à une association ou à un groupe. L'organisme de certification ne doit pas recourir à des procédés destinés à limiter ou interdire, de façon arbitraire, l'accès des demandeurs et des candidats à une certification."
    5_desc: "L'organisme de certification doit être responsable de l'impartialité de ses activités de certification et il ne doit pas laisser des pressions commerciales, financières ou autres compromettre cette impartialité."
    6_desc: "L'organisme de certification doit identifier en permanence les menaces susceptibles de nuire à son impartialité. Cela doit inclure les menaces résultant de ses activités, de ses organismes apparentés, de ses relations ou des relations de son personnel. Cependant, ces relations ne représentent pas nécessairement une menace pour l'impartialité de l'organisme. \n\n ℹ️ 1 \n Une relation qui compromet l'impartialité de l'organisme peut résulter de facteurs tels que la propriété, la gouvernance, la direction, le personnel, les ressources partagées, la situation financière, les contrats, la commercialisation (y compris la stratégie de marque), le paiement de commissions sur les ventes ou autres incitations à présenter de nouveaux demandeurs, etc. \n\n ℹ️ 2 \n Les menaces susceptibles de nuire à l'impartialité peuvent être des menaces réelles ou des menaces perçues. \n\n ℹ️ 3 \n Un organisme apparenté est un organisme lié à l'organisme de certification, partiellement ou intégralement, par le biais d'actionnaires communs, partageant les mêmes membres au sein de leur conseil d'administration, des dispositions contractuelles, des dénominations communes, un personnel commun, des accords officieux ou autres ressources, de telle sorte que l'organisme apparenté est directement concerné par toute décision de certification ou possède la faculté d'influer sur le processus."
    7_desc: "L'organisme de certification doit analyser, documenter et éliminer ou réduire au minimum les conflits d'intérêts potentiels résultant de ses activités de certification. L'organisme de certification doit documenter et être à même de démontrer la façon dont il élimine, limite ou gère ces menaces. Toutes les sources potentielles de conflit d'intérêts identifiées, qu'elles résultent d'activités internes de l'organisme de certification, telles que l'assignation de responsabilités au personnel, ou d'activités d'autres personnes, organismes ou organisations, doivent être couvertes."
    8_desc: "Les activités de certification doivent être structurées et gérées de manière à préserver l'impartialité. Elles doivent prévoir une participation équilibrée des différentes parties intéressées (voir définition 3.21)."
  4_label: "Situation financière et responsabilité"
  4_desc: "L'organisme de certification doit avoir les ressources financières nécessaires à la mise en œuvre d'un processus de certification et prendre les dispositions appropriées (par exemple assurance ou réserves) pour couvrir les risques correspondants."
5:
  title: "Exigences structurelles"
  1:
    title: "Management et structure organisationnelle"
    1_desc: "Les activités de l'organisme de certification doivent être structurées et gérées de manière à préserver l'impartialité."
    2_desc: "L'organisme de certification doit documenter son organisation, en décrivant les fonctions, les responsabilités et les pouvoirs de la direction et du personnel intervenant dans la certification et de tout comité. Lorsque l'organisme de certification est une partie définie d'une entité juridique, la documentation se rapportant à la structure organisationnelle doit indiquer l'autorité hiérarchique et la relation avec les autres parties au sein de la même entité juridique. \n\n La ou les parties ou les personnes responsables des activités suivantes doivent être identifiées: \n\ta. politiques et procédures relatives au fonctionnement de l'organisme; \n\tb. mise en œuvre des politiques et des procédures; \n\tc. finances de l'organisme de certification; \n\td. ressources affectées aux activités de certification; \n\te. élaboration et maintien des dispositifs particuliers de certification; \n\tf. activités d'évaluation; \n\tg. décision en matière de certification, comportant la délivrance, le maintien, le renouvellement, l'extension, la réduction, la suspension ou le retrait de la certification; \n\th. dispositions contractuelles."
  2:
    title: "Structure de l'organisme de certification par rapport aux activités de formation"
    1_desc: "Le suivi d'une formation peut constituer une exigence d'un dispositif particulier de certification (voir 8.3). La reconnaissance/la validation des formations par l'organisme de certification ne doit pas compromettre l'impartialité ou réduire les exigences d'évaluation et de certification."
    2_desc: "L'organisme de certification doit fournir des informations sur le niveau d'enseignement et de formation si ceux-ci sont utilisés comme prérequis pour être recevable à la certification. Cependant, l'organisme de certification ne doit pas dire ou laisser entendre que la certification serait plus simple, plus facile ou moins coûteuse en cas d'utilisation de services d'enseignement/de formation spécifiés."
    3_desc: "Proposer des formations et une certification de personnes au sein d'une même entité juridique constitue une menace pour son impartialité. Un organisme de certification qui fait partie d'une entité juridique proposant des formations doit: \n\ta. identifier et documenter en permanence les menaces susceptibles de nuire à son impartialité: l'organisme doit posséder un processus documenté pour démontrer comment il élimine ou réduit ces menaces, \n\tb. démontrer que tous les processus mis en œuvre par l'organisme de certification sont indépendants des activités de formation, pour garantir que la confidentialité, la sécurité des informations et l'impartialité ne sont pas compromises, \n\tc. ne pas donner l'impression que l'utilisation de ces deux services apporterait un avantage quelconque au demandeur, \n\td. ne pas exiger des candidats qu'ils suivent l'enseignement ou la formation propre à l'organisme de certification comme prérequis exclusif, alors même qu'il existe un autre enseignement ou une autre formation avec des résultats équivalents, \n\te. garantir que son personnel n'est pas désigné comme examinateur d'un candidat spécifique qu'il a formé et ce, pendant une période de deux ans à compter de la date d'achèvement des activités de formation. Ce délai peut être réduit si l'organisme de certification démontre qu'il ne compromet pas son impartialité."
6:
  title: "Exigences relatives aux ressources"
  1:
    title: "Exigences générales relatives aux personnels"
    1_desc: "L'organisme de certification doit gérer et être responsable de la performance de tous les membres du personnel engagés dans le processus de certification."
    2_desc: "L'organisme de certification doit disposer d'un personnel possédant les compétences nécessaires à l'exécution des fonctions de certification, en nombre suffisant par rapport au type, à l'étendue et au volume des activités à réaliser."
    3_desc: "L'organisme de certification doit définir les exigences de compétence demandées au personnel engagé dans le processus de certification. Le personnel doit posséder la compétence nécessaire pour les tâches spécifiques et les responsabilités confiées."
    4_desc: "L'organisme de certification doit fournir des instructions documentées à son personnel décrivant ses fonctions et ses responsabilités. Ces instructions doivent être tenues à jour."
    5_desc: "L'organisme de certification doit tenir à jour les dossiers du personnel, incluant les informations appropriées, par exemple qualifications, formations, expérience, affiliations professionnelles, statut professionnel, compétences et conflits d'intérêts connus."
    6_desc: "Les membres du personnel agissant au nom de l'organisme de certification doivent préserver la confidentialité de toutes les informations obtenues ou créées pendant la réalisation des activités de certification, sauf disposition contraire de la loi ou sur autorisation du demandeur, du candidat ou de la personne certifiée."
    7_desc: "L'organisme de certification doit exiger de son personnel qu'il approuve un document par lequel il s'engage à se conformer aux règles définies par l'organisme de certification, y compris les règles relatives à la confidentialité, l'impartialité et les conflits d'intérêts. \n\n ℹ️ \n Lorsque la loi l'autorise, d'autres méthodes incluant une approbation électronique sont acceptables."
    8_desc: "Lorsqu'un organisme de certification certifie une personne qu'il emploie, il doit adopter des procédures permettant de préserver son impartialité."
  2:
    title: "Personnel engagé dans les activités de certification"
    1_label: "Généralités"
    1_desc: "L'organisme de certification doit exiger de chaque membre de son personnel qu'il déclare tout conflit d'intérêts potentiel avec un quelconque candidat."
    2_prefix: "6.2.2.1"
    2_label: "Exigences relatives aux examinateurs"
    2_desc: "Les examinateurs doivent satisfaire aux exigences de l'organisme de certification. Les processus de sélection et de qualification doivent garantir que les examinateurs: \n\ta. comprennent le dispositif particulier de certification applicable; \n\tb. sont à même d'appliquer les procédures et les documents relatifs à l'examen; \n\tc. ont la compétence dans le domaine de l'examen; \n\td. ont une pratique courante aussi bien orale qu'écrite de la langue de l'examen. Dans le cas où il est fait appel à un interprète ou à un traducteur, l'organisme de certification doit disposer de procédures assurant que la validité de l'examen n'est pas compromise; \n\te. ont identifié les éventuels conflits d'intérêts connus pour garantir l'impartialité de jugement."
    3_prefix: "6.2.2.2"
    3_label: "Exigences relatives aux examinateurs"
    3_desc: "L'organisme de certification doit surveiller la performance des examinateurs et la fiabilité de leurs jugements. En cas de détection de dysfonctionnements, des actions correctives doivent être entreprises. \n\n ℹ️ \n Les procédures de surveillance des examinateurs peuvent comporter, par exemple, des observations en situation, une étude de leurs rapports, des remontées d'informations des candidats."
    4_prefix: "6.2.2.3"
    4_label: "Exigences relatives aux examinateurs"
    4_desc: "Si un examinateur a un conflit d'intérêts potentiel avec un candidat à l'examen, l'organisme de certification doit prendre les mesures nécessaires pour garantir que la confidentialité et l'impartialité de l'examen ne sont pas compromises. Les mesures prises doivent être enregistrées."
    5_prefix: "6.2.3.1"
    5_label: "Exigences relatives aux autres personnels engagés dans l'évaluation"
    5_desc: "L'organisme de certification doit disposer d'une description documentée des responsabilités et des qualifications des autres membres du personnel intervenant dans le processus d'examen (par exemple surveillants d'examens)."
    6_prefix: "6.2.3.2"
    6_label: "Exigences relatives aux autres personnels engagés dans l'évaluation"
    6_desc: "Si d'autres personnels engagés dans l'évaluation ont un conflit d'intérêts potentiel avec un candidat à l'examen, l'organisme de certification doit prendre les mesures nécessaires pour garantir que la confidentialité et l'impartialité de l'examen ne sont pas compromises. Les mesures prises doivent être enregistrées."
  3:
    title: "Externalisation"
    1_desc: "L'organisme de certification doit disposer d'un contrat juridiquement exécutoire prévoyant les diverses modalités, y compris en matière de confidentialité et de conflit d'intérêts, avec chaque organisme lui fournissant des opérations externalisées en rapport avec le processus de certification. \n\n ℹ️ \n Pour les besoins de la présente Norme internationale, les termes «externalisation» et «sous-traitance» sont considérés comme synonymes."
    2_desc: "Quand un organisme de certification externalise des opérations relatives à la certification, il doit: \n\ta. assumer l'entière responsabilité de toutes les opérations externalisées, \n\tb. s'assurer que l'organisme exécutant les opérations externalisées est compétent et se conforme aux dispositions applicables de la présente Norme internationale, \n\tc. évaluer et surveiller la performance des organismes exécutant les opérations externalisées conformément à ses procédures documentées, \n\td. disposer d'enregistrements pour démontrer que les organismes exécutant des opérations externalisées satisfont à toutes les exigences en rapport avec ces activités, et \n\te. tenir à jour une liste des organismes exécutant les opérations externalisées."
  4_label: "Autres ressources"
  4_desc: "L'organisme de certification doit utiliser des locaux, y compris les centres d'examen, des équipements et des ressources adaptés à la réalisation de ses activités de certification."
7:
  title: "Exigences en matière d'enregistrements et d'informations"
  1:
    title: "Enregistrements des demandeurs, candidats et personnes certifiées"
    1_desc: "L'organisme de certification doit tenir à jour des enregistrements. Les enregistrements doivent comporter un moyen permettant de confirmer le statut d'une personne certifiée. Les enregistrements doivent démontrer que le processus de certification ou de renouvellement de certification a été effectivement réalisé, en particulier en ce qui concerne les dépôts de candidatures, les rapports d'évaluation (y compris les enregistrements des examens) et les autres documents relatifs à la délivrance, au maintien, au renouvellement, à l'extension ou à la réduction du périmètre, ainsi qu'à la suspension ou au retrait de la certification."
    2_desc: "Les enregistrements doivent être identifiés, gérés et éliminés de façon à assurer l'intégrité du processus et la confidentialité des informations. Ces enregistrements doivent être conservés pendant une période de temps appropriée, au moins un cycle complet de certification, ou selon les dispositions prévues par les accords de reconnaissance, les obligations contractuelles, légales ou autres."
    3_desc: "L'organisme de certification doit prévoir des dispositions pour exiger des personnes certifiées qu'elles l'informent, sans délai, des éléments qui peuvent affecter leur capacité à continuer à satisfaire aux exigences de la certification."
  2:
    title: "Informations au public"
    1_desc: "L'organisme de certification doit vérifier et fournir, sur demande, les informations relatives à la validité et au périmètre de certification d'une personne certifiée, sauf si la loi exige la non-divulgation de ces informations."
    2_desc: "L'organisme de certification doit rendre publiques, sans qu'il soit nécessaire de les demander, les informations relatives au périmètre du dispositif particulier de certification et une description générale du processus de certification."
    3_desc: "L'ensemble des prérequis du dispositif particulier de certification doit être répertorié et la liste des prérequis doit être rendue publique sans qu'il soit nécessaire de la demander."
    4_desc: "Les informations fournies par l'organisme de certification, y compris les informations d'ordre publicitaire, doivent être exactes et ne pas induire en erreur."
  3:
    title: "Confidentialité"
    1_desc: "L'organisme de certification doit instaurer des politiques et des procédures documentées relatives à la mise à jour et à la diffusion des informations."
    2_desc: "L'organisme de certification doit, sur la base d'accords juridiquement exécutoires, assurer la confidentialité de toutes les informations recueillies au cours du processus de certification. Ces accords doivent concerner tous les membres du personnel."
    3_desc: "L'organisme de certification doit s'assurer que les informations obtenues lors du processus de certification ou à partir de sources autres que le demandeur, le candidat ou la personne certifiée, ne soient pas divulguées à une partie non autorisée sans le consentement dûment formulé par écrit de la personne (demandeur, candidat ou personne certifiée), sauf pour les cas où la loi prévoit la divulgation de ces informations."
    4_desc: "Lorsque l'organisme de certification est tenu par la loi de divulguer des informations confidentielles, la personne concernée doit être tenue informée des informations divulguées, sauf disposition contraire de la loi."
    5_desc: "L'organisme de certification doit garantir que les activités des organismes apparentés ne compromettent pas la confidentialité."
  4:
    title: "Sécurité"
    1_desc: "L'organisme de certification doit élaborer et documenter les politiques et les procédures permettant de garantir la sécurité tout au long du processus de certification et doit instaurer des mesures permettant la mise en place d'actions correctives lorsqu'une défaillance est constatée."
    2_desc: "Les politiques et les procédures de sécurité doivent comporter des dispositions garantissant la sécurité du matériel d'examen, prenant en compte : \n\ta. l'emplacement du matériel d'examen (par exemple transport, distribution électronique, mise à disposition, stockage, centre d'examen), \n\tb. la nature du matériel d'examen (par exemple documents électroniques, papier, équipements d'examen,), \n\tc. les étapes du processus d'examen (par exemple développement, administration de l'examen, report des résultats), \n\td. les menaces résultant de l'usage répété du matériel d'examen."
    3_desc: "Les organismes de certification doivent prévenir les tentatives de fraude à l'examen en : \n\ta. exigeant des candidats d'approuver un accord de non-divulgation ou autre accord indiquant leur engagement à ne pas divulguer de documents d'examen confidentiels, ni à prendre part à des pratiques frauduleuses, \n\tb. exigeant la présence d'un surveillant ou d'un examinateur, \n\tc. s'assurant de l'identité du candidat, \n\td. mettant en œuvre des procédures destinées à empêcher que tout outil d'aide non autorisé soit introduit dans la zone d'examen, \n\te. empêchant les candidats d'avoir accès à des outils d'aide non autorisés lors de l'examen, \n\tf. surveillant les résultats des examens pour y déceler des signes de fraude."
8:
  title: "Dispositif(s) particulier(s) de certification"
  1_desc: "Chaque catégorie de certification doit faire l'objet d'un dispositif particulier de certification."
  2_desc: "Un dispositif particulier de certification doit comporter les éléments suivants: \n\ta. le périmètre de la certification; \n\tb. la description de la mission et des tâches associées; \n\tc. la compétence exigée; \n\td. les aptitudes (le cas échéant); \n\te. les prérequis (le cas échéant); \n\tf. le code de conduite (le cas échéant). \n\n ℹ️ 1 \n Les aptitudes exigées peuvent inclure des aptitudes physiques, comme la vue, l'ouïe, la mobilité. \n\n ℹ️ 2 \n Un code de conduite décrit la déontologie ou les comportements personnels exigés par le dispositif particulier."
  3_desc: "Un dispositif particulier de certification de personnes doit comporter les exigences suivantes d'un processus de certification: \n\ta. les critères pour une certification initiale et un renouvellement; \n\tb. les méthodes d'évaluation d'une certification initiale et d'un renouvellement; \n\tc. les méthodes et les critères de surveillance (le cas échant); \n\td. les critères de suspension et de retrait d'une certification; \n\te. les critères de modification du périmètre ou du niveau de la certification (le cas échéant)."
  4_desc: "L'organisme de certification doit détenir des documents démontrant que les points ci-après sont inclus dans l'élaboration et la revue du dispositif particulier de certification: \n\ta. la participation d'experts appropriés; \n\tb. l'utilisation d'une structure appropriée représentant, de manière équitable, les intérêts de toutes les parties concernées de façon significative, sans qu'aucun intérêt particulier ne prédomine; \n\tc. l'identification et l'alignement des prérequis, le cas échéant, sur les exigences en matière de compétence; \n\td. l'identification et l'alignement des modalités d'évaluation sur les exigences en matière de compétence; \n\te. une analyse des missions ou des pratiques réalisées et/ou revue pour \n\t\t- identifier la performance des tâches, \n\t\t- identifier la compétence exigée pour chaque tâche, \n\t\t- identifier les prérequis (le cas échéant), \n\t\t- confirmer les modalités d'évaluation et le contenu de l'examen, \n\t\t- identifier les exigences de renouvellement de certification et les périodicités. \n\n ℹ️ \n Lorsque le dispositif particulier de certification a été élaboré par une entité autre que l'organisme de certification, il se peut que l'analyse des missions et des pratiques existe déjà. Dans ce cas, l'organisme de certification peut en obtenir les détails pour vérification dans la documentation du dispositif particulier."
  5_desc: "L'organisme de certification doit s'assurer que le dispositif particulier de certification est revu et validé en permanence systématiquement."
  6_desc: "Lorsque l'organisme de certification n'est pas le propriétaire d'un dispositif particulier de certification qu'il applique, il doit garantir que les exigences figurant dans le présent article sont satisfaites."
9:
  title: "Exigences du processus de certification"
  1:
    title: "Processus de candidature"
    1_desc: "À la phase de candidature, l'organisme de certification doit mettre à disposition une description générale du processus de certification selon le dispositif particulier de certification. La description générale doit, au minimum, comporter les exigences de la certification et son périmètre, une description du processus d'évaluation, les droits du demandeur, les devoirs d'une personne certifiée et le coût."
    2_desc: "L'organisme de certification doit exiger un formulaire de candidature complété et approuvé par le demandeur sollicitant la certification, comportant au minimum: \n\ta. les informations nécessaires à l'identification du demandeur, comme le nom, l'adresse, ainsi que les autres informations exigées par le dispositif particulier de certification, \n\tb. le périmètre de la certification souhaitée, \n\tc. une déclaration attestant que le demandeur s'engage à respecter les exigences de certification et à fournir toute information nécessaire à son évaluation, \n\td. toute information à même de démontrer objectivement la conformité aux prérequis du dispositif particulier, \n\te. une note informant le demandeur de la possibilité de déclarer, dans les limites du raisonnable, une prise en compte de besoins particuliers (voir 9.2.5). \n\n ℹ️ \n Lorsque la loi l'autorise, d'autres méthodes incluant une approbation électronique sont acceptables."
    3_desc: "L'organisme de certification doit faire une revue de la demande de candidature pour confirmer si le demandeur satisfait aux exigences du dispositif particulier de certification."
  2:
    title: "Processus d'évaluation"
    1_desc: "L'organisme de certification doit mettre en œuvre les méthodes et les modalités d'évaluation spécifiques définies dans le dispositif particulier de certification."
    2_desc: "Quand un changement dans le dispositif particulier de certification nécessite une évaluation complémentaire, l'organisme de certification doit documenter et rendre accessibles sans demande préalable les méthodes et les modalités exigées permettant de vérifier que les personnes certifiées satisfont aux nouvelles exigences. \n\n ℹ️ \n Cette vérification peut être effectuée dans le cadre d'un renouvellement de certification."
    3_desc: "L'évaluation doit être planifiée et structurée de manière à s'assurer que les exigences du dispositif particulier sont vérifiées de façon objective et systématique, avec des preuves documentées confirmant la compétence du candidat."
    4_desc: "L'organisme de certification doit vérifier les méthodes d'évaluation des candidats. La vérification doit garantir que chaque évaluation est équitable et valide."
    5_desc: "L'organisme de certification doit vérifier et respecter les besoins particuliers, dans les limites du raisonnable et sans compromettre l'intégrité de l'évaluation, en tenant compte de la réglementation nationale. [Voir 9.1.2 e).]"
    6_desc: "Lorsque l'organisme de certification prend en compte les activités réalisées par un autre organisme, il doit être en possession des rapports, des données et des enregistrements appropriés pour démontrer que les résultats sont équivalents et conformes aux exigences fixées par le dispositif particulier de certification."
  3:
    title: "Processus d'examen"
    1_desc: "Les examens, qu'ils soient écrits, oraux, pratiques, basés sur une observation ou tout autre moyen fiable et objectif, doivent être conçus pour évaluer la compétence et satisfaire au dispositif particulier. La conception des modalités d'examen doit prévoir une méthode de comparabilité des résultats de chacune des épreuves, tant sur le plan du contenu que sur le plan de la difficulté, en prenant en compte l'étude de la validité des décisions de certification et de non-certification."
    2_desc: "L'organisme de certification doit disposer de procédures pour assurer une gestion cohérente des sessions d'examens."
    3_desc: "Des critères concernant les conditions de réalisation des sessions d'examens doivent être établis, documentés et contrôlés. \n\n ℹ️ \n Les conditions peuvent inclure l'éclairage, la température, la séparation des candidats, le bruit, la sécurité des candidats, etc."
    4_desc: "En cas d'utilisation de matériels techniques dans un processus d'examen, ces matériels doivent être vérifiés ou étalonnés, le cas échéant."
    5_desc: "Une méthodologie appropriée et des procédures (par exemple la collecte et la mise à jour de données statistiques) doivent être documentées et mises en œuvre afin de réaffirmer, à des périodicités définies et justifiées, l'équité, la validité, la fiabilité et le fonctionnement général de chaque examen, et tout dysfonctionnement détecté doit être corrigé."
  4:
    title: "Décision de certification"
    1_desc: "Les informations collectées pendant le processus de certification doivent être suffisantes pour permettre: \n\ta. à l'organisme de certification de prendre une décision quant à la délivrance de la certification, \n\tb. la traçabilité dans l'éventualité, par exemple, d'un appel ou d'une plainte."
    2_desc: "Les décisions de certification, de maintien, de renouvellement, d'extension, de réduction, de suspension ou de retrait d'une certification ne doivent pas être externalisées."
    3_desc: "Pour prendre sa décision de certification, l'organisme de certification doit s'en tenir aux questions liées spécifiquement aux exigences du dispositif particulier de certification."
    4_desc: "La décision de certifier un candidat doit être prise uniquement par l'organisme de certification, en se fondant sur les informations recueillies pendant le processus de certification. Le personnel qui prend la décision de certification ne doit pas avoir participé à l'examen ou à la formation du candidat."
    5_desc: "Le personnel qui prend des décisions de certification doit posséder un niveau suffisant de connaissance et d'expérience du processus de certification pour déterminer si les exigences de la certification ont été satisfaites."
    6_desc: "La certification ne doit pas être délivrée tant que toutes les exigences de certification n'ont pas été remplies."
    7_desc: "L'organisme de certification doit fournir un certificat à toutes les personnes certifiées. L'organisme de certification doit conserver la propriété exclusive des certificats. Le certificat doit prendre la forme d'une lettre, d'une carte ou d'un autre support, signé ou validé par un responsable, membre du personnel de l'organisme de certification."
    8_desc: "Les certificats doivent, au minimum, comporter les informations suivantes: \n\ta. le nom de la personne certifiée; \n\tb. une identification unique; \n\tc. le nom de l'organisme de certification; \n\td. une référence au dispositif particulier de certification, à une norme ou à d'autres documents appropriés, incluant, si nécessaire, une date de publication; \n\te. le périmètre de la certification, incluant, si applicables, les conditions et les limites de validité; \n\tf. la date d'effet de la certification et sa date d'expiration."
    9_desc: "Le certificat doit être conçu de sorte à réduire les risques de falsification."
  5:
    title: "Suspension, retrait ou réduction du périmètre de certification"
    1_desc: "L'organisme de certification doit disposer d'une politique et d'une ou plusieurs procédures documentées qui traitent de la suspension, du retrait ou de la réduction du périmètre de la certification et qui doivent définir les actions à mener en conséquence."
    2_desc: "L'incapacité à résoudre les problèmes ayant entraîné la suspension, dans un délai déterminé par l'organisme de certification, doit donner lieu au retrait ou à la réduction du périmètre de la certification."
    3_desc: "L'organisme de certification doit prendre des dispositions applicables envers la personne certifiée pour s'assurer qu'en cas de suspension de la certification, la personne certifiée s'abstient de toute promotion de sa certification durant cette suspension."
    4_desc: "L'organisme de certification doit prendre des dispositions applicables envers la personne certifiée pour s'assurer qu'en cas de retrait de la certification, la personne certifiée s'abstient de faire référence à sa certification."
  6:
    title: "Processus de renouvellement de certification"
    1_desc: "L'organisme de certification doit disposer d'une ou plusieurs procédures documentées pour la mise en œuvre du processus de renouvellement de certification selon les exigences du dispositif particulier de certification."
    2_desc: "Durant le processus de renouvellement de la certification, l'organisme de certification doit s'assurer qu'il confirme le maintien de la compétence de la personne certifiée conformément aux exigences du dispositif particulier en vigueur."
    3_desc: "La période de renouvellement de certification doit être basée sur les exigences du dispositif particulier. Les raisons justifiant la période de renouvellement de certification doivent tenir compte, le cas échéant, des éléments suivants: \n\ta. exigences réglementaires; \n\tb. changements apportés aux documents normatifs; \n\tc. changements apportés aux exigences du dispositif particulier; \n\td. nature et maturité du domaine ou du secteur professionnel dans lequel la personne certifiée travaille; \n\te. risques résultant de l'incompétence d'une personne; \n\tf. changements en cours de technologie et des exigences pour les personnes certifiées; \n\tg. exigences des parties intéressées; \n\th. fréquence et contenu des activités de surveillance, si exigées par le dispositif particulier."
    4_desc: "La ou les modalités de renouvellement de certification définies doivent être adaptées de manière à assurer une évaluation impartiale pour confirmer le maintien de la compétence de la personne certifiée."
    5_desc: "Conformément au dispositif particulier de certification, l'organisme de certification doit, pour le renouvellement de la certification, envisager au moins les options suivantes: \n\ta. évaluation sur site; \n\tb. développement professionnel; \n\tc. entretiens structurés; \n\td. confirmation de la continuité d'un travail satisfaisant et enregistrement de l'expérience professionnelle; \n\te. examen; \n\tf. contrôle de la capacité physique en rapport avec la compétence concernée. \n\n ℹ️ \n La «capacité physique» peut nécessiter une évaluation par un professionnel de santé ou un professionnel qualifié pour évaluer des aptitudes physiques telles que la dextérité, la force, l'endurance, ainsi que des aptitudes techniques exigées pour la certification."
  7:
    title: "Utilisation des certificats, logos et marques"
    1_desc: "Un organisme de certification qui fournit une marque de certification ou un logo doit en documenter les conditions d'utilisation et doit en gérer les droits d'utilisation et de représentation de façon appropriée. \n\n ℹ️ \n L'ISO/CEI 17030 fournit les exigences relatives à l'utilisation des marques de tierces parties."
    2_desc: "L'organisme de certification doit exiger qu'une personne certifiée s'engage contractuellement sur les actions suivantes: \n\ta. se conformer aux dispositions applicables du dispositif particulier de certification; \n\tb. ne faire une réclamation qu'en lien avec le périmètre de la certification octroyée; \n\tc. ne pas utiliser sa certification d'une façon qui puisse nuire à la réputation de l'organisme de certification, et ne faire aucune déclaration concernant la certification que l'organisme de certification puisse juger trompeuse ou non autorisée; \n\td. cesser, dès la suspension ou le retrait de sa certification, de faire état de cette certification en faisant référence à l'organisme de certification ou à la certification elle-même, et retourner tout certificat émis par l'organisme de certification; \n\te. ne pas utiliser le certificat de façon trompeuse. \n\n ℹ️ \n Lorsque la loi l'autorise, d'autres méthodes incluant une approbation électronique sont acceptables."
    3_desc: "Un organisme de certification doit remédier, à l'aide de mesures correctives, à toute utilisation abusive de sa marque ou de son logo de certification."
  8:
    title: "Appels envers des décisions de certification"
    1_desc: "L'organisme de certification doit avoir un processus documenté pour recevoir, évaluer et prendre des décisions relatives aux appels. Le processus de traitement des appels doit comprendre, au minimum, les éléments et les méthodes suivants: \n\ta. le processus de réception, de validation, d'examen de l'appel, et de prise de décision des actions à entreprendre pour traiter l'appel, en tenant compte des résultats d'appels précédents similaires; \n\tb. le suivi et l'enregistrement des appels, y compris des actions entreprises pour y répondre; \n\tc. la garantie que, le cas échéant, des corrections et actions correctives appropriées sont entreprises."
    2_desc: "Les politiques et les procédures doivent assurer que tous les appels sont traités de façon constructive, impartiale et en temps raisonnable."
    3_desc: "Une description du processus de traitement des appels doit être rendue accessible sans demande préalable."
    4_desc: "L'organisme de certification doit être responsable de toutes les décisions prises à tous les niveaux du processus de traitement des appels. L'organisme de certification doit s'assurer que le personnel engagé dans le processus du traitement des appels est différent de celui qui a été impliqué dans la décision qui fait l'objet de l'appel."
    5_desc: "La soumission, l'examen et la décision prise concernant les appels ne doivent pas donner lieu à des actions discriminantes envers l'appelant."
    6_desc: "L'organisme de certification doit accuser réception de l'appel et fournir à l'appelant les rapports d'avancement et les résultats."
    7_desc: "L'organisme de certification doit dûment aviser l'appelant de la fin du processus de traitement de l'appel."
  9:
    title: "Plaintes"
    1_desc: "L'organisme de certification doit avoir un processus documenté pour recevoir, évaluer et prendre des décisions relatives aux plaintes."
    2_desc: "Une description du processus de traitement des plaintes doit être accessible sans demande préalable. Ces procédures doivent traiter toutes les parties de manière juste et équitable."
    3_desc: "Les politiques et les procédures doivent assurer que toutes les plaintes sont prises en compte et traitées de façon constructive, impartiale et en temps raisonnable. Le processus de traitement des plaintes doit comprendre, au minimum, les éléments et les méthodes suivants: \n\ta. le principe général du processus de réception, de validation, d'examen de la plainte et de prise de décision sur les actions à entreprendre pour traiter celle-ci; \n\tb. le suivi et l'enregistrement des plaintes, y compris des actions entreprises pour y répondre; \n\tc. la garantie que, le cas échéant, des corrections et actions correctives appropriées sont entreprises."
    4_desc: "À réception d'une plainte, l'organisme de certification doit confirmer si la plainte est liée aux activités de certification dont il a la responsabilité et, dans l'affirmative, il doit y répondre en conséquence."
    5_desc: "Dans la mesure du possible, l'organisme de certification doit accuser réception de la plainte et fournir au plaignant les rapports d'avancement et les résultats."
    6_desc: "L'organisme de certification recevant la plainte doit être responsable de la collecte et de la vérification de toutes les informations nécessaires lui permettant de valider celle-ci."
    7_desc: "Dans la mesure du possible, l'organisme de certification doit dûment aviser le plaignant de la fin du processus de traitement de la plainte."
    8_desc: "Toute plainte fondée relative à une personne certifiée doit également être notifiée, par l'organisme de certification à la personne certifiée concernée, dans un délai raisonnable."
    9_desc: "Le processus de traitement de la plainte doit tenir compte des exigences de confidentialité dans la mesure où il concerne le plaignant et l'objet de la plainte."
    10_desc: "La décision à communiquer au plaignant doit être prise, ou examinée et approuvée par du personnel n'ayant pas été précédemment impliqué dans l'objet de la plainte."
10:
  title: "Exigences du système de management"
  1_label: "Généralités"
  1_desc: "L'organisme de certification doit établir, documenter, mettre en œuvre et maintenir un système de management capable de soutenir et démontrer qu'il satisfait de façon régulière aux exigences de la présente Norme internationale. Outre la satisfaction aux exigences des Articles 4 à 9 de la présente Norme internationale, l'organisme de certification doit mettre en œuvre un système de management conforme soit à l'option A, soit à l'option B. \n\t- option A: un système général de management répondant aux exigences de 10.2, ou \n\t option B: un organisme de certification qui a établi et maintient un système de management selon les exigences de l'ISO 9001, et qui est capable de soutenir et démontrer que ce système satisfait de façon régulière aux exigences de la présente Norme internationale (ISO/CEI 17024), satisfait aux exigences du système de management de 10.2."
  2:
    title: "Exigences générales du système de management"
    1_label: "Généralités"
    1_desc: "L'organisme de certification doit établir, documenter, mettre en œuvre et maintenir un système de management capable de soutenir et démontrer qu'il satisfait de manière régulière aux exigences de la présente Norme internationale. \n\n La direction de l'organisme de certification doit établir et documenter des politiques et des objectifs pour ses activités. \n\n La direction doit fournir la preuve de son engagement au développement et à la mise en œuvre du système de management conformément aux exigences de la présente Norme internationale. La direction doit s'assurer que les politiques sont bien comprises, mises en œuvre et maintenues à jour à tous les niveaux de l'organisation de l'organisme de certification. \n\n La direction de l'organisme de certification doit nommer un membre de l'encadrement qui, indépendamment d'autres responsabilités, doit avoir notamment la responsabilité et l'autorité pour \n\ta. garantir que les processus et les procédures nécessaires au système de management sont établis, mis en œuvre et maintenus à jour, et \n\tb. rendre compte à la direction du fonctionnement du système de management et de toute nécessité d'amélioration."
    2_label: "Documentation du système de management"
    2_desc: "Les exigences applicables de la présente Norme internationale doivent être documentées. L'organisme de certification doit s'assurer que la documentation du système de management est fournie à l'ensemble du personnel concerné."
    3_label: "Maîtrise des documents"
    3_desc: "L'organisme de certification doit établir des procédures lui permettant de maîtriser les documents (internes et externes) liés au respect des exigences de la présente Norme internationale. Ces procédures doivent définir les mesures nécessaires pour \n\ta. approuver l'adéquation des documents avant diffusion, \n\tb. revoir, mettre à jour si nécessaire et approuver de nouveau les documents, \n\tc. assurer que les modifications et le statut de la version en vigueur des documents sont identifiés, \n\td. assurer la disponibilité sur les lieux d'utilisation des versions pertinentes des documents applicables, \n\te. assurer que les documents restent lisibles et facilement identifiables, \n\tf. assurer que les documents d'origine extérieure sont identifiés et que leur diffusion est maîtrisée, et \n\tg. empêcher toute utilisation non intentionnelle de documents périmés et les identifier de manière adéquate s'ils sont conservés dans un but quelconque. \n\n ℹ️ \n La documentation peut se présenter sous toute forme ou sur tout type de support."
    4_label: "Maîtrise des enregistrements"
    4_desc: "L'organisme de certification doit instaurer des procédures pour assurer l'identification, le stockage, la protection, l'accessibilité, la durée de conservation et l'élimination des enregistrements générés dans le cadre des exigences de la présente Norme internationale. \n\n L'organisme de certification doit établir des procédures définissant une période de conservation des enregistrements qui soit cohérente avec ses obligations contractuelles et légales. L'accès à ces enregistrements doit être conforme aux dispositions en matière de confidentialité. \n\n ℹ️ \n En ce qui concerne les exigences relatives aux enregistrements des demandeurs, des candidats et des personnes certifiées, voir également 7.1."
    5_prefix: "10.2.5.1"
    5_label: "Revue de direction - Généralités"
    5_desc: "La direction de l'organisme de certification doit établir des procédures pour revoir, à intervalles planifiés, son système de management pour s'assurer qu'il demeure pertinent, adéquat et efficace, y compris les politiques et les objectifs déclarés relatifs au respect des exigences de la présente Norme internationale. Ces revues doivent être réalisées au moins une fois par an et doivent être documentées."
    6_prefix: "10.2.5.2"
    6_label: "Revue de direction - Éléments d'entrée de la revue"
    6_desc: "Les éléments d'entrée de la revue de direction doivent comprendre des informations sur les points suivants: \n\ta. les résultats des audits internes et externes (par exemple évaluation de l'organisme d'accréditation); \n\tb. les retours d'information des demandeurs, candidats et personnes certifiées, ainsi que des parties intéressées, liés au respect des exigences de la présente Norme internationale; \n\tc. la préservation de l'impartialité; \n\td. l'état des actions préventives et correctives; \n\te. le suivi des actions issues des revues de direction précédentes; \n\tf. la réalisation des objectifs; \n\tg. les changements pouvant affecter le système de management; \n\th. les appels et les plaintes."
    7_prefix: "10.2.5.3"
    7_label: "Revue de direction - Éléments de sortie de la revue"
    7_desc: "Les éléments de sortie de la revue de direction doivent comprendre, au minimum, les décisions et actions relatives aux points suivants: \n\ta. l'amélioration de l'efficacité du système de management et de ses processus; \n\tb. l'amélioration des services de certification liée au respect des exigences de la présente Norme internationale; \n\tc. les besoins en ressources."
    8_prefix: "10.2.6.1"
    8_label: "Audits internes"
    8_desc: "L'organisme de certification doit établir des procédures relatives aux audits internes pour vérifier qu'il respecte les exigences de la présente Norme internationale et que le système de management soit mis en œuvre et maintenu de manière efficace. \n\n ℹ️ \n L'ISO 19011 fournit des lignes directrices pour la réalisation des audits internes."
    9_prefix: "10.2.6.2"
    9_label: "Audits internes"
    9_desc: "Un programme d'audits doit être planifié en tenant compte de l'importance des processus et des domaines à auditer, ainsi que des résultats des audits précédents."
    10_prefix: "10.2.6.3"
    10_label: "Audits internes"
    10_desc: "Les audits internes doivent être réalisés au moins une fois par an. La fréquence de ces audits peut être réduite si l'organisme de certification démontre l'efficacité et la stabilité du système de management qu'il a mis en place, conformément aux exigences de la présente Norme internationale."
    11_prefix: "10.2.6.4"
    11_label: "Audits internes"
    11_desc: "L'organisme de certification doit assurer que \n\ta. les audits internes sont réalisés par un personnel qualifié disposant des connaissances requises sur le processus de certification, les audits et les exigences de la présente Norme internationale, \n\tb. les auditeurs n'auditent pas leur propre travail, \n\tc. le personnel responsable du domaine audité est informé des résultats de l'audit, \n\td. toutes les actions résultant d'audits internes sont entreprises en temps opportun et de manière appropriée, et \n\te. toutes les opportunités d'amélioration sont identifiées."
    12_prefix: "10.2.7"
    12_label: "Actions correctives"
    12_desc: "L'organisme de certification doit établir une ou des procédures pour identifier et gérer les non-conformités de ses opérations. L'organisme de certification doit également, si nécessaire, mener des actions pour éliminer les causes de non-conformités afin d'éviter qu'elles ne se reproduisent. Les actions correctives doivent être adaptées aux effets des non-conformités rencontrées. Les procédures doivent définir les exigences en matière \n\ta. d'identification des non-conformités, \n\tb. de détermination des causes de non-conformité, \n\tc. de correction des non-conformités, \n\td. d'évaluation du besoin d'entreprendre des actions pour garantir que les non-conformités ne se reproduisent pas, \n\te. de détermination et de mise en œuvre en temps opportun des actions nécessaires, \n\tf. d'enregistrement des résultats des actions mises en œuvre, et \n\tg. de revue de l'efficacité des actions correctives."
    13_prefix: "10.2.8"
    13_label: "Actions préventives"
    13_desc: "L'organisme de certification doit établir une ou des procédures relatives aux actions préventives permettant d'éliminer les causes de non-conformités potentielles. Les actions préventives doivent être adaptées aux effets probables des problèmes potentiels. Les procédures relatives aux actions préventives doivent définir les exigences en matière \n\ta. d'identification des non-conformités potentielles et de leurs causes, \n\tb. d'évaluation du besoin d'entreprendre des actions pour éviter l'apparition de non-conformités, \n\tc. de détermination et de mise en œuvre des actions nécessaires, \n\td. d'enregistrement des résultats des actions mises en œuvre, et \n\te. de revue de l'efficacité des actions préventives mises en œuvre. \n\n ℹ️ \n Il n'est pas forcément nécessaire de rédiger des procédures distinctes pour le traitement des actions correctives d'une part et des actions préventives d'autre part."
