1:
  title: "Gouverner"
  prefix: "(GV)"
  desc: "La stratégie, les attentes et la politique de gestion des risques de cybersécurité de l'organisation sont établies, communiquées et surveillées"
  1:
    title: "Contexte Organisationnel"
    prefix: "GV.OC"
    desc: "Les circonstances — mission, attentes des parties prenantes, dépendances et exigences légales, réglementaires et contractuelles — entourant les décisions de gestion des risques de cybersécurité de l'organisation sont comprises"
    1_prefix: "GV.OC-01"
    1_label: "La mission organisationnelle est comprise et oriente la gestion des risques de cybersécurité"
    2_prefix: "GV.OC-02"
    2_label: "Les parties prenantes internes et externes sont comprises, et leurs besoins et attentes concernant la gestion des risques de cybersécurité sont compris et pris en compte"
    3_prefix: "GV.OC-03"
    3_label: "Les exigences légales, réglementaires et contractuelles concernant la cybersécurité — y compris les obligations en matière de confidentialité et de libertés civiles — sont comprises et gérées"
    4_prefix: "GV.OC-04"
    4_label: "Les objectifs, capacités et services critiques dont dépendent les parties prenantes externes ou qu'elles attendent de l'organisation sont compris et communiqués"
    5_prefix: "GV.OC-05"
    5_label: "Les résultats, capacités et services dont dépend l'organisation sont compris et communiqués"
  2:
    title: "Stratégie de Gestion des Risques"
    prefix: "GV.RM"
    desc: "Les priorités, contraintes, déclarations de tolérance et d'appétence au risque, et hypothèses de l'organisation sont établies, communiquées et utilisées pour soutenir les décisions opérationnelles en matière de risque"
    1_prefix: "GV.RM-01"
    1_label: "Les objectifs de gestion des risques sont établis et approuvés par les parties prenantes de l'organisation"
    2_prefix: "GV.RM-02"
    2_label: "Les déclarations d'appétence et de tolérance au risque sont établies, communiquées et maintenues"
    3_prefix: "GV.RM-03"
    3_label: "Les activités et résultats de gestion des risques de cybersécurité sont inclus dans les processus de gestion des risques de l'entreprise"
    4_prefix: "GV.RM-04"
    4_label: "Une orientation stratégique décrivant les options appropriées de réponse aux risques est établie et communiquée"
    5_prefix: "GV.RM-05"
    5_label: "Des lignes de communication sont établies au sein de l'organisation pour les risques de cybersécurité, y compris les risques provenant des fournisseurs et autres tiers"
    6_prefix: "GV.RM-06"
    6_label: "Une méthode standardisée pour calculer, documenter, catégoriser et prioriser les risques de cybersécurité est établie et communiquée"
    7_prefix: "GV.RM-07"
    7_label: "Les opportunités stratégiques (c'est-à-dire les risques positifs) sont caractérisées et incluses dans les discussions sur les risques de cybersécurité de l'organisation"
  3:
    title: "Rôles, Responsabilités et Autorités"
    prefix: "GV.RR"
    desc: "Les rôles, responsabilités et autorités en matière de cybersécurité pour favoriser la responsabilisation, l'évaluation des performances et l'amélioration continue sont établis et communiqués"
    1_prefix: "GV.RR-01"
    1_label: "La direction de l'organisation est responsable et redevable des risques de cybersécurité et favorise une culture consciente des risques, éthique et en amélioration continue"
    2_prefix: "GV.RR-02"
    2_label: "Les rôles, responsabilités et autorités liés à la gestion des risques de cybersécurité sont établis, communiqués, compris et appliqués"
    3_prefix: "GV.RR-03"
    3_label: "Des ressources adéquates sont allouées en fonction de la stratégie de risque de cybersécurité, des rôles, des responsabilités et des politiques"
    4_prefix: "GV.RR-04"
    4_label: "La cybersécurité est incluse dans les pratiques de ressources humaines"
  4:
    title: "Politique"
    prefix: "GV.PO"
    desc: "La politique de cybersécurité organisationnelle est établie, communiquée et appliquée"
    1_prefix: "GV.PO-01"
    1_label: "La politique de gestion des risques de cybersécurité est établie en fonction du contexte organisationnel, de la stratégie de cybersécurité et des priorités, et est communiquée et appliquée"
    2_prefix: "GV.PO-02"
    2_label: "La politique de gestion des risques de cybersécurité est revue, mise à jour, communiquée et appliquée pour refléter les changements dans les exigences, les menaces, la technologie et la mission organisationnelle"
  5:
    title: "Supervision"
    prefix: "GV.OV"
    desc: "Les résultats des activités de gestion des risques de cybersécurité à l'échelle de l'organisation et les performances sont utilisés pour informer, améliorer et ajuster la stratégie de gestion des risques"
    1_prefix: "GV.OV-01"
    1_label: "Les résultats de la stratégie de gestion des risques de cybersécurité sont examinés pour informer et ajuster la stratégie et l'orientation"
    2_prefix: "GV.OV-02"
    2_label: "La stratégie de gestion des risques de cybersécurité est revue et ajustée pour assurer la couverture des exigences et des risques organisationnels"
    3_prefix: "GV.OV-03"
    3_label: "La performance de la gestion des risques de cybersécurité de l'organisation est évaluée et examinée pour les ajustements nécessaires"
  6:
    title: "Gestion des Risques de la Chaîne d'Approvisionnement en Cybersécurité"
    prefix: "GV.SC"
    desc: "Les processus de gestion des risques de la chaîne d'approvisionnement cyber sont identifiés, établis, gérés, surveillés et améliorés par les parties prenantes de l'organisation"
    1_prefix: "GV.SC-01"
    1_label: "Un programme, une stratégie, des objectifs, des politiques et des processus de gestion des risques de la chaîne d'approvisionnement en cybersécurité sont établis et approuvés par les parties prenantes de l'organisation"
    2_prefix: "GV.SC-02"
    2_label: "Les rôles et responsabilités en matière de cybersécurité pour les fournisseurs, clients et partenaires sont établis, communiqués et coordonnés en interne et en externe"
    3_prefix: "GV.SC-03"
    3_label: "La gestion des risques de la chaîne d'approvisionnement en cybersécurité est intégrée dans la cybersécurité et la gestion des risques de l'entreprise, l'évaluation des risques et les processus d'amélioration"
    4_prefix: "GV.SC-04"
    4_label: "Les fournisseurs sont connus et priorisés par criticité"
    5_prefix: "GV.SC-05"
    5_label: "Les exigences pour traiter les risques de cybersécurité dans les chaînes d'approvisionnement sont établies, priorisées et intégrées dans les contrats et autres types d'accords avec les fournisseurs et autres tiers pertinents"
    6_prefix: "GV.SC-06"
    6_label: "La planification et la diligence raisonnable sont effectuées pour réduire les risques avant d'entrer dans des relations formelles avec des fournisseurs ou d'autres tiers"
    7_prefix: "GV.SC-07"
    7_label: "Les risques posés par un fournisseur, ses produits et services, et d'autres tiers sont compris, enregistrés, priorisés, évalués, traités et surveillés tout au long de la relation"
    8_prefix: "GV.SC-08"
    8_label: "Les fournisseurs et autres tiers pertinents sont inclus dans la planification, la réponse et la récupération des incidents"
    9_prefix: "GV.SC-09"
    9_label: "Les pratiques de sécurité de la chaîne d'approvisionnement sont intégrées dans les programmes de cybersécurité et de gestion des risques de l'entreprise, et leurs performances sont surveillées tout au long du cycle de vie du produit et du service technologique"
    10_prefix: "GV.SC-10"
    10_label: "Les plans de gestion des risques de la chaîne d'approvisionnement en cybersécurité incluent des dispositions pour les activités qui se produisent après la conclusion d'un partenariat ou d'un accord de service"
2:
  title: "Identifier"
  prefix: "(ID)"
  desc: "Les risques actuels de cybersécurité de l'organisation sont compris"
  1:
    title: "Gestion des Actifs"
    prefix: "ID.AM"
    desc: "Les actifs (par exemple, données, matériel, logiciels, systèmes, installations, services, personnes) qui permettent à l'organisation d'atteindre ses objectifs commerciaux sont identifiés et gérés en fonction de leur importance relative pour les objectifs organisationnels et la stratégie de risque de l'organisation"
    1_prefix: "ID.AM-01"
    1_label: "Les inventaires du matériel géré par l'organisation sont maintenus"
    2_prefix: "ID.AM-02"
    2_label: "Les inventaires des logiciels, services et systèmes gérés par l'organisation sont maintenus"
    3_prefix: "ID.AM-03"
    3_label: "Les représentations des communications réseau autorisées de l'organisation et des flux de données internes et externes sont maintenues"
    4_prefix: "ID.AM-04"
    4_label: "Les inventaires des services fournis par les fournisseurs sont maintenus"
    5_prefix: "ID.AM-05"
    5_label: "Les actifs sont priorisés en fonction de leur classification, criticité, ressources et impact sur la mission"
    6_prefix: "ID.AM-07"
    6_label: "Les inventaires des données et des métadonnées correspondantes pour les types de données désignés sont maintenus"
    7_prefix: "ID.AM-08"
    7_label: "Les systèmes, le matériel, les logiciels, les services et les données sont gérés tout au long de leur cycle de vie"
  2:
    title: "Évaluation des Risques"
    prefix: "ID.RA"
    desc: "Le risque de cybersécurité pour l'organisation, les actifs et les individus est compris par l'organisation"
    1_prefix: "ID.RA-01"
    1_label: "Les vulnérabilités des actifs sont identifiées, validées et enregistrées"
    2_prefix: "ID.RA-02"
    2_label: "Les renseignements sur les cybermenaces sont reçus des forums et sources de partage d'informations"
    3_prefix: "ID.RA-03"
    3_label: "Les menaces internes et externes à l'organisation sont identifiées et enregistrées"
    4_prefix: "ID.RA-04"
    4_label: "Les impacts potentiels et les probabilités des menaces exploitant les vulnérabilités sont identifiés et enregistrés"
    5_prefix: "ID.RA-05"
    5_label: "Les menaces, vulnérabilités, probabilités et impacts sont utilisés pour comprendre le risque inhérent et informer la priorisation de la réponse aux risques"
    6_prefix: "ID.RA-06"
    6_label: "Les réponses aux risques sont choisies, priorisées, planifiées, suivies et communiquées"
    7_prefix: "ID.RA-07"
    7_label: "Les changements et exceptions sont gérés, évalués pour leur impact sur le risque, enregistrés et suivis"
    8_prefix: "ID.RA-08"
    8_label: "Des processus pour recevoir, analyser et répondre aux divulgations de vulnérabilités sont établis"
    9_prefix: "ID.RA-09"
    9_label: "L'authenticité et l'intégrité du matériel et des logiciels sont évaluées avant l'acquisition et l'utilisation"
    10_prefix: "ID.RA-10"
    10_label: "Les fournisseurs critiques sont évalués avant l'acquisition"
  3:
    title: "Amélioration"
    prefix: "ID.IM"
    desc: "Les améliorations des processus, procédures et activités de gestion des risques de cybersécurité de l'organisation sont identifiées dans toutes les fonctions du CSF"
    1_prefix: "ID.IM-01"
    1_label: "Les améliorations sont identifiées à partir des évaluations"
    2_prefix: "ID.IM-02"
    2_label: "Les améliorations sont identifiées à partir des tests et exercices de sécurité, y compris ceux effectués en coordination avec les fournisseurs et les tiers pertinents"
    3_prefix: "ID.IM-03"
    3_label: "Les améliorations sont identifiées à partir de l'exécution des processus, procédures et activités opérationnels"
    4_prefix: "ID.IM-04"
    4_label: "Les plans de réponse aux incidents et autres plans de cybersécurité qui affectent les opérations sont établis, communiqués, maintenus et améliorés"
3:
  title: "Protéger"
  prefix: "(PR)"
  desc: "Des mesures de protection sont utilisées pour gérer les risques de cybersécurité de l'organisation"
  1:
    title: "Gestion des Identités, Authentification et Contrôle d'Accès"
    prefix: "PR.AA"
    desc: "L'accès aux actifs physiques et logiques est limité aux utilisateurs, services et matériels autorisés et géré en fonction du risque évalué d'accès non autorisé"
    1_prefix: "PR.AA-01"
    1_label: "Les identités et les informations d'identification des utilisateurs, services et matériels autorisés sont gérées par l'organisation"
    2_prefix: "PR.AA-02"
    2_label: "Les identités sont vérifiées et liées aux informations d'identification en fonction du contexte des interactions"
    3_prefix: "PR.AA-03"
    3_label: "Les utilisateurs, services et matériels sont authentifiés"
    4_prefix: "PR.AA-04"
    4_label: "Les assertions d'identité sont protégées, transmises et vérifiées"
    5_prefix: "PR.AA-05"
    5_label: "Les permissions d'accès, les droits et les autorisations sont définis dans une politique, gérés, appliqués et examinés, et intègrent les principes du moindre privilège et de la séparation des tâches"
    6_prefix: "PR.AA-06"
    6_label: "L'accès physique aux actifs est géré, surveillé et appliqué en fonction du risque"
  2:
    title: "Sensibilisation et Formation"
    prefix: "PR.AT"
    desc: "Le personnel de l'organisation reçoit une sensibilisation et une formation à la cybersécurité afin de pouvoir effectuer ses tâches liées à la cybersécurité"
    1_prefix: "PR.AT-01"
    1_label: "Le personnel reçoit une sensibilisation et une formation afin de posséder les connaissances et les compétences pour effectuer les tâches générales en tenant compte des risques de cybersécurité"
    2_prefix: "PR.AT-02"
    2_label: "Les personnes occupant des rôles spécialisés reçoivent une sensibilisation et une formation afin de posséder les connaissances et les compétences pour effectuer les tâches pertinentes en tenant compte des risques de cybersécurité"
  3:
    title: "Sécurité des Données"
    prefix: "PR.DS"
    desc: "Les données sont gérées conformément à la stratégie de risque de l'organisation pour protéger la confidentialité, l'intégrité et la disponibilité des informations"
    1_prefix: "PR.DS-01"
    1_label: "La confidentialité, l'intégrité et la disponibilité des données au repos sont protégées"
    2_prefix: "PR.DS-02"
    2_label: "La confidentialité, l'intégrité et la disponibilité des données en transit sont protégées"
    3_prefix: "PR.DS-10"
    3_label: "La confidentialité, l'intégrité et la disponibilité des données en cours d'utilisation sont protégées"
    4_prefix: "PR.DS-11"
    4_label: "Des sauvegardes de données sont créées, protégées, maintenues et testées"
  4:
    title: "Sécurité des Plateformes"
    prefix: "PR.PS"
    desc: "Le matériel, les logiciels (par exemple, micrologiciels, systèmes d'exploitation, applications) et les services des plateformes physiques et virtuelles sont gérés conformément à la stratégie de risque de l'organisation pour protéger leur confidentialité, intégrité et disponibilité"
    1_prefix: "PR.PS-01"
    1_label: "Des pratiques de gestion de la configuration sont établies et appliquées"
    2_prefix: "PR.PS-02"
    2_label: "Les logiciels sont maintenus, remplacés et supprimés en fonction du risque"
    3_prefix: "PR.PS-03"
    3_label: "Le matériel est maintenu, remplacé et supprimé en fonction du risque"
    4_prefix: "PR.PS-04"
    4_label: "Des journaux sont générés et mis à disposition pour une surveillance continue"
    5_prefix: "PR.PS-05"
    5_label: "L'installation et l'exécution de logiciels non autorisés sont empêchées"
    6_prefix: "PR.PS-06"
    6_label: "Des pratiques de développement logiciel sécurisé sont intégrées et leurs performances sont surveillées tout au long du cycle de vie du développement logiciel"
  5:
    title: "Résilience de l'Infrastructure Technologique"
    prefix: "PR.IR"
    desc: "Les architectures de sécurité sont gérées conformément à la stratégie de risque de l'organisation pour protéger la confidentialité, l'intégrité et la disponibilité des actifs, ainsi que la résilience organisationnelle"
    1_prefix: "PR.IR-01"
    1_label: "Les réseaux et les environnements sont protégés contre l'accès et l'utilisation logiques non autorisés"
    2_prefix: "PR.IR-02"
    2_label: "Les actifs technologiques de l'organisation sont protégés contre les menaces environnementales"
    3_prefix: "PR.IR-03"
    3_label: "Des mécanismes sont mis en place pour atteindre les exigences de résilience dans des situations normales et défavorables"
    4_prefix: "PR.IR-04"
    4_label: "Une capacité de ressources adéquate pour assurer la disponibilité est maintenue"
4:
  title: "Détecter"
  prefix: "(DE)"
  desc: "Les attaques et compromissions potentielles de cybersécurité sont trouvées et analysées"
  1:
    title: "Surveillance Continue"
    prefix: "DE.CM"
    desc: "Les actifs sont surveillés pour détecter les anomalies, les indicateurs de compromission et autres événements potentiellement néfastes"
    1_prefix: "DE.CM-01"
    1_label: "Les réseaux et services réseau sont surveillés pour détecter les événements potentiellement néfastes"
    2_prefix: "DE.CM-02"
    2_label: "L'environnement physique est surveillé pour détecter les événements potentiellement néfastes"
    3_prefix: "DE.CM-03"
    3_label: "L'activité du personnel et l'utilisation de la technologie sont surveillées pour détecter les événements potentiellement néfastes"
    4_prefix: "DE.CM-06"
    4_label: "Les activités et services des fournisseurs de services externes sont surveillés pour détecter les événements potentiellement néfastes"
    5_prefix: "DE.CM-09"
    5_label: "Le matériel et les logiciels informatiques, les environnements d'exécution et leurs données sont surveillés pour détecter les événements potentiellement néfastes"
  2:
    title: "Analyse des Événements Défavorables"
    prefix: "DE.AE"
    desc: "Les anomalies, les indicateurs de compromission et autres événements potentiellement néfastes sont analysés pour caractériser les événements et détecter les incidents de cybersécurité"
    1_prefix: "DE.AE-02"
    1_label: "Une base de référence des opérations réseau et des flux de données attendus pour les utilisateurs et les systèmes est établie et gérée"
    2_prefix: "DE.AE-03"
    2_label: "Les informations sont corrélées à partir de multiples sources"
    3_prefix: "DE.AE-04"
    3_label: "L'impact estimé et la portée des événements défavorables sont compris"
    4_prefix: "DE.AE-06"
    4_label: "Les informations sur les événements défavorables sont fournies au personnel et aux outils autorisés"
    5_prefix: "DE.AE-07"
    5_label: "Les renseignements sur les cybermenaces et autres informations contextuelles sont intégrés à l'analyse"
    6_prefix: "DE.AE-08"
    6_label: "Les incidents sont déclarés lorsque les événements défavorables répondent aux critères d'incident définis"
5:
  title: "Répondre"
  prefix: "(RS)"
  desc: "Des actions sont prises concernant un incident de cybersécurité détecté"
  1:
    title: "Gestion des Incidents"
    prefix: "RS.MA"
    desc: "Les réponses aux incidents de cybersécurité détectés sont gérées"
    1_prefix: "RS.MA-01"
    1_label: "Le plan de réponse aux incidents est exécuté en coordination avec les tiers concernés une fois qu'un incident est déclaré"
    2_prefix: "RS.MA-02"
    2_label: "Les rapports d'incidents sont triés et validés"
    3_prefix: "RS.MA-03"
    3_label: "Les incidents sont catégorisés et priorisés"
    4_prefix: "RS.MA-04"
    4_label: "Les incidents sont escaladés ou élevés selon les besoins"
    5_prefix: "RS.MA-05"
    5_label: "Les critères pour initier la récupération d'un incident sont appliqués"
  2:
    title: "Analyse des Incidents"
    prefix: "RS.AN"
    desc: "Des investigations sont menées pour assurer une réponse efficace et soutenir les activités de criminalistique et de récupération"
    1_prefix: "RS.AN-03"
    1_label: "Une analyse est effectuée pour établir ce qui s'est passé pendant un incident et la cause profonde de l'incident"
    2_prefix: "RS.AN-06"
    2_label: "Les actions effectuées pendant une investigation sont enregistrées, et l'intégrité et la provenance des enregistrements sont préservées"
    3_prefix: "RS.AN-07"
    3_label: "Les données et métadonnées de l'incident sont collectées, et leur intégrité et provenance sont préservées"
    4_prefix: "RS.AN-08"
    4_label: "L'ampleur d'un incident est estimée et validée"
  3:
    title: "Rapport et Communication de Réponse aux Incidents"
    prefix: "RS.CO"
    desc: "Les activités de réponse sont coordonnées avec les parties prenantes internes et externes conformément aux lois, réglementations ou politiques"
    1_prefix: "RS.CO-02"
    1_label: "Les parties prenantes internes et externes sont notifiées des incidents"
    2_prefix: "RS.CO-03"
    2_label: "Les informations sont partagées avec les parties prenantes internes et externes désignées"
  4:
    title: "Atténuation des Incidents"
    prefix: "RS.MI"
    desc: "Des activités sont effectuées pour prévenir l'expansion d'un événement et atténuer ses effets"
    1_prefix: "RS.MI-01"
    1_label: "Les incidents sont contenus"
    2_prefix: "RS.MI-02"
    2_label: "Les incidents sont éradiqués"
6:
  title: "Récupérer"
  prefix: "(RC)"
  desc: "Des activités sont maintenues pour restaurer les capacités ou les services qui ont été altérés en raison d'un incident de cybersécurité"
  1:
    title: "Exécution du Plan de Récupération d'Incident"
    prefix: "RC.RP"
    desc: "Des activités de restauration sont effectuées pour assurer la disponibilité opérationnelle des systèmes et services affectés par les incidents de cybersécurité"
    1_prefix: "RC.RP-01"
    1_label: "La partie récupération du plan de réponse aux incidents est exécutée une fois initiée à partir du processus de réponse aux incidents"
    2_prefix: "RC.RP-02"
    2_label: "Les actions de récupération sont sélectionnées, délimitées, priorisées et exécutées"
    3_prefix: "RC.RP-03"
    3_label: "L'intégrité des sauvegardes et autres actifs de restauration est vérifiée avant de les utiliser pour la restauration"
    4_prefix: "RC.RP-04"
    4_label: "Les fonctions critiques de la mission et la gestion des risques de cybersécurité sont prises en compte pour établir des normes opérationnelles post-incident"
    5_prefix: "RC.RP-05"
    5_label: "L'intégrité des actifs restaurés est vérifiée, les systèmes et services sont restaurés, et le statut de fonctionnement normal est confirmé"
    6_prefix: "RC.RP-06"
    6_label: "La fin de la récupération de l'incident est déclarée sur la base de critères, et la documentation liée à l'incident est complétée"
  2:
    title: "Communication sur la Récupération d'Incident"
    prefix: "RC.CO"
    desc: "Les activités de restauration sont coordonnées avec les parties internes et externes"
    1_prefix: "RC.CO-03"
    1_label: "Les activités de récupération et les progrès dans la restauration des capacités opérationnelles sont communiqués aux parties prenantes internes et externes désignées"
    2_prefix: "RC.CO-04"
    2_label: "Les mises à jour publiques sur la récupération de l'incident sont partagées en utilisant des méthodes et des messages approuvés"
