1:
  title: "Inventaire et contrôle des actifs de l'entreprise"
  desc: "Gérer activement (inventorier, suivre et corriger) tous les actifs de l'entreprise (appareils des utilisateurs finaux, y compris portables et mobiles ; appareils réseau ; appareils non informatiques/Internet des objets (IoT) ; et serveurs) connectés à l'infrastructure physiquement, virtuellement, à distance, et ceux dans les environnements cloud, afin de connaître avec précision l'ensemble des actifs qui doivent être surveillés et protégés au sein de l'entreprise. Cela permettra également d'identifier les actifs non autorisés et non gérés à supprimer ou à corriger."
  1_tags: "#Identifier#IG1#IG2#IG3"
  1_label: "Établir et tenir à jour un inventaire détaillé des actifs de l'entreprise"
  1_desc: "Établir et tenir à jour un inventaire précis, détaillé et actualisé de tous les actifs de l'entreprise susceptibles de stocker ou de traiter des données, à savoir : les appareils des utilisateurs finaux (y compris les appareils portables et mobiles), les appareils du réseau, les appareils non informatiques/IoT et les serveurs. L'inventaire doit indiquer l'adresse réseau (si elle est statique), l'adresse du matériel, le nom de la machine, le propriétaire de l'actif de l'entreprise, le service pour chaque actif et si l'actif a été autorisé à se connecter au réseau. Pour les appareils mobiles des utilisateurs finaux, des outils de type MDM peuvent soutenir ce processus, le cas échéant. Cet inventaire comprend les biens connectés à l'infrastructure physiquement, virtuellement, à distance et ceux qui se trouvent dans des environnements en nuage. En outre, il inclut les actifs qui sont régulièrement connectés à l'infrastructure du réseau de l'entreprise, même s'ils ne sont pas sous le contrôle de l'entreprise. Examiner et mettre à jour l'inventaire de tous les actifs de l'entreprise deux fois par an, ou plus fréquemment."
  2_tags: "#Répondre#IG1#IG2#IG3"
  2_label: "Lutte contre les actifs non autorisés"
  2_desc: "S'assurer qu'il existe un processus permettant de traiter les biens non autorisés sur une base hebdomadaire. L'entreprise peut choisir de retirer l'actif du réseau, d'empêcher l'actif de se connecter à distance au réseau ou de le mettre en quarantaine."
  3_tags: "#Détecter#IG2#IG3"
  3_label: "Utiliser un outil de découverte active"
  3_desc: "Utiliser un outil de découverte active pour identifier les actifs connectés au réseau de l'entreprise. Configurer l'outil de découverte active pour qu'il s'exécute quotidiennement ou plus fréquemment."
  4_tags: "#Identifier#IG2#IG3"
  4_label: "Utiliser le protocole de configuration dynamique de l'hôte (DHCP) pour mettre à jour l'inventaire des actifs de l'entreprise"
  4_desc: "Utiliser la journalisation DHCP sur tous les serveurs DHCP ou les outils de gestion des adresses IP (Internet Protocol) pour mettre à jour l'inventaire des actifs de l'entreprise. Examiner et utiliser les journaux pour mettre à jour l'inventaire des actifs de l'entreprise chaque semaine, ou plus fréquemment."
  5_tags: "#Détecter#IG3"
  5_label: "Utiliser un outil de découverte d'actifs passifs"
  5_desc: "Utiliser un outil de découverte passive pour identifier les actifs connectés au réseau de l'entreprise. Examiner et utiliser les analyses pour mettre à jour l'inventaire des actifs de l'entreprise au moins une fois par semaine, voire plus fréquemment."
2:
  title: "Inventaire et contrôle des actifs logiciels"
  desc: "Gérer activement (inventorier, suivre et corriger) tous les logiciels (systèmes d'exploitation et applications) sur le réseau afin que seuls les logiciels autorisés soient installés et puissent s'exécuter, et que les logiciels non autorisés et non gérés soient détectés et empêchés d'être installés ou exécutés."
  1_tags: "#Identifier#IG1#IG2#IG3"
  1_label: "Établir et maintenir un inventaire des logiciels"
  1_desc: "Établir et tenir à jour un inventaire détaillé de tous les logiciels sous licence installés sur les biens de l'entreprise. L'inventaire des logiciels doit indiquer le titre, l'éditeur, la date d'installation/d'utilisation initiale et l'objectif commercial de chaque entrée ; le cas échéant, il doit inclure l'URL (Uniform Resource Locator), le(s) magasin(s) d'applications, la(les) version(s), le mécanisme de déploiement et la date de mise hors service. Examiner et mettre à jour l'inventaire des logiciels deux fois par an, ou plus fréquemment."
  2_tags: "#Identifier#IG1#IG2#IG3"
  2_label: "S'assurer que les logiciels autorisés sont actuellement pris en charge "
  2_desc: "Veiller à ce que seuls les logiciels actuellement pris en charge soient désignés comme autorisés dans l'inventaire des logiciels pour les actifs de l'entreprise. Si un logiciel n'est pas pris en charge, mais qu'il est nécessaire à l'accomplissement de la mission de l'entreprise, documenter une exception détaillant les contrôles d'atténuation et l'acceptation du risque résiduel. Pour tout logiciel non pris en charge et ne faisant pas l'objet d'une documentation d'exception, le désigner comme non autorisé. Examiner la liste des logiciels pour vérifier leur prise en charge au moins une fois par mois, ou plus fréquemment."
  3_tags: "#Répondre#IG1#IG2#IG3"
  3_label: "Lutter contre les logiciels non autorisés"
  3_desc: "Veiller à ce que les logiciels non autorisés soient retirés des actifs de l'entreprise ou fassent l'objet d'une exception documentée. Révision mensuelle ou plus fréquente."
  4_tags: "#Détecter#IG2#IG3"
  4_label: "Utiliser des outils automatisés d'inventaire des logiciels"
  4_desc: "Utiliser, si possible, des outils d'inventaire des logiciels dans toute l'entreprise pour automatiser la découverte et la documentation des logiciels installés."
  5_tags: "#Protéger#IG2#IG3"
  5_label: "Logiciels autorisés par Liste d'autorisations"
  5_desc: "Utiliser des contrôles techniques, tels que des listes d'autorisation d'applications, pour s'assurer que seuls les logiciels autorisés peuvent s'exécuter ou être consultés. Réévaluer deux fois par an, ou plus fréquemment."
  6_tags: "#Protéger#IG2#IG3"
  6_label: "Liste des bibliothèques autorisées par Liste d'autorisations"
  6_desc: "Utiliser des contrôles techniques pour s'assurer que seules les bibliothèques logicielles autorisées, telles que les fichiers .dll, .ocx et .so, sont autorisées à être chargées dans un processus système. Empêcher les bibliothèques non autorisées de se charger dans un processus système. Réévaluer deux fois par an ou plus fréquemment."
  7_tags: "#Protéger#IG3"
  7_label: "Liste des scripts autorisés par Liste d'autorisations"
  7_desc: "Utilisez des contrôles techniques, tels que les signatures numériques et le contrôle des versions, pour vous assurer que seuls les scripts autorisés, tels que les fichiers .ps1 et .py spécifiques, sont autorisés à s'exécuter. Empêcher les scripts non autorisés de s'exécuter. Réévaluer deux fois par an ou plus fréquemment."
3:
  title: "Protection des données"
  desc: "Développer des processus et des contrôles techniques pour identifier, classer, traiter, conserver et éliminer les données en toute sécurité."
  1_tags: "#Gouverner#IG1#IG2#IG3"
  1_label: "Établir et maintenir un processus de gestion des données"
  1_desc: "Établir et maintenir un processus documenté de gestion des données. Dans le cadre de ce processus, la sensibilité des données, le propriétaire des données, le traitement des données, les limites de conservation des données et les exigences en matière d'élimination doivent être pris en compte, sur la base des normes de sensibilité et de conservation en vigueur dans l'entreprise. Réviser et mettre à jour la documentation chaque année, ou lorsque des changements importants interviennent dans l'entreprise et pourraient avoir une incidence sur cette mesure de sauvegarde."
  2_tags: "#Identifier#IG1#IG2#IG3"
  2_label: "Établir et maintenir un inventaire des données"
  2_desc: "Établir et tenir à jour un inventaire des données basé sur le processus de gestion des données de l'entreprise. Inventorier les données sensibles au moins une fois par an. Réviser et mettre à jour l'inventaire au moins une fois par an, en accordant la priorité aux données sensibles."
  3_tags: "#Protéger#IG1#IG2#IG3"
  3_label: "Configuration des listes de contrôle d'accès aux données"
  3_desc: "Configurer les listes de contrôle d'accès aux données en fonction du besoin d'en connaître de l'utilisateur. Appliquer des listes de contrôle d'accès aux données, également connues sous le nom d'autorisations d'accès, aux systèmes de fichiers locaux et distants, aux bases de données et aux applications."
  4_tags: "#Protéger#IG1#IG2#IG3"
  4_label: "Appliquer la conservation des données"
  4_desc: "Conserver les données conformément au processus documenté de gestion des données de l'entreprise. La conservation des données doit comprendre des délais minimums et maximums."
  5_tags: "#Protéger#IG1#IG2#IG3"
  5_label: "Éliminer les données en toute sécurité"
  5_desc: "Éliminer les données en toute sécurité, conformément au processus documenté de gestion des données de l'entreprise. Veiller à ce que le processus et la méthode d'élimination soient proportionnels à la sensibilité des données."
  6_tags: "#Protéger#IG1#IG2#IG3"
  6_label: "Chiffrer les données sur les appareils des utilisateurs finaux"
  6_desc: "Chiffrer les données sur les appareils des utilisateurs finaux contenant des données sensibles. Les exemples de mise en œuvre sont les suivants : Windows BitLocker®, Apple FileVault Windows BitLocker®, Apple FileVault®, Linux® dm-crypt."
  7_tags: "#Identifier#IG2#IG3"
  7_label: "Établir et maintenir un schéma de classification des données."
  7_desc: "Établir et maintenir un système global de classification des données pour l'entreprise. Les entreprises peuvent utiliser des étiquettes, telles que « sensible », « confidentiel » et « public », et classer leurs données en fonction de ces étiquettes. Réviser et mettre à jour le système de classification chaque année, ou lorsque des changements importants interviennent dans l'entreprise et pourraient avoir une incidence sur cette mesure de sauvegarde."
  8_tags: "#Identifier#IG2#IG3"
  8_label: "Flux de données des documents"
  8_desc: "Documenter les flux de données. La documentation des flux de données comprend les flux de données des fournisseurs de services et doit être basée sur le processus de gestion des données de l'entreprise. La documentation doit être revue et mise à jour chaque année, ou lorsque des changements importants au sein de l'entreprise sont susceptibles d'avoir une incidence sur cette mesure de sauvegarde."
  9_tags: "#Protéger#IG2#IG3"
  9_label: "Chiffrer des données sur des supports amovibles"
  9_desc: "Chiffrer les données sur les supports amovibles."
  10_tags: "#Protéger#IG2#IG3"
  10_label: "Chiffrer les données sensibles en transit"
  10_desc: "Chiffrer les données sensibles en transit. Les exemples de mise en œuvre sont les suivants : Transport Layer Security (TLS) et Open Secure Shell (OpenSSH)."
  11_tags: "#Protéger#IG2#IG3"
  11_label: "Chiffrer les données sensibles au repos"
  11_desc: "Chiffrer les données sensibles au repos sur les serveurs, les applications et les bases de données. Le cryptage de la couche de stockage, également connu sous le nom de cryptage côté serveur, répond à l'exigence minimale de cette mesure de sauvegarde. D'autres méthodes de cryptage peuvent inclure le cryptage de la couche application, également connu sous le nom de cryptage côté client, lorsque l'accès au(x) dispositif(s) de stockage des données ne permet pas d'accéder aux données en texte clair."
  12_tags: "#Protéger#IG2#IG3"
  12_label: "Segmenter le traitement et le stockage des données en fonction de leur sensibilité"
  12_desc: "Segmenter le traitement et le stockage des données en fonction de leur sensibilité. Ne traitez pas de données sensibles sur des actifs de l'entreprise destinés à des données moins sensibles."
  13_tags: "#Protéger#IG3"
  13_label: "Déployer une solution de prévention de la perte de données - Data Loss Prevention Solution (DLP)"
  13_desc: "Mettre en œuvre un outil automatisé, tel qu'un outil de prévention des pertes de données (DLP) basé sur l'hôte, afin d'identifier toutes les données sensibles stockées, traitées ou transmises par les actifs de l'entreprise, y compris ceux situés sur le site ou chez un fournisseur de services distant, et mettre à jour l'inventaire des données de l'entreprise."
  14_tags: "#Détecter#IG3"
  14_label: "Logs : Enregistrer l'accès aux données sensibles"
  14_desc: "Enregistrer l'accès aux données sensibles, y compris leur modification et leur élimination."
4:
  title: "Configuration sécurisée des actifs et des logiciels de l'entreprise"
  desc: "Établir et maintenir la configuration sécurisée des actifs de l'entreprise (dispositifs de l'utilisateur final, y compris portables et mobiles ; dispositifs de réseau ; dispositifs non informatiques/IoT ; et serveurs) et des logiciels (systèmes d'exploitation et applications)."
  1_tags: "#Gouverner#IG1#IG2#IG3"
  1_label: "Établir et maintenir un processus de configuration sécurisé"
  1_desc: "Établir et maintenir un processus de configuration sécurisée documenté pour les actifs de l'entreprise (dispositifs de l'utilisateur final, y compris portables et mobiles, dispositifs non informatiques/IoT, et serveurs) et les logiciels (systèmes d'exploitation et applications). Examiner et mettre à jour la documentation chaque année, ou lorsque des changements importants au sein de l'entreprise se produisent et pourraient avoir un impact sur cette mesure de sauvegarde."
  2_tags: "#Gouverner#IG1#IG2#IG3"
  2_label: "Établir et maintenir un processus de configuration sécurisé pour l'infrastructure du réseau"
  2_desc: "Établir et maintenir un processus de configuration sécurisé et documenté pour les dispositifs du réseau. Examiner et mettre à jour la documentation chaque année, ou lorsque des changements importants interviennent dans l'entreprise et pourraient avoir une incidence sur cette mesure de sauvegarde."
  3_tags: "#Protéger#IG1#IG2#IG3"
  3_label: "Configurer le verrouillage automatique des sessions sur les biens d'entreprise"
  3_desc: "Configurer le verrouillage automatique des sessions sur les ressources de l'entreprise après une période d'inactivité définie. Pour les systèmes d'exploitation généraux, la période ne doit pas dépasser 15 minutes. Pour les appareils mobiles des utilisateurs finaux, la période ne doit pas dépasser deux (2) minutes."
  4_tags: "#Protéger#IG1#IG2#IG3"
  4_label: "Mettre en œuvre et gérer un pare-feu sur les serveurs"
  4_desc: "Mettre en œuvre et gérer un pare-feu sur les serveurs, le cas échéant. Les exemples d'implémentation incluent un pare-feu virtuel, un pare-feu de système d'exploitation ou un agent de pare-feu tiers."
  5_tags: "#Protéger#IG1#IG2#IG3"
  5_label: "Mise en œuvre et gestion d'un pare-feu sur les appareils des utilisateurs finaux"
  5_desc: "Mettre en œuvre et gérer un pare-feu basé sur l'hôte ou un outil de filtrage des ports sur les appareils des utilisateurs finaux, avec une règle de refus par défaut qui bloque tout le trafic à l'exception des services et des ports explicitement autorisés."
  6_tags: "#Protéger#IG1#IG2#IG3"
  6_label: "Gérer en toute sécurité les actifs et les logiciels de l'entreprise"
  6_desc: "Gérer en toute sécurité les actifs et les logiciels de l'entreprise. Les exemples de mise en œuvre comprennent la gestion de la configuration par le biais d'une infrastructure en tant que code (IaC) contrôlée par version et l'accès aux interfaces administratives par le biais de protocoles réseau sécurisés, tels que Secure Shell (SSH) et Hypertext Transfer Protocol Secure (HTTPS). N'utilisez pas de protocoles de gestion non sécurisés, tels que Telnet (Teletype Network) et HTTP, à moins qu'ils ne soient essentiels du point de vue opérationnel."
  7_tags: "#Protéger#IG1#IG2#IG3"
  7_label: "Gérer les comptes par défaut des biens et logiciels de l'entreprise"
  7_desc: "Gérer les comptes par défaut sur les biens et les logiciels de l'entreprise, tels que les comptes « root », « administrateur » et autres comptes fournisseurs préconfigurés. Exemples de mise en œuvre : désactiver les comptes par défaut ou les rendre inutilisables."
  8_tags: "#Protéger#IG2#IG3"
  8_label: "Désinstaller ou désactiver les services inutiles sur les biens et les logiciels de l'entreprise"
  8_desc: "Désinstaller ou désactiver les services inutiles sur les actifs et les logiciels de l'entreprise, tels qu'un service de partage de fichiers, un module d'application web ou une fonction de service inutilisés."
  9_tags: "#Protéger#IG2#IG3"
  9_label: "Configurer des serveurs DNS de confiance sur les biens de l'entreprise"
  9_desc: "Configurer des serveurs DNS de confiance sur l'infrastructure du réseau. Les exemples de mise en œuvre comprennent la configuration des dispositifs de réseau pour utiliser des serveurs DNS contrôlés par l'entreprise et/ou des serveurs DNS réputés accessibles de l'extérieur."
  10_tags: "#Protéger#IG2#IG3"
  10_label: "Appliquer le verrouillage automatique des appareils portables des utilisateurs finaux"
  10_desc: "Appliquer le verrouillage automatique des appareils après un seuil prédéterminé de tentatives d'authentification locales infructueuses sur les appareils portables de l'utilisateur final, lorsque cela est possible. Pour les ordinateurs portables, ne pas autoriser plus de 20 tentatives d'authentification infructueuses ; pour les tablettes et les smartphones, pas plus de 10 tentatives d'authentification infructueuses. Parmi les exemples de mise en œuvre, citons Microsoft® InTune Matériel / Appareil Lock et Apple® Configuration Profile maxFailedAttempts."
  11_tags: "#Protéger#IG2#IG3"
  11_label: "Renforcer la capacité d'effacement à distance sur les appareils portables des utilisateurs finaux"
  11_desc: "Effacer à distance les données de l'entreprise des appareils portables des utilisateurs finaux appartenant à l'entreprise lorsque cela est jugé nécessaire, par exemple en cas de perte ou de vol d'un appareil, ou lorsqu'une personne ne fait plus partie de l'entreprise."
  12_tags: "#Protéger#IG3"
  12_label: "Séparer les espaces de travail de l'entreprise sur les appareils mobiles des utilisateurs finaux"
  12_desc: "Veiller à ce que des espaces de travail d'entreprise distincts soient utilisés sur les appareils mobiles des utilisateurs finaux, lorsqu'ils sont pris en charge. Les exemples de mise en œuvre comprennent l'utilisation d'un profil de configuration Apple® ou d'un profil de travail Android™ pour séparer les applications et les données de l'entreprise des applications et des données personnelles."
5:
  title: "Gestion des comptes"
  desc: "Utiliser des processus et des outils pour attribuer et gérer les autorisations des comptes d'utilisateurs, y compris les comptes d'administrateurs, ainsi que les comptes de service, pour les biens et les logiciels de l'entreprise."
  1_tags: "#Identifier#IG1#IG2#IG3"
  1_label: "Établir et tenir à jour un inventaire des comptes"
  1_desc: "Établir et tenir à jour un inventaire de tous les comptes gérés dans l'entreprise. L'inventaire doit au minimum inclure les comptes utilisateurs, les comptes administrateurs et les comptes de service. L'inventaire doit au moins contenir le nom de la personne, son nom d'utilisateur, les dates de début et de fin et le service. Valider que tous les comptes actifs sont autorisés, selon un calendrier récurrent au minimum trimestriel, ou plus fréquemment."
  2_tags: "#Protéger#IG1#IG2#IG3"
  2_label: "Utiliser des mots de passe uniques"
  2_desc: "Utiliser des mots de passe uniques pour tous les actifs de l'entreprise. Les meilleures pratiques comprennent, au minimum, un mot de passe de 8 caractères pour les comptes utilisant l'authentification multifactorielle (MFA) et un mot de passe de 14 caractères pour les comptes n'utilisant pas l'authentification multifactorielle. "
  3_tags: "#Protéger#IG1#IG2#IG3"
  3_label: "Désactiver les comptes dormants"
  3_desc: "Supprimer ou désactiver tout compte dormant après une période d'inactivité de 45 jours, lorsque cela est possible."
  4_tags: "#Protéger#IG1#IG2#IG3"
  4_label: "Limiter les privilèges de l'administrateur à des comptes administrateurs dédiés"
  4_desc: "Restreindre les privilèges d'administrateur aux comptes d'administrateur dédiés aux actifs de l'entreprise. Effectuer les activités informatiques générales, telles que la navigation sur Internet, le courrier électronique et l'utilisation de la suite de productivité, à partir du compte principal non privilégié de l'utilisateur."
  5_tags: "#Identifier#IG2#IG3"
  5_label: "Établir et tenir à jour un inventaire des comptes de service"
  5_desc: "Établir et tenir à jour un inventaire des comptes de service. L'inventaire doit au moins contenir le nom du propriétaire du service, la date de révision et l'objectif. Examiner les comptes de service afin de s'assurer que tous les comptes actifs sont autorisés, selon un calendrier récurrent, au moins trimestriel, ou plus fréquemment."
  6_tags: "#Gouverner#IG2#IG3"
  6_label: "Centraliser la gestion des comptes"
  6_desc: "Centraliser la gestion des comptes par le biais d'un annuaire ou d'un service d'identité."
6:
  title: "Gestion du contrôle d'accès"
  desc: "Utiliser des processus et des outils pour créer, attribuer, gérer et révoquer les références d'accès et les privilèges des comptes d'utilisateurs, d'administrateurs et de services pour les biens et les logiciels de l'entreprise."
  1_tags: "#Gouverner#IG1#IG2#IG3"
  1_label: "Mise en place d'une procédure d'octroi d'accès (Access Granting Process)"
  1_desc: "Établir et suivre une procédure documentée, de préférence automatisée, pour accorder l'accès aux actifs de l'entreprise lors de l'embauche ou du changement de rôle d'un utilisateur."
  2_tags: "#Gouverner#IG1#IG2#IG3"
  2_label: "Mise en place d'une procédure de révocation de l'accès"
  2_desc: "Établir et suivre une procédure, de préférence automatisée, pour révoquer l'accès aux actifs de l'entreprise, en désactivant les comptes immédiatement en cas de résiliation, de révocation des droits ou de changement de rôle d'un utilisateur. La désactivation des comptes, plutôt que leur suppression, peut s'avérer nécessaire pour préserver les pistes d'audit."
  3_tags: "#Protéger#IG1#IG2#IG3"
  3_label: "Exiger l'Authentification Multi-Facteurs (MFA) pour les applications exposées à l'extérieur"
  3_desc: "Exiger que toutes les applications de l'entreprise ou de tiers exposées à l'extérieur appliquent la MFA, lorsqu'elle est prise en charge. L'application de la MFA par l'intermédiaire d'un service d'annuaire ou d'un fournisseur de SSO constitue une mise en œuvre satisfaisante de cette mesure de sauvegarde."
  4_tags: "#Protéger#IG1#IG2#IG3"
  4_label: "Exiger la MFA pour l'accès au réseau à distance"
  4_desc: "Exiger la MFA pour l'accès au réseau à distance."
  5_tags: "#Protéger#IG1#IG2#IG3"
  5_label: "Exiger la MFA pour l'accès administratif"
  5_desc: "Exiger la MFA pour tous les comptes d'accès administratifs, lorsqu'ils sont pris en charge, sur tous les biens de l'entreprise, qu'ils soient gérés sur place ou par l'intermédiaire d'un prestataire de services."
  6_tags: "#Identifier#IG2#IG3"
  6_label: "Établir et tenir à jour un inventaire des systèmes d'authentification et d'autorisation"
  6_desc: "Établir et tenir à jour un inventaire des systèmes d'authentification et d'autorisation de l'entreprise, y compris ceux qui sont hébergés sur place ou chez un prestataire de services distant. Examiner et mettre à jour l'inventaire au moins une fois par an, ou plus fréquemment."
  7_tags: "#Protéger#IG2#IG3"
  7_label: "Centraliser le contrôle d'accès"
  7_desc: "Centraliser le contrôle d'accès pour tous les actifs de l'entreprise par le biais d'un service d'annuaire ou d'un fournisseur SSO, le cas échéant."
  8_tags: "#Gouverner#IG3"
  8_label: "Définir et gérer le contrôle d'accès basé sur les rôles (RBAC - Role-Based Access Control)"
  8_desc: "Définir et maintenir un contrôle d'accès basé sur les rôles (RBAC), en déterminant et en documentant les droits d'accès nécessaires pour que chaque rôle au sein de l'entreprise puisse mener à bien les tâches qui lui sont assignées. Procéder à des examens du contrôle d'accès aux actifs de l'entreprise afin de valider que tous les privilèges sont autorisés, selon un calendrier récurrent, au moins une fois par an, ou plus fréquemment."
7:
  title: "Gestion continue de la vulnérabilité"
  desc: "Élaborer un plan pour évaluer et suivre en permanence les vulnérabilités de tous les actifs de l'entreprise au sein de son infrastructure, afin d'y remédier et de réduire au minimum la fenêtre d'opportunité pour les attaquants. Surveiller les sources industrielles publiques et privées pour obtenir de nouvelles informations sur les menaces et les vulnérabilités."
  1_tags: "#Gouverner#IG1#IG2#IG3"
  1_label: "Établir et maintenir un processus de gestion des vulnérabilités"
  1_desc: "Établir et maintenir un processus documenté de gestion des vulnérabilités pour les actifs de l'entreprise. Réviser et mettre à jour la documentation chaque année, ou lorsque des changements importants interviennent dans l'entreprise et pourraient avoir une incidence sur cette mesure de sauvegarde."
  2_tags: "#Gouverner#IG1#IG2#IG3"
  2_label: "Établir et maintenir un processus de remédiation"
  2_desc: "Établir et maintenir une stratégie de remédiation basée sur les risques, documentée dans un processus de remédiation, avec des révisions mensuelles ou plus fréquentes."
  3_tags: "#Protéger#IG1#IG2#IG3"
  3_label: "Gestion automatisée des correctifs des systèmes d'exploitation"
  3_desc: "Effectuer des mises à jour des systèmes d'exploitation sur les actifs de l'entreprise par le biais d'une gestion automatisée des correctifs sur une base mensuelle ou plus fréquente."
  4_tags: "#Protéger#IG1#IG2#IG3"
  4_label: "Gestion automatisée des correctifs pour les applications"
  4_desc: "Effectuer des mises à jour d'applications sur les actifs de l'entreprise par le biais d'une gestion automatisée des correctifs sur une base mensuelle ou plus fréquente."
  5_tags: "#Identifier#IG2#IG3"
  5_label: "Effectuer des analyses automatisées de la vulnérabilité des actifs internes de l'entreprise"
  5_desc: "Effectuer des analyses automatisées des vulnérabilités des actifs internes de l'entreprise sur une base trimestrielle ou plus fréquente. Effectuer des analyses authentifiées et non authentifiées."
  6_tags: "#Identifier#IG2#IG3"
  6_label: "Effectuer des analyses automatisées des vulnérabilités des actifs de l'entreprise exposés à l'extérieur."
  6_desc: "Effectuer des analyses automatisées des vulnérabilités des actifs de l'entreprise exposés à l'extérieur. Effectuer des analyses sur une base mensuelle ou plus fréquente."
  7_tags: "#Répondre#IG2#IG3"
  7_label: "Remédier aux vulnérabilités détectées"
  7_desc: "Remédier aux vulnérabilités détectées dans les logiciels au moyen de processus et d'outils sur une base mensuelle ou plus fréquente, en fonction du processus de remédiation."
8:
  title: "Gestion du journal d'audit"
  desc: "Collecter, alerter, examiner et conserver les journaux d'audit des événements susceptibles de contribuer à la détection, à la compréhension ou au rétablissement d'une attaque."
  1_tags: "#Gouverner#IG1#IG2#IG3"
  1_label: "Établir et maintenir un processus de gestion des journaux d'audit"
  1_desc: "Établir et maintenir un processus documenté de gestion des journaux d'audit qui définit les exigences de l'entreprise en matière de journalisation. Il s'agit au minimum de la collecte, de l'examen et de la conservation des journaux d'audit pour les actifs de l'entreprise. Examiner et mettre à jour la documentation chaque année ou lorsque des changements importants interviennent au sein de l'entreprise et sont susceptibles d'avoir une incidence sur cette mesure de sauvegarde."
  2_tags: "#Détecter#IG1#IG2#IG3"
  2_label: "Collecter les journaux d'audit"
  2_desc: "Collecter les journaux d'audit. S'assurer que la journalisation, conformément au processus de gestion des journaux d'audit de l'entreprise, a été activée pour tous les actifs de l'entreprise."
  3_tags: "#Protéger#IG1#IG2#IG3"
  3_label: "Assurer un stockage adéquat des journaux d'audit"
  3_desc: "Veiller à ce que les destinations de journalisation disposent d'un espace de stockage suffisant pour se conformer au processus de gestion des journaux d'audit de l'entreprise."
  4_tags: "#Protéger#IG2#IG3"
  4_label: "Normaliser la synchronisation du temps"
  4_desc: "Normaliser la synchronisation de l'heure. Configurez au moins deux sources de temps synchronisées pour les actifs de l'entreprise, si cela est possible."
  5_tags: "#Détecter#IG2#IG3"
  5_label: "Collecte de journaux d'audit détaillés"
  5_desc: "Configurez une journalisation d'audit détaillée pour les actifs de l'entreprise contenant des données sensibles. Incluez la source de l'événement, la date, le nom d'utilisateur, l'horodatage, les adresses de source et de destination, ainsi que d'autres éléments utiles pouvant contribuer à une enquête médico-légale."
  6_tags: "#Détecter#IG2#IG3"
  6_label: "Collecte des journaux d'audit des requêtes DNS"
  6_desc: "Collecter les journaux d'audit des requêtes DNS sur les actifs de l'entreprise, lorsque cela est approprié et pris en charge."
  7_tags: "#Détecter#IG2#IG3"
  7_label: "Collecte des journaux d'audit des demandes d'URL"
  7_desc: "Collecter les journaux d'audit des actifs de l'entreprise à la demande de l'URL, le cas échéant et lorsque cela est possible."
  8_tags: "#Détecter#IG2#IG3"
  8_label: "Collecte des journaux d'audit de la ligne de commande"
  8_desc: "Collecter les journaux d'audit de la ligne de commande. Les exemples de mise en œuvre comprennent la collecte de journaux d'audit à partir de PowerShell®, BASH™ et de terminaux d'administration distants."
  9_tags: "#Détecter#IG2#IG3"
  9_label: "Centraliser les journaux d'audit"
  9_desc: "Centraliser, dans la mesure du possible, la collecte et la conservation des journaux d'audit pour l'ensemble des actifs de l'entreprise, conformément au processus documenté de gestion des journaux d'audit. Les exemples de mise en œuvre comprennent l'utilisation d'un outil SIEM pour centraliser plusieurs sources de journaux."
  10_tags: "#Protéger#IG2#IG3"
  10_label: "Conserver les journaux d'audit"
  10_desc: "Conserver les journaux d'audit des actifs de l'entreprise pendant au moins 90 jours."
  11_tags: "#Détecter#IG2#IG3"
  11_label: "Examiner les journaux d'audit"
  11_desc: "Examiner les journaux d'audit pour détecter les anomalies ou les événements anormaux qui pourraient indiquer une menace potentielle. Effectuer des contrôles hebdomadaires ou plus fréquents."
  12_tags: "#Détecter#IG3"
  12_label: "Collecter les journaux des fournisseurs de services"
  12_desc: "Collecter les journaux du fournisseur de services, le cas échéant. Les exemples de mise en œuvre comprennent la collecte des événements d'authentification et d'autorisation, des événements de création et d'élimination des données, et des événements de gestion des utilisateurs."
9:
  title: "Protection des courriels et des navigateurs web"
  desc: "Améliorer la protection et la détection des menaces provenant du courrier électronique et des vecteurs web, car ce sont des occasions pour les attaquants de manipuler le comportement humain par le biais d'un engagement direct."
  1_tags: "#Protéger#IG1#IG2#IG3"
  1_label: "Veiller à n'utiliser que des navigateurs et des clients de messagerie entièrement pris en charge"
  1_desc: "Veiller à ce que seuls les navigateurs et les clients de messagerie entièrement pris en charge soient autorisés à s'exécuter dans l'entreprise, en utilisant uniquement la dernière version des navigateurs et des clients de messagerie fournie par le fournisseur."
  2_tags: "#Protéger#IG1#IG2#IG3"
  2_label: "Utiliser les services de filtrage DNS"
  2_desc: "Utiliser des services de filtrage DNS sur tous les appareils des utilisateurs finaux, y compris les équipements distants et sur site, pour bloquer l'accès aux domaines malveillants connus."
  3_tags: "#Protéger#IG2#IG3"
  3_label: "Maintenir et appliquer des filtres d'URL basés sur le réseau"
  3_desc: "Appliquer et mettre à jour les filtres URL basés sur le réseau afin d'empêcher un bien de l'entreprise de se connecter à des sites web potentiellement malveillants ou non approuvés. Les exemples de mise en œuvre comprennent le filtrage par catégorie, le filtrage basé sur la réputation ou l'utilisation de listes de blocage. Appliquer les filtres à tous les actifs de l'entreprise."
  4_tags: "#Protéger#IG2#IG3"
  4_label: "Restreindre les extensions inutiles ou non autorisées du navigateur et du client de messagerie"
  4_desc: "Restreindre, en les désinstallant ou en les désactivant, tous les plugins, extensions et applications complémentaires non autorisés ou inutiles du navigateur ou du client de messagerie."
  5_tags: "#Protéger#IG2#IG3"
  5_label: "Mise en œuvre de DMARC"
  5_desc: "Pour réduire les risques d'usurpation ou de modification de courriels provenant de domaines valides, mettez en œuvre la politique et la vérification DMARC, en commençant par appliquer les normes SPF (Sender Policy Framework) et DKIM (DomainKeys Identified Mail)."
  6_tags: "#Protéger#IG2#IG3"
  6_label: "Bloquer les types de fichiers inutiles"
  6_desc: "Bloquer les types de fichiers inutiles qui tentent d'entrer dans la passerelle de messagerie de l'entreprise."
  7_tags: "#Protéger#IG3"
  7_label: "Déployer et maintenir les protections anti-programmes malveillants des serveurs de messagerie (Anti-Malware)"
  7_desc: "Déployer et maintenir les protections anti-malware du serveur de messagerie, telles que l'analyse des pièces jointes et/ou le sandboxing."
10:
  title: "Défenses contre les logiciels malveillants"
  desc: "Empêcher ou contrôler l'installation, la diffusion et l'exécution d'applications, de codes ou de scripts malveillants sur les actifs de l'entreprise."
  1_tags: "#Détecter#IG1#IG2#IG3"
  1_label: "Déployer et maintenir un logiciel anti-malware"
  1_desc: "Déployer et maintenir un logiciel anti-malware sur tous les actifs de l'entreprise."
  2_tags: "#Protéger#IG1#IG2#IG3"
  2_label: "Configurer les mises à jour automatiques des signatures Anti-Malware"
  2_desc: "Configurer des mises à jour automatiques pour les fichiers de signatures anti-malware sur tous les actifs de l'entreprise."
  3_tags: "#Protéger#IG1#IG2#IG3"
  3_label: "Désactiver l'exécution automatique et la lecture automatique pour les supports amovibles"
  3_desc: "Désactiver les fonctions d'exécution automatique autorun et autoplay pour les supports amovibles."
  4_tags: "#Détecter#IG2#IG3"
  4_label: "Configurer l'analyse automatique des supports amovibles par un logiciel anti-malware"
  4_desc: "Configurer le logiciel anti-malware pour qu'il analyse automatiquement les supports amovibles."
  5_tags: "#Protéger#IG2#IG3"
  5_label: "Activer les fonctionnalités anti-exploitation"
  5_desc: "Activer les fonctions anti-exploitation sur les actifs et les logiciels de l'entreprise, dans la mesure du possible, telles que Microsoft® Data Execution Prevention (DEP), Windows® Defender Exploit Guard (WDEG), ou Apple® System Integrity Protégerion (SIP) et Gatekeeper™."
  6_tags: "#Protéger#IG2#IG3"
  6_label: "Gestion centralisée des logiciels anti-malware"
  6_desc: "Gestion centralisée des logiciels anti-malware."
  7_tags: "#Détecter#IG2#IG3"
  7_label: "Utiliser un logiciel anti-programmes malveillants basé sur le comportement"
  7_desc: "Utiliser un logiciel anti-malware basé sur le comportement."
11:
  title: "Récupération des données"
  desc: "Établir et maintenir des pratiques de récupération des données suffisantes pour restaurer les actifs de l'entreprise dans le champ d'application à un état antérieur à l'incident et à un état de confiance."
  1_tags: "#Gouverner#IG1#IG2#IG3"
  1_label: "Établir et maintenir un processus de récupération des données"
  1_desc: "Établir et maintenir un processus documenté de récupération des données. Dans le cadre de ce processus, il convient de définir l'étendue des activités de récupération des données, l'ordre de priorité de la récupération et la sécurité des données de sauvegarde. Réviser et mettre à jour la documentation chaque année, ou lorsque des changements importants interviennent dans l'entreprise et pourraient avoir une incidence sur cette mesure de sauvegarde."
  2_tags: "#Rétablir#IG1#IG2#IG3"
  2_label: "Effectuer des sauvegardes automatisées"
  2_desc: "Effectuer des sauvegardes automatisées des actifs de l'entreprise concernés. Effectuer des sauvegardes hebdomadaires, ou plus fréquemment, en fonction de la sensibilité des données."
  3_tags: "#Protéger#IG1#IG2#IG3"
  3_label: "Protéger les données de récupération"
  3_desc: "Protéger les données de récupération par des contrôles équivalents aux données d'origine. Cryptage de référence ou séparation des données, en fonction des besoins."
  4_tags: "#Rétablir#IG1#IG2#IG3"
  4_label: "Établir et maintenir une instance isolée de données de récupération"
  4_desc: "Établir et maintenir une instance isolée des données de récupération. Les exemples de mise en œuvre comprennent le contrôle des versions des destinations de sauvegarde par le biais de systèmes ou de services hors ligne, dans le nuage ou hors site."
  5_tags: "#Rétablir#IG2#IG3"
  5_label: "Tester la Récupération de données"
  5_desc: "Tester la restauration des sauvegardes tous les trimestres, ou plus fréquemment, pour un échantillon d'actifs de l'entreprise entrant dans le champ d'application."
12:
  title: "Gestion de l'infrastructure du réseau"
  desc: "Établir, mettre en œuvre et gérer activement (suivre, signaler, corriger) les dispositifs de réseau, afin d'empêcher les attaquants d'exploiter les services de réseau et les points d'accès vulnérables."
  1_tags: "#Protéger#IG1#IG2#IG3"
  1_label: "S'assurer que l'infrastructure du réseau est à jour"
  1_desc: "Veiller à ce que l'infrastructure du réseau soit maintenue à jour. Les exemples de mise en œuvre comprennent l'exécution de la dernière version stable du logiciel et/ou l'utilisation d'offres de réseau en tant que service (NaaS) actuellement prises en charge. Examiner les versions des logiciels tous les mois, ou plus fréquemment, pour vérifier qu'ils sont bien pris en charge."
  2_tags: "#Protéger#IG2#IG3"
  2_label: "Établir et maintenir une architecture de réseau sécurisée"
  2_desc: "Concevoir et maintenir une architecture de réseau sécurisée. Une architecture de réseau sécurisée doit au moins prendre en compte la segmentation, le moindre privilège et la disponibilité. Les exemples de mise en œuvre ne comprendront pas uniquement de la documentation, mais aussi des éléments de politique et de conception."
  3_tags: "#Protéger#IG2#IG3"
  3_label: "Gérer l'infrastructure du réseau en toute sécurité"
  3_desc: "Gérer en toute sécurité l'infrastructure du réseau. Les exemples de mise en œuvre comprennent l'Infrastructure-as-Code (IaC) avec contrôle de version et l'utilisation de protocoles réseau sécurisés, tels que SSH et HTTPS."
  4_tags: "#Gouverner#IG2#IG3"
  4_label: "Établir et tenir à jour le(s) diagramme(s) d'architecture"
  4_desc: "Établir et tenir à jour le(s) diagramme(s) d'architecture et/ou d'autres documents relatifs au système de réseau. Examiner et mettre à jour la documentation chaque année, ou lorsque des changements importants interviennent dans l'entreprise et pourraient avoir une incidence sur la présente mesure de sauvegarde."
  5_tags: "#Protéger#IG2#IG3"
  5_label: "Centraliser l'authentification, l'autorisation et l'audit du réseau (Authentication, Authorization, and Auditing (AAA))"
  5_desc: "Centraliser l'AAA du réseau."
  6_tags: "#Protéger#IG2#IG3"
  6_label: "Utilisation de protocoles de gestion et de communication de réseaux sécurisés"
  6_desc: "Utiliser des protocoles de gestion de réseau et de communication sécurisés (par exemple, 802.1X, Wi-Fi Protégered Access 2 (WPA2) Enterprise ou supérieur)."
  7_tags: "#Protéger#IG2#IG3"
  7_label: "S'assurer que les appareils distants utilisent un VPN et se connectent à l'infrastructure AAA de l'entreprise"
  7_desc: "Exiger des utilisateurs qu'ils s'authentifient auprès des services VPN et d'authentification gérés par l'entreprise avant d'accéder aux ressources de l'entreprise sur les appareils des utilisateurs finaux."
  8_tags: "#Protéger#IG3"
  8_label: "Mettre en place et maintenir des ressources informatiques dédiées à l'ensemble du travail administratif"
  8_desc: "Mettre en place et maintenir des ressources informatiques dédiées, physiquement ou logiquement séparées, pour toutes les tâches administratives ou nécessitant un accès administratif. Ces ressources informatiques doivent être séparées du réseau principal de l'entreprise et ne doivent pas être autorisées à accéder à l'internet."
13:
  title: "Surveillance et défense des réseaux"
  desc: "Utiliser des processus et des outils pour mettre en place et maintenir une surveillance complète du réseau et une défense contre les menaces de sécurité dans l'infrastructure du réseau de l'entreprise et la base d'utilisateurs."
  1_tags: "#Détecter#IG2#IG3"
  1_label: "Centraliser les alertes sur les événements de sécurité"
  1_desc: "Centraliser les alertes d'événements de sécurité sur l'ensemble des actifs de l'entreprise pour la corrélation et l'analyse des journaux. La mise en œuvre des meilleures pratiques nécessite l'utilisation d'un SIEM, qui comprend des alertes de corrélation d'événements définies par le fournisseur. Une plate-forme d'analyse des journaux configurée avec des alertes de corrélation pertinentes pour la sécurité satisfait également à cette mesure de sauvegarde."
  2_tags: "#Détecter#IG2#IG3"
  2_label: "Déployer une solution de détection d'intrusion basée sur l'hôte"
  2_desc: "Déployer une solution de détection d'intrusion basée sur l'hôte sur les actifs de l'entreprise, lorsque cela est approprié et/ou pris en charge."
  3_tags: "#Détecter#IG2#IG3"
  3_label: "Déployer une solution de détection des intrusions dans le réseau"
  3_desc: "DDéployer une solution de détection des intrusions dans le réseau sur les actifs de l'entreprise, le cas échéant. Les exemples de mise en œuvre comprennent l'utilisation d'un système de détection des intrusions dans le réseau (NIDS) ou d'un service équivalent d'un fournisseur de services en nuage (CSP)."
  4_tags: "#Protéger#IG2#IG3"
  4_label: "Filtrage du trafic entre les segments du réseau"
  4_desc: "Effectuer un filtrage du trafic entre les segments du réseau, le cas échéant."
  5_tags: "#Protéger#IG2#IG3"
  5_label: "Gérer le contrôle d'accès pour les biens distants"
  5_desc: "Gérer le contrôle d'accès des actifs se connectant à distance aux ressources de l'entreprise. Déterminer la quantité d'accès aux ressources de l'entreprise en fonction des éléments suivants : logiciel anti-malware installé à jour, conformité de la configuration avec le processus de configuration sécurisé de l'entreprise, et garantie que le système d'exploitation et les applications sont à jour."
  6_tags: "#Détecter#IG2#IG3"
  6_label: "Collecter les journaux de flux de trafic du réseau"
  6_desc: "Collecter les journaux des flux de trafic du réseau et/ou le trafic du réseau afin de les examiner et de lancer des alertes sur les dispositifs du réseau."
  7_tags: "#Protéger#IG3"
  7_label: "Déployer une solution de prévention des intrusions basée sur l'hôte"
  7_desc: "Déployer une solution de prévention des intrusions basée sur l'hôte sur les actifs de l'entreprise, si cela est approprié et/ou pris en charge. Les exemples de mise en œuvre comprennent l'utilisation d'un client EDR (Endpoint Detection and Response) ou d'un agent IPS basé sur l'hôte."
  8_tags: "#Protéger#IG3"
  8_label: "Déployer une solution de prévention des intrusions dans le réseau"
  8_desc: "Déployer une solution de prévention des intrusions dans le réseau, le cas échéant. Les exemples de mise en œuvre comprennent l'utilisation d'un système de prévention des intrusions dans le réseau (NIPS) ou d'un service équivalent du CSP."
  9_tags: "#Protéger#IG3"
  9_label: "Déployer un contrôle d'accès au niveau du port"
  9_desc: "Déployer un contrôle d'accès au niveau du port. Le contrôle d'accès au niveau du port utilise 802.1x ou des protocoles similaires de contrôle d'accès au réseau, tels que les certificats, et peut intégrer l'authentification de l'utilisateur et/ou de l'appareil."
  10_tags: "#Protéger#IG3"
  10_label: "Effectuer un filtrage de la couche application"
  10_desc: "Effectuer un filtrage de la couche application. Les exemples de mise en œuvre comprennent un proxy de filtrage, un pare-feu de la couche application ou une passerelle."
  11_tags: "#Détecter#IG3"
  11_label: "Régler les seuils d'alerte des événements de sécurité"
  11_desc: "Ajustez les seuils d'alerte des événements de sécurité tous les mois, ou plus fréquemment."
14:
  title: "Sensibilisation et formation aux compétences en sécurité"
  desc: "Mettre en place et maintenir un programme de sensibilisation à la sécurité afin d'influencer le comportement du personnel pour qu'il soit conscient de la sécurité et qu'il dispose des compétences nécessaires pour réduire les risques de cybersécurité pour l'entreprise."
  1_tags: "#Gouverner#IG1#IG2#IG3"
  1_label: "Établir et maintenir un programme de sensibilisation à la sécurité"
  1_desc: "Établir et maintenir un programme de sensibilisation à la sécurité. L'objectif d'un programme de sensibilisation à la sécurité est de former le personnel de l'entreprise à la manière d'interagir avec les biens et les données de l'entreprise de manière sécurisée. Organiser une formation à l'embauche et, au minimum, une fois par an. Réviser et mettre à jour le contenu chaque année, ou lorsque des changements importants interviennent dans l'entreprise et peuvent avoir une incidence sur la présente sauvegarde."
  2_tags: "#Protéger#IG1#IG2#IG3"
  2_label: "Former les membres du personnel à reconnaître les attaques d'ingénierie sociale"
  2_desc: "Former les membres du personnel à reconnaître les attaques d'ingénierie sociale, telles que le phishing, la compromission des courriers électroniques professionnels (BEC), le pretexting et le tailgating."
  3_tags: "#Protéger#IG1#IG2#IG3"
  3_label: "Former les membres du personnel aux meilleures pratiques d'authentification"
  3_desc: "Former les membres du personnel aux meilleures pratiques d'authentification. Parmi les sujets abordés, citons la MFA, la composition des mots de passe et la gestion des informations d'identification."
  4_tags: "#Protéger#IG1#IG2#IG3"
  4_label: "Former le personnel aux meilleures pratiques en matière de traitement des données"
  4_desc: "Former les membres du personnel à l'identification et au stockage, au transfert, à l'archivage et à la destruction des données sensibles. Il s'agit également de former les membres du personnel aux meilleures pratiques en matière d'écran clair et de bureau, telles que le verrouillage de l'écran lorsqu'ils s'éloignent de leur poste de travail, l'effacement des tableaux blancs physiques et virtuels à la fin des réunions, et le stockage sécurisé des données et des actifs."
  5_tags: "#Protéger#IG1#IG2#IG3"
  5_label: "Former les membres du personnel aux causes de l'exposition involontaire aux données"
  5_desc: "Former les membres du personnel pour qu'ils soient conscients des causes d'exposition involontaire des données. Il peut s'agir par exemple d'une mauvaise livraison de données sensibles, de la perte d'un appareil portable d'un utilisateur final ou de mesures de publication de données à l'intention d'un public non ciblé."
  6_tags: "#Protéger#IG1#IG2#IG3"
  6_label: "Former les membres du personnel à reconnaître et à signaler les incidents de sécurité"
  6_desc: "Former les membres du personnel pour qu'ils soient en mesure de reconnaître un incident potentiel et de le signaler."
  7_tags: "#Protéger#IG1#IG2#IG3"
  7_label: "Former le personnel sur la manière d'identifier et de signaler si les mises à jour de sécurité manquent sur les actifs de l'entreprise"
  7_desc: "Former le personnel pour qu'il comprenne comment vérifier et signaler les correctifs logiciels périmés ou toute défaillance des processus et outils automatisés. Une partie de cette formation devrait inclure la notification au personnel informatique de toute défaillance des processus et outils automatisés."
  8_tags: "#Protéger#IG1#IG2#IG3"
  8_label: "Former le personnel aux dangers de la connexion et de la transmission de données d'entreprise sur des réseaux non sécurisés"
  8_desc: "Former les membres du personnel aux dangers de la connexion et de la transmission de données sur des réseaux non sécurisés dans le cadre des activités de l'entreprise. Si l'entreprise emploie des travailleurs à distance, la formation doit inclure des conseils pour s'assurer que tous les utilisateurs configurent de manière sécurisée l'infrastructure de leur réseau domestique."
  9_tags: "#Protéger#IG2#IG3"
  9_label: "Organiser une sensibilisation à la sécurité et une formation aux compétences spécifiques à chaque rôle"
  9_desc: "Organiser une sensibilisation à la sécurité et une formation aux compétences spécifiques à chaque rôle. Parmi les exemples de mise en œuvre, citons les cours d'administration de systèmes sécurisés pour les professionnels de l'informatique, la formation à la sensibilisation et à la prévention des vulnérabilités du Top 10 de l'OWASP® pour les développeurs d'applications web, et la formation à la sensibilisation à l'ingénierie sociale avancée pour les rôles de haut niveau."
15:
  title: "Gestion des fournisseurs de services"
  desc: "Développer un processus d'évaluation des fournisseurs de services qui détiennent des données sensibles ou qui sont responsables des plates-formes ou des processus informatiques critiques d'une entreprise, afin de s'assurer que ces fournisseurs protègent ces plates-formes et ces données de manière appropriée."
  1_tags: "#Identifier#IG1#IG2#IG3"
  1_label: "Établir et tenir à jour un inventaire des prestataires de services"
  1_desc: "Établir et tenir à jour un inventaire des fournisseurs de services. Cet inventaire doit dresser la liste de tous les fournisseurs de services connus, indiquer leur(s) classification(s) et désigner un contact au sein de l'entreprise pour chaque fournisseur de services. L'inventaire doit être revu et mis à jour chaque année, ou lorsque des changements importants interviennent dans l'entreprise et sont susceptibles d'avoir une incidence sur cette mesure de sauvegarde."
  2_tags: "#Gouverner#IG2#IG3"
  2_label: "Établir et maintenir une politique de gestion des prestataires de services"
  2_desc: "Établir et maintenir une politique de gestion des fournisseurs de services. Veiller à ce que cette politique traite de la classification, de l'inventaire, de l'évaluation, de la surveillance et de la mise hors service des fournisseurs de services. Réviser et mettre à jour la politique chaque année, ou lorsque des changements importants interviennent au sein de l'entreprise et sont susceptibles d'avoir une incidence sur la présente mesure de sauvegarde."
  3_tags: "#Gouverner#IG2#IG3"
  3_label: "Classer les prestataires de services"
  3_desc: "Classer les fournisseurs de services. La classification peut prendre en compte une ou plusieurs caractéristiques, telles que la sensibilité des données, le volume des données, les exigences en matière de disponibilité, les réglementations applicables, les risques inhérents et les risques atténués. Mettre à jour et réviser les classifications chaque année, ou lorsque des changements importants au sein de l'entreprise se produisent et pourraient avoir une incidence sur cette mesure de sauvegarde."
  4_tags: "#Gouverner#IG2#IG3"
  4_label: "Veiller à ce que les contrats des fournisseurs de services incluent des exigences en matière de sécurité"
  4_desc: "Veiller à ce que les contrats des fournisseurs de services contiennent des exigences en matière de sécurité. Il peut s'agir, par exemple, d'exigences minimales en matière de programme de sécurité, de notification et d'intervention en cas d'incident de sécurité et/ou de violation des données, d'exigences en matière de cryptage des données et d'engagements en matière d'élimination des données. Ces exigences de sécurité doivent être compatibles avec la politique de gestion des prestataires de services de l'entreprise. Examiner chaque année les contrats des prestataires de services pour s'assurer qu'ils ne comportent pas d'exigences en matière de sécurité."
  5_tags: "#Gouverner#IG3"
  5_label: "Évaluer les prestataires de services"
  5_desc: "Évaluer les fournisseurs de services conformément à la politique de gestion des fournisseurs de services de l'entreprise. La portée de l'évaluation peut varier en fonction de la (des) classification(s) et peut inclure l'examen de rapports d'évaluation normalisés, tels que Service Organization Control 2 (SOC 2) et Payment Card Industry (PCI) Attestation of Compliance (AoC), des questionnaires personnalisés ou d'autres processus rigoureux appropriés. Réévaluer les fournisseurs de services au moins une fois par an, ou lors de la signature de nouveaux contrats ou du renouvellement de contrats existants."
  6_tags: "#Gouverner#IG3"
  6_label: "Contrôler les prestataires de services"
  6_desc: "Contrôler les fournisseurs de services conformément à la politique de gestion des fournisseurs de services de l'entreprise. Le contrôle peut comprendre une réévaluation périodique de la conformité du fournisseur de services, la surveillance des notes de mise à jour du fournisseur de services et la surveillance du dark web."
  7_tags: "#Protéger#IG3"
  7_label: "Déclasser les fournisseurs de services en toute sécurité"
  7_desc: "Mettre hors service les fournisseurs de services en toute sécurité. Parmi les exemples à prendre en compte, on peut citer la désactivation des comptes d'utilisateurs et de services, l'arrêt des flux de données et l'élimination sécurisée des données de l'entreprise dans les systèmes des fournisseurs de services."
16:
  title: "Sécurité des logiciels et Applications"
  desc: "Gérer le cycle de vie de la sécurité des logiciels développés en interne, hébergés ou acquis pour prévenir, détecter et corriger les faiblesses de sécurité avant qu'elles n'aient un impact sur l'entreprise."
  1_tags: "#Gouverner#IG2#IG3"
  1_label: "Établir et maintenir un processus de développement d'applications sécurisé"
  1_desc: "Établir et maintenir un processus de développement d'applications sécurisées. Dans le cadre de ce processus, des éléments tels que les normes de conception d'applications sécurisées, les pratiques de codage sécurisées, la formation des développeurs, la gestion des vulnérabilités, la sécurité des codes tiers et les procédures de test de la sécurité des applications doivent être pris en compte. Réviser et mettre à jour la documentation chaque année, ou lorsque des changements importants interviennent dans l'entreprise et pourraient avoir une incidence sur cette mesure de sauvegarde."
  2_tags: "#Gouverner#IG2#IG3"
  2_label: "Établir et maintenir un processus d'acceptation et de traitement des vulnérabilités des logiciels"
  2_desc: "Établir et maintenir un processus pour accepter et traiter les rapports sur les vulnérabilités des logiciels, y compris en fournissant un moyen pour les entités externes de faire des rapports. Le processus doit comprendre des éléments tels que : une politique de traitement des vulnérabilités qui identifie le processus de signalement, la partie responsable du traitement des signalements de vulnérabilités et un processus de réception, d'attribution, de remédiation et de test de remédiation. Dans le cadre de ce processus, il convient d'utiliser un système de suivi des vulnérabilités comprenant des niveaux de gravité et des mesures permettant d'évaluer le temps nécessaire à l'identification, à l'analyse et à la correction des vulnérabilités. Réviser et mettre à jour la documentation chaque année, ou lorsque des changements importants interviennent dans l'entreprise et pourraient avoir une incidence sur cette mesure de sauvegarde.\n\nLes développeurs d'applications tierces doivent considérer qu'il s'agit d'une politique orientée vers l'extérieur qui contribue à définir les attentes des parties prenantes externes."
  3_tags: "#Détecter#IG2#IG3"
  3_label: "Effectuer une analyse des causes profondes des vulnérabilités en matière de sécurité"
  3_desc: "Effectuer une analyse des causes profondes des failles de sécurité. Lors de l'examen des vulnérabilités, l'analyse des causes profondes consiste à évaluer les problèmes sous-jacents qui créent des vulnérabilités dans le code, et permet aux équipes de développement d'aller au-delà de la simple correction des vulnérabilités individuelles au fur et à mesure qu'elles se présentent."
  4_tags: "#Identifier#IG2#IG3"
  4_label: "Établir et gérer un inventaire des composants logiciels tiers"
  4_desc: "Établir et gérer un inventaire actualisé des composants tiers utilisés dans le cadre du développement, souvent appelé « nomenclature », ainsi que des composants dont l'utilisation est prévue à l'avenir. Cet inventaire doit inclure tous les risques que chaque composant tiers pourrait présenter. Évaluer la liste au moins une fois par mois afin d'identifier tout changement ou toute mise à jour de ces composants et de s'assurer qu'ils sont toujours pris en charge."
  5_tags: "#Protéger#IG2#IG3"
  5_label: "Utiliser des composants logiciels tiers actualisés et fiables"
  5_desc: "Utiliser des composants logiciels tiers actualisés et fiables. Dans la mesure du possible, choisissez des cadres et des bibliothèques établis et éprouvés qui offrent une sécurité adéquate. Acquérir ces composants auprès de sources fiables ou évaluer les vulnérabilités du logiciel avant de l'utiliser."
  6_tags: "#Gouverner#IG2#IG3"
  6_label: "Établir et maintenir un système et un processus d'évaluation de la gravité des vulnérabilités des applications"
  6_desc: "Établir et maintenir un système et un processus d'évaluation de la gravité des vulnérabilités des applications qui facilite la hiérarchisation de l'ordre dans lequel les vulnérabilités découvertes sont corrigées. Ce processus comprend la fixation d'un niveau minimum de sécurité acceptable pour la publication du code ou des applications. L'évaluation de la gravité permet de trier les vulnérabilités de manière systématique, ce qui améliore la gestion des risques et contribue à garantir que les bogues les plus graves sont corrigés en premier. Examiner et mettre à jour le système et le processus chaque année."
  7_tags: "#Protéger#IG2#IG3"
  7_label: "Utiliser des modèles de configuration de renforcement standard pour l'infrastructure d'application"
  7_desc: "Utilisez des modèles de configuration de renforcement standard et recommandés par l'industrie pour les composants de l'infrastructure applicative. Cela inclut les serveurs sous-jacents, les bases de données et les serveurs web, et s'applique aux conteneurs cloud, aux composants PaaS (Platform as a Service) et aux composants SaaS. Ne laissez pas les logiciels développés en interne affaiblir le renforcement de la configuration."
  8_tags: "#Protéger#IG2#IG3"
  8_label: "Séparer les systèmes de production et de non-production"
  8_desc: "Maintenir des environnements distincts pour les systèmes de production et de non-production."
  9_tags: "#Protéger#IG2#IG3"
  9_label: "Former les développeurs aux concepts de sécurité des applications et au codage sécurisé"
  9_desc: "Veiller à ce que l'ensemble du personnel chargé du développement des logiciels reçoive une formation à l'écriture d'un code sécurisé pour son environnement de développement spécifique et ses responsabilités. La formation peut porter sur les principes généraux de sécurité et sur les pratiques standard en matière de sécurité des applications. Organiser la formation au moins une fois par an et la concevoir de manière à promouvoir la sécurité au sein de l'équipe de développement et à instaurer une culture de la sécurité parmi les développeurs."
  10_tags: "#Protéger#IG2#IG3"
  10_label: "Appliquer les principes de conception sécurisée dans les architectures d'application"
  10_desc: "Appliquer des principes de conception sécurisés dans les architectures d'application. Les principes de conception sécurisée comprennent le concept du moindre privilège et l'application de la médiation pour valider chaque opération effectuée par l'utilisateur, en promouvant le concept de \"ne jamais faire confiance à l'entrée de l'utilisateur\". Il s'agit par exemple de s'assurer qu'une vérification explicite des erreurs est effectuée et documentée pour toutes les entrées, notamment en ce qui concerne la taille, le type de données et les plages ou formats acceptables. La conception sécurisée implique également de minimiser la surface d'attaque de l'infrastructure de l'application, par exemple en désactivant les ports et les services non protégés, en supprimant les programmes et les fichiers inutiles et en renommant ou en supprimant les comptes par défaut."
  11_tags: "#Identifier#IG2#IG3"
  11_label: "Tirez parti des modules ou services approuvés pour les composants de sécurité des applications"
  11_desc: "Exploitez des modules ou services approuvés pour les composants de sécurité des applications, tels que la gestion des identités, le chiffrement, l'audit et la journalisation. L'utilisation de fonctionnalités de plateforme dans les fonctions de sécurité critiques réduira la charge de travail des développeurs et minimisera le risque d'erreurs de conception ou d'implémentation. Les systèmes d'exploitation modernes offrent des mécanismes efficaces d'identification, d'authentification et d'autorisation, et les mettent à disposition des applications. Utilisez uniquement des algorithmes de chiffrement standardisés, reconnus et largement testés. Les systèmes d'exploitation fournissent également des mécanismes pour créer et maintenir des journaux d'audit sécurisés."
  12_tags: "#Protéger#IG3"
  12_label: "Mettre en œuvre des contrôles de sécurité au niveau du code"
  12_desc: "Appliquez des outils d’analyse statique et dynamique tout au long du cycle de vie de l’application pour vérifier que les pratiques de codage sécurisées sont suivies. (SAST / DAST)"
  13_tags: "#Détecter#IG3"
  13_label: "Effectuer des tests de pénétration d'applications"
  13_desc: "Effectuer des tests de pénétration d'applications. Pour les applications critiques, les tests de pénétration authentifiés sont plus adaptés à la détection des vulnérabilités de la logique métier que l'analyse de code et les tests de sécurité automatisés. Les tests de pénétration reposent sur la capacité du testeur à manipuler manuellement une application en tant qu'utilisateur authentifié et non authentifié."
  14_tags: "#Protéger#IG3"
  14_label: "Modélisation de la menace"
  14_desc: "Modéliser les menaces. La modélisation des menaces consiste à identifier et à corriger les failles de sécurité d'une application, avant même la création du code. Elle est réalisée par des personnes spécialement formées qui évaluent la conception de l'application et évaluent les risques de sécurité pour chaque point d'entrée et niveau d'accès. L'objectif est de cartographier l'application, l'architecture et l'infrastructure de manière structurée afin d'en comprendre les faiblesses."
17:
  title: "Gestion des réponses aux incidents"
  desc: "Établir un programme pour développer et maintenir une capacité de réponse aux incidents (par exemple, des politiques, des plans, des procédures, des rôles définis, une formation et des communications) pour préparer, détecter et répondre rapidement à une attaque."
  1_tags: "#Répondre#IG1#IG2#IG3"
  1_label: "Désigner le personnel chargé de gérer les incidents"
  1_desc: "Désigner une personne clé, et au moins un remplaçant, qui gérera le processus de traitement des incidents de l'entreprise. Le personnel de gestion est responsable de la coordination et de la documentation des efforts de réponse et de récupération en cas d'incident et peut-être composé d'employés internes à l'entreprise, de fournisseurs de services ou d'une approche hybride. Si l'entreprise fait appel à un prestataire de services, elle doit désigner au moins une personne interne à l'entreprise pour superviser le travail de la tierce partie. Réviser le plan de sauvegarde chaque année ou lorsque des changements importants interviennent dans l'entreprise et pourraient avoir une incidence sur ce plan de sauvegarde."
  2_tags: "#Gouverner#IG1#IG2#IG3"
  2_label: "Établir et tenir à jour les coordonnées des personnes à contacter pour signaler les incidents de sécurité"
  2_desc: "Établir et tenir à jour les coordonnées des parties qui doivent être informées des incidents de sécurité. Les contacts peuvent être le personnel interne, les fournisseurs de services, les forces de l'ordre, les fournisseurs de cyberassurance, les agences gouvernementales concernées, les partenaires du centre de partage et d'analyse de l'information (ISAC) ou d'autres parties prenantes. Vérifier les contacts chaque année pour s'assurer que les informations sont à jour."
  3_tags: "#Gouverner#IG1#IG2#IG3"
  3_label: "Établir et maintenir un processus d'entreprise pour la notification des incidents"
  3_desc: "Établir et maintenir un processus d'entreprise documenté permettant au personnel de signaler les incidents de sécurité. Cette procédure prévoit un délai de signalement, le nom des personnes à qui s'adresser, le mécanisme de signalement et les informations minimales à communiquer. Veiller à ce que le processus soit accessible à l'ensemble du personnel. Réviser le processus chaque année ou lorsque des changements importants interviennent dans l'entreprise et pourraient avoir une incidence sur cette mesure de sauvegarde."
  4_tags: "#Gouverner#IG2#IG3"
  4_label: "Établir et maintenir un processus de réponse aux incidents"
  4_desc: "Établir et maintenir un processus documenté de réponse aux incidents qui traite des rôles et des responsabilités, des exigences de conformité et d'un plan de communication. Révision annuelle ou en cas de changements importants dans l'entreprise susceptibles d'avoir une incidence sur cette mesure de sauvegarde."
  5_tags: "#Répondre#IG2#IG3"
  5_label: "Attribuer des rôles et des responsabilités clés"
  5_desc: "Attribuer des rôles et des responsabilités clés pour la réponse aux incidents, notamment au personnel des services juridiques, de l'informatique, de la sécurité de l'information, des installations, des relations publiques, des ressources humaines, aux personnes chargées de répondre aux incidents et aux analystes. Révision annuelle ou lorsque des changements importants au sein de l'entreprise sont susceptibles d'avoir une incidence sur la présente mesure de sauvegarde."
  6_tags: "#Répondre#IG2#IG3"
  6_label: "Définir des mécanismes de communication pendant la réponse à l'incident"
  6_desc: "Déterminez les mécanismes primaires et secondaires qui seront utilisés pour communiquer et rendre compte lors d'un incident de sécurité. Il peut s'agir d'appels téléphoniques, de courriels, de chats sécurisés ou de lettres de notification. Gardez à l'esprit que certains mécanismes, tels que les courriels, peuvent être affectés lors d'un incident de sécurité. Il convient de procéder à une révision annuelle ou lorsque des changements importants au sein de l'entreprise sont susceptibles d'avoir une incidence sur cette mesure de protection."
  7_tags: "#Rétablir#IG2#IG3"
  7_label: "Effectuer des exercices de routine de réponse aux incidents"
  7_desc: "PPlanifier et réaliser des exercices et des scénarios de réponse aux incidents pour le personnel clé impliqué dans le processus de réponse aux incidents afin de se préparer à répondre à des incidents réels. Les exercices doivent permettre de tester les canaux de communication, la prise de décision et les flux de travail. Les tests doivent être effectués au moins une fois par an."
  8_tags: "#Rétablir#IG2#IG3"
  8_label: "Réaliser des examens après l'incident"
  8_desc: "Procéder à des examens post-incidents. Les analyses post-incident permettent d'éviter que l'incident ne se reproduise en identifiant les enseignements tirés et les mesures de suivi."
  9_tags: "#Rétablir#IG3"
  9_label: "Établir et maintenir des seuils d'incidents de sécurité"
  9_desc: "Établir et maintenir des seuils d'incidents de sécurité, y compris, au minimum, faire la différence entre un incident et un événement. Les exemples peuvent inclure : activité anormale, vulnérabilité de la sécurité, faiblesse de la sécurité, violation de données, incident lié à la protection de la vie privée, etc. Réviser ces seuils chaque année ou en cas de changements importants au sein de l'entreprise susceptibles d'avoir une incidence sur cette mesure de protection."
18:
  title: "Test de pénétration"
  desc: "Tester l'efficacité et la résilience des actifs de l'entreprise en identifiant et en exploitant les faiblesses des contrôles (personnes, processus et technologie) et en simulant les objectifs et les actions d'un attaquant."
  1_tags: "#Gouverner#IG2#IG3"
  1_label: "Établir et maintenir un programme de tests de pénétration"
  1_desc: "Établir et maintenir un programme de tests de pénétration adapté à la taille, à la complexité, au secteur d'activité et à la maturité de l'entreprise. Les caractéristiques du programme de tests d'intrusion comprennent le champ d'application (réseau, application web, interface de programmation d'application (API), services hébergés et contrôles des locaux physiques), la fréquence, les limites (heures acceptables et types d'attaques exclus), les informations sur le point de contact, les mesures correctives (comment les résultats seront acheminés en interne) et les exigences en matière de rétrospection."
  2_tags: "#Détecter#IG2#IG3"
  2_label: "Effectuer des tests de pénétration externes périodiques"
  2_desc: "Effectuer des tests de pénétration externes périodiques en fonction des exigences du programme, au moins une fois par an. Les tests de pénétration externes doivent comprendre une reconnaissance de l'entreprise et de l'environnement afin de détecter les informations exploitables. Les tests de pénétration requièrent des compétences et une expérience spécialisées et doivent être effectués par une partie qualifiée. Les tests peuvent être effectués en boîte transparente ou en boîte opaque."
  3_tags: "#Protéger#IG2#IG3"
  3_label: "Remédier aux résultats des tests de pénétration"
  3_desc: "Remédier aux résultats des tests de pénétration sur la base du processus documenté de remédiation des vulnérabilités de l'entreprise. Il s'agit notamment de déterminer un calendrier et un niveau d'effort en fonction de l'impact et de l'ordre de priorité de chaque résultat identifié."
  4_tags: "#Protéger#IG3"
  4_label: "Valider les mesures de sécurité"
  4_desc: "Valider les mesures de sécurité après chaque test de pénétration. Si nécessaire, modifier les jeux de règles et les capacités pour détecter les techniques utilisées pendant les tests."
  5_tags: "#Détecter#IG3"
  5_label: "Effectuer des tests de pénétration internes périodiques"
  5_desc: "Effectuer des tests de pénétration internes périodiques sur la base des exigences du programme, au moins une fois par an. Les tests peuvent être effectués en boîte blanche ou en boîte noire."
