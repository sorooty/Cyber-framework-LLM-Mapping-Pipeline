4:
  title: "Contexte de l'organisation"
  1_label: "Compréhension de l'organisation et de son contexte"
  1_desc: "L'organisation doit déterminer les questions externes et internes qui sont pertinentes pour son but et qui affectent sa capacité à atteindre le(s) résultat(s) souhaité(s) de son système de gestion de l'IA.\n\nL'organisation doit déterminer si le changement climatique est une question pertinente.\n\nL'organisation doit considérer le but prévu des systèmes d'IA qui sont développés, fournis ou utilisés par l'organisation. L'organisation doit déterminer ses rôles par rapport à ces systèmes d'IA.\n\n ℹ️NOTE 1\nPour comprendre l'organisation et son contexte, il peut être utile pour l'organisation de déterminer son rôle par rapport au système d'IA. Ces rôles peuvent inclure, sans s'y limiter, un ou plusieurs des éléments suivants :\n\t\t - les fournisseurs d'IA, y compris les fournisseurs de plateformes d'IA, les fournisseurs de produits ou de services d'IA ;\n\t\t - les producteurs d'IA, y compris les développeurs d'IA, les concepteurs d'IA, les opérateurs d'IA, les testeurs et évaluateurs d'IA, les déployeurs d'IA, les professionnels des facteurs humains de l'IA, les experts du domaine, les évaluateurs d'impact de l'IA, les acheteurs, les professionnels de la gouvernance et de la supervision de l'IA ;\n\t\t - les clients de l'IA, y compris les utilisateurs de l'IA ;\n\t\t - les partenaires de l'IA, y compris les intégrateurs de systèmes d'IA et les fournisseurs de données ;\n\t\t - les sujets de l'IA, y compris les sujets de données et autres sujets ;\n\t\t - les autorités pertinentes, y compris les décideurs politiques et les régulateurs.\n\n ℹ️NOTE 2\nLes questions externes et internes à aborder dans le cadre de cette clause peuvent varier selon les rôles et la juridiction de l'organisation et leur impact sur sa capacité à atteindre le(s) résultat(s) souhaité(s) de son système de gestion de l'IA. Celles-ci peuvent inclure, sans s'y limiter :\n\ta) les considérations liées au contexte externe telles que :\n\t\t 1) les exigences légales applicables, y compris les utilisations interdites de l'IA ;\n\t\t 2) les politiques, lignes directrices et décisions des régulateurs qui ont un impact sur l'interprétation ou l'application des exigences légales dans le développement et l'utilisation des systèmes d'IA ;\n\t\t 3) les incitations ou conséquences associées au but prévu et à l'utilisation des systèmes d'IA ;\n\t\t 4) la culture, les traditions, les valeurs, les normes et l'éthique en ce qui concerne le développement et l'utilisation de l'IA ;\n\t\t 5) le paysage concurrentiel et les tendances pour les nouveaux produits et services utilisant des systèmes d'IA ;\n\tb) les considérations liées au contexte interne telles que :\n\t\t 1) le contexte organisationnel, la gouvernance, les objectifs (voir 6.2), les politiques et les procédures ;\n\t\t 2) les obligations contractuelles ;\n\t\t 3) le but prévu du système d'IA à développer ou à utiliser.\n\n ℹ️NOTE 3\nLa détermination des rôles peut être formée par des obligations liées aux catégories de données que l'organisation traite (par exemple, le processeur d'informations personnellement identifiables (PII) ou le contrôleur PII lors du traitement des PII). Voir ISO/IEC 29100 pour les PII et les rôles associés. Les rôles peuvent également être informés par des exigences légales spécifiques aux systèmes d'IA."
  2_label: "Compréhension des besoins et attentes des parties intéressées"
  2_desc: "L'organisation doit déterminer :\n\t\t - les parties intéressées qui sont pertinentes pour le système de gestion de l'IA ;\n\t\t - les exigences pertinentes de ces parties intéressées ;\n\t\t - lesquelles de ces exigences seront abordées par le système de gestion de l'IA.\n\n ℹ️NOTE\nLes parties intéressées pertinentes peuvent avoir des exigences liées au changement climatique."
  3_label: "Détermination du domaine d'application du système de gestion de l'IA"
  3_desc: "L'organisation doit déterminer les limites et l'applicabilité du système de gestion de l'IA pour établir son domaine d'application.\n\nLors de la détermination de ce domaine d'application, l'organisation doit considérer :\n\t\t - les questions externes et internes mentionnées en 4.1 ;\n\t\t - les exigences mentionnées en 4.2.\n\nLe domaine d'application doit être disponible en tant qu'information documentée.\nLe domaine d'application du système de gestion de l'IA doit déterminer les activités de l'organisation par rapport aux exigences de ce document sur le système de gestion de l'IA, le leadership, la planification, le soutien, l'exploitation, la performance, l'évaluation, l'amélioration, les contrôles et les objectifs."
  4_label: "Système de gestion de l'IA"
  4_desc: "L'organisation doit établir, mettre en œuvre, maintenir, améliorer en continu et documenter un système de gestion de l'IA, y compris les processus nécessaires et leurs interactions, conformément aux exigences de ce document."
5:
  title: "Leadership"
  1_label: "Leadership et engagement"
  1_desc: "La direction doit démontrer son leadership et son engagement concernant le système de gestion de l'IA en :\n\t\t - s'assurant que la politique d'IA (voir 5.2) et les objectifs d'IA (voir 6.2) sont établis et sont compatibles avec la direction stratégique de l'organisation ;\n\t\t - s'assurant de l'intégration des exigences du système de gestion de l'IA dans les processus métiers de l'organisation ;\n\t\t - s'assurant que les ressources nécessaires pour le système de gestion de l'IA sont disponibles ;\n\t\t - communiquant l'importance d'une gestion efficace de l'IA et de la conformité aux exigences du système de gestion de l'IA ;\n\t\t - s'assurant que le système de gestion de l'IA atteint son ou ses résultats prévus ;\n\t\t - dirigeant et soutenant les personnes pour qu'elles contribuent à l'efficacité du système de gestion de l'IA ;\n\t\t - promouvant l'amélioration continue ;\n\t\t - soutenant d'autres rôles pertinents pour démontrer leur leadership tel qu'il s'applique à leurs domaines de responsabilité.\n\n ℹ️NOTE 1\nLa référence au « métier » dans ce document peut être interprétée de manière large pour signifier les activités qui sont au cœur des objectifs de l'existence de l'organisation.\n\n ℹ️NOTE 2\nÉtablir, encourager et modéliser une culture au sein de l'organisation, pour adopter une approche responsable de l'utilisation, du développement et de la gouvernance des systèmes d'IA peut être une démonstration importante de l'engagement et du leadership de la direction. Assurer la sensibilisation et la conformité à une telle approche responsable et en soutien au système de gestion de l'IA par le leadership peut aider au succès du système de gestion de l'IA."
  2_label: "Politique d'IA"
  2_desc: "La direction doit établir une politique d'IA qui :\n\ta) est appropriée au but de l'organisation ;\n\tb) fournit un cadre pour fixer les objectifs d'IA (voir 6.2) ;\n\tc) inclut un engagement à respecter les exigences applicables ;\n\td) inclut un engagement à l'amélioration continue du système de gestion de l'IA.\n\nLa politique d'IA doit :\n\t\t - être disponible en tant qu'information documentée ;\n\t\t - faire référence, le cas échéant, à d'autres politiques organisationnelles ;\n\t\t - être communiquée au sein de l'organisation ;\n\t\t - être disponible pour les parties intéressées, le cas échéant.\n\n ℹ️NOTE\nDes considérations pour les organisations lors du développement des politiques d'IA sont fournies dans ISO/IEC 38507."
  3_label: "Rôles, responsabilités et autorités"
  3_desc: "La direction doit s'assurer que les responsabilités et les autorités pour les rôles pertinents sont assignées et communiquées au sein de l'organisation.\n\nLa direction doit assigner la responsabilité et l'autorité pour :\n\ta) s'assurer que le système de gestion de l'IA est conforme aux exigences de ce document ;\n\tb) rendre compte de la performance du système de gestion de l'IA à la direction.\n\n ℹ️NOTE\nUn contrôle pour définir et allouer les rôles et responsabilités est fourni en A.3.2 dans le Tableau A.1. Un guide de mise en œuvre pour ce contrôle est fourni en B.3.2."
6:
  title: "Planification"
  1:
    title: "Actions pour traiter les risques et opportunités"
    1_label: "Général"
    1_desc: "Lors de la planification du système de gestion de l'IA, l'organisation doit considérer les questions mentionnées en 4.1 et les exigences mentionnées en 4.2 et déterminer les risques et opportunités qui doivent être traités pour :\n\t\t - donner l'assurance que le système de gestion de l'IA peut atteindre son ou ses résultats prévus ;\n\t\t - prévenir ou réduire les effets indésirables ;\n\t\t - atteindre l'amélioration continue.\n\nL'organisation doit établir et maintenir des critères de risque d'IA qui soutiennent :\n\t\t - la distinction des risques acceptables des risques inacceptables ;\n\t\t - la réalisation des évaluations des risques d'IA ;\n\t\t - la conduite du traitement des risques d'IA ;\n\t\t - l'évaluation des impacts des risques d'IA.\n\n ℹ️NOTE 1\nDes considérations pour déterminer la quantité et le type de risque qu'une organisation est prête à poursuivre ou à retenir sont fournies dans ISO/IEC 38507 et ISO/IEC 23894.\n\nL'organisation doit déterminer les risques et opportunités selon :\n\t\t - le domaine et le contexte d'application d'un système d'IA ;\n\t\t - l'utilisation prévue ;\n\t\t - le contexte externe et interne décrit en 4.1.\n\n ℹ️NOTE 2\nPlus d'un système d'IA peut être considéré dans le domaine d'application du système de gestion de l'IA. Dans ce cas, la détermination des opportunités et des utilisations est effectuée pour chaque système d'IA ou groupements de systèmes d'IA.\n\nL'organisation doit planifier :\n\ta) des actions pour traiter ces risques et opportunités ;\n\thow to:\n\t\t1) intégrer et mettre en œuvre les actions dans ses processus de système de gestion de l'IA ;\n\t\t2) évaluer l'efficacité de ces actions.\nL'organisation doit conserver des informations documentées sur les actions prises pour identifier et traiter les risques et opportunités d'IA.\n\n ℹ️NOTE 3\nUn guide sur la manière de mettre en œuvre la gestion des risques pour les organisations développant, fournissant ou utilisant des produits, systèmes et services d'IA est fourni dans ISO/IEC 23894.\n\n ℹ️NOTE 4\nLe contexte de l'organisation et ses activités peuvent avoir un impact sur les activités de gestion des risques de l'organisation.\n\n ℹ️NOTE 5\nLa manière de définir le risque et donc d'envisager la gestion des risques peut varier selon les secteurs et les industries. La définition du risque en 3.7 permet une vision large du risque adaptable à tout secteur, tels que les secteurs mentionnés dans l'Annexe D. Dans tous les cas, c'est le rôle de l'organisation, dans le cadre de l'évaluation des risques, d'adopter d'abord une vision du risque adaptée à son contexte. Cela peut inclure d'aborder le risque par des définitions utilisées dans les secteurs où le système d'IA est développé et utilisé, comme la définition de l'ISO/IEC Guide 51."
    2_label: "Évaluation des risques d'IA"
    2_desc: "L'organisation doit définir et établir un processus d'évaluation des risques d'IA qui :\n\ta) est informé et aligné avec la politique d'IA (voir 5.2) et les objectifs d'IA (voir 6.2) ;\n\n ℹ️NOTE\nLors de l'évaluation des conséquences dans le cadre de 6.1.2 d) 1), l'organisation peut utiliser une évaluation d'impact du système d'IA comme indiqué en 6.1.4.\n\tb) est conçu de sorte que des évaluations répétées des risques d'IA peuvent produire des résultats cohérents, valides et comparables ;\n\tc) identifie les risques qui aident ou empêchent d'atteindre ses objectifs d'IA ;\n\td) analyse les risques d'IA pour :\n\t\t1) évaluer les conséquences potentielles pour l'organisation, les individus et les sociétés qui résulteraient si les risques identifiés se matérialisaient ;\n\t\t2) évaluer, le cas échéant, la probabilité réaliste des risques identifiés ;\n\t\t3) déterminer les niveaux de risque ;\n\te) évalue les risques d'IA pour :\n\t\t1) comparer les résultats de l'analyse des risques avec les critères de risque (voir 6.1.1) ;\n\t\t2) prioriser les risques évalués pour le traitement des risques.\n\nL'organisation doit conserver des informations documentées sur le processus d'évaluation des risques d'IA."
    3_label: "Traitement des risques d'IA"
    3_desc: "En tenant compte des résultats de l'évaluation des risques, l'organisation doit définir un processus de traitement des risques d'IA pour :\n\ta) sélectionner les options appropriées de traitement des risques d'IA ;\n\tb) déterminer tous les contrôles qui sont nécessaires pour mettre en œuvre les options de traitement des risques d'IA choisies et comparer les contrôles avec ceux de l'Annexe A pour vérifier qu'aucun contrôle nécessaire n'a été omis ;\n\n ℹ️NOTE 1\nL'Annexe A fournit des contrôles de référence pour répondre aux objectifs organisationnels et traiter les risques liés à la conception et à l'utilisation des systèmes d'IA.\n\tc) considérer les contrôles de l'Annexe A qui sont pertinents pour la mise en œuvre des options de traitement des risques d'IA ;\n\td) identifier si des contrôles supplémentaires sont nécessaires au-delà de ceux de l'Annexe A afin de mettre en œuvre toutes les options de traitement des risques ;\n\n ℹ️NOTE 2\nLes objectifs de contrôle sont implicitement inclus dans les contrôles choisis. L'organisation peut sélectionner un ensemble approprié d'objectifs de contrôle et de contrôles à partir de l'Annexe A. Les contrôles de l'Annexe A ne sont pas exhaustifs et des objectifs de contrôle et des contrôles supplémentaires peuvent être nécessaires. Si des contrôles différents ou supplémentaires sont nécessaires au-delà de ceux de l'Annexe A, l'organisation peut concevoir de tels contrôles ou les prendre à partir de sources existantes. La gestion des risques d'IA peut être intégrée dans d'autres systèmes de gestion, le cas échéant.\n\te) considérer le guide dans l'Annexe B pour la mise en œuvre des contrôles déterminés en b) et c) ;\n\n ℹ️NOTE 3\nL'organisation peut fournir des justifications documentées pour l'exclusion de tout objectif de contrôle en général ou pour des systèmes d'IA spécifiques, que ceux listés dans l'Annexe A ou établis par l'organisation elle-même.\n\tf) produire une déclaration d'applicabilité qui contient les contrôles nécessaires [voir b), c) et d)] et fournir une justification pour l'inclusion et l'exclusion des contrôles. La justification pour l'exclusion peut inclure les cas où les contrôles ne sont pas jugés nécessaires par l'évaluation des risques et où ils ne sont pas requis par (ou sont soumis à des exceptions en vertu de) des exigences externes applicables.\n\ng) formuler un plan de traitement des risques d'IA.\n\nL'organisation doit obtenir l'approbation de la direction désignée pour le plan de traitement des risques d'IA et pour l'acceptation des risques résiduels d'IA. Les contrôles nécessaires doivent être :\n\t\t - alignés sur les objectifs en 6.2 ;\n\t\t - disponibles en tant qu'informations documentées ;\n\t\t - communiqués au sein de l'organisation ;\n\t\t - disponibles pour les parties intéressées, le cas échéant.\n\nL'organisation doit conserver des informations documentées sur le processus de traitement des risques d'IA."
    4_label: "Évaluation de l'impact du système d'IA"
    4_desc: "L'organisation doit définir un processus pour évaluer les conséquences potentielles pour les individus ou les groupes d'individus, ou les deux, et les sociétés qui peuvent résulter du développement, de la fourniture ou de l'utilisation de systèmes d'IA.\n\nL'évaluation de l'impact du système d'IA doit déterminer les conséquences potentielles que le déploiement, l'utilisation prévue et le mauvais usage prévisible d'un système d'IA ont sur les individus ou les groupes d'individus, ou les deux, et les sociétés.\n\nL'évaluation de l'impact du système d'IA doit prendre en compte le contexte technique et sociétal spécifique où le système d'IA est déployé et les juridictions applicables.\n\nLe résultat de l'évaluation de l'impact du système d'IA doit être documenté. Le cas échéant, le résultat de l'évaluation de l'impact du système peut être mis à disposition des parties intéressées pertinentes telles que définies par l'organisation.\n\nL'organisation doit considérer les résultats de l'évaluation de l'impact du système d'IA dans l'évaluation des risques (voir 6.1.2). A.5 dans le Tableau A.1 fournit des contrôles pour évaluer les impacts des systèmes d'IA.\n\n ℹ️NOTE\nDans certains contextes (tels que les systèmes d'IA critiques pour la sécurité ou la vie privée), l'organisation peut exiger que des évaluations d'impact spécifiques à la discipline des systèmes d'IA (par exemple, la sécurité, la vie privée ou la sécurité) soient effectuées dans le cadre des activités globales de gestion des risques d'une organisation."
  2_label: "Objectifs d'IA et planification pour les atteindre"
  2_desc: "L'organisation doit établir des objectifs d'IA aux fonctions et niveaux pertinents.\nLes objectifs d'IA doivent :\n\ta) être cohérents avec la politique d'IA (voir 5.2) ;\n\tb) être mesurables (si possible) ;\n\tc) prendre en compte les exigences applicables ;\n\td) être surveillés ;\n\te) être communiqués ;\n\tf) être mis à jour si nécessaire ;\n\tg) être disponibles en tant qu'informations documentées.\n\nLors de la planification de la manière d'atteindre ses objectifs d'IA, l'organisation doit déterminer :\n\t\t - ce qui sera fait ;\n\t\t - quelles ressources seront nécessaires ;\n\t\t - qui sera responsable ;\n\t\t - quand cela sera terminé ;\n\t\t - comment les résultats seront évalués.\n\n ℹ️NOTE\nUne liste non exhaustive d'objectifs d'IA relatifs à la gestion des risques est fournie dans l'Annexe C. Les objectifs de contrôle et les contrôles pour identifier les objectifs de développement et d'utilisation responsables des systèmes d'IA et les mesures pour les atteindre sont fournis en A.6.1 et A.9.3 dans le Tableau A.1. Un guide de mise en œuvre pour ces contrôles est fourni en B.6.1 et B.9.3."
  3_label: "Planification des changements"
  3_desc: "Lorsque l'organisation détermine la nécessité de changements dans le système de gestion de l'IA, les changements doivent être effectués de manière planifiée."
7:
  title: "Soutien"
  1_label: "Ressources"
  1_desc: "L'organisation doit déterminer et fournir les ressources nécessaires à l'établissement, à la mise en œuvre, à la maintenance et à l'amélioration continue du système de gestion de l'IA.\n\n ℹ️NOTE\nLes objectifs de contrôle et les contrôles pour les ressources d'IA sont fournis en A.4 dans le Tableau A.1. Un guide de mise en œuvre pour ces contrôles est fourni dans la clause B.4."
  2_label: "Compétence"
  2_desc: "L'organisation doit :\n\t\t - déterminer la compétence nécessaire des personnes effectuant un travail sous son contrôle qui affecte sa performance en matière d'IA ;\n\t\t - s'assurer que ces personnes sont compétentes sur la base d'une éducation, d'une formation ou d'une expérience appropriée ;\n\t\t - le cas échéant, prendre des mesures pour acquérir la compétence nécessaire et évaluer l'efficacité des mesures prises.\n\nDes informations documentées appropriées doivent être disponibles comme preuve de compétence.\n\n ℹ️NOTE 1\nUn guide de mise en œuvre pour les ressources humaines, y compris la considération de l'expertise nécessaire, est fourni en B.4.6.\n\n ℹ️NOTE 2\nLes actions applicables peuvent inclure, par exemple : la fourniture de formation, le mentorat ou la réaffectation de personnes actuellement employées ; ou l'embauche ou la sous-traitance de personnes compétentes."
  3_label: "Sensibilisation"
  3_desc: "Les personnes effectuant un travail sous le contrôle de l'organisation doivent être conscientes de :\n\t\t - la politique d'IA (voir 5.2) ;\n\t\t - leur contribution à l'efficacité du système de gestion de l'IA, y compris les avantages d'une performance améliorée de l'IA ;\n\t\t - les implications de la non-conformité avec les exigences du système de gestion de l'IA."
  4_label: "Communication"
  4_desc: "L'organisation doit déterminer les communications internes et externes pertinentes pour le système de gestion de l'IA, y compris :\n\t\t - ce qui sera communiqué ;\n\t\t - quand communiquer ;\n\t\t - avec qui communiquer ;\n\t\t - comment communiquer."
  5:
    title: "Information documentée"
    1_label: "Général"
    1_desc: "Le système de gestion de l'IA de l'organisation doit inclure :\n\ta) les informations documentées requises par ce document ;\n\tb) les informations documentées déterminées par l'organisation comme étant nécessaires à l'efficacité du système de gestion de l'IA.\n\n ℹ️NOTE\nL'étendue des informations documentées pour un système de gestion de l'IA peut différer d'une organisation à l'autre en raison de :\n\t\t - la taille de l'organisation et de son type d'activités, de processus, de produits et de services ;\n\t\t - la complexité des processus et de leurs interactions ;\n\t\t - la compétence des personnes."
    2_label: "Création et mise à jour des informations documentées"
    2_desc: "Lors de la création et de la mise à jour des informations documentées, l'organisation doit assurer l'adéquation :\n\t\t - de l'identification et de la description (par exemple, un titre, une date, un auteur ou un numéro de référence) ;\n\t\t - du format (par exemple, la langue, la version du logiciel, les graphiques) et des supports (par exemple, papier, électronique) ;\n\t\t - de la révision et de l'approbation pour l'adéquation et la pertinence."
    3_label: "Contrôle des informations documentées"
    3_desc: "Les informations documentées requises par le système de gestion de l'IA et par ce document doivent être contrôlées pour s'assurer que :\n\ta) elles sont disponibles et appropriées pour une utilisation, là et quand elles sont nécessaires ;\n\tb) elles sont protégées de manière adéquate (par exemple, contre la perte de confidentialité, l'utilisation inappropriée ou la perte d'intégrité).\n\nPour le contrôle des informations documentées, l'organisation doit traiter les activités suivantes, le cas échéant :\n\t\t - la distribution, l'accès, la récupération et l'utilisation ;\n\t\t - le stockage et la préservation, y compris la préservation de la lisibilité ;\n\t\t - le contrôle des changements (par exemple, le contrôle de version) ;\n\t\t - la conservation et l'élimination.\n\nLes informations documentées d'origine externe déterminées par l'organisation comme étant nécessaires à la planification et à l'exploitation du système de gestion de l'IA doivent être identifiées de manière appropriée et contrôlées.\n\n ℹ️NOTE\nL'accès peut impliquer une décision concernant la permission de consulter les informations documentées uniquement, ou la permission et l'autorité de consulter et de modifier les informations documentées."
8:
  title: "Exploitation"
  1_label: "Planification et contrôle opérationnels"
  1_desc: "L'organisation doit planifier, mettre en œuvre et contrôler les processus nécessaires pour répondre aux exigences et pour mettre en œuvre les actions déterminées dans la clause 6, en :\n\t\t - établissant des critères pour les processus ;\n\t\t - mettant en œuvre le contrôle des processus conformément aux critères.\n\nL'organisation doit mettre en œuvre les contrôles déterminés selon 6.1.3 qui sont liés à l'exploitation du système de gestion de l'IA (par exemple, les contrôles liés au cycle de vie du développement et de l'utilisation des systèmes d'IA).\n\nL'efficacité de ces contrôles doit être surveillée et des actions correctives doivent être envisagées si les résultats prévus ne sont pas atteints. L'Annexe A liste les contrôles de référence et l'Annexe B fournit un guide de mise en œuvre pour ceux-ci.\n\nDes informations documentées doivent être disponibles dans la mesure nécessaire pour avoir confiance que les processus ont été réalisés comme prévu.\n\nL'organisation doit contrôler les changements planifiés et examiner les conséquences des changements non intentionnels, en prenant des mesures pour atténuer tout effet indésirable, si nécessaire.\n\nL'organisation doit s'assurer que les processus, produits ou services fournis en externe qui sont pertinents pour le système de gestion de l'IA sont contrôlés."
  2_label: "Évaluation des risques d'IA"
  2_desc: "L'organisation doit effectuer des évaluations des risques d'IA conformément à 6.1.2 à des intervalles planifiés ou lorsque des changements significatifs sont proposés ou se produisent.\n\nL'organisation doit conserver des informations documentées sur les résultats de toutes les évaluations des risques d'IA."
  3_label: "Traitement des risques d'IA"
  3_desc: "L'organisation doit mettre en œuvre le plan de traitement des risques d'IA selon 6.1.3 et vérifier son efficacité.\n\nLorsque les évaluations des risques identifient de nouveaux risques nécessitant un traitement, un processus de traitement des risques conformément à 6.1.3 doit être effectué pour ces risques.\n\nLorsque les options de traitement des risques telles que définies par le plan de traitement des risques ne sont pas efficaces, ces options de traitement doivent être réexaminées et revalidées suivant le processus de traitement des risques selon 6.1.3 et le plan de traitement des risques doit être mis à jour.\n\nL'organisation doit conserver des informations documentées sur les résultats de tous les traitements des risques d'IA."
  4_label: "Évaluation de l'impact du système d'IA"
  4_desc: "L'organisation doit effectuer des évaluations de l'impact des systèmes d'IA selon 6.1.4 à des intervalles planifiés ou lorsque des changements significatifs sont proposés ou se produisent.\n\nL'organisation doit conserver des informations documentées sur les résultats de toutes les évaluations de l'impact des systèmes d'IA."
9:
  title: "Évaluation de la performance"
  1_label: "Surveillance, mesure, analyse et évaluation"
  1_desc: "L'organisation doit déterminer :\n\t\t - ce qui doit être surveillé et mesuré ;\n\t\t - les méthodes de surveillance, de mesure, d'analyse et d'évaluation, le cas échéant, pour garantir des résultats valides ;\n\t\t - quand la surveillance et la mesure doivent être effectuées ;\n\t\t - quand les résultats de la surveillance et de la mesure doivent être analysés et évalués.\n\nDes informations documentées doivent être disponibles comme preuve des résultats.\nL'organisation doit évaluer la performance et l'efficacité du système de gestion de l'IA."
  2:
    title: "Audit interne"
    1_label: "Général"
    1_desc: "L'organisation doit mener des audits internes à des intervalles planifiés pour fournir des informations sur le fait que le système de gestion de l'IA :\n\ta) est conforme :\n\t\t1) aux propres exigences de l'organisation pour son système de gestion de l'IA ;\n\t\t2) aux exigences de ce document ;\n\tb) est mis en œuvre et maintenu de manière efficace."
    2_label: "Programme d'audit interne"
    2_desc: "L'organisation doit planifier, établir, mettre en œuvre et maintenir un ou des programmes d'audit, y compris la fréquence, les méthodes, les responsabilités, les exigences de planification et les rapports.\n\nLors de l'établissement du ou des programmes d'audit interne, l'organisation doit prendre en compte l'importance des processus concernés et les résultats des audits précédents.\n\nL'organisation doit :\n\ta) définir les objectifs, les critères et la portée de chaque audit ;\n\tb) sélectionner les auditeurs et mener les audits pour assurer l'objectivité et l'impartialité du processus d'audit ;\n\tc) s'assurer que les résultats des audits sont rapportés aux gestionnaires concernés.\n\nDes informations documentées doivent être disponibles comme preuve de la mise en œuvre du ou des programmes d'audit et des résultats des audits."
  3:
    title: "Revue de direction"
    1_label: "Général"
    1_desc: "La direction doit revoir le système de gestion de l'IA de l'organisation, à des intervalles planifiés, pour assurer sa pertinence, son adéquation et son efficacité continues."
    2_label: "Entrées de la revue de direction"
    2_desc: "La revue de direction doit inclure :\n\ta) l'état des actions issues des revues de direction précédentes ;\n\tb) les changements dans les questions externes et internes pertinentes pour le système de gestion de l'IA ;\n\tc) les changements dans les besoins et attentes des parties intéressées pertinentes pour le système de gestion de l'IA ;\n\td) les informations sur la performance du système de gestion de l'IA, y compris les tendances en matière de :\n\t\t1) non-conformités et actions correctives ;\n\t\t2) résultats de la surveillance et de la mesure ;\n\t\t3) résultats des audits ;\n\te) les opportunités d'amélioration continue."
    3_label: "Résultats de la revue de direction"
    3_desc: "Les résultats de la revue de direction doivent inclure des décisions relatives aux opportunités d'amélioration continue et à tout besoin de changements dans le système de gestion de l'IA.\n\nDes informations documentées doivent être disponibles comme preuve des résultats des revues de direction."
10:
  title: "Amélioration"
  1_label: "Amélioration continue"
  1_desc: "L'organisation doit améliorer en continu la pertinence, l'adéquation et l'efficacité du système de gestion de l'IA."
  2_label: "Non-conformité et action corrective"
  2_desc: "Lorsqu'une non-conformité se produit, l'organisation doit :\n\ta) réagir à la non-conformité et, le cas échéant :\n\t\t1) prendre des mesures pour la contrôler et la corriger ;\n\t\t2) traiter les conséquences ;\n\tb) évaluer le besoin d'action pour éliminer la ou les causes de la non-conformité, afin qu'elle ne se reproduise pas ou ne se produise pas ailleurs, en :\n\t\t1) examinant la non-conformité ;\n\t\t2) déterminant les causes de la non-conformité ;\n\t\t3) déterminant si des non-conformités similaires existent ou peuvent potentiellement se produire ;\n\tc) mettre en œuvre toute action nécessaire ;\n\td) examiner l'efficacité de toute action corrective prise ;\n\te) apporter des modifications au système de gestion de l'IA, si nécessaire.\n\nLes actions correctives doivent être appropriées aux effets des non-conformités rencontrées.\nDes informations documentées doivent être disponibles comme preuve de :\n\t\t - la nature des non-conformités et de toute action ultérieure prise ;\n\t\t - les résultats de toute action corrective."
