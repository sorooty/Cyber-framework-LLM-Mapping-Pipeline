4:
  title: "How the Profile is specified"
  # Not applicable
  1_label: "General"
  1_desc: "This clause explains the technique used to specify the Profile."
  2_label: "Package structure of the Profile"
  2_desc: "The internal Package structure of the Profile is similar to the internal Package structure of the Metamodel. Whereas the Metamodel's top-level Package is ISO20022::Metamodel, the Profile's top-level Package is ISO20022::Profile. The following are the top-level Packages within the ISO20022::Profile Package: \n\t1. ISO20022::Profile::ScopeLevel; \n\t2. ISO20022::Profile::DataTypes; \n\t3. ISO20022::Profile::ConceptualLevel; \n\t4. ISO20022::Profile::LogicalLevel; \n\t5. ISO20022::Profile::ConceptualToLogicalTransformation. \n\n The ISO20022::Profile::Conceptual Package contains two Packages: \n\t- ISO20022::Profile::Conceptual::Dynamic; \n\t- ISO20022::Profile::Conceptual::Static. \n\n The ISO20022::Profile Package imports two Packages: \n\t- ISO20022::TypeLibrary::Enumerations; \n\t- ISO20022::TypeLibrary::XMLSchema. \n\n ℹ️NOTE \n The ISO20022::Profile Package contains no Package that corresponds to the ISO20022::Metamodel::ScopeToConceptual Package, because it is not necessary for the Profile to define any Stereotypes in order to implement that Metamodel Package."
  3_label: "Basic organization of the Profile specification"
  3_desc: "Clause 5 systematically outlines the Metamodel, Package by Package, defining how each Metamodel element maps to UML (it does not include the Packages of the Metamodel that the Profile does not cover, which are listed in the Scope). Within each Metamodel Package, the Metaclasses are treated in alphabetical order, and then any DataTypes contained in the Package are treated in alphabetical order. For each Metaclass and DataType, the Corresponding UML Element is specified. \n\n After outlining the ISO20022::Metamodel Package and its sub-Packages, Clause 5 covers the ISO20022::TypeLibrary Package and its sub-Packages, defining how each element maps to UML. \n\n In many cases, the definition of how an element maps to UML refers to Stereotypes and Tag Definitions that are normatively defined in Annex A."
  4_label: "Properties of the Metamodel and UML ó Tag Definitions"
  4_desc: "In outlining the Metamodel, Metaclass by Metaclass, this part of ISO 20022 lists each of the Properties of the Metaclass along with the defined approach for modelling that Property in UML. In some cases, the definition states that the Property in question maps to a Tag Definition defined in Annex A."
  5_label: "Properties of the Metamodel that correspond to existing UML Properties"
  5_desc: "In many cases, a Property of a Metaclass from the Metamodel corresponds to a UML Property already defined in the OMG's UML specification. This part of ISO 20022 explicitly defines these correspondences. In such a case, there is no need to define a Tag Definition to realize the Property in UML. \n\n In a number of these cases, the Profile defines that the corresponding UML Property is the non-navigable memberEnd of an Association in the UML specification, meaning that the Property cannot be captured in an ISO 20022-compliant UML model. In essence, this means that the Metamodel supports the back-pointer while UML does not, and there is no compelling reason to define a Tag Definition to fill the gap. The burden of tracking and setting the back-pointer via a Tagged Value would fall entirely on the modeller, unless additional code with specific knowledge of this back-pointer had been added to the UML tool."
  6_label: "AssociationEnds"
  6_desc: "UML 1.x has a Metaclass named AssociationEnd. UML 2.x does not have a Metaclass of that name; the Metaclass has been replaced by the \"memberEnd\" Property of Association. Consequently, this part of ISO  20022 refers frequently to a \"memberEnd\" of an Association, whereas UML 1.x discourse would refer to an \"AssociationEnd.\" For readability, the quotation marks have been omitted when referring to this Property, even though all other Property names are in quotation marks when they appear in narrative text."
  7_label: "Constraints"
  7_desc: "Profile Constraints are expressed in OCL. The Constraints are motivated by the fact that the Profile is an implementation of the ISO 20022 Metamodel, and they restrict the freedom of the UML modeller. UML models that do not adhere to the Constraints are not ISO 20022-compliant."
  8_label: "Figures"
  8_desc: "The definitions in Annex A of the Profile Stereotypes and Tagged Definitions include figures that use UML Profile notation to graphically depict the Stereotypes and Tag Definitions. The figures also depict the UML Metaclasses that the Stereotypes extend, and the Stereotypes' superclasses where applicable. As is typical in specifications of MOF Metamodels and UML Profiles, the diagrams duplicate some of the information contained in the narrative text. The narrative text is normative and the diagrams are non-normative."
  # Not applicable
  9_label: "How modellers choose which UML Diagrams to create"
  9_desc: "A complete overview of when to use which UML diagram can be found in ISO 20022-3."
5:
  title: "Mapping the Metamodel's elements to UML"
  # Not applicable
  1_label: "General"
  1_desc: "This clause defines how each element of the Metamodel is realized in UML."
  2:
    title: "UML realization of ISO20022::Metamodel"
    # Not applicable
    1_label: "General"
    1_desc: "This subclause defines how the elements of the ISO20022::Metamodel Package map to UML."
    2_label: "Metaclass: BusinessProcessCatalogue"
    2_desc: "\t- Corresponding UML Element: A <<BusinessProcessCatalogue>>-stereotyped Package. \n\t- Mappings of the Metaclass's Properties: \n\n repository: not implemented in the Profile; \n\n topLevelCatalogueEntry: corresponds to UML Package's \"packagedElement\" Property, which points to <<TopLevelCatalogueEntry>>-stereotyped UML Elements contained by the <<BusinessProcessCatalogue>>-stereotyped Package."
    3_label: "Metaclass: CodeSet"
    3_desc: "\t- Corresponding UML Element: A <<CodeSet>>-stereotyped Enumeration. \n\t- Mappings of the Metaclass's Properties: \n\n identificationScheme: captured via <<CodeSet>>'s \"identificationScheme\" Tag Definition; \n\n code: corresponds to UML Enumeration's \"ownedLiteral\" Property, which points to <<Code>>- stereotyped EnumerationLiterals; \n\n derivation: corresponds to the \"supplierDependency\" memberEnd of the Association between UML's NamedElement and Dependency Metaclasses (the other memberEnd of the Association is named \"supplier\"). The <<CodeSet>>-stereotyped Enumeration is the NamedElement playing the \"supplier\" role and a <<Trace>>-stereotyped Dependency plays the \"supplierDependency\" role (another <<CodeSet>>-stereotyped Enumeration is the client end of the Dependency); \n\n trace: corresponds to the \"clientDependency\" memberEnd of the Association between UML's NamedElement and Dependency Metaclasses (the other memberEnd of the Association is named \"client\"). The <<CodeSet>>-stereotyped Enumeration is the NamedElement playing the \"client\" role and a <<Trace>>-stereotyped Dependency plays the \"clientDependency\" role (another <<CodeSet>>-stereotyped Enumeration is the supplier end of the Dependency); \n\n length (inherited from Text): captured via <<CodeSet>>'s length Tag Definition; \n\n minLength (inherited from Text): captured via <<CodeSet>>'s minLength Tag Definition; \n\n maxLength (inherited from Text): captured via <<CodeSet>>'s maxLength Tag Definition."
    4_label: "Metaclass: Code"
    4_desc: "\t- Corresponding UML Element: a <<Code>>-stereotyped EnumerationLiteral. \n\t- Mappings of the Metaclass's Properties: \n\n Code value: corresponds to the \"body\" Property of the OpaqueExpression that plays the \"specification\" role for the UML EnumerationLiteral."
    5_label: "Metaclass: Constraint"
    5_desc: "\t- Corresponding UML Element: a <<Constraint>>-stereotyped Constraint. \n\t- Mappings of the Metaclass's Properties: \n\t\t- expression: corresponds to the \"body\" Property of the OpaqueExpression that plays the \"specification\" role for the UML Constraint; \n\t\t- expressionLanguage: corresponds to the \"language\" Property of the OpaqueExpression that plays the \"specification\" role for the UML Constraint."
    6_label: "Metaclass: DataDictionary"
    6_desc: "\t- Corresponding UML Element: a <<DataDictionary>>-stereotyped Package. \n\t- Mappings of the Metaclass's Properties: \n\t\t- repository: not implemented in the Profile; \n\t\t- topLevelDictionaryEntry: corresponds to UML Package's \"packagedElement\" Property, which points to <<TopLevelDictionaryEntry>>-stereotyped UML Elements contained by the <<DataDictionary>>- stereotyped Package."
    7_label: "Metaclass: IdentifierSet"
    7_desc: "\t- Stereotype: an <<IdentifierSet>>-stereotyped Class. \n\t- Mappings of the Metaclass's Properties: \n\n identificationScheme: captured via <<IdentifierSet>>'s \"identificationScheme\" Tag Definition; \n\n length (inherited from Text): captured via <<IdentifierSet>>'s length Tag Definition; \n\n minLength (inherited from Text): captured via <<IdentifierSet>>'s minLength Tag Definition; \n\n maxLength (inherited from Text): captured via <<IdentifierSet>>'s maxLength Tag Definition."
    8_label: "Metaclass: Repository"
    8_desc: "\t- Corresponding UML Element: there is no corresponding UML element. ISO 20022-compliant models do not contain an explicit element corresponding to the Metamodel's Repository Metaclass. The overall ISO 20022 Repository implicitly realizes this Metaclass. \n\t- Mappings of the Metaclass's Properties: N/A"
    9_label: "Metaclass: RepositoryConcept"
    9_desc: "\n\t- Corresponding UML Element: a NamedElement, stereotyped by one of the concrete descendants of the <<RepositoryConcept>> Stereotype. \n\t- Mappings of the Metaclass's Properties: \n\n name: corresponds to NamedElement's \"name\" Property; \n\n definition: corresponds to the \"ownedComment\" Property of UML Element. NamedElement is a descendant of Element and thus inherits the \"ownedComment\" Property. \"ownedComment\" is of type Comment, and the \"definition\" populates the \"body\" Property of Comment; \n\n example: captured via <<RepositoryConcept>>'s \"example\" Tag Definition; \n\n registrationStatus: captured via <<RepositoryConcept>>'s \"registrationStatus\" Tag Definition; \n\n removalDate: captured via <<RepositoryConcept>>'s \"removalDate\" Tag Definition; \n\n semanticMarkup: captured via <<RepositoryConcept>>'s \"semanticMarkup\" Tag Definition; \n\n constraint: corresponds to <<Constraint>>-stereotyped UML Constraints. For each such UML Constraint, the value of the \"constrainedElement\" Property points to the RepositoryConcept that owns the Constraint."
    10_label: "Metaclass: TopLevelCatalogueEntry"
    10_desc: "\n\t- Corresponding UML Element: a NamedElement, stereotyped by one of the concrete descendants of the <<TopLevelCatalogueEntry>> Stereotype. \n\t- Mappings of the Metaclass's Properties: \n\t\t- businessProcessCatalogue: corresponds to the \"owner\" Property, which UML NamedElements inherit from Element, and which points to a <<BusinessProcessCatalogue>>-stereotyped Package."
    11_label: "Metaclass: TopLevelDictionaryEntry"
    11_desc: "\n\t- Corresponding UML Element: a NamedElement, stereotyped by one of the concrete descendants of the <<TopLevelDictionaryEntry>> Stereotype. \n\t- Mappings of the Metaclass's Properties: \n\t\t- dataDictionary: corresponds to the \"owner\" Property, which UML NamedElements inherit from Element, and which points to a <<DataDictionary>>-stereotyped Package."
    12_label: "Metaclass: Trace"
    12_desc: "\t- Corresponding UML Element: a <<Trace>>-stereotyped Dependency. \n\t- Mappings of the Metaclass's Properties: Trace has no Properties of its own."
    13_label: "DataType: Cardinality"
    13_desc: "\t- Corresponding UML Element: MultiplicityElement. \n\t- Mappings of the Metaclass's Properties: \n\t\t- isOrdered: corresponds to the \"isOrdered\" Property of MultiplicityElement; \n\t\t- isUnique: corresponds to the \"isUnique\" Property of MultiplicityElement; \n\t\t- maximumOccurrence: corresponds to the \"upperValue\" Property of MultiplicityElement. If maximumOccurence contains 'UNBOUNDED' then the \"upperValue\" is literal UnlimitedNatural with value \"infinity\"; \n\t\t- minimumOccurrence: corresponds to the \"lowerValue\" Property of MultiplicityElement."
  3:
    title: "UML realization of ISO20022::Metamodel::ScopeLevel"
    # Not applicable
    1_label: "General"
    1_desc: "This subclause defines how the elements of the ISO20022::Metamodel::ScopeLevel Package map to UML."
    2_label: "Metaclass: BusinessProcess"
    2_desc: "\t- Corresponding UML Element: a <<BusinessProcess>>-stereotyped UseCase. \n\t- Mappings of the Metaclass's Properties: \n\t\t- businessRole: corresponds to the Actor memberEnd of an Association between a <<BusinessRole>>-stereotyped Actor and a <<BusinessProcess>>-stereotyped UseCase; \n\t\t- included: corresponds to the \"includingCase\" Property of the UML Include Metaclass, which is accessed via UseCase's \"include\" Property; \n\t\t- includer: corresponds to the non-navigable memberEnd of the Association between UML's Include and UseCase Metaclasses, where the navigable memberEnd is \"includingCase\"; \n\t\t- extender: corresponds to the non-navigable memberEnd of the Association between UML's Extend and UseCase Metaclasses, where the navigable memberEnd is \"extendedCase\"; \n\t\t- extended: corresponds to the \"extendedCase\" Property of the UML Extend Metaclass, which is accessed via UseCase's \"extend\" Property; \n\t\t- businessProcessTrace: corresponds to the \"ownedBehavior\" Property that UseCase inherits from BehavioredClassifier, pointing to the <<BusinessTransaction>>-stereotyped Interactions that the <<BusinessProcess>>-stereotyped UseCase owns."
    3_label: "Metaclass: BusinessRole"
    3_desc: "\t- Corresponding UML Element: a <<BusinessRole>>-stereotyped Actor. \n\t- Mappings of the Metaclass's Properties: \n\t\t- businessProcess: corresponds to the UseCase memberEnd of an Association between a <<BusinessRole>>-stereotyped Actor and a <<BusinessProcess>>-stereotyped UseCase; \n\t\t- businessRoleTrace: corresponds to the use of an instance of a <<BusinessRole>>-stereotyped Actor to represent a Lifeline in a <<BusinessTransaction>>-stereotyped Interaction."
  4:
    title: "UML realization of ISO20022::Metamodel::ScopeToConceptualTransformation"
    # Not applicable
    1_label: "General"
    1_desc: "This subclause defines how the elements of the ISO20022::Metamodel::ScopeToConceptualTransformation Package map to UML. \n\n ℹ️NOTE \n The Profile implements all of the Properties of this Package's Metaclasses via existing UML elements, so Annex A defines no Stereotypes corresponding to the elements of this Package."
    2_label: "Metaclass: BusinessProcessTrace"
    2_desc: "\t- Corresponding UML Element: a link between a <<BusinessProcess>>-stereotyped UseCase and a <<BusinessTransaction>>-stereotyped Interaction. Such a link is an instance of the UML Metamodel's Association between BehavioredClassifier and Behavior. \n\t- Mappings of the Metaclass's Properties: \n\t\t- businessProcess: corresponds to the \"context\" property that UML Interaction inherits from Behavior, which points a <<BusinessTransaction>>-stereotyped Interaction to a <<BusinessProcess>>- stereotyped UseCase. \n\t\t- businessTransaction: corresponds to the \"ownedBehavior\" Property that UseCase inherits from BehavioredClassifier, which points a <<BusinessProcess>>-stereotyped UseCase to <<BusinessTransaction>>-stereotyped Interactions."
    3_label: "Metaclass: BusinessRoleTrace"
    3_desc: "\t- Corresponding UML Element: corresponds to the binding of an instance of a <<BusinessRole>>- stereotyped Actor to a Lifeline in a <<BusinessTransaction>>-stereotyped Interaction. \n\t- Mappings of the Metaclass's Properties: businessRole: points to a <<BusinessRole>>-stereotyped Actor; participant: points to a <<BusinessTransaction>>-stereotyped Interaction."
  5:
    title: "UML realization of ISO20022::Metamodel::ConceptualLevel::Dynamic"
    # Not applicable
    1_label: "General"
    1_desc: "This subclause defines how the elements of the ISO20022::Metamodel::ConceptualLevel::Dynamic Package map to UML."
    2_label: "Metaclass: BusinessTransaction"
    2_desc: "\t- Corresponding UML Element: a <<BusinessTransaction>>-stereotyped Interaction. \n\t- Mappings of the Metaclass's Properties: \n\n businessProcessTrace: corresponds to the \"context\" Property that UML Interaction inherits from Behavior, pointing to the <<BusinessProcess>>-stereotyped UseCase that owns the <<BusinessTransaction>>-stereotyped Interaction; \n\n messageTransportMode: captured via the Tag Definitions defined for the <<BusinessTransaction>> Stereotype; \n\n parentTransaction: if \"parentTransaction\" points to the outermost BusinessTransaction, then the \"parentTransaction\" Property corresponds to the InteractionFragment's \"enclosingInteraction\" Property; otherwise, it corresponds to the InteractionFragment's \"enclosingOperand\" Property; \n\n participant: corresponds to UML Interaction's \"lifeline\" Property, pointing to the <<BusinessTransaction>>- stereotyped Interaction's <<Participant>>-stereotyped Lifelines; \n\n subTransaction: corresponds to Interaction's \"fragment\" Property; \n\n trace: not implemented by the Profile. This Property is an artefact of the mapping of the Zachman Logical level to the Physical level, which is out of scope for this Profile; \n\n transmission: corresponds to UML Interaction's \"message\" Property, which points to a <<MessageTransmission>>-stereotyped Message."
    3_label: "Metaclass: MessageTransmission"
    3_desc: "\n\t- Corresponding UML Element: a <<MessageTransmission>>-stereotyped Message. \n\t- Mappings of the Metaclass's Properties: \n\t- businessTransaction: corresponds to UML Message's \"interaction\" Property, which points to the <<BusinessTransaction>>-stereotyped Interaction that owns the <<MessageTransmission>>- stereotyped Message; \n\t\t- derivation: points indirectly to a <<MessageDefinition>>-stereotyped Signal. The indirect path by which it points to the Signal is as follows: the Message points to a MessageOccurrenceSpecification (a subclass of MessageEnd) via Message's \"receiveEvent\" Property. The MessageOccurrenceSpecification, in turn, points to a SendSignalEvent via MessageOccurrenceSpecification's \"event\" Property. The SendSignalEvent, in turn, points to a Signal via SendSignalEvent's \"signal\" Property; \n\t\t- messageTypeDescription: captured via <<MessageTransmission>>'s \"messageTypeDescription\" Tag Definition; \n\t\t- receive: corresponds to UML Message's \"receiveEvent\" Property; \n\t\t- send: corresponds to UML Message's sendEvent Property."
    4_label: "Metaclass: MessageTransportMode"
    4_desc: "\t- Corresponding UML Element: the Profile realizes the Properties of MessageTransportMode as Tag Definitions of the <<BusinessTransaction>> Stereotype. In effect, the Profile merges the BusinessTransaction and MessageTransportMode Metaclasses into one UML element, namely a <<BusinessTransaction>>-stereotyped Interaction. \n\t- Mappings of the Metaclass's Properties: \n\t\t- boundedCommunicationDelay: captured via <<BusinessTransaction>>'s \"boundedCommunicationDelay\" TagDefinition; \n\t\t- businessTransaction: not implemented in the Profile; \n\t\t- deliveryAssurance: captured via <<BusinessTransaction>>'s \"deliveryAssurance\" Tag Definition; \n\t\t- durability: captured via <<BusinessTransaction>>'s \"durability\" Tag Definition; \n\t\t- maximumClockVariation: captured via <<BusinessTransaction>>'s \"maximumClockVariation\" Tag Definition; \n\t\t- maximumMessageSize: captured via <<BusinessTransaction>>'s \"maximumMessageSize\" Tag Definition; \n\t\t- messageCasting: captured via <<BusinessTransaction>>'s \"messageCasting\" Tag Definition; \n\t\t- messageDeliveryOrder: captured via <<BusinessTransaction>>'s \"messageDeliveryOrder\" Tag Definition; \n\t\t- messageDeliveryWindow: captured via <<BusinessTransaction>>'s \"messageDeliveryWindow\" Tag Definition; \n\t\t- messageSendingWindow: captured via <<BusinessTransaction>>'s \"messageSendingWindow\" Tag Definition; \n\t\t- messageValidationLevel: captured via <<BusinessTransaction>>'s \"messageValidationLevel\" Tag Definition; \n\t\t- messageValidationOnOff: captured via <<BusinessTransaction>>'s \"messageValidationOnOff\" Tag Definition; \n\t\t- messageValidationResults: captured via <<BusinessTransaction>>'s \"messageValidationResults\" Tag Definition; \n\t\t\t- receiverAsynchronicity: captured via a <<BusinessTransaction>>'s \"receiverAsynchronicity\" Tag Definition; \n\t\t\t- senderAsynchronicity: captured via a <<BusinessTransaction>>'s \"senderAsynchronicity\" Tag Definition."
    5_label: "Metaclass: Participant"
    5_desc: "\t- Corresponding UML Element: a <<Participant>>-stereotyped Lifeline that is part of a <<BusinessTransaction>>-stereotyped Interaction. \n\t- Mappings of the Metaclass's Properties: \n\t\t- businessRoleTrace: corresponds to the binding of an instance of a <<BusinessRole>>-stereotyped Actor to a Lifeline in an Interaction; such use sets this Property to point to the Actor; \n\t\t- businessTransaction: corresponds to Lifeline's \"interaction\" Property, pointing to the <<BusinessTransaction>>-stereotyped Interaction that encloses the <<Participant>>-stereotyped Lifeline; \n\t\t- cardinality: captured via <<Participant>>'s \"minimumOccurrence\" and \"maximumOccurrence\" Tag Definitions; \n\t\t- receives: corresponds to the \"receiveEvent\" Property of a <<MessageTransmission>>-stereotyped Message for which the <<Participant>>-stereotyped Lifeline is the \"receiver\"; \n\t\t- sends: corresponds to the \"sendEvent\" Property of a <<MessageTransmission>>-stereotyped Message for which the <<Participant>>-stereotyped Lifeline is the \"sender\"."
    6_label: "Metaclass: Receive"
    6_desc: "\t- Corresponding UML Element: the \"receiveEvent\" Property of a <<MessageTransmission>>-stereotyped UML Message. \n\t- Mappings of the Metaclass's Properties: \n\t\t- messageTransmission: corresponds to the <<MessageTransmission>>-stereotyped Message that causes the receiveEvent; \n\t\t- receiver: corresponds to the <<Participant>>-stereotyped Lifeline that, in effect, receives the <<MessageTransmission>>-stereotyped Message."
    7_label: "Metaclass: Send"
    7_desc: "\n\t- Corresponding UML Element: the \"sendEvent\" Property of a <<MessageTransmission>>-stereotyped UML Message. \n\t- Mappings of the Metaclass's Properties: \n\t\t- messageTransmission: corresponds to the <<MessageTransmission>>-stereotyped Message that causes the sendEvent; \n\t\t- sender: the <<Participant>>-stereotyped Lifeline that, in effect, sends the <<MessageTransmission>>-stereotyped Message."
  6:
    title: "UML realization of ISO20022::Metamodel::ConceptualLevel::Static"
    # Not applicable
    1_label: "General"
    1_desc: "This Package defines how the elements of the ISO20022::Metamodel::ConceptualLevel::Static Package map to UML."
    2_label: "Metaclass: BusinessAssociation"
    2_desc: "\t- Corresponding UML Element: an Association whose ends are <<BusinessElement>>-stereotyped Properties. \n\t- Mappings of the Metaclass's Properties: \n\t- endA: corresponds to the first element of an instance of UML Association's \"navigableOwnedEnd\" multivalued Property, which is an ordered collection; \n\t- endB: corresponds to the second element of an instance of UML Association's \"navigableOwnedEnd\" multivalued Property."
    3_label: "Metaclass: BusinessAssociationEnd"
    3_desc: "\t- Corresponding UML Element: a <<BusinessElement>>-stereotyped Property that is the memberEnd of an Association. \n\t- Mappings of the Metaclass's Properties: \n\t\t- type: corresponds to UML Property's \"type\" Property; \n\t\t- aggregation: corresponds to UML Property's \"aggregation\" Property (see 5.11.1, which defines how the Metamodel's Aggregation Enumeration maps to UML's AggregationKind Enumeration); \n\t\t- associationForEndB: corresponds to UML Property's \"owningAssociation\" Property; \n\t\t- associationForEndA: corresponds to UML Property's \"owningAssociation\" Property."
    4_label: "Metaclass: BusinessAttribute"
    4_desc: "\t- Corresponding UML Element: a <<BusinessElement>>-stereotyped Property that is not the memberEnd of an Association. \n\t- Mappings of the Metaclass's Properties: \n\t\t- simpleType: corresponds to UML Property's \"type\" Property, pointing to a DataType; \n\t\t- complexType: corresponds to UML Property's \"type\" Property, pointing to a <<BusinessComponent>>-stereotyped Class. \n\n ℹ️NOTE \n These four Properties of BusinessAttribute all have 0..1 multiplicity in the Metamodel, and there is a Constraint that says that exactly one of them is not empty. Thus, the fact that a UML Property has only a single \"type\" Property does not conflict with the fact that four of BusinessAttribute's Properties are mapped to the single UML \"type\" Property."
    5_label: "Metaclass: BusinessComponent"
    5_desc: "\t- Corresponding UML Element: a <<BusinessComponent>>-stereotyped Class. \n\t- Mappings of the Metaclass's Properties: \n\t\t- derivation: corresponds to the \"supplierDependency\" memberEnd of the Association between UML's NamedElement and Dependency Metaclasses (the other memberEnd of the Association is named \"supplier\"). The <<BusinessComponent>>-stereotyped Class is the NamedElement playing the \"supplier\" role and a <<Trace>>-stereotyped Dependency plays the \"supplierDependency\" role (a <<MessageComponentType>>-stereotyped Class is the client end of the Dependency); \n\t\t- element: corresponds to the \"ownedAttribute\" Property of UML Class, pointing to the <<BusinessComponent>>-stereotyped Class's Properties; \n\t\t- associationDomain: corresponds to the non-navigable memberEnd of the Association between UML TypedElement and Type, where the non-navigable end is named \"type\". The <<BusinessComponent>>-stereotyped Class is the Type and the TypedElement is the union of all \"navigableOwnedEnds\" for which the <<BusinessComponent>-stereotyped Class is the Type; \n\t\t- subType: corresponds to the \"specific\" memberEnd of the composition association between UML's Classifier and Generalization Metaclasses, where the <<BusinessComponent>>-stereotyped class is the Classifier; \n\t\t- superType: corresponds to the \"general\" memberEnd of the Association between UML's Classifier and Generalization Metaclasses, where the <<BusinessComponent>>-stereotyped Class is one of the Classifiers belonging to the \"specific\" memberEnd of the Generalization considered."
    6_label: "Metaclass: BusinessElement"
    6_desc: "\t- Corresponding UML Element: a << BusinessElement>>-stereotyped Property. \n\t- Mappings of the Metaclass's Properties: \n\t\t- derivation: corresponds to the \"supplierDependency\" memberEnd of the Association between UML's NamedElement and Dependency Metaclasses (the other memberEnd of the Association is named \"supplier\"). The <<BusinessElement>>-stereotyped Property is the NamedElement playing the \"supplier\" role and a <<Trace>>-stereotyped Dependency plays the \"supplierDependency\" role (a <<MessageElement>>-stereotyped Property is the client end of the Dependency); \n\t\t- elementContext: corresponds to UML Property's \"class\" Property, pointing to the <<BusinessComponent>>-stereotyped Class that owns the <<BusinessElement>>-stereotyped Property; \n\t\t- cardinality: corresponds to Properties of the UML Metaclass MultiplicityElement that UML's Property Metaclass inherits (see above, regarding the Metamodel's Cardinality DataType for details about the correspondence between Properties of Cardinality and Properties of MultiplicityElement); \n\t\t- isDerived: corresponds to UML Property's \"isDerived\" Property."
  7:
    title: "UML realization of ISO20022::Metamodel::ConceptualToLogicalTransformation"
    # Not applicable
    1_label: "General"
    1_desc: "This subclause defines how the elements of the ISO20022::Metamodel::ConceptualToLogicalTransformation Package map to UML. \n\n ℹ️NOTE \n element B is called the \"client\"."
    2_label: "Metaclass: BusinessComponentTrace"
    2_desc: "\t- Corresponding UML Element: a <<Trace>>-stereotyped Dependency of a <<MessageComponentType>>-stereotyped Class on a <<BusinessComponent>>-stereotyped Class, or a <<Trace>>-stereotyped Dependency of a <<MessageElement>>-stereotyped Property on a <<BusinessComponent>>-stereotyped Class. \n\t- Mappings of the Metaclass's Properties: \n\t- businessComponent: corresponds to the supplier end of a <<Trace>>-stereotyped Dependency of a <<MessageComponent>>-stereotyped Class on a <<BusinessComponent>>-stereotyped Class, or of a <<MessageElement>>-stereotyped Property after <<MessageComponent>>-stereotyped Class; \n\t- messageComponentType: corresponds to the client end of a <<Trace>>-stereotyped Dependency of a <<MessageComponentType>>-stereotyped Class on a <<BusinessComponent>>-stereotyped Class; \n\t- messageElement: corresponds to the client end of a <<Trace>>-stereotyped Dependency of a <<MessageElement>>-stereotyped Property on a <<BusinessComponent>>-stereotyped Class."
    3_label: "Metaclass: BusinessElementTrace"
    3_desc: "\t- Corresponding UML Element: a <<Trace>>-stereotyped Dependency of a <<MessageElement>>- stereotyped Property on a <<BusinessElement>>-stereotyped Property. \n\t- Mappings of the Metaclass's Properties: \n\t\t- businessElement: corresponds to the supplier end of the Dependency; \n\t\t- messageElement: corresponds to the client end of the Dependency."
    4_label: "Metaclass: CodeSetTrace"
    4_desc: "\t- Corresponding UML Element: a <<Trace>>-stereotyped Dependency of a <<CodeSet>>-stereotyped Enumeration on another <<CodeSet>>-stereotyped Enumeration. \n\t- Mappings of the Metaclass's Properties: \n\n derivedCodeSet: corresponds to the client end of the Dependency; \n\n sourceCodeSet: corresponds to the supplier end of the Dependency."
    5_label: "Metaclass: MessageTypeTrace"
    5_desc: "\t- Corresponding UML Element: corresponds to the binding of a <<MessageTransmission>>-stereotyped Message to a <<MessageDefinition>>-stereotyped Signal. \n\t- Mappings of the Metaclass's Properties: \n\n messageDefinition: the Profile does not implement this Property; \n\n messageTransmission: points to a <<MessageTransmission>-stereotyped Message (see 5.5.3, which defines how a <<MessageTransmission>>-Stereotyped Message binds to a <<MessageDefinition>>- Stereotyped Signal via instances of Associations of UML's Metamodel)."
  8:
    title: "UML realization of ISO20022::Metamodel::LogicalLevel"
    # Not applicable
    1_label: "General"
    1_desc: "This subclause defines how the elements of the ISO20022::Metamodel::LogicalLevel Package map to UML."
    2_label: "Metaclass::BusinessArea"
    2_desc: "\t- Corresponding UML Element: a <<BusinessArea>>-stereotyped Class. \n\t- Mappings of the Metaclass's Properties: \n\t\t- messageDefinition: corresponds to the component memberEnd of a composition Association between the <<BusinessArea>>-stereotyped Class (the composite) and a <<MessageDefinition>>- stereotyped Signal (the component); \n\t\t- code: captured via a <<BusinessArea>> \"code\" Tag Definition."
    3_label: "Metaclass: ChoiceComponent"
    3_desc: "\t- Corresponding UML Element: a <<ChoiceComponent>>-stereotyped Class. \n\t- Mappings of the Metaclass's Properties: this Metaclass has no Properties."
    4_label: "Metaclass: ExternalSchema"
    4_desc: "\t- Corresponding UML Element: an <<ExternalSchema>>-stereotyped Class. \n\t- Mappings of the Metaclass's Properties: \n\t\t- processContent: captured via an <<ExternalSchema>>'s \"processContent\" Tag Definition; \n\t\t- namespaceList: captured via an <<ExternalSchema>>'s \"namespaceList\" Tag Definition."
    5_label: "Metaclass: MessageAssociation"
    5_desc: "\t- Corresponding UML Element: an Association, the ends of which are <<MessageElement>>-stereotyped Properties. \n\t- Mappings of the Metaclass's Properties: \n\t\t- source: corresponds to the first element of an instance of UML Association's \"navigableOwnedEnd\" multivalued Property; \n\t\t- target: corresponds to the second Element of an instance of UML Association's \"navigableOwnedEnd\" multivalued Property."
    6_label: "Metaclass: MessageAssociationEnd"
    6_desc: "\t- Corresponding UML Element: a <<MessageElement>>-stereotyped Property that is the memberEnd of an Association. \n\t- Mappings of the Metaclass's Properties: \n\t- associationForSource: corresponds to the Property's \"owningAssociation\" Property; \n\t- associationForTarget: corresponds to the Property's \"owningAssociation\" Property; \n\t- isComposite: corresponds to the Property's \"aggregation\" Property. An isComposite value of \"true\" corresponds to the UML's AggregationKind::composite EnumerationLiteral. An isComposite value of \"false\" corresponds to AggregationKind::none; \n\t- type: corresponds to the Property's \"type\" Property."
    7_label: "Metaclass: MessageAttribute"
    7_desc: "\t- Corresponding UML Element: a <<MessageElement>>-stereotyped Property that is not the memberEnd of an Association. \n\t- Mappings of the Metaclass's Properties: \n\t\t- complexType: corresponds to the Property's \"type\" Property, pointing to a <<MessageComponentType>>-stereotyped Class; \n\t\t- simpleType: corresponds to the Property's \"type\" Property, pointing to a DataType. \n\n ℹ️NOTE \n These four Properties of MessageAttribute all have 0..1 multiplicity in the Metamodel, and there is a Constraint that says that exactly one of them is not empty. Thus, the fact that a UML Property has only a single \"type\" Property does not conflict with the fact that four of MessageAttribute's Properties are mapped to the single UML \"type\" Property."
    8_label: "Metaclass: MessageBuildingBlock"
    8_desc: "\t- Corresponding UML Element: a <<MessageBuildingBlock>>-stereotyped Property that is a memberEnd of an Association between a <<MessageDefinition>>-stereotyped Signal and a <<MessageComponentType>>-stereotyped Class. The memberEnd is the one on the <<MessageComponentType>>-stereotyped Class's side of the Association. The Association in question is referred to as \"the Association\" for the remainder of 5.8.8. \n\t- Mappings of the Metaclass's Properties: \n\t\t- type: corresponds to the <<MessageComponentType>>-stereotyped Class that is a memberEnd of the Association; \n\t\t- cardinality: corresponds to the cardinality of the <MessageBuildingBlock>>-stereotyped Property. \n\n ℹ️NOTE \n In the Metamodel, the Association between MessageBuildingBlock and MessageDefinition is not navigable on the MessageDefinition memberEnd. That is why the Metamodel contains no Property corresponding to that memberEnd."
    9_label: "Metaclass: MessageComponent"
    9_desc: "\t- Corresponding UML Element: a << MessageComponent>>-stereotyped Class. \n\t- Mappings of the Metaclass's Properties: this Metaclass has no Properties."
    10_label: "Metaclass: MessageComponentType"
    10_desc: "\t- Corresponding UML Element: a Class that is stereotyped by one of the concrete subtypes of <<MessageComponentType>>. \n\t- Mappings of the Metaclass's Properties: \n\t\t- isTechnical: captured via a <<MessageComponentType>>'s \"isTechnical\" Tag Definition; \n\t\t- messageElement: corresponds to the \"ownedAttribute\" Property of UML Class; \n\t\t- trace: corresponds to the \"clientDependency\" memberEnd of the Association between UML's NamedElement and Dependency Metaclasses (the other memberEnd of the Association is named \"client\"). The <<MessageComponentType>>-stereotyped Class is the NamedElement playing the \"client\" role and a <<Trace>>-stereotyped Dependency plays the \"clientDependency\" role (a <<BusinessComponent>>-stereotyped Class is the supplier end of the Dependency); \n\t\t- messageBuildingBlock: corresponds to an Association between the <<MessageComponentType>>- stereotyped Class and a <<MessageDefinition>>-stereotyped Signal."
    11_label: "Metaclass: MessageDefinition"
    11_desc: "\t- Corresponding UML Element: a << MessageDefinition>>-stereotyped signal. \n\t- Mappings of the Metaclass's Properties: \n\t\t- businessArea: corresponds to the composite memberEnd of a composition Association between the <<MessageDefinition>>-stereotyped Signal (the component) and a <<BusinessArea>>-stereotyped Class (the composite); \n\t\t- derivation: not implemented by the Profile, because this Property relates to the Physical level; \n\t\t- messageBuildingBlock: corresponds to a memberEnd of an Association between the <<MessageDefinition>>-stereotyped Signal and a <<MessageComponentType>>-stereotyped Class. The memberEnd is the one on the <<MessageComponentType>>-stereotyped Class's side of the Association and the memberEnd is stereotyped <<MessageBuildingBlock>>; \n\t\t- messageSchema: not covered by the Profile because this is a Physical level element; \n\t\t- messageSet: corresponds to the <<Message-Set>>-stereotyped Artefacts that own a UML Manifestation in which this <<MessageDefinition>>-stereotyped Class is the utilizedElement property; \n\t\t- trace: not implemented in the Profile. In principle, this Property points to a <<MessageTransmission>>-stereotyped Message, via the inverse of the path by which a Message points to a Signal; that path is defined in 5.5.3, in the definition of the Profile's implementation of MessageTransmission's \"derivation\" Property. However, the Associations that are instantiated to construct that path are unidirectional, so the links that instantiate the Associations do not point the Signal back to the Message; \n\t- messageDefinitionIdentifier: captured via \"messageDefinitionIdentifier\" Tag Definition of <<MessageDefinition>>. Although the Metamodel dictates that an instance of the \"messageDefinitionIdentifier\" Property references an instance of the MessageDefinitionIdentifier Metaclass, in the Profile an instance of MessageDefinitionIdentifier collapses into one string that encodes the values of MessageDefinitionIdentifier's four Properties. This string is captured in the \"messageDefinitionIdentifier\" Tag Definition. The format of this string is specified in ISO 20022-3; \n\t- rootElement: captured via <<MessageDefinition>>'s \"rootElement\" Tag Definition."
    12_label: "Metaclass: MessageDefinitionIdentifier"
    12_desc: "\t- Corresponding UML Element: the four Properties of MessageDefinitionIdentifier (businessArea, messageFunctionality, flavour, and version) are encoded in <<MessageDefinition>> \"messageDefinitionIdentifier\" Tag Definition (see 5.8.11 for mapping of the MessageDefinition Metaclass's \"messageDefinitionIdentifier\" Property). \n\t- Mappings of the Metaclass's Properties: see the explanation in the previous paragraph."
    13_label: "Metaclass: MessageElement"
    13_desc: "\t- Corresponding UML Element: a << MessageElement>>-stereotyped Property. \n\t- Mappings of the Metaclass's Properties: \n\t\t- isTechnical: captured via <<MessageElement>>'s \"isTechnical\" Tag Definition; \n\t\t- businessElementTrace: corresponds to the \"clientDependency\" memberEnd of the Association between UML's NamedElement and Dependency Metaclasses (the other memberEnd of the Association is named \"client\"). The <<MessageElement>>-stereotyped Property is the NamedElement playing the \"client\" role and a <<Trace>>-stereotyped Dependency plays the \"clientDependency\" role (a <<BusinessElement>>-stereotyped Property is the supplier end of the Dependency); \n\t\t- cardinality: corresponds to Properties that UML's Property Metaclass inherits from MultiplicityElement (see 5.2.13 regarding the Metamodel's Cardinality DataType for details about relevant inherited Properties); \n\t\t- componentContext: corresponds to UML Property's \"class\" Property, which points to the <<MessageComponentType>>-stereotyped Class that owns the <<MessageElement>>-stereotyped Property; \n\t\t- isDerived: corresponds to UML Property's \"isDerived\" Property; \n\t\t- businessComponentTrace: corresponds to the \"clientDependency\" memberEnd of the Association between UML's NamedElement and Dependency Metaclasses (the other memberEnd of the Association is named \"client\"). The <<MessageElement>>-stereotyped Property is the NamedElement playing the \"client\" role and a <<Trace>>-stereotyped Dependency plays the \"clientDependency\" role (a <<BusinessComponent>>-stereotyped Property is the supplier end of the Dependency)."
    14_label: "Metaclass: MessageSet"
    14_desc: "\t- Corresponding UML Element: a << MessageSet>>-stereotyped Artefact. \n\t- Mappings of the Metaclass's Properties: \n\t\t- messageDefinition: corresponds to the utilizedElement UML Property of the UML Manifestation instance linked to the <<MessageSet>>-stereotyped Artefact via the manifestation UML Property."
  9:
    title: "UML realization of ISO20022::Metamodel::DataTypes"
    # Not applicable
    1_label: "General"
    1_desc: "For each DataType that is an element of the ISO20022::Metamodel::DataTypes Package, the Profile defines a corresponding Stereotype with the same unqualified name. Each of these Stereotypes extends the UML DataType Metaclass, each is contained in the ISO20022::Profile::DataTypes Package, and each is defined in Annex A."
    2_label: "DataType: Amount"
    2_desc: "\t- Corresponding UML Element: an <<Amount>>-stereotyped DataType. \n\t- Implementation of the DataType's Properties: \n\t\t- currencyIdentification: captured via <<Amount>>'s ìcurrencyIdentificationî Tag Definition."
    3_label: "DataType: Indicator"
    3_desc: "\t- Corresponding UML Element: an <<Indicator>>-stereotyped DataType. \n\t- Implementation of the DataType's Properties: \n\t\t- meaningWhenTrue: captured via <<Indicator>>'s ìmeaningWhenTrueî Tag Definition; \n\t\t- meaningWhenFalse: captured via <<Indicator>>'s ìmeaningWhenFalseî Tag Definition."
    4_label: "DataType: Quantity"
    4_desc: "\t- Corresponding UML Element: a <<Quantity>>-stereotyped DataType. \n\t- Implementation of the DataType's Properties: \n\t\t- unitCode: captured via a <<Quantity>>'s ìunitCodeî Tag Definition."
    5_label: "DataType: Rate"
    5_desc: "\t- Corresponding UML Element: a <<Rate>>-stereotyped DataType. \n\t- Implementation of the DataType's Properties: \n\t\t- baseValue: captured via a <<Rate>>'s ìbaseValueî Tag Definition; \n\t\t- baseUnitCode: captured via a <<Rate>>'s ìbaseUnitCodeî Tag Definition."
    6_label: "DataType: Text"
    6_desc: "\t- Corresponding UML Element: a <<Text>>-stereotyped DataType; \n\t- Implementation of the DataType's Properties: this DataType has no Properties."
  10_label: "UML realization of ISO20022::TypeLibrary::XMLSchema"
  10_desc: "\t- The Profile imports the ISO20022::TypeLibrary::XMLSchema Package. ISO 20022-compliant UML models may use only a subset of the DataTypes that the Package contains. The subset consists of the following DataTypes: \n\t\t- base64Binary; \n\t\t- boolean; \n\t\t- date; \n\t\t- dateTime; \n\t\t- decimal; \n\t\t- duration; \n\t\t- gDay; \n\t\t- gMonth; \n\t\t- gMonthDay; \n\t\t- gYear; \n\t\t- gYearMonth; \n\t\t- integer; \n\t\t- string; \n\t\t- time. \n\t- This subset of fourteen elements constitutes the set of basic DataTypes that are built into the Profile. ISO 20022-compliant models may use any element of this subset as the type of a <<BusinessElement>>- stereotyped UML Attribute or as the type of a <<MessageElement>>-stereotyped UML Attribute. \n\t- The Profile also defines (in Annex A) a corresponding Stereotype of the UML DataType Metaclass. These Stereotypes are contained in the ISO20022::Profile::DataTypes Package. The purpose of these Stereotypes is to provide UML modellers with a means to define new DataTypes that are derived from the Profile's built-in DataTypes. Thus, we refer to these Stereotypes as the Restriction Stereotypes. Each of the Restriction Stereotypes defines and/or inherits Tag Definitions that correspond to XML Schema Constraining Facets. The semantics of each of these Tag Definitions are the same as the semantics of the corresponding XML Schema Constraining Facet. The following is a list of the Restriction Stereotypes (the Restriction Stereotype that corresponds to a given built-in Profile DataType is in the same position in this list as the position of the corresponding built-in DataType in the list of the fourteen built-in DataTypes above): \n\t\t- <<Binary>> \n\t\t- <<Indicator>> \n\t\t- <<Date>> \n\t\t- <<DateTime>> \n\t\t- <<Decimal>> \n\t\t- <<Duration>> \n\t\t- <<Day>> \n\t\t- <<Month>> \n\t\t- <<MonthDay>> \n\t\t- <<Year>> \n\t\t- <<YearMonth>> \n\t\t- <<Text>> \n\t\t- <<Time> \n\t\t- Thus, for example, a modeller who wishes to define by restriction a new DataType based on the built-in month DataType shall stereotype the new DataType <<Month>> and use at least one of the defined or inherited Tag Definitions of <<Month>> to constrain the values of instances of the new DataType. For each of the Tag Definitions of the Restriction Stereotypes, the XML Schema Constraining Facet to which the Tag Definition corresponds can be inferred from the fact that the unqualified name of the Tag Definition is the same as the name of the corresponding XML Schema Constraining Facet. \n\n ℹ️NOTE \n The fact that the Profile uses a subset of the XML Schema built-in types as its set of built-in DataTypes does not mean that the Profile and models created with the Profile are XML-specific. There is nothing inherently XML-specific about the XML built-in DataTypes; the W3C XML Schema specification defines many of them in terms of pre-existing IEEE and ISO standards. Some set of primitive types had to be chosen for the Profile, and the XML Schema DataTypes have the advantage of being well known and widely supported in the computer industry. A UML model that conforms to the Profile can be used to generate not only XML as specified by ISO 20022-4, but potentially also can be used to generate other kinds of artefacts, such as EDIFACT-based or JSON-based definitions."
  11:
    title: "UML realization of ISO20022::TypeLibrary::Enumerations"
    desc: "As explained in 4.2, the Profile imports and reuses the ISO20022::TypeLibrary::Enumerations Package. There is no need for this subclause of the Profile Specification to describe each Enumeration. The Profile simply uses these Enumerations (as the types of Tag Definitions). \n\n However, the Profile does not actually use the Aggregation Enumeration, which is contained in the Enumerations Package, because UML has a nearly identical Enumeration. The remainder of this subclause is devoted to explaining how the Profile maps the Aggregation Enumeration to the corresponding UML Enumeration."
    1_label: "Enumeration: Aggregation"
    1_desc: "\t- Corresponding UML Element: AggregationKind. \n\t- Mappings of the Enumeration's EnumerationLiterals: Aggregation's EnumerationLiterals correspond exactly by name and by semantics to the EnumerationLiterals of UML's AggregationKind Enumeration. Thus an Aggregation value is set by setting the UML AggregationKind value as desired."
