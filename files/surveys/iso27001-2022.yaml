4:
  title: "Contexte de l'organisation"
  1_label: "Compréhension de l'organisation et de son contexte"
  1_desc: "L'organisation doit déterminer les enjeux externes et internes pertinents compte tenu de sa mission et qui ont une incidence sur sa capacité à obtenir le(s) résultat(s) attendu(s) de son système de management de la sécurité de l'information. \n\nℹ️ Déterminer ces enjeux revient à établir le contexte externe et interne de l'organisation étudiée dans le paragraphe 5.4.1 de l'ISO 31000:2018."
  2_label: "Compréhension des besoins et attentes des parties intéressées"
  2_desc: "L'organisation doit déterminer :\n\ta. les parties intéressées qui sont concernées par le système de management de la sécurité de l'information ;\n\tb. les exigences pertinentes de ces parties intéressées ;\n\tc. lesquelles de ces exigences seront traitées par le biais du système de management de la sécurité de l'information. \n\nℹ️ Les exigences des parties intéressées peuvent inclure des exigences légales et réglementaires et des obligations contractuelles."
  3_label: "Détermination du domaine d'application du système de management de la sécurité de l'information"
  3_desc: "Pour établir le domaine d'application du système de management de la sécurité de l'information, l'organisation doit en déterminer les limites et l'applicabilité.\nLorsque l'organisation établit ce domaine d'application, elle doit prendre en compte :\n\ta. les enjeux externes et internes auxquels il est fait référence en 4.1 ;\n\tb. les exigences auxquelles il est fait référence en 4.2 ;\n\tc. les interfaces et les dépendances existant entre les activités réalisées par l'organisation et celles réalisées par d'autres organisations.\nLe domaine d'application doit être disponible sous la forme d'une information documentée."
  4_label: "Système de management de la sécurité de l'information"
  4_desc: "L'organisation doit établir, mettre en œuvre, tenir à jour et améliorer en continu un système de management de la sécurité de l'information, y compris les processus nécessaires et leurs interactions, en accord avec les exigences du présent document."
5:
  title: "Leadership"
  1_label: "Leadership et engagement"
  1_desc: "La direction doit faire preuve de leadership et affirmer son engagement en faveur du système de management de la sécurité de l'information en :\n\ta. s'assurant qu'une politique et des objectifs sont établis en matière de sécurité de l'information et qu'ils sont compatibles avec l'orientation stratégique de l'organisation ;\n\tb. s'assurant que les exigences liées au système de management de la sécurité de l'information sont intégrées aux processus métiers de l'organisation ;\n\tc. s'assurant que les ressources nécessaires pour le système de management de la sécurité de l'information sont disponibles ;\n\td. communiquant sur l'importance de disposer d'un management de la sécurité de l'information efficace et de se conformer aux exigences du système de management de la sécurité de l'information ;\n\te. s'assurant que le système de management de la sécurité de l'information produit le(s) résultat(s) escompté(s) ;  \n\tf. orientant et soutenant les personnes pour qu'elles contribuent à l'efficacité du système de management de la sécurité de l'information ;\n\tg. promouvant l'amélioration continue ; et \n\th. aidant les autres managers concernés à faire également preuve de leadership dès lors que cela s'applique à leurs domaines de responsabilités.\n\nℹ️ Dans le présent document, il est possible d'interpréter le terme « métier » au sens large, c'est-à-dire comme se référant aux activités liées à la finalité de l'organisation."
  2_label: "Politique"
  2_desc: "La direction doit établir une politique de sécurité de l'information qui :\n\ta. est appropriée à la mission de l'organisation ;\n\tb. inclut des objectifs de sécurité de l'information (voir 6.2) ou fournit un cadre pour l'établissement de ces objectifs ;\n\tc. inclut l'engagement de satisfaire aux exigences applicables en matière de sécurité de l'information ;\n\td. inclut l'engagement d'œuvrer pour l'amélioration continue du système de management de la sécurité de l'information. La politique de sécurité de l'information doit :\n\te. être disponible sous forme d'information documentée ;\n\tf. être communiquée au sein de l'organisation ;\n\tg. être mise à la disposition des parties intéressées, le cas échéant."
  3_label: "Rôles, responsabilités et autorités au sein de l'organisation"
  3_desc: "La direction doit s'assurer que les responsabilités et autorités des rôles concernés par la sécurité de l'information sont attribuées et communiquées au sein de l'organisation. La direction doit attribuer la responsabilité et l'autorité pour :\n\ta. s'assurer que le système de management de la sécurité de l'information est conforme aux exigences du présent document ;\n\tb. rendre compte à la direction des performances du système de management de la sécurité de l'information.\n\nℹ️ La direction peut également attribuer des responsabilités et autorités pour rendre compte des performances du système de management de la sécurité de l'information au sein de l'organisation."
6:
  title: "Planification"
  1:
    title: "Actions à mettre en œuvre face aux risques et opportunités"
    1_label: "Généralités"
    1_desc: "Lorsqu'il conçoit son système de management de la sécurité de l'information, l'organisation doit tenir compte des enjeux de 4.1 et des exigences de 4.2, et déterminer les risques et opportunités qui nécessitent d'être abordés pour :\n\ta. s'assurer que le système de management de la sécurité de l'information peut atteindre le(s) résultat(s) escompté(s) ;\nb) empêcher ou limiter les effets indésirables ; et\n\tc. obtenir une démarche d'amélioration continue. L'organisation doit planifier :\n\td. les actions menées pour traiter ces risques et opportunités ; et\n\te. la manière :\n\t\t1. d'intégrer et de mettre en œuvre les actions au sein des processus du système de management de la sécurité de l'information ; et\n\t\t2. d'évaluer l'efficacité de ces actions."
    2_label: "Appréciation des risques de sécurité de l'information"
    2_desc: "L'organisation doit définir et appliquer un processus d'appréciation des risques de sécurité de l'information qui :\n\ta. établit et tient à jour les critères de risque de sécurité de l'information incluant :\n\t\t1. les critères d'acceptation des risques ;\n\t\t2. les critères de réalisation des appréciations des risques de sécurité de l'information ;\nb. s'assure que la répétition de ces appréciations des risques produit des résultats cohérents, valides et comparables ;\n\tc. identifie les risques de sécurité de l'information :\n\t\t1. applique le processus d'appréciation des risques de sécurité de l'information pour identifier les risques de perte de confidentialité, d'intégrité et de disponibilité des informations entrant dans le domaine d'application du système de management de la sécurité de l'information ; et\n\t\t2. identifie les propriétaires des risques ;\n\td. analyse les risques de sécurité de l'information :\n\t\t1. apprécie les conséquences potentielles dans le cas où les risques identifiés en 6.1.2 c) 1) se concrétisaient ;\n\t\t2. procède à une évaluation réaliste de la vraisemblance d'apparition des risques identifiés en 6.1.2 c) 1) ; et\n\t\t3. détermine les niveaux des risques ;\ne. évalue les risques de sécurité de l'information :\n\t\t1. compare les résultats d'analyse des risques avec les critères de risque déterminés en 6.1.2 a) ; et\n\t\t2. priorise les risques analysés pour le traitement des risques. \n L'organisation doit conserver des informations documentées sur le processus d'appréciation des risques de sécurité de l'information."
    3_label: "Traitement des risques de sécurité de l'information"
    3_desc: "L'organisation doit définir et appliquer un processus de traitement des risques de sécurité de l'information pour :\n\ta. choisir les options de traitement des risques appropriées, en tenant compte des résultats de l'appréciation des risques ;\n\tb. déterminer toutes les mesures de sécurité nécessaires à la mise en œuvre de(s) (l')option(s) de traitement des risques de sécurité de l'information choisie(s) ;\n\nℹ️1. Les organisations peuvent concevoir ces mesures de sécurité, le cas échéant, ou bien les identifier à partir de n'importe quelle source.\n\tc. comparer les mesures de sécurité déterminées ci-dessus en 6.1.3 b) avec celles de l'Annexe A et vérifier qu'aucune mesure de sécurité nécessaire n'a été omise ;\n\nℹ️2. L'Annexe A comporte une liste de possibles mesures de sécurité de l'information. Les utilisateurs\ndu présent document sont invités à se reporter à l'Annexe A pour s'assurer qu'aucune mesure de sécurité de l'information nécessaire n'a été négligée.\n\nℹ️3. Les mesures de sécurité de l'information énumérées dans l'Annexe A ne sont pas exhaustives et des mesures de sécurité de l'information additionnelles peuvent être incluses si nécessaires.\n\td. produire une déclaration d'applicabilité contenant :\n\t\t— les mesures de sécurité nécessaires (voir 6.1.3 b) et c)) ;\n\t\t— la justification de leur insertion ;\n\t\t— si les mesures de sécurité nécessaires sont mises en œuvre ou non ; et\n\t\t— la justification de l'exclusion de mesures de sécurité de l'Annexe A ;\n\te. élaborer un plan de traitement des risques de sécurité de l'information ; et\n\tf. obtenir des propriétaires des risques l'approbation du plan de traitement des risques et l'acceptation des risques résiduels de sécurité de l'information.\nL'organisation doit conserver des informations documentées sur le processus de traitement des risques de sécurité de l'information.\n\nℹ️4. L'appréciation des risques de sécurité de l'information et le processus de traitement figurant dans le présent document s'alignent sur les principes et les lignes directrices générales fournies dans l'ISO 31000[5]."
  2_label: "Objectifs de sécurité de l'information et plans pour les atteindre"
  2_desc: "L'organisation doit établir, aux fonctions et niveaux concernés, des objectifs de sécurité de l'information.\nLes objectifs de sécurité de l'information doivent :\n\ta. être cohérents avec la politique de sécurité de l'information ;\n\tb. être mesurables (si possible) ;\n\tc. tenir compte des exigences applicables à la sécurité de l'information, et des résultats de l'appréciation et du traitement des risques ;\n\td. être surveillés ;\n\te. être communiqués ;\n\tf. être mis à jour comme approprié ;\n\tg. être tenus à jour sous la forme d'une information documentée.\nL'organisation doit conserver des informations documentées sur les objectifs de sécurité de l'information.\nLorsqu'il planifie la façon d'atteindre ses objectifs de sécurité de l'information, l'organisation doit déterminer :\n\th. ce qui sera fait ;\n\ti. quelles ressources seront requises ;\n\tj. qui sera responsable ;\n\tk. les échéances ; et\n\tl. la façon dont les résultats seront évalués."
  3_label: "Planification des modifications"
  3_desc: "Lorsque l'organisation détermine qu'il est nécessaire de modifier le système de management de la sécurité de l'information, les modifications doivent être réalisées de façon planifiée."
7:
  title: "Supports"
  1_label: "Ressources"
  1_desc: "L'organisation doit identifier et fournir les ressources nécessaires à l'établissement, la mise en œuvre, la tenue à jour et l'amélioration continue du système de management de la sécurité de l'information."
  2_label: "Compétences"
  2_desc: "L'organisation doit :\n\ta. déterminer les compétences nécessaires de la ou des personnes effectuant, sous son contrôle, un travail qui a une incidence sur les performances de la sécurité de l'information ;\n\tb. s'assurer que ces personnes sont compétentes sur la base d'une formation initiale, d'une formation professionnelle ou d'une expérience appropriée ;\n\tc. le cas échéant, mener des actions pour acquérir les compétences nécessaires et évaluer l'efficacité des actions entreprises ; et\n\td. conserver des informations documentées appropriées comme preuves desdites compétences.\n\nℹ️ Les actions envisageables peuvent notamment inclure la formation, l'encadrement ou la réaffectation du personnel actuellement employé ou le recrutement, direct ou en sous-traitance, de personnes compétentes."
  3_label: "Sensibilisation"
  3_desc: "Les personnes effectuant un travail sous le contrôle de l'organisation doivent :\n\ta. être sensibilisées à la politique de sécurité de l'information ;\n\tb. avoir conscience de leur contribution à l'efficacité du système de management de la sécurité de l'information, y compris aux effets positifs d'une amélioration des performances de la sécurité de l'information ; et\n\tc. avoir conscience des implications de toute non-conformité aux exigences requises par le système de management de la sécurité de l'information."
  4_label: "Communication"
  4_desc: "L'organisation doit déterminer les besoins de communication interne et externe pertinents pour le système de management de la sécurité de l'information, et notamment :\n\ta. sur quels sujets communiquer ;\n\tb. quand communiquer ;\n\tc. avec qui communiquer ;\n\td. comment communiquer."
  5:
    title: "Informations documentées"
    1_label: "Généralités"
    1_desc: "Le système de management de la sécurité de l'information de l'organisation doit inclure :\n\ta. les informations documentées exigées par le présent document ; et\n\tb. les informations documentées que l'organisation juge nécessaires à l'efficacité du système de management de la sécurité de l'information.\n\nℹ️ L'étendue des informations documentées dans le cadre d'un système de management de la sécurité de l'information peut différer selon l'organisation en fonction de :\n\t\t1. la taille de l'organisation, ses domaines d'activité et ses processus, produits et services ;\n\t\t2. la complexité des processus et de leurs interactions ; et\n\t\t3. la compétence des personnes."
    2_label: "Création et mise à jour"
    2_desc: "Quand il crée et met à jour ses informations documentées, l'organisation doit s'assurer que sont appropriés :\n\ta. l'identification et la description (par exemple titre, date, auteur, numéro de référence) ;\n\tb. le format (par exemple langue, version logicielle, graphiques) et le support (par exemple, papier, électronique) ; et\n\tc. la revue et l'approbation du caractère adapté et adéquat des informations"
    3_label: "Contrôle des informations documentées"
    3_desc: "Les informations documentées exigées par le système de management de la sécurité de l'information et par le présent document doivent être contrôlées pour s'assurer :\n\ta. qu'elles sont disponibles et conviennent à l'utilisation, où et quand elles sont nécessaires ; et\n\tb. qu'elles sont convenablement protégées (par exemple contre la perte de confidentialité, l'utilisation inappropriée ou la perte d'intégrité).\nPour contrôler les informations documentées, l'organisation doit mettre en œuvre les activités suivantes, quand elles sont applicables :\n\tc. distribution, accès, récupération et utilisation ;\n\td. stockage et conservation, y compris préservation de la lisibilité ;\n\te. contrôle des modifications (par exemple, contrôle des versions) ; et\n\tf. durée de conservation et suppression.\nLes informations documentées d'origine externe que l'organisation juge nécessaires à la planification et au fonctionnement du système de management de la sécurité de l'information doivent être identifiées comme il convient et contrôlées.\n\nℹ️ L'accès peut impliquer une décision relative à l'autorisation de consulter les informations documentées uniquement, ou l'autorisation et l'autorité de consulter et modifier les informations documentées, etc."
8:
  title: "Fonctionnement"
  1_label: "Planification et contrôle opérationnels"
  1_desc: "L'organisation doit planifier, mettre en œuvre et contrôler les processus nécessaires pour satisfaire aux exigences et réaliser les actions déterminées dans l'Article 6, en :\n\t— établissant des critères pour ces processus ;\n\t— mettant en œuvre le contrôle de ces processus conformément aux critères.\nLes informations documentées doivent être disponibles dans une mesure suffisante pour avoir l'assurance que les processus ont été suivis comme prévu.\nL'organisation doit contrôler les modifications prévues, analyser les conséquences des modifications imprévues et, si nécessaire, mener des actions pour limiter tout effet négatif.\nL'organisation doit s'assurer que les processus, produits ou services fournis en externe et pertinents pour le système de management de la sécurité de l'information sont contrôlés."
  2_label: "Appréciation des risques de sécurité de l'information"
  2_desc: "L'organisation doit réaliser des appréciations des risques de sécurité de l'information à des intervalles planifiés ou quand des changements significatifs sont prévus ou ont lieu, en tenant compte des critères établis en 6.1.2 a).\nL'organisation doit conserver des informations documentées sur les résultats des processus d'appréciation des risques de sécurité de l'information."
  3_label: "Traitement des risques de sécurité de l'information"
  3_desc: "L'organisation doit mettre en œuvre le plan de traitement des risques de sécurité de l'information. \n\n L'organisation doit conserver des informations documentées sur les résultats du traitement des risques de sécurité de l'information."
9:
  title: "Évaluation de la performance"
  1_label: "Surveillance, mesurages, analyse et évaluation"
  1_desc: "L'organisation doit déterminer :\n\ta. ce qu'il est nécessaire de surveiller et de mesurer, y compris les processus et les mesures de sécurité de l'information ;\n\tb. les méthodes de surveillance, de mesurage, d'analyse et d'évaluation, selon les cas, pour assurer la validité des résultats. Il convient que les méthodes choisies donnent des résultats comparables et reproductibles pour être considérées comme valables ;\n\tc. quand la surveillance et le mesurage doivent être effectués ;\n\td. qui doit effectuer la surveillance et les mesurages ;\n\te. quand les résultats de la surveillance et du mesurage doivent être analysés et évalués ;\n\tf. qui doit analyser et évaluer ces résultats.\nDes informations documentées doivent être disponibles comme preuve des résultats.\nL'organisation doit évaluer les performances de sécurité de l'information, ainsi que l'efficacité du système de management de la sécurité de l'information."
  2:
    title: "Audit interne"
    1_label: "Généralités"
    1_desc: "L'organisation doit réaliser des audits internes à des intervalles planifiés afin de recueillir des informations permettant de déterminer si le système de management de la sécurité de l'information :\n\ta. est conforme :\n\t\t1. aux exigences propres de l'organisation concernant son système de management de la sécurité de l'information ;\n\t\t2. aux exigences du présent document ;\n\tb. est efficacement mise en œuvre et maintenu."
    2_label: "Programme d'audit interne"
    2_desc: "L'organisation doit planifier, établir, mettre en œuvre et tenir à jour ou plusieurs programmes d'audit, couvrant notamment la fréquence, les méthodes, les responsabilités, les exigences de planification et les comptes rendus.\nLors de l'établissement du ou des programmes d'audit internes, l'organisation doit tenir compte de l'importance des processus concernés et des résultats des audits précédents.\nL'organisation doit :\n\ta. définir les critères d'audit et le périmètre de chaque audit ;\n\tb. sélectionner des auditeurs et réaliser des audits qui assurent l'objectivité et l'impartialité du processus d'audit ;\n\tc. veiller à ce que les résultats des audits soient communiqués à la direction concernée\nDes informations documentées doivent être disponibles comme preuve de la mise en œuvre du ou des programmes d'audit et des résultats d'audit."
  3:
    title: "Revue de direction"
    1_label: "Généralités"
    1_desc: "À des intervalles planifiés, la direction doit procéder à la revue du système de management de la sécurité de l'information mis en place par l'organisation, afin de s'assurer qu'il est toujours approprié, adapté et efficace."
    2_label: "Éléments d'entrée de la revue de direction"
    2_desc: "La revue de direction doit prendre en considération :\n\ta. l'état d'avancement des actions décidées lors des revues de direction précédentes ;\n\tb. les modifications des enjeux externes et internes pertinents pour le système de management de la sécurité de l'information ;\n\tc. les modifications des besoins et attentes des parties intéressées, pertinentes pour le système de management de la sécurité de l'information ;\n\td. les retours sur les performances de sécurité de l'information, y compris les tendances concernant :\n\t\t1. les non-conformités et les actions correctives ;\n\t\t2. les résultats de la surveillance et du mesurage ;\n\t\t3. les résultats des audits ;\n\t\t4. la réalisation des objectifs en matière de sécurité de l'information ;\n\te. les retours d'information des parties intéressées ;\n\tf. les résultats de l'appréciation des risques et l'état d'avancement du plan de traitement des risques ;\n\tg. des opportunités d'amélioration continue."
    3_label: "Résultats des revues de direction"
    3_desc: "Les résultats de la revue de direction doivent inclure les décisions relatives aux opportunités d'amélioration continue et aux éventuels changements à apporter au système de management de la sécurité de l'information.\nDes informations documentées doivent être disponibles comme preuve des résultats des revues de direction"
10:
  title: "Amélioration"
  1_label: "Amélioration continue"
  1_desc: "L'organisation doit continuellement améliorer la pertinence, l'adéquation et l'efficacité du système de management de la sécurité de l'information."
  2_label: "Non-conformité et action corrective"
  2_desc: "Lorsqu'une non-conformité se produit, l'organisation doit :\n\ta. réagir à la non-conformité, et le cas échéant :\n\t\t1. agir pour la contrôler et la corriger ;\n\t\t2. faire face aux conséquences ;\n\tb. évaluer s'il est nécessaire de mener une action pour éliminer les causes de la non-conformité, de sorte qu'elle ne se reproduise plus, ou qu'elle ne se produise pas ailleurs, en :\n\t\t1. passant en revue la non-conformité ;\n\t\t2. déterminant les causes de non-conformité ; et\n\t\t3. recherchant si des non-conformités similaires existent ou pourraient éventuellement se produire ;\n\tc. mettant en œuvre toute action nécessaire ;\n\td. passant en revue l'efficacité de toute action corrective mise en œuvre ; et \n\te. modifiant, si nécessaire, le système de management de sécurité de l'information. Les actions correctives doivent être appropriées aux conséquences des non-conformités rencontrées. Des informations documentées doivent être disponibles comme preuve :\n\tf. de la nature des non-conformités et de toute action menée ultérieurement ;\n\tg. des résultats de toute action corrective."
11:
  title: "Mesures de sécurité organisationnelles"
  prefix: "Annexe A V"
  1_label: "Politiques de sécurité de l'information"
  1_desc: "Une politique de sécurité de l'information et des politiques spécifiques à une thématique doivent être définies, approuvées par la direction, publiées, communiquées et demandée en confirmation au personnel et aux parties intéressées concernés, ainsi que révisées à intervalles planifiés et si des changements significatifs ont lieu."
  1_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Identifier#Gouvernance#Gouvernance_et_Écosystème#Résilience"
  2_label: "Fonctions et responsabilités liées à la sécurité de l'information"
  2_desc: "Les fonctions et responsabilités liées à la sécurité de l'information doivent être définies et attribuées selon les besoins de l'organisation."
  2_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Identifier#Gouvernance#Gouvernance_et_Écosystème#Protection#Résilience"
  3_label: "Séparation des tâches"
  3_desc: "Les tâches et les domaines de responsabilité incompatibles doivent être séparés."
  3_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Gouvernance#Gestion_des_identités_et_des_accès#Gouvernance_et_Écosystème"
  4_label: "Responsabilités de la direction"
  4_desc: "La direction doit demander à tout le personnel d'appliquer les mesures de sécurité de l'information conformément à la politique de sécurité de l'information, aux politiques spécifiques à une thématique et aux procédures établies de l'organisation."
  4_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Identifier#Gouvernance#Gouvernance_et_Écosystème"
  5_label: "Contacts avec les autorités"
  5_desc: "L'organisation doit établir et maintenir le contact avec les autorités appropriées."
  5_tags: "#Préventive#Corrective#Confidentialité#Intégrité#Disponibilité#Identifier#Protéger#Répondre#Rétablir#Gouvernance#Défense#Résilience"
  6_label: "Contacts avec des groupes d'intérêt spécifiques"
  6_desc: "L'organisation doit établir et maintenir des contacts avec des groupes d'intérêt spécifiques ou autres forums spécialisés sur la sécurité et associations professionnelles."
  6_tags: "#Préventive#Corrective#Confidentialité#Intégrité#Disponibilité#Protéger#Répondre#Rétablir#Gouvernance#Défense"
  7_label: "Renseignement sur les menaces"
  7_desc: "Les informations relatives aux menaces de sécurité de l'information doivent être collectées et analysées pour produire les renseignements sur les menaces."
  7_tags: "#Préventive#Détective#Corrective#Confidentialité#Intégrité#Disponibilité#Identifier#Détecter#Répondre#Gestion_des_menaces_et_des_vulnérabilités#Défense#Résilience"
  8_label: "Sécurité de l'information dans la gestion de projet"
  8_desc: "La sécurité de l'information doit être intégrée à la gestion de projet."
  8_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Identifier#Protéger#Gouvernance#Gouvernance_et_Écosystème#Protection"
  9_label: "Inventaire des informations et autres actifs associés"
  9_desc: "Un inventaire des informations et des autres actifs associés, y compris leurs propriétaires, doit être élaboré et tenu à jour."
  9_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Identifier#Gestion_des_actifs#Gouvernance_et_Écosystème#Protection"
  10_label: "Utilisation correcte des informations et autres actifs associés"
  10_desc: "Des règles d'utilisation correcte et des procédures de traitement des informations et autres actifs associés doivent être identifiées, documentées et mises en œuvre."
  10_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Gestion_des_actifs#Protection_des_informations#Gouvernance_et_Écosystème#Protection"
  11_label: "Restitution des actifs"
  11_desc: "Le personnel et les autres parties intéressées, selon le cas, doivent restituer tous les actifs de l'organisation qui sont en leur possession au moment du changement ou de la fin de leur emploi, contrat ou accord."
  11_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Gestion_des_actifs#Protection"
  12_label: "Classification des informations"
  12_desc: "Les informations doivent être classifiées conformément aux besoins de sécurité de l'information de l'organisation, sur la base des exigences de confidentialité, d'intégrité, de disponibilité, et des exigences importantes des parties intéressées."
  12_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Identifier#Protection_des_informations#Protection#Défense"
  13_label: "Marquage des informations"
  13_desc: "Un ensemble approprié de procédures pour le marquage des informations doit être élaboré et mis en œuvre conformément au schéma de classification des informations adopté par l'organisation."
  13_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Protection_des_informations#Défense#Protection"
  14_label: "Transfert des informations"
  14_desc: "Des règles, procédures ou accords sur le transfert des informations doivent être mis en place pour tous les types de moyens de transfert au sein de l'organisation et entre l'organisation et des tierces parties."
  14_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Gestion_des_actifs#Protection_des_informations#Protection"
  15_label: "Contrôle d'accès"
  15_desc: "Des règles visant à contrôler l'accès physiques et logique aux informations et autres actifs associés doivent être définies et mises en œuvre, en fonction des exigences métier et de sécurité de l'information."
  15_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Gestion_des_identités_et_des_accès#Protection"
  16_label: "Gestion des identités"
  16_desc: "Le cycle de vie complet des identités doit être géré."
  16_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Gestion_des_identités_et_des_accès#Protection"
  17_label: "Informations d'authentification"
  17_desc: "L'attribution et la gestion des informations d'authentification doivent être contrôlées par un processus de gestion, incluant des recommandations au personnel sur l'utilisation appropriée des informations d'authentification."
  17_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Gestion_des_identités_et_des_accès#Protection"
  18_label: "Droits d'accès"
  18_desc: "Les droits d'accès aux informations et autres actifs associés doivent être pourvus, révisés, modifiés et supprimés conformément à la politique spécifique à la thématique du contrôle d'accès et aux règles de contrôle d'accès de l'organisation."
  18_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Gestion_des_identités_et_des_accès#Protection"
  19_label: "Sécurité de l'information dans les relations avec les fournisseurs"
  19_desc: "Des processus et procédures pour gérer les risques de sécurité de l'information qui sont associés à l'utilisation des produits ou services du fournisseur doivent être définis et mis en œuvre."
  19_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Identifier#Sécurité_des_relations_fournisseurs#Gouvernance_et_Écosystème#Protection"
  20_label: "La sécurité de l'information dans les accords conclus avec les fournisseurs"
  20_desc: "Les exigences de sécurité de l'information appropriées doivent être mises en place et convenues avec chaque fournisseur, selon le type de relation avec le fournisseur."
  20_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Identifier#Sécurité_des_relations_fournisseurs#Gouvernance_et_Écosystème#Protection"
  21_label: "Gestion de la sécurité de l'information dans la chaîne d'approvisionnement des technologies de l'information et de la communication (TIC)"
  21_desc: "Des processus et procédures pour gérer les risques de sécurité de l'information associés à la chaîne d'approvisionnement des produits et services TIC doivent être définis et mis en œuvre."
  21_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Identifier#Sécurité_des_relations_fournisseurs#Gouvernance_et_Écosystème#Protection"
  22_label: "Surveillance, révision et gestion des changements des services fournisseurs"
  22_desc: "L'organisation doit procéder régulièrement à la surveillance, à la révision, à l'évaluation et à la gestion des changements des pratiques de sécurité de l'information du fournisseur et de prestation de services."
  22_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Identifier#Sécurité_des_relations_fournisseurs#Assurance_de_sécurité_de_l'information#Gouvernance_et_Écosystème#Protection#Défense"
  23_label: "Sécurité de l'information dans l'utilisation de services en nuage"
  23_desc: "Les processus d'acquisition, d'utilisation, de gestion et de cessation des services en nuage doivent être établis conformément aux exigences de sécurité de l'information de l'organisation."
  23_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_des_relations_fournisseurs#Gouvernance_et_Écosystème#Protection"
  24_label: "Planification et préparation de la gestion des incidents de sécurité de l'information"
  24_desc: "L'organisation doit planifier et préparer la gestion des incidents de sécurité de l'information en procédant à la définition, à l'établissement et à la communication des processus, fonctions et responsabilités liés à la gestion des incidents de sécurité de l'information."
  24_tags: "#Corrective#Confidentialité#Intégrité#Disponibilité#Répondre#Rétablir#Gouvernance#Gestion_des_événements_de_sécurité_de_l'information#Défense"
  25_label: "Évaluation des événements de sécurité de l'information et prise de décision"
  25_desc: "L'organisation doit évaluer les événements de sécurité de l'information et décider s'ils doivent être catégorisés comme des incidents de sécurité de l'information."
  25_tags: "#Détective#Confidentialité#Intégrité#Disponibilité#Détecter#Répondre#Gestion_des_événements_de_sécurité_de_l'information#Défense"
  26_label: "Réponse aux incidents de sécurité de l'information"
  26_desc: "La réponse aux incidents de sécurité de l'information doit être conforme aux procédures documentées."
  26_tags: "#Corrective#Confidentialité#Intégrité#Disponibilité#Répondre#Rétablir#Gestion_des_événements_de_sécurité_de_l'information#Défense"
  27_label: "Tirer des enseignements des incidents de sécurité de l'information"
  27_desc: "Les connaissances acquises à partir des incidents de sécurité de l'information doivent être utilisées pour renforcer et améliorer les mesures de sécurité de l'information."
  27_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Identifier#Protéger#Gestion_des_événements_de_sécurité_de_l'information#Défense"
  28_label: "Collecte de preuves"
  28_desc: "L'organisation doit établir et mettre en œuvre des procédures pour l'identification, la collecte, l'acquisition et la préservation des preuves relatives aux événements de sécurité de l'information."
  28_tags: "#Corrective#Confidentialité#Intégrité#Disponibilité#Détecter#Répondre#Gestion_des_événements_de_sécurité_de_l'information#Défense"
  29_label: "Sécurité de l'information pendant une perturbation"
  29_desc: "L'organisation doit planifier comment maintenir la sécurité de l'information au niveau approprié pendant une perturbation."
  29_tags: "#Préventive#Corrective#Confidentialité#Intégrité#Disponibilité#Protéger#Répondre#Continuité#Protection#Résilience"
  30_label: "Préparation des TIC pour la continuité d'activité"
  30_desc: "La préparation des TIC doit être planifiée, mise en œuvre, maintenue et testée en se basant sur les objectifs de continuité d'activité et des exigences de continuité des TIC."
  30_tags: "#Corrective#Disponibilité#Répondre#Continuité#Résilience"
  31_label: "Exigences légales, statutaires, réglementaires et contractuelles"
  31_desc: "Les exigences légales, statutaires, réglementaires et contractuelles pertinentes pour la sécurité de l'information, ainsi que l'approche de l'organisation pour respecter ces exigences, doivent être identifiées, documentées et tenues à jour."
  31_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Identifier#Réglementation_et_conformité#Gouvernance_et_Écosystème#Protection"
  32_label: "Droits de propriété intellectuelle"
  32_desc: "L'organisation doit mettre en œuvre les procédures appropriées pour protéger les droits de propriété intellectuelle."
  32_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Identifier#Réglementation_et_conformité#Gouvernance_et_Écosystème"
  33_label: "Protection des enregistrements"
  33_desc: "Les enregistrements doivent être protégés de la perte, de la destruction, de la falsification, des accès non autorisés et des diffusions non autorisées."
  33_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Identifier#Protéger#Réglementation_et_conformité#Gestion_des_actifs#Protection_des_informations#Défense"
  34_label: "Protection de la vie privée et des données à caractère personnel (DCP)"
  34_desc: "L'organisation doit identifier et respecter les exigences relatives à la protection de la vie privée et des DCP conformément aux lois, réglementations et exigences contractuelles applicables."
  34_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Identifier#Protéger#Protection_des_informations#Réglementation_et_conformité#Protection"
  35_label: "Révision indépendante de la sécurité de l'information"
  35_desc: "L'approche de l'organisation pour gérer la sécurité de l'information et sa mise en œuvre, y compris les personnes, les processus et les technologies, doit être révisée de manière indépendante à intervalles planifiés, ou lorsque des changements significatifs se produisent."
  35_tags: "#Préventive#Corrective#Confidentialité#Intégrité#Disponibilité#Identifier#Protéger#Assurance_de_sécurité_de_l'information#Gouvernance_et_Écosystème"
  36_label: "Conformité aux politiques, règles et normes de sécurité de l'information"
  36_desc: "La conformité à la politique de sécurité de l'information, aux politiques spécifiques à une thématique, aux règles et aux normes de l'organisation doit être régulièrement vérifiée."
  36_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Identifier#Protéger#Réglementation_et_conformité#Assurance_de_sécurité_de_l'information#Gouvernance_et_Écosystème"
  37_label: "Procédures d'exploitation documentées"
  37_desc: "Les procédures d'exploitation des moyens de traitement de l'information doivent être documentées et mises à disposition du personnel qui en a besoin."
  37_tags: "#Préventive#Corrective#Confidentialité#Intégrité#Disponibilité#Protéger#Rétablir#Gestion_des_actifs#Sécurité_physique#Sécurité_système_et_réseau#Sécurité_des_applications#Configuration_sécurisée#Gestion_des_identités_et_des_accès#Gestion_des_menaces_et_des_vulnérabilités#Continuité#Gestion_des_événements_de_sécurité_de_l'information#Gouvernance_et_Écosystème#Protection#Défense"
12:
  title: "Mesures de sécurité applicables aux personnes"
  prefix: "Annexe A VI"
  1_label: "Sélection des candidats"
  1_desc: "Les vérifications des références de tous les candidats à l'embauche doivent être réalisées avant qu'ils n'intègrent l'organisation puis de façon continue en tenant compte des lois, des réglementations et de l'éthique applicables, et doivent être proportionnelles aux exigences métier, à la classification des informations auxquelles ils auront accès et aux risques identifiés."
  1_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_des_ressources_humaines#Gouvernance_et_Écosystème"
  2_label: "Termes et conditions du contrat de travail"
  2_desc: "Les contrats de travail doivent indiquer les responsabilités du personnel et de l'organisation en matière de sécurité de l'information."
  2_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_des_ressources_humaines#Gouvernance_et_Écosystème"
  3_label: "Sensibilisation, enseignement et formation en sécurité de l'information"
  3_desc: "Le personnel de l'organisation et les parties intéressées pertinentes doivent recevoir une sensibilisation, un enseignement et des formations en sécurité de l'information appropriés, ainsi que des mises à jour régulières de la politique de sécurité de l'information, des politiques spécifiques à une thématique et des procédures de l'organisation pertinentes à leur fonction."
  3_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_des_ressources_humaines#Gouvernance_et_Écosystème"
  4_label: "Processus disciplinaire"
  4_desc: "Un processus disciplinaire permettant de prendre des mesures à l'encontre du personnel et d'autres parties intéressées qui ont commis une violation de la politique de sécurité de l'information doit être formalisé et communiqué."
  4_tags: "#Préventive#Corrective#Confidentialité#Intégrité#Disponibilité#Protéger#Répondre#Sécurité_des_ressources_humaines#Gouvernance_et_Écosystème"
  5_label: "Responsabilités après la fin ou le changement d'un emploi"
  5_desc: "Les responsabilités et les obligations relatives à la sécurité de l'information qui restent valables après la fin ou le changement d'un emploi doivent être définies, appliquées et communiquées au personnel et autres parties intéressées pertinentes."
  5_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_des_ressources_humaines#Gestion_des_actifs#Gouvernance_et_Écosystème"
  6_label: "Accords de confidentialité ou de non-divulgation"
  6_desc: "Des accords de confidentialité ou de non-divulgation, représentant les besoins de l'organisation relatifs à la protection des informations, doivent être identifiés, documentés, régulièrement révisés et signés."
  6_tags: "#Préventive#Confidentialité#Protéger#Sécurité_des_ressources_humaines#Protection_des_informations#Relations_fournisseurs#Gouvernance_et_Écosystème"
  7_label: "Travail à distance"
  7_desc: "Des mesures de sécurité doivent être mises en œuvre lorsque le personnel travaille à distance, pour protéger les informations accessibles, traitées ou stockées en dehors des locaux de l'organisation."
  7_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Gestion_des_actifs#Protection_des_informations#Sécurité_physique#Sécurité_système_et_réseau#Protection"
  8_label: "Déclaration des événements de sécurité de l'information"
  8_desc: "L'organisation doit fournir un mécanisme au personnel pour déclarer rapidement les événements de sécurité de l'information observés ou suspectés, à travers des canaux appropriés."
  8_tags: "#Détective#Confidentialité#Intégrité#Disponibilité#Détecter#Gestion_des_événements_de_sécurité_de_l'information#Défense"
13:
  title: "Mesures de sécurité physique"
  prefix: "Annexe A VII"
  1_label: "Périmètres de sécurité physique"
  1_desc: "Des périmètres de sécurité doivent être définis et utilisés pour protéger les zones qui contiennent les informations et autres actifs associés."
  1_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_physique#Protection"
  2_label: "Les entrées physiques"
  2_desc: "Les zones sécurisées doivent être protégées par des mesures de sécurité des accès et des points d'accès appropriés."
  2_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_physique#Gestion_des_identités_et_des_accès#Protection"
  3_label: "Sécurisation des bureaux, des salles et des installations"
  3_desc: "Des mesures de sécurité physique pour les bureaux, les salles et les installations doivent être conçues et mises en œuvre."
  3_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_physique#Gestion_des_actifs#Protection"
  4_label: "Surveillance de la sécurité physique"
  4_desc: "Les locaux doivent être continuellement surveillés pour empêcher l'accès physique non autorisé."
  4_tags: "#Préventive#Détective#Confidentialité#Intégrité#Disponibilité#Protéger#Détecter#Sécurité_physique#Protection#Défense"
  5_label: "Protection contre les menaces physiques et environnementales"
  5_desc: "Une protection contre les menaces physiques et environnementales, telles que les catastrophes naturelles et autres menaces physiques, intentionnelles ou non intentionnelles, impactant l'infrastructure, doit être conçue et mise en œuvre."
  5_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_physique#Protection"
  6_label: "Travail dans les zones sécurisées"
  6_desc: "Des mesures de sécurité pour le travail dans les zones sécurisées doivent être conçues et mises en œuvre."
  6_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_physique#Protection"
  7_label: "Bureau propre et écran vide"
  7_desc: "Des règles du bureau vide, dégagé des documents papier et des supports de stockage amovibles, et des règles de l'écran vide pour les moyens de traitement de l'information, doivent être définies et appliquées de manière appropriée."
  7_tags: "#Préventive#Confidentialité#Protéger#Sécurité_physique#Protection"
  8_label: "Emplacement et protection du matériel"
  8_desc: "Un emplacement sécurisé pour le matériel doit être choisi et protégé."
  8_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_physique#Gestion_des_actifs#Protection"
  9_label: "Sécurité des actifs hors des locaux"
  9_desc: "Les actifs hors du site doivent être protégés."
  9_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_physique#Gestion_des_actifs#Protection"
  10_label: "Supports de stockage"
  10_desc: "Les supports de stockage doivent être gérés tout au long de leur cycle de vie d'acquisition, d'utilisation, de transport et de mise au rebut, conformément au schéma de classification et aux exigences de traitement de l'organisation."
  10_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_physique#Gestion_des_actifs#Protection"
  11_label: "Services supports"
  11_desc: "Les moyens de traitement de l'information doivent être protégés contre les coupures de courant et autres perturbations causées par des défaillances des services supports."
  11_tags: "#Préventive#Détective#Intégrité#Disponibilité#Protéger#Détecter#Sécurité_physique#Protection"
  12_label: "Sécurité du câblage"
  12_desc: "Les câbles électriques, transportant des données ou supportant les services d'information, doivent être protégés contre des interceptions, interférences ou dommages."
  12_tags: "#Préventive#Confidentialité#Disponibilité#Protéger#Sécurité_physique#Protection"
  13_label: "Maintenance du matériel"
  13_desc: "Le matériel doit être entretenu correctement pour assurer la disponibilité, l'intégrité et la confidentialité de l'information."
  13_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_physique#Gestion_des_actifs#Protection#Résilience"
  14_label: "Élimination ou recyclage sécurisé(e) du matériel"
  14_desc: "Les éléments du matériel contenant des supports de stockage doivent être vérifiés pour s'assurer que toute donnée sensible et que tout logiciel sous licence ont été supprimés ou écrasés de façon sécurisée, avant son élimination ou sa réutilisation."
  14_tags: "#Préventive#Confidentialité#Protéger#Sécurité_physique#Gestion_des_actifs#Protection"
14:
  title: "Mesures de sécurité technologiques"
  prefix: "Annexe A VIII"
  1_label: "Terminaux finaux des utilisateurs"
  1_desc: "Les informations stockées, traitées ou accessibles via les terminaux finaux des utilisateurs, doivent être protégées."
  1_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Gestion_des_actifs#Protection_des_informations#Protection"
  2_label: "Droits d'accès privilégiés"
  2_desc: "L'attribution et l'utilisation des droits d'accès privilégiés doivent être limitées et gérées."
  2_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Gestion_des_identités_et_des_accès#Protection"
  3_label: "Restriction d'accès aux informations"
  3_desc: "L'accès aux informations et autres actifs associés doit être restreint conformément à la politique spécifique à la thématique du contrôle d'accès qui a été établie."
  3_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Gestion_des_identités_et_des_accès#Protection"
  4_label: "Accès aux codes source"
  4_desc: "L'accès en lecture et en écriture au code source, aux outils de développement et aux bibliothèques de logiciels doit être géré de manière appropriée."
  4_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Gestion_des_identités_et_des_accès#Sécurité_des_applications#Configuration_sécurisée#Protection"
  5_label: "Authentification sécurisée"
  5_desc: "Des technologies et procédures d'authentification sécurisées doivent être mises en œuvre sur la base des restrictions d'accès aux informations et de la politique spécifique à la thématique du contrôle d'accès."
  5_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Gestion_des_identités_et_des_accès#Protection"
  6_label: "Dimensionnement"
  6_desc: "L'utilisation des ressources doit être surveillée et ajustée selon les besoins de dimensionnement actuels et prévus."
  6_tags: "#Préventive#Détective#Intégrité#Disponibilité#Identifier#Protéger#Détecter#Continuité#Gouvernance_et_Écosystème#Protection"
  7_label: "Protection contre les programmes malveillants (malware)"
  7_desc: "Une protection contre les programmes malveillants doit être mise en œuvre et renforcée par une sensibilisation appropriée des utilisateurs."
  7_tags: "#Préventive#Détective#Corrective#Confidentialité#Intégrité#Disponibilité#Protéger#Détecter#Sécurité_système_et_réseau#Protection_des_informations#Protection#Défense"
  8_label: "Gestion des vulnérabilités techniques"
  8_desc: "Des informations sur les vulnérabilités techniques des systèmes d'information utilisés doivent être obtenues, l'exposition de l'organisation à ces vulnérabilités doit être évaluée et des mesures appropriées doivent être prises."
  8_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Identifier#Protéger#Gestion_des_menaces_et_des_vulnérabilités#Gouvernance_et_Écosystème#Protection#Défense"
  9_label: "Gestion des configurations"
  9_desc: "Les configurations, y compris les configurations de sécurité, du matériel, des logiciels, des services et des réseaux, doivent être définies, documentées, mises en œuvre, surveillées et révisées."
  9_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Configuration_sécurisée#Protection"
  10_label: "Suppression des informations"
  10_desc: "Les informations stockées dans les systèmes d'information, les terminaux ou tout autre support de stockage doivent être supprimées lorsqu'elles ne sont plus nécessaires."
  10_tags: "#Préventive#Confidentialité#Protéger#Protection_des_informations#Réglementation_et_conformité#Protection"
  11_label: "Masquage des données"
  11_desc: "Le masquage des données doit être utilisé conformément à la politique spécifique à la thématique du contrôle d'accès de l'organisation et d'autres politiques spécifiques à une thématique associées, ainsi qu'aux exigences métier, tout en prenant en compte la législation applicable."
  11_tags: "#Préventive#Confidentialité#Protéger#Protection_des_informations#Protection"
  12_label: "Prévention de la fuite de données"
  12_desc: "Des mesures de prévention de la fuite de données doivent être appliquées aux systèmes, aux réseaux et à tous les autres terminaux qui traitent, stockent ou transmettent des informations sensibles."
  12_tags: "#Préventive#Détective#Confidentialité#Protéger#Détecter#Protection_des_informations#Protection#Défense"
  13_label: "Sauvegarde des informations"
  13_desc: "Des copies de sauvegarde de l'information, des logiciels et des systèmes doivent être conservées et testées régulièrement selon la politique spécifique à la thématique de la sauvegarde qui a été convenue."
  13_tags: "#Corrective#Intégrité#Disponibilité#Rétablir#Continuité#Protection"
  14_label: "Redondance des moyens de traitement de l'information"
  14_desc: "Des moyens de traitement de l'information doivent être mis en œuvre avec suffisamment de redondances pour répondre aux exigences de disponibilité."
  14_tags: "#Préventive#Disponibilité#Protéger#Continuité#Gestion_des_actifs#Protection#Résilience"
  15_label: "Journalisation"
  15_desc: "Des journaux qui enregistrent les activités, les exceptions, les pannes et autres événements pertinents doivent être générés, conservés, protégés et analysés."
  15_tags: "#Détective#Confidentialité#Intégrité#Disponibilité#Détecter#Gestion_des_événements_de_sécurité_de_l'information#Protection#Défense"
  16_label: "Activités de surveillance"
  16_desc: "Les réseaux, systèmes et applications doivent être surveillés pour détecter les comportements anormaux et des mesures appropriées doivent être prises pour évaluer les éventuels incidents de sécurité de l'information."
  16_tags: "#Détective#Corrective#Confidentialité#Intégrité#Disponibilité#Détecter#Répondre#Gestion_des_événements_de_sécurité_de_l'information#Défense"
  17_label: "Synchronisation des horloges"
  17_desc: "Les horloges des systèmes de traitement de l'information utilisés par l'organisation doivent être synchronisées avec des sources de temps approuvées."
  17_tags: "#Détective#Intégrité#Protéger#Détecter#Gestion_des_événements_de_sécurité_de_l'information#Protection#Défense"
  18_label: "Utilisation de programmes utilitaires à privilèges"
  18_desc: "L'utilisation des programmes utilitaires ayant la capacité de contourner les mesures de sécurité des systèmes ou des applications doit être limitée et contrôlée étroitement."
  18_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_système_et_réseau#Configuration_sécurisée#Sécurité_des_applications#Protection"
  19_label: "Installation de logiciels sur des systèmes opérationnels"
  19_desc: "Des procédures et des mesures doivent être mises en œuvre pour gérer de manière sécurisée l'installation de logiciels sur les systèmes opérationnels."
  19_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Configuration_sécurisée#Sécurité_des_applications#Protection"
  20_label: "Sécurité des réseaux"
  20_desc: "Les réseaux et les terminaux réseau doivent être sécurisés, gérés et contrôlés pour protéger les informations des systèmes et des applications."
  20_tags: "#Préventive#Détective#Confidentialité#Intégrité#Disponibilité#Protéger#Détecter#Sécurité_système_et_réseau#Protection"
  21_label: "Sécurité des services réseau"
  21_desc: "Les mécanismes de sécurité, les niveaux de service et les exigences de services des services réseau doivent être identifiés, mis en œuvre et surveillés."
  21_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_système_et_réseau#Protection"
  22_label: "Cloisonnement des réseaux"
  22_desc: "Les groupes de services d'information, d'utilisateurs et de systèmes d'information doivent être cloisonnés dans les réseaux de l'organisation."
  22_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_système_et_réseau#Protection"
  23_label: "Filtrage web"
  23_desc: "L'accès aux sites web externes doit être géré pour réduire l'exposition aux contenus malveillants."
  23_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_système_et_réseau#Protection"
  24_label: "Utilisation de la cryptographie"
  24_desc: "Des règles pour l'utilisation efficace de la cryptographie, notamment la gestion des clés cryptographiques, doivent être définies et mises en œuvre."
  24_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Configuration_sécurisée#Protection"
  25_label: "Cycle de vie de développement sécurisé"
  25_desc: "Des règles pour le développement sécurisé des logiciels et des systèmes doivent être définies et appliquées."
  25_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_des_applications#Sécurité_système_et_réseau#Protection"
  26_label: "Exigences de sécurité des applications"
  26_desc: "Les exigences de sécurité de l'information doivent être identifiées, spécifiées et approuvées lors du développement ou de l'acquisition d'applications."
  26_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_des_applications#Sécurité_système_et_réseau#Protection#Défense"
  27_label: "Principes d'ingénierie et d'architecture des systèmes sécurisés"
  27_desc: "Des principes d'ingénierie des systèmes sécurisés doivent être établis, documentés, tenus à jour et appliqués à toutes les activités de développement de systèmes d'information."
  27_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_des_applications#Sécurité_système_et_réseau#Protection"
  28_label: "Codage sécurisé"
  28_desc: "Des principes de codage sécurisé doivent être appliqués au développement de logiciels."
  28_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_des_applications#Sécurité_système_et_réseau#Protection"
  29_label: "Tests de sécurité dans le développement et l'acceptation"
  29_desc: "Des processus pour les tests de sécurité doivent être définis et mis en œuvre au cours du cycle de vie de développement."
  29_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Identifier#Sécurité_des_applications#Assurance_de_sécurité_de_l'information#Sécurité_système_et_réseau#Protection"
  30_label: "Développement externalisé"
  30_desc: "L'organisation doit diriger, contrôler et vérifier les activités relatives au développement externalisé des systèmes."
  30_tags: "#Préventive#Détective#Confidentialité#Intégrité#Disponibilité#Identifier#Protéger#Détecter#Sécurité_système_et_réseau#Sécurité_des_applications#Sécurité_des_relations_fournisseurs#Gouvernance_et_Écosystème#Protection"
  31_label: "Séparation des environnements de développement, de test et opérationnels"
  31_desc: "Les environnements de développement, de test et opérationnels doivent être séparés et sécurisés."
  31_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_des_applications#Sécurité_système_et_réseau#Protection"
  32_label: "Gestion des changements"
  32_desc: "Les changements apportés aux moyens de traitement de l'information et aux systèmes d'information doivent être soumis à des procédures de gestion des changements."
  32_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_des_applications#Sécurité_système_et_réseau#Protection"
  33_label: "Informations de test"
  33_desc: "Les informations de test doivent être sélectionnées, protégées et gérées de manière appropriée."
  33_tags: "#Préventive#Confidentialité#Intégrité#Protéger#Protection_des_informations#Protection"
  34_label: "Protection des systèmes d'information pendant les tests d'audit"
  34_desc: "Les tests d'audit et autres activités d'assurance impliquant l'évaluation des systèmes opérationnels doivent être planifiés et convenus entre le testeur et le niveau approprié de la direction."
  34_tags: "#Préventive#Confidentialité#Intégrité#Disponibilité#Protéger#Sécurité_système_et_réseau#Protection_des_informations#Gouvernance_et_Écosystème#Protection"

