2:
  title: "Principes inhérents aux BPC de l'ICH"
  1_desc: "Les essais cliniques doivent être réalisés conformément aux principes éthiques découlant de la Déclaration d’Helsinki, aux BPC et aux exigences réglementaires applicables."
  2_desc: "Avant d’entreprendre un essai, il faut évaluer les inconvénients et les risques prévisibles en fonction des avantages prévus pour le sujet et la société. Un essai doit être entrepris et poursuivi uniquement si les avantages prévus l’emportent sur les risques."
  3_desc: "Les droits, l’innocuité et le bien-être des sujets ont préséance et doivent l’emporter sur les intérêts de la science et de la société."
  4_desc: "Des renseignements cliniques et non cliniques sur le produit de recherche doivent être fournis pour étayer l’essai clinique proposé."
  5_desc: "Les essais cliniques doivent être scientifiquement sûrs et décrits selon un protocole clair et détaillé."
  6_desc: "Un essai doit être réalisé conformément au protocole ayant reçu l’approbation/opinion favorable préalable du comité d’examen de l’établissement (CEE)/comité d’éthique indépendant (CEI)."
  7_desc: "Les soins médicaux dispensés aux sujets ainsi que les décisions prises en leur nom doivent toujours être supervisés par un médecin qualifié ou, le cas échéant, par un dentiste qualifié."
  8_desc: "Toute personne participant à la réalisation d’un essai doit posséder les connaissances, la formation et l’expérience requises pour exécuter les tâches qui lui sont confiées."
  9_desc: "Il faut obtenir le consentement libre et éclairé de tous les sujets avant que ces derniers puissent participer à un essai clinique."
  10_desc: "Toutes les données concernant l’essai clinique doivent être enregistrées, traitées et stockées de manière à ce qu’elles puissent être correctement présentées, interprétées et vérifiées."
  11_desc: "La confidentialité des dossiers pouvant servir à identifier les sujets doit être protégée, conformément aux règles relatives à la protection des renseignements personnels et à la confidentialité établies dans les exigences réglementaires applicables."
  12_desc: "Les produits de recherche doivent être fabriqués, manipulés et conservés conformément aux bonnes pratiques de fabrication (BPF) applicables. Ils doivent être utilisés conformément au protocole approuvé."
  13_desc: "Des systèmes comportant des procédures visant à assurer la qualité de tous les aspects de l’essai doivent être mis en place."
3:
  title: "Comité d'examen de l'établissement/Comité d'éthique indépendant (CEE/CEI)"
  1:
    title: "Responsabilités"
    1_desc: "Un CEE/CEI doit protéger les droits, l’innocuité et le bien-être de tous les sujets. Une attention particulière doit être accordée aux essais auxquels peuvent participer des sujets vulnérables."
    2_desc: "Le CEE/CEI doit obtenir les documents suivants : \n modifications au protocole d’essai, formulaires de consentement éclairé et mises à jour des formulaires de consentement que l’investigateur a l’intention d’utiliser pour l’essai, méthodes de recrutement des sujets (p. ex., petites annonces), documentation écrite à fournir aux sujets, brochure de l’investigateur (BI), renseignements disponibles sur l’innocuité, renseignements sur la rétribution et l’indemnisation des sujets, curriculum vitae à jour et autres documents faisant état des compétences de l’investigateur ainsi que tout autre document dont il peut avoir besoin pour s’acquitter de ses responsabilités. Le CEE/CEI doit examiner l’essai clinique proposé dans un délai raisonnable et exposer son point de vue par écrit, en indiquant clairement l’essai visé, les documents examinés et les dates concernant les décisions suivantes : \n\t – approbation/opinion favorable; \n\t – modifications requises avant la formulation d’une approbation/opinion favorable; \n\t – refus/opinion négative; \n\t – abandon/interruption de l’essai par annulation d’une approbation/opinion favorable préalable."
    3_desc: "Le CEE/CEI doit tenir compte des qualifications de l’investigateur relativement à l’essai proposé en consultant son curriculum vitae ou tout autre document pertinent fourni à sa demande."
    4_desc: "Le CEE/CEI doit examiner tous les essais en cours à des intervalles appropriés, mais au moins une fois par année, pour déterminer le risque associé aux sujets humains."
    5_desc: "Le CEE/CEI peut demander que d’autres renseignements que ceux qui sont mentionnés au paragraphe 4.8.10 soient fournis aux sujets s’il estime que des renseignements additionnels contribueraient de façon notable à la protection des droits, de l’innocuité et du bien-être des sujets."
    6_desc: "Lorsqu’un essai à visées non thérapeutiques doit être réalisé avec le consentement du représentant légal du sujet (voir 4.8.12 et 4.8.14), le CEE/CEI doit déterminer si le protocole ou tout autre document proposé tient compte des questions d’ordre éthique pertinentes et satisfait aux exigences réglementaires applicables à un tel essai."
    7_desc: "Si le protocole indique qu'il est impossible d'obtenir le consentement préalable du sujet ou de son représentant légal (voir 4.8.15), le CEE/CEI doit déterminer si le protocole ou tout autre document proposé tient compte des questions d'ordre éthique pertinentes et satisfait aux exigences réglementaires applicables à l'essai prévu (p. ex., situations d'urgence)."
    8_desc: "Le CEE/CEI doit s'assurer que le montant et le mode de paiement prévus pour les sujets ne présentent aucun problème d'ordre coercitif et n'exercent pas une influence indue sur les sujets. Les paiements doivent être établis au prorata et ne pas être versés uniquement si le sujet participe à l'essai jusqu'à la fin."
    9_desc: "Le CEE/CEI doit s'assurer que l'information concernant la rétribution des sujets, incluant les modes de paiement, les montants versés et les dates de versement, figure dans le formulaire de consentement éclairé et dans tout autre document d'information à fournir aux sujets. La façon dont les paiements seront répartis doit être indiquée."
  2:
    title: "Composition, fonctions et activités"
    1_desc: "Le CEE/CEI doit comprendre un nombre raisonnable de membres possédant collectivement les qualifications et l’expérience requises pour examiner et évaluer les aspects scientifiques, médicaux et éthiques de l’essai proposé. Il est recommandé que fassent partie du CEE/CEI : \n\ta. au moins cinq membres; \n\tb. au moins un membre dont le principal domaine d’intérêt est de nature non scientifique; \n\tc. au moins un membre n’ayant aucun lien avec l’établissement ou l’endroit où l’essai doit être réalisé. \n Seuls les membres du CEE/CEI n’ayant aucun lien avec l’investigateur et le promoteur de l’essai doivent se prononcer ou formuler une opinion sur des questions relatives à l’essai. Une liste des membres du CEE/CEI et de leurs qualifications doit être tenue à jour."
    2_desc: "Le CEE/CEI doit exercer ses fonctions conformément aux procédures écrites, tenir des dossiers faisant état de ses activités et dans lesquels figurent les procès-verbaux de ses réunions et, enfin, se conformer aux BPC ainsi qu’aux exigences réglementaires applicables."
    3_desc: "Le CEE/CEI doit rendre ses décisions au cours des réunions prévues où le quorum est atteint, conformément aux procédures écrites."
    4_desc: "Seuls les membres qui participent à l’examen et aux discussions du CEE/CEI doivent se prononcer ou formuler leur opinion."
    5_desc: "L’investigateur peut fournir de l’information sur un aspect quelconque de l’essai, mais il ne doit pas prendre part aux délibérations du CEE/CEI ni se prononcer ou formuler son opinion concernant l’essai."
    6_desc: "Le CEE/CEI peut solliciter l’aide de personnes de l’extérieur qui possèdent des connaissances spécialisées dans des domaines particuliers."
  3:
    title: "Procédures"
    desc: "Le CEE/CEI doit établir et mettre par écrit les procédures qu’il devra suivre. Il doit notamment :"
    1_desc: "Indiquer le nom et les qualifications de ses membres ainsi que l’autorité sous laquelle il a été établi."
    2_desc: "Organiser et diriger des réunions et aviser ses membres de la tenue de celles-ci."
    3_desc: "Procéder à l’examen initial des essais ainsi qu’aux examens suivants."
    4_desc: "Déterminer la fréquence à laquelle les examens suivants auront lieu, s’il y a lieu."
    5_desc: "Effectuer, conformément aux exigences réglementaires applicables, un examen accéléré des modifications mineures proposées aux essais en cours ayant reçu l’approbation/opinion favorable du CEE/CEI et formuler une approbation/opinion favorable au sujet de ces modifications."
    6_desc: "Préciser qu’aucun sujet ne doit être autorisé à participer à un essai avant que le CEE/CEI ait donné par écrit une approbation/opinion favorable à cet égard."
    7_desc: "Préciser qu’aucune variante ni modification ne doit être apportée au protocole avant que le CEE/CEI ait donné par écrit une approbation/opinion favorable à cet égard, sauf lorsque le changement proposé est nécessaire pour éliminer un danger immédiat pour les sujets ou qu’il concerne uniquement un aspect logistique ou administratif de l’essai (changement de surveillant ou de numéro de téléphone, entre autres) (voir 4.5.2)."
    8_desc: "Préciser que l’investigateur doit informer rapidement le CEE/CEI : \n\ta. des variantes ou modifications apportées au protocole pour éliminer des dangers immédiats pour les sujets participant à l’essai (voir 3.3.7, 4.5.2 et 4.5.4); \n\tb. des modifications entraînant un accroissement des risques pour les sujets ou ayant une incidence considérable sur le déroulement de l’essai (voir 4.10.2); \n\tc. de toute réaction indésirable à un médicament (RIM) qui est grave et inattendue; \n\td. des nouveaux renseignements sur des éléments susceptibles de nuire à la sécurité des sujets ou au déroulement de l’essai."
    9_desc: "Veiller à ce que le CEE/CEI informe rapidement par écrit l’investigateur/établissement concernant : \n\ta. ses décisions/opinions liées à l’essai; \n\tb. les motifs inhérents à ses décisions/opinions; \n\tc. les procédures permettant d’en appeler de ses décisions/opinions."
  4:
    title: "Dossiers"
    1_prefix: "3.4"
    1_label: "Dossiers"
    1_desc: "Le CEE/CEI doit conserver tous les dossiers pertinents (procédures écrites, liste de ses membres indiquant leur profession/affiliations professionnelles, documents présentés, procès-verbaux des réunions, correspondance, etc.) pendant au moins trois ans après la fin de l’essai et les présenter sur demande aux organismes de réglementation. \n\n Le CEE/CEI peut être tenu de fournir, sur demande, aux investigateurs, aux promoteurs ou aux organismes de réglementation ses procédures écrites ou la liste de ses membres."
4:
  title: "Investigateur"
  1:
    title: "Qualifications de l’investigateur et ententes"
    1_desc: "L’investigateur doit posséder les connaissances, la formation et l’expérience nécessaires pour réaliser l’essai de façon appropriée, satisfaire à toutes les qualifications spécifiées dans les exigences réglementaires applicables et faire état de ses qualifications dans un curriculum vitae à jour et dans tout autre document pertinent demandé par le promoteur, le CEE/CEI ou les organismes de réglementation."
    2_desc: "L’investigateur doit connaître parfaitement la façon d’utiliser les produits de recherche telle qu’elle est décrite dans le protocole, la brochure de l’investigateur, la fiche d’information sur le produit et toute autre source d’information fournie par le promoteur."
    3_desc: "L’investigateur doit connaître et respecter les BPC et les exigences réglementaires applicables."
    4_desc: "L’investigateur/établissement doit autoriser le promoteur à exercer une surveillance et à effectuer une vérification et permettre aux organismes de réglementation appropriés d’effectuer des inspections."
    5_desc: "L’investigateur doit conserver une liste des personnes dûment qualifiées à qui il a délégué des fonctions importantes liées à l’essai."
  2:
    title: "Ressources adéquates"
    1_desc: "L’investigateur doit être en mesure de démontrer (au moyen de données rétrospectives) qu’il est apte à recruter le nombre requis de sujets appropriés dans les limites de la période de recrutement établie."
    2_desc: "L’investigateur doit avoir suffisamment de temps pour réaliser et compléter l’essai de façon appropriée dans les délais établis."
    3_desc: "L’investigateur doit pouvoir compter sur un nombre suffisant d’employés qualifiés et sur des installations adéquates pour la durée prévue de l’essai de manière à réaliser cet essai de façon appropriée et sûre."
    4_desc: "L’investigateur doit veiller à ce que toutes les personnes participant à l’essai soient adéquatement informées au sujet du protocole, des produits de recherche et de leurs tâches et fonctions liées à l’essai."
    5_desc: "L’investigateur doit superviser toute personne ou toute partie à qui sont déléguées des fonctions et des responsabilités effectuées à l’endroit où se déroule l’essai."
    6_desc: "Si l’investigateur/établissement fait appel aux services d’une personne ou d’une partie pour exécuter des tâches et fonctions liées à l’essai, l’investigateur/établissement doit s’assurer que cette personne ou cette partie est qualifiée pour exécuter ces tâches et fonctions liées à l’essai en vue d’assurer l’intégrité des tâches et fonctions effectuées et celle de toutes données générées."
  3:
    title: "Soins médicaux dispensés aux sujets"
    1_desc: "Un médecin qualifié (ou un dentiste, le cas échéant), qui prend part à l’essai à titre d’investigateur principal ou secondaire, doit être chargé de toutes les décisions d’ordre médical (ou dentaire) liées à l’essai."
    2_desc: "Durant ou après la participation d’un sujet à un essai, l’investigateur/établissement doit veiller à ce que des soins médicaux appropriés lui soient fournis pour tout incident thérapeutique lié à l’essai (y compris des résultats d’analyses significatifs sur le plan clinique). L’investigateur/établissement doit tenir le sujet informé des maladies intercurrentes nécessitant des soins médicaux."
    3_desc: "Il est recommandé que l’investigateur informe le médecin de premier recours du sujet du fait que celui-ci participe à l’essai si le sujet a un médecin de premier recours et s’il accepte que ce dernier soit informé."
    4_desc: "Même si un sujet n’est pas tenu de fournir les raisons qui l’incitent à se retirer prématurément d’un essai, l’investigateur doit s’efforcer, de façon raisonnable, de connaître ces raisons, tout en respectant pleinement les droits du sujet."
  4:
    title: "Communication avec le CEE/CEI"
    1_desc: "Avant d’entreprendre un essai, l’investigateur/établissement doit obtenir une approbation/opinion favorable écrite et datée du CEE/CEI concernant le protocole de l’essai, le formulaire de consentement éclairé, les mises à jour apportées au formulaire de consentement, les méthodes de recrutement des sujets (p. ex., annonces) et tout autre document d’information à fournir aux sujets."
    2_desc: "Dans la demande écrite qu’il présente au CEE/CEI, l’investigateur/établissement doit inclure un exemplaire à jour de la brochure de l’investigateur. Si cette brochure est mise à jour pendant l’essai, l’investigateur/établissement doit fournir un exemplaire de la nouvelle version au CEE/CEI."
    3_desc: "Durant l’essai, l’investigateur/établissement doit fournir au CEE/CEI tous les documents sujets à examen."
  5:
    title: "Respect du protocole"
    1_desc: "L’investigateur/établissement doit réaliser l’essai en respectant le protocole approuvé par le promoteur et, s’il y a lieu, par les organismes de réglementation, pour lequel le CEE/CEI a donné une approbation/opinion favorable. L’investigateur/établissement et le promoteur doivent signer le protocole, ou un autre contrat, pour confirmer l’entente."
    2_desc: "L’investigateur ne doit apporter aucune variante ni aucune modification au protocole sans l’autorisation du promoteur et sans que le CEE/CEI ait donné une approbation/opinion favorable après avoir examiné la modification proposée, sauf lorsque le changement proposé est nécessaire pour éliminer un danger immédiat pour les sujets participant à l’essai ou qu’il concerne uniquement un aspect logistique ou administratif de l’essai (changement de surveillant ou de numéro de téléphone, entre autres)"
    3_desc: "L’investigateur ou une personne désignée par ce dernier doit mettre par écrit et expliquer toute variante apportée au protocole approuvé."
    4_desc: "L’investigateur peut apporter une variante ou une modification au protocole pour éliminer un danger immédiat pour les sujets participant à l’essai sans obtenir l’approbation/opinion favorable du CEE/CEI. La variante ou la modification apportée, les raisons s’y rattachant et, s’il y a lieu, les modifications proposées au protocole doivent être présentées le plus tôt possible : \n\ta. au CEE/CEI pour qu’il en fasse l’examen et donne une approbation/opinion favorable; \n\tb. au promoteur pour qu’il donne son acceptation; \n\tc. aux organismes de réglementation, s’il y a lieu. "
  6:
    title: "Produit de recherche"
    1_desc: "La responsabilité des produits de recherche sur les lieux de l’essai incombe à l’investigateur/établissement."
    2_desc: "S’il y est autorisé ou obligé, l’investigateur/établissement peut/doit déléguer une partie ou la totalité des fonctions qui lui incombent relativement aux produits de recherche sur les lieux de l’essai, à un pharmacien compétent ou à une autre personne appropriée qui relève de l’investigateur/établissement."
    3_desc: "L’investigateur/établissement ou un pharmacien ou une autre personne désignés par l’investigateur/établissement doit tenir des dossiers sur les produits livrés sur les lieux de l’essai, sur les stocks, sur l’utilisation qui est faite par chaque sujet et sur les produits retournés au promoteur (ou sur tout autre moyen utilisé pour éliminer les produits non utilisés). Ces dossiers doivent comprendre les dates, les quantités, les numéros de lot ou de série, les dates de péremption (s’il y a lieu) et les numéros de code uniques attribués aux produits de recherche et aux sujets participant à l’essai. L’investigateur doit tenir des dossiers faisant état du fait que les sujets ont reçu les doses spécifiées dans le protocole et indiquant les quantités de tous les produits de recherche reçus du promoteur."
    4_desc: "Les produits de recherche doivent être conservés de la façon précisée par le promoteur (voir 5.13.2 et 5.14.3) et conformément aux exigences réglementaires applicables."
    5_desc: "L’investigateur doit veiller à ce que les produits de recherche soient utilisés conformément au protocole approuvé."
    6_desc: "L’investigateur ou une personne désignée par l’investigateur/établissement doit expliquer à chaque sujet la façon appropriée d’utiliser le produit de recherche et doit vérifier, à des intervalles appropriés, si tous les sujets suivent correctement les instructions."
  7:
    title: "Méthode de distribution au hasard et divulgation"
    1_prefix: "4.7"
    1_desc: "L’investigateur doit respecter la méthode de distribution au hasard prévue, s’il y a lieu, et doit veiller à ce que le code soit utilisé en conformité avec le protocole. S’il s’agit d’un essai à l’insu, l’investigateur doit rapidement mettre par écrit et expliquer au promoteur toute divulgation prématurée (accidentelle, attribuable à un incident thérapeutique) des produits de recherche utilisés."
  8:
    title: "Consentement éclairé des sujets participant à l’essai"
    1_desc: "Au moment d’obtenir le consentement éclairé et de fournir la documentation écrite requise, l’investigateur doit respecter les exigences réglementaires applicables, les BPC et les principes éthiques découlant de la Déclaration d’Helsinki. Avant le début de l’essai, l’investigateur doit obtenir l’approbation/opinion favorable écrite du CEE/CEI concernant le formulaire de consentement éclairé et tout autre document d’information à fournir aux sujets."
    2_desc: "Le formulaire de consentement éclairé et tout autre document d’information à fournir aux sujets doivent être révisés lorsque de nouveaux renseignements importants susceptibles d’avoir une incidence sur le consentement du sujet sont disponibles. Le formulaire de consentement éclairé et toute information écrite doivent recevoir l’approbation/opinion favorable du CEE/CEI avant d’être utilisés. Le sujet ou son représentant légal doit être informé rapidement des nouveaux renseignements pouvant influer sur le désir du sujet de continuer à participer à l’essai. Ces renseignements doivent être fournis par écrit."
    3_desc: "Ni l’investigateur ni le personnel responsable de l’essai ne doivent forcer ou influencer indûment un sujet pour qu’il participe ou continue de participer à un essai."
    4_desc: "Aucune information verbale ou écrite concernant l’essai, incluant le formulaire de consentement éclairé, ne doit contenir de termes qui amènent le sujet ou son représentant légal à renoncer ou à sembler renoncer à ses droits légaux ou qui libèrent ou semblent libérer l’investigateur, l’établissement, le promoteur ou leurs agents de leur responsabilité en cas de négligence."
    5_desc: "L’investigateur ou une personne désignée par ce dernier doit informer le sujet ou, si celui-ci est incapable de fournir un consentement éclairé, son représentant légal de tous les aspects pertinents de l’essai, y compris l’information écrite et l’approbation/opinion favorable du CEE/CEI."
    6_desc: "Les termes utilisés dans l’information verbale ou écrite concernant l’essai, incluant le formulaire de consentement éclairé, doivent être aussi peu techniques et aussi concrets que possible et doivent pouvoir être compris par le sujet ou son représentant légal ainsi que par le témoin impartial, s’il y a lieu."
    7_desc: "Avant qu’un consentement éclairé puisse être obtenu, l’investigateur ou une personne désignée par ce dernier doit laisser au sujet ou à son représentant légal suffisamment de temps pour qu’il puisse s’informer des détails liés à l’essai et décider s’il doit ou non participer à l’essai. Toutes les questions concernant l’essai doivent recevoir une réponse satisfaisante pour le sujet ou son représentant légal."
    8_desc: "Avant qu’un sujet puisse participer à l’essai, le formulaire de consentement éclairé doit être signé et daté personnellement par le sujet ou son représentant légal et par la personne qui a dirigé la discussion entourant le consentement éclairé."
    9_desc: "Si un sujet ou son représentant légal sont incapables de lire, un témoin impartial doit être présent durant toute la discussion entourant le consentement éclairé. Après que le formulaire de consentement éclairé ainsi que tout autre document d’information ont été fournis, lus et expliqués au sujet ou à son représentant légal et après que le sujet ou son représentant légal a consenti verbalement à la participation du sujet à l’essai et qu’il a, s’il est capable de le faire, signé et daté personnellement le formulaire de consentement éclairé, le témoin doit lui aussi signer et dater personnellement le formulaire. En signant le formulaire de consentement, le témoin atteste que l’information figurant sur le formulaire de consentement et tout autre document d’information a été expliquée de façon appropriée au sujet ou à son représentant légal et semble avoir été comprise par le sujet ou son représentant légal et que le consentement éclairé a été fourni librement par le sujet ou son représentant légal."
    10_desc: "Au cours de la discussion concernant le consentement éclairé, sur le formulaire de consentement éclairé et dans tout autre document d’information à fournir aux sujets, les explications suivantes doivent être données : \n\ta. le fait qu’il s’agit d’une recherche; \n\tb. le but de l’essai; \n\tc. les traitements administrés dans le cadre de l’essai et les probabilités concernant la distribution au hasard pour chaque traitement; \n\td. les procédures d’essai à suivre, y compris toutes les interventions effractives; \n\te. les responsabilités du sujet; \n\tf. les aspects de l’essai qui sont de nature expérimentale; \n\tg. les inconvénients ou les risques raisonnablement prévisibles pour le sujet et, s’il y a lieu, pour l’embryon, le fœtus ou le nourrisson; \n\th. les avantages raisonnablement escomptés (si aucun avantage médical n’est prévu pour le sujet, ce dernier doit en être informé); \n\ti. les autres méthodes et régimes de traitement qui s’offrent au sujet ainsi que les avantages et les risques importants pouvant s’y rattacher; \n\tj. les indemnités ou le traitement que pourra recevoir le sujet au cas où il aurait des séquelles à la suite de l’essai; \n\tk. la rétribution proportionnelle prévue, le cas échéant, accordée au sujet pour sa participation à l’essai; \n\tl. les dépenses prévues, le cas échéant, inhérentes à la participation du sujet à l’essai; \n\tm. le fait que la participation du sujet à l’essai est volontaire et que le sujet peut refuser de participer à l’essai ou se retirer, en tout temps, sans subir de préjudice ou perdre les avantages auxquels il a droit; \n\tn. le fait que les surveillants, les vérificateurs, le CEE/CEI et les organismes de réglementation auront directement accès au dossier médical original du sujet afin de vérifier les procédures ou les données relatives à l’essai clinique, et ce, sans divulguer de renseignements personnels concernant le sujet, dans les limites permises par les lois et règlements applicables et que, en signant un formulaire de consentement éclairé, le sujet ou son représentant légal autorise cet accès; \n\to. le fait que les dossiers permettant d’identifier le sujet resteront confidentiels et, dans les limites permises par les lois et règlements applicables, ne seront pas rendus publics (si les résultats de l’essai sont publiés, l’identité du sujet demeurera confidentielle); \n\tp. le fait que le sujet ou son représentant légal sera informé rapidement de tous renseignements additionnels pouvant influer sur le désir du sujet de continuer à participer à l’essai; \n\tq. le nom de la personne à qui s’adresser pour obtenir plus d’information concernant l’essai et les droits des sujets et celui de la personne à qui s’adresser en cas de séquelles liées à l’essai; \n\tr. les raisons pour lesquelles la participation du sujet pourrait prendre fin ou les circonstances prévisibles d’une telle éventualité; \n\ts. la durée prévue de la participation du sujet à l’essai; \n\tt. le nombre approximatif de sujets participant à l’essai."
    11_desc: "Avant sa participation à l’essai, le sujet ou son représentant légal doit recevoir un exemplaire du formulaire de consentement éclairé signé et daté et tout autre document d’information fourni aux sujets. Pendant sa participation à l’essai, le sujet ou son représentant légal doit recevoir un exemplaire des mises à jour du formulaire de consentement signé et daté et un exemplaire de toutes les modifications apportées à l’information écrite fournie aux sujets."
    12_desc: "Lorsqu’un essai clinique (à visées thérapeutiques ou non thérapeutiques) porte sur des sujets qui peuvent uniquement participer à l’essai avec le consentement de leur représentant légal (mineurs ou patients atteints de démence grave), le sujet doit être renseigné sur l’essai dans les limites de sa compréhension et, s’il le peut, le sujet doit signer et dater personnellement le formulaire de consentement éclairé."
    13_desc: "Exception faite des essais décrits au point 4.8.14, les essais à visées non thérapeutiques (essais pour lesquels aucun avantage direct pour le sujet n’est prévu), doivent être pratiqués chez des sujets qui donnent personnellement leur consentement et qui signent et datent eux-mêmes le formulaire de consentement éclairé."
    14_desc: "Les essais à visées non thérapeutiques peuvent être réalisés chez des sujets pour lesquels on a obtenu le consentement d’un représentant légal, à condition que les conditions suivantes soient respectées : \n\ta. les objectifs de l’essai ne peuvent être atteints chez des sujets qui peuvent donner personnellement un consentement éclairé; \n\tb. les risques prévisibles pour le sujet sont faibles; \n\tc. l’incidence négative sur le bien-être du sujet est faible; \n\td. l’essai n’est pas interdit par la loi; \n\te. l’approbation/opinion favorable du CEE/CEI a été obtenue expressément pour inclure de tels sujets à l’essai et couvre cet aspect. \n De tels essais, à moins d’une exception justifiée, doivent être réalisés chez des patients dont la maladie ou l’état peut être traité par le produit de recherche. Les sujets de ces essais doivent faire l’objet d’une surveillance particulièrement étroite et leur participation à l’essai doit être interrompue s’ils semblent trop bouleversés."
    15_desc: "Dans des situations d’urgence, lorsqu’il est impossible d’obtenir le consentement préalable du sujet, le consentement de son représentant légal, si celui-ci est présent, doit être demandé. Lorsqu’il est impossible d’obtenir le consentement préalable du sujet et que son représentant légal n’est pas disponible, la participation du sujet doit être assujettie aux mesures décrites dans le protocole ou dans un autre document, avec l’approbation/opinion favorable écrite du CEE/CEI, pour protéger les droits, l’innocuité et le bien-être du sujet et assurer le respect des exigences réglementaires applicables. Le sujet ou son représentant légal doit être informé de l’essai le plus rapidement possible et il faudra obtenir son consentement pour poursuivre cet essai ou tout autre consentement approprié (voir 4.8.10)."
  9:
    title: "Dossiers et rapports"
    1_prefix: "4.9.0"
    1_desc: "L’investigateur/établissement doit tenir des documents de base et des dossiers liés à l’essai qui soient adéquats et précis et qui incluent l’ensemble des observations pertinentes concernant les sujets de chaque lieu où se déroule l’essai. Les données de base doivent être attribuables, lisibles, contemporaines, originales, exactes et complètes. Les changements qui y sont apportés doivent pouvoir être retraçables, ne pas rendre l’entrée originale illisible et pouvoir être expliqués au besoin (par exemple, à l’aide d’une piste de vérification)."
    2_prefix: "4.9.1"
    2_desc: "L’investigateur doit veiller à ce que les données figurant dans les formulaires d’exposé de cas (FEC) et dans tous les autres rapports requis soient exactes, complètes, lisibles et présentées rapidement au promoteur."
    3_prefix: "4.9.2"
    3_label: "Les données consignées dans les FEC, qui sont tirées des documents de base, doivent correspondre aux données figurant dans ces documents, sinon les écarts devront être expliqués."
    4_prefix: "4.9.3"
    4_desc: "Toute modification ou correction apportée à un FEC doit être datée, paraphée et expliquée (si nécessaire) et ne doit pas rendre illisible l’entrée originale (une trace de vérification doit être conservée); cette règle s’applique aux modifications ou corrections effectuées aussi bien par écrit que par voie électronique [voir 5.18.4 n)]. Les promoteurs doivent fournir une orientation aux investigateurs ou aux représentants désignés par les investigateurs, sur la façon de faire ces corrections. Les promoteurs doivent disposer de procédures écrites pour s’assurer que les modifications ou les corrections apportées aux FEC par ses représentants désignés sont consignées, nécessaires et approuvées par l’investigateur. L’investigateur doit conserver des dossiers faisant état des modifications et des corrections."
    5_prefix: "4.9.4"
    5_desc: "L’investigateur/établissement doit tenir à jour les documents d’essai mentionnés au point 8 (Documents essentiels à la réalisation d’un essai clinique) et spécifiés dans les exigences réglementaires applicables. L’investigateur/établissement doit prendre les mesures nécessaires pour prévenir la destruction accidentelle ou prématurée de ces documents."
    6_prefix: "4.9.5"
    6_desc: "Les documents essentiels doivent être conservés pendant au moins deux ans après la dernière approbation d’une demande de mise en marché dans un pays membre de l’ICH et jusqu’à ce qu’il n’y ait plus aucune demande de mise en marché en suspens ou envisagée dans un pays membre de l’ICH ou, encore, jusqu’à ce qu’au moins deux ans se soient écoulés après la cessation officielle des activités de mise au point clinique du produit de recherche. Ces documents doivent toutefois être conservés plus longtemps si les exigences réglementaires applicables le prévoient ou si une entente a été conclue avec le promoteur à cette fin. Il incombe au promoteur d’informer l’investigateur/établissement lorsqu’il n’est plus nécessaire de conserver ces documents (voir 5.5.12)."
    7_prefix: "4.9.6"
    7_desc: "Les aspects financiers de l’essai doivent être établis par écrit dans une entente entre le promoteur et l’investigateur/établissement."
    8_prefix: "4.9.7"
    8_desc: "Sur demande du surveillant, du vérificateur, du CEE/CEI ou d’un organisme de réglementation, l’investigateur/établissement doit prendre les dispositions nécessaires pour que ces derniers aient directement accès à tous les dossiers concernant l’essai."
  10:
    title: "Rapport provisoires"
    1_desc: "L’investigateur doit présenter des résumés écrits faisant état du déroulement de l’essai au CEE/CEI une fois par année ou plus souvent, si le CEE/CEI le demande."
    2_desc: "L’investigateur doit présenter rapidement des rapports écrits au promoteur, au CEE/CEI (voir 3.3.8) et, s’il y a lieu, à l’établissement concernant toute modification susceptible d’avoir une incidence importante sur le déroulement de l’essai ou d’accroître les risques pour les sujets."
  11:
    title: "Rapport sur l’innocuité"
    1_desc: "Tous les incidents thérapeutiques graves (ITG) doivent être signalés immédiatement au promoteur, sauf ceux qui, selon le protocole ou un autre document (p. ex., brochure de l’investigateur), n’ont pas besoin d’être signalés de toute urgence. Ces rapports urgents doivent être suivis rapidement par des rapports détaillés écrits. Les rapports urgents et les rapports de suivi doivent renvoyer aux sujets uniquement par leurs numéros de code uniques plutôt que par leur nom, leur numéro d’identification personnel ou leur adresse. L’investigateur doit également respecter les exigences réglementaires applicables concernant l’obligation de signaler, aux organismes de réglementation et au CEE/CEI, les réactions indésirables graves à un médicament."
    2_desc: "Les incidents thérapeutiques ou les anomalies de laboratoire mentionnées dans le protocole comme étant fondamentaux pour les évaluations de l’innocuité doivent être signalés au promoteur, conformément aux exigences en matière de rapports et aux délais spécifiés par le promoteur dans le protocole."
    3_desc: "En ce qui concerne les décès, l’investigateur doit fournir au promoteur et au CEE/CEI toute information additionnelle requise (p. ex., rapports d’autopsie et rapports médicaux finals)."
  12:
    title: "Abandon ou interruption prématurés d’un essai"
    desc: "Si l’essai est abandonné ou interrompu prématurément pour une raison quelconque, l’investigateur/établissement doit informer rapidement les sujets participant à l’essai, veiller à ce qu’un traitement et un suivi appropriés leur soient fournis et, si les exigences réglementaires applicables le précisent, informer les organismes de réglementation. S’ajoutent à ces exigences les prescriptions suivantes :"
    1_desc: "Si l’investigateur abandonne ou interrompt un essai sans l’autorisation préalable du promoteur, il doit informer l’établissement s’il y a lieu; l’investigateur/établissement doit informer rapidement le promoteur et le CEE/CEI et leur fournir par écrit les raisons détaillées pour lesquelles l’essai a été abandonné ou interrompu."
    2_desc: "Si le promoteur abandonne ou interrompt un essai (voir 5.2.1), il doit informer rapidement l’établissement s’il y a lieu; l’investigateur/établissement doit informer rapidement le CEE/CEI et lui fournir par écrit les raisons détaillées pour lesquelles l’essai a été abandonné ou interrompu."
    3_desc: "Si le CEE/CEI abandonne ou interrompt un essai en annulant son approbation/opinion favorable (voir 3.1.2 et 3.3.9), l’investigateur doit informer l’établissement s’il y a lieu; l’investigateur/établissement doit informer rapidement le promoteur et lui fournir par écrit les raisons détaillées pour lesquelles l’essai a été abandonné ou interrompu."
  13:
    title: "Rapport final de l’investigateur"
    1_prefix: "4.13"
    1_label: "Rapport final de l’investigateur"
    1_desc: "À la fin de l’essai, l’investigateur doit informer l’établissement s’il y a lieu; l’investigateur/établissement doit fournir un sommaire des résultats de l’essai au CEE/CEI, ainsi que tous les rapports requis aux organismes de réglementation."
5:
  title: "Promoteur"
  1:
    prefix: "5.0"
    title: "Gestion de la qualité"
    desc: "Le promoteur doit mettre en place un système de gestion de la qualité à toutes les étapes de l’essai. \n\n Les promoteurs doivent se concentrer sur les activités d’essai essentielles à la protection des sujets humains et à la fiabilité des résultats. La gestion de la qualité comprend la conception de protocoles d’essais cliniques efficaces et d’outils et de procédures pour la collecte et le traitement des données, ainsi que la collecte de renseignements essentiels à la prise de décisions. \n\n Les méthodes servant à assurer et à contrôler la qualité de l’essai doivent être proportionnées aux risques inhérents de l’essai et à l’importance de l’information recueillie. Le promoteur doit veiller à ce que tous les aspects de l’essai soient réalisables sur le plan opérationnel, et éviter les complexités, la collecte de données et les procédures inutiles. Les protocoles, les formulaires d’exposé de cas et les autres documents opérationnels doivent être clairs, concis et uniformes. \n\n Le système de gestion de la qualité doit reposer sur une approche fondée sur les risques qui correspond à la description ci-dessous."
    1_prefix: "5.0.1"
    1_label: "Identification des processus et des données essentiels"
    1_desc: "Au cours de l’élaboration du protocole, le promoteur doit déterminer les processus et les données qui sont essentiels à la protection des sujets humains et à la fiabilité des résultats."
    2_prefix: "5.0.2"
    2_label: "Identification des risques"
    2_desc: "Le promoteur doit identifier les risques liés aux processus et aux données essentiels. Les risques au niveau du système (modes opératoires normalisés, systèmes informatiques, personnel) et au niveau de l’essai (conception de l’essai, collecte de données, processus en lien avec le consentement éclairé) doivent être pris en compte."
    3_prefix: "5.0.3"
    3_label: "Évaluation des risques"
    3_desc: "Le promoteur doit évaluer les risques identifiés par rapport aux contrôles de risque existants en tenant compte de ce qui suit : \n\ta. La probabilité qu’une erreur se produise. \n\tb. La mesure dans laquelle de telles erreurs sont détectables. \n\tc. Les conséquences de telles erreurs sur la protection des sujets humains et la fiabilité des résultats des essais."
    4_prefix: "5.0.4"
    4_label: "Contrôle des risques"
    4_desc: "Le promoteur doit déterminer les risques à atténuer ou à accepter. L’approche utilisée pour atténuer un risque à un niveau acceptable doit être proportionnelle à l’importance du risque en question. Les activités d’atténuation peuvent être intégrées à la conception et à la mise en œuvre du protocole, aux plans de surveillance, aux ententes entre les parties servant à définir leurs rôles et leurs responsabilités, aux mesures de protection systématiques visant à assurer le respect des modes opératoires normalisés, et à la formation au sujet des processus et des procédures. \n\n Des limites de tolérance en matière de qualité doivent être préétablies en tenant compte des caractéristiques médicales et statistiques des variables ainsi que de la conception statistique de l’essai, et ce, afin de relever les problèmes systématiques qui pourraient avoir une incidence sur la sécurité des sujets ou la fiabilité des résultats des essais. La détection d’un écart par rapport aux limites de tolérance préétablies doit déclencher une évaluation en vue de déterminer si des actions sont nécessaires."
    5_prefix: "5.0.5"
    5_label: "Communication des risques"
    5_desc: "Le promoteur doit documenter les activités de gestion de la qualité. Le promoteur doit faire part de ces activités à ceux qui sont impliqués ou affectés par de telles activités en vue de faciliter l’examen des risques et l’amélioration continue pendant que des essais cliniques sont réalisés."
    6_prefix: "5.0.6"
    6_label: "Examen des risques"
    6_desc: "Le promoteur doit périodiquement passer les mesures de contrôle des risques en revue afin de vérifier que les activités de gestion de la qualité mises en œuvre demeurent efficaces et pertinentes, en tenant compte des connaissances et de l’expérience en émergence."
    7_prefix: "5.0.7"
    7_label: "Déclaration des risques"
    7_desc: "Le promoteur doit décrire l’approche de gestion de la qualité mise en œuvre dans l’essai et résumer dans le rapport sur l’étude clinique, d’une part, les écarts importants par rapport aux limites de tolérance préétablies en matière de qualité, et d’autre part, les mesures correctives qui ont été prises (ICH E3, section 9.6, Assurance de la qualité des données)."
  2:
    prefix: "5.1"
    title: "Assurance de la qualité et contrôle de la qualité"
    1_prefix: "5.1.1"
    1_desc: "Le promoteur doit mettre en place et tenir à jour des systèmes d’assurance de la qualité et de contrôle de la qualité (décrits dans des MON) afin que les essais soient réalisés conformément au protocole, aux BPC et aux exigences réglementaires applicables et que les données soient produites, consignées (enregistrées) et présentées conformément à ces mêmes directives."
    2_prefix: "5.1.2"
    2_desc: "Le promoteur doit conclure des ententes avec toutes les parties concernées pour assurer l’accès direct (voir 1.21) à tous les lieux où se déroule l’essai, aux données/documents de base et aux rapports afin que le promoteur puisse effectuer la surveillance et la vérification nécessaires et que les organismes de réglementation nationaux et étrangers puissent procéder aux inspections requises."
    3_prefix: "5.1.3"
    3_desc: "Un contrôle de la qualité doit être effectué à toutes les étapes de la manipulation des données pour assurer la fiabilité et le traitement approprié de toutes les données."
    4_prefix: "5.1.4"
    4_desc: "Les ententes, conclues entre le promoteur et l’investigateur/établissement et tout autre participant à l’essai clinique, doivent être incluses dans le protocole ou dans un document distinct."
  3:
    prefix: "5.2"
    title: "Organisme de recherche sous contrat (ORC)"
    1_prefix: "5.2.1"
    1_desc: "Un promoteur peut déléguer une partie ou la totalité des tâches et fonctions liées à l’essai à un ORC, mais il demeure toujours responsable de la qualité et de l’intégrité des données relatives à l’essai. L’ORC doit mettre en place des systèmes d’assurance de la qualité et de contrôle de la qualité."
    2_prefix: "5.2.2"
    2_desc: "Toutes les tâches et fonctions qui ont été déléguées à un ORC et que celui-ci a acceptées doivent être précisées par écrit."
    3_prefix: "5.2.3"
    3_desc: "Toutes les tâches et fonctions qui n’ont pas été expressément déléguées à un ORC demeurent sous la responsabilité du promoteur."
    4_prefix: "5.2.4"
    4_desc: "Tous les points concernant un promoteur dans le présent document s’appliquent également à un ORC dans la mesure où un ORC a accepté d’exécuter les tâches et fonctions d’un promoteur."
  4:
    prefix: "5.3"
    title: "Expertise"
    1_prefix: "5.3"
    1_desc: "Le promoteur doit désigner du personnel médical qui possède les qualifications requises pour fournir des conseils sur des questions ou des problèmes d’ordre médical liés à l’essai et avec qui il sera facile de communiquer. Au besoin, des consultants de l’extérieur peuvent être nommés à cette fin."
  5:
    prefix: "5.4"
    title: "Conception de l’essai"
    1_prefix: "5.4.1"
    1_desc: "Le promoteur doit faire appel à des personnes qualifiées (biostatisticiens, pharmacologistes cliniques, médecins, etc.) s’il y a lieu, et ce, à toutes les étapes de l’essai (conception du protocole et des FEC, planification des analyses, analyse et rédaction des rapports provisoires et définitifs sur l’essai clinique)."
    2_prefix: "5.4.2"
    2_desc: "Pour plus d’information, voir le point 6 (Protocole d’essai clinique et modifications au protocole), les lignes directrices concernant la Structure et contenu des rapports d’étude clinique de l’ICH et d’autres lignes directrices appropriées de l’ICH sur la conception, les protocoles et la réalisation d’essais."
  6:
    prefix: "5.5"
    title: "Gestion de l’essai, traitement des données et tenue des dossiers"
    1_prefix: "5.5.1"
    1_desc: "Le promoteur doit faire appel à des personnes possédant les qualifications requises pour superviser le déroulement global de l’essai, traiter et vérifier les données, effectuer les analyses statistiques et rédiger les rapports d’essai."
    2_prefix: "5.5.2"
    2_desc: "Le promoteur peut décider de former un comité indépendant de contrôle des données (CICD) chargé d’évaluer les progrès d’un essai clinique, incluant les données sur l’innocuité et les résultats critiques sur l’efficacité à certains intervalles, et de formuler des recommandations à l’intention du promoteur concernant la poursuite, la modification ou l’interruption d’un essai. Le CICD doit mettre ses modes opératoires par écrit et rédiger des procès-verbaux de toutes ses réunions."
    3_prefix: "5.5.3"
    3_desc: "Si le promoteur utilise des systèmes de traitement de données électroniques sur place ou à distance, il doit : \n\ta. s’assurer que les systèmes électroniques de traitement des données sont conformes aux exigences qu’il a établies, c’est-à-dire qu’ils sont complets, précis, fiables et qu’ils donnent le rendement escompté (validation); \n\nℹ️\n L’approche de validation du promoteur pour de tels systèmes doit reposer sur une évaluation des risques qui tient compte de l’utilisation prévue du système et du potentiel de ce dernier à affecter la protection des sujets humains et la fiabilité des résultats des essais. \n \n\tb. élaborer des MON pour l’utilisation de ces systèmes. \n\nℹ️\n Les MON doivent couvrir la configuration, l’installation et l’utilisation des systèmes. Les MON doivent décrire la validation, les tests de fonctionnalité, la collecte et la gestion des données, la maintenance, les mesures de sécurité, le contrôle des changements, la sauvegarde des données, la récupération, la planification d’urgence et la mise hors service du système. Les responsabilités du promoteur, de l’investigateur et des autres parties à l’égard de l’utilisation des systèmes informatiques doivent être claires et les utilisateurs doivent recevoir une formation sur leur utilisation. \n \n\tc. s’assurer que les systèmes permettent de modifier les données sans effacer les données déjà enregistrées (conserver une piste de la vérification, des données et des corrections apportées); \n\td. mettre en place un système de sécurité pour empêcher l’accès non autorisé aux données; \n\te. conserver une liste des personnes qui sont autorisées à modifier les données (voir 4.1.5 et 4.9.3); \n\tf. faire une copie de sauvegarde des données; \n\tg. ne pas déroger au fait que l’essai est effectué à l’insu, s’il y a lieu (durant la saisie et le traitement des données). \n\th. assurer l’intégrité des données, y compris celles qui décrivent le contexte, le contenu et la structure. Ceci est particulièrement important lorsque les systèmes informatiques sont modifiés, comme dans le cas des mises à niveau des logiciels ou de la migration de données."
    4_prefix: "5.5.4"
    4_desc: "Si les données sont modifiées durant le traitement, il doit toujours être possible de comparer les données et les observations originales aux données traitées."
    5_prefix: "5.5.5"
    5_desc: "Le promoteur doit utiliser des codes d’identification des sujets non ambigus (voir 1.58) permettant l’identification de toutes les données consignées pour chaque sujet."
    6_prefix: "5.5.6"
    6_desc: "Le promoteur ou d’autres propriétaires des données doivent conserver tous les documents essentiels propres au promoteur concernant l’essai (voir le point 8 – Documents essentiels à la réalisation d’un essai clinique)."
    7_prefix: "5.5.7"
    7_desc: "Le promoteur doit conserver tous les documents essentiels qui lui sont propres, conformément aux exigences réglementaires applicables des pays où le produit est approuvé ou des pays où il a l’intention de présenter des demandes d’approbation."
    8_prefix: "5.5.8"
    8_desc: "Si le promoteur interrompt le processus de développement clinique d’un produit de recherche (pour une partie ou la totalité des indications, des modes d’administration ou des formes posologiques), il doit conserver tous les documents essentiels qui lui sont propres pendant au moins deux ans après l’interruption officielle de l’essai ou selon les exigences réglementaires applicables."
    9_prefix: "5.5.9"
    9_desc: "Si le promoteur interrompt le processus de développement clinique d’un produit de recherche, il doit informer tous les investigateurs/établissements participant à l’essai et tous les organismes de réglementation."
    10_prefix: "5.5.10"
    10_desc: "Tout transfert des droits de propriété des données doit être signalé aux autorités appropriées, conformément aux exigences réglementaires applicables."
    11_prefix: "5.5.11"
    11_desc: "Les documents essentiels propres au promoteur doivent être conservés pendant au moins deux ans après la dernière approbation d’une demande de mise en marché dans un pays membre de l’ICH et jusqu’à ce qu’il n’y ait plus aucune demande de mise en marché en suspens ou envisagée dans un pays membre de l’ICH ou, encore, pendant au moins deux ans après l’interruption officielle du développement clinique du produit de recherche. \n Ces documents doivent toutefois être conservés plus longtemps si les exigences réglementaires applicables le stipulent ou si le promoteur en a besoin."
    12_prefix: "5.5.12"
    12_desc: "Le promoteur doit informer l’investigateur/établissement par écrit du fait que les dossiers liés à l’essai doivent être conservés et doit également l’aviser par écrit au moment où ces dossiers n’ont plus à être conservés. "
  7:
    prefix: "5.6"
    title: "Choix des investigateurs"
    1_prefix: "5.6.1"
    1_desc: "Le promoteur doit choisir les investigateurs/établissements qui réaliseront l’essai. Tous les investigateurs doivent posséder la formation et l’expérience requises et disposer des ressources nécessaires (voir 4.1 et 4.2) pour réaliser l’essai qui leur a été confié de façon appropriée. La formation d’un comité de coordination et le choix des investigateurs chargés de la coordination des essais multicentriques incombent au promoteur."
    2_prefix: "5.6.2"
    2_desc: "Avant de conclure une entente avec un investigateur/établissement pour la réalisation d’un essai, le promoteur doit fournir à l’investigateur/établissement le protocole et une brochure de l’investigateur à jour et lui laisser suffisamment de temps pour examiner le protocole et les documents qui lui ont été remis."
    3_prefix: "5.6.3"
    3_desc: "Le promoteur doit veiller à ce que l’investigateur/établissement s’engage : \n\ta. à réaliser l’essai conformément aux BPC, aux exigences réglementaires applicables (voir 4.1.3) et au protocole qu’il a approuvé et pour lequel le CEE/CEI a donné une approbation/opinion favorable (voir 4.5.1); \n\tb. à respecter les procédures relatives à l’enregistrement et à la présentation des données; \n\tc. à autoriser les activités de contrôle, de vérification et d’inspection (voir 4.1.4); \n\td. à conserver les documents essentiels liés à l’essai jusqu’à ce qu’il l’informe du fait que ces documents n’ont plus à être conservés (voir 4.9.4 et 5.5.12). \n Le promoteur et l’investigateur/établissement doivent signer le protocole ou un autre document pour confirmer cette entente."
  8:
    prefix: "5.7"
    title: "Répartition de responsabilités"
    1_prefix: "5.7"
    1_label: "Répartition de responsabilités"
    1_desc: "Avant d’entreprendre un essai, le promoteur doit définir, établir et répartir toutes les tâches et fonctions liées à l’essai."
  9:
    prefix: "5.8"
    title: "Indemnisation des sujets et des investigateurs"
    1_prefix: "5.8.1"
    1_desc: "Si les exigences réglementaires applicables le stipulent, le promoteur doit fournir une assurance à l’investigateur/établissement ou le protéger (protection juridique et financière) contre les réclamations liées à l’essai, exception faite des réclamations basées sur une faute ou la négligence professionnelle."
    2_prefix: "5.8.2"
    2_desc: "Les politiques et les procédures du promoteur doivent prévoir les coûts associés au traitement des sujets participant à l’essai en cas de séquelles liées à l’essai, conformément aux exigences réglementaires applicables."
    3_prefix: "5.8.3"
    3_desc: "Le cas échéant, le mode d’indemnisation des sujets participant à l’essai doit être conforme aux exigences réglementaires applicables."
  10:
    prefix: "5.9"
    title: "Financement"
    1_prefix: "5.9"
    1_label: "Financement"
    1_desc: "Les aspects financiers de l’essai doivent être indiqués dans une entente écrite entre le promoteur et l’investigateur/établissement."
  11:
    prefix: "5.10"
    title: "Déclaration/présentation aux organismes de réglementation"
    1_prefix: "5.10"
    1_label: "Déclaration/présentation aux organismes de réglementation"
    1_desc: "Avant d’entreprendre un essai clinique, le promoteur (ou le promoteur et l’investigateur, si les exigences réglementaires applicables le stipulent) doit présenter toutes les demandes requises aux autorités compétentes pour qu’elles les examinent et les acceptent ou, encore, pour qu’elles autorisent (conformément aux exigences réglementaires applicables) la réalisation de l’essai. Toutes les déclarations/présentations doivent être datées et contenir suffisamment de renseignements pour identifier le protocole."
  12:
    prefix: "5.11"
    title: "Confirmation concernant l’examen du CEE/CEI"
    1_prefix: "5.11.1"
    1_desc: "Le promoteur doit demander à l’investigateur/établissement: \n\ta. de lui fournir le nom et l’adresse de son CEE/CEI; \n\tb. de lui remettre une déclaration du CEE/CEI certifiant que sa structure et son mode de fonctionnement sont conformes aux BPC ainsi qu’aux lois et règlements applicables; \n\tc. de lui remettre l’approbation/opinion favorable écrite du CEE/CEI et, s’il y a lieu, un exemplaire à jour du protocole, le formulaire de consentement éclairé et tout autre document d’information à fournir aux sujets, les méthodes de recrutement des sujets, les documents concernant la rétribution et l’indemnisation des sujets ainsi que tout autre document que le CEE/CEI aurait pu demander."
    2_prefix: "5.11.2"
    2_desc: "Si l’approbation/opinion favorable du CEE/CEI est conditionnelle à la modification d’un aspect quelconque de l’essai, par exemple une modification du protocole, du formulaire de consentement éclairé et de tout autre document d’information à fournir aux sujets, ou d’autres procédures, le promoteur doit obtenir de l’investigateur/établissement un exemplaire des modifications apportées et la date à laquelle le CEE/CEI a donné son approbation/opinion favorable."
    3_prefix: "5.11.3"
    3_desc: "Le promoteur doit obtenir de l’investigateur/établissement la documentation et les dates concernant toutes les réapprobations/réévaluations du CEE/CEI assorties d’une opinion favorable et tous les retraits ou suspensions d’une approbation/opinion favorable. "
  13:
    prefix: "5.12"
    title: "Information sur les produits de recherche"
    1_prefix: "5.12.1"
    1_desc: "Au moment de planifier un essai, le promoteur doit s’assurer qu’il existe suffisamment de données sur l’innocuité et l’efficacité provenant d’études non cliniques ou cliniques pour justifier l’exposition humaine aux produits de recherche (mode d’administration, posologie, durée et population à étudier)."
    2_prefix: "5.12.2"
    2_desc: "Le promoteur doit mettre à jour la brochure de l’investigateur à mesure que de nouveaux renseignements importants sont connus (voir le point 7 – Brochure de l’investigateur)."
  14:
    prefix: "5.13"
    title: "Fabrication, emballage, étiquetage et codage des produits de recherche"
    1_prefix: "5.13.1"
    1_desc: "Le promoteur doit s’assurer que les produits de recherche (incluant les comparateurs actifs) et le placebo (s’il y a lieu) sont appropriés au stade en cours, fabriqués conformément aux BPF applicables, codés et étiquetés de manière à ce que l’essai soit effectué à l’insu, le cas échéant. De plus, l’étiquetage doit être conforme aux exigences réglementaires applicables."
    2_prefix: "5.13.2"
    2_desc: "Le promoteur doit déterminer les températures, les conditions (protection contre la lumière) et les durées d’entreposage acceptables pour les produits de recherche, ainsi que les fluides et les méthodes de reconstitution à utiliser avec ces produits et les dispositifs devant servir à les injecter, s’il y a lieu. Le promoteur doit transmettre ces renseignements à toutes les parties concernées (surveillants, investigateurs, pharmaciens, responsables de l’entreposage, etc.)."
    3_prefix: "5.13.3"
    3_desc: "Les produits de recherche doivent être emballés de manière à en prévenir la contamination et une détérioration inacceptable durant le transport et l’entreposage."
    4_prefix: "5.13.4"
    4_desc: "Dans les essais à l’insu, le système de codage des produits de recherche doit comprendre un mécanisme permettant l’identification rapide des produits en cas d’urgence médicale, mais empêchant toute dérogation non décelée à la méthode de « l’insu »."
    5_prefix: "5.13.5"
    5_desc: "Si des modifications importantes sont apportées à la formulation des produits de recherche ou des comparateurs durant le développement clinique, les résultats de toutes les études additionnelles menées sur les produits formulés (stabilité, vitesse de dissolution, biodisponibilité, etc.) et permettant de déterminer si ces modifications vont altérer considérablement le profil pharmacocinétique des produits devront être obtenus avant que la nouvelle formulation soit utilisée dans des essais cliniques."
  15:
    prefix: "5.14"
    title: "Fourniture et manipulation des produits de recherche"
    1_prefix: "5.14.1"
    1_desc: "Le promoteur doit fournir les produits de recherche à l’investigateur/établissement."
    2_prefix: "5.14.2"
    2_desc: "Le promoteur ne doit pas fournir les produits de recherche à l’investigateur/établissement avant d’avoir obtenu tous les documents requis (approbation/opinion favorable du CEE/CEI et des organismes de réglementation, etc.)."
    3_prefix: "5.14.3"
    3_desc: "Le promoteur doit s’assurer que les procédures écrites comportent des instructions que l’investigateur/établissement doit suivre pour la manipulation et l’entreposage des produits de recherche destinés à l’essai ainsi que la documentation s’y rapportant. Les procédures doivent prévoir les points suivants : réception, manipulation, entreposage, distribution, récupération des produits non utilisés par les sujets, retour des produits de recherche inutilisés au promoteur (ou autre méthode autorisée par le promoteur et conforme aux exigences réglementaires applicables)."
    4_prefix: "5.14.4"
    4_desc: "Le promoteur doit: \n\ta. assurer la livraison rapide des produits de recherche aux investigateurs; \n\tb. tenir des dossiers décrivant les diverses étapes relatives à l’expédition, à la réception, à la distribution, au retour et à la destruction des produits de recherche (voir le point 8 – Documents essentiels à la réalisation d’un essai clinique); \n\tc. mettre en place un système permettant de retirer les produits de recherche et de consigner les données relatives au retrait (rappel de produits défectueux, réclamation après la fin de l’essai, rappel de produits périmés, etc.); \n\td. mettre en place un système permettant d’éliminer les produits de recherche inutilisés et de consigner les données relatives au processus d’élimination."
    5_prefix: "5.14.5"
    5_desc: "Le promoteur doit: \n\ta. prendre des mesures pour assurer la stabilité des produits de recherche pendant la période d’utilisation; \n\tb. garder une quantité suffisante des produits de recherche utilisés dans les essais pour reconfirmer certaines caractéristiques, si cela devient nécessaire, et tenir des dossiers faisant état des analyses et des caractéristiques des échantillons par lot. Dans la mesure où la stabilité des produits le permet, les échantillons doivent être conservés jusqu’à ce que les analyses des données de l’essai soient terminées ou pendant le délai prescrit par les exigences réglementaires applicables, selon la plus longue des deux périodes."
  16:
    prefix: "5.15"
    title: "Accès aux dossiers"
    1_prefix: "5.15.1"
    1_desc: "Le promoteur doit s’assurer que le protocole ou toute autre entente écrite précise que l’investigateur/établissement autorise l’accès direct aux données/documents de base aux fins de la surveillance, de la vérification, de l’examen du CEE/CEI et de l’inspection réglementaire concernant l’essai."
    2_prefix: "5.15.2"
    2_desc: "Le promoteur doit s’assurer que tous les sujets ont autorisé, par écrit, l’accès direct à leur dossier médical original aux fins de la surveillance, de la vérification, de l’examen du CEE/CEI et de l’inspection réglementaire concernant l’essai. "
  17:
    prefix: "5.16"
    title: "Information sur l’innocuité"
    1_prefix: "5.16.1"
    1_desc: "Le promoteur est responsable de l’évaluation continue de l’innocuité des produits de recherche."
    2_prefix: "5.16.2"
    2_desc: "Le promoteur doit informer rapidement tous les investigateurs/établissements et tous les organismes de réglementation concernés des résultats susceptibles de nuire à la sécurité des sujets, d’avoir une incidence sur le déroulement de l’essai ou de modifier les fondements de l’approbation/opinion favorable du CEE/CEI quant à la poursuite de l’essai."
  18:
    prefix: "5.17"
    title: "Rapport sur les réactions indésirables à un médicament"
    1_prefix: "5.17.1"
    1_desc: "Le promoteur doit faire parvenir rapidement à tous les investigateurs/établissements concernés, aux CEE/CEI, s’il y a lieu, et aux organismes de réglementation les rapports sur toutes les réactions indésirables à un médicament (RIM) qui sont à la fois graves et inattendues."
    2_prefix: "5.17.2"
    2_desc: "Ces rapports doivent être conformes aux exigences réglementaires applicables et aux lignes directrices concernant la Gestion des données cliniques sur l’innocuité des médicaments: Définitions et normes relatives à la déclaration rapide de l’ICH)."
    3_prefix: "5.17.3"
    3_desc: "Le promoteur doit soumettre aux organismes de réglementation toutes les mises à jour et tous les rapports périodiques concernant l’innocuité, conformément aux exigences réglementaires applicables."
  19:
    prefix: "5.18"
    title: "Surveillance"
    1_prefix: "5.18.1"
    1_desc: "But \n\n Le but de la surveillance de l’essai est de vérifier si : \n\ta. les droits et le bien-être des sujets humains sont protégés; \n\tb. les données présentées sont exactes et complètes et si elles peuvent être vérifiées dans les documents de base; \n\tc. l’essai est réalisé conformément au protocole/modifications approuvés, aux BPC et aux exigences réglementaires applicables."
    2_prefix: "5.18.2"
    2_desc: "Choix et qualifications des surveillants \n\n \n\ta. Les surveillants doivent être nommés par le promoteur. \n\tb. Ils doivent posséder la formation appropriée ainsi que les connaissances scientifiques ou cliniques requises pour surveiller adéquatement le déroulement de l’essai. Leurs qualifications doivent être appuyées par des documents. \n\tc. Ils doivent connaître parfaitement les produits de recherche, le protocole, le formulaire de consentement éclairé et tout autre document d’information à fournir aux sujets, les MON du promoteur, les BPC et les exigences réglementaires applicables."
    3_prefix: "5.18.3"
    3_desc: "Le promoteur doit veiller à ce que les essais soient surveillés adéquatement. Il doit déterminer la portée et la nature appropriées de la surveillance. Pour ce faire, il doit s’appuyer sur des considérations telles que l’objectif, le but, la conception, la complexité, l’utilisation d’une méthode à l’insu, l’envergure et les résultats de l’essai. En général, il faut exercer une surveillance sur les lieux, avant, durant et après l’essai; cependant, dans des circonstances exceptionnelles, le promoteur peut décider qu’une surveillance centrale assortie de conditions, telles que la formation des investigateurs et la tenue de réunions, et de directives écrites exhaustives peut assurer la réalisation appropriée de l’essai conformément aux BPC. L’échantillonnage statistiquement contrôlé peut être une méthode acceptable pour choisir les données à vérifier. \n\n ADDENDA \n En vue d’effectuer la surveillance des essais cliniques, le promoteur doit élaborer une approche systématique, prioritaire et fondée sur les risques. La souplesse de la portée et de la nature de la surveillance décrite dans la présente section vise à permettre l’adoption d’approches variées qui améliorent l’efficacité et l’efficience du suivi. Le promoteur peut choisir une surveillance sur les lieux, une combinaison de la surveillance sur place et centralisée ou, si cela est justifié, une surveillance centralisée. Le promoteur doit documenter la raison d’être de la stratégie de surveillance choisie (par exemple, dans le plan de surveillance). \n La surveillance sur les lieux est effectuée aux endroits où se déroule l’essai clinique. La surveillance centralisée est une évaluation à distance des données accumulées. Elle est effectuée sans délai et est éclairée par des personnes qualifiées et ayant reçu une formation adéquate (p. ex., gestionnaires de données, biostatisticiens). \n Les processus de surveillance centralisés fournissent des capacités de surveillance supplémentaires qui peuvent, d’une part, venir compléter et réduire l’étendue et/ou la fréquence de la surveillance sur les lieux, et d’autre part, contribuer à faire une distinction entre des données fiables et des données qui pourraient ne pas l’être. \n L’examen – qui peut comprendre des analyses statistiques – des données accumulées provenant d’une surveillance centralisée peut servir à : \n\ta. relever les données manquantes, incohérentes ou aberrantes, le manque inattendu de variabilité et les écarts de protocole; \n\tb. examiner les tendances des données comme l’étendue, la cohérence et la variabilité des données dans et entre les sites; \n\tc. évaluer les erreurs systématiques ou importantes dans la collecte et la transmission de données provenant d’un site ou d’un site à l’autre, ou de possibles problèmes de manipulation ou d’intégrité des données; \n\td. analyser les caractéristiques du site et les mesures de rendement; \n\te. choisir les sites et/ou les processus qui doivent faire l’objet d’une surveillance ciblée sur les lieux."
    4_prefix: "5.18.4"
    4_desc: "Responsabilités du surveillant \n\n Conformément aux exigences du promoteur, le surveillant doit veiller à ce que l’essai soit réalisé et à ce que les données soient consignées de façon appropriée en mettant en œuvre les activités suivantes lorsqu’elles se révèlent pertinentes et nécessaires à l’essai et aux lieux où se déroule l’essai : \n\ta. Servir de lien principal de communication entre le promoteur et l’investigateur; \n\tb. S’assurer que l’investigateur possède les qualifications et les ressources adéquates (voir 4.1, 4.2 et 5.6) et que celles-ci demeurent adéquates durant toute la période d’essai; que les installations, notamment les laboratoires et l’équipement, ainsi que le personnel permettent de réaliser l’essai de façon sûre et appropriée et demeurent adéquats durant toute la période d’essai; \n\tc. S’assurer que : \n\t\ti. les durées et les conditions d’entreposage des produits de recherche sont acceptables et que les quantités de produits fournies sont suffisantes; \n\t\tii. les produits de recherche sont fournis uniquement aux sujets qui sont autorisés à les recevoir, et ce, conformément aux doses spécifiées dans le protocole; \n\t\tiii. les sujets ont reçu les instructions nécessaires pour utiliser, manipuler, conserver et retourner les produits de recherche; \n\t\tiv. la réception, l’utilisation et le retour des produits de recherche sur les lieux de l’essai sont contrôlés et indiqués adéquatement; \n\t\tv. l’élimination des produits de recherche inutilisés sur les lieux de l’essai est conforme aux exigences réglementaires applicables et à celles du promoteur. \n\td. S’assurer que l’investigateur respecte le protocole approuvé et toutes les modifications approuvées, s’il y a lieu; \n\te. S’assurer que le consentement éclairé écrit de tous les sujets a été obtenu avant que ceux-ci ne participent à l’essai; \n\tf. Veiller à ce que l’investigateur reçoive la brochure de l’investigateur à jour, tous les documents ainsi que toutes les fournitures nécessaires pour réaliser l’essai de façon appropriée et respecter les exigences réglementaires applicables; \n\tg. Veiller à ce que l’investigateur et le personnel chargé de l’essai soient adéquatement informés à propos de l’essai; \n\th. S’assurer que l’investigateur et le personnel chargé de l’essai accomplissent les fonctions spécifiées, conformément au protocole et à toute autre entente écrite conclue entre le promoteur et l’investigateur/établissement, et qu’ils n’ont pas délégué ces fonctions à des personnes non autorisées; \n\ti. S’assurer que l’investigateur ne fait participer que des sujets admissibles; \n\tj. Rendre compte du rythme auquel les sujets sont recrutés; \n\tk. S’assurer que les documents de base et les autres dossiers liés à l’essai sont exacts, complets et à jour; \n\tl. S’assurer que l’investigateur fournit tous les rapports, les déclarations, les demandes et les présentations nécessaires et que ces documents sont exacts, complets, à jour, lisibles et datés et qu’ils indiquent de quel essai il s’agit; \n\tm. Vérifier si les renseignements figurant dans les FEC, les documents de base et les autres dossiers liés à l’essai sont exacts et complets en comparant les données. Le surveillant doit s’assurer plus particulièrement que : \n\t\ti. les données exigées par le protocole sont consignées avec exactitude dans les FEC et qu’elles correspondent à celles qui figurent dans les documents de base; \n\t\tii. les modifications concernant les doses et le traitement sont consignées correctement pour tous les sujets participant à l’essai; \n\t\tiii. les incidents thérapeutiques, les médicaments concomitants et les maladies intercurrentes sont signalés conformément au protocole sur les FEC; \n\t\tiv. les rendez-vous auxquels les sujets ne se rendent pas, les analyses qui ne sont pas effectuées et les examens qui ne sont pas réalisés sont indiqués clairement dans les FEC; \n\t\tv. tous les retraits et les abandons des sujets participant à l’essai sont indiqués et expliqués dans les FEC. \n\tn. Informer l’investigateur de toutes les entrées erronées, manquantes ou illisibles dans les FEC. Le surveillant doit s’assurer que les corrections, les suppressions ou les ajouts appropriés sont effectués, datés, expliqués (s’il y a lieu) et paraphés par l’investigateur ou par un membre de personnel chargé de l’essai et autorisé à parapher les modifications apportées aux FEC au nom de l’investigateur. Cette autorisation doit être confirmée par écrit. \n\to. S’assurer que tous les incidents thérapeutiques (IT) sont signalés de façon appropriée et dans les délais établis par les BPC, le protocole, le CEE/CEI, le promoteur et les exigences réglementaires applicables; \n\tp. S’assurer que l’investigateur conserve les documents essentiels (voir le point 8 – Documents essentiels à la réalisation d’un essai clinique); \n\tq. Informer l’investigateur de tout écart lié au protocole, aux MON, aux BPC et aux exigences réglementaires applicables et prendre les mesures appropriées pour que de tels écarts ne se reproduisent plus."
    5_prefix: "5.18.5"
    5_desc: "Méthodes de surveillance \n\n Le surveillant doit respecter les MON établis par le promoteur ainsi que les autres procédures spécifiées par ce dernier concernant la surveillance d’un essai particulier."
    6_prefix: "5.18.6"
    6_desc: "Rapport de surveillance \n\n \n\ta. Le surveillant doit présenter un rapport écrit au promoteur après chaque visite des lieux ou après chaque communication liée à l’essai; \n\tb. Les rapports doivent comprendre la date de la visite, l’endroit visité, le nom du surveillant ainsi que le nom de l’investigateur ou de toute autre personne avec qui le surveillant a communiqué; \n\tc. Ils doivent comprendre un sommaire des éléments examinés par le surveillant et des commentaires rédigés par ce dernier concernant les résultats/faits importants, les écarts et les lacunes, les conclusions, les mesures prises ou à prendre ainsi que les mesures recommandées pour assurer la conformité de l’essai; \n\td. L’examen et le suivi du rapport de surveillance effectués par le promoteur doivent être confirmés par écrit par le représentant désigné du promoteur. \n\n ADDENDA \n \n\te. Les rapports de surveillance sur les lieux et/ou centralisée doivent être remis au promoteur (ainsi qu’à la direction et au personnel responsable de la surveillance des essais et des sites) rapidement aux fins d’examen et de suivi. Les résultats des activités de surveillance doivent être documentés de manière suffisamment détaillée pour permettre de vérifier l’observation du plan de surveillance. La communication des activités de surveillance centralisée doit être régulière et indépendante des visites sur les lie x."
    7_prefix: "5.18.7"
    7_desc: "ADDENDA \n Plan de surveillance \n\n Le promoteur doit élaborer un plan de surveillance adapté aux risques particuliers liés à l’intégrité des données et à la protection des sujets humains. Le plan doit décrire la stratégie de surveillance, les responsabilités de surveillance de toutes les parties concernées, les différentes méthodes de surveillance à utiliser et les raisons de leur utilisation. Le plan doit également mettre l’accent sur le suivi des données et des processus essentiels. Une attention particulière doit être accordée aux aspects qui ne font pas partie des pratiques cliniques courantes et qui nécessitent une formation supplémentaire. Le plan de surveillance doit faire référence aux politiques et procédures applicables."
  20:
    prefix: "5.19"
    title: "Vérification"
    desc: "Lorsque le promoteur procède à une vérification, dans le cadre du système d’assurance de la qualité, il doit tenir compte des points suivants :"
    1_prefix: "5.19.1"
    1_desc: "But \n\n Le but de la vérification effectuée par le promoteur, qui ne fait pas partie des fonctions courantes de surveillance et de contrôle de la qualité, doit être d’évaluer le déroulement de l’essai et sa conformité avec le protocole, les MON, les BPC et les exigences réglementaires applicables."
    2_prefix: "5.19.2"
    2_desc: "Choix et qualifications des vérificateurs \n\ta. Le promoteur doit confier les tâches de vérification à des personnes n’ayant aucun lien avec les essais/systèmes cliniques; \n\tb. Le promoteur doit s’assurer que les vérificateurs possèdent la formation et l’expérience requises pour mener des vérifications de façon appropriée. Les qualifications des vérificateurs doivent être appuyées par des documents."
    3_prefix: "5.19.3"
    3_desc: "Procédures de vérification \n\n \n\ta. Le promoteur doit veiller à ce que la vérification des essais/systèmes cliniques soit menée conformément aux procédures écrites qu’il a établies concernant les éléments à vérifier, la façon d’effectuer la vérification, la fréquence des vérifications ainsi que la présentation et le contenu des rapports de vérification; \n\tb. Le plan et les méthodes de vérification du promoteur doivent être établis en fonction de l’importance de l’essai, des demandes présentées aux organismes de réglementation, du nombre de sujets participant à l’essai, du type d’essai et de sa complexité, du niveau de risque pour les sujets et de tout problème connu; \n\tc. Les observations et les conclusions du vérificateur doivent être consignées par écrit; \n\td. Pour assurer l’autonomie et la valeur de la fonction de vérification, les organismes de réglementation ne doivent pas demander que des rapports de vérification soient présentés de façon systématique. Ils peuvent demander à avoir accès à un rapport de vérification de façon ponctuelle dans les cas graves de non-conformité aux BPC ou de poursuites judiciaires; \n\te. Lorsque les lois ou les règlements applicables l’exigent, le promoteur doit fournir un certificat de vérification."
  21:
    prefix: "5.20"
    title: "Non-conformité"
    1_prefix: "5.20.1"
    1_desc: "Si un investigateur/établissement ou l’un des membres du personnel du promoteur ne respecte pas le protocole, les MON, les BPC ou les exigences réglementaires applicables, le promoteur doit prendre rapidement des mesures pour assurer la conformité à ces directives. \n\n ADDENDA \n Si une non-conformité affectant ou pouvant affecter de façon significative la protection des sujets humains ou la fiabilité des résultats de l’essai est trouvée, le promoteur doit en effectuer l’analyse des causes profondes et mettre en œuvre les mesures correctives et préventives appropriées."
    2_prefix: "5.20.2"
    2_desc: "Si un vérificateur ou un surveillant constate que des cas de non-conformité graves ou persistants sont associés à un investigateur/établissement particulier, le promoteur doit mettre fin à la participation de l’investigateur/établissement à l’essai. Lorsque la participation à l’essai d’un investigateur/établissement est annulée pour raison de non- conformité, le promoteur doit en informer rapidement les organismes de réglementation."
  22:
    prefix: "5.21"
    title: "Abandon ou interruption prématuré d’un essai"
    1_prefix: "5.21"
    1_label: "Abandon ou interruption prématuré d’un essai"
    1_desc: "Si un essai est abandonné ou interrompu prématurément, le promoteur doit informer rapidement les investigateurs/établissements et les organismes de réglementation de cette décision et des raisons s’y rattachant. Le CEE/CEI doit lui aussi être informé rapidement et le promoteur ou l’investigateur/établissement doit lui expliquer les raisons de cette décision, conformément aux exigences réglementaires applicables."
  23:
    prefix: "5.22"
    title: "Rapports sur un essai/étude clinique"
    1_prefix: "5.22"
    1_label: "Rapports sur un essai/étude clinique"
    1_desc: "Que l’essai soit terminé ou qu’il ait été abandonné prématurément, le promoteur doit veiller à ce que les rapports sur l’essai clinique soient préparés et présentés aux organismes de réglementation conformément aux exigences réglementaires applicables. Le promoteur doit également veiller à ce que les rapports sur l’essai clinique inclus dans les demandes de mise en marché satisfassent aux normes établies dans les lignes directrices concernant la Structure et contenu des rapports d’étude clinique de l’ICH). (NOTA : Ces lignes directrices indiquent que des rapports d’étude abrégés peuvent être acceptables dans certains cas.)"
  24:
    prefix: "5.23"
    title: "Essais multicentriques"
    desc: "Pour les essais multicentriques, le promoteur doit s’assurer que :"
    1_prefix: "5.23.1"
    1_desc: "tous les investigateurs réalisent l’essai en respectant à la lettre le protocole approuvé par lui-même et, s’il y a lieu, par les organismes de réglementation, et pour lequel le CEE/CEI a donné une opinion/approbation favorable;"
    2_prefix: "5.23.2"
    2_desc: "les FEC permettent la collecte des données requises à tous les endroits où se déroule l’essai multicentrique – dans le cas des investigateurs qui recueillent des données additionnelles, des FEC supplémentaires doivent également être présentés;"
    3_prefix: "5.23.3"
    3_desc:  "les responsabilités des investigateurs chargés de la coordination et des autres investigateurs participants sont déterminées par écrit avant le début de l’essai;"
    4_prefix: "5.23.4"
    4_desc: "tous les investigateurs reçoivent des instructions concernant le respect du protocole et d’un ensemble de normes uniformes sur l’évaluation des résultats cliniques et des résultats de laboratoire ainsi que sur la façon de remplir les FEC;"
    5_prefix: "5.23.5"
    5_desc: "des mesures ont été prises pour faciliter la communication entre les investigateurs."
6:
  title: "Protocole d'essai clinique et modifications au protocole"
  desc: "Un protocole d’essai doit habituellement comporter les énoncés ci-dessous. Cependant, des renseignements propres aux lieux où se déroule l’essai peuvent être fournis sur des pages distinctes ou indiqués dans une entente distincte; de plus, certains des renseignements figurant ci-après peuvent être indiqués dans d’autres documents cités dans le protocole, par exemple la brochure de l’investigateur."
  1:
    title: "Renseignements généraux"
    1_desc: "Titre du protocole, numéro d’identification du protocole et date. Le numéro et la date de toutes les modifications au protocole doivent également être indiqués."
    2_desc: "Nom et adresse du promoteur et du surveillant (s’il s’agit d’une autre personne que le promoteur)."
    3_desc: "Nom et titre de la personne autorisée à signer le protocole et les modifications au protocole au nom du promoteur."
    4_desc: "Nom, titre, adresse et numéro de téléphone de l’expert médical du promoteur (ou du dentiste, s’il y a lieu) pour l’essai."
    5_desc: "Nom et titre de l’investigateur responsable de la réalisation de l’essai, et adresse et numéro de téléphone de l’endroit où se déroule l’essai."
    6_desc: "Nom, titre, adresse et numéro de téléphone du médecin qualifié (ou du dentiste, s’il y a lieu) chargé de toutes les décisions médicales (ou dentaires) liées à l’essai et prises sur place (s’il s’agit d’une autre personne que l’investigateur)."
    7_desc: "Nom et adresse du laboratoire clinique ainsi que des autres services médicaux ou cliniques ou des établissements participant à l’essai."
  2:
    title: "Renseignements de base"
    1_desc: "Nom et description des produits de recherche."
    2_desc: "Sommaire des conclusions tirées d’études non cliniques susceptibles d’être significatives sur le plan clinique et d’essais cliniques ayant un rapport avec l’essai."
    3_desc: "Sommaire des risques et des avantages connus et éventuels, le cas échéant, pour les sujets humains."
    4_desc: "Description et justification du mode d’administration, de la posologie, du schéma posologique et de la période de traitement."
    5_desc: "Déclaration indiquant que l’essai sera réalisé conformément au protocole, aux BPC et aux exigences réglementaires applicables."
    6_desc: "Description de la population à étudier."
    7_desc: "Références à la documentation et aux données ayant un lien avec l’essai et servant de renseignements généraux pour l’essai."
  3:
    title: "Objectifs et but de l’essai"
    1_prefix: "6.3"
    1_label: "Objectifs et but de l’essai"
    1_desc: "Description détaillée des objectifs et du but de l’essai."
  4:
    title: "Conception de l’essai"
    desc: "L’intégrité scientifique et la fiabilité des données de l’essai reposent dans une large mesure sur la conception de l’essai. La description de la conception de l’essai doit comprendre les points suivants :"
    1_desc: "Énoncé précis des principaux résultats et des résultats secondaires, le cas échéant, à évaluer durant l’essai."
    2_desc: "Description du type d’essai à réaliser (à double insu, contrôlé contre placebo, conception parallèle, etc.) et un schéma de la conception, de la marche à suivre et des étapes de l’essai."
    3_desc: "Description des mesures prises pour réduire/éviter les biais incluant : \n\ta. la distribution au hasard; \n\tb. le recours d’une méthode à l’insu."
    4_desc: "Description du traitement, de la posologie et du schéma posologique du produit de recherche, en plus d’une description de la forme posologique, de l’emballage et de l’étiquetage du produit."
    5_desc: "Durée prévue de la participation des sujets et description des étapes et de la durée de toutes les périodes d’essai, notamment le suivi, s’il y a lieu."
    6_desc: "Description des « règles d’arrêt » ou des « critères de poursuite » concernant la participation des sujets à l’essai, en partie ou en totalité."
    7_desc: "Procédures de comptabilisation des produits de recherche, y compris les placebos et les comparateurs, le cas échéant."
    8_desc: "Liste des codes utilisés pour la répartition au hasard des traitements et conservation de la clé des codes."
    9_desc: "Identification de toutes les données à consigner directement dans les FEC (données non enregistrées au préalable par écrit ou par voie électronique) et devant être considérées comme des données de base."
  5:
    title: "Choix et retrait des sujets"
    1_desc: "Critères d’inclusion des sujets."
    2_desc: "Critères d’exclusion des sujets."
    3_desc: "Critères de retrait des sujets (abandon du traitement avec le produit de recherche ou de l’essai) et procédures précisant : \n\ta. quand et comment retirer un sujet de l’essai ou annuler le traitement avec le produit de recherche; \n\tb. le type de données à recueillir pour les sujets retirés et le moment où ces données doivent être recueillies ;\n\tc. la façon de faire pour remplacer les sujets, s’il y a lieu; \n\td. le suivi mené à l’égard des sujets qui ne sont plus traités avec le produit de recherche ou qui ont été retirés de l’essai."
  6:
    title: "Traitement administré aux sujets"
    1_desc: "Traitement à administrer aux sujets, notamment le nom de tous les produits, les doses, les schémas posologiques, les voies/modes d’administration et les périodes de traitement, y compris les périodes de suivi, pour chaque sujet faisant partie d’un groupe/sous-groupe traité avec le produit de recherche ou participant à l’essai."
    2_desc: "Médicaments/traitements autorisés (y compris les antidotes) et non autorisés avant ou durant l’essai."
    3_desc: "Méthodes de surveillance concernant la conformité de l’essai."
  7:
    title: "Évaluation de l’efficacité"
    1_desc: "Description des paramètres d’efficacité."
    2_desc: "Méthodes et intervalles pour évaluer, consigner et analyser les paramètres d’efficacité."
  8:
    title: "Évaluation de l’innocuité"
    1_desc: "Description des paramètres de sécurité."
    2_desc: "Méthodes et intervalles pour évaluer, consigner et analyser les paramètres de sécurité."
    3_desc: "Procédures pour obtenir les rapports et pour consigner et signaler les incidents thérapeutiques et les maladies intercurrentes."
    4_desc: "Type de suivi offert aux sujets ayant subi des incidents thérapeutiques et durée de ce suivi."
  9:
    title: "Statistiques"
    1_desc: "Description des méthodes statistiques à utiliser, y compris le calendrier de toutes les analyses périodiques prévues."
    2_desc: "Nombre de sujets prévu. Pour les essais multicentriques, le nombre de sujets prévu pour chaque centre doit être indiqué. Raisons du choix de la taille de l’échantillon, y compris des commentaires (ou des calculs) sur la puissance de l’essai et une justification clinique."
    3_desc: "Niveau de signification à utiliser."
    4_desc: "Critères d’abandon de l’essai."
    5_desc: "Méthodes pour tenir compte des données manquantes, inutilisées ou erronées."
    6_desc: "La marche à suivre pour signaler tous les écarts par rapport au plan statistique original doit être décrite et justifiée dans le protocole ou dans le rapport final (s’il y a lieu)."
    7_desc: "Choix des sujets à inclure dans les analyses (tous les sujets choisis au hasard, tous les sujets ayant reçu une dose, tous les sujets admissibles, tous les sujets évaluables, etc.)."
  10:
    prefix: "6.10"
    title: "Accès direct aux documents/données de base"
    1_prefix: "6.10"
    1_label: "Accès direct aux documents/données de base"
    1_desc: "Le promoteur doit s’assurer que le protocole ou toute autre entente écrite précise que les investigateurs/établissements autoriseront la surveillance, les vérifications, l’examen par le CEE/CEI et les inspections réglementaires liés à l’essai, en permettant l’accès direct aux données/documents de base."
  11:
    prefix: "6.11"
    title: "Contrôle et assurance de la qualité"
    1_prefix: "6.11"
    1_label: "Contrôle et assurance de la qualité"
  12:
    prefix: "6.12"
    title: "Description des considérations éthiques liées à l’essai."
    1_prefix: "6.12"
    1_label: "Éthique"
    1_desc: "Description des considérations éthiques liées à l’essai."
  13:
    prefix: "6.13"
    title: "Traitement des données et tenue des dossiers"
    1_prefix: "6.13"
    1_desc: "Traitement des données et tenue des dossiers"
  14:
    prefix: "6.14"
    title: "Financement et assurance"
    1_prefix: "6.14"
    1_label: "Financement et assurance"
    1_desc: "Financement et assurance, si ces questions ne sont pas traitées dans une entente distincte."
  15:
    prefix: "6.15"
    title: "Règles en matière de publication"
    1_prefix: "6.15"
    1_label: "Règles en matière de publication"
    1_desc: "Règles en matière de publication, si cette question n’est pas traitée dans une entente distincte."
  16:
    prefix: "6.16"
    title: "Suppléments"
    1_prefix: "6.16"
    1_label: "Suppléments"
    1_desc: "(NOTA : Comme le protocole et le rapport d’essai/étude clinique sont étroitement liés, on peut trouver d’autres renseignements pertinents dans les lignes directrices concernant la Structure et contenu des rapports d’étude clinique de l’ICH.)"
7:
  title: "Brochure de l'investigateur"
  desc: "L’objectif global de cette section est d’aider l’investigateur à comprendre les risques et les réactions indésirables possibles ainsi que les analyses, les observations et les précautions particulières pouvant être associées à un essai clinique. Cette compréhension doit reposer sur les propriétés physiques, chimiques, pharmaceutiques, pharmacologiques, toxicologiques et cliniques du produit de recherche. Il faut également fournir à l’investigateur clinique une orientation concernant la reconnaissance et le traitement des surdoses possibles et des réactions indésirables à un médicament, fondés sur des expériences antérieures réalisés sur des humains et sur la pharmacologie du produit de recherche."
  1:
    prefix: "7.1"
    title: "Introduction"
    1_prefix: "7.1"
    1_label: "Introduction"
    1_desc: "La brochure de l’investigateur (BI) est une compilation de données cliniques et non cliniques sur les produits de recherche, pouvant servir à l’étude de ceux-ci sur des sujets humains. Son but est de fournir aux investigateurs et aux autres intervenants participant à l’essai des renseignements leur permettant de mieux comprendre la raison d’être de nombreuses caractéristiques clés du protocole (doses, fréquence/intervalle des doses, modes d’administration et méthodes de surveillance concernant l’innocuité) et de se conformer à ces exigences. La BI contient également des conseils sur la façon d’assurer la gestion clinique des sujets participant à l’essai clinique. L’information doit être présentée de façon concise, simple, objective, équilibrée et non promotionnelle de manière à ce qu’un clinicien ou un investigateur éventuel puisse la comprendre et faire sa propre évaluation non biaisée des risques et des avantages associés à l’essai proposé. C’est pourquoi une personne possédant des qualifications d’ordre médical doit généralement participer à la rédaction de la BI, mais le contenu de cette dernière doit être approuvé par les spécialistes qui ont produit les données décrites. \n\n Le présent document expose l’information minimale à inclure dans une BI et contient des suggestions concernant la présentation de cette information. Il est entendu que le type d’information disponible et la quantité d’informations à inclure seront fonction du stade de développement du produit de recherche. Si le produit de recherche est commercialisé et que sa pharmacologie est très bien comprise par les praticiens, il n’est pas nécessaire de produire une BI exhaustive. Si les organismes de réglementation le permettent, une brochure d’information générale sur le produit, une notice d’accompagnement ou une étiquette peuvent être des solutions appropriées, à condition que ces documents fournissent de l’information à jour, complète et détaillée sur tous les aspects du produit de recherche pouvant se révéler importants pour l’investigateur. Si un produit commercialisé fait l’objet d’une étude en vue d’une nouvelle utilisation (p. ex., nouvelle indication), une BI propre à cette nouvelle utilisation doit être préparée. La BI doit être examinée au moins une fois par année et révisée au besoin en fonction des procédures écrites du promoteur. Elle peut être révisée plus souvent selon le stade de développement du produit et la disponibilité de nouveaux renseignements pertinents. Cependant, conformément aux bonnes pratiques cliniques, ces nouveaux renseignements peuvent être d’une telle importance qu’ils doivent être transmis aux investigateurs ainsi qu’aux comités d’examen d’établissements (CEE)/comités d’éthique indépendants (CEI) ou aux organismes de réglementation avant leur inclusion dans une BI révisée. \n\n En général, le promoteur doit s’assurer que les investigateurs ont une BI à jour; de leur côté, les investigateurs doivent se charger de remettre la BI à jour aux CEE/CEI responsables. Dans le cas d’un essai parrainé par un investigateur, le promoteur-investigateur doit vérifier si le fabricant a déjà rédigé une notice. Si le produit de recherche est fourni par le promoteur-investigateur, celui- ci doit communiquer l’information nécessaire au personnel chargé de l’essai. S’il est impossible de rédiger une BI officielle, le promoteur-investigateur doit alors inclure dans le protocole d’essai une section de renseignements généraux renfermant l’information minimale à jour décrite dans le présent document."
  2:
    title: "Remarques générales"
    desc: "La BI doit comprendre les éléments suivants :"
    1_label: "Page titre"
    1_desc: "La page titre doit comprendre le nom du promoteur, des renseignements identifiant chaque produit de recherche (numéro de recherche, nom chimique ou nom générique approuvé, nom commercial, si la loi le permet et si le promoteur le souhaite) et la date de parution. On suggère également d’indiquer un numéro d’édition ainsi que le numéro de référence et la date de l’édition que la BI annule et remplace. \n\nℹ️\n Un exemple est fourni à l’annexe 1."
    2_label: "Déclaration de confidentialité"
    2_desc: "Le promoteur peut souhaiter inclure une déclaration enjoignant l’investigateur/destinataires de considérer la BI comme un document confidentiel à l’usage exclusif de l’équipe de l’investigateur et du CEE/CEI."
  3:
    title: "Contenu de la brochure de l’investigateur"
    desc: "La BI doit comprendre les sections suivantes ainsi que des références s’il y a lieu."
    1_label: "Table des matières"
    1_desc: "Un exemple de table des matières est fourni à l’annexe 2."
    2_label: "Sommaire"
    2_desc: "Il faut rédiger un bref sommaire (ne dépassant pas deux pages, de préférence) indiquant les principales propriétés physiques, chimiques, pharmaceutiques, toxicologiques, pharmacocinétiques et métaboliques du produit de recherche ainsi que les données cliniques se rapportant à son stade de développement."
    3_label: "Introduction"
    3_desc: "Il faut rédiger une brève introduction indiquant le nom chimique (ainsi que les noms générique et commercial s’il s’agit d’un produit approuvé) du produit de recherche, toutes les matières actives, la catégorie pharmacologique du produit de recherche et la place qu’il devrait occuper dans cette catégorie (p. ex., les avantages), les raisons pour lesquelles une recherche est réalisée sur ce produit et les indications prophylactiques, thérapeutiques et diagnostiques escomptées. Finalement, la méthode générale à suivre pour évaluer le produit de recherche doit être exposée dans l’introduction."
    4_label: "Propriétés physiques, chimiques et pharmaceutiques et formulation"
    4_desc: "Il faut décrire les substances que contient le produit de recherche (notamment la formule chimique ou structurelle) et résumer brièvement ses propriétés physiques, chimiques et pharmaceutiques. \n\n Pour que des mesures de sécurité appropriées puissent être prises durant l’essai, il faut décrire la formulation à utiliser, y compris les excipients, et justifier son utilisation sur le plan clinique, s’il y a lieu. Il faut également fournir des instructions concernant la conservation et la manipulation des formes posologiques. \n\n Toutes les similitudes structurelles à d’autres composés connus doivent être mentionnées."
    5_label: "Études non cliniques"
    5_desc: "Introduction \n Les résultats de toutes les études de nature non clinique sur la pharmacologie, la toxicologie, la pharmacocinétique et le métabolisme du produit de recherche doivent être présentés sous forme de sommaire. Ce sommaire doit indiquer la méthodologie utilisée ainsi que les résultats obtenus et examiner la pertinence des conclusions par rapport aux effets thérapeutiques étudiés et aux effets indésirables possibles chez les humains. S’il y a lieu, et s’ils sont connus/disponibles, les renseignements suivants doivent être fournis : \n\t - espèces étudiées; \n\t - nombre d’animaux (mâles ou femelles) dans chaque groupe; \n\t - dose unitaire [p. ex., milligrammes/kilogramme (mg/kg)]; \n\t - intervalle posologique; \n\t - mode d’administration; \n\t - durée de la posologie; \n\t - information sur la distribution systémique; \n\t - durée du suivi consécutif; \n\t - résultats, notamment les aspects suivants : \n\t\t - nature et fréquence des effets pharmacologiques ou toxiques; \n\t\t - gravité ou intensité des effets pharmacologiques ou toxiques; \n\t\t - délai d’apparition des effets; \n\t\t - réversibilité des effets; \n\t\t - durée des effets; \n\t\t - dose-réponse. Dans la mesure du possible, les données doivent être présentées sous forme de tableau par souci de clarté. \n\n Les sections suivantes doivent exposer les conclusions les plus importantes des études, notamment la dose-réponse des effets observés, leur rapport avec les humains et tous les aspects à étudier chez les humains. S’il y a lieu, les conclusions concernant les doses efficaces et les doses non toxiques pour la même espèce animale doivent être comparées (l’index thérapeutique doit être examiné). La pertinence de cette information à l’égard de la posologie prévue pour les humains doit être analysée. Dans la mesure du possible, les comparaisons doivent être faites sur la base des concentrations sanguines/tissulaires plutôt que sur la base du rapport mg/kg. \n\ta. Études pharmacologiques non cliniques \n Un sommaire des aspects pharmacologiques du produit de recherche et, s’il y a lieu, de ses métabolites importants observés chez les animaux, doit être inclus. Ce sommaire doit comprendre des études sur l’évaluation de l’activité thérapeutique possible (modèles d’efficacité, liaison avec les récepteurs et spécificité) ainsi que des études sur l’évaluation de l’innocuité (études spéciales visant à évaluer des effets pharmacologiques autres que les effets thérapeutiques prévus). \n\tb. Comportement pharmacocinétique et métabolique du produit chez les animaux \n Un sommaire du comportement pharmacocinétique du produit de recherche et de la façon dont il est transformé et éliminé chez toutes les espèces étudiées doit être fourni. L’examen des conclusions doit porter notamment sur l’absorption et la biodisponibilité locale et systémique du produit de recherche et de ses métabolites ainsi que sur leur lien avec les effets pharmacologiques et toxicologiques chez les espèces animales. \n\tc. Études toxicologiques \n Un sommaire des effets toxicologiques découverts dans des études connexes menées sur différentes espèces animales doit être présenté sous les rubriques suivantes, s’il y a lieu : \n\t\t - dose unique; \n\t\t - dose répétée; \n\t\t - carcinogénicité; \n\t\t - études spéciales (p.ex., irritation et sensibilisation); \n\t\t - toxicité sur la reproduction; \n\t\t - génotoxicité (mutagénicité)."
    6_label: "Effets sur les humains"
    6_desc: "Introduction \n\n Un examen complet des effets connus du produit de recherche sur les humains doit être fourni, notamment de l’information concernant les effets pharmacocinétiques, métaboliques et pharmacodynamiques du produit, la dose-réponse, l’innocuité et l’efficacité du produit et d’autres effets pharmacologiques du produit. Dans la mesure du possible, un sommaire de tous les essais cliniques terminés doit être fourni. De l’information concernant les résultats liés à toute utilisation du produit de recherche autre que dans les essais cliniques, par exemple l’expérience de mise en marché, doit également être fournie. \n\ta. Comportement pharmacocinétique et métabolique du produit chez les humains \n \n\t\t - Un sommaire des renseignements sur le comportement pharmacocinétique du produit de recherche doit être présenté; on doit y trouver, s’il y a lieu, les renseignements suivants : \n\t\t - comportement pharmacocinétique (métabolisme, s’il y a lieu, et absorption, fixation aux protéines plasmatiques, diffusion et élimination); \n\t\t - biodisponibilité du produit de recherche (absolue, si possible, ou relative) selon une forme posologique de référence; \n\t\t - sous-groupes de population (sexe, âge et fonction de l’organe touché); \n\t\t - interactions (p.ex., interactions produit-produit et effets des aliments); \n\t\t - autres données pharmacocinétiques (résultats d’études démographiques réalisées dans le cadre d’essais cliniques). \n\tb. Innocuité et efficacité \n Il faut présenter un sommaire des renseignements sur l’innocuité, le comportement pharmacodynamique, l’efficacité et la dose-réponse du produit de recherche/produits (y compris les métabolites), obtenus lors d’essais précédents réalisés sur des humains (volontaires en santé ou patients). Les répercussions des données recueillies doivent être analysées. Si plusieurs essais cliniques ont été réalisés, l’utilisation des sommaires des données sur l’innocuité et l’efficacité du produit recueillies dans des essais multiples, selon les indications particulières à des sous-groupes, peut être utile pour une présentation claire des données. Les sommaires des réactions indésirables à un médicament observées dans tous les essais cliniques (y compris les résultats concernant toutes les indications étudiées) présentés sous forme de tableau, peuvent se révéler utiles. Les différences importantes dans les profils/la prévalence des réactions indésirables à un médicament associées à des indications ou à des sous-groupes doivent être examinées. La BI doit comprendre une description des risques possibles et des réactions indésirables à un médicament à prévoir à la lumière d’expériences antérieures réalisées avec le produit de recherche et des produits connexes. Elle doit comporter également une description des précautions à prendre ou de la surveillance spéciale à exercer lorsque le produit est utilisé pour la recherche. \n\tc. Expérience de mise en marché \n La BI doit indiquer les pays où le produit de recherche a été mis en marché ou approuvé. Tous les renseignements importants concernant l’utilisation du produit commercialisé doivent être résumés (p. ex., formulations, posologies, modes d’administration et réactions indésirables au produit). La BI doit également préciser tous les pays où l’enregistrement/mise en marché du produit n’a pas été approuvé ou a été annulé."
    7_label: "Sommaire des données et orientation de l’investigateur"
    7_desc: "Dans cette section, les données cliniques et non cliniques doivent être examinées de façon globale et les renseignements provenant de diverses sources sur différents aspects du produit de recherche doivent être résumés, dans la mesure du possible. L’investigateur disposera ainsi de la meilleure interprétation informative des données disponibles et d’une évaluation des répercussions de ces renseignements sur les futurs essais cliniques. S’il y a lieu, les rapports publiés sur des produits connexes doivent être examinés. Cet examen peut aider l’investigateur à prévoir les réactions indésirables à un médicament ou d’autres problèmes associés aux essais cliniques. "
