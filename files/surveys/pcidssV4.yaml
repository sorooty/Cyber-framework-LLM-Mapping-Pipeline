# n_label are "Exigences de L’approche Définie" might be change to be inside desc for better readability with "ℹ️ Exigences de L’approche Définie \n" and replace ";" by "\n\t-"
1:
  prefix: "Exigence 1"
  title: "Installer et Maintenir des Mesures de Sécurité du Réseau"
  desc: "Les mesures de sécurité de sécurité réseau (NSC), tels que les pare-feu et autres technologies de sécurité réseau, sont des points d’application de la politique réseau qui contrôlent généralement le trafic réseau entre deux ou plusieurs segments de réseau logiques ou physiques (ou sous-réseaux) en fonction de politiques ou de règles prédéfinies. \n\n Les NSC examinent tout le trafic réseau entrant (entrée) et sortant (sortie) d'un segment et décident, en fonction des politiques définies, si le trafic réseau est autorisé à passer ou s'il doit être rejeté. En règle générale, les NSC sont placés entre des environnements avec des besoins de sécurité ou des niveaux de confiance différents, mais dans certains environnements, les NSC contrôlent le trafic vers des appareils individuels indépendamment des limites de confiance. L'application des politiques se produit généralement à la couche 3 du modèle OSI, mais les données présentes dans les couches supérieures sont également fréquemment utilisées pour déterminer les décisions politiques. \n\n Traditionnellement, cette fonction était assurée par des pare-feu physiques ; cependant, cette fonctionnalité peut désormais être fournie par des appareils virtuels, des mesures de sécurité d'accès cloud, des systèmes de virtualisation/conteneurs et d'autres technologies réseau basées sur des logiciels. \n\n Les NSC sont utilisés pour contrôler le trafic au sein des réseaux propres d'une entité ; par exemple, entre des zones hautement sensibles et des zones moins sensibles, et également pour protéger les ressources de l'entité contre l'exposition à des réseaux non fiables. L'environnement de données des titulaires de cartes (CDE) est un exemple de zone plus sensible au sein du réseau d'une entité. Souvent, des chemins apparemment insignifiants vers et depuis des réseaux non fiables peuvent fournir des chemins non protégés vers des systèmes sensibles. Les NSC fournissent un mécanisme de protection clé pour tout réseau informatique. \n\n Les exemples courants de réseaux non fiables incluent Internet, les connexions dédiées telles que les canaux de communication interentreprises, les réseaux sans fil, les réseaux d'opérateurs (tels que les réseaux cellulaires), les réseaux de tiers et d'autres sources que l'entité n'est pas en mesure de contrôler. En outre, les réseaux non fiables incluent également les réseaux d'entreprise qui sont considérés comme hors périmètre pour PCI DSS, car ils ne sont pas évalués et doivent donc être traités comme non fiables car l'existence de mesures de sécurité de sécurité n'a pas été vérifiée. Alors qu'une entité peut considérer qu'un réseau interne est digne de confiance du point de vue de l'infrastructure, si un réseau est hors périmètre pour PCI DSS, ce réseau doit être considéré comme non fiable pour le standard PCI DSS. \n\n Se reporter à l'Annexe G pour les définitions des termes du standard PCI DSS."
  1:
    title: "Les processus et mécanismes d'installation et de maintenance des mesures de sécurité de sécurité du réseau sont définis et compris."
    1_label: "Toutes les politiques de sécurité et procédures opérationnelles identifiées dans l'exigence 1 sont : Documentées; Tenues à jour; Utilisées; Connues de toutes les parties concernées."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les attentes, les mesures de sécurité et la surveillance des activités relatives à l'exigence 1 sont définis, compris et respectés par le personnel concerné. Toutes les activités de soutien sont reproductibles, appliquées de manière cohérente et conformes à l'intention de la direction. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation et interroger le personnel pour vérifier que les politiques de sécurité et les procédures opérationnelles identifiées dans l'exigence 1 sont gérées conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n L'exigence 1.1.1 concerne la gestion et le maintien efficaces des diverses politiques et procédures spécifiées dans toute l'exigence 1. S'il est important de définir les politiques ou procédures spécifiques décrites dans l'Exigence 1, il est tout aussi important de s'assurer qu'elles sont correctement documentées, maintenues et diffusées. \n\n Bonne Pratique \n Il est important de mettre à jour les politiques et les procédures au besoin pour faire face aux changements dans les processus, les technologies et les objectifs métier. Pour ces raisons, penser à mettre à jour ces documents dès que possible après un changement et pas seulement sur un cycle périodique. \n\n Définitions \n Les politiques de sécurité définissent les objectifs et les principes de sécurité de l'entité. Les procédures opérationnelles décrivent la façon d'exécuter les activités et définissent les mesures de sécurité, les méthodes et les processus qui sont suivis pour atteindre le résultat escompté de manière cohérente et conformément aux objectifs de la politique."
    2_label: "Les rôles et les responsabilités liées aux activités de l'exigence 1 sont documentés, attribués et compris."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les responsabilités quotidiennes pour l'exécution de toutes les activités de l'exigence 1 sont attribuées. Le personnel est responsable du bon fonctionnement continu desdites exigences. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation pour vérifier que les descriptions des rôles et des responsabilités des activités de l'exigence 1 sont documentées et attribuées. \n\tb. Interroger le personnel responsable de l'exécution des activités de l'Exigence 1 afin de vérifier que les rôles et les responsabilités sont attribués comme documentés et sont compris. \n\nℹ️ Directives \n Objectif \n Si les rôles et les responsabilités ne sont pas officiellement attribués, le personnel peut ne pas être conscient de ses responsabilités quotidiennes et les activités critiques peuvent ne pas avoir lieu \n\n Bonne Pratique \n Les rôles et les responsabilités peuvent être documentés dans des politiques et procédures, ou conservés dans des documents distincts. \n Dans le cadre de la communication des rôles et des responsabilités, les entités peuvent envisager de demander au personnel de reconnaître leur acceptation et leur compréhension des rôles et responsabilités qui leur sont attribués. \n\n Exemples \n Une méthode pour documenter les rôles et les obligations est une matrice d'attribution des responsabilités qui indique qui est responsable, redevable, consulté et informé (également appelée matrice RACI). "
  2:
    title: "Les mesures de sécurité de sécurité réseau (NSC) sont configurés et maintenus."
    1_label: "Les standards de configuration pour les ensembles de règles NSC sont : Définies. Mise en œuvre. Maintenues."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n La façon dont les NSC sont configurés et fonctionnent est définie et appliquée de manière cohérente. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les standards de configuration des ensembles de règles NSC afin de vérifier que les standards sont conformes à tous les éléments spécifiés dans cette exigence. \tb. Examiner les paramètres de configuration des ensembles de règles NSC afin de vérifier que les ensembles de règles sont mis en œuvre conformément aux standards de configuration. \n\nℹ️ Directives \n Objectif \n La mise en œuvre de ces standards de configuration entraîne la configuration et la gestion du NSC pour exécuter correctement sa fonction de sécurité (souvent appelée ensemble de règles). \n\n Bonne Pratique \n Ces standards définissent souvent les exigences pour les protocoles acceptables, les ports dont l'utilisation est autorisée et les exigences de configuration spécifiques qui sont acceptables. Les standards de configuration peuvent également décrire ce que l'entité considère comme inacceptable ou non autorisé au sein de son réseau. \n\n Définitions \n Les NSC sont des composants clés d'une architecture réseau. Le plus souvent, les NSC sont utilisés aux limites du CDE afin de contrôler le trafic réseau entrant et sortant du CDE. \n Les standards de configuration décrivent les exigences minimales d'une entité pour la configuration de ses NSC. \n\n Exemples \n Des exemples de NSC couverts par ces standards de configuration comprennent, sans toutefois s'y limiter, les pare-feu, les routeurs configurés avec des listes de contrôle d'accès et les réseaux virtuels cloud."
    2_label: "Toutes les modifications apportées aux connexions réseau et aux configurations des NSC sont approuvées et gérées conformément au processus de contrôle des modifications défini dans l'exigence 6.5.1."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les modifications apportées aux connexions réseau et aux NSC ne peuvent pas entraîner une mauvaise configuration, une mise en œuvre de services non sécurisés ou des connexions réseau non autorisées. \n\nℹ️ Notes D’applicabilité \n Les modifications apportées aux connexions réseau comprennent l'ajout, la suppression ou la modification d'une connexion. \n Les modifications apportées aux configurations NSC comprennent celles liées au composant lui même ainsi que celles affectant la manière dont il exécute sa fonction de sécurité. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les procédures documentées pour vérifier que les modifications apportées aux connexions réseau et aux configurations des NSC sont incluses dans le processus formel de contrôle des modifications conformément à l'exigence 6.5.1. \n\tb. Examiner les paramètres de configuration réseau afin d'identifier les modifications apportées aux connexions réseau. Interroger le personnel en charge et examiner les enregistrements de contrôle des modifications afin de vérifier que les modifications identifiées des connexions réseau ont été approuvées et gérées conformément à l'exigence 6.5.1. \n\tc. Examiner les paramètres de configuration réseau afin d'identifier les modifications apportées aux configurations des NSC. Interroger le personnel en charge et examiner les enregistrements de contrôle des modifications afin de vérifier que les modifications identifiées apportées aux configurations des NSC ont été approuvées et gérées conformément à l'exigence 6.5.1. \n\nℹ️ Directives \n\n Bonne Pratique \n Les modifications doivent être approuvées par des personnes ayant l'autorité et les connaissances appropriées pour comprendre l'impact des modifications. La vérification doit fournir une assurance raisonnable que les modifications n'ont eu aucun impact négatif sur la sécurité du réseau et que le changement fonctionne comme prévu. \n Pour éviter d'avoir à résoudre les problèmes de sécurité introduits par un changement, toutes les modifications doivent être approuvées avant d'être mises en œuvre et vérifiées après la mise en œuvre du changement. Une fois les modifications approuvées et vérifiées, la documentation du réseau doit être mise à jour pour inclure lesdites modifications afin d'éviter les incohérences entre la documentation du réseau et la configuration réelle."
    3_label: "Un ou des schémas de réseau précis sont maintenus, montrant toutes les connexions entre le CDE et les autres réseaux, y compris les réseaux sans fil."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Une représentation des limites entre le CDE, tous les réseaux de confiance et tous les réseaux non fiables est maintenue et disponible. \n\nℹ️ Notes D’applicabilité \n Un ou des schémas de réseau actuels ou une autre solution technique ou topologique qui identifie les connexions réseau et les périphériques peuvent être utilisés pour satisfaire à cette exigence. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner le ou les schémas et observer les configurations de réseau afin de vérifier qu'un ou des schémas de réseau précis existent conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Examiner la documentation et interroger le personnel responsable afin de vérifier que le ou les schémas de réseau sont précis et mis à jour en Personnalisée cas de modification de l'environnement. \n\nℹ️ Directives \n Objectif \n Le maintien d'un ou de plusieurs schémas de réseau précis et à jour évite que les connexions et les périphériques réseau ne soient négligés et laissés involontairement non sécurisés et vulnérables à la compromission. \n Un ou des schémas de réseau correctement maintenus aident une entreprise à vérifier son périmètre PCI DSS en identifiant les systèmes se connectant vers et depuis le CDE. \n\n Bonne Pratique \n Toutes les connexions vers et depuis le CDE doivent être identifiées, y compris les systèmes fournissant des services de sécurité, de gestion ou de maintenance aux composants système du CDE. Les entités doivent envisager d'inclure les éléments suivants dans leurs schémas de réseau : \n\t- Tous les emplacements, y compris les emplacements de vente au détail, les centres de données, les emplacements d'entreprise, les fournisseurs de cloud, etc. \n\t- Un étiquetage clair de tous les segments du réseau. \n\t- Tous les mesures de sécurité de sécurité fournissant une segmentation, y compris des identifiants uniques pour chaque contrôle (par exemple, le nom du contrôle, la marque, le modèle et la version). \n\t- Tous les composants systèmes concernés, y compris les NSC, les pare-feu d'applications Web, les solutions anti-programmes malveillants, les solutions de gestion des modifications, les systèmes IDS/IPS, les systèmes d'agrégation de journaux, les terminaux de paiement, les applications de paiement, les HSM, etc. Un étiquetage clair de toutes les zones classées hors périmètre PCI DSS sur le schéma via une case ombrée ou un autre mécanisme. \n\t- La date de la dernière mise à jour et les noms des personnes qui ont effectué et approuvé les mises à jour. \n\t- Une légende ou une clé pour expliquer le schéma. \n Les schémas doivent être mis à jour par un personnel autorisé afin de s'assurer que lesdits schémas continuent de fournir une description précise du réseau."
    4_label: "Un ou des diagrammes de flux de données précis sont maintenus et répondent aux critères suivants : Affiche tous les flux de données de carte à travers tous les systèmes et les réseaux; Mis à jour au besoin lors de modifications apportées à l'environnement."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Une représentation de toutes les transmissions de données de carte entre les composants système et à travers les segments de réseau est maintenue et disponible. \n\nℹ️ Notes D’applicabilité \n Un ou des diagrammes de flux de données ou une autre solution technique ou topologique qui identifie les flux de données de carte à travers les systèmes et les réseaux peuvent être utilisés pour répondre à la présente exigence. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner le ou les diagrammes de flux de données et interroger le personnel afin de vérifier que le ou les diagrammes affichent tous les flux de données de carte conformément à tous les éléments spécifiés dans cette exigence. \tb. Examiner la documentation et interroger le personnel responsable afin de vérifier que le ou les diagrammes de flux de données sont précis et mis à jour en cas de modification de l'environnement. \n\nℹ️ Directives \n Objectif \n Un diagramme de flux de données à jour et facilement disponible aide une entreprise à comprendre et à suivre le périmètre de son environnement en montrant la façon dont les données de carte circulent sur les réseaux et entre les systèmes et les appareils individuels. \n Le maintien à jour d'un ou de plusieurs diagrammes de flux de données évite que les données de carte ne soient ignorées et laissées involontairement non sécurisées. \n\n Bonne Pratique \n Le diagramme de flux de données doit inclure tous les points de connexion où les données de carte sont reçues et envoyées hors du réseau, y compris les connexions aux réseaux publics ouverts, les flux de traitement des applications, le stockage, les transmissions entre les systèmes et les réseaux, ainsi que les sauvegardes de fichiers. \n Le diagramme de flux de données est censé s'ajouter au diagramme de réseau et devrait concorder avec ce dernier et le compléter. Comme Bonne Pratique, les entités peuvent envisager d'inclure les éléments suivants dans leurs diagrammes de flux de données : \n\t- Tous les flux de traitement des données de carte, y compris l'autorisation, la télécollecte/ la remise de la compensation, e règlement, les impayés et les remboursements. \n\t- Tous les canaux d'acceptation distincts, y compris avec carte, sans carte et le commerce électronique. \n\t- Tous les types de réception ou de transmission de données, y compris celles impliquant des supports papier. Le flux de données de carte depuis le point où elles entrent dans l'environnement jusqu'à leur destination finale. \n\t- Où les données de carte sont transmises et traitées, où elles sont stockées et si le stockage est à court ou à long terme. \n\t- La source de toutes les données de carte reçues (par exemple, clients, tiers, etc.) et toutes les entités avec lesquelles les données de carte sont partagées. \n\t- La date de la dernière mise à jour et les noms des personnes qui ont effectué et approuvé les mises à jour."
    5_label: "Tous les services, protocoles et ports autorisés sont identifiés, approuvés et ont un besoin métier défini."
    5_desc: "ℹ️ Objectif de L’approche Personnalisée \n Un trafic réseau non autorisé (services, protocoles ou paquets destinés à des ports spécifiques) ne peut pas entrer ou sortir du réseau. \n\nℹ️ Procédures de Test de L’approche Définie \n\ta. Examiner la documentation afin de vérifier qu'il existe une liste de tous les services, protocoles et ports autorisés, y compris la justification métier et l'approbation de chacun desdits services. \n\tb. Examiner les paramètres de configuration des NSC afin de vérifier que seuls les services, protocoles et ports approuvés sont utilisés. \n\nℹ️ Directives \n Objectif \n Des compromissions surviennent souvent en raison de services (par exemple, telnet et FTP), de protocoles et de ports inutilisés ou non sécurisés, car ceux-ci peuvent entraîner l'ouverture de points d'accès inutiles dans le CDE. Par ailleurs, les services, protocoles et ports activés mais non utilisés sont souvent négligés et laissés non sécurisés et non corrigés. En identifiant les services, protocoles et ports nécessaires à l'activité, les entités peuvent garantir que tous les autres services, protocoles et ports sont désactivés ou éliminés. \n\n Bonne Pratique \n Le risque de sécurité associé à chaque service, protocole et port autorisé doit être compris. Les approbations doivent être accordées par un personnel indépendant de ceux qui gèrent la configuration. Le personnel d'approbation doit posséder les connaissances et la responsabilité nécessaires pour prendre des décisions d'approbation."
    6_label: "Les fonctionnalités de sécurité sont définies et mises en œuvre pour tous les services, protocoles et ports utilisés et considérés comme non sécurisés, de sorte que le risque soit atténué. "
    6_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les risques spécifiques associés à l'utilisation de services, de protocoles et de ports non sécurisés sont compris, évalués et atténués de manière adéquate. \n\nℹ️ Procédures de Test de L’approche Définie \na. Examiner la documentation qui identifie tous les services, protocoles et ports non sécurisés utilisés afin de vérifier que pour chacun, des dispositifs de sécurité sont définis pour atténuer le risque. \n\tb. Examiner les paramètres de configuration des NSC afin de vérifier que les dispositifs de sécurité définies sont mis en œuvre pour chaque service, protocole et port identifié comme non sécurisé. \n\nℹ️ Directives \n Objectif \n Les compromissions profitent des configurations réseau non sécurisées. \n\n Bonne Pratique \n Si des services, protocoles ou ports non sécurisés sont nécessaires à l'activité de l'entreprise, le risque posé par ces services, protocoles et ports doit être clairement compris et accepté par l'entreprise, l'utilisation du service, du protocole ou du port doit être justifiée, et les dispositifs de sécurité qui atténuent le risque d'utilisation de ces services, protocoles et ports doivent être définies et mises en œuvre par l'entité. \n\n Définitions \n Pour des directives sur les services, protocoles ou ports considérés comme non sécurisés, se référer aux standards et conseils du secteur (par exemple, de NIST, ENISA, OWASP)."
    7_label: "Les configurations des NSC sont revues au moins une fois tous les six mois pour confirmer qu'elles sont pertinentes et efficaces."
    7_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les configurations NSC qui autorisent ou limitent l'accès aux réseaux de confiance sont vérifiées périodiquement afin de s'assurer que seules les connexions autorisées par une justification métier actuelle sont autorisées. \n\nℹ️ Procédures de Test de L’approche Définie \n\ta. Examiner la documentation afin de vérifier que des procédures sont définies pour l'examen des configurations des NSC au moins une fois tous les six mois. \n\tb. Examiner la documentation relative aux configurations pour les NSC et interroger le personnel responsable afin de vérifier que les revues ont lieu au moins une fois tous les six mois. \n\tc. Examiner les configurations des NSC afin de vérifier que les configurations identifiées comme n'étant plus appuyées par une justification métier sont supprimées ou mises à jour. \n\nℹ️ Directives \n Objectif \n Un tel examen donne à l'entreprise la possibilité de nettoyer toutes les règles et configurations inutiles, obsolètes ou incorrectes qui pourraient être utilisées par une personne non autorisée. En outre, il garantit que toutes les règles et configurations n'autorisent que les services, protocoles et ports autorisés qui correspondent aux justifications métier documentées. \n\n Bonne Pratique \n Cette revue, qui peut être mise en œuvre grâce à de méthodes manuelles, automatisées ou basées sur le système, est destinée à confirmer que les paramètres qui gèrent les règles de trafic, ce qui est autorisé dans et hors du réseau, correspondent aux configurations approuvées. La revue doit fournir la confirmation que tout accès autorisé a une raison métier justifiée. Toute déviation ou incertitude concernant une règle ou une configuration doit être signalée pour résolution. \n Bien que cette exigence spécifie que cette revue a lieu au moins une fois tous les six mois, les entreprises avec un volume élevé de changements de leurs configurations réseau peuvent envisager d'effectuer des revues plus fréquemment afin de s'assurer que les configurations continuent de répondre aux besoins métier."
    8_label: "Les fichiers de configuration des NSC sont comme suit : Sécurisés contre les accès non autorisés; Maintenus cohérents avec les configurations de réseau actives."
    8_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les NSC ne peuvent pas être définis ou modifiés en utilisant des objets de configuration non fiables (y compris des fichiers). \n\nℹ️ Notes D’applicabilité \n Tout fichier ou paramètre utilisé pour configurer ou synchroniser les NSC est considéré « fichier de configuration ». Cela inclut les fichiers, les mesures de sécurité automatisée et les mesures de sécurité basée sur le système, les scripts, les paramètres, l'infrastructure en tant que code ou d'autres paramètres qui sont sauvegardés, archivés ou stockés à distance. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les fichiers de configuration des NSC afin de vérifier qu'ils sont conformes à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Afin de prévenir l'application de configurations non autorisées au réseau, les fichiers stockés avec des configurations réseau doivent être tenus à jour et protégés contre les modifications non autorisées. \n Le maintien des informations de configuration à jour et sécurisées garantit que les paramètres corrects pour les NSC sont appliqués chaque fois que la configuration est exécutée. \n\n Exemples \n Si la configuration sécurisée d'un routeur est stockée dans une mémoire non volatile, lorsque ce routeur est réinitialisé ou redémarré, ces mesures de sécurité doivent garantir que sa configuration sécurisée a été rétablie."
  3:
    title: "L'accès au réseau vers et depuis l'environnement de données du titulaire de carte est restreint."
    1_label: "Le trafic entrant vers le CDE est limité comme suit : Seul le trafic qui est nécessaire; Tout autre trafic est spécifiquement refusé."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Le trafic non autorisé ne peut pas entrer dans le CDE. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les standards de configuration des NSC afin de vérifier qu'elles définissent la restriction du trafic entrant vers le CDE conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Examiner les configurations des NSC afin de vérifier que le trafic entrant vers le CDE est limité conformément à tous les éléments spécifiés Personnalisée dans cette exigence. \n\nℹ️ Directives \n Objectif \n Cette exigence vise à empêcher les individus malveillants d'accéder au réseau de l'entité via des adresses IP non autorisées ou d'utiliser des services, des protocoles ou des ports d’une manière non autorisée. \n\n Bonne Pratique \n Tout le trafic entrant vers le CDE, quelle que soit sa provenance, doit être évalué pour s'assurer qu'il respecte les règles établies et autorisées. Les connexions doivent être inspectées pour s'assurer que le trafic est limité aux seules communications autorisées, par exemple, en limitant les adresses et les ports source/destination et en bloquant le contenu. \n\n Exemples \n La mise en œuvre d'une règle qui refuse tout trafic entrant et sortant qui n'est pas spécifiquement nécessaire (par exemple, en utilisant une instruction explicite « tout refuser » ou implicite après autorisation) permet d'éviter des failles accidentelles qui permettraient un trafic involontaire et potentiellement dangereux."
    2_label: "Le trafic sortant du CDE est limité comme suit : Seul le trafic qui est nécessaire; Tout autre trafic est spécifiquement refusé."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Le trafic non autorisé ne peut pas sortir du CDE. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les standards de configuration des NSC afin de vérifier qu'elles définissent la restriction du trafic sortant du CDE conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Examiner les configurations des NSC afin de vérifier que le trafic sortant du CDE est limité conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Cette exigence vise à empêcher les individus malveillants et les composants système compromis au sein du réseau de l'entité de communiquer avec un hôte externe non fiable. \n\n Bonne Pratique \n Tout le trafic sortant du CDE, quelle que soit sa destination, doit être évalué pour s'assurer qu'il respecte les règles établies et autorisées. Les connexions doivent être inspectées pour limiter le trafic aux seules communications autorisées, par exemple, en limitant les adresses et les ports source/destination et en bloquant le contenu. \n\n Exemples \n La mise en œuvre d'une règle qui refuse tout trafic entrant et sortant qui n'est pas spécifiquement nécessaire (par exemple, en utilisant une instruction explicite « tout refuser » ou implicite après autorisation) permet d'éviter des failles accidentelles qui permettraient un trafic involontaire et potentiellement dangereux."
    3_label: "Les NSC sont installés entre tous les réseaux sans fil et le CDE, que le réseau sans fil soit ou non un CDE, de sorte que : Tout le trafic sans fil allant des réseaux sans fil vers le CDE est refusé par défaut; Seul le trafic sans fil avec des besoins métier autorisés est autorisé à accéder au CDE."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Le trafic non autorisé ne peut pas traverser les frontières du réseau entre les réseaux sans fil et les environnements câblés dans le CDE. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les paramètres de configuration et les schémas réseau afin de vérifier que les NSC sont mis en œuvre entre tous les réseaux sans fil et le CDE, conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n La mise en œuvre et l'exploitation connues (ou inconnues) de la technologie sans fil au sein d'un réseau sont une porte d’entrée courante utilisée par les individus malveillants pour accéder au réseau et aux données de carte. Si un appareil ou un réseau sans fil est installé à l'insu de l'entité, un individu malveillant pourrait facilement et « invisiblement » accéder au réseau. Si les NSC ne limitent pas l'accès des réseaux sans fil au CDE, les individus malveillants qui obtiennent un accès non autorisé au réseau sans fil peuvent facilement se connecter au CDE et compromettre les informations de compte."
  4:
    title: "Les connexions réseau entre les réseaux de confiance et les réseaux non fiables sont contrôlées."
    1_label: " Les NSC sont mis en œuvre entre les réseaux approuvés et les réseaux non fiables."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Le trafic non autorisé ne peut pas traverser les frontières du réseau entre les réseaux de confiance et ceux non fiables. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les standards de configuration et les schémas réseau afin de vérifier que les NSC sont définis entre les réseaux approuvés et les réseaux non fiables. \n\tb. Examiner les configurations réseau afin de vérifier que les NSC sont en place entre les réseaux de confiance et les réseaux non fiables, conformément aux standards de configuration et aux schémas de réseau documentés. \n\nℹ️ Directives \n Objectif \n La mise en œuvre de NSC à chaque connexion entrante et sortant de réseaux de confiance permet à l'entité de surveiller et de contrôler l'accès, et minimise les chances qu'un individu malveillant obtienne l'accès au réseau interne via une connexion non protégée. \n\n Exemples \n Une entité pourrait mettre en œuvre une DMZ, qui est une partie du réseau qui gère les connexions entre un réseau non fiable (pour des exemples de réseaux non fiables, se reporter à l'exigence 1 - Aperçu) et les services qu'une organisation doit mettre à la disposition du public, tels qu'un serveur Web. Veuillez noter que si la DMZ d'une entité traite ou transmet des données de carte (par exemple, un site Web de commerce électronique), elle est également considérée comme un CDE."
    2_label: "Le trafic entrant des réseaux non fiables vers les réseaux de confiance est limité : Aux communications avec des composants systèmes autorisés à fournir des services, des protocoles et des ports accessibles au public; Aux réponses avec état aux communications initiées par les composants système dans un réseau de confiance; Tout autre trafic est refusé."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Seul le trafic autorisé ou qui est une réponse à un composant système dans le réseau de confiance peut entrer dans un réseau de confiance à partir d'un réseau non fiable. \n\nℹ️ Notes D’applicabilité \n Le but de cette exigence est de traiter des sessions de communication entre les réseaux de confiance et les réseaux non fiables, plutôt que les spécificités des protocoles. \n Cette exigence ne limite pas l'utilisation du protocole UDP ou d'autres protocoles réseau en mode non connecté si l'état est maintenu par le NSC. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation du fournisseur et les configurations des NSC afin de vérifier que le trafic entrant des réseaux non fiables vers les réseaux de confiance est limité conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n S'assurer que l'accès public à un composant système est spécifiquement autorisé réduit le risque que les composants système soient inutilement exposés à des réseaux non fiables. \n\n Bonne Pratique \n Les composants système qui fournissent des services accessibles au public, tels que les serveurs de messagerie, Web et DNS, sont les plus vulnérables aux menaces provenant de réseaux non fiables. \n L'idéal est que ces systèmes soient placés dans un réseau de confiance dédié, qui soit accessible au public (par exemple, une DMZ) mais qui est séparé à l'aide de NSC des systèmes internes plus sensibles, ce qui contribue à protéger le reste du réseau au cas où ces systèmes accessibles de l'extérieur seraient compromis. Cette fonctionnalité est destinée à empêcher les personnes malveillantes d'accéder au réseau interne de l'organisation à partir d'Internet, ou d'utiliser des services, des protocoles ou des ports de manière non autorisée. \n Lorsque cette fonctionnalité est fournie en tant que caractéristique intégrée d'un NSC, l'entité doit s'assurer que ses configurations n'entraînent pas la désactivation ou le contournement de la fonctionnalité.  \n\n Définitions \n Le maintien de « l'état » (ou le statut) de chaque connexion dans un réseau signifie que le NSC « sait » si une réponse apparente à une connexion précédente est une réponse valide et autorisée (puisque le NSC conserve le statut de chaque connexion) ou s'il s'agit d'un trafic malveillant essayant de tromper le NSC pour qu’il autorise la connexion."
    3_label: "Des mesures d’anti usurpation sont mises en œuvre afin de détecter et empêcher les adresses IP sources falsifiées d'entrer dans le réseau de confiance."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les paquets avec des adresses IP source falsifiées ne peuvent pas entrer dans un réseau de confiance. \n\nℹ️ Procédures de Test de L’approche Définie \n Examiner la documentation et les configurations du fournisseur pour les NSC afin de vérifier que des mesures d’anti usurpation sont mises en œuvre pour détecter et empêcher les adresses IP sources falsifiées d'entrer dans le réseau de confiance. \n\nℹ️ Directives \n Objectif \n Le filtrage des paquets entrant dans le réseau de confiance permet, entre autres, de garantir que les paquets ne sont pas « falsifiés » pour apparaître comme s'ils provenaient du propre réseau interne d'une entreprise. Par exemple, des mesures d’anti usurpation empêchent les adresses internes provenant d'Internet de passer dans la DMZ. \n\n Bonne Pratique \n Les produits sont généralement livrés avec un paramètre d’anti usurpation par défaut et peuvent ne pas être configurables. Les entités doivent se reporter à la documentation du fournisseur pour plus d'informations. \n\n Exemples \n Normalement, un paquet contient l'adresse IP de l'ordinateur qui l'a envoyé à l'origine afin que les autres ordinateurs du réseau sachent d'où provient le paquet. \n Des personnes malveillantes essaieront souvent d'usurper (ou d'imiter) l'adresse IP d'envoi pour faire croire au système cible que le paquet provient d'une source fiable. "
    4_label: "Les composants système qui stockent les données des titulaires de cartes ne sont pas directement accessibles à partir de réseaux non fiables."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les données de titulaires de cartes stockées ne sont pas accessibles à partir de réseaux non fiables. \n\nℹ️ Notes D’applicabilité \n Cette exigence n'est pas destinée à être appliquée au stockage des données de carte dans la mémoire volatile, mais à être appliquée lorsque la mémoire est traitée comme un stockage persistant (par exemple, un disque virtuel). Les données de carte peuvent être stockées dans la mémoire volatile uniquement le temps nécessaire pour prendre en charge le processus métier associé (par exemple, jusqu'à la fin de la transaction par carte de paiement associée). \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner le diagramme de flux de données et le schéma réseau afin de vérifier que la documentation justifie que les composants du système stockant les données des titulaires de cartes ne sont pas directement accessibles à partir des réseaux non fiables. \n\tb. Examiner les configurations des NSC afin de vérifier que les mesures de sécurité sont mises en œuvre de telle sorte que les composants du système stockant les données des titulaires de carte ne soient pas directement accessibles à partir de réseaux non fiables. \n\nℹ️ Directives \n Objectif \n Les données de titulaires de cartes qui sont directement accessibles depuis un réseau non fiable, par exemple, parce qu'elles sont stockées sur un système au sein de la DMZ ou dans un service de base de données cloud, sont plus faciles d'accès par un attaquant externe car il y a moins de couches défensives à pénétrer. Il est possible d'empêcher le trafic réseau non autorisé d'atteindre le composant du système en utilisant des NSC afin de garantir que les composants système qui stockent les données des titulaires de cartes (tels qu'une base de données ou un fichier) ne soient directement accessibles qu'à partir de réseaux de confiance."
    5_label: "La divulgation des adresses IP internes et des informations de routage est limitée aux seules parties autorisées."
    5_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les informations du réseau interne sont protégées contre toute divulgation non autorisée. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les configurations des NSC afin de vérifier que la divulgation des adresses IP internes et des informations de routage est limitée aux seules parties autorisées. \n\tb. Interroger le personnel et examiner la documentation afin de vérifier que des mesures de sécurité sont mis en œuvre de manière à ce que toute divulgation d'adresses IP internes et d'informations de routage soit limitée aux seules parties autorisées. \n\nℹ️ Directives \n Objectif \n Limiter la divulgation des adresses IP internes, privées et locales est nécessaire afin d'empêcher un pirate d'avoir la connaissance de ces adresses IP et de les utiliser pour accéder au réseau. \n\n Bonne Pratique \n Les méthodes utilisées pour satisfaire à l'intention de cette exigence peuvent varier, selon la technologie de réseau spécifique utilisée. Par exemple, les mesures de sécurité utilisée pour répondre à cette exigence peuvent être différents pour les réseaux IPv4 et les réseaux IPv6. \n\n Exemples \n Les méthodes pour masquer l'adressage IP peuvent inclure, sans toutefois s'y limiter : \n\t- Traduction d'adresses réseau (NAT) IPv4. \n\t- Placer les composants système derrière les serveurs proxy ou les NSC. \n\t- Suppression ou filtrage des annonces d'itinéraire pour les réseaux internes qui utilisent un adressage enregistré. \n\t- Utilisation interne du standard RFC 1918 (IPv4) ou utilisation de l'extension de confidentialité IPv6 (RFC 4941) lors du lancement de sessions sortantes vers Internet."
  5:
    title: "Les risques pour le CDE provenant d'appareils informatiques capables de se connecter à la fois à des réseaux non fiables et au CDE sont atténués."
    1_label: "Des mesures de sécurité de sécurité sont mis en œuvre sur tous les appareils informatiques, y compris les appareils appartenant à l'entreprise et aux employés, qui se connectent à la fois aux réseaux non fiables (y compris Internet) et au CDE, de la manière suivante : Des paramètres de configuration spécifiques sont définis afin d'empêcher l'introduction de menaces dans le réseau de l'entité; Les mesures de sécurité de sécurité sont activées et en cours d'exécution; Les mesures de sécurité de sécurité ne sont pas modifiables par les utilisateurs des appareils informatiques, à moins qu'ils ne soient spécifiquement documentés et autorisés par la direction au cas par cas pour une période limitée."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les appareils qui se connectent à des environnements non fiables et se connectent également au CDE ne peuvent pas introduire de menaces au CDE de l'entité. \n\nℹ️ Notes D’applicabilité \n Ces mesures de sécurité de sécurité ne peuvent être temporairement désactivés que s'il existe un besoin technique légitime, autorisé par la direction au cas par cas. Si ces mesures de sécurité de sécurité doivent être désactivés dans un but précis, cette décision doit être formellement autorisée. Des mesures de sécurité supplémentaires peuvent également devoir être mises en œuvre pour la période pendant laquelle ces mesures de sécurité de sécurité ne sont pas actifs. \n Cette exigence s'applique aux appareils informatiques appartenant aux employés et à l'entreprise. Les systèmes qui ne peuvent pas être gérés par la politique de l'entreprise introduisent des faiblesses et offrent des opportunités que des individus malveillants peuvent exploiter. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et les standards de configuration et interroger le personnel afin de vérifier que les mesures de sécurité de sécurité pour les appareils informatiques qui se connectent à la fois aux réseaux non fiables et au CDE, sont mis en œuvre conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Examiner les paramètres de configuration sur les appareils informatiques qui se connectent à la fois aux réseaux non fiables et au CDE afin de vérifier que les paramètres sont mis en œuvre conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Les appareils informatiques autorisés à se connecter à Internet de l'extérieur de l'environnement de l'entreprise (par exemple, ordinateurs de bureau, ordinateurs portables, tablettes, smartphones et autres appareils informatiques mobiles utilisés par les employés) sont plus vulnérables aux menaces Internet. \n L'utilisation de mesures de sécurité de sécurité tels que des mesures de sécurité basés sur l'hôte (par exemple, un logiciel de pare-feu personnel ou des solutions de protection des terminaux), des mesures de sécurité de sécurité basés sur le réseau (par exemple, des pare-feu, une inspection heuristique basée sur le réseau et une simulation de logiciels malveillants) ou du matériel, aide à protéger les appareils contre les attaques sur Internet, qui pourraient utiliser l'appareil pour accéder aux systèmes et aux données de l'entreprise lorsque l'appareil se reconnecte au réseau. \n\n Bonne Pratique \n Les paramètres de configuration spécifiques sont déterminés par l'entité et doivent être conformes à ses politiques et procédures de sécurité réseau. Lorsqu'il existe un besoin légitime de désactiver temporairement les mesures de sécurité de sécurité sur un appareil appartenant à l'entreprise ou à un employé qui se connecte à la fois à un réseau non fiable et au CDE, par exemple pour soutenir une activité de maintenance spécifique ou une enquête sur un problème technique, la raison pour prendre une telle mesure est comprise et approuvée par un représentant approprié de la direction. \n Toute désactivation ou modification de ces mesures de sécurité de sécurité, y compris sur les propres appareils des administrateurs, est effectuée par du personnel autorisé. \n Il est reconnu que les administrateurs ont des privilèges qui peuvent leur permettre de désactiver les mesures de sécurité de sécurité sur leurs propres ordinateurs, mais des mécanismes d'alerte doivent être mis en place lorsque ces mesures de sécurité sont désactivées et un suivi est effectué pour s'assurer que les processus ont été suivis. \n\n Exemples \n Les pratiques incluent l'interdiction de la tunnelisation fractionnée des VPN pour les appareils mobiles appartenant aux employés ou à l'entreprise, et l'exigence que ces appareils démarrent dans un VPN."
2:
  prefix: "Exigence 2"
  title: "Appliquer des Configurations Sécurisées à tous les Composants Système"
  desc: "Les personnes malveillantes, à la fois externes et internes à une entité, utilisent souvent des mots de passe par défaut et d'autres paramètres par défaut du fournisseur afin de compromettre les systèmes. Ces mots de passe et paramètres sont bien connus et sont facilement déterminés via des informations publiques. \n\n L'application de configurations sécurisées aux composants système réduit les moyens dont dispose un attaquant pour compromettre le système. La modification des mots de passe par défaut, la suppression des logiciels, fonctions et comptes inutiles et la désactivation ou la suppression de services inutiles contribuent tous à réduire le périmètre d'attaque potentielle. \n\n Se reporter à l'Annexe G pour les définitions des termes du standard PCI DSS."
  1:
    title: "Les processus et mécanismes d'application de configurations sécurisées à tous les composants système sont définis et compris."
    1_label: "Toutes les politiques de sécurité et procédures opérationnelles identifiées dans l'exigence 2 sont : Documentées; Tenues à jour; Utilisées; Connues de toutes les parties concernées."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les attentes, les mesures de sécurité et la surveillance des activités relatives à l'exigence 2 sont définis et respectés par le personnel concerné. Toutes les activités de soutien sont reproductibles, appliquées de manière cohérente et conformes à l'intention de la direction. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation et interroger le personnel pour vérifier que les politiques de sécurité et les procédures opérationnelles identifiées dans l'exigence 2 sont gérées conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n L'exigence 2.1.1 concerne la gestion et le maintien efficaces des diverses politiques et procédures spécifiées dans toute l'exigence 2. S'il est important de définir les politiques ou procédures spécifiques décrites dans l'Exigence 2, il est tout aussi important de s'assurer qu'elles sont correctement documentées, maintenues et diffusées. \n\n Bonne Pratique \n Il est important de mettre à jour les politiques et les procédures au besoin pour faire face aux changements dans les processus, les technologies et les objectifs métier. Pour cette raison, penser à mettre à jour ces documents dès que possible après un changement et pas seulement sur un cycle périodique. \n\n Définitions \n Les politiques de sécurité définissent les objectifs et les principes de sécurité de l'entité. Les procédures opérationnelles décrivent la façon d'exécuter les activités et définissent les mesures de sécurité, les méthodes et les processus qui sont suivis pour atteindre le résultat escompté de manière cohérente et conformément aux objectifs de la politique."
    2_label: "Les rôles et les responsabilités liées aux activités de l'exigence 2 sont documentés, attribués et compris."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les responsabilités quotidiennes pour l'exécution de toutes les activités de l'exigence 2 sont attribuées. Le personnel est responsable du bon fonctionnement continu desdites exigences. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation pour vérifier que les descriptions des rôles et des responsabilités pour l'exécution des activités de l'exigence 2 sont documentées et attribuées. \n\tb. Interroger le personnel ayant la responsabilité de l'exécution des activités de l'Exigence 2 afin de vérifier que les rôles et les responsabilités sont attribués comme documentés et sont compris. \n\nℹ️ Directives \n Objectif \n Les rôles et les responsabilités peuvent être documentés dans des politiques et procédures, ou conservés dans des documents distincts. \n Dans le cadre de la communication des rôles et des responsabilités, les entités peuvent envisager de demander au personnel de reconnaître leur acceptation et leur compréhension des rôles et responsabilités qui leur sont attribués. \n\n Exemples \n Une méthode pour documenter les rôles et les obligations est une matrice d'attribution des responsabilités qui indique qui est responsable, redevable, consulté et informé (également appelée matrice RACI)."
  2:
    title: "Les composants système sont configurés et gérés en toute sécurité."
    1_label: "Les standards de configuration sont élaborées, mises en œuvre et maintenues pour : Couvrir tous les composants système; Corriger toutes les vulnérabilités de sécurité connues; Se conformer aux standards relatifs à la sécurité renforcée des systèmes agréés par l'industrie ou aux recommandations pour une sécurité renforcée des fournisseurs; Se tenir informé des nouvelles vulnérabilités identifiées, comme défini dans l'exigence 6.3.1; Être appliquées lorsque de nouveaux systèmes sont configurés et vérifiés comme étant en place avant ou immédiatement après la connexion d'un composant système à un environnement de production."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Tous les composants système sont configurés de manière sécurisée et uniforme et conformément aux standards de sécurité renforcée, agréées par l'industrie ou aux recommandations des fournisseurs. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les standards de configuration du système afin de vérifier qu'elles définissent des processus qui incluent tous les éléments spécifiés dans cette exigence. \n\tb. Examiner les politiques et les procédures et interroger le personnel afin de vérifier que les standards de configuration du système sont mises à jour à mesure que de nouveaux problèmes de vulnérabilité sont identifiés, comme défini dans l'exigence 6.3.1. \n\tc. Examiner les paramètres de configuration et interroger le personnel afin de vérifier que les standards de configuration du système sont appliqués lorsque de nouveaux systèmes sont configurés et vérifiés comme étant en place avant ou immédiatement après la connexion d'un composant système à un environnement de production. \n\nℹ️ Directives \n Objectif \n Il existe des faiblesses connues touchant de nombreux systèmes d'exploitation, bases de données, périphériques réseau, logiciels, applications, images conteneurs et autres périphériques utilisés par une entité ou dans l'environnement d'une entité. Il existe également des moyens connus de configurer ces composants système afin de corriger les failles de sécurité. La correction des vulnérabilités de sécurité réduit les opportunités disponibles pour un attaquant. \n En élaborant des standards, les entités s'assurent que leurs composants système seront configurés de manière uniforme et sécurisée, et répondent à la protection des appareils pour lesquels une sécurité renforcée complète peut être plus difficile. \n\n Bonne Pratique \n Se tenir au courant des directives actuelles de l'industrie aidera l'entité à maintenir des configurations sécurisées. \n Les mesures de sécurité spécifiques à appliquer à un système varieront et devraient être adaptés au type et à la fonction du système. \n De nombreuses entreprises de sécurité ont établi des directives et des recommandations visant une sécurité renforcée des systèmes, qui indiquent comment corriger les failles courantes et connues. \n\n Informations Complémentaires \n Les sources de conseils sur les standards de configuration incluent, sans toutefois s'y limiter : Center for Internet Security (CIS), International Organization for Standardization (ISO), National Institute of Standards and Technology (NIST), Cloud Security Alliance et les fournisseurs de produits."
    2_label: "Les comptes par défaut du fournisseur sont gérés comme suit : Si le ou les comptes par défaut du fournisseur sont utilisés, le mot de passe par défaut est modifié conformément à l'exigence 8.3.6; Si le ou les comptes par défaut du fournisseur ne sont pas utilisés, le compte est supprimé ou désactivé."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les composants système ne sont pas accessibles par des mots de passe par défaut. \n\nℹ️ Notes D’applicabilité \n Cela s'applique à TOUS les comptes et mots de passe par défaut des fournisseurs, y compris, sans toutefois s'y limiter, ceux utilisés avec des valeurs par défaut par les systèmes d'exploitation, les logiciels qui fournissent des services de sécurité, les comptes d'application et système, les terminaux de point de vente (POS), les applications de paiement et le Protocole simplifié de gestion de réseau (SNMP). \n Cette exigence s'applique également lorsqu'un composant système n'est pas installé dans l'environnement d'une entité ; par exemple, des logiciels et des applications qui font partie du CDE et qui sont accessibles via un service d'abonnement cloud. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les standards de configuration du système afin de vérifier qu'elles incluent la gestion des comptes par défaut des fournisseurs conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Examiner la documentation du fournisseur et observer un administrateur système se connecter à l'aide des comptes par défaut du fournisseur pour vérifier que les comptes sont mis en œuvre conformément à tous les éléments spécifiés dans cette exigence. \n\tc. Examiner les fichiers de configuration et interroger le personnel afin de vérifier que tous les comptes par défaut du fournisseur qui ne seront pas utilisés sont supprimés ou désactivés. \n\nℹ️ Directives \n Objectif \n Les personnes malveillantes utilisent souvent les noms de compte et les mots de passe par défaut des fournisseurs afin de compromettre les systèmes d'exploitation, les applications et les systèmes sur lesquels ils sont installés. Étant donné que ces paramètres par défaut sont souvent publiés et bien connus, leur modification rendra les systèmes moins vulnérables aux attaques. \n\n Bonne Pratique \n Tous les comptes par défaut des fournisseurs doivent être identifiés, et leur objectif et leur utilisation compris. Il est important d'établir des mesures de sécurité pour les comptes d'application et système, y compris ceux utilisés pour déployer et maintenir les services cloud afin qu'ils n'utilisent pas de mots de passe par défaut et ne soient pas utilisables par des personnes non autorisées. \n Lorsqu'un compte par défaut n'est pas destiné à être utilisé, changer le mot de passe par défaut en un mot de passe unique qui répond à l'exigence 8.3.6 du standard PCI DSS, supprimer tout accès au compte par défaut, puis désactiver le compte, empêchera une personne malveillante d'activer le compte et l'accès avec le mot de passe par défaut. \n L'utilisation d'un réseau intermédiaire isolé pour installer et configurer de nouveaux systèmes est recommandée et peut également être utilisée afin de confirmer que les informations d'identification par défaut n'ont pas été introduites dans les environnements de production. \n\n Exemples \n Les valeurs par défaut à prendre en compte comportent les identifiants utilisateur, les mots de passe et d'autres informations d'authentification couramment utilisées par les fournisseurs dans leurs produits."
    3_label: "Les fonctions principales nécessitant différents niveaux de sécurité sont gérées de la manière suivante : Une seule fonction principale existe sur un composant système, OU Les fonctions principales avec des niveaux de sécurité différents qui existent sur le même composant système sont isolées les unes des autres, OU Les fonctions principales avec des niveaux de sécurité différents sur le même composant système sont toutes sécurisées au niveau exigé par la fonction ayant le besoin de sécurité le plus élevé."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les fonctions principales avec des besoins de sécurité inférieurs ne peuvent pas avoir une incidence sur la sécurité des fonctions principales avec des besoins de sécurité plus élevés sur le même composant système. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les standards de configuration du système afin de vérifier qu'elles incluent la gestion des fonctions principales nécessitant différents niveaux de sécurité, tel que spécifié dans cette exigence. \n\tb. Examiner les configurations du système afin de vérifier que les fonctions principales nécessitant différents niveaux de sécurité sont gérées selon l'une des façons spécifiées dans cette exigence. \n\tc. Lorsque des technologies de virtualisation sont utilisées, examiner les configurations système afin de vérifier que les fonctions système nécessitant différents niveaux de sécurité sont gérées de l'une des manières suivantes : \n\t- Des fonctions ayant des besoins de sécurité différents ne coexistent pas sur le même composant système. \n\t- Les fonctions avec des besoins de sécurité différents qui existent sur le même composant système sont isolées les unes des autres. \n\t- Les fonctions avec des besoins de sécurité différents sur le même composant système sont toutes sécurisées au niveau exigé par la fonction ayant le besoin de sécurité le plus élevé. \n\nℹ️ Directives \n Objectif \n Les systèmes contenant une combinaison de services, de protocoles et de démons pour leur fonction principale auront un profil de sécurité approprié pour permettre à cette fonction d'être efficace. Par exemple, les systèmes qui doivent être directement connectés à Internet auraient un profil particulier, tels qu'un serveur DNS, un serveur Web ou un serveur de commerce électronique. A l'inverse, d'autres composants du système peuvent exécuter une fonction principale comprenant un ensemble différent de services, de protocoles et de démons qui exécute des fonctions qu'une entité ne souhaite pas exposer sur Internet. Cette exigence vise à garantir que différentes fonctions n'ont aucun impact sur les profils de sécurité d'autres services d'une manière qui pourrait les amener à fonctionner à un niveau de sécurité supérieur ou inférieur. \n\n Bonne Pratique \n Il serait idéal que chaque fonction soit placée sur différents composants système. Ceci peut être réalisé en mettant en œuvre une fonction principale unique sur chaque composant système. Une autre option consiste à isoler les fonctions principales sur le même composant système qui ont différents niveaux de sécurité ; par exemple, en isolant les serveurs Web (qui doivent être directement connectés à Internet) des serveurs d'applications et de bases de données. \n Si un composant système contient des fonctions principales qui nécessitent des niveaux de sécurité différents, une troisième option consiste à mettre en œuvre des mesures de sécurité supplémentaires afin de garantir que le niveau de sécurité résultant de la ou des fonctions principales ayant des besoins de sécurité plus élevés n'est pas réduit par la présence des fonctions principales de niveau de sécurité inférieure. Par ailleurs, les fonctions ayant un niveau de sécurité inférieur doivent être isolées et/ou sécurisées afin de s'assurer qu'elles ne peuvent pas accéder ou nuire aux ressources d'une autre fonction du système, et n'introduisent pas de failles de sécurité pour d'autres fonctions sur le même serveur. \n Les fonctions de niveaux de sécurité différents peuvent être isolées par des mesures de sécurité physiques ou logiques. Par exemple, un système de base de données ne doit pas également héberger des services Web, à moins d'utiliser des mesures de sécurité tels que des technologies de virtualisation pour isoler et contenir les fonctions dans des sous-systèmes distincts. Un autre exemple consiste à utiliser des instances virtuelles ou à fournir un accès mémoire dédié par fonction système. \n Lorsque des technologies de virtualisation sont utilisées, les niveaux de sécurité doivent être identifiés et gérés pour chaque composant virtuel. Ci-dessous des exemples de considérations pour les environnements virtualisés : \n\t- La fonction de chaque instance d'application, de conteneur ou de serveur virtuel. \n\t- Comment les machines virtuelles (VM) ou les conteneurs sont stockés et sécurisés."
    4_label: "Seuls les services, protocoles, démons et fonctions nécessaires sont activés et toutes les fonctionnalités inutiles sont supprimées ou désactivées."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les composants système ne peuvent pas être compromis en exploitant les fonctionnalités inutiles présentes dans le composant système. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les standards de configuration du système afin de vérifier que les services système, les protocoles et les démons et fonctions nécessaires sont identifiés et documentés. \n\tb. Examiner les configurations des composants système afin de vérifier les éléments suivants : \n\t- Toutes les fonctionnalités inutiles sont supprimées ou désactivées. \n\t- Seules les fonctionnalités requises, comme celles documentées dans les standards de configuration, sont activées. \n\nℹ️ Directives \n Objectif \n Des services et des fonctions inutiles peuvent offrir des opportunités supplémentaires aux personnes malveillantes d'accéder à un système. En supprimant ou en désactivant tous les services, protocoles, démons et fonctions inutiles, les entreprises peuvent se focaliser sur la sécurisation des fonctions requises et réduire le risque que des fonctions inconnues ou inutiles soient exploitées. \n\n Bonne Pratique \n Il existe de nombreux protocoles qui pourraient être activés par défaut et qui sont couramment utilisés par des personnes malveillantes pour compromettre un réseau. La désactivation ou la suppression de tous les services, fonctions et protocoles qui ne sont pas utilisés minimise le périmètre d'attaque potentielle, par exemple en supprimant ou en désactivant un serveur FTP ou Web inutilisé. \n\n Exemples \n Les fonctionnalités inutiles peuvent inclure, sans toutefois s'y limiter, des scripts, des pilotes, des fonctionnalités, des sous-systèmes, des systèmes de fichiers, des interfaces (USB et Bluetooth) et des serveurs Web inutiles."
    5_label: "Si des services, protocoles ou démons non sécurisés sont présents : La justification métier est documentée; Des fonctionnalités de sécurité supplémentaires sont documentées et mises en œuvre afin de réduire le risque d'utilisation de services, de protocoles ou de démons non sécurisés."
    5_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les composants système ne peuvent pas être compromis en exploitant des services, des protocoles ou des démons non sécurisés. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Si des services, protocoles ou démons non sécurisés sont présents, examiner les standards de configuration du système et interroger le personnel afin de vérifier qu'ils sont gérés et mis en œuvre conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Si des services, des protocoles ou des démons non sécurisés sont présents, examiner les paramètres de configuration afin de vérifier que des fonctionnalités de sécurité supplémentaires sont mises en œuvre pour réduire le risque d'utiliser des services, des démons et des protocoles non sécurisés. \n\nℹ️ Directives \n Objectif \n La garantie que tous les services, protocoles et démons non sécurisés sont correctement sécurisés avec des fonctionnalités de sécurité adéquates rend plus difficile pour les personnes malveillantes d'exploiter les points habituels de compromission au sein d'un réseau. \n\n Bonne Pratique \n L'activation des fonctionnalités de sécurité avant le déploiement de nouveaux composants système empêchera l'introduction de configurations non sécurisées dans l'environnement. Des solutions de certains fournisseurs peuvent fournir des fonctions de sécurité supplémentaires afin d'aider à sécuriser un processus non sécurisé. \n\n Définitions \n Pour des directives sur les services, les protocoles ou les démons considérés comme non sécurisés, se reporter aux standards et aux conseils du secteur (par exemple, tels que publiés par NIST, ENISA et OWASP)."
    6_label: "Les paramètres de sécurité du système sont configurés afin d'éviter toute utilisation abusive."
    6_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les composants système ne peuvent pas être compromis en raison d'une configuration incorrecte des paramètres de sécurité. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les standards de configuration du système afin de vérifier qu'elles contiennent la configuration des paramètres de sécurité du système pour éviter toute utilisation abusive. \n\tb. Interroger les administrateurs système et/ou les responsables de la sécurité afin de vérifier qu'ils connaissent les paramètres de sécurité courants pour les composants système. \n\tc. Examiner les composants du système afin de vérifier que les paramètres de sécurité courants sont définis de manière adéquate et conformément aux standards de configuration du système. \n\nℹ️ Directives \n Objectif \n La configuration correcte des paramètres de sécurité fournis dans les composants système tire parti des capacités du composant système à déjouer les attaques malveillantes. \n\n Bonne Pratique \n Les standards de configuration du système et les processus associés doivent traiter spécifiquement des réglages et paramètres de sécurité qui ont des implications de sécurité connues pour chaque type de système utilisé. \n Pour que les systèmes soient configurés en toute sécurité, le personnel responsable de la configuration et/ou de l'administration des systèmes doit connaître les paramètres et les réglages de sécurité spécifiques qui s'appliquent au système. Les considérations doivent également inclure des réglages sécurisés pour les paramètres utilisés afin d'accéder aux portails cloud. \n\n Informations Complémentaires \n Se reporter à la documentation du fournisseur et aux références de l'industrie notées dans l'exigence 2.2.1 afin d'obtenir des informations sur les paramètres de sécurité applicables pour chaque type de système."
    7_label: "Tous les accès d’administration non-console sont chiffrés à l'aide d'une cryptographie robuste."
    7_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les données permettant la connexion à des fins d’administration « en clair » ne peuvent être lues ou interceptées à partir d'aucune transmission réseau. \n\nℹ️ Notes D’applicabilité \n Cela inclut l'accès administratif via des interfaces basées sur un navigateur et des interfaces de programmation d'applications (API). \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les standards de configuration du système afin de vérifier qu'elles incluent le chiffrement de tous les accès administratifs nonconsole à l'aide d'une cryptographie robuste. \n\tb. Observer un administrateur se connecter aux composants du système et examiner les configurations du système afin de vérifier que l'accès administratif non-console est géré conformément à la présente exigence. \n\tc. Examiner les paramètres des composants du système et des services d'authentification afin de vérifier que les services de connexion à distance non sécurisés ne sont pas disponibles pour l'accès administratif non-console. \n\td. Examiner la documentation du fournisseur et interroger le personnel afin de vérifier qu'une cryptographie robuste pour la technologie utilisée est mise en œuvre conformément aux meilleures pratiques de l'industrie et/ou aux recommandations du fournisseur. \n\nℹ️ Directives \n Objectif \n Si l'administration non-console (y compris à distance) n'utilise pas de communications chiffrées, les données permettant la connexion à des fins d’administration (tels que les identifiants et les mots de passe) peuvent être révélés à une personne malveillante. Une personne malveillante pourrait utiliser ces informations pour accéder au réseau, devenir administrateur et voler des données. \n\n Bonne Pratique \n Quel que soit le protocole de sécurité utilisé, il doit être configuré pour n'utiliser que des versions et des configurations sécurisées afin d'empêcher l'utilisation d'une connexion non sécurisée ; par exemple en utilisant uniquement des certificats de confiance, en ne prenant en charge que le chiffrement robuste et en ne prenant pas en charge le recours à des protocoles ou des méthodes plus faibles et non sécurisés. \n\n Exemples \n Les protocoles « en clair » (tels que HTTP, telnet, etc.) ne chiffrent pas le trafic ou les détails de connexion, ce qui permet à une personne malveillante d'intercepter facilement ces informations. L'accès non-console peut être facilité par des technologies qui offrent un accès alternatif aux systèmes, y compris, sans toutefois s'y limiter, l'accès hors bande (OOB), lights-out management (LOM), Intelligent Platform Management Interface (IPMI), et les commutateurs écran-clavier-souris (KVM) avec capacités à distance. Celles-ci, ainsi que d'autres technologies et méthodes d'accès non-console, doivent être sécurisées par une cryptographie robuste. \n\n Informations Complémentaires \n Se reporter aux standards de l'industrie et aux meilleures pratiques telles que NIST SP 800-52 et SP 800-57."
  3:
    title: "Les environnements sans fil sont configurés et gérés en toute sécurité."
    1_label: "Pour les environnements sans fil connectés au CDE ou transmettant des données de carte, toutes les valeurs par défaut du fournisseur sans fil sont modifiées lors de l'installation ou sont confirmées comme étant sécurisées, y compris, sans toutefois s'y limiter : Clés cryptographiques sans fil par défaut; Mots de passe par défaut des points d'accès sans fil; Valeurs SNMP par défaut; Toute autre valeur par défaut du fournisseur sans fil liée à la sécurité."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les réseaux sans fil ne sont pas accessibles à l'aide des mots de passe par défaut ou des configurations par défaut du fournisseur. \n\nℹ️ Notes D’applicabilité \n Cela inclut, sans toutefois s'y limiter, les clés cryptographiques sans fil par défaut, les mots de passe par défaut sur les points d'accès sans fil, les valeurs SNMP par défaut et toute autre valeur par défaut du fournisseur sans fil liée à la sécurité. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et les procédures et interroger le personnel responsable afin de vérifier que les processus sont définis pour les valeurs par défaut du fournisseur sans fil afin de les modifier lors de l'installation ou de confirmer qu'ils sont sécurisés conformément à tous les éléments de la présente exigence. \n\tb. Examiner la documentation du fournisseur et observer un administrateur système se connecter aux périphériques sans fil afin de vérifier que : \n\t- Les valeurs SNMP par défaut ne sont pas utilisées. \n\t- Les mots de passe/phrases secrètes par défaut sur les points d'accès ne sont pas utilisés. \n\tc. Examiner la documentation du fournisseur et les paramètres de configuration sans fil afin de vérifier que les autres paramètres par défaut du fournisseur sans fil liés à la sécurité ont été modifiés, le cas échéant. \n\nℹ️ Directives \n Objectif \n Si les réseaux sans fil ne sont pas mis en œuvre avec des configurations de sécurité suffisantes (y compris la modification des paramètres par défaut), des renifleurs sans fil peuvent espionner le trafic, capturer facilement des données et des mots de passe, et accéder au, et attaquer facilement le réseau. \n\n Bonne Pratique \n Les mots de passe sans fil doivent être construits de manière à résister aux attaques par force brute hors ligne."
    2_label: "Pour les environnements sans fil connectés au CDE ou transmettant des données de carte, les clés cryptographiques sans fil sont modifiées comme suit : Chaque fois que le personnel connaissant la clé quitte l'entreprise ou le rôle pour lequel la connaissance de la clé était nécessaire; Chaque fois qu'une clé est soupçonnée ou avérée être compromise."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n La connaissance des clés cryptographiques sans fil ne permet pas un accès non autorisé aux réseaux sans fil. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Interroger le personnel responsable et examiner la documentation de gestion des clés afin de vérifier que les clés cryptographiques sans fil sont modifiées conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Le changement des clés cryptographiques sans fil chaque fois qu'une personne connaissant la clé quitte l'organisation ou passe à un rôle qui n'exige plus la connaissance de la clé, permet de limiter la connaissance des clés à ceux de l'entreprise avec besoin de les connaître. \n De plus, le changement des clés cryptographiques sans fil chaque fois qu'une clé est soupçonnée ou avérée être compromise rend un réseau sans fil plus résistant à la compromission.  \n\n Bonne Pratique \n Cet objectif peut être atteint de plusieurs manières, y compris des changements périodiques des clés, le changement de clés via un processus défini « joiners-movers-leavers » (JML), la mise en œuvre de mesures de sécurité techniques supplémentaires et l'absence de clés pré-partagées fixes. \n De plus, toutes les clés avérées ou soupçonnées être compromises doivent être gérées conformément au plan de réponse aux incidents de l'entité à l'exigence 12.10.1."
3:
  prefix: "Exigence 3"
  title: "Protéger les Données de Carte Stockées"
  desc: "Les méthodes de protection telles que la cryptographie, la troncature, le masquage et le hachage sont des composants essentiels de la protection des données de carte. Si un intrus contourne d'autres mesures de sécurité de sécurité et accède aux données de carte chiffrées, les données sont illisibles sans les clés cryptographiques appropriées et sont inutilisables pour cet intrus. D'autres méthodes efficaces de protection des données stockées doivent également être envisagées comme opportunités potentielles d'atténuation des risques. Par exemple, les méthodes pour minimiser les risques consistent à ne pas stocker les données de carte sauf si cela est nécessaire, à tronquer les données du titulaire de carte si un PAN complet n'est pas nécessaire et à n’envoyer aucun PAN non protégé à l'aide de technologies de messagerie d'utilisateur final telles que le courrier électronique et la messagerie instantanée. \n\n Si les données de carte sont présentes dans la mémoire non persistante (par exemple, RAM, mémoire volatile), le chiffrement des données de carte n'est pas requis. Cependant, des mesures de sécurité appropriés doivent être en place afin de garantir que la mémoire maintient un état non persistant. Les données doivent être supprimées de la mémoire volatile une fois que l'objectif métier (par exemple, la transaction associée) est terminé. Dans le cas où le stockage de données devient persistant, toutes les exigences applicables du standard PCI DSS s'appliqueront, y compris le chiffrement des données stockées. \n\n L'exigence 3 s'applique à la protection des données de carte stockées, sauf indication contraire dans une exigence individuelle. \n\n Se reporter à l'Annexe G pour les définitions de « cryptographie robuste » et d'autres termes du standard PCI DSS."
  1:
    title: "Les processus et mécanismes de protection des données de carte stockées sont définis et compris."
    1_label: "Toutes les politiques de sécurité et procédures opérationnelles identifiées dans l'exigence 3 sont : Documentées; Tenues à jour; Utilisées; Connues de toutes les parties concernées."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les attentes, les mesures de sécurité et la surveillance des activités relatives à l'exigence 3 sont définis et respectés par le personnel concerné. Toutes les activités de soutien sont reproductibles, appliquées de manière cohérente et conformes à l'intention de la direction. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation et interroger le personnel pour vérifier que les politiques de sécurité et les procédures opérationnelles identifiées dans l'exigence 3 sont gérées conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n L'exigence 3.1.1 concerne la gestion et le maintien efficaces des diverses politiques et procédures spécifiées dans toute l'exigence 3. S'il est important de définir les politiques ou procédures spécifiques décrites dans l'exigence 3, il est tout aussi important de s'assurer qu'elles sont correctement documentées, maintenues et diffusées. \n\n Bonne Pratique \n Il est important de mettre à jour les politiques et les procédures au besoin pour faire face aux changements dans les processus, les technologies et les objectifs métier. Pour cette raison, envisager de mettre à jour ces documents dès que possible après un changement et pas seulement sur un cycle périodique. \n\n Définitions \n Les politiques de sécurité définissent les objectifs et les principes de sécurité de l'entité. Les procédures opérationnelles décrivent la façon d'exécuter les activités et définissent les mesures de sécurité, les méthodes et les processus qui sont suivis pour atteindre le résultat escompté de manière cohérente et conformément aux objectifs de la politique."
    2_label: "Les rôles et les responsabilités liées aux activités de l'exigence 3 sont documentés, attribués et compris."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les responsabilités quotidiennes pour l'exécution de toutes les activités de l'exigence 3 sont attribuées. Le personnel est responsable du bon fonctionnement continu desdites exigences. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation pour vérifier que les descriptions des rôles et des responsabilités pour l'exécution des activités de l'exigence 3 sont documentées et attribuées. \n\tb. Interroger le personnel chargé d'exécuter les activités de l'exigence 3 afin de vérifier que les rôles et les responsabilités sont assignés comme documentés et qu’ils sont compris. \n\nℹ️ Directives \n Objectif \n Si les rôles et les responsabilités ne sont pas officiellement attribués, le personnel peut ne pas être conscient de ses responsabilités quotidiennes et les activités critiques peuvent ne pas avoir lieu.  \n\n Bonne Pratique \n Les rôles et les responsabilités peuvent être documentés dans des politiques et procédures, ou conservés dans des documents distincts. \n Dans le cadre de la communication des rôles et des responsabilités, les entités peuvent envisager de demander au personnel de reconnaître leur acceptation et leur compréhension des rôles et responsabilités qui leur sont attribués. \n\n Exemples \n Une méthode pour documenter les rôles et les obligations est une matrice d'attribution des responsabilités qui indique qui est responsable, redevable, consulté et informé (également appelée matrice RACI)."
  2:
    title: "Le stockage des données de carte est réduit au minimum."
    1_label: "Le stockage des données de carte est réduit au minimum grâce à la mise en œuvre de politiques, procédures et processus de conservation et d'élimination des données qui incluent au moins les éléments suivants : Couverture de tous les emplacements des données de carte stockées; Couverture de toutes les données d'authentification sensibles (SAD) stockées avant la fin de l'autorisation. Ce point est une Bonne Pratique jusqu'à sa date d'entrée en vigueur ; se reporter aux Notes D’applicabilité cidessous pour plus de détails; Limiter la quantité de stockage des données et la durée de conservation à ce qui est requis pour les exigences légales ou réglementaires et/ou métier; Des exigences de rétention spécifiques pour les données de carte stockées qui définissent la durée de la période de conservation et incluent une justification métier documentée; Des processus de suppression sécurisée ou pour rendre les données de carte irrécupérables lorsqu'elles ne sont plus nécessaires conformément à la politique de conservation; Un processus pour vérifier, au moins une fois tous les trois mois, que les données de carte stockées dépassant la période de conservation définie ont été supprimées en toute sécurité ou rendues irrécupérables."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les données du compte ne sont conservées que lorsque cela est nécessaire et pour le moins de temps nécessaire, et sont supprimées en toute sécurité ou rendues irrécupérables lorsqu'elles ne sont plus nécessaires. \n\nℹ️ Notes D’applicabilité \n Lorsque les données de carte sont stockées par un TPSP (par exemple, dans un environnement cloud), les entités sont tenues de collaborer avec leurs prestataires de services afin de comprendre comment le TPSP satisfait à cette exigence pour l'entité. Les considérations incluent de s'assurer que toutes les instances géographiques d'un élément de données sont supprimées en toute sécurité. La point ci-dessus (concernant la couverture des SAD stockées avant l'achèvement de l'autorisation) est une Bonne Pratique jusqu'au 31 mars 2025, après quoi elle sera requise dans le cadre de l'exigence 3.2.1 et doit être pleinement prise en compte lors d'une évaluation du standard PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques, procédures et processus de conservation et d'élimination des données, et interroger le personnel afin de vérifier que les processus sont définis pour inclure tous les éléments spécifiés dans cette exigence. \n\tb. Examiner les fichiers et les enregistrements système sur les composants système dans lesquels les données de carte sont stockées afin de vérifier que la quantité de stockage des données et la durée de conservation ne dépassent pas les exigences définies dans la stratégie de conservation des données. \n\tc. Observer les mécanismes utilisés pour rendre les données de carte irrécupérables afin de vérifier que les données ne peuvent pas être récupérées. \n\nℹ️ Directives \n Objectif \n Une politique formelle de conservation des données identifie les données qui doivent être conservées, la durée de leur conservation et le ou les emplacements où ces données résident afin qu'elles puissent être détruites ou supprimées en toute sécurité dès qu'elles ne sont plus nécessaires. Les seules données de carte qui peuvent être stockées après autorisation sont le numéro de compte primaire ou PAN (rendu illisible), la date d'expiration, le nom du titulaire de la carte et le code de service. \n Le stockage des données SAD avant l'achèvement du processus d'autorisation est également inclus dans la politique de conservation et d'élimination des données afin que le stockage de ces données sensibles soit réduit au minimum et conservé uniquement pendant la durée définie. \n\n Bonne Pratique \n Lors de l'identification des emplacements des données de carte stockées, tenir compte de tous les processus et du personnel ayant accès aux données, car les données pourraient avoir été déplacées et stockées dans des emplacements différents de ceux définis à l'origine. Les emplacements de stockage qui sont souvent négligés incluent les systèmes de sauvegarde et d'archivage, les périphériques amovibles de stockage de données, les supports papier et les enregistrements audio. Pour définir des exigences de conservation adéquates, une entité doit d'abord comprendre ses propres besoins métier ainsi que toutes les obligations légales ou réglementaires qui s'appliquent à son secteur ou au type de données conservées. La mise en œuvre d'un processus automatisé pour garantir que les données sont supprimées automatiquement et en toute sécurité, conformément à la limite de conservation définie, peut aider à garantir que les données du compte ne sont pas conservées au-delà de ce qui est nécessaire à des fins métiers, légales ou réglementaires. Les méthodes d'élimination des données lorsqu'elles dépassent la période de conservation comprennent la suppression sécurisée pour terminer la suppression des données ou pour les rendre irrécupérables et incapables d'être reconstruites. L'identification et l'élimination sécurisée des données stockées qui ont dépassé leur période de conservation spécifiée évitent la conservation inutile des données qui ne sont plus nécessaires. Ce processus peut être automatisé, manuel ou une combinaison des deux. La fonction de suppression dans la plupart des systèmes d'exploitation n'est pas une « suppression sécurisée » car elle permet de récupérer les données supprimées. Par conséquent, une fonction de suppression sécurisée dédiée ou une application doit être utilisée pour rendre les données irrécupérables. Il ne faut pas oublier que si vous n'en avez pas besoin, ne les stockez pas ! \n\n Exemples \n Une procédure automatisée et programmatique pourrait être exécutée afin de localiser et supprimer des données, ou un examen manuel des emplacements de stockage des données pourrait être effectué. Quelle que soit la méthode utilisée, c’est une bonne idée de surveiller le processus afin de s'assurer qu'il est achevé avec succès et que les résultats sont enregistrés et validés comme étant terminés. La mise en œuvre de méthodes de suppression sécurisées garantit que les données ne peuvent pas être récupérées lorsqu'elles ne sont plus nécessaires. \n\n Informations Complémentaires \n See NIST SP 800-88 Rev. 1, Directives pour l’effacement des supports de stockage."
  3:
    title: "Les données d'authentification sensibles (SAD) ne sont pas stockées après autorisation."
    1_label: "Les SAD ne sont pas conservées après autorisation, même si elles sont chiffrées. Toutes les données d'authentification sensibles reçues sont rendues irrécupérables à la fin du processus d'autorisation."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Notes D’applicabilité \n Cette exigence ne s'applique pas aux émetteurs et aux entreprises qui prennent en charge les services d'émission (lorsque les SAD sont nécessaires pour un besoin métier d'émission légitime) et qui ont une justification métier pour stocker les données d'authentification sensibles. Se reporter à l'exigence 3.3.3 pour des exigences supplémentaires élaborées spécifiquement pour les émetteurs. Les données d'authentification sensibles incluent les données citées dans les exigences 3.3.1.1 à 3.3.1.3. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Si des SAD sont reçues, examiner les politiques, procédures et configurations systèmes documentés afin de vérifier que les données ne sont pas conservées après autorisation. \n\tb. Si des SAD sont reçues, examiner les procédures documentées et observer les processus de suppression sécurisée des données afin de vérifier que les données sont rendues irrécupérables à la fin du processus d'autorisation. \n\nℹ️ Directives \n Objectif \n Les SAD sont très précieuses pour les personnes malveillantes car elles leur permettent de générer des cartes de paiement contrefaites et de créer des transactions frauduleuses. Par conséquent, le stockage des SAD à l'issue de l'achèvement du processus d'autorisation est interdit. \n\n Bonne Pratique \n \n\n Définitions \n Lorsqu’un commerçant reçoit une réponse à la demande d’autorisation (par exemple, une approbation ou un refus)."
    2_prefix: "3.3.1.1"
    2_label: "Le contenu complet d'une piste n'est pas conservé à la fin du processus d'autorisation."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Notes D’applicabilité \n Dans le cours normal des activités, les éléments de données suivants de la piste peuvent devoir être conservés : \n\t- Le Nom du titulaire de carte. \n\t- Le Numéro de compte primaire (PAN). \n\t- La Date d'expiration. \n\t- Le Code de service. Pour minimiser les risques, ne stocker en toute sécurité que ces éléments de données nécessaires à l'activité. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les sources de données afin de vérifier que le contenu complet d'une piste n'est pas stocké à la fin du processus d'autorisation. \n\nℹ️ Directives \n Objectif \n Si le contenu complet d'une piste (de la piste magnétique au dos d'une carte si elle est présente, des données équivalentes contenues sur un point ou ailleurs) est stocké, des personnes malveillantes qui obtiennent ces données peuvent les utiliser pour reproduire des cartes de paiement et effectuer des transactions frauduleuses. \n\n Définitions \n Les données complètes d'une piste sont également appelées données de piste complète, de piste, de piste 1, de piste 2 et de piste magnétique. Chaque piste contient un certain nombre d'éléments de données, et cette exigence spécifie uniquement ceux qui peuvent être conservés après l'autorisation. \n\n Exemples \n Les sources de données à examiner pour s'assurer que le contenu complet d'une piste n'est pas conservé à la fin du processus d'autorisation comprennent, sans toutefois s'y limiter : \n\t- Les données de transaction entrantes. \n\t- Tous les journaux (par exemple, transaction, historique, débogage, erreur). \n\t- Les fichiers d'historique. \n\t- Les fichiers de trace. \n\t- Les schémas de base de données. \n\t- Les contenus de bases de données et les emplacements de stockage sur site (onpremise) et dans le cloud. \n\t- Tout fichier existant de type dump mémoire / crash dump."
    3_prefix: "3.3.1.2"
    3_label: "Le code de vérification de la carte n'est pas conservé à la fin du processus d'autorisation."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Notes D’applicabilité \n Le code de vérification de la carte est le numéro à trois ou quatre chiffres imprimés au recto ou au verso d’une carte de paiement utilisée pour vérifier les transactions sans carte présente. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les sources de données afin de vérifier que le code de vérification de la carte n'est pas stocké à la fin du processus d'autorisation. \n\nℹ️ Directives \n Objectif \n Si les données du code de vérification de la carte sont volées, des personnes malveillantes peuvent exécuter des transactions frauduleuses sur Internet et par correspondance ou via commande téléphonique (MO/TO). Le fait de ne pas stocker ces données réduit la probabilité qu'elles soient compromises. \n\n Exemple \n Si les codes de vérification des cartes sont stockés sur un support papier avant la fin de l'autorisation, une méthode d'effacement ou de recouvrement des codes devrait empêcher leur lecture une fois l'autorisation expirée. Des exemples de méthodes pour rendre les codes illisibles incluent la suppression du code avec des ciseaux et l'application d'un marqueur convenablement opaque et indélébile sur le code. Les sources de données à examiner pour s'assurer que le code de vérification de la carte n'est pas conservé à la fin du processus d'autorisation comprennent, sans toutefois s'y limiter : \n\t- Les données de transaction entrantes. \n\t- Tous les journaux (par exemple, transaction, historique, débogage, erreur). \n\t- Les fichiers d'historique. \n\t- Les fichiers de trace. \n\t- Les schémas de base de données. \n\t- Les contenus de bases de données et les emplacements de stockage sur site (onpremise) et dans le cloud. \n\t- Tout fichier existant de type dump mémoire / crash dump."
    4_prefix: "3.3.1.3"
    4_label: "Le numéro d'identification personnel (PIN) et le bloc PIN ne sont pas conservés à la fin du processus d'autorisation."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Notes D’applicabilité \n Les blocs PIN sont chiffrés au cours du déroulement naturel des processus de transaction ; cependant, même si une entité chiffre à nouveau le bloc PIN, il n'est toujours pas autorisé à être stocké après l'achèvement du processus d'autorisation. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les sources de données afin de vérifier que les codes PIN et blocs PIN ne sont pas stockés à la fin du processus d'autorisation. \n\nℹ️ Directives \n Objectif \n Les codes PIN et les blocs PIN ne doivent être connus que du propriétaire de la carte ou de l'entité qui a émis la carte. Si ces données sont volées, des personnes malveillantes peuvent exécuter des transactions frauduleuses basées sur un code PIN (par exemple, des achats en magasin et des retraits aux guichets automatiques). Le fait de ne pas stocker ces données réduit la probabilité qu'elles soient s'assurer que les codes et les blocs PIN ne sont compromises. \n\n Exemples \n Les sources de données à examiner pour comprennent, sans toutefois s'y limiter : pas conservés à la fin du processus d'autorisation \n\t- Tous les journaux (par exemple, transaction, \n\t- Les données de transaction entrantes. \n\t- Les fichiers d'historique. historique, débogage, erreur). \n\t- Les schémas de base de données. \n\t- Les fichiers de traçe. emplacements de stockage sur site (onpremise) et dans le cloud. \n\t- Les contenus de bases de données et les crash dump. \n\t- Tout fichier existant de type dump mémoire / crash dump."
    5_prefix: "3.3.2"
    5_label: "Cette exigence n'est pas admissible pour l'approche personnalisée."
    5_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️  Notes D’applicabilité \n Que les SAD soient permises d’être stockées avant l'autorisation est déterminée par les entreprises qui gèrent les programmes de conformité (par exemple, les réseaux internationaux et les acquéreurs). Contacter les entreprises d'intérêt pour tout critère supplémentaire. \n Cette exigence s'applique à tous les stockages de SAD, même si aucun PAN n'est présent dans l'environnement. \n Se reporter à l'exigence 3.2.1 pour une exigence supplémentaire qui s'applique si les SAD sont stockées avant l'achèvement de l'autorisation. Cette exigence ne s'applique pas aux émetteurs et aux entreprises qui prennent en charge les services d'émission lorsqu'il existe une justification métier d'émission légitime pour stocker les SAD). \n Se reporter à l'exigence 3.3.3 pour les exigences élaborées spécifiquement pour les émetteurs. Cette exigence ne remplace pas la façon dont les blocs PIN doivent être gérés, ni ne signifie qu'un bloc PIN correctement chiffré doit être à nouveau chiffré. \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les magasins de données, les configurations système et/ou la documentation du fournisseur afin de vérifier que toutes les SAD qui sont stockées électroniquement avant l'achèvement de l'autorisation sont chiffrées à l'aide d'une cryptographie robuste.  \n\nℹ️ Directives \n Objectif \n Les SAD peuvent être utilisées par des personnes malveillantes afin d'augmenter la probabilité de réussir à générer des cartes de paiement contrefaites et de passer des transactions frauduleuses. \n\n Bonne Pratique \n Les entités doivent envisager de chiffrer les SAD à l'aide d'une clé cryptographique différente de celle utilisée pour chiffrer le PAN. Notez que cela ne signifie pas que le PAN présent dans les SAD (dans le cadre des données de la piste) devrait être chiffré séparément. \n\n Définitions \n Le processus d'autorisation est terminé dès que la réponse à une demande d'autorisation, c'est-àdire une approbation ou un refus, est reçue."
    6_prefix: "3.3.3"
    6_label: "Exigence supplémentaire pour les émetteurs et les entreprises qui prennent en charge les services d'émission et stockent des données d'authentification sensibles : Tout stockage de données d'authentification sensibles est : Limité à ce qui est nécessaire pour un besoin métier d'émission légitime, et est sécurisé; Chiffré à l'aide d'une cryptographie robuste. Ce point est une Bonne Pratique jusqu'à sa date d'entrée en vigueur ; se reporter aux Notes D’applicabilité ci-dessous pour plus de détails."
    6_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les données d'authentification sensibles ne sont conservées que si cela est nécessaire pour assurer les fonctions d'émission, et sont protégées contre tout accès non autorisé. \n\nℹ️ Cette exigence s'applique uniquement aux émetteurs et aux entreprises qui prennent en charge les services d'émission et stockent des données d'authentification sensibles. \n Les entités qui émettent des cartes de paiement ou qui exécutent ou prennent en charge des services d'émission créent et contrôlent souvent des données d'authentification sensibles dans le cadre de la fonction d'émission. Il est permis aux entreprises qui exécutent, facilitent ou prennent en charge des services d'émission de stocker des données d'authentification sensibles UNIQUEMENT SI elles ont un besoin métier légitime de stocker ces données. \n Les exigences du standard PCI DSS sont destinées à toutes les entités qui stockent, traitent ou transmettent des données de carte, y compris les émetteurs. La seule exception pour les émetteurs et les processeurs d'émetteurs est que les données d'authentification sensibles peuvent être conservées s'il existe une raison légitime de le faire. Ces données doivent être stockées de manière sécurisée et conformément à toutes les exigences du standard PCI DSS et aux réseaux internationaux spécifiques. \n La point ci-dessus (pour chiffrer les SAD stockées avec une cryptographie robuste) est une Bonne Pratique jusqu'au 31 mars 2025, après quoi elle sera obligatoire dans le cadre de l'exigence 3.3.3 et doit être pleinement prise en compte lors d'une évaluation PCI DSS. \n \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Procédure de test supplémentaire pour les émetteurs et les entreprises qui prennent en charge les services d'émission et stockent des données d'authentification sensibles : Examiner les politiques documentées et interroger le personnel afin de vérifier qu'il existe une justification métier documentée pour le stockage des données d'authentification sensibles. \n\tb. Procédure de test supplémentaire pour les émetteurs et les entreprises qui prennent en charge les services d'émission et stockent des données d'authentification sensibles : Examiner les magasins de données et les configurations système afin de vérifier que les données d'authentification sensibles sont stockées de manière sécurisée. \n\nℹ️ Directives \n Objectif \n Les SAD peuvent être utilisées par des personnes malveillantes afin d'augmenter la probabilité de réussir à générer des cartes de paiement contrefaites et de réaliser des transactions frauduleuses. \n\n Bonne Pratique \n Les entités doivent envisager de chiffrer les SAD à l'aide d'une clé cryptographique différente de celle utilisée pour chiffrer le PAN. Notez que cela ne signifie pas que le PAN présent dans les SAD (dans le cadre des données de la piste) devrait être chiffré séparément. \n\n Définitions \n Un besoin métier d'émission légitime signifie que les données sont nécessaires pour faciliter le processus métier d'émission. \n\n Informations Complémentaires \n Se reporter à ISO/DIS 9564-5 Services financiers — Gestion et sécurité du numéro d'identification personnel (PIN) — Partie 5 : Méthodes de génération, de modification et de vérification des codes PIN et des données de sécurité des cartes à l'aide du standard de chiffrement avancé (Advanced Encryption Standard)."
  4:
    title: "L'accès à l’affichage du PAN complet et la possibilité de copier les données des titulaires de cartes sont limités."
    1_label: "Le PAN est masqué lorsqu'il est affiché (le BIN et les quatre derniers chiffres sont le nombre maximum de chiffres à afficher), de sorte que seul le personnel ayant un besoin métier légitime peut voir plus que le BIN et les quatre derniers chiffres du PAN."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les affichages du PAN sont limités au nombre minimum de chiffres nécessaires pour répondre à un besoin métier défini. \n\nℹ️ Notes D’applicabilité \n Cette exigence ne remplace pas les exigences plus strictes en place pour l'affichage des données des titulaires de carte ; par exemple, les exigences légales ou de réseaux internationaux pour les reçus des points de vente (POS). \n Cette exigence concerne la protection du PAN lorsqu'il est affiché sur les écrans, les reçus papier, les impressions, etc., et ne doit pas être confondu avec l'exigence 3.5.1 pour la protection du PAN lorsqu'il est stocké, traité, ou transmis. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures documentées pour masquer l'affichage des PAN afin de vérifier que : \n\t- Une liste des rôles qui ont besoin d'accéder à plus que le BIN et les quatre derniers chiffres du PAN (y compris le PAN complet) est documentée, ainsi qu'un besoin métier légitime pour chaque rôle d'avoir un tel accès. \n\t- Le PAN est masqué lorsqu'il est affiché de telle sorte que seul le personnel ayant un besoin métier légitime puisse voir plus que le BIN et les quatre derniers chiffres du PAN. \n\t- Tous les rôles non spécifiquement autorisés à voir le PAN complet ne doivent voir que les PAN masqués. \n\tb. Examiner les configurations système afin de vérifier que le PAN complet n'est affiché que pour les rôles avec un besoin métier documenté, et que le PAN est masqué pour toutes les autres demandes. \n\tc. Examiner les affichages du PAN (par exemple, à l'écran, sur les reçus papier) afin de vérifier que les PAN sont masqués lorsqu'ils sont affichés, et que seuls ceux ayant un besoin métier légitime sont en mesure de voir plus que le BIN et/ou les quatre derniers chiffres du PAN. \n\nℹ️ Directives \n Objectif \n L'affichage du PAN complet sur des écrans d'ordinateur, sur des reçus de paiement par carte, sur des rapports papier, etc. peut entraîner l'obtention de ces données par des personnes non autorisées et leur utilisation frauduleuse. S'assurer que le PAN complet n'est affiché que pour ceux qui ont un besoin métier légitime minimise le risque que des personnes non autorisées accèdent aux données PAN. \n\n Bonne Pratique \n L'application de mesures de sécurité d'accès en fonction de rôles définis est un moyen de limiter l'accès à l'affichage du PAN complet aux seules personnes ayant un besoin métier défini. L'approche de masquage doit toujours afficher uniquement le nombre de chiffres nécessaires à l’exécution d’une fonction métier spécifique. Par exemple, si seuls les quatre derniers chiffres sont nécessaires pour exécuter une fonction métier, le PAN doit être masqué pour n'afficher que les quatre derniers chiffres. Autre exemple, si une fonction doit afficher le numéro d'identification bancaire (BIN) à des fins de routage, démasquer uniquement les chiffres du BIN pour cette fonction. \n\n Définitions \n Le masquage n'est pas synonyme de troncature et ces termes ne peuvent pas être utilisés de manière interchangeable. Le masquage fait référence à la dissimulation de certains chiffres lors de l'affichage ou de l'impression, même lorsque l'intégralité du PAN est stockée sur un système. Il est différent de la troncature, dans laquelle les chiffres tronqués sont supprimés et ne peuvent pas être récupérés dans le système. Le PAN masqué peut être « démasqué », mais il n'y a pas de « dé-troncature » sans recréer le PAN à partir d'une autre source. \n\n Informations Complémentaires \n Pour plus d'informations sur le masquage et la troncature, consultez la FAQ du PCI SSC sur ces sujets."
    2_label: "Lors de l'utilisation de technologies d'accès à distance, les mesures de sécurité techniques empêchent la copie et/ou la relocalisation du PAN pour tout le personnel, à l'exception de ceux disposant d'une autorisation explicite documentée et d'un besoin métier légitime et défini."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Le PAN ne peut pas être copié ou déplacé par du personnel non autorisé utilisant des technologies d'accès à distance. \n\n Notes D’applicabilité \n Le stockage ou le déplacement du PAN sur des disques durs locaux, des supports électroniques amovibles et d'autres périphériques de stockage fait entrer ces dispositifs dans le périmètre PCI DSS. \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures documentées et les preuves documentées des mesures de sécurité techniques qui empêchent la copie et/ou le déplacement du PAN lors de l'utilisation de technologies d'accès à distance sur des disques durs locaux ou des supports électroniques amovibles afin de vérifier les éléments suivants : \n\t- Que des mesures de sécurité techniques empêchent tout personnel non spécifiquement autoriser de copier et/ou de déplacer le PAN. \n\t- Qu’une liste du personnel autorisé à copier et/ou déplacer le PAN est maintenue, ainsi qu'une autorisation explicite documentée et que le besoin métier légitime est défini. \n\tb. Examiner les configurations des technologies d'accès à distance afin de s'assurer que les mesures de sécurité techniques empêchent la copie et/ou le déplacement du PAN pour tout le personnel, sauf pour le personnel explicitement autorisé. \n\tc. Observer les processus et interroger le personnel afin de s'assurer que seul le personnel disposant d'une autorisation explicite et documentée et d'un besoin métier légitime et défini a la permission de copier et/ou de déplacer le PAN lors de l'utilisation de technologies d'accès à distance. \n\nℹ️ Directives \n Objectif \n La relocalisation du PAN vers des périphériques de stockage non autorisés est un moyen courant d'obtenir et d'utiliser frauduleusement ces données. \n Les méthodes permettant de s'assurer que seules les personnes disposant d'une autorisation explicite et d'une raison métier légitime peuvent copier ou déplacer le PAN, minimisent le risque que des personnes non autorisées accèdent au PAN. \n\n Bonne Pratique \n La copie et le déplacement du PAN ne doivent être effectués que sur des périphériques de stockage permis et autorisés pour cette personne. \n\n Définitions \n Un bureau virtuel est un exemple de technologie d'accès à distance. \n Les périphériques de stockage comportent, sans toutefois s'y limiter, les disques durs locaux, les lecteurs virtuels, les supports électroniques amovibles, les lecteurs réseau et le stockage en cloud. \n\n Informations Complémentaires \n La documentation du fournisseur pour la technologie d'accès à distance utilisée fournira des informations sur les paramètres système nécessaires pour mettre en œuvre cette exigence."
  5:
    title: "Le numéro de compte primaire (PAN) est sécurisé partout où il est stocké."
    1_label: "Le PAN est rendu illisible partout où il est stocké en utilisant l'une des approches suivantes : Hachage à sens unique basé sur une cryptographie robuste de l'intégralité du PAN; Troncature (le hachage ne peut pas être utilisé pour remplacer le segment tronqué du PAN). – Si des versions hachées et tronquées du même PAN, ou des formats de troncature différents du même PAN, sont présentes dans un environnement, des mesures de sécurité supplémentaires sont en place afin que les différentes versions ne puissent pas être corrélées pour reconstruire le PAN d'origine; Token d’index; Cryptographie robuste avec processus et procédures de gestion des clés associés."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les PAN en texte clair ne peuvent pas être lus ou reconstitués à partir du support de stockage. \n\nℹ️ Notes D’applicabilité  \n Il s'agit d'un effort relativement trivial pour une personne malveillante de reconstruire les données d'origine du PAN s'il a accès à la fois à la version tronquée et la version hachée d'un PAN. \n Cette exigence s'applique aux PAN stockés dans un stockage principal (bases de données ou fichiers plats tels que des feuilles de calcul en fichiers texte) ainsi que dans un stockage non principal (sauvegarde, journaux d'audit, journaux des exceptions ou de dépannage). \n Cette exigence n'exclut pas l'utilisation de fichiers temporaires contenant un PAN en texte clair lors du chiffrement et du déchiffrement du PAN. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation sur le système utilisé pour rendre le PAN illisible, y compris le fournisseur, le type de système/processus et les algorithmes cryptographiques (le cas échéant) afin de vérifier que le PAN est rendu illisible à l'aide de l’une des méthodes spécifiées dans cette exigence. \n\tb. Examiner les référentiels de données et les journaux d'audit, y compris les journaux des applications de paiement, afin de vérifier que le PAN est rendu illisible à l'aide de l'une des méthodes spécifiées dans cette exigence. \n\tc. Si des versions hachées et tronquées du même PAN sont présentes dans l'environnement, examiner les mesures de sécurité mis en œuvre afin de vérifier que les versions hachées et tronquées ne peuvent pas être corrélées aux fins de reconstruire le PAN d'origine. \n\nℹ️ Directives \n Objectif \n La suppression du PAN stocké en texte clair est un contrôle de défense en profondeur conçu pour protéger les données si une personne non autorisée accède aux données stockées en exploitant une vulnérabilité ou une mauvaise configuration du contrôle d'accès primaire d'une entité. \n Les systèmes de contrôle secondaires indépendants (par exemple régissant l'accès et l'utilisation des clés de cryptographie et de déchiffrement) empêchent la défaillance d'un système de contrôle d'accès primaire résultant en une violation de la confidentialité du PAN stocké. Si le hachage est utilisé pour supprimer le PAN stocké en texte clair, en corrélant les versions hachées et tronquées d'un PAN donné, une personne malveillante peut facilement déduire la valeur du PAN d'origine. Les mesures de sécurité qui empêchent la corrélation de ces données aideront à garantir que le PAN d'origine reste illisible. \n\n Informations Complémentaires \n Pour plus d'informations sur les formats de troncature et la troncature en général, consulter la FAQ du PCI SSC sur le sujet. Les sources d'informations sur les jetons d'index comprennent : \n\t- Directives de sécurité des produits de tokenisation du PCI SSC (https://www.pcisecuritystandards.org/docume nts/Tokenization_Product_Security_Guideline s.pdf) \n\t- ANSI X9.119-2-2017 : Services financiers de détail - Exigences relatives à la protection des données sensibles des cartes de paiement - Partie 2 : Mise en œuvre des systèmes de tokenisation post-autorisation"
    2_prefix: "3.5.1.1"
    2_label: "Les hachages utilisés pour rendre le PAN illisible (selon le premier point de l'exigence 3.5.1) sont des hachages cryptographiques de l'ensemble du PAN, avec des processus et procédures de gestion des clés associés conformes aux exigences 3.6 et 3.7."
    2_desc: "ℹ️ Notes D’applicabilité \n Cette exigence s'applique aux PAN stockés dans un stockage principal (bases de données ou fichiers plats tels que des feuilles de calcul en fichiers texte) ainsi que dans un stockage non principal (sauvegarde, journaux d'audit, journaux des exceptions ou de dépannage). \n Cette exigence n'exclut pas l'utilisation de fichiers temporaires contenant un PAN en texte clair lors du chiffrement et du déchiffrement du PAN. \n Cette exigence est considérée une Bonne Pratique jusqu'au 31 mars 2025, après quoi elle sera obligatoire et devra être pleinement prise en compte lors d'une évaluation PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation sur la méthode de hachage utilisée pour rendre le PAN illisible, y compris celle du fournisseur, le type de système/processus et les algorithmes cryptographiques (le cas échéant) afin de vérifier que la méthode de hachage aboutit à hachages cryptographiques de l'ensemble du PAN, avec les processus et procédures de gestion des clés associés. \n\tb. Examiner la documentation sur les procédures et processus de gestion des clés associés aux hachages cryptographiques à clé pour vérifier que les clés sont gérées conformément aux exigences 3.6 et 3.7. \n\tc. Examiner les dépôts de données afin de vérifier que le PAN est rendu illisible. \n\td. Examiner les journaux d'audit, y compris les journaux d'applications de paiement, afin de vérifier que le PAN est rendu illisible. \n\nℹ️ Directives \n Objectif \n La suppression du PAN stocké en texte clair est un contrôle de défense en profondeur conçu pour protéger les données si une personne non autorisée accède aux données stockées en exploitant une vulnérabilité ou une mauvaise configuration du contrôle d'accès primaire d'une entité. \n Les systèmes de contrôle secondaires indépendants (par exemple régissant l'accès et l'utilisation des clés de cryptographie et de déchiffrement) empêchent la défaillance d'un système de contrôle d'accès primaire résultant en une violation de la confidentialité du PAN stocké. \n\n Bonne Pratique \n Une fonction de hachage qui incorpore une clé secrète générée de manière aléatoire offre une résistance aux attaques par force brute et une intégrité d'authentification secrète. \n\n Informations Complémentaires \n Les algorithmes de hachage cryptographique à clé appropriés incluent, sans toutefois s'y limiter : HMAC, CMAC et GMAC, avec une force cryptographique effective d'au moins 128 bits (NIST SP 800-131Ar2). \n Se reporter à ce qui suit pour plus d'informations sur HMAC, CMAC et GMAC, respectivement : NIST SP 800-107r1, NIST SP 800-38B, et NIST SP 800-38D). \n Voir NIST SP 800-107 (Révision 1) : Recommandation pour les applications utilisant des algorithmes de hachage approuvés §5.3."
    3_prefix: "3.5.1.2"
    3_label: "Si le chiffrement au niveau du disque ou au niveau de la partition (plutôt que le chiffrement de la base de données au niveau des fichiers, des colonnes ou des champs) est utilisé pour rendre le PAN illisible, il est mis en œuvre uniquement de la manière suivante : Sur des supports électroniques amovibles, OU S'il est utilisé sur des supports électroniques non amovibles, le PAN est également rendu illisible via un autre mécanisme qui satisfait à l'exigence 3.5.1."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Notes D’applicabilité \n Bien que le chiffrement de disque puisse toujours être présent sur ces types de périphériques, il ne peut pas être la seule méthode utilisée pour protéger le PAN stocké sur ces systèmes. Tout PAN stocké doit également être rendu illisible conformément à l'exigence 3.5.1 ; par exemple, via une troncature ou un mécanisme de chiffrement au niveau des données. Le chiffrement complet du disque aide à protéger les données en cas de perte physique d'un disque et, par conséquent, son utilisation n'est appropriée que pour les périphériques de stockage électroniques amovibles. \n Les supports faisant partie d'une architecture de centre de données (par exemple, les lecteurs remplaçables à chaud, les sauvegardes sur bande en masse) sont considérés comme des supports électroniques non amovibles auxquels l'exigence 3.5.1 s'applique. \n Les mises en œuvre du chiffrement de disques ou de partitions doivent également répondre à toutes les autres exigences PCI DSS de chiffrement et de gestion des clés. \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les processus de chiffrement afin de vérifier que, si le chiffrement au niveau du disque ou au niveau de la partition est utilisé pour rendre le PAN illisible, il est mis en œuvre uniquement de la manière suivante : \n\t- Sur des supports électroniques amovibles, OU \n\t- S'il est utilisé sur des supports électroniques non amovibles, examiner les processus de chiffrement utilisés afin de vérifier que le PAN est également rendu illisible via une autre méthode qui satisfait à l'exigence 3.5.1. \tb. Examiner les configurations et/ou la documentation du fournisseur et observer les processus de chiffrement afin de vérifier que le système est configuré conformément à la documentation du fournisseur de sorte que le disque ou la partition soit rendus illisible.\n\nℹ️ Directives \n Objectif \n En général, le chiffrement au niveau du disque et au niveau de la partition chiffre l'intégralité du disque ou de la partition à l'aide de la même clé, avec toutes les données automatiquement déchiffrées lorsque le système s'exécute ou lorsqu'un utilisateur autorisé le demande. Pour cette raison, le chiffrement au niveau du disque n'est pas approprié pour protéger le PAN stocké sur les ordinateurs de bureau, les ordinateurs portables, les serveurs, les baies de stockage ou tout autre système qui fournit un déchiffrement transparent lors de l'authentification de l'utilisateur. \n\n Informations Complémentaires \n Le cas échéant, le respect des directives de renforcement des fournisseurs et des meilleures pratiques de l'industrie peut aider à sécuriser le PAN sur ces périphériques."
    4_prefix: "3.5.1.3"
    4_label: "Si le chiffrement au niveau du disque ou au niveau de la partition est utilisé (plutôt que le chiffrement au niveau de la base de données, des fichiers, des colonnes ou des champs) afin de rendre le PAN illisible, il est géré de la manière suivante : L'accès logique est géré séparément et indépendamment de l'authentification du système d'exploitation natif et des mécanismes de contrôle d'accès; Les clés cryptographiques ne sont pas associées aux comptes utilisateur; Les facteurs d'authentification (mots de passe, phrases secrètes ou clés cryptographiques) qui permettent l'accès aux données non chiffrées sont stockés en toute sécurité."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les mises en œuvre du chiffrement de disque sont configurées pour exiger une authentification indépendante et des mesures de sécurité d'accès logique pour le déchiffrement. \n\nℹ️ Notes D’applicabilité \n Les mises en œuvre du chiffrement de disques ou de partitions doivent également répondre à toutes les autres exigences PCI DSS de chiffrement et de gestion des clés. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Si le chiffrement au niveau du disque ou au niveau de la partition est utilisé pour rendre le PAN illisible, examiner la configuration du système et observer le processus d'authentification afin de vérifier que l'accès logique est mis en œuvre conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Examiner les fichiers contenant les facteurs d'authentification (mots de passe, phrases secrètes ou clés cryptographiques) et interroger le personnel afin de vérifier que les facteurs d'authentification qui permettent l'accès aux données non chiffrées sont stockés en toute sécurité et sont indépendants des méthodes d'authentification et de contrôle d'accès du système d'exploitation natif. \n\nℹ️ Directives \n Objectif \n En général, le chiffrement au niveau du disque chiffre l'intégralité du disque ou de la partition à l'aide de la même clé, avec toutes les données automatiquement déchiffrées lorsque le système s'exécute ou lorsqu'un utilisateur autorisé le demande. De nombreuses solutions de chiffrement de disque interceptent les opérations de lecture/écriture du système d'exploitation et effectuent les transformations cryptographiques appropriées sans aucune action spéciale de la part de l'utilisateur autre que la fourniture d'un mot de passe ou d'une phrase secrète au démarrage du système ou au début d'une session. Cela ne fournit aucune protection contre une personne malveillante qui a déjà réussi à accéder à un compte d'utilisateur valide. \n\n Bonne Pratique \n Le chiffrement complet du disque aide à protéger les données en cas de perte physique d'un disque et, par conséquent, il est préférable de limiter son utilisation uniquement aux périphériques de stockage électroniques amovibles."
  6:
    title: "Les clés cryptographiques utilisées pour protéger les données de carte stockées sont sécurisées."
    1_label: "Des procédures sont définies et mises en œuvre afin de protéger les clés cryptographiques utilisées pour protéger les données de carte stockées contre la divulgation et l'utilisation abusive, notamment : L'accès aux clés est limité au plus petit nombre d’opérateurs nécessaire; Les clés de chiffrement des clés sont au moins aussi robustes que les clés de chiffrement des données qu'elles protègent; Les clés de chiffrement des clés sont stockées séparément des clés de chiffrement de données; Les clés sont stockées en toute sécurité dans le moins d'emplacements et de formes possibles."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les processus qui protègent les clés cryptographiques utilisées pour protéger les données de carte stockées contre la divulgation et l'utilisation abusive sont définis et mis en œuvre. \n\nℹ️ Notes D’applicabilité \n Cette exigence s'applique aux clés utilisées pour chiffrer les données de carte stockées et aux clés de chiffrement utilisées pour protéger les clés de chiffrement des données. \n L'exigence de protéger les clés utilisées pour protéger les données de carte stockées contre la divulgation et l'utilisation abusive s'applique à la fois aux clés de chiffrement des données et aux clés de chiffrement des clés. Étant donné qu'une clé de chiffrement de clé peut accorder l'accès à de nombreuses clés de chiffrement de données, les clés de chiffrement de clés nécessitent des mesures de protection strictes. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les politiques et procédures de gestion des clés documentées afin de vérifier que les processus de protection des clés cryptographiques utilisées pour protéger les données de carte stockées contre la divulgation et l'utilisation abusive sont définies pour inclure tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Les clés cryptographiques doivent être protégées de manière robuste, car ceux qui y accéderont pourront déchiffrer les données. \n\n Bonne Pratique \n Il est recommandé de disposer d'un système centralisé de gestion de clés, basé sur les standards du secteur pour gérer les clés cryptographiques. \n\n Informations Complémentaires \n Les procédures de gestion des clés de l'entité tireront parti des exigences du secteur. Les sources d'informations sur les cycles de vie de la gestion des clés cryptographiques comprennent : \n\t- ISO 11568-1 Banque — Gestion des clés (commerce de détail) — Partie 1 : Principes (en particulier le chapitre 10 et les parties 2 et 4 référencées) \n\t- NIST SP 800-57 Partie 1, Révision 5 -- Recommandation pour la gestion des clés, Partie 1 : Généralités."
    2_prefix: "3.6.1.1"
    2_label: "Exigences supplémentaires pour les prestataires de services uniquement : Une description documentée de l'architecture cryptographique est maintenue, et qui comprend : Les détails de tous les algorithmes, protocoles et clés utilisés pour la protection des données de carte stockées, y compris la robustesse de la clé et la date d'expiration; Éviter l'utilisation des mêmes clés cryptographiques dans les environnements de production et de test. Ce point est une Bonne Pratique jusqu'à sa date d'entrée en vigueur ; se reporter aux Notes D’applicabilité ci-dessous pour plus de détails; Une description de l'utilisation des clés pour chaque clé; L'inventaire de tous les modules de sécurité matérielle (HSM), systèmes de gestion de clés (KMS) et autres dispositifs cryptographiques sécurisés (SCD) utilisés pour la gestion des clés, y compris le type et l'emplacement des dispositifs, comme indiqué dans l'exigence 12.3.4."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Des détails précis de l'architecture cryptographique sont conservés et disponibles. \n\nℹ️ Notes D’applicabilité \n Cette exigence ne s'applique que lorsque l'entité évaluée est un prestataire de services. Dans les implémentations de HSM en cloud, la responsabilité de l'architecture cryptographique conformément à cette exigence sera partagée entre le fournisseur du service cloud et le consommateur de cloud. \n La point ci-dessus (pour inclure, dans l'architecture cryptographique, que l'utilisation des mêmes clés cryptographiques en production et en test est évitée) est une Bonne Pratique jusqu'au 31 mars 2025, après quoi elle sera obligatoire dans le cadre de l'exigence 3.6.1.1 et doit être pleinement prise en compte lors d'une évaluation PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \t-  Procédure de test supplémentaire pour les évaluations des prestataires de services uniquement : Interroger le personnel en charge et examiner la documentation afin de vérifier qu'un document existe pour décrire l'architecture cryptographique qui comprend tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n La tenue à jour de la documentation de l'architecture cryptographique permet à une entité de comprendre les algorithmes, les protocoles et les clés cryptographiques utilisés pour protéger les données de carte stockées, ainsi que les dispositifs qui génèrent, utilisent et protègent les clés. Cela permet à une entité de suivre le rythme de l'évolution des menaces pesant sur son architecture et de planifier des mises à jour au fur et à mesure que le niveau d'assurance fourni par les différents algorithmes et la robustesse des clés change. Le maintien d'une telle documentation permet également à une entité de détecter des clés ou des dispositifs de gestion de clés perdus ou manquants et d'identifier les ajouts non autorisés à son architecture cryptographique. \n L'utilisation des mêmes clés cryptographiques dans les environnements de production et de test introduit un risque d'exposition de la clé si l'environnement de test n'est pas au même niveau de sécurité que l'environnement de production. \n\n Bonne Pratique \n Disposer d’un mécanisme de signalement automatisé peut aider à la maintenance des attributs cryptographiques. \n\n Définitions \n"
    3_prefix: "3.6.1.2"
    3_label: " Les clés secrètes et privées utilisées pour chiffrer/déchiffrer les données de carte stockées sont conservées sous l'une (ou plusieurs) des formes suivantes à tout moment : Chiffrées avec une clé de chiffrement de clé qui est au moins aussi robuste que la clé de chiffrement des données, et qui est stockée séparément de la clé de chiffrement des données; Dans un dispositif cryptographique sécurisé (SCD), tel qu'un module de sécurité matérielle (HSM) ou un dispositif de point d'interaction approuvé PTS; Sous forme d'au moins deux composants de clé ou de partages de clé de pleine longueur, conformément à une méthode acceptée par l'industrie."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les clés secrètes et privées sont stockées sous une forme sécurisée qui empêche la récupération ou l'accès non autorisés \n\nℹ️ Notes D’applicabilité \n Il n'est pas nécessaire que les clés publiques soient stockées sous l'une de ces formes. \n Les clés cryptographiques stockées dans le cadre d'un système de gestion des clés (KMS) qui utilise des SCD sont acceptables. \n Une clé cryptographique divisée en deux parties ne répond pas à cette exigence. Les clés secrètes ou privées stockées en tant que composants de clé ou partages de clé doivent être générées via l'une des méthodes suivantes : \n\t- À l'aide d'un générateur de chiffres aléatoires approuvé et au sein d'un SCD, \n OU \n\t- Selon ISO 19592 ou une standard industrielle équivalente pour la génération de partages de clés secrètes. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les procédures documentées afin de vérifier qu'il est défini que les clés cryptographiques utilisées pour chiffrer/déchiffrer les données de carte stockées ne doivent exister que sous une (ou plusieurs) des formes spécifiées dans cette exigence. \n\tb. Examiner les configurations système et les emplacements de stockage des clés afin de vérifier que les clés cryptographiques utilisées pour chiffrer/déchiffrer les données de carte stockées existent dans une (ou plusieurs) des formes spécifiées dans cette exigence. \n\tc. Partout où des clés de chiffrement des clés sont utilisées, examiner les configurations système et les emplacements de stockage des clés afin de vérifier que : \n\t- Les clés de chiffrement des clés sont au moins aussi robustes que les clés de chiffrement des données qu'elles protègent. \n\t- Les clés de chiffrement des clés sont stockées séparément des clés de chiffrement de données. \n\nℹ️ Directives \n Objectif \n Le stockage sécurisé des clés cryptographiques empêche les accès non autorisés ou inutiles qui pourraient entraîner l'exposition des données de carte stockées. Le stockage séparé des clés signifie qu'elles sont stockées de sorte que si l'emplacement d'une clé est compromis, la deuxième clé ne l'est pas également. \n\n Bonne Pratique \n Lorsque des clés de chiffrement de données sont stockées dans un HSM, le canal d'interaction HSM doit être protégé pour empêcher l'interception des opérations de chiffrement ou de déchiffrement."
    4_prefix: "3.6.1.3"
    4_label: "L'accès aux composants de clé cryptographique en texte clair est limité au plus petit nombre d’opérateurs nécessaire."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n L'accès aux composants de clé cryptographique en texte clair est limité au personnel nécessaire. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les listes d'accès des utilisateurs afin de vérifier que l'accès aux composants de clé cryptographique en texte clair est limité au plus petit nombre d’opérateurs nécessaires. \n\nℹ️ Directives \n Objectif \n La restriction du nombre de personnes ayant accès aux composants de clé cryptographique en texte clair réduit le risque que les données de carte stockées soient récupérées ou rendues visibles par des personnes non autorisées. \n\n Bonne Pratique \n Seul un personnel ayant des responsabilités définies d’opérateur de clés (création, modification, rotation, distribution ou maintenance des clés cryptographiques) doit avoir accès aux composants de clés. Idéalement, ce sera un nombre très réduit de personnes. \n\n Définitions \n"
    5_prefix: "3.6.1.4"
    5_label: "Les clés cryptographiques sont stockées dans le moins d'emplacements possibles. "
    5_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les clés cryptographiques ne sont conservées qu'en cas de nécessité. \n\nℹ️ Procédures de Test de L’approche Définie \n Examiner les emplacements de stockage des clés et observer les processus afin de vérifier que les clés sont stockées dans le moins d'emplacements possibles. \n\nℹ️ Directives \n Objectif \n Le stockage de toutes les clés cryptographiques dans le moins d'emplacements permet à une entreprise de suivre et de surveiller tous les emplacements des clés et de minimiser le risque que les clés soient exposées à des parties non autorisées."
  7:
    title: "Lorsque la cryptographie est utilisée pour protéger les données de carte stockées, des processus et procédures de gestion des clés couvrant tous les aspects du cycle de vie des clés sont définis et mis en œuvre."
    1_label: "Des politiques et procédures de gestion des clés sont mises en œuvre pour inclure la génération de clés cryptographiques robustes utilisées pour protéger les données de carte stockées."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Des clés cryptographiques robustes sont générées. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures de gestion des clés documentées pour les clés utilisées dans la protection des données de carte stockées afin de vérifier qu'elles définissent la génération de clés cryptographiques robustes. \n\tb. Observer la méthode de génération des clés afin de vérifier que des clés robustes sont générées. \n\nℹ️ Directives \n Objectif \n L'utilisation de clés cryptographiques robustes augmente considérablement le niveau de sécurité des données de carte chiffrées. \n\n Informations Complémentaires \n Voir les sources référencées dans la section « Génération de clés cryptographiques à l’Annexe G."
    2_label: "Des politiques et procédures de gestion des clés sont mises en œuvre pour inclure la distribution de clés cryptographiques utilisées pour protéger les données de carte stockées."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les clés cryptographiques sont sécurisées lors de la distribution. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures de gestion des clés documentées pour les clés utilisées dans la protection des données de carte stockées afin de vérifier qu'elles définissent la distribution de clés cryptographiques. \n\tb. Observer la méthode de distribution des clés afin de vérifier que les clés sont distribuées de manière sécurisée. \n\nℹ️ Directives \n Objectif \n La distribution ou la transmission sécurisée de clés cryptographiques secrètes ou privées signifie que les clés ne sont distribuées qu'aux opérateurs autorisés, tels qu'identifiés dans l'exigence 3.6.1.2, et ne sont jamais distribuées de manière non sécurisée."
    3_label: "Des politiques et procédures de gestion des clés sont mises en œuvre pour inclure le stockage de clés cryptographiques utilisées pour protéger les données de carte stockées."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les clés cryptographiques sont sécurisées lors du stockage. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures de gestion des clés documentées pour les clés utilisées dans la protection des données de carte stockées afin de vérifier qu'elles définissent le stockage de clés cryptographiques. \nb. Observer la méthode de stockage des clés afin de vérifier que les clés sont stockées de manière sécurisée. \n\nℹ️ Directives \n Objectif \n Le stockage des clés sans protection adéquate pourrait permettre l'accès à des attaquants, entraînant le déchiffrement et l'exposition des données du compte. \n\n Bonne Pratique \n Les clés cryptographiques des données peuvent être protégées en les chiffrant avec une clé de chiffrement de clé. \n Les clés peuvent être stockées dans un module de sécurité matérielle (HSM). \n Les clés secrètes ou privées qui peuvent déchiffrer les données ne doivent jamais être présentes dans le code source."
    4_label: "Les politiques et procédures de gestion des clés sont mises en œuvre pour les changements de clés cryptographiques pour les clés qui ont atteint la fin de leur cryptopériode, telles que définies par le fournisseur d'applications associé ou le propriétaire de la clé, et basées sur les meilleures pratiques et directives de l'industrie, y compris ce qui suit : Une cryptopériode définie pour chaque type de clé utilisé; Un processus pour les changements de clé à la fin de la cryptopériode définie."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les clés cryptographiques ne sont pas utilisées au-delà de leur cryptopériode définie. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures de gestion des clés documentées pour les clés utilisées dans la protection des données de carte stockées afin de vérifier qu'elles définissent les changements apportés aux clés cryptographiques qui ont atteint la fin de leur cryptopériode et incluent tous les éléments spécifié dans cette exigence. \n\tb. Interroger le personnel, examiner la documentation et observer les emplacements de stockage des clés afin de vérifier que les clés sont modifiées à la fin de la ou des cryptopériodes définies. \n\nℹ️ Directives \n Objectif \n Il est impératif de changer les clés cryptographiques lorsqu'elles atteignent la fin de leur période de cryptographie afin de minimiser le risque que quelqu'un obtienne les clés cryptographiques et les utilise pour déchiffrer des données. \n\n Définitions \n Une cryptopériode est la durée pendant laquelle une clé cryptographique peut être utilisée pour son but défini. Les cryptopériodes sont souvent définies en fonction de la période pendant laquelle la clé est active et/ou de la quantité de texte de chiffrement produite par la clé. Les considérations pour définir la cryptopériode incluent, sans toutefois s'y limiter, la robustesse de l'algorithme sous-jacent, la taille ou la longueur de la clé, le risque de compromission de la clé et la sensibilité des données chiffrées. \n\n Informations Complémentaires \n NIST SP 800-57 Partie 1, Révision 5, Section 5.3 Cryptopériodes - fournit des conseils pour établir la période pendant laquelle une clé spécifique est autorisée à être utilisée par des entités légitimes, ou les clés d'un système donné resteront en vigueur. \n Voir le tableau 1 de SP 800-57 Partie 1 pour les cryptopériodes suggérées pour différents types de clés."
    5_label: "Les procédures et politiques de gestion des clés sont mises en œuvre pour inclure le retrait, le remplacement ou la destruction des clés utilisées pour protéger les données de carte stockées, comme jugé nécessaire lorsque : La clé a atteint la fin de sa cryptopériode définie; L'intégrité de la clé a été affaiblie, notamment lorsque le personnel connaissant un composant de clé en texte clair quitte l'entreprise ou le rôle pour lequel le composant de clé était connu; La clé est suspectée ou avérée être compromise. Les clés retirées ou remplacées ne sont pas utilisées pour les opérations de chiffrement. "
    5_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les clés sont retirées de l'utilisation active lorsqu'il est soupçonné ou connu que l'intégrité de la clé est affaiblie. \n\nℹ️ Notes D’applicabilité \n Si des clés cryptographiques retirées ou remplacées doivent être conservées, ces clés doivent être archivées de manière sécurisée (par exemple, à l'aide d'une clé de chiffrement de clé). \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures de gestion des clés documentées pour les clés utilisées dans la protection des données de carte stockées et vérifier qu'elles définissent le retrait, le remplacement ou la destruction des clés conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Interroger le personnel afin de vérifier que les processus sont mis en œuvre conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Les clés qui ne sont plus nécessaires, les clés dont l'intégrité est affaiblie et les clés dont on sait ou soupçonne qu'elles sont compromises doivent être archivées, révoquées et/ou détruites afin de garantir que les clés ne pourront plus être utilisées. \n Si de telles clés doivent être conservées (par exemple, pour prendre en charge les données chiffrées archivées), elles doivent être fortement protégées. \n\n Bonne Pratique \n Les clés cryptographiques archivées ne doivent être utilisées qu'à des fins de déchiffrement/vérification. \n La solution de chiffrement doit prévoir et faciliter un processus de remplacement des clés qui doivent être remplacées ou dont on sait ou soupçonne qu'elles sont compromises. De plus, toutes les clés avérées ou soupçonnées d’être compromises doivent être gérées selon le plan de réponse aux incidents de l'entité conformément à l'exigence 12.10.1. \n\n Informations Complémentaires \n Les meilleures pratiques de l'industrie pour l'archivage des clés retirées sont décrites dans NIST SP 800-57 Partie 1, Révision 5, Section 8.3.1, et comportent la maintenance de l'archive avec un tiers de confiance et le stockage des informations sur les clés archivées séparément des données opérationnelles."
    6_label: "Lorsque les opérations manuelles de gestion des clés cryptographiques en texte clair sont effectuées par le personnel, les politiques et procédures de gestion des clés sont mises en œuvre, notamment la gestion de ces opérations à l'aide du fractionnement des connaissances et du double contrôle. "
    6_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les clés secrètes ou privées en texte clair ne peuvent être connues de personne. Les opérations impliquant des clés en texte clair ne peuvent pas être effectuées par une seule personne. \n\nℹ️ Notes D’applicabilité \n Ce contrôle s'applique aux opérations manuelles de gestion des clés ou lorsque la gestion des clés n'est pas contrôlée par le produit de chiffrement. Une clé cryptographique simplement divisée en deux parties ne répond pas à cette exigence. Les clés secrètes ou privées stockées en tant que composants de clé ou partages de clé doivent être générées via l'une des méthodes suivantes : \n\t- L'utilisation d'un générateur de chiffres aléatoires approuvé et dans un dispositif cryptographique sécurisé (SCD), tel qu'un module de sécurité matérielle (HSM) ou un dispositif de point d'interaction approuvé PTS,\n OU \n\t- Selon ISO 19592 ou une standard industrielle équivalente pour la génération de partages de clés secrètes. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures de gestion des clés documentées pour les clés utilisées dans la protection des données de carte stockées et vérifier qu'elles sont définies à l'aide du fractionnement des connaissances et du double contrôle. \n\tb. Interroger le personnel et/ou observer les processus afin de vérifier que les clés manuelles en texte clair sont gérées avec un fractionnement des connaissances et un double contrôle. \n\nℹ️ Directives \n Objectif \n Le fractionnement des connaissances et le double contrôle des clés sont utilisés afin d'éliminer la possibilité qu'une seule personne ait accès à l'ensemble de la clé et puisse donc accéder aux données sans autorisation. \n\n Définitions \n Le fractionnement des connaissances est une méthode dans laquelle deux personnes ou plus ont séparément des composants de clés, où chaque personne ne connaît que son propre composant de clé, et les composants de clés individuels ne transmettent aucune connaissance des autres composants ou de la clé cryptographique d'origine. \n Le double contrôle nécessite deux personnes ou plus pour authentifier l'utilisation d'une clé cryptographique ou exécuter une fonction de gestion des clés. Aucune personne ne peut accéder ou utiliser le facteur d'authentification (par exemple, le mot de passe, le code PIN ou la clé) d'une autre personne. \n\n Bonne Pratique \n Lorsque des composants de clé ou des partages de clé sont utilisés, les procédures devraient garantir que jamais un opérateur n'a accès à suffisamment de composants ou de partages de clé pour reconstruire la clé cryptographique. Par exemple, dans un schéma m-sur-n (par exemple, Shamir), où seuls deux des trois composants sont nécessaires pour reconstruire la clé cryptographique, un opérateur ne doit pas avoir une connaissance actuelle ou antérieure de plus d'un composant. \n Si un opérateur s'est déjà vu attribuer le composant A, qui a ensuite été réattribué, l'opérateur ne devrait pas alors se voir attribuer le composant B ou C, car cela donnerait à l'opérateur la connaissance de deux composants et la possibilité de recréer la clé. \n\n Exemples \n Les opérations de gestion des clés pouvant être effectuées manuellement incluent, sans toutefois s'y limiter, la génération, la transmission, le chargement, le stockage et la destruction des clés. \n\n Informations Complémentaires \n Les standards de l'industrie pour la gestion des composants de clés incluent : \n\t- NIST SP 800-57 Partie 2, Révision 1 -- Recommandation pour la gestion des clés : Partie 2 – Meilleures pratiques pour les entreprises de gestion des clés [4.6 Distribution de matériel de génération de clés] \n\t- ISO 11568-1 Banking — Key management (retail) — Part 1 : Chiffrements symétriques, la gestion de leurs clés et leur cycle de vie [4.7.2.3 Composants de clés et 4.9.3 Composants de clés] Directives EPC342-08 du Conseil européen des paiements sur l'utilisation des algorithmes cryptographiques et la gestion des clés [en particulier 4.1.4 Installation des clés]."
    7_label: "Des politiques et procédures de gestion des clés sont mises en œuvre pour inclure la prévention de la substitution non autorisée de clés cryptographiques."
    7_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les clés cryptographiques ne peuvent pas être remplacées par du personnel non autorisé. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures de gestion des clés documentées pour les clés utilisées dans la protection des données de carte stockées et vérifier qu'elles définissent la prévention de la substitution non autorisée de clés cryptographiques. \n\tb. Interroger le personnel et/ou observer les processus afin de vérifier que la substitution non autorisée de clés est empêchée. \n\nℹ️ Directives \n Objectif \n Si un attaquant est capable de remplacer la clé d'une entité par une clé qu'il connaît, l'attaquant pourra déchiffrer toutes les données chiffrées avec cette clé. \n\n Bonne Pratique \n La solution de chiffrement ne doit pas permettre ou accepter la substitution de clés provenant de sources non autorisées ou de processus inattendus. \n Les mesures de sécurité doivent inclure la garantie que les personnes ayant accès aux composants ou partages de clés n'ont pas accès à d'autres composants ou partages qui forment le seuil nécessaire pour dériver la clé."
    8_label: "Des politiques et procédures de gestion des clés sont mises en œuvre pour inclure que les opérateurs de clés cryptographiques reconnaissent formellement (par écrit ou par voie électronique) qu'ils comprennent et acceptent leurs responsabilités d'opérateurs de clés."
    8_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les opérateurs chargés de la gestion des clés connaissent leurs responsabilités en matière d'opérations cryptographiques et peuvent accéder à une assistance et à des conseils en cas de besoin. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures de gestion des clés documentées pour les clés utilisées dans la protection des données de carte stockées et vérifier qu'elles définissent des reconnaissances par les opérateurs de clés conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Examiner la documentation ou d'autres preuves indiquant que les principaux opérateurs ont fourni des reconnaissances conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Ce processus aidera à garantir que les personnes qui agissent en tant qu'opérateurs de clés s'engagent à jouer le rôle d'opérateur de clés et comprennent et acceptent les responsabilités. Une réaffirmation annuelle peut aider à rappeler aux principaux opérateurs leurs responsabilités. \n\n Informations Complémentaires \n Les directives de l'industrie pour les opérateurs de clés et leurs rôles et responsabilités comprennent : \n\t- NIST SP 800-130 Un cadre pour la conception de systèmes de gestion de clés cryptographiques [5. Rôles et responsabilités (en particulier) des opérateurs de clés] \n\t- ISO 11568-1 Banking — Key management (retail) — Part 1 : Principes [5 Principes de gestion des clés (en particulier b)]"
    9_label: "Exigences supplémentaires pour les prestataires de services uniquement : Lorsqu'un prestataire de services partage des clés cryptographiques avec ses clients pour la transmission ou le stockage de données de carte, des conseils sur la transmission, le stockage et la mise à jour sécurisés de ces clés sont documentés et distribués aux clients des prestataires de services."
    9_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les clients reçoivent des conseils appropriés sur la gestion des clés chaque fois qu'ils reçoivent des clés cryptographiques partagées. \n\nℹ️ Notes D’applicabilité \n Cette exigence ne s'applique que lorsque l'entité évaluée est un prestataire de services. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Procédure de test supplémentaire pour les évaluations des prestataires de services uniquement : Si le prestataire de services partage des clés cryptographiques avec ses clients pour la transmission ou le stockage des données de carte, examiner la documentation que le prestataire de services fournit à ses clients, afin de vérifier qu'elle comprend des conseils sur la façon de transmettre, de stocker et de mettre à jour de manière sécurisée les clés des clients conformément à tous les éléments spécifiés dans les exigences 3.7.1 à 3.7.8 ci-dessus. \n\nℹ️ Directives \n Objectif \n La fourniture de conseils aux clients sur la manière de transmettre, de stocker et de mettre à jour les clés cryptographiques de manière sécurisée peut aider à empêcher que les clés ne soient mal gérées ou divulguées à des entités non autorisées. \n\n Informations Complémentaires \n De nombreux standards de l'industrie régissant la gestion des clés sont cités ci-dessus dans le Guide des exigences 3.7.1-3.7.8."
4:
  prefix: "Exigence 4"
  title: "Protéger les Données des Titulaires de Cartes Grâce à une Cryptographie Robuste Lors de la Transmission sur des Réseaux Publics Ouverts"
  desc: "L'utilisation d'une cryptographie robuste offre une plus grande assurance pour la préservation de la confidentialité, de l'intégrité et de la non-répudiation des données. \n\n Pour se protéger contre la compromission, le PAN doit être chiffré lors de la transmission sur des réseaux facilement accessibles par des personnes malveillantes, y compris des réseaux publics et non fiables. Les réseaux sans fil mal configurés et les vulnérabilités des protocoles de chiffrement et d'authentification hérités continuent d'être ciblés par des personnes malveillantes cherchant à exploiter ces vulnérabilités afin d'obtenir un accès privilégié aux environnements de données des titulaires de carte (CDE). Toute transmission de données de titulaires de cartes sur le ou les réseaux internes d'une entité placera naturellement ce réseau dans le périmètre de du standard PCI DSS, car ce réseau stocke, traite ou transmet les données de titulaires de cartes. Tous ces réseaux doivent être évalués et expertisés par rapport aux exigences applicables du standard PCI DSS. \n\n L'exigence 4 s'applique à la transmission du PAN, sauf indication contraire dans une exigence individuelle. \n\n Les transmissions des PAN peuvent être protégées en chiffrant les données avant leur transmission, ou en chiffrant la session dans laquelle les données sont transmises, ou les deux. Bien qu'il ne soit pas obligatoire d'appliquer une cryptographie robuste au niveau des données et au niveau de la session, cela est recommandé. \n\n Se reporter à l'Annexe G pour les définitions de « cryptographie robuste » et d'autres termes du standard PCI DSS."
  1:
    title: "Des processus et des mécanismes de protection des données des titulaires de carte avec une cryptographie robuste lors de la transmission sur des réseaux publics ouverts, sont définis et documentés."
    1_label: "Toutes les politiques de sécurité et procédures opérationnelles identifiées dans l'exigence 4 sont : Documentées. Tenues à jour. Utilisées. Connues de toutes les parties concernées."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les attentes, les mesures de sécurité et la surveillance des activités de réunion dans l'exigence 4 sont définis et respectés par le personnel concerné. Toutes les activités de soutien sont reproductibles, appliquées de manière cohérente et conformes à l'intention de la direction. \n\nℹ️ Procédures de Test de L’approche Définie \n Examiner la documentation et interroger le personnel pour vérifier que les politiques de sécurité et les procédures opérationnelles identifiées dans l'exigence 4 sont gérées conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n L'exigence 4.1.1 concerne la gestion et le maintien efficaces des diverses politiques et procédures spécifiées dans toute l'exigence 4. S'il est important de définir les politiques ou procédures spécifiques décrites dans l'exigence 4, il est tout aussi important de s'assurer qu'elles sont correctement documentées, maintenues et diffusées. \n\n Bonne Pratique \n Il est important de mettre à jour les politiques et les procédures au besoin pour faire face aux changements dans les processus, les technologies et les objectifs métier. Pour cette raison, envisager de mettre à jour ces documents dès que possible après un changement et pas seulement sur un cycle périodique. \n\n Définitions \n Les politiques de sécurité définissent les objectifs et les principes de sécurité de l'entité. Les procédures opérationnelles décrivent la façon d'exécuter les activités et définissent les mesures de sécurité, les méthodes et les processus qui sont suivis pour atteindre le résultat escompté de manière cohérente et conformément aux objectifs de la politique. Les politiques et procédures, y compris les mises à jour, sont activement communiquées à tout le personnel concerné et sont justifiées par des procédures opérationnelles décrivant la manière d'effectuer les activités."
    2_label: "Les rôles et les responsabilités liées aux activités de l'exigence 4 sont documentés, attribués et compris."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les responsabilités quotidiennes pour l'exécution de toutes les activités de l'exigence 4 sont attribuées. Le personnel est responsable du bon fonctionnement continu desdites exigences. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation pour vérifier que les descriptions des rôles et des responsabilités pour l'exécution des activités de l'exigence 4 sont documentées et attribuées. \n\tb. Interroger le personnel chargé d'exécuter les activités de l'exigence 4 afin de vérifier que les rôles et les responsabilités sont assignés comme documentés et qu’ils sont compris. \n\nℹ️ Directives \n Objectif \n Si les rôles et les responsabilités ne sont pas officiellement attribués, le personnel peut ne pas être conscient de ses responsabilités quotidiennes et les activités critiques peuvent ne pas avoir lieu. \n\n Bonne Pratique \n Les rôles et les responsabilités peuvent être documentés dans des politiques et procédures, ou conservés dans des documents distincts. \n Dans le cadre de la communication des rôles et des responsabilités, les entités peuvent envisager de demander au personnel de reconnaître leur acceptation et leur compréhension des rôles et responsabilités qui leur sont attribués. \n\n Exemples \n Une méthode pour documenter les rôles et les obligations est une matrice d'attribution des responsabilités qui indique qui est responsable, redevable, consulté et informé (également appelée matrice RACI)."
  2:
    title: "Le PAN est protégé par une cryptographie robuste pendant la transmission."
    1_label: "Des protocoles de chiffrement et de sécurité robustes sont mis en œuvre comme suit afin de protéger le PAN pendant la transmission sur des réseaux publics ouverts : Seuls les clés et certificats de confiance sont acceptés; Les certificats utilisés pour protéger le PAN lors de la transmission sur des réseaux publics ouverts sont confirmés comme valides et ne sont ni expirés ni révoqués. Ce point est une Bonne Pratique jusqu'à sa date d'entrée en vigueur ; se reporter aux Notes D’applicabilité cidessous pour plus de détails; Le protocole utilisé ne prend en charge que les versions ou configurations sécurisées et ne prend pas en charge le basculement ou l'utilisation de versions, d'algorithmes, de tailles de clé ou de mises en œuvre non sécurisés; La robustesse du chiffrement est adéquate pour la méthodologie de chiffrement utilisée."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les PAN en texte clair ne peuvent pas être lus ou interceptés à partir de toute transmission sur des réseaux publics ouverts. \n\nℹ️ Notes D’applicabilité \n Il peut arriver qu'une entité reçoive des données non sollicitées de titulaires de cartes via un canal de communication non sécurisé qui n'était pas destiné à recevoir des données sensibles. Dans cette situation, l'entité peut choisir soit d'inclure le canal dans le périmètre de son CDE et de le sécuriser conformément au standard PCI DSS, soit de mettre en œuvre des mesures afin d'empêcher l'utilisation du canal pour les données de titulaires de cartes. \n Un certificat auto-signé peut également être acceptable si le certificat est émis par une autorité de certification interne au sein de l'entreprise, que l'auteur du certificat est confirmé et que le certificat est vérifié (par exemple, par hachage ou signature) et qu'il n'a pas expiré. Notez que les certificats autosignés où le champ Nom distinctif (DN) dans les champs « émis par » et « émis à » est le même, ne sont pas acceptables. \n Le point ci-dessus (pour confirmer que les certificats utilisés pour protéger le PAN pendant la transmission sur des réseaux publics ouverts sont valides et n'ont pas expiré ni été révoqués) est une Bonne Pratique jusqu'au 31 mars 2025, après quoi elle sera requise dans le cadre de l'exigence 4.2.1. et doit être pleinement prise en compte lors d'une évaluation du standard PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures documentées et interroger le personnel afin de vérifier que des processus sont définis pour inclure tous les éléments spécifiés dans cette exigence. \n\tb. Examiner les configurations du système afin de vérifier que des protocoles de cryptographie et de sécurité robustes sont mis en œuvre conformément à tous les éléments spécifiés dans cette exigence. \n\tc. Examiner les transmissions de données des titulaires de cartes afin de vérifier que tous les PAN sont chiffrés avec une cryptographie robuste lorsqu'ils sont transmis sur des réseaux publics ouverts. \n\td. Examiner les configurations du système afin de vérifier que les clés et/ou les certificats qui ne peuvent pas être vérifiés comme étant de confiance sont rejetés. \n\nℹ️ Directives \n Objectif \n Les informations sensibles doivent être chiffrées lors de leur transmission sur les réseaux publics, car il est facile et courant pour une personne malveillante d'intercepter et/ou de détourner des données en transit. \n\n Bonne Pratique \n Les diagrammes de flux de données et de réseau définis dans l'exigence 1 sont des ressources utiles pour identifier tous les points de connexion par lesquels les données de carte sont transmises ou reçues sur des réseaux publics ouverts. \n Bien que cela ne soit pas obligatoire, il est considéré comme une Bonne Pratique pour les entités de chiffrer également le PAN sur leurs réseaux internes et pour les entités d'établir de nouvelles mises en œuvre de réseau avec des communications chiffrées. \n Les transmissions des PAN peuvent être protégées en chiffrant les données avant leur transmission, ou en chiffrant la session dans laquelle les données sont transmises, ou les deux. Bien qu'il ne soit pas obligatoire d'appliquer une cryptographie robuste au niveau des données et au niveau de la session, cela est fortement recommandé. Si elles sont chiffrées au niveau des données, les clés cryptographiques utilisées pour protéger les données peuvent être gérées conformément aux exigences 3.6 et 3.7. Si les données sont chiffrées au niveau de la session, des opérateurs de clés désignés devraient être chargés de la gestion des clés de transmission et des certificats. \n Certaines mises en œuvre de protocoles (telles que SSL, SSH v1.0 et TLS initial) présentent des vulnérabilités connues qu'un attaquant peut utiliser pour accéder aux données en texte clair. Il est essentiel que les entités restent informées des dates d'obsolescence définies par l'industrie pour les suites de chiffrement qu'elles utilisent et soient prêtes à migrer vers des versions ou des protocoles plus récents lorsque les plus anciens ne sont plus considérés comme sécurisés. \n Vérifier que les certificats sont approuvés permet de garantir l'intégrité de la connexion sécurisée. Pour être considéré comme approuvé, un certificat doit provenir d'une source de confiance, telle qu'une autorité de certification (CA) de confiance, et ne pas avoir expiré. Des listes de révocation de certificats (CRL) à jour ou le protocole OCSP (Online Certificate Status Protocol) peuvent être utilisés pour valider les certificats. \n Les techniques de validation des certificats peuvent inclure le certificate pinning et le public key pinning, où le certificat de confiance ou une clé publique est fixé soit pendant le développement, soit lors de sa première utilisation. Les entités peuvent également confirmer avec les développeurs ou examiner le code source afin de s'assurer que les clients et les serveurs refusent les connexions si le certificat n'est pas bon. \n Pour les certificats TLS basés sur un navigateur, la confiance du certificat peut souvent être vérifiée en cliquant sur l'icône de cadenas qui apparaît à côté de la barre d'adresse. \n\n Exemples \n Les réseaux publics ouverts comprennent, sans toutefois s'y limiter : \n\t- Les technologies Internet et \n\t- Sans fil, y compris le Wi-Fi, le Bluetooth, les technologies cellulaires et les communications par satellite. \n\n Informations Complémentaires \n Les recommandations des fournisseurs et les meilleures pratiques de l'industrie peuvent être consultées afin d'obtenir des informations sur la robustesse appropriée de chiffrement spécifique à la méthodologie de chiffrement utilisée. Pour plus d'informations sur la cryptographie robuste et les protocoles sécurisés, consultez les normes et standards de l'industrie et les meilleures pratiques telles que NIST SP 800-52 et SP 800-57. \n Pour plus d'informations sur les clés et les certificats approuvés, consultez la publication spéciale 1800-16 du NIST Guide des pratiques de cybersécurité, Sécurisation des transactions Web : Gestion des certificats du serveur TLS (Transport Layer Security)."
    2_prefix: "4.2.1.1"
    2_label: "Un inventaire des clés et des certificats approuvés par l'entité utilisés pour protéger le PAN pendant la transmission, est maintenu."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Toutes les clés et tous les certificats utilisés pour protéger le PAN pendant la transmission sont identifiés et confirmés comme étant approuvés. \n\nℹ️ Notes D’applicabilité \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures documentées afin de vérifier que des processus sont définis pour que l'entité conserve un inventaire de ses clés et certificats approuvés. \n\tb. Examiner l'inventaire des clés et des certificats approuvés afin de vérifier qu'il est tenu à jour. \n\nℹ️ Directives \n Objectif \n L'inventaire des clés approuvées aide l'entité à suivre les algorithmes, les protocoles, la robustesse des clés, les opérateurs des clés et les dates d'expiration des clés. Cela permet à l'entité de réagir rapidement aux vulnérabilités découvertes dans les logiciels de chiffrement, les certificats et les algorithmes cryptographiques. \n\n Bonne Pratique \n Pour les certificats, l'inventaire doit inclure l'autorité de certification émettrice et la date d'expiration de la certification."
    3_prefix: "4.2.1.2"
    3_label: "Les réseaux sans fil transmettant le PAN ou connectés au CDE utilisent les meilleures pratiques de l'industrie pour mettre en œuvre une cryptographie robuste pour l'authentification et la transmission."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les PAN en texte clair ne peuvent pas être lus ou interceptés à partir de toute transmission via des réseaux sans fil. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les configurations du système afin de vérifier que les réseaux sans fil transmettant le PAN ou connectés au CDE utilisent les meilleures pratiques de l'industrie pour mettre en œuvre une cryptographie robuste pour l'authentification et la transmission. \n\nℹ️ Directives \n Objectif \n Étant donné que les réseaux sans fil ne nécessitent pas de support physique pour se connecter, il est important d'établir des mesures de sécurité limitants qui peut se connecter et quels protocoles de transmission seront utilisés. Les utilisateurs malveillants utilisent des outils libres d’accès et largement disponibles pour espionner les communications sans fil. L'utilisation d'une cryptographie robuste peut aider à limiter la divulgation d'informations sensibles sur les réseaux sans fil. \n Les réseaux sans fil présentent des risques uniques pour une entreprise ; par conséquent, ils doivent être identifiés et protégés conformément aux exigences de l'industrie. Une cryptographie forte pour l'authentification et la transmission du PAN est requise afin d'empêcher les utilisateurs malveillants d'accéder au réseau sans fil ou d'utiliser des réseaux sans fil pour accéder à d'autres réseaux ou données internes. \n\n Bonne Pratique \n Les réseaux sans fil ne doivent pas permettre le basculement ou la rétrogradation vers un protocole non sécurisé ou une robustesse de chiffrement inférieure qui ne répond pas à l'intention d'une cryptographie robuste. \n\n Informations Complémentaires \n Consulter la documentation spécifique du fournisseur pour plus de détails sur le choix des protocoles, des configurations et des paramètres liés à la cryptographie."
    4_prefix: "4.2.2"
    4_label: "Le PAN est sécurisé avec une cryptographie robuste chaque fois qu'il est envoyé via les technologies de messagerie des utilisateurs finaux."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Le PAN en texte clair ne peut pas être lu ou intercepté à partir des transmissions utilisant les technologies de messagerie des utilisateurs finaux. \n\nℹ️ Notes D’applicabilité \n Cette exigence s'applique également si un consommateur, ou un autre tiers, demande que le PAN lui soit envoyé via les technologies de messagerie des utilisateurs finaux. \n Il peut arriver qu'une entité reçoive des données non sollicitées de titulaires de cartes via un canal de communication non sécurisé qui n'était pas destiné aux fins de recevoir des données sensibles. Dans cette situation, l'entité peut choisir soit d'inclure le canal dans le périmètre de son CDE et de le sécuriser conformément au standard PCI DSS, soit de supprimer les données du titulaire de carte et mettre en œuvre des mesures afin d'empêcher l'utilisation du canal pour les données de titulaires de cartes. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures documentées afin de vérifier que les processus sont définis pour sécuriser les PAN avec une cryptographie robuste chaque fois qu'ils sont envoyés via les technologies de messagerie des utilisateurs finaux. \n\tb. Examiner les configurations système et la documentation du fournisseur afin de vérifier que le PAN est sécurisé avec une cryptographie robuste chaque fois qu'il est envoyé via les technologies de messagerie des utilisateurs finaux. \n\nℹ️ Directives \n Objectif \n Les technologies de messagerie des utilisateurs finaux peuvent généralement être facilement interceptées par ’sniffing’ de paquets lors de l’envoi sur les réseaux internes et publics. \n\n Bonne Pratique \n L'utilisation de la technologie de messagerie des utilisateurs finaux pour envoyer le PAN ne doit être envisagée que lorsqu'il existe un besoin professionnel défini. \n\n Exemples \n Le courrier électronique, la messagerie instantanée, les SMS et le chat sont des exemples du type de technologie de messagerie d'utilisateurs finaux auquel cette exigence fait référence."
5:
  prefix: "Exigence 5"
  title: "Protéger Tous les Systèmes et Réseaux Contre les Logiciels Malveillants"
  desc: "Un logiciel malveillant (malware) est un logiciel ou un micrologiciel conçu pour infiltrer ou endommager un système informatique à l'insu ou sans le consentement du propriétaire, dans le but de compromettre la confidentialité, l'intégrité ou la disponibilité des données, les applications ou le système d'exploitation du propriétaire. \n\n Des exemples comportent les virus, les vers, les chevaux de Troie, les logiciels espions, les logiciels de rançon, les enregistreurs de frappe et les rootkits, les codes malveillants, les scripts et les liens. \n\n Les logiciels malveillants peuvent pénétrer dans le réseau lors de nombreuses activités approuvées par l'entreprise, y compris la messagerie électronique des employés (par exemple, via l'hameçonnage) et l'utilisation d'Internet, des ordinateurs portables et des périphériques de stockage, entraînant l'exploitation des vulnérabilités du système. \n\n L'utilisation de solutions anti-programmes malveillants qui traitent tous les types de logiciels malveillants aide à protéger les systèmes contre les menaces actuelles et évolutives de logiciels malveillants. \n\n Se reporter à l'Annexe G pour les définitions des termes du standard PCI DSS."
  1:
    title: "Les processus et mécanismes de protection de tous les systèmes et réseaux contre les logiciels malveillants sont définis et compris."
    1_label: "Toutes les politiques de sécurité et procédures opérationnelles identifiées dans l'exigence 5 sont : Documentées; Tenues à jour; Utilisées; Connues de toutes les parties concernées."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les attentes, les mesures de sécurité et la surveillance des activités de réunion dans l'exigence 5 sont définis et respectés par le personnel concerné. Toutes les activités de soutien sont reproductibles, appliquées de manière cohérente et conformes à l'intention de la direction. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation et interroger le personnel pour vérifier que les politiques de sécurité et les procédures opérationnelles identifiées dans l'exigence 5 sont gérées conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n L'exigence 5.1.1 concerne la gestion et le maintien efficaces des diverses politiques et procédures spécifiées dans toute l'exigence 5. S'il est important de définir les politiques ou procédures spécifiques décrites dans l'exigence 5, il est tout aussi important de s'assurer qu'elles sont correctement documentées, maintenues et diffusées. \n\n Bonne Pratique \n Il est important de mettre à jour les politiques et les procédures au besoin pour faire face aux changements dans les processus, les technologies et les objectifs métier. Pour cette raison, envisager de mettre à jour ces documents dès que possible après un changement et pas seulement sur un cycle périodique. \n\n Définitions \n Les politiques de sécurité définissent les objectifs et les principes de sécurité de l'entité. Les procédures opérationnelles décrivent la façon d'exécuter les activités et définissent les mesures de sécurité, les méthodes et les processus qui sont suivis pour atteindre le résultat escompté de manière cohérente et conformément aux objectifs de la politique."
    2_label: "Les rôles et les responsabilités liées aux activités de l'exigence 5 sont documentés, attribués et compris."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les responsabilités quotidiennes pour l'exécution de toutes les activités de l'exigence 5 sont attribuées. Le personnel est responsable du bon fonctionnement continu desdites exigences. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation pour vérifier que les descriptions des rôles et des responsabilités pour l'exécution des activités de l'exigence 5 sont documentées et attribuées. \n\tb. Interroger le personnel chargé d'exécuter les activités de l'exigence 5 afin de vérifier que les rôles et les responsabilités sont assignés comme documentés et qu’ils sont compris. \n\nℹ️ Directives \n Objectif \n Si les rôles et les responsabilités ne sont pas officiellement attribués, les réseaux et les systèmes peuvent ne pas être correctement protégés contre les logiciels malveillants. \n\n Bonne Pratique \n Les rôles et les responsabilités peuvent être documentés dans des politiques et procédures, ou conservés dans des documents distincts. \n Dans le cadre de la communication des rôles et des responsabilités, les entités peuvent envisager de demander au personnel de reconnaître leur acceptation et leur compréhension des rôles et responsabilités qui leur sont attribués. \n\n Exemples \n Une méthode pour documenter les rôles et les obligations est une matrice d'attribution des responsabilités qui indique qui est responsable, redevable, consulté et informé (également appelée matrice RACI)."
  2:
    title: "Les logiciels malveillants (malware) sont empêchés ou détectés et traités."
    1_label: "Une ou plusieurs solutions anti-programmes malveillants sont déployées sur tous les composants système, à l'exception des composants systèmes identifiés dans les évaluations périodiques conformément à l'exigence 5.2.3 qui conclut que les composants système ne sont pas à risque de logiciels malveillants."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Des mécanismes automatisés sont mis en œuvre pour empêcher les systèmes de devenir un vecteur d'attaque pour les logiciels malveillants. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les composants système afin de vérifier qu'une ou plusieurs solutions antiprogrammes malveillants sont déployées sur tous les composants système, à l'exception de ceux déterminés comme n'étant pas exposés aux logiciels malveillants sur la base d'évaluations périodiques conformément à l'exigence 5.2.3. \n\tb. Pour tous les composants système sans solution anti-programmes malveillants, examiner les évaluations périodiques afin de vérifier que le composant a été évalué et que l'évaluation a conclu que le composant n'est pas menacé par des logiciels malveillants. \n\nℹ️ Directives \n Objectif \n Il existe un flux constant d'attaques ciblant les vulnérabilités nouvellement découvertes dans des systèmes précédemment considérés comme sécurisés. Sans solution anti-programmes malveillants régulièrement mise à jour, de nouvelles formes de malware peuvent être utilisées pour attaquer des systèmes, désactiver un réseau ou compromettre des données. \n\n Bonne Pratique \n Il est avantageux pour les entités d'être au courant des attaques « zero-day » (celles qui exploitent une vulnérabilité auparavant inconnue) et d'envisager des solutions axées sur les caractéristiques comportementales et qui alertent sur et réagissent à un comportement inattendu. \n\n Définitions \n Les composants système connus pour être touchés par des logiciels malveillants ont des exploits malveillants actifs disponibles dans le monde réel (pas uniquement des exploits théoriques)."
    2_label: "La ou les solutions anti-programmes malveillants déployées : Détecte tous les types connus de logiciels malveillants; Supprime, bloque ou contient tous les types connus de logiciels malveillants. "
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les logiciels malveillants ne peuvent pas exécuter ou infecter d'autres composants système. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation du fournisseur et les configurations de la ou des solutions antiprogrammes malveillants afin de vérifier que la solution : \n\t- Détecte tous les types connus de logiciels malveillants. \n\t- Supprime, bloque ou contient tous les types connus de logiciels malveillants. \n\nℹ️ Directives \n Objectif \n Il est important de se protéger contre tous les types et formes de logiciels malveillants afin d’empêcher tout accès non autorisé. \n\n Bonne Pratique \n Les solutions anti-programmes malveillants peuvent inclure une combinaison de mesures de sécurité basés sur le réseau, de mesures de sécurité basés sur l'hôte et de solutions de sécurité des terminaux. En plus des outils basés sur les signatures, les capacités utilisées par les solutions anti-programmes malveillants modernes incluent le sandboxing, les mesures de sécurité d'élévation des privilèges et l'apprentissage automatique. \n Les techniques de solution consistent à empêcher les logiciels malveillants d'entrer dans le réseau et à supprimer ou contenir les logiciels malveillants qui pénètrent dans le réseau. \n\n Exemples \n Les types de logiciels malveillants incluent, sans toutefois s'y limiter, les virus, les chevaux de Troie, les vers, les logiciels espions, les logiciels de rançon, les enregistreurs de frappe, les rootkits, les codes malveillants, les scripts et les liens."
    3_label: "Tous les composants système qui ne présentent pas de risque de logiciels malveillants sont évalués périodiquement pour inclure les éléments suivants : Une liste documentée de tous les composants système ne présentant pas de risque de logiciels malveillants; Identification et évaluation des menaces de logiciels malveillants en évolution pour ces composants système; Confirmation indiquant si ces composants système continuent de ne pas nécessiter de protection anti-programmes malveillants."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n L'entité reste informée de l'évolution des menaces de logiciels malveillants afin de s'assurer que les systèmes non protégés contre les logiciels malveillants ne courent aucun risque d'infection. \n\nℹ️ Notes D’applicabilité \n Les composants systèmes couverts par cette exigence sont ceux pour lesquels aucune solution anti-programmes malveillants n'est déployée conformément à l'exigence 5.2.1. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures documentées afin de vérifier qu'un processus est défini pour les évaluations périodiques de tous les composants système qui ne sont pas à risque à l'égard des logiciels malveillants, qui incluent tous les éléments spécifiés dans cette exigence. \n\tb. Interroger le personnel afin de vérifier que les évaluations comportent tous les éléments spécifiés dans cette exigence. \n\tc. Examiner la liste des composants systèmes identifiés comme ne présentant pas de risque de logiciels malveillants et les comparer aux composants système sans solution antiprogrammes malveillants déployée conformément à l'exigence 5.2.1 afin de vérifier que les composants système correspondent aux deux exigences. \n\nℹ️ Directives \n Objectif \n Certains systèmes, à un moment donné, peuvent actuellement ne pas être habituellement ciblés ou touchés par des logiciels malveillants. Cependant, les tendances de l'industrie en matière de logiciels malveillants peuvent changer rapidement, il est donc important que les entreprises soient au courant des nouveaux logiciels malveillants susceptibles de toucher leurs systèmes, par exemple en surveillant les avis de sécurité des fournisseurs et les forums anti-programmes malveillants afin de déterminer si leurs systèmes pourraient être menacés par des logiciels malveillants nouveaux et en évolution. \n\n Bonne Pratique \n Si une entité détermine qu'un système particulier n'est sensible à aucun logiciel malveillant, la détermination doit être étayée par les preuves de l'industrie, les ressources des fournisseurs et les meilleures pratiques. Les étapes suivantes peuvent aider les entités lors de leurs évaluations périodiques : \n\t- Identification de tous les types de système précédemment déterminés comme ne nécessitant pas de protection contre les logiciels malveillants. \n\t- Examen des alertes et des avis de vulnérabilité de l'industrie afin de déterminer si de nouvelles menaces existent pour tout système identifié. \n\t- Une conclusion documentée indiquant si les types de systèmes restent insensibles aux logiciels malveillants. \n\t- Une stratégie pour ajouter une protection contre les logiciels malveillants pour tous les types de systèmes pour lesquels une protection contre les logiciels malveillants est devenue nécessaire. \n Les tendances en matière de logiciels malveillants doivent être incluses dans l'identification des nouvelles vulnérabilités de sécurité dans l'exigence 6.3.1, et des méthodes pour répondre aux nouvelles tendances doivent être intégrées dans les standards de configuration et les mécanismes de protection de l'entité, si nécessaire."
    4_prefix: "5.2.3.1"
    4_label: "La fréquence des évaluations périodiques des composants systèmes identifiés comme ne présentant pas de risque de logiciels malveillants est définie dans l'analyse de risque ciblée de l'entité, qui est effectuée selon tous les éléments spécifiés dans l'exigence 12.3.1."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les systèmes dont on ne sait pas qu'ils sont exposés à des logiciels malveillants sont réévalués à une fréquence qui tient compte du risque de l'entité. \n\nℹ️ Notes D’applicabilité \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner l'analyse de risques ciblée de l'entité pour la fréquence des évaluations périodiques des composants système identifiés comme ne présentant pas de risque de logiciels malveillants afin de vérifier que l'analyse de risques a été effectuée conformément à tous les éléments spécifiés dans l'Exigence 12.3.1. \n\tb. Examiner les résultats documentés des évaluations périodiques des composants systèmes identifiés comme ne présentant pas de risque de logiciels malveillants et interroger le personnel afin de vérifier que les évaluations sont effectuées à la fréquence définie dans l'analyse de risque ciblée de l'entité effectuée pour cette exigence. \n\nℹ️ Directives \n Objectif \n Les entités déterminent la période optimale pour entreprendre l'évaluation en fonction de critères tels que la complexité de l'environnement de chaque entité et le nombre de types de systèmes qui doivent être évalués."
  3:
    title: "Les mécanismes et processus anti-programmes malveillants sont actifs, maintenus et surveillés."
    1_label: "La ou les solutions anti-programmes malveillants sont tenues à jour via des mises à jour automatiques."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les mécanismes anti-programmes malveillants peuvent détecter et traiter les dernières menaces de logiciel malveillants. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les configurations de la ou des solutions anti-programmes malveillants, y compris toute installation originale du logiciel, afin de vérifier que la solution est configurée pour effectuer des mises à jour automatiques. \n\tb. Examiner les composants et les journaux système, afin de vérifier que la ou les solutions et définitions anti-programmes malveillants sont à jour et ont été rapidement déployées. \n\nℹ️ Directives \n Objectif \n Pour qu'une solution anti-programmes malveillants reste efficace, elle doit disposer des dernières mises à jour de sécurité, signatures, moteurs d'analyse des menaces et toute autre protection contre les logiciels malveillants sur laquelle repose la solution. \n Avoir un processus de mise à jour automatisé évite de surcharger les utilisateurs finaux avec la responsabilité d'installer manuellement les mises à jour et offre une plus grande assurance que les mécanismes de protection anti-programmes malveillants sont mis à jour aussi rapidement que possible après la publication d'une mise à jour. \n\n Bonne Pratique \n Les mécanismes anti-programmes malveillants doivent être mis à jour via une source fiable dès que possible une fois qu'une mise à jour est disponible. L'utilisation d'une source commune fiable pour distribuer les mises à jour aux systèmes des utilisateurs finaux permet de garantir l'intégrité et l'uniformité de l'architecture de la solution. \n Les mises à jour peuvent être automatiquement téléchargées vers un emplacement centralisé, par exemple pour permettre des tests, avant d'être déployées sur des composants systèmes individuels."
    2_label: "La ou les solutions anti-programmes malveillants : Effectue des analyses périodiques et des analyses actives ou en temps réel, OU Effectue une analyse comportementale continue des systèmes ou des processus."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les logiciels malveillants ne peuvent pas terminer l'exécution. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les configurations de les solutions anti-programmes malveillants, y compris toute installation originale du logiciel, afin de vérifier que la ou les solutions sont configurées pour exécuter au moins un des éléments spécifiés dans cette exigence. \n\tb. Examiner les composants système, y compris tous les types de système d'exploitation identifiés comme présentant un risque de logiciels malveillants afin de vérifier que la ou les solutions sont activées conformément à au moins un des éléments spécifiés dans cette exigence. \n\tc. Examiner les journaux et les résultats d'analyse afin de vérifier que la ou les solutions sont activées conformément à au moins un des éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Des analyses périodiques peuvent identifier les logiciels malveillants présents, mais actuellement inactifs, dans l'environnement. Certains logiciels malveillants, tels que les logiciels malveillants zero-day, peuvent pénétrer dans un environnement avant que la solution d'analyse ne soit capable de le détecter. La réalisation d'analyses périodiques régulières ou d'analyses comportementales continues des systèmes ou des processus permet de garantir que les logiciels malveillants auparavant indétectables peuvent être identifiés, supprimés et étudiés pour déterminer comment ils ont pu accéder à l'environnement. \n\n Bonne Pratique \n L'utilisation d'une combinaison d'analyses périodiques (planifiées et à la demande) et d'analyses actives en temps réel (à l'accès) permet de garantir que les logiciels malveillants résidant dans les éléments statiques et dynamiques du CDE sont traités. Les utilisateurs doivent également être en mesure d'exécuter des analyses à la demande sur leurs systèmes si une activité suspecte est détectée - cela peut être utile dans la détection précoce des logiciels malveillants. \n Les analyses doivent inclure l'intégralité du système de fichiers, y compris tous les disques, la mémoire, les fichiers de démarrage et les enregistrements de démarrage (au redémarrage du système) pour détecter tous les logiciels malveillants lors de l'exécution du fichier, y compris tout logiciel pouvant résider sur un système mais qui n'est pas actuellement actif. \n Le périmètre de l'analyse doit inclure tous les systèmes et logiciels du CDE, y compris ceux qui sont souvent négligés, tels que les serveurs de messagerie, les navigateurs Web et les logiciels de messagerie instantanée. \n\n Définitions \n L'analyse active ou en temps réel recherche les fichiers malveillants lors de toute tentative d'ouvrir, de fermer, de renommer ou d'interagir avec un fichier, empêchant ainsi l'activation du logiciel malveillant."
    3_prefix: "5.3.2.1"
    3_label: "Si des analyses périodiques de logiciels malveillants sont effectuées pour répondre à l'exigence 5.3.2, la fréquence des analyses est définie dans l'analyse de risque ciblée de l'entité, qui est effectuée conformément à tous les éléments spécifiés dans l'exigence 12.3.1."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les analyses par la solution de logiciels malveillants sont effectuées à une fréquence qui répond au risque de l'entité. \n\nℹ️ Notes D’applicabilité \n Cette exigence s'applique aux entités effectuant des analyses périodiques des logiciels malveillants pour satisfaire à l'exigence 5.3.2. Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner l'analyse de risques ciblée de l'entité pour la fréquence des analyses périodiques des logiciels malveillants afin de vérifier que l'analyse de risques a été effectuée conformément à tous les éléments spécifiés dans l'exigence 12.3.1. \n\tb. Examiner les résultats documentés des analyses périodiques des logiciels malveillants et interroger le personnel afin de vérifier que les analyses sont effectuées à la fréquence définie dans l'analyse de risques ciblée de l'entité, effectuée pour cette exigence. \n\nℹ️ Directives \n Objectif \n Les entités peuvent déterminer la période optimale pour entreprendre des analyses périodiques en fonction de leur propre évaluation des risques posés à leur environnement."
    4_prefix: "5.3.3"
    4_label: "Pour les supports électroniques amovibles, la solution anti-programmes malveillants : Effectue des analyses automatiques lorsque le support est inséré, connecté ou monté logiquement, OU Effectue une analyse comportementale continue des systèmes ou des processus lorsque le support est inséré, connecté ou monté logiquement."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les logiciels malveillants ne peuvent pas être introduits dans les composants système via un support amovible externe. \n\nℹ️ Notes D’applicabilité \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les configurations de la solution anti-programmes malveillants afin de vérifier que, pour les supports électroniques amovibles, la solution est configurée pour exécuter au moins un des éléments spécifiés dans cette exigence. \n\tb. Examiner les composants système avec des supports électroniques amovibles connectés afin de vérifier que la ou les solutions sont activées conformément à au moins un des éléments spécifiés dans cette exigence. \n\tc. Examiner les journaux et les résultats d'analyse afin de vérifier que la ou les solutions sont activées conformément à au moins un des éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Les appareils multimédias portables sont souvent négligés en tant que vecteur d'infiltration pour les logiciels malveillants. Les attaquants préchargeront souvent des logiciels malveillants sur des appareils portables tels que des clés USB ; connectant un appareil infecté à un ordinateur déclenche alors le logiciel malveillant, introduisant de nouvelles menaces dans l'environnement."
    5_prefix: "5.3.4"
    5_label: "Les journaux d’audit pour la solution anti-programmes malveillants sont activés et conservés conformément à l'exigence 10.5.1."
    5_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les enregistrements de l'historique des actions anti-programmes malveillants sont immédiatement disponibles et conservés pendant au moins 12 mois. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les configurations de la solution anti-programmes malveillants afin de vérifier que les journaux sont activés et conservés conformément à l'exigence 10.5.1. \n\nℹ️ Directives \n Objectif \n Il est important de suivre l'efficacité des mécanismes anti-programmes malveillants ; par exemple, en confirmant que les mises à jour et les analyses sont effectuées comme prévu, et que les logiciels malveillants sont identifiés et traités. Les journaux d'audit permettent également à une entité de déterminer comment les logiciels malveillants sont entrés dans l'environnement et de suivre leur activité lorsqu'ils se trouvent à l'intérieur du réseau de l'entité."
    6_prefix: "5.3.5"
    6_label: "Les mécanismes anti-programmes malveillants ne peuvent pas être désactivés ou modifiés par les utilisateurs, à moins qu'ils ne soient spécifiquement documentés et autorisés par la direction au cas par cas pour une durée limitée dans le temps."
    6_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les mécanismes anti-programmes malveillants ne peuvent pas être modifiés par du personnel non autorisé. \n\nℹ️ Notes D’applicabilité \n Les solutions anti-programmes malveillants ne peuvent être temporairement désactivés que s'il existe un besoin technique légitime, autorisé par la direction au cas par cas. Si la solution anti-programmes malveillants doit être désactivée dans un but précis, cette décision doit être formellement autorisée. Des mesures de sécurité supplémentaires peuvent également devoir être mises en œuvre pendant la période pendant laquelle la protection anti-programmes malveillants n'est pas active. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les configurations anti-programmes malveillants, afin de vérifier que les mécanismes anti-programmes malveillants ne peuvent pas être désactivés ou modifiés par les utilisateurs. \n\tb. Interroger le personnel responsable et observer les processus afin de vérifier que toute demande de désactivation ou de modification des mécanismes anti-programmes malveillants est spécifiquement documentée et autorisée par la direction au cas par cas pendant une période limitée. \n\nℹ️ Directives \n Objectif \n Il est important que les mécanismes de défense soient toujours en cours d'exécution afin que les logiciels malveillants soient détectés en temps réel. Le démarrage et l'arrêt ad hoc des solutions anti-programmes malveillants pourraient permettre aux logiciels malveillants de se propager sans contrôle ni détection. \n\n Bonne Pratique \n Lorsqu'il existe un besoin légitime de désactiver temporairement la protection anti-programmes malveillants d'un système ; par exemple, pour prendre en charge une activité de maintenance spécifique ou une enquête sur un problème technique, la raison de cette action doit être comprise et approuvée par un représentant approprié de la direction. Toute désactivation ou modification des mécanismes anti-programmes malveillants, y compris sur les propres appareils des administrateurs, doit être effectuée par du personnel autorisé. \n Il est reconnu que les administrateurs ont des privilèges qui peuvent leur permettre de désactiver l'anti-programmes malveillants sur leurs propres ordinateurs, mais il devrait y avoir des mécanismes d'alerte en place lorsqu'un tel logiciel est désactivé, puis qu’un suivi se produise afin de s'assurer que les processus corrects ont été suivis. \n\n Exemples \n Des mesures de sécurité supplémentaires qui peuvent devoir être mises en œuvre pendant la période pendant laquelle la protection anti-programmes malveillants n'est pas active, incluent la déconnexion du système non protégé d'Internet pendant que la protection anti-programmes malveillants est désactivée et l'exécution d'une analyse complète une fois qu'elle est réactivée."
  4:
    title: "Les mécanismes anti-hameçonnage protègent les utilisateurs contre les attaques par hameçonnage."
    1_label: "Des processus et des mécanismes automatisés sont en place pour détecter et protéger le personnel contre les attaques d'hameçonnage. "
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Des mécanismes sont en place pour protéger et atténuer les risques posés par les attaques d'hameçonnage. \n\nℹ️ Notes D’applicabilité \n Cette exigence s'applique au mécanisme automatisé. Il n'est pas prévu que les systèmes et services fournissant de tels mécanismes automatisés (tels que les serveurs de messagerie) soient inclus dans le périmètre standard PCI DSS. \n L'objectif de cette exigence est de protéger le personnel ayant accès aux composants système dans le périmètre du standard PCI DSS. \n Répondre à cette exigence de mesures de sécurité techniques et automatisés pour détecter et protéger le personnel contre l’hameçonnage n'est pas la même chose que l'exigence 12.6.3.1 pour la formation de sensibilisation à la sécurité. Répondre à cette exigence ne répond pas non plus à l'exigence de fournir au personnel une formation de sensibilisation à la sécurité, et vice versa. \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les processus et mécanismes mis en œuvre afin de vérifier que des mesures de sécurité sont en place pour détecter et protéger le personnel contre les attaques d'hameçonnage. \n\nℹ️ Directives \n Objectif \n Les mesures de sécurité techniques peuvent limiter le nombre d'occasions dont le personnel dispose pour évaluer la véracité d'une communication, et peuvent également limiter les effets des réponses individuelles à l'hameçonnage. \n\n Bonne Pratique \n Lors du développement de mesures anti-hameçonnage, les entités sont encouragées à envisager une combinaison d'approches. Par exemple, l'utilisation de mesures de détection d'usurpation tels que Domain-based Message Authentication, Reporting, and Conformance (DMARC), Sender Policy Framework (SPF) et Domain Keys Identified Mail (DKIM) aidera à empêcher les hameçonneurs d'usurper le domaine de l'entité et de se faire passer pour un membre du personnel. \n Le déploiement de technologies pour bloquer les courriels d'hameçonnage et les logiciels malveillants avant qu'ils n'atteignent le personnel, tels que les programmes de nettoyage des liens et les anti-programmes malveillants côté serveur, peut diminuer les incidents et réduire le temps nécessaire au personnel pour vérifier et signaler les attaques d'hameçonnage. De plus, former le personnel à reconnaître et signaler les courriels d'hameçonnage peut permettre d'identifier des courriels similaires et de les supprimer avant qu'ils ne soient ouverts. \n Il est recommandé (mais pas obligatoire) d'appliquer des mesures anti-hameçonnage à l'ensemble de l'organisation d'une entité. \n\n Définitions \n L'hameçonnage est une forme d'ingénierie sociale et décrit les différentes méthodes utilisées par les attaquants pour amener le personnel à divulguer des informations sensibles, telles que les noms et mots de passe des comptes d'utilisateurs, et les données de carte. Les attaquants se déguisent généralement et tentent d'apparaître comme une source authentique ou digne de confiance, en demandant au personnel d'envoyer une réponse par courriel, de cliquer sur un lien Web ou de saisir des données sur un site Web compromis. Des mécanismes permettant de détecter et d'empêcher les tentatives d'hameçonnage sont souvent inclus dans les solutions anti-programmes malveillants. \n\n Informations Complémentaires \n Voir les sources suivantes pour plus d'informations sur l'hameçonnage : National Cyber Security Centre: Phishing Attacks: Defending your Organization. US Cybersecurity & Infrastructure Security Agency - Report Phishing Sites."
6:
  prefix: "Exigence 6"
  title: "Développer et Maintenir des Systèmes et des Logiciels Sécurisés"
  desc: "Les acteurs mal intentionnés peuvent utiliser des failles de sécurité afin d'obtenir un accès privilégié aux systèmes. Bon nombre de ces vulnérabilités sont corrigées par des correctifs de sécurité fournis par le fournisseur, qui doivent être installés par les entités qui gèrent les systèmes. Tous les composants système doivent disposer de tous les correctifs logiciels appropriés pour se protéger contre l'exploitation et la compromission des données de carte par des personnes malveillantes et des logiciels malveillants. \n\n Les correctifs logiciels appropriés sont les correctifs qui ont été évalués et testés suffisamment pour déterminer qu'ils n'entrent pas en conflit avec les configurations de sécurité existantes. Pour les logiciels sur mesure et personnalisés, de nombreuses vulnérabilités peuvent être évitées en appliquant des processus de cycle de vie du logiciel (SLC) et des techniques de codage sécurisées. \n\n Les référentiels de code qui stockent le code des applications, les configurations système ou d'autres données de configuration pouvant avoir un impact sur la sécurité des données de carte ou le CDE sont dans le périmètre des évaluations du standard PCI DSS. \n\n Voir Relation entre le PCI DSS et les standards logiciels du PCI SSC à la page 8 pour plus d'informations sur l'utilisation de logiciels et de fournisseurs de logiciels validés par le PCI SSC, et sur la manière dont l'utilisation des standards logiciels du PCI SSC peut aider à satisfaire aux mesures de sécurité de l'exigence 6. \n\n Se reporter à l'Annexe G pour les définitions des termes de standard PCI DSS. \n\n⚠️ Remarques \n L'exigence 6 s'applique à tous les composants système, à l'exception de la section 6.2 pour le développement de logiciels de manière sécurisée, qui s'applique uniquement aux logiciels sur mesure et personnalisés utilisés sur tout composant système inclus dans, ou connecté au CDE."
  1:
    title: "Les processus et mécanismes de développement et de maintenance de systèmes et de logiciels sécurisés sont définis et compris."
    1_label: "Toutes les politiques de sécurité et procédures opérationnelles identifiées dans l'exigence 6 sont : Documentées; Tenues à jour; Utilisées; Connues de toutes les parties concernées."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les attentes, les mesures de sécurité et la surveillance des activités de réunion dans l'exigence 6 sont définis et respectés par le personnel concerné. Toutes les activités de soutien sont reproductibles, appliquées de manière cohérente et conformes à l'intention de la direction. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation et interroger le personnel pour vérifier que les politiques de sécurité et les procédures opérationnelles identifiées dans l'exigence 6 sont gérées conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n L'exigence 6.1.1 concerne la gestion et le maintien efficaces des diverses politiques et procédures spécifiées dans toute l'exigence 6. S'il est important de définir les politiques ou procédures spécifiques décrites dans l'exigence 6, il est tout aussi important de s'assurer qu'elles sont correctement documentées, maintenues et diffusées. \n\n Bonne Pratique \n Il est important de mettre à jour les politiques et les procédures au besoin pour faire face aux changements dans les processus, les technologies et les objectifs métier. Pour cette raison, envisager de mettre à jour ces documents dès que possible après un changement et pas seulement sur un cycle périodique. \n\n Définitions \n Les politiques de sécurité définissent les objectifs et les principes de sécurité de l'entité. Les procédures opérationnelles décrivent la façon d'exécuter les activités et définissent les mesures de sécurité, les méthodes et les processus qui sont suivis pour atteindre le résultat escompté de manière cohérente et conformément aux objectifs de la politique."
    2_label: "Les rôles et les responsabilités liées aux activités de l'exigence 6 sont documentés, attribués et compris."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les responsabilités quotidiennes pour l'exécution de toutes les activités de l'exigence 6 sont attribuées. Le personnel est responsable du bon fonctionnement continu desdites exigences. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation pour vérifier que les descriptions des rôles et des responsabilités pour l'exécution des activités de l'exigence 6 sont documentées et attribuées. \n\tb. Interroger le personnel responsable de l'exécution des activités de l'exigence 6 afin de vérifier que les rôles et les responsabilités sont attribués comme documentés et sont compris. \n\nℹ️ Directives \n Objectif \n Si les rôles et les responsabilités ne sont pas formellement attribués, les systèmes ne seront pas maintenus de manière sécurisée et leur niveau de sécurité sera réduit. \n\n Bonne Pratique \n Les rôles et les responsabilités peuvent être documentés dans des politiques et procédures, ou conservés dans des documents distincts. \n Dans le cadre de la communication des rôles et des responsabilités, les entités peuvent envisager de demander au personnel de reconnaître leur acceptation et leur compréhension des rôles et responsabilités qui leur sont attribués. \n\n Exemples \n Une méthode pour documenter les rôles et les obligations est une matrice d'attribution des responsabilités qui indique qui est responsable, redevable, consulté et informé (également appelée matrice RACI)."
  2:
    title: "Des logiciels sur mesure et personnalisés sont développés de manière sécurisée."
    1_label: "Les logiciels sur mesure et personnalisés sont développés de manière sécurisée comme suit : Sur la base des normes et standards de l'industrie et/ou des meilleures pratiques pour un développement sécurisé; Conformément au standard PCI DSS (par exemple, authentification et journalisation sécurisées); Intégration de la prise en compte des problèmes de sécurité de l'information à chaque étape du cycle de vie du développement logiciel."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les logiciels sur mesure et personnalisés sont développés conformément au standard PCI DSS et aux processus de développement sécurisés tout au long du cycle de vie du logiciel. \n\nℹ️ Notes D’applicabilité \n Cette exigence s'applique à tous les logiciels développés pour ou par l'entité pour son propre usage. Cela inclut des logiciels à la fois sur mesure et personnalisés. Ceci ne s'applique pas aux logiciels tiers. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les procédures de développement logiciel documentées afin de vérifier que des processus sont définis et comportent tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Sans l'inclusion de la sécurité lors des phases de définition des exigences, de conception, d'analyse et de test du développement logiciel, des vulnérabilités de sécurité peuvent être introduites par inadvertance ou par malveillance dans l'environnement de production.  \n\n Bonne Pratique \n Comprendre comment les données sensibles sont gérées par l'application, y compris lorsqu'elles sont stockées, transmises et en mémoire, peut aider à identifier où les données doivent être protégées. \n Les exigences du standard PCI DSS doivent être prises en compte lors du développement de logiciels afin de répondre à ces exigences dès la conception, plutôt que d'essayer de réajuster le logiciel ultérieurement. \n\n Exemples \n Les méthodologies et les cadres de gestion du cycle de vie des logiciels sécurisés incluent PCI Secure Software Framework, BSIMM, OPENSAMM et les travaux de NIST, ISO et SAFE Code."
    2_label: "Le personnel développeur de logiciels travaillant sur des logiciels sur mesure et personnalisés est formé au moins une fois tous les 12 mois comme suit : Sur la sécurité des logiciels en rapport avec leur fonction et leurs langages de développement; Inclure la conception de logiciels sécurisés et les techniques de codage sécurisé; Inclure, si des outils de test de sécurité sont utilisés, la manière d'utiliser les outils pour détecter les vulnérabilités dans les logiciels. "
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Le personnel développeur de logiciels reste informé des pratiques de développement sécurisé ; de la sécurité des logiciels ; et des attaques contre les langages, les frameworks ou les applications qu'ils développent. Le personnel peut accéder à une assistance et à des conseils en cas de besoin. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les procédures de développement de logiciels afin de vérifier que les processus sont définis pour la formation du personnel développeur de logiciels, développant des logiciels sur mesure et personnalisés qui incluent tous les éléments spécifiés dans cette exigence. \n\tb. Examiner l'historique des formations et interroger le personnel afin de vérifier que le personnel développeur de logiciels travaillant sur des logiciels sur mesure et personnalisés a reçu une formation en sécurité logicielle adaptée à sa fonction et ses langages de développement conformément à tous les éléments spécifiés dans la présente exigence. \n\nℹ️ Directives \n Objectif \n Le fait d'avoir du personnel connaissant les méthodes de codage sécurisé, y compris les techniques définies dans l'exigence 6.2.4, aidera à minimiser le nombre de vulnérabilités de sécurité introduites par de mauvaises pratiques de codage. \n\n Bonne Pratique \n La formation des développeurs peut être assurée en interne ou par des tiers. \n La formation doit inclure, sans toutefois s'y limiter, les langages de développement utilisés, la conception de logiciels sécurisés, les techniques de codage sécurisé, l'utilisation de techniques/méthodes pour déceler des vulnérabilités dans le code, les processus pour empêcher la réintroduction de vulnérabilités précédemment résolues et la manière d'utiliser des outils de tests de sécurité automatisés pour détecter les vulnérabilités dans les logiciels. \n À mesure que les pratiques de codage sécurisé acceptées par l'industrie changent, les pratiques de codage organisationnel et la formation des développeurs peuvent devoir être mises à jour pour faire face aux nouvelles menaces."
    3_label: "Les logiciels sur mesure et personnalisés sont examinés avant d'être mis en production ou envoyés aux clients, afin d'identifier et de corriger les vulnérabilités de codage potentielles, comme suit : Les examens de code garantissent que le code est développé conformément aux directives de codage sécurisé; Les examens de code recherchent les vulnérabilités logicielles existantes et émergentes; Des corrections appropriées sont mises en œuvre avant la publication"
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les logiciels sur mesure et personnalisés ne peuvent pas être exploités via des vulnérabilités de codage. \n\nℹ️ Notes D’applicabilité \n Cette exigence d'examen de code s'applique à tous les logiciels sur mesure et personnalisés (à la fois internes et publics), dans le cadre du cycle de vie du développement système. \n Les applications Web accessibles au public sont également soumises à des mesures de sécurité supplémentaires, afin de faire face aux menaces et vulnérabilités en cours après la mise en œuvre, comme défini dans l'exigence 6.4du standard PCI DSS. \n Les examens de code peuvent être effectués à l'aide de processus manuels ou automatisés, ou d'une combinaison des deux. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les procédures de développement de logiciels documentées et interroger le personnel responsable afin de vérifier que les processus sont définis et que tous les logiciels sur mesure et personnalisés doivent être examinés conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Examiner les preuves des modifications apportées aux logiciels sur mesure et personnalisés afin de vérifier que les modifications du code ont été examinées conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Les failles de sécurité des logiciels sur mesure et personnalisés sont couramment exploitées par des personnes malveillantes pour accéder à un réseau et compromettre les données de carte. \n Un code vulnérable est beaucoup plus difficile et coûteux à traiter une fois qu'il a été déployé ou publié dans des environnements de production. L'exigence d'un examen formel et d'une approbation par la direction avant la publication permet de garantir que le code est approuvé et a été développé conformément aux politiques et procédures. \n\n Bonne Pratique \n Les éléments suivants doivent être pris en compte pour l'inclusion dans les examens du code : \n\t- Recherche de fonctionnalités non documentées (outils d'implantation, portes dérobées). \n\t- Confirmation que le logiciel utilise de manière sécurisée les fonctions des composants externes (bibliothèques, frameworks, API, etc.). Par exemple, si une bibliothèque tierce fournissant des fonctions cryptographiques est utilisée, vérifiez qu'elle a été intégrée de manière sécurisée. \n\t- Vérification de la bonne utilisation de la journalisation afin d'empêcher les données sensibles d'entrer dans les journaux. \n\t- Analyse des structures non sécurisées du code pouvant contenir des vulnérabilités potentielles liées aux attaques logicielles courantes identifiées dans les exigences 6.2.5. \n\t- Vérification du comportement de l'application afin de détecter des vulnérabilités logiques."
    4_prefix: "6.2.3.1"
    4_label: " Si des examens manuels du code sont effectués sur des logiciels sur mesure et personnalisés avant la mise en production, les modifications de code sont : Examinées par des personnes autres que l'auteur du code d'origine, et qui connaissent les techniques d'examen du code et les pratiques de codage sécurisé; Examinées et approuvées par la direction avant la publication."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Le processus d'examen de code manuel ne peut pas être contourné et est efficace pour découvrir les vulnérabilités de sécurité. \n\nℹ️ Notes D’applicabilité \n Les examens manuels du code peuvent être effectués par du personnel interne compétent ou par du personnel tiers compétent. \n Une personne à qui la responsabilité du contrôle des versions a été officiellement confiée et qui n'est ni l'auteur du code d'origine ni l'examinateur du code remplit les critères de gestion. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Si des examens manuels du code sont effectués sur des logiciels sur mesure et personnalisés avant la mise en production, examiner les procédures de développement de logiciels documentées et interroger le personnel responsable afin de vérifier que les processus sont définis pour les examens manuels de code à effectuer, conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Examiner les preuves des modifications apportées aux logiciels sur mesure et personnalisés et interroger le personnel afin de vérifier que les examens manuels du code ont été effectués conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Faire examiner le code par une personne autre que l'auteur d'origine, qui soit à la fois expérimentée dans les examens de code et bien informée sur les pratiques de codage sécurisé, minimise la possibilité qu'un code, contenant des erreurs de sécurité ou de logique et pouvant avoir une incidence sur la sécurité des données des titulaires de cartes soit publié dans un environnement de production. Exiger l'approbation de la direction que le code a été examiné limite la possibilité de contourner le processus. \n\n Bonne Pratique \n Il a été constaté que le fait d'avoir une méthodologie d'examen formelle et des listes de contrôle des examens améliore la qualité du processus d'examen de code. \n L'examen de code est un processus fatigant, et pour cette raison, il est plus efficace lorsque les examinateurs ne n'examinent que de petites quantités de code à la fois. \n Pour maintenir l'efficacité des examens de code, il est avantageux de surveiller la charge de travail générale des examinateurs et de les faire examiner les applications avec lesquelles ils sont familiers. \n Les examens de code peuvent être effectués à l'aide de processus manuels ou automatisés, ou d'une combinaison des deux. Les autorisations qui reposent uniquement sur l'examen manuel du code doivent s'assurer que les examinateurs maintiennent leurs compétences grâce à une formation régulière à mesure que de nouvelles vulnérabilités sont découvertes et que de nouvelles méthodes de codage sécurisé sont recommandées. \n\n Informations Complémentaires \n Voir le Guide d'examen de code OWASP"
    5_prefix: "6.2.4"
    5_label: " Des techniques d'ingénierie logicielle ou d'autres méthodes sont définies et utilisées par le personnel de développement de logiciels afin de prévenir ou d'atténuer les attaques logicielles courantes et les vulnérabilités associées, y compris, sans toutefois s'y limiter : Attaques par injection, y compris SQL, LDAP, XPath ou d'autres failles de type commande, paramètre, objet, erreur ou injection; Attaques ciblant les données et les structures de données, y compris les tentatives de manipulation de tampons, de pointeurs, de données d'entrée ou de données partagées; Attaques ciblant l'utilisation de la cryptographie, y compris les tentatives d'exploitation d'implémentations cryptographiques, d'algorithmes, de suites de chiffrement ou de modes de fonctionnement faibles, non sécurisés ou inadéquats; Attaques contre la logique métier, y compris les tentatives d'abus ou de contournement des caractéristiques et fonctionnalités des applications via la manipulation d'API, de protocoles et de canaux de communication, de fonctionnalités côté consommateur ou d'autres fonctions et ressources du système ou de l'application. Cela comprend les scripts de site à site (XSS) et les altérations de requêtes de site à site (CSRF); Attaques contre les mécanismes de contrôle d'accès, y compris les tentatives pour contourner ou d'abuser des « credentials », de l'authentification ou des mécanismes d'autorisation, ou des tentatives d'exploiter les faiblesses de la mise en œuvre de ces mécanismes; Attaques via toutes les vulnérabilités « à haut risque » identifiées dans le processus d'identification des vulnérabilités, telles qu'elles sont définies dans l'exigence 6.3.1."
    5_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les logiciels sur mesure et personnalisés ne peuvent pas être exploités via des attaques habituelles et des vulnérabilités associées. \n\nℹ️ Notes D’applicabilité \n Cette exigence s'applique à tous les logiciels développés pour ou par l'entité pour son propre usage. Cela inclut des logiciels à la fois sur mesure et personnalisés. Ceci ne s'applique pas aux logiciels tiers. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les procédures documentées et interroger le personnel responsable du développement de logiciels afin de vérifier que les techniques d'ingénierie logicielle ou d'autres méthodes sont définies et utilisées par les développeurs de logiciels sur mesure et personnalisés afin de prévenir ou atténuer toutes les attaques logicielles courantes, comme spécifié dans cette exigence. \n\nℹ️ Directives \n Objectif \n La détection ou la prévention précoces des erreurs courantes qui entraînent un code vulnérable dans le processus de développement logiciel réduit la probabilité que de telles erreurs parviennent à la production et conduisent à une compromission. L'intégration de techniques et d'outils d'ingénierie formels dans le processus de développement permettra de détecter rapidement ces erreurs. Cette philosophie est parfois appelée « shift-left security ». \n\n Bonne Pratique \n Pour les logiciels sur mesure et personnalisés, l'entité doit s'assurer que le code est développé en se concentrant sur la prévention ou l'atténuation des attaques logicielles courantes, notamment : \n\t- Tentative d'exploiter des vulnérabilités courantes de codage (bogues). \n\t- Tentative d'exploiter les failles de conception du logiciel. \n\t- Tentative d'exploiter les failles d'implémentation ou de configuration. \n\t- Attaques d'énumération - attaques automatisées qui sont activement exploitées dans les mécanismes de paiement et de « credentials », d'authentification ou d'autorisation. Voir PCI Perspectives blog article “Beware of Account Testing Attacks.” \n La recherche et la documentation de techniques d'ingénierie logicielle ou d'autres méthodes aident à définir comment les développeurs de logiciels empêchent ou atténuent diverses attaques logicielles par des fonctionnalités ou des contre-mesures qu'ils intègrent au logiciel. \n Cela peut inclure des mécanismes d'identification ou d'authentification, un contrôle d'accès, des routines de validation de saisie, etc. Les développeurs doivent être familiarisés avec les différents types de vulnérabilités et d'attaques potentielles, et utiliser des mesures afin d'éviter les vecteurs d'attaque potentiels lors du développement du code. \n\n Exemples \n Les techniques incluent des processus et des pratiques automatisés qui analysent le code au début du cycle de développement lorsque le code est archivé pour confirmer qu'aucune vulnérabilité n'est présente."
  3:
    title: "Les vulnérabilités de sécurité sont identifiées et corrigées."
    1_label: "Les vulnérabilités de sécurité sont identifiées et gérées de la manière suivante : Les nouvelles vulnérabilités de sécurité sont identifiées à l'aide de sources reconnues par l'industrie pour les informations sur les vulnérabilités de sécurité, y compris les alertes des équipes internationales et nationales d'intervention en cas d'urgence informatique (CERT); Les vulnérabilités se voient attribuer un classement de risques basé sur les meilleures pratiques de l'industrie et la prise en compte de l'incidence potentielle; Les classements des risques identifient, au minimum, toutes les vulnérabilités considérées comme à haut risque ou critiques pour l'environnement; Les vulnérabilités des logiciels sur mesure et personnalisés et des logiciels de tiers (par exemple les systèmes d'exploitation et les bases de données) sont couvertes. "
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les nouvelles vulnérabilités du système et des logiciels susceptibles d'avoir une incidence sur la sécurité des données de carte ou du CDE sont surveillées, cataloguées et évaluées en fonction des niveaux de risque. \n\nℹ️ Notes D’applicabilité \n Cette exigence n'est pas satisfaite par, et n'est pas la même que, les analyses de vulnérabilité effectuées pour les exigences 11.3.1 et 11.3.2. Cette exigence vise un processus visant la surveillance active des sources de l'industrie pour les informations sur les vulnérabilités et pour que l'entité détermine la catégorisation des risques à associer à chaque vulnérabilité. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures d'identification et de gestion des vulnérabilités de sécurité afin de vérifier que les processus sont définis conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Interroger le personnel responsable, examiner la documentation et observer les processus afin de vérifier que les vulnérabilités de sécurité sont identifiées et gérées conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n La classification des risques (par exemple, comme critique, élevé, moyen ou faible) permet aux entreprises d'identifier, de hiérarchiser et de traiter plus rapidement les éléments présentant le risque le plus élevé et de réduire la probabilité que les vulnérabilités présentant le plus grand risque soient exploitées. \n\n Bonne Pratique \n Les méthodes d'évaluation des vulnérabilités et d'attribution des niveaux de risque varieront en fonction de l'environnement et de la stratégie d'évaluation des risques d'une entreprise. \n Lorsqu'une entité attribue des classements de son risque, elle doit envisager d'utiliser une méthodologie formelle, objective et justifiable qui décrit avec précision les risques des vulnérabilités qui soient pertinentes pour l'entreprise et qui se traduisent par une priorité de résolution appropriée attribuée par l'entité. \n Les processus d'une organisation pour gérer les vulnérabilités doivent être intégrés à d'autres processus de gestion ; par exemple, la gestion des risques, la gestion des changements, la gestion des correctifs, la réponse aux incidents, la sécurité des applications, ainsi qu'une surveillance et une journalisation appropriées de ces processus. Cela aidera à garantir que toutes les vulnérabilités sont correctement identifiées et traitées. Les processus doivent prendre en charge l'évaluation continue des vulnérabilités. Par exemple, une vulnérabilité initialement identifiée comme à faible risque pourrait passer à un risque plus élevé plus tard. \n En outre, des vulnérabilités, considérées individuellement comme présentant un risque faible ou moyen, pourraient collectivement présenter un risque élevé ou critique si elles sont présentes sur le même système, ou si elles sont exploitées sur un système à faible risque pouvant entraîner l'accès au CDE. \n\n Exemples \n Certaines organisations qui émettent des alertes pour informer les entités des vulnérabilités urgentes nécessitant des correctifs/mises à jour immédiats sont les équipes nationales de préparation/réponse aux urgences informatiques (CERT) et les fournisseurs. \n Les critères de classement des vulnérabilités peuvent inclure la criticité d'une vulnérabilité identifiée dans une alerte du Forum of Incident Response and Security Teams (FIRST) ou d'une CERT, la prise en compte du score CVSS, la classification par le fournisseur et/ou le type de systèmes impactés. \n\n Informations Complémentaires \n Les sources fiables d’informations sur les vulnérabilités incluent les sites Web des fournisseurs, les listes de diffusion, ect. \n Si le logiciel est développé en interne, l'équipe de développement interne doit également prendre en compte les sources d'informations sur les nouvelles vulnérabilités susceptibles d'avoir des incidences sur les applications développées en interne. D'autres méthodes pour s'assurer que les nouvelles vulnérabilités sont identifiées comportent des solutions qui reconnaissent et émettent automatiquement des alertes lors de la détection d'un comportement inhabituel. Les processus doivent tenir compte des codes malveillants largement publiés ainsi que des attaques « zero-day », qui ciblent des vulnérabilités auparavant inconnues. \n Pour les logiciels sur mesure et personnalisés, l'entreprise peut obtenir des informations sur les bibliothèques, les frameworks, les compilateurs, les langages de programmation, etc. à partir de sources publiques de confiance (par exemple, des ressources spéciales et des ressources de développeurs de composants). L'entreprise peut également analyser indépendamment des composants tiers et identifier les vulnérabilités. \n Pour contrôler les logiciels développés en interne, l'entreprise peut recevoir ces informations de sources externes. L'entreprise peut envisager d'utiliser un programme de « bug bounty » où elle publie des informations (par exemple, sur son site Web) afin que des tiers puissent contacter l'entreprise avec des informations sur la vulnérabilité. \n Les sources externes peuvent inclure des enquêteurs indépendants ou des entreprises qui rendent compte à l'organisation des vulnérabilités identifiées et peuvent inclure des sources telles que le Common Vulnerability Scoring System (CVSS) ou la méthodologie d'évaluation des risques de l'OWASP."
    2_label: "Un inventaire des logiciels sur mesure et personnalisés ainsi que des composants logiciels tiers intégrés dans des logiciels sur mesure et personnalisés est conservé afin de faciliter la gestion des vulnérabilités et des correctifs."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les vulnérabilités connues dans les composants logiciels tiers ne peuvent pas être exploitées dans les logiciels sur mesure et personnalisés. \n\nℹ️ Notes D’applicabilité \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation et interroger le personnel afin de vérifier qu'un inventaire des logiciels sur mesure et personnalisés et des composants logiciels tiers intégrés aux logiciels sur mesure et personnalisés est maintenu, et que l'inventaire est utilisé afin d'identifier et corriger les vulnérabilités. \n\tb. Examiner la documentation du logiciel, y compris pour les logiciels sur mesure et personnalisés qui intègrent des composants logiciels tiers, et la comparer à l'inventaire afin de vérifier que l'inventaire comprend les logiciels sur mesure et personnalisés et les composants logiciels tiers. \n\nℹ️ Directives \n Objectif \n L'identification et l'énumération de tous les logiciels sur mesure et personnalisés de l'entité, ainsi que de tout logiciel tiers intégré aux logiciels sur mesure et personnalisés de l'entité, permettent à l'entité de gérer les vulnérabilités et les correctifs. \n Les vulnérabilités des composants tiers (y compris les bibliothèques, les API, etc.) intégrés au logiciel d'une entité rendent également ces applications vulnérables aux attaques. Il est essentiel de savoir quels composants tiers sont utilisés dans le logiciel de l'entité et de surveiller la disponibilité des correctifs de sécurité pour corriger les vulnérabilités connues afin de garantir la sécurité du logiciel. \n\n Bonne Pratique \n L'inventaire d'une entité doit couvrir tous les composants et dépendances du logiciel de paiement, y compris les plates-formes ou environnements d'exécution pris en charge, les bibliothèques tierces, les services et autres fonctionnalités obligatoires. \n Il existe de nombreux types de solutions qui peuvent aider à gérer les inventaires de logiciels, tels que les outils d'analyse de la composition logicielle, les outils de découverte d'applications et la gestion des appareils mobiles."
    3_label: "Tous les composants système sont protégés contre les vulnérabilités connues en installant les correctifs/mises à jour de sécurité applicables comme suit : Les correctifs/mises à jour critiques ou de haute sécurité (identifiés selon le processus de classement des risques énoncé à l'exigence 6.3.1) sont installés dans le mois suivant leur publication; Tous les autres correctifs/mises à jour de sécurité applicables sont installés dans un délai approprié déterminé par l'entité (par exemple, dans les trois mois suivant leur publication)."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les composants système ne peuvent pas être compromis par l'exploitation d'une vulnérabilité connue. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et les procédures afin de vérifier que les processus sont définis pour traiter les vulnérabilités en installant les correctifs/mises à jour de sécurité applicables conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Examiner les composants système et les logiciels associés et comparer la liste des correctifs/mises à jour de sécurité installés aux informations les plus récentes sur les correctifs/mises à jour de sécurité afin de vérifier que les vulnérabilités sont corrigées conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n De nouveaux exploits sont constamment découverts, et ceux-ci peuvent permettre des attaques contre des systèmes qui étaient auparavant considérés comme sécurisés. Si les correctifs/mises à jour de sécurité les plus récents ne sont pas mis en œuvre sur les systèmes critiques dès que possible, une personne malveillante peut utiliser ces exploits pour attaquer ou désactiver un système ou accéder à des données sensibles. \n\n Bonne Pratique \n La hiérarchisation des correctifs/mises à jour de sécurité pour les infrastructures critiques garantit que les systèmes et appareils hautement prioritaires sont protégés des vulnérabilités dès que possible après la publication d'un correctif. \n La fréquence de mise à jour d'une entité doit tenir compte de toute réévaluation des vulnérabilités et des changements ultérieurs de la criticité d'une vulnérabilité conformément à l'exigence 6.3.1. Par exemple, une vulnérabilité initialement identifiée comme à faible risque pourrait passer à un risque plus élevé plus tard. En outre, des vulnérabilités, considérées individuellement comme présentant un risque faible ou moyen, pourraient collectivement présenter un risque élevé ou critique si elles sont présentes sur le même système, ou si elles sont exploitées sur un système à faible risque pouvant entraîner l'accès au CDE."
  4:
    title: "Les applications Web destinées au public sont protégées contre les attaques."
    1_label: "Pour les applications Web destinées au public, les nouvelles menaces et vulnérabilités sont traitées en permanence, et ces applications sont protégées contre les attaques connues comme suit : Examiner les applications Web accessibles au public grâce à des outils ou des méthodes manuels ou automatisés d'évaluation de la sécurité des vulnérabilités des applications, comme suit : – Au moins une fois tous les 12 mois et après des modifications importantes. – Par une entité spécialisée dans la sécurité des applications. – Y compris, au minimum, toutes les attaques logicielles courantes énoncées dans l'exigence 6.2.4. – Toutes les vulnérabilités sont classées conformément à l'exigence 6..3.1. – Toutes les vulnérabilités sont corrigées. – L'application est réévaluée après les corrections OU L'installation d'une ou plusieurs solutions techniques automatisées qui détectent et empêchent en permanence les attaques basées sur le Web, comme suit : – Installé devant les applications Web destinées au public afin de détecter et empêcher les attaques Web.– En exécution active et à jour, le cas échéant. – Génération de journaux d'audit. – Configuré pour bloquer les attaques Web ou générer une alerte qui est immédiatement examinée."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les applications Web destinées au public sont protégées contre les attaques malveillantes. \n\nℹ️ Notes D’applicabilité \n Cette évaluation n'est pas la même que les analyses de vulnérabilité effectuées pour les exigences 11.3.1 et 11.3.2. \n Cette exigence sera remplacée par l'exigence 6.4.2 après le 31 mars 2025 lorsque l'exigence 6.4.2 entrera en vigueur. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Pour les applications Web destinées au public, s'assurer que l'une des méthodes requises est en place comme suit : \n\t-  Si des outils ou des méthodes manuels ou automatisés d'évaluation de la sécurité des vulnérabilités sont utilisés, examiner les processus documentés, interroger le personnel et examiner les enregistrements des évaluations de la sécurité des applications afin de vérifier que les applications Web destinées au public sont examinées conformément à tous les éléments de cette exigence spécifiques à l'outil ou à la méthode. \n OU \n\t-  Si une ou plusieurs solutions techniques automatisées sont installées qui détectent et empêchent en permanence les attaques Web, examiner les paramètres de configuration du système et les journaux d'audit, et interroger le personnel responsable afin de vérifier que la ou les solutions techniques automatisées sont installées conformément à tous les éléments de cette exigence spécifique à la ou aux solutions. \n\nℹ️ Directives \n Objectif \n Les applications Web destinées au public sont celles qui sont disponibles au public (pas seulement pour un usage interne). Ces applications sont les principales cibles des attaquants, et les applications Web mal codées offrent aux attaquants un moyen facile d'accéder aux données et systèmes sensibles. \n\n Bonne Pratique \n Les outils ou méthodes manuels ou automatisés d'évaluation de la sécurité des vulnérabilités examinent et/ou testent l'application afin de détecter les vulnérabilités. \n Les outils d'évaluation courants incluent des analyseurs Web spécialisés qui effectuent une analyse automatique de la protection des applications Web. \n Lors de l'utilisation de solutions techniques automatisées, il est important d'inclure des processus qui facilitent les réponses rapides aux alertes générées par les solutions afin que toute attaque détectée puisse être atténuée. \n\n Définitions \n Un pare-feu d'applications Web (WAF) installé devant les applications Web destinées au public pour vérifier tout le trafic est un exemple de solution technique automatisée qui détecte et empêche les attaques Web (par exemple, les attaques énoncées dans l'exigence 6.2.4). Les WAF filtrent et bloquent le trafic non essentiel au niveau de la couche application. Un WAF correctement configuré permet d'empêcher les attaques de la couche application sur les applications mal codées ou mal configurées. \n Les technologies RASP (Runtime Application Self-Protection) sont un autre exemple de solution technique automatisée. Lorsqu'elles sont correctement mises en œuvre, les solutions RASP peuvent détecter et bloquer les comportements anormaux du logiciel pendant l'exécution. Alors que les WAF surveillent généralement le périmètre de l'application, les solutions RASP surveillent et bloquent le comportement au sein de l'application."
    2_label: "Pour les applications Web destinées au public, une solution technique automatisée est déployée qui détecte et empêche en permanence les attaques Web, avec au moins les éléments suivants : Est installée devant les applications Web destinées au public et configurée afin de détecter et empêcher les attaques Web; En exécution active et à jour, le cas échéant; Génération de journaux d'audit; Configurée pour bloquer les attaques Web ou générer une alerte qui est immédiatement examinée."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les applications Web destinées au public sont protégées en temps réel contre les attaques malveillantes. \n\nℹ️ Notes D’applicabilité \n Cette nouvelle exigence remplacera l'exigence 6.4.1 une fois sa date d'entrée en vigueur atteinte. Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Pour les applications Web destinées au public, examiner les paramètres de configuration système et les journaux d'audit, et interroger le personnel responsable afin de vérifier qu'une solution technique automatisée qui détecte et empêche les attaques Web est en place conformément à tous les éléments spécifiés dans cette exigence.  \n\nℹ️ Directives \n Objectif \n Les applications destinées au public sont les principales cibles des attaquants, et les applications Web mal codées offrent aux attaquants un moyen facile d'accéder aux données et systèmes sensibles. \n\n Bonne Pratique \n Lors de l'utilisation de solutions techniques automatisées, il est important d'inclure des processus qui facilitent les réponses rapides aux alertes générées par les solutions afin que toute attaque détectée puisse être atténuée. Ces solutions peuvent également être utilisées pour automatiser l'atténuation, par exemple des mesures de sécurité de limitation de débit, qui peuvent être mis en œuvre afin d'atténuer les attaques par force brute et les attaques par énumération. \n\n Exemples \n Un pare-feu d'applications Web (WAF), qui peut être sur site ou basé sur le cloud, installé devant les applications Web destinées au public pour vérifier tout le trafic est un exemple de solution technique automatisée qui détecte et empêche les attaques Web (par exemple, les attaques énoncées dans l'exigence 6.2.4). Les WAF filtrent et bloquent le trafic non essentiel au niveau de la couche application. Un WAF correctement configuré permet d'empêcher les attaques de la couche application sur les applications mal codées ou mal configurées."
    3_label: "Tous les scripts de la page de paiement qui sont chargés et exécutés dans le navigateur du consommateur sont gérés comme suit : Une méthode est mise en œuvre pour confirmer que chaque script est autorisé; Une méthode est mise en œuvre pour assurer l'intégrité de chaque script; Un inventaire de tous les scripts est maintenu avec une justification écrite expliquant pourquoi chacun est nécessaire."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Un code non autorisé ne peut pas être présent sur la page de paiement car il est affiché dans le navigateur du consommateur. \n\nℹ️ Notes D’applicabilité \n Cette exigence s'applique à tous les scripts chargés à partir de l'environnement de l'entité et aux scripts chargés à partir de tiers et de quatrièmes parties. Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures afin de vérifier que des processus sont définis pour gérer tous les scripts de page de paiement qui sont chargés et exécutés dans le navigateur du consommateur, conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Interroger le personnel responsable et examiner les enregistrements d'inventaire et les configurations système afin de vérifier que tous les scripts de page de paiement qui sont chargés et exécutés dans le navigateur du consommateur sont gérés conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Les scripts chargés et exécutés dans la page de paiement peuvent voir leur fonctionnalité modifiée à l'insu de l'entité et peuvent également avoir la fonctionnalité de charger d'autres scripts externes (par exemple, publicité et suivi, systèmes de gestion des balises). \n Ces scripts apparemment inoffensifs peuvent être utilisés par des attaquants potentiels pour télécharger des scripts malveillants capables de lire et d'exfiltrer les données des titulaires de cartes à partir du navigateur du consommateur. \n S'assurer que la fonctionnalité de tous ces scripts est comprise comme étant nécessaire au fonctionnement de la page de paiement minimise le nombre de scripts qui pourraient être falsifiés. \n S'assurer que les scripts ont été explicitement autorisés réduit la probabilité que des scripts inutiles soient ajoutés à la page de paiement sans l'approbation adéquate de la direction. \n L'utilisation de techniques pour empêcher l’altération du script minimisera la probabilité que le script soit modifié pour effectuer un comportement non autorisé, tel que l'écrémage des données des titulaires de cartes à partir de la page de paiement. \n\n Bonne Pratique \n Les scripts peuvent être autorisés par des processus manuels ou automatisés (par exemple, flux de travail). \n Lorsque la page de paiement sera chargée dans un cadre en ligne (IFRAME), en restreignant l'emplacement à partir duquel la page de paiement peut être chargée, l'utilisation de la politique de sécurité du contenu (CSP) de la page parente peut aider à empêcher du contenu non autorisé de se substituer à la page de paiement. \n\n Définitions \n « Nécessaire » pour cette exigence signifie que l'examen par l'entité de chaque script justifie et confirme pourquoi il est nécessaire pour que la fonctionnalité de la page de paiement accepte une transaction de paiement. \n\n Exemples \n L'intégrité des scripts peut être renforcée par plusieurs mécanismes différents, y compris, sans toutefois s'y limiter : \n\t- L'intégrité des sous-ressources (SRI), qui permet au navigateur du consommateur de valider qu'un script n'a pas été falsifié. \n\t- Une CSP, qui limite les emplacements à partir desquels le navigateur du consommateur peut charger un script et y transmettre des données de carte. \n\t- Des systèmes de gestion de scripts ou de balises propriétaires, qui peuvent empêcher l'exécution de scripts malveillants."
  5:
    title: "Les modifications apportées à tous les composants système sont gérées de manière sécurisée."
    1_label: "Les modifications apportées à tous les composants système dans l'environnement de production sont effectuées conformément aux procédures établies qui comportent : Raison et description du changement; Documentation de l'impact sur la sécurité; Approbation des changements documentée par les parties autorisées; Tests pour vérifier que le changement n'a pas d'incidence négative sur la sécurité du système; Pour les changements apportés aux logiciels sur mesure et personnalisés, toutes les mises à jour sont testées afin de vérifier leur conformité à l'exigence 6.2.4 avant d'être déployées en production; Procédures pour la résolution des échecs et le retour à un état sécurisé."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Toutes les modifications sont suivies, autorisées et évaluées en termes d'impact et de sécurité, et les modifications sont gérées afin d'éviter les effets imprévus sur la sécurité des composants système. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les procédures documentées de contrôle des modifications afin de vérifier que des procédures sont définies pour les modifications apportées à tous les composants système dans l'environnement de production afin d'inclure tous les éléments spécifiés dans cette exigence. \n\tb. Examiner les modifications récentes apportées aux composants système et retracer ces modifications jusqu'à la documentation de contrôle des modifications associée. Pour chaque modification examinée, vérifier que les modifications sont mises en œuvre conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Des procédures de gestion des modifications doivent être appliquées à toutes les modifications, y compris l'ajout, la suppression ou la modification de tout composant système, dans l'environnement de production. Il est important de documenter la raison d'une modification et la description de la modification afin que les parties concernées comprennent et conviennent que la modification est nécessaire. De même, la documentation des impacts des modifications permet à toutes les parties concernées de planifier de manière appropriée toutes modifications apportées au traitement. \n\n Bonne Pratique \n L'approbation par les parties autorisées confirme que le changement est légitime et que les modifications sont sanctionnées par l'entreprise. Les modifications doivent être approuvées par des personnes ayant l'autorité et les connaissances appropriées pour comprendre l'impact des modifications. \n Des tests approfondis par l'entité confirment que la sécurité de l'environnement n'est pas réduite par la mise en œuvre d'un changement et que tous les mesures de sécurité de sécurité existants restent en place ou sont remplacés par des mesures de sécurité de sécurité égaux ou plus robustes après le changement. Les tests spécifiques à effectuer varieront en fonction du type de changement et des composants systèmes concernés. \n Pour chaque modification, il est important d'avoir des procédures documentées qui résolvent toute défaillance et fournissent des instructions sur la façon de revenir à un état sécurisé au cas où la modification échouerait ou aurait une incidence négative sur la sécurité d'une application ou d'un système. Ces procédures permettront de restaurer l'application ou le système à son état sécurisé précédent."
    2_label: "Suite à modifications importantes, toutes les exigences applicables du standard PCI DSS sont confirmées être en place sur tous les systèmes et réseaux nouveaux ou modifiés, et la documentation est mise à jour, le cas échéant."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Tous les composants du système sont vérifiés après une modification importante et qu'ils sont conformes aux exigences applicables du standard PCI DSS. \n\nℹ️ Notes D’applicabilité \n Ces modifications importantes doivent également être capturées et reflétées dans l'activité annuelle de confirmation du périmètre du standard PCI DSS de l'entité conformément à l'exigence 12.5.2. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation pour les modifications importantes, interroger le personnel et observer les systèmes/réseaux touchés afin de vérifier que l'entité a confirmé que les exigences applicables du standard PCI DSS étaient en place sur tous les systèmes et réseaux nouveaux ou modifiés et que la documentation a été mise à jour, le cas échéant. \n\nℹ️ Directives \n Objectif \n Disposer de processus pour analyser les modifications importantes permet de garantir que tous les mesures de sécurité appropriée du standard PCI DSS sont appliqués à tous les systèmes ou réseaux ajoutés ou modifiés sur l'environnement dans le périmètre, et que les exigences du standard PCI DSS continuent d'être respectées pour sécuriser l'environnement. \n\n Bonne Pratique \n L'intégration de cette validation dans les processus de gestion des modifications permet de garantir que les inventaires des appareils et les standards de configuration sont tenus à jour et que des mesures de sécurité de sécurité sont appliqués, si nécessaire. \n\n Exemples \n Les exigences applicables du standard PCI DSS qui pourraient être touchées incluent, sans toutefois s'y limiter : \n\t- Les diagrammes de réseau et de flux de données sont mis à jour pour refléter les modifications. \n\t- Les systèmes sont configurés selon les standards de configuration, avec tous les mots de passe par défaut modifiés et les services inutiles désactivés. \n\t- Les systèmes sont protégés par les mesures requises, par exemple, la surveillance de l'intégrité des fichiers (FIM), anti-programmes malveillants, les correctifs et la journalisation des audits. \n\t- Les données d'authentification sensibles ne sont pas stockées et tout le stockage des données de carte est documenté et intégré à la politique et aux procédures de conservation des données. \n\t- De nouveaux systèmes sont inclus dans le processus trimestriel d'analyse des vulnérabilités. \n\t- Les systèmes sont analysés pour détecter les vulnérabilités internes et externes après des modifications importantes conformément aux exigences 11.3.1.3 et 11.3.2.1."
    3_label: "Les environnements de pré-production sont séparés des environnements de production et la séparation est appliquée avec des mesures de sécurité d'accès."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les environnements de pré-production ne peuvent pas introduire de risques et de vulnérabilités dans les environnements de production. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures afin de vérifier que des processus sont définis pour séparer l'environnement de pré-production de l'environnement de production par des mesures de sécurité d'accès qui imposent la séparation. \n\tb. Examiner la documentation réseau et les configurations des mesures de sécurité de sécurité réseau afin de vérifier que l'environnement de préproduction est séparé du ou des environnements de production. \n\tc. Examiner les paramètres de contrôle d'accès afin de vérifier que des mesures de sécurité d'accès sont en place pour imposer la séparation entre les environnements de préproduction et de production. \n\nℹ️ Directives \n Objectif \n En raison de l'état en constante évolution des environnements de pré-production, ils sont souvent moins sécurisés que l'environnement de production. \n\n Bonne Pratique \n Les entreprises doivent clairement comprendre quels environnements sont des environnements de test ou des environnements de développement et comment ces environnements interagissent au niveau des réseaux et des applications. \n\n Définitions \n Les environnements de pré-production incluent le développement, les tests, les tests d'acceptation par l'utilisateur (UAT), etc. Même lorsque l'infrastructure de production est utilisée pour faciliter les tests ou le développement, les environnements de production doivent toujours être séparés (logiquement ou physiquement) des fonctionnalités de pré-production afin que les vulnérabilités introduites à la suite des activités de pré-production n'affectent pas négativement les systèmes de production."
    4_label: "Les rôles et les fonctions sont séparés entre les environnements de production et de préproduction afin d'assurer la responsabilité de sorte que seules les modifications examinées et approuvées soient déployées."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les rôles et la responsabilité qui différencient les activités de pré-production et de production sont définis et gérés afin de minimiser le risque d'actions non autorisées, involontaires ou inappropriées. \n\nℹ️ Notes D’applicabilité \n Dans les environnements avec un personnel limité où les individus remplissent plusieurs rôles ou fonctions, ce même objectif peut être atteint avec des mesures de sécurité procéduraux supplémentaires qui garantissent la responsabilité. Par exemple, un développeur peut également être un administrateur qui utilise un compte de niveau administrateur avec des privilèges élevés dans l'environnement de développement ; et, pour son rôle de développeur, il utilise un compte distinct avec un accès de niveau utilisateur dans l'environnement de production. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et les procédures afin de vérifier que les processus sont définis pour séparer les rôles et les fonctions afin d'assurer la responsabilité de sorte que seuls les modifications examinées et approuvées soient déployées. \n\tb. Observer les processus et interroger le personnel afin de vérifier que les mesures de sécurité mis en œuvre séparent les rôles et les fonctions et assurent la responsabilité de sorte que seuls les modifications examinées et approuvées soient déployées. \n\nℹ️ Directives \n Objectif \n L'objectif de la séparation des rôles et des fonctions entre les environnements de production et de pré-production est de réduire le nombre de personnes ayant accès à l'environnement de production et aux données de carte, et ainsi minimiser le risque d'accès non autorisé, involontaire ou inapproprié aux données et aux composants système, et aider à garantir que l'accès est limité aux personnes ayant un besoin professionnel pour un tel accès. \n L'objectif de ce contrôle est de séparer les activités critiques pour assurer une surveillance et un examen afin de détecter les erreurs et de minimiser les risques de fraude ou de vol (puisque deux personnes devraient s'entendre pour masquer une activité). \n La séparation des rôles et des fonctions, également appelée séparation ou ségrégation des tâches, est un concept de contrôle interne essentiel pour protéger les actifs d'une entité. "
    5_label: "Les PAN actifs ne sont pas utilisés dans les environnements de pré-production, sauf lorsque ces environnements sont inclus dans le CDE et protégés conformément à toutes les exigences applicables du standard PCI DSS."
    5_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les PAN actifs ne peuvent pas être présents dans les environnements de pré-production en dehors du CDE. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures afin de vérifier que les processus sont définis pour ne pas utiliser de PAN actifs dans les environnements de pré-production, sauf lorsque ces environnements sont dans un CDE et protégés conformément à toutes les exigences applicables du standard PCI DSS. \n\tb. Observer les processus de test et interroger le personnel afin de vérifier que des procédures sont en place pour garantir que les PAN actifs ne sont pas utilisés dans les environnements de pré-production, sauf lorsque ces environnements sont dans un CDE et protégés conformément à toutes les exigences applicables du standard PCI DSS. \n\tc. Examiner les données de test de préproduction afin de vérifier que les PAN actifs ne sont pas utilisés dans les environnements de préproduction, sauf lorsque ces environnements sont dans un CDE et protégés conformément à toutes les exigences applicables du standard PCI DSS. \n\nℹ️ Directives \n Objectif \n L'utilisation de PAN actifs en dehors des CDE protégés offre aux personnes malveillantes la possibilité d'accéder sans autorisation aux données des titulaires de cartes. \n\n Bonne Pratique \n Les entités peuvent minimiser leur stockage de PAN actifs en ne les stockant en pré-production que lorsque cela est strictement nécessaire pour un objectif de test spécifique et défini, et en supprimant de manière sécurisée ces données après utilisation. \n Si une entité a besoin de PAN spécialement conçus à des fins de test, ceux-ci peuvent être obtenus auprès des acquéreurs. \n\n Définitions \n Les PAN actifs font référence à des PAN valides (pas des PAN de test) qui ont le potentiel d'être utilisés pour effectuer des transactions de paiement. De plus, lorsque les cartes de paiement expirent, le même PAN est souvent réutilisé avec une date d'expiration différente. Tous les PAN doivent être vérifiés comme étant incapables d'effectuer des transactions de paiement avant d'être exclus du périmètre du standard PCI DSS. Il est de la responsabilité de l'entité de confirmer que les PAN ne sont pas actifs."
    6_label: "Les données de test et les comptes de test sont supprimés des composants système avant que le système ne passe en production."
    6_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les données de test et les comptes de test ne peuvent pas exister dans les environnements de production. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et les procédures afin de vérifier que les processus sont définis pour la suppression des données de test et des comptes de test des composants système avant que le système ne passe en production. \n\tb. Observer les processus de test pour les logiciels standard et les applications internes, et interroger le personnel afin de vérifier que les données de test et les comptes de test sont supprimés avant qu'un système ne démarre en mode production. \n\tc. Examiner les données et les comptes des logiciels commerciaux et des applications internes récemment installés ou mis à jour afin de vérifier qu'il n'y a pas de données de test ou de comptes de test sur les systèmes de production. \n\nℹ️ Directives \n Objectif \n Ces données peuvent divulguer des informations sur le fonctionnement d'une application ou d'un système et constituent une cible facile à exploiter par des personnes non autorisées pour accéder aux systèmes. La possession de ces informations pourrait faciliter la compromission du système et des données de carte associées."
7:
  prefix: "Exigence 7"
  title: "Limiter L'accès aux Composants Système et aux Données des Titulaires de Cartes en Fonction des Besoins de L'entreprise"
  desc: "Des personnes non autorisées peuvent accéder à des données ou à des systèmes critiques en raison de règles et de définitions de contrôle d'accès inefficaces. Pour garantir que les données critiques ne sont accessibles qu'au personnel autorisé, des systèmes et des processus doivent être en place afin de limiter l'accès en fonction du besoin d’en connaître et en fonction des responsabilités du poste. \n\n Un « accès » ou des « droits d'accès » sont créés par des règles qui permettent aux utilisateurs d'accéder aux systèmes, aux applications et aux données, tandis que les « privilèges » permettent à un utilisateur d'effectuer une action ou une fonction spécifique en relation avec ce système, cette application ou ces données. Par exemple, un utilisateur peut avoir des droits d'accès à des données spécifiques, mais le fait qu'il puisse uniquement lire ces données, ou puisse également modifier ou supprimer les données est déterminé par les privilèges attribués à l'utilisateur. \n\n Le « besoin d’en connaître » fait référence à l'accès à la plus petite quantité de données nécessaires à l'exécution d'une tâche. \n\n Les « moindres privilèges » font référence au fait de ne fournir que le niveau minimum de privilèges nécessaires pour effectuer une tâche. \n\n Ces exigences s'appliquent aux comptes d'utilisateurs et à l'accès des employés, sous-traitants, consultants, fournisseurs internes et externes et autres tiers (par exemple, pour fournir des services d'assistance ou de maintenance). Certaines exigences s'appliquent également aux comptes d'applications et système utilisés par l'entité (également appelés « comptes de service »).\n\n Ces exigences ne s'appliquent pas aux consommateurs (titulaires de cartes). \n\n Se reporter à l'Annexe G pour les définitions des termes du standard PCI DSS."
  1:
    title: "Les processus et les mécanismes de restriction de l'accès aux composants système et aux données des titulaires de cartes par l'entreprise doivent être définis et compris."
    1_label: "Toutes les politiques de sécurité et procédures opérationnelles identifiées dans l'exigence 7 sont : Documentées; Tenues à jour; Utilisées; Connues de toutes les parties concernées."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les attentes, les mesures de sécurité et la surveillance des activités de réunion dans l'exigence 7 sont définis et respectés par le personnel concerné. Toutes les activités de soutien sont reproductibles, appliquées de manière cohérente et conformes à l'intention de la direction. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation et interroger le personnel pour vérifier que les politiques de sécurité et les procédures opérationnelles identifiées dans l'exigence 7 sont gérées conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n L'exigence 7.1.1 concerne la gestion et le maintien efficaces des diverses politiques et procédures spécifiées dans toute l'exigence 7. S'il est important de définir les politiques ou procédures spécifiques décrites dans l'exigence 7, il est tout aussi important de s'assurer qu'elles sont correctement documentées, maintenues et diffusées. \n\n Bonne Pratique \n Il est important de mettre à jour les politiques et les procédures au besoin pour faire face aux changements dans les processus, les technologies et les objectifs métier. Pour cette raison, envisager de mettre à jour ces documents dès que possible après un changement et pas seulement sur un cycle périodique. \n\n Définitions \n Les politiques de sécurité définissent les objectifs et les principes de sécurité de l'entité. Les procédures opérationnelles décrivent la façon d'exécuter les activités et définissent les mesures de sécurité, les méthodes et les processus qui sont suivis pour atteindre le résultat escompté de manière cohérente et conformément aux objectifs de la politique."
    2_label: "Les rôles et les responsabilités liées aux activités de l'exigence 7 sont documentés, attribués et compris."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les responsabilités quotidiennes pour l'exécution de toutes les activités de l'exigence 7 sont attribuées. Le personnel est responsable du bon fonctionnement continu desdites exigences. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation pour vérifier que les descriptions des rôles et des responsabilités pour l'exécution des activités de l'exigence 7 sont documentées et attribuées. \n\tb. Interroger le personnel chargé d'exécuter les activités de l'exigence 7 afin de vérifier que les rôles et les responsabilités sont assignés comme documentés et qu’ils sont compris. \n\nℹ️ Directives \n Objectif \n Si les rôles et les responsabilités ne sont pas officiellement attribués, le personnel peut ne pas être conscient de ses responsabilités quotidiennes et les activités critiques peuvent ne pas avoir lieu. \n\n Bonne Pratique \n Les rôles et les responsabilités peuvent être documentés dans des politiques et procédures, ou conservés dans des documents distincts. \n Dans le cadre de la communication des rôles et des responsabilités, les entités peuvent envisager de demander au personnel de reconnaître leur acceptation et leur compréhension des rôles et responsabilités qui leur sont attribués. \n\n Exemples \n Une méthode pour documenter les rôles et les obligations est une matrice d'attribution des responsabilités qui indique qui est responsable, redevable, consulté et informé (également appelée matrice RACI)."
  2:
    title: "L'accès aux composants système et aux données du système est défini et attribué de manière adéquate."
    1_label: "Un modèle de contrôle d'accès est défini et inclut l'octroi d'accès comme suit : Accès approprié en fonction de l'activité de l'entité et des besoins d'accès; Accès aux composants système et aux ressources de données en fonction de la classification et des fonctions des utilisateurs; Les moindres privilèges requis (par exemple, utilisateur, administrateur) pour exécuter une fonction."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les conditions d'accès sont établies selon les fonctions du poste suivant les principes des moindres privilèges et du besoin d’en connaître. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures documentées et interroger le personnel afin de vérifier que le modèle de contrôle d'accès est défini conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Examiner les paramètres du modèle de contrôle d'accès et vérifier que les besoins d'accès sont correctement définis conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n La définition d'un modèle de contrôle d'accès adapté à la technologie et à la philosophie de contrôle d'accès de l'entité soutient une manière cohérente et uniforme d'attribuer l'accès et réduit la possibilité d'erreurs telles que l'octroi de droits excessifs. \n\n Bonne Pratique \n Un facteur à considérer lors de la définition des besoins d'accès est le principe de séparation des tâches. Ce principe vise à prévenir la fraude et l'abus ou le vol de ressources. Par exemple, 1) répartir les fonctions critiques et les fonctions de support du système d'information entre différentes personnes et/ou fonctions, 2) établir des rôles tels que les activités de support du système d'information sont exécutées par différentes fonctions/personnes (par exemple, gestion du système, programmation, gestion des configurations, assurance qualité et tests, et sécurité du réseau), et 3) s'assurer que le personnel de sécurité administrant les fonctions de contrôle d'accès n'administre pas également les fonctions d'audit. \n Dans les environnements où une seule personne exécute plusieurs fonctions, telles que les opérations d'administration et de sécurité, des tâches peuvent être attribuées de sorte qu'aucune personne n'ait le contrôle de bout en bout d'un processus sans un point de contrôle indépendant. Par exemple, la responsabilité de la configuration et la responsabilité de l'approbation des modifications pourraient être attribuées à des personnes distinctes. \n\n Définitions \n Les éléments clés d'un modèle de contrôle d'accès comprennent : \n\t- Les ressources à protéger (les systèmes/appareils/données auxquels l'accès est nécessaire), \n\t- Les fonctions de travail qui ont besoin d'accéder à la ressource (par exemple, administrateur système, personnel du centre d'appels, commis de magasin), et \n\t- Les activités que chaque fonction doit effectuer (par exemple, lecture/écriture ou requête). \n Une fois que les fonctions de travail, les ressources et les activités par fonction sont définies, les individus peuvent se voir accorder l'accès en conséquence. \n\n Exemples \n Les modèles de contrôle d'accès que les entités peuvent envisager comportent le contrôle d'accès basé sur les rôles (RBAC) et le contrôle d'accès basé sur les attributs (ABAC). Le modèle de contrôle d'accès utilisé par une entité donnée dépend de ses besoins professionnels et d'accès."
    2_label: "L'accès est attribué aux utilisateurs, y compris les utilisateurs privilégiés, selon : La classification du poste et de la fonction; Les moindres privilèges nécessaires pour exercer les responsabilités de la tâche."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n L'accès aux systèmes et aux données est limité uniquement à l'accès nécessaire à l'exécution des fonctions professionnelles, tel que défini dans les rôles d'accès associés. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures afin de vérifier qu'elles couvrent l'attribution de l'accès aux utilisateurs conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Examiner les paramètres d'accès des utilisateurs, y compris pour les utilisateurs privilégiés, et interroger le personnel responsable de la gestion afin de vérifier que les privilèges attribués sont conformes à tous les éléments spécifiés dans cette exigence. \n\tc. Interroger le personnel chargé d'attribuer l'accès afin de vérifier que l'accès des utilisateurs privilégiés est attribué conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n L'attribution de moindres privilèges permet d'empêcher les utilisateurs qui ne connaissent pas suffisamment l'application de modifier de manière incorrecte ou accidentelle la configuration de l'application ou de modifier ses paramètres de sécurité. L'application des moindres privilèges permet également de minimiser l'étendue des dommages si une personne non autorisée accède à un identifiant utilisateur. \n\n Bonne Pratique \n Les droits d'accès sont accordés à un utilisateur par affectation à une ou plusieurs fonctions. L'accès est attribué selon les fonctions d’utilisateur spécifiques et avec le périmètre minimal requise pour la tâche. \n Lors de l'attribution d'un accès privilégié, il est important d'attribuer aux individus uniquement les privilèges dont ils ont besoin pour effectuer leur travail (les « moindres privilèges »). Par exemple, l'administrateur de base de données ou l'administrateur de sauvegarde ne doit pas disposer des mêmes privilèges que l'administrateur système global. \n Une fois les besoins définis pour les fonctions utilisateur (conformément à l'exigence 7.2.1 du standard PCI DSS), il est facile d'accorder l'accès aux personnes en fonction de la classification de leur poste et de leur fonction en utilisant les rôles déjà créés. \n Les entités peuvent envisager d'utiliser la gestion des accès privilégiés (PAM), qui est une méthode pour accorder l'accès aux comptes privilégiés uniquement lorsque ces privilèges sont requis, en révoquant immédiatement cet accès une fois qu'ils ne sont plus nécessaires."
    3_label: "Les privilèges requis sont approuvés par un personnel autorisé."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les privilèges d'accès ne peuvent pas être accordés aux utilisateurs sans autorisation appropriée et documentée. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures afin de vérifier qu'elles définissent des processus d'approbation de tous les privilèges par un personnel autorisé. \n\tb. Examiner les identifiants des utilisateurs et les privilèges attribués, et les comparer avec les approbations documentées afin de vérifier que : \n\t- Une approbation documentée existe pour les privilèges attribués. \n\t- L'approbation a été donnée par un personnel autorisé. \n\t- Les privilèges spécifiés correspondent aux rôles attribués à la personne. \n\nℹ️ Directives \n Objectif \n L'approbation documentée (par exemple, par écrit ou par voie électronique) garantit que les personnes disposant d'un accès et de privilèges sont connues et autorisées par la direction, et que leur accès est nécessaire pour leur fonction."
    4_label: "Tous les comptes et les privilèges d'accès associés, y compris les comptes tiers/fournisseurs, sont examinés comme suit : Au moins une fois tous les six mois; Pour garantir que les comptes d'utilisateurs et l'accès restent appropriés selon la fonction du poste; Tout accès inapproprié est traité; La direction reconnaît que l'accès demeure approprié."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les attributions de privilèges de compte sont vérifiées périodiquement par la direction comme étant correctes, et toute non-conformité est corrigée. \n\nℹ️ Notes D’applicabilité \n Cette exigence s'applique à tous les comptes d'utilisateurs et aux privilèges d'accès associés, y compris ceux utilisés par le personnel et les tiers/fournisseurs, et les comptes utilisés pour accéder aux services cloud de tiers. \n Voir les exigences 7.2.5 et 7.2.5.1 et 8.6.1 à 8.6.3 pour les mesures de sécurité des comptes d'application et système. \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et les procédures afin de vérifier qu'elles définissent des processus pour examiner tous les comptes d'utilisateurs et les privilèges d'accès associés, y compris les comptes de tiers/fournisseurs, conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Interroger le personnel responsable et examiner les résultats documentés des examens périodiques des comptes d'utilisateurs afin de vérifier que tous les résultats sont conformes à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n L'examen régulier des droits d'accès permet de détecter les droits d'accès excessifs restants après le changement des responsabilités professionnelles de l'utilisateur, le changement des fonctions du système ou autres changements. Si des droits excessifs d'un utilisateur ne sont pas révoqués en temps utile, ils peuvent être exploités par des utilisateurs malveillants pour un accès non autorisé. \n Cet examen offre une autre possibilité de s'assurer que les comptes de tous les utilisateurs ayant terminé leurs tâches ont été supprimés (le cas échéant, au moment de la fin de leurs tâches), ainsi que de s'assurer que tout tiers qui n'a plus besoin d'accès a vu son accès suspendu. \n\n Bonne Pratique \n Lorsqu'un utilisateur est transféré dans un nouveau rôle ou un nouveau service, les privilèges et l'accès associés à son ancien rôle ne sont généralement plus nécessaire. L'accès continu à des privilèges ou fonctions qui ne sont plus nécessaires peut introduire un risque d'abus ou d'erreurs. Par conséquent, lorsque les responsabilités changent, les processus qui revalident l'accès aident à garantir que l'accès de l'utilisateur est approprié pour les nouvelles responsabilités dudit utilisateur. \n Les entités peuvent envisager de mettre en œuvre un processus régulier et reproductible pour effectuer des examens des droits d'accès et attribuer des « propriétaires de données » qui sont responsables de la gestion et de la surveillance de l'accès aux données liées à leur fonction, et qui garantissent également que l'accès des utilisateurs reste à jour et approprié. \n À titre d'exemple, un responsable direct pourrait examiner l'accès de l'équipe tous les mois, tandis que le responsable principal examine l'accès de ses groupes tous les trimestres, tous deux mettant à jour l'accès au besoin. Le but de ces meilleures pratiques est de soutenir et de faciliter l'opération des examens au moins une fois tous les 6 mois."
    5_label: "Tous les comptes d'applications et système et les privilèges d'accès associés sont attribués et gérés comme suit : Basé sur les moindres privilèges nécessaires à l'opérabilité du système ou de l'application; L'accès est limité aux systèmes, applications ou processus qui nécessitent spécifiquement leur utilisation."
    5_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les droits d'accès accordés aux comptes d'applications et système sont limités uniquement à l'accès nécessaire au fonctionnement de cette application ou de ce système. \n\nℹ️ Notes D’applicabilité \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et les procédures afin de vérifier qu'elles définissent des processus pour gérer et attribuer les comptes d'applications et système, et les privilèges d'accès associés conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Examiner les privilèges associés aux comptes système et d'applications, et interroger le personnel responsable afin de vérifier que les comptes d'applications et système et les privilèges d'accès associés sont attribués et gérés conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Il est important d'établir le niveau d'accès approprié pour les comptes d'applications ou système. Si de tels comptes sont compromis, des utilisateurs malveillants recevront le même niveau d'accès que celui accordé à l'application ou au système. Par conséquent, il est important de garantir qu'un accès limité est accordé aux comptes système et d'applications sur la même base qu'aux comptes utilisateur. \n\n Bonne Pratique \n Les entités peuvent envisager d'établir une base de référence lors de la configuration de ces comptes d'applications et système, y compris les éléments suivants, selon le cas de l'entreprise : \n\t- S'assurer que le compte n'est pas membre d'un groupe privilégié tel que les administrateurs de domaine, les administrateurs locaux ou root. \n\t- La restriction des ordinateurs sur lesquels le compte peut être utilisé. \n\t- La restriction des heures d'utilisation. \n\t- La suppression de tous les paramètres supplémentaires tels que l'accès VPN et l'accès à distance."
    6_prefix: "5.2.5.1"
    6_label: "Tous les accès par comptes d'applications et système et les privilèges d'accès associés sont examinés comme suit : Périodiquement, (à la fréquence définie dans l'analyse de risques ciblée de l'entité, qui est réalisée selon tous les éléments spécifiés dans l'exigence 12.3.1); L'accès à l'application ou au système reste approprié pour la fonction exécutée; Tout accès inapproprié est traité; La direction reconnaît que l'accès demeure approprié."
    6_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les attributions de privilèges de comptes d'applications et système sont vérifiées périodiquement par la direction comme étant correctes, et toute non-conformité est corrigée. \n\nℹ️ Notes D’applicabilité \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et les procédures afin de vérifier qu'elles définissent des processus pour examiner tous les comptes d'applications et système et les privilèges d'accès associés conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Examiner l'analyse de risques ciblée de l'entité pour la fréquence des examens périodiques des comptes d'applications et système, et des privilèges d'accès associés afin de vérifier que l'analyse de risques a été effectuée conformément à tous les éléments spécifiés dans l'exigence 12.3.1. \n\tc. Interroger le personnel responsable et examiner les résultats documentés des examens périodiques des comptes système et d'applications, et des privilèges associés afin de vérifier que les examens se déroulent conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n L'examen régulier des droits d'accès permet de détecter les droits d'accès excessifs restants après un changement de fonctions du système ou d'autres modifications de l'application ou du système. Si des droits excessifs ne sont pas supprimés lorsqu'ils ne sont plus nécessaires, ils peuvent être exploités par des utilisateurs malveillants pour un accès non autorisé."
    7_prefix: "5.2.6"
    7_label: "Tout accès utilisateur pour envoyer aux référentiels des requêtes de données de titulaires de cartes stockées est limité comme suit : Via des applications ou d'autres méthodes programmatiques, avec accès et actions autorisées en fonction des rôles d'utilisateur et des moindres privilèges; Seuls les administrateurs responsables peuvent accéder directement ou envoyer des requêtes aux référentiels de CHD stockés."
    7_desc: "ℹ️ Objectif de L’approche Personnalisée \n L'accès direct aux requêtes non filtrées (ad hoc) aux référentiels de données des titulaires de cartes est interdit, à moins qu'il ne soit effectué par un administrateur autorisé. \n\nℹ️ Notes D’applicabilité \n Cette exigence s'applique aux mesures de sécurité d'accès des utilisateurs aux référentiels de requêtes de données de titulaires de cartes stockées. \n Voir les exigences 7.2.5 et 7.2.5.1 et 8.6.1 à 8.6.3 pour les mesures de sécurité des comptes d'application et système. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et les procédures et interroger le personnel afin de vérifier que les processus sont définis pour accorder aux utilisateurs l'accès aux référentiels de requêtes des données stockées des titulaires de cartes, conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Examiner les paramètres de configuration pour envoyer des requêtes aux référentiels de données de titulaires de cartes stockées afin de vérifier qu'ils sont conformes à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n L'utilisation abusive de l'accès par requête aux référentiels de données des titulaires de cartes a été une cause régulière de violations de données. La restriction d'un tel accès aux administrateurs réduit le risque qu'un tel accès soit mal utilisé par des utilisateurs non autorisés. \n\n Bonne Pratique \n Les actions utilisateur typiques incluent le déplacement, la copie et la suppression de données. Tenez également compte de l'étendue des privilèges nécessaires lors de l'octroi de l'accès. Par exemple, l'accès peut être accordé à des objets spécifiques tels que des éléments de données, des fichiers, des tables, des index, des vues et des routines stockées. L'octroi de l'accès aux référentiels de données des titulaires de cartes doit suivre le même processus que tous les autres accès accordés, ce qui signifie qu'il est basé sur des rôles, avec uniquement les privilèges attribués à chaque utilisateur, nécessaires pour exécuter ses fonctions. \n\n Définitions \n « Méthodes programmatiques » signifie accorder l'accès par des moyens tels que des procédures stockées dans la base de données qui permettent aux utilisateurs d'effectuer des actions contrôlées sur les données d'une table, plutôt que via un accès direct et non filtré au référentiel de données par les utilisateurs finaux (à l'exception du ou des administrateurs responsables), qui ont besoin d'un accès direct à la base de données pour leurs tâches administratives)."
  3:
    title: "L'accès aux composants et aux données système est géré via un ou plusieurs systèmes de contrôle d'accès."
    1_label: "Un ou plusieurs systèmes de contrôle d'accès sont en place qui limitent l'accès en fonction du besoin d’en connaître de l'utilisateur et couvrent tous les composants système."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les droits d'accès et les privilèges sont gérés via des mécanismes prévus à cet effet. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation du fournisseur et les paramètres système afin de vérifier que l'accès est géré pour chaque composant système via un ou plusieurs systèmes de contrôle d'accès qui limitent l'accès en fonction du besoin d’en connaître de l'utilisateur et couvrent tous les composants système. \n\nℹ️ Directives \n Objectif \n Sans mécanisme pour restreindre l'accès en fonction du besoin d’en connaître de l'utilisateur, un utilisateur peut sans le savoir se voir accorder l'accès aux données des titulaires de cartes. Les systèmes de contrôle d'accès automatisent le processus de restriction d'accès et d'attribution de privilèges."
    2_label: "Le ou les systèmes de contrôle d'accès sont configurés pour appliquer les autorisations attribuées aux personnes, aux applications et aux systèmes sur la base de la classification et la fonction des tâches."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les droits d'accès et les privilèges individuels de compte aux systèmes, applications et données ne sont hérités que de l'appartenance à un groupe. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation du fournisseur et les paramètres système afin de vérifier que le ou les systèmes de contrôle d'accès sont configurés pour appliquer les autorisations attribuées aux personnes, aux applications et aux systèmes sur la base de la classification et de la fonction des tâches. \n\nℹ️ Directives \n Objectif \n Restreindre l'accès privilégié à l'aide d'un système de contrôle d'accès réduit le risque d'erreurs dans l'attribution des autorisations aux personnes, aux applications et aux systèmes."
    3_label: "Le ou les systèmes de contrôle d'accès sont définis par défaut pour « refuser tout le monde »."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les droits d'accès et les privilèges sont interdits, sauf autorisation expresse. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation du fournisseur et les paramètres système afin de vérifier que le ou les systèmes de contrôle d'accès sont configurés par défaut pour « refuser tout le monde ». \n\nℹ️ Directives \n Objectif \n Un paramètre par défaut « refuser tout le monde » garantit que personne n'est autorisé à l'accès à moins qu'une règle ne soit établie pour accorder spécifiquement un tel accès. \n\n Bonne Pratique \n Il est important de vérifier la configuration par défaut des systèmes de contrôle d'accès, car certains sont définis par défaut pour « autoriser tout le monde », permettant ainsi l'accès à moins ou jusqu'à ce qu'une règle soit écrite pour le refuser spécifiquement."
8:
  prefix: "Exigence 8"
  title: "Identifier les Utilisateurs et Authentifier L'accès aux Composants Système"
  desc: "Les deux principes fondamentaux de l’identification et de l’authentification sont 1) établir l'identité d'une personne ou d'un processus sur un système informatique, et 2) prouver ou vérifier que l'utilisateur associé à l'identité est bien celui qu’il prétend être. \n\n L'identification d'un utilisateur ou d'un processus sur un système informatique est effectué en attribuant un identifiant à une personne (identifiant d’utilisateur) ou à un processus (identifiant système, identifiant d’application) t. Ces identifiants (également appelés « comptes ») établissent fondamentalement l'identité d'une personne ou d'un processus en attribuant un identifiant unique à chaque personne ou processus afin de distinguer un utilisateur ou un processus d'un autre. Lorsque chaque utilisateur ou processus peut être identifié de manière unique, la responsabilité des actions effectuées par cette identité est garantie. Lorsqu'une telle audibilité est en place, les actions effectuées peuvent être attribuées aux utilisateurs et processus connus et autorisés. \n\n L'élément utilisé pour prouver ou vérifier l'identité est appelé facteur d'authentification. Les facteurs d'authentification sont 1) quelque chose que vous connaissez, tel qu'un mot de passe ou une phrase secrète ; 2) quelque chose que vous possédez, tel qu'un token physique d’authentification ou une carte à point ; ou 3) quelque chose que vous êtes, tel qu'une caractéristique biométrique. \n\n L'identifiant et le facteur d'authentification sont considérés ensemble comme des informations d'authentification et sont utilisés pour accéder aux droits et privilèges associés à un utilisateur, une application, un système ou des comptes de service. \n\n Ces exigences en matière d'identité et d'authentification sont basées sur les principes de sécurité acceptés par l'industrie et les meilleures pratiques pour soutenir l'écosystème de paiement. Le document NIST Special Publication 800-63, « Directives sur l'identité numérique », fournit des lignes directrices relatives à l'identité numérique et aux facteurs d'authentification. Il est important de noter que les directives du NIST sur l'identité numérique sont destinées aux agences fédérales américaines et doivent être consultées dans leur intégralité. Bon nombre des concepts et des approches définis dans ces directives sont censés fonctionner les uns avec les autres et non comme des paramètres autonomes. \n\n⚠️ Remarque \n Sauf indication contraire dans l'exigence, ces exigences s'appliquent à tous les comptes sur tous les composants système, y compris, sans toutefois s'y limiter : \n\t- Comptes de points de vente \n\t- Comptes avec des droits administrateurs \n\t- Comptes système et applicatifs \n\t- Tous les comptes utilisés pour afficher ou accéder aux données des titulaires de cartes ou pour accéder à des systèmes avec les données des titulaires de cartes. Cela inclut les comptes utilisés par les employés, les sous-traitants, les consultants, les fournisseurs internes et externes et les autres tiers (par exemple, ceux qui fournissent des services d'assistance ou de maintenance). Certaines exigences ne sont pas destinées à s'appliquer aux comptes utilisateurs n'ayant accès qu'à un seul numéro de carte à la fois afin d’effectuer la transaction (comme les identifiants utilisés par le personnel de caisse sur les terminaux de point de vente). Lorsque des éléments ne s'appliquent pas, ils sont notés directement dans l'exigence spécifique. \n\n Ces exigences ne s'appliquent pas aux comptes utilisés par des consommateurs (titulaires de cartes). \n\n Se reporter à l'Annexe G pour les définitions des termes du standard PCI DSS."
  1:
    title: "Les processus et mécanismes d'identification des utilisateurs et d'authentification des accès aux composants système sont définis et compris."
    1_label: "Toutes les politiques de sécurité et procédures opérationnelles identifiées dans l'exigence 8 sont : Documentées; Tenues à jour; Utilisées; Connues de toutes les parties concernées."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les attentes, les mesures de sécurité et la surveillance des activités relatives à l'exigence 8 sont définis et respectés par le personnel concerné. Toutes les activités de soutien sont reproductibles, appliquées de manière cohérente et conformes à l'intention de la direction. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation et interroger le personnel pour vérifier que les politiques de sécurité et les procédures opérationnelles identifiées dans l'exigence 8 sont gérées conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n L'exigence 8.1.1 concerne la gestion et le maintien de manière efficace des diverses politiques et procédures spécifiées dans l'exigence 8. S'il est important de définir les politiques ou procédures spécifiques décrites dans l'exigence 8, il est tout aussi important de s'assurer qu'elles sont correctement documentées, maintenues et diffusées. \n\n Bonne Pratique \n Il est important de mettre à jour les politiques et les procédures au besoin pour être alignés avec les changements dans les processus, les technologies et les objectifs métiers. Pour cette raison, envisager de mettre à jour ces documents au fil de l’eau et pas seulement sur un cycle périodique. \n\n Définitions \n Les politiques de sécurité définissent les objectifs et les principes de sécurité de l'entité. Les procédures opérationnelles décrivent la façon d'exécuter les activités et définissent les mesures de sécurité, les méthodes et les processus qui sont suivis pour atteindre le résultat escompté de manière cohérente et conformément aux objectifs de la politique."
    2_label: "Les rôles et les responsabilités liées aux activités de l'exigence 8 sont documentés, attribués et compris."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les responsabilités quotidiennes liées à toutes les activités de l'exigence 8 sont attribuées. Le personnel est responsable du bon fonctionnement continu desdites exigences. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation pour vérifier que les descriptions des rôles et des responsabilités liées aux activités de l'exigence 8 sont documentées et attribuées. \n\tb. Interroger le personnel chargé d'effectuer les activités de l'exigence 8 afin de vérifier que les rôles et les responsabilités sont assignés comme documentés et qu’ils sont compris. \n\nℹ️ Directives \n Objectif \n Si les rôles et les responsabilités ne sont pas formellement attribués, le personnel pourrait ne pas être conscient de ses responsabilités quotidiennes et des activités critiques pourraient ne pas être effectuées. \n\n Bonne Pratique \n Les rôles et les responsabilités peuvent être documentés dans des politiques et procédures, ou conservés dans des documents distincts. \n Dans le cadre de la communication des rôles et des responsabilités, les entités peuvent envisager de demander au personnel de reconnaître leur acceptation et leur compréhension des rôles et responsabilités qui leur sont attribués. \n\n Exemples \n Une méthode possible pour documenter les rôles et les obligations est la matrice d'attribution des responsabilités qui indique qui est responsable, redevable, consulté et informé (également appelée matrice RACI)."
  2:
    title: "L'identification des utilisateurs et les comptes associés pour les utilisateurs et les administrateurs sont strictement gérés tout au long du cycle de vie d'un compte."
    1_label: "Tous les utilisateurs reçoivent un identifiant unique avant d’être autorisé à accéder aux composants système ou aux données des titulaires de cartes."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Toutes les actions de tous les utilisateurs sont attribuables à une personne. \n\nℹ️ Notes D’applicabilité \n Cette exigence n’est pas destinée à s'appliquer aux comptes utilisateur dans les terminaux de points de vente n’ayant accès qu'à un seul numéro de carte à la fois afin d’effectuer la transaction (comme les identifiants utilisés par le personnel de caisse sur les terminaux de point de vente). \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Interroger le personnel responsable afin de vérifier que tous les utilisateurs disposent d'un identifiant unique pour accéder aux composants système et aux données des titulaires de cartes. \n\tb. Examiner les journaux d'audit et d'autres preuves pour vérifier que l'accès aux composants système et aux données des titulaires de cartes peut être identifié de manière unique et associé à des personnes. \n\nℹ️ Directives \n Objectif \n La capacité d’attribuer les actions effectuées sur un système informatique à une personne garantit la responsabilité et la traçabilité, et est fondamentale pour implémenter des mesures de sécurité d'accès efficaces. \n En s'assurant que chaque utilisateur est identifié de manière unique, plutôt que d'utiliser un identifiant partagé entre plusieurs employés, une entreprise peut conserver la responsabilité individuelle des actions et un enregistrement efficace dans le journal d'audit par employé. En outre, cela aidera à résoudre et à contenir des problèmes en cas d'utilisation abusive ou d'intention malveillante."
    2_label: "Les comptes de groupe, partagés ou génériques, ou d'autres identifiants d'authentification partagés ne sont utilisés que lorsque cela est nécessaire, à titre exceptionnel, et sont gérés comme suit : L'utilisation du compte est interdite à moins que cela ne soit nécessaire dans des circonstances exceptionnelles; L'utilisation est limitée au temps nécessaire à la circonstance exceptionnelle; La justification métier de l’utilisation est documentée; L'utilisation est explicitement approuvée par la direction; L'identité de l'utilisateur est confirmée avant que l'accès au compte ne soit accordé; Chaque action effectuée est attribuable à un utilisateur."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Toutes les actions effectuées par les utilisateurs avec des identifiants génériques, système ou partagés sont attribuables à une personne individuelle. \n\nℹ️ Notes D’applicabilité \n Cette exigence n’est pas destinée à s'appliquer aux comptes utilisateur dans les terminaux de points de vente n’ayant accès qu'à un seul numéro de carte à la fois afin d’effectuer la transaction (comme les identifiants utilisés par les caissiers sur les terminaux de point de vente). \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les listes de comptes d'utilisateurs sur les composants système et la documentation applicable afin de vérifier que les identifiants d'authentification partagés ne sont utilisés que lorsque cela est nécessaire, à titre exceptionnel, et sont gérés conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Examiner les politiques et procédures d'authentification afin de vérifier que les processus relatifs aux identifiants d'authentification partagés sont définis de sorte qu'ils ne soient utilisés que lorsque cela est nécessaire, à titre exceptionnel, et gérés conformément à tous les éléments spécifiés dans cette exigence. \n\tc. Interroger les administrateurs système afin de vérifier que les identifiants d'authentification partagés ne sont utilisés que lorsque cela est nécessaire, à titre exceptionnel, et sont gérés conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Les comptes de groupe, partagés ou génériques (ou par défaut) sont généralement fournis avec des logiciels ou des systèmes d'exploitation, par exemple, root ou avec des privilèges associés à une fonction spécifique, telle qu'un administrateur. \n Si plusieurs utilisateurs partagent les mêmes informations d'authentification (par exemple, compte d'utilisateur et mot de passe), il devient impossible de retracer l'accès au système et les activités d'une personne. Cela empêche une entité d'attribuer la responsabilité ou d'avoir une journalisation efficace des actions d'une personne, car une action effectuée aurait pu être effectuée par toute personne du groupe connaissant l'identifiant utilisateur et les facteurs d'authentification associés. \n La possibilité d'attribuer des personnes aux actions effectuées avec un compte est essentielle pour garantir une responsabilité individuelle et une traçabilité (qui a effectué telle action, quelle action a été effectuée et quand cette action a été effectuée). \n\n Bonne Pratique \n Si des comptes partagés sont utilisés pour une raison quelconque, des mesures de sécurité de gestion robustes doivent être mis en place afin de maintenir la responsabilité individuelle et la traçabilité. \n\n Exemples \n Des outils et des techniques peuvent faciliter à la fois la gestion et la sécurité de ces types de comptes et confirmer l'identité de l'utilisateur avant que l'accès au compte ne soit accordé. Les entités peuvent envisager des coffres de mots de passe ou d'autres mesures de sécurité gérée par le système, tels que la commande sudo. \n Exemple de circonstance exceptionnelle : utilisation d’un compte de secours partagé lorsque toutes les autres méthodes d'authentification ont échoué pour une utilisation d'urgence ou un accès administrateur « break glass »."
    3_label: "Exigences supplémentaires pour les prestataires de services uniquement : Les prestataires de services accédant à distance à l’environnement des clients utilisent des facteurs d'authentification différents pour chaque consommateur."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les « credentials » d'un prestataire de services utilisés pour un consommateur ne peuvent pas être utilisées pour un autre consommateur. \n\nℹ️ Notes D’applicabilité \n Cette exigence ne s'applique que lorsque l'entité évaluée est un prestataire de services. \n Cette exigence n'est pas destinée à s'appliquer aux prestataires de services accédant à leurs propres environnements de services partagés, dans lesquels plusieurs environnements clients sont hébergés. \n Si les employés du prestataire de services utilisent des facteurs d'authentification partagés pour accéder à distance à l’environnement des clients, ces facteurs doivent être différents pour chaque client et gérés conformément à l'exigence 8.2.2. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Procédure de test supplémentaire pour les évaluations des prestataires de services uniquement : Examiner les politiques et procédures d'authentification et interroger le personnel afin de vérifier que les prestataires de services accédant à distance à l’environnement des clients utilisent des facteurs d'authentification différent par consommateur. \n\nℹ️ Directives \n Objectif \n Les prestataires de services disposant d'un accès à distance à l‘environnement des clients utilisent généralement cet accès pour prendre en charge les systèmes de POS POI ou fournir d'autres services à distance. \n Si un prestataire de services utilise les mêmes facteurs d'authentification pour accéder à plusieurs clients, tous les clients du prestataire de services peuvent facilement être compromis si un attaquant compromet ce facteur. \n Les criminels le savent et ciblent délibérément les prestataires de services à la recherche d'un facteur d'authentification partagé qui leur donne un accès à distance à de nombreux commerçants via ce seul facteur. \n\n Exemples \n Des technologies comme l‘authentification multifacteur qui fournissent une information d’authentification différente à chaque connexion (tel qu'un mot de passe à usage unique) pourraient également répondre à l'objectif de la présente exigence."
    4_label: "L'ajout, la suppression et la modification des identifiants utilisateur, des facteurs d'authentification et d'autres objets identifiants sont gérés comme suit : Autorisés avec l'approbation appropriée; Mis en œuvre avec uniquement les privilèges spécifiés sur l'approbation documentée."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les événements de cycle de vie pour les identifiants utilisateur et les facteurs d'authentification ne peuvent pas se produire sans autorisation appropriée. \n\nℹ️ Notes D’applicabilité \n Cette exigence s'applique à tous les comptes utilisateur, y compris les employés, les soustraitants, les consultants, les intérimaires et les fournisseurs tiers. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les autorisations documentées à travers les différentes phases du cycle de vie du compte (ajouts, modifications et suppressions) et examiner les paramètres système afin de vérifier que l'activité a été gérée conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Il est impératif que le cycle de vie d'un identifiant d'utilisateur (ajouts, suppressions et modifications) soit contrôlé afin que seuls les comptes autorisés puissent exécuter des actions, que les actions soient auditables et que les privilèges soient limités à ce qui est requis. \n Les attaquants compromettent souvent un compte existant, puis élèvent les privilèges du compte pour effectuer des actes non autorisés, ou ils peuvent créer de nouveaux identifiants pour poursuivre leur activité en arrière-plan. Il est essentiel de détecter et de réagir lorsque des comptes d'utilisateurs sont créés ou modifiés en dehors du processus de modification normal ou sans autorisation."
    5_label: "L'accès des utilisateurs dont le contrat a été résilié est immédiatement révoqué."
    5_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les comptes des utilisateurs dont le contrat a été résilié ne peuvent pas être utilisés. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les sources d'informations pour les utilisateurs dont le contrat a été résilié et examiner les listes d'accès des utilisateurs actuels (pour l'accès local et distant) afin de vérifier que les identifiants des utilisateurs dont le contrat a été résilié ont été désactivés ou supprimés des listes d'accès. \n\tb. Interroger le personnel responsable pour vérifier que tous les facteurs d'authentification physiques, tels que les cartes à puce, les jetons, etc., ont été renvoyés ou désactivés pour les utilisateurs dont le contrat a été résilié. \n\nℹ️ Directives \n Objectif \n Si un employé ou un tiers/fournisseur a quitté l'entreprise et a toujours accès au réseau via son compte utilisateur, un acte malveillant relatif aux données des titulaires de cartes pourrait se produire, soit par l'ancien employé, soit par un utilisateur malveillant."
    6_label: "Les comptes utilisateur inactifs depuis 90 jours sont supprimés ou désactivés."
    6_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les comptes utilisateurs inactifs ne peuvent pas être utilisés. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les comptes utilisateur et les informations de dernière connexion, et interroger le personnel afin de vérifier que tous les comptes utilisateur inactifs depuis 90 jours sont supprimés ou désactivés. \n\nℹ️ Directives \n Objectif \n Les comptes qui ne sont pas utilisés régulièrement sont souvent la cible d'attaques, car il est moins probable que des modifications, telles qu'un changement de mot de passe, soient remarquées. Ainsi, ces comptes peuvent être plus facilement exploités et utilisés pour accéder aux données des titulaires de cartes. \n\n Bonne Pratique \n Lorsqu'il peut être raisonnablement prévu qu'un compte ne sera pas utilisé pendant une période prolongée, comme un congé prolongé, le compte doit être désactivé dès le début du congé, plutôt que d'attendre les 90 jours."
    7_label: "Les comptes utilisés par les tiers pour accéder, prendre en charge ou maintenir les composants système via un accès à distance sont gérés comme suit : Activés uniquement pendant la période d’intervention et désactivés en dehors de la période; L'utilisation est surveillée pour détecter toute activité inhabituelle."
    7_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les accès à distance utilisés par les tiers ne peuvent pas être utilisés, sauf lorsque cela est spécifiquement autorisé et que l'utilisation est supervisée par la direction. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Interroger le personnel, examiner la documentation relative à la gestion des comptes, et examiner les preuves afin de vérifier que les comptes d'accès à distance utilisés par les tiers sont gérés conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Permettre à des tiers d'avoir un accès 24 heures sur 24 et 7 jours sur 7 aux systèmes et aux réseaux d'une entité en cas d’assistance augmente les chances d'accès non autorisé. Cet accès pourrait se traduire par un utilisateur non autorisé dans l'environnement du tiers ou une personne malveillante utilisant le point d'entrée externe toujours disponible dans le réseau d'une entité. Lorsque des tiers ont besoin d'un accès 24 heures sur 24, 7 jours sur 7, cela doit être documenté, justifié, surveillé et lié à des besoins spécifiques. \n\n Bonne Pratique \n Activer l'accès uniquement pendant les périodes d’intervention et le désactiver dès que cela n'est plus nécessaire permet d'éviter une mauvaise utilisation de ces connexions. En outre, il est conseillé d'attribuer à des tiers une date de début et de fin d'accès conformément à leur contrat de service. \n La surveillance de l'accès des tiers permet de s'assurer qu’ils n'accèdent qu'aux systèmes nécessaires et uniquement pendant les périodes approuvées. Toute activité inhabituelle utilisant des comptes tiers devrait être suivie jusqu'à sa résolution."
    8_label: "Si une session utilisateur est inactive pendant plus de 15 minutes, l'utilisateur doit s'authentifier à nouveau pour réactiver le terminal ou la session."
    8_desc: "ℹ️ Objectif de L’approche Personnalisée \n Une session utilisateur ne peut être utilisée que par l'utilisateur autorisé. \n\nℹ️ Notes D’applicabilité \n Cette exigence n’est pas destinée à s'appliquer aux comptes utilisateur dans les terminaux de points de vente qui n'ont accès qu'à un seul numéro de carte à la fois afin de permettre la transaction (comme les identifiants utilisés par le personnel de caisse sur les terminaux de point de vente). \n Cette exigence n'est pas destinée à empêcher l'exécution d'activités légitimes lorsque la console ou l'ordinateur est sans surveillance. \n\nℹ️ Procédures de Test de L’approche Définie \n \t-  Examiner les paramètres de configuration du système afin de vérifier que les délais d'inactivité du système ou de la session pour les sessions utilisateur ont été définis sur 15 minutes maximum. \n\nℹ️ Directives \n Objectif \n Lorsque les utilisateurs ne verrouillent pas leur session et qu’ils s’éloignent de leur machine donnant un accès aux composants système ou aux données des titulaires de cartes, il existe un risque que la machine soit utilisée par d'autres en l'absence de l'utilisateur, entraînant un accès non autorisé au compte et/ou une mauvaise utilisation. \n\n Bonne Pratique \n La réauthentification peut être appliquée soit au niveau du système pour protéger toutes les sessions ouvertes sur cette machine, soit au niveau de l'application. \n Les entités peuvent également envisager de mettre en place des mesures de sécurité en cascade afin de restreindre davantage l'accès à une session sans surveillance au fur et à mesure que le temps passe. Par exemple, l'économiseur d'écran peut s'activer au bout de 15 minutes et déconnecter l'utilisateur au bout d’une heure. \n Cependant, les mesures de sécurité de timeout doivent tenir compte du risque d'accès et d'exposition, ainsi que l’impact sur l'utilisateur et le but de l'accès. \n Si un utilisateur doit exécuter un programme à partir d'un ordinateur sans surveillance, il peut se connecter à l'ordinateur pour exécuter le programme, puis verrouillera session afin que personne d'autre ne puisse utiliser la session de l'utilisateur. \n\n Exemples \n Une façon de répondre à cette exigence consiste à configurer un économiseur d'écran automatisé pour qu'il se lance chaque fois que la console est inactive pendant 15 minutes et oblige l'utilisateur connecté à saisir son mot de passe pour déverrouiller l'écran."
  3:
    title: "L’authentification forte des utilisateurs et des administrateurs est implémentée et gérée."
    1_label: "Tous les accès utilisateur et administrateurs aux composants système sont authentifiés via au moins l'un des facteurs d'authentification suivants : Quelque chose que vous connaissez, comme un mot de passe ou une phrase secrète; Quelque chose que vous possédez, comme un jeton d’authentification ou une carte à puce; Quelque chose que vous êtes, comme un élément biométrique."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Un compte ne peut pas être accessible sauf avec une combinaison d'identité d'utilisateur et d'un facteur d'authentification. \n\nℹ️ Notes D’applicabilité \n Cette exigence n’est pas destinée à s'appliquer aux comptes utilisateur dans les terminaux de points de vente qui n'ont accès qu'à un seul numéro de carte à la fois afin de permettre la transaction (comme les identifiants utilisés par le personnel de caisse sur les terminaux de point de vente). \n Cette exigence ne remplace pas les exigences d'authentification multifacteur (MFA), mais s'applique aux systèmes du périmètre qui ne sont pas soumis aux exigences du MFA. \n Un certificat numérique est une option valide pour « quelque chose que vous possédez » s'il est unique pour un utilisateur particulier. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation décrivant le ou les facteurs d'authentification utilisés afin de vérifier que l'accès des utilisateurs aux composants système est authentifié via au moins un facteur d'authentification spécifié dans cette exigence. \n\tb. Pour chaque type de facteur d'authentification utilisé avec chaque type de composant système, observer une authentification afin de vérifier que l'authentification fonctionne conformément avec le ou les facteurs d'authentification documentés. \n\nℹ️ Directives \n Objectif \n Lorsqu'un facteur d’authentification est utilisé en complément d'identifiants uniques, un facteur d'authentification contribue à protéger les identifiants des utilisateurs contre la compromission, car l'attaquant doit connaître l'identifiant unique et compromettre le ou les facteurs d'authentification associés. \n\n Bonne Pratique \n Une approche commune pour une personne malveillante de compromette un système consiste à exploiter des facteurs d'authentification faibles ou inexistants (par exemple, des mots de passe/phrases secrètes). Exiger des facteurs d'authentification forts permet de se protéger contre cette attaque. \n\n Informations Complémentaires \n Consulter fidoalliance.org pour plus d'informations sur l'utilisation de jetons, de cartes à point ou de données biométriques comme facteurs d'authentification."
    2_label: "Une cryptographie robuste est utilisée pour rendre tous les facteurs d'authentification illisibles pendant la transmission et le stockage sur tous les composants système."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les facteurs d'authentification en clair ne peuvent pas être obtenus, dérivés ou réutilisés à partir de l'interception de communications ou de données stockées. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation du fournisseur et les paramètres de configuration du système afin de vérifier que les facteurs d'authentification sont rendus illisibles grâce à une cryptographie robuste pendant la transmission et le stockage. \n\tb. Examiner les référentiels de facteurs d'authentification afin de vérifier qu'ils sont illisibles pendant le stockage. \n\tc. Examiner les données transmises afin de vérifier que les facteurs d'authentification sont illisibles pendant la transmission. \n\nℹ️ Directives \n Objectif \n Il est connu que les périphériques réseau et les applications transmettent des facteurs d'authentification non chiffrés et lisibles (tels que des mots de passe et des phrases secrètes) sur le réseau et/ou stockent ces valeurs sans chiffrement. En conséquence, une personne malveillante peut facilement intercepter ces informations lors de la transmission à l'aide d'un « renifleur » ou accéder directement aux facteurs d'authentification non chiffrés dans les fichiers où elles sont stockées, puis utiliser ces données pour obtenir un accès non autorisé."
    3_label: "L'identité de l'utilisateur est vérifiée avant de modifier tout facteur d'authentification."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les personnes non autorisées ne peuvent pas accéder au système en usurpant l'identité d'un utilisateur autorisé. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les procédures de modification des facteurs d'authentification et observer le personnel de sécurité afin de vérifier que l’identité de l’utilisateur est bien vérifiée lorsqu’il demande la modification d’un facteur d’authentification. \n\nℹ️ Directives \n Objectif \n Les personnes malveillantes utilisent des techniques d’« ingénierie sociale » pour usurper l'identité de l'utilisateur d'un système ; par exemple en appelant un service d'assistance et en agissant en tant qu'utilisateur légitime, afin de modifier un facteur d'authentification afin qu'elles puissent utiliser un identifiant d'utilisateur valide. \n Exiger un contrôle positif de l’identité d'un utilisateur réduit la probabilité de survenue de ce type d'attaque. \n\n Bonne Pratique \n Les modifications apportées aux facteurs d'authentification pour lesquels l'identité de l'utilisateur doit être vérifiée incluent, sans toutefois s'y limiter, la réinitialisation de mot de passe, l'approvisionnement de nouveaux jetons matériels ou logiciels et la génération de nouvelles clés. \n\n Exemples \n Les méthodes pour vérifier l'identité d'un utilisateur comprennent une question/réponse secrète, des informations basées sur les connaissances et le rappel de l'utilisateur à un numéro de téléphone connu et préalablement défini."
    4_label: "Les tentatives d'authentification infructueuses sont limitées par : Le verrouillage de l'identifiant utilisateur après 10 tentatives échouées maximum; Le réglage de la durée de verrouillage à 30 minutes minimum ou jusqu'à la confirmation de l'identité de l'utilisateur."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Un facteur d'authentification ne peut pas être deviné par force brute dans une attaque en ligne. \n\nℹ️ Notes D’applicabilité \n Cette exigence n’est pas destinée à s'appliquer aux comptes utilisateur dans les terminaux de points de vente n’ayant accès qu'à un seul numéro de carte à la fois afin de permettre la transaction (comme les identifiants utilisés par les caissiers sur les terminaux de point de vente). \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les paramètres de configuration du système afin de vérifier que les paramètres d'authentification sont définis pour exiger le verrouillage des comptes utilisateur après 10 tentatives de connexion échouées maximum. \n\tb. Examiner les paramètres de configuration du système afin de vérifier que les paramètres de mot de passe sont définis pour exiger qu'une fois le compte utilisateur verrouillé, il le reste pendant au moins 30 minutes ou jusqu'à ce que l'identité de l'utilisateur soit confirmée. \n\nℹ️ Directives \n Objectif \n Sans mécanismes de verrouillage de compte en place, un attaquant peut continuellement essayer de deviner un mot de passe à l'aide d'outils manuels ou automatisés (par exemple, le craquage de mot de passe) jusqu'à ce que l'attaquant réussisse et accède au compte d'un utilisateur. \n Si un compte est verrouillé parce que quelqu'un essaie continuellement de deviner un mot de passe, les mesures de sécurité visant à retarder la réactivation du compte verrouillé empêchent la personne malveillante de deviner le mot de passe, car elle devra attendre au moins 30 minutes que le compte soit réactivé. \n\n Bonne Pratique \n Avant de réactiver un compte verrouillé, l'identité de l'utilisateur doit être confirmée. Par exemple, l'administrateur ou le service d'assistance peut s’assurer que la réactivation du compte est bien effectuée par le propriétaire réel du compte, ou il peut exister des mécanismes de réinitialisation de mot de passe en libre-service que le propriétaire du compte utilise pour vérifier son identité."
    5_label: "Si des mots de passe/phrases secrètes sont utilisés comme facteurs d'authentification pour répondre à l'exigence 8.3.1, ils sont définis et réinitialisés pour chaque utilisateur comme suit : Définis sur une valeur unique pour chaque première utilisation et lors de la réinitialisation; Doivent être modifiés immédiatement après la première utilisation."
    5_desc: "ℹ️ Objectif de L’approche Personnalisée \n Un mot de passe/phrase secrète initial ou réinitialisé attribué à un utilisateur ne peut pas être utilisé par un utilisateur non autorisé. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les procédures de définition et de réinitialisation des mots de passe/phrases secrètes (s'ils sont utilisés comme facteurs d'authentification pour répondre à l'exigence 8.3.1) et observer le personnel de sécurité afin de vérifier que les mots de passe/phrases secrètes sont définis et réinitialisés conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Si le même mot de passe/phrase secrète est utilisé pour chaque nouvel utilisateur, un utilisateur interne, un ancien employé ou une personne malveillante pourrait le connaître ou le découvrir facilement et l'utiliser pour accéder aux comptes avant que l'utilisateur autorisé ne puisse l’utiliser."
    6_label: "Si des mots de passe/phrases secrètes sont utilisés comme facteurs d'authentification pour répondre à l'exigence 8.3.1, ils doivent répondre au niveau de complexité minimum suivant : Une longueur minimale de 12 caractères (ou 8 caractères si le système ne prend pas en charge les 12 caractères); Contenir à la fois des caractères numériques et alphabétiques."
    6_desc: "ℹ️ Objectif de L’approche Personnalisée \n Un mot de passe/phrase secrète deviné ne peut pas être vérifié par une attaque par force brute en ligne ou hors ligne. \n\nℹ️ Notes D’applicabilité \n Cette exigence n'est pas destinée à s'appliquer : \n\t- Aux comptes d'utilisateurs dans les terminaux de points de vente n’ayant accès qu'à un seul numéro de carte à la fois afin de permettre la transaction (comme les identifiants utilisés par les caissiers sur les terminaux de point de vente). \n\t- Aux comptes d'applications ou système, qui sont régis par les exigences de la section 8.6. Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. Jusqu'au 31 mars 2025, les mots de passe doivent avoir une longueur minimale de 7 caractères conformément à l'exigence 8.2.3 du standard PCI DSSv3.2.1. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les paramètres de configuration du système afin de vérifier que les paramètres de complexité du mot de passe/de la phrase secrète de l'utilisateur sont définis conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Des mots de passe/phrases secrètes robustes peuvent être la première ligne de défense d'un réseau, car une personne malveillante essaiera souvent en premier lieu de trouver des comptes avec des mots de passe faibles, statiques ou inexistants. Si les mots de passe sont courts ou facilement devinables, il est relativement facile pour une personne malveillante de trouver ces comptes faibles et de compromettre un réseau sous l’identité de l’utilisateur valide \n\n Bonne Pratique \n La robustesse du mot de passe/de la phrase secrète dépend de la complexité, de la longueur et du caractère aléatoire du mot de passe/de la phrase secrète. Les mots de passe/phrases secrètes doivent être suffisamment complexes, de sorte qu'ils soient compliqués pour un attaquant de le deviner ou de le découvrir. Les entités peuvent envisager d'augmenter la complexité en exigeant l'utilisation de caractères spéciaux et de caractères majuscules et minuscules, en plus des éléments spécifiés dans cette exigence. Une complexité supplémentaire augmente le temps requis pour les attaques par force brute hors ligne des mots de passe/phrases secrètes hachés. \n Une autre option pour augmenter la résistance des mots de passe aux attaques par déduction consiste à comparer les mots de passe/phrases secrètes à une liste de mots de passe interdits et à demander aux utilisateurs de fournir de nouveaux mots de passe pour chaque mot de passe trouvé sur la liste."
    7_label: "Les utilisateurs ne sont pas autorisés à soumettre un nouveau mot de passe/phrase secrète correspondant à l’un des quatre derniers mots de passe/phrase secrètes utilisés."
    7_desc: "ℹ️ Objectif de L’approche Personnalisée \n Un mot de passe précédemment utilisé ne peut pas être utilisé pour accéder à un compte pendant au moins 12 mois. \n\nℹ️ Notes D’applicabilité \n Cette exigence n’est pas applicable pour les comptes configurés sur les terminaux de paiement ayant accès à un seul numéro de carte bancaire à la fois (comme les identifiants utilisés par les caissiers sur les terminaux de point de vente). \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les paramètres de configuration du système afin de vérifier que les paramètres de mot de passe sont définis pour exiger que les nouveaux mots de passe/phrases secrètes ne soient pas les mêmes que les quatre mots de passe/phrases secrètes précédemment utilisés. \n\nℹ️ Directives \n Objectif \n Si un historique des mots de passe n'est pas conservé, l'efficacité de la modification des mots de passe est réduite, car les mots de passe précédents peuvent être réutilisés éternellement. Exiger que les mots de passe ne puissent pas être réutilisés pendant une certaine période réduit la probabilité que les mots de passe qui ont été devinés ou cassés par force brute seront réutilisés à l'avenir. \n Les mots de passe ou les phrases secrètes peuvent avoir déjà été modifiés en raison d'un soupçon de compromission ou parce que le mot de passe ou la phrase secrète ont dépassé leur période d'utilisation effective, deux raisons pour lesquelles les mots de passe précédemment utilisés ne doivent pas être réutilisés."
    8_label: "Les politiques et procédures d'authentification sont documentées et communiquées à tous les utilisateurs, notamment : Des conseils sur le choix de facteurs d'authentification robustes; Des conseils sur la façon dont les utilisateurs doivent protéger leurs facteurs d'authentification; Des instructions pour ne pas réutiliser les mots de passe/phrases secrètes précédemment utilisés; Des instructions pour modifier les mots de passe/phrases secrètes en cas de soupçon ou en sachant que les mots de passe/phrases secrètes ont été compromis et comment signaler l'incident."
    8_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les utilisateurs connaissent l'utilisation correcte des facteurs d'authentification et peuvent accéder à une assistance et à des conseils en cas de besoin. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les procédures et interroger le personnel afin de vérifier que les politiques et procédures d'authentification sont distribuées à tous les utilisateurs. \n\tb. Examiner les politiques et procédures d'authentification qui sont distribuées aux utilisateurs et vérifier qu'elles incluent les éléments spécifiés dans cette exigence. \n\tc. Interroger les utilisateurs afin de vérifier qu'ils connaissent bien les politiques et procédures d'authentification. \n\nℹ️ Directives \n Objectif \n La communication des politiques et procédures d'authentification à tous les utilisateurs les aide à comprendre et à respecter les politiques. \n\n Bonne Pratique \n Des conseils sur le choix de mots de passe robustes peuvent inclure des suggestions pour aider le personnel à sélectionner des mots de passe difficiles à deviner qui ne contient pas de mots du dictionnaire ou d'informations sur l'utilisateur, telles que l'identité de l'utilisateur, les noms des membres de sa famille, sa date de naissance, etc. \n Des conseils pour protéger les facteurs d'authentification peuvent inclure de ne pas écrire les mots de passe ou les enregistrer dans des fichiers non sécurisés, et d'être attentif aux personnes malveillantes qui peuvent essayer d'exploiter leurs mots de passe (par exemple, en appelant un employé et en lui demandant son mot de passe en prétextant la résolution d’un problème). \n Alternativement, les entités peuvent mettre en œuvre des processus pour confirmer que les mots de passe respectent la politique relative aux mots de passe ; par exemple, en comparant les choix de mot de passe à une liste de mots de passe inacceptables et en demandant aux utilisateurs de choisir un nouveau mot de passe s’il fait partie de la liste. Demander aux utilisateurs de modifier leur mot de passe s'il y a une chance qu'il ne soit plus sûr, peut empêcher les utilisateurs malveillants d'utiliser un mot de passe légitime pour obtenir un accès non autorisé."
    9_label: "Si les mots de passe/phrases secrètes sont utilisés comme seul facteur d'authentification pour l'accès utilisateur (c'est-à-dire dans le cas d'authentification à un seul facteur), alors soit : Les mots de passe/phrases secrètes sont modifiés au moins une fois tous les 90 jours, OU La posture de sécurité des comptes est analysée de manière dynamique et l'accès aux ressources est réalisé en temps-réel et est déterminé automatiquement en conséquence."
    9_desc: "ℹ️ Objectif de L’approche Personnalisée \n Un mot de passe/phrase secrète compromis non détecté ne peut pas être utilisé indéfiniment. \n\nℹ️ Notes D’applicabilité \n Cette exigence s'applique aux composants système dans le périmètre qui ne sont pas dans le CDE, car ces composants ne sont pas soumis aux exigences de la MFA. Cette exigence n’est pas destinée à s'appliquer aux comptes d'utilisateurs dans les terminaux de points de vente qui n'ont accès qu'à un seul numéro de carte à la fois afin de faciliter une seule transaction (comme les identifiants utilisés par les caissiers sur les terminaux de point de vente). \n Cette exigence ne s'applique pas aux comptes clients des prestataires de services mais s'applique aux comptes du personnel des prestataires de services. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Si les mots de passe/phrases secrètes sont utilisés comme seul facteur d'authentification pour l'accès utilisateur, inspecter les paramètres de configuration du système afin de vérifier que les mots de passe/phrases secrètes sont gérés conformément à UN des éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n L'accès aux composants système dans le périmètre qui ne sont pas dans le CDE peut être fourni à l'aide d'un seul facteur d'authentification, tel qu'un mot de passe/une phrase secrète, un jeton ou une carte à puce, ou un attribut biométrique. Lorsque des mots de passe/phrases secrètes sont utilisés comme seul facteur d'authentification pour un tel accès, des mesures de sécurité supplémentaires sont nécessaires afin de protéger l'intégrité du mot de passe/de la phrase secrète. \n\n Bonne Pratique \n Les mots de passe/phrases secrètes valides pendant une longue période sans modification donnent aux personnes malveillantes plus de temps pour casser le mot de passe/la phrase secrète. La modification périodique des mots de passe offre moins de temps à une personne malveillante pour décrypter un mot de passe/une phrase secrète et moins de temps pour utiliser un mot de passe compromis. \n L'utilisation d'un mot de passe/phrase secrète comme seul facteur d'authentification fournit un point de défaillance unique en cas de compromission. Par conséquent, dans ces mises en œuvre, des mesures de sécurité sont nécessaires pour minimiser la durée pendant laquelle une activité malveillante pourrait se produire via un mot de passe/une phrase secrète compromis. \n L'analyse dynamique de l'état de sécurité d'un compte est une autre option qui permet une détection et une réponse plus rapides pour traiter les informations d'identification potentiellement compromises. \n Une telle analyse prend un certain nombre de points de données, qui peuvent inclure l'intégrité de l'appareil, l'emplacement, les heures d'accès et les ressources consultées pour déterminer en temps réel si un compte peut se voir accorder l'accès à une ressource demandée. \n De cette façon, l'accès peut être refusé et les comptes bloqués si l'on soupçonne que les informations d'authentification ont été compromises. \n\n Informations Complémentaires \n Pour plus d'informations sur l'utilisation de l'analyse dynamique pour gérer l'accès des utilisateurs aux ressources, voir NIST SP 800-207 Zero Trust Architecture."
    10_label: "Exigences supplémentaires pour les prestataires de services uniquement : Si des mots de passe/phrases secrètes sont utilisés comme seul facteur d'authentification pour l'accès des utilisateurs consommateur aux données des titulaires de cartes (c'est-à-dire dans toute mise en œuvre d'authentification à facteur unique), des conseils sont fournis aux utilisateurs clients, notamment : Des conseils aux clients pour modifier périodiquement leurs mots de passe/phrases secrète d'utilisateur; Des conseils sur quand et dans quelles circonstances les mots de passe/phrases secrètes sont modifiés."
    10_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les mots de passe/phrases secrètes pour les clients des prestataires de services ne peuvent pas être utilisés indéfiniment. \n\nℹ️ Notes D’applicabilité \n Cette exigence ne s'applique que lorsque l'entité audité est un prestataire de services. \n Cette exigence ne s'applique pas aux comptes des utilisateurs consommateur accédant à leurs propres informations de carte de paiement. \n Cette exigence pour les prestataires de services sera remplacée par l'exigence 8.3.10.1 une fois que 8.3.10.1 entrera en vigueur. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Procédure de test supplémentaire pour les évaluations des prestataires de services uniquement : Si des mots de passe/phrases secrètes sont utilisés comme seul facteur d'authentification pour l'accès des utilisateurs consommateur aux données des titulaires de cartes, examiner les instructions fournies aux utilisateurs consommateur afin de vérifier qu'elles incluent tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n L'utilisation d'un mot de passe/phrase secrète comme seul facteur d'authentification fournit un point de défaillance unique en cas de compromission. Par conséquent, dans ces mises en œuvre, des mesures de sécurité sont nécessaires pour minimiser la durée pendant laquelle une activité malveillante pourrait se produire via un mot de passe/une phrase secrète compromis. \n\n Bonne Pratique \n Les mots de passe/phrases secrètes valides pendant une longue période sans modification donnent aux personnes malveillantes plus de temps pour casser le mot de passe/la phrase secrète. La modification périodique des mots de passe offre moins de temps à une personne malveillante pour déchiffrer un mot de passe/une phrase secrète et moins de temps pour utiliser un mot de passe compromis."
    11_prefix: "8.3.10.1"
    11_label: "Exigences supplémentaires pour les prestataires de services uniquement : Si les mots de passe/phrases secrètes sont utilisés comme seul facteur d'authentification pour l'accès aux utilisateurs consommateur (c'est-à-dire dans toute mise en œuvre d'authentification à un seul facteur), alors soit : Les mots de passe/phrases secrètes sont modifiés au moins une fois tous les 90 jours, OU La posture de sécurité des comptes est analysée de manière dynamique et l'accès en temps réel aux ressources est automatiquement déterminé en conséquence."
    11_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les mots de passe/phrases secrètes pour les clients des prestataires de services ne peuvent pas être utilisés indéfiniment. \n\nℹ️ Notes D’applicabilité \n Cette exigence ne s'applique que lorsque l'entité audité est un prestataire de services. \n Cette exigence ne s'applique pas aux comptes des utilisateurs consommateur accédant à leurs propres informations de carte de paiement. \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n Jusqu'à ce que cette exigence entre en vigueur le 31 mars 2025, les prestataires de services peuvent satisfaire à l'exigence 8.3.10 ou 8.3.10.1. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures d'authentification afin de vérifier que les procédures d'utilisation des facteurs d'authentification tels que les tokens physiques, les cartes à point et les certificats sont définies et comportent tous les éléments spécifiés dans cette exigence. \n\tb. Interroger le personnel de sécurité afin de vérifier que les facteurs d'authentification sont attribués à un utilisateur individuel et ne sont pas partagés entre plusieurs utilisateurs. \n\tc. Examiner les paramètres de configuration du système et/ou observer les mesures de sécurité physiques, le cas échéant, afin de vérifier que les mesures de sécurité sont mises en œuvre pour garantir que seul l'utilisateur prévu peut utiliser ce facteur pour obtenir l'accès. \n\nℹ️ Directives \n Objectif \n Si plusieurs utilisateurs peuvent utiliser des facteurs d'authentification tels que des tokens physiques ou logiques, des cartes à point et des certificats, il peut être impossible d'identifier la personne à l'aide du mécanisme d'authentification. \n\n Bonne Pratique \n Le fait d'avoir des mesures de sécurité physiques et/ou logiques (par exemple, un code PIN, des données biométriques ou un mot de passe) pour authentifier de manière unique l'utilisateur du compte empêchera les utilisateurs non autorisés d'accéder au compte utilisateur via l'utilisation d'un facteur d'authentification partagé."
    12_prefix: "8.3.11"
    12_label: "Lorsque des facteurs d'authentification tels que des tokens physiques ou logiques, des cartes à point ou des certificats sont utilisés : Les facteurs sont attribués à un utilisateur individuel et ne sont pas partagés entre plusieurs utilisateurs; Les mesures physiques et/ou logiques garantissent que seul l'utilisateur prévu peut utiliser ce facteur pour obtenir l'accès."
    12_desc: "ℹ️ Objectif de L’approche Personnalisée \n Un facteur d'authentification ne peut être utilisé par personne d'autre que l'utilisateur auquel il est attribué. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures d'authentification afin de vérifier que les procédures d'utilisation des facteurs d'authentification tels que les tokens physiques, les cartes à point et les certificats sont définies et comportent tous les éléments spécifiés dans cette exigence. \n\tb. Interroger le personnel de sécurité afin de vérifier que les facteurs d'authentification sont attribués à un utilisateur individuel et ne sont pas partagés entre plusieurs utilisateurs. \n\tc. Examiner les paramètres de configuration du système et/ou observer les mesures de sécurité physiques, le cas échéant, afin de vérifier que les mesures de sécurité sont mises en œuvre pour garantir que seul l'utilisateur prévu peut utiliser ce facteur pour obtenir l'accès. \n\n \n Objectif \n Si plusieurs utilisateurs peuvent utiliser des facteurs d'authentification tels que des tokens physiques ou logiques, des cartes à point et des certificats, il peut être impossible d'identifier la personne à l'aide du mécanisme d'authentification. \n\n Bonne Pratique \n Le fait d'avoir des mesures de sécurité physiques et/ou logiques (par exemple, un code PIN, des données biométriques ou un mot de passe) pour authentifier de manière unique l'utilisateur du compte empêchera les utilisateurs non autorisés d'accéder au compte utilisateur via l'utilisation d'un facteur d'authentification partagé."
  4:
    title: "L'authentification multifacteur (MFA) est mise en œuvre pour sécuriser l'accès au CDE."
    1_label: "Le MFA est mis en œuvre pour tous les accès non-console dans le CDE pour le personnel avec des accès d’administration."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les accès d’administration au CDE ne peuvent pas être obtenus p en utilisant un seul facteur d'authentification. \n\nℹ️ Notes D’applicabilité \n L’exigence du MFA pour l'accès d’administration non-console s'applique à tout le personnel avec des privilèges élevés ou accrus accédant au CDE via une connexion non-console, c'est-à-dire via un accès logique survenant sur une interface réseau plutôt que via une connexion physique directe. \n L'authentification MFA est considérée comme une Bonne Pratique pour l'accès d’administration non-console aux composants systèmes situés dans le périmètre mais qui ne font pas partie du CDE. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les configurations réseau et/ou système afin de vérifier que l'authentification MFA est obligatoire pour toutes les opérations nonconsole dans le CDE pour le personnel disposant d'un accès d’administration. \n\tb. Observer les administrateurs se connecter au CDE et vérifier que l'authentification MFA est exigée \n\nℹ️ Directives \n Objectif \n Exiger plus d'un type de facteur d'authentification réduit la probabilité qu'un attaquant puisse accéder à un système en se faisant passer pour un utilisateur légitime, car l'attaquant devra pouvoir compromettre plusieurs facteurs d'authentification. Cela est particulièrement vrai dans les environnements où traditionnellement, le seul facteur d'authentification utilisé était quelque chose qu'un utilisateur connaît, tel qu'un mot de passe ou une phrase secrète. \n\n Définitions \n  L'utilisation d'un facteur d’authentification deux fois (par exemple, l'utilisation de deux mots de passe distincts) n'est pas considérée comme une authentification multifacteur."
    2_label: "L'authentification MFA est mise en œuvre pour tous les accès au CDE."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n L'accès au CDE ne peut pas être obtenu par l'utilisation d'un seul facteur d'authentification. \n\nℹ️ Notes D’applicabilité \n Cette exigence ne s'applique pas : \n\t- Aux comptes applicatifs ou système exécutant des fonctions automatisées. \n\t- Aux comptes utilisateur dans les terminaux de points de vente qui n'ont accès qu'à un seul numéro de carte à la fois afin d’effectuer une seule transaction (comme les identifiants utilisés par les caissiers sur les terminaux de point de vente). \n L'authentification MFA est requise pour les deux types d'accès spécifiés dans les exigences 8.4.2 et 8.4.3. Par conséquent, l'application du MFA à un type d'accès ne remplace pas la nécessité d'appliquer une autre instance du MFA à l'autre type d'accès. \n Si une personne se connecte d'abord au réseau de l'entité via un accès à distance, puis initie ultérieurement une connexion au CDE à partir du réseau, conformément à cette exigence, ladite personne s'authentifiera à l'aide du MFA à deux reprises, une fois lors de la connexion via un accès à distance au réseau de l'entité et une fois lors de la connexion via accès d’administration non-console du réseau de l'entité au CDE. \n Les exigences de l'authentification MFA s'appliquent à tous les types de composants système, y compris le cloud, les systèmes hébergés et les applications sur site, les dispositifs de sécurité réseau, les postes de travail, les serveurs et les points de terminaison, et comportent l'accès direct aux réseaux ou systèmes d'une entité ainsi qu'un accès Web à une application ou à une fonction. L'authentification MFA pour l'accès à distance au CDE peut être mise en œuvre au niveau du réseau ou du système/application ; elle n'a pas à être appliquée aux deux niveaux. Par exemple, si l'authentification MFA est utilisée lorsqu'un utilisateur se connecte au réseau CDE, il n'est pas nécessaire de l'utiliser lorsque l'utilisateur se connecte à chaque système ou application au sein du CDE. \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les configurations réseau et/ou système afin de vérifier que l'authentification MFA est mise en œuvre pour tous les accès au CDE. \n\tb. Observer les administrateurs se connecter au CDE et vérifier que l'authentification MFA est exigée. \n\nℹ️ Directives \n Objectif \n Exiger plus d'un type de facteur d'authentification réduit la probabilité qu'un attaquant puisse accéder à un système en se faisant passer pour un utilisateur légitime, car l'attaquant devra pouvoir compromettre plusieurs facteurs d'authentification. Cela est particulièrement vrai dans les environnements où traditionnellement, le seul facteur d'authentification utilisé était quelque chose qu'un utilisateur connaît, tel qu'un mot de passe ou une phrase secrète. \n\n Définitions \n L'utilisation d'un facteur d’authentification deux fois (par exemple, l'utilisation de deux mots de passe distincts) n'est pas considérée comme une authentification multifacteur."
    3_label: "L'authentification MFA est mise en œuvre pour tous les accès réseau distants provenant de l'extérieur du réseau de l'entité qui pourraient accéder ou avoir une incidence sur le CDE comme suit : Tous les accès à distance par tout le personnel, utilisateurs et administrateurs, provenant de l'extérieur du réseau de l'entité; Tous les accès à distance par des tiers et des fournisseurs."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n L'accès à distance au réseau de l'entité ne peut pas être obtenu en utilisant un seul facteur d'authentification. \n\nℹ️ Notes D’applicabilité \n L'exigence de l'authentification MFA pour l'accès à distance provenant de l'extérieur du réseau de l'entité s'applique à tous les comptes utilisateur pouvant accéder au réseau à distance, lorsque cet accès à distance conduit ou pourrait conduire à l'accès au CDE. \n Si l'accès à distance concerne une partie du réseau de l'entité qui est correctement segmentée du CDE, de sorte que les utilisateurs distants ne peuvent pas accéder ou avoir un impact sur le CDE, l'authentification MFA pour l'accès à distance à cette partie du réseau n'est pas requise. Cependant, l'authentification MFA est requise pour tout accès distant aux réseaux ayant accès au CDE et est recommandée pour tous les accès distants aux réseaux de l'entité. \n Les exigences de l'authentification MFA s'appliquent à tous les types de composants système, y compris le cloud, les systèmes hébergés et les applications sur site, les dispositifs de sécurité réseau, les postes de travail, les serveurs et les points de terminaison, et comportent l'accès direct aux réseaux ou systèmes d'une entité ainsi qu'un accès Web à une application ou à une fonction. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les configurations réseau et/ou système pour les serveurs et systèmes d'accès à distance afin de vérifier que l'authentification MFA est requise conforme à tous les éléments spécifiés dans cette exigence. \n\tb. Observer le personnel (par exemple, les utilisateurs et les administrateurs) se connectant à distance au réseau et vérifier que l'authentification à plusieurs facteurs est requise. \n\nℹ️ Directives \n Objectif \n Exiger plus d'un type de facteur d'authentification réduit la probabilité qu'un attaquant puisse accéder à un système en se faisant passer pour un utilisateur légitime, car l'attaquant devra pouvoir compromettre plusieurs facteurs d'authentification. Cela est particulièrement vrai dans les environnements où traditionnellement, le seul facteur d'authentification utilisé était quelque chose qu'un utilisateur connaît, tel qu'un mot de passe ou une phrase secrète. \n\n Définitions \n L'authentification multifacteur (MFA) exige qu'un individu présente au moins deux des trois facteurs d'authentification spécifiés dans l'exigence 8.3.1 avant que l'accès ne soit accordé. L'utilisation d'un facteur d’authentification deux fois (par exemple, l'utilisation de deux mots de passe distincts) n'est pas considérée comme une authentification multifacteur."
  5:
    title: "Les systèmes d'authentification multifacteur (MFA) sont configurés de sorte à ne pas pouvoir être contournés."
    1_label: "Les systèmes MFA sont mis en œuvre comme suit : Le système MFA n'est pas sensible aux attaques par rejeu; Les systèmes MFA ne peuvent pas être contournés par aucun utilisateur, y compris les administrateurs, à moins que cela ne soit spécifiquement documenté et autorisé par la direction à titre exceptionnel, pour une période limitée; Au moins deux types différents de facteurs d'authentification sont utilisés; La réussite de tous les facteurs d'authentification est obligatoire avant que l'accès ne soit accordé."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les systèmes MFA résistent aux attaques et contrôlent strictement toutes les dérogations administratives. \n\nℹ️ Notes D’applicabilité \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation du système du fournisseur afin de vérifier que le système MFA n'est pas susceptible d'être attaqué par rejeu. \n\tb. Examiner les configurations système pour la mise en œuvre du MFA afin de vérifier qu'elle est configurée conformément à tous les éléments spécifiés dans cette exigence. \n\tc. Interroger le personnel responsable et observer les processus afin de vérifier que toute demande de contournement du MFA est spécifiquement documentée et autorisée par la direction à titre exceptionnel, pour une période de temps limitée. \n\td. Observer le personnel se connectant aux composants du système dans le CDE afin de vérifier que l'accès n'est accordé qu'une fois tous les facteurs d'authentification réussis. \n\te. Observer le personnel se connectant à distance depuis l'extérieur du réseau de l'entité afin de vérifier que l'accès est accordé uniquement après que tous les facteurs d'authentification ont abouti. \n\nℹ️ Directives \n Objectif \n Les systèmes MFA mal configuré peuvent être contournés par des attaquants. Cette exigence concerne donc la configuration du ou des systèmes d'authentification MFA qui fournissent le MFA pour les utilisateurs accédant aux composants du système dans le CDE. \n\n Définitions \n L'utilisation d'un type de facteurs d’authentification deux fois (par exemple, l'utilisation de deux mots de passe distincts) n'est pas considérée comme une authentification multifacteur. \n\n Informations Complémentaires \n Pour plus d'informations sur les systèmes et fonctionnalités du MFA, se reporter à ce qui suit : Complément d'informations du PCI SSC : MultiFactor Authentication. \n Foire aux questions (FAQ) du PCI SSC sur ce sujet."
  6:
    title: "Les comptes applicatifs, les comptes systèmes et les facteurs d'authentification associés sont gérés rigoureusement."
    1_label: "Si les comptes utilisés par les systèmes ou les applications peuvent être utilisés pour la connexion interactive, ils sont gérés comme suit : L'utilisation interactive est interdite à moins que cela ne soit nécessaire dans des circonstances exceptionnelles; L'utilisation interactive est limitée au temps nécessaire à la circonstance exceptionnelle; La justification métier de l’utilisation interactive est documentée; L'utilisation interactive est explicitement approuvée par la direction; L'identité de l'utilisateur individuel est confirmée avant que l'accès au compte ne soit accordé; Chaque action entreprise est attribuable à un utilisateur individuel."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Lorsqu'elles sont utilisées de manière interactive, toutes les actions avec des comptes désignés comme comptes système ou applicatifs sont autorisées et attribuables à une personne. \n\nℹ️ Notes D’applicabilité \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les comptes applicatifs et système qui peuvent être utilisés de manière interactive et interroger les administrateurs afin de vérifier que les comptes applicatifs et système sont gérés conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Comme les comptes utilisateur individuels, les comptes système et applicatifs nécessitent une responsabilité et une gestion stricte pour s'assurer qu'ils sont utilisés uniquement aux fins prévues et qu'ils ne sont pas mal utilisés. \n Les attaquants compromettent souvent les comptes système ou applicatifs pour accéder aux données des titulaires de cartes. \n\n Bonne Pratique \n Dans la mesure du possible, configurer les comptes système et applicatifs pour interdire la connexion interactive afin d'empêcher les personnes non autorisées de se connecter et d'utiliser le compte avec ses privilèges système associés, et de limiter les machines et appareils sur lesquels le compte peut être utilisé. \n\n Définitions \n Les comptes système ou applicatifs sont les comptes qui exécutent des processus ou effectuent des tâches sur un système informatique ou une application et ne sont généralement pas des comptes auxquels un individu se connecte. Ces comptes ont généralement des privilèges élevés qui sont nécessaires pour effectuer des tâches ou des fonctions spécialisées. \n La connexion interactive est la possibilité pour une personne de se connecter à un compte système ou d'applications de la même manière qu'un compte utilisateur normal. L'utilisation des comptes système et applicatifs de cette manière signifie qu'il n'y a pas de responsabilité et de traçabilité des actions entreprises par l'utilisateur."
    2_label: "Les mots de passe/phrases secrètes pour tous les comptes applicatifs et système qui peuvent être utilisés pour la connexion interactive ne sont pas codés en dur dans les scripts, les fichiers de configuration/de propriété ou le code source sur mesure et personnalisé."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les mots de passe/phrases secrètes utilisés par les comptes applicatifs et système ne peuvent pas être utilisés par du personnel non autorisé. \n\nℹ️ Notes D’applicabilité \n Les mots de passe/phrases secrètes stockés doivent être chiffrés conformément à l'exigence 8.3.2 du standard PCI DSS. \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Interroger le personnel et examiner les procédures de développement du système afin de vérifier que les processus sont définis pour les comptes applicatifs et système qui peuvent être utilisés pour la connexion interactive, en spécifiant que les mots de passe/phrases secrètes ne sont pas codés en dur dans les scripts, les fichiers de configuration ou de propriété, ou le code source sur mesure et personnalisé. \n\tb. Examiner les scripts, les fichiers de configuration/de propriété et le code source sur mesure et personnalisé pour les comptes applicatifs et système pouvant être utilisés pour une connexion interactive, afin de vérifier que les mots de passe/phrases secrètes pour ces comptes ne sont pas présents. \n\nℹ️ Directives \n Objectif \n Ne pas protéger correctement les mots de passe/phrases secrètes utilisés par les comptes applicatifs et système, en particulier si ces comptes peuvent être utilisés pour une connexion interactive, augmente le risque et la réussite d'une utilisation non autorisée de ces comptes privilégiés. \n\n Bonne Pratique \n La modification de ces valeurs en raison d'une divulgation soupçonnée ou confirmée peut être particulièrement difficile à mettre en œuvre. \n Les outils peuvent faciliter à la fois la gestion et la sécurité des facteurs d'authentification pour les comptes d'applications et système. Par exemple, pensez aux coffres de mots de passe ou à d'autres mesures de sécurité gérée par le système."
    3_label: "Les mots de passe/phrases secrètes pour tous les comptes applicatifs et système sont protégés contre les abus comme suit : Les mots de passe/phrases secrètes sont modifiés périodiquement (à la fréquence définie dans l'analyse de risques ciblée de l'entité, qui est effectuée conformément à tous les éléments spécifiés dans l'exigence 12.3.1) et en cas de soupçon ou de confirmation de compromission; Les mots de passe/phrases secrètes sont construits avec une complexité suffisante adaptée à la fréquence à laquelle l'entité modifie les mots de passe/phrases secrètes."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les mots de passe/phrases secrètes utilisés par les comptes d'applications et système ne peuvent pas être utilisés indéfiniment et sont structurés pour résister aux attaques par force brute et par perçage. \n\nℹ️ Notes D’applicabilité \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures afin de vérifier que des procédures sont définies pour protéger les mots de passe/phrases secrètes pour les comptes applicatifs ou système contre les abus conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Examiner l'analyse de risques ciblée de l'entité pour la fréquence des modifications et la complexité des mots de passe/phrases secrètes utilisés pour la connexion interactive aux comptes applicatifs et système afin de vérifier que l'analyse de risques a été effectuée conformément à tous les éléments spécifiés dans l'exigence 12.3.1 et aborde : \n\t- La fréquence définie pour les modifications périodiques des mots de passe/phrases secrètes de l'application et du système. \n\t- La complexité définie pour les mots de passe/phrases secrètes et la pertinence de la complexité par rapport à la fréquence des modifications. \n\tc. Interroger le personnel responsable et examiner les paramètres de configuration du système afin de vérifier que les mots de passe/phrases secrètes de toute application et de tout compte système pouvant être utilisés pour la connexion interactive sont protégés contre les abus conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Les systèmes et les comptes applicatifs présentent un risque de sécurité plus inhérent que les comptes d'utilisateurs, car ils s'exécutent souvent dans un contexte de sécurité élevé, avec un accès aux systèmes qui ne sont généralement pas accordés aux comptes utilisateur, tels que l'accès programmatique aux bases de données, etc. Par conséquent, une attention particulière doit être accordée à la protection des mots de passe/phrases secrètes utilisés pour les comptes d'applications et système. \n\n Bonne Pratique \n Les entités doivent prendre en compte les facteurs de risque suivants lorsqu'elles déterminent la manière de protéger les mots de passe/phrases secrètes des applications et système contre les abus : \n\t- Le niveau de sécurité du stockage des mots de passe/phrases secrètes (par exemple, s'ils sont stockés dans un coffre de mots de passe). \n\t- Roulement du personnel. \n\t- Le nombre de personnes ayant accès au facteur d'authentification. \n\t- Si le compte peut être utilisé pour une connexion interactive. \n\t- Si la posture de sécurité des comptes est analysée dynamiquement et si l'accès en temps réel aux ressources est automatiquement déterminé en conséquence (voir l'exigence 8.3.9). \n Tous ces éléments affectent le niveau de risque pour les comptes applicatifs et système et peuvent avoir une incidence sur la sécurité des systèmes auxquels accèdent les comptes système et applicatifs. \n Les entités doivent corréler la fréquence des modifications choisie pour les mots de passe/phrases secrètes applicatifs et système avec la complexité choisie pour ces mots de passe/phrases secrètes - c'est-à-dire que la complexité doit être plus rigoureuse lorsque les mots de passe/phrases secrètes sont modifiés peu fréquemment et peut être moins rigoureuse lorsqu'ils sont modifiés plus fréquemment. Par exemple, une fréquence de modification plus longue est plus justifiable lorsque la complexité des mots de passe/phrases secrètes est définie sur 36 caractères alphanumériques avec des lettres majuscules et minuscules, des chiffres et des caractères spéciaux. \n Les meilleures pratiques consistent à prendre en compte les modifications de mots de passe au moins une fois par an, une longueur de mot de passe/phrase secrètes d'au moins 15 caractères et la complexité des mots de passe/phrases secrètes de caractères alphanumériques, avec des lettres majuscules et minuscules et des caractères spéciaux. \n\n Informations Complémentaires \n Pour plus d'informations sur la variabilité et l'équivalence de la force du mot de passe pour les mots de passe/phrases secrètes de différents formats, consultez les standards de l'industrie (par exemple, la version actuelle du NIST SP 800-63 Digital Identity Guidelines)."
9:
  prefix: "Exigence 9"
  title: "Limiter L'accès Physique aux Données des Titulaires de Cartes"
  desc: "Tout accès physique aux données des titulaires de cartes ou aux systèmes qui stockent, traitent ou transmettent les données des titulaires de cartes offre la possibilité à des personnes d'accéder et/ou de supprimer des systèmes ou des copies papier contenant des données de titulaires de cartes ; par conséquent, l'accès physique doit être limité de manière appropriée. \n\n Il y a trois domaines différents mentionnés dans l'exigence 9 : \n\t1. Les exigences qui se reportent spécifiquement aux zones sensibles sont destinées à s'appliquer uniquement à ces zones. \n\t2. Les exigences qui se reportent spécifiquement à l'environnement de données des titulaires de cartes (CDE) sont destinées à s'appliquer à l'ensemble du CDE, y compris toutes les zones sensibles résidant au sein du CDE. \n\t3. Les exigences qui se reportent spécifiquement à l'installation font référence aux types de mesures qui peuvent être gérés plus largement à la limite physique d'un local commercial (tel qu'un bâtiment) dans lequel résident les CDE et les zones sensibles. Ces mesures de sécurité existent souvent en dehors d'un CDE ou d'une zone sensible, par exemple un poste de garde qui identifie, badge et enregistre les visiteurs. Le terme « installation » est utilisé pour reconnaître que ces mesures de sécurité peuvent exister à différents endroits dans une installation, par exemple, à l'entrée d'un bâtiment ou à une entrée interne d'un centre de données ou d'un espace de bureau. \n\n Se reporter à l'Annexe G pour les définitions de « médias », « personnel », « zones sensibles » et d'autres termes du standard PCI DSS."
  1:
    title: "Les processus et mécanismes de restriction de l'accès physique aux données des titulaires de cartes sont définis et compris."
    1_label: "Toutes les politiques de sécurité et procédures opérationnelles identifiées dans l'exigence 9 sont : Documentées; Tenues à jour; Utilisées; Connues de toutes les parties concernées."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les attentes, les mesures de sécurité et la surveillance relatives à l'exigence 9 sont définis et respectés par le personnel concerné. Toutes les activités de soutien sont reproductibles, appliquées de manière cohérente et conformes à l'intention de la direction. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation et interroger le personnel pour vérifier que les politiques de sécurité et les procédures opérationnelles identifiées dans l'exigence 9 sont gérées conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n L'exigence 9.1.1 concerne la gestion efficace et le maintien des diverses politiques et procédures spécifiées dans toute l'exigence 9. S'il est important de définir les politiques ou procédures spécifiques décrites dans l'exigence 9, il est tout aussi important de s'assurer qu'elles sont correctement documentées, maintenues et diffusées. \n\n Bonne Pratique \n Il est important de mettre à jour les politiques et les procédures au besoin pour faire face aux changements dans les processus, les technologies et les objectifs métier. Pour cette raison, envisager de mettre à jour ces documents dès que possible après un changement et pas seulement sur un cycle périodique. \n\n Définitions \n Les politiques de sécurité définissent les objectifs et les principes de sécurité de l'entité. Les procédures opérationnelles décrivent la façon d'exécuter les activités et définissent les mesures de sécurité, les méthodes et les processus qui sont suivis pour atteindre le résultat escompté de manière cohérente et conformément aux objectifs de la politique. \n Les politiques et procédures, y compris les mises à jour, sont activement communiquées à tout le personnel concerné et sont justifiées par des procédures opérationnelles décrivant la manière d'effectuer les activités."
    2_label: "Les rôles et les responsabilités liées aux activités de l'exigence 9 sont documentés, attribués et compris."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les responsabilités quotidiennes pour l'exécution de toutes les activités de l'exigence 9 sont attribuées. Le personnel est responsable du bon fonctionnement continu desdites exigences. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation pour vérifier que les descriptions des rôles et des responsabilités pour l'exécution des activités de l'exigence 9 sont documentées et attribuées. \n\tb. Interroger le personnel chargé d'exécuter les activités de l'exigence 9 afin de vérifier que les rôles et les responsabilités sont assignés comme documentés et qu’ils sont compris. \n\nℹ️ Directives \n Objectif \n Si les rôles et les responsabilités ne sont pas officiellement attribués, le personnel peut ne pas être conscient de ses responsabilités quotidiennes et les activités critiques peuvent ne pas avoir lieu. \n\n Bonne Pratique \n Les rôles et les responsabilités peuvent être documentés dans des politiques et procédures, ou conservés dans des documents distincts. \n Dans le cadre de la communication des rôles et des responsabilités, les entités peuvent envisager de demander au personnel de reconnaître leur acceptation et leur compréhension des rôles et responsabilités qui leur sont attribués. \n Une méthode pour documenter les rôles et les obligations est une matrice d'attribution des responsabilités qui indique qui est responsable auditable, consulté et informé (également appelée matrice RACI)."
  2:
    title: "Les mesures de sécurité d'accès physiques gèrent l'entrée dans les installations et les systèmes contenant les données des titulaires de cartes."
    1_label: "Des mesures de sécurité d'accès aux installations appropriés sont en place pour limiter l'accès physique aux systèmes du CDE."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les composants système dans le CDE ne sont pas physiquement accessibles par du personnel non autorisé. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Observer les mesures de sécurité dans les zones d’entrée et interroger le personnel responsable afin de vérifier que des mesures de sécurité de sécurité physique sont en place pour limiter l'accès aux systèmes du CDE. \n\nℹ️ Directives \n Objectif \n Sans contrôle d'accès physique, des personnes non autorisées pourraient potentiellement accéder au CDE et aux informations sensibles, ou pourraient modifier les configurations du système, introduire des vulnérabilités dans le réseau, ou détruire ou voler des équipements. Par conséquent, le but de cette exigence est que l'accès physique au CDE soit contrôlé via des mesures de sécurité de sécurité physiques tels que des lecteurs de badges ou d'autres mécanismes tels que des serrures et des clés. \n\n Bonne Pratique \n Quel que soit le mécanisme qui répond à cette exigence, il doit être suffisant pour l'entreprise de vérifier que seul du personnel autorisé a accès. \n\n Exemples \n Les mesures de sécurité dans les zones d'entrée aux installations comprennent des mesures de sécurité de sécurité physique dans chaque salle informatique, centre de données et autres zones physiques avec des systèmes dans le CDE. Il peut également inclure des lecteurs de badges ou d'autres dispositifs qui gèrent les mesures de sécurité d'accès physiques, tels qu'une serrure et une clé avec une liste à jour de toutes les personnes détenant les clés."
    2_prefix: "9.2.1.1"
    2_label: "L'accès physique individuel aux zones sensibles au sein du CDE est surveillé à l'aide de caméras vidéo ou de mécanismes de contrôle d'accès physique (ou les deux), des manières suivantes : Les points d'entrée et de sortie des zones sensibles du CDE sont surveillés; Les dispositifs ou mécanismes de surveillance sont protégés contre l'altération ou la désactivation; Les données recueillies sont examinées et corrélées avec d'autres entrées; Les données recueillies sont conservées pendant au moins trois mois, sauf restriction légale contraire."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Des enregistrements fiables et vérifiables sont conservés pour chaque entrée et sortie physiques des zones sensibles. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Observer les emplacements où a lieu l'accès physique individuel aux zones sensibles du CDE afin de vérifier que des caméras vidéo ou des mécanismes de contrôle d'accès physique (ou les deux) sont en place pour surveiller les points d'entrée et de sortie. \n\tb. Observer les emplacements où a lieu l'accès physique individuel aux zones sensibles du CDE afin de vérifier que des caméras vidéo ou des mécanismes de contrôle d'accès physique (ou les deux) sont protégés contre l'altération ou la désactivation. \n\tc. Observer les mécanismes de contrôle d'accès physique et/ou examiner les caméras vidéo et interroger le personnel responsable afin de vérifier que : \n\t- Les données recueillies à partir des caméras vidéo et/ou des mécanismes de contrôle d'accès physique sont examinées et corrélées avec d'autres entrées. \n\t- Les données recueillies sont conservées pendant au moins trois mois. \n\nℹ️ Directives \n Objectif \n Le maintien des détails des personnes entrantes et sortantes des zones sensibles peut aider aux enquêtes sur les violations physiques en identifiant les personnes qui ont physiquement accédé aux zones sensibles, ainsi que les heures auxquelles elles sont entrées et sorties. \n\n Bonne Pratique \n Quel que soit le mécanisme qui satisfait à cette exigence, il doit surveiller efficacement tous les points d'entrée et de sortie des zones sensibles. \n Les criminels qui tentent d'accéder physiquement à des zones sensibles essaieront souvent de désactiver ou de contourner les mesures de sécurité de surveillance. Pour protéger ces mesures de sécurité contre les altérations, des caméras vidéo peuvent être positionnées de manière à ce qu'elles soient hors de périmètre et/ou être surveillées pour détecter les altérations. De même, les mécanismes de contrôle d'accès physique pourraient être surveillés où avoir des protections physiques installées pour les empêcher d'être endommagés ou désactivés par des personnes malveillantes."
    3_prefix: "9.2.2"
    3_label: "Des mesures de sécurité physiques et/ou logiques sont mis en œuvre pour limiter l'utilisation des prises réseaux accessibles au public au sein de l'installation."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les appareils non autorisés ne peuvent pas se connecter au réseau de l'entité à partir des zones publiques de l'installation. \n\nℹ️ Notes D’applicabilité \n  \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Interroger le personnel responsable et observer les emplacements des prises réseaux accessibles au public afin de vérifier que des mesures de sécurité physiques et/ou logiques sont en place pour limiter l'accès aux prises réseaux accessibles au public au sein de l'installation. \n\nℹ️ Directives \n Objectif \n Limiter l'accès aux prises réseau (ou ports réseau) empêchera les individus malveillants de se brancher sur des prises réseaux facilement disponibles et d'accéder au CDE ou aux systèmes connectés au CDE. \n\n Bonne Pratique \n Si des mesures de sécurité logiques ou physiques, ou une combinaison des deux, sont utilisés, ils devraient empêcher un individu ou un appareil qui n'est pas explicitement autorisé de pouvoir se connecter au réseau. \n\n Exemples \n Les méthodes pour satisfaire à cette exigence incluent que les prises réseaux situés dans les zones publiques et les zones accessibles aux visiteurs soient désactivées et activées uniquement lorsque l'accès au réseau est explicitement autorisé. Alternativement, des processus pourraient être mis en œuvre pour s'assurer que les visiteurs sont escortés en tout temps dans les zones dotées de prises réseau actives."
    4_prefix: "9.2.3"
    4_label: "L'accès physique aux points d'accès sans fil, aux passerelles, au matériel de mise en réseau/de communication et aux lignes de télécommunication au sein de l'installation est limité."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n L'équipement réseau n'est pas accessible physiquement au personnel non autorisé. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Interroger le personnel responsable et observer l'emplacement du matériel et des câbles afin de vérifier que l'accès physique aux points d'accès sans fil, aux passerelles, au matériel de réseau/de communication et aux lignes de télécommunication au sein de l'installation est limité. \n\nℹ️ Directives \n Objectif \n Sans une sécurité physique appropriée régissant l'accès aux composants et appareils sans fil, et aux équipements et lignes de réseau informatique et de télécommunications, des utilisateurs malveillants pourraient accéder aux ressources réseau de l'entité. De plus, ils pourraient connecter leurs propres appareils au réseau pour obtenir un accès non autorisé au CDE ou aux systèmes connectés au CDE. \n De plus, la sécurisation du matériel de mise en réseau et de communication empêche les utilisateurs malveillants d'intercepter le trafic réseau ou de connecter physiquement leurs propres appareils aux ressources du réseau câblé."
    5_prefix: "9.2.4"
    5_label: "L'accès aux consoles dans les zones sensibles est limité par un système de verrouillage lorsqu'elles ne sont pas utilisées"
    5_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les consoles physiques dans les zones sensibles ne peuvent pas être utilisées par du personnel non autorisé. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Observer la tentative d'un administrateur système de se connecter aux consoles dans les zones sensibles et vérifier qu'elles sont « verrouillées » afin d'empêcher toute utilisation non autorisée. \n\nℹ️ Directives \n Objectif \n Le verrouillage des écrans de connexion à la console empêche les personnes non autorisées d'accéder à des informations sensibles, de modifier les configurations du système, d'introduire des vulnérabilités dans le réseau ou de détruire des enregistrements."
  3:
    title: "L'accès physique du personnel et des visiteurs est autorisé et géré."
    1_label: "Des procédures sont mises en œuvre pour autoriser et gérer l'accès physique du personnel au CDE, notamment : Identification du personnel; L’exigence de gérer les modifications d'accès physique d'une personne; Révoquer ou mettre fin à l'identification du personnel; Limiter l'accès au processus ou au système d'identification au personnel autorisé."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les conditions d'accès au CDE physique sont définies et appliquées pour identifier et autoriser le personnel. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les procédures documentées afin de vérifier que les procédures d'autorisation et de gestion de l'accès physique du personnel au CDE sont définies conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Observer les méthodes d'identification, telles que les badges d'identification, et observer les processus afin de vérifier que le personnel du CDE est clairement identifié \n\tc. Observer les processus afin de vérifier que l'accès au processus d'identification, tel qu'un système de badge, est limité au personnel autorisé. \n\nℹ️ Directives \n Objectif \n L'établissement de procédures pour accorder, gérer et supprimer l'accès lorsqu'il n'est plus nécessaire, garantit que les personnes non autorisées sont empêchées d'accéder aux zones contenant les données des titulaires de cartes. De plus, il est important de limiter l'accès au système de badges et au matériel de badgeage afin d'empêcher le personnel non autorisé de créer ses propres badges et/ou d'établir ses propres règles d'accès. \n\n Bonne Pratique \n Il est important d'identifier visuellement le personnel qui est physiquement présent et s'il s'agit d'un visiteur ou d'un employé. \n\n Exemple \n Une façon d'identifier le personnel est de leur attribuer des badges."
    2_prefix: "9.3.1.1"
    2_label: "L'accès physique aux zones sensibles au sein du CDE pour le personnel est contrôlé comme suit : L'accès est autorisé et basé sur la fonction individuelle du poste; L'accès est révoqué immédiatement après la résiliation du contrat de travail; Tous les mécanismes d'accès physiques, tels que les clés, les cartes d'accès, etc., sont retournés ou désactivés lors de la résiliation du contrat."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les zones sensibles ne sont pas accessibles au personnel non autorisé. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Observer le personnel dans les zones sensibles du CDE, interroger le personnel responsable et examiner les listes de contrôle d'accès physique afin de vérifier que : \n\t- L'accès à la zone sensible est autorisé. \n\t- L'accès est requis pour la fonction métier de l'individu. \n\tb. Observer les processus et interroger le personnel afin de vérifier que l'accès de tout le personnel est révoqué immédiatement après la résiliation du contrat. \n\tc. Pour le personnel ayant quitté l’entreprise, examiner les listes de contrôle d'accès physique et interroger le personnel responsable afin de vérifier que tous les mécanismes d'accès physique (tels que les clés, les cartes d'accès, etc.) ont été restitués ou désactivés. \n\nℹ️ Directives \n Objectif \n Le contrôle de l'accès physique aux zones sensibles permet de garantir que seul le personnel autorisé ayant un besoin métier légitime peut y avoir accès. \n\n Bonne Pratique \n Dans la mesure du possible, les entreprises doivent disposer de politiques et de procédures garantissant qu'avant que le personnel ne quitte l'entreprise, tous les mécanismes d'accès physique soient rendus ou désactivés dès que possible après leur départ. Cela garantira que le personnel ne pourra pas accéder physiquement aux zones sensibles une fois son emploi terminé."
    3_prefix: "9.3.2"
    3_label: "Des procédures sont mises en œuvre afin d'autoriser et gérer l'accès des visiteurs au CDE, notamment : Les visiteurs sont autorisés avant d'entrer; Les visiteurs sont escortés en tout temps; Les visiteurs sont clairement identifiés et reçoivent un badge ou autre moyen les identifiants, ayant un délai d’expiration; Les badges de visiteur ou autre moyen d’identification distinguent visiblement les visiteurs du personnel."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les exigences relatives à l'accès des visiteurs au CDE sont définies et appliquées. Les visiteurs ne peuvent pas dépasser tout accès physique autorisé lorsqu'ils sont dans le CDE. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les procédures documentées et interroger le personnel afin de vérifier que des procédures sont définies pour autoriser et gérer l'accès des visiteurs au CDE conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Observer les processus lorsque des visiteurs sont présents dans le CDE et interroger le personnel afin de vérifier que les visiteurs sont : \n\t- Autorisés avant d'entrer au CDE. \n\t- Escortés en tout temps à l'intérieur du CDE. \n\tc. Observer l'utilisation de badges des visiteurs ou autre moyen d’identification afin de vérifier que le badge ou autre moyen d’identification ne permet pas un accès sans escorte au CDE. \n\td. Observer les visiteurs dans le CDE afin de vérifier que : \n\t- Des badges de visiteurs ou autre moyen d’identification sont utilisés pour tous les visiteurs. \n\t- Les badges de visiteur ou autre moyen d’identification distinguent visiblement les visiteurs du personnel. \n\te. Examiner les badges des visiteurs ou autres pièces d'identité et observer les preuves dans le système de badges afin de vérifier que les badges des visiteurs ou autres moyens d’identification ont expiré. \n\nℹ️ Directives \n Objectif \n Les mesures de sécurité des visiteurs sont importantes pour réduire la capacité des personnes non autorisées et malveillantes à accéder aux installations et potentiellement aux données des titulaires de cartes. \n Les mesures de sécurité des visiteurs garantissent que les visiteurs sont identifiables en tant que visiteurs afin que le personnel puisse surveiller leurs activités et que leur accès soit limité à la durée de leur visite légitime."
    4_prefix: "9.3.3"
    4_label: "Les badges ou les pièces d'identité des visiteurs sont remis ou désactivés avant que les visiteurs ne quittent l'établissement ou à la date d'expiration."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n L'identification des visiteurs ou les badges ne peuvent pas être réutilisés après expiration. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Observer les visiteurs quittant l'établissement et interroger le personnel afin de vérifier que les badges de visiteurs ou autre pièce d'identité sont remis ou désactivés avant que les visiteurs ne quittent l'établissement ou à la date d'expiration, au départ ou à l'expiration. \n\nℹ️ Directives \n Objectif \n Veiller à ce que les badges des visiteurs soient rendus ou désactivés à l'expiration ou à la fin de la visite, empêche les personnes malveillantes d'utiliser un laissez-passer préalablement autorisé pour accéder physiquement au bâtiment une fois la visite terminée."
    5_prefix: "9.3.4"
    5_label: "Un journal des visiteurs est utilisé pour conserver un enregistrement physique de l'activité des visiteurs au sein de l'installation et dans les zones sensibles, y compris : Le nom du visiteur et l'organisation représentée; La date et l'heure de la visite; Le nom du personnel autorisant l'accès physique; Conserver le journal pendant au moins trois mois, sauf restriction légale contraire."
    5_desc: "ℹ️ Objectif de L’approche Personnalisée \n Des enregistrements de l'accès des visiteurs qui permettent l'identification des personnes sont conservés. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner le journal des visiteurs et interroger le personnel responsable afin de vérifier qu'un journal des visiteurs est utilisé pour enregistrer l'accès physique à l'installation et aux zones sensibles. \n\tb. Examiner le journal des visiteurs et vérifier qu'il contient : \n\t- Le nom du visiteur et l'organisation représentée. \n\t- Le personnel autorisant l'accès physique. \n\t- Date et heure de la visite. \n\tc. Examiner les emplacements de stockage des journaux des visiteurs et interroger le personnel responsable afin de vérifier que le journal est conservé pendant au moins trois mois, sauf indication contraire par la loi. \n\nℹ️ Directives \n Objectif \n Un journal des visiteurs documentant un minimum d'informations sur le visiteur est facile et peu coûteux à maintenir. Il aidera à identifier l'historique d'accès physique à un bâtiment ou à une pièce et l'accès potentiel aux données des titulaires de cartes. \n\n Bonne Pratique \n Lors de l'enregistrement de la date et de l'heure de la visite, l'inclusion des heures d'entrée et de sortie est considérée comme une Bonne Pratique, car elle fournit des informations de suivi utiles et garantit qu'un visiteur est parti à la fin de la journée. Il est également bon de vérifier que l'identifiant d'un visiteur (permis de conduire, etc.) correspond au nom qu'il a inscrit dans le journal des visiteurs."
  4:
    title: "Les supports contenant les données des titulaires de carte sont stockés, consultés, distribués et détruits de manière sécurisée."
    1_label: "Tous les supports contenants les données des titulaires de cartes sont physiquement sécurisés."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les supports contenant les données de titulaires de cartes ne sont pas accessibles au personnel non autorisé. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation afin de vérifier que les procédures définies pour la protection des données des titulaires de cartes comportent des mesures pour sécuriser physiquement tous les supports \n\nℹ️ Directives \n Objectif \n Les mesures de sécurité de sécurité physique des supports sont destinées à empêcher les personnes non autorisées d'accéder aux données des titulaires de cartes sur n'importe quel support. Les données des titulaires de cartes sont susceptibles d'être visualisées, copiées ou numérisées sans autorisation si elles ne sont pas protégées alors qu'elles se trouvent sur un support amovible ou portable, imprimées ou laissées sur le bureau d’un employé."
    2_prefix: "9.4.1.1"
    2_label: "Les sauvegardes hors ligne des supports contenants les données des titulaires de cartes sont stockées dans un emplacement sécurisé."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les sauvegardes hors ligne ne sont pas accessibles au personnel non autorisé. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation afin de vérifier que des procédures sont définies pour sécuriser physiquement les sauvegardes hors ligne des supports contenants les données des titulaires de cartes dans un emplacement sécurisé. \n\tb. E Examiner les journaux ou toute autre documentation et interroger le personnel responsable de l'emplacement de stockage afin de vérifier que les sauvegardes hors ligne des supports contenants les données des titulaires de cartes sont stockées dans un emplacement sécurisé. \n\nℹ️ Directives \n Objectif \n Si elles sont stockées dans une installation non sécurisée, les sauvegardes contenant les données des titulaires de cartes peuvent facilement être perdues, volées ou copiées à des fins malveillantes. \n\n Bonne Pratique \n Pour un stockage sécurisé des supports de sauvegarde, une Bonne Pratique consiste à stocker les supports dans une installation hors site, telle qu'un site alternatif ou de sauvegarde ou dans les locaux d’un prestataire tiers de service de stockage."
    3_prefix: "9.4.1.2"
    3_label: "La sécurité des emplacements de sauvegarde hors ligne des supports contenant les données des titulaires de cartes est examinée au moins une fois tous les 12 mois."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les mesures de sécurité de sécurité protégeant les sauvegardes hors ligne sont vérifiées périodiquement par inspection. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation afin de vérifier que des procédures sont définies pour examiner la sécurité du ou des emplacements de sauvegarde hors ligne des supports avec les données des titulaires de cartes au moins une fois tous les 12 mois. \n\tb. Examiner les procédures documentées, les journaux ou toute autre documentation, et interroger le personnel responsable du ou des emplacements de stockage afin de vérifier que la sécurité de l'emplacement du stockage est examinée au moins une fois tous les 12 mois. \n\nℹ️ Directives \n \n Objectif \n La réalisation d'examens réguliers de l'installation de stockage permet à l'entreprise de résoudre rapidement les problèmes de sécurité identifiés, en minimisant les risques potentiels. Il est important que l'entité soit consciente de la sécurité de la zone dans laquelle les supports sont stockés."
    4_prefix: "9.4.2"
    4_label: "Tous les supports contenant des données de titulaires de cartes sont classés en fonction de la sensibilité des données."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les médias sont classés et protégés de manière appropriée. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta Examiner la documentation afin de vérifier que des procédures sont définies pour classer les supports avec les données des titulaires de cartes en fonction de la sensibilité des données. \n\tb. Examiner les journaux liés aux supports ou toute autre documentation afin de vérifier que tous les médias sont classés en fonction de la sensibilité des données. \n\nℹ️ Directives \n Objectif \n Les supports non identifiés comme confidentiels peuvent ne pas être protégés de manière adéquate ou peuvent être perdus ou volés. \n\n Bonne Pratique \n Il est important que les supports soient identifiés de manière à ce que leur statut de classification soit apparent. Cela ne signifie pas pour autant que les médias doivent avoir un label « confidentiel »."
    5_prefix: "9.4.3"
    5_label: "Les supports avec les données des titulaires de cartes envoyées à l'extérieur de l'installation sont sécurisés comme suit : Les supports envoyés à l'extérieur de l'installation sont documentés; Les supports sont envoyés par courrier sécurisé ou par un autre mode de livraison pouvant être suivi avec précision; La documentation de suivi des supports hors site inclue des détails sur l'emplacement des supports."
    5_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les supports sont sécurisés et suivis lorsqu'ils sont transportés hors de l'installation. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation afin de vérifier que des procédures sont définies pour sécuriser les supports envoyés à l'extérieur de l'installation conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Interroger le personnel et examiner les dossiers afin de vérifier que tous les supports envoyés à l'extérieur de l'installation sont documentés et envoyés par courrier sécurisé ou par une autre méthode de livraison pouvant être suivie. \n\tc. Examiner la documentation de suivi des supports hors site, pour tous les supports, afin de vérifier que les détails de suivi sont documentés. \n\nℹ️ Directives \n Objectif \n Les supports peuvent être perdus ou volés s'ils sont envoyés via une méthode n’assurant pas le suivi telle que le courrier postal ordinaire. L'utilisation de coursiers sécurisés pour livrer tout support contenant des données de titulaires de cartes permet aux entreprises d'utiliser leurs systèmes de suivi pour maintenir l'inventaire et l'emplacement des expéditions."
    6_prefix: "9.4.4"
    6_label: "La direction approuve tous les supports avec des données de titulaires de cartes qui sont déplacés hors de l'installation (y compris lorsque les supports sont distribués à des personnes individuelles)."
    6_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les médias ne peuvent pas quitter une installation sans l'approbation du personnel responsable. \n\nℹ️ Notes D’applicabilité \n Les personnes qui approuvent les mouvements des supports devraient avoir le niveau hiérarchique approprié pour accorder cette approbation. Cependant, il n'est pas spécifiquement exigé que ces personnes aient l'indication « responsable » dans leur titre. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation afin de vérifier que des procédures sont définies pour garantir que les supports déplacés hors de l'installation sont approuvés par la direction. \n\tb. Examiner la documentation de suivi des supports hors site et interroger le personnel responsable afin de vérifier qu'une autorisation de la direction est obtenue pour tous les supports déplacés hors de l'installation (y compris les supports distribués à des personnes individuelles). \n\nℹ️ Directives \n Objectif \n Sans un processus ferme pour garantir que tous les mouvements des supports sont approuvés avant que les médias ne soient retirés des zones sécurisées, les supports ne seraient pas suivis ou protégés de manière appropriée, et leur emplacement serait inconnu, ce qui entraînerait la perte ou le vol desdits supports."
    7_prefix: "9.4.5"
    7_label: "Un inventaire de tous les supports électroniques contenant les données des titulaires de cartes est conservé."
    7_desc: "ℹ️ Objectif de L’approche Personnalisée \n Des inventaires précis des supports électroniques stockés sont conservés. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation afin de vérifier que des procédures sont définies pour maintenir un inventaire des médias électroniques. \n\tb. Examiner les journaux l'inventaire des médias électroniques et interroger le personnel responsable afin de vérifier que l’inventaire est maintenu à jour. \n\nℹ️ Directives \n Objectif \n Sans méthodes d'inventaire et mesures de sécurité de stockage minutieux, les supports électroniques volés ou manquants pourraient passer inaperçus pendant une durée indéterminée."
    8_prefix: "9.4.5.1"
    8_label: "Les inventaires des supports électroniques avec les données des titulaires de cartes sont réalisés au moins une fois tous les 12 mois."
    8_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les inventaires des supports sont vérifiés périodiquement. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation afin de vérifier que des procédures sont définies pour effectuer des inventaires des supports électroniques avec les données des titulaires de cartes au moins une fois tous les 12 mois. \n\tb. Examiner les journaux d'inventaire des médias électroniques et interroger le personnel afin de vérifier que les inventaires des supports électroniques sont effectués au moins une fois tous les 12 mois. \n\nℹ️ Directives \n Objectif \n Sans méthodes d'inventaire et mesures de sécurité de stockage minutieux, les supports électroniques volés ou manquants pourraient passer inaperçus pendant une durée indéterminée."
    9_prefix: "9.4.6"
    9_label: "Les documents papier contenant les données des titulaires de cartes sont détruits lorsqu'ils ne sont plus nécessaires pour des raisons métiers ou juridiques, comme suit : Les matériaux sont déchiquetés, incinérés ou réduits en pâte afin que les données des titulaires de cartes ne puissent pas être reconstituées; Les documents sont stockés dans des conteneurs de stockage sécurisés avant destruction."
    9_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les données des titulaires de cartes ne peuvent pas être récupérées à partir d'un support détruit ou en attente de destruction. \n\nℹ️ Notes D’applicabilité \n Ces exigences relatives à la destruction du support lorsque ce support n'est plus nécessaire pour des raisons métiers ou juridiques sont distinctes de l'exigence 3.2.1 du standard PCI DSS, qui vise à supprimer en toute sécurité les données des titulaires de cartes lorsque celles-ci ne sont plus nécessaires conformément aux politiques de conservation des données des titulaires de carte de l'entité. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la politique de destruction périodique des supports afin de vérifier que des procédures sont définies pour détruire les supports papier contenant les données des titulaires de cartes lorsqu'ils ne sont plus nécessaires pour des raisons métiers ou juridiques, conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Observer les processus et interroger le personnel pour vérifier que les documents papier sont déchiquetés, incinérés ou réduits en pâte de telle sorte que les données des titulaires de cartes ne puissent pas être reconstituées. \n\tc. Observer les conteneurs de stockage utilisés pour les documents contenant des informations à détruire afin de vérifier que les conteneurs sont sécurisés. \n\nℹ️ Directives \n Objectif \n Si des mesures ne sont pas prises pour détruire les informations contenues sur les supports papier avant leur élimination, des personnes malveillantes peuvent récupérer des informations à partir des supports éliminés, ce qui entraîne une compromission desdites données. Par exemple, des personnes malveillantes peuvent utiliser une technique connue sous le nom de « Fouille des poubelles », où ils fouillent dans les poubelles et les corbeilles de recyclage à la recherche de documents papier contenant des informations qu'ils peuvent utiliser pour lancer une attaque. \n La sécurisation des conteneurs de stockage utilisés pour les documents qui vont être détruits empêche la capture d'informations sensibles pendant la collecte des documents. \n\n Bonne Pratique \n Envisager des conteneurs « à déchiqueter » avec un verrou qui empêche l'accès à leur contenu ou qui empêche physiquement l'accès à l'intérieur du conteneur. \n\n Informations Complémentaires \n Publication spéciale 800-88 du NIST, Révision 1 : Directives pour l’effacement des supports de stockage."
    10_prefix: "9.4.7"
    10_label: "Les supports électroniques contenant les données de titulaires de cartes sont détruits lorsqu'ils ne sont plus nécessaires pour des raisons métier ou juridiques via l'un des éléments suivants : Les supports électroniques sont détruits; Les données des titulaires de cartes sont rendues irrécupérables de sorte qu'elles ne peuvent pas être reconstituées."
    10_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les données des titulaires des cartes ne peuvent pas être récupérées à partir d'un support qui a été effacé ou détruit. \n\nℹ️ Notes D’applicabilité \n Ces exigences relatives à la destruction du support lorsque ce support n'est plus nécessaire pour des raisons métier ou juridiques sont distinctes de l'exigence 3.2.1 du standard PCI DSS, qui vise à supprimer en toute sécurité les données des titulaires de cartes lorsque celles-ci ne sont plus nécessaires conformément aux politiques de conservation des données des titulaires de carte de l'entité. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la politique de destruction périodique des supports afin de vérifier que des procédures sont définies pour détruire les supports électroniques lorsqu'ils ne sont plus nécessaires pour des raisons métier ou juridiques, conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Observer le processus de destruction des supports et interroger le personnel responsable afin de vérifier que les supports électroniques contenant les données des titulaires de cartes sont détruits via l'une des méthodes spécifiées dans cette exigence. \n\nℹ️ Directives \n Objectif \n Si des mesures ne sont pas prises pour détruire les informations contenues sur les supports électroniques lorsqu'elles ne sont plus nécessaires, des personnes malveillantes peuvent récupérer des informations à partir des supports mis au rebut, entraînant une compromission des données. Par exemple, des personnes malveillantes peuvent utiliser une technique connue sous le nom de « Fouille des poubelles », où ils fouillent dans les poubelles et les corbeilles de recyclage à la recherche d’informations qu'ils peuvent utiliser pour lancer une attaque. \n\n Bonne Pratique \n La fonction de suppression de la plupart des systèmes d'exploitation permet de récupérer les données supprimées. Par conséquent, une fonction ou une application de suppression sécurisée dédiée doit être utilisée pour rendre les données irrécupérables. \n\n Exemples \n Les méthodes de destruction sécurisée des supports électroniques comprennent l'effacement sécurisé conformément aux standards acceptés par l'industrie pour la suppression sécurisée, la démagnétisation ou la destruction physique (telle que le broyage ou le déchiquetage des disques durs). \n\n\ Informations Complémentaires \n Publication spéciale 800-88 du NIST, Revision1: Guidelines for Media Sanitization."
  5:
    title: "Les dispositifs de point d'interaction (POI) sont protégés contre l’altération et la substitution non autorisée."
    1_label: "Les appareils POI qui capturent les données de la carte de paiement via une interaction physique directe avec le facteur de forme de la carte de paiement sont protégés contre l’altération et la substitution non autorisée, notamment : Maintenir une liste des périphériques POI; Inspecter périodiquement les appareils POI pour rechercher des altérations ou des substitutions non autorisées; Former le personnel à être conscient des comportements suspects et à signaler toute altération ou substitution non autorisée d'appareils."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n L'entité a défini des procédures pour protéger et gérer les dispositifs de point d'interaction. Les attentes, les mesures de sécurité et la surveillance de la gestion et de la protection des appareils POI sont définis et respectés par le personnel concerné. \n\nℹ️ Notes D’applicabilité \n Ces exigences s'appliquent aux appareils POI déployés utilisés dans les transactions par carte (c'est-à-dire un facteur de forme de carte de paiement tel qu'une carte qui est glissée, tapée ou insérée). Cette exigence n'est pas destinée à s'appliquer aux composants de saisie manuelle des touches PAN tels que les claviers d'ordinateur. Cette exigence est recommandée, mais pas obligatoire, pour les composants de saisie manuelle des touches PAN tels que les claviers d'ordinateur. Cette exigence ne s'applique pas aux appareils commerciaux disponibles sur le marché (COTS) (par exemple, les smartphones ou les tablettes), qui sont des appareils mobiles appartenant à des commerçants conçus pour la distribution sur le marché de masse. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les politiques et procédures documentées afin de vérifier que des processus sont définis et incluent tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Les criminels tentent de voler les données des cartes de paiement en volant et/ou en manipulant des appareils et des terminaux de lecture de cartes. Les criminels essaieront de voler des appareils afin qu'ils puissent apprendre à les compromettre, et ils essaient souvent de remplacer les appareils légitimes par des appareils frauduleux qui leur envoient des données de carte de paiement chaque fois qu'une carte est insérée. \n Ils essaieront également d'ajouter des composants « de skimming » à l'extérieur des appareils, qui sont conçus pour capturer les données de carte de paiement avant qu'elles n'entrent dans l'appareil, par exemple, en attachant un lecteur de carte supplémentaire audessus du lecteur de carte légitime afin que les données de paiement de la carte soient capturées deux fois : une fois par le composant du criminel, et l'autre par le composant légitime de l'appareil. \n De cette façon, les transactions peuvent toujours être effectuées sans interruption pendant que le criminel « skim » les données de la carte de paiement au cours du processus. \n\n Informations Complémentaires \n D'autres bonnes pratiques en matière de prévention du skimming sont disponibles sur le site Web du PCI SSC."
    2_prefix: "9.5.1.1"
    2_label: "Une liste à jour des appareils POI est maintenue, y compris : La marque et le modèle de l'appareil; L’emplacement de l’appareil; Numéro de série de l'appareil ou autres méthodes d'identification uniques."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n L'identité et l'emplacement des appareils POI sont documentés et connus à tout moment. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la liste des appareils POI afin de vérifier qu'elle comprend tous les éléments spécifiés dans cette exigence. \n\tb. Observer les appareils POI et les emplacements des appareils et comparez-les aux appareils de la liste afin de vérifier que la liste est exacte et à jour. \n\tc. Interroger le personnel afin de vérifier que la liste des appareils POI est mise à jour lorsque des appareils sont ajoutés, déplacés, mis hors service, etc. \n\nℹ️ Directives \n Objectif \n Tenir à jour une liste des appareils POI aide une entreprise à savoir où les appareils sont censés se trouver et à identifier rapidement si un appareil est manquant ou perdu. \n\n Bonne Pratique \n La méthode de maintien d'une liste de dispositifs peut être automatisée (par exemple, un système de gestion des appareils) ou manuelle (par exemple, documentée dans des enregistrements électroniques ou papier). Pour les dispositifs routiers, l'emplacement peut inclure le nom du personnel auquel le dispositif est attribué. \n\n Exemples \n Les méthodes pour conserver les emplacements des appareils comprennent l'identification de l'adresse du site ou de l'installation où se trouve l'appareil."
    3_prefix: "9.5.1.2"
    3_label: "Les surfaces des appareils POI sont inspectées périodiquement afin de détecter les altérations et les substitutions non autorisées."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les appareils de point d'interaction ne peuvent pas être altérés, remplacés sans autorisation, ou avoir des accessoires de skimming installées sans détection en temps opportun. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les procédures documentées afin de vérifier que les processus sont définis pour les inspections périodiques des surfaces des appareils POI afin de détecter les altérations et les substitutions non autorisées. \n\tb. Interroger le personnel responsable et observer les processus d'inspection afin de vérifier que : \n\t- Le personnel connaît les procédures d'inspection des appareils. \n\t- Tous les appareils sont inspectés périodiquement pour rechercher des preuves d'altération et de substitution non autorisée. \n\nℹ️ Directives \n Objectif \n Des inspections régulières des appareils aideront les entreprises à détecter plus rapidement les altérations via des preuves externes (par exemple, l'ajout d'un skimmer de carte) ou le remplacement d'un appareil, minimisant ainsi l'impact potentiel de l'utilisation d'appareils frauduleux. \n\n Bonne Pratique \n Les méthodes d'inspection périodique comprennent la vérification du numéro de série ou d'autres caractéristiques de l'appareil et la comparaison des informations avec la liste des appareils POI afin de vérifier que l'appareil n'a pas été remplacé par un appareil frauduleux. \n\n Exemples \n Le type d'inspection dépendra de l'appareil. Par exemple, des photographies d'appareils connus pour être sécurisés peuvent être utilisées pour comparer l'apparence actuelle d'un appareil avec son apparence d'origine pour voir s'il a changé. Une autre option peut être d'utiliser un marqueur sécurisé, tel qu'un marqueur à lumière UV, pour marquer les surfaces et les ouvertures de l'appareil afin que toute altération ou remplacement soit apparents. Les criminels remplacent souvent le boîtier extérieur d'un appareil pour dissimuler leur altération, et ces méthodes peuvent aider à détecter de telles activités. Les fournisseurs d'appareils peuvent également fournir des conseils de sécurité et des guides pratiques pour aider à déterminer si l'appareil a fait l'objet d'une altération. \n Les signes indiquant qu'un appareil ont pu être altéré ou remplacé comprennent : \n\t- Des accessoires inattendus ou des câbles branchés sur l'appareil, \n\t- Des étiquettes de sécurité manquantes ou modifiées, \n\t- Un boîtier cassé, de couleur différente, ou \n\t- Des modifications du numéro de série ou d'autres marquages externes."
    4_prefix: "9.5.1.2.1"
    4_label: "La fréquence des inspections périodiques des appareils POI et le type d'inspections effectuées sont définis dans l'analyse de risques ciblée de l'entité, qui est réalisée selon tous les éléments spécifiés dans l'exigence 12.3.1."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les appareils POI sont inspectés à une fréquence qui tient compte des risques de l'entité. \n\nℹ️ Notes D’applicabilité \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner l'analyse de risques ciblée de l'entité pour la fréquence des inspections périodiques des appareils POI et le type d'inspections effectuées afin de vérifier que l'analyse de risques a été effectuée conformément à tous les éléments spécifiés dans l'exigence 12.3.1. \n\tb. Examiner les résultats documentés des inspections périodiques des appareils et interroger le personnel afin de vérifier que la fréquence et le type d'inspections des appareils POI effectuées correspondent à ce qui est défini dans l'analyse de risques ciblée de l'entité menée dans le cadre de la présente exigence. \n\nℹ️ Directives \n Objectif \n Les entités sont les mieux placées pour déterminer la fréquence des inspections des appareils POI en fonction de l'environnement dans lequel l'appareil fonctionne. \n\n Bonne Pratique \n La fréquence des inspections dépendra de facteurs tels que l'emplacement d'un appareil et si l'appareil est surveillé ou non. Par exemple, les appareils laissés dans des espaces publics sans la supervision du personnel de l'entreprise peuvent faire l'objet d'inspections plus fréquentes que les appareils conservés dans des zones sécurisées ou supervisés lorsqu'ils sont accessibles au public. En outre, de nombreux fournisseurs de POI incluent des conseils dans la documentation de leurs utilisateurs sur la fréquence à laquelle les appareils POI doivent être vérifiés et les raisons de le faire - les entités doivent consulter la documentation de leurs fournisseurs et intégrer ces recommandations dans leurs inspections périodiques."
    5_prefix: "9.5.1.3"
    5_label: "Une formation est dispensée au personnel des environnements POI pour qu'il soit au courant des pratiques d'altération ou de remplacement des appareils POI, et comprend : Vérifier l'identité de toute personne tierce prétendant être du personnel de réparation ou de maintenance, avant de leur accorder l'accès pour modifier ou dépanner les appareils; Des procédures pour garantir que les appareils ne sont pas installés, remplacés ou retournés sans vérification; Être conscient des comportements suspects entourant les appareils; Signaler les comportements suspects et les indications d'altération ou de substitution de l'appareil au personnel approprié."
    5_desc: "ℹ️ Objectif de L’approche Personnalisée \n Le personnel connaît les types d'attaques contre les appareils POI, les contre-mesures techniques et procédurales de l'entité, et peut accéder à une assistance et à des conseils si nécessaire. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les supports de formation pour le personnel dans les environnements de POI afin de vérifier qu'ils comportent tous les éléments spécifiés dans cette exigence. \n\tb. Interroger le personnel dans les environnements de POI afin de vérifier que tous les membres ont reçu une formation et qu'ils connaissent les procédures pour tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Les criminels se font souvent passer pour du personnel de maintenance autorisé pour accéder aux appareils POI. \n\n Bonne Pratique \n La formation du personnel doit inclure le fait d'être attentif et d'interroger toute personne qui se présente pour effectuer la maintenance des POI pour s'assurer qu'elle est autorisée et qu'elle dispose d'un bon de travail valide, y compris les agents, le personnel de maintenance ou de réparation, les techniciens, les prestataires de services ou d'autres tiers. Toutes les tierces parties demandant l'accès aux appareils doivent toujours être vérifiées avant de recevoir l'accès ; par exemple, en vérifiant auprès de la direction ou en téléphonant à la société de maintenance des points d'intérêt, telle que le prestataire ou acquéreur, pour vérification. De nombreux criminels essaieront de tromper le personnel en s'habillant déguisés comme des agents (par exemple, en portant des boîtes à outils et en portant des vêtements de travail), et pourraient également connaître l'emplacement des appareils, le personnel doit donc être formé pour toujours suivre les procédures. \n Une autre astuce utilisée par les criminels consiste à envoyer un « nouveau » appareil POI avec des instructions pour l'échanger avec un appareil légitime et « rendre » le nouvel appareil légitime. Les criminels peuvent même fournir des frais de retour à l'adresse indiquée. Par conséquent, le personnel doit toujours vérifier auprès de son responsable ou de son fournisseur que l'appareil est légitime et provient d'une source fiable avant de l'installer ou de l'utiliser à des fins professionnelles. \n\n Exemples \n Les comportements suspects dont le personnel doit être informé incluent les tentatives de personnes inconnues de débrancher ou d'ouvrir des appareils. \n S'assurer que le personnel connaît les mécanismes de signalement des comportements suspects et à qui signaler un tel comportement (par exemple, un chef hiérarchique ou un responsable de la sécurité) contribuera à réduire la probabilité et l'impact potentiel d'un appareil altéré ou remplacé."
10:
  prefix: "Exigence 10"
  title: "Enregistrer et Surveiller tous les Accès aux Composants Système et aux Données des Titulaires de Cartes"
  desc: "Les mécanismes de journalisation et la capacité de suivre les activités des utilisateurs sont essentiels pour prévenir, détecter ou minimiser l'impact d'une compromission des données. La présence de journaux sur tous les composants système et dans l'environnement de données des titulaires de cartes (CDE) permet un suivi, une alerte et une analyse approfondis en cas de problème. Déterminer la cause d'une compromission est difficile, voire impossible, sans les journaux d'activité du système. \n\n Cette exigence s'applique aux activités des utilisateurs, y compris celles des employés, des sous-traitants, des consultants et des fournisseurs internes et externes, et d'autres tiers (par exemple, ceux qui fournissent des services d'assistance ou de maintenance). \n\n Ces exigences ne s'appliquent pas à l'activité d'utilisateur des consommateurs (titulaires de cartes). \n\n Se reporter à l'Annexe G pour les définitions des termes du standard PCI DSS."
  1:
    title: "Les processus et mécanismes d'enregistrement et de surveillance de tous les accès aux composants système et aux données des titulaires de cartes sont définis et documentés. "
    1_label: "Toutes les politiques de sécurité et procédures opérationnelles identifiées dans l'exigence 10 sont : Documentées; Tenues à jour; Utilisées; Connues de toutes les parties concernées."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les attentes, les mesures de sécurité et la surveillance des activités de réunion dans l'exigence 10 sont définis et respectés par le personnel concerné. Toutes les activités de soutien sont reproductibles, appliquées de manière cohérente et conformes à l'intention de la direction. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation et interroger le personnel pour vérifier que les politiques de sécurité et les procédures opérationnelles identifiées dans l'exigence 10 sont gérées conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n L'exigence 10.1.1 concerne la gestion et le maintien efficaces des diverses politiques et procédures spécifiées dans toute l'exigence 10. S'il est important de définir les politiques ou procédures spécifiques décrites dans l'exigence 10, il est tout aussi important de s'assurer qu'elles sont correctement documentées, maintenues et diffusées. \n\n Bonne Pratique \n Il est important de mettre à jour les politiques et les procédures au besoin pour faire face aux changements dans les processus, les technologies et les objectifs métier. Pour cette raison, envisager de mettre à jour ces documents dès que possible après un changement et pas seulement sur un cycle périodique. \n\n Définitions \n Les politiques de sécurité définissent les objectifs et les principes de sécurité de l'entité. Les procédures opérationnelles décrivent la façon d'exécuter les activités et définissent les mesures de sécurité, les méthodes et les processus qui sont suivis pour atteindre le résultat escompté de manière cohérente et conformément aux objectifs de la politique."
    2_label: "Les rôles et les responsabilités liées aux activités de l'exigence 10 sont documentés, attribués et compris."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les responsabilités quotidiennes pour l'exécution de toutes les activités de l'exigence 10 sont attribuées. Le personnel est responsable du bon fonctionnement continu desdites exigences. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation pour vérifier que les descriptions des rôles et des responsabilités pour l'exécution des activités de l'exigence 10 sont documentées et attribuées. \n\tb. Interroger le personnel chargé d'exécuter les activités de l'exigence 10 afin de vérifier que les rôles et les responsabilités sont assignés comme documentés et qu’ils sont compris. \n\nℹ️ Directives \n Objectif \n Si les rôles et les responsabilités ne sont pas officiellement attribués, le personnel peut ne pas être conscient de ses responsabilités quotidiennes et les activités critiques peuvent ne pas avoir lieu. \n\n Bonne Pratique \n Les rôles et les responsabilités peuvent être documentés dans des politiques et procédures, ou conservés dans des documents distincts. \n Dans le cadre de la communication des rôles et des responsabilités, les entités peuvent envisager de demander au personnel de reconnaître leur acceptation et leur compréhension des rôles et responsabilités qui leur sont attribués. \n\n Exemples \n Une méthode pour documenter les rôles et les obligations est une matrice d'attribution des responsabilités qui indique qui est responsable, auditable consulté et informé (également appelée matrice RACI)."
  2:
    title: "Les journaux d'audit sont mis en œuvre pour prendre en charge la détection des anomalies et des activités suspectes, ainsi que l'analyse forensique des événements."
    1_label: "Les journaux d'audit sont activés et actifs pour tous les composants système et les données des titulaires de cartes."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les enregistrements de toutes les activités affectant les composants système et les données des titulaires de cartes sont capturés. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Interroger l'administrateur système et examiner les configurations système afin de vérifier que les journaux d'audit sont activés et actifs pour tous les composants système. \n\nℹ️ Directives \n Objectif \n Un journal doit exister pour tous les composants système. Les journaux d'audit envoient des alertes à l'administrateur système, fournissent des données à d'autres mécanismes de surveillance, tels que les systèmes de détection d'intrusion (IDS) et les outils de systèmes d'informations de sécurité et de surveillance des événements (SIEM), et fournissent un historique pour les enquêtes après incident. \n La journalisation et l'analyse des événements liés à la sécurité permettent à une entreprise d'identifier et de tracer les activités potentiellement malveillantes. \n\n Bonne Pratique \n Lorsqu'une entité considère les informations à enregistrer dans ses journaux, il est important de se rappeler que les informations stockées dans les journaux d'audit sont sensibles et doivent être protégées conformément aux exigences de ce standard. Il faut veiller à ne stocker que les informations essentielles dans les journaux d'audit afin de minimiser les risques."
    2_prefix: "10.2.1.1"
    2_label: "Les journaux d'audit capturent tous les accès des utilisateurs individuels aux données des titulaires de cartes."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les enregistrements de tous les accès des utilisateurs individuels aux données des titulaires de cartes sont capturés. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les configurations des journaux d'audit et les données des journaux afin de vérifier que tous les accès des utilisateurs individuels aux données des titulaires de cartes sont enregistrés. \n\nℹ️ Directives \n Objectif \n Il est essentiel d'avoir un processus ou un système qui relie l'accès des utilisateurs aux composants système auxquels ils accèdent. Des personnes malveillantes pourraient obtenir la connaissance d'un compte d’utilisateur ayant accès aux systèmes du CDE, ou ils pourraient créer un nouveau compte non autorisé pour accéder aux données des titulaires de cartes. \n\n Bonne Pratique \n Un enregistrement de tous les accès individuels aux données des titulaires de cartes peut identifier les comptes qui peuvent avoir été compromis ou utilisés à des fins malveillantes."
    3_prefix: "10.2.1.2"
    3_label: "Les journaux d'audit capturent toutes les actions effectuées par toute personne disposant d'un accès d’administration, y compris toute utilisation interactive des comptes d'applications ou système."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les enregistrements de toutes les actions effectuées par des personnes disposant de privilèges élevés sont capturés. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les configurations des journaux d'audit et les données des journaux afin de vérifier que toutes les actions entreprises par toute personne disposant d'un accès d’administration, y compris toute utilisation interactive des comptes d'applications ou système, sont enregistrées. \n\nℹ️ Directives \n Objectif \n Les comptes avec des privilèges d'accès accrus, tels que le compte « administrateur » ou « root », ont le potentiel d'avoir un impact significatif sur la sécurité ou la fonctionnalité opérationnelle d'un système. Sans un journal des activités effectuées, une entreprise ne peut pas retracer les problèmes résultant d'une erreur administrative ou d'un abus de privilège jusqu'à l'action et le compte spécifiques. \n\n Définitions \n Les comptes disposant d'un accès d’administration sont ceux qui ont des privilèges ou des capacités spécifiques pour ce compte afin de gérer des systèmes, des réseaux et/ou des applications. Les fonctions ou activités considérées comme d’administration sont au-delà de celles exécutées par les utilisateurs réguliers dans le cadre des fonctions métier de routine."
    4_prefix: "10.2.1.3"
    4_label: "Les journaux d'audit capturent tous les accès aux journaux d'audit."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les enregistrements de tous les accès aux journaux d'audit sont capturés. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les configurations des journaux d'audit et les données des journaux afin de vérifier que l'accès à tous les journaux d'audit est capturé. \n\nℹ️ Directives \n Objectif \n Les utilisateurs malveillants tentent souvent de modifier les journaux d'audit pour masquer leurs actions. Un enregistrement d'accès permet à une entreprise de retracer toute incohérence ou altération potentielle des journaux jusqu'à un compte individuel. Le fait que les journaux identifient les modifications, les ajouts et les suppressions dans les journaux d'audit peut aider à retracer les étapes effectuées par du personnel non autorisé."
    5_prefix: "10.2.1.4"
    5_label: "Les journaux d'audit capturent toutes les tentatives d'accès logique non valides."
    5_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les enregistrements de toutes les tentatives d'accès non valides sont capturés. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les configurations des journaux d'audit et les données des journaux afin de vérifier que les tentatives d'accès logique non valides sont capturées. \n\nℹ️ Directives \n Objectif \n Les personnes malveillantes effectueront souvent plusieurs tentatives d'accès aux systèmes ciblés. Plusieurs tentatives de connexion non valides peuvent être une indication des tentatives d'un utilisateur non autorisé d'accéder par « force brute » ou de deviner un mot de passe."
    6_prefix: "10.2.1.5"
    6_label: "Les journaux d'audit capturent toutes les modifications apportées à l'identification et aux identifiants d'authentification, y compris, sans toutefois s'y limiter : La création de nouveaux comptes; L'élévation des privilèges; Toutes les modifications, ajouts ou suppressions de comptes avec accès administrateur."
    6_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les enregistrements de toutes les modifications apportées à l'identification et aux informations d'authentification sont capturés. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les configurations des journaux d'audit et les données des journaux afin de vérifier que les modifications apportées aux informations d'identification et d'authentification sont capturées conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n La journalisation des modifications apportées aux informations d'authentification (y compris l'élévation des privilèges, les ajouts et les suppressions de comptes avec accès administratif) fournit une preuve résiduelle des activités. \n Des utilisateurs malveillants peuvent tenter de manipuler les informations d'authentification pour les contourner ou usurper l'identité d'un compte valide."
    7_prefix: "10.2.1.6"
    7_label: "Les journaux d'audit capturent les éléments suivants : Toutes les initialisations des nouveaux journaux d'audit, et; Tous les démarrages, arrêts ou pauses des journaux d'audit existants."
    7_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les enregistrements de toutes les modifications apportées à l'état d'activité des journaux d'audit sont capturés. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les configurations des journaux d'audit et les données de journalisation afin de vérifier que tous les éléments spécifiés dans cette exigence sont capturés. \n\nℹ️ Directives \n Objectif \n La désactivation ou la suspension des journaux d'audit avant d'effectuer des activités illicites est une pratique courante chez les utilisateurs malveillants qui souhaitent éviter la détection. L'initialisation des journaux d'audit peut indiquer qu'un utilisateur a désactivé la fonction de journalisation pour masquer ses actions."
    8_prefix: "10.2.1.7"
    8_label: "Les journaux d'audit capturent toutes les créations et suppressions d'objets au niveau du système."
    8_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les enregistrements des modifications qui indiquent qu'un système a été modifié par rapport à sa fonctionnalité prévue sont capturés. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les configurations des journaux d'audit et les données de journalisation afin de vérifier que la création et la suppression d'objets au niveau du système sont capturées. \n\nℹ️ Directives \n Objectif \n Les logiciels malveillants, tels que les programmes malveillants, créent ou remplacent souvent des objets au niveau du système sur le système cible afin de contrôler une fonction ou une opération particulière sur ce système. En enregistrant quand des objets au niveau du système sont créés ou supprimés, il sera plus facile de déterminer si de telles modifications ont été autorisées."
    9_prefix: "10.2.2"
    9_label: "Les journaux d'audit enregistrent les détails suivants pour chaque événement auditable : Identification de l'utilisateur; Type d’événement; Date et heure; Indication de réussite et d'échec; Origine de l'événement; Identité ou nom des données, composant système, ressource ou service touchés (par exemple, nom et protocole)."
    9_desc: "ℹ️ Objectif de L’approche Personnalisée \n Des données suffisantes pour pouvoir identifier les tentatives réussies et échouées et qui, quoi, quand, où et comment pour chaque événement répertorié dans l'exigence 10.2.1 sont capturés. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Interroger le personnel et examiner les configurations des journaux d'audit et les données de journalisation afin de vérifier que tous les éléments spécifiés dans cette exigence sont inclus dans les entrées des journaux pour chaque événement auditable (de 10.2.1.1 à 10.2.1.7). \n\nℹ️ Directives \n Objectif \n En enregistrant ces détails pour les événements auditables de 10.2.1.1 à 10.2.1.7, une compromission potentielle peut être rapidement identifiée, avec suffisamment de détails pour faciliter le suivi des activités suspectes."
  3:
    title: "Les journaux d'audit sont protégés contre la destruction et les modifications non autorisées."
    1_label: "L'accès en lecture aux fichiers journaux d'audit est limité aux personnes ayant un besoin lié à leur poste."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les enregistrements d'activité stockés ne sont pas accessibles au personnel non autorisé. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Interroger les administrateurs système et examiner les configurations et les privilèges du système afin de vérifier que seules les personnes ayant un besoin lié à leur poste ont un accès en lecture aux fichiers journaux d'audit. \n\nℹ️ Directives \n Objectif \n Les fichiers journaux d'audit contiennent des informations sensibles et l'accès en lecture aux fichiers journaux doit être limité uniquement aux personnes ayant un besoin professionnel valable. Cet accès inclut les fichiers journaux d'audit sur les systèmes d'origine ainsi que partout ailleurs où ils sont stockés. \n\n Bonne Pratique \n Une protection adéquate des journaux d'audit comprend un contrôle d'accès strict qui limite l'accès aux journaux en fonction du « besoin d’en connaître » uniquement et l'utilisation d'une ségrégation physique ou réseau pour rendre les journaux plus difficiles à trouver et à modifier"
    2_label: "Les fichiers journaux d'audit sont protégés pour empêcher les modifications par des personnes."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les enregistrements d'activité stockés ne peuvent pas être modifiés par le personnel. \n\nℹ️ Procédures de Test de L’approche Définie \n Examiner les configurations et les privilèges du système et interroger les administrateurs système afin de vérifier que les fichiers journaux d'audit actuels sont protégés contre les modifications par des personnes via des mécanismes de contrôle d'accès, une ségrégation physique et/ou une ségrégation réseau. \n\nℹ️ Directives \n Objectif \n Souvent, une personne malveillante qui a pénétré le réseau essaiera de modifier les journaux d'audit pour masquer son activité. Sans une protection adéquate des journaux d'audit, leur complétude, leur exactitude et leur intégrité ne peuvent être garanties, et les journaux d'audit peuvent devenir inutiles en tant qu'outil d'enquête après une compromission. Par conséquent, les journaux d'audit doivent être protégés sur les systèmes d'origine ainsi que partout ailleurs où ils sont stockés. \n\n Bonne Pratique \n Les entités doivent tenter d'empêcher les journaux d'être exposés dans des emplacements accessibles au public."
    3_label: "Les fichiers Journaux d'audit, y compris ceux des technologies exposées en externes, sont rapidement sauvegardés sur un ou des serveurs de journaux internes sécurisés et centraux ou sur d'autres supports difficiles à modifier."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les enregistrements d'activité stockés sont sécurisés et conservés dans un emplacement central pour empêcher toute modification non autorisée. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les configurations de sauvegarde ou les fichiers journaux afin de vérifier que les fichiers journaux d'audit actuels, y compris ceux des technologies externes, sont rapidement sauvegardés sur un ou plusieurs serveurs de journaux internes sécurisés ou sur d'autres supports qui sont difficiles à modifier. \n\nℹ️ Directives \n Objectif \n La prompte sauvegarde des journaux sur un serveur de journaux centralisé ou un support difficile à modifier maintient les journaux protégés, même si le système générant les journaux est compromis. \n L'écriture de journaux à partir de technologies exposées en externes telles que le sans fil, les mesures de sécurité de sécurité réseau, les serveurs DNS et de messagerie réduit le risque de perte ou de modification de ces journaux. \n\n Bonne Pratique \n Chaque entité détermine le meilleur moyen de sauvegarder les fichiers journaux, que ce soit via un ou plusieurs serveurs de journaux centralisés ou d'autres supports sécurisés. Les journaux peuvent être écrits directement, récupérés ou copiés à partir de systèmes externes vers le système ou le support interne sécurisé."
    4_label: "Des mécanismes de surveillance de l'intégrité des fichiers ou de détection des modifications sont utilisés sur les journaux d'audit afin de garantir que les données de journalisation existantes ne peuvent pas être modifiées sans générer d'alertes."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les enregistrements d'activités stockés ne peuvent pas être modifiés sans qu'une alerte ne soit générée. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les paramètres système, les fichiers surveillés et les résultats des activités de surveillance afin de vérifier la présence d’un logiciel de surveillance de l'intégrité des fichiers ou de détection des modifications sur les journaux d'audit. \n\nℹ️ Directives \n Objectif \n Les systèmes de surveillance de l'intégrité des fichiers ou de détection des modifications vérifient les modifications apportées aux fichiers critiques et avertissent lorsque de telles modifications sont identifiées. À des fins de surveillance de l'intégrité des fichiers, une entité surveille généralement les fichiers qui ne changent pas régulièrement, mais qui, lorsqu'ils sont modifiés, indiquent une éventuelle compromission. \n\n Bonne Pratique \n Le logiciel utilisé pour surveiller les modifications apportées aux journaux d'audit doit être configuré pour fournir des alertes lorsque des données ou des fichiers journaux existants sont modifiés ou supprimés. Cependant, les nouvelles données de journalisation ajoutées à un journal d'audit ne doivent pas générer d'alerte."
  4:
    title: "Les journaux d'audit sont examinés pour identifier les anomalies ou les activités suspectes."
    1_label: "Les journaux d'audit suivants sont examinés au moins une fois par jour : Tous les événements de sécurité; Les journaux de tous les composants système qui stockent, traitent ou transmettent des CHD et/ou des SAD; Les journaux de tous les composants système critiques; Les journaux de tous les serveurs et composants système qui exécutent des fonctions de sécurité (par exemple, mesures de sécurité réseau, systèmes de détection d'intrusion/systèmes de prévention d'intrusion (IDS/IPS), serveurs d'authentification)."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les activités potentiellement suspectes ou anormales sont rapidement identifiées pour minimiser l'impact. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures de sécurité afin de vérifier que des processus sont définis pour examiner tous les éléments spécifiés dans cette exigence au moins une fois par jour. \n\tb. Observer les processus et interroger le personnel afin de vérifier que tous les éléments spécifiés dans cette exigence sont examinés au moins une fois par jour \n\nℹ️ Directives \n Objectif \n De nombreuses violations surviennent des mois avant d'être détectées. Des examens réguliers des journaux signifient que les incidents peuvent être rapidement identifiés et résolus de manière proactive. \n\n Bonne Pratique \n La vérification quotidienne des journaux (7 jours par semaine, 365 jours par an, jours fériés compris) minimise le temps et l'exposition à une violation potentielle. Les outils de collecte, d'analyse et d'alerte des journaux, les systèmes centralisés de gestion des journaux, les analyseurs d'événements de journaux et les solutions de gestion des informations de sécurité et des événements (SIEM) sont des exemples d'outils automatisés qui peuvent être utilisés pour répondre à la présente exigence. \n Un examen quotidien des événements de sécurité, par exemple, des notifications ou des alertes qui identifient des activités suspectes ou anormales, ainsi que des journaux des composants système critiques et des journaux des systèmes exécutant des fonctions de sécurité, tels que les pare-feu, IDS/IPS, la surveillance de l'intégrité des fichiers (FIM) systèmes, etc., est nécessaire pour identifier les problèmes potentiels. \n La détermination d'un « événement de sécurité » variera pour chaque entreprise et peut prendre en compte le type de technologie, l'emplacement et la fonction de l'appareil. Les entreprises peuvent également souhaiter maintenir une base de trafic « normal » pour aider à identifier les comportements anormaux. \n Une entité qui utilise des prestataires de services tiers pour effectuer des services d'examen des journaux est chargée de fournir un contexte sur l'environnement de l'entité aux prestataires de services, afin qu'elle comprenne l'environnement de l'entité, dispose d'une base de trafic « normal » pour l'entité et puisse détecter les problèmes de sécurité potentiels et fournir des exceptions précises et des notifications d'anomalies."
    2_prefix: "10.4.1.1"
    2_label: "Des mécanismes automatisés sont utilisés pour effectuer des examens des journaux d'audit."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les activités potentiellement suspectes ou anormales sont identifiées via un mécanisme reproductible et uniforme. \n\nℹ️ Notes D’applicabilité \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les mécanismes d'examen des journaux et interroger le personnel afin de vérifier que des mécanismes automatisés sont utilisés pour effectuer des examens de journaux. \n\nℹ️ Directives \n Objectif \n Les examens manuels des journaux sont difficiles à effectuer, même pour un ou deux systèmes, en raison de la quantité de données de journalisation générées. Cependant, l'utilisation d'outils de collecte, d'analyse et d'alerte de journaux, de systèmes centralisés de gestion de journaux, d'analyseurs d'événements de journaux et de solutions de gestion des informations de sécurité et des événements (SIEM) peut aider à faciliter le processus en identifiant les événements de journaux qui doivent être examinés.  \n\n Bonne Pratique \n L'entité doit maintenir les outils de journalisation alignés sur tout changement dans leur environnement en révisant périodiquement les paramètres des outils et en mettant à jour les paramètres pour refléter toute modification."
    3_prefix: "10.4.2"
    3_label: "Les journaux de tous les autres composants système (ceux non spécifiés dans l'exigence 10.4.1) sont examinés périodiquement."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les activités potentiellement suspectes ou anormales pour d'autres composants système (non incluses dans l'exigence 10.4.1) sont examinées conformément au risque identifié de l'entité. \n\nℹ️ Notes D’applicabilité \n Cette exigence s'applique à tous les autres composants système dans le périmètre non inclus dans l'exigence 10.4.1. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures de sécurité afin de vérifier que des processus sont définis pour examiner périodiquement les journaux de tous les autres composants système. \n\tb. Examiner les résultats documentés des examens des journaux et interroger le personnel afin de vérifier que les examens des journaux sont effectués périodiquement. \n\nℹ️ Directives \n Objectif \n L'examen périodique des journaux de tous les autres composants système (non spécifiés dans l'exigence 10.4.1) permet d'identifier les indications de problèmes potentiels ou de tentatives d'accès aux systèmes critiques via des systèmes moins critiques."
    4_prefix: "10.4.2.1"
    4_label: "La fréquence des examens périodiques des journaux pour tous les autres composants système (non définis dans l'exigence 10.4.1) est définie dans l'analyse de risques ciblée de l'entité, qui est effectuée selon tous les éléments spécifiés dans l'exigence 12.3.1"
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les examens des journaux pour les composants système à faible risque sont effectuées à une fréquence qui tient compte du risque de l'entité. \n\nℹ️ Notes D’applicabilité \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner l'analyse de risques ciblée de l'entité pour la fréquence des examens périodiques des journaux pour tous les autres composants système (non définis dans l'exigence 10.4.1) afin de vérifier que l'analyse de risques a été effectuée conformément à tous les éléments spécifiés à l'exigence 12.3.1. \n\tb. Examiner les résultats documentés des examens périodiques des journaux de tous les autres composants système (non définis dans l'exigence 10.4.1) et interroger le personnel afin de vérifier que les examens des journaux sont effectués à la fréquence spécifiée dans l'analyse de risques ciblée de l'entité effectuée pour cette exigence. \n\nℹ️ Directives \n Objectif \n Les entités peuvent déterminer la période optimale pour examiner ces journaux en fonction de critères tels que la complexité de l'environnement de chaque entité, le nombre de types de systèmes qui doivent être évalués et les fonctions de ces systèmes."
    5_prefix: "10.4.3"
    5_label: "Les exceptions et anomalies identifiées au cours du processus d'examen sont traitées."
    5_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les activités suspectes ou anormales sont traitées. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures de sécurité afin de vérifier que les processus sont définis pour traiter les exceptions et les anomalies identifiées au cours du processus d'examen. \n\tb. Observer les processus et interroger le personnel afin de vérifier que, lorsque des exceptions et des anomalies sont identifiées, elles sont traitées. \n\nℹ️ Directives \n Objectif \n Si les exceptions et les anomalies identifiées au cours du processus d'examen des journaux ne font pas l'objet d'une enquête, l'entité peut ne pas être au courant des activités non autorisées et potentiellement malveillantes se produisant au sein de son réseau. \n\n Bonne Pratique \n Les entités doivent réfléchir à la manière de traiter les éléments suivants lors de l'élaboration de leurs processus de définition et de gestion des exceptions et des anomalies : \n\t- Comment les activités d'examen des journaux sont enregistrées, \n\t- Comment classer et hiérarchiser les exceptions et anomalies, \n\t- Quelles procédures devraient être en place pour signaler et faire remonter les exceptions et les anomalies, et \n\t- Qui est responsable de l'enquête et de toute tâche de correction."
  5:
    title: "L'historique des journaux d'audit est conservé et disponible pour analyse."
    1_label: "Conserver l'historique des journaux d'audit pendant au moins 12 mois, avec au moins les trois mois les plus récents immédiatement disponibles pour analyse."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n L'historique des enregistrements d'activités sont disponibles immédiatement pour appuyer la réponse aux incidents et sont conservés pendant au moins 12 mois. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation afin de vérifier que les éléments suivants sont définis : \n\t- Des politiques de conservation des journaux d'audit. \n\t- Des procédures de conservation de l'historique du journal d'audit pendant au moins 12 mois, avec au moins les trois mois les plus récents immédiatement disponibles en ligne. \n\tb. Examiner les configurations de l'historique des journaux d'audit, interroger le personnel et examiner les journaux d'audit afin de vérifier que l'historique des journaux d'audit est conservé pendant au moins 12 mois. \n\tc. Interroger le personnel et observer les processus afin de vérifier qu'au moins l'historique des journaux d'audit des trois derniers mois est immédiatement disponible pour analyse. \n\nℹ️ Directives \n Objectif \n Il est nécessaire de conserver l'historique des journaux d'audit pendant au moins 12 mois, car les compromissions passent souvent inaperçues pendant de longues périodes. Le stockage centralisé de l'historique des journaux permet aux enquêteurs de mieux déterminer la durée pendant laquelle une violation potentielle s'est produite et le ou les systèmes possibles touchés. En disposant de trois mois de journaux immédiatement disponibles, une entité peut rapidement identifier et minimiser l'impact d'une violation des données. \n\n Exemples \n Les méthodes qui permettent aux journaux d'être immédiatement disponibles incluent le stockage des journaux en ligne, l'archivage des journaux ou la restauration rapide des journaux à partir de sauvegardes."
  6:
    title: "Les mécanismes de synchronisation temporelle prennent en charge des paramètres de temps cohérents sur tous les systèmes."
    1_label: "Les horloges système et l'heure sont synchronisées à l'aide de la technologie de synchronisation date/heure."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n La date/heure commune est établie dans tous les systèmes. \n\nℹ️ Notes D’applicabilité \n Le maintien à jour de la technologie de synchronisation date/heure comporte la gestion des vulnérabilités et la mise à jour de la technologie conformément aux exigences 6.3.1 et 6.3.3 du standard PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les paramètres de configuration du système afin de vérifier que la technologie de synchronisation date/heure est mise en œuvre et maintenue à jour. \n\nℹ️ Directives \n Objectif \n La technologie de synchronisation date/heure est utilisée pour synchroniser les horloges sur plusieurs systèmes. Lorsque les horloges ne sont pas correctement synchronisées, il peut être difficile, voire impossible, de comparer les fichiers journaux de différents systèmes et d'établir une séquence exacte d'événements, ce qui est crucial pour l'analyse criminalistique suite à une violation. \n Pour les équipes de criminalistique après incident, la précision et la cohérence date/heure sur tous les systèmes et là date/heure de chaque activité sont essentiels pour déterminer comment les systèmes ont été compromis. \n\n Exemples \n Le Network Time Protocol (NTP) est un exemple de technologie de synchronisation date/heure."
    2_label: "Les systèmes sont configurés pour l'heure correcte et cohérente comme suit : Un ou plusieurs serveurs de temps désignés utilisés; Seul le ou seuls les serveurs de temps centraux désignés reçoit l'heure de sources externes; L'heure reçue de sources externes est basée sur le temps atomique international ou le temps universel coordonné (UTC); Le ou les serveurs de temps désignés n'acceptent les mises à jour de la date/heure que de sources externes spécifiques acceptées par l'industrie; Lorsqu'il y a plus d'un serveur de temps désigné, les serveurs de temps s'échangent les uns avec les autres pour garder l'heure exacte; Les systèmes internes ne reçoivent des informations de date/heure que du ou des serveurs de temps centraux désignés."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n L'heure sur tous les systèmes est précise et uniforme. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les paramètres de configuration du système pour acquérir, distribuer et stocker l'heure correcte afin de vérifier que les paramètres sont configurés conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n L'utilisation de serveurs de temps réputés est un élément essentiel du processus de synchronisation date/heure. \n L'acceptation des mises à jour de l'heure à partir de sources externes spécifiques et acceptées par l'industrie permet d'empêcher une personne malveillante de modifier les paramètres date/heure sur les systèmes. \n\n Bonne Pratique \n Une autre option pour empêcher l'utilisation non autorisée des serveurs de temps internes consiste à chiffrer les mises à jour avec une clé symétrique et à créer des listes de contrôle d'accès qui spécifient les adresses IP des machines clientes qui seront fournies avec les mises à jour de la date/heure."
    3_label: "Les paramètres et les données de synchronisation date/heure sont protégés comme suit : L'accès aux données date/heure est limité au personnel ayant un besoin professionnel; Toute modification des paramètres horaires sur les systèmes critiques est enregistrée, surveillée et examinée."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les paramètres horaires du système ne peuvent pas être modifiés par du personnel non autorisé. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les configurations système et les paramètres de synchronisation date/heure afin de vérifier que l'accès aux données horaires est limité au personnel ayant un besoin professionnel. \n\tb. Examiner les configurations système et les paramètres et journaux de synchronisation date/heure et observer les processus afin de vérifier que toute modification périmètre aux paramètres horaires sur les systèmes critiques est enregistrée, surveillée et examinée. \n\nℹ️ Directives \n Objectif \n Les attaquants tenteront de modifier les configurations de la date/heure pour masquer leur activité. Par conséquent, limiter la possibilité de changer ou de modifier les configurations de synchronisation date/heure ou de l'heure système aux administrateurs réduira la probabilité qu'un attaquant réussisse à modifier les configurations date/heure."
  7:
    title: "Les défaillances des systèmes de contrôle de sécurité critiques sont détectées, signalées et traitées rapidement."
    1_label: " Exigences supplémentaires pour les prestataires de services uniquement : Les défaillances des systèmes de contrôle de sécurité critiques sont détectées, signalées et traitées rapidement, y compris, sans toutefois s'y limiter, les défaillances des systèmes de contrôle de sécurité critiques suivants : Les mesures de sécurité réseau; IDS/IPS; FIM; Les solutions anti-programmes malveillants; Les mesures d’accès physiques; Les mesures d’accès logiques; Les mécanismes de journalisation des audits; Les mesures de segmentation (le cas échéant) "
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les défaillances des systèmes de contrôle de sécurité critiques sont rapidement identifiées et traitées. \n\nℹ️ Notes D’applicabilité \n Cette exigence ne s'applique que lorsque l'entité évaluée est un prestataire de services. Cette exigence sera remplacée par l’exigence 10.7.2 à partir du 31 mars 2025. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Procédure de test supplémentaire pour les évaluations des prestataires de services uniquement : Examiner la documentation afin de vérifier que les processus sont définis pour la détection et la résolution rapides des défaillances des systèmes de contrôle de sécurité critiques, y compris, sans toutefois s'y limiter, la défaillance de tous les éléments spécifiés dans cette exigence. \n\tb. Procédure de test supplémentaire pour les évaluations des prestataires de services uniquement : Observer les processus de détection et d'alerte et interroger le personnel afin de vérifier que les défaillances des systèmes de contrôle de sécurité critiques sont détectées et signalées, et que la défaillance d'un contrôle de sécurité critique entraîne la génération d'une alerte. \n\nℹ️ Directives \n Objectif \n Sans processus formels pour détecter et alerter lorsque les mesures de sécurité de sécurité critiques échouent, les défaillances peuvent passer inaperçues pendant de longues périodes et donner aux attaquants suffisamment de temps pour compromettre les composants système et voler les données de carte du CDE. \n\n Bonne Pratique \n Les types spécifiques de pannes peuvent varier selon la fonction du composant système de l'appareil et de la technologie utilisée. Les défaillances typiques incluent un système cessant d'exécuter sa fonction de sécurité ou ne fonctionnant pas de la manière prévue, tel un pare-feu effaçant toutes ses règles ou se déconnectant."
    2_label: "Les défaillances des systèmes de contrôle de sécurité critiques sont détectées, signalées et traitées rapidement, y compris, sans toutefois s'y limiter, les défaillances des systèmes de contrôle de sécurité critiques suivants : Les mesures de sécurité réseau; IDS/IPS; Les mécanismes de détection des modifications; Les solutions anti-programmes malveillants; Les mesures d’accès physiques; Les mesures d’accès logiques; Les mécanismes de journalisation des audits; Les mesures de segmentation (le cas échéant); Les mécanismes d'examen des Journaux d'audit; Des outils automatisés de test de la sécurité (le cas échéant)"
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les défaillances des systèmes de contrôle de sécurité critiques sont rapidement identifiées et traitées. \n\nℹ️ Notes D’applicabilité \n Cette exigence s’applique à toutes les entités, y compris les prestataires de services, et remplacera l'exigence 10.7.1 à compter du 31 mars 2025. Elle comprend deux systèmes supplémentaires de contrôle de sécurité critiques qui ne figurent pas dans l'exigence 10.7.1. Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation afin de vérifier que les processus sont définis pour la détection et la résolution rapides des défaillances des systèmes de contrôle de sécurité critiques, y compris, sans toutefois s'y limiter, la défaillance de tous les éléments spécifiés dans cette exigence. \n\tb. Observer les processus de détection et d'alerte et interroger le personnel afin de vérifier que les défaillances des systèmes de contrôle de sécurité critiques sont détectées et signalées, et que la défaillance d'un contrôle de sécurité critique entraîne la génération d'une alerte. \n\nℹ️ Directives \n Objectif \n Sans processus formels pour détecter et alerter lorsque les mesures de sécurité de sécurité critiques échouent, les défaillances peuvent passer inaperçues pendant de longues périodes et donner aux attaquants suffisamment de temps pour compromettre les composants système et voler les données de carte du CDE. \n\n Bonne Pratique \n Les types spécifiques de pannes peuvent varier selon la fonction du composant système de l'appareil et de la technologie utilisée. Cependant, les défaillances typiques incluent un système qui n'exécute plus sa fonction de sécurité ou ne fonctionne pas comme prévu, par exemple, un pare-feu effaçant ses règles ou se déconnectant."
    3_label: "Les défaillances de tout système de contrôle de sécurité critique sont traitées rapidement, y compris, sans toutefois s'y limiter : Restauration des fonctions de sécurité; Identifier et documenter la durée (date et heure du début à la fin) de la défaillance de sécurité; Identifier et documenter la ou les causes de la défaillance et documenter les mesures correctives nécessaires; Identifier et résoudre tous les problèmes de sécurité survenus lors de la défaillance; Déterminer si d'autres mesures est nécessaires à la suite de la défaillance de sécurité; Mettre en œuvre des mesures afin d'éviter que la cause de la défaillance ne se reproduise; Reprendre la surveillance des mesures de sécurité."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les défaillances des systèmes de contrôle de sécurité critiques sont analysées, contenues et résolues, et les mesures de sécurité de sécurité sont restaurés pour minimiser l'impact. Les problèmes de sécurité qui en résultent sont traités et des mesures sont prises afin d'éviter qu'elles ne se reproduisent. \n\nℹ️ Notes D’applicabilité \n Cette exigence s'applique uniquement lorsque l'entité évaluée est un prestataire de services, jusqu'au 31 Mars 2025, après quoi cette exigence s'appliquera à toutes les entités. Il s'agit d'une exigence actuelle v3.2.1 qui s'applique uniquement aux prestataires de services. Cependant, cette exigence est une Bonne Pratique pour toutes les autres entités jusqu'au 31 mars 2025, après quoi elle sera obligatoire et devra être pleinement prise en compte lors d'une évaluation du standard PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation et interroger le personnel afin de vérifier que les processus sont définis et mis en œuvre pour répondre à une défaillance de tout système de contrôle de sécurité critique, et incluent au moins tous les éléments spécifiés dans cette exigence. \n\tb. Examiner les enregistrements afin de vérifier que les défaillances des systèmes de contrôle de sécurité critiques sont documentées pour inclure : \n\t- L'identification de la ou des causes de la défaillance. \n\t- La durée (date et heure de début et de fin) de la défaillance de sécurité. \n\t- Les détails des correctifs nécessaires pour traiter la cause profonde. \n\nℹ️ Directives \n Objectif \n Si les alertes de défaillances des systèmes de contrôle de sécurité critiques ne sont pas traitées rapidement et efficacement, les attaquants peuvent utiliser ce temps pour insérer des logiciels malveillants, prendre le contrôle d'un système ou voler des données dans l'environnement de l'entité. \n\n Bonne Pratique \n Des preuves documentées (par exemple, des enregistrements au sein d'un système de gestion des problèmes) doivent fournir un justificatif indiquant que des processus et des procédures sont en place pour répondre aux défaillances de sécurité. De plus, le personnel doit être conscient de ses responsabilités en cas de défaillance. Les actions et les réponses à l'échec doivent être consignées dans les preuves documentées."
11:
  prefix: "Exigence 11"
  title: "Tester Régulièrement la Sécurité des Systèmes et des Réseaux"
  desc: "Des vulnérabilités sont découvertes en permanence par des individus malveillants et des chercheurs, et introduites par de nouveaux logiciels. Les composants système, les processus et les logiciels faits sur mesure et personnalisés doivent être testés fréquemment afin de garantir que les mesures de sécurité de sécurité continuent de refléter un environnement en évolution. \n\n Se reporter à l'Annexe G pour les définitions des termes du standard PCI DSS."
  1:
    title: "Les processus et mécanismes pour tester régulièrement la sécurité des systèmes et des réseaux sont définis et compris."
    1_label: "Toutes les politiques de sécurité et procédures opérationnelles identifiées dans l'exigence 11 sont : Documentées; Tenues à jour; Utilisées; Connues de toutes les parties concernées."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les attentes, les mesures de sécurité et la surveillance des activités pour répondre à l'exigence 11 sont définis et respectés par le personnel concerné. Toutes les activités de soutien sont reproductibles, appliquées de manière cohérente et conformes à l'intention de la direction. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation et interroger le personnel pour vérifier que les politiques de sécurité et les procédures opérationnelles sont gérées conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n L'exigence 11.1.1 concerne la gestion et le maintien efficaces des diverses politiques et procédures spécifiées dans toute l'exigence 11. S'il est important de définir les politiques ou procédures spécifiques décrites dans l'exigence 11, il est tout aussi important de s'assurer qu'elles sont correctement documentées, maintenues et diffusées. \n\n Bonne Pratique \n Il est important de mettre à jour les politiques et les procédures au besoin pour faire face aux changements dans les processus, les technologies et les objectifs métier. Pour cette raison, envisager de mettre à jour ces documents, non seulement, de manière périodique mais aussi dès que possible après un changement. \n\n Définitions \n Les politiques de sécurité définissent les objectifs et les principes de sécurité de l'entité. Les procédures opérationnelles décrivent la façon d'exécuter les activités et définissent les mesures de sécurité, les méthodes et les processus qui sont suivis pour atteindre le résultat désiré de manière cohérente et conformément aux objectifs de la politique."
    2_label: "Les rôles et les responsabilités liées aux activités de l'exigence 11 sont documentés, attribués et compris."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les responsabilités quotidiennes pour l'exécution de toutes les activités de l'exigence 11 sont attribuées. Le personnel est responsable du bon fonctionnement continu ces exigences. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation pour vérifier que la description des rôles et des responsabilités pour l'exécution des activités de l'exigence 11 sont documentées et attribuées. \n\tb. Interroger le personnel responsable de l'exécution des activités de l'exigence 11 afin de vérifier que les rôles et les responsabilités sont attribués ainsi que documentés et sont compris. \n\nℹ️ Directives \n Objectif \n Si les rôles et les responsabilités ne sont pas officiellement attribués, le personnel pourrait ne pas être conscient de ses responsabilités quotidiennes et des activités critiques peuvent ne pas avoir lieu. \n\n Bonne Pratique \n Les rôles et les responsabilités peuvent être documentés dans des politiques et procédures, ou conservés dans des documents séparés. \n Dans le cadre de la communication des rôles et des responsabilités, les entités peuvent envisager de demander au personnel de reconnaître leur acceptation et leur compréhension des rôles et responsabilités qui leur sont attribués. \n\n Exemples \n Une méthode pour documenter les rôles et les obligations est une matrice d'attribution des responsabilités qui indique qui est responsable, redevable, consulté et informé (également appelée matrice RACI)."
  2:
    title: "Les points d'accès sans fil sont identifiés et surveillés, et les points d'accès sans fil non autorisés sont traités."
    1_label: "Les points d'accès sans fil autorisés et non autorisés sont gérés de la manière suivante : La présence de points d'accès sans fil (Wi-Fi) est testée; Tous les points d'accès sans fil autorisés et non autorisés sont détectés et identifiés; Les tests, la détection et l'identification sont effectués au moins une fois tous les trois mois; Si une surveillance automatisée est utilisée, le personnel doit être averti via la génération d’alertes."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les points d'accès sans fil non autorisés sont identifiés et traités périodiquement. \n\nℹ️ Notes D’applicabilité \n L'exigence s'applique même lorsqu'il existe une politique interdisant l'utilisation de la technologie sans fil, car les attaquants ne lisent pas et ne suivent pas la politique de l'entreprise. \n Les méthodes utilisées pour satisfaire à cette exigence doivent être suffisantes pour détecter et identifier à la fois les appareils autorisés et non autorisés, y compris les appareils non autorisés qui se connectent à des appareils eux-mêmes autorisés \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et les procédures afin de vérifier que les processus sont définis pour gérer les points d'accès sans fil autorisés et non autorisés avec tous les éléments spécifiés dans cette exigence. \n\tb. Examiner la ou les méthodologies utilisées et la documentation qui en découle, et interroger le personnel afin de vérifier que les processus sont définis pour détecter et identifier les points d'accès sans fil autorisés et non autorisés conformément à tous les éléments spécifiés dans la cette exigence. \n\tc. Examiner le résultat des évaluations du réseau sans fil et interroger le personnel afin de vérifier que les évaluations du réseau sans fil ont été menées conformément à tous les éléments spécifiés dans cette exigence. \n\td. Si la surveillance automatisée est utilisée, examiner les paramètres de configuration afin de vérifier que la configuration générera des alertes pour aviser le personnel. \n\nℹ️ Directives \n Objectif \n La mise en œuvre et/ou l'exploitation de la technologie sans fil au sein d'un réseau sont des voies habituelles permettant aux utilisateurs malveillants d'accéder sans autorisation au réseau et aux données des titulaires de cartes. Des dispositifs sans fil non autorisés peuvent être masqués ou connectés à un ordinateur ou à un autre composant système. Ces appareils peuvent également être connectés directement à un port réseau, à un périphérique réseau tel qu'un commutateur ou un routeur, ou insérés en tant que carte d'interface sans fil au sein d'un composant système. \n Si un appareil ou un réseau sans fil est installé à l'insu d'une entreprise, il peut permettre à un attaquant d'accéder au réseau aisément et « de manière invisible ». La détection et l'élimination de ces points d'accès non autorisés réduisent la durée et la probabilité que ces périphériques soient exploités en vue d'une attaque. \n\n Bonne Pratique \n La taille et la complexité d'un environnement dicteront les outils et processus appropriés à utiliser afin de fournir une garantie suffisante qu'un point d'accès sans fil malveillant n'a pas été installé dans l'environnement. \n Par exemple, l'exécution d'une inspection physique détaillée d'un seul kiosque de vente au détail autonome dans un centre commercial, dans lequel tous les composants de communication sont contenus dans des boîtiers inviolables, peut être suffisante pour garantir qu'un point d'accès sans fil malveillant n'a pas été raccordé ou installé. \n Cependant, dans un environnement avec plusieurs points d’accès (tel que dans un grand magasin de détail, un centre d'appels, une salle de serveurs ou un centre de données), une inspection physique détaillée peut s’avérer difficile. Dans ce cas, plusieurs méthodes peuvent être combinées, telles que la réalisation d'inspections physiques du système en conjonction avec les résultats d'un analyseur de réseau sans fil. \n\n Définitions \n Ceci est également appelé détection des points d'accès non autorisés. \n\n Exemples \n Les méthodes pouvant être utilisées incluent, sans toutefois s'y limiter, les analyses de réseau sans fil, les inspections physiques/logiques des composants et de l'infrastructure du système, le contrôle d'accès au réseau (NAC) ou le système IDS/IPS pour réseau sans fil. Les systèmes NAC et IDS/IPS sans fil sont des exemples d'outils de surveillance automatisés."
    2_label: "Un inventaire des points d'accès sans fil autorisés est conservé, y compris une justification métier documentée."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les points d'accès sans fil non autorisés ne sont pas confondus avec les points d'accès sans fil autorisés. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation afin de vérifier qu'un inventaire des points d'accès sans fil autorisés est maintenu et qu'une justification métier est documentée pour tous les points d'accès sans fil autorisés. \n\nℹ️ Directives \n Objectif \n Un inventaire des points d'accès sans fil autorisés peut aider les administrateurs à réagir rapidement lorsque des points d'accès sans fil non autorisés sont détectés. Cela permet de minimiser de manière proactive l'exposition du CDE à des personnes malveillantes. \n\n Bonne Pratique \n Dans le cas d'utilisation d'un scanner sans fil, il est tout aussi important d'avoir une liste définie de points d'accès connus qui, bien qu'ils ne soient pas connectés au réseau de l'entreprise, seront généralement détectés lors d'un scan. Ces appareils n'appartenant pas à l'entreprise se trouvent souvent dans des immeubles mutualisés ou des entreprises situées à proximité les unes des autres. Cependant, il est important de vérifier que ces appareils ne sont pas connectés au port réseau de l'entité ou via un autre appareil connecté au réseau et qu'ils reçoivent un SSID ressemblant à une entreprise à proximité. Les résultats de l'analyse doivent noter ces appareils et la manière dont il a été déterminé que ces appareils pouvaient être « ignorés ». De plus, la détection de tout point d'accès sans fil non autorisé qui est considéré comme une menace pour le CDE doit être gérée conformément au plan de réponse aux incidents de l'entité conformément à l'exigence 12.10.1."
  3:
    title: "Les vulnérabilités externes et internes sont régulièrement identifiées, priorisées et traitées."
    1_label: "Les scans de vulnérabilités internes sont effectuées comme suit : Au moins une fois tous les trois mois; Les vulnérabilités à haut risque et critiques (selon les classements de risque des vulnérabilités de l'entité définis à l'exigence 6.3.1) sont résolues; Des rescans sont effectués pour confirmer que toutes les vulnérabilités à haut risque et critiques, comme indiqué ci-dessus, ont été résolues; L'outil de scan est tenu à jour avec les dernières informations sur les vulnérabilités; Les scans sont effectués par du personnel qualifié et l'indépendance organisationnelle du testeur existe."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n La posture de sécurité de tous les composants système est vérifiée périodiquement à l'aide d'outils automatisés conçus pour détecter les vulnérabilités opérant à l'intérieur du réseau. Les vulnérabilités détectées sont évaluées et rectifiées sur la base d'un cadre formel d'évaluation des risques. \n\nℹ️ Notes D’applicabilité \n Il n'est pas demandé d'utiliser un QSA ou un ASV pour effectuer des scans de vulnérabilité internes. \n Les scans de vulnérabilités internes peuvent être effectués par du personnel interne qualifié qui est raisonnablement indépendant du ou des composants système analysés (par exemple, un administrateur réseau ne devrait pas être responsable des scans du réseau), ou une entité peut choisir d'avoir des analyses de vulnérabilités internes effectuées par une société spécialisée dans le scan des vulnérabilités. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner le résultat des rapports de scans internes des 12 derniers mois afin de vérifier que les scans internes ont eu lieu au moins une fois tous les trois mois au cours de la période de 12 mois la plus récente. \n\tb. Examiner les résultats du rapport de scans internes de chaque scan et scan de vérification exécutés au cours des 12 derniers mois afin de vérifier que toutes les vulnérabilités à haut risque et critiques (identifiées dans l'exigence 6.3.1 du standard PCI DSS) sont résolues. \n\tc. Examiner les configurations de l'outil de scan et interroger le personnel afin de vérifier que l'outil d'analyse est tenu à jour avec les dernières définitions des vulnérabilités. \n\td. Interroger le personnel responsable afin de vérifier que le scan a été effectué par une ou plusieurs ressources internes qualifiées ou un tiers externe qualifié et que l'indépendance organisationnelle du testeur existe. \n\nℹ️ Directives \n Objectif \n L'identification et la résolution des vulnérabilités réduisent rapidement la probabilité qu'une vulnérabilité soit exploitée et la compromission potentielle d'un composant système ou des données des titulaires de cartes. Des scans de vulnérabilité menées au moins tous les trois mois permettent cette détection et cette identification. \n\n Bonne Pratique \n Les vulnérabilités posant le plus grand risque pour l'environnement (par exemple, classées élevées ou critiques conformément à l'exigence 6.3.1) doivent être résolues avec la plus haute priorité. \n Plusieurs rapports de scans peuvent être combinés pour le processus de test trimestriel afin de montrer que tous les systèmes ont été scannés et que toutes les vulnérabilités applicables ont été corrigées dans le cadre du cycle trimestriel d'analyse des vulnérabilités. \n Cependant, une documentation supplémentaire peut être requise afin de vérifier que les vulnérabilités non corrigées sont en cours de résolution. \n Bien que des scans soient obligatoires au moins une fois tous les trois mois, des scans plus fréquents sont recommandés en fonction de la complexité du réseau, de la fréquence des modifications et des types d'appareils, de logiciels et de systèmes d'exploitation utilisés. \n\n Définitions \n Un scan des vulnérabilités est une combinaison d'outils, de techniques et/ou de méthodes automatisés exécutés sur des périphériques et des serveurs externes et internes, conçue pour exposer les vulnérabilités potentielles dans les applications, les systèmes d'exploitation et les périphériques réseau qui pourraient être trouvés et exploités par des personnes malveillantes."
    2_prefix: "11.3.1.1"
    2_label: "Toutes les autres vulnérabilités applicables (celles qui ne sont pas classées comme à haut risque ou critiques (selon les classements de risque de vulnérabilité de l'entité définis à l'exigence 6.3.1) sont gérées comme suit : Traitées sur la base du risque défini dans l'analyse de risque ciblée de l'entité, qui est effectuée selon tous les éléments spécifiés dans l'exigence 12.3.1; Des scans de vérification sont effectués si besoin."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les vulnérabilités classées plus faibles (inférieur à élever ou critique) sont traitées à une fréquence conforme au risque de l'entité. \n\nℹ️ Notes D’applicabilité \n Le délai pour traiter les vulnérabilités à faible risque est soumis aux résultats d'une analyse de risques conformément à l'exigence 12.3.1 qui comprend (au minimum) l'identification des actifs protégés, des menaces et de la probabilité qu'une menace soit réalisée et/ou de son impact si elle est réalisée. \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner l'analyse de risque ciblée de l'entité qui définit le risque pour traiter toutes les autres vulnérabilités applicables (celles qui ne sont pas classées comme à haut risque ou critiques selon les classements du risque des vulnérabilités de l'entité à l'exigence 6.3.1) afin de vérifier que l'analyse de risques a été effectuée conformément à tous les éléments spécifiés à l'exigence 12.3.1. \n\tb. Interroger le personnel responsable et examiner les résultats du rapport de scan interne ou d'autres documents afin de vérifier que toutes les autres vulnérabilités applicables (celles qui ne sont pas classées comme à haut risque ou critiques selon le classement du risque des vulnérabilités de l'entité à l'exigence 6.3.1) sont traitées en fonction du risque défini dans l'analyse de risque ciblée de l'entité, et que le processus de scan comprend des scans de vérification si besoin pour confirmer que les vulnérabilités ont été corrigées. \n\nℹ️ Directives \n Objectif \n Toutes les vulnérabilités, quelle que soit leur criticité, constituent une voie d'attaque potentielle et doivent donc être corrigées périodiquement, les vulnérabilités les plus exposées au risque étant traitées plus rapidement pour limiter la fenêtre potentielle d'attaque."
    3_prefix: "11.3.1.2"
    3_label: "Les scans de vulnérabilité internes sont effectués via un scan authentifié comme suit : Les systèmes qui ne peuvent pas accepter les « credentials » pour le scan authentifié sont documentés; Des privilèges suffisants sont utilisés pour les systèmes qui acceptent les « credentials » pour le scan; Si les comptes utilisés pour le scan authentifié peuvent être utilisés pour la connexion interactive, ils sont gérés conformément à l'exigence 8.2.2."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les outils automatisés utilisés pour détecter les vulnérabilités peuvent détecter les vulnérabilités locales à chaque système, qui ne sont pas visibles à distance. \n\nℹ️ Notes D’applicabilité \n Les outils de scan authentifiés peuvent être basés sur l'hôte ou sur le réseau. \n Les privilèges « suffisants » sont ceux qui sont nécessaires pour accéder aux ressources système afin qu'un scan approfondi puisse être effectué pour détecter les vulnérabilités connues. \n Cette exigence ne s'applique pas aux composants système qui ne peuvent pas accepter les informations d'identification pour le scan. Des exemples de systèmes qui peuvent ne pas accepter les informations d'identification pour le scan comportent certains appareils réseau et de sécurité, les serveurs principaux et les conteneurs. \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les configurations de l'outil de scan afin de vérifier que le scan authentifié est utilisé pour les scans internes, avec des privilèges suffisants, pour les systèmes qui acceptent les informations d'identification pour le scan. \n\tb. Examiner les résultats du rapport de scan et interroger le personnel afin de vérifier que les scans authentifiés sont effectués. \n\tc. Si les comptes utilisés pour le scan authentifié peuvent être utilisés pour une connexion interactive, examiner les comptes et interroger le personnel afin de vérifier que les comptes sont gérés conformément à tous les éléments spécifiés dans l'exigence 8.2.2. \n\td. Examiner la documentation afin de vérifier que les systèmes qui ne sont pas en mesure d’accepter les « credentials » pour le scan authentifié sont définis. \n\nℹ️ Directives \n Objectif \n Le scan authentifié fournit un meilleur aperçu du paysage des vulnérabilités d'une entité, car il peut détecter des vulnérabilités que les scans non authentifiés ne peuvent pas détecter. Les attaquants peuvent exploiter des vulnérabilités dont une entité n'a pas connaissance, car certaines vulnérabilités ne seront détectées qu'avec un scan authentifié. \n Le scan authentifié peut fournir d'autres informations importantes sur les vulnérabilités d'une entreprise. \n\n Bonne Pratique \n Les informations d'identification utilisées pour ces scans doivent être considérées comme hautement sensibles. Elles doivent être protégées et contrôlées en tant que telles, conformément aux exigences 7 et 8 du standard PCI DSS (à l'exception des exigences relatives à l'authentification à plusieurs facteurs et aux comptes d'applications et système)."
    4_prefix: "11.3.1.3"
    4_label: "Les scans de vulnérabilités internes sont effectués après toute modification importante comme suit : Les vulnérabilités à haut risque et critiques (selon les classements de risque des vulnérabilités de l'entité définis à l'exigence 6.3.1) sont résolues; Des scans de vérification sont effectués au besoin; Les scans sont effectués par du personnel qualifié et l'indépendance organisationnelle du testeur existe (il n'est pas nécessaire qu'il soit un QSA ou un ASV)."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n La posture de sécurité de tous les composants système est vérifiée à la suite de modifications importantes apportées au réseau ou aux systèmes, à l'aide d'outils automatisés conçus pour détecter les vulnérabilités opérant à l'intérieur du réseau. Les vulnérabilités détectées sont évaluées et corrigées sur la base d'un cadre formel d'évaluation des risques. \n\nℹ️ Notes D’applicabilité \n Le scan de vulnérabilités internes authentifiés conformément à l'exigence 11.3.1.2 n'est pas nécessaire pour les analyses effectuées après des modifications importantes. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation de contrôle des modifications et les rapports de scans internes afin de vérifier que les composants système ont été analysés après toute modification importante. \n\tb. Interroger le personnel et examiner les rapports de scans et de scans de vérification internes afin de vérifier que les analyses internes ont été effectués après des modifications importantes et que les vulnérabilités à haut risque et critiques telles que définies dans l'exigence 6.3.1 ont été résolues. \n\tc. Interroger le personnel afin de vérifier que les scans internes sont effectués par une ou des ressources internes qualifiées ou un tiers externe qualifié et que l'indépendance organisationnelle du testeur existe. \n\nℹ️ Directives \n Objectif \n Le scan d'un environnement après toute modification importante garantit que les modifications ont été effectuées de manière appropriée, de sorte que la sécurité de l'environnement n'a pas été compromise en raison de la modification. \n\n Bonne Pratique \n Les entités doivent effectuer des scans après des modifications importantes dans le cadre du processus de modification conformément à l'exigence 6.5.2 et avant de considérer que la modification est terminée. Tous les composants systèmes touchés par la modification devront être analysés."
    5_prefix: "11.3.2"
    5_label: "Les scans de vulnérabilités externes sont effectués comme suit : Au moins une fois tous les trois mois; Par un fournisseur de scan de vulnérabilités agréé PCI SSC (ASV); Les vulnérabilités sont résolues et les exigences du guide du programme de l'ASV pour un scan réussi sont respectées; Des scans de vérification sont effectués si besoin pour confirmer que les vulnérabilités sont résolues conformément aux exigences du guide du programme de l'ASV pour un scan réussi."
    5_desc: "ℹ️ Objectif de L’approche Personnalisée \n L’approche personnalisée n’est pas applicable à cette exigence \n\nℹ️ Notes D’applicabilité \n Pour la conformité initiale au standard PCI DSS, il n'est pas nécessaire que quatre scans réussis soient effectués dans les 12 mois si l'auditeur vérifie que : 1) le résultat du scan le plus récent était un scan réussi, 2) l'entité a des politiques et des procédures documentées exigeant un scan au moins une fois tous les trois mois, et 3) les vulnérabilités trouvées dans les résultats du scan ont été corrigées comme indiqué dans une ou plusieurs nouvelles analyses. \n Cependant, pour les années suivantes après l'évaluation initiale du standard PCI DSS, des scans réussis au moins tous les trois mois doivent avoir eu lieu. \n Les outils de scan de l'ASV peuvent scanner une vaste gamme de types de réseaux et de topologies. Tous les détails concernant l'environnement cible (par exemple, les équilibreurs de charge, les fournisseurs tiers, les Fournisseurs d’Accès Internet, les configurations spécifiques, les protocoles utilisés, les interférences d'analyse) doivent être réglés entre l'ASV et l‘entité. \n Se référer au guide du programme de l'ASV publié sur le site Web du PCI SSC afin de connaître les responsabilités du consommateur de l'analyse, la préparation de l'analyse, etc. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les rapports de scans de l'ASV des 12 derniers mois afin de vérifier que les scans de vulnérabilité externes ont eu lieu au moins une fois tous les trois mois au cours de la période de 12 mois la plus récente. \n\tb. Examiner le rapport de scans de l'ASV de chaque scan et scans de vérification exécutés au cours des 12 derniers mois afin de vérifier que les vulnérabilités sont résolues et que les exigences du guide du programme de l'ASV pour un scan réussi sont respectées. \n\tc. Examiner les rapports de scans de l'ASV afin de vérifier que les scans ont été effectués par un fournisseur de scans de vulnérabilité agréé PCI SSC (ASV). \n\nℹ️ Directives \n Objectif \n Les attaquants recherchent régulièrement des serveurs externes non « patchés » ou vulnérables, qui peuvent être exploités pour lancer une attaque dirigée. Les entreprises doivent s'assurer que ces appareils externes sont régulièrement scans afin de détecter les faiblesses et que les vulnérabilités soient corrigées ou résolues pour protéger l'entité. \n Étant donné que les réseaux externes courent un plus grand risque de compromission, les scans de vulnérabilités externes doivent être effectués au moins une fois tous les trois mois par un fournisseur de scan de vulnérabilités agréé PCI SSC (ASV). \n\n Bonne Pratique \n Bien que des scans soient requis au moins une fois tous les trois mois, des scans plus fréquents sont recommandés en fonction de la complexité du réseau, de la fréquence des modifications et des types d'appareils, de logiciels et de systèmes d'exploitation utilisés. \n Plusieurs rapports de scans peuvent être combinés pour montrer que tous les systèmes ont été analysés et que toutes les vulnérabilités applicables ont été résolues dans le cadre du cycle trimestriel de scans des vulnérabilités. Cependant, une documentation supplémentaire peut être requise afin de vérifier que les vulnérabilités non corrigées sont en cours de résolution."
    6_prefix: "11.3.2.1"
    6_label: "Les scans de vulnérabilités externes sont effectués après toute modification importante comme suit : Les vulnérabilités trouvées avec un CVSS égal à 4.0 ou plus sont résolues; Des scans de vérification sont effectués si besoin; Les scans sont effectués par du personnel qualifié et l'indépendance organisationnelle du testeur existe (il n'est pas nécessaire qu'il soit un QSA ou un ASV)."
    6_desc: "ℹ️ Objectif de L’approche Personnalisée \n La posture de sécurité de tous les composants système est vérifiée à la suite de modifications importantes du réseau ou des systèmes, à l'aide d'outils conçus pour détecter les vulnérabilités opérant depuis l'extérieur du réseau. Les vulnérabilités détectées sont évaluées et rectifiées sur la base d'un cadre formel d'évaluation des risques. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation de contrôle des changements et les rapports de scans externes afin de vérifier que les composants système ont été analysés après toute modification importante. \n\tb. Interroger le personnel et examiner les rapports de scans et de rescans externes afin de vérifier que les scans externes ont été effectués après des modifications importantes et que les vulnérabilités trouvées avec un CVSS égal à 4.0 ou plus ont été résolues. \n\tc. Interroger le personnel afin de vérifier que les scans externes sont effectués par une ou des ressources internes qualifiée(s) ou un tiers externe qualifié et que l'indépendance organisationnelle du testeur existe. \n\nℹ️ Directives \n Objectif \n Le scan de vulnérabilités d'un environnement après toute modification importante garantit que les modifications ont été effectuées de manière appropriée, de sorte que la sécurité de l'environnement n'a pas été compromise en raison de la modification. \n\n Bonne Pratique \n Les entités doivent inclure la nécessité d'effectuer des scans de vulnérabilités après des modifications importantes dans le cadre du processus de modification et avant que la modification ne soit considérée comme terminée. Tous les composants systèmes touchés par la modification devront être analysés."
  4:
    title: "Des tests d’intrusion externes et internes sont effectués régulièrement, les vulnérabilités exploitables et les faiblesses de sécurité sont corrigées."
    1_label: "Une méthodologie de test d'intrusion est définie, documentée et mise en œuvre par l'entité, et comprend : Des approches de test d'intrusion acceptées par l'industrie; Une couverture de l'ensemble du périmètre du CDE et des systèmes critiques; Des tests à la fois à l'intérieur et à l'extérieur du réseau; Des tests pour valider les mesures de segmentation et de réduction du périmètre; Des tests d'intrusion de la couche application pour identifier, au minimum, les vulnérabilités répertoriées dans l'exigence 6.2.4; Des tests d'intrusion de la couche réseau qui englobent tous les composants prenant en charge les fonctions réseau ainsi que les systèmes d'exploitation; L’examen et la prise en compte des menaces et des vulnérabilités rencontrées au cours des 12 derniers mois; Une approche documentée pour évaluer et traiter le risque posé par les vulnérabilités exploitables et les faiblesses de sécurité détectées lors des tests d'intrusion; La conservation des résultats des tests d'intrusion et des activités de correction pendant au moins 12 mois."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Une méthodologie formelle est définie pour des tests techniques approfondis qui tentent d'exploiter les vulnérabilités et les faiblesses de sécurité via des méthodes d'attaque simulées par un attaquant manuel compétent. \n\nℹ️ Notes D’applicabilité \n Les tests à l'intérieur du réseau (ou « tests d'intrusion internes ») signifient des tests à la fois à l'intérieur du CDE et vers le CDE à partir de réseaux internes fiables et non fiables. \n Les tests depuis l'extérieur du réseau (ou test de pénétration « externe » » signifie tester le périmètre externe exposé des réseaux de confiance et des systèmes critiques connectés ou accessibles aux infrastructures de réseau public. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation et interroger le personnel afin de vérifier que la méthodologie des tests d'intrusion définie, documentée et mise en œuvre par l'entité comprend tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Les attaquants passent beaucoup de temps à rechercher des vulnérabilités externes et internes à exploiter pour accéder aux données des titulaires de cartes, pour ensuite exfiltrer ces données. En tant que telles, les entités doivent tester leurs réseaux de manière approfondie, tout comme le ferait un attaquant. Ce test permet à l'entité d'identifier et de corriger les faiblesses qui pourraient être exploitées pour compromettre le réseau et les données de l'entité, puis de prendre les mesures appropriées pour protéger le réseau et les composants système contre de telles attaques. \n\n Bonne Pratique \n Les techniques de test d'intrusion différeront en fonction des besoins et de la structure d'une entreprise et devraient être adaptées à l'environnement testé. Par exemple, les tests à données aléatoires (fuzzing), d'injection et falsification de données peuvent être appropriés. Le type, la profondeur et la complexité des tests dépendront de l'environnement spécifique et des besoins de l'entreprise. \n\n Définitions \n Les tests d'intrusion simulent une situation d'attaque réelle dans le but d'identifier jusqu'où un attaquant pourrait s'introduire dans un environnement, en fonction des différentes quantités d'informations fournies au testeur. Cela permet à une entité de mieux comprendre son exposition potentielle et de développer une stratégie pour se défendre contre les attaques. Un test d'intrusion diffère d'une analyse de vulnérabilité, car un test d'intrusion est un processus actif qui inclut généralement l'exploitation des vulnérabilités identifiées. \n Le scan de vulnérabilités seul n'est pas un test d'intrusion, et un test d'intrusion n'est pas non plus adéquat si l'objectif est uniquement d'essayer d'exploiter les vulnérabilités trouvées dans une analyse de vulnérabilité. La réalisation d'une analyse de vulnérabilité peut être l'une des premières étapes, mais ce n'est pas la seule étape qu'un testeur d'intrusion effectuera pour planifier la stratégie de test. Même si une analyse de vulnérabilités ne détecte pas les vulnérabilités connues, le testeur d'intrusion obtiendra souvent suffisamment de connaissances sur le système pour identifier d'éventuelles failles de sécurité. \n Les tests d'intrusion sont un processus hautement manuel. Bien que certains outils automatisés puissent être utilisés, le testeur utilise sa connaissance des systèmes pour accéder à un environnement. Souvent, le testeur enchaîne plusieurs types d'exploitations dans le but de percer les couches de défenses. Par exemple, si le testeur trouve un moyen d'accéder à un serveur d'applications, le testeur utilisera alors le serveur compromis comme point pour lancer une nouvelle attaque basée sur les ressources auxquelles le serveur a accès. De cette façon, un testeur peut simuler les techniques utilisées par un attaquant pour identifier les zones de faiblesse potentielles dans l'environnement. Le test des méthodes de surveillance et de détection de la sécurité, par exemple pour confirmer l'efficacité des mécanismes de journalisation et de surveillance de l'intégrité des fichiers, doit également être envisagé. \n\n Informations Complémentaires \n Se référer au Complément d'informations : Information Supplement: Penetration Testing Guidance pour des conseils supplémentaires. \n Des approches de test d'intrusion acceptées par l'industrie comportent : \n The Open Source Security Testing Methodology and Manual (OSSTMM) \n Open Web Application Security Project (OWASP) penetration testing programs."
    2_label: "Un test d'intrusion interne est effectué : Selon la méthodologie définie par l'entité; Au moins une fois tous les 12 mois.; Après toute mise à niveau ou modification importante d'une infrastructure ou d'une application; Par une ressource interne qualifiée ou un tiers externe qualifié; L'indépendance organisationnelle du testeur existe (il n'est pas nécessaire qu'il soit un QSA ou un ASV)."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les défenses internes du système sont vérifiées par des tests techniques conformément à la méthodologie définie par l'entité aussi souvent que nécessaire afin de faire face aux attaques et menaces nouvelles et évolutives, et de garantir que des modifications importantes n'introduisent pas de vulnérabilités inconnues. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la périmètre des travaux et les résultats du test d'intrusion interne le plus récent afin de vérifier que les tests d'intrusion sont effectués conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Interroger le personnel afin de vérifier que le test d'intrusion interne a été effectué par une ressource interne qualifiée ou un tiers externe qualifié et que l'indépendance organisationnelle du testeur existe (il n'est pas nécessaire qu'il soit un QSA ou un ASV). \n\nℹ️ Directives \n Objectif \n Les tests d'intrusion internes ont deux objectifs. D'abord, tout comme un test d'intrusion externe, il découvre des vulnérabilités et des erreurs de configuration qui pourraient être utilisées par un attaquant qui a réussi à obtenir un certain degré d'accès au réseau interne, que ce soit parce que l'attaquant est un utilisateur autorisé menant des activités non autorisées, ou un attaquant externe qui avait réussi à pénétrer dans le périmètre de l'entité. \n Deuxièmement, les tests d'intrusion internes aident également les entités à découvrir où leur processus de contrôle des modifications a échoué en détectant des systèmes auparavant inconnus. De plus, il vérifie l'état de la plupart des mesures de sécurité opérant au sein du CDE. \n Un test d'intrusion n'est pas vraiment un « test » car le résultat d'un test d'intrusion n'est pas quelque chose qui peut être classé comme une « réussite » ou un « échec ». Le meilleur résultat d'un test est un catalogue de vulnérabilités et de mauvaises configurations qu'une entité ne connaissait pas et que le testeur d'intrusion a trouvées avant qu'un attaquant ne puisse le faire. Un test d'intrusion qui n'a rien trouvé est généralement révélateur de lacunes du testeur d'intrusion, plutôt qu’un reflet positif de la posture de sécurité de l'entité. \n\n Bonne Pratique \n Voici quelques considérations lors du choix d'une ressource qualifiée pour effectuer des tests d'intrusion : \n\t- Des certifications de tests d'intrusion spécifiques, qui peuvent être une indication du niveau de compétence et de connaissances du testeur \n Une expérience antérieure dans la conduite de tests d'intrusion - par exemple, le nombre d'années d'expérience, ainsi que le type et le périmètre des missions précédentes peuvent aider à confirmer si l'expérience du testeur est adaptée aux besoins de la mission."
    3_label: "Un test d'intrusion externe est effectué : Selon la méthodologie définie par l'entité; Au moins une fois tous les 12 mois; Après toute mise à niveau ou modification importante d'une infrastructure ou d'une application; Par une ressource interne qualifiée ou un tiers externe qualifié; L'indépendance organisationnelle du testeur existe (il n'est pas nécessaire qu'il soit un QSA ou un ASV). \n\n Informations Complémentaires \n Se réferer au document : the Information Supplement: Penetration Testing Guidance sur le site Web du PCI SSC pour obtenir des conseils supplémentaires."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les défenses internes du système sont vérifiées par des tests techniques conformément à la méthodologie définie par l'entité aussi souvent que nécessaire afin de faire face aux attaques et menaces nouvelles et évolutives, et de garantir que des modifications importantes n'introduisent pas de vulnérabilités inconnues. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la périmètre des travaux et les résultats du test d'intrusion interne le plus récent afin de vérifier que les tests d'intrusion sont effectués conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Interroger le personnel afin de vérifier que le test d'intrusion interne a été effectué par une ressource interne qualifiée ou un tiers externe qualifié et que l'indépendance organisationnelle du testeur existe (il n'est pas nécessaire qu'il soit un QSA ou un ASV). \n\nℹ️ Directives \n Objectif \n Les tests d'intrusion internes ont deux objectifs. D'abord, tout comme un test d'intrusion externe, il découvre des vulnérabilités et des erreurs de configuration qui pourraient être utilisées par un attaquant qui a réussi à obtenir un certain degré d'accès au réseau interne, que ce soit parce que l'attaquant est un utilisateur autorisé menant des activités non autorisées, ou un attaquant externe qui avait réussi à pénétrer dans le périmètre de l'entité. \n Deuxièmement, les tests d'intrusion internes aident également les entités à découvrir où leur processus de contrôle des modifications a échoué en détectant des systèmes auparavant inconnus. De plus, il vérifie l'état de la plupart des mesures de sécurité opérant au sein du CDE. \n Un test d'intrusion n'est pas vraiment un « test » car le résultat d'un test d'intrusion n'est pas quelque chose qui peut être classé comme une « réussite » ou un « échec ». Le meilleur résultat d'un test est un catalogue de vulnérabilités et de mauvaises configurations qu'une entité ne connaissait pas et que le testeur d'intrusion a trouvées avant qu'un attaquant ne puisse le faire. Un test d'intrusion qui n'a rien trouvé est généralement révélateur de lacunes du testeur d'intrusion, plutôt qu’un reflet positif de la posture de sécurité de l'entité. \n\n Bonne Pratique \n Voici quelques considérations lors du choix d'une ressource qualifiée pour effectuer des tests d'intrusion : \n\t- Des certifications de tests d'intrusion spécifiques, qui peuvent être une indication du niveau de compétence et de connaissances du testeur \n Une expérience antérieure dans la conduite de tests d'intrusion - par exemple, le nombre d'années d'expérience, ainsi que le type et le périmètre des missions précédentes peuvent aider à confirmer si l'expérience du testeur est adaptée aux besoins de la mission."
    4_label: "Les vulnérabilités exploitables et les faiblesses de sécurité détectées lors des tests d'intrusion sont corrigées comme suit : Conformément à l'évaluation par l'entité du risque posé par le problème de sécurité tel que défini dans l'exigence 6.3.1; Les tests d'intrusion sont répétés pour vérifier les corrections."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les vulnérabilités et les faiblesses de sécurité découvertes lors de la vérification des défenses du système sont minimisées. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les résultats des tests d'intrusion afin de vérifier que les vulnérabilités exploitables et les faiblesses de sécurité notées ont été corrigées conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Les résultats d'un test d'intrusion sont généralement une liste hiérarchisée de vulnérabilités découvertes par l'exercice. Souvent, un testeur a enchaîné un certain nombre de vulnérabilités pour compromettre un composant système. La correction des vulnérabilités découvertes par un test d'intrusion réduit considérablement la probabilité que les mêmes vulnérabilités soient exploitées par un attaquant malveillant. \n L'utilisation du processus d'évaluation des risques de vulnérabilité de l'entité (voir l'exigence 6.3.1) garantit que les vulnérabilités qui présentent le risque le plus élevé pour l'entité seront corrigées plus rapidement. \n\n Bonne Pratique \n Dans le cadre de l'évaluation des risques par l'entité, les entités doivent examiner la probabilité d'exploiter la vulnérabilité et s'il existe d'autres mesures de sécurité dans l'environnement pour réduire le risque. \n Toute faiblesse indiquant que les exigences du standard PCI DSS ne sont pas respectées doit être corrigée."
    5_label: "Si la segmentation est utilisée pour isoler le CDE des autres réseaux, des tests d'intrusion sont effectués sur les mesures de sécurité de segmentation comme suit : Au moins une fois tous les 12 mois et après toute modification des mesures ou méthodes de segmentation; Couvrir toutes les mesures ou méthodes de segmentation utilisée; Conformément à la méthodologie des tests d'intrusion définie par l'entité; Confirmer que les mesures ou méthodes de segmentation sont opérationnels et efficaces, et isolent le CDE de tous les systèmes hors du périmètre; Confirmer l'efficacité de toute utilisation de l'isolement pour séparer les systèmes avec des niveaux de sécurité différents (voir l'exigence 2.2.3); Effectués par une ressource interne qualifiée ou un tiers externe qualifié; L'indépendance organisationnelle du testeur existe (il n'est pas nécessaire qu'il soit un QSA ou un ASV)."
    5_desc: "ℹ️ Objectif de L’approche Personnalisée \n Si la segmentation est utilisée, elle est vérifiée périodiquement par des tests techniques pour qu'elle demeure continuellement efficace, y compris après toute modification, afin d'isoler le CDE de tous les systèmes hors du périmètre. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les mesures de sécurité de segmentation et examiner la méthodologie de test d'intrusion afin de vérifier que les procédures de test d'intrusion sont définies pour tester toutes les méthodes de segmentation conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Examiner les résultats du test d'intrusion le plus récent afin de vérifier que le test d'intrusion couvre et traite tous les éléments spécifiés dans cette exigence. \n\tc. Interroger le personnel afin de vérifier que le test a été effectué par une ressource interne qualifiée ou un tiers externe qualifié et que l'indépendance organisationnelle du testeur existe (il n'est pas nécessaire qu'il soit un QSA ou un ASV). \n\nℹ️ Directives \n Objectif \n Lorsqu'une entité utilise des mesures de segmentation pour isoler le CDE des réseaux internes hors de la zone de confiance, la sécurité du CDE dépend du fonctionnement de cette segmentation. De nombreuses attaques ont vu l'attaquant se déplacer latéralement de ce qu'une entité considérait comme un réseau isolé vers le CDE. L'utilisation d'outils et de techniques de test d'intrusion pour valider qu'un réseau hors de la zone de confiance est bien isolé du CDE peut alerter l'entité d'une défaillance ou d'une mauvaise configuration des mesures de segmentation, ce qui peut ensuite être rectifié. \n\n Bonne Pratique \n Des techniques telles que la découverte d'hôtes et l'analyse des ports peuvent être utilisées afin de vérifier que les segments hors de périmètre n'ont pas accès au CDE."
    6_label: "Exigences supplémentaires pour les prestataires de services uniquement : Si la segmentation est utilisée pour isoler le CDE des autres réseaux, des tests d'intrusion sont effectués sur les mesures de sécurité de segmentation comme suit : Au moins une fois tous les six mois et après toute modification des mesures de sécurité ou méthodes de segmentation; Couvrir tous les mesures ou méthodes de segmentation utilisée; Conformément à la méthodologie des tests d'intrusion définie par l'entité; Confirmer que les mesures ou méthodes de segmentation sont opérationnelles et efficaces, et isolent le CDE de tous les systèmes hors du périmètre; Confirmer l'efficacité de toute utilisation de l'isolement pour séparer les systèmes avec des niveaux de sécurité différents (voir l'exigence 2.2.3); Effectués par une ressource interne qualifiée ou un tiers externe qualifié; L'indépendance organisationnelle du testeur existe (il n'est pas nécessaire qu'il soit un QSA ou un ASV)."
    6_desc: "ℹ️ Objectif de L’approche Personnalisée \n Si la segmentation est utilisée, elle est vérifiée par des tests techniques pour qu'elle demeure continuellement efficace, y compris après toute modification, afin d'isoler le CDE des systèmes hors du périmètre. \n\nℹ️ Notes D’applicabilité \n Cette exigence ne s'applique que lorsque l'entité évaluée est un prestataire de services. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Procédure de test supplémentaire pour les évaluations des prestataires de services uniquement : Examiner les résultats du test d'intrusion le plus récent afin de vérifier que l'intrusion couvre et a traité tous les éléments spécifiés dans cette exigence. \n\tb. Procédure de test supplémentaire pour les évaluations des prestataires de services uniquement : Interroger le personnel afin de vérifier que le test a été effectué par une ressource interne qualifiée ou un tiers externe qualifié et que l'indépendance organisationnelle du testeur existe (il n'est pas nécessaire qu'il soit un QSA ou un ASV). \n\nℹ️ Directives \n Objectif \n Les prestataires de services ont généralement accès à de plus grands volumes de données de titulaires de carte ou peuvent fournir un point d'entrée qui peut être exploité pour ensuite compromettre plusieurs autres entités. En général, les prestataires de services ont également des réseaux plus grands et plus complexes qui sont sujets à des modifications plus fréquentes. La probabilité d'échec des mesures de sécurité de segmentation dans les réseaux complexes et dynamiques est plus élevée dans les environnements des prestataires de services. \n La validation plus fréquente des mesures de sécurité de segmentation est susceptible de permettre la découverte de telles défaillances avant qu'elles ne puissent être exploitées par un attaquant tentant de basculer latéralement d'un réseau hors de la zone de confiance hors du périmètre du CDE. \n\n Bonne Pratique \n Bien que l'exigence précise que cette validation du périmètre est effectuée au moins tous les six mois et après une modification importante, cet exercice doit être effectué aussi fréquemment que possible afin de s'assurer qu'il reste efficace pour isoler le CDE des autres réseaux."
    7_label: "Exigence supplémentaire pour les prestataires de services mutualisés uniquement : Les prestataires de services mutualisés assistent leurs clients dans les tests d'intrusion externes conformément aux exigences 11.4.3 et 11.4.4."
    7_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les prestataires de services mutualisés répondent aux besoins de leurs clients en matière de tests techniques, soit en fournissant un accès, soit en fournissant la preuve que des tests techniques comparables ont été effectués. \n\nℹ️ Notes D’applicabilité \n Cette exigence s’applique uniquement lorsque l’entité en cours d’évaluation est un prestataire de services mutualisés, \n Pour satisfaire à cette exigence, les prestataires de services mutualisés peuvent : \n\t- Fournir des preuves à ses clients pour montrer que les tests d'intrusion ont été effectués conformément aux exigences 11.4.3 et 11.4.4 sur l'infrastructure souscrite par les clients, ou \n\t- Fournir un accès rapide à chacun de ses clients, afin que les clients puissent effectuer leurs propres tests d'intrusion. Les preuves fournies aux clients peuvent inclure des résultats de tests d'intrusion caviardés, mais doivent inclure des informations suffisantes pour prouver que tous les éléments des exigences 11.4.3 et 11.4.4 ont été satisfaits pour les besoins du consommateur. \n Reportez-vous également à l'Annexe A1 : Exigences supplémentaires du standard PCI DSS pour les prestataires de services mutualisés. \n Cette exigence s'applique uniquement lorsque l'entité évaluée est un prestataire de services gérant des environnements hébergés/cloud tiers. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Procédure de test supplémentaire uniquement pour les prestataires de services mutualisés : Examiner les justificatifs pour vérifier que les prestataires de services mutualisés assistent leurs clients dans les tests d'intrusion externes conformément aux exigences 11.4.3 et 11.4.4. \n\nℹ️ Directives \n Objectif \n Les entités doivent effectuer des tests d'intrusion conformément au standard PCI DSS pour simuler le comportement des attaquants et découvrir les vulnérabilités de leurs environnements. Dans les environnements partagés et cloud, le prestataire de services mutualisés peut être préoccupé par les activités d'un testeur d'intrusion touchant les systèmes d'autres clients. \n Ces fournisseurs de services mutualisés ne peuvent pas interdire les tests d'intrusion car cela laisserait les systèmes de leurs clients ouverts à l'exploitation. Par conséquent, les prestataires de services mutualisés doivent prendre en charge les demandes des clients pour effectuer des tests d'intrusion ou pour obtenir les résultats de tests d'intrusion."
  5:
    title: "Les intrusions réseau et les modifications imprévues de fichiers sont détectées et traitées."
    1_label: "Les techniques de détection des intrusions et/ou de prévention des intrusions sont utilisées pour détecter et/ou empêcher les intrusions dans le réseau comme suit : Tout le trafic est surveillé à la périphérie du CDE; Tout le trafic est surveillé aux points critiques du CDE; Le personnel est alerté des suspicions de compromissions; Tous les moteurs de détection et de prévention des intrusions, les lignes de base et les signatures sont tenus à jour."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Des mécanismes de détection en temps réel du trafic réseau suspect ou anormal pouvant indiquer l'activité d'un acteur menaçant sont mis en œuvre. Les alertes générées par ces mécanismes sont traitées par le personnel ou par des moyens automatisés qui garantissent que les composants système ne peuvent pas être compromis en raison de l'activité détectée. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les configurations système et les schémas de réseau afin de vérifier que des techniques de détection et/ou de prévention des intrusions sont en place pour surveiller tout le trafic : \n\t- A la périphérie du CDE. \n\t- Aux points critiques du CDE. \n\tb. Examiner les configurations du système et interroger le personnel responsable afin de vérifier les techniques de détection et/ou de prévention des intrusions alertant le personnel des suspicions de compromissions. \n\tc. Examiner les configurations système et la documentation du fournisseur afin de vérifier que les techniques de détection et/ou de prévention des intrusions sont configurées pour maintenir à jour tous les moteurs, les références et les signatures. \n\nℹ️ Directives \n Objectif \n Les techniques de détection et/ou de prévention des intrusions (telles que IDS/IPS) comparent le trafic entrant sur le réseau à des « signatures » et/ou des comportements connus de milliers de types de compromissions (outils de piratage, chevaux de Troie et autres logiciels malveillants), et puis envoient des alertes et/ou arrêtent la tentative lorsqu'elle se produit. Sans une approche proactive pour détecter les activités non autorisées, les attaques (ou l'utilisation abusive) des ressources informatiques pourraient passer inaperçues pendant de longues périodes. L'impact d'une intrusion dans le CDE est, à bien des égards, un facteur lié au temps dont dispose un attaquant dans l'environnement avant d'être détecté. \n\n Bonne Pratique \n Les alertes de sécurité générées par ces techniques doivent être surveillées en permanence, afin que les intrusions tentées ou réelles puissent être bloquées et les dommages potentiels limités. \n\n Définitions \n Les emplacements critiques peuvent inclure, sans toutefois s'y limiter, les mesures de sécurité de sécurité réseau entre les segments de réseau (par exemple, entre une DMZ et un réseau interne ou entre un réseau dans le périmètre et hors de portée) et des points protégeant les connexions entre un réseau auquel on fait moins confiance et un composant système de confiance."
    2_prefix: "11.5.1.1"
    2_label: "Exigences supplémentaires pour les prestataires de services uniquement : Les techniques de détection et/ou de prévention des intrusions détectent, alertent/préviennent et traitent les canaux secrets de communication des logiciels malveillants."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Des mécanismes sont en place pour détecter et alerter ou empêcher les communications secrètes avec les systèmes de commande et de contrôle. Les alertes générées par ces mécanismes sont traitées par le personnel ou par des moyens automatisés qui garantissent que ces communications sont bloquées. \n\nℹ️ Notes D’applicabilité \n Cette exigence ne s'applique que lorsque l'entité évaluée est un prestataire de services. \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Procédure de test supplémentaire pour les évaluations des prestataires de services uniquement : Examiner la documentation et les paramètres de configuration afin de vérifier que les méthodes de détection et d'alerte ou de prévention des canaux de communication malveillants secrets sont en place et fonctionnent comme prévu. \n\tb. Procédure de test supplémentaire pour les évaluations des prestataires de services uniquement : Examiner le plan de réponse aux incidents de l'entité (Exigence 12.10.1) afin de vérifier qu'il demande et définisse une réponse au cas où des canaux de communication secrets de logiciels malveillants seraient détectés. \n\tc. Procédure de test supplémentaire pour les évaluations des prestataires de services uniquement : Interroger le personnel responsable et observer les processus afin de vérifier que le personnel maintient une connaissance des techniques de communication secrètes et de contrôle des programmes malveillants et sait comment réagir lorsque des programmes malveillants sont suspectés. \n\nℹ️ Directives \n Objectif \n La détection des tentatives de communication secrètes de logiciels malveillants (par exemple, la tunnelisation DNS) peut aider à bloquer la propagation latérale des logiciels malveillants à l'intérieur d'un réseau et l'exfiltration de données. Lorsqu'elles décident de l'emplacement de ce contrôle, les entités doivent prendre en compte les emplacements critiques dans le réseau et les itinéraires probables pour les canaux secrets. \n Lorsqu'un programme malveillant s'implante dans un environnement infecté, il essaie souvent d'établir un canal de communication vers un serveur de commande et de contrôle (C&C). Par le biais du serveur C&C, l'attaquant communique et contrôle les programmes malveillants sur les systèmes compromis afin de fournir des charges utiles ou des instructions malveillantes, ou pour lancer l'exfiltration de données. Dans de nombreux cas, le programme malveillant communiquera avec le serveur C&C de manière indirecte via des botnets, contournant ainsi la surveillance, bloquant les mesures de sécurité et rendant ces méthodes inefficaces pour détecter les canaux secrets. \n\n Bonne Pratique \n Les méthodes qui peuvent aider à détecter et à traiter les canaux de communication des programmes malveillants incluent l'analyse des points de terminaison en temps réel, le filtrage du trafic de sortie, une liste blanche, des outils de prévention des pertes de données et des outils de surveillance de la sécurité du réseau tels que IDS/IPS. \n De plus, les requêtes et réponses DNS sont une source de données clé utilisée par les défenseurs du réseau pour prendre en charge la réponse aux incidents ainsi que la découverte des intrusions. \n Lorsque ces transactions sont collectées à des fins de traitement et d'analyse, elles peuvent activer un certain nombre de scénarios précieux d'analyse de la sécurité. \n Il est important que les entreprises maintiennent des connaissances à jour sur les modes de fonctionnement des programmes malveillants, car leur prise en compte peut aider à détecter et à limiter l'impact des logiciels malveillants dans l'environnement."
    3_prefix: "11.5.2"
    3_label: "Un mécanisme de détection des modifications (par exemple, des outils de surveillance de l'intégrité des fichiers) est déployé de la façon suivante : Pour alerter le personnel de modifications non autorisées (y compris les modifications, les ajouts et les suppressions) de fichiers critiques; Pour effectuer des comparaisons de fichiers critiques au moins une fois par semaine."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les fichiers critiques ne peuvent pas être modifiés par du personnel non autorisé sans qu'une alerte ne soit générée. \n\nℹ️ Notes D’applicabilité \n Pour la détection des changements, les fichiers critiques sont généralement ceux qui ne changent pas régulièrement, mais dont la modification pourrait indiquer une compromission ou un risque de compromission du système. Les mécanismes de détection des changements, tels que les outils de surveillance de l'intégrité des fichiers, sont généralement préconfigurés avec des fichiers critiques pour le système d'exploitation associé. D'autres fichiers critiques, tels que ceux des applications personnalisées, doivent être évalués et définis par l'entité (c'est-à-dire le commerçant ou le prestataire de services). \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les paramètres système, les fichiers surveillés et les résultats des activités de surveillance afin de vérifier l'utilisation d'un mécanisme de détection des modifications. \n\tb. Examiner les paramètres du mécanisme de détection des modifications afin de vérifier qu'il est configuré conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Les modifications apportées aux fichiers critiques du système, fichiers de configuration ou fichiers de contenu peuvent indiquer qu'un attaquant a accédé au système d'une entreprise. De telles modifications peuvent permettre à un attaquant d'effectuer d'autres actions malveillantes, d'accéder aux données des titulaires de cartes et/ou de mener des activités sans détection ni enregistrement. \n Un mécanisme de détection des modifications détectera et évaluera ces modifications apportées aux fichiers critiques et générera des alertes auxquelles il sera possible de répondre en suivant les processus définis afin que le personnel puisse prendre les mesures appropriées. \n Si elle n'est pas mise en œuvre de manière correcte, et que les informations de sortie de la solution de détection des modifications ne sont pas surveillées, une personne malveillante pourrait ajouter, supprimer ou modifier le contenu du fichier de configuration, les programmes du système d'exploitation ou les fichiers exécutables de l'application. Les modifications non autorisées, si elles ne sont pas détectées, pourraient rendre les mesures de sécurité de sécurité existants inefficaces et/ou entraîner le vol de données des titulaires de cartes sans impact perceptible sur le traitement normal. \n\n Bonne Pratique \n Des exemples de types de fichiers qui doivent être surveillés comportent, sans toutefois s'y limiter : \n\t- Des fichiers exécutables système. \n\t- Des fichiers exécutables des applications. \n\t- Des fichiers de configuration et de paramétrage. \n\t- Des journaux d'audit stockés de manière centralisée, historiques ou archivés. \n\t- Des dossiers critiques supplémentaires déterminés par entité (par exemple, par le biais d'une évaluation des risques ou d'autres moyens). \n\n Exemples \n Des solutions de détection des modifications telles que les outils de surveillance de l'intégrité des fichiers (FIM) vérifient les modifications, les ajouts et les suppressions de fichiers critiques et notifient lorsque de telles modifications sont détectées."
  6:
    title: "Les modifications non autorisées sur les pages de paiement sont détectées et traitées."
    1_label: "Un mécanisme de détection des changements et des altérations est déployé de la manière suivante : Alerter le personnel des modifications non autorisées (y compris les indicateurs de compromission, de changements, d'ajouts et de suppressions) des en-têtes HTTP et du contenu des pages de paiement comme reçus par le navigateur du consommateur; Le mécanisme est configuré pour évaluer l'entête HTTP et la page de paiement reçus; Les fonctions des mécanismes sont exécutées comme suit : – Au moins une fois tous les sept jours  OU – Périodiquement, (à la fréquence définie dans l'analyse de risques ciblée de l'entité, qui est réalisée selon tous les éléments spécifiés dans l'exigence 12.3.1)."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Le code ou les techniques d'écrémage du commerce électronique ne peuvent pas être ajoutés aux pages de paiement telles qu'elles sont reçues par le navigateur du consommateur sans qu'une alerte ne soit générée en temps opportun. Les mesures contre l'écrémage ne peuvent pas être supprimées des pages de paiement sans qu'une alerte rapide ne soit générée. \n\nℹ️ Notes D’applicabilité \n L'intention de cette exigence n'est pas qu'une entité soit obligée d'installer un logiciel dans les systèmes ou les navigateurs de ses consommateurs, mais plutôt qu'elle utilise des techniques telles que celles décrites dans les exemples ci-dessus afin d'empêcher et de détecter des activités de script imprévues. \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les paramètres du système, les pages de paiement surveillées et les résultats des activités de surveillance afin de vérifier l'utilisation d'un mécanisme de détection des modifications et des altérations. \n\tb. Examiner les paramètres de configuration afin de vérifier que le mécanisme est configuré conformément à tous les éléments spécifiés dans cette exigence. \n\tc. Si les fonctions du mécanisme sont exécutées à une fréquence définie par l'entité, examiner l'analyse de risque ciblée de l'entité pour déterminer la fréquence afin de vérifier que l'analyse de risques a été effectuée conformément à tous les éléments spécifiés à l'Exigence 12.3.1. \n\td. Examiner les paramètres de configuration et interroger le personnel afin de vérifier que les fonctions du mécanisme sont effectuées : \n\t- Au moins une fois tous les sept jours \n  OU \n\t- A la fréquence définie dans l'analyse de risques ciblée de l'entité réalisée pour la présente exigence. \n\nℹ️ Directives \n Objectif \n De nombreuses pages Web repose désormais sur l'assemblage d'objets, y compris du contenu actif (principalement JavaScript), à partir de plusieurs emplacements Internet. De plus, le contenu de nombreuses pages Web est défini à l'aide de systèmes de gestion de contenu et de gestion de balises qu'il pourrait être impossible de surveiller à l'aide des mécanismes classiques toute détection de modifications. \n Par conséquent, le seul endroit pour détecter les modifications ou les indicateurs d'activité malveillante est dans le navigateur du consommateur lors de la construction de la page et de l'interprétation de tous les scripts JavaScript. \n En comparant la version actuelle de l'en-tête HTTP et le contenu actif des pages de paiement telles que reçues par le navigateur du consommateur avec des versions antérieures ou connues, il est possible de détecter des modifications non autorisées pouvant indiquer une attaque par écrémage. \n Aussi, en recherchant des indicateurs connus de compromission et des éléments de script ou un comportement typique des écumeurs, des alertes suspectes peuvent être déclenchées. \n\n Exemples \n Les mécanismes qui détectent et signalent les modifications apportées aux en-têtes et au contenu de la page de paiement comportent, sans toutefois s'y limiter : \n\t- Les violations de la politique de sécurité du contenu (CSP) peuvent être signalées à l'entité par le biais des directives CSP reportto ou report-uri. \n\t- Les modifications apportées au CSP lui-même peuvent indiquer une tentative d’altération. \n\t- La surveillance externe par des systèmes qui demandent et analysent les pages Web reçues (également appelée surveillance synthétique des utilisateurs) peut détecter les modifications apportées au script JavaScript dans les pages de paiement et alerter le personnel. \n\t- L'intégration d'un script de détection d'altération inviolable dans la page de paiement peut alerter et bloquer lorsqu'un comportement de script malveillant est détecté. \n\t- Les serveurs proxy inverse et les réseaux de diffusion de contenu peuvent détecter les changements dans les scripts et alerter le personnel. \n Ces mécanismes sont souvent des abonnements ou basés sur le cloud, mais peuvent également être basés sur des solutions personnalisées et sur mesure."
12:
  prefix: "Exigence 12"
  title: "Appuyer la Sécurité de l’Information sur des Politiques et des Programmes Organisationnels"
  desc: "La politique globale de sécurité de l'information de l'entreprise donne le ton à l'ensemble de l'entité et informe le personnel de ce que l'entreprise attend d'eux. Tout le personnel doit être conscient de la sensibilité des données des titulaires de cartes et de leurs responsabilités en matière de leur protection. \n\n Pour ce qui concerne l'exigence 12, le « personnel » fait référence aux employés à temps plein et à temps partiel, aux employés temporaires, aux sous-traitants et aux consultants ayant des responsabilités en matière de sécurité pour la protection des données de carte ou pouvant avoir un impact sur la sécurité des données des comptes. \n\n Se référer à l'Annexe G pour les définitions des termes du standard PCI DSS."
  1:
    title: "Une politique complète de sécurité de l'information qui régit et fournit une orientation pour la protection des actifs informationnels de l'entité est connue et à jour. "
    1_label: "Une politique globale de sécurité de l’information est : Établie; Publiée; Maintenue; Diffusée à tout le personnel concerné, ainsi qu'aux fournisseurs et partenaires commerciaux concernés."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les objectifs stratégiques et les principes de la sécurité de l’information sont définis, adoptés et connus de l'ensemble du personnel. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la politique de sécurité de l'information et interroger le personnel afin de vérifier que la politique globale de sécurité de l’information est gérée conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n La politique globale de sécurité de l’information d'une entreprise est liée à et régit toutes les autres politiques et procédures qui définissent la protection des données des titulaires de cartes. \n La politique de sécurité de l’information communique l'intention et les objectifs de la direction concernant la protection de ses actifs les plus précieux, y compris les données des titulaires de cartes. \n Sans politique de sécurité de l’information, des personnes prendront leurs propres décisions sur les mesures de sécurité requis au sein de l'entreprise, ce qui pourrait empêcher l'organisation de respecter ses obligations légales, réglementaires et contractuelles, ni de pouvoir protéger adéquatement ses actifs de manière cohérente. \n Pour garantir la mise en œuvre de la politique, il est important que tout le personnel concerné au sein de l'entreprise, ainsi que les tiers, les fournisseurs et les partenaires commerciaux concernés soient conscients de la politique de sécurité de l’information de l'entreprise et de leurs responsabilités en matière de protection des actifs de données. \n\n Bonne Pratique \n La politique de sécurité de l'entreprise identifie l'objectif, le périmètre, la responsabilité et les informations qui définissent clairement la position de l'entreprise concernant la sécurité d de l’information. \n La politique globale de sécurité des informations diffère des politiques de sécurité individuelles qui traitent de technologies spécifiques ou de disciplines de sécurité. Cette politique énonce les directives pour l'ensemble de l'entreprise tandis que les politiques de sécurité individuelles s'alignent sur et soutiennent la politique de sécurité globale et communiquent des objectifs spécifiques pour les disciplines liées aux technologies ou à la sécurité. \n Il est important que tout le personnel concerné au sein de l'entreprise, ainsi que les tiers, les fournisseurs et les partenaires commerciaux concernés soient conscients de la politique de sécurité des informations de l'entreprise et de leurs responsabilités en matière de protection des fonds documentaires. \n\n Définitions \n Le terme « pertinent » dans cette exigence signifie que la politique de sécurité de l’information est diffusée à ceux qui ont des rôles applicables à certains ou à tous les sujets de la politique, soit au sein de l'entreprise, soit en raison de services/fonctions exécutés par un fournisseur ou un tiers."
    2_label: "La politique de sécurité de l’information est : Examinée au moins une fois tous les 12 mois; Mise à jour, si besoin, pour refléter les modifications apportées aux objectifs professionnels ou les risques pour l'environnement."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n La politique de sécurité de l’information continue de refléter les objectifs et les principes stratégiques de l'entreprise. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la politique de sécurité de l’information et interroger le personnel responsable afin de vérifier que la politique est gérée conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Les menaces de sécurité et les méthodes de protection associées évoluent rapidement. Sans mettre à jour la politique de sécurité de l’information afin de refléter les changements pertinents, de nouvelles mesures de défense contre ces menaces pourraient ne pas être prises en compte."
    3_label: "La politique de sécurité définit clairement les rôles et les responsabilités en matière de sécurité de l’information pour tout le personnel, et tout le personnel est conscient et reconnaît ses responsabilités en matière de sécurité de l’information."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Le personnel comprend son rôle dans la protection des données des titulaires de carte de l'entité. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la politique de sécurité de l’information afin de vérifier qu'elles définissent clairement les rôles et les responsabilités en matière de sécurité des informations pour tout le personnel. \n\tb. Interroger le personnel dans divers rôles afin de vérifier qu'il comprend ses responsabilités en matière de sécurité de l’information. \n\tc. Examiner les preuves documentées afin de vérifier que le personnel reconnaît ses responsabilités en matière de sécurité de l’information. \n\nℹ️ Directives \n Objectif \n Sans rôles et responsabilités de sécurité clairement définis, il pourrait y avoir une mauvaise utilisation des fonds documentaires de l'entreprise ou une interaction incohérente avec le personnel de sécurité de l’information, entraînant une mise en œuvre non sécurisée de technologies ou à l'utilisation de technologies obsolètes ou non sécurisées."
    4_label: "La responsabilité de la sécurité de l'information est officiellement attribuée à un responsable de la sécurité de l'information ou à un autre membre de la direction compétent en matière de sécurité de l'information. "
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Un membre désigné de la direction générale est responsable de la sécurité de l'information. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la politique de sécurité de l’information afin de vérifier que la sécurité des informations est officiellement attribuée à un responsable de la sécurité de l’information ou à un autre membre de la direction compétent en matière de sécurité des informations. \n\nℹ️ Directives \n Objectif \n Pour s'assurer qu'une personne ayant suffisamment d'autorité et de responsabilité gère et protège activement le programme de sécurité de l’information de l'entreprise, l'obligation de rendre compte et la responsabilité de la sécurité de l’information doivent être attribuées au niveau exécutif au sein d'une entreprise. \n Les titres de direction courants pour ce rôle incluent le directeur de la sécurité de l'information (RSI) et le directeur de la sécurité (RSI - pour répondre à cette exigence, le rôle de RSI doit être responsable de la sécurité de l'information). Ces postes devraient être au niveau de direction le plus élevé et faire partie du niveau de directeur général ou de niveau exécutif, relevant généralement du directeur général ou du conseil d'administration. \n\n Bonne Pratique \n Les entités doivent également envisager des plans de transition et/ou de succession pour ce personnel clé afin d'éviter d'éventuelles lacunes dans les activités de sécurité critiques."
  2:
    title: "Des politiques d'utilisation acceptable des technologies de l'utilisateur final sont définies et mises en œuvre."
    1_label: "Des politiques d'utilisation acceptable pour les technologies d'utilisateur final sont documentées et mises en œuvre, notamment : Une approbation expresse par les parties autorisées; Des utilisations acceptables de la technologie; Une liste de produits approuvés par l'entreprise pour une utilisation par les employés, y compris le matériel et les logiciels."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n L'utilisation des technologies de l'utilisateur final est définie et gérée afin de garantir une utilisation autorisée. \n\nℹ️ Notes D’applicabilité \n Des exemples de technologies d'utilisateur final pour lesquelles des politiques d'utilisation acceptables sont prévues incluent, sans toutefois s'y limiter, les technologies d'accès à distance et sans fil, les ordinateurs portables, les tablettes, les téléphones portables et les supports électroniques amovibles, l'utilisation de la messagerie électronique et l'utilisation d'Internet. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les politiques d'utilisation acceptable des technologies de l'utilisateur final et interroger le personnel responsable afin de vérifier que les processus sont documentés et mis en œuvre conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Les technologies de l'utilisateur final représentent un investissement important et peuvent présenter un risque important pour une entreprise si elles ne sont pas gérées correctement. Les politiques d'utilisation acceptable décrivent le comportement attendu du personnel lors de l'utilisation des technologies de l'information de l'entreprise et reflètent le niveau de tolérance au risque de l'entreprise \n Ces politiques informent le personnel sur ce qu'il peut et ne peut pas faire avec l'équipement de l'entreprise, et indiquent le personnel sur les utilisations correctes et incorrectes des ressources Internet et de messagerie de l'entreprise. De telles politiques peuvent juridiquement protéger une entreprise et lui permettre d'agir lorsque les politiques sont violées. \n\n Bonne Pratique \n Il est important que les politiques d'utilisation soient appuyées par des mesures de sécurité techniques afin de gérer l'application des politiques. \n Structurer les politiques comme de simples exigences « faire » et « ne pas faire » liées à un objectif peut aider à lever l'ambiguïté et fournir au personnel le contexte de l'exigence."
  3:
    title: "Les risques pour l'environnement des données des titulaires de cartes sont formellement identifiés, évalués et gérés."
    1_label: "Chaque exigence du standard PCI DSS qui offre une flexibilité quant à la fréquence d'exécution (par exemple, les exigences à exécuter périodiquement) est soutenue par une analyse de risque ciblée qui est documentée et comprend : L'identification des actifs à protéger; L'identification de la ou des menaces contre lesquelles l'exigence protège; L'identification des facteurs qui contribuent à la probabilité et/ou à l'impact d'une menace; L'analyse résultante qui détermine et inclut la justification de la fréquence à laquelle l'exigence doit être exécutée afin de minimiser la probabilité que la menace se matérialise; L'examen de chaque analyse de risque ciblée au moins une fois tous les 12 mois afin de déterminer si les résultats sont toujours valides ou si une analyse de risque mise à jour est nécessaire; La réalisation d'analyses de risques mises à jour au besoin, tel que déterminé par l'examen annuel."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Des connaissances et une évaluation à jour des risques pour le CDE sont maintenues. \n\nℹ️ Notes D’applicabilité \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les politiques et procédures documentées afin de vérifier qu'un processus est défini pour effectuer des analyses de risques ciblées pour chaque exigence du standard PCI DSS qui offre une flexibilité quant à la fréquence d'exécution de l'exigence et que le processus comporte tous les éléments spécifiés dans cette exigence.  \n\nℹ️ Directives \n Objectif \n Certaines exigences du standard PCI DSS permettent à une entité de définir la fréquence à laquelle une activité est effectuée en fonction du risque pour l'environnement. La réalisation de cette analyse de risques selon une méthodologie garantit la validité et la conformité avec les politiques et les procédures. \n Cette analyse de risques ciblée (par opposition à une évaluation classique des risques à l'échelle de l'entreprise) est axée sur les exigences du standard PCI DSS qui permettent à une entité une flexibilité quant à la fréquence à laquelle une entité exécute un contrôle donné. Pour cette analyse de risques, l'entité évalue soigneusement chaque exigence du standard PCI DSS qui offre cette flexibilité et détermine la fréquence qui favorise une sécurité adéquate pour l'entité, ainsi que le niveau de risque que l'entité est prête à accepter. \n L'analyse de risques identifie les actifs spécifiques, tels que les composants système et les données (par exemple, les fichiers journaux ou les informations d'identification) que l'exigence est destinée à protéger, ainsi que la ou les menaces ou les résultats que l'exigence protège les actifs de—par exemple, un programme malveillant, un intrus non détecté ou une mauvaise utilisation des informations d'identification. Des exemples de facteurs qui pourraient contribuer à la probabilité ou à l'impact comportent ceux qui pourraient augmenter la vulnérabilité d'un actif à une menace ; par exemple, l'exposition à des réseaux hors zone de confiance, la complexité de l'environnement ou le roulement élevé du personnel, ainsi que la criticité des composants système, ou le volume et la sensibilité des données protégées. \n L'examen des résultats de ces analyses de risques ciblées au moins une fois tous les 12 mois et en cas de changements qui pourraient avoir un impact sur le risque pour l'environnement, permet à l'entreprise de s'assurer que les résultats de l'analyse de risques restent à jour avec les changements organisationnels et l'évolution des menaces, des tendances et des technologies, et que les fréquences choisies répondent toujours adéquatement au risque de l'entité. \n\n Bonne Pratique \n Une évaluation des risques à l'échelle de l'entreprise, qui est une activité ponctuelle qui permet aux entités d'identifier les menaces et les vulnérabilités associées, est recommandée, mais n'est pas obligatoire, afin que les entités déterminent et comprennent les menaces plus larges et émergentes susceptibles d'avoir une incidence négative sur la sécurité de leur entreprise. Cette évaluation des risques à l'échelle de l'entreprise pourrait être établie dans le cadre d'un programme global de gestion des risques, utilisé comme contribution à l'examen annuel de la politique globale de sécurité de l'information d'une entreprise (voir l'exigence 12.1.1). \n Des exemples de méthodologies d'évaluation des risques pour les évaluations des risques à l'échelle de l'entreprise comportent, sans toutefois s'y limiter, les standards ISO 27005 et NIST SP 800-30."
    2_label: "Une analyse de risque ciblée est effectuée pour chaque exigence du standard PCI DSS que l'entité satisfait à l'approche personnalisée, pour inclure : Une preuve documentée détaillant chaque élément spécifié à l'annexe D : Une approche personnalisée (incluant, au minimum, une matrice de mesures de sécurité et une analyse de risques); Une approbation des preuves documentées par la haute direction; Une réalisation de l'analyse de risque ciblée au moins une fois tous les 12 mois."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence fait partie de l'approche personnalisée et doit être observée pour les entités qui utilisent l'approche personnalisée. \n\nℹ️ Notes D’applicabilité \n Cette exigence s'applique uniquement aux entités utilisant une approche personnalisée. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner l'analyse ciblée de risques documentée pour chaque exigence du standard PCI DSS que l'entité satisfait à l'approche personnalisée afin de vérifier que la documentation pour chaque exigence existe et est conforme à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Une analyse de risques basée sur une méthodologie reproductible et robuste permet à une entité d'atteindre l'objectif de l'approche personnalisée. \n\n Définitions \n L'approche personnalisée pour satisfaire à une exigence du standard PCI DSS permet aux entités de définir les mesures de sécurité utilisée pour répondre à l'objectif d'approche personnalisée d'une exigence donnée d'une manière qui ne suit pas strictement l'exigence définie. Ces mesures de sécurité devraient au moins atteindre ou dépasser la sécurité fournie par l'exigence définie et nécessiterait une documentation complète de la part de l'entité utilisant l'approche personnalisée. \n\n Informations Complémentaires \n Voir l'Annexe D : Approche personnalisée afin d'obtenir des instructions sur la façon de documenter les justificatifs nécessaires pour l'approche personnalisée. Voir l'Annexe E : Exemples de modèles pour prendre en charge une approche personnalisée pour obtenir des modèles que les entités peuvent utiliser afin de documenter leurs mesures de sécurité personnalisée. Notez que bien que l'utilisation des modèles soit facultative, les informations spécifiées dans chaque modèle doivent être documentées et fournies à l’auditeur de chaque entité."
    3_label: "Les suites de chiffrement cryptographiques et les protocoles utilisés sont documentés et examinés au moins une fois tous les 12 mois, y compris au moins les éléments suivants : Un inventaire tenu à jour de toutes les suites et protocoles de chiffrement cryptographiques utilisés, y compris le but et le lieu d'utilisation; Une surveillance active des tendances de l'industrie concernant la viabilité continue de toutes les suites et protocoles de chiffrement cryptographiques utilisés; Une stratégie documentée pour répondre aux changements anticipés des vulnérabilités cryptographiques."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n L'entité est en mesure de réagir rapidement à toute vulnérabilité dans les protocoles ou algorithmes cryptographiques, lorsque ces vulnérabilités affectent la protection des données des titulaires de cartes. \n\nℹ️ Notes D’applicabilité \n L'exigence s'applique à toutes les suites et protocoles cryptographiques utilisés pour répondre aux exigences du standard PCI DSS. \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation relative aux suites et protocoles cryptographiques utilisés et interroger le personnel afin de vérifier que la documentation et l'examen sont conformes à tous les éléments spécifiés dans cette exigence.  \n\nℹ️ Directives \n Objectif \n Les protocoles et les niveaux de chiffrement peuvent changer rapidement ou être dépréciés en raison de l'identification de vulnérabilités ou de défauts de conception. Pour répondre aux besoins actuels et futurs des exigences en termes de sécurité des données, les entités doivent savoir où la cryptographie est utilisée et comprendre comment elles pourraient réagir rapidement aux changements affectant la robustesse de leurs mises en œuvre cryptographiques. \n\n Bonne Pratique \n L'agilité cryptographique est essentielle pour garantir qu'une alternative à la méthode de chiffrement d'origine ou à la primitive cryptographique est disponible, avec des plans pour passer à l'alternative sans modification importante de l'infrastructure du système. Par exemple, si l'entité sait quand les protocoles ou les algorithmes seront dépréciés par les organismes de normalisation, elle peut planifier de manière proactive la mise à niveau avant que la dépréciation n'ait un impact sur ses opérations. \n\n Définitions \n « L'agilité cryptographique » fait référence à la capacité de surveiller et de gérer le chiffrement et les technologies de vérification associées déployées dans une entreprise. \n\n Informations Complémentaires \n Se referrer au NIST SP 800-131a, Transitioning the Use of Cryptographic Algorithms and Key Lengths."
    4_label: "Les technologies matérielles et logicielles utilisées sont examinées au moins une fois tous les 12 mois, en incluant au moins les éléments suivants : Une analyse démontrant que les technologies continuent de recevoir rapidement des correctifs de sécurité des fournisseurs; Une analyse démontrant que les technologies continuent de prendre en charge (et n'empêchent pas) la conformité au standard PCI DSS de l'entité; Une documentation de toute annonce ou tendance de l'industrie liée à une technologie ; par exemple, lorsqu'un fournisseur annonce des plans de « fin de vie » pour une technologie; La documentation d'un plan, approuvé par la haute direction, pour traiter les technologies obsolètes, y compris celles pour lesquelles les fournisseurs ont annoncé des plans de « fin de vie »."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les technologies matérielles et logicielles de l'entité sont à jour et prises en charge par le vendeur. Les plans de suppression ou de remplacement de tous les composants système non pris en charge sont examinés périodiquement. \n\nℹ️ Notes D’applicabilité \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS.  \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation pour l'examen des technologies matérielles et logicielles utilisées et interroger le personnel afin de vérifier que l'examen est conforme à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Les technologies matérielles et logicielles évoluent constamment, et les entreprises doivent être conscientes des changements apportés aux technologies qu'elles utilisent, ainsi que de l'évolution des menaces pesant sur ces technologies afin de s'assurer qu'elles peuvent se préparer et gérer les vulnérabilités du matériel et des logiciels qui ne seront pas être corrigé par le fournisseur ou le développeur. \n\n Bonne Pratique \n Les entreprises doivent examiner les versions des firmwares afin de s'assurer qu'elles restent à jour et supportées par les fournisseurs. Les entreprises doivent également être conscientes des modifications apportées par les fournisseurs de technologies à leurs produits ou processus pour comprendre la manière dont ces modifications peuvent avoir un impact sur l'utilisation de la technologie par l'entreprise. \n Des revues régulières des technologies qui ont un impact ou une influence sur les mesures de sécurité du standard PCI DSS peuvent aider à l'achat, à l'utilisation et aux stratégies de déploiement, et garantir que les mesures de sécurité qui reposent sur ces technologies restent efficaces. Ces revues comportent, sans toutefois s'y limiter, l'examen des technologies qui ne sont plus prises en charge par le fournisseur et/ou qui ne répondent plus aux besoins de sécurité de l'entreprise."
  4:
    title: "La conformité au standard PCI DSS est gérée."
    1_label: "Exigences supplémentaires pour les prestataires de services uniquement : La responsabilité est établie par la direction générale pour la protection des données des titulaires de cartes et un programme de conformité PCI DSS incluant : Responsabilité globale pour le maintien de la conformité PCI DSS; Définition d'une charte pour un programme de conformité PCI DSS et sa communication à la direction générale."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les cadres sont responsables et comptables de la sécurité des données des titulaires de cartes. \n\nℹ️ Notes D’applicabilité \n Cette exigence ne s'applique que lorsque l'entité évaluée est un prestataire de services. \n La direction générale peut inclure des postes au niveau exécutif, comité de direction ou équivalent. Les titres spécifiques dépendront de la structure organisationnelle. \n La responsabilité du programme de conformité PCI DSS peut être attribuée à des rôles individuels et/ou à des départements au sein de l'entreprise. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Procédure de test supplémentaire pour les évaluations des prestataires de services uniquement : Examiner la documentation afin de vérifier que la haute direction a établi la responsabilité de la protection des données des titulaires de cartes et un programme de conformité PCI DSS conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n L'attribution par la direction générale des responsabilités de conformité PCI DSS garantit une visibilité au niveau de la direction sur le programme de conformité PCI DSS, et permet de poser les questions appropriées pour déterminer l'efficacité du programme et influer sur les priorités stratégiques."
    2_label: "Exigences supplémentaires pour les prestataires de services uniquement : Des revues sont effectuées au moins une fois tous les trois mois, par du personnel autre que ceux responsables de l'exécution de la tâche donnée afin de confirmer que le personnel exécute ses tâches, conformément à toutes les politiques de sécurité et à toutes les procédures opérationnelles, y compris, sans toutefois s'y limiter, les tâches suivantes : Examens quotidiens des journaux; Examens des configurations pour les mesures de sécurité réseau; Application des standards de configuration aux nouveaux systèmes; Réponse aux alertes de sécurité; Processus de gestion des changements."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n L'efficacité opérationnelle des mesures de sécurité critiques du standard PCI DSS est vérifiée périodiquement par une inspection manuelle des enregistrements. \n\nℹ️ Notes D’applicabilité \n Cette exigence ne s'applique que lorsque l'entité évaluée est un prestataire de services. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Procédure de test supplémentaire pour les évaluations des prestataires de services uniquement : Examiner les politiques et procédures afin de vérifier que des processus sont définis pour effectuer des revues pour confirmer que le personnel effectue ses tâches conformément à toutes les politiques de sécurité et à toutes les procédures opérationnelles, y compris, sans toutefois s'y limiter, les tâches spécifiées dans cette exigence. \n\tb. Procédure de test supplémentaire pour les évaluations des prestataires de services uniquement : Interroger le personnel responsable et consulter les enregistrements des revues afin de vérifier que les revues sont effectuées : \n\t- Au moins une fois tous les trois mois. \n\t- Par du personnel autre que ceux chargés de l'exécution de la tâche donnée. \n\nℹ️ Directives \n Objectif \n Une confirmation régulière que les politiques et procédures de sécurité sont suivies donne l'assurance que les mesures de sécurité attendue sont actives et fonctionnent comme prévu. Cette exigence est distincte des autres exigences qui spécifient une tâche à effectuer. L'objectif de ces revues n'est pas d’effectuer à nouveau d'autres exigences PCI DSS, mais de confirmer que les activités de sécurité sont effectuées de manière continue. \n\n Bonne Pratique \n Ces revues peuvent également être utilisées afin de vérifier que les preuves appropriées sont conservées (par exemple, journaux d'audit, rapports d'analyse de vulnérabilités, examens des ensembles de règles de contrôle de sécurité réseau) pour aider l'entité à préparer sa prochaine évaluation de la conformité au standard PCI DSS. \n\n Exemples \n Prenant l'exigence 1.2.7 comme exemple, on répond à l'exigence 12.4.2 en confirmant, au moins une fois tous les trois mois, que les revues des configurations des mesures de sécurité de sécurité réseau ont eu lieu à la fréquence requise. D'autre part, l'exigence 1.2.7 est satisfaite en examinant ces configurations comme spécifié dans l'exigence."
    3_prefix: "12.4.2.1"
    3_label: "Exigences supplémentaires pour les prestataires de services uniquement : Les revues effectuées conformément à l'exigence 12.4.2 sont documentées pour inclure : Les résultats des revues; La documentation des mesures correctives prises pour toutes les tâches qui se sont avérées non exécutées à l'exigence 12.4.2; Revue et approbation des résultats par le personnel affecté à la responsabilité du programme de conformité PCI DSS."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les conclusions des revues de l'efficacité opérationnelle sont évaluées par la direction ; des mesures correctives appropriées sont mises en œuvre. \n\nℹ️ Notes D’applicabilité \n Cette exigence ne s'applique que lorsque l'entité évaluée est un prestataire de services. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Procédure de test supplémentaire pour les évaluations des prestataires de services uniquement : Examiner la documentation des revues effectuées conformément à l'exigence 12.4.2 du standard PCI DSS afin de vérifier que la documentation comprend tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Le but de ces vérifications indépendantes est de confirmer que les activités de sécurité sont exécutées de façon continue. Ces revues peuvent également être utilisées afin de vérifier que les preuves appropriées sont conservées (par exemple, journaux d'audit, rapports d'analyse de vulnérabilités, examens des ensembles de règles de contrôle de sécurité réseau) pour aider l'entité à préparer sa prochaine évaluation de la conformité au standard PCI DSS."
  5:
    title: "Le périmètre où s’applique PCI DSS est documenté et validé."
    1_label: "Un inventaire des composants système qui sont dans le périmètre PCI DSS, incluant une description de la fonction ou de l'utilisation, est maintenu et tenu à jour."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Tous les composants systèmes concernés par le standard PCI DSS sont identifiés et connus. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner l'inventaire afin de vérifier qu'il comprend tous les composants système concernés et une description de la fonction ou de l'utilisation de chacun. \n\tb. Interroger le personnel afin de vérifier que l'inventaire est tenu à jour. \n\nℹ️ Directives \n Objectif \n Le maintien d'une liste à jour de tous les composants système permettra à une entreprise de définir le périmètre de son environnement et de mettre en œuvre les exigences du standard PCI DSS avec précision et efficacité. Sans inventaire, certains composants système pourraient être négligés et exclus par mégarde des standards de configuration de l'entreprise. \n\n Bonne Pratique \n Si une entité maintien un inventaire de tous les actifs, les composants systèmes dans le périmètre PCI DSS doivent être clairement identifiables parmi les autres actifs. \n Les inventaires doivent inclure des conteneurs ou des images pouvant être instanciées. \n L'affectation d'un propriétaire à l'inventaire permet de s'assurer que l'inventaire reste à jour. \n\n Exemples \n Les méthodes pour maintenir un inventaire comprennent une base de données, une série de fichiers ou un outil de gestion d'inventaire."
    2_label: "Le périmètre soumis au standard PCI DSS est documenté et confirmé par l'entité au moins une fois tous les 12 mois et en cas de modification importante de l'environnement dans le périmètre. Au minimum, la validation du périmètre comprend : L’identification tous les flux de données pour les différentes étapes de paiement (par exemple, l'autorisation, la capture des règlements, les rétrofacturations et les remboursements) et les canaux d'acceptation (par exemple, la carte présente, la carte non présente et le commerce électronique); La mise à jour tous les diagrammes de flux de données conformément à l'exigence 1.2.4; L’identification de tous les emplacements où les données de carte sont stockées, traitées et transmises, y compris, sans toutefois s'y limiter : 1) tous les emplacements en dehors du CDE actuellement défini, 2) les applications qui traitent les CHD, 3) les transmissions entre les systèmes et les réseaux, et 4) les sauvegardes de fichiers; L’identification de tous les composants système dans le CDE, connectés au CDE, ou qui pourraient avoir une incidence sur la sécurité du CDE; L’identification de tous les mesures de segmentation utilisée et le ou les environnements à partir desquels le CDE est segmenté, y compris la justification des environnements hors de portée; L’identification de toutes les connexions d'entités tierces ayant accès au CDE; La confirmation que tous les flux de données identifiés, les données de carte, les composants système, les mesures de segmentation et les connexions de tiers ayant accès au CDE sont inclus dans le périmètre."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Le périmètre de validation au standard PCI DSS est vérifié périodiquement et, après des modifications importantes, par une analyse complète et des mesures techniques appropriées. \n\nℹ️ Notes D’applicabilité \n Cette confirmation annuelle du périmètre PCI DSS est une activité qui doit être effectuée par l'entité évaluée, et n'est pas la même que, ni se substitue à la confirmation du périmètre effectuée par l’auditeur de l'entité lors de l'évaluation annuelle. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les résultats documentés des revues du périmètre et interroger le personnel afin de vérifier que les revues sont effectuées : \n\t- Au moins une fois tous les 12 mois. \n\t- Après des modifications importantes de l'environnement dans le périmètre. \n\tb. Examiner les résultats documentés des examens de la périmètre effectués par l'entité afin de vérifier que l'activité de confirmation du périmètre du standard PCI DSS comporte tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n La validation fréquente du périmètre PCI DSS permet de garantir que le périmètre PCI DSS reste à jour et aligné sur les objectifs métiers changeants, et donc que les mesures de sécurité de sécurité protègent tous les composants systèmes appropriés. \n\n Bonne Pratique \n Une délimitation précise implique une évaluation critique du CDE et de tous les composants du système connecté afin de déterminer la couverture nécessaire pour les exigences du standard PCI DSS. Les activités de délimitation, y compris une analyse minutieuse et une surveillance continue, aident à garantir que les systèmes concernés sont correctement sécurisés. Lors de la documentation des emplacements des données de carte, l'entité peut envisager de créer un tableau ou une feuille de calcul contenant les informations suivantes : \n\t- Les magasins de données (bases de données, fichiers, cloud, etc.), en incluant la finalité du stockage des données et leur durée de rétention, \n\t- Quels éléments des CHD sont stockés (PAN, date d'expiration, nom du titulaire de la carte et/ou tout élément des données d’authentification sensibles avant la fin de l'autorisation), \n\t- Comment les données sont sécurisées (type de chiffrement et force, algorithme de hachage et force, troncature, tokenisation), \n\t- Comment l'accès aux magasins de données est enregistré, y compris une description du ou des mécanismes de journalisation utilisés (solution d'entreprise, niveau de l'application, niveau de système d'exploitation, etc.). \n En plus des systèmes et réseaux internes, toutes les connexions d'entités tierces ; par exemple, des partenaires commerciaux, des entités fournissant des services d'assistance à distance et d'autres prestataires de services, doivent être identifiées pour déterminer leur inclusion dans le périmètre PCI DSS. Une fois que les connexions concernées ont été identifiées, les mesures de sécurité applicables du standard PCI DSS peuvent être mis en œuvre afin de réduire le risque qu'une connexion tierce soit utilisée pour compromettre le CDE d'une entité. \n Un outil ou une méthodologie de découverte de données peuvent être utilisés pour faciliter l'identification de toutes les sources et emplacements des PAN, et pour rechercher des PAN qui résident sur des systèmes et des réseaux en dehors du CDE actuellement défini ou dans des endroits inattendus au sein du CDE : par exemple, dans un journal d'erreurs ou un fichier de vidage de la mémoire. Cette approche peut aider à garantir que des emplacements de PAN précédemment inconnus sont détectés et que le PAN est soit éliminé, soit correctement sécurisé. \n\n Informations Complémentaires \n Pour plus d'informations, se réferer au document : Information Supplement: Guidance for PCI DSS Scoping and Network Segmentation."
    3_prefix: "12.5.2.1"
    3_label: "Exigences supplémentaires pour les prestataires de services uniquement : Le périmètre PCI DSS est documenté et confirmé par l'entité au moins une fois tous les 12 mois et en cas de modification importante de l'environnement dans le périmètre. Au minimum, la validation du périmètre comprend tous les éléments spécifiés dans l'exigence 12.5.2."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n L'exactitude du périmètre PCI DSS est vérifiée en permanence par une analyse complète et des mesures techniques appropriées. \n\nℹ️ Notes D’applicabilité \n Cette exigence ne s'applique que lorsque l'entité évaluée est un prestataire de services. \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Procédure de test supplémentaire pour les évaluations des prestataires de services uniquement : Examiner les résultats documentés des revues du périmètre et interroger le personnel afin de vérifier que des examens selon l’exigence 12.5.2 sont effectués : \n\t- Au moins une fois tous les six mois, et \n\t- Après des modifications importantes \n\tb. Procédure de test supplémentaire pour les évaluations des prestataires de services uniquement : Examiner les résultats documentés des revues du périmètre afin de vérifier que la validation du périmètre comporte tous les éléments spécifiés dans l'exigence 12.5.2. \n\nℹ️ Directives \n Objectif \n Les prestataires de services ont généralement accès à de plus grands volumes de données de titulaires de carte que les commerçants ou peuvent fournir un point d'entrée qui peut être exploité pour ensuite compromettre plusieurs autres entités. En général, les prestataires de services ont également des réseaux plus grands et plus complexes qui sont sujets à des modifications plus fréquentes. La probabilité de modifications de la périmètre ignorées dans les réseaux complexes et dynamiques est plus élevée dans les environnements des prestataires de services. \n La validation plus fréquente du périmètre PCI DSS est susceptible de découvrir ces modifications négligées avant qu'elles ne puissent être exploitées par un attaquant."
    4_prefix: "12.5.3"
    4_label: "Exigences supplémentaires pour les prestataires de services uniquement : Les modifications importantes apportées à la structure de l'entreprise entraînent un examen documenté (interne) de l'impact sur le périmètre PCI DSS et l'applicabilité des mesures de sécurité, les résultats étant communiqués à la direction générale."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Le périmètre PCI DSS est confirmé après une modification organisationnelle importante. \n\nℹ️ Notes D’applicabilité \n Cette exigence ne s'applique que lorsque l'entité évaluée est un prestataire de services. \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Procédure de test supplémentaire pour les évaluations des prestataires de services uniquement : Examiner les politiques et les procédures afin de vérifier que les processus sont définis de sorte qu'une modification importante de la structure de l'entreprise entraîne un examen documenté de l'impact sur le périmètre PCI DSS et l'applicabilité des mesures de sécurité. \n\tb. Procédure de test supplémentaire pour les évaluations des prestataires de services uniquement : Examiner la documentation (par exemple, les procès-verbaux des réunions) et interroger le personnel responsable afin de vérifier que les modifications importantes apportées à la structure de l'entreprise ont donné lieu à des examens documentés comprenant tous les éléments spécifiés dans cette exigence, les résultats étant communiqués à la direction générale. \n\nℹ️ Directives \n Objectif \n La structure et la gestion d'une entreprise définissent les exigences et le protocole pour des opérations efficaces et sécurisées. Les modifications apportées à cette structure pourraient avoir des effets négatifs sur les mesures de sécurité et les cadres existants en réaffectant ou en supprimant des ressources qui prenaient autrefois en charge les mesures de sécurité liée au standard PCI DSS, ou en héritant de nouvelles responsabilités pour lesquelles des mesures de sécurité n'ont peut-être pas encore été établies. Par conséquent, il est important de revoir le périmètre et les mesures de sécurité en place pour PCI DSS lorsque des modifications sont apportées à la structure et à la gestion d'une entreprise afin de s'assurer que les mesures sont en place et actives. \n\n Exemples \n Les modifications apportées à la structure de l'entreprise comprennent, sans toutefois s'y limiter, les fusions ou acquisitions d'entreprises et les modifications ou réaffectations importantes du personnel responsable des mesures de sécurité de sécurité."
  6:
    title: "La sensibilisation à la sécurité est une activité continue."
    1_label: "Un programme formel de sensibilisation à la sécurité est mis en œuvre pour informer tout le personnel de la politique et des procédures de sécurité des informations de l'entité, ainsi que de son rôle dans la protection des données des titulaires de cartes."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Le personnel est informé le paysage des menaces, sa responsabilité dans le fonctionnement des mesures de sécurité pertinentes et est en mesure d'accéder à une assistance et à des conseils en cas de besoin. \n\nℹ️ Procédures de Test de L’approche Définie \n \t-  Examiner le programme de sensibilisation à la sécurité afin de vérifier qu'il sensibilise tout le personnel à la politique et aux procédures de sécurité des informations de l'entité, ainsi qu'au rôle du personnel dans la protection des données des porteurs de cartes. \n\nℹ️ Directives \n Objectif \n Si le personnel n'est pas informé des politiques et procédures de sécurité des informations de son entreprise et de ses propres responsabilités en matière de sécurité, les mesures de sécurité et les procédures qui ont été mises en œuvre peuvent devenir inefficaces en raison d'erreurs involontaires ou d'actions intentionnelles."
    2_label: "Le programme de sensibilisation à la sécurité est : Revu au moins une fois tous les 12 mois; Mis à jour si nécessaire pour prendre en compte. toute nouvelle menace et vulnérabilité susceptible d'avoir une incidence sur la sécurité du CDE de l'entité, ou les informations fournies au personnel concernant son rôle dans la protection des données des porteurs de cartes."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Le contenu du support de sensibilisation à la sécurité est révisé et mis à jour périodiquement. \n\nℹ️ Notes D’applicabilité \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner le contenu du programme de sensibilisation à la sécurité, les preuves des revues et interroger le personnel afin de vérifier que le programme de sensibilisation à la sécurité est conforme à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n L'environnement des menaces et les défenses d'une entité ne sont pas statiques. A ce titre, les supports du programme de sensibilisation à la sécurité doivent être mis à jour aussi souvent que nécessaire afin de garantir que la formation reçue par le personnel est à jour et représente l'environnement actuel des menaces."
    3_label: " Le personnel reçoit une formation de sensibilisation à la sécurité comme suit : À l'embauche et au moins une fois tous les 12 mois; Plusieurs méthodes de communication sont utilisées; Le personnel confirme au moins une fois tous les 12 mois avoir lu et compris la politique et les procédures de sécurité des informations. "
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Le personnel demeure informé du paysage des menaces, de sa responsabilité dans le fonctionnement des mesures de sécurité pertinentes et est en mesure d'accéder à une assistance et à des conseils en cas de besoin. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les éléments du programme de sensibilisation à la sécurité afin de vérifier que le personnel suit une formation de sensibilisation à la sécurité lors de son embauche et au moins une fois tous les 12 mois. \n\tb. Examiner les supports du programme de sensibilisation à la sécurité afin de vérifier que le programme comprend plusieurs méthodes de communication de la sensibilisation et de la formation du personnel. \n\tc. Interroger le personnel afin de vérifier qu'il a suivi une formation de sensibilisation et qu'il est conscient de son rôle dans la protection des données des titulaires de cartes. \n\td. Examiner les documents du programme de sensibilisation à la sécurité et les confirmations du personnel afin de vérifier que le personnel confirme au moins une fois tous les 12 mois avoir lu et compris la politique et les procédures de sécurité des informations. \n\nℹ️ Directives \n Objectif \n La formation du personnel assure que celui-ci reçoit les informations sur l'importance de la sécurité des informations et qu'il comprend son rôle dans la protection de l'entreprise. \n Exiger une confirmation du personnel permet de s'assurer qu'il a lu et compris les politiques et procédures de sécurité, et qu'il s'est engagé et continuera de s'engager à se conformer à ces politiques. \n\n Bonne Pratique \n Les entités peuvent intégrer la formation des nouveaux employés dans le cadre du processus d'intégration des ressources humaines. La formation doit décrire les « faire » et les « ne pas faire » liés à la sécurité. Une formation de recyclage périodique renforce les processus et procédures de sécurité clés qui pourraient être oubliés ou contournés. \n Les entités doivent envisager d'exiger une formation de sensibilisation à la sécurité chaque fois que du personnel est transféré dans des rôles où ils peuvent avoir un impact sur la sécurité des données de carte à partir de rôles alors qu’ils n'avaient pas cet impact. \n Les méthodes et le contenu de la formation peuvent varier en fonction des rôles des membres du personnel. \n\n Exemples \n Les différentes méthodes qui peuvent être utilisées pour fournir une sensibilisation et une éducation à la sécurité comprennent des affiches, des lettres, une formation sur le Web, une formation en présentiel, des réunions d'équipe et des incitations. \n Les confirmations du personnel peuvent être consignées par écrit ou par voie électronique."
    4_prefix: "12.5.3.1"
    4_label: "La formation de sensibilisation à la sécurité comprend la sensibilisation aux menaces et aux vulnérabilités qui pourraient avoir un impact sur la sécurité du CDE, y compris, sans toutefois s'y limiter : L’hameçonnage et attaques associées; L’ingénierie sociale."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Le personnel est conscient de ses propres vulnérabilités humaines et la façon dont les acteurs de la menace tenteront d'exploiter de telles vulnérabilités. Le personnel peut accéder à une assistance et à des conseils en cas de besoin. \n\nℹ️ Notes D’applicabilité \n Voir l'exigence 5.4.1 pour des conseils sur la différence entre les mesures de sécurité techniques et automatisés pour détecter et protéger les utilisateurs contre les attaques d'hameçonnage, et cette exigence pour fournir aux utilisateurs une formation de sensibilisation à la sécurité sur l'hameçonnage et l'ingénierie sociale. Ce sont deux exigences séparées et distinctes, et l'une n'est pas satisfaite par la mise en œuvre des mesures de sécurité requis par l'autre. Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner le contenu de la formation de sensibilisation à la sécurité afin de vérifier qu'il inclut tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Éduquer le personnel sur la façon de détecter, de réagir et de signaler les attaques potentielles d'hameçonnage et les attaques connexes, ainsi que les tentatives d'ingénierie sociale est essentiel pour minimiser la probabilité d'une attaque réussie. \n\n Bonne Pratique \n Un programme efficace de sensibilisation à la sécurité doit inclure des exemples de courriels d'hameçonnage et des tests périodiques afin de déterminer une grande prévalence de personnel signalant de telles attaques. Le support de formation qu'une entité peut envisager pour ce sujet comprend : \n\t- Comment identifier les attaques d'hameçonnage et autres attaques d'ingénierie sociale. \n\t- Comment réagir en cas de soupçon d'hameçonnage et d'ingénierie sociale. \n\t- Où et comment signaler une activité suspectée d'hameçonnage et d'ingénierie sociale. \n L'accent mis sur le signalement permet à l'entreprise de récompenser les comportements positifs, d'optimiser les défenses techniques (voir l'exigence 5.4.1) et de prendre des mesures immédiates pour supprimer les courriels d'hameçonnage similaires qui ont échappé aux défenses techniques des boîtes de réception des destinataires."
    5_prefix: "12.5.3.2"
    5_label: "La formation de sensibilisation à la sécurité comporte la sensibilisation à l'utilisation acceptable des technologies de l'utilisateur final conformément à l'exigence 12.2.1."
    5_desc: "ℹ️ Objectif de L’approche Personnalisée \n Le personnel au courant de sa responsabilité en matière de sécurité et d'utilisation des technologies de l'utilisateur final et est en mesure d'accéder à de l'aide et à des conseils en cas de besoin. \n\nℹ️ Notes D’applicabilité \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS.  \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner le contenu de la formation de sensibilisation à la sécurité afin de vérifier qu'il comprend une sensibilisation à l'utilisation acceptable des technologies de l'utilisateur final conformément à l'exigence 12.2.1. \n\nℹ️ Directives \n Objectif \n En incluant les points clés de la politique d'utilisation acceptable dans la formation régulière et le contexte associé, le personnel comprendra ses responsabilités et leur incidence sur la sécurité des systèmes d'une entreprise."
  7:
    title: "La vérification des antécédents du personnel est effectuée afin de réduire les risques d’attaques internes."
    1_label: "Le candidat à l’embauche qui aura accès au CDE fait l’objet d’une vérification des antécédents, dans les limites des lois locales, avant l'embauche afin de minimiser le risque d'attaques provenant de sources internes."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Le risque lié à l'accès des nouveaux membres du personnel au CDE est compris et maîtrisé. \n\nℹ️ Notes D’applicabilité \n Pour le personnel potentiel à embaucher pour des postes tels que les caissiers de magasin, qui n'ont accès qu'à un seul numéro de carte à la fois lors de la facilitation d'une transaction, cette exigence n'est qu'une recommandation. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Interroger la direction responsable du service des ressources humaines afin de vérifier que la sélection est effectuée, dans les limites des lois locales, avant d'embaucher du personnel potentiel qui aura accès au CDE. \n\nℹ️ Directives \n Objectif \n Une sélection approfondie avant l'embauche de personnel potentiel qui devrait avoir accès au CDE fournit aux entités les informations nécessaires pour prendre des décisions éclairées en matière de risque concernant le personnel qu'elles embauchent et qui aura accès au CDE. \n Parmi les autres avantages de la sélection du personnel potentiel, citons la garantie de la sécurité sur le lieu de travail et la confirmation des informations fournies par les employés potentiels sur leur CV. \n\n Bonne Pratique \n Les entités doivent envisager d’effectuer une vérification du personnel existant chaque fois qu'il est transféré dans des rôles où il a accès au CDE à partir de rôles où il n'avait pas cet accès. \n Pour être efficace, le niveau de sélection doit être adapté au poste. Par exemple, les postes nécessitant une plus grande responsabilité ou qui ont un accès administratif aux données ou systèmes critiques peuvent justifier une vérification plus détaillée ou plus fréquente que les postes avec moins de responsabilité et d'accès. \n\n Exemples \n Les options de vérification peuvent inclure, selon la région de l'entité, les antécédents professionnels, l'examen des informations publiques ou les ressources de médias sociaux, le casier judiciaire, les antécédents de crédit et la vérification des références."
  8:
    title: "Le risque pour les actifs de données associés aux relations avec les prestataires de services tiers (TPSP) est géré."
    1_label: "Une liste de tous les prestataires de services tiers (TPSP) avec lesquels les données de carte sont partagées ou qui pourraient affecter la sécurité des données de carte, comprenant une description pour chacun des services fournis est maintenue."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Des enregistrements sur les TPSP et les services fournis sont maintenus. \n\nℹ️ Notes D’applicabilité \n L'utilisation d'un TPSP conforme au standard PCI DSS ne rend pas une entité conforme au standard PCI DSS, ni ne supprime la responsabilité de l'entité quant à sa propre conformité au standard PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et les procédures afin de vérifier que les processus sont définis pour maintenir une liste des TPSP, avec une description pour chacun des services fournis, pour tous les TPSP avec lesquels les données de carte sont partagées ou qui pourraient affecter la sécurité des données de carte. \n\tb. Examiner la documentation afin de vérifier qu'une liste de tous les TPSP est maintenue et qu'elle comprend une description des services fournis. \n\nℹ️ Directives \n Objectif \n La tenue à jour d'une liste de tous les TPSP identifie où le risque potentiel s'étend à l'extérieur de l'entreprise et définit la surface d'attaque étendue de l'entreprise. \n\n Exemples \n Les différents types de TPSP comprennent ceux qui : \n\t- Stockent, traitent ou transmettent les données de carte au nom de l'entité (telles que les passerelles de paiement, les processeurs de paiement, les prestataires de services de paiement (PSP) et les fournisseurs de stockage hors site). \n\t- Gèrent les composants système inclus dans l'évaluation de la conformité au standard PCI DSS de l'entité (tels que les fournisseurs de services liés aux mesures de la sécurité réseau, les services anti-programmes malveillants et la gestion des incidents et des événements de sécurité (SIEM) ; les centres de contact et d'appel ; les sociétés d'hébergement Web ; et les fournisseurs de services cloud IaaS, PaaS, SaaS et FaaS). \n\t- Pourraient avoir un impact sur la sécurité du CDE de l'entité (comme les prestataires fournissant une assistance via un accès à distance et les développeurs de logiciels faits sur mesure)."
    2_label: "Les accords écrits avec les TPSP sont maintenus comme suit : Des accords écrits sont maintenus avec tous les TPSP avec lesquels les données de carte sont partagées ou qui pourraient avoir une incidence la sécurité du CDE; Les accords écrits comprennent des reconnaissances des TPSP qu'ils sont responsables de la sécurité des données de carte que les TPSP possèdent ou autrement stockent, traitent ou transmettent au nom de l'entité, ou dans la mesure où ils pourraient avoir un impact sur la sécurité du CDE de l'entité. "
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Des enregistrements sont conservés de la reconnaissance par chaque TPSP de sa responsabilité de protéger les données de carte. \n\nℹ️ Notes D’applicabilité \n La formulation exacte d'une reconnaissance dépendra de l'accord entre les deux parties, des détails du service fourni et des responsabilités attribuées à chaque partie. La reconnaissance n'a pas à inclure la formulation exacte fournie dans cette exigence. \n La preuve qu'un TPSP respecte les exigences du standard PCI DSS (par exemple, une attestation de conformité au standard PCI DSS (AOC) ou une déclaration sur le site Web d'une entreprise) n'est pas la même chose qu'un accord écrit spécifié dans cette exigence.  \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et les procédures afin de vérifier que les processus sont définis pour maintenir des accords écrits avec tous les TPSP conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Examiner les accords écrits avec les TPSP afin de vérifier qu'ils sont maintenus conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n La confirmation écrite d'un TPSP démontre son engagement à maintenir une sécurité adéquate des données de carte qu'il obtient de ses clients et que le TPSP est pleinement conscient des actifs qui pourraient être affectés lors de la prestation du service du TPSP. La mesure dans laquelle un TPSP spécifique est responsable de la sécurité des données de carte dépendra du service fourni et de l'accord entre le prestataire et l'entité évaluée (le consommateur). \n Conjointement avec l'exigence 12.9.1, cette exigence vise à promouvoir un niveau cohérent de compréhension entre les parties concernant leurs responsabilités liées au standard PCI DSS qui s’appliquent à eux. Par exemple, l'accord peut inclure les exigences applicables du standard PCI DSS à maintenir dans le cadre du service fourni. \n\n Bonne Pratique \n L'entité peut également envisager d'inclure dans son accord écrit avec un TPSP que le TPSP soutiendra la demande d'informations de l'entité conformément à l'exigence 12.9.2. Les entités devront également comprendre si des TPSP ont des relations « imbriquées » avec d'autres TPSP, ce qui signifie que le TPSP principal passe des contrats avec un ou plusieurs autres TPSP dans le but de fournir un service. \n Il est important de comprendre si le TPSP principal s'appuie sur le ou les TPSP secondaires pour assurer la conformité globale d'un service, et les types d'accords écrits que le TPSP principal a mis en place avec les TPSP secondaires. Les entités peuvent envisager d'inclure dans leur accord écrit la couverture de tout TPSP « imbriqué » qu'un TPSP principal peut utiliser. \n\n Informations Complémentaires \n Se référer au document : « Information Supplement: Third-Party Security Assurance for further guidance. »"
    3_label: "Un processus établi est mis en œuvre pour engager les TPSP, y compris des mesures de sécurité préalables appropriés avant l'engagement."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n La capacité, l'intention et les ressources d'un TPSP potentiel pour protéger adéquatement les données de carte sont évaluées avant que le TPSP ne soit engagé. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures afin de vérifier que les processus sont définis pour engager les TPSP, y compris des mesures de sécurité préalables appropriés avant l'engagement. \n\tb. Examiner les preuves et interroger le personnel responsable afin de vérifier que le processus d'engagement des TPSP comporte des mesures de sécurité préalables appropriés avant l'engagement. \n\nℹ️ Directives \n Objectif \n Un processus approfondi d'engagement des TPSP, comprenant les détails de la sélection et de la vérification avant l'engagement, permet de garantir qu'un TPSP est soigneusement vérifié en interne par une entité avant d'établir une relation formelle et que le risque pour les données des porteurs de cartes associé à l'engagement du TPSP est compris. \n\n Bonne Pratique \n Les processus et les objectifs spécifiques des mesures de sécurité préalables varieront pour chaque entreprise. Les éléments à prendre en compte comportent les pratiques de signalement du prestataire, les procédures de notification de violation et de réponse aux incidents, les détails de la manière dont les responsabilités liées au standard PCI DSS sont attribuées entre chaque partie prenante, la manière dont le TPSP valide sa conformité au standard PCI DSS et les preuves qu'il fournit."
    4_label: "Un programme est mis en œuvre pour surveiller l'état de conformité au standard PCI DSS des TPSP au moins une fois tous les 12 mois."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n L'état de conformité au standard PCI DSS des TPSP est vérifié périodiquement. \n\nℹ️ Notes D’applicabilité \n Lorsqu'une entité passe un accord avec un TPSP pour satisfaire aux exigences du standard PCI DSS au nom de l'entité (par exemple, via un service de pare-feu), l'entité doit travailler avec le TPSP pour s'assurer que les exigences applicables du standard PCI DSS sont satisfaites. Si le TPSP ne satisfait pas aux exigences applicables du standard PCI DSS, ces exigences ne sont pas non plus « en place » chez l'entité. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures afin de vérifier que les processus sont définis pour surveiller l'état de conformité au standard PCI DSS des TPSP au moins une fois tous les 12 mois. \n\tb. Examiner la documentation et interroger le personnel responsable afin de vérifier que l'état de conformité au standard PCI DSS de chaque TPSP est contrôlé au moins une fois tous les 12 mois. \n\nℹ️ Directives \n Objectif \n Connaître l'état de conformité au standard PCI DSS de tous les TPSP engagés fournit l'assurance et la conscience quant à savoir s'ils se conforment aux exigences applicables aux services qu'ils offrent à l'entreprise. \n\n Bonne Pratique \n Si le TPSP offre une variété de services, l'état de conformité que l'entité surveille doit être spécifique aux services fournis à l'entité et aux services couverts par l'évaluation du standard PCI DSS de l'entité. \n Si un TPSP détient une attestation de conformité au standard PCI DSS (AOC), on s'attend à ce que le TPSP la fournisse aux clients sur demande pour démontrer leur statut de conformité au standard PCI DSS. \n Si le TPSP n'a pas subi d'évaluation du standard PCI DSS, il peut être en mesure de fournir d'autres preuves suffisantes pour démontrer qu'il a satisfait aux exigences applicables sans subir de validation formelle de conformité. Par exemple, le TPSP peut fournir des preuves spécifiques à l’auditeur de l'entité afin que l’auditeur puisse confirmer que les exigences applicables sont satisfaites. Alternativement, le TPSP peut choisir de subir plusieurs évaluations à la demande par chacun des auditeurs de ses clients, chaque évaluation visant à confirmer que les exigences applicables sont satisfaites. \n\n Informations Complémentaires \n Pour plus d'informations sur les prestataires de services tiers, consulter : \n\t- La section du standard PCI DSS : Use of Third-Party Service Providers. \n\t- Information Supplement: Third-Party Security Assurance."
    5_label: "Des informations sont conservées sur les exigences du standard PCI DSS qui sont gérées par chaque TPSP, celles qui sont gérées par l'entité et celles qui sont partagées entre le TPSP et l'entité."
    5_desc: "ℹ️ Objectif de L’approche Personnalisée \n Des enregistrements détaillant les exigences du standard PCI DSS et les composants systèmes associés dont chaque TPSP est seul ou conjointement responsable sont conservés et révisés périodiquement. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures afin de vérifier que les processus sont définis pour conserver des informations sur les exigences du standard PCI DSS qui sont gérées par chaque TPSP, celles qui sont gérées par l'entité et celles qui sont partagées entre le TPSP et l'entité. \n\tb. Examiner la documentation et interroger le personnel afin de vérifier que l'entité conserve des informations sur les exigences du standard PCI DSS qui sont gérées par chaque TPSP, celles qui sont gérées par l'entité et celles qui sont partagées entre les deux entités. \n\nℹ️ Directives \n Objectif \n Il est important que l'entité comprenne les exigences et sous-exigences du standard PCI DSS que ses TPSP ont accepté de respecter, les exigences qui sont partagées entre le TPSP et l'entité, et pour celles qui sont partagées, des détails sur la façon dont les exigences sont partagées et l'entité qui est responsable de satisfaire à chaque sous-exigence. \n Sans cette compréhension commune, il est inévitable que l'entité et le TPSP supposent qu'une sous-exigence donnée du standard PCI DSS relève de la responsabilité de l'autre partie, et par conséquent, cette sous-exigence peut ne pas être traitée du tout. \n Les informations spécifiques qu'une entité conserve dépendent de l'accord particulier passé avec ses prestataires, du type de service, etc. Les TPSP peuvent définir leurs responsabilités du standard PCI DSS comme étant les mêmes pour tous leurs clients ; sinon, cette responsabilité doit être convenue à la fois par l'entité et le TPSP. \n\n Bonne Pratique \n Les entités peuvent documenter ces responsabilités via une matrice qui identifie toutes les exigences applicables du standard PCI DSS et indique pour chaque exigence si l'entité ou le TPSP est responsable du respect de cette exigence ou s'il s'agit d'une responsabilité partagée. Ce type de document est souvent appelé matrice de responsabilité. \n Il est également important que les entités comprennent si des TPSP ont des relations « imbriquées » avec d'autres TPSP, ce qui signifie que le TPSP principal passe des contrats avec un ou plusieurs autres TPSP aux fins de fournir un service. Il est important de comprendre si le TPSP principal s'appuie sur le ou les TPSP secondaires pour assurer la conformité globale d'un service, et comment le TPSP principal surveille les performances du service et l'état de conformité du standard PCI DSS du ou des TPSP secondaires. À noter qu'il est de la responsabilité du TPSP principal de gérer et de surveiller tout TPSP secondaire. \n\n Informations Complémentaires \n Se référer au document Information Supplement: Third-Party Security Assurance pour un exemple de modèle de matrice de responsabilité."
  9:
    title: "Les prestataires de services tiers (TPSP) prennent en charge la conformité du standard PCI DSS de leurs clients."
    1_label: "Exigences supplémentaires pour les prestataires de services uniquement : Les TPSP confirment par écrit aux clients qu'ils sont responsables de la sécurité des données de carte que le TPSP possède ou autrement stocke, traite ou transmet au nom du consommateur, ou dans la mesure où ils pourraient avoir un impact sur la sécurité du CDE du consommateur."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les TPSP reconnaissent officiellement leurs responsabilités en matière de sécurité envers leurs clients. \n\nℹ️ Notes D’applicabilité \n Cette exigence ne s'applique que lorsque l'entité évaluée est un prestataire de services. \n La formulation exacte d'une reconnaissance dépendra de l'accord entre les deux parties, des détails du service fourni et des responsabilités attribuées à chaque partie. La reconnaissance n'a pas à inclure la formulation exacte fournie dans cette exigence. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Procédure de test supplémentaire pour les évaluations des prestataires de services uniquement : Examiner les politiques, les procédures et les modèles du TPSP utilisés pour les accords écrits afin de vérifier que les processus sont définis pour que le TPSP fournisse des confirmations écrites aux clients conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Conjointement avec l'exigence 12.8.2, cette exigence vise à promouvoir un niveau constant de compréhension entre les TPSP et leurs clients concernant leurs responsabilités applicables du standard PCI DSS. La confirmation des TPSP témoigne de leur engagement à maintenir une sécurité adéquate des données de carte qu'ils obtiennent de leurs clients. \n La méthode par laquelle le TPSP fournit une confirmation écrite doit être convenue entre le prestataire et ses clients."
    2_label: "Exigences supplémentaires pour les prestataires de services uniquement : Les TPSP prennent en charge les demandes d'informations de leurs clients pour répondre aux exigences 12.8.4 et 12.8.5 en fournissant, à la demande du consommateur, ce qui suit : Des informations sur l'état de conformité au standard PCI DSS pour tout service que le TPSP effectue pour le compte des clients (exigence 12.8.4); Des informations sur les exigences du standard PCI DSS qui relèvent de la responsabilité du TPSP et celles qui relèvent de la responsabilité du consommateur, y compris toute responsabilité partagée (exigence 12.8.5)."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les TPSP fournissent les informations nécessaires pour soutenir les efforts de conformité au standard PCI DSS de leurs clients. \n\nℹ️ Notes D’applicabilité \n Cette exigence ne s'applique que lorsque l'entité évaluée est un prestataire de services. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Procédure de test supplémentaire pour les évaluations des prestataires de services uniquement : Examiner les politiques et les procédures afin de vérifier que les processus sont définis pour les TPSP pour prendre en charge la demande d'informations des clients pour répondre aux exigences 12.8.4 et 12.8.5 conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Si un TPSP ne fournit pas les informations nécessaires pour permettre à ses clients de répondre à leurs exigences de sécurité et de conformité, les clients ne seront pas en mesure de protéger les données des titulaires de cartes ni de respecter leurs propres obligations contractuelles. \n\n Bonne Pratique \n Si un TPSP détient une attestation de conformité au standard PCI DSS (AOC), on s'attend à ce que le TPSP la fournisse aux clients sur demande pour démontrer leur statut de conformité au standard PCI DSS. \n Si le TPSP n'a pas subi d'évaluation du standard PCI DSS, il peut être en mesure de fournir d'autres preuves suffisantes pour démontrer qu'il a satisfait aux exigences applicables sans subir de validation formelle de conformité. Par exemple, le TPSP peut fournir des preuves spécifiques à l'auditeur de l'entité afin qu’il puisse confirmer que les exigences applicables sont satisfaites. Alternativement, le TPSP peut choisir de subir plusieurs évaluations à la demande par chacun des auditeurs de ses clients, chaque évaluation visant à confirmer que les exigences applicables sont satisfaites. \n Les TPSP sont tenus de fournir des preuves suffisantes à leurs clients afin de vérifier que le périmètre de l'évaluation PCI DSS du TPSP a couvert les services applicables au consommateur, et que les exigences PCI DSS pertinentes ont été examinées et qu'il a été déterminé qu'elles sont en place. \n Les TPSP peuvent définir leurs responsabilités liées au standard PCI DSS comme étant les mêmes pour tous leurs clients ; sinon, cette responsabilité doit être convenue entre le consommateur et le TPSP. Il est important que le consommateur comprenne les exigences et sousexigences du standard PCI DSS que ses TPSP ont accepté de respecter, les exigences qui sont partagées entre le TPSP et le consommateur, et pour celles qui sont partagées, des détails sur la façon dont les exigences sont partagées et l'entité qui est responsable de satisfaire à chaque sousexigence. Un exemple de la manière de documenter ces responsabilités via une matrice qui identifie toutes les exigences applicables du standard PCI DSS et indique si le consommateur ou le TPSP est responsable du respect de cette exigence ou s'il s'agit d'une responsabilité partagée. \n\n Informations Complémentaires \n Pour plus d'informations, se réferer à : \n\t- La section du standard PCI DSS : Utilisation de prestataires de services tiers. \n\t- Information Supplement: Third-Party Security Assurance (comprend un modèle de matrice de responsabilité)"
  10:
    title: "Les incidents de sécurité soupçonnés et confirmés pouvant avoir un impact sur le CDE sont traités immédiatement."
    1_label: "Un plan de réponse aux incidents existe et est prêt à être activé en cas d'incident de sécurité soupçonné ou avéré. Le plan comprend, mais n'est pas limité à : Les rôles, responsabilités et stratégies de communication et de contact en cas d'incident de sécurité soupçonné ou avéré, y compris la notification des marques de cartes de paiement et des acquéreurs, au minimum; Les procédures de réponse aux incidents avec des activités de confinement et d'atténuation spécifiques pour différents types d'incidents; Les procédures de reprise et de continuité de l'activité; Les processus de sauvegarde des données; L'analyse des exigences légales en matière de signalement des compromissions; La couverture et les réponses de tous les composants critiques du système; La référence ou l'inclusion des procédures de réponse aux incidents des marques de carte paiement."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Un plan complet de réponse aux incidents qui répond aux attentes de la marque de carte est maintenu. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner le plan de réponse aux incidents afin de vérifier que le plan existe et comporte au moins les éléments spécifiés dans cette exigence. \n\tb. Interroger le personnel et examiner la documentation des incidents ou alertes précédemment signalés afin de vérifier que le plan et les procédures documentés de réponse aux incidents ont été suivis. \n\nℹ️ Directives \n Objectif \n Sans un plan complet de réponse aux incidents qui est correctement diffusé, lu et compris par les parties responsables, la confusion et l'absence d'une réponse cohérente pourraient créer des temps d'arrêt supplémentaires pour l'entreprise, une exposition inutile aux médias publics, ainsi qu'un risque de perte financière et/ou de réputation et de responsabilités légales. \n\n Bonne Pratique \n Le plan de réponse aux incidents doit être complet et contenir tous les éléments clés pour les parties prenantes (par exemple, les aspects juridiques, les communications) afin de permettre à l'entité de réagir efficacement en cas de violation susceptible d'affecter les données de carte. Il est important de maintenir le plan à jour avec les coordonnées actuelles de toutes les personnes désignées comme ayant un rôle à jouer dans la réponse aux incidents. D'autres parties concernées par les notifications peuvent inclure les clients, les institutions financières (acquéreurs et émetteurs) et les partenaires commerciaux. \n Les entités doivent prendre en considération la manière de traiter toutes les compromissions de données au sein du CDE dans leurs plans de réponse aux incidents, y compris les données de carte, les clés de chiffrement sans fil, les clés de chiffrement utilisées pour la transmission et le stockage ou les données de carte ou les données de titulaires de cartes, etc. \n\n Exemples \n Les exigences légales en matière de signalement des compromissions comportent celles de la plupart des États américains, le règlement général sur la protection des données (RGPD) de l'UE et la loi sur la protection des données personnelles (Singapour). \n\n Informations Complémentaires \n Pour plus d'informations, se réferer au document NIST SP 800-61 Rev. 2, Computer Security Incident Handling Guide."
    2_label: "Au moins une fois tous les 12 mois, le plan de réponse aux incidents de sécurité est : Revu et le contenu est mis à jour si besoin; Testé, en incluant tous les éléments énumérés à l'exigence 12.10.1."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Le plan de réponse aux incidents est tenu à jour et testé périodiquement. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Interroger le personnel et examiner la documentation afin de vérifier qu'au moins une fois tous les 12 mois, le plan de réponse aux incidents de sécurité est : Examiné et mis à jour au besoin; Testé, en incluant tous les éléments énumérés à l'exigence 12.10.1.  \n\nℹ️ Directives \n Objectif \n Des tests appropriés du plan de réponse aux incidents de sécurité peuvent identifier les processus métier défectueux et garantir que les étapes clés ne sont pas ignorées, ce qui pourrait entraîner une exposition accrue lors d'un incident. Des tests périodiques du plan garantissent que les processus restent viables et, de même, garantissent que tout le personnel concerné de l'entreprise connaît le plan. \n\n Bonne Pratique \n Le test du plan de réponse aux incidents peut inclure des incidents simulés et les réponses correspondantes sous forme d'un « exercice sur table », qui comporte la participation du personnel concerné. Une revue de l'incident et de la qualité de la réponse peut fournir aux entités l'assurance que tous les éléments requis sont inclus dans le plan."
    3_label: "Du personnel spécifique est désigné pour être disponible 24h/24 et 7j/7 pour répondre aux incidents de sécurité soupçonnés ou avérés."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les incidents sont traités immédiatement, comme il se doit. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation et interroger le personnel responsable occupant les rôles désignés afin de vérifier que le personnel spécifique est désigné pour être disponible 24h/24 et 7j/7 pour répondre aux incidents de sécurité. \n\nℹ️ Directives \n Objectif \n Un incident peut survenir à tout moment. Par conséquent, si une personne formée à la réponse aux incidents et familiarisée avec le plan de l'entité est disponible lorsqu'un incident est détecté, la capacité de l'entité à réagir correctement à l'incident est augmentée. \n\n Bonne Pratique \n Souvent, du personnel spécifique est désigné pour faire partie d'une équipe de réponse aux incidents de sécurité, l'équipe ayant la responsabilité globale de répondre aux incidents (peut-être selon un calendrier tournant) et de gérer ces incidents conformément au plan. L'équipe d'intervention en cas d'incident peut être composée de membres principaux qui sont affectés en permanence ou de personnel « à la demande » qui peut être appelé si nécessaire, en fonction de leur expertise et des spécificités de l'incident. \n Avoir des ressources disponibles pour répondre rapidement aux incidents minimise les perturbations pour l'entreprise. \n Les exemples de types d'activités auxquelles l'équipe ou les individus doivent répondre comportent toute preuve d'activité non autorisée, la détection de points d'accès sans fil non autorisés, les alertes IDS critiques et les rapports de modifications critiques non autorisées du système ou des fichiers de contenu."
    4_label: "Le personnel chargé de répondre aux incidents de sécurité soupçonnés et avérés est formé de manière appropriée et périodique sur ses responsabilités en matière de réponse aux incidents."
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Le personnel est au courant de son rôle et de ses responsabilités dans la réponse aux incidents, et est en mesure d'accéder à de l'aide et des conseils en cas de besoin. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation de formation et interroger le personnel d'intervention en cas d'incident afin de vérifier que le personnel est formé de manière appropriée et périodique sur ses responsabilités en matière d'intervention en cas d'incident. \n\nℹ️ Directives \n Objectif \n Sans une équipe de réponse aux incidents, formée et facilement disponible, des dommages étendus au réseau pourraient se produire, et les données et systèmes critiques pourraient devenir « pollués » par une manipulation inappropriée des systèmes ciblés. Cela peut entraver le succès d'une enquête après incident. \n\n Bonne Pratique \n Il est important que tout le personnel impliqué dans la réponse aux incidents soit formé et connaisse la gestion des preuves pour les investigations technico-légales."
    5_prefix: "12.10.4.1"
    5_label: "La fréquence des formations périodiques pour le personnel d'intervention en cas d'incident est définie dans l'analyse de risque ciblée de l'entité, qui est effectuée conformément à tous les éléments spécifiés dans l'exigence 12.3.1."
    5_desc: "ℹ️ Objectif de L’approche Personnalisée \n Le personnel d'intervention en cas d'incident est formé à une fréquence adaptée au risque de l'entité. \n\nℹ️ Notes D’applicabilité \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner l'analyse de risques ciblée de l'entité pour la fréquence de formation du personnel d'intervention en cas d'incident afin de vérifier que l'analyse de risques a été effectuée conformément à tous les éléments spécifiés dans l'exigence 12.3.1. \n\tb. Examiner les résultats documentés de la formation périodique du personnel d'intervention en cas d'incident et interroger le personnel afin de vérifier que la formation est effectuée à la fréquence définie dans l'analyse de risques ciblée de l'entité effectuée pour la présente exigence. \n\nℹ️ Directives \n Objectif \n L'environnement et le plan de réponse aux incidents de chaque entité sont différents et l'approche dépendra d'un certain nombre de facteurs, notamment la taille et la complexité de l'entité, le degré de modification de l'environnement, la taille de l'équipe de réponse aux incidents et la rotation du personnel. \n La réalisation d'une analyse de risques permettra à l'entité de déterminer la fréquence optimale de formation du personnel chargé de répondre aux incidents."
    6_prefix: "12.10.5"
    6_label: "Le plan de réponse aux incidents de sécurité comprend la surveillance et la réponse aux alertes des systèmes de surveillance de la sécurité, y compris, sans toutefois s'y limiter : Systèmes de détection et de prévention des intrusions; Mécanismes de sécurité réseau; Mécanismes de détection des modifications pour les fichiers critiques; Mécanisme de détection des modifications et des altérations pour les pages de paiement. Ce point est une Bonne Pratique jusqu'à sa date d'entrée en vigueur ; se référer aux Notes D’applicabilité ci-dessous pour plus de détails; Détection des points d'accès sans fil non autorisés."
    6_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les alertes générées par les technologies de surveillance et de détection sont traitées de manière structurée et reproductible. \n\nℹ️ Notes D’applicabilité \n La point ci-dessus (pour surveiller et répondre aux alertes d'un mécanisme de détection des modifications et des altérations pour les pages de paiement) est une Bonne Pratique jusqu'au 31 mars 2025, après quoi elle sera obligatoire dans le cadre de l'exigence 12.10.5 et doit être pleinement prise en compte lors d'une évaluation du standard PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n Examiner la documentation et observer les processus de réponse aux incidents afin de vérifier que la surveillance et la réponse aux alertes des systèmes de surveillance de la sécurité sont couvertes dans le plan de réponse aux incidents de sécurité, y compris, sans toutefois s'y limiter, les systèmes spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n La réponse aux alertes générées par les systèmes de surveillance de la sécurité qui sont explicitement conçus pour se concentrer sur les risques potentiels pour les données est essentielle pour prévenir une violation et, par conséquent, elle doit être incluse dans les processus de réponse aux incidents."
    7_prefix: "12.10.6"
    7_label: "Le plan de réponse aux incidents de sécurité est modifié et mis à niveau en fonction des leçons apprises et pour intégrer les développements de l'industrie."
    7_desc: "ℹ️ Objectif de L’approche Personnalisée \n L'efficacité et la précision du plan de réponse aux incidents sont examinées et mises à jour après chaque invocation. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures afin de vérifier que les processus sont définis pour modifier et faire évoluer le plan de réponse aux incidents de sécurité en fonction des leçons apprises et pour intégrer les développements de l'industrie. \n\tb. Examiner le plan de réponse aux incidents de sécurité et interroger le personnel responsable afin de vérifier que le plan de réponse aux incidents est modifié et mis à niveau en fonction des leçons apprises et pour intégrer les développements de l'industrie. \n\nℹ️ Directives \n Objectif \n L'intégration des leçons apprises dans le plan de réponse aux incidents après qu'un incident se produise et en phase avec les développements de l'industrie, aide à maintenir le plan à jour et capable de réagir aux menaces émergentes et aux tendances de sécurité. \n\n Bonne Pratique \n L'exercice sur les leçons apprises devrait inclure tous les niveaux du personnel. Bien qu'il soit souvent inclus dans le cadre de l'examen de l'ensemble de l'incident, il doit se concentrer sur la manière dont la réponse de l'entité à l'incident pourrait être améliorée. \n Il est important de ne pas considérer uniquement les éléments de la réponse qui n'ont pas eu les résultats prévus, mais aussi de comprendre ce qui a bien fonctionné et si les leçons tirées de ces éléments qui ont bien fonctionné peuvent être appliquées aux domaines du plan qui n'ont pas fonctionné. \n Une autre façon d'optimiser le plan de réponse aux incidents d'une entité consiste à comprendre les attaques lancées contre d'autres entreprises et à utiliser ces informations pour affiner les procédures de détection, de confinement, d'atténuation ou de récupération de l'entité."
    8_prefix: "12.10.7"
    8_label: "Des procédures d'intervention en cas d'incident sont en place, à déclencher dès la détection de PAN stockés là où ça n'est pas prévu, et inclue : Déterminer ce qu'il faut faire si les PAN sont découverts en dehors du CDE, y compris leur récupération, sa suppression sécurisée et/ou sa migration vers le CDE actuellement défini, selon le cas; Identifier si des données d'authentification sensibles sont stockées avec les PAN; Déterminer d'où proviennent les données de carte et comment elles se sont retrouvées là où elles n'étaient pas prévues; Corriger les fuites de données ou les lacunes des processus qui ont fait que les données de carte se trouvaient là où elles n'étaient pas prévues."
    8_desc: "ℹ️ Objectif de L’approche Personnalisée \n Des processus sont en place pour répondre à, analyser et traiter rapidement les situations dans le cas où des PAN en clair sont détectés là où il n'est pas censé être. \n\nℹ️ Notes D’applicabilité \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date, elle sera obligatoire et devra être pleinement prise en compte lors des évaluations PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les procédures de réponse aux incidents documentées afin de vérifier que les procédures de réponse à la détection de PAN stockés partout où ils ne sont pas censés être, sont prêtes à être lancées et comportent tous les éléments spécifiés dans cette exigence. \n\tb. Interroger le personnel et examiner les enregistrements des actions d'intervention afin de vérifier que les procédures d'intervention en cas d'incident sont exécutées lors de la détection de PAN stockés partout où ils ne sont pas censés être. \n\nℹ️ Directives \n Objectif \n Avoir des procédures documentées de réponse aux incidents qui sont suivies dans le cas où des PAN stockés sont trouvés là où il n'est pas prévu qu'ils se trouvent, aide à identifier les actions correctives nécessaires et à prévenir d'autres fuites à l'avenir. \n\n Bonne Pratique \n Si les PAN ont été trouvés en dehors du CDE, une analyse doit être effectuée pour 1) déterminer s'ils ont été enregistrés indépendamment d'autres données ou avec des données d'authentification sensibles, 2) identifier la source des données et 3) identifier les lacunes de contrôle qui ont entraîné que les données soient en dehors du CDE. \n Les entités doivent déterminer s'il existe des facteurs contributifs, tels que des processus professionnels, le comportement des utilisateurs, des configurations système inappropriées, etc. qui ont entraîné le stockage des PAN dans un emplacement imprévu. Si de tels facteurs contributifs sont présents, ils doivent être traités conformément à cette exigence afin d'éviter qu'ils ne se reproduisent."
13:
  prefix: "Annexe A1"
  title: "Autres Exigences du Standard PCI DSS pour les Prestataires de Services Mutualisés"
  desc: "Tous les prestataires de services sont responsables du respect des exigences du standard PCI DSS pour leurs propres environnements, telles qu'elles s'appliquent aux services proposés à leurs clients. De plus, les fournisseurs de services mutualisés doivent satisfaire aux exigences de la présente annexe. \n Les fournisseurs de services mutualisés sont un type de prestataires de services qui offre divers services partagés aux commerçants et autres prestataires de services, où les clients partagent des ressources système (telles que des serveurs physiques ou virtuels), l’infrastructure, des applications (y compris des logiciels en tant que service (SaaS) et/ou des bases de données. Les services peuvent inclure, sans toutefois s'y limiter, l'hébergement de plusieurs entités sur un seul serveur partagé, la prestation de services de commerce électronique et/ou de \"panier d'achat\", les services d'hébergement Web, les applications de paiement, diverses applications et services cloud, et connexions aux passerelles et processeurs de paiement. \n Les prestataires qui ne fournissent que des services de centre de données partagés (souvent appelés fournisseurs de colocation ou « co-lo »), où l'équipement, l'espace et la bande passante sont disponibles en service mutualisé, ne sont pas considérés comme des prestataires de services mutualisés aux fins de la présente Annexe. \n\n⚠️ Remarque \n Bien qu’un prestataire de service mutualisé respecte ces exigences, chaque consommateur du prestataire doit tout de même respecter les exigences de PCI DSS qui sont applicables à son périmètre et suivre le processus adéquat de validation de la conformité. Souvent, il existe des exigences PCI DSS pour lesquelles la responsabilité est partagée entre le prestataire et le consommateur (pour peut-être différents aspects de l'environnement). Les exigences 12.8 et 12.9 définissent les exigences spécifiques aux relations entre tous les prestataires de services tiers (TPSP) et leurs clients, ainsi que les responsabilités des deux. Cela comprend la définition des services spécifiques que le consommateur reçoit, ainsi que les exigences du standard PCI DSS qu'il incombe au consommateur de respecter, celles qui relèvent de la responsabilité du TPSP et les exigences partagées entre le consommateur et le TPSP."
  1:
    prefix: "A1.1"
    title: "Les fournisseurs de services mutualisés protègent et séparent tous les environnements et données des clients."
    1_prefix: "A1.1.1"
    1_label: "La séparation logique est mise en œuvre comme suit : Le prestataire ne peut pas accéder aux environnements de ses clients sans autorisation; Les clients ne peuvent pas accéder à l'environnement du fournisseur sans autorisation."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les clients ne peuvent pas accéder à l'environnement du prestataire. Le prestataire ne peut pas accéder aux environnements de ses clients sans autorisation. \n\nℹ️ Notes D’applicabilité \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date elle sera obligatoire et devra être pleinement prise en compte lors d'une évaluation du standard PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation et les configurations système et réseau et interroger le personnel afin de vérifier que la séparation logique est mise en œuvre conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Cloisonner l'environnement du prestataire et l'environnement du consommateur afin d’empêcher qu‘un acteur malveillant dans l'environnement du prestataire puisse compromettre l'environnement du consommateur, et de même, qu’un acteur malveillant dans l'environnement d'un consommateur puisse compromettre le prestataire et potentiellement d'autres clients du prestataire. \n Les environnements mutualisés doivent être isolés les uns des autres et de l'infrastructure du fournisseur de sorte qu'ils puissent être des entités gérées séparément sans connectivité entre eux. \n\n Bonne Pratique \n Les prestataires doivent assurer une séparation robuste entre les environnements conçus pour l'accès des clients ; par exemple, les portails de configuration et de facturation, et l'environnement privé du prestataire auquel seul le personnel autorisé du prestataire doit accéder. \n L'accès des prestataires de services aux environnements des clients est effectué conformément à l'exigence 8.2.3. \n\n Informations Complémentaires \n Se reporter au Complément d'informations : Directives du PCI SSC pour l'informatique en cloud pour plus d'informations sur les environnements cloud."
    2_prefix: "A1.1.2"
    2_label: "Des mesures de sécurité sont mises en place de manière à ce que chaque consommateur n'ait l'autorisation d'accéder qu'à ses propres données de porteurs de cartes et au CDE."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les clients ne peuvent pas accéder aux environnements d'autres clients. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation afin de vérifier que les mesures sont définies de sorte que chaque consommateur n'ait l'autorisation d'accéder qu'à ses propres données de titulaires de cartes et au CDE. \n\tb. Examiner les configurations du système afin de vérifier que les clients disposent de privilèges établis pour accéder uniquement à leurs propres données de carte et leur CDE. \n\nℹ️ Directives \n Objectif \n Il est important qu'un prestataire de services mutualisés définisse des mesures de sécurité afin que chaque consommateur ne puisse accéder qu'à son propre environnement et CDE afin d'éviter l'accès non autorisé d'un environnement consommateur à un autre. \n\n Exemples \n Dans une infrastructure basée sur le cloud, telle qu'une offre d'infrastructure en tant que service (IaaS), le CDE des clients peut inclure des périphériques réseaux virtuels et des serveurs virtuels qui sont configurés et gérés par les clients, y compris les systèmes d'exploitation, les fichiers, la mémoire, etc."
    3_prefix: "A1.1.3"
    3_label: "Des mesures de sécurité sont mises en place de sorte que chaque consommateur ne puisse accéder qu'aux ressources qui lui sont allouées."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les clients ne peuvent pas impacter les ressources allouées à d'autres clients. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les privilèges des clients afin de vérifier que chaque consommateur ne peut accéder qu'aux ressources qui lui sont allouées. \n\nℹ️ Directives \n Objectif \n Pour éviter tout impact involontaire ou intentionnel sur les environnements ou les données de carte d'autres clients, il est important que chaque consommateur puisse accéder uniquement aux ressources qui lui sont allouées."
    4_prefix: "A1.1.4"
    4_label: "L'efficacité des mesures de séparation logique utilisées pour séparer les environnements des clients est testée et confirmée au moins une fois tous les six mois via des tests d'intrusion. "
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n La segmentation des environnements consommateur à partir d'autres environnements est périodiquement validée comme efficace. \n\nℹ️ Notes D’applicabilité \n Le test d'une séparation adéquate entre les clients dans un environnement de prestataires de services mutualisés s'ajoute aux tests d’intrusion spécifiés dans l'exigence 11.4.6. Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date elle sera obligatoire et devra être pleinement prise en compte lors d'une évaluation du standard PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les résultats des tests d'intrusion les plus récents afin de vérifier que les tests ont confirmé l'efficacité des mesures de séparation logique utilisées pour séparer les environnements des clients. \n\nℹ️ Directives \n Objectif \n Les prestataires de services mutualisés sont tenus de gérer la segmentation entre leurs clients. \n Sans l'assurance technique que les mesures de segmentation sont efficaces, il est possible que des modifications apportées à la technologie du prestataire de services créent par inadvertance une vulnérabilité qui pourrait être exploitée par tous les clients du prestataire de services. \n\n Bonne Pratique \n L'efficacité des techniques de séparation peut être confirmée en utilisant des environnements temporaires (maquettes) créés par le prestataire de services qui représentent les environnements des clients et en tentant 1) d'accéder à un environnement temporaire à partir d'un autre environnement, et 2) d'accéder à un environnement temporaire à partir d'Internet."
  2:
    prefix: "A1.2"
    title: "Les fournisseurs de services mutualisés facilitent la journalisation et la réponse aux incidents pour tous les clients."
    1_prefix: "A1.2.1"
    1_label: "La fonction des journaux d'audit est activée pour l'environnement de chaque consommateur conformément à l'exigence 10 du standard PCI DSS, notamment : Les journaux sont activés pour les applications courantes de tiers; Les journaux sont actifs par défaut; Les journaux sont disponibles pour examen uniquement par le consommateur qui en est le propriétaire; Les emplacements des journaux sont clairement communiqués au consommateur propriétaire; Les données de journaux et la disponibilité sont conformes à l'exigence 10 du standard PCI DSS."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n La capacité de journalisation est disponible pour tous les clients sans affecter la confidentialité des autres clients. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation et les paramètres de configuration du système afin de vérifier que le prestataire a activé la fonctionnalité des journaux d'audit pour chaque environnement consommateur conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Les informations de journalisation sont utiles pour détecter et diagnostiquer les incidents de sécurité et sont inestimables pour les enquêtes de criminalistique. Les clients doivent donc avoir accès à ces journaux. \n Cependant, les informations des journaux peuvent également être utilisées par un attaquant à des fins de reconnaissance. Par conséquent, les informations des journaux d'un consommateur ne doivent être accessibles que par le consommateur auquel les journaux se rapportent."
    2_prefix: "A1.2.2"
    2_label: "Des processus ou des mécanismes sont mis en œuvre pour prendre en charge et/ou faciliter des enquêtes criminalistiques rapides en cas d'incident de sécurité soupçonné ou avéré pour tout consommateur."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n L'enquête criminalistique est facilement accessible à tous les clients en cas d'incident de sécurité soupçonné ou avéré. \n\nℹ️ Procédures de Test de L’approche Définie \n Examiner les procédures documentées afin de vérifier que le prestataire dispose de processus ou de mécanismes pour prendre en charge et/ou faciliter une enquête criminalistique rapide sur les serveurs associés en cas d'incident de sécurité soupçonné ou avéré pour un consommateur. \n\nℹ️ Directives \n Objectif \n En cas de violation soupçonnée ou avérée de la confidentialité des données des titulaires de cartes, l'enquêteur criminalistique d'un consommateur vise à trouver la cause de la violation, à exclure l'attaquant de l'environnement et à s'assurer que tout accès non autorisé est supprimé. \n Des réponses rapides et efficaces aux demandes des enquêteurs criminalistiques peuvent réduire considérablement le temps nécessaire à l'enquêteur pour sécuriser l'environnement du consommateur."
    3_prefix: "A1.2.3"
    3_label: "Des processus ou des mécanismes sont mis en œuvre pour signaler et traiter les incidents de sécurité et les vulnérabilités soupçonnés ou avérés, notamment : Les clients peuvent en toute sécurité signaler les incidents de sécurité et les vulnérabilités au prestataire; Le prestataire traite et corrige les incidents de sécurité et les vulnérabilités soupçonnés ou avérés conformément à l'exigence 6.3.1."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Les incidents de sécurité ou les vulnérabilités soupçonnés ou avérés sont découverts et traités. Les clients sont informés le cas échéant. \n\nℹ️ Notes D’applicabilité \n Cette exigence reste une Bonne Pratique jusqu'au 31 mars 2025. Après cette date elle sera obligatoire et devra être pleinement prise en compte lors d'une évaluation du standard PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les procédures documentées et interroger le personnel afin de vérifier que le prestataire dispose d'un mécanisme de signalement et de traitement des incidents de sécurité et des vulnérabilités soupçonnés ou avérés, conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Les vulnérabilités de sécurité dans les services fournis peuvent avoir une incidence sur la sécurité de tous les clients du prestataire de services et doivent donc être gérées conformément aux processus établis du prestataire de services, la priorité étant donnée à la résolution des vulnérabilités qui présentent la plus forte probabilité de compromission. \n Les clients sont susceptibles de remarquer des vulnérabilités et des erreurs de configuration de sécurité lors de l'utilisation du service. \n La mise en œuvre de méthodes sécurisées permettant aux clients de signaler les incidents de sécurité et les vulnérabilités encourage les clients à signaler les problèmes potentiels et permet au prestataire de se renseigner rapidement sur les problèmes potentiels dans leur environnement et de les résoudre."
14:
  prefix: "Annexe A2"
  title: "Autres exigences du standard PCI DSS pour les entités utilisant SSL et/ou les versions obsolètes du protocole TLS pour les connexions de terminaux POS POI avec carte"
  desc: "Cette annexe s'applique uniquement aux entités utilisant SSL et/ou les versions obsolètes de TLS pour sécuriser les données transmises par les terminaux POS POI. Elle s’applique également aux prestataires de services qui fournissent des connexions aux terminaux POS POI. \n Les entités utilisant SSL et les versions obsolètes du protocole TLS pour les connexions des terminaux POS POI doivent travailler à la mise à niveau vers un protocole cryptographique fort dès que possible. De plus, SSL et/ou les versions obsolètes de TLS ne doivent pas être introduits dans des environnements où ces protocoles n'existent pas déjà. Au moment de la publication, les vulnérabilités connues sont difficiles à exploiter dans les terminaux de paiement POS POI. Cependant, de nouvelles vulnérabilités peuvent apparaître à tout moment, et il appartient à l'entreprise de rester à jour avec les tendances des vulnérabilités et de déterminer si elle est exposée à des exploits connus. Les exigences du standard PCI DSS directement concernées sont : \n\t- Exigence 2.2.5 : Lorsque des services, protocoles ou démons non sécurisés sont présents ; la justification métier est documentée et des fonctionnalités de sécurité supplémentaires sont documentées et mises en œuvre pour réduire le risque d'utilisation de services, de protocoles ou de démons non sécurisés. \n\t- Exigence 2.2.7 : Tous les accès administratifs non-console sont chiffrés à l'aide d'une cryptographie robuste. \n\t- Exigence 4.2.1 : Des protocoles de chiffrement et de sécurité robustes sont mis en œuvre afin de protéger le PAN pendant la transmission sur des réseaux publics ouverts. \n Les protocoles SSL et les versions obsolètes de TLS ne doivent pas être utilisés comme mesures de sécurité pour répondre à ces exigences, sauf dans le cas des connexions de terminaux POS POI, comme détaillé dans la présente annexe. Pour soutenir les entités travaillant à migrer de SSL et des versions obsolètes de TLS sur les terminaux POS POI, les dispositions suivantes sont incluses : \n\t- Les nouvelles implémentations de terminaux POS POI ne doivent pas utiliser SSL ou les versions obsolètes de TLS comme mesure de sécurité. \n\t- Tous les prestataires de services de terminaux POS POI doivent fournir une offre de service sécurisée. \n\t- Les prestataires de services prenant en charge les mises en œuvre de terminaux POS POI existants qui utilisent SSL et/ou les versions obsolètes de TLS doivent avoir mis en place un plan de remédiation officiel permettant d'atténuer les risques et un plan de migration. \n\t- Les terminaux POS POI dans des environnements de paiement en proximité qui peuvent être vérifiés comme n'étant pas exposés à des exploits connus pour SSL et/ou les versions obsolètes de TLS, et les points de terminaison SSL/TLS auxquels ils se connectent, peuvent continuer à utiliser SSL et/ou les versions obsolètes de TLS comme mesure de sécurité. \n Les exigences de cette annexe ne sont pas admissibles à L'approche Personnalisée."
  1:
    prefix: "A2.1"
    title: "Les terminaux POI utilisant SSL et/ou les versions obsolètes du protocole TLS sont confirmés comme n’étant pas exposés aux exploits SSL/TLS connus."
    1_prefix: "A2.1.1"
    1_label: "Lorsque les terminaux POS POI du commerçant ou du lieu d'acceptation des paiements utilisent SSL et/ou les versions obsolètes de TLS, l'entité confirme que les systèmes d’acceptation ne sont pas vulnérables et exposés à des exploits connus pour ces protocoles."
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Notes D’applicabilité \n Cette exigence est destinée à s'appliquer à l'entité disposant du terminal POS POI, telle qu'un commerçant. Cette exigence n'est pas destinée aux prestataires de services qui servent de point de terminaison ou de connexion à ces terminaux POS POI. Les exigences A2.1.2 et A2.1.3 s'appliquent aux prestataires de services POS POI. \n L’utilisation de SSL et/ou des versions obsolètes de TLS par les terminaux POS POI est tolérée sur la base des risques et exploits actuellement connus et sous condition que ces systèmes ne soient pas exposés à ces derniers. Si de nouveaux exploits sont introduits auxquels les terminaux POS POI sont exposés, les terminaux POS POI devront être mis à jour immédiatement. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Pour les terminaux POS POI utilisant SSL et/ou les versions obsolètes de TLS, confirmer que l'entité dispose d'une documentation (par exemple, la documentation du fournisseur, les détails de la configuration du système/du réseau) qui vérifie que les systèmes d’acceptation ne sont pas exposés à des exploits connus pour les protocoles SSL et les versions obsolètes de TLS. \n\nℹ️ Directives \n Objectif \n Les terminaux POS POI utilisés dans les environnements de paiement en proximité peuvent continuer à utiliser SSL et les versions obsolètes de TLS lorsqu'il peut être démontré que le terminal POS POI n'est pas exposé aux exploits actuellement connus. \n\n Bonne Pratique \n Cependant, le protocole SSL est une technologie obsolète ; de nouvelles vulnérabilités l’affectant pourront être identifiées à l'avenir. il est donc fortement recommandé de mettre à niveau les terminaux POS POI vers un protocole sécurisé dès que possible. Si le protocole SSL et/ou les versions obsolètes de TLS ne sont pas nécessaires dans l'environnement, l'utilisation et le recours à ces versions doivent être désactivés \n\n Informations Complémentaires \n Se reporter aux compléments d'informations du PCI SSC actuels sur SSL et les versions obsolètes de TLS pour plus d'informations."
    2_prefix: "A2.1.2"
    2_label: "Exigence supplémentaire pour les prestataires de services uniquement : Tous les prestataires de services disposant de points de connexion existants aux terminaux POS POI qui utilisent le protocole SSL et/ou les versions obsolètes de TLS tels que définis à l'annexe A2.1 ont mis en place un plan de remédiation permettant d'atténuer les risques et de migration qui comprend : Une description de l'utilisation, y compris les données transmises, les types et le nombre de systèmes qui utilisent et/ou prennent en charge le protocole SSL et/ou les versions obsolètes de TLS et le type d'environnement; Résultats de l'évaluation des risques et mesures de réduction des risques en place; Description des processus pour surveiller les nouvelles vulnérabilités associées à SSL et les versions obsolètes de TLS; Description des processus de gestion des changements qui sont mis en œuvre pour garantir que le protocole SSL et les versions obsolètes de TLS ne sont pas mis en œuvre dans de nouveaux environnements; Aperçu du plan de projet de migration pour remplacer SSL et les versions obsolètes de TLS à une date ultérieure."
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Notes D’applicabilité \n Cette exigence ne s'applique que lorsque l'entité évaluée est un prestataire de services. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Procédure de test supplémentaire pour les évaluations des prestataires de services uniquement : Examiner le plan d'atténuation des risques et de migration documentée afin de vérifier qu'il comprend tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Les points de terminaison POS POI, y compris, sans toutefois s'y limiter, les fournisseurs de services tels que les acquéreurs ou les processeurs des acquéreurs, peuvent continuer à utiliser le protocole SSL et les versions obsolètes de TLS lorsqu'il peut être démontré que le prestataire de services a mis en place des mesures de sécurité qui atténuent les risques liés au maintien de ces protocoles au sein de l'environnement du prestataire de services. \n\n Bonne Pratique \n Les prestataires de services doivent communiquer à tous les clients utilisant le protocole SSL et les versions obsolètes de TLS les risques associés à leur utilisation et la nécessité de migrer vers un protocole sécurisé. \n\n Définitions \n Le plan d'atténuation des risques et de migration, préparé par l'entité, détaille la migration vers un protocole sécurisé et décrit les mesures de sécurité mises en place afin de réduire le risque associé au protocole SSL et aux versions obsolètes de TLS. \n\n Informations Complémentaires \n Se reporter aux suppléments d'information actuels du PCI SSC sur le protocole SSL et les versions obsolètes de TLS pour plus d'informations sur les plans d'atténuation des risques et de migration."
    3_prefix: "A2.1.3"
    3_label: "Exigence supplémentaire pour les prestataires de services uniquement : Tous les prestataires de services proposent une offre de services sécurisée."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Notes D’applicabilité \n Cette exigence ne s'applique que lorsque l'entité évaluée est un prestataire de services. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Procédure de test supplémentaire pour les évaluations des prestataires de services uniquement : Examiner les configurations du système et les documents justificatifs afin de vérifier que le prestataire de services offre une option de protocole sécurisé pour son service. \n\nℹ️ Directives \n Objectif \n Les clients doivent pouvoir choisir de mettre à niveau leurs systèmes d’acceptation pour éliminer les vulnérabilités liées à l'utilisation de SSL et des versions obsolètes de TLS. Souvent, les clients auront préférence à adopter une approche progressive de migration de leur parc de POI POS, du protocole non sécurisé vers un protocole sécurisé. Pour ce faire, les clients exigeront que le prestataire de services propose une offre sécurisée. \n\n Informations Complémentaires \n Se reporter aux compléments d'informations du PCI SSC actuels sur SSL et les versions obsolètes de TLS initial pour plus d'informations."
15:
  prefix: "Annexe A3"
  title: "Validation complémentaire des entités désignées (DESV)"
  desc: "Cette annexe s'applique uniquement aux entités désignées par un ou plusieurs des réseaux internationaux ou un acquéreur comme nécessitant une validation supplémentaire des exigences existantes du standard PCI DSS. Une entité est tenue de se soumettre à une évaluation conformément à la présente annexe UNIQUEMENT si elle lui est demandée par un acquéreur ou une marque de paiement. Voici des exemples d'entités auxquelles cette annexe pourrait s'appliquer : \n\t- Ceux qui stockent, traitent et/ou transmettent de gros volumes de données de carte, \n\t- Ceux qui fournissent des points d'agrégation pour les données de carte, ou \n\t- Ceux qui ont subi des compromissions importantes ou répétées des données de carte. \n De plus, d'autres standards PCI peuvent faire référence à la réalisation de cette annexe. Ces étapes de validation supplémentaires visent à fournir une plus grande assurance que les mesures de sécurité du standard PCI DSS sont maintenues de manière efficace et continue en s’appuyant sur les processus de maintien des activités courantes (BAU). Ces étapes visent également à fournir l’assurance que les évolutions de périmètre sont prises en compte dans le cadre du programme de conformité au standard PCI DSS et que les processus de validation adaptés sont mis en œuvre en fonction de ces évolutions. \n\n ⚠️ Remarque \n Certaines exigences ont défini des délais (par exemple, au moins une fois tous les trois mois ou au moins une fois tous les six mois) dans lesquels certaines activités doivent être réalisées. Pour l'évaluation initiale, il n'est pas nécessaire qu'une activité ait été effectuée pour chacune de ces périodes au cours de l'année précédente, si l'auditeur vérifie que : \n\t- L'activité a été réalisée conformément à l'exigence applicable dans le délai le plus récent (par exemple, la période de trois ou six mois la plus récente), et \n\t- L'entité a des politiques et des procédures documentées pour continuer à exercer l'activité dans le délai défini. Pour les années suivantes après l'évaluation initiale, une activité doit avoir été réalisée dans chaque période requise (par exemple, une activité requise tous les trois mois doit avoir été réalisée au moins quatre fois au cours de l'année précédente à un intervalle ne dépassant pas 90 jours). \n Toutes les exigences du standard PCI DSS ne s'appliquent pas à toutes les entités susceptibles de subir une évaluation. C'est pour cette raison que certaines exigences du standard PCI DSS sont dupliquées dans la présente annexe. Toute question concernant cette annexe doit être adressée aux acquéreurs ou aux réseaux internationaux."
  1:
    prefix: "A3.1"
    title: "Un programme de conformité au standard PCI DSS est mis en œuvre."
    1_prefix: "A3.1.1"
    1_label: "La responsabilité est établie par la direction générale pour la protection des données de carte et un programme de conformité au standard PCI DSS qui comprend : Responsabilité globale pour le maintien de la conformité PCI DSS; Définition d'une charte pour un programme de conformité au standard PCI DSS; Fournir des mises à jour à la direction générale et au conseil d'administration sur les initiatives et les problèmes de conformité au standard PCI DSS, y compris les activités de correction, au moins une fois tous les 12 mois. Référence du standard PCI DSS : Exigence 12"
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation afin de vérifier que la direction générale a attribué la responsabilité globale du maintien de la conformité au standard PCI DSS de l'entité. \n\tb. Examiner la charte du standard PCI DSS de l'entreprise afin de vérifier qu'elle décrit les conditions dans lesquelles le programme de conformité à le standard PCI DSS est organisé. \n\tc. Examiner les procès-verbaux et/ou les présentations des réunions de la direction générale et du conseil d'administration pour s'assurer que les initiatives de conformité au standard PCI DSS et les activités correctives sont communiquées au moins une fois tous les 12 mois. \n\nℹ️ Directives \n Objectif \n L'attribution par la haute direction des responsabilités de conformité PCI DSS garantit une visibilité au niveau de la direction sur le programme de conformité PCI DSS, et permet de poser des questions appropriées pour déterminer l'efficacité du programme et influer sur les priorités stratégiques. \n\n Bonne Pratique \n La haute direction peut inclure des postes de niveau dirigeant, un conseil d'administration ou équivalent. Les titres spécifiques dépendront de la structure organisationnelle particulière. \n La responsabilité du programme de conformité PCI DSS peut être attribuée à des rôles individuels et/ou à des services/départements métier au sein de l'entreprise."
    2_prefix: "A3.1.2"
    2_label: "Un programme formel de conformité au standard PCI DSS est en place et comprend : Définition des activités de maintien et de surveillance de la conformité globale au standard PCI DSS, y compris les activités courantes; Processus annuels d'évaluation vis-à-vis des exigences du standard PCI DS; Processus de validation continue des exigences du standard PCI DSS (par exemple, quotidiennement, hebdomadairement, tous les trois mois, selon l'exigence); Un processus permettant d'effectuer une analyse d'impact sur l'entreprise afin de déterminer les impacts potentiels du standard PCI DSS sur les décisions métier stratégiques. Référence du standard PCI DSS : Exigences 1 à 12"
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures de sécurité des informations afin de vérifier que les processus sont définis pour un programme formel de conformité au standard PCI DSS qui comporte tous les éléments spécifiés dans cette exigence. \n\tb. Interroger le personnel et observer les activités de conformité afin de vérifier qu'un programme formel de conformité au standard PCI DSS est mis en œuvre conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Un programme de conformité formel permet à une entreprise de surveiller l'état de ses mesures et mesures de sécurité de sécurité, d'être proactive en cas de panne d'une mesure ou contrôle et de communiquer efficacement les activités et l'état de conformité dans toute l'entreprise. \n\n Bonne Pratique \n Le programme de conformité à PCI DSS peut être un programme dédié ou faire partie d'un programme global de conformité et/ou de gouvernance, et doit inclure une méthodologie bien définie qui démontre une évaluation cohérente et efficace. \n Les décisions métier stratégiques qui doivent être analysées pour les impacts potentiels du standard PCI DSS peuvent inclure les fusions et acquisitions, les achats de nouvelles technologies ou les nouveaux canaux d'acceptation des paiements. \n\n Définitions \n Le maintien et la surveillance de la conformité globale au standard PCI DSS d'une entreprise comprennent l'identification des activités à effectuer quotidiennement, hebdomadairement, mensuellement, tous les trois mois ou annuellement, et la garantie que ces activités sont exécutées en conséquence (par exemple, en utilisant une auto-évaluation de la sécurité ou une méthodologie PDCA). \n\n Exemples \n Les méthodologies qui prennent en charge la gestion des programmes de conformité incluent Plan-Do-Check-Act (PDCA), ISO 27001, COBIT, DMAIC et Six Sigma."
    3_prefix: "A3.1.3"
    3_label: "Les rôles et responsabilités de la conformité le standard PCI DSS sont spécifiquement définis et formellement attribués à un ou plusieurs membres du personnel, notamment : La gestion des activités courantes du standard PCI DSS; La gestion des évaluations annuelles du standard PCI DS; La gestion de la validation continue des exigences du standard PCI DSS (par exemple, quotidiennement, hebdomadairement, tous les trois mois, selon l'exigence); La gestion de l’analyse d'impact sur l'entreprise afin de déterminer les impacts potentiels du standard PCI DSS sur les décisions métier stratégiques. Référence du standard PCI DSS : Exigence 12"
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures de sécurité des informations et interroger le personnel afin de vérifier que les rôles et responsabilités de la conformité au standard PCI DSS sont spécifiquement définis et officiellement attribués à un ou plusieurs membres du personnel conformément à tous les éléments de la présente exigence. \n\tb. Interroger le personnel responsable et vérifier qu'il connaît et s'acquitte de ses responsabilités de conformité au standard PCI DSS. \n\nℹ️ Directives \n Objectif \n La définition formelle des rôles et responsabilités spécifiques de conformité au standard PCI DSS contribue à assurer la responsabilisation et la surveillance des efforts continus de conformité au standard PCI DSS. \n\n Bonne Pratique \n La propriété devrait être attribuée aux personnes ayant le pouvoir de prendre des décisions fondées sur les risques et sur qui incombe la responsabilité de la fonction spécifique. Les tâches doivent être formellement définies et les propriétaires doivent être en mesure de démontrer une compréhension de leurs responsabilités et de leur comptabilité. \n Les rôles de conformité peuvent être attribués à un seul propriétaire ou à plusieurs propriétaires pour différents éléments de l'exigence."
    4_prefix: "A3.1.4"
    4_label: "Une formation à jour sur le standard PCI DSS et/ou la sécurité des informations est dispensée au moins une fois tous les 12 mois au personnel ayant des responsabilités de conformité au standard PCI DSS (telles qu'identifiées en A3.1.3). Référence du standard PCI DSS : Exigence 12"
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures de sécurité des informations afin de vérifier qu'une formation au standard PCI DSS et/ou à la sécurité des informations est requise au moins une fois tous les 12 mois pour chaque rôle ayant des responsabilités de conformité au standard PCI DSS. \n\tb. Interroger le personnel et examiner les feuilles d'émargement ou d'autres dossiers afin de vérifier que le personnel responsable de la conformité au standard PCI DSS reçoit une formation à jour sur le standard PCI DSS et/ou une formation similaire sur la sécurité des informations au moins une fois tous les 12 mois. \n\nℹ️ Directives \n Objectif \n Le personnel responsable de la conformité au standard PCI DSS a des besoins de formation spécifiques dépassant ceux qui sont généralement fournis par la formation générale de sensibilisation à la sécurité afin de lui permettre de remplir son rôle. \n\n Bonne Pratique \n Les personnes ayant des responsabilités de conformité au standard PCI DSS doivent recevoir une formation spécialisée qui, en plus d'une sensibilisation générale à la sécurité des informations, se concentre sur des sujets, des compétences, des processus ou des méthodologies de sécurité spécifiques qui doivent être suivis pour que ces personnes s'acquittent efficacement de leurs responsabilités de conformité. \n La formation peut être proposée par des tiers tels que le PCI SSC (par exemple, PCI Awareness, PCIP et ISA), les réseaux internationaux et les acquéreurs, ou la formation peut être en interne. Le contenu de la formation doit être applicable à la fonction de la personne, être à jour et inclure les dernières menaces de sécurité et/ou la version du standard PCI DSS. \n\n Informations Complémentaires \n Pour plus d'informations, se reporter au Complément d'informations : Meilleures pratiques pour la mise en œuvre d'un programme de sensibilisation à la sécurité."
  2:
    prefix: "A3.2"
    title: "La périmètre du standard PCI DSS est documentée et validée."
    1_prefix: "A3.2.1"
    1_label: "Le périmètre soumis aux exigences de PCI DSS est documenté et son exactitude est confirmé au moins une fois tous les trois mois et en cas de modifications importantes de l'environnement. Au minimum, la validation du périmètre comprend : Identifier tous les flux de données pour les différentes étapes de paiement (par exemple, l'autorisation, la capture des règlements, les rétro facturations et les remboursements) et les canaux d'acceptation (par exemple, le paiement en proximité, le paiement à distance et le commerce électronique); Mettre à jour tous les diagrammes de flux de données conformément à l'exigence 1.2.4; Identifier tous les emplacements où les données carte sont stockées, traitées et transmises, y compris, sans toutefois s'y limiter, 1) tous les emplacements en dehors du CDE actuellement défini, 2) les applications qui traitent les CHD, 3) les transmissions entre systèmes et réseaux, et 4) les sauvegardes de fichiers; Pour toutes les données carte trouvées en dehors du CDE actuellement défini, soit 1) les supprimer de manière sécurisée, 2) les migrer dans le CDE actuellement défini, ou 3) étendre le CDE actuellement défini pour les inclure; Identifier tous les composants système dans le CDE, connectés au CDE, ou qui pourraient avoir une incidence sur la sécurité du CDE; Identifier toutes les mesures de sécurité de segmentation utilisés et le ou les environnements à partir desquels le CDE est segmenté, y compris la justification des environnements qui sont exclus du périmètre soumis à PCI DSS; Identifier toutes les connexions aux entités tierces ayant accès au CDE; Confirmer que tous les flux de données identifiés, les données de carte, les composants système, les mesures de sécurité de segmentation et les connexions de tiers ayant accès au CDE sont inclus dans la portée. Référence du standard PCI DSS : Périmètre des exigences du standard PCI DSS, Exigence 12"
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les résultats documentés des examens de la périmètre et interroger le personnel afin de vérifier que les examens sont effectués : \n\t- Au moins une fois tous les trois mois. \n\t- Après des modifications importantes de l'environnement dans la portée. \n\tb. Examiner les résultats documentés des examens de la périmètre effectuées au moins une fois tous les trois mois afin de vérifier que la validation du périmètre comporte tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n La validation fréquente du périmètre du standard PCI DSS permet de garantir que le périmètre du standard PCI DSS reste à jour et alignée sur les objectifs métiers changeants, et donc que les mesures de sécurité de sécurité protègent tous les composants systèmes appropriés. \n\n Bonne Pratique \n Une délimitation précise implique une évaluation critique du CDE et de tous les composants du système connecté afin de déterminer la couverture nécessaire pour les exigences du standard PCI DSS. Les activités de délimitation, y compris une analyse minutieuse et une surveillance continue, aident à garantir que les systèmes concernés sont correctement sécurisés. Lors de la documentation des emplacements des données de carte, l'entité peut envisager de créer un tableau ou une feuille de calcul contenant les informations suivantes : \n\t- Les magasins de données (bases de données, fichiers, cloud, etc.), y compris la finalité du stockage des données et la durée de conservation, \n\t- Quels éléments des CHD sont stockés (PAN, date d'expiration, nom du titulaire de la carte et/ou tout élément des SAD avant la fin de l'autorisation), \n\t- Comment les données sont sécurisées (type de chiffrement et force, algorithme de hachage et force, troncature, tokenisation), \n\t- Comment l'accès aux magasins de données est enregistré, y compris une description du ou des mécanismes de journalisation utilisés (solution d'entreprise, niveau de l'application, niveau de système d'exploitation, etc.). \n En plus des systèmes et réseaux internes, toutes les connexions d'entités tierces ; par exemple, des partenaires commerciaux, des entités fournissant des services d'assistance à distance et d'autres prestataires de services, doivent être identifiées pour déterminer leur inclusion dans le périmètre du standard PCI DSS. Une fois que les connexions concernées ont été identifiées, les mesures de sécurité applicables du standard PCI DSS peuvent être mis en œuvre afin de réduire le risque qu'une connexion tierce soit utilisée pour compromettre le CDE d'une entité. \n Un outil ou une méthodologie de découverte de données peut être utilisé pour faciliter l'identification de toutes les sources et emplacements des PAN, et pour rechercher des PAN qui résident sur des systèmes et des réseaux en dehors du CDE actuellement défini ou dans des endroits inattendus au sein du CDE défini ; par exemple, dans un journal d'erreurs ou un fichier de vidage de la mémoire. Cette approche peut aider à garantir que des emplacements de PAN précédemment inconnus sont détectés et que le PAN est soit éliminé, soit correctement sécurisé. \n\n Définitions \n"
    2_prefix: "A3.2.2"
    2_label: "L'impact du périmètre du standard PCI DSS pour toutes les modifications apportées aux systèmes ou aux réseaux est déterminé, y compris les ajouts de nouveaux systèmes et de nouvelles connexions réseau. Les processus comportent : La réalisation d'une évaluation formelle de l'impact du standard PCI DSS; L’identification des exigences du standard PCI DSS applicables au système ou au réseau; La mise à jour du périmètre du standard PCI DSS, le cas échéant; L’approbation documentée des résultats de l'évaluation d'impact par le personnel responsable (tel que défini en A3.1.3). Référence du standard PCI DSS : Périmètre des exigences du standard PCI DSS, Exigence 1 à 12"
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner la documentation des modifications et interroger le personnel afin de vérifier que pour chaque modification du périmètre aux systèmes ou aux réseaux, l'impact du périmètre du standard PCI DSS est déterminé et comporte tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Les modifications apportées aux systèmes ou aux réseaux peuvent avoir un impact significatif sur le périmètre du standard PCI DSS. Par exemple, les modifications apportées aux ensembles de règles de contrôle de la sécurité du réseau peuvent amener des segments de réseau entiers dans la portée, ou de nouveaux systèmes peuvent être ajoutés au CDE qui doivent être protégés de manière adéquate. \n Une évaluation formelle de l'impact effectuée avant une modification donne à l'entité l'assurance que la modification n'aura aucune incidence négative la sécurité du CDE. \n\n Bonne Pratique \n Les processus visant à déterminer l'impact potentiel que les modifications apportées aux systèmes et aux réseaux peuvent avoir sur le périmètre du standard PCI DSS d'une entité peuvent être exécutés dans le cadre d'un programme de conformité dédié au standard PCI DSS ou peuvent relever du programme global de conformité et/ou de gouvernance d'une entité."
    3_prefix: "A3.2.2.1"
    3_label: "À la fin d'une modification, toutes les exigences pertinentes du standard PCI DSS sont confirmées comme étant mises en œuvre sur tous les systèmes et réseaux nouveaux ou modifiés, et la documentation est mise à jour, le cas échéant. Référence du standard PCI DSS : Périmètre des exigences du standard PCI DSS, Exigences 1 à 12"
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les enregistrements des modifications et des systèmes/réseaux touchés, et, interroger le personnel afin de vérifier que toutes les exigences pertinentes du standard PCI DSS ont été confirmées comme étant mises en œuvre et que la documentation a été mise à jour dans le cadre de la modification. \n\nℹ️ Directives \n Objectif \n Il est important de disposer de processus pour analyser toutes les modifications apportées aux systèmes ou aux réseaux, afin de garantir que tous les mesures de sécurité PCI DSS sont appliqués à tous les systèmes ou réseaux ajoutés à l'environnement dans le périmètre en raison d'une modification. \n L'intégration de cette validation dans les processus de gestion des changements permet de garantir que les inventaires des appareils et les standards de configuration sont tenus à jour et que des mesures de sécurité de sécurité sont appliqués, si nécessaire. \n\n Bonne Pratique \n Un processus de gestion des changements doit comporter des justificatifs que les exigences du standard PCI DSS sont mises en œuvre ou préservées par le biais d'un processus itératif. \n\n Exemples \n Les exigences du standard PCI DSS qui doivent être vérifiées comportent, sans toutefois s'y limiter : \n\t- Les diagrammes de réseau sont mis à jour pour refléter les modifications. \n\t- Les systèmes sont configurés selon les standards de configuration, avec tous les mots de passe par défaut modifiés et les services inutiles désactivés. \n\t- Les systèmes sont protégés par les mesures de sécurité requis, par exemple, la surveillance de l'intégrité des fichiers, antiprogrammes malveillants, les correctifs et la journalisation des audits. \n\t- Les données d'authentification sensibles ne sont pas stockées et que tout le stockage des données de carte est documenté et intégré à la politique et aux procédures de conservation des données. \n\t- De nouveaux systèmes sont inclus dans le processus trimestriel de scan des vulnérabilités."
    4_prefix: "A3.2.3"
    4_label: "Les modifications apportées à la structure de l'entreprise entraînent un examen formel (interne) de l'impact sur le périmètre du standard PCI DSS et l'applicabilité des mesures de sécurité. Référence du standard PCI DSS : Exigence 12"
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les politiques et les procédures afin de vérifier qu'une modification de la structure de l'entreprise entraîne un examen formel de l'impact sur le périmètre du standard PCI DSS et l'applicabilité des mesures de sécurité. \n\nℹ️ Directives \n Objectif \n La structure et la gestion d'une entreprise définissent les exigences et le protocole pour des opérations efficaces et sécurisées. Les modifications apportées à cette structure pourraient avoir des effets négatifs sur les mesures de sécurité et les cadres existants en réaffectant ou en supprimant des ressources qui prenaient autrefois en charge les mesures de sécurité du standard PCI DSS, ou en héritant de nouvelles responsabilités qui n'avaient peut-être pas établi de mesures de sécurité en place. Par conséquent, il est important de revoir le périmètre et les mesures de sécurité du standard PCI DSS lorsque des modifications sont apportées à la structure et à la gestion d'une entreprise afin de s'assurer que les mesures de sécurité sont en place et actifs. \n\n Exemples \n Les modifications apportées à la structure de l'entreprise comprennent, sans toutefois s'y limiter, les fusions ou acquisitions d'entreprises et les modifications ou réaffectations importantes du personnel responsable du contrôle de la sécurité."
    5_prefix: "A3.2.4"
    5_label: "Si la segmentation est utilisée, le périmètre du standard PCI DSS est confirmée comme suit : Selon la méthodologie de l'entité définie à l'exigence 11.4.1; Des tests d'intrusion sont effectués sur les mesures de sécurité de segmentation au moins une fois tous les six mois et après toute modification des mesures de sécurité/méthodes de segmentation; Les tests d'intrusion couvrent tous les mesures de sécurité/méthodes de segmentation utilisés; Le test d’intrusion vérifie que les mesures de sécurité ou méthodes de segmentation sont opérationnels et efficaces, et isoler le CDE de tous les systèmes hors de portée. Référence du standard PCI DSS : Exigence 11"
    5_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Examiner les résultats du test d'intrusion le plus récent afin de vérifier que le test a été effectué conformément à tous les éléments spécifiés dans cette exigence. \n\nℹ️ Directives \n Objectif \n Le standard PCI DSS exige normalement que les mesures de sécurité de segmentation soient vérifiées par des tests d'intrusion tous les douze mois. \n La validation plus fréquente des mesures de sécurité de segmentation est susceptible de découvrir des défaillances dans la segmentation avant qu'elles ne puissent être exploitées par un attaquant tentant de basculer latéralement d'un réseau non fiable hors de périmètre vers le CDE. \n\n Bonne Pratique \n Bien que l'exigence précise que cette validation du périmètre est effectuée au moins une fois tous les six mois et après une modification importante, cet exercice doit être effectué aussi fréquemment que possible afin de s'assurer qu'il reste efficace pour isoler le CDE des autres réseaux. \n\n Informations Complémentaires \n Se reporter au Complément d'informations : Conseils pour des tests d'intrusion pour des conseils supplémentaires."
    6_prefix: "A3.2.5"
    6_label: "Une méthodologie de découverte de données est mise en œuvre qui : Confirme le périmètre du standard PCI DSS; Localise toutes les sources et tous les emplacements des PAN en texte clair au moins une fois tous les trois mois et lors de modifications importantes du CDE ou des processus; Traite de la possibilité que le PAN en texte clair réside sur des systèmes et des réseaux en dehors du CDE actuellement défini. Référence du standard PCI DSS : Périmètre des exigences du standard PCI DSS"
    6_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la méthodologie de découverte de données documentée afin de vérifier qu'elle comporte tous les éléments spécifiés dans cette exigence. \n\tb. Examiner les résultats des récents efforts de découverte de données et interroger le personnel responsable afin de vérifier que la découverte de données est effectuée au moins une fois tous les trois mois et lors de modifications importantes du CDE ou des processus. \n\nℹ️ Directives \n Objectif \n Le standard PCI DSS exige que, dans le cadre de l'exercice de la portée, les entités évaluées identifient et documentent l'existence de tous les PAN en texte clair dans leurs environnements. La mise en œuvre d'une méthodologie de découverte de données qui identifie toutes les sources et tous les emplacements des PAN en texte clair et recherche des PAN en texte clair sur des systèmes et des réseaux en dehors du CDE actuellement défini, ou à des endroits imprévus au sein du CDE défini ; par exemple, dans un journal d'erreurs ou un fichier de vidage de mémoire, aide à garantir que les emplacements précédemment inconnus des PAN en texte clair sont détectés et correctement sécurisés. \n\n Exemples \n Un processus de découverte de données peut être effectué via une variété de méthodes, y compris, sans toutefois s'y limiter, 1) un logiciel de découverte de données disponible dans le commerce, 2) un programme de découverte de données développé en interne ou 3) une recherche manuelle. Une combinaison de méthodologies peut également être utilisée selon les besoins. \n Indépendamment de la méthode utilisée, le but de l'effort est de trouver toutes les sources et tous les emplacements des PAN en texte clair (pas uniquement dans le CDE défini)."
    7_prefix: "A3.2.5.1"
    7_label: "Les méthodes de découverte de données sont confirmées comme suit : L'efficacité des méthodes est testée; Les méthodes sont capables de découvrir le PAN en texte clair sur tous les types de composants système et les formats de fichiers utilisés; L'efficacité des méthodes de découverte de données est confirmée au moins une fois tous les 12 mois. Référence du standard PCI DSS : Périmètre des exigences du standard PCI DSS"
    7_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Interroger le personnel et examiner la documentation afin de vérifier que : \n\t- L'entité a mis en place un processus pour tester l'efficacité des méthodes utilisées pour la découverte des données. \n\t- Le processus comprend la vérification que les méthodes sont capables de découvrir le PAN en texte clair sur tous les types de composants système et les formats de fichiers utilisés. \n\tb. Examiner les résultats des tests d'efficacité afin de vérifier que l'efficacité des méthodes de découverte des données est confirmée au moins une fois tous les 12 mois. \n\nℹ️ Directives \n Objectif \n Un processus de test de l'efficacité des méthodes utilisées pour la découverte des données garantit l'exhaustivité et l'exactitude de la détection des données de carte. \n\n Bonne Pratique \n Pour l'exhaustivité, les composants du système dans les réseaux couverts et les systèmes dans les réseaux hors de périmètre doivent être inclus dans le processus de découverte des données. \n Le processus de découverte des données doit être efficace sur tous les systèmes d'exploitation et les plates-formes utilisés. L'exactitude peut être testée en plaçant des PAN de test sur les composants système et les formats de fichiers utilisés, et en confirmant que la méthode de découverte des données a détecté les PAN de test."
    8_prefix: "A3.2.5.2"
    8_label: "Des procédures de réponse sont mises en œuvre pour être lancées lors de la détection d'un PAN en texte clair en dehors du CDE pour inclure : Déterminer ce qu'il faut faire si le PAN en texte clair est découvert en dehors du CDE, y compris sa récupération, sa suppression sécurisée et/ou sa migration vers le CDE actuellement défini, selon le cas; Déterminer comment les données se sont retrouvées en dehors du CDE; Corriger les fuites de données ou les lacunes des processus qui ont fait que les données se trouvaient en dehors du CDE; Identifier la source des données; Identifier si des données de suivi sont stockées avec les PAN."
    8_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les procédures de réponse documentées afin de vérifier que les procédures de réponse à la détection d'un PAN en texte clair en dehors du CDE sont définies et incluent tous les éléments spécifiés dans cette exigence. \n\tb. Interroger le personnel et examiner les enregistrements des actions de réponse afin de vérifier que les activités correctives sont effectuées lorsqu'un PAN en texte clair est détecté en dehors du CDE. \n\nℹ️ Directives \n Objectif \n Avoir des procédures de réponse documentées qui sont suivies dans le cas où un PAN en texte clair est trouvé en dehors du CDE aide à identifier les mesures correctives nécessaires et à prévenir de futures fuites. \n\n Bonne Pratique \n Si le PAN a été trouvé en dehors du CDE, une analyse doit être effectuée pour 1) déterminer s'il a été enregistré indépendamment d'autres données ou avec des données d'authentification sensibles, 2) identifier la source des données et 3) identifier les lacunes de contrôle qui ont entraîné que les données soient en dehors du CDE. \n Les entités doivent déterminer si des facteurs contributifs, tels que des processus professionnels, le comportement des utilisateurs, des configurations système inappropriées, etc. ont entraîné le stockage du PAN dans un emplacement imprévu. Si de tels facteurs contributifs sont présents, ils doivent être traités conformément à cette exigence afin d'éviter qu'ils ne se reproduisent."
    9_prefix: "A3.2.6"
    9_label: "Des mécanismes sont mis en œuvre pour détecter et empêcher les PAN en texte clair de quitter le CDE via un canal, une méthode ou un processus non autorisé, y compris des mécanismes qui : Sont en cours d'exécution; Sont configurés pour détecter et empêcher les PAN en texte clair de quitter le CDE via un canal, une méthode ou un processus non autorisé; Génèrent des journaux d'audit et d'alertes lors de la détection d'un PAN en texte clair quittant le CDE via un canal, une méthode ou un processus non autorisé. Référence du standard PCI DSS : Périmètre des exigences du standard PCI DSS, Exigence 12"
    9_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation et observer les mécanismes mis en œuvre afin de vérifier que les mécanismes sont conformes à tous les éléments spécifiés dans cette exigence. \n\tb. Examiner les journaux d'audit et les alertes, et interroger le personnel responsable afin de vérifier que les alertes font l'objet d'une enquête. \n\nℹ️ Directives \n Objectif \n L'utilisation de mécanismes pour détecter et empêcher les PAN non autorisés de quitter le CDE permet à une entreprise de détecter et de prévenir les situations pouvant entraîner une perte de données. \n\n Bonne Pratique \n La couverture des mécanismes devrait comprendre, sans toutefois s'y limiter, les courriels, les téléchargements sur des supports amovibles et les sorties vers des imprimantes. \n\n Définitions \n Les mécanismes de détection et de prévention de la perte non autorisée de PAN en texte clair peuvent inclure l'utilisation d'outils appropriés tels que des solutions de prévention des pertes de données (DLP) ainsi que des processus et procédures manuels."
    10_prefix: "A3.2.6.1"
    10_label: "Des procédures de réponse sont mises en œuvre pour être lancées lors de la détection de tentatives de suppression de PAN en texte clair du CDE via un canal, une méthode ou un processus non autorisé. Les procédures de réponse comprennent : Des procédures d'examen rapide des alertes par le personnel responsable; Des procédures pour corriger les fuites de données ou les lacunes des processus, si nécessaire, afin d'éviter toute perte de données. Référence du standard PCI DSS : Exigence 12"
    10_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les procédures de réponse documentées afin de vérifier que les procédures de réponse à la tentative de suppression de PAN en texte clair du CDE via un canal, une méthode ou un processus non autorisé comportent tous les éléments spécifiés dans cette exigence : \n\t- Des procédures d'examen rapide des alertes par le personnel responsable. \n\t- Des procédures pour corriger les fuites de données ou les lacunes des processus, si nécessaire, afin d'éviter toute perte de données. \n\tb. Interroger le personnel et examiner les enregistrements des mesures prises lorsqu'un PAN en texte clair est détecté quittant le CDE via un canal, une méthode ou un processus non autorisé, et vérifier que des activités correctives ont été effectuées. \n\nℹ️ Directives \n Objectif \n Les tentatives de suppression des PAN en texte clair via un canal, une méthode ou un processus non autorisé peuvent indiquer une intention malveillante de voler des données, ou peuvent être les actions d'un employé autorisé qui ne connaît pas ou ne suit tout simplement pas les méthodes adéquates. Une enquête rapide sur ces événements peut identifier les endroits où des mesures correctives doivent être appliquées, et fournit des informations précieuses pour aider à comprendre l’origine des menaces."
  3:
    prefix: "A3.3"
    title: "Le standard PCI DSS est intégrée aux activités courantes (BAU)."
    1_prefix: "A3.3.1"
    1_label: "Les défaillances des systèmes de contrôle de sécurité critiques sont détectées, signalées et traitées rapidement, y compris, sans toutefois s'y limiter, les défaillances : Des mesures de sécurité réseau; IDS/IPS; FIM; Des solutions anti-programmes malveillants; Les mesures de sécurité d’accès physiques; Les mesures de sécurité d’accès logiques; Des mécanismes de journalisation des audits; Des mesures de segmentation (le cas échéant); Des mécanismes automatisés d'examen des Journaux d'audit Ce point est une Bonne Pratique jusqu'à sa date d'entrée en vigueur ; se reporter aux Notes D’applicabilité ci-dessous pour plus de détails; Outils automatisés d'examen du code (le cas échéant). Ce point est une Bonne Pratique jusqu'à sa date d'entrée en vigueur ; se reporter aux Notes D’applicabilité ci-dessous pour plus de détails. Référence du standard PCI DSS : Exigences 1 à 12"
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Notes D’applicabilité \n Les puces ci-dessus (pour les mécanismes automatisés d'examen des journaux et les outils automatisés d'examen du code (le cas échéant)) constituent de meilleures pratiques jusqu'au 31 mars 2025. Après cette date elles seront obligatoires dans le cadre de l'exigence A3.3.1 et doivent être pleinement prises en compte lors d'une évaluation du standard PCI DSS. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures documentées afin de vérifier que les processus sont définis pour détecter, alerter et résoudre rapidement les défaillances critiques des mesures de sécurité de sécurité conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Examiner les processus de détection et d'alerte, et interroger le personnel afin de vérifier que les processus sont mis en œuvre pour tous les mesures de sécurité de sécurité critiques spécifiés dans cette exigence et que chaque défaillance d'un contrôle de sécurité critique entraîne la génération d'une alerte. \n\nℹ️ Directives \n Objectif \n Sans processus formels pour la détection rapide (dès que possible), l'alerte et le traitement des défaillances critiques des mesures de sécurité de sécurité, les défaillances peuvent passer inaperçues ou rester non résolues pendant de longues périodes. De plus, sans processus formalisés limités dans le temps, les attaquants auront amplement le temps de compromettre les systèmes et de voler les données de carte du CDE. \n\n Bonne Pratique \n Les types spécifiques de pannes peuvent varier selon la fonction du composant système de l'appareil et de la technologie utilisée. Les défaillances typiques incluent un système cessant d'exécuter sa fonction de sécurité ou ne fonctionnant pas de la manière prévue, tel un pare-feu effaçant toutes ses règles ou se déconnectant."
    2_prefix: "A3.3.1.2"
    2_label: "Les défaillances de tout système de contrôle de sécurité critique sont traitées rapidement. Les processus de réponse aux défaillances des systèmes de contrôle de sécurité comprennent : Restauration des fonctions de sécurité; Identifier et documenter la durée (date et heure du début à la fin) de la défaillance de sécurité; Identifier et documenter la ou les causes de la défaillance, y compris la cause profonde, et documenter les mesures correctives nécessaires pour traiter la cause profonde; Identifier et résoudre tous les problèmes de sécurité survenus lors de la défaillance; Déterminer si d'autres mesures est nécessaires à la suite de la défaillance de sécurité; Mettre en œuvre des mesures afin d'éviter que la cause de la défaillance ne se reproduise; Reprendre la surveillance des mesures de sécurité. Référence du standard PCI DSS : Exigences 1 à 12"
    2_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures documentées et interroger le personnel afin de vérifier que les processus sont définis et mis en œuvre pour répondre rapidement à une défaillance des mesures de sécurité de sécurité conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Examiner les enregistrements afin de vérifier que les défaillances des mesures de sécurité de sécurité sont documentées pour inclure : \n\t- L'identification de la ou des causes de la défaillance, y compris la cause profonde. \n\t- La durée (date et heure de début et de fin) de la défaillance de sécurité. \n\t- Les détails des correctifs nécessaires pour traiter la cause profonde. \n\nℹ️ Directives \n Objectif \n Si les alertes de défaillances des systèmes de contrôle de sécurité critiques ne sont pas traitées rapidement et efficacement, les attaquants peuvent utiliser ce temps pour insérer des logiciels malveillants, prendre le contrôle d'un système ou voler des données dans l'environnement de l'entité. \n\n Bonne Pratique \n Des preuves documentées (par exemple, des enregistrements dans un système de gestion des problèmes) doivent appuyer les processus et les procédures en place qui répondent aux défaillances de sécurité. De plus, le personnel doit être conscient de ses responsabilités en cas de défaillance. Les actions et les réponses à l'échec doivent être consignées dans les preuves documentées."
    3_prefix: "A3.3.2"
    3_label: " Les technologies matérielles et logicielles sont examinées au moins une fois tous les 12 mois pour confirmer si elles continuent de répondre aux exigences du standard PCI DSS de l'entreprise. Référence du standard PCI DSS : Exigences 2, 6, 12."
    3_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Notes D’applicabilité \n Le processus comprend un plan de correction des technologies qui ne répondent plus aux exigences du standard PCI DSS de l'entreprise, jusqu'au remplacement de la technologie, le cas échéant. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures documentées et interroger le personnel afin de vérifier que les processus sont définis et mis en œuvre pour examiner les technologies matérielles et logicielles afin de confirmer si elles continuent de répondre aux exigences du standard PCI DSS de l'entreprise. \n\tb. Examiner les résultats des examens récents des technologies matérielles et logicielles afin de vérifier que les examens sont effectués au moins une fois tous les 12 mois. \n\tc. Examiner la documentation afin de vérifier que, pour toutes les technologies qui ont été déterminées comme ne répondant plus aux exigences du standard PCI DSS de l'entreprise, un plan est en place pour corriger la technologie. \n\nℹ️ Directives \n Objectif \n Les technologies matérielles et logicielles évoluent constamment, et les entreprises doivent être conscientes des changements apportés aux technologies qu'elles utilisent, ainsi que des menaces en constante évolution qui pèsent sur ces technologies. La réalisation d'examens appropriés de ces technologies garantit qu'elles peuvent se préparer à, et gérer les vulnérabilités du matériel et des logiciels qui ne seront pas corrigées par le fournisseur ou le développeur. \n\n Bonne Pratique \n Les entreprises doivent également envisager d’examiner les versions du micrologiciel afin de s'assurer qu'elles restent à jour et prises en charge par les fournisseurs. \n Les entreprises doivent également être conscientes des modifications apportées par les fournisseurs de technologies à leurs produits ou processus pour comprendre la manière dont ces modifications peuvent avoir une incidence sur l'utilisation de la technologie par l'entreprise. \n Des examens réguliers des technologies qui ont un impact ou une influence sur les mesures de sécurité du standard PCI DSS peuvent aider à l'achat, à l'utilisation et aux stratégies de déploiement, et garantir que les mesures de sécurité qui reposent sur ces technologies restent efficaces. Ces examens comportent, sans toutefois s'y limiter, l'examen des technologies qui ne sont plus prises en charge par le fournisseur et/ou qui ne répondent plus aux besoins de sécurité de l'entreprise."
    4_prefix: "A3.3.3"
    4_label: "Des examens sont effectués au moins une fois tous les trois mois afin de vérifier que les activités BAU sont suivies. Des examens sont effectués par le personnel affecté au programme de conformité au standard PCI DSS (tel qu'identifié en A3.1.3) et comprennent : La confirmation que toutes les activités BAU, y compris A3.2.2, A3.2.6 et A3.3.1, sont effectuées; La confirmation que le personnel suit les politiques de sécurité et les procédures opérationnelles (par exemple, examens quotidiens des journaux, examens des ensembles de règles pour les mesures de sécurité du réseau, standards de configuration pour les nouveaux systèmes); La documentation de la façon dont les examens ont été effectués, y compris la façon dont toutes les activités BAU ont été vérifiées comme étant en place; La collecte de preuves documentées requises pour l'évaluation annuelle du standard PCI DSS; Examen et approbation des résultats par le personnel affecté à la responsabilité du programme de conformité PCI DSS, tel qu’identifié en A3.1.3; La conservation des enregistrements et de la documentation pendant au moins 12 mois, couvrant toutes les activités BAU. Référence du standard PCI DSS : Exigences 1 à 12"
    4_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner les politiques et procédures afin de vérifier que des processus sont définis pour examiner et vérifier les activités BAU conformément à tous les éléments spécifiés dans cette exigence. \n\tb. Interroger le personnel responsable et consulter les enregistrements des examens afin de vérifier que : \n\t- Des examens sont effectués par le personnel affecté au programme de conformité au standard PCI DSS. \n\t- Des examens sont effectués au moins une fois tous les trois mois. \n\nℹ️ Directives \n Objectif \n Une confirmation régulière que les politiques et procédures de sécurité sont suivies donne l'assurance que les mesures de sécurité attendue sont actives et fonctionnent comme prévu. L'objectif de ces examens n'est pas d’effectuer à nouveau d'autres exigences PCI DSS, mais de confirmer que les activités de sécurité sont effectuées de manière continue. \n\n Bonne Pratique \n Ces examens peuvent également être utilisés afin de vérifier que les preuves appropriées sont conservées (par exemple, journaux d'audit, rapports d'analyse de vulnérabilités, examens des ensembles de règles de contrôle de sécurité réseau) pour aider l'entité à préparer sa prochaine évaluation du standard PCI DSS. \n\n Définitions \n Prenant l'exigence 1.2.7 comme exemple, l'exigence A3.3.3 est satisfaite en confirmant, au moins une fois tous les trois mois, que les examens des configurations des mesures de sécurité de sécurité réseau ont eu lieu à la fréquence requise. D'autre part, l'exigence 1.2.7 est satisfaite en examinant ces configurations comme spécifié dans l'exigence."
  4:
    prefix: "A3.4"
    title: "L'accès logique à l'environnement des données des titulaires de cartes est contrôlé et géré."
    1_prefix: "A3.4.1"
    1_label: "Les comptes d'utilisateurs et les privilèges d'accès aux composants système dans le périmètre sont examinés au moins une fois tous les six mois pour s'assurer que les comptes d'utilisateurs et les privilèges d'accès restent appropriés selon la fonction, et que tous les accès sont autorisés. Référence du standard PCI DSS : Exigence 7"
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Procédures de Test de L’approche Définie \n \t- Interroger le personnel responsable et examiner les documents justificatifs afin de vérifier que : \n\t- Les comptes d'utilisateurs et les privilèges d'accès sont examinés au moins tous les six mois. \n\t- Les examens confirment que l'accès est approprié selon la fonction et que tous les accès sont autorisés. \n\nℹ️ Directives \n Objectif \n L'examen régulier des droits d'accès permet de détecter les droits d'accès excessifs restants après le changement des responsabilités professionnelles de l'utilisateur, le changement des fonctions du système ou autres changements. Si des droits excessifs d'un utilisateur ne sont pas révoqués en temps utile, ils peuvent être exploités par des utilisateurs malveillants pour un accès non autorisé. Cet examen offre une autre possibilité de s'assurer que les comptes de tous les utilisateurs ayant terminé leurs tâches ont été supprimés (le cas échéant, au moment de la fin de leurs tâches), ainsi que de s'assurer que tout tiers qui n'a plus besoin d'accès a vu son accès suspendu."
  5:
    prefix: "A3.5"
    title: "Les événements suspects sont identifiés et traités."
    1_prefix: "A3.5.1"
    1_label: "Une méthodologie est mise en œuvre pour l'identification rapide des modèles d'attaque et des comportements indésirables sur les systèmes, qui comprend : L'identification des anomalies ou des activités suspectes au fur et à mesure qu'elles se produisent; L'émission d'alertes rapides lors de la détection d'une activité suspecte ou d'une anomalie au personnel responsable; Une réponse aux alertes conformément aux procédures de réponse documentées. Référence du standard PCI DSS : Exigences 10, 12"
    1_desc: "ℹ️ Objectif de L’approche Personnalisée \n Cette exigence n'est pas admissible pour l'approche personnalisée. \n\nℹ️ Procédures de Test de L’approche Définie \n \ta. Examiner la documentation et interroger le personnel afin de vérifier qu'une méthodologie est définie et mise en œuvre pour identifier rapidement les modèles d'attaque et les comportements indésirables sur les systèmes, et comporte tous les éléments spécifiés dans cette exigence. \n\tb. Examiner les procédures de réponse aux incidents et interroger le personnel responsable afin de vérifier que : \n\t- Le personnel en service de garde reçoit des alertes rapides. \n\t- Les alertes sont traitées conformément aux procédures de réponse documentées. \n\nℹ️ Directives \n Objectif \n La capacité d'identifier les modèles d'attaque et les comportements indésirables sur l'ensemble des systèmes ; par exemple, à l'aide d'outils de corrélation de journaux gérés de manière centralisée ou automatisés, est essentielle afin de prévenir, détecter ou minimiser l'impact d'une compromission des données. La présence de journaux dans tous les environnements permet un suivi, une alerte et une analyse approfondis en cas de problème. Il est très difficile, voire impossible, de déterminer la cause d'une compromission sans un processus permettant de corroborer les informations des composants système critiques et des systèmes qui exécutent des fonctions de sécurité, telles que les mesures de sécurité de sécurité réseau, IDS/IPS et les systèmes de surveillance de l'intégrité des fichiers (FIM). Ainsi, les journaux de tous les composants système critiques et des systèmes qui exécutent des fonctions de sécurité doivent être recueillis, corrélés et conservés. Cela peut inclure l'utilisation de produits logiciels et de méthodologies de service afin de fournir des analyses, des alertes et des rapports en temps réel, tels que la gestion des informations et des événements de sécurité (SIEM), FIM ou la détection des modifications."
