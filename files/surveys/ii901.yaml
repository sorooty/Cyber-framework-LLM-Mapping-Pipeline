1:
  prefix: "Titre II"
  title: "Protection des systèmes d'information sensibles"
  1_prefix: "Article 5"
  1_label: "Détermination de la sensibilité des informations"
  1_desc: "Chaque entité mettant en œuvre un système d'information sensible : \n\t- identifie l'information sensible qu'elle traite ; \n\t- marque cette information par les moyens de son choix ; \n\t- détermine, si besoin, une échelle de sensibilité correspondant à des niveaux en matière de disponibilité, d'intégrité et de confidentialité des informations de son système d'information sensible ; \n\t- applique des mesures de protection adaptées. \nLorsque les informations sensibles transitent entre plusieurs entités, leur niveau de sensibilité est explicitement mentionné par l'entité émettrice afin qu'elles soient protégées en conséquence par l'entité destinataire en termes de disponibilité, d'intégrité et de confidentialité, pendant et après leur transit."
  2_prefix: "Article 6"
  2_label: "Gouvernance de la protection des systèmes d'information"
  2_desc: "Chaque entité :\n\t- applique une politique de sécurité des systèmes d'information (PSSI), validée au plus haut niveau de l'entité et couvrant tous les aspects, techniques ou non, de la sécurité (communication, ressources humaines et financières, aspects juridiques, etc.) ;\n\t- organise la gouvernance et attribue les responsabilités en matière de sécurité des systèmes d'information."
  3_prefix: "Article 7"
  3_label: "Maîtrise des risques"
  3_desc: "La PSSI de l'entité résulte d'une analyse des risques menée :\n\t- pour tous les risques, pas seulement techniques, qu'ils soient d'origine humaine ou non ;\n\t- pour chacun des systèmes d'information de l'entité ;\n\t- en appréciant l'impact qu'une menace sur un composant du système pourrait avoir sur les missions de l'entité, son image, son patrimoine ou la sécurité des biens et des personnes."
  4_prefix: "Article 8"
  4_label: "Homologation des systèmes d'information sensibles"
  4_desc: "Tout système d'information sensible doit faire l'objet d'une homologation de sécurité avant sa mise en service. Dans le dossier d'homologation figurent notamment les risques résiduels, c'est-à-dire ceux qui ne sont pas couverts par des mesures de protection.\n\nL'autorité d'homologation doit être choisie au sein de l'entité, au niveau hiérarchique suffisant pour assumer la responsabilité afférente à la décision d'homologation. Elle accepte notamment les risques résiduels. Elle est en principe l'autorité qui emploie le système.\n\nEn prononçant sa décision d'homologation, l'autorité d'homologation déclare que le système d'information est conforme aux règles prévues par la présente instruction."
  5_prefix: "Article 9"
  5_label: "Protection des systèmes d'information"
  5_desc: "L'entité dispose d'une cartographie de l'ensemble des systèmes d'information dont elle est responsable. Cette cartographie est tenue à jour. Elle est nécessaire à l'entité pour assurer la protection de ses systèmes d'information.\n\nL'entité protège ses systèmes d'information contre les menaces identifiées pendant toute leur durée de vie. La protection repose sur plusieurs volets :\n\t- physique : elle retarde ou empêche l'accès physique des personnes non autorisées aux locaux, aux systèmes et aux informations, tout en maintenant la disponibilité des accès pour les personnes autorisées. Elle permet également d'éviter et de détecter les incidents physiques tels les défauts d'alimentation, les défauts de climatisation, les incendies et les dégâts des eaux ;\n\t- logique : elle permet de se prémunir contre les attaques informatiques malveillantes et accidentelles mais surtout de protéger les réseaux, les équipements, les données et leurs supports, les accès logiques ainsi que l'administration des systèmes ;\n\t- organisationnel : elle est mise en œuvre selon des processus explicitement définis dans la PSSI de l'entité.\n\nEn cas d'élévation du niveau de la menace, l'entité renforce les mesures de vigilance et de protection de ses systèmes."
  6_prefix: "Article 10"
  6_label: "Gestion des incidents de sécurité des systèmes d'information"
  6_desc: "Même protégée, l'entité se prépare à subir des attaques sur ses systèmes d'information. Elle intègre la sécurité des systèmes d'information (SSI) dans ses procédures de gestion de crise et dans ses exercices périodiques. Pour être en mesure d'agir pour réduire l'impact des attaques et des incidents, elle se dote :\n\t- d'une capacité de détection, d'analyse, de qualification et de réaction, afin notamment d'assurer la continuité de ses missions ;\n\t- d'un dispositif de gestion des incidents afin de détecter et d'analyser les attaques et de réagir face à des événements anormaux.\n\nDes retours d'expérience de traitement des incidents sont prévus après chaque événement."
  7_prefix: "Article 11"
  7_label: "Évaluation du niveau de sécurité"
  7_desc: "L'entité évalue en permanence le niveau de sécurité de ses systèmes d'information et les risques résiduels. Elle effectue régulièrement des vérifications et réalise des audits fonctionnels et techniques de sécurité des systèmes d'information. Cette évaluation permet de réduire l'impact des attaques et des incidents et d'assurer la continuité de service de l'entité."
  8_prefix: "Article 12"
  8_label: "Relations avec les autorités de l'État"
  8_desc: "Sans préjudice des dispositions législatives et réglementaires spéciales, notamment celles applicables aux opérateurs d'importance vitale, chaque entité coopère avec les autorités de l'État telles que l'ANSSI ou les ministères de tutelle pour assurer la sécurité de ses systèmes d'information. Elle répond, en cas de crise, aux sollicitations de ces autorités."
2:
  prefix: "Titre III"
  title: "Protection des systèmes d'information Diffusion Restreinte"
  1_prefix: "Article 13"
  1_label: "Homologation des systèmes d'information Diffusion Restreinte"
  1_desc: "Tout système d'information Diffusion Restreinte est homologué à ce titre dans les conditions prévues à l'article 8. L'homologation prévoit en particulier la manière dont est contrôlée et maîtrisée la destruction du système lui-même ou d'autres supports ayant contenu des informations portant la mention Diffusion Restreinte."
  2_prefix: "Article 14"
  2_label: "Traitement des informations portant la mention Diffusion Restreinte"
  2_desc: "En fonction de son besoin et de ses moyens techniques, humains et financiers, l'entité choisit, conformément aux dispositions du présent article et de l'annexe 2, la classe du réseau sur lequel sont traitées les informations portant la mention Diffusion Restreinte.\n\nLe traitement en clair des informations portant la mention Diffusion Restreinte, notamment leur stockage et leur diffusion, s'effectue sur des réseaux de classe 1 ou 2.\n\nLe choix d'un réseau de classe 2 est fortement recommandé. En effet, toute connexion à un réseau public constitue en elle-même une vulnérabilité qui peut facilement conduire à la compromission d'informations.\n\nLes informations portant la mention Diffusion Restreinte sont chiffrées à l'aide de moyens agréés à ce niveau par l'ANSSI dès lors qu'elles transitent ou sont stockées en dehors d'une zone physiquement protégée dans les conditions prévues à l'article 15."
  3_prefix: "Article 15"
  3_label: "Protection physique des locaux"
  3_desc: "Les mesures de sécurité physique sont choisies en proportion des menaces déterminées par l'analyse des risques prévue à l'article 7. Elles ont pour objectif à la fois de prévenir la perte, l'altération ou la détérioration d'une information portant la mention Diffusion Restreinte et de recueillir des informations pour résoudre des incidents informatiques en :\n\t- défendant par une barrière périmétrique physique les limites de la zone à protéger ;\n\t- dissuadant l'accès non autorisé par toute mesure physique appropriée ;\n\t- contrôlant l'accès des locaux de façon électronique, électromécanique ou humaine ;\n\t- conservant la traçabilité des accès ;\n\t- protégeant des intrusions par un système de détection (ce système peut remplacer une barrière périmétrique ou la compléter pour renforcer le niveau de sécurité)."
  4_prefix: "Article 16"
  4_label: "Externalisation"
  4_desc: "En cas d'externalisation d'une prestation qui met en œuvre un système d'information Diffusion Restreinte, l'entité et son prestataire tiennent compte des recommandations figurant dans le guide de l'ANSSI relatif à l'externalisation. Le contrat qui les lie garantit la conformité du système d'information aux règles prévues par la présente instruction. La prestation s'effectue, dans la mesure du possible, à partir du territoire national.\n\nIl est recommandé à toute entité de choisir des prestataires de services de confiance qualifiés par l'ANSSI."
  5_prefix: "Article 17"
  5_label: "Utilisation en milieu non maîtrisé"
  5_desc: "Les informations portant la mention Diffusion Restreinte contenues dans des dispositifs nomades (ordinateurs portables, média amovibles, téléphones, etc.) sont chiffrées par des moyens agréés par l'ANSSI, afin de limiter le risque de divulgation en cas de perte ou de vol.\n\nLa consultation de documents électroniques portant la mention Diffusion Restreinte dans les lieux publics est entourée de précautions particulières (utilisation d'un filtre de confidentialité sur l'écran, surveillance continuelle du poste nomade lui-même, des alentours, des supports portant la mention Diffusion Restreinte ou des équipements qui les utilisent).\n\nLa connexion d'équipements personnels à un système d'informations Diffusion Restreinte est proscrite.\n\nIl en va de même de la connexion d'équipements nomades traitant d'informations portant la mention Diffusion Restreinte à tout autre système d'information que ceux homologués par l'entité pour traiter de telles informations, sauf si l'homologation du système d'information auquel le dispositif nomade appartient le permet et si les règles prévues par la présente instruction sont respectées."
  6_prefix: "Article 18"
  6_label: "Supports audiovisuels"
  6_desc: "Avant de diffuser des informations portant la mention Diffusion Restreinte sur un support audiovisuel, le responsable de la diffusion vérifie que les participants ont besoin d'en connaître. Il s'assure également que les systèmes d'information utilisés sont homologués pour traiter des informations portant la mention Diffusion Restreinte.\n\nÀ cette occasion, les éventuelles captations photographiques, vidéo ou audio des informations font l'objet d'une attention particulière. Le cas échéant, ces captations sont interdites."
  7_prefix: "Article 19"
  7_label: "Autorisations de dérogation"
  7_desc: "Lorsque les circonstances l'imposent, des dérogations, limitées dans le temps, aux règles prévues par la présente instruction peuvent être accordées à une entité pour un système d'information Diffusion Restreinte qu'elle met en œuvre. Les dérogations sont accordées par le haut fonctionnaire de défense et de sécurité du ministère dont relève l'entité qui met en œuvre le système d'information. Les autorisations de dérogation, accompagnées de leur motivation, sont communiquées à l'ANSSI."
3:
  prefix: "Titre IV"
  title: "Dispositions transitoires et finales"
  1_prefix: "Article 20"
  1_label: "Dispositions transitoires"
  1_desc: "Les entités disposent d'un délai de trois ans à compter de la date de publication de la présente instruction pour mettre en conformité avec les règles qu'elle prévoit leurs systèmes d'information Diffusion Restreinte mis en service avant la date de publication de la présente instruction ou dans les six mois suivant cette date. Durant ce délai, les entités établissent et tiennent à la disposition de l'ANSSI la liste des manquements aux règles prévues par la présente instruction."
  2_prefix: "Article 21"
  2_label: "Abrogation"
  2_desc: "La présente instruction abroge la recommandation n° 901/DISSI/SCSSI du 2 mars 1994 pour la protection des systèmes d'information traitant des informations sensibles non classifiées de défense et la recommandation n° 600/DISSI/SCSSI de mars 1993 pour la protection des informations sensibles ne relevant pas du secret de défense."
4:
  prefix: "Annexe 1"
  title: "Règles pour les entités situées hors du champ d'application de la PSSIE"
  1:
    prefix: "Objectif 1"
    title: "Mettre en place une organisation adéquate, garantissant la prise en compte préventive et réactive de la sécurité."
    1_tags: "Politique, organisation, gouvernance"
    1_prefix: "ORG-SSI"
    1_label: "Organisation de la SSI"
    1_desc: "Une organisation dédiée à la SSI est déployée au sein de chaque entité. Cette organisation définit les responsabilités internes et à l'égard des tiers, les modalités de coordination avec les autorités externes ainsi que les modalités d'application des mesures de protection. Des procédures d'application des mesures sont écrites et portées à la connaissance de tous."
    2_tags: "Politique, organisation, gouvernance"
    2_prefix: "ORG-ACT-SSI"
    2_label: "Identification des acteurs de la SSI"
    2_desc: "L'organisation de la SSI s'appuie sur des acteurs clairement identifiés, responsables de la mise en application générale de la PSSI."
    3_tags: "Politique, organisation, gouvernance"
    3_prefix: "ORG-RSSI"
    3_label: "Responsabilités internes : désignation du responsable de la SSI"
    3_desc: "La direction de l'entité s'appuie sur un ou plusieurs responsables de la sécurité des systèmes d'information (RSSI), chargés de l'assister dans le pilotage et la gestion de la SSI. Des correspondants locaux de la SSI peuvent être désignés, le cas échéant, afin de constituer un relais du RSSI. Le RSSI d'une entité fait valider les mesures d'application de la PSSI par la direction de l'entité et veille à leur application. Des dénominations alternatives des fonctions mentionnées ci-dessus peuvent être utilisées si nécessaire."
    4_tags: "Politique, organisation, gouvernance"
    4_prefix: "ORG-RESP"
    4_label: "Responsabilités internes : formalisation des responsabilités"
    4_desc: "Une note d'organisation fixe la répartition au sein de chaque entité et au niveau local des responsabilités et rôles en matière de SSI. Cette note sera, le plus souvent, proposée par le RSSI et validée par la direction de l'entité."
    5_tags: "Politique, organisation, gouvernance"
    5_prefix: "ORG-TIERS"
    5_label: "Responsabilités vis-à-vis des tiers : gestion contractuelle des tiers"
    5_desc: "Le RSSI coordonne les actions permettant l'intégration des clauses liées à la SSI dans tout contrat ou convention impliquant un accès par des tiers à des informations ou à des ressources informatiques."
    6_tags: "Politique, organisation, gouvernance"
    6_prefix: "ORG-PIL-PSSI"
    6_label: "Définition et pilotage de la PSSI"
    6_desc: "Chaque entité établit une PSSI, validée par la direction. Une structure de pilotage de la PSSI est définie. Cette structure est chargée de sa mise en place, de son évolution, de son suivi et de son contrôle."
    7_tags: "Politique, organisation, gouvernance"
    7_prefix: "ORG-APP-INSTR"
    7_label: "Application des mesures de sécurité au sein de l'entité : application de l'instruction dans l'entité"
    7_desc: "Le RSSI planifie les actions d'application de la PSSI. Il rend compte régulièrement de l'application des mesures de sécurité auprès de la direction de l'entité."
    8_tags: "Politique, organisation, gouvernance"
    8_prefix: "ORG-APP-DOCS"
    8_label: "Application des mesures de sécurité au sein de l'entité : formalisation de documents d'application"
    8_desc: "Le RSSI établit et tient à jour les documents, approuvés par la direction de l'entité, permettant l'application des mesures de la PSSI."
  2:
    prefix: "Objectif 2"
    title: "Faire des personnes les maillons forts des SI."
    1_tags: "Ressources humaines"
    1_prefix: "RH-SSI"
    1_label: "Utilisateurs : charte d'application de la SSI"
    1_desc: "Une charte d'application de la PSSI, récapitulant les mesures pratiques d'utilisation sécurisée des ressources informatiques et élaborée sous le pilotage de la chaîne fonctionnelle de la SSI, est communiquée à l'ensemble des agents de chaque entité. Cette charte doit être opposable juridiquement et, si possible, intégrée au règlement intérieur de l'entité. Le personnel non permanent (stagiaires, intérimaires, prestataires) est informé de ses devoirs dans le cadre de son usage des SI."
    2_tags: "Ressources humaines"
    2_prefix: "RH-MOTIV"
    2_label: "Personnel permanent : choix et sensibilisation des personnes tenant les postes clés de la SSI"
    2_desc: "Une attention particulière doit être portée au recrutement des personnes clés de la SSI : RSSI, correspondants locaux de la SSI et administrateurs de sécurité. Les RSSI et leurs correspondants locaux doivent être spécifiquement formés à la SSI. Les administrateurs des SI doivent être régulièrement sensibilisés aux devoirs liés à leur fonction et doivent veiller à respecter ces exigences dans le cadre de leurs activités quotidiennes."
    3_tags: "Ressources humaines"
    3_prefix: "RH-CONF"
    3_label: "Personnel permanent : personnels de confiance"
    3_desc: "Toutes les personnes manipulant des informations sensibles doivent le faire avec une attention particulière, dans le respect des textes en vigueur. Les sanctions éventuelles s'appliquant aux cas de négligence ou de malveillance leur sont rappelées."
    4_tags: "Ressources humaines"
    4_prefix: "RH-UTIL"
    4_label: "Personnel permanent : sensibilisation des utilisateurs des systèmes d'information"
    4_desc: "Chaque utilisateur doit être régulièrement informé des exigences de sécurité le concernant. Il doit être formé à l'utilisation des outils de travail conformément aux règles de la SSI."
    5_tags: "Ressources humaines"
    5_prefix: "RH-MOUV"
    5_label: "Mouvement de personnel : gestion des arrivées, des mutations et des départs"
    5_desc: "Une procédure permettant de gérer les arrivées, les mutations et les départs des collaborateurs doit être formalisée et appliquée strictement. Cette procédure doit couvrir au minimum :\n\t- la gestion et la révocation des comptes et des droits d'accès aux SI, y compris pour les partenaires et les prestataires externes ;\n\t- la gestion du contrôle d'accès aux locaux ;\n\t- la gestion des équipements mobiles ;\n\t- la gestion du contrôle des habilitations."
    6_tags: "Ressources humaines"
    6_prefix: "RH-NPERM"
    6_label: "Personnel non permanent : gestion du personnel non permanent (stagiaires, intérimaires, prestataires)"
    6_desc: "Les règles de la PSSI s'appliquent à tout personnel non permanent utilisateur d'un SI d'une entité. Les dispositions contractuelles préexistantes régissant l'emploi de ce personnel sont amendées si nécessaire. Pour tout personnel non permanent, un tutorat par un agent permanent est mis en place, afin de l'informer de ces règles et d'en contrôler l'application."
  3:
    prefix: "Objectif 3"
    title: "Tenir à jour une cartographie détaillée et complète des SI."
    1_tags: "Gestion des biens"
    1_prefix: "GDB-INVENT"
    1_label: "Inventaire des ressources informatiques"
    1_desc: "Chaque entité établit et maintient à jour un inventaire des ressources informatiques sous sa responsabilité, en s'appuyant sur un outillage adapté. Cet inventaire est tenu à la disposition du RSSI et de l'ANSSI en cas de besoin de coordination opérationnelle. Il comprend la liste des « briques » matérielles et logicielles utilisées ainsi que leurs versions exactes. Il est constitu d'une base de données de configuration, maintenue à jour et tenue à disposition du RSSI. L'historique des attributions des biens inventoriés doit être conservé dans le respect de la réglementation en vigueur."
    2_tags: "Gestion des biens"
    2_prefix: "GDB-CARTO"
    2_label: "Cartographie"
    2_desc: "La cartographie précise les centres informatiques, les architectures des réseaux, sur lesquels sont identifiés les points névralgiques et la sensibilité des informations manipulées, et qualifie le niveau de sécurité attendu. Cette cartographie est maintenue à jour et tenue à disposition du RSSI et de l'ANSSI en cas de besoin de coordination opérationnelle."
  4:
    prefix: "Objectif 4"
    title: "Qualifier l'information de façon à adapter les mesures de protection"
    1_prefix: "GDB-QUALIF-SENSI"
    1_label: "Qualification des informations"
    1_desc: "La sensibilité de toute information doit être évaluée. Le marquage systématique des documents, en fonction du niveau de sensibilité, est fortement recommandé."
    2_tags: "Gestion des biens"
    2_prefix: "GDB-PROT-IS"
    2_label: "Protection des informations"
    2_desc: "L'utilisateur doit protéger les informations qu'il est amené à manipuler dans le cadre de ses fonctions, selon leur sensibilité et tout au long de leur cycle de vie, depuis leur création jusqu'à leur éventuelle destruction."
  5:
    prefix: "Objectif 5"
    title: "Apprécier, traiter, et communiquer sur les risques relatifs à la sécurité des systèmes d'information."
    1_tags: "Intégration de la SSI dans le cycle de vie des systèmes d'information"
    1_prefix: "INT-HOMOLOG-SSI"
    1_label: "Gestion des risques et homologation de sécurité : homologation de sécurité des systèmes d'information"
    1_desc: "Tout système d'information doit faire l'objet d'une décision d'homologation de sa sécurité avant sa mise en exploitation. L'homologation est l'acte selon lequel une autorité, dite autorité d'homologation, désignée par la direction de l'entité, atteste formellement auprès des utilisateurs que le système d'information est protégé conformément aux objectifs de sécurité fixés. La décision d'homologation est prise le cas échéant après avis d'une commission d'homologation. Cette décision s'appuie sur une analyse de risques adaptée aux enjeux du système considéré et précise les conditions d'emploi."
  6:
    prefix: "Objectif 6"
    title: "Gérer dynamiquement les mesures de protection, tout au long de la vie du SI"
    1_tags: "Intégration de la SSI dans le système de vie des systèmes d'information"
    1_prefix: "INT-SSI"
    1_label: "Maintien en condition de sécurité des systèmes d'information : intégration de la sécurité dans les projets"
    1_desc: "La sécurité des systèmes d'information doit être prise en compte dans toutes les phases des projets informatiques, sous le contrôle de l'autorité d'homologation, de la conception et de la spécification du système jusqu'à son retrait du service."
    2_tags: "Intégration de la SSI dans le système de vie des systèmes d'information"
    2_prefix: "INT-QUOT-SSI"
    2_label: "Maintien en condition de sécurité des systèmes d'information : mise en œuvre au quotidien de la SSI"
    2_desc: "La sécurité des systèmes d'information se traite au quotidien par des pratiques d'hygiène informatique. Des procédures écrites définissent les actes élémentaires du maintien en condition de sécurité lors des phases de conception, d'évolution ou de retrait d'un système."
    3_tags: "Intégration de la SSI dans le système de vie des systèmes d'information"
    3_prefix: "INT-TDB"
    3_label: "Maintien en condition de sécurité des systèmes d'information : créer un tableau de bord SSI"
    3_desc: "Un tableau de bord de la SSI est mis en place et tenu à jour. Il fournit au RSSI et aux autorités une vision générale du niveau de sécurité et de son évolution, rendant ainsi plus efficace le pilotage de la SSI. Au niveau stratégique, le tableau de bord de la SSI permet de suivre l'application de la politique de sécurité et de disposer d'éléments propres à qualifier les ressources devant être allouées à la SSI. Au niveau du pilotage, la mise en place de ce tableau de bord permet de contrôler la réalisation d'objectifs opérationnels, d'améliorer la qualité de service et de détecter au plus tôt les retards dans la réalisation de certains objectifs de sécurité."
  7:
    prefix: "Objectif 7"
    title: "Utiliser des produits et des services dont la sécurité est évaluée et attestée selon des procédures reconnues par l'ANSSI, afin de renforcer la protection des SI."
    1_tags: "Intégration de la SSI dans le système de vie des systèmes d'information"
    1_prefix: "INT-AQ-PSL"
    1_label: "Produits de sécurité et services de confiance labellisés : acquisition de produits de sécurité et de services de confiance"
    1_desc: "Lorsqu'ils sont disponibles, des produits de sécurité ou des services de confiance labellisés (agréés, qualifiés ou certifiés) par l'ANSSI doivent être utilisés."
  8:
    prefix: "Objectif 8"
    title: "Veiller aux exigences de sécurité lorsqu'il est fait appel à une prestation par des tiers."
    1_tags: "Intégration de la SSI dans le système de vie des systèmes d'information"
    1_prefix: "INT-PRES-CS"
    1_label: "Gestion des prestataires : clauses de sécurité"
    1_desc: "Toute prestation dans le domaine des SI est encadrée par des clauses de sécurité. Ces clauses spécifient les mesures SSI que le prestataire doit respecter dans le cadre de ses activités."
    2_tags: "Intégration de la SSI dans le système de vie des systèmes d'information"
    2_prefix: "INT-PRES-CNTRL"
    2_label: "Gestion des prestataires : suivi et contrôle des prestations fournies"
    2_desc: "Le maintien d'un niveau de sécurité au cours du temps nécessite un double contrôle :\n\t- l'un, effectué périodiquement par l'équipe encadrant la prestation, qui porte sur les actions du sous-traitant et la conformité au cahier des charges ;\n\t- l'autre, effectué par une équipe externe, qui porte sur la pertinence du cahier des charges en amont des projets, la conformité des réponses apportées par le sous-traitant en phase de recette et le niveau de sécurité global obtenu en phase de production."
    3_tags: "Intégration de la SSI dans le système de vie des systèmes d'information"
    3_prefix: "INT-REX-AR"
    3_label: "Gestion des prestataires : analyse de risques"
    3_desc: "Toute opération d'externalisation s'appuie sur une analyse de risques préalable, de façon à déterminer des objectifs de sécurité et définir des mesures adaptées. L'ensemble des objectifs de sécurité ainsi déterminés permet de définir une cible de sécurité servant de cadre au contrat établi avec le prestataire."
    4_tags: "Intégration de la SSI dans le système de vie des systèmes d'information"
    4_prefix: "INT-REX-HB"
    4_label: "Gestion des prestataires : hébergement"
    4_desc: "L'hébergement des données sensibles de l'administration sur le territoire national est obligatoire, sauf dérogation dûment motivée et précisée dans la décision d'homologation."
    5_tags: "Intégration de la SSI dans le système de vie des systèmes d'information"
    5_prefix: "INT-REX-HS"
    5_label: "Gestion des prestataires : hébergement et clauses de sécurité"
    5_desc: "Tout contrat d'hébergement détaille les dispositions mises en œuvre pour prendre en compte la SSI. Ce sont notamment les mesures prises pour assurer le maintien en condition de sécurité des systèmes et permettre une gestion de crise efficace (conditions d'accès aux journaux, mise en place d'astreintes, etc.)"
  9:
    prefix: "Objectif 9"
    title: "Inscrire la sécurisation physique des SI dans la sécurisation physique des locaux et dans les processus associés."
    1_tags: "Sécurité physique"
    1_prefix: "PHY-ZONES"
    1_label: "Découpage des sites en zones de sécurité"
    1_desc: "Un découpage des sites en zones physiques de sécurité doit être effectué, en liaison avec le RSSI, les correspondants locaux de la SSI et les services chargés de l'immobilier, de la sécurité et des moyens généraux. Pour chaque zone de sécurité, des critères précis d'autorisation d'accès sont établis."
    2_tags: "Sécurité physique"
    2_prefix: "PHY-PUBL"
    2_label: "Règles de sécurité s'appliquant aux zones d'accueil du public : accès réseau en zone d'accueil du public"
    2_desc: "Tout accès au réseau installé dans une zone d'accueil du public doit être filtré ou isolé du reste du réseau informatique de l'entité."
    3_tags: "Sécurité physique"
    3_prefix: "PHY-SENS"
    3_label: "Règles de sécurité s'appliquant aux zones d'accueil du public : protection des informations sensibles au sein des zones d'accueil"
    3_desc: "Le traitement d'informations sensibles au sein des zones d'accueil est à éviter. Si un tel traitement est strictement nécessaire, il doit rester ponctuel et exceptionnel. Des mesures particulières sont alors adoptées, notamment en matière de protection audiovisuelle ainsi qu'en matière de protection des informations stockées sur les supports."
    4_tags: "Sécurité physique"
    4_prefix: "PHY-TECH"
    4_label: "Règles de sécurité complémentaires s'appliquant aux locaux techniques : sécurité physique des locaux techniques"
    4_desc: "L'accès aux locaux techniques abritant des équipements d'alimentation et de distribution d'énergie ou des équipements de réseau et de téléphonie doit être physiquement protégé."
    5_tags: "Sécurité physique"
    5_prefix: "PHY-TELECOM"
    5_label: "Règles de sécurité complémentaires s'appliquant aux locaux techniques : protection des câbles électriques et de télécommunications"
    5_desc: "Il convient de protéger le câblage du réseau contre les dommages et les interceptions des communications qu'ils transmettent. En complément, les panneaux de raccordements et les salles des câbles doivent être placés en dehors des zones d'accueil du public et leur accès doit être contrôlé."
    6_tags: "Sécurité physique"
    6_prefix: "PHY-CTRL"
    6_label: "Règles de sécurité complémentaires s'appliquant aux locaux techniques : contrôles anti-piégeages"
    6_desc: "Sur les SI particulièrement sensibles, il convient de mener des contrôles anti-piégeages réguliers, effectués par du personnel formé. Il peut être fait appel à des services spécialisés pour les opérations dites de 'dépoussiérage'."
  10:
    prefix: "Objectif 10"
    title: "Proportionner les protections physiques des centres informatiques aux enjeux liés à la concentration des moyens et données abrités."
    1_tags: "Sécurité physique"
    1_prefix: "PHY-CI-LOC"
    1_label: "Règles générales : découpage des locaux en zones de sécurité"
    1_desc: "Un découpage du centre informatique en zones physiques de sécurité doit être effectué, en liaison avec le RSSI et les services chargés de l'immobilier, de la sécurité et des moyens généraux. Des règles doivent fixer les conditions d'accès à ces différentes zones."
    2_tags: "Sécurité physique"
    2_prefix: "PHY-CI-HEBERG"
    2_label: "Règles générales : convention de service en cas d'hébergement tiers"
    2_desc: "Dans le cas où un tiers gère tout ou partie des locaux du centre informatique, une convention de service, définissant les responsabilités mutuelles en matière de sécurité, doit être établie entre ce tiers et l'entité."
    3_tags: "Sécurité physique"
    3_prefix: "PHY-CI-CTRLACC"
    3_label: "Règles de sécurité complémentaires s'appliquant aux zones internes et restreintes : contrôle d'accès physique"
    3_desc: "L'accès aux zones internes (autorisées uniquement au personnel du centre informatique ou aux visiteurs accompagnés) et restreintes (autorisées aux seules personnes habilitées ou aux visiteurs accompagnés) doit reposer sur un dispositif de contrôle d'accès physique. Ce dispositif doit s'appuyer sur des produits de sécurité labellisés, lorsqu'ils sont disponibles, et être maintenu en condition de sécurité de façon rigoureuse."
    4_tags: "Sécurité physique"
    4_prefix: "PHY-CI-MOYENS"
    4_label: "Règles de sécurité complémentaires s'appliquant aux zones internes et restreintes : délivrance des moyens d'accès physique"
    4_desc: "La délivrance des moyens d'accès physique doit respecter un processus formel permettant de s'assurer de l'identité de la personne et s'appuyer sur le processus d'arrivée et de départ du personnel. Le personnel autre que celui explicitement autorisé ou habilité mais néanmoins appelé à intervenir dans les zones internes ou restreintes (entretien ou réparation des bâtiments ou des équipements non informatiques, nettoyage, visiteurs) accède à ces zones sous surveillance permanente et systématique."
    5_tags: "Sécurité physique"
    5_prefix: "PHY-CI-TRACE"
    5_label: "Règles de sécurité complémentaires s'appliquant aux zones internes et restreintes : traçabilité des accès"
    5_desc: "Une traçabilité des accès des visiteurs externes aux zones restreintes doit être mise en place. Ces traces sont conservées un an, dans le respect de la réglementation protégeant les données personnelles."
    6_tags: "Sécurité physique"
    6_prefix: "PHY-CI-ENERGIE"
    6_label: "Règles de sécurité complémentaires s'appliquant aux salles informatiques et aux locaux techniques : local énergie"
    6_desc: "L'alimentation de secteur des équipements devra être conforme aux règles de l'art, de façon à se prémunir contre les atteintes à la sécurité des personnes et des équipements liées à un défaut électrique."
    7_tags: "Sécurité physique"
    7_prefix: "PHY-CI-CLIM"
    7_label: "Règles de sécurité complémentaires s'appliquant aux salles informatiques et aux locaux techniques : climatisation"
    7_desc: "Une climatisation proportionnée aux besoins énergétiques du système informatique doit être installée. Des procédures de réaction en cas de panne, connues du personnel, doivent être élaborées et vérifiées annuellement. Ces dispositions visent à prévenir toute surchauffe des équipements, pouvant engendrer une perte du service voire une détérioration du matériel."
    8_tags: "Sécurité physique"
    8_prefix: "PHY-CI-INC"
    8_label: "Règles de sécurité complémentaires s'appliquant aux salles informatiques et aux locaux techniques : lutte contre l'incendie"
    8_desc: "L'installation de matériel de protection contre le feu est obligatoire. Des procédures de réaction à un incendie sont définies et régulièrement testées. Les salles techniques doivent être propres. Aucun carton, papier ou autre matière inflammable ne doit être entreposé dans ces locaux."
    9_tags: "Sécurité physique"
    9_prefix: "PHY-CI-EAU"
    9_label: "Règles de sécurité complémentaires s'appliquant aux salles informatiques et aux locaux techniques : lutte contre les voies d'eau"
    9_desc: "Une étude sur les risques dus aux voies d'eau doit être réalisée. Cette étude doit notamment prendre en compte le risque de fuite sur un collecteur d'eau douce."
  11:
    prefix: "Objectif 11"
    title: "Traiter de manière globale la sécurité des systèmes d'information et de communication qui assurent la sûreté d'un site."
    desc: "Les sites importants, reconnus le cas échéant comme points d'importance vitale, s'appuient sur des services support des activités de sûreté physique. Dans ce cadre, l'appellation 'services de systèmes d'information et de communication de sûreté'regroupe :\n\t- les services support des activités de contrôle d'accès et de détection d'intrusion (CAD), permettant au personnel de sûreté: \n\t\t- d'authentifier, d'autoriser et de tracer l'accès à une ressource physique (contrôle d'accès), \n\t\t- de détecter, d'alerter et de tracer toute tentative d'accès non autorisé (détection d'intrusion).\n\t- les services support des activités de vidéo-surveillance (VS), fournissant au personnel de sûreté un système de caméras disposées sur l'ensemble du site, de transport des flux vidéo, d'enregistrement, d'archivage et de visionnage de ces vidéos ;\n\t- les services support de la gestion technique des bâtiments (GTB), permettant de superviser et de gérer l'ensemble des équipements des bâtiments du site, et d'avoir une vue globale de l'état de ces bâtiments ;\n\t- les services support de la sécurité contre les incendies (INC), regroupant l'ensemble des moyens informatiques mis en œuvre pour détecter, informer, intervenir ou évacuer tout ou partie du site en cas d'incendie."
    1_tags: "Sécurité physique"
    1_prefix: "PHY-SI-SUR"
    1_label: "Sécurisation du SI de sûreté"
    1_desc: "Pour les sites physiques considérés comme importants, des mesures de protection doivent être définies et appliquées en se fondant sur les conclusions d'une analyse de risques. L'analyse de risques conduit à la désignation des 'briques'essentielles dont il faut assurer la protection contre des actes malveillants. Un système de gestion de la sécurité du SI de sûreté, s'inspirant de la norme ISO 27001, assure le maintien en condition de sécurité. L'emploi de produits de sécurité labellisés, quand ils existent, est fortement recommandé."
  12:
    prefix: "Objectif 12"
    title: "Utiliser les infrastructures maîtrisées de l'entité, en respectant les règles de sécurité qui leur sont attachées."
    1_tags: "Sécurité des réseaux"
    1_prefix: "RES-MAITRISE"
    1_label: "Sécurité des réseaux internes : systèmes autorisés sur le réseau"
    1_desc: "Seuls les équipements gérés et configurés par les équipes informatiques habilitées peuvent être connectés au réseau local d'une entité."
    2_tags: "Sécurité des réseaux"
    2_prefix: "RES-INTERCO"
    2_label: "Sécurité des réseaux internes : interconnexion avec des réseaux externes"
    2_desc: "Toute interconnexion entre les réseaux locaux d'une entité et un réseau externe (réseau d'un tiers, Internet, etc.) doit être réalisée via les infrastructures maîtrisées de l'entité."
    3_tags: "Sécurité des réseaux"
    3_prefix: "RES-ENTSOR"
    3_label: "Sécurité des réseaux internes : mettre en place un filtrage réseau pour les flux sortants et entrants"
    3_desc: "Dans l'optique de réduire les possibilités offertes à un attaquant, les connexions des machines du réseau interne vers l'extérieur doivent être filtrées."
    4_tags: "Sécurité des réseaux"
    4_prefix: "RES-PROT"
    4_label: "Sécurité des réseaux internes : protection des informations"
    4_desc: "Les accès à Internet passent obligatoirement à travers des passerelles maîtrisées de l'entité. Dès lors que des informations sensibles doivent transiter sur des réseaux non maîtrisés, il convient de les protéger spécifiquement par un chiffrement adapté."
  13:
    prefix: "Objectif 13"
    title: "Maîtriser les interconnexions de réseaux locaux. Configurer de manière adéquate les équipements de réseau actifs."
    1_tags: "Sécurité des réseaux"
    1_prefix: "RES-CLOIS"
    1_label: "Sécurité des réseaux locaux : cloisonner le SI en sous-réseaux de niveaux de sécurité homogènes"
    1_desc: "Par analogie avec le cloisonnement physique d'un bâtiment, le système d'information doit être segmenté selon des zones présentant chacune un niveau de sécurité homogène."
    2_tags: "Sécurité des réseaux"
    2_prefix: "RES-INTERCOGEO"
    2_label: "Sécurité des réseaux locaux : interconnexion des sites géographiques locaux d'une entité"
    2_desc: "L'interconnexion au niveau local de réseaux locaux d'une entité n'est possible que si la proximité géographique le justifie et sous réserve de la mise en place de connexions spécifiques et de passerelles sécurisées."
    3_tags: "Sécurité des réseaux"
    3_prefix: "RES-RESS"
    3_label: "Sécurité des réseaux locaux : cloisonnement des ressources en cas de partage de locaux"
    3_desc: "Dans le cas où une entité partage des locaux avec des entités externes, des mesures de cloisonnement des ressources informatiques doivent être mises en place. Les mesures prises doivent être validées par l'autorité d'homologation si elles ne sont pas physiques."
  14:
    prefix: "Objectif 14"
    title: "Ne pas porter atteinte à la sécurité du SI par le déploiement d'accès non supervisés."
    1_tags: "Sécurité des réseaux"
    1_prefix: "RES-INTERNET-SPECIFIQUE"
    1_label: "Accès spécifiques : cas particulier des accès spécifiques dans une entité"
    1_desc: "Les accès spécifiques à Internet nécessitant des droits particuliers pour un usage professionnel ne peuvent être mis en place que sur dérogation dûment justifiée et sur des machines isolées physiquement et séparées du réseau de l'entité, après validation préalable de l'autorité d'homologation."
  15:
    prefix: "Objectif 15"
    title: "Maîtriser le déploiement, la configuration et l'usage des réseaux sans fil."
    1_tags: "Sécurité des réseaux"
    1_prefix: "RES-SSFIL"
    1_label: "Sécurité des réseaux sans fil : mise en place de réseaux sans fil"
    1_desc: "Le déploiement de réseaux sans fil doit faire l'objet d'une analyse de risques spécifique. Les protections intrinsèques étant insuffisantes, des mesures complémentaires doivent être prises dans le cadre de la défense en profondeur. En particulier, une segmentation du réseau doit être mise en place de façon à limiter à un périmètre déterminé les conséquences d'une intrusion depuis la voie radio. À défaut de mise en œuvre de mesures spécifiques, le déploiement de réseaux sans fil sur des SI manipulant des données sensibles est proscrit."
  16:
    prefix: "Objectif 16"
    title: "Configurer les mécanismes de commutation et de routage pour se protéger des attaques."
    1_tags: "Sécurité des réseaux"
    1_prefix: "RES-COUCHBAS"
    1_label: "Sécurisation des mécanismes de commutation et de routage : implanter des mécanismes de protection contre les attaques sur les couches basses"
    1_desc: "Une attention particulière doit être apportée à l'implantation des protocoles de couches basses, de façon à se prémunir des attaques usuelles par saturation ou empoisonnement de cache. Cela concerne, par exemple, le protocole ARP."
    2_tags: "Sécurité des réseaux"
    2_prefix: "RES-ROUTDYN"
    2_label: "Sécurisation des mécanismes de commutation et de routage : surveiller les annonces de routage"
    2_desc: "Lorsque l'utilisation de protocoles de routage dynamique est nécessaire, celle-ci doit s'accompagner de la mise en place d'une surveillance des annonces de routage et de procédures permettant de réagir rapidement en cas d'incidents."
    3_tags: "Sécurité des réseaux"
    3_prefix: "RES-ROUTDYN-IGP"
    3_label: "Sécurisation des mécanismes de commutation et de routage : configurer le protocole IGP de manière sécurisée"
    3_desc: "Le protocole de routage dynamique de type IGP doit être activé exclusivement sur les interfaces nécessaires à la construction de la topologie du réseau et désactivé sur le reste des interfaces. La configuration du protocole de routage dynamique doit systématiquement s'accompagner d'un mot de passe de type MESSAGE-DIGEST-KEY."
    4_tags: "Sécurité des réseaux"
    4_prefix: "RES-ROUTDYN-EGP"
    4_label: "Sécurisation des mécanismes de commutation et de routage : sécuriser les sessions EGP"
    4_desc: "Lors de la mise en place d'une session EGP avec un pair extérieur sur un média partagé, cette session doit s'accompagner d'un mot de passe de type MESSAGE-DIGEST-KEY."
    5_tags: "Sécurité des réseaux"
    5_prefix: "RES-SECRET"
    5_label: "Sécurisation des mécanismes de commutation et de routage : modifier systématiquement les éléments d'authentification par défaut des équipements et services"
    5_desc: "Les mots de passe par défaut doivent être impérativement modifiés, de même que les certificats. Les dispositions nécessaires doivent être prises auprès des fournisseurs de façon à pouvoir modifier les certificats installés par défaut."
    6_tags: "Sécurité des réseaux"
    6_prefix: "RES-DURCI"
    6_label: "Sécurisation des mécanismes de commutation et de routage : durcir les configurations des équipements de réseaux"
    6_desc: "Les équipements de réseaux, comme les routeurs, doivent faire l'objet d'un durcissement spécifique comprenant notamment, outre le changement des mots de passe et des certificats, la désactivation des interfaces et des services inutiles ainsi que la mise en place de mécanismes de protection du plan de contrôle."
  17:
    prefix: "Objectif 17"
    title: "Tenir à jour une cartographie détaillée et complète des réseaux et des interconnexions."
    1_tags: "Sécurité des réseaux"
    1_prefix: "RES-CARTO"
    1_label: "Cartographie de réseau : élaborer les documents d'architecture technique et fonctionnelle"
    1_desc: "L'architecture en réseau du système d'information doit être décrite et formalisée à travers des schémas d'architecture et des configurations, maintenus au fil des évolutions apportées au SI. Les documents d'architecture sont sensibles et font 1 'objet d'une protection adaptée. La cartographie du réseau s'insère dans la cartographie globale des SI."
  18:
    prefix: "Objectif 18"
    title: "Appliquer les principes de défense en profondeur à l'architecture matérielle et logicielle des centres informatiques."
    1_tags: "Architecture des systèmes d'information"
    1_prefix: "ARCHI-HEBERG"
    1_label: "Architecture des centres informatiques : principes d'architecture de la zone d'hébergement"
    1_desc: "L'architecture des infrastructures des centres informatiques est conçue de façon à satisfaire l'ensemble des besoins en disponibilité, confidentialité, traçabilité et intégrité. Le principe de défense en profondeur doit être respecté, en particulier par la mise en œuvre successive de zones démilitarisées (DMZ), d'environnements de sécurité en zone d'hébergement, de machines virtuelles ou physiques dédiées, de réseaux locaux virtuels (VLAN) appropriés, d'un filtrage strict des flux applicatifs et d'administration."
    2_tags: "Architecture des systèmes d'information"
    2_prefix: "ARCHI-STOCKCI"
    2_label: "Architecture des centres informatiques : architecture de stockage et de sauvegarde"
    2_desc: "Le réseau de stockage et de sauvegarde pour les besoins des centres informatiques repose sur une architecture consacrée."
    3_tags: "Architecture des systèmes d'information"
    3_prefix: "ARCHI-PASS"
    3_label: "Architecture des centres informatiques : passerelle Internet"
    3_desc: "Les interconnexions Internet passent obligatoirement par les passerelles nationales homologuées."
  19:
    prefix: "Objectif 19"
    title: "Définir et mettre en œuvre des mesures de protection renforcées pour les informations sensibles."
    1_tags: "Exploitation des systèmes d'information"
    1_prefix: "EXP-PROT-INF"
    1_label: "Protection des informations sensibles : protection des informations sensibles en confidentialité et en intégrité"
    1_desc: "Des mesures doivent être mises en œuvre afin de garantir la protection des informations sensibles en termes de confidentialité et d'intégrité. A défaut d'utilisation d'un réseau homologué, ces informations doivent être chiffrées à l'aide d'un moyen de chiffrement labellisé."
  20:
    prefix: "Objectif 20"
    title: "Durcir les configurations des ressources informatiques et surveiller les interventions opérées sur celles-ci."
    1_tags: "Exploitation des systèmes d'information"
    1_prefix: "EXP-TRAC"
    1_label: "Sécurité des ressources informatiques : traçabilité des interventions sur le système"
    1_desc: "Les interventions de maintenance sur les ressources informatiques de l'entité doivent être tracées par le service informatique. Les traces doivent être accessibles au correspondant local de la SSI durant au moins un an."
    2_tags: "Exploitation des systèmes d'information"
    2_prefix: "EXP-CONFIG"
    2_label: "Sécurité des ressources informatiques : configuration des ressources informatiques"
    2_desc: "Les systèmes d'exploitation et les logiciels doivent faire l'objet d'un durcissement. Les configurations et les mises à jour sont effectuées dans le strict respect des guides ou des procédures en vigueur dans l'entité ou, à défaut, en vigueur au niveau central."
    3_tags: "Exploitation des systèmes d'information"
    3_prefix: "EXP-DOC-CONFIG"
    3_label: "Sécurité des ressources informatiques : documentation des configurations"
    3_desc: "La configuration standard des ressources informatiques doit être documentée et mise à jour à chaque changement notable."
  21:
    prefix: "Objectif 21"
    title: "Authentifier les usagers et contrôler leurs accès aux ressources des SI en fonction d'une politique explicite d'autorisations."
    desc: "Authentifier les usagers et contrôler leurs accès aux ressources des SI en fonction d'une politique explicite d'autorisations."
    1_tags: "Exploitation des systèmes d'information"
    1_prefix: "EXP-ID-AUTH"
    1_label: "Contrôle des accès logiques : identification, authentification et contrôle d'accès logique"
    1_desc: "L'accès à toute ressource non publique doit nécessiter une identification et une authentification individuelle de l'utilisateur. Dans le cas de l'accès à des données sensibles, des moyens d'authentification forte doivent être utilisés. À cette fin, l'usage d'une carte à puce doit être privilégié. Le contrôle d'accès doit être géré et s'appuyer sur un processus formalisé cohérent avec la gestion des ressources humaines."
    2_tags: "Exploitation des systèmes d'information"
    2_prefix: "EXP-DROITS"
    2_label: "Contrôle des accès logiques : droits d'accès aux ressources"
    2_desc: "Après avoir déterminé le niveau de sensibilité, le besoin de diffusion et de partage des ressources, les droits d'accès aux ressources doivent être gérés suivant les principes du besoin d'en connaître et du moindre privilège."
    3_tags: "Exploitation des systèmes d'information"
    3_prefix: "EXP-PROFILS"
    3_label: "Contrôle des accès logiques : gestion des profils d'accès aux applications"
    3_desc: "Les applications manipulant des données sensibles doivent permettre une gestion fine par profils d'accès. Les principes du besoin d'en connaître et du moindre privilège s'appliquent."
    4_tags: "Exploitation des systèmes d'information"
    4_prefix: "EXP-PROC-AUTH"
    4_label: "Processus d'autorisation : autorisations d'accès des utilisateurs"
    4_desc: "Toute action d'autorisation d'accès d'un utilisateur à une ressource des SI, qu'elle soit locale ou nationale, doit s'inscrire dans le cadre d'un processus d'autorisation formalisé, qui s'appuie sur le processus d'arrivée et de départ du personnel."
    5_tags: "Exploitation des systèmes d'information"
    5_prefix: "EXP-REVUE-AUTH"
    5_label: "Processus d'autorisation : revue des autorisations d'accès"
    5_desc: "Une revue des autorisations d'accès doit être réalisée annuellement sous le contrôle du RSSI, le cas échéant avec l'appui du correspondant local de la SSI."
    6_tags: "Exploitation des systèmes d'information"
    6_prefix: "EXP-CONF-AUTH"
    6_label: "Gestion des authentifiants : confidentialité des informations d'authentification"
    6_desc: "Les informations d'authentification (mots de passe d'accès aux SI, clés privées liées aux certificats électroniques, etc.) doivent être considérées comme des données sensibles."
    7_tags: "Exploitation des systèmes d'information"
    7_prefix: "EXP-GEST-PASS"
    7_label: "Gestion des authentifiants : gestion des mots de passe"
    7_desc: "Les utilisateurs ne doivent pas stocker leurs mots de passe en clair, par exemple dans un fichier, sur leur poste de travail. Les mots de passe ne doivent pas transiter en clair sur les réseaux."
    8_tags: "Exploitation des systèmes d'information"
    8_prefix: "EXP-INIT-PASS"
    8_label: "Gestion des authentifiants : initialisation des mots de passe"
    8_desc: "Chaque compte utilisateur doit être créé avec un mot de passe initial aléatoire unique. Si les circonstances l'imposent, un mot de passe plus simple mais à usage unique peut être envisagé."
    9_tags: "Exploitation des systèmes d'information"
    9_prefix: "EXP-POL-PASS"
    9_label: "Gestion des authentifiants : politiques de mots de passe"
    9_desc: "Les règles de gestion et de protection des mots de passe suivent les recommandations de l'ANSSI."
    10_tags: "Exploitation des systèmes d'information"
    10_prefix: "EXP-CERTIFS"
    10_label: "Gestion des authentifiants : utilisation de certificats électroniques"
    10_desc: "Les autorités administratives au sens de l'ordonnance n° 2005-1516 du 8 décembre 2005 appliquent les règles du référentiel général de sécurité pour les certificats électroniques. Les autres entités s'inspirent de ces règles."
    11_tags: "Exploitation des systèmes d'information"
    11_prefix: "EXP-QUAL-PASS"
    11_label: "Gestion des authentifiants : contrôle systématique de la qualité des mots de passe"
    11_desc: "Des moyens techniques permettant d'imposer la politique de mots de passe, par exemple pour s'assurer du respect de l'éventuelle obligation relative à l'usage de caractères spéciaux, doivent être mis en place. À défaut, un contrôle périodique des paramètres techniques relatifs aux mots de passe doit être réalisé."
    12_tags: "Exploitation des systèmes d'information"
    12_prefix: "EXP-SEQ-ADMIN"
    12_label: "Gestion des authentifiants d'administration : séquestre des authentifiants des administrateurs"
    12_desc: "Les authentifiants permettant l'administration des ressources des SI doivent être placés sous séquestre et tenus à jour, dans un coffre ou une armoire fermée à clé. L'administrateur authentifié doit être informé de l'existence de ces opérations de gestion, de leurs finalités et de leurs limites. Tout accès d'administration à une ressource informatique doit pouvoir être tracé et permettre de remonter à la personne exerçant ce droit. Les informations d'authentification bénéficiant d'un moyen de protection physique, notamment d'une carte à puce, n'ont, par défaut, pas besoin de faire l'objet d'opérations de séquestre de la part d'autres personnes que l'administrateur authentifié lui-même."
    13_tags: "Exploitation des systèmes d'information"
    13_prefix: "EXP-POL-ADMIN"
    13_label: "Gestion des authentifiants d'administration : politique des mots de passe des administrateurs"
    13_desc: "Chaque administrateur doit disposer d'un mot de passe propre et destiné à l'administration."
    14_tags: "Exploitation des systèmes d'information"
    14_prefix: "EXP-DEP-ADMIN"
    14_label: "Gestion des authentifiants d'administration : gestion du départ d'un administrateur des SI"
    14_desc: "En cas de départ d'un administrateur disposant de privilèges sur des composants des SI, les comptes individuels dont il disposait doivent être immédiatement désactivés. Les éventuels mots de passe d'administration dont il avait connaissance doivent être changés, par exemple les mots de passe des comptes fonctionnels, des comptes génériques ou des comptes de service utilisés dans le cadre des fonctions de l'administrateur."
  22:
    prefix: "Objectif 22"
    title: "Fournir aux administrateurs les outils nécessaires à l'exercice des tâches de SSI et configurer ces outils de manière sécurisée."
    desc: "Fournir aux administrateurs les outils nécessaires à l'exercice des tâches de SSI et configurer ces outils de manière sécurisée."
    1_tags: "Exploitation des systèmes d'information"
    1_prefix: "EXP-RESTR-DROITS"
    1_label: "Administration des systèmes : restriction des droits"
    1_desc: "Sauf exception dûment motivée et validée par le RSSI, les utilisateurs n'ont pas de droits d'administration."
    2_tags: "Exploitation des systèmes d'information"
    2_prefix: "EXP-PROT-ADMIN"
    2_label: "Administration des systèmes : protection des accès aux outils d'administration"
    2_desc: "L'accès aux outils et aux interfaces d'administration doit être strictement limité aux personnes habilitées, selon une procédure formelle d'autorisation d'accès."
    3_tags: "Exploitation des systèmes d'information"
    3_prefix: "EXP-HABILIT-ADMIN"
    3_label: "Administration des systèmes : habilitation des administrateurs"
    3_desc: "L'habilitation des administrateurs s'effectue selon une procédure validée par l'autorité d'homologation. Le nombre de personnes habilitées pour des opérations d'administration doit être connu et validé par l'autorité d'homologation."
    4_tags: "Exploitation des systèmes d'information"
    4_prefix: "EXP-GEST-ADMIN"
    4_label: "Administration des systèmes : gestion des actions d'administration"
    4_desc: "Les opérations d'administration doivent être tracées de manière à pouvoir imputer individuellement les actions d'administration."
    5_tags: "Exploitation des systèmes d'information"
    5_prefix: "EXP-SEC-FLUXADMIN"
    5_label: "Administration des systèmes : sécurisation des flux d'administration"
    5_desc: "Les opérations d'administration sur les ressources locales d'une entité doivent s'appuyer sur des protocoles sécurisés. Un réseau dédié à l'administration des équipements, tout au moins un réseau logiquement séparé de celui des utilisateurs, doit être utilisé. Les postes d'administrateur doivent être dédiés et ne doivent pas pouvoir accéder à Internet."
    6_tags: "Exploitation des systèmes d'information"
    6_prefix: "EXP-CENTRAL"
    6_label: "Administration des systèmes : centraliser la gestion du système d'information"
    6_desc: "Afin de gérer efficacement un grand nombre de postes d'utilisateurs, de serveurs ou d'équipements en réseau, les administrateurs doivent utiliser des outils centralisés, permettant l'automatisation de traitements quotidiens et offrant une vue globale et pertinente sur le système d'information."
    7_tags: "Exploitation des systèmes d'information"
    7_prefix: "EXP-SECX-DIST"
    7_label: "Administration des systèmes : sécurisation des outils de prise de main à distance"
    7_desc: "La prise de main à distance d'une ressource informatique locale ne doit être réalisable que par les agents autorisés par l'équipe locale chargée des SI, sur les ressources informatiques de leur périmètre. Des mesures de sécurité spécifiques doivent être définies et respectées."
    8_tags: "Exploitation des systèmes d'information"
    8_prefix: "EXP-DOM-POL"
    8_label: "Administration des domaines : définir une politique de gestion des comptes du domaine"
    8_desc: "Une politique explicite de gestion des comptes du domaine doit être établie."
    9_tags: "Exploitation des systèmes d'information"
    9_prefix: "EXP-DOM-PASS"
    9_label: "Administration des domaines : configurer la stratégie des mots de passe des domaines"
    9_desc: "La politique de gestion des mots de passe doit être conçue de façon à protéger contre les attaques par essais successifs de mots de passe. Une complexité minimale dans le choix des mots de passe doit être imposée aux utilisateurs."
    10_tags: "Exploitation des systèmes d'information"
    10_prefix: "EXP-DOM-NOMENCLAT"
    10_label: "Gestion des comptes : définir et appliquer une nomenclature des comptes du domaine"
    10_desc: "La gestion des comptes doit s'appuyer sur une nomenclature adaptée, afin de pouvoir distinguer selon leur usage les comptes d'utilisateur standard, les comptes d'administration (domaine, serveurs, postes de travail) et les comptes de service."
    11_tags: "Exploitation des systèmes d'information"
    11_prefix: "EXP-DOM-RESTADMIN"
    11_label: "Gestion des comptes : restreindre au maximum l'appartenance aux groupes d'administration du domaine"
    11_desc: "L'appartenance aux groupes du domaine ADMINISTRATEURS DE L'ENTREPRISE et ADMINISTRATEURS DU DOMAINE n'est nécessaire que dans de très rares cas. Les opérations les plus courantes doivent être effectuées avec des comptes du domaine membres des groupes locaux d'administration des ordinateurs ou ayant une délégation d'administration."
    12_tags: "Exploitation des systèmes d'information"
    12_prefix: "EXP-DOM-SERV"
    12_label: "Gestion des comptes : maîtriser l'utilisation des comptes de service"
    12_desc: "Les mots de passe des comptes de service sont souvent inscrits en dur dans des applications ou dans des systèmes. Cette mauvaise pratique ne permet pas d'être en mesure de changer ces mots de passe, par exemple en urgence. Il est ainsi nécessaire de veiller à pouvoir maîtriser leur utilisation."
    13_tags: "Exploitation des systèmes d'information"
    13_prefix: "EXP-DOM-LIMITSERV"
    13_label: "Gestion des comptes : limiter les droits des comptes de service"
    13_desc: "Les comptes de service doivent faire l'objet d'une restriction des droits, en suivant le principe du moindre privilège."
    14_tags: "Exploitation des systèmes d'information"
    14_prefix: "EXP-DOM-OBSOLET"
    14_label: "Gestion des comptes : désactiver les comptes du domaine obsolètes"
    14_desc: "Il est nécessaire de désactiver immédiatement, voire de supprimer, les comptes obsolètes, que ce soient des comptes d'utilisateur (administrateur, service ou utilisateur standard) ou des comptes de machine."
    15_tags: "Exploitation des systèmes d'information"
    15_prefix: "EXP-DOM-ADMINLOC"
    15_label: "Gestion des comptes : améliorer la gestion des comptes d'administrateur locaux"
    15_desc: "Afin d'empêcher la réutilisation des empreintes d'un compte d'utilisateur local d'une machine à une autre, il faut soit utiliser des mots de passe différents pour les comptes locaux d'administration, soit interdire la connexion à distance via ces comptes."
    16_tags: "Exploitation des systèmes d'information"
    16_prefix: "EXP-MAINT-EXT"
    16_label: "Envoi en maintenance et mise au rebut : maintenance externe"
    16_desc: "Les données non chiffrées doivent être effacées avant l'envoi en maintenance externe de toute ressource informatique. Les opérations de chiffrement doivent faire appel à des produits de sécurité labellisés. L'effacement des données sensibles doit s'appuyer sur des produits de sécurité labellisés ou respecter des procédures établies en concertation avec l'ANSSI."
    17_tags: "Exploitation des systèmes d'information"
    17_prefix: "EXP-MIS-REB"
    17_label: "Envoi en maintenance et mise au rebut : mise au rebut"
    17_desc: "Lorsqu'une ressource informatique est amenée à quitter définitivement l'entité, les données présentes sur les disques durs ou la mémoire intégrée doivent être effacées de manière sécurisée. L'effacement des données sensibles doit s'appuyer sur des produits de sécurité labellisés ou respecter des procédures établies en concertation avec l'ANSSI."
    18_tags: "Exploitation des systèmes d'information"
    18_prefix: "EXP-PROT-MALV"
    18_label: "Lutte contre les codes malveillants : protection contre les codes malveillants"
    18_desc: "Des logiciels de protection contre les codes malveillants, appelés communément antivirus, doivent être installés sur l'ensemble des serveurs d'interconnexion, des serveurs applicatifs et des postes de travail de l'entité. Ces logiciels de protection doivent être distincts pour ces trois catégories au moins et le dépouillement de leurs journaux doit être corrélé."
    19_tags: "Exploitation des systèmes d'information"
    19_prefix: "EXP-GES-ANTIVIR"
    19_label: "Lutte contre les codes malveillants : gestion des événements de sécurité de l'antivirus"
    19_desc: "Les événements de sécurité de l'antivirus doivent être envoyés à un serveur national pour analyse statistique et gestion des problèmes a posteriori (exemples : serveur constamment infecté, virus détecté et non éradiqué par l'antivirus, etc.)."
    20_tags: "Exploitation des systèmes d'information"
    20_prefix: "EXP-MAJ-ANTIVIR"
    20_label: "Lutte contre les codes malveillants : mise à jour de la base de signatures"
    20_desc: "Les mises à jour des bases antivirales et des moteurs d'antivirus doivent être déployées automatiquement sur les serveurs et les postes de travail par un dispositif prescrit par les services centraux."
    21_tags: "Exploitation des systèmes d'information"
    21_prefix: "EXP-NAVIG"
    21_label: "Lutte contre les codes malveillants : configuration du navigateur Internet"
    21_desc: "Le navigateur déployé par l'équipe locale chargée des SI sur l'ensemble des serveurs et des postes de travail nécessitant un accès Internet ou Intranet doit être configuré de manière sécurisée (désactivation des services inutiles, nettoyage du magasin de certificats, etc.)."
    22_tags: "Exploitation des systèmes d'information"
    22_prefix: "EXP-POL-COR"
    22_label: "Mise à jour des systèmes et des logiciels : définir et mettre en œuvre une politique de suivi et d'application des correctifs de sécurité"
    22_desc: "Le maintien du niveau de sécurité d'un système d'information impose une gestion organisée et adaptée des mises à jour de sécurité. Un processus de gestion des correctifs propre à chaque système ou applicatif doit être défini et adapté aux contraintes et au niveau d'exposition du système."
    23_tags: "Exploitation des systèmes d'information"
    23_prefix: "EXP-COR-SEC"
    23_label: "Mise à jour des systèmes et des logiciels : déploiement des correctifs de sécurité"
    23_desc: "Les correctifs de sécurité des ressources informatiques locales doivent être déployés par l'équipe locale chargée des SI en s'appuyant sur les préconisations et les outils proposés par les services centraux."
    24_tags: "Exploitation des systèmes d'information"
    24_prefix: "EXP-OBSOLET"
    24_label: "Mise à jour des systèmes et des logiciels : assurer la migration des systèmes obsolètes"
    24_desc: "L'ensemble des logiciels utilisés sur le système d'information doit l'être dans une version pour laquelle l'éditeur assure le support et le tient à jour. En cas de défaillance du support, il convient d'en étudier l'impact et de prendre les mesures adaptées."
    25_tags: "Exploitation des systèmes d'information"
    25_prefix: "EXP-ISOL"
    25_label: "Mise à jour des systèmes et des logiciels : isoler les systèmes obsolètes restants"
    25_desc: "Il est nécessaire d'isoler les systèmes obsolètes, qui sont gardés volontairement pour assurer un maintien en condition opérationnelle des projets et pour lesquels une migration n'est pas envisageable. Chaque fois que cela est possible, cette isolation doit être effectuée au niveau du réseau par un filtrage strict, au niveau des éléments d'authentification, qui ne doivent pas être communs avec le reste du SI, et au niveau des applications (aucune ressource ne doit être partagée avec le reste du SI)."
    26_tags: "Exploitation des systèmes d'information"
    26_prefix: "EXP-JOUR-SUR"
    26_label: "Journalisation : « journalisation » des alertes"
    26_desc: "Chaque système doit disposer de dispositifs de « journalisation » permettant de conserver une trace des événements de sécurité. Ces traces doivent être conservées de manière sûre."
    27_tags: "Exploitation des systèmes d'information"
    27_prefix: "EXP-POL-JOUR"
    27_label: "Journalisation : définir et mettre en œuvre une politique de gestion et d'analyse des journaux de traces"
    27_desc: "Une politique de gestion et d'analyse des journaux de traces des événements de sécurité est définie par le RSSI, validée par l'autorité d'homologation et mise en œuvre. Le niveau de sécurité d'un système d'information dépend en grande partie de la capacité de ses exploitants et de ses administrateurs à détecter les erreurs, les dysfonctionnements et les tentatives d'accès illicites survenant sur les éléments qui le composent."
    28_tags: "Exploitation des systèmes d'information"
    28_prefix: "EXP-CONS-JOUR"
    28_label: "Journalisation : conservation des journaux"
    28_desc: "Les journaux des événements de sécurité doivent être conservés pendant douze mois glissants, hors contraintes légales et réglementaires particulières imposant des durées de conservation spécifiques."
  23:
    prefix: "Objectif 23"
    title: "Défendre les SI nécessite une vigilance de tous et des actions permanentes."
    1_tags: "Défense des systèmes d'information"
    1_prefix: "EXP-GES-DYN"
    1_label: "Défense des systèmes d'information : gestion dynamique de la sécurité"
    1_desc: "L'équipe en charge de la SSI doit procéder, notamment via l'analyse des journaux, à la surveillance des comportements anormaux au sein du système d'information et à la surveillance des flux d'entrée et de sortie du système d'information."
    2_tags: "Défense des systèmes d'information"
    2_prefix: "EXP-MAIT-MAT"
    2_label: "Gestion des matériels informatiques fournis à l'utilisateur : maîtrise des matériels"
    2_desc: "Les postes de travail, y compris dans le cas d'une location, sont fournis à l'utilisateur par l'entité, gérés et configurés sous la responsabilité de l'entité. La connexion d'équipements non maîtrisés, non administrés ou non mis à jour par l'entité, qu'il s'agisse d'ordiphones, d'équipements informatiques nomades et fixes ou de supports de stockage amovibles, sur des équipements et des réseaux professionnels est interdite."
    3_tags: "Défense des systèmes d'information"
    3_prefix: "EXP-PROT-VOL"
    3_label: "Gestion des matériels informatiques fournis à l'utilisateur : rappel des mesures de protection contre le vol"
    3_desc: "Les postes fixes bénéficient des mesures de protection physique offertes au titre de la présente PSSI. Chaque utilisateur doit veiller à la sécurité des supports amovibles (clés USB et disques amovibles), notamment en les conservant dans un endroit sûr. Il est recommandé de chiffrer les données contenues sur ces supports. Les supports contenant des données sensibles doivent être stockés dans des meubles fermant à clef."
    4_tags: "Défense des systèmes d'information"
    4_prefix: "EXP-DECLAR-VOL"
    4_label: "Gestion des matériels informatiques fournis à l'utilisateur : déclarer les pertes et vols"
    4_desc: "Toute perte ou vol d'une ressource d'un système d'information doit être déclarée au RSSI."
    5_tags: "Défense des systèmes d'information"
    5_prefix: "EXP-REAFFECT"
    5_label: "Gestion des matériels informatiques fournis à l'utilisateur : réaffectation de matériels informatiques"
    5_desc: "Une procédure de gestion des postes et des supports dans le cadre de départs de personnel ou de réaffectations à de nouveaux utilisateurs doit être mise en place et validée par le RSSI. Elle doit définir les conditions de recours à un effacement des données."
    6_tags: "Défense des systèmes d'information"
    6_prefix: "EXP-NOMAD-SENS"
    6_label: "Nomadisme : déclaration des équipements nomades aptes à traiter des informations sensibles"
    6_desc: "L'autorité d'homologation du SI valide les usages possibles des équipements nomades vis-à-vis du traitement des informations sensibles ; les usages non explicitement autorisés sont interdits."
    7_tags: "Défense des systèmes d'information"
    7_prefix: "EXP-ACC-DIST"
    7_label: "Nomadisme : accès à distance au système d'information de l'organisme"
    7_desc: "Les autorités administratives au sens de l'ordonnance n° 2005-1516 du 8 décembre 2005 appliquent les règles de l'annexe B3 du référentiel général de sécurité pour l'authentification des utilisateurs distants. Les autres entités s'inspirent de ces règles."
    8_tags: "Défense des systèmes d'information"
    8_prefix: "EXP-IMP-SENS"
    8_label: "Sécurisation des imprimantes et des copieurs multifonctions manipulant des informations sensibles : impression des informations sensibles"
    8_desc: "Les impressions d'informations sensibles doivent être effectuées selon une procédure définie préalablement, garantissant un contrôle par l'utilisateur, du déclenchement de l'impression jusqu'à la récupération du support imprimé."
    9_tags: "Défense des systèmes d'information"
    9_prefix: "EXP-IMP-2"
    9_label: "Sécurisation des imprimantes et des copieurs multifonctions manipulant des informations sensibles : sécurité des imprimantes et des copieurs multifonctions"
    9_desc: "Les imprimantes et les copieurs multifonctions sont des ressources informatiques à part entière qui doivent être gérées en tant que telles. Elles ne doivent pas pouvoir communiquer avec l'extérieur."
  24:
    prefix: "Objectif 24"
    title: "Exploiter de manière sécurisée les centres informatiques en s'appuyant sur des procédures adaptées et sur la maîtrise des outils de supervision."
    1_tags: "Exploitation des systèmes d'information"
    1_prefix: "EXP-CI-OS"
    1_label: "Sécurité des ressources informatiques : systèmes d'exploitation"
    1_desc: "Les systèmes d'exploitation déployés doivent faire l'objet d'un support valide de la part d'un éditeur ou d'un prestataire de service. Seuls les services et les applications nécessaires sont installés, de façon à réduire la surface d'attaque. Une attention particulière doit être apportée aux comptes administrateurs."
    2_tags: "Exploitation des systèmes d'information"
    2_prefix: "EXP-CI-LTP"
    2_label: "Sécurité des ressources informatiques : logiciels en tiers présentation"
    2_desc: "La mise en œuvre d'une configuration renforcée est obligatoire sur les logiciels déployés pour le tiers présentation (exemples: serveur Web, Reverse Proxy)."
    3_tags: "Exploitation des systèmes d'information"
    3_prefix: "EXP-CI-LTA"
    3_label: "Sécurité des ressources informatiques : logiciels en tiers application"
    3_desc: "Des règles de développement et de configuration sécurisés des logiciels en tiers application doivent être fixées et appliquées."
    4_tags: "Exploitation des systèmes d'information"
    4_prefix: "EXP-CI-LTD"
    4_label: "Sécurité des ressources informatiques : logiciels en tiers données"
    4_desc: "Des règles très strictes (restrictions d'accès, interdictions de connexions, gestion des privilèges) s'appliquent aux logiciels en tiers données."
    5_tags: "Exploitation des systèmes d'information"
    5_prefix: "EXP-CI-PROTFIC"
    5_label: "Sécurité des ressources informatiques : passerelle d'échange de fichiers"
    5_desc: "Les échanges de fichiers entre applications doivent privilégier les protocoles sécurisés (SSL/TLS, FTPS, etc.)."
    6_tags: "Exploitation des systèmes d'information"
    6_prefix: "EXP-CI-MESSTECH"
    6_label: "Sécurité des ressources informatiques : messagerie technique"
    6_desc: "Pour satisfaire les besoins d'exploitation et de supervision des infrastructures et des applications, une messagerie dite technique peut être déployée en zone de 'back-office'du centre informatique. Cette messagerie technique ne doit être en aucun cas utilisée directement par un utilisateur."
    7_tags: "Exploitation des systèmes d'information"
    7_prefix: "EXP-CI-FILT"
    7_label: "Sécurité des ressources informatiques : filtrage des flux applicatifs"
    7_desc: "De façon à garantir un niveau de sécurité satisfaisant face aux attaques informatiques, des mécanismes de filtrage et de cloisonnement doivent être mis en œuvre."
    8_tags: "Exploitation des systèmes d'information"
    8_prefix: "EXP-CI-ADMIN"
    8_label: "Sécurité des ressources informatiques : flux d'administration"
    8_desc: "Il convient de différencier deux types de flux d'administration : les flux d'administration de l'infrastructure, réservés aux agents du centre informatique, et les flux d'administration des applications métier, réservés à la direction métier. L'attribution des droits d'administration doit respecter cette différenciation. Les deux types de flux d'administration doivent être dans la mesure du possible cloisonnés."
    9_tags: "Exploitation des systèmes d'information"
    9_prefix: "EXP-CI-DNS"
    9_label: "Sécurité des ressources informatiques : service de noms de domaine - DNS technique"
    9_desc: "Dans le cas du déploiement d'un serveur de noms de domaines pour les besoins techniques internes au centre informatique, on utilisera les extensions sécurisées DNSSEC."
    10_tags: "Exploitation des systèmes d'information"
    10_prefix: "EXP-CI-EFFAC"
    10_label: "Sécurité des ressources informatiques : effacement de support"
    10_desc: "Le reconditionnement et la réutilisation des disques durs pour un autre usage, par exemple la réattribution d'une machine ou d'un serveur, ne sont autorisés qu'après une opération d'effacement sécurisé des données."
    11_tags: "Exploitation des systèmes d'information"
    11_prefix: "EXP-CI-DESTR"
    11_label: "Sécurité des ressources informatiques : destruction de support"
    11_desc: "La fin de vie d'un support ou d'un matériel embarquant un support de stockage (imprimante, routeur, commutateur, etc.) doit s'accompagner d'une opération de destruction avant remise au constructeur."
    12_tags: "Exploitation des systèmes d'information"
    12_prefix: "EXP-CI-TRAC"
    12_label: "Sécurité des ressources informatiques : tracabilité et imputabilité"
    12_desc: "Afin d'assurer une cohérence dans les échanges entre applications ainsi qu'une traçabilité pertinente des événements techniques et de sécurité, les centres d'exploitation emploient une référence de temps commune (service NTP, Network Time Protocol)."
    13_tags: "Exploitation des systèmes d'information"
    13_prefix: "EXP-CI-SUPERVIS"
    13_label: "Sécurité des ressources informatiques : supervision"
    13_desc: "Un cloisonnement entre les flux de supervision (remontée d'informations) et les flux d'administration (commandes, mises à jour) doit être mis en place."
    14_tags: "Exploitation des systèmes d'information"
    14_prefix: "EXP-CI-AMOV"
    14_label: "Sécurité des ressources informatiques : accès aux périphériques amovibles"
    14_desc: "L'accès aux supports informatiques amovibles fait l'objet d'un traitement adapté, plus particulièrement lorsque ces supports ont été utilisés pour mémoriser des informations sensibles ou lorsqu'ils sont utilisés pour des opérations d'exploitation."
    15_tags: "Exploitation des systèmes d'information"
    15_prefix: "EXP-CI-ACCRES"
    15_label: "Sécurité des ressources informatiques : accès aux réseaux"
    15_desc: "Dans un centre informatique, le contrôle physique des accès aux réseaux, l'attribution des adresses IP, le filtrage des informations et l'usage de dispositifs spécifiques (machines virtuelles, cartes d'administration à distance, etc.) font l'objet de procédures sécurisées."
    16_tags: "Exploitation des systèmes d'information"
    16_prefix: "EXP-CI-AUDIT"
    16_label: "Sécurité des ressources informatiques : audit et contrôle"
    16_desc: "Le RSSI pilote des audits réguliers du système d'information relevant de sa responsabilité."
  25:
    prefix: "Objectif 25"
    title: "Durcir les configurations des postes de travail en protégeant les utilisateurs."
    1_tags: "Sécurité du poste de travail"
    1_prefix: "PDT-GEST"
    1_label: "Mise à disposition du poste : fourniture et gestion des postes de travail"
    1_desc: "Les postes de travail utilisés dans le cadre professionnel sont fournis et gérés par l'équipe locale chargée des SI."
    2_tags: "Sécurité du poste de travail"
    2_prefix: "PDT-CONFIG"
    2_label: "Mise à disposition du poste : formalisation de la configuration des postes de travail"
    2_desc: "Une procédure formalisée de configuration des postes de travail est établie par chaque entité, conformément aux recommandations de l'ANSSI."
    3_tags: "Sécurité du poste de travail"
    3_prefix: "PDT-VEROUIL-FIXE"
    3_label: "Verrouillage de l'unité centrale des postes fixes"
    3_desc: "Lorsque l'unité centrale d'un poste fixe est peu volumineuse, donc susceptible d'être facilement emportée, elle doit être protégée contre le vol par un système d'attache, par exemple par un câble antivol."
    4_tags: "Sécurité du poste de travail"
    4_prefix: "PDT-VEROUIL-PORT"
    4_label: "Sécurité physique des postes de travail : verrouillage des postes portables"
    4_desc: "Un câble physique de sécurité doit être fourni avec chaque poste portable. Les utilisateurs doivent être sensibilisés à son utilisation."
    5_tags: "Sécurité du poste de travail"
    5_prefix: "PDT-REAFFECT"
    5_label: "Sécurité physique des postes de travail : réaffectation du poste de travail"
    5_desc: "Une procédure de SSI définit les règles concernant le traitement à appliquer aux informations ayant été stockées ou manipulées sur les postes réaffectés."
    6_tags: "Sécurité du poste de travail"
    6_prefix: "PDT-PRIVIL"
    6_label: "Gestion des privilèges sur les postes de travail : privilèges des utilisateurs sur les postes de travail"
    6_desc: "La gestion des privilèges des utilisateurs sur leurs postes de travail doit suivre le principe du moindre privilège : chaque utilisateur ne doit disposer que des privilèges nécessaires à la conduite des actions relevant de sa mission."
    7_tags: "Sécurité du poste de travail"
    7_prefix: "PDT-PRIV"
    7_label: "Gestion des privilèges sur les postes de travail : utilisation des privilèges d'accès des administrateurs"
    7_desc: "Les privilèges d'accès des administrateurs doivent être utilisés uniquement pour les actions d'administration le nécessitant."
    8_tags: "Sécurité du poste de travail"
    8_prefix: "PDT-ADM-LOCAL"
    8_label: "Gestion des privilèges sur les postes de travail : gestion du compte de l'administrateur local"
    8_desc: "L'accès au compte de l'administrateur local sur les postes de travail doit être strictement limité aux équipes en charge de l'exploitation et du support sur ces postes de travail."
    9_tags: "Sécurité du poste de travail"
    9_prefix: "PDT-STOCK"
    9_label: "Protection des informations : stockage des informations"
    9_desc: "Dans la mesure du possible, les données traitées par les utilisateurs doivent être stockées sur des espaces en réseau, eux-mêmes sauvegardés selon les exigences des entités et en accord avec les règles de sécurité en vigueur."
    10_tags: "Sécurité du poste de travail"
    10_prefix: "PDT-SAUV-LOC"
    10_label: "Protection des informations : sauvegarde et synchronisation des données locales"
    10_desc: "Dans le cas où des données doivent être stockées localement sur le poste de travail, des moyens de synchronisation ou de sauvegarde doivent être fournis aux utilisateurs."
    11_tags: "Sécurité du poste de travail"
    11_prefix: "PDT-PART-FIC"
    11_label: "Protection des informations : partage de fichiers"
    11_desc: "Le partage de répertoires ou de données hébergées localement sur les postes de travail n'est pas autorisé."
    12_tags: "Sécurité du poste de travail"
    12_prefix: "PDT-SUPPR-PART"
    12_label: "Protection des informations : suppression des données sur les postes partagés"
    12_desc: "Les données présentes sur les postes partagés (portable de prêt, par exemple) doivent être supprimées entre deux utilisations, dès lors que les utilisateurs ne disposent pas du même besoin d'en connaître."
    13_tags: "Sécurité du poste de travail"
    13_prefix: "PDT-CHIFF-SENS"
    13_label: "Protection des informations : chiffrement des données sensibles"
    13_desc: "Un moyen de chiffrement labellisé doit être mis à la disposition des utilisateurs et des administrateurs afin de chiffrer les données sensibles stockées sur les postes de travail, les serveurs, les espaces de travail ou les supports amovibles."
    14_tags: "Sécurité du poste de travail"
    14_prefix: "PDT-AMOV"
    14_label: "Protection des informations : fourniture de supports de stockage amovibles"
    14_desc: "Les supports de stockage amovibles (clés USB et disques durs externes, notamment) doivent être fournis aux utilisateurs par l'équipe locale chargée des SI."
    15_tags: "Sécurité du poste de travail"
    15_prefix: "PDT-NOMAD-ACCESS"
    15_label: "Nomadisme : accès à distance aux SI de l'entité"
    15_desc: "Les accès à distance aux SI de l'entité (accès dits 'nomades') doivent intervenir via des réseaux privés virtuels (VPN) de confiance conformes aux recommandations de l'ANSSI."
    16_tags: "Sécurité du poste de travail"
    16_prefix: "PDT-NOMAD-PAREFEU"
    16_label: "Nomadisme : pare-feu local"
    16_desc: "Un pare-feu local conforme aux recommandations de l'ANSSI doit être installé sur les postes nomades."
    17_tags: "Sécurité du poste de travail"
    17_prefix: "PDT-NOMAD-STOCK"
    17_label: "Nomadisme : stockage local d'information sur les postes nomades"
    17_desc: "Le stockage local d'information sur les postes de travail nomades doit être limité au strict nécessaire. Les informations sensibles doivent être obligatoirement chiffrées par un moyen de chiffrement labellisé."
    18_tags: "Sécurité du poste de travail"
    18_prefix: "PDT-NOMAD-FILT"
    18_label: "Nomadisme : filtre de confidentialité"
    18_desc: "Pour les postes de travail nomades manipulant des données sensibles, un filtre de confidentialité doit être fourni et être positionné sur l'écran dès lors que le poste est utilisé en dehors de l'entité."
    19_tags: "Sécurité du poste de travail"
    19_prefix: "PDT-NOMAD-CONNEX"
    19_label: "Nomadisme : configuration des interfaces de connexion sans fil"
    19_desc: "La configuration des interfaces de connexion sans fil doit interdire les usages dangereux de ces interfaces."
    20_tags: "Sécurité du poste de travail"
    20_prefix: "PDT-NOMAD-DESACTIV"
    20_label: "Nomadisme : désactivation des interfaces de connexion sans fil"
    20_desc: "Des règles de configuration des interfaces de connexion sans fil (Wifi, Bluetooth, 3G, etc.), permettant d'interdire les usages non maîtrisés et d'éviter les intrusions via ces interfaces, doivent être définies et appliquées. Les interfaces sans fil ne doivent être activées qu'en cas de besoin."
  26:
    prefix: "Objectif 26"
    title: "Paramétrer les imprimantes et les copieurs multifonctions afin de diminuer leur surface d'attaque."
    1_tags: "Sécurité du poste de travail"
    1_prefix: "PDT-MUL-DURCISS"
    1_label: "Sécurisation des imprimantes et des copieurs multifonctions : durcissement des imprimantes et des copiers multifonctions"
    1_desc: "Les imprimantes et les copieurs multifonctions hébergés localement dans une entité doivent faire l'objet d'un durcissement en termes de sécurité : changement des mots de passe initialement fixés par le constructeur, désactivation des interfaces en réseau inutiles, suppression des services inutiles, chiffrement des données sur le disque dur lorsque cette fonctionnalité est disponible, configuration de réseau statique."
    2_tags: "Sécurité du poste de travail"
    2_prefix: "PDT-MUL-SECNUM"
    2_label: "Sécurisation des imprimantes et des copieurs multifonctions : sécurisation de la fonction de numérisation"
    2_desc: "Lorsqu'elle est activée, la fonction de numérisation sur les copieurs multifonctions hébergés dans une entité doit être sécurisée. Les mesures de sécurité suivantes doivent notamment être appliquées : envoi de documents uniquement à destination d'une adresse de messagerie interne à l'entité, envoi à une seule adresse de messagerie."
  27:
    prefix: "Objectif 27"
    title: "Sécuriser la téléphonie pour protéger les utilisateurs contre des attaques malveillantes."
    1_tags: "Sécurité du poste de travail"
    1_prefix: "PDT-TEL-MINIM"
    1_label: "Sécurisation de la téléphonie : sécuriser la configuration des autocommutateurs"
    1_desc: "Les autocommutateurs doivent être maintenus à jour en ce qui concerne les correctifs de sécurité. Leur configuration doit être durcie. La définition et l'affectation des droits d'accès et des privilèges aux utilisateurs (transfert départ-départ, entrée en tiers, interphonie, autorisation de déblocage, renvoi sur un numéro extérieur, substitution, substitution de privilège, interception d'appel dirigé, etc.) doivent faire l'objet d'une attention particulière. Une revue de la programmation téléphonique doit être organisée périodiquement."
    2_tags: "Sécurité du poste de travail"
    2_prefix: "PDT-TEL-CODES"
    2_label: "Sécurisation de la téléphonie : codes d'accès téléphoniques"
    2_desc: "Il est nécessaire de sensibiliser les utilisateurs au besoin de modifier le code d'accès de leur téléphone et de leur messagerie vocale."
    3_tags: "Sécurité du poste de travail"
    3_prefix: "PDT-TEL-DECT"
    3_label: "Sécurisation de la téléphonie : limiter l'utilisation du DECT"
    3_desc: "Les communications réalisées au travers du protocole DECT sont susceptibles d'être interceptées, même si les mécanismes d'authentification et de chiffrement que propose ce protocole sont activés. Il est recommandé d'attribuer des postes téléphoniques filaires aux utilisateurs dont les échanges sont les plus sensibles."
  28:
    prefix: "Objectif 28"
    title: "Contrôler régulièrement la conformité des paramétrages de sécurité appliqués aux postes de travail."
    1_tags: "Sécurité du poste de travail"
    1_prefix: "PDT-CONF-VERIF"
    1_label: "Contrôles de conformité : utiliser des outils de vérification automatique de la conformité"
    1_desc: "Un outil de vérification régulière de la conformité des éléments de configuration des postes de travail doit être mis en place, afin d'éviter une dérive dans le temps de ces éléments de configuration."
  29:
    prefix: "Objectif 29"
    title: "Reconnaître la sécurité comme une fonction essentielle et la prendre en compte dès la conception des projets."
    1_tags: "Sécurité du développement des systèmes"
    1_prefix: "DEV-INTEGR-SECLOC"
    1_label: "Développement des systèmes : intégrer la sécurité dans les développements locaux"
    1_desc: "Toute initiative locale de développement informatique doit respecter les recommandations de l'ANSSI, concernant la prise en compte de la sécurité dans les projets et les développements informatiques. Le service à l'origine du projet se porte garant de l'application du référentiel général de sécurité et de l'application d'une démarche d'homologation du système."
    2_tags: "Sécurité du développement des systèmes"
    2_prefix: "DEV-SOUS-TRAIT"
    2_label: "Développement des systèmes : intégrer des clauses de SSI dans les contrats de sous-traitance de développement informatique"
    2_desc: "Lors de l'écriture d'un contrat de sous-traitance de développement, plusieurs clauses relatives à la SSI doivent être intégrées : \n\t-formation obligatoire des développeurs sur le développement sécurisé et sur les vulnérabilités classiques ; \n\t-utilisation obligatoire d'outils permettant de minimiser les erreurs introduites durant le développement (outils gratuits d'analyse statique de code, utilisation de bibliothèques réputées pour leur sécurité, etc.) ; \n\t-production de documentation technique décrivant l'implémentation des protections développées (gestion de l'authentification, stockage des mots de passe, gestion des droits, chiffrement, etc.) ; \n\t-respect de normes de développement sécurisé, qu'elles soient propres au développeur, publiques ou propres au commanditaire ; \n\t-obligation pour le prestataire de corriger, dans un temps raisonnable et pour un prix défini, les vulnérabilités introduites durant le développement et portées à sa connaissance, en incluant automatiquement les corrections des autres occurrences des mêmes erreurs de programmation."
  30:
    prefix: "Objectif 30"
    title: "Mener les développements des logiciels selon une méthodologie de sécurisation du code produit."
    1_tags: "Sécurité du développement des systèmes"
    1_prefix: "DEV-FUITES"
    1_label: "Développements des logiciels et sécurité : limiter les fuites d'information"
    1_desc: "Les fuites d'informations techniques sur les logiciels utilisés permettent aux attaquants de déceler plus facilement d'éventuelles vulnérabilités. Il est impératif de limiter fortement la diffusion d'informations au sujet des produits utilisés, même si cette précaution ne constitue pas une protection en tant que telle."
    2_tags: "Sécurité du développement des systèmes"
    2_prefix: "DEV-LOG-ADHER"
    2_label: "Développements des logiciels et sécurité : réduire l'adhérence des applications à des produits ou à technologies spécifiques"
    2_desc: "Le fonctionnement d'une application s'appuie sur un environnement logiciel et matériel. En phases de conception et de spécification technique, il est nécessaire de s'assurer que les applications n'ont pas une trop forte adhérence vis-à-vis des environnements sur lesquels elles reposent. En effet, l'apparition de failles sur un environnement a de fait un impact sur la sécurité des applications qui en dépendent. En plus du maintien en condition de sécurité propre à l'application, il est donc nécessaire de pouvoir faire évoluer son environnement pour garantir sa sécurité dans la durée."
    3_tags: "Sécurité du développement des systèmes"
    3_prefix: "DEV-LOG-CRIT"
    3_label: "Développements des logiciels et sécurité : instaurer des critères de développement sécurisé"
    3_desc: "Une fois passées les phases de définition des besoins et de conception de l'architecture applicative, le niveau de sécurité d'une application dépend fortement des modalités pratiques suivies lors de sa phase de développement."
    4_tags: "Sécurité du développement des systèmes"
    4_prefix: "DEV-LOG-CYCLE"
    4_label: "Développements des logiciels et sécurité : intégrer la sécurité dans le cycle de vie du logiciel"
    4_desc: "La sécurité doit être intégrée à toutes les étapes du projet, depuis l'expression des besoins jusqu'à la maintenance applicative, en passant par la rédaction du cahier des charges et les phases de recette."
    5_tags: "Sécurité du développement des systèmes"
    5_prefix: "DEV-LOG-WEB"
    5_label: "Développements des logiciels et sécurité : améliorer la prise en compte de la sécurité dans les développements Web"
    5_desc: "Les développements Web, en particulier les développements en PHP, font l'objet de problèmes de sécurité récurrents qui ont conduit à la constitution de référentiels de sécurité. Ces référentiels ont pour objectif de fixer des règles de bonne pratique à l'usage des développeurs. Ce sont des règles d'ordre générique ou pouvant être spécifiques à un langage (PHP, ASP, NET, etc.)."
    6_tags: "Sécurité du développement des systèmes"
    6_prefix: "DEV-LOG-PASS"
    6_label: "Développements des logiciels et sécurité : calculer les empreintes de mots de passe de manière sécurisée"
    6_desc: "Lorsqu'une application doit stocker les mots de passe de ses utilisateurs, il est important de mettre en œuvre des mesures permettant de se prémunir contre les attaques documentées : attaques par dictionnaire, attaques par tables dites 'arc-en-ciel', attaques par force brute, etc."
  31:
    prefix: "Objectif 31"
    title: "Accompagner le développement sécurisé d'applications à risques par des contre-mesures minimisant l'impact d'attaques nouvelles."
    1_tags: "Sécurité du développement des systèmes"
    1_prefix: "DEV-FILT-APPL"
    1_label: "Applications à risques : mettre en œuvre des fonctionnalités de filtrage applicatif pour les applications à risque"
    1_desc: "Devant les applications à risques, il est recommandé de faire usage d'une solution tierce de filtrage applicatif pour renforcer la sécurité et minimiser l'impact des attaques potentielles."
  32:
    prefix: "Objectif 32"
    title: "Partager l'information (alertes, incidents) dans le respect des règles de prudence et mutualiser les opérations de remise en état, de façon à lutter efficacement contre les attaques."
    1_tags: "Traitement des incidents"
    1_prefix: "TI-OPS-SSI"
    1_label: "Chaînes opérationnelles : chaînes opérationnelles de la SSI"
    1_desc: "Les alertes et les incidents sont gérés selon des procédures testées lors d'exercices. La coordination des compétences est organisée à l'échelon de l'entité. Les situations d'urgences peuvent faire appel à des mesures définies préalablement dans le cadre de plans."
    2_tags: "Traitement des incidents"
    2_prefix: "TI-MOB"
    2_label: "Traitement des alertes de sécurité émises par les instances nationales (ANSSI) : mobilisation en cas d'alerte"
    2_desc: "En cas d'alerte de sécurité identifiée au niveau national, les RSSI de chaque entité s'assurent de la bonne application des exigences formulées par les instances nationales, dans les meilleurs délais."
    3_tags: "Traitement des incidents"
    3_prefix: "TI-QUAL-TRAIT"
    3_label: "Remontée des incidents de sécurité rencontrés : qualification et traitement des incidents"
    3_desc: "La chaîne fonctionnelle de la SSI est informée par la chaîne opérationnelle de tout incident de sécurité et contribue si nécessaire à la qualification de l'incident et au pilotage de son traitement."
    4_tags: "Traitement des incidents"
    4_prefix: "TI-INC-REM"
    4_label: "Remontée des incidents de sécurité rencontrés : remontée des incidents"
    4_desc: "Tout incident de sécurité, même apparemment mineur, dont l'impact dépasse ou est susceptible de dépasser le SI d'une entité, fait l'objet d'un compte-rendu, via la chaîne de SSI, au centre opérationnel de la sécurité des systèmes d'information (COSSI) de l'ANSSI. La remontée d'incidents par les chaînes opérationnelles participe à la vigilance permanente. Cette remontée est immédiate pour les incidents dont la portée est susceptible de dépasser à court terme le périmètre de l'entité et pour les incidents correspondant à des signalements spécifiques, notamment de la part de l'ANSSI. La remontée prend la forme d'une synthèse mensuelle pour les autres incidents. Les critères et les procédures précis de remontée d'incidents sont élaborés sous le pilotage de la chaîne fonctionnelle de la SSI, en lien avec la chaîne opérationnelle. Chaque entité doit maintenir à jour un historique précis des suites de chaque incident, afin de capitaliser les enseignements tirés de la résolution ou non de ces incidents. La difficile caractérisation des attaques (ambiguïté de la source, du dommage, du moyen, de la finalité) rend nécessaire les échanges d'informations, même sur des « signaux faibles », ainsi que la coordination continue des actions."
  33:
    prefix: "Objectif 33"
    title: "Se doter de plans de continuité d'activité et les tester."
    1_tags: "Continuité d'activité"
    1_prefix: "PCA-MINIS"
    1_label: "Gestion de la continuité d'activité des SI : définition du plan de continuité d'activité des SI"
    1_desc: "Chaque entité définit un plan de continuité d'activité des SI permettant d'assurer, en cas de sinistre, la continuité d'activité des SI."
    2_tags: "Continuité d'activité"
    2_prefix: "PCA-LOCAL"
    2_label: "Définition du plan de continuité d'activité des systèmes d'information d'une entité : définition du plan local de continuité d'activité des systèmes d'information"
    2_desc: "Le directeur des systèmes d'information ou le RSSI d'une entité définit la structure et les objectifs du plan de continuité d'activité des systèmes d'information permettant d'assurer effectivement, en cas de sinistre, la continuité de l'activité."
    3_tags: "Continuité d'activité"
    3_prefix: "PCA-SUIVILOCAL"
    3_label: "Mise en œuvre du plan local de continuité d'activité des systèmes d'information : suivi de la mise en œuvre du plan de continuité d'activité local des SI"
    3_desc: "Le RSSI d'une entité s'assure de la bonne mise en œuvre des dispositions prévues dans le plan de continuité d'activité des systèmes d'information."
    4_tags: "Continuité d'activité"
    4_prefix: "PCA-PROC"
    4_label: "Mise en œuvre du plan local de continuité d'activité des systèmes d'information : mise en œuvre des dispositifs techniques et des procédures opérationnelles"
    4_desc: "Les équipes informatiques mettent en œuvre les dispositifs techniques et les procédures opérationnelles contribuant à la continuité des SI. Elles en assurent la supervision quotidienne et la maintenance dans le temps."
    5_tags: "Continuité d'activité"
    5_prefix: "PCA-SAUVE"
    5_label: "Mise en œuvre du plan local de continuité d'activité des systèmes d'information : protection de la disponibilité des sauvegardes"
    5_desc: "Les données sauvegardées ne doivent pas être soumises aux mêmes risques de sinistres que les données en cours d'exploitation."
    6_tags: "Continuité d'activité"
    6_prefix: "PCA-PROT"
    6_label: "Mise en œuvre du plan local de continuité d'activité des systèmes d'information : protection de la confidentialité des sauvegardes"
    6_desc: "Les sauvegardes doivent être traitées de manière à garantir leur confidentialité et leur intégrité."
    7_tags: "Continuité d'activité"
    7_prefix: "PCA-EXERC"
    7_label: "Maintien en conditions opérationnelles du plan local de continuité d'activité des SI : exercice régulier du plan local de continuité d'activité des systèmes d'information"
    7_desc: "Le RSSI d'une entité organise des exercices réguliers, afin de tester le plan local de continuité d'activité des systèmes d'information."
    8_tags: "Continuité d'activité"
    8_prefix: "PCA-MISAJOUR"
    8_label: "Maintien en conditions opérationnelles du plan local de continuité d'activité des SI : mise à jour du plan local de continuité d'activité des systèmes d'information"
    8_desc: "Le RSSI d'une entité assure la tenue à jour du plan local de continuité d'activité des SI."
  34:
    prefix: "Objectif 34"
    title: "Effectuer des contrôles (audits, inspections) et des exercices réguliers de façon à mesurer les progrès accomplis et corriger les manquements."
    1_tags: "Conformité, audit, inspection, contrôle"
    1_prefix: "CONTR-SSI"
    1_label: "Contrôles locaux"
    1_desc: "La conformité à la PSSI de l'entité est vérifiée par des contrôles réguliers. Les RSSI de chaque entité conduisent des actions locales d'évaluation de la conformité à la PSSI et contribuent à la consolidation, dans un bilan annuel, de l'état d'avancement de sa mise en œuvre."
