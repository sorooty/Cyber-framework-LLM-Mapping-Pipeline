1:
  title: "Évaluation de la sécurité de l'information - Questionnaire"
  1:
    title: "Politiques et organisation de la SI"
    1_prefix: "1.1.1"
    1_label: "Politiques de sécurité de l'information - Dans quelle mesure les politiques de sécurité de l'information sont-elles disponibles ?"
    1_desc: "Objectif :\nL'organisation doit disposer d'au moins une politique de sécurité de l'information. Celle-ci reflète l'importance et la signification de la sécurité de l'information et est adaptée à l'organisation. Des politiques supplémentaires peuvent être appropriées en fonction de la taille et de la structure de l'organisation.\n\nExigences (obligatoires) :\n + Les exigences en matière de sécurité de l'information ont été déterminées et documentées : \n\t - Les exigences sont adaptées aux objectifs de l'organisation,\n\t\t - Une politique est élaborée et publiée par l'organisation.\n+ La politique inclut les objectifs et la signification de la sécurité de l'information au sein de l'organisation.\n\nExigences (recommandées) :\n+ Les exigences en matière de sécurité de l'information basées sur la stratégie de l'organisation, la législation et les contrats sont prises en compte dans la politique.\n + La politique indique les conséquences en cas de non-conformité.\n+ D'autres politiques de sécurité pertinentes sont établies.\n+ Une révision périodique et, si nécessaire, une mise à jour des politiques sont prévues.\n+ Les politiques sont mises à disposition des employés sous une forme appropriée (par ex. intranet).\n+ Les employés et partenaires commerciaux externes sont informés des modifications les concernant.\n\nExigences supplémentaires pour les évaluations de groupe simplifiées (SGA) :\n+ Les politiques sont publiées et mises en œuvre dans l'ensemble du périmètre de l'évaluation."
    2_prefix: "1.2.1"
    2_label: "Organisation de la sécurité de l'information - Dans quelle mesure la sécurité de l'information est-elle gérée au sein de l'organisation ?"
    2_desc: "Objectif :\nLa sécurité de l'information ne peut être mise en œuvre de manière durable dans une organisation que si elle fait partie des objectifs stratégiques de celle-ci. Le système de gestion de la sécurité de l'information (SGSI) est un mécanisme de contrôle utilisé par la direction de l'organisation pour garantir que la sécurité de l'information résulte d'une gestion durable et non d'efforts isolés et fortuits.\n\nExigences (obligatoires) :\n+ Le périmètre du SGSI (l'organisation gérée par le SGSI) est défini.\n+ Les exigences de l'organisation pour le SGSI sont déterminées.\n+ La direction de l'organisation a mandaté et approuvé le SGSI.\n+ Le SGSI fournit à la direction des moyens de surveillance et de contrôle adaptés (par ex. revue de direction).\n+ Les contrôles applicables ont été déterminés (par ex. Déclaration d'applicabilité ISO 27001, catalogue ISA complété).\n+ L'efficacité du SGSI est régulièrement revue par la direction.\n\nExigences supplémentaires pour les évaluations de groupe simplifiées (SGA) :\n+ Le système de gestion est approuvé par une entité disposant de l'autorité nécessaire pour l'ensemble du périmètre de l'évaluation (c'est-à-dire tous les sites concernés)."
    3_prefix: "1.2.2"
    3_label: "Organisation de la sécurité de l'information - Dans quelle mesure les responsabilités en matière de sécurité de l'information sont-elles organisées ?"
    3_desc: "Objectif :\nLa sécurité de l'information ne peut être mise en œuvre de manière durable dans une organisation que si elle fait partie des objectifs stratégiques de celle-ci. Le système de gestion de la sécurité de l'information (SGSI) est un mécanisme de contrôle utilisé par la direction de l'organisation pour garantir que la sécurité de l'information résulte d'une gestion durable et non d'efforts isolés et fortuits.\n\nExigences (obligatoires) :\n+ Le périmètre du SGSI (l'organisation gérée par le SGSI) est défini.\n+ Les exigences de l'organisation pour le SGSI sont déterminées.\n+ La direction de l'organisation a mandaté et approuvé le SGSI.\n+ Le SGSI fournit à la direction des moyens de surveillance et de contrôle adaptés (par ex. revue de direction).\n+ Les contrôles applicables ont été déterminés (par ex. Déclaration d'applicabilité ISO 27001, catalogue ISA complété).\n\nExigences (recommandées) :\n+ Une structure de sécurité de l'information adéquate est définie et documentée au sein de l'organisation.\n\t- D'autres rôles de sécurité pertinents sont pris en compte.\n\nExigences supplémentaires pour des besoins de protection élevés :\n+ Une séparation organisationnelle appropriée des responsabilités doit être établie afin d'éviter les conflits d'intérêts (séparation des tâches). (C, I, A)\n\nExigences supplémentaires pour les évaluations de groupe simplifiées (SGA) :\n+ Une personne nommée, responsable de l'ensemble du système de gestion, existe et est disponible."
    4_prefix: "1.2.3"
    4_label: "Organisation de la sécurité de l'information - Dans quelle mesure les exigences en matière de sécurité de l'information sont-elles prises en compte dans les projets ?"
    4_desc: "Objectif :\nPour la mise en œuvre des projets, il est important de prendre en compte les exigences en matière de sécurité de l'information. Cela s'applique aux projets au sein de l'organisation, quel que soit leur type. En intégrant de manière appropriée le processus de sécurité de l'information dans les procédures de gestion de projet de l'organisation, toute omission d'exigences est évitée.\n\nExigences (obligatoires) :\n+ Les projets sont classés en tenant compte des exigences en matière de sécurité de l'information.\n\nExigences (recommandées) :\n+ La procédure et les critères de classification des projets sont documentés.\n+ Une évaluation des risques est réalisée dès les premières étapes du projet, selon une procédure définie, et répétée en cas de modifications du projet.\n+ Pour les risques de sécurité de l'information identifiés, des mesures sont définies et intégrées au projet.\n\nExigences supplémentaires pour des besoins de protection élevés :\n+ Les mesures ainsi définies sont régulièrement examinées au cours du projet et réévaluées en cas de modification des critères d'évaluation. (C, I, A)"
    5_prefix: "1.2.4"
    5_label: "Organisation de la sécurité de l'information - Dans quelle mesure les responsabilités entre les prestataires de services informatiques externes et l'organisation sont-elles définies ?"
    5_desc: "Objectif :\nIl est essentiel qu'une compréhension commune de la répartition des responsabilités existe et que la mise en œuvre de toutes les exigences de sécurité soit assurée. Par conséquent, lors de l'utilisation de prestataires de services informatiques externes et de services informatiques, les responsabilités relatives à la mise en œuvre des mesures de sécurité de l'information doivent être définies et documentées de manière vérifiable.\n\nExigences (obligatoires) :\n+ Les services concernés et les services informatiques utilisés sont identifiés.\n+ Les exigences de sécurité pertinentes pour le service informatique sont déterminées :\n+ L'organisation responsable de la mise en œuvre des exigences est définie et consciente de sa responsabilité.\n+ Les mécanismes de responsabilités partagées sont spécifiés et mis en œuvre.\n+ L'organisation responsable remplit ses responsabilités respectives.\n\nExigences (recommandées) :\n+ En cas de services informatiques, la configuration a été conçue, mise en œuvre et documentée en fonction des exigences de sécurité nécessaires.\n+ Le personnel responsable est formé de manière adéquate."
    6_prefix: "1.3.1"
    6_label: "Gestion des actifs - Dans quelle mesure les actifs informationnels sont-ils identifiés et enregistrés ?"
    6_desc: "Objectif :\nIl est important que chaque organisation connaisse les informations constituant ses actifs essentiels (par ex. secrets d'affaires, processus métiers critiques, savoir-faire, brevets).\nCes actifs sont appelés actifs informationnels. Un inventaire permet à l'organisation d'obtenir une vue d'ensemble de ses actifs informationnels. De plus, il est essentiel de connaître les actifs supports (par ex. systèmes informatiques, services informatiques, employés) traitant ces actifs informationnels.\n\nExigences (obligatoires) :\n+ Les actifs informationnels et autres actifs dont la sécurité est pertinente pour l'organisation sont identifiés et enregistrés.\n- Une personne responsable de ces actifs informationnels est désignée.\n+ Les actifs supports traitant les actifs informationnels sont identifiés et enregistrés :\n- Une personne responsable de ces actifs supports est désignée.\n\nExigences (recommandées) :\n+ Un catalogue des actifs informationnels pertinents existe :\n - Les actifs supports correspondants sont attribués à chaque actif informationnel pertinent,\n - Le catalogue fait l'objet d'un examen régulier."
    7_prefix: "1.3.2"
    7_label: "Gestion des actifs - Dans quelle mesure les actifs informationnels sont-ils classifiés et gérés en fonction de leurs besoins en protection ?"
    7_desc: "Objectif :\nL'objectif de la classification des actifs informationnels est de déterminer de manière cohérente leurs besoins en protection. Pour ce faire, la valeur que l'information représente pour l'organisation est évaluée en fonction des objectifs de protection de la sécurité de l'information (confidentialité, intégrité et disponibilité) et classée selon un schéma de classification. Cela permet à l'organisation de mettre en place des mesures de protection appropriées.\n\nExigences (obligatoires) :\n+ Un schéma cohérent de classification des actifs informationnels en fonction de l'objectif de protection de la confidentialité est disponible.\n+ L'évaluation des actifs informationnels identifiés est effectuée selon des critères définis et attribuée au schéma de classification existant.\n+ Des spécifications pour la gestion des actifs supports (par ex. identification, manipulation correcte, transport, stockage, restitution, suppression/élimination) en fonction de la classification des actifs informationnels sont en place et mises en œuvre.\n\nExigences (recommandées) :\n+ Les objectifs de protection en matière d'intégrité et de disponibilité sont pris en considération."
    8_prefix: "1.3.3"
    8_label: "Gestion des actifs - Dans quelle mesure est-il garanti que seuls les services informatiques externes évalués et approuvés sont utilisés pour traiter les actifs informationnels de l'organisation ?"
    8_desc: "Objectif :\nEn particulier dans le cas de services informatiques externes pouvant être utilisés à faible coût ou gratuitement, il existe un risque accru que l'acquisition et la mise en service soient effectuées sans considération appropriée des exigences de sécurité de l'information, compromettant ainsi la sécurité.\n\nExigences (obligatoires) :\n+ Les services informatiques externes ne sont pas utilisés sans évaluation explicite et mise en œuvre des exigences de sécurité de l'information :\n - Une évaluation des risques des services informatiques externes est disponible,\n - Les exigences légales, réglementaires et contractuelles sont prises en compte.\n+ Les services informatiques externes sont harmonisés avec le besoin de protection des actifs informationnels traités.\n\nExigences (recommandées) :\n+ Les exigences relatives à l'acquisition, la mise en service et l'approbation associées à l'utilisation des services informatiques externes sont déterminées et remplies.\n+ Une procédure d'approbation prenant en compte le besoin de protection est établie.\n+ Les services informatiques externes et leur approbation sont documentés.\n+ Il est vérifié à intervalles réguliers que seuls les services informatiques externes approuvés sont utilisés."
    9_prefix: "1.3.4"
    9_label: "Gestion des actifs - Dans quelle mesure est-il garanti que seuls les logiciels évalués et approuvés sont utilisés pour traiter les actifs informationnels de l'organisation ?"
    9_desc: "Objectif :\nLe traitement des informations est principalement réalisé à l'aide de logiciels spécifiques. Les problèmes de sécurité des logiciels peuvent facilement poser un risque pour les informations traitées. Par conséquent, la gestion des logiciels doit être appropriée.\n\nExigences (obligatoires) :\n+ Le logiciel est approuvé avant installation ou utilisation. Les aspects suivants sont pris en compte :\n\t- Approbation limitée à des cas d'utilisation ou des rôles spécifiques\n\t- Conformité aux exigences de sécurité de l'information\n\t- Droits d'utilisation et licences des logiciels\n\t- Source / réputation du logiciel\n+ L'approbation des logiciels s'applique également aux logiciels à usage spécifique tels que les outils de maintenance.\n\nExigences (recommandées) :\n+ Les types de logiciels à gérer sont déterminés, y compris les micrologiciels, systèmes d'exploitation, applications, bibliothèques et pilotes de périphériques.\n+ Des référentiels de logiciels gérés existent.\n+ Les référentiels de logiciels sont protégés contre toute manipulation non autorisée.\n+ L'approbation des logiciels est régulièrement revue.\n+ Les versions des logiciels et les niveaux de correctifs sont connus.\n\nExigences supplémentaires pour des besoins de très haute protection :\n+ Des exigences supplémentaires pour l'utilisation des logiciels (ex. nécessité de contrôle ou de surveillance de l'utilisation) sont déterminées si nécessaire. (C, I, A)"
    10_prefix: "1.4.1"
    10_label: "Gestion des risques de la SI - Dans quelle mesure les risques liés à la sécurité de l'information sont-ils gérés ?"
    10_desc: "Objectif :\nLa gestion des risques liés à la sécurité de l'information vise à détecter, évaluer et traiter les risques en temps opportun afin d'atteindre les objectifs de protection de la sécurité de l'information. Elle permet ainsi à l'organisation de mettre en place des mesures adéquates pour protéger ses actifs informationnels en tenant compte des perspectives et des risques associés. Il est recommandé de garder la gestion des risques aussi simple que possible pour garantir son efficacité et son efficience.\n\nExigences (obligatoires) :\n+ Des évaluations des risques sont effectuées à intervalles réguliers ainsi qu'en réponse à des événements.\n+ Les risques de sécurité de l'information sont évalués de manière appropriée (ex. probabilité d'occurrence et dommages potentiels).\n+ Les risques de sécurité de l'information sont documentés.\n+ Une personne responsable (propriétaire du risque) est assignée à chaque risque de sécurité de l'information. Cette personne est responsable de l'évaluation et du traitement des risques.\n\nExigences (recommandées) :\n+ Une procédure est en place pour définir comment identifier, évaluer et traiter les risques de sécurité au sein de l'organisation.\n+ Des critères d'évaluation et de gestion des risques existent.\n+ Les mesures de traitement des risques et les personnes responsables sont spécifiées et documentées :\n\t- Un plan d'actions ou un aperçu de leur état d'implémentation est suivi.\n+ En cas de changements dans l'environnement (ex. structure organisationnelle, emplacement, modifications réglementaires), une réévaluation est réalisée en temps opportun."
    11_prefix: "1.5.1"
    11_label: "Évaluations - Dans quelle mesure la conformité aux exigences de sécurité de l'information est-elle assurée dans les procédures et processus ?"
    11_desc: "Objectif :\nIl ne suffit pas de définir des exigences de sécurité de l'information et d'élaborer et publier des politiques. Il est essentiel de vérifier régulièrement leur efficacité.\n\nExigences (obligatoires) :\n+ L'observation des politiques est vérifiée à travers l'organisation.\n+ Les politiques et procédures de sécurité de l'information sont révisées à intervalles réguliers.\n+ Des mesures correctives sont initiées et suivies en cas de non-conformités potentielles (écarts).\n+ La conformité aux exigences de sécurité de l'information (ex. spécifications techniques) est régulièrement vérifiée.\n+ Les résultats des évaluations sont enregistrés et conservés.\n\nExigences (recommandées) :\n+ Un plan définissant le contenu et les conditions des évaluations (calendrier, portée, contrôles) est prévu.\n\nExigences supplémentaires pour les évaluations de groupe simplifiées (SGA) :\n+ Des contrôles internes sont mis en œuvre pour toutes les entités concernées par l'évaluation.\n+ Des responsabilités et ressources qualifiées en audit de la sécurité de l'information sont définies.\n+ Un plan d'audit interne détaillé est défini et suivi, incluant une couverture complète de la portée de l'évaluation et un suivi des résultats des audits internes."
    12_prefix: "1.5.2"
    12_label: "Évaluations - Dans quelle mesure le SGSI est-il revu par une autorité indépendante ?"
    12_desc: "Objectif :\nUne évaluation de l'efficacité du SGSI ne peut pas se limiter à une perspective interne. Une évaluation indépendante et donc objective doit être obtenue à intervalles réguliers et en cas de changements fondamentaux.\n\nExigences (obligatoires) :\n+ Des examens de la sécurité de l'information sont réalisés par un organisme indépendant et compétent à intervalles réguliers et en cas de changements fondamentaux.\n+ Des mesures correctives sont initiées et suivies en cas de non-conformités identifiées.\n\nExigences (recommandées) :\n+ Les résultats des évaluations sont documentés et communiqués à la direction de l'organisation.\n\nExigences supplémentaires pour les évaluations de groupe simplifiées (SGA) :\n+ En cas de changements fondamentaux, des audits sont réalisés par une entité indépendante et qualifiée, garantissant l'objectivité et la compétence.\n+ Le suivi des constatations et la mise en œuvre des actions correctives sont suivis par une entité indépendante."
    13_prefix: "1.6.1"
    13_label: "Gestion des incidents et des crises - Dans quelle mesure les événements ou observations liés à la sécurité de l'information sont-ils signalés ?"
    13_desc: "Objectif :\nTout le monde peut détecter des événements de sécurité ou des observations pertinentes. Il est crucial que chacun puisse et sache quand et comment signaler ce qu'il a observé et qui pourrait avoir des implications en matière de sécurité, afin que les experts puissent décider des actions à entreprendre.\n\nExigences (obligatoires) :\n+ Une définition des événements ou observations de sécurité devant être signalés existe et est connue des employés et parties prenantes. Les aspects suivants sont pris en compte :\n\t- Événements et observations liés au personnel (ex. comportement inapproprié).\n\t- Événements et observations liés à la sécurité physique (ex. intrusion, vol, accès non autorisé).\n\t- Événements et observations liés à la cybersécurité (ex. systèmes informatiques vulnérables, attaques détectées).\n\t- Événements et observations liés aux fournisseurs et partenaires commerciaux (ex. incidents impactant la sécurité de l'organisation).\n+ Des mécanismes adaptés aux risques perçus pour signaler les incidents de sécurité sont définis, mis en œuvre et connus de tous.\n+ Des canaux de communication adéquats avec les rapporteurs d'incidents existent.\n\nExigences (recommandées) :\n+ Un point de contact unique pour le signalement des incidents est disponible.\n+ Différents canaux de signalement selon la gravité perçue sont disponibles (ex. communication en temps réel pour les urgences, mécanismes asynchrones comme les tickets ou emails).\n+ Les employés sont formés et tenus de signaler les incidents pertinents.\n+ Les signalements d'événements de sécurité provenant de parties externes sont pris en compte et un mécanisme de signalement externe est communiqué.\n+ Une procédure de retour d'information aux rapporteurs est mise en place.\n\nExigences supplémentaires pour des besoins de très haute protection :\n+ Des tests et exercices de signalement des incidents sont menés régulièrement. (C, I, A)"
    14_prefix: "1.6.2"
    14_label: "Gestion des incidents et des crises - Dans quelle mesure les incidents de sécurité signalés sont-ils gérés ?"
    14_desc: "Objectif :\nUne fois les incidents de sécurité signalés, il est essentiel d'assurer leur gestion efficace. Il s'agit d'identifier rapidement la nature et la criticité de l'incident ainsi que les personnes responsables afin d'intervenir en temps opportun. L'organisation doit aussi coordonner la communication si l'incident concerne plusieurs parties. Enfin, si des obligations de signalement externe existent (contractuelles ou réglementaires), elles doivent être respectées de manière professionnelle.\n\nExigences (obligatoires) :\n+ Les incidents signalés sont traités sans retard injustifié.\n+ Une réaction adéquate aux incidents de sécurité signalés est garantie.\n+ Les enseignements tirés sont intégrés dans un processus d'amélioration continue.\n\nExigences (recommandées) :\n+ Les incidents signalés sont catégorisés (ex. incidents liés au personnel, à la sécurité physique, à la cybersécurité), qualifiés (ex. observation, vulnérabilité, incident de sécurité) et priorisés (ex. faible, modéré, sévère, critique).\n+ Les responsabilités pour la gestion des incidents sont définies et attribuées en fonction des catégories d'incidents.\n+ Une stratégie de signalement aux autorités et de poursuite des infractions liées à la sécurité est mise en place. (C, I, A)\n\nExigences supplémentaires pour des besoins de haute protection :\n+ Des temps de réponse maximums sont définis en fonction de la classe, de la catégorie et de la gravité de l'incident. (C, I, A)\n+ Un processus d'escalade des incidents critiques est mis en place.\n+ Les obligations de signalement réglementaires et contractuelles sont connues et respectées.\n+ Une stratégie de communication en cas d'incident de sécurité est définie.\n+ Des procédures pour répondre aux incidents impliquant des fournisseurs sont établies.\n\nExigences supplémentaires pour les évaluations de groupe simplifiées (SGA) :\n+ Des mécanismes standardisés de signalement et de suivi des incidents sont mis en place."
    15_prefix: "1.6.3"
    15_label: "Gestion des incidents et des crises - Dans quelle mesure l'organisation est-elle préparée à gérer des situations de crise ?"
    15_desc: "Objectif :\nUne situation de crise survient lorsque des événements exceptionnels (ex. catastrophes naturelles, cyberattaques majeures) perturbent gravement les opérations critiques de l'organisation. L'objectif principal est alors de gérer la crise avec le plus d'efficacité possible et de rétablir la situation rapidement. La mise en place de procédures prédéfinies et d'une répartition claire des responsabilités permet de gérer ces situations.\n\nExigences (obligatoires) :\n+ Un plan de gestion de crise est défini pour réagir et récupérer en cas de crise.\n+ Les ressources nécessaires sont disponibles.\n+ Les responsabilités et l'autorité en matière de gestion de crise sont définies, documentées et attribuées.\n+ Les employés responsables sont identifiés et qualifiés pour leur rôle.\n\nExigences (recommandées) :\n+ Des méthodes de détection des situations de crise sont mises en place.\n+ Une procédure d'activation et d'escalade de la gestion de crise est définie.\n+ Les objectifs stratégiques en cas de crise sont définis et connus des parties prenantes.\n+ Une équipe de gestion de crise est désignée et approuvée, avec une structure claire et des compétences définies.\n+ Des politiques et procédures de gestion de crise sont établies, incluant la communication et la prise de décision en situation exceptionnelle.\n+ Le plan de gestion de crise est revu et mis à jour régulièrement.\n\nExigences supplémentaires pour des besoins de haute protection :\n+ Différents scénarios de crise potentiels sont identifiés et analysés.\n+ Les ressources et informations nécessaires à la gestion de crise sont définies.\n+ Une stratégie de communication en cas de crise est mise en place.\n+ L'efficacité du plan de gestion de crise est évaluée régulièrement.\n+ Des tests et exercices de simulation de crise sont réalisés.\n\nExigences supplémentaires pour des besoins de très haute protection :\n+ Des simulations de crise impliquant toutes les parties prenantes sont menées régulièrement."
  2:
    title: "Ressources humaines"
    1_prefix: "2.1.1"
    1_label: "Protection des prototypes - Dans quelle mesure un concept de sécurité décrivant les exigences minimales en matière de sécurité physique et environnementale pour la protection des prototypes est-il disponible ?"
    1_desc: "Objectif :\nUn concept de sécurité doit être en place pour garantir un niveau de protection adéquat des prototypes, en tenant compte des exigences minimales en matière de sécurité physique et environnementale.\n\nExigences (obligatoires) :\n+ Un concept de sécurité couvrant la protection physique et environnementale des prototypes est défini et documenté.\n+ Les exigences minimales de sécurité physique et environnementale sont identifiées et mises en œuvre.\n+ La mise en œuvre du concept de sécurité est vérifiée régulièrement."
    2_prefix: "2.1.2"
    2_label: "Protection des prototypes - Dans quelle mesure une sécurité périmétrique est-elle en place pour empêcher tout accès non autorisé aux sites protégés ?"
    2_desc: "Objectif :\nIl est essentiel d'empêcher l'accès non autorisé aux sites protégés où sont stockés et manipulés les prototypes. Une sécurité périmétrique robuste est requise.\n\nExigences (obligatoires) :\n+ Des mesures de sécurité périmétrique (ex. clôtures, surveillance vidéo, systèmes de détection d'intrusion) sont en place et opérationnelles.\n+ L'accès aux sites protégés est restreint aux personnes autorisées uniquement.\n+ Des contrôles d'accès physiques sont mis en place et régulièrement évalués."
    3_prefix: "2.1.3"
    3_label: "Protection des prototypes - Dans quelle mesure l’enveloppe extérieure des bâtiments protégés est-elle conçue pour empêcher le retrait ou l'ouverture des composants extérieurs à l'aide d'outils standards ?"
    3_desc: "Objectif :\nL'enveloppe extérieure des bâtiments protégés doit être conçue de manière à empêcher toute tentative d'effraction à l'aide d'outils conventionnels.\n\nExigences (obligatoires) :\n+ Les murs, portes et fenêtres des bâtiments protégés sont conçus pour résister aux tentatives d'ouverture avec des outils standards.\n+ Les points d'accès potentiels sont identifiés et sécurisés.\n+ Des inspections régulières de l'intégrité de l'enveloppe extérieure sont effectuées."
    4_prefix: "2.1.4"
    4_label: "Protection des prototypes - Dans quelle mesure la protection contre l'observation et la visibilité est-elle assurée dans les zones de sécurité définies ?"
    4_desc: "Objectif :\nTravailler en dehors des zones de sécurité spécifiquement définies (télétravail) crée des risques nécessitant des mesures de protection correspondantes.\n\nExigences (obligatoires) :\n+ Les exigences pour le télétravail sont déterminées et mises en œuvre. Les aspects suivants sont pris en compte :\n\t - Gestion sécurisée et accès aux informations (sous forme électronique et papier), en tenant compte des besoins de protection et des exigences contractuelles applicables aux environnements privés (ex. bureau à domicile) et publics (ex. lors de déplacements).\n\t - Comportement en environnement privé.\n\t - Comportement en environnement public.\n\t - Mesures de protection contre le vol (ex. en milieu public).\n+ L'accès au réseau de l'organisation se fait via une connexion sécurisée (ex. VPN) et une authentification forte.\n\nExigences (recommandées) :\n+ Les aspects suivants sont pris en compte :\n\t - Mesures lors des déplacements (ex. inspection par les autorités).\n\t - Mesures pour les voyages dans des pays à haut risque sécuritaire.\n+ Sensibilisation des employés.\n\nExigences supplémentaires pour des besoins de haute protection :\n+ Des mesures de protection contre l'espionnage et l'observation visuelle sont mises en œuvre. (C)"
  3:
    title: "Sécurité physique"
    1_prefix: "3.1.1"
    1_label: "Gestion des accès - Dans quelle mesure la gestion des accès physiques aux zones protégées est-elle assurée ?"
    1_desc: "Objectif :\nL'accès physique aux zones protégées doit être restreint aux personnes autorisées uniquement, afin de garantir la sécurité des actifs et des informations sensibles.\n\nExigences (obligatoires) :\n+ Des contrôles d'accès physiques sont mis en place et appliqués.\n+ L'accès aux zones protégées est consigné et surveillé.\n+ Les autorisations d'accès sont régulièrement revues et mises à jour.\n\nExigences (recommandées) :\n+ Des mesures supplémentaires (ex. surveillance vidéo, gardes de sécurité) sont mises en œuvre en fonction du niveau de risque.\n+ Des audits réguliers des accès physiques sont réalisés."

    2_prefix: "3.1.2"
    2_label: "Gestion des accès - Dans quelle mesure la gestion des accès logiques aux systèmes et aux applications est-elle sécurisée ?"
    2_desc: "Objectif :\nL'accès aux systèmes et aux applications doit être sécurisé pour protéger les données et les actifs informationnels contre tout accès non autorisé.\n\nExigences (obligatoires) :\n+ Une politique de gestion des accès est définie et appliquée.\n+ Les droits d'accès sont accordés selon le principe du moindre privilège.\n+ Une authentification forte est requise pour les accès sensibles.\n\nExigences (recommandées) :\n+ Une revue périodique des droits d'accès est effectuée.\n+ Des mécanismes de surveillance des accès sont mis en place pour détecter les tentatives non autorisées."

    3_prefix: "3.1.3"
    3_label: "Gestion des accès - Dans quelle mesure un processus de gestion des identités est-il en place ?"
    3_desc: "Objectif :\nUn processus de gestion des identités est essentiel pour garantir que seules les personnes autorisées ont accès aux ressources de l'organisation.\n\nExigences (obligatoires) :\n+ Un processus d'attribution et de révocation des identités est défini et appliqué.\n+ Une vérification régulière des identités et des autorisations est effectuée.\n+ Les identifiants et les informations d'authentification sont protégés contre toute utilisation abusive.\n\nExigences (recommandées) :\n+ Une solution centralisée de gestion des identités est mise en œuvre.\n+ Des mécanismes d'authentification multifactorielle sont utilisés pour les accès critiques."
  4:
    title: "Gestion des identités et des accès"
    1_prefix: "4.1.1"
    1_label: "Gestion des accès - Dans quelle mesure la gestion des moyens d'identification est-elle sécurisée ?"
    1_desc: "Objectif :\nPour vérifier l'autorisation d'accès physique et électronique, des moyens d'identification tels que des clés, des badges visuels, d'autres dispositifs d'accès physique ainsi que des jetons cryptographiques sont souvent utilisés. Ces moyens ne sont fiables que si leur utilisation est gérée de manière adéquate.\n\nExigences (obligatoires) :\n+ Les exigences relatives à la gestion des moyens d'identification tout au long de leur cycle de vie sont déterminées et mises en œuvre. Les aspects suivants sont pris en compte :\n\t - Création, remise, restitution et destruction,\n\t - Périodes de validité,\n\t - Traçabilité,\n\t - Gestion des pertes.\n\nExigences (recommandées) :\n+ Les moyens d'identification ne peuvent être produits que dans des conditions contrôlées.\n\nExigences supplémentaires pour des besoins de haute protection :\n+ En fonction de l'évaluation des risques, la procédure d'authentification et le contrôle d'accès sont renforcés par des mesures complémentaires (ex. surveillance continue des accès pour détecter des irrégularités, authentification forte, déconnexion automatique, désactivation en cas d'inactivité ou prévention des attaques par force brute). (C, I, A)"
    2_prefix: "4.1.2"
    2_label: "Gestion des identités - Dans quelle mesure l'accès des utilisateurs aux services et systèmes informatiques est-il sécurisé ?"
    2_desc: "Objectif :\nSeuls les utilisateurs authentifiés de manière sécurisée doivent pouvoir accéder aux systèmes informatiques. Pour cela, l'identité d'un utilisateur doit être déterminée de manière fiable via des procédures appropriées.\n\nExigences (obligatoires) :\n+ Les procédures d'authentification des utilisateurs ont été sélectionnées sur la base d'une évaluation des risques. Les scénarios d'attaque possibles ont été pris en compte (ex. accessibilité directe via Internet).\n+ Des procédures d'authentification conformes à l'état de l'art sont appliquées.\n\nExigences (recommandées) :\n+ Les procédures d'authentification des utilisateurs sont définies et mises en œuvre en fonction des exigences métier et des enjeux de sécurité :\n\t - Les utilisateurs sont authentifiés au minimum par des mots de passe forts conformes aux bonnes pratiques.\n\t - Des procédures avancées sont utilisées pour l'authentification des comptes privilégiés (ex. gestion des accès privilégiés, authentification à deux facteurs).\n\nExigences supplémentaires pour des besoins de haute protection :\n+ En fonction de l'évaluation des risques, la procédure d'authentification et le contrôle d'accès sont renforcés par des mesures complémentaires (ex. surveillance continue des accès pour détecter des irrégularités, authentification forte, déconnexion automatique, désactivation en cas d'inactivité ou prévention des attaques par force brute). (C, I, A)\n\nExigences supplémentaires pour des besoins de très haute protection :\n+ Avant d'accéder aux données nécessitant une protection très élevée, les utilisateurs doivent être authentifiés par une méthode forte (ex. authentification à deux facteurs) conforme à l'état de l'art. (C, I)"
    3_prefix: "4.1.3"
    3_label: "Gestion des identités - Dans quelle mesure les comptes utilisateurs et les informations de connexion sont-ils gérés et appliqués de manière sécurisée ?"
    3_desc: "Objectif :\nL'accès aux informations et aux systèmes informatiques est accordé via des comptes utilisateurs validés et attribués à une personne. Il est essentiel de protéger les informations de connexion et d'assurer la traçabilité des transactions et des accès.\n\nExigences (obligatoires) :\n+ La création, la modification et la suppression des comptes utilisateurs sont effectuées de manière contrôlée.\n+ Des comptes utilisateurs uniques et personnalisés sont utilisés.\n+ L'utilisation de comptes collectifs est réglementée (ex. restreinte aux cas où la traçabilité des actions n'est pas nécessaire).\n+ Les comptes utilisateurs sont désactivés immédiatement après le départ ou la démission de l'utilisateur (ex. à la fin du contrat de travail).\n+ Les comptes utilisateurs sont régulièrement révisés.\n+ Les informations de connexion sont fournies aux utilisateurs de manière sécurisée.\n+ Une politique de gestion des informations de connexion est définie et appliquée. Les aspects suivants sont pris en compte :\n\t - Interdiction de divulguer les informations de connexion à des tiers,\n\t - Interdiction de noter ou de stocker en clair les informations de connexion,\n\t - Changement immédiat des informations de connexion en cas de compromission suspectée,\n\t - Non-utilisation des mêmes informations de connexion pour des usages professionnels et non professionnels,\n\t - Modification des informations de connexion temporaires ou initiales après la première connexion,\n\t - Exigences relatives à la qualité des informations d'authentification (ex. longueur du mot de passe, types de caractères utilisés).\n+ Les informations de connexion (ex. mots de passe) d'un compte utilisateur personnalisé doivent être connues uniquement par l'utilisateur assigné.\n\nExigences (recommandées) :\n+ Un compte utilisateur de base avec des droits d'accès et des fonctionnalités minimales est défini et utilisé.\n+ Les comptes et mots de passe par défaut préconfigurés par les fabricants sont désactivés (ex. blocage ou modification du mot de passe).\n+ Les comptes utilisateurs sont créés ou autorisés par l'entité responsable.\n+ La création des comptes utilisateurs est soumise à un processus d'approbation (principe des quatre yeux).\n+ Les comptes utilisateurs des prestataires de services sont désactivés après l'achèvement de leur mission.\n+ Des délais de désactivation et de suppression des comptes utilisateurs sont définis.\n+ L'utilisation de mots de passe par défaut est techniquement empêchée.\n+ Lorsque l'authentification forte est appliquée, l'utilisation du support (ex. facteur de possession) est sécurisée.\n+ Les comptes utilisateurs sont examinés à intervalles réguliers, y compris ceux des systèmes informatiques des clients.\n+ La connexion interactive pour les comptes de service (comptes techniques) est techniquement empêchée."
    4_prefix: "4.2.1"
    4_label: "Gestion des accès - Dans quelle mesure les droits d'accès sont-ils attribués et gérés ?"
    4_desc: "Objectif :\nLa gestion des droits d'accès garantit que seuls les utilisateurs autorisés ont accès aux informations et aux services informatiques. Pour cela, les droits d'accès sont attribués aux comptes utilisateurs.\n\nExigences (obligatoires) :\n+ Les exigences relatives à la gestion des droits d'accès (autorisations) sont déterminées et mises en œuvre. Les aspects suivants sont pris en compte :\n\t - Procédure de demande, vérification et approbation,\n\t - Application du principe du moindre privilège (« need-to-know »),\n\t - Révocation des droits d'accès lorsqu'ils ne sont plus nécessaires.\n+ Les droits d'accès attribués aux comptes utilisateurs normaux, privilégiés et techniques sont revus à intervalles réguliers, y compris dans les systèmes informatiques des clients.\n\nExigences (recommandées) :\n+ Des stratégies d'autorisation d'accès aux informations sont élaborées.\n+ Des rôles d'autorisation sont utilisés.\n+ Les droits sont attribués selon le principe du besoin d'utilisation et en fonction du rôle et/ou du domaine de responsabilité.\n+ Les comptes utilisateurs normaux ne disposent pas de droits d'accès privilégiés.\n+ Les droits d'accès d'un compte utilisateur sont adaptés après un changement de poste ou de responsabilités.\n\nExigences supplémentaires pour des besoins de haute protection :\n+ Les droits d'accès sont approuvés par le responsable interne de la sécurité de l'information. (C, I, A)\n\nExigences supplémentaires pour des besoins de très haute protection :\n+ Prévention de l'accès et de la consultation par des personnes non autorisées (utilisateurs privilégiés) : (C)\n\t - Les informations sont stockées sous forme chiffrée au niveau du contenu (ex. chiffrement au niveau des fichiers).\n\t - Lorsque le chiffrement n'est pas possible, des mesures de protection équivalentes sont mises en place.\n+ Les droits d'accès existants sont révisés à intervalles plus courts (ex. trimestriellement). (C)"
  5:
    title: "Sécurité informatique / Cybersécurité"
    1_prefix: "5.1.1"
    1_label: "Cryptographie - Dans quelle mesure l'utilisation des procédures cryptographiques est-elle gérée ?"
    1_desc: "Objectif :\nLors de l'utilisation de procédures cryptographiques, il est important de prendre en compte les risques liés à la disponibilité (perte de matériel de clé), ainsi que les risques dus à des procédures mal appliquées en matière d'intégrité et de confidentialité (algorithmes/protocoles faibles ou clés insuffisamment robustes).\n\nExigences (obligatoires) :\n+ Toutes les procédures cryptographiques utilisées (ex. chiffrement, signature, algorithmes de hachage, protocoles) fournissent le niveau de sécurité requis pour leur domaine d'application, conformément aux normes reconnues de l'industrie,\n\t - dans la mesure où cela est légalement réalisable.\n\nExigences (recommandées) :\n+ Élaboration de règles techniques définissant les exigences de chiffrement afin de protéger les informations selon leur classification.\n+ Un concept d'application de la cryptographie est défini et mis en œuvre. Les aspects suivants sont pris en compte :\n\t - Procédures cryptographiques,\n\t - Robustesse des clés,\n\t - Procédures couvrant l'ensemble du cycle de vie des clés cryptographiques, y compris la génération, le stockage, l'archivage, la récupération, la distribution, la désactivation, le renouvellement et la suppression.\n+ Un processus d'urgence pour la restauration du matériel de clé est établi.\n\nExigences supplémentaires pour des besoins de haute protection :\n+ Les exigences en matière de souveraineté des clés (notamment en cas de traitement externe) sont définies et mises en œuvre. (C, I)."
    2_prefix: "5.1.2"
    2_label: "Cryptographie - Dans quelle mesure l'information est-elle protégée lors du transfert ?"
    2_desc: "Objectif :\nLors d'un transfert via des réseaux publics ou privés, les informations peuvent, dans certaines circonstances, être lues ou manipulées par des tiers non autorisés. Il est donc essentiel de définir et de mettre en œuvre des exigences adaptées aux besoins de protection des informations en appliquant des mesures appropriées lors de leur transfert.\n\nExigences (obligatoires) :\n+ Les services réseau utilisés pour le transfert des informations sont identifiés et documentés.\n+ Des politiques et procédures conformes aux exigences de classification des informations pour l'utilisation des services réseau sont définies et mises en œuvre.\n+ Des mesures de protection contre les accès non autorisés aux contenus transférés sont mises en place.\n\nExigences (recommandées) :\n+ Des mesures garantissant l'adressage correct et le bon transfert des informations sont mises en œuvre.\n+ Les échanges de données électroniques sont effectués en utilisant un chiffrement de contenu ou de transport selon la classification concernée.\n+ Les connexions d'accès à distance sont vérifiées afin de garantir des fonctionnalités de sécurité adéquates (ex. chiffrement, gestion des accès et des déconnexions).\n\nExigences supplémentaires pour des besoins de haute protection :\n+ Les informations sont transportées ou transférées sous forme chiffrée : (C)\n - Lorsque le chiffrement n'est pas possible, des mesures de protection équivalentes doivent être mises en place.\n\nExigences supplémentaires pour des besoins de très haute protection :\n+ Les informations sont transportées ou transférées sous forme de contenu chiffré. (C)"
    3_prefix: "5.2.1"
    3_label: "Sécurité des opérations - Dans quelle mesure les changements sont-ils gérés ?"
    3_desc: "Objectif :\nL'objectif est de garantir que les aspects de la sécurité de l'information sont pris en compte lors de tout changement au sein de l'organisation, des processus métier et des systèmes informatiques (gestion du changement) afin d'éviter qu'ils ne provoquent une réduction incontrôlée du niveau de sécurité de l'information.\n\nExigences (obligatoires) :\n+ Les exigences en matière de sécurité de l'information pour les changements au sein de l'organisation, des processus métier et des systèmes informatiques sont déterminées et appliquées.\n\nExigences (recommandées) :\n+ Une procédure formelle d'approbation est établie.\n+ Les changements sont vérifiés et évalués en fonction de leur impact potentiel sur la sécurité de l'information.\n+ Les changements affectant la sécurité de l'information sont soumis à une planification et à des tests.\n+ Des procédures de repli en cas d'incident sont prises en compte.\n\nExigences supplémentaires pour des besoins de haute protection :\n+ La conformité aux exigences de sécurité de l'information est vérifiée pendant et après l'application des changements. (C, I, A)"
    4_prefix: "5.2.2"
    4_label: "Sécurité des opérations - Dans quelle mesure les environnements de développement et de test sont-ils séparés des environnements opérationnels ?"
    4_desc: "Objectif :\nL'objectif de la séparation des environnements de développement, de test et d'exploitation est de garantir la disponibilité, la confidentialité et l'intégrité des données en production.\n\nExigences (obligatoires) :\n+ Les systèmes informatiques ont fait l'objet d'une évaluation des risques afin de déterminer la nécessité de leur séparation en systèmes de développement, de test et d'exploitation.\n+ Une segmentation est mise en place sur la base des résultats de l'analyse des risques.\n\nExigences (recommandées) :\n+ Les exigences pour les environnements de développement et de test sont définies et mises en œuvre. Les aspects suivants sont pris en compte :\n\t - Séparation des systèmes de développement, de test et d'exploitation,\n\t - Absence d'outils de développement et d'administration système sur les systèmes opérationnels (sauf ceux requis pour l'exploitation),\n\t - Utilisation de profils d'utilisateurs distincts pour les systèmes de développement, de test et d'exploitation."
    5_prefix: "5.2.3"
    5_label: "Sécurité des opérations - Dans quelle mesure les systèmes informatiques sont-ils protégés contre les logiciels malveillants ?"
    5_desc: "Objectif :\nL'objectif est d'assurer la protection des systèmes informatiques contre les logiciels malveillants par des mesures techniques et organisationnelles adaptées.\n\nExigences (obligatoires) :\n+ Les exigences de protection contre les logiciels malveillants sont définies.\n+ Des mesures techniques et organisationnelles pour se protéger contre les logiciels malveillants sont mises en place et appliquées.\n\nExigences (recommandées) :\n+ Les services réseau inutiles sont désactivés.\n+ L'accès aux services réseau est restreint aux accès nécessaires par des mesures de protection adaptées (voir exemples).\n+ Un logiciel de protection contre les logiciels malveillants est installé et mis à jour automatiquement à intervalles réguliers (ex. antivirus).\n+ Les fichiers et logiciels reçus sont automatiquement analysés pour détecter les logiciels malveillants avant leur exécution (analyse à l'accès).\n+ L'ensemble du contenu des données de tous les systèmes est régulièrement analysé pour détecter les logiciels malveillants.\n+ Les données transférées via des passerelles centrales (ex. e-mails, internet, réseaux tiers) sont automatiquement analysées par un logiciel de protection :\n\t - Les connexions chiffrées sont prises en compte.\n+ Des mesures sont définies et mises en œuvre pour empêcher la désactivation ou la modification du logiciel de protection par les utilisateurs.\n+ Des mesures de sensibilisation du personnel adaptées aux cas spécifiques sont mises en place.\n+ Pour les systèmes informatiques fonctionnant sans logiciel de protection contre les logiciels malveillants, des mesures alternatives (ex. résilience spécifique, services limités, absence d'utilisateurs actifs, isolation réseau) sont appliquées."
    6_prefix: "5.2.4"
    6_label: "Sécurité des opérations - Dans quelle mesure les journaux d'événements sont-ils enregistrés et analysés ?"
    6_desc: "Objectif :\nLes journaux d'événements permettent d'assurer la traçabilité des événements en cas d'incident de sécurité. Cela nécessite l'enregistrement et la conservation des événements nécessaires à la détermination des causes. De plus, la journalisation et l'analyse des activités doivent être conformes aux réglementations en vigueur (ex. protection des données, réglementation du travail) pour identifier quel compte utilisateur a effectué des modifications sur les systèmes informatiques.\n\nExigences (obligatoires) :\n+ Les exigences en matière de sécurité de l'information concernant la gestion des journaux d'événements sont définies et mises en œuvre.\n+ Les exigences en matière de sécurité relatives à la journalisation des activités des administrateurs système et des utilisateurs sont définies et appliquées.\n+ Les systèmes informatiques utilisés sont évalués pour déterminer la nécessité de la journalisation.\n+ Lors de l'utilisation de services informatiques externes, des informations sur les options de surveillance sont obtenues et prises en compte dans l'évaluation.\n+ Les journaux d'événements sont régulièrement vérifiés pour détecter les violations des règles et les problèmes notables, en conformité avec les dispositions légales et organisationnelles autorisées.\n\nExigences (recommandées) :\n+ Une procédure d'escalade des événements pertinents vers l'entité responsable (ex. signalement des incidents de sécurité, protection des données, sécurité de l'entreprise, sécurité informatique) est définie et mise en place.\n+ Les journaux d'événements (contenus et métadonnées) sont protégés contre toute altération (ex. via un environnement dédié).\n+ Une surveillance et un enregistrement adéquats de toute activité sur le réseau ayant un impact sur la sécurité de l'information sont établis.\n\nExigences supplémentaires pour des besoins de haute protection :\n+ Les exigences en matière de sécurité de l'information concernant la gestion des journaux d'événements, y compris les exigences contractuelles, sont définies et mises en œuvre. (C, I, A)\n+ Les accès réalisés lors de la connexion et de la déconnexion de réseaux externes (ex. maintenance à distance) sont journalisés. (C, I, A)\n\nExigences supplémentaires pour des besoins de très haute protection :\n+ La journalisation de tout accès aux données nécessitant une protection très élevée est mise en place dans la mesure du techniquement faisable et du légalement autorisé. (C, I)"
    7_prefix: "5.2.5"
    7_label: "Sécurité des opérations - Dans quelle mesure les vulnérabilités sont-elles identifiées et traitées ?"
    7_desc: "Objectif :\nLes vulnérabilités augmentent le risque que les systèmes informatiques ne puissent pas répondre aux exigences de confidentialité, de disponibilité et d'intégrité. L'exploitation des vulnérabilités est l'un des moyens possibles pour les attaquants d'accéder aux systèmes informatiques ou de menacer leur stabilité opérationnelle.\n\nExigences (obligatoires) :\n+ Les informations sur les vulnérabilités techniques des systèmes informatiques utilisés sont collectées (ex. informations du fabricant, audits système, base de données CVS) et évaluées (ex. Common Vulnerability Scoring System - CVSS).\n+ Les systèmes informatiques et logiciels potentiellement affectés sont identifiés, évalués et les vulnérabilités sont corrigées.\n\nExigences (recommandées) :\n+ Une gestion adéquate des correctifs est définie et mise en œuvre (ex. test et installation des correctifs).\n+ Des mesures de réduction des risques sont mises en place si nécessaire.\n+ L'installation réussie des correctifs est vérifiée de manière appropriée."
    8_prefix: "5.2.6"
    8_label: "Sécurité des opérations - Dans quelle mesure les systèmes et services informatiques sont-ils contrôlés techniquement (audit des systèmes et services) ?"
    8_desc: "Objectif :\nL'objectif des contrôles techniques est de détecter les états pouvant compromettre la disponibilité, la confidentialité ou l'intégrité des systèmes et services informatiques.\n\nExigences (obligatoires) :\n+ Les exigences d'audit des systèmes ou services informatiques sont déterminées.\n+ Le périmètre de l'audit des systèmes est défini en temps opportun.\n+ Les audits des systèmes ou services sont coordonnés avec l'exploitant et les utilisateurs des systèmes ou services informatiques.\n+ Les résultats des audits des systèmes ou services sont stockés de manière traçable et communiqués à la direction concernée.\n+ Des mesures sont mises en œuvre sur la base des résultats.\n\nExigences (recommandées) :\n+ Les audits des systèmes et services sont planifiés en tenant compte des risques de sécurité qu'ils pourraient engendrer (ex. perturbations).\n+ Des audits réguliers des systèmes ou services sont réalisés :\n\t - Effectués par du personnel qualifié.\n\t - Utilisation d'outils adaptés (ex. scanners de vulnérabilités) pour les audits des systèmes et services (si applicable).\n\t - Réalisés depuis Internet et le réseau interne.\n+ Un rapport est préparé dans un délai raisonnable après l'achèvement de l'audit.\n\nExigences supplémentaires pour des besoins de haute protection :\n+ Pour les systèmes ou services informatiques critiques, des exigences supplémentaires en matière d'audit ont été identifiées et sont appliquées (ex. tests spécifiques aux services, outils spécialisés, tests d'intrusion humains, intervalles basés sur les risques) (A).\n\nExigences supplémentaires pour des besoins de très haute protection :\n+ Les systèmes et services informatiques sont régulièrement analysés pour détecter les vulnérabilités. (A)\n\t - Des mesures de protection adaptées doivent être mises en place pour les systèmes et services qui ne peuvent pas être analysés."
    9_prefix: "5.2.7"
    9_label: "Sécurité des opérations - Dans quelle mesure le réseau de l'organisation est-il géré ?"
    9_desc: "Objectif :\nLes systèmes informatiques connectés à un réseau sont exposés à différents risques ou ont des besoins de protection variés. Afin de détecter ou d'empêcher les échanges de données ou les accès involontaires entre ces systèmes, ils sont segmentés en unités appropriées et l'accès est contrôlé et surveillé à l'aide de technologies de sécurité.\n\nExigences (obligatoires) :\n+ Les exigences pour la gestion et le contrôle des réseaux sont définies et mises en œuvre.\n+ Les exigences relatives à la segmentation des réseaux sont définies et mises en œuvre.\n\nExigences (recommandées) :\n+ Les procédures de gestion et de contrôle des réseaux sont définies.\n+ Pour une segmentation du réseau basée sur les risques, les aspects suivants sont pris en compte :\n\t - Limitations pour la connexion des systèmes informatiques au réseau,\n\t - Utilisation de technologies de sécurité,\n\t - Considérations de performance, de confiance, de disponibilité, de sécurité et de sûreté,\n\t - Limitation des impacts en cas de compromission des systèmes informatiques,\n\t - Détection des attaques potentielles et des mouvements latéraux des attaquants,\n\t - Séparation des réseaux en fonction de leur finalité opérationnelle (ex. réseaux de test et de développement, réseau bureautique, réseaux industriels),\n\t - Risques accrus liés aux services réseau accessibles via Internet,\n\t - Options de séparation spécifiques aux technologies lors de l'utilisation de services informatiques externes,\n\t - Séparation adéquate entre les réseaux internes et les réseaux des clients en tenant compte des exigences des clients,\n\t - Détection et prévention des fuites/pertes de données.\n\nExigences supplémentaires pour des besoins de haute protection :\n+ Des exigences renforcées pour la gestion et le contrôle des réseaux sont définies et mises en œuvre. Les aspects suivants sont pris en compte : (C, I, A)\n\t - Authentification des systèmes informatiques sur le réseau,\n\t - Restriction de l'accès aux interfaces de gestion des systèmes informatiques,\n\t - Risques spécifiques (ex. accès sans fil et accès à distance)."
    10_prefix: "5.2.8"
    10_label: "Sécurité des opérations - Dans quelle mesure une planification de continuité pour les services informatiques est-elle en place ?"
    10_desc: "Objectif :\nLa planification de la continuité (y compris la gestion des urgences) des services informatiques fait partie d'un programme global visant à assurer la continuité des opérations pour les fonctions critiques de l'organisation et de ses activités. Les actions couvertes par les plans de continuité incluent la dégradation contrôlée des systèmes, l'arrêt des systèmes, le basculement vers un mode manuel, des flux d'information alternatifs, ainsi que des modes de fonctionnement prévus en cas d'incident de sécurité.\n\nExigences (obligatoires) :\n+ Les services informatiques critiques sont identifiés, et l'impact sur l'activité est pris en compte.\n+ Les exigences et responsabilités en matière de continuité et de reprise de ces services informatiques sont connues des parties prenantes concernées et mises en œuvre.\n\nExigences (recommandées) :\n+ Les systèmes informatiques critiques sont identifiés :\n\t - Les systèmes concernés sont classifiés afin d'assurer un niveau de protection approprié.\n\t - Des mesures de sécurité adéquates et adaptées sont mises en place.\n+ La planification de la continuité inclut au minimum les scénarios suivants affectant les systèmes informatiques critiques :\n\t - Attaques par déni de service distribué (DDoS).\n\t - Attaques réussies par rançongiciel et autres actes de sabotage.\n\t - Pannes système.\n\t - Catastrophes naturelles.\n+ La planification de la continuité prend en compte les cas suivants :\n\t - Stratégies de communication alternatives en cas d'indisponibilité des moyens de communication principaux.\n\t - Stratégies de stockage alternatives en cas d'indisponibilité des moyens de stockage principaux.\n\t - Alimentation et réseau alternatifs.\n+ La planification de la continuité est régulièrement révisée et mise à jour.\n\nExigences supplémentaires pour des besoins de haute protection :\n+ La planification de la continuité comprend des délais prédéfinis (Recovery Time Objective - RTO) pour la reprise des opérations en adéquation avec les exigences. (A)\n+ Des accords de niveau de service (SLA) appropriés avec les prestataires de services externes sont établis conformément à la planification de la continuité. (A)\n+ Les plans de continuité incluent la coordination des communications contractuelles avec les partenaires commerciaux. (A)\n+ La planification de la continuité est régulièrement testée, y compris un rétablissement complet et la reconstitution du système à un état connu, en conformité avec les délais définis. (A)\n+ Une stratégie de sauvegarde et de récupération des services informatiques critiques et des informations est définie et mise en œuvre. Les aspects suivants sont pris en compte :\n\t - Les sauvegardes sont protégées contre toute modification ou suppression non autorisée par des logiciels malveillants. (I, A)\n\t - Les sauvegardes sont protégées contre tout accès non autorisé par des logiciels malveillants ou des opérateurs. (C, I)\n\nExigences supplémentaires pour des besoins de très haute protection :\n+ La planification de la continuité est coordonnée avec les plans de continuité des prestataires de services externes concernés. (A)\n+ La continuité des fonctions critiques de l'organisation et des missions essentielles est assurée avec une perte opérationnelle minimale, voire inexistante. La planification de cette continuité prend en compte les aspects suivants :\n\t - Stratégies opérationnelles alternatives et systèmes de secours séparés permettant de maintenir ou de reprendre l'activité autant que possible en cas d'indisponibilité des services informatiques critiques. (A)\n\t - Sites de stockage et de sauvegarde alternatifs offrant des contrôles équivalents à ceux du site principal. (C, I, A)\n+ La planification de la continuité est régulièrement testée. Les tests et les enseignements tirés sont documentés. (I, A)"
    11_prefix: "5.2.9"
    11_label: "Sécurité des opérations - Dans quelle mesure la sauvegarde et la récupération des données et des services informatiques sont-elles assurées ?"
    11_desc: "Objectif :\nLes données et les services informatiques peuvent devenir indisponibles en raison d'événements tels que des pannes matérielles, des défauts logiciels, des erreurs humaines ou des attaques. La sauvegarde et la récupération permettent aux organisations de se remettre de telles situations et de limiter les dommages potentiels à un niveau acceptable.\n\nExigences (obligatoires) :\n+ Des concepts de sauvegarde existent pour les systèmes informatiques concernés. Les aspects suivants sont pris en compte :\n - Des mesures de protection appropriées pour garantir la confidentialité, l'intégrité et la disponibilité des sauvegardes de données.\n+ Des concepts de récupération existent pour les services informatiques concernés.\n\nExigences (recommandées) :\n+ Un concept de sauvegarde et de récupération est défini pour chaque service informatique concerné.\n\t - Les dépendances entre les services informatiques et l'ordre de récupération sont pris en compte.\n\nExigences supplémentaires pour des besoins de haute protection :\n+ Les concepts de sauvegarde et de récupération sont examinés méthodiquement à intervalles réguliers. (A)\n+ La capacité générale de restauration est prise en compte et testée (ex. tests d'échantillons, systèmes de test). (I, A)\n+ Les concepts de sauvegarde et de récupération prennent en compte les aspects suivants : (A)\n\t - Recovery Point Objective (RPO).\n\t - Recovery Time Objective (RTO).\n\t - Ressources requises pour la récupération (en tenant compte de la capacité et des performances, y compris le personnel et le matériel).\n\t - Évitement des scénarios de surcharge lors de la récupération.\n\t - Redondance spatiale appropriée (ex. salle séparée, compartiment coupe-feu séparé, centre de données distinct, site distant).\n\nExigences supplémentaires pour des besoins de très haute protection :\n+ Des sauvegardes (supplémentaires) sont effectuées via des procédures hors ligne, des sauvegardes immuables ou l'utilisation de technologies IAM isolées. (I, A)\n+ Les procédures de restauration sont testées techniquement de manière méthodique à intervalles réguliers. (I, A)\n+ La redondance géographique est prise en compte dans les concepts de sauvegarde et de récupération des données. (A)"
    12_prefix: "5.3.1"
    12_label: "Acquisition des systèmes, gestion des exigences et développement - Dans quelle mesure la sécurité de l'information est-elle prise en compte dans les nouveaux systèmes informatiques ou les systèmes en cours de développement ?"
    12_desc: "Objectif :\nLa sécurité de l'information fait partie intégrante du cycle de vie complet des systèmes informatiques. Cela inclut en particulier la prise en compte des exigences de sécurité de l'information lors du développement ou de l'acquisition de systèmes informatiques.\n\nExigences (obligatoires) :\n+ Les exigences de sécurité de l'information associées à la conception et au développement des systèmes informatiques sont déterminées et prises en compte.\n+ Les exigences de sécurité de l'information associées à l'acquisition ou à l'extension des systèmes et composants informatiques sont déterminées et prises en compte.\n+ Les exigences de sécurité de l'information associées aux modifications des systèmes informatiques développés sont prises en compte.\n+ Des tests d'approbation des systèmes sont réalisés en tenant compte des exigences de sécurité de l'information.\n\nExigences (recommandées) :\n+ Des spécifications des exigences sont établies. Les aspects suivants sont pris en compte :\n\t - Les exigences de sécurité de l'information.\n\t - Les recommandations des fournisseurs et les bonnes pratiques pour une configuration et une mise en œuvre sécurisées.\n\t - Les bonnes pratiques et les lignes directrices en matière de sécurité.\n\t - La tolérance aux pannes (conception visant à ramener le système à un état sûr en cas de panne ou de dysfonctionnement).\n+ Les spécifications des exigences sont revues par rapport aux exigences de sécurité de l'information.\n+ Le système informatique est vérifié quant à sa conformité aux spécifications avant son utilisation en production.\n+ L'utilisation de données de production à des fins de test est évitée autant que possible (si applicable, anonymisation ou pseudonymisation) :\n\t - Lorsque des données de production sont utilisées à des fins de test, il est garanti que le système de test dispose de mesures de protection comparables à celles du système opérationnel.\n\t - Les exigences relatives au cycle de vie des données de test (ex. suppression, durée de conservation maximale sur le système informatique).\n\t - Des spécifications spécifiques aux cas d'utilisation pour la génération des données de test sont définies.\n\nExigences supplémentaires pour des besoins de très haute protection :\n+ La sécurité des logiciels conçus sur mesure ou des logiciels fortement personnalisés est testée (ex. tests d'intrusion) (C, I, A)\n\t - lors de la mise en service,\n\t - en cas de modifications significatives,\n\t - ou à intervalles réguliers."
    13_prefix: "5.3.2"
    13_label: "Acquisition des systèmes, gestion des exigences et développement - Dans quelle mesure les exigences relatives aux services réseau sont-elles définies ?"
    13_desc: "Objectif :\nLes services réseau ont des exigences variées en matière de sécurité de l'information, de qualité du transfert de données et de gestion. Il est essentiel de connaître ces critères ainsi que le champ d'application des différents services réseau.\n\nExigences (obligatoires) :\n+ Les exigences en matière de sécurité de l'information pour les services réseau sont déterminées et mises en œuvre.\n\nExigences (recommandées) :\n+ Une procédure de sécurisation et d'utilisation des services réseau est définie et mise en place.\n+ Les exigences sont convenues sous forme d'accords de niveau de service (SLA).\n+ Des solutions de redondance adéquates sont mises en œuvre.\n\nExigences supplémentaires pour des besoins de haute protection :\n+ Des procédures de surveillance de la qualité du trafic réseau (ex. analyses des flux, mesures de disponibilité) sont définies et appliquées. (A)"
    14_prefix: "5.3.3"
    14_label: "Acquisition des systèmes, gestion des exigences et développement - Dans quelle mesure le retour et la suppression sécurisée des actifs informationnels des services informatiques externes sont-ils réglementés ?"
    14_desc: "Objectif :\nAfin de garantir le contrôle des actifs informationnels en tant que propriétaire de l'information, il est nécessaire que ces actifs puissent être supprimés en toute sécurité ou restitués, si nécessaire, lors de la résiliation du service informatique.\n\nExigences (obligatoires) :\n+ Une procédure pour le retour et la suppression sécurisée des actifs informationnels de chaque service informatique externe est définie et mise en œuvre.\n\nExigences (recommandées) :\n+ Une description du processus de résiliation est fournie, adaptée à toute modification et réglementée contractuellement."
    15_prefix: "5.3.4"
    15_label: "Acquisition des systèmes, gestion des exigences et développement - Dans quelle mesure l'information est-elle protégée dans les services informatiques externes partagés ?"
    15_desc: "Objectif :\nUne séparation claire entre les différents clients doit être garantie afin de toujours protéger les informations propres à l'organisation dans les services informatiques externes et d'empêcher leur accès par d'autres organisations (clients).\n\nExigences (obligatoires) :\n+ Une séparation efficace (ex. segmentation des clients) empêche l'accès aux informations de l'organisation par des utilisateurs non autorisés d'autres organisations.\n\nExigences (recommandées) :\n+ Le concept de séparation du prestataire est documenté et adapté à toute modification. Les aspects suivants sont pris en compte :\n\t - Séparation des données, des fonctions, des logiciels spécifiques aux clients, du système d'exploitation, du système de stockage et du réseau.\n\t - Évaluation des risques liés à l'exploitation de logiciels externes dans un environnement partagé."
  6:
    title: "Relations avec les fournisseurs"
    1_prefix: "6.1.1"
    1_label: "Dans quelle mesure la sécurité de l'information est-elle assurée chez les sous-traitants et partenaires de coopération ?"
    1_desc: "Objectif :\nUn niveau approprié de sécurité de l'information doit être maintenu lors de la collaboration avec les partenaires de coopération et les sous-traitants.\n\nExigences (obligatoires) :\n+ Les sous-traitants et partenaires de coopération sont soumis à une évaluation des risques en matière de sécurité de l'information.\n+ Un niveau approprié de sécurité de l'information est garanti par des accords contractuels avec les sous-traitants et partenaires de coopération.\n+ Le cas échéant, les accords contractuels conclus avec les clients sont transmis aux sous-traitants et partenaires de coopération.\n+ Le respect des accords contractuels est vérifié.\n\nExigences (recommandées) :\n+ Les sous-traitants et partenaires de coopération sont contractuellement tenus de transmettre les exigences relatives à un niveau approprié de sécurité de l'information à leurs propres sous-traitants.\n+ Les rapports de service et documents fournis par les sous-traitants et partenaires de coopération sont examinés.\n\nExigences supplémentaires pour des besoins de haute protection :\n+ Une preuve est fournie démontrant que le niveau de sécurité de l'information du fournisseur est adapté aux besoins de protection des informations (ex. certification, attestation, audit interne). (C, I, A)"
    2_prefix: "6.1.2"
    6_2_label: "Dans quelle mesure la non-divulgation des informations échangées est-elle contractuellement convenue ?"
    2_desc: "Objectif :\nLes accords de non-divulgation assurent une protection juridique des informations de l'organisation, en particulier lorsque ces informations sont échangées en dehors des limites de l'organisation.\n\nExigences (obligatoires) :\n+ Les exigences en matière de non-divulgation sont déterminées et mises en œuvre.\n+ Les exigences et procédures relatives à l'application des accords de non-divulgation sont connues de toutes les personnes transmettant des informations nécessitant une protection.\n+ Des accords de non-divulgation valides sont conclus avant toute transmission d'informations sensibles.\n+ Les exigences et procédures relatives à l'utilisation des accords de non-divulgation et à la gestion des informations nécessitant une protection sont régulièrement revues.\n\nExigences (recommandées) :\n+ Des modèles d'accords de non-divulgation sont disponibles et vérifiés quant à leur applicabilité juridique.\n+ Les accords de non-divulgation incluent les informations suivantes :\n\t - Les personnes/organisations impliquées,\n\t - Le type d'informations couvertes par l'accord,\n\t - L'objet de l'accord,\n\t - La durée de validité de l'accord,\n\t - Les responsabilités de la partie obligée.\n+ Les accords de non-divulgation comprennent des dispositions relatives au traitement des informations sensibles au-delà de la relation contractuelle.\n+ Des moyens de démontrer le respect des spécifications (ex. audit par un tiers indépendant ou droits d'audit) sont définis.\n+ Un processus de suivi de la durée de validité des accords de non-divulgation temporaires et de leur renouvellement en temps voulu est défini et mis en œuvre."
  7:
    title: "Conformité"
    1_prefix: "7.1.1"
    1_label: "Dans quelle mesure la conformité aux dispositions réglementaires et contractuelles est-elle assurée ?"
    1_desc: "Objectif :\nLe non-respect des dispositions légales, réglementaires ou contractuelles peut engendrer des risques pour la sécurité de l'information des clients et de l'organisation elle-même. Il est donc essentiel de s'assurer que ces dispositions sont connues et respectées.\n\nExigences (obligatoires) :\n+ Les dispositions légales, réglementaires et contractuelles relatives à la sécurité de l'information (voir exemples) sont identifiées à intervalles réguliers.\n+ Des politiques garantissant le respect de ces dispositions sont définies, mises en œuvre et communiquées aux personnes responsables.\n\nExigences (recommandées) :\n+ L'intégrité des enregistrements est prise en compte conformément aux dispositions légales, réglementaires ou contractuelles ainsi qu'aux exigences métiers."
    2_prefix: "7.1.2"
    2_label: "Dans quelle mesure la protection des données à caractère personnel est-elle prise en compte lors de la mise en œuvre de la sécurité de l'information ?"
    2_desc: "Objectif :\nLa protection des données à caractère personnel est prise en compte dans la mise en œuvre de la sécurité de l'information conformément aux lois et réglementations nationales applicables.\n\nExigences (obligatoires) :\n+ Les exigences légales et contractuelles en matière de sécurité de l'information concernant les procédures et processus de traitement des données à caractère personnel sont déterminées.\n+ Les réglementations relatives au respect des exigences légales et contractuelles pour la protection des données à caractère personnel sont définies et connues des personnes concernées.\n+ Les processus et procédures de protection des données à caractère personnel sont intégrés dans le système de gestion de la sécurité de l'information."
2:
  title: "Évaluation de la sécurité de l'information - Exigences supplémentaires en matière de protection des prototypes"
  1:
    title: "Protection des prototypes - Sécurité physique et environnementale"
    1_prefix: "2.1.1"
    1_label: "Dans quelle mesure un concept de sécurité décrivant les exigences minimales en matière de sécurité physique et environnementale pour la protection des prototypes est-il disponible ?"
    2_prefix: "2.1.2"
    2_label: "Dans quelle mesure une sécurité périmétrique existe-t-elle pour empêcher tout accès non autorisé aux objets protégés ?"
    3_prefix: "2.1.3"
    3_label: "Dans quelle mesure l'enveloppe extérieure des bâtiments protégés est-elle conçue pour empêcher le retrait ou l'ouverture de ses composants à l'aide d'outils standards ?"
    4_prefix: "2.1.4"
    4_label: "Dans quelle mesure la protection contre la vue et l'observation est-elle assurée dans les zones de sécurité définies ?"
    5_prefix: "2.1.5"
    5_label: "Dans quelle mesure la protection contre l'entrée non autorisée est-elle régulée sous forme de contrôle d'accès ?"
    6_prefix: "2.1.6"
    6_label: "Dans quelle mesure les locaux à sécuriser sont-ils surveillés contre les intrusions ?"
    7_prefix: "2.1.7"
    7_label: "Dans quelle mesure une gestion documentée des visiteurs est-elle en place ?"
    8_prefix: "2.1.8"
    8_label: "Dans quelle mesure une séparation des clients sur site est-elle assurée ?"
  2:
    title: "Exigences organisationnelles"
    1_prefix: "2.2.1"
    1_label: "Dans quelle mesure des accords/obligations de non-divulgation existent-ils conformément au droit contractuel en vigueur ?"
    2_prefix: "2.2.2"
    2_label: "Dans quelle mesure les exigences relatives à la sous-traitance sont-elles connues et respectées ?"
    3_prefix: "2.2.3"
    3_label: "Dans quelle mesure les employés et les membres du projet participent-ils de manière évidente aux formations et mesures de sensibilisation concernant la gestion des prototypes ?"
    4_prefix: "2.2.4"
    4_label: "Dans quelle mesure les classifications de sécurité du projet et les mesures de sécurité en résultant sont-elles connues ?"
    5_prefix: "2.2.5"
    5_label: "Dans quelle mesure un processus est-il défini pour accorder l'accès aux zones de sécurité ?"
    6_prefix: "2.2.6"
    6_label: "Dans quelle mesure des réglementations existent-elles pour l'enregistrement d'images et la gestion des supports d'images créés ?"
    7_prefix: "2.2.7"
    7_label: "Dans quelle mesure un processus est-il établi pour le transport et l'utilisation de dispositifs mobiles de vidéo et de photographie dans les zones de sécurité définies ?"
  3:
    title: "Gestion des véhicules, composants et pièces"
    1_prefix: "2.3.1"
    1_label: "Dans quelle mesure les transports de véhicules, composants ou pièces classés comme nécessitant une protection sont-ils organisés conformément aux exigences du client ?"
    2_prefix: "2.3.2"
    2_label: "Dans quelle mesure est-il garanti que les véhicules, composants et pièces classés comme nécessitant une protection sont stationnés/entreposés conformément aux exigences du client ?"
  4:
    title: "Exigences pour les véhicules d'essai"
    1_prefix: "2.4.1"
    1_label: "Dans quelle mesure les réglementations prédéfinies en matière de camouflage sont-elles mises en œuvre par les membres du projet ?"
    2_prefix: "2.4.2"
    2_label: "Dans quelle mesure les mesures de protection des terrains d'essai et de test approuvés sont-elles respectées/mises en œuvre ?"
    3_prefix: "2.4.3"
    3_label: "Dans quelle mesure les mesures de protection des essais et tests approuvés sur la voie publique sont-elles respectées/mises en œuvre ?"
  5:
    title: "Exigences pour les événements et séances de prise de vue"
    1_prefix: "2.5.1"
    1_label: "Dans quelle mesure les exigences de sécurité pour les présentations et événements impliquant des véhicules, composants ou pièces classés comme nécessitant une protection sont-elles connues ?"
    2_prefix: "2.5.2"
    2_label: "Dans quelle mesure les mesures de protection pour les séances de tournage et de prise de vue impliquant des véhicules, composants ou pièces classés comme nécessitant une protection sont-elles connues ?"
3:
  title: "Évaluation de la sécurité de l'information - Exigences supplémentaires en matière de protection des données/vie privée"
  1:
    title: "Protection des données - Politiques de protection des données"
    1_prefix: "3.1.1"
    1_label: "Dans quelle mesure des politiques de protection des données existent-elles ?"
    1_desc: "Objectif :\nL'organisation doit disposer d'au moins une politique de confidentialité. Celle-ci reflète l'importance et la signification de la protection des données et est adaptée à l'organisation. D'autres politiques peuvent être appropriées en fonction de la taille et de la structure de votre organisation.\n\nExigences (obligatoires) :\n+ Une politique est créée, régulièrement mise à jour et approuvée par la direction de l'organisation."
  2:
    title: "Protection des données - Organisation de la protection des données"
    1_prefix: "3.2.1"
    1_label: "Dans quelle mesure les responsabilités en matière de protection des données sont-elles organisées ?"
    1_desc: "Objectif :\nUne protection efficace des données nécessite des responsabilités clairement définies au sein de l'organisation.\n\nExigences (obligatoires) :\n+ Un délégué à la protection des données est désigné si requis par l'Article 37 du RGPD :\n\t - Détermination si la nomination d'un délégué à la protection des données est volontaire ou obligatoire.\n\t - Sinon, désignation d'une fonction ou d'un rôle équivalent en protection des données.\n+ Publication des coordonnées (ex. sur Internet).\n+ Intégration dans la structure organisationnelle.\n+ Exercice des obligations de contrôle définies dans l'Article 39 (1) (b) du RGPD et documentation correspondante.\n+ Documentation de l'état de la protection des données et rapport à la direction de l'organisation.\n+ Mise à disposition de ressources et de capacités suffisantes :\n\t - Détermination si la fonction de protection des données est à plein temps ou à temps partiel.\n\t - Qualification professionnelle adéquate.\n\t - Formation professionnelle régulière.\n\t - Accès à la documentation spécialisée.\n\t - Soutien du délégué à la protection des données par des coordinateurs de protection des données dans les différentes unités organisationnelles (ex. marketing, vente, ressources humaines, logistique, développement, etc.), en fonction de la taille de l'entreprise."
  3:
    title: "Protection des données - Registre des traitements"
    1_prefix: "3.3.1"
    1_label: "Dans quelle mesure les activités de traitement sont-elles identifiées et enregistrées ?"
    1_desc: "Objectif :\nL'entreprise remplit son obligation de responsabilité et de transparence, créant ainsi une vue d'ensemble des traitements de données respectifs.\n\nExigences (obligatoires) :\n+ Si requis par la loi, un registre des activités de traitement tel que défini à l'Article 30 (1) et/ou (2) du RGPD (dans ce dernier cas, uniquement les informations relatives au traitement par un sous-traitant, et non les autres informations sur les traitements internes) existe et est mis à jour.\n\t - Les mesures techniques et organisationnelles requises pour le traitement, conformément au questionnaire de sécurité de l'information, sont mises en œuvre de manière adéquate pour les activités de traitement.\n\t - Une description du processus / séquence de traitement avec des responsabilités définies est disponible."
  4:
    title: "Protection des données - Analyse d'impact relative à la protection des données"
    1_prefix: "3.4.1"
    1_label: "Dans quelle mesure une gestion adéquate des activités de traitement à haut risque est-elle assurée (analyse d'impact relative à la protection des données) ?"
    1_desc: "Objectif :\nLa gestion des traitements à haut risque est sécurisée en coopération avec le prestataire de services, à l'aide de mesures appropriées permettant d'identifier et, si nécessaire, de réduire les risques pour les droits et libertés des personnes concernées.\n\nExigences (obligatoires) :\n+ Les activités de traitement nécessitant une analyse d'impact relative à la protection des données sont identifiées.\n+ Les analyses d'impact relatives à la protection des données sont réalisées.\n\t - Les responsabilités, tâches et possibilités de soutien dans le cadre des analyses d'impact sont définies et connues."
  5:
    title: "Protection des données - Transferts de données"
    1_prefix: "3.5.1"
    1_label: "Dans quelle mesure le transfert des données est-il géré ?"
    1_desc: "Objectif :\nL'entreprise connaît et sécurise les transmissions de données.\n\nExigences (obligatoires) :\n+ Des processus et flux de travail appropriés pour la transmission des données sont mis en œuvre (ex. contrats valides au sens de l'Article 28 du RGPD, instruments de transfert adaptés comme les clauses contractuelles types, analyses d'impact sur les transferts, décisions d'adéquation).\n\t - Garantir le consentement ou le droit d'opposition du responsable du traitement en cas de sous-traitance."
    2_prefix: "3.5.2"
    2_label: "Dans quelle mesure les obligations contractuelles sont-elles transmises et appliquées aux sous-traitants et aux partenaires de coopération ?"
    2_desc: "Objectif :\nL'entreprise est consciente des transferts de données vers les sous-traitants et les sécurise.\n\nExigences (obligatoires) :\n+ Les obligations contractuelles applicables aux clients sont transmises aux sous-traitants et aux partenaires de coopération (sous-traitants ultérieurs).\n+ Le respect des accords contractuels est vérifié.\n\t - Les coordonnées des personnes de contact chez le sous-traitant sont disponibles et mises à jour."
    3_prefix: "3.5.3"
    3_label: "Dans quelle mesure les transferts de données vers des pays tiers sont-ils gérés ?"
    3_desc: "Objectif :\nL'entreprise est consciente des transferts de données vers des pays tiers et les sécurise.\n\nExigences (obligatoires) :\n+ Les transferts vers des pays tiers sont identifiés et systématiquement enregistrés.\n\t - Par exemple, via une documentation correspondante dans le registre des traitements.\n+ Des garanties suffisantes (Chapitre V du RGPD, prise en compte des décisions de la CJUE sur le transfert international des données, analyse d'impact sur le transfert en cas de pertinence, notamment pour le rôle d'exportateur de données) sont mises en place pour les transferts de données.\n+ Lors de transferts de données vers des pays tiers, il est déterminé si le consentement du responsable du traitement doit être obtenu pour chaque transfert."
  6:
    title: "Protection des données - Gestion des demandes et incidents"
    1_prefix: "3.6.1"
    1_label: "Dans quelle mesure les demandes des personnes concernées sont-elles traitées ?"
    1_desc: "Objectif :\nL'objectif est d'assurer le traitement et la satisfaction en temps voulu des demandes des personnes concernées afin de garantir leurs droits prévus par la loi.\n\nExigences (obligatoires) :\n+ Les demandes des personnes concernées sont traitées en temps opportun.\n\t - Des procédures sont mises en place pour aider le responsable du traitement à répondre aux demandes des personnes concernées.\n\t - Les employés sont formés afin qu'ils contactent immédiatement la personne responsable en cas de demande entrante d'une personne concernée et coordonnent la procédure à suivre avec elle."
    2_prefix: "3.6.2"
    2_label: "Dans quelle mesure les incidents de protection des données sont-ils traités ?"
    2_desc: "Objectif :\nLe traitement des incidents de protection des données vise à limiter les dommages potentiels pour les personnes concernées et à prévenir leur récurrence. De plus, la documentation légale requise et, si nécessaire, le signalement rapide à l'autorité de contrôle doivent être assurés.\n\nExigences (obligatoires) :\n+ Les incidents de protection des données (ex. accès non autorisé à des données personnelles) sont traités en temps opportun.\n+ Les exigences de la section 1.6 du questionnaire de sécurité de l'information prennent également en compte les incidents de protection des données, ou alternativement, un plan d'urgence pour leur gestion est en place.\n+ En outre, des procédures sont établies et documentées pour garantir les aspects suivants :\n\t - Notification immédiate à la personne responsable concernée, si son domaine est affecté.\n\t - Documentation des activités de gestion des incidents.\n\t - Formation des employés sur les mesures et processus définis.\n\t - Soutien du responsable du traitement dans la gestion des incidents de protection des données."
  7:
    title: "Protection des données - Ressources humaines"
    1_prefix: "3.7.1"
    1_label: "Dans quelle mesure les employés sont-ils tenus à une obligation de confidentialité ?"
    1_desc: "Objectif :\nLes organisations sont soumises à des lois, réglementations et politiques internes. Pour l'embauche, l'exercice et la fin de l'emploi, il est essentiel que les employés s'engagent à respecter ces directives.\n\nExigences (obligatoires) :\n+ Les employés dont les tâches incluent le traitement de données personnelles sont tenus de respecter la confidentialité (y compris après la fin de la relation d'emploi) et de se conformer aux lois applicables en matière de protection des données.\n\t - Cette obligation est documentée."
    2_prefix: "3.7.2"
    2_label: "Dans quelle mesure les employés sont-ils formés à la protection des données ?"
    2_desc: "Objectif :\nSi les exigences et les risques liés à la protection des données ne sont pas connus des employés, il existe un risque qu'ils adoptent un comportement inapproprié, pouvant ainsi nuire à l'organisation. Il est donc essentiel que la protection des données soit intégrée et appliquée comme une partie naturelle de leur travail.\n\nExigences (obligatoires) :\n+ Les employés sont formés et sensibilisés.\n\t - L'étendue, la fréquence et le contenu de la formation sont définis en fonction des besoins de protection des données.\n\t - Les employés des domaines critiques (ex. administrateurs IT) reçoivent des instructions et une formation spécifiques adaptées à leur travail (ex. formations spécialisées, vidéos courtes, etc.)."
  8:
    title: "Protection des données - Instructions"
    1_prefix: "3.8.1"
    1_label: "Dans quelle mesure les instructions relatives aux relations de traitement sont-elles gérées ?"
    1_desc: "Objectif :\nLa gestion ordonnée et définie des instructions concernant le traitement par le responsable du traitement vise à garantir que les tâches du sous-traitant sont remplies et que ce dernier respecte les obligations prévues et convenues contractuellement (notamment pour identifier un éventuel dépassement du cadre contractuel convenu).\n\nExigences (obligatoires) :\n+ Les instructions du responsable du traitement concernant le traitement des données personnelles sont gérées.\n+ Des procédures et mesures sont en place pour garantir que :\n\t - Les instructions reçues sont documentées.\n\t - Les instructions peuvent être mises en œuvre (ex. procédures de correction, suppression, ...).\n\t - Les données sont séparées par client et par commande ou projet spécifique."
