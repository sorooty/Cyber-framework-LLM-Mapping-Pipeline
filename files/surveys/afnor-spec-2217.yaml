4:
  title: "Exigences de moyens mis à disposition par le SPSTI"
  1_label: "Ressources humaines et compétences"
  1_desc: "Le SPSTI doit s’assurer de l’existence et de la compétence d’une ou plusieurs équipes pluridisciplinaires composées de :\n\t\t▪ professionnels de santé au travail (médecins du travail, collaborateurs médecins, infirmiers en santé au travail) ;\n\t\t▪ intervenants en prévention des risques professionnels : équipe interne et le cas échéant en relation avec d’autres préventeurs extérieurs s’ils ne sont pas en capacité de répondre ;\n\t\t▪ assistants en santé au travail ;\n\t\t▪ cellule de prévention de la désinsertion professionnelle (PDP) : personnels internes, mutualisés entre SPSTI ou externes, en tant que spécialistes (par exemple : assistant social, conseiller dans l’emploi, psychologue du travail)."
  2:
    title: "Ressources matérielles"
    1_prefix: "4.2.1.1"
    1_label: "Moyens informatiques et communication - Moyens informatiques"
    1_desc: "a. Interopérabilité\n Le SPSTI doit s’assurer que les moyens informatiques facilitent l’échange de données avec : \n\t - les entreprises adhérentes : utilisation de logiciels pour l’évaluation des risques/mesures de prévention : privilégier certains outils auprès des employeurs (sans rendre aucun outil obligatoire) ; \n\t - les autres SPSTI : le dossier médical en santé au travail (DMST) doit être conforme aux recommandations de la haute autorité de santé (HAS) et du guide de la commission nationale de l'informatique et des libertés (CNIL) (structure des données, identité nationale de santé (INS) …). Les systèmes d’information doivent utiliser les nomenclatures mises à disposition par l’agence du numérique en santé (ANS) sur le serveur multi terminologie, le cas échéant ; \n\t - les systèmes d’informations existants en santé publique : \n\t\t - conformité avec les référentiels de la politique générale de sécurité des systèmes d’Information de santé (PGSSI-S) et du cadre d’interopérabilité des systèmes d’information de santé (CI-SIS) ; \n\t\t - conformité aux futurs référentiels concernant les échanges de données du dossier médical partagé (DMP), du dossier médical en santé au travail (DMST) et des exigences de l’espace numérique en santé ;\n\nb. Espace personnalisé \nLe SPSTI doit déterminer et mettre en place les moyens informatiques adaptés pour permettre à chaque entreprise adhérente de disposer d’un espace personnalisé (consignant le contrat d’adhésion, la fiche d’entreprise, les éventuels rapports d’actions de pluridisciplinarité, mais également leur compte cotisation). Cet espace personnalisé doit permettre également de réserver des rendez-vous a minima pour leurs visites d’information et de prévention (VIP) initiale, suivi individuel renforcé (SIR) d’embauche et de reprise, et plus précisément d’effectuer des demandes de rendez-vous pour ces visites, et plus largement d’effectuer des demandes de rendez-vous pour les autres types de visites."
    2_prefix: "4.2.1.2"
    2_label: "Moyens informatiques et communication - Règlement Général sur la Protection des Données (RGPD)"
    2_desc: "En s’appuyant sur le guide de la CNIL à destination des services de prévention et de santé au travail, le SPSTI doit mettre en place une procédure garantissant la conformité au RGPD concernant :\n\t\t▪ les aspects du RGPD qui font l’objet de la procédure ;\n\t\t▪ l’information complète des employeurs et des salariés sur les actions menées par le SPSTI utilisant ou générant des données personnelles y compris pour la pratique de la télésanté ;\n\t\t▪ le recueil formalisé des consentements individuels ;\n\t\t▪ le traitement des réclamations éventuelles relatives à l’utilisation des données personnelles. "
    3_prefix: "4.2.1.3"
    3_label: "Moyens informatiques et communication - Télésanté au travail"
    3_desc: "Dès lors que le SPSTI dispose d’outils permettant la pratique de la télésanté et décide d’avoir recours à la télésanté au travail, il doit satisfaire aux exigences prévues par le décret n° 2022-679 du 26 avril 2022 relatif aux délégations de missions par les médecins du travail, aux infirmiers en santé au travail et à la télésanté au travail."
    4_prefix: "4.2.2"
    4_label: "Infrastructure et lieux de consultation"
    4_desc: "Le SPSTI doit s’assurer de la diversité et de la proximité des lieux de consultation et des modalités de leur mise en œuvre : centre fixe, centre mobile ou centre occasionnel, suivi par téléconsultation dans le cadre des dispositions fixées réglementairement."
5:
  title: "Exigences relatives aux missions du SPSTI"
  1_label: "Exigences générales"
  1_desc: "Les exigences générales concernant le SPSTI doivent être traitées suivant les dispositions décrites en 3.2 sur les niveaux de certification.\n\na. L’impartialité et l’égalité de traitement\nLes activités du SPSTI doivent être réalisées, structurées et gérées de manière à assurer son égalité de traitement et son impartialité vis-à-vis de ses entreprises adhérentes, y compris celles faisant appel à un mandataire, dans le cadre de ses obligations relatives à son statut d’association de loi 1901.\nLe SPSTI doit s’engager à ce que l’ensemble des acteurs et personnels du SPSTI (direction, administration, équipe pluridisciplinaire, gouvernance, etc.) exerce leurs activités en toute impartialité.\nL’audit de certification porte sur la formalisation de ces engagements par le SPSTI.\n\nb. La confidentialité\nDans le cadre de l’application de ses statuts qui le lient à ses adhérents, le SPSTI doit être responsable de la gestion de toutes les informations obtenues ou générées au cours de ses activités :\n\t\t▪ les fichiers d’adhésion sont confidentiels et doivent être protégés ;\n\t\t▪ les données protégées par le secret professionnel, le secret médical, le secret industriel ou le secret défense font l’objet d’un traitement spécifique conformément aux règles en vigueur dans ces domaines ;\n\t\t▪ le SPSTI veille à ce que les Services d’Ingénierie en Informatique (S2I) en charge de stocker les données soient certifiés en tant qu’hébergeur de données de santé (HDS) ;\n\t\t▪ par principe, la communication éventuelle de données notamment dans le cadre de la fourniture des rapports obligatoires ou de la participation à des études spécifiques font l’objet d’une anonymisation et d’une agrégation.\nToute communication de données non anonymisées à des tiers concernant une entreprise ou un salarié doit faire l’objet d’une information et d’un accord préalable et formalisé, par écrit, de leur part."
  2:
    title: "Exigences structurelles"
    1_label: "La gestion financière et la tarification"
    1_desc: "Le SPSTI doit mettre en place une procédure de fixation des cotisations qu’il perçoit, dans le respect des modalités légales de leur fixation comprenant leur caractère proportionnel par rapport au nombre de salariés suivis et son encadrement réglementaire par :\n\t\t▪ la mise en place d’une procédure de fixation d’une grille tarifaire de cotisation de l’offre spécifique accessible aux travailleurs indépendants. Cette grille tarifaire est rendue publique par le SPSTI par tout moyen ;\n\t\t▪ la régularité des conventions réglementées visées à l’article L. 4622-15 du code du travail, en liaison avec le commissaire aux comptes ;\n\t\t▪ l’assurance de la conformité de l’exercice comptable par un commissaire aux comptes le cas échéant ;\n\t\t▪ l’existence d’une procédure garantissant que la cotisation reçue au titre du service couvert par le présent document lui soit exclusivement dédiée."
    2_prefix: "5.2.2.1"
    2_label: "L’organisation générale du SPSTI et le projet de service - Organisation générale"
    2_desc: "Le SPSTI doit mettre en place des organisations et des procédures afin de : \n\t\t▪ définir et documenter le champ des activités pour lesquelles il se conforme au présent cahier des charges et s’assurer de la connaissance de ce champ d’activités par l’ensemble des acteurs œuvrant en son sein ou pour son compte ; \n\t\t▪ définir l’organisation et la structure de direction générale du SPSTI, et les relations entre la direction, l’équipe pluridisciplinaire chargée de la réalisation des activités et les services de soutien ; \n\t\t▪ justifier des liens de collaboration unissant les différents personnels en charge des missions prévues par le présent document ; \n\t\t▪ justifier du développement et du maintien des compétences professionnelles afin d’assurer l’ensemble des missions obligatoires pour toutes les fonctions des SPSTI ; \n\t\t▪ disposer d’un moyen de veille réglementaire à jour et informer les acteurs internes concernés des évolutions à prendre en considération ; \n\t\t▪ mettre en place un dispositif interne d’évaluation de la qualité du service rendu aux parties prenantes des entreprises adhérentes : employeur, salariés et leurs représentants ; \n\t\t▪ mettre en place une procédure de traitement des réclamations."
    3_prefix: "5.2.2.2"
    3_label: "L’organisation générale du SPSTI et le projet de service - Le projet de service"
    3_desc: "Le SPSTI doit définir le projet pluriannuel de service comprenant :\n\t\t▪ les éléments de participation de la commission médico-technique ;\n\t\t▪ l’avis de la commission de contrôle auquel il est soumis ;\n\t\t▪ une validation par le conseil d’administration ;\n\t\t▪ son articulation avec le contrat pluriannuel d’objectifs et de moyens (CPOM) conclu avec l’autorité administrative et la sécurité sociale.\n\nLe projet de service doit être porté à la connaissance de l’ensemble des acteurs œuvrant au sein du SPSTI ou pour le compte de celui-ci.\nLe projet de service doit prévoir des dispositions de nature à garantir qu’une équité de traitement soit respectée entre les entreprises adhérentes conformément au principe de mutualisation qui régit l’association. À cette fin, il doit déterminer :\n\t\t▪ les demandes des entreprises adhérentes qui impliqueraient un engagement disproportionné au regard des ressources du SPSTI ou ne faisant pas partie de l’ensemble socle de services ;\n\t\t▪ des indicateurs permettant d'identifier parmi les recettes financières du SPSTI, la part respective du montant de la cotisation du SPSTI de celle résultant de l’offre complémentaire."
  3:
    title: "Exigences générales relatives à la présentation du SPSTI"
    1_prefix: "5.3.1.1"
    1_label: "Les exigences relatives à l’information - Informations rendues accessibles au public"
    1_desc: "Le SPSTI doit rendre accessible au public sur son site internet les informations concernant les services prévus par le présent document, notamment ses modalités d’intervention ainsi que les moyens d’accéder à chacun de ses services administratifs ou technique et le statut de sa ou ses certifications.\n\nCes informations doivent éventuellement permettre aux employeurs de choisir un SPSTI.\n\nCes informations comprennent le contenu et la grille tarifaire applicable à l’offre spécifique proposée aux travailleurs indépendants."
    2_prefix: "5.3.1.2"
    2_label: "Les exigences relatives à l’information - Informations complémentaires réservées aux entreprises adhérentes"
    2_desc: "Le SPSTI doit rendre accessible aux entreprises adhérentes (employeur, salarié et ses représentants) et aux acteurs de la prévention concernés l’ensemble des informations nécessaires à l’exécution de ses missions telles que prévue par le présent document."
    3_prefix: "5.3.2.1"
    3_label: "La procédure de traitement des autres offres - La procédure applicable aux services accessibles aux travailleurs indépendants et aux chefs d’entreprise"
    3_desc: "Le SPSTI doit définir les modalités particulières de traitement des demandes des travailleurs indépendants et des chefs d’entreprise dans le cadre de l’offre qui leur est accessible.\nLes travailleurs indépendants qui se sont affiliés volontairement au SPSTI afin de bénéficier de l’offre spécifique qui leur est réservée doivent être avertis par le SPSTI, par tout moyen permettant d’en donner une date certaine, de l’échéance prochaine de leur affiliation. Cette information doit être effectuée en amont de la fin prévue de l’affiliation du travailleur indépendant au SPSTI. Elle doit faire l’objet d’une grille tarifaire approuvée par l’assemblée générale du SPSTI.\nLes employeurs non-salariés dont l’entreprise est adhérente à un SPSTI, peuvent quant à eux bénéficier de l’offre de services du SPSTI proposée aux salariés."
    4_prefix: "5.3.2.2"
    4_label: "La procédure de traitement des autres offres - La procédure relative aux services complémentaires"
    4_desc: "Lorsque le SPSTI propose une offre complémentaire de services, celui-ci doit mettre en place une procédure de traitement des demandes de services complémentaires. L’absence de souscription à une offre marchande facultative proposée par le SPSTI ne doit aucunement remettre en cause le bénéfice pour l’entreprise adhérente des missions devant être obligatoirement délivrées par le SPSTI et relevant du présent document, de la loi et du règlement."
    5_prefix: "5.3.3.1"
    5_label: "La procédure de traitement du recueil de la satisfaction et des réclamations des adhérents - La procédure de recueil de la satisfaction"
    5_desc: "Le SPSTI doit disposer d’une procédure qui surveille la perception des adhérents sur le niveau de satisfaction de leurs besoins et attentes. Il doit déterminer les méthodes permettant d’obtenir, de surveiller et de prendre en compte ces informations afin d’améliorer ses services. Par exemple, le recueil de satisfaction peut comprendre des enquêtes menées auprès des adhérents, des retours d’information sur les services fournis, des réunions avec les adhérents, des compliments, des réclamations, etc."
    6_prefix: "5.3.3.2"
    6_label: "La procédure de traitement du recueil de la satisfaction et des réclamations des adhérents - La procédure de traitement des réclamations"
    6_desc: "Le SPSTI doit disposer d’une procédure qui assure que les réclamations puissent être traitées en incluant l’analyse des causes, le cas échéant la mise en place d’actions correctives et la vérification de l’efficacité des actions. Ces réclamations sont tracées en précisant le délai de réponse. Cette procédure doit faire l’objet d’une évaluation régulière par le SPSTI. Cette procédure est portée à la connaissance des entreprises adhérentes et transmise sur demande aux salariés et aux instances représentatives du personnel (IRP)."
  4:
    title: "Exigences relatives au fonctionnement des SPSTI vis-à-vis des entreprises adhérentes"
    1_label: "Les conditions d’adhésion au SPSTI"
    1_desc: "Les conditions d’adhésion au SPSTI doivent être accessibles à toutes les entreprises qu’elles soient adhérentes ou non, afin de permettre aux employeurs de choisir un SPSTI (dans le cas du choix entre plusieurs services), notamment via la consultation de son site internet. L’objectif, en particulier pour l’entreprises adhérente, doit être la transparence des services et moyens mis à disposition par le SPSTI. Cette transparence doit s’appuyer sur l’accès aux informations suivantes :\n\t\t▪ les statuts du SPSTI et le cas échéant son règlement intérieur ;\n\t\t▪ les conditions d’adhésion aux SPSTI : le prix de sa cotisation, du coût de ses services complémentaires encadrées par des conditions générales et de la grille tarifaire adoptée par le SPSTI ;\n\t\t▪ le périmètre couvert par le SPSTI, la localisation de ses centres et lieux de consultation (fixes, mobiles) ;\n\t\t▪ le contexte réglementaire (compétence professionnelle et territoriale, date du dernier agrément, situation au titre de l’« agrément intérimaire » et « Installation nucléaire de base (INB) », date de signature et contenu du CPOM, procédure mise en place garantissant la conformité au RGPD) dans lequel s’exerce la mission du SPSTI ;\n\t\t▪ son offre socle de services à travers les missions suivantes : prévention des risques professionnels, suivi de l’état de santé des salariés, prévention de la désinsertion professionnelle et maintien dans l’emploi ;\n\t\t▪ le schéma d’organisation du SPSTI ;\n\t\t▪ la gouvernance des SPSTI : composition du conseil d’administration et de la commission de contrôle ;\n\t\t▪ le niveau de certification du SPSTI ;\n\t\t▪ le nombre de médecin praticien correspondant (MPC) conventionnés avec le SPSTI, le cas échéant."
    2_label: "Les relations avec l’entreprise adhérente"
    2_desc: "Les relations du SPSTI avec l’entreprise adhérente doivent :\n\t\t▪ être matérialisées par un contrat d’adhésion distinguant de l’offre socle de service et, le cas échéant, d’une offre complémentaire ;\n\t\t▪ être en mesure de répondre aux demandes des entreprises adhérentes dans les délais réglementaires ;\n\t\t▪ mettre à disposition un espace digitalisé personnalisé et sécurisé (voir 4.2.1.1) ;\n\t\t▪ indiquer le recours à des ressources externalisées (laboratoires, consultants, intervenants en prévention des risques professionnels (IPRP) …) ;\n\t\t▪ offrir un choix d’outils préalablement décidé en commun accord avec l’employeur pour les évaluations de risques professionnels ;\n\t\t▪ communique le nom du médecin en charge de l’entreprise."
    3_label: "La relation avec les salariés et les représentants du personnel"
    3_desc: "a. La relation avec le salarié\n\nLe salarié doit être en mesure de prendre connaissance de l’ensemble des services mis à disposition par le SPSTI. Il peut à tout moment demander à bénéficier d’un examen médical réalisé par un professionnel de santé au travail, notamment lorsqu’une problématique de santé peut avoir un retentissement à court et moyen terme sur son aptitude médicale, sans avoir à justifier de sa motivation auprès de l’employeur.\n\nDe même lorsque le salarié anticipe un risque d’inaptitude, dans l’objectif d’engager une démarche de PDP et/ou de maintien dans l’emploi et de bénéficier d’un accompagnement personnalisé, le salarié peut solliciter la cellule PDP. Si cette demande est formulée alors que le contrat de travail n’est pas suspendu, l’employeur doit en être préalablement informé.\n\nLe salarié peut à tout moment demander la transmission de son dossier médical en santé au travail en suivant la procédure réglementaire en vigueur.\n\nb. La relation avec les instances représentatives du personnel\n\nLe SPSTI doit assurer aux représentants du personnel l’accès aux conseils du médecin du travail.\n\nIl doit également assurer la participation du médecin du travail ou d’un membre de l’équipe pluridisciplinaire aux instances représentatives du personnel (comité social et économique (CSE) et commissions santé, sécurité et conditions de travail (CSSCT)) traitant des questions de prévention."
  5:
    title: "Exigences particulières aux trois missions des SPSTI"
    1_label: "Caractéristiques du SPSTI"
    1_desc: "Afin d’apprécier les conditions de réalisation de ses trois missions, le SPSTI produit les éléments suivants :\n\t\t▪ les profils particuliers de travailleurs (nombre de salariés suivis, INB, saisonniers, apprentis, intérimaires, éloignés, détachés, indépendants, employeurs non-salariés) ;\n\t\t▪ le périmètre territorial : nombre de secteurs avec indication des codes INSEE commune, canton ou département et nombres de centres (fixes, annexes, en entreprise et mobiles) ;\n\t\t▪ le nombre d’adhérents (au sens du code du travail) ;\n\t\t▪ le nombre d’entreprises (moins de 11 salariés/de 11 à 49/ 50 et plus/total) ;\n\t\t▪ le nombre d’établissements (entité dans laquelle le SPSTI met en œuvre ses missions) ;\n\t\t▪ le nombre de conventions établies avec un service public ainsi que le nombre de salariés suivis ;\n\t\t▪ les compétences (interprofessionnel, travail temporaire, INB, service professionnel secteur du bâtiment et travaux publics (BTP), autres services professionnels) ;\n\t\t▪ les ressources humaines : nombre en ETP par catégories professionnelles, nombre de départ et d’embauche des salariés par catégorie professionnelle sur la période observée;\n\t\t▪ le nombre de visites effectuées, par catégories de visites (embauches, périodiques, pré-reprise, reprise, à la demande, complémentaire, mi-carrière, post-professionnelle, post-exposition)."
    2_label: "Critères d’évaluation pour les trois missions"
    2_desc: "Le présent référentiel définit les critères d’évaluation par les organismes certificateurs pour la certification des SPSTI suivant ses trois missions. Un critère décrit une exigence mesurable du référentiel, qu’il soit quantitatif ou qualitatif. La procédure de certification est définie dans le plan de contrôle relatif à la certification des SPSTI par un organisme certificateur tierce partie [9].\nCes critères permettent l’évaluation des SPSTI selon les trois niveaux mentionnés en 3.2.\nL’organisme certificateur qui évalue le SPSTI doit apprécier ces critères au regard des exigences attendues par niveau. Le résultat de ces appréciations par critère détermine si le niveau sollicité est acquis.\nL’évaluation par l’organisme certificateur des critères est réalisée sur la base d’un exercice du SPSTI de 12 mois consécutifs (calendaires ou non) ou à défaut pour un nouveau SPSTI créé sur la base de l’exercice réalisé."
    3_prefix: "5.5.3.1"
    3_label: "MISSION I - Domaine d’action : Prévention des risques professionnels - Objectif"
    3_desc: "Le SPSTI doit organiser sa mission de prévention des risques professionnels en prévoyant :\n\t\t▪ un mode de conduite proactif des actions en milieu de travail ;\n\t\t▪ la capacité à travailler avec d’autres acteurs de la prévention et le cas échéant d’orienter l’entreprise vers ces derniers si nécessaire ;\n\t\t▪ la définition des priorités et des actions pluridisciplinaires définies dans le cadre du projet de service.\n\nLa mission de prévention du SPSTI vise à développer la culture de prévention de l’ensemble des acteurs de l’entreprise (employeur, salariés et leurs représentants) et promeut la prévention primaire."
    4_prefix: "5.5.3.2"
    4_label: "MISSION I - Domaine d’action : Prévention des risques professionnels - Exigences particulières relatives à la réalisation des actions de prévention"
    4_desc: "a. L’organisation générale\nLe SPSTI doit organiser sa mission de prévention des risques professionnels en prévoyant :\n\t\t▪ un mode de conduite proactif des actions en milieu de travail ;\n\t\t▪ la capacité à travailler avec d’autres acteurs de la prévention et le cas échéant d’orienter l’entreprise vers ces derniers si nécessaire ;\n\t\t▪ la définition des priorités et des actions pluridisciplinaires définies dans le cadre du projet de service. La mission de prévention du SPSTI vise à développer la culture de prévention de l’ensemble des acteurs de l’entreprise (employeur, salariés et leurs représentants) et promeut la prévention primaire.\n\nb. La fiche d’entreprise et l’aide à l’évaluation des risques\n\t\t▪ Pour la réalisation de la fiche d’entreprise : le SPSTI s’appuie sur sa propre évaluation et ne doit pas faire documenter la fiche par l’entreprise adhérente ni à partir du document unique d’évaluation des risques professionnels (DUERP). Sa réalisation ne peut pas faire l’objet d’une facturation supplémentaire même si le SPSTI s’engage dans un accompagnement de l’entreprise adhérente en vue de la réalisation du DUERP.\n\t\t▪ Les modalités d’élaboration de la fiche d’entreprise doivent être déterminées au sein du SPSTI dans le respect du cadre réglementaire.\n\t\t▪ Le SPSTI doit mettre en œuvre en tant que de besoin, le rattrapage de la réalisation et/ou de l’actualisation des fiches d’entreprise afin de satisfaire aux dispositions réglementaires.\n\nc. La conduite des actions menée dans les conditions fixées par l’ensemble socle de services\n\nLe SPSTI doit préciser qu’il intervient à titre d’accompagnement et de conseil et qu’il n’a pas vocation à se substituer à l’employeur ou à l’obliger à utiliser une méthode d’analyse, de gestion des risques déterminée. Il ne peut lui imposer des outils numériques donnés notamment en matière de gestion du risque chimique ou de production des DUERP. Le choix de ces outils doit être laissé à la seule appréciation de l’employeur.\nPour l’ensemble de ces actions, le SPSTI doit traiter équitablement les entreprises adhérentes, quelle que soit leur taille, et prendre en compte les ressources internes de ces entreprises en matière de santé-sécurité au travail et de prévention des risques professionnels, dans le cadre défini par le projet de service."
    5_prefix: "5.5.3.3"
    5_label: "MISSION I - Domaine d’action : Prévention des risques professionnels - Équipe"
    5_desc: "La composition de l’équipe est la suivante et doit permettre la continuité du service rendu :\n\t\t- Équipe pluridisciplinaire interne notamment composée IPRP et d’assistants en santé au travail compétents dans les disciplines citées.  Le SPSTI peut faire appel à des préventeurs extérieurs s’il n’est pas en capacité de répondre aux demandes. Ces personnes couvriront les disciplines suivantes : bruit-éclairage - vibrations, troubles musculosquelettiques (TMS), risque chimique, ergonomie, risques psychosociaux (RPS), organisation du travail, etc.\n\t\t- Personnels autorisés de l’équipe pluridisciplinaire.\nLes exigences ci-dessus sont précisées dans le tableau de la mission I en fonction du niveau de certification attendu."
    6_prefix: "5.5.4.1"
    6_label: "MISSION II - Domaine d’action : Suivi individuel de l’état de santé - Objectif"
    6_desc: "L’objectif est de s’assurer qu’un suivi individuel médical adapté est organisé et fourni pour l’ensemble des situations prévues par les textes réglementaires."
    7_prefix: "5.5.4.2"
    7_label: "MISSION II - Domaine d’action : Suivi individuel de l’état de santé - Exigences particulières relatives au suivi de l’état de santé"
    7_desc: "a. L’organisation générale \nL’activité de suivi individuel de l’état de santé des travailleurs doit comprendre les procédures suivantes :\n\t- une procédure d’élaboration et de mise en œuvre des protocoles de délégation de tâches du médecin du travail conformément à la réglementation ;\n\t- une procédure de remplacement du médecin du travail conformément à la réglementation ;\n\t- une procédure d’organisation des visites et examens comprenant les modalités :\n\t\t▪ de respect de la périodicité des visites selon la règlementation ;\n\t\t▪ de réalisation des différents types de visites telle que listées dans l’ensemble socle de services (y compris les catégories particulières de salariés) ;\n\t\t▪ de prise de rendez-vous pour les visites de VIP initiale, de SIR embauche et de reprise au moyen d’un portail électronique ;\n\t\t▪ de prise de rendez-vous sans nécessairement passer par Internet pour toutes les autres visites.\n\t- une procédure permettant :\n\t\t▪ d’avertir formellement l’employeur sur les impossibilités ou les difficultés à réaliser les visites dans les délais réglementaires ;\n\t\t▪ de justifier des motifs de refus de réalisation des visites ;\n\t\t▪ de communiquer à l’employeur les solutions et les délais de régularisation.\n\t- une procédure organisant :\n\t\t▪ la transmission à l’employeur et au salarié des avis du médecin du travail, notamment les avis d’aptitude, d’inaptitude, d’aménagements de poste selon la règlementation et les modalités définies par la jurisprudence ;\n\t\t▪ les convocations à d’éventuels examens complémentaires ;\n\t\t▪ la transmission au travailleur des conseils, mesures et propositions en prévention primaire relative aux risques ;\n\t\t▪ l’information des salariés concernant les risques auxquels ils sont soumis (prévention primaire) par le professionnel de santé ;\n\t\t▪ la transmission des mesures et les propositions du médecin pour le salarié à l’employeur ;\n\t\t▪ l’information sur les parcours de prévention de la désinsertion professionnelle (PDP).\n\nb. Le Médecin praticien correspondant (MPC)  Dans les zones géographiques arrêtées par l’Agence Régionale de Santé (ARS) permettant le recours au MPC, le SPSTI doit se doter de procédures permettant : \n\t- la vérification de la qualité du MPC pour agir au titre du SPSTI : formation ad hoc, autorisation d’exercer ;\n\t- le conventionnement entre le MPC et le SPSTI :\n\t\t▪ associant le médecin du travail ;\n\t\t▪ prévoyant les modalités de collaboration avec le MPC ;\n\t\t▪ fixant le protocole relatif aux activités du MPC en relation avec le SPSTI.\n\t- l’information des entreprises adhérentes quant au recours au MPC par le SPSTI et leur présentation :\n\t\t▪ le suivi et le bilan de l’activité des MPC au sein du SPSTI.\n\nc. Informations et gestion documentaire\n Le SPSTI doit prévoir une procédure d’actualisation régulière des dossiers individuels, de leur conservation et transmission dans le respect du RGPD ainsi que du décret n° 2022-1434 du 15 novembre 2022 relatif au dossier médical en santé au travail et des recommandations de la CNIL."
    8_prefix: "5.5.4.3"
    8_label: "MISSION II - Domaine d’action : Suivi individuel de l’état de santé - Équipe"
    8_desc: "La composition de l’équipe est la suivante et doit permettre la continuité du service rendu :\n\t\t▪ le médecin du travail ;\n\t\t▪ le collaborateur médecin et l’interne ;\n\t\t▪ les infirmiers en santé au travail et infirmiers en pratique avancée le cas échéant, pour les délégations qui leur sont ouvertes dans le cadre des missions confiées par le médecin du travail dans le cadre de protocoles formalisés ;\n\t\t▪ le médecin praticien correspondant, formé et dédié à l’entreprise pour les missions qui lui sont ouvertes.\n\nℹ️ NOTE\nLe médecin du travail est garant de l’indépendance des professionnels de santé, sous protocole de délégation, pour toutes les visites prévues par la législation.\n\nLes exigences ci-dessus sont précisées dans le tableau de la mission II en fonction du niveau de certification attendu."
    9_prefix: "5.5.5.1"
    9_label: "MISSION III - Domaine d’action : Prévention de la désinsertion professionnelle et maintien dans l’emploi - Objectif"
    9_desc: "L'objectif est d'anticiper et d'accompagner les cas individuels susceptibles de sortir de l'emploi par la mise en place d'une cellule opérationnelle."
    10_prefix: "5.5.5.2"
    10_label: "MISSION III - Domaine d’action : Prévention de la désinsertion professionnelle et maintien dans l’emploi - Exigences particulières relatives à la prévention de la désinsertion professionnelle"
    10_desc: "a. L’organisation générale\n\nLa cellule PDP doit être mise en place et sa composition formalisée avec :\n\t\t▪ un schéma des acteurs fonctionnels, leurs coordonnées et leurs rôles, dont l’assistant social ;\n\t\t▪ un schéma sur la mutualisation éventuelle de la cellule avec d’autres SPSTI ;\n\t\t▪ un schéma décrivant la coordination avec les acteurs externes concernés ;\n\t\t▪ une procédure d’information des acteurs de l’entreprise sur l’existence de la cellule, son rôle, son fonctionnement et ses modalités d’intervention ;\n\t\t▪ une procédure de traitement des demandes d’accompagnement, de suivi des dossiers individuels et de la réalité d’un parcours individuel.\n\nb. La conduite des actions\n\nEn matière de prévention de la désinsertion professionnelle, le SPSTI via la cellule PDP doit assurer les missions telles que définies par l’ensemble socle de services à savoir :\n\t\t▪ le repérage, le signalement précoce et l’accompagnement professionnel et social des salariés en risque de désinsertion professionnelle ;\n\t\t▪ l’accompagnement de l’employeur pour traiter du risque de désinsertion professionnelle d’un salarié ;\n\t\t▪ le conseil auprès de l’employeur pour agir en prévention primaire du risque de désinsertion professionnelle ;\n\t\t▪ le conseil à l’employeur pour trouver des financements ;\n\t\t▪ l’information des instances représentatives du personnel sur les problèmes généraux rencontrés ;\n\t\t▪ l'organisation d’actions collectives à destination des secteurs d’activités repérés comme prioritaires par le SPSTI."
    11_prefix: "5.5.5.3"
    11_label: "MISSION III - Domaine d’action : Prévention de la désinsertion professionnelle et maintien dans l’emploi - Équipe"
    11_desc: "La composition de l’équipe est la suivante et doit permettre la continuité du service rendu :\n\t\t- Cellule PDP interne ou partagée dans le cadre d’une mutualisation entre SPSTI (cas particulier du bâtiment et de sa structure dédiée externalisée).\n\t\t- Cellule PDP, dotée de spécialistes : conseiller emploi formation, assistant social, psychologue, ergonome, chargés de mission PDP ou autres…), en lien avec le médecin du travail en charge du suivi du salarié et avec les autres acteurs (médecin conseil, médecin traitant, cellule de prévention de la désinsertion de l’assurance maladie, caisses d'assurance retraite et de la santé au travail (CARSAT), Pôle emploi/CAP Emploi, maison départementale des personnes handicapées (MDPH), etc.) ;\n\t\t- Acteurs de la prévention primaire. Les exigences ci-dessus sont précisées dans le tableau de la mission III en fonction du niveau de certification attendu."
    12_prefix: "5.5.6"
    12_label: "Traçabilité et informations documentées"
    12_desc: "Le SPSTI doit formaliser et tracer toutes les procédures, les actions mises en place et les enregistrements, il les tient à jour et conserve les informations documentées pertinentes comme preuves de la mise en œuvre de la certification.\nLe SPSTI doit mettre en place une procédure d’élaboration et de publication du bilan annuel de ses activités comprenant notamment :\n\t\t▪ l’état de réalisation de l’ensemble socle de services de l’année écoulée ;\n\t\t▪ l’état de la réalisation du projet de service ;\n\t\t▪ l’état de la réalisation des engagements du SPSTI et des autres signataires du contrat pluriannuel d’objectifs et de moyens (CPOM).\n\nLe SPSTI conserve les informations documentées pour une durée au moins égale à cinq ans pour avoir l’assurance que le service a été réalisé comme prévu."
6:
  title: "Actions correctives"
  1_prefix: ""
  1_desc: "Le SPSTI doit déterminer les améliorations nécessaires et les actions correctives à mettre en œuvre pour améliorer en continu la pertinence, l’adéquation et l’efficacité des services rendus.\n\nLe SPSTI doit conserver les informations documentées sur les actions correctives menées, preuves de leur mise en œuvre."
