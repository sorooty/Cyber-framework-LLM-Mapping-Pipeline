4:
  title: "Contexte de l'organisme"
  1_label: "Compréhension de l’organisme et de son contexte"
  1_desc: "L'organisme doit déterminer les enjeux externes et internes pertinents par rapport à sa finalité et qui influent sur sa capacité à obtenir le (les) résultat(s) attendu(s) de son SMÉ et à améliorer sa performance énergétique. L’organisme doit déterminer si de tels enjeux découlent des changements climatiques."
  2_label: "Compréhension des besoins et attentes des parties intéressées"
  2_desc: "L’organisme doit déterminer: \n\ta. les parties intéressées qui sont pertinentes pour la performance énergétique et le SMÉ; \n\tb. les exigences pertinentes de ces parties intéressées; \n\tc. quels sont les besoins et attentes identifiés que l'organisme satisfait par son SMÉ. \n\n L’organisme doit: \n\t— s'assurer qu'il a accès aux exigences légales applicables et aux autres exigences relatives à son efficacité énergétique, ses usages énergétiques et sa consommation énergétique; \n\t— déterminer comment ces exigences s'appliquent à son efficacité énergétique, à ses usages énergétiques et sa consommation énergétique; \n\t— s'assurer que ces exigences sont prises en compte; \n\t— revoir ces exigences légales et les autres exigences à intervalles définis. \n\n ℹ️NOTE 1 \n Pour des informations complémentaires sur le management de la compliance, voir l'ISO 19600. \n\n ℹ️NOTE 2 \n Les parties intéressées concernées peuvent avoir des exigences relatives aux changements climatiques."
  3_label: "Détermination du domaine d’application du système de management de l'énergie"
  3_desc: "Pour établir le domaine d’application du SMÉ, l'organisme doit en déterminer le périmètre et l'applicabilité. \n\n Lorsqu'il établit le domaine d’application du SMÉ, l'organisme doit prendre en considération: \n\ta. les enjeux externes et internes mentionnés en 4.1; \n\tb. les exigences auxquelles il est fait référence en 4.2. \n\n L'organisme doit s'assurer qu'il a l'autorité nécessaire pour maîtriser son efficacité énergétique, ses usages énergétiques et sa consommation énergétique à l'intérieur du domaine d'application du SMÉ. L'organisme ne doit exclure aucun type d’énergie à l'intérieur du domaine d'application. \n\n Le domaine d'application et le périmètre du SMÉ doivent être disponibles sous forme d'informations documentées (voir 7.5)."
  4_label: "Système de management de l'énergie"
  4_desc: "L'organisme doit établir, mettre en œuvre, tenir à jour et améliorer en continu un SMÉ, y compris les processus nécessaires et leurs interactions, et améliorer continuellement la performance énergétique, conformément aux exigences du présent document. \n\n ℹ️NOTE \n Les processus nécessaires peuvent différer d'un organisme à l'autre, en raison: \n\t— de la taille de l’organisme, de ses domaines d’activité, de procédés, produits et services; \n\t— de la complexité des processus et de leurs interactions; \n\t— de la compétence des personnes."
5:
  title: "Leadership"
  1_label: "Leadership et engagement"
  1_desc: "La direction doit démontrer son leadership et son engagement vis-à-vis de l'amélioration continue de sa performance énergétique et de l'efficacité du SMÉ, en: \n\ta. s'assurant que le domaine d'application et le périmètre du SMÉ sont établis; \n\tb. s'assurant que la politique énergétique (voir 5.2), les objectifs et les cibles énergétiques (voir 6.2) sont établis et sont compatibles avec l'orientation stratégique de l'organisme; \n\tc. s'assurant que les exigences du SMÉ sont intégrées aux processus métier de l’organisme; \n ℹ️NOTE \n Dans le présent document, le terme «métier» peut être interprété au sens large comme se référant aux activités essentielles à la finalité de l’organisme. \n\td. s'assurant que les plans d'actions sont approuvés et mis en œuvre; \n\te. s'assurant que les ressources requises pour le SMÉ sont disponibles; \n\tf. communiquant sur l'importance de disposer d'un système de management de l'énergie efficace et de se conformer aux exigences du SMÉ; \n\tg. s'assurant que le SMÉ atteint le(s) résultat(s) escompté(s); \n\th. promouvant l’amélioration continue de la performance énergétique et du SMÉ; \n\ti. veillant à la mise en place d'une équipe de management de l'énergie; \n\tj. orientant et en soutenant les personnes pour qu'elles contribuent à l'efficacité du SMÉ et à l'amélioration de la performance énergétique; \n\tk. soutenant les autres rôles managériaux pertinents afin de démontrer leurs responsabilités dans leurs domaines respectifs; \n\tl. s'assurant que les indicateurs de performance énergétique représentent de façon appropriée la performance énergétique; \n\tm. s'assurant que des processus sont établis et mis en œuvre pour identifier et traiter les changements affectant le SMÉ et la performance énergétique à l’intérieur du domaine d'application et du périmètre du SMÉ."
  2_label: "Politique énergétique"
  2_desc: "La direction doit établir une politique énergétique qui: \n\ta. est appropriée à la finalité de l’organisme; \n\tb. fournit un cadre pour l’établissement et la revue d'objectifs et de cibles énergétiques (voir 6.2); \n\tc. comprend un engagement à garantir la disponibilité de l'information et des ressources nécessaires pour atteindre les objectifs et les cibles énergétiques; \n\td. inclut l’engagement de satisfaire aux exigences applicables, légales et autres, (voir 4.2) relatives à l'efficacité énergétique, aux usages énergétiques et à la consommation énergétique; \n\te. inclut un engagement vis-à-vis de l'amélioration continue (voir 10.2) de la performance énergétique et du SMÉ; \n\tf. favorise l'achat (voir 8.3) de produits et services économes en énergie ayant une influence sur la performance énergétique; \n\tg. favorise les activités de conception (voir 8.2) qui prennent en considération l'amélioration de la performance énergétique. \n\n La politique énergétique doit: \n\t— être tenue à jour sous la forme d'une information documentée (voir 7.5); \n\t— être communiquée au sein de l’organisme; \n\t— être mise à la disposition des parties intéressées, le cas échéant; \n\t— être revue régulièrement et mise à jour si nécessaire."
  3_label: "Rôles, responsabilités et autorités au sein de l’organisme"
  3_desc: "La direction doit s’assurer que les responsabilités et autorités des rôles pertinents sont attribuées et communiquées au sein de l’organisme. \n\n La direction doit attribuer la responsabilité et l’autorité à l'équipe de management de l'énergie pour: \n\ta. s'assurer que le SMÉ est établi, mis en œuvre, entretenu et continuellement amélioré; \n\tb. s’assurer que le SMÉ est conforme aux exigences du présent document; \n\tc. mettre en œuvre les plans d'actions (voir 6.2) pour améliorer continuellement la performance \n\n énergétique; \n\td. rendre compte à la direction de la performance du SMÉ et de l'amélioration de la performance \n\n énergétique à intervalles définis; \n\te. établir les critères et les méthodes nécessaires pour assurer le fonctionnement et la maîtrise effectifs du SMÉ."
6:
  title: "Planification"
  1:
    title: "Actions à mettre en œuvre face aux risques et opportunités"
    1_desc: "Dans le cadre de la planification de son SMÉ, l'organisme doit prendre en considération les enjeux mentionnés en 4.1 et les exigences mentionnées en 4.2 et passer en revue les activités et processus de l'organisme qui peuvent avoir une incidence sur la performance énergétique. La planification doit être cohérente avec la politique énergétique et doit conduire à des actions menant à l'amélioration continue de la performance énergétique. L'organisme doit déterminer les risques et les opportunités qu'il est nécessaire de prendre en compte pour: \n\t— donner l’assurance que le SMÉ peut atteindre les résultats escomptés, y compris l'amélioration de la performance énergétique; \n\t— prévenir ou réduire les effets indésirables; \n\t— parvenir à améliorer en continu le SMÉ et la performance énergétique. \n\n ℹ️NOTE \n Figure A.2."
    2_desc: "L'organisme doit planifier: \n\ta. les actions à mettre en œuvre face aux risques et opportunités; \n\tb. la manière: \n\t\t1. d’intégrer et de mettre en œuvre ces actions au sein de ses processus SMÉ et de performance énergétique; \n\t\t2. d’évaluer l’efficacité de ces actions."
  2:
    title: "Objectifs, cibles énergétiques et planification des actions pour les atteindre"
    1_label: "L’organisme doit établir des objectifs aux fonctions et niveaux concernés. L'organisme doit établir des cibles énergétiques."
    2_desc: "Les objectifs et les cibles énergétiques doivent: \n\ta. être cohérents avec la politique énergétique (voir 5.2); \n\tb. être mesurables (si cela est réalisable); \n\tc. prendre en compte les exigences applicables; \n\td. prendre en considération les usages énergétiques significatifs (voir 6.3); \n\te. prendre en compte les opportunités (voir 6.3) d'amélioration de la performance énergétique; \n\tf. être surveillés; \n\tg. être communiqués; \n\th. être mis à jour, en tant que de besoin. \n\n L'organisme doit conserver des informations documentées (voir 7.5) sur les objectifs et les cibles énergétiques."
    3_desc: "Lorsque l’organisme planifie la façon dont ses objectifs et cibles énergétiques seront atteints, il doit établir et tenir à jour des plans d'actions précisant: \n\t— ce qui sera fait; \n\t— les ressources qui seront nécessaires; \n\t— qui sera responsable; \n\t— les échéances; \n\t— la façon dont les résultats seront évalués y compris la(les) méthode(s) utilisée(s) pour vérifier l'amélioration de la performance énergétique (voir 9.1). \n\n L’organisme doit prendre en considération la manière dont les actions lui permettant d’atteindre ses objectifs et cibles énergétiques peuvent être intégrées dans les processus métier de l’organisme. L'organisme doit conserver des informations documentées au sujet des plans d'actions (voir 7.5)."
  3_label: "Revue énergétique"
  3_desc: "L'organisme doit élaborer et réaliser une revue énergétique. \n\n Pour élaborer sa revue énergétique, l'organisme doit: \n\ta. analyser les usages et la consommation énergétiques à partir de mesures et d'autres données, c'est-à-dire: \n\t\t1. identifier les types actuels d'énergie (voir 3.5.1); \n\t\t2. évaluer les usages et les consommations énergétiques passés et actuels; \n\tb. identifier, d'après l'analyse, les usages énergétiques significatifs (voir 3.5.6); \n\tc. pour chaque usage énergétique significatif: \n\t\t1. déterminer les facteurs pertinents; \n\t\t2. déterminer la performance énergétique actuelle; \n\t\t3. identifier la(les) personne(s) effectuant un travail sous son contrôle qui influence ou a une incidence sur les usages énergétiques significatifs; \n\td. déterminer et hiérarchiser les potentiels d'amélioration de la performance énergétique; \n\te. estimer les usages et la consommation énergétiques futurs. \n\n La revue énergétique doit être actualisée à intervalles définis, ainsi qu'après toute modification majeure des installations, équipements, systèmes ou procédés consommateurs d'énergie. \n\n L'organisme doit tenir à jour, sous forme d'informations documentées (voir 7.5), les méthodes et critères utilisés pour élaborer la revue énergétique, et doit conserver des informations documentées relatives aux résultats de cette revue."
  4_label: "Indicateurs de performance énergétique"
  4_desc: "L'organisme doit déterminer des indicateurs de performance énergétique qui: \n\ta. sont appropriés au mesurage et à la surveillance de sa performance énergétique; \n\tb. permettent à l'organisme de démontrer l'amélioration de la performance énergétique. La méthode de détermination et d'actualisation des indicateurs de performance énergétique doit être tenue à jour sous forme d’information documentée (voir 7.5). Lorsque l'organisme dispose de données indiquant que des facteurs pertinents ont une incidence importante sur la performance énergétique, l'organisme doit prendre en considération ces données afin d'établir des indicateurs de performance énergétique appropriés. \n\n Les valeurs des indicateurs de performance énergétique doivent être revues et comparées à leur situation énergétique de référence respective, selon les besoins. L'organisme doit conserver des informations documentées (voir 7.5) au sujet des valeurs des indicateurs de performance énergétique."
  5_label: "Situation énergétique de référence"
  5_desc: "L'organisme doit établir des situations énergétiques de référence sur la base des informations obtenues lors des revues énergétiques (voir 6.3), en prenant en compte une période appropriée. \n\n Lorsque l'organisme dispose de données indiquant que des facteurs pertinents ont une incidence importante sur la performance énergétique, l'organisme doit effectuer l'ajustement des valeurs des indicateurs de performance énergétique et des situations énergétiques de référence correspondantes. \n\n ℹ️NOTE \n complexe. \n\n Selon la nature des activités, l'ajustement peut être une opération simple ou une procédure plus Les situations énergétiques de référence doivent être révisées dans l'un ou plusieurs des cas suivants: \n\ta. les indicateurs de performance énergétique ne reflètent plus la performance énergétique de l'organisme; \n\tb. des modifications importantes ont été apportées aux facteurs statiques; \n\tc. une méthode prédéterminée le prévoit. \n\n L'organisme doit conserver les informations relatives aux situations énergétiques de référence, aux données des facteurs pertinents et aux modifications apportées aux situations énergétiques de référence sous forme d'informations documentées (voir 7.5)."
  6_label: "Planification de collecte de données énergétiques"
  6_desc: "L'organisme doit s'assurer que les caractéristiques clés de son fonctionnement ayant une incidence sur la performance énergétique sont identifiées, mesurées, surveillées et analysées à intervalles planifiés (voir 9.1). L'organisme doit définir et mettre en œuvre un plan de collecte de données énergétiques adapté à sa taille, sa complexité, ses ressources et ses équipements de mesurage et de surveillance. Le plan doit préciser les données nécessaires pour surveiller les caractéristiques clés, et indiquer comment et à quelle fréquence les données doivent être collectées et conservées. \n\n Les données à collecter (ou acquérir par mesurage lorsque cela est possible) et à conserver sous forme d’informations documentées (voir 7.5) doivent inclure: \n\ta. les facteurs pertinents relatifs aux usages énergétiques significatifs; \n\tb. la consommation énergétique associée aux usages énergétiques significatifs et à l'organisme; \n\tc. les critères opérationnels associés aux usages énergétiques significatifs; \n\td. les facteurs statiques, le cas échéant; \n\te. les données spécifiées dans les plans d'actions. \n\n Le plan de collecte de données énergétiques doit être revu à intervalles définis et mis à jour en tant que de besoin. \n\n L'organisme doit s'assurer que les équipements utilisés pour le mesurage des caractéristiques clés fournissent des données exactes et répétables. L'organisme doit conserver des informations documentées (voir 7.5) au sujet du mesurage, de la surveillance et des autres moyens permettant d'établir l'exactitude et la répétabilité."
7:
  title: "Support"
  1_label: "Ressources"
  1_desc: "L'organisme doit identifier et fournir les ressources nécessaires à l'établissement, la mise en œuvre, la mise à jour et l'amélioration continue de la performance énergétique et du SMÉ."
  2_label: "Compétence"
  2_desc: "L’organisme doit: \n\ta. déterminer les compétences nécessaires des personnes effectuant, sous son contrôle, un travail qui a une incidence sur sa performance énergétique et son SMÉ; \n\tb. garantir que ces personnes sont compétentes sur la base de leur formation initiale et professionnelle, de leurs savoir-faire ou de leur expérience; \n\tc. le cas échéant, mener des actions pour acquérir les compétences nécessaires et évaluer l’efficacité de ces actions; \n\td. conserver des informations documentées appropriées (voir 7.5) comme preuve de ces compétences. \n\n ℹ️NOTE \n Les actions envisageables peuvent notamment inclure la formation, l'encadrement ou la réaffectation du personnel en activité ou le recrutement direct ou en sous-traitance de personnes compétentes."
  3_label: "Sensibilisation"
  3_desc: "Les personnes effectuant un travail sous le contrôle de l'organisme doivent être sensibilisées: \n\ta. à la politique énergétique (voir 5.2); \n\tb. à l’importance de leur contribution à l'efficacité du SMÉ, y compris l'atteinte des objectifs et des cibles énergétiques (voir 6.2), et aux effets bénéfiques d’une amélioration de la performance énergétique; \n\tc. à l'impact de leurs activités ou de leur comportement sur la performance énergétique; \n\td. aux répercussions d’un non-respect des exigences du SMÉ."
  4_label: "Communication"
  4_desc: "L’organisme doit déterminer les éléments de communication interne et externe pertinents pour le SMÉ, y compris: \n\ta. sur quels sujets communiquer; \n\tb. à quels moments communiquer; \n\tc. avec qui communiquer; \n\td. comment communiquer; \n\te. qui communique. \n\n Lorsqu'il établit son ou ses processus de communication, l'organisme doit s'assurer que les informations communiquées sont cohérentes avec les informations générées au sein du SMÉ et sont fiables. \n\n L'organisme doit établir et mettre en œuvre un processus permettant à toute personne effectuant un travail sous le contrôle de l'organisme de faire des commentaires ou de suggérer des améliorations pour le SMÉ et la performance énergétique. L'organisme doit envisager de conserver des informations documentées (voir 7.5) au sujet des suggestions d'amélioration."
  5:
    title: "Informations documentées"
    1_label: "Généralités"
    1_desc: "Le SMÉ de l'organisme doit inclure: \n\ta. les informations documentées requises par le présent document; \n\tb. les informations documentées que l’organisme juge nécessaires à l’efficacité du SMÉ et pour démontrer l'amélioration de la performance énergétique. \n\n ℹ️NOTE \n fonction de: \n L’étendue des informations documentées dans le cadre d'un SMÉ peut différer selon l'organisme en \n\t— la taille de l’organisme, ses domaines d’activité, ses processus, produits et services; \n\t— la complexité des processus et de leurs interactions; \n\t— la compétence des personnes."
    2_label: "Création et mise à jour"
    2_desc: "Lors de la création et de la mise à jour des informations documentées, l’organisme doit s’assurer que: \n\ta. l'identification et la description (par exemple titre, date, auteur, numéro de référence); \n\tb. leur format (par exemple langue, version logicielle, graphiques) et leur support (par exemple électronique, papier); \n\tc. la revue pour en déterminer la pertinence et l'adéquation, et approbation; sont appropriées."
    3_label: "Maîtrise des informations documentées"
    3_desc: "Les informations documentées exigées par le SMÉ et par le présent document doivent être maîtrisées pour s’assurer: \n\ta. qu'elles sont disponibles et conviennentà l’utilisation, là où et quand elles sont nécessaires; \n\tb. qu'elles sont convenablement protégées (par exemple de toute perte de confidentialité, utilisation inappropriée, perte d'intégrité). \n\n Pour contrôler les informations documentées, l'organisme doit mettre en œuvre les activités suivantes, lorsqu’elles sont applicables: \n\t— distribution, accès, récupération et utilisation; \n\t— stockage et protection, y compris préservation de la lisibilité; \n\t— maîtrise des modifications (par exemple contrôle des versions); \n\t— conservation et élimination. Les informations documentées d'origine externe que l'organisme juge nécessaires à la planification et au fonctionnement du SMÉ doivent être identifiées comme il convient et maîtrisées. \n\n ℹ️NOTE \n L'accès peut impliquer une décision relative à l'autorisation de consulter les informations documentées uniquement, ou l'autorisation et l'autorité de consulter et modifier les informations documentées."
8:
  title: "Réalisation des activités opérationnelles"
  1_label: "Planification et maîtrise opérationnelles"
  1_desc: "L'organisme doit planifier, mettre en œuvre et maîtriser les processus associés à ses usages énergétiques significatifs (voir 6.3) nécessaires à la satisfaction des exigences et à la réalisation des actions déterminées en 6.2, en: \n\ta. établissant des critères pour ces processus, y compris l'exploitation et la maintenance des installations, équipements, systèmes et procédés consommateurs d'énergie, lorsque leur absence peut entraîner un écart important par rapport à la performance énergétique visée; \n ℹ️NOTE \n Les critères d'importance des écarts sont déterminés par l'organisme. \n\tb. communiquant (voir 7.4) les critères aux personnes concernées effectuant un travail sous le contrôle de l'organisme; \n\tc. mettant en œuvre la maîtrise de ces processus conformément aux critères, y compris l'exploitation et la maintenance des installations, équipements, systèmes et procédés consommateurs d'énergie conformément aux critères établis; \n\td. conservant des informations documentées (voir 7.5) dans une mesure suffisante pour avoir l'assurance que les processus ont été réalisés comme prévu. \n\n L’organisme doit maîtriser les modifications prévues, analyser les conséquences des modifications imprévues et, si nécessaire, mener des actions pour limiter tout effet négatif. \n\n L'organisme doit s'assurer que les usages énergétiques significatifs ou processus associés à ses usages énergétiques significatifs (voir 6.3) qui sont externalisés sont maîtrisés (voir 8.3)."
  2_label: "Conception"
  2_desc: "L'organisme doit prendre en considération les opportunités d'amélioration de la performance énergétique et les éléments de maîtrise opérationnelle lors de la conception d'installations, d'équipements, de systèmes et de procédés consommateurs d'énergie nouveaux, modifiés et rénovés pouvant avoir un impact significatif sur la performance énergétique pendant la durée de vie de fonctionnement prévue ou attendue. \n\n Le cas échéant, les résultats de la prise en considération de la performance énergétique doivent être intégrés dans les cahiers des charges, les activités de conception et les achats. \n\n L'organisme doit conserver des informations documentées sur les activités de conception relatives à la performance énergétique (voir 7.5)."
  3_label: "Achats"
  3_desc: "L'organisme doit établir et mettre en œuvre des critères d'évaluation de la performance énergétique sur la durée de vie de fonctionnement prévue ou attendue lors de l'achat de produits, équipements et services consommateurs d'énergie dont il est attendu qu'ils auront un impact significatif sur la performance énergétique de l'organisme. \n\n Lors de l'achat de produits, équipements et services consommateurs d'énergie ayant ou pouvant avoir un impact sur les usages énergétiques significatifs, l'organisme doit informer les fournisseurs que la performance énergétique est un des critères d'évaluation pour les achats. \n\n Le cas échéant, l'organisme doit définir et communiquer des spécifications pour: \n\ta. garantir la performance énergétique des équipements et services fournis; \n\tb. l'achat d'énergie."
9:
  title: "Évaluation des performances"
  1:
    title: "Surveillance, mesurage, analyse et évaluation de la performance énergétique et du SMÉ"
    1_label: "Généralités"
    1_desc: "L'organisme doit déterminer pour la performance énergétique et le SMÉ: \n\ta. ce qu'il est nécessaire de surveiller et de mesurer, y compris au minimum les caractéristiques clés suivantes: \n\t\t1. l'efficacité des plans d'actions dans l'atteinte des objectifs et cibles énergétiques; \n\t\t2. les indicateurs de performance énergétique; \n\t\t3. l’exploitation des usages énergétiques significatifs; \n\t\t4. la consommation énergétique réelle par rapport à la consommation attendue; \n\tb. les méthodes de surveillance, de mesurage, d'analyse et d'évaluation, selon le cas, pour assurer la validité des résultats; \n\tc. quand la surveillance et le mesurage doivent être effectués; \n\td. quand les résultats de la surveillance et du mesurage doivent être analysés et évalués. \n\n L’organisme doit évaluer sa performance énergétique, ainsi que l’efficacité du SMÉ (voir 6.6). \n\n L'amélioration de la performance énergétique doit être évaluée en comparant les valeurs des indicateurs de performance énergétique (voir 6.4) par rapport aux situations énergétiques de référence correspondantes (voir 6.5). \n\n L'organisme doit enquêter sur les écarts importants de la performance énergétique et y apporter réponse. L'organisme doit conserver des informations documentées sur les résultats de l'enquête et la réponse apportée (voir 7.5). \n\n L'organisme doit conserver des informations documentées pertinentes comme preuve des résultats de la surveillance et du mesurage (voir 7.5)."
    2_label: "Évaluation de la conformité aux exigences légales et autres exigences"
    2_desc: "À intervalles planifiés, l’organisme doit évaluer la conformité aux exigences légales et aux autres exigences (voir 4.2) relatives à son efficacité énergétique, à ses usages énergétiques, à sa consommation énergétique et au SMÉ. L'organisme doit conserver des informations documentées (voir 7.5) sur les résultats de l'évaluation de la conformité, et sur toute action résultante."
  2:
    title: "Audit interne"
    1_desc: "L’organisme doit réaliser des audits internes du SMÉ à des intervalles planifiés pour fournir des informations permettant de déterminer si le SMÉ: \n\ta. améliore la performance énergétique; \n\tb. est conforme: \n\t\t— aux propres exigences de l'organisme concernant son SMÉ; \n\t\t— à la politique énergétique (voir 5.2), aux objectifs et aux cibles énergétiques (voir 6.2) établis par l'organisme; \n\t\t— aux exigences du présent document; \n\tc. est efficacement mis en œuvre et tenu à jour."
    2_desc: "L'organisme doit: \n\ta. planifier, établir, mettre en œuvre et maintenir un programme d’audit, couvrant notamment la fréquence, les méthodes, les responsabilités, les exigences de planification et le compte rendu. Le programme d’audit doit tenir compte de l’importance des processus concernés, et des résultats des audits précédents; \n\tb. définir les critères d’audit et le domaine d'application de chaque audit; \n\tc. sélectionner des auditeurs et réaliser des audits pour assurer l'objectivité et l'impartialité du processus d'audit; \n\td. veiller à ce que les résultats des audits soient rapportés à la direction concernée; \n\te. entreprendre les actions appropriées conformément à 10.1 et 10.2; \n\tf. conserver des informations documentées (voir 7.5) comme preuves de la mise en œuvre du programme d'audit et des résultats d'audit."
  3:
    title: "Revue de management"
    1_label: "À des intervalles planifiés, la direction doit procéder à la revue du SMÉ mis en place par l’organisme, afin de s’assurer qu’il est toujours approprié, adapté, efficace et en accord avec l’orientation stratégique de l’organisme."
    2_desc: "La revue de direction doit prendre en considération, entre autres: \n\ta. l’état d'avancement des actions décidées à l’issue des revues de management précédentes; \n\tb. les modifications des enjeux externes et internes et les risques et opportunités associés pertinents pour le SMÉ; \n\tc. les informations sur les performances du SMÉ, y compris les tendances concernant: \n\t\t1. non-conformités et actions correctives; \n\t\t2. les résultats de la surveillance et du mesurage; \n\t\t3. les résultats des audits; \n\t\t4. les résultats de l'évaluation de la conformité aux exigences légales et aux autres exigences; \n\td. les opportunités d'amélioration continue, y compris pour les compétences; \n\te. la politique énergétique."
    3_desc: "Les éléments d'entrée de la revue de management relatifs à la performance énergétique doivent \n\t— le niveau de réalisation des objectifs et cibles énergétiques; \n\t— la performance énergétique et l'amélioration de la performance énergétique basées sur les résultats de surveillance et de mesurage, y compris les indicateurs de performance énergétique; \n\t— l’avancement des plans d'actions."
    4_desc: "Les éléments de sortie de la revue de management doivent inclure les décisions relatives aux opportunités d'amélioration continue et aux éventuels changements à apporter au SMÉ, y compris: \n\ta. les opportunités d'amélioration de la performance énergétique; \n\tb. la politique énergétique; \n\tc. les indicateurs de performance énergétique et les situations énergétiques de référence; \n\td. les objectifs, cibles énergétiques, plans d'actions ou autres éléments du SMÉ et les actions à entreprendre s'ils ne sont pas atteints; \n\te. les opportunités d'amélioration de l'intégration avec les processus métier; \n\tf. l’affectation des ressources; \n\tg. l'amélioration des compétences, de la sensibilisation et de la communication. \n\n L’organisme doit conserver des informations documentées comme preuves des résultats des revues de management."
10:
  title: "Amélioration"
  1_label: "Non-conformité et action corrective"
  1_desc: "Lorsqu’une non-conformité est identifiée, l’organisme doit: \n\ta. réagir à la non-conformité, et le cas échéant: \n\t\t1. agir pour la maîtriser et la corriger; \n\t\t2. faire face aux conséquences; \n\tb. évaluer s’il est nécessaire de mener une action pour éliminer la ou les causes de la non-conformité, afin qu’elle ne se reproduise pas ou n’apparaisse pas ailleurs, en: \n\t\t1. effectuant la revue de la non-conformité; \n\t\t2. déterminant les causes de la non-conformité; \n\t\t3. recherchant si des non-conformités similaires existent ou pourraient éventuellement se produire; \n\tc. mettre en œuvre toute action requise; \n\td. examiner l'efficacité de toute action corrective mise en œuvre; \n\te. modifier le SMÉ si nécessaire. \n\n Les actions correctives doivent être adaptées aux conséquences des non-conformités rencontrées. \n\n L'organisme doit conserver des informations documentées comme preuves: \n\t— de la nature des non-conformités et de toute action menée ultérieurement; \n\t— des résultats de toute action corrective."
  2_label: "Amélioration continue"
  2_desc: "L'organisme doit améliorer en continu la pertinence, l'adéquation et l'efficacité du SMÉ. L'organisme doit démontrer l'amélioration continue de la performance énergétique."
