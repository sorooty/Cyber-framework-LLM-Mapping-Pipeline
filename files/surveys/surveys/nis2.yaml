20:
  title: "Gouvernance"
  prefix: "Article XX"
  1_label: "Approbation et Supervision des Mesures de Cybersécurité"
  1_desc: "Les organes de direction doivent approuver les mesures de gestion des risques en matière de cybersécurité, superviser leur mise en œuvre et être tenus responsables de la violation de ces mesures.\n\n**Mesures de sécurité pour répondre à l'exigence :**\n\t1. Élaboration et Approbation de Politiques de Cybersécurité :\n\t\t- Développer des politiques de cybersécurité détaillées couvrant l'analyse des risques, la gestion des incidents, et la continuité des activités.\n\t\t- Soumettre ces politiques pour approbation par les organes de direction.\n\t2. Supervision Continue :\n\t\t- Mettre en place un comité de cybersécurité au sein de l'organe de direction pour surveiller l'implémentation des politiques.\n\t\t- Utiliser des rapports réguliers sur la conformité et les incidents pour superviser l'efficacité des mesures.\n\t3. Responsabilité et Rendement des Comptes :\n\t\t- Définir clairement les responsabilités des membres de l'organe de direction en matière de cybersécurité.\n\t\t- Mettre en place des mécanismes de reddition de comptes pour s'assurer que les membres sont tenus responsables des manquements en matière de cybersécurité.\n\n**Plan d'action pour mettre en œuvre les mesures de sécurité :**\n\t1. Développement des Politiques\n\t\t- Identifier les risques clés et élaborer des politiques de gestion des risques en cybersécurité.\n\t\t- Préparer un document de politique à soumettre pour approbation.\n\t2. Mise en Place du Comité de Cybersécurité\n\t\t- Former un comité dédié au sein de l'organe de direction.\n\t\t- Définir les rôles et les responsabilités des membres du comité.\n\t3. Supervision et Rapports\n\t\t- Mettre en place un système de reporting régulier pour suivre l'implémentation des politiques.\n\t\t- Organiser des réunions trimestrielles pour examiner les rapports de cybersécurité.\n\t4. Mise en Place de Mécanismes de Responsabilité\n\t\t- Élaborer des procédures pour évaluer la performance des membres de l'organe de direction en matière de cybersécurité.\n\t\t- Instaurer des sanctions en cas de non-respect des politiques approuvées."
  2_label: "Formation des Membres de l'Organe de Direction"
  2_desc: "Les membres des organes de direction doivent suivre une formation continue et régulière sur la cybersécurité.\n\n**Mesures de sécurité pour répondre à l'exigence :**\n\t1. Programmes de Formation Régulière :\n\t\t- Organiser des sessions de formation annuelles pour les membres de l'organe de direction.\n\t\t- Inclure des modules sur les dernières tendances en matière de cybermenaces, les bonnes pratiques de gestion des risques et les exigences réglementaires.\n\t2. Évaluations et Certifications :\n\t\t- Faire passer des évaluations régulières pour mesurer les connaissances acquises par les membres de l'organe de direction.\n\t\t- Encourager l'obtention de certifications reconnues en cybersécurité.\n\t3. Mise à Jour des Connaissances :\n\t\t- Fournir des mises à jour régulières sur les évolutions en matière de cybersécurité.\n\t\t- Abonner les membres de l'organe de direction à des newsletters spécialisées et à des alertes sur les menaces émergentes.\n\n**Plan d'action pour mettre en œuvre les mesures de sécurité :**\n\t1. Élaboration du Programme de Formation\n\t\t- Identifier les besoins de formation spécifiques à l’organe de direction.\n\t\t- Sélectionner des prestataires de formation qualifiés ou développer des programmes internes.\n\t2. Mise en Œuvre de la Formation\n\t\t- Planifier et organiser des sessions de formation initiale et continue.\n\t\t- Assurer la participation de tous les membres de l’organe de direction.\n\t3. Évaluation et Certification\n\t\t- Mettre en place un système d'évaluation pour mesurer les compétences en cybersécurité des membres.\n\t\t- Faciliter l'accès à des certifications en cybersécurité pour les membres de l’organe de direction.\n\t4. Mises à Jour Régulières\n\t\t- Envoyer des mises à jour régulières sur les menaces et les nouvelles pratiques en matière de cybersécurité.\n\t\t- Organiser des webinaires ou des séminaires sur les évolutions majeures en cybersécurité."
21:
  title: "Mesures de gestion des risques en matière de cybersécurité"
  prefix: "Article XXI"
  1_label: "Politiques relatives à l’analyse des risques et à la sécurité des systèmes d’information"
  1_desc: "L'entreprise doit : Mettre en place des politiques relatives à l’analyse des risques et à la sécurité des systèmes d’information pour identifier, évaluer et gérer les risques cybernétiques.\n\n**Mesures de sécurité :**\n\t\t- Effectuer une évaluation régulière des risques.\n\t\t- Mettre en place un système de gestion de la sécurité de l’information (SGSI) conforme à la norme ISO 27001.\n\t\t- Utiliser des outils de gestion des risques comme EBIOS, FAIR, ou NIST.\n\t\t- Élaborer un registre des risques documentant les menaces, vulnérabilités, et impacts potentiels.\n\t\t- Former régulièrement les employés sur la gestion des risques et les bonnes pratiques de cybersécurité.\n\n**Plan d'action :**\n\t- Identifier les actifs critiques de l’organisation et réaliser une évaluation initiale des risques.\n\t- Développer et documenter des politiques et des procédures de gestion des risques.\n\t- Implémenter des outils de gestion des risques et Former les utilisateurs clés.\n\t- organiser des sessions de formation et des ateliers sur la gestion des risques.\n\t- Effectuer des audits réguliers pour évaluer l’efficacité des politiques de gestion des risques."
  2_label: "B. Gestion des incidents"
  2_desc: "L'entreprise doit : Mettre en œuvre des procédures de gestion des incidents pour détecter, répondre, et récupérer des incidents de cybersécurité.\n\n**Mesures de sécurité :**\n\t- Établir une équipe de réponse aux incidents (CSIRT).\n\t- Utiliser des outils de détection des intrusions (IDS/IPS).\n\t- Développer et Maintenir un plan de réponse aux incidents.\n\t- Effectuer des simulations d’incidents (exercices de table).\n\t- Mettre en place un système de gestion des informations et des événements de sécurité (SIEM).\n\n**Plan d'action :**\n\t- Former une équipe de réponse aux incidents et définir leurs rôles et responsabilités.\n\t- Installer et configurer des outils IDS/IPS pour surveiller le réseau.\n\t- Élaborer un plan de réponse aux incidents détaillant les procédures à suivre en cas d’incident.\n\t- Organiser des exercices de simulation d’incidents pour tester la réactivité de l’équipe.\n\t- Mettre en place un SIEM pour centraliser la surveillance et la gestion des incidents."
  3_label: "C. Continuité des activités et gestion des crises"
  3_desc: "L'entreprise doit : Assurer la continuité des activités, y compris la gestion des sauvegardes, la reprise après sinistre, et la gestion des crises.\n\n**Mesures de sécurité :**\n\t- Élaborer un plan de continuité des activités (PCA).\n\t- Mettre en place des solutions de sauvegarde régulières et automatisées.\n\t- Développer un plan de reprise après sinistre (PRA).\n\t- Effectuer des tests de reprise après sinistre réguliers.\n\t- Mettre en place une équipe de gestion des crises et des protocoles de communication d’urgence.\n\n**Plan d'action :**\n\t- identifier les processus critiques et Développer un PCA couvrant ces processus.\n\t- Mettre en place des solutions de sauvegarde avec des copies hors site et automatisées.\n\t- Élaborer et documenter un PRA détaillant les étapes pour récupérer après un sinistre.\n\t- Organiser des tests réguliers de PRA pour s’assurer de l’efficacité et de la rapidité des récupérations.\n\t- Former une équipe de gestion des crises et définir des protocoles de communication d’urgence."
  4_label: "D. Sécurité de la chaîne d’approvisionnement"
  4_desc: "L'entreprise doit : Assurer la sécurité de la chaîne d’approvisionnement, y compris les aspects liés à la sécurité concernant les relations avec les fournisseurs et les prestataires de services directs.\n\n**Mesures de sécurité :**\n\t- Évaluer les pratiques de sécurité des fournisseurs.\n\t- Intégrer des clauses de sécurité dans les contrats de fournisseurs.\n\t- Réaliser des audits de sécurité réguliers des fournisseurs.\n\t- Mettre en place des procédures de gestion des risques pour les tiers.\n\t- Exiger des certifications de sécurité de la part des fournisseurs.\n\n**Plan d'action :**\n\t- Effectuer des évaluations de sécurité des fournisseurs avant et pendant la relation commerciale.\n\t- Inclure des clauses de sécurité détaillées dans tous les contrats de fournisseurs.\n\t- organiser des audits de sécurité réguliers pour les fournisseurs critiques.\n\t- Développer des procédures de gestion des risques spécifiques aux tiers.\n\t- Demander des certifications de sécurité telles que ISO 27001 aux fournisseurs."
  5_label: "Sécurité de l’acquisition, du développement et de la maintenance des réseaux et des systèmes d’information"
  5_desc: "L'entreprise doit : Garantir la sécurité de l’acquisition, du développement et de la maintenance des réseaux et des systèmes d’information, y compris le traitement et la divulgation des vulnérabilités.\n\n**Mesures de sécurité :**\n\t- Intégrer la sécurité dans le cycle de vie du développement logiciel (SDLC).\n\t- Effectuer des tests de pénétration réguliers.\n\t- Mettre en œuvre des pratiques de développement sécurisé (DevSecOps).\n\t- Gérer et divulguer les vulnérabilités de manière coordonnée.\n\t- Maintenir une documentation de sécurité à jour pour tous les systèmes et réseaux.\n\n**Plan d'action :**\n\t- Développer et Implémenter des politiques de SDLC intégrant la sécurité à chaque étape.\n\t- organiser des tests de pénétration périodiques pour identifier et corriger les faiblesses.\n\t- Adopter des pratiques DevSecOps pour Intégrer la sécurité dès le début du développement.\n\t- Mettre en place un processus de divulgation coordonnée des vulnérabilités avec les parties prenantes.\n\t- Maintenir et Mettre à jour régulièrement la documentation de sécurité des systèmes et réseaux."
  6_label: "Politiques et procédures pour évaluer l’efficacité des mesures de gestion des risques en matière de cybersécurité"
  6_desc: "L'entreprise doit : Mettre en place des politiques et des procédures pour évaluer régulièrement l’efficacité des mesures de gestion des risques en matière de cybersécurité.\n\n**Mesures de sécurité :**\n\t- Réaliser des audits internes de cybersécurité périodiques.\n\t- Utiliser des outils d’évaluation des performances de sécurité (par exemple, tableaux de bord de cybersécurité).\n\t- Effectuer des évaluations de maturité de la cybersécurité basées sur des cadres reconnus (comme le NIST CSF).\n\t- Mettre en place un programme de tests de conformité réguliers.\n\t- Analyser les retours d'expérience et les incidents passés pour améliorer les mesures de sécurité.\n\n**Plan d'action :**\n\t- Développer un programme d’audits internes de cybersécurité et Former des auditeurs internes.\n\t- Implémenter des outils de suivi et d’évaluation des performances de sécurité, et former les utilisateurs.\n\t- Effectuer des évaluations de maturité de la cybersécurité en utilisant des cadres reconnus et documenter les résultats.\n\t- Mettre en œuvre des tests de conformité réguliers pour s'assurer que toutes les mesures de sécurité sont respectées.\n\t- analyser les incidents passés et les leçons apprises pour identifier les domaines à améliorer et ajuster les mesures de sécurité en conséquence."
  7_label: "Pratiques de base en matière de cyberhygiène et formation à la cybersécurité"
  7_desc: "L'entreprise doit : Promouvoir des pratiques de base en matière de cyberhygiène et dispenser une formation régulière à la cybersécurité pour tous les employés.\n\n**Mesures de sécurité :**\n\t- Sensibiliser régulièrement les employés aux bonnes pratiques de cybersécurité (par exemple, via des campagnes de sensibilisation).\n\t- organiser des formations régulières en cybersécurité pour tous les employés.\n\t- Mettre en place des politiques de gestion des mots de passe (exigences de complexité, changements réguliers).\n\t- Promouvoir l’utilisation de solutions de sécurité personnelles (antivirus, pare-feu).\n\t- Développer une culture de cybersécurité au sein de l'organisation.\n\n**Plan d'action :**\n\t- Lancer des campagnes de sensibilisation à la cybersécurité incluant des bulletins d'information et des affiches.\n\t- organiser des sessions de formation en ligne et en personne sur les bonnes pratiques de cybersécurité.\n\t- Mettre en place des politiques strictes de gestion des mots de passe et Utiliser des outils de gestion des mots de passe.\n\t- Encourager les employés à Installer et à Maintenir à jour des logiciels de sécurité sur leurs appareils personnels et professionnels.\n\t- Créer des groupes de travail sur la cybersécurité pour Promouvoir une culture de sécurité et partager les meilleures pratiques."
  8_label: "Politiques et procédures relatives à l’utilisation de la cryptographie et du chiffrement"
  8_desc: "L'entreprise doit : Mettre en place des politiques et des procédures relatives à l’utilisation de la cryptographie et du chiffrement pour protéger les données sensibles.\n\n**Mesures de sécurité :**\n\t- Implémenter des solutions de chiffrement pour les données en transit et au repos.\n\t- Utiliser des certificats de sécurité pour Assurer la confidentialité des communications en ligne.\n\t- Mettre en place des politiques d'utilisation de la cryptographie pour le stockage et la transmission des données.\n\t- Utiliser des modules de sécurité matériels (HSM) pour Gérer et protéger les clés cryptographiques.\n\t- Effectuer des audits réguliers des pratiques de cryptographie pour s'assurer de leur conformité aux normes.\n\n**Plan d'action :**\n\t- Sélectionner et Implémenter des solutions de chiffrement adaptées pour protéger les données en transit et au repos.\n\t- Déployer des certificats SSL/TLS pour sécuriser les communications sur internet.\n\t- Développer et documenter des politiques de cryptographie couvrant l'utilisation, la gestion et la protection des clés.\n\t- Installer et configurer des HSM pour la gestion sécurisée des clés cryptographiques.\n\t- Réaliser des audits réguliers des pratiques de cryptographie pour s'assurer de leur conformité avec les normes et réglementations."
  9_label: "Sécurité des ressources humaines, politiques de contrôle d’accès et gestion des actifs"
  9_desc: "L'entreprise doit : Mettre en place des politiques de sécurité pour les ressources humaines, des politiques de contrôle d’accès et une gestion efficace des actifs.\n\n**Mesures de sécurité :**\n\t- Effectuer des vérifications des antécédents des employés et des formations en cybersécurité lors de l’embauche.\n\t- Mettre en œuvre des politiques de contrôle d’accès basées sur le principe du moindre privilège.\n\t- Utiliser des systèmes de gestion des identités et des accès (IAM) pour contrôler les accès aux ressources.\n\t- Maintenir un inventaire complet et à jour des actifs informatiques.\n\t- Réaliser des évaluations régulières de la sécurité des actifs et des utilisateurs.\n\n**Plan d'action :**\n\t- Mettre en place des processus de vérification des antécédents et des formations initiales en cybersécurité pour tous les nouveaux employés.\n\t- Développer et implémenter des politiques de contrôle d’accès strictes, basées sur le principe du moindre privilège.\n\t- Installer et configurer des systèmes IAM pour Gérer les accès aux ressources informatiques de manière sécurisée.\n\t- Créer et maintenir un inventaire détaillé des actifs informatiques, incluant les dispositifs matériels et logiciels.\n\t- Organiser des évaluations de sécurité périodiques pour les actifs et les utilisateurs, et ajuster les contrôles d’accès en fonction des résultats."
  10_label: "Utilisation de solutions d’authentification à plusieurs facteurs ou d’authentification continue"
  10_desc: "L'entreprise doit : Mettre en place des solutions d’authentification à plusieurs facteurs (MFA) ou d’authentification continue pour sécuriser l’accès aux systèmes critiques.\n\n**Mesures de sécurité :**\n\t- Implémenter l’authentification à plusieurs facteurs (MFA) pour tous les accès sensibles.\n\t- Utiliser des solutions d’authentification continue pour surveiller et vérifier en permanence l’identité des utilisateurs.\n\t- Adopter des systèmes de gestion des accès privilégiés (PAM) pour les comptes à hauts privilèges.\n\t- Intégrer des politiques de rotation et de révocation des clés et des jetons d’authentification.\n\t- Former les employés sur l’importance et l’utilisation des solutions MFA et d’authentification continue.\n\n**Plan d'action :**\n\t- Sélectionner et déployer des solutions MFA adaptées aux besoins de l'organisation.\n\t- Installer des solutions d’authentification continue pour les utilisateurs ayant accès aux systèmes critiques.\n\t- Mettre en place des systèmes PAM pour Gérer les accès des comptes à hauts privilèges de manière sécurisée.\n\t- Développer et documenter des politiques de rotation et de révocation des clés et jetons d’authentification.\n\t- Organiser des sessions de formation pour sensibiliser les employés à l’utilisation et à l’importance des solutions MFA et d’authentification continue."
