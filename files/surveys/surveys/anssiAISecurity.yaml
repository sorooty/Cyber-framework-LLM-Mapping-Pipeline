3:
  title: "Description d'un système d'IA générative"
  1:
    title: "Cycle de vie d'un système d'IA générative"
    1_prefix: "R1"
    1_label: "Intégrer la sécurité dans toutes les phases du cycle de vie d'un système d'IA"
    1_desc: "Des mesures de sécurité doivent être identifiées et appliquées dans chacune des 3 phases du cycle de vie d’un système d’IA : entraînement, déploiement et production. Ces mesures dépendent fortement du scénario de partage de responsabilités retenu et de la sous-traitance associée. Elles doivent également tenir compte des interactions avec d’autres applications ou composants internes ou externes au SI. Il est possible de se référer au guide d’hygiène de l’ANSSI pour disposer d’un socle de base de sécurité à appliquer."
4:
  title: "Scénarios d'attaques sur l'IA générative"
  1_prefix: "R2"
  1_label: "Mener une analyse de risque sur les systèmes d'IA avant la phase d’entraînement"
  1_desc: "L’analyse de risque d’un système d’IA doit intégrer les problématiques suivantes : \n\t - cartographier l’ensemble des éléments en lien avec le modèle d’IA : bibliothèques tierces, sources de données, applications interconnectées, etc.; \n\t - identifier les sous-parties du système d’IA qui traiteront les données de l’organisation, en particulier celles contenues dans les requêtes des utilisateurs; \n\t - prendre en compte le scénario de partage de responsabilités et la question de la sous-traitance pour chacune des phases; \n\t - identifier les impacts directs et indirects en cas de réponses erronées ou malveillantes du modèle d’IA aux utilisateurs; \n\t - considérer la protection des données d’entraînement du modèle d’IA."
5:
  title: "Recommandations"
  1:
    title: "Recommandations générales"
    desc: "L’utilisation de bibliothèques et de modules externes non maîtrisés doit être étudiée dès la conception du projet, afin d’identifier les potentielles vulnérabilités liées à ces modules. L’objectif est de se prémunir au maximum d’une attaque dite supply-chain-attack visant des composants nécessaires au bon fonctionnement du système d’IA. Il est possible de se reporter au guide de l’ANSSI sur le risque numérique ou encore à la documentation de la CISA à ce sujet."
    1_prefix: "R3"
    1_label: "Évaluer le niveau de confiance des bibliothèques et modules externes utilisés dans le système d'IA"
    1_desc: "Il est recommandé de cartographier l’ensemble des bibliothèques et modules externes utilisés dans le cadre du projet et d’évaluer leur niveau de confiance. \n\nℹ️ Au même titre que pour les composants logiciels (bibliothèques et modules externes), il est également primordial d’évaluer les sources de données non maîtrisées par l’entité. Ces sources peuvent être des jeux de données d’entraînement récupérés sur Internet, des jeux de validation de la performance d’un modèle ou encore des jeux de données additionnelles utilisés lors de la phase de production."
    2_prefix: "R4"
    2_label: "Évaluer le niveau de confiance des sources de données externes utilisées dans le système d'IA"
    2_desc: "Il est recommandé de cartographier l’ensemble des sources de données externes utilisées dans le cadre du projet et d’évaluer leur niveau de confiance. \n\nℹ️ De manière générale, il est recommandé d’appliquer des bonnes pratiques de développement sécurisé lors de la conception et de l’implémentation du système d’IA. Ces bonnes pratiques sont parfois regroupées sous le vocable de DevSecOps ou de l’expression security by design. Pour aller plus loin, il est possible de se reporter au guide de l’ANSSI sur ce thème, ou bien à la documentation du NIST à ce sujet, ou encore suivre les préconisations du NCSC-UK et de la CISA."
    3_prefix: "R5"
    3_label: "Appliquer les principes de DevSecOps sur l'ensemble des phases du projet"
    3_desc: "Il est recommandé d’appliquer les bonnes pratiques de développement sécurisé sur l’ensemble des phases du projet, par exemple : \n\t - déployer et sécuriser des chaînes d’intégration et de déploiement en continu (CI/CD) en appliquant le principe de moindre privilège pour l’accès aux outils de ces chaînes CI/CD; \n\t - mettre en œuvre une gestion sécurisée des secrets utilisés dans toutes les phases du projet; \n\t - prévoir des tests de sécurité automatisés sur le code source (analyse statique de code) et lors de l’exécution de ce code source (analyse dynamique de code); \n\t - protéger en intégrité le code source et sécuriser l’accès à celui-ci (authentification multifacteur, signature du code, droits d’accès, etc.); \n\t - recourir à des langages de développement sécurisés (scripts de fine tuning, développement du modèle, maintenance, déploiement, etc.). \n\nℹ️ Afin de pouvoir implémenter un modèle d’IA, il faut stocker les différents paramètres de ce modèle (poids, biais, etc.) dans des fichiers. Plusieurs formats sont disponibles à cet effet, dont certains peuvent présenter un risque d’exécution de code arbitraire, comme par exemple ceux implémentant des fonctionnalités de chargement d’objets sérialisés. Il est donc préférable d’utiliser des formats qui séparent strictement les données de paramètres du modèle et les données de code exécutable de celui-ci."
    4_prefix: "R6"
    4_label: "Utiliser des formats de modèles d'IA sécurisés"
    4_desc: "Il est recommandé d’utiliser des formats à l’état de l’art du point de vue de la sécurité, comme le format safetensor par exemple. Certains formats peu sécurisés, comme le format pickle, sont à proscrire. \n\nℹ️ Les modèles d’IA générative sont amenés à manipuler des données tout au long de leur cycle de vie. Il peut être compliqué d’appliquer des mesures de protection en confidentialité sur ces données, pour les raisons suivantes : \n\t - elles peuvent être issues de sources multiples et sont parfois « mélangées » dans un même jeu : données publiques, données partenaires, données internes, données personnelles, etc. \n\t - leur volume peut être très important, notamment dans le cas de l’entraînement des LLM, ce qui ne facilite pas leur traitement; \n\t - il peut être nécessaire de les mettre à jour régulièrement, notamment lorsque l’on souhaite ré-entraîner le modèle; \n\t - il peut être nécessaire de leur appliquer un pré-traitement pour abaisser leur niveau de confidentialité (anonymisation, suppression de certains champs, etc.); \n\t - elles peuvent être utilisées lors de différentes phases du projet : pendant la phase d’entraînement du modèle mais également en production en cas d’accès à des données additionnelles par le modèle; \n\t - elles peuvent inclure les données d’usage du système d’IA pendant la phase de production : données issues des requêtes des utilisateurs et réponses apportées par le modèle d’IA à ces utilisateurs. \n\n Il est important de bien saisir qu’un modèle d’IA hérite de la sensibilité des données qui ont contribué à l’entraîner et également des données qui servent à le ré-entraîner. Un modèle d’IA peut en effet être vulnérable à un phénomène dit de « régurgitation ». Dans certains cas, celui-ci peut par exemple générer des réponses proches des données d’entraînement, révélant ainsi des informations potentiellement sensibles. \n En fonction du scénario de partage de responsabilités retenu (cf. chapitre 2), les enjeux de confidentialité des données ne seront pas les mêmes, et les mesures techniques permettant de se prémunir d’une exfiltration de données seront à adapter. Par exemple, dans le cas où l’entité souhaite sous-traiter la phase d’entraînement à un prestataire, il est important de s’assurer que les données stockées et traitées chez ce prestataire sont suffisamment protégées en confidentialité (chiffrement à l’état de l’art, cloisonnement des ressources vis-à-vis d’autres clients, sécurisation des clés utilisées, effacement sécurisé après ré-allocation de ressources, etc.). \n Dans le même ordre d’idée, un modèle d’IA propriétaire que l’on souhaite protéger en confidentialité doit faire l’objet de mesures spécifiques de sécurité dans le cas où ce dernier serait stocké dans un environnement qui n’est pas de confiance (ex. : chez un prestataire Cloud ou bien embarqué dans un équipement physiquement exposé comme dans le cas de l’IoT)."
    5_prefix: "R7"
    5_label: "Prendre en compte les enjeux de confidentialité des données dès la conception du système d'IA"
    5_desc: "L’étude du projet doit cartographier l’ensemble des jeux de données utilisés à chaque phase du système d’IA : entraînement (jeux de données d’entraînement), déploiement (jeux de tests) et production (données additionnelles, base de données vectorielle, etc.). Cette étude doit inclure les données d’usage du système d’IA en production, à savoir les requêtes des utilisateurs ainsi que les réponses apportées par le modèle d’IA. L’analyse peut également traiter le cas de la protection en confidentialité des paramètres du modèle lui-même, par exemple pour des modèles propriétaires. \n\nℹ️ L’accès à un système d’IA complexifie également l’application du besoin d’en connaître des utilisateurs. Il faut distinguer ici plusieurs catégories de données : \n\t - Les données d’entraînement : la gestion de droits d’accès pour les utilisateurs n’est pas possible sur ces données du fait du design des réseaux de neurones; \n\t - Les données additionnelles en production : la gestion de droits d’accès est possible mais elle est dépendante des possibilités offertes par les outils utilisés (RBAC) pour stocker les informations (services de gestion de documents internes, base de données vectorielle, etc.); \n\t - Les données d’usage : les requêtes des utilisateurs ainsi que les réponses peuvent contenir des données sensibles. Elles sont temporairement stockées lors du traitement dans le système d’IA et parfois utilisées pour ré-entraîner le modèle (ex. : alignement avec RLHF - Reinforcement learning from human feedback). \n\n La question du besoin d’en connaître doit ainsi se reposer à chaque ré-entraînement du modèle, y compris sur des données issues de l’usage du modèle en production (données additionnelles métier, requêtes des utilisateurs, etc.)."
    6_prefix: "R8"
    6_label: "Prendre en compte la problématique de besoin d'en connaître dès la conception du système d'IA"
    6_desc: "Il est important de définir en amont du projet les options structurantes du modèle pour gérer le besoin d’en connaître : \n\t - le choix des données utilisées pour l’entraînement (sans la possibilité de gérer des droits d’accès) et des données additionnelles en production (avec la possibilité de gérer des rôles et des droits d’accès); \n\t - la stratégie d’apprentissage du modèle, c’est-à-dire à quel moment est-ce que l’on ré-entraîne le modèle et sur la base de quelles données (données additionnelles métier, requêtes des utilisateurs, réponses du modèle, etc.). \n\nℹ️ Les IA génératives LLM ont pour la plupart un comportement non-déterministe, et elles peuvent également être sujet à des hallucinations. Cette incertitude sur la réponse obtenue pour une requête donnée implique une plus grande vigilance sur les conséquences indirectes de ces réponses. Ainsi, les interactions d’un système d’IA avec d’autres ressources du SI doivent proscrire l’exécution d’actions automatisées critiques pour l’organisation. \n\n Ce principe de précaution doit prévaloir et un système d’IA générative ne doit pas pouvoir prendre des décisions critiques ayant un impact fort sur le métier ou la protection des biens et des personnes, sans un contrôle humain (ex. : validation dans une IHM). Dans ces cas particuliers, la capacité de discernement humaine permet de réduire le risque de scénarios qui peuvent représenter un danger pour l’organisation. \n\n Il est par exemple important de ne pas utiliser un système d’IA pour automatiser des actions d’administration critiques sur l’infrastructure technique de l’entité (ex. : découverte et déploiement automatique de configurations réseaux ou de règles de pare-feux)."
    7_prefix: "R9"
    7_label: "Proscrire l'usage automatisé de systèmes d'IA pour des actions critiques sur le SI"
    7_desc: "Un système d’IA doit être configuré de manière à ne pas être en mesure d’exécuter de manière automatisée des actions critiques sur le SI. \n Ces actions peuvent être des actions critiques d’un point de vue métier (transactions bancaires, production de contenu public, impact direct sur des personnes, etc.) ou bien des actions critiques sur l’infrastructure du SI (reconfiguration de composants réseaux, créations d’utilisateurs à privilège, déploiement de serveurs virtuels, etc.). \n\nℹ️ Les rôles et les droits d’accès des développeurs et des administrateurs du système d’IA doivent être strictement définis et appliqués dès le début du projet. Les principes d’administration sécurisée, tels que décrits dans le guide de l’ANSSI à ce sujet doivent être appliqués dans toutes les phases du cycle de vie du système d’IA."
    8_prefix: "R10"
    8_label: "Maîtriser et sécuriser les accès à privilèges des développeurs et des administrateurs sur le système d'IA"
    8_desc: "L’ensemble des opérations à privilèges sur le système d’IA doit respecter les bonnes pratiques d’administration sécurisée, notamment : \n\t - les opérations à privilège doivent être définies et leur déclenchement doit être validé : ré-entraînement, modification des jeux de données, nouvelle interconnexion avec une application, changement d’hébergement, etc.; \n\t - les opérations à privilège doivent être réalisées avec des comptes dédiés et depuis un poste d’administration dédié à cet usage ; \n\t - le principe de moindre privilège doit être appliqué et l’usage de jetons d’authentification (token) temporaires doit être privilégié; \n\t - l’environnement de développement doit être maîtrisé et administré au même niveau de sécurité que l’environnement de production. \n\nℹ️ L’hébergement du système d’IA, quelle que soit sa phase, doit être étudié. Le niveau de sécurité doit être cohérent avec les besoins de sécurité du projet, et notamment les besoins en confidentialité des données utilisées dans chacune des phases. \n\n Ce point doit notamment être strictement respecté pour la phase d’entraînement du modèle car des menaces importantes existent lors de cette phase, comme cela a été vu précédemment dans le chapitre 4. \n\n⚠️ Attention \n Les modèles d’IA sont considérés du même niveau de sensibilité que les données qui ont servi à sa conception et à son entraînement. La règle R9 de la circulaire « Cloud au centre » doit s’appliquer pour le cas de l’administration publique."
    9_prefix: "R11"
    9_label: "Héberger le système d'IA dans des environnements de confiance cohérents avec les besoins de sécurité"
    9_desc: "L’hébergement du système d’IA lors des 3 phases du cycle de vie doit être cohérente avec les besoins de sécurité du projet, et notamment les besoins en confidentialité et en intégrité. En particulier, la sécurisation des données d’entraînement du modèle (au repos, en transit, lors d’un traitement) ne doit pas être négligée. \n\nℹ️ Les 3 environnements d’entraînement, de déploiement et de production d’un système d’IA doivent être cloisonnés entre eux. Cette mesure permet de se prémunir d’un risque de latéralisation entre les environnements. Cela est d’autant plus important que les populations ayant accès à chaque environnement ne sont généralement pas les mêmes"
    10_prefix: "R12"
    10_label: "Cloisonner chaque phase du système d'IA dans un environnement dédié"
    10_desc: "Il est recommandé de cloisonner les 3 environnements techniques correspondant à chacune des phases du cycle de vie du système d’IA. Ce cloisonnement peut porter sur : \n\t - un cloisonnement réseau : chaque environnement est intégré dans un réseau physiquement ou logiquement dédié; \n\t - un cloisonnement système : chaque environnement dispose de ses propres serveurs physiques ou hyperviseurs dédiés; \n\t - un cloisonnement du stockage : chaque environnement dispose de son propre matériel de stockage ou de disques dédiés. Au minimum, un cloisonnement logique est appliqué; \n\t - un cloisonnement des comptes et des secrets : chaque environnement dispose de ses propres comptes utilisateurs et administrateurs et de secrets distincts. \n\nℹ️ Dans le cas d’un système d’IA exposé sur Internet, il est recommandé de suivre les préconisations de l’ANSSI pour la conception d’une passerelle Internet sécurisée."
    11_prefix: "R13"
    11_label: "Implémenter une passerelle Internet sécurisée dans le cas d'un système d'IA exposé sur Internet"
    11_desc: "Dans le cas d’un système d’IA exposé sur Internet, il est recommandé de suivre les bonnes pratiques de cloisonnement du guide de l’ANSSI à ce sujet, notamment : \n\t - dédier une fonction de reverse-proxy avant l’accès au service web du système d’IA ; \n\t - mettre en place deux zones logiques pour le filtrage réseau à l’aide de pare-feux : un filtrage externe en frontal d’Internet et un filtrage interne avant l’accès au système d’IA; \n\t - ne pas exposer un annuaire interne de l’entité pour l’authentification sur le système d’IA; \n\t - éviter de mutualiser sur un même hyperviseur des fonctions de sécurité distinctes de la passerelle Internet sécurisée (pare-feux, reverse-proxy, serveur de journalisation, etc.). \n\nℹ️ Si l’entité fait le choix d’un Cloud public pour exposer son service, il est recommandé de choisir un prestataire qualifié SecNumCloud si les besoins de sécurité l’exigent."
    12_prefix: "R14"
    12_label: "Privilégier un hébergement SecNumCloud dans le cas d'un déploiement d'un système d'IA dans un Cloud public"
    12_desc: "Si l’entité fait le choix d’utiliser un hébergement dans un Cloud public, il est recommandé de privilégier une offre de confiance SecNumCloud dans les cas suivants : \n\t - les données traitées par le système d’IA sont considérées comme sensibles; \n\t - l’impact du système d’IA sur le métier est considéré comme critique ; \n\t - les utilisateurs du système d’IA ne sont pas considérés comme de confiance.\n\nℹ️ Lors de la conception du projet, il faut prévoir systématiquement un mode dégradé sans IA pour répondre aux besoins métier, en cas d’indisponibilité ou de défaillance du système nominal."
    13_prefix: "R15"
    13_label: "Prévoir un mode dégradé des services métier sans système d'IA"
    13_desc: "Afin de prévenir des dysfonctionnements ou des incohérences dans les réponses apportées par le modèle d’IA, il est recommandé de prévoir au minimum une procédure de contournement du système d’IA pour les utilisateurs, afin de répondre aux besoins métier. \n\nℹ️ Le déploiement de systèmes d’IA générative et de LLM implique généralement l’usage de GPU dans un objectif de performances du système, que ce soit dans la phase d’entraînement ou de production. \n Ces GPU peuvent potentiellement traiter des données sensibles en lien avec les opérations du modèle d’IA. Dans un objectif de se protéger d’une fuite de données, il est recommandé de dédier ces composants matériels GPU au système d’IA et de ne pas les mutualiser avec d’autres applications métier du SI. Les GPU peuvent en revanche être mutualisés entre plusieurs modèles d’IA, sous réserve que ces derniers correspondent à un même niveau de sensibilité et à des besoins de sécurité homogènes."
    14_prefix: "R16"
    14_label: "Dédier les composants GPU au système d'IA"
    14_desc: "Il est recommandé de dédier les composants physiques GPU aux traitements réalisés par le système d’IA. Dans le cas de la virtualisation, il est recommandé que les hyperviseurs ayant accès aux cartes GPU soient dédiés au système d’IA, ou bien au minimum qu’il y ait une fonction de filtrage matériel (ex. : IOMMU) permettant de restreindre les accès des machines virtuelles à la mémoire de ces cartes GPU. \n\nℹ️Comme la plupart des applications métier, les systèmes d’IA peuvent être soumis à des attaques par canaux auxiliaires. Ces attaques peuvent avoir pour objectifs d’exfiltrer des informations sensibles ou de perturber le bon fonctionnement des systèmes d’IA. Si la plupart de ces attaques ne sont pas propres à un système d’IA, certaines peuvent néanmoins s’appuyer sur des mécanismes spécifiques aux systèmes d’IA génératives."
    15_prefix: "R17"
    15_label: "Prendre en compte les attaques par canaux auxiliaires sur le système d'IA"
    15_desc: "Il est recommandé de s’assurer que le système d’IA n’est pas vulnérable à des attaques par canaux auxiliaires (temporels, consommation, etc.) qui pourraient par exemple permettre à un attaquant de reconstruire une réponse apportée par un modèle d’IA."
  2:
    title: "Recommandations pour la phase d’entraînement"
    desc: "La question de la confidentialité des données a fait l’objet d’une recommandation générale précédemment (cf. R7). En particulier, et au vu des nombreuses vulnérabilités publiées sur les outils d’IA générative, il est préférable de partir du postulat qu’un utilisateur ayant accès à un modèle d’IA entraîné pourrait potentiellement avoir accès aux données d’entraînement de ce même modèle. \n\n Pour réduire les risques liés à la confidentialité des données d’entraînement, il est parfois envisagé de recourir à un processus d’anonymisation ou bien de générer un jeu de données synthétiques à partir des données brutes d’origine. Ces mesures peuvent répondre dans certains cas aux enjeux de protection de l’information, mais il convient néanmoins d’être vigilant sur l’existence d’attaques visant à retrouver l’information initiale à partir de données anonymisées ou synthétiques : attaques par inférence d’attribut ou d’appartenance, ré-identification à partir de croisements avec d’autres jeux de données, etc"
    1_prefix: "R18"
    1_label: "Entraîner un modèle d'IA uniquement avec des données légitimement accessibles par les utilisateurs"
    1_desc: "Il est fortement recommandé d’entraîner un modèle avec des données dont la sensibilité est cohérente avec le besoin d’en connaître des utilisateurs. \n\nℹ️ Comme cela a été vu précédemment, des attaques ciblant spécifiquement la phase d’entraînement d’un modèle sont possibles, comme par exemple l’injection de données malveillantes dans les jeux de données d’entraînement, ou encore la modification de certaines données pour générer un dysfonctionnement du modèle, une fois celui-ci déployé en production."
    2_prefix: "R19"
    2_label: "Protéger en intégrité les données d’entraînement du modèle d'IA"
    2_desc: "Il est recommandé de s’assurer de l’intégrité des données d’entraînement du modèle tout au long du cycle d’entraînement. Cette protection peut prendre la forme d’une vérification systématique de la signature ou de l’empreinte (hash) des fichiers utilisés ou bien des archives compressés de l’ensemble de ces données."
    3_prefix: "R20"
    3_label: "Protéger en intégrité les fichiers du système d'IA"
    3_desc: "Il est recommandé de protéger en intégrité les fichiers du modèle entraîné, et de contrôler régulièrement que ceux-ci n’ont pas été altérés. La recommandation vaut également par extension pour tous les fichiers inhérents au fonctionnement du système d’IA (scripts, binaires, etc.). \n\nℹ️ Dans la majorité des cas d’usage, un modèle d’IA entraîné ne doit pas faire l’objet d’une modification ou d’un ajustement constant de ses paramètres. Dans le cas où l’on constate un dysfonctionnement, ou bien lorsque l’on cherche à optimiser les performances du modèle, il est préférable d’exécuter les opérations de ré-entraînement de ce dernier en utilisant l’environnement d’entraînement dédié à cet usage. \n\n A ce titre, les méthodes d’apprentissage en continu ou aussi appelées apprentissage en ligne (le modèle apprend en temps-réel à partir des données envoyées en entrée) sont à éviter au possible. En effet, l’utilisation de méthodes d’apprentissage hors ligne, à partir de jeux de données sélectionnés et testés, réduit les risques de dysfonctionnement du modèle ou d’empoisonnement de celui-ci. \n\n Le ré-entraînement d’un modèle d’IA peut être réalisé de manière récurrente et fixe (ex. : tous les mois), être déclenché lorsqu’un écart de performance franchit un seuil donné ou lorsque les données d’entraînement ne sont plus pertinentes, ou encore à la demande de manière ponctuelle"
    4_prefix: "R21"
    4_label: "Proscrire le ré-entraînement du modèle d'IA en production"
    4_desc: "Il est fortement recommandé de ne pas ré-entraîner un modèle d’IA directement en production. Cette action de ré-entraînement doit démarrer avec le cycle en 3 phases, dans les environnements adéquats pour chacune des phases."
  3:
    title: "Recommandations pour la phase de déploiement"
    desc: "Le déploiement d’un système d’IA générative doit s’appuyer sur un environnement de déploiement sécurisé, reposant par exemple sur des chaînes CI/CD maîtrisées et durcies. \n\n Ces chaînes CI/CD doivent être opérées depuis un SI d’administration et depuis des postes d’administrateurs dédiées et durcis."
    1_prefix: "R22"
    1_label: "Sécuriser la chaîne de déploiement en production des systèmes d'IA"
    1_desc: "Il est recommandé d’opérer le déploiement des systèmes d’IA générative depuis un SI d’administration, en respectant les bonnes pratiques du guide d’administration sécurisée de l’ANSSI. \n\nℹ️ Il faut prévoir une phase d’audit de sécurité par des équipes spécialisées et formées aux spécificités des systèmes d’IA. Cette phase doit avoir lieu avant le déploiement en production afin de tester les vulnérabilités inhérentes aux systèmes d’IA (attaques adverses, etc.)."
    2_prefix: "R23"
    2_label: "Prévoir des audits de sécurité des systèmes d'IA avant déploiement en production"
    2_desc: "Il est recommandé de prévoir des tests de robustesse et de sécurité des systèmes d’IA. Ces tests peuvent être : \n\t - des tests d’intrusion standards sur les composants techniques usuels d’un système d’IA : serveurs web, orchestrateur, base de données, etc. \n\t - des tests de sécurité sur les développements réalisés dans le système d’IA (via des outils SAST ou DAST par exemple); \n\t - des tests automatisés visant spécifiquement des vulnérabilités liées aux modèles d’IA (attaques adverses, extraction du modèle, etc.); \n\t - des tests manuels d’auditeurs visant spécifiquement à tester la robustesse d’un modèle d’IA générative sur des scénarios d’attaques plus sophistiqués. \n\nℹ️ Pour la réalisation d’audits de sécurité sur un système d’IA générative, il est possible de faire appel à des prestataires PASSI qualifiés par l’ANSSI"
    3_prefix: "R24"
    3_label: "Prévoir des tests fonctionnels métier des systèmes d'IA avant déploiement en production"
    3_desc: "Il est recommandé de prévoir des tests de performance et de qualité des réponses apportées par un système d’IA générative. \n\nℹ️ Les tests fonctionnels du système d’IA peuvent avoir lieu en continu à une fréquence donnée et pas uniquement lors de déploiements. Cela peut permettre de détecter en avance de phase un dysfonctionnement du modèle et ainsi corriger de manière plus réactive."
  4:
    title: "Recommandations pour la phase de production"
    desc: "Comme indiqué précédemment, il est difficile d’appliquer le principe de besoin d’en connaître sur les données d’entraînement d’un modèle, celui-ci pouvant subir des attaques qui visent à extraire ces données par interrogation du modèle (régurgitation). \n\n De même, certaines requêtes malveillantes peuvent avoir comme objectif le détournement du service d’IA générative, par exemple en provoquant des hallucinations ou des réponses erronées. Dans une démarche de défense en profondeur, il est recommandé d’étudier la possibilité de détecter ou de bloquer certaines requêtes malveillantes ayant par exemple pour objectif d’extraire des informations du modèle ou des données additionnelles (ces données additionnelles pouvant inclure les entrées des utilisateurs dans certains cas d’usage). \n\n Cette protection peut également être pertinente pour se prémunir du risque de fuite du modèle. En effet, si le modèle a été entraîné sur des données sensibles, la fuite des paramètres du modèle peut entraîner la fuite de certaines de ces données par certaines attaques (ex. : attaque par inversion de modèle ou attaque par inférence d’appartenance). À ce titre, les réponses aux utilisateurs doivent être les plus simples possibles (chaîne de caractères exclusivement) et ne doivent pas retourner de vecteur de score ayant servi à la prédiction, ni tout autre mécanisme interne au modèle. \n\n Enfin, il peut être pertinent, selon les cas d’usage, de définir une limite à la taille des réponses apportées par le modèle d’IA. Cela peut ainsi réduire le risque de fuite de données par régurgitation."
    1_prefix: "R25"
    1_label: "Protéger le système d'IA en filtrant les entrées et les sorties des utilisateurs"
    1_desc: "Il est recommandé de mettre en place des fonctions permettant de se prémunir d’une fuite de données ou d’une fuite de modèle dans les réponses : \n\t - une fonction de filtre de requêtes malveillantes des utilisateurs avant envoi au modèle ; \n\t - une fonction de filtre de requêtes jugées non légitimes d’un point de vue métier ; \n\t - une fonction de filtre d’informations internes du modèle (paramètres, entraînement) dans les réponses ; \n\t - une fonction de filtre d’informations définies comme sensibles dans les réponses (ex. : coordonnées personnelles, références de projets, etc.); \n\t - une limite sur la taille des réponses (nombre de caractères maximum). \n\nℹ️ Les interactions du système d’IA avec d’autres applications métier ou d’autres ressources techniques du SI peuvent être une source de vulnérabilités. \n\n Ces interactions prennent souvent la forme de plugins proposés par les éditeurs de modèles d’IA. Ces plugins vont ainsi permettre d’interconnecter le système d’IA avec des outils bureautiques, des réseaux sociaux, ou encore des composants d’infrastructure potentiellement critiques (gestionnaire d’identités, ressources réseaux, etc.). \n\n Ces interactions peuvent également faciliter la latéralisation d’un attaquant sur le SI, si celui-ci profite d’une vulnérabilité sur le système d’IA. \n\n La littérature évoque très souvent les risques d’injection de requête indirecte (indirect prompt injection) et les problèmes qui peuvent résulter de l’envoi de données non-maîtrisées à un modèle d’IA générative (par exemple le contenu d’un mail reçu ou d’une page Web issue d’une recherche). Ces usages sont d’autant plus problématiques dans le cas où des actions pourraient être effectuées sans une validation humaine (cf. recommandation R9). \n\n Il est donc primordial d’avoir une maîtrise des interactions du système d’IA avec d’autres ressources du SI."
    2_prefix: "R26"
    2_label: "Maîtriser et sécuriser les interactions du système d'IA avec d'autres applications métier"
    2_desc: "L’ensemble des interactions et des flux réseaux du système d’IA doit être documenté et validé. Les flux réseaux entre le système d’IA et d’autres ressources doivent respecter l’état de l’art en matière de sécurité : \n\t - ils doivent être strictement filtrés au niveau réseau, chiffrés et authentifiés (ex. : en suivant le guide TLS de l’ANSSI [22]); \n\t - ils doivent utiliser des protocoles sécurisés (ex. : OpenID Connect) en cas d’usage d’un fournisseur d’identité [23]; \n\t - ils doivent intégrer un contrôle des autorisations d’accès à la ressource en complément de l’authentification; \n\t - ils doivent faire l’objet d’une journalisation au niveau de granularité adéquat."
    3_prefix: "R27"
    3_label: "Limiter les actions automatiques depuis un système d'IA traitant des entrées non-maîtrisées"
    3_desc: "Il est fortement recommandé de limiter voire de proscrire les actions automatiques sur le SI déclenchées depuis un système d’IA et à partir d’entrées non-maîtrisées (ex. : données issues d’Internet ou de mails, etc.). \n\nℹ️ En fonction du cas d’usage du système d’IA et de sa criticité d’un point de vue métier, il peut être opportun de le déployer dans un ou plusieurs environnements dédiés, c’est-à-dire non mutualisés avec d’autres applications métier de l’entité."
    4_prefix: "R28"
    4_label: "Cloisonner le système d'IA dans un ou plusieurs environnements techniques dédiés"
    4_desc: "Il est recommandé que le système d’IA soit cloisonné dans des zones logiques dédiées, afin de limiter les risques de latéralisation d’un attaquant qui aurait compromis ce système. \n\nℹ️ La journalisation des actions sur le système d’IA doit être réalisée avec une granularité d’information adéquate, en particulier sur les entrées et les sorties du modèle d’IA. \n\n Dans un objectif de traçabilité et de compréhension du système d’IA, il est important de bien distinguer les requêtes réalisées par les utilisateurs et les données réellement envoyées au modèle d’IA. En effet, pour des raisons de performance mais aussi de sécurité, les requêtes des utilisateurs peuvent faire l’objet d’un pré-traitement et d’une mise en forme spécifique avant l’envoi au modèle. \n\n Ces deux informations sont cruciales pour faciliter la gestion d’un incident et doivent pouvoir être tracées dans des journaux applicatifs du système d’IA. L’objectif est de pouvoir reconstituer entièrement un événement sur le système d’IA, en cas de requête malveillante par exemple. \n\n En ce qui concerne l’architecture d’un système de journalisation, il est possible de s’appuyer sur le guide généraliste de l’ANSSI à ce sujet."
    5_prefix: "R29"
    5_label: "Journaliser l'ensemble des traitements réalisés au sein du système d'IA"
    5_desc: "Il est recommandé de journaliser au bon niveau de granularité l’ensemble des traitements réalisés sur le système d’IA, notamment : \n\t - les requêtes des utilisateurs (en prenant garde à leur protection si ces requêtes contiennent des données sensibles); \n\t - les traitements réalisés en entrée sur cette requête avant l’envoi au modèle; \n\t - les appels à des plugins; \n\t - les appels à des données additionnelles; \n\t - les traitements réalisés par les filtres en sortie; \n\t - les réponses aux utilisateurs. \n\n ⚠️ Attention \n La journalisation des données des utilisateurs doit respecter les exigences de la CNIL concernant la protection des données personnelles (comme prévu par le RGPD) et notamment pour la durée de conservation de ces données sur le système d’IA."
  5:
    title: "Cas particulier de la génération de code source assistée par l'IA"
    desc: "Les outils d’IA générative peuvent être spécialisés et spécifiquement entraînés pour générer du code source dans plusieurs langages de programmation. \n\n Ces moyens peuvent permettre aux développeurs un gain de temps mais comportent aussi des risques sur la qualité du code (introduction de vulnérabilités) ou d’insertion de porte dérobée dans le cas où un attaquant aurait compromis le modèle. \n\n Il est donc important de faire preuve de vigilance sur le code source généré par IA."
    1_prefix: "R30"
    1_label: "Contrôler systématiquement le code source généré par IA"
    1_desc: "Le code source généré par IA doit faire l’objet de mesures de sécurité afin de vérifier son innocuité : \n\t - proscrire l’exécution automatique de code source généré par IA dans l’environnement de développement ; \n\t - proscrire le commit automatique de code source généré par IA dans les dépôts; \n\t - intégrer un outil d’assainissement de code source généré par IA dans l’environnement de développement ; \n\t - vérifier l’innocuité des bibliothèques référencées dans le résultat du code source généré par IA ; \n\t - faire contrôler régulièrement par un humain la qualité du code source généré à partir de requêtes types suffisamment sophistiquées."
    2_prefix: "R31"
    2_label: "Limiter la génération de code source par IA pour des modules critiques d'applications"
    2_desc: "Il est fortement recommandé de ne pas utiliser un outil d’IA générative pour générer des blocs de code source destinés à des modules critiques d’applications : \n\t - les modules de cryptographie (authentification, chiffrement, signature, etc.); \n\t - les modules de gestion des droits d’accès des utilisateurs et administrateurs; \n\t - les modules de traitement de données sensibles."
    3_prefix: "R32"
    3_label: "Sensibiliser les développeurs sur les risques liés au code source généré par IA"
    3_desc: "Il est recommandé d’effectuer des campagnes de sensibilisation sur les risques liés à l’utilisation de code source généré par IA. Cette sensibilisation peut s’appuyer sur des rapports publics sur ce sujet ou bien des papiers de recherche démontrant la présence de vulnérabilités dans le code généré par IA. \n En complément, les développeurs peuvent également être formés sur les outils d’IA pour l’optimisation de leurs requêtes (prompt engineering) afin d’améliorer la qualité et la sécurité du code généré. \n\nℹ️ Selon les cas d’usages, il peut également être pertinent d’entraîner spécifiquement un modèle (étape d’alignement) pour qu’il ne puisse pas être en mesure de générer du code volontairement malveillant."
  6:
    title: "Cas particulier de services d'IA grand public exposés sur Internet"
    desc: "Dans le cas où l’entité souhaite proposer au grand public un service reposant sur de l’IA générative, il convient d’apporter une vigilance particulière à la sécurisation de ce service, à cause de sa forte exposition. \n\n L’atteinte à l’image ou à la réputation de l’entité peut être une menace supplémentaire à identifier lors de l’analyse de risque."
    1_prefix: "R33"
    1_label: "Durcir les mesures de sécurité pour des services d'IA grand public exposés sur Internet"
    1_desc: "Il est recommandé d’apporter une attention particulière sur certaines mesures de sécurité pour les services exposés au grand public, notamment : \n\t - entraîner le modèle d’IA uniquement à partir de données publiques; \n\t - s’assurer que les utilisateurs du système d’IA ont fait l’objet d’une authentification au préalable; \n\t - analyser systématiquement les requêtes des utilisateurs sur le système d’IA; \n\t - faire un contrôle et une validation des réponses avant l’envoi aux utilisateurs; \n\t - protéger en confidentialité les données des utilisateurs (historique des requêtes et des réponses, etc.); \n\t - mettre en place des mesures contre les dénis de service distribués (DDoS); \n\t - sécuriser le service web en frontal des utilisateurs."
  7:
    title: "Cas particulier de l'utilisation de solutions d'IA générative tierces"
    desc: "Dans cette dernière section, le guide traite le cas particulier où l’entité n’est pas en situation de gestionnaire et de maîtrise d’un service d’IA générative, mais est cliente d’un service tiers d’IA générative (cf. scénarios de partage de responsabilités du chapitre 2). L’objet de cette dernière section est de faire un rappel des points de vigilance à prendre en compte pour les utilisateurs de ces services tiers. \n\n De par leur facilité d’usage, il est tentant de recourir à des outils d’IA générative disponibles sur Internet pour traiter des données métier, par exemple pour la traduction de textes. Le fait d’envoyer des informations (texte, images, documents) à un service d’IA générative grand public revient à déposer ces mêmes informations sur un espace de stockage leur appartenant. \n\n Le cloisonnement entre les clients ainsi que la protection en confidentialité des données envoyées au système d’IA sur Internet ne sont pas maîtrisés et reposent uniquement sur la confiance envers le prestataire. À ce titre, il est important de noter que dans la majorité des offres, les données envoyées au service sont collectées et utilisées par le prestataire à des fins d’optimisation des modèles. \n\n Il est donc primordial de ne surtout pas envoyer de données sensibles à des services d’IA générative tiers grand public comme par exemples ChatGPT, Gemini, Copilot, DeepL (Traduction de texte) ou encore Perplexity pour ne citer que les plus populaires. Les données concernées sont notamment : \n\t - des données de niveau Diffusion Restreinte ou classifiées de défense; \n\t - des travaux de recherche relevant de la PPST; \n\t - des données personnelles (vie privée, coordonnées, etc.); \n\t - des données contractuelles, juridiques ou financières de l’entreprise; \n\t - des secrets informatiques, comme des mots de passe ou des jetons d’authentification (clés d’API)."
    1_prefix: "R34"
    1_label: "Proscrire l'utilisation d'outils d'IA générative sur Internet pour un usage professionnel impliquant des données sensibles"
    1_desc: "L’entité cliente n’ayant pas la maîtrise du service d’IA générative, il n’est pas possible de s’assurer que la protection en confidentialité des données soumises en entrée respecte les besoins de sécurité de l’entité. Par mesure de précaution, il est donc obligatoire de ne jamais intégrer de données sensibles de l’entité dans les requêtes des utilisateurs. \n\n ⚠️ Attention \n Cette recommandation concerne également l’utilisation d’outils d’IA générative dans le but de générer des jeux de données synthétiques pour l’entraînement ou le finetuning d’un modèle d’IA. \n\nℹ️ Certains outils tiers d’IA générative peuvent proposer des connexions avec des outils bureautiques ou des applications métier usuelles sur Internet. Une attention particulière doit être portée à la configuration des droits d’accès des outils d’IA générative sur les données métier de l’entité : mails, espace documentaire, dépôts de code source, services d’audioconférence et de visioconférence, etc."
    2_prefix: "R35"
    2_label: "Effectuer une revue régulière de la configuration des droits des outils d'IA générative sur les applications métier"
    2_desc: "Il est recommandé de faire une revue des droits d’accès des outils d’IA générative dès l’activation du produit dans l’entité, afin de s’assurer que les droits positionnés par défaut ne sont pas trop laxistes ou trop ouverts par conception. Enfin, une revue régulière des droits d’accès doit être réalisée (ex. : tous les mois), afin notamment de s’assurer que les mises à jour fonctionnelles et de sécurité du produit ne viennent pas impacter le besoin d’en connaître pour les utilisateurs."
