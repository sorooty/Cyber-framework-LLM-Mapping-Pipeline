4:
  title: "Conditions d'attribution d'un certificat"
  1_label: "Conditions d'attribution d'un certificat"
  1_desc: "La certification d'un Hébergeur nécessite :\n→Qu'il ait mis en œuvre un Système de Management de la Sécurité de l'Information (SMSI) certifié selon la norme ISO 27001, complétée des exigences définies au chapitre 5\n→Que le domaine d'application de ce SMSI couvre l'ensemble des activités d'hébergement de données de santé
de l'Hébergeur\n→Que les contrats conclus avec ses clients répondent aux exigences définies au chapitre 6\n→Qu'il respecte les exigences relatives à la souveraineté définies au chapitre 7\n→Qu'il communique à ses clients la présentation des garanties formalisée conformément au chapitre 8"
5:
  title: "Exigences relatives au SMSI"
  1_label: "Compréhension de l'organisation et de son contexte"
  1_desc: "Dans la détermination de ses enjeux externes et internes, l'Hébergeur doit prendre en compte le fait que sa mission lui impose la protection des DSCP qui lui sont confiées par ses clients"
  1_tags: "#Contexte de l'organisation#ISO27001 4.1"
  2_label: "Compréhension des besoins et des attentes des parties intéressées"
  2_desc: "Dans la détermination des exigences des parties intéressées, l'Hébergeur doit prendre en compte le cadre juridique applicable en matière de protection des DSCP."
  2_tags: "#Contexte de l'organisation#ISO27001 4.2"
  3_label: "Détermination du domaine d'application du SMSI"
  3_desc: "Le domaine d'application du SMSI doit comprendre l'ensemble des traitements de DSCP assurés par l'Hébergeur. Il doit couvrir tous les moyens et processus de traitement des DSCP, notamment les sauvegardes et les transferts de supports matériels de l'information."
  3_tags: "#Contexte de l'organisation#ISO27001 4.3"
  4_label: "Appréciation des risques"
  4_desc: "Lors de l'appréciation des risques, l'Hébergeur doit a minima envisager les événements suivants :\n\tA. Défaillance des supports matériels de l'information due à des menaces physiques et environnementales.\n\tB. Perte de contrôle de supports matériels de l'information, notamment à l'occasion :\n\t\ta. De copie des DSCP sur des supports portables\n\t\tb. De matérialisation éventuelle sous format documents papier\n\t\tc. De réallocation des espaces de stockage.\n\tC. Dégradation, compromission ou rupture d'un flux d'information interne ou externe sous la responsabilité de l'Hébergeur.\n\tD. Défaillance de la maîtrise des accès attribués, que ce soit aux personnels sous le contrôle de l'organisation ou à ceux désignés par ses clients :\n\t\ta. Attribution, modification et retrait des droits d'accès\n\t\tb. Distribution des moyens d'identification électroniques\n\t\tc. Traçabilité et imputabilité des accès\n\t\td. Accès occasionnels lors des audits et tests d'intrusion.\n\tE. Défaillance de la maîtrise des interventions, qu'elles soient à l'initiative de l'organisation ou commanditées par un client.\n\tF. Usages imprévus du service, par maladresse ou malveillance.\n\tG. Défaillances matérielles ou logicielles, avec incapacité à respecter les engagements de continuité ou de reprise d'activité.\n\tH. Sujétion de l'Hébergeur ou des éventuels sous-traitants à des législations extra-européennes pouvant entraîner une violation des DSCP"
  4_tags: "#ISO27001 6.1.2"
  5_label: "Traitement des risques"
  5_desc: "En cas de recours à la sous-traitance, l'Hébergeur doit s'assurer qu'il maîtrise les changements des mesures techniques et organisationnelles de ses sous-traitants permettant de traiter les risques identifiés."
  5_tags: "#ISO27001 6.1.3"
  6_label: "Traitement des risques"
  6_desc: "Afin de réduire les risques d'usage imprévu du système, l'Hébergeur doit s'assurer que :\n→Les interfaces proposées aux clients sont disponibles au moins en langue française\n→Le support de premier niveau est au moins en langue française."
  6_tags: "#ISO27001 6.1.3"
  7_label: "Traitement des risques"
  7_desc: "La déclaration d'applicabilité doit être disponible en langue française pour les auditeurs qui en feront la demande."
  7_tags: "#ISO27001 6.1.3"
  8_label: "Objectifs de sécurité de l'information et plans pour les atteindre"
  8_desc: "Les objectifs de sécurité de l'information établis par l'Hébergeur doivent intégrer la protection des DSCP qui lui sont confiées par ses clients et comporter le respect des obligations du RGPD."
  8_tags: "#Planification#ISO27001 6.2 "
  9_label: "Sensibilisation"
  9_desc: "Les personnels travaillant pour l'Hébergeur doivent être sensibilisés à la criticité en termes de disponibilité, de confidentialité et d'intégrité des DSCP hébergées. Cette exigence s'applique également au personnel des sous-traitants éventuels de l'Hébergeur."
  9_tags: "#Supports#ISO27001 7.3"
  10_label: "Communication"
  10_desc: "L'Hébergeur doit :\n→Maintenir une liste des points de contact pour chacun des clients. Ce point de contact doit être en mesure de désigner à l'Hébergeur un professionnel de santé habilité à accéder aux DSCP lorsque cela est nécessaire\n→Etre en capacité de transmettre sans délai cette liste à l'autorité compétente sur demande, notamment en cas de suspension ou de retrait de la certification."
  10_tags: "#Supports#ISO27001 7.4"
  11_label: "Communication"
  11_desc: "L'Hébergeur doit communiquer à ses clients :\n→Une copie du certificat de conformité HDS. Cette copie constitue une garantie pour le Client de l'Hébergeur du respect des exigences de conformité\n→Le certificat de ses sous-traitants participant à l'activité d'hébergement lorsqu'ils sont certifiés HDS."
  11_tags: "#ISO27001 7.4"
  12_label: "Planification et contrôle opérationnels"
  12_desc: "L'Hébergeur doit planifier et contrôler la répartition des responsabilités en termes de sécurité de l'information entre l'Hébergeur et son client."
  12_tags: "#Fonctionnement#ISO27001 8.1 "
  13_label: "Traitement des risques"
  13_desc: "En cas de recours à un sous-traitant certifié pour la réalisation de tout ou partie du service d'hébergement, l'Hébergeur doit prévoir une procédure permettant d'encadrer le risque de perte ou de suspension de la certification du sous-traitant."
  13_tags: "#Fonctionnement#ISO27001 8.3"
  14_label: "Surveillance, mesurage, analyse et évaluation"
  14_desc: "L'Hébergeur doit permettre au client d'effectuer les vérifications suivantes du niveau de sécurité proposé :\n→Si l'Hébergeur met à la disposition du client des ressources qui lui sont spécifiques, le client peut réaliser ou mandater des audits de sécurité technique sur ces seules ressources spécifiques. L'organisation assiste le client ou son intervenant mandaté dans le maintien de la sécurité de l'information durant ces audits\n→Sur demande du client, l'Hébergeur doit lui communiquer la synthèse managériale d'un rapport d'audit technique portant sur les ressources mutualisées dans le cadre du service. Cet audit doit être réalisé par un auditeur indépendant et dater de moins de trois ans\n→L'Hébergeur doit permettre au client de consulter les traces d'accès aux DSCP portées par des ressources spécifiques ou auxdites ressources par les personnels sous son contrôle\n→L'Hébergeur doit définir les modalités permettant à son client de consulter son dernier rapport d'audit de certification HDS."
  14_tags: "#Evaluation de la performance#ISO27001 9.1"
  15_label: "Audit interne / Généralité"
  15_desc: "Les audits internes effectués par l'Hébergeur doivent comprendre a minima :\n→ Un audit permettant de déterminer si le SMSI est conforme aux exigences du présent référentiel et est efficacement mis en œuvre et maintenu\n→Un audit des traces des accès par les personnes opérant pour le compte de l'organisation aux DSCP ou aux systèmes utilisés pour leur traitement."
  15_tags: "#Evaluation de la performance#ISO27001 9.2.1"
6:
  title: "Exigences liées à la relation contractuelle"
  1_label: "Certificat de conformité"
  1_desc: "Conformément au 1° de l'article R.1111-11 du CSP, le contrat d'hébergement conclu entre l'Hébergeur et son Client doit comporter une clause mentionnant l'indication du périmètre du certificat de conformité obtenu par l'Hébergeur, ainsi que ses dates de délivrance et de renouvellement"
  2_label: "Description des prestations réalisées"
  2_desc: "Conformément au 2° de l'article R.1111-11 du CSP, le contrat d'hébergement conclu entre l'Hébergeur et son Client doit comporter une clause relative à la description des prestations réalisées, comprenant le contenu des services et résultats attendus notamment aux fins de garantir la disponibilité, l'intégrité, la confidentialité et l'auditabilité des données hébergées."
  3_label: "Respect des droits des personnes concernées"
  3_desc: "Conformément au 4° de l'article R.1111-11 du CSP, le contrat d'hébergement conclu entre l'Hébergeur et son Client doit comporter une clause relative aux mesures mises en œuvre pour garantir le respect des droits des personnes concernées par les données de santé. Cette clause doit notamment comporter les mentions suivantes : les modalités d'exercice des droits d'accès, de rectification, de limitation, d'opposition, d'effacement et de portabilité des données (lorsqu'ils sont applicables), les modalités de signalement au responsable de traitement d'une violation des données à caractère personnel, les modalités de conduite des audits par le délégué à la protection des données."
  4_label: "Désignation d'un référent contractuel"
  4_desc: "Conformément au 5° de l'article R.1111-11 du CSP, le contrat d'hébergement conclu entre l'Hébergeur et son Client doit comporter une clause mentionnant le référent contractuel du client de l'Hébergeur à contacter pour le traitement des incidents ayant un impact sur les données de santé hébergées."
  5_label: "Les indicateurs de qualité et de performance"
  5_desc: "Conformément au 6° de l'article R.1111-11 du CSP, le contrat d'hébergement conclu entre l'Hébergeur et son Client doit comporter une clause précisant les indicateurs de qualité et de performance permettant la vérification du niveau de service annoncé, le niveau garanti, la périodicité de leur mesure, ainsi que l'existence ou l'absence de pénalités applicables au non-respect de ceux-ci."
  6_label: "Recours à la sous-traitance"
  6_desc: "Conformément au 7° de l'article R. 1111-11 du CSP, le contrat d'hébergement conclu entre l'Hébergeur et son Client doit prévoir une information sur les conditions de recours à d'éventuels prestataires techniques externes et les engagements de l'Hébergeur pour que ce recours assure un niveau de protection équivalent de garantie au regard des obligations pesant sur l'Hébergeur, dans le respect de l'article 28.4 du RGPD."
  7_label: "Accès aux données de santé à caractère personnel hébergées"
  7_desc: "Conformément au 8° de l'article R.1111-11 du CSP, le contrat d'hébergement conclu entre l'Hébergeur et son Client doit décrire les modalités retenues pour encadrer les accès aux données de santé à caractère personnel hébergées"
  8_label: "Modifications ou évolutions techniques"
  8_desc: "Conformément au 9° de l'article R. 1111-11 du CSP, le contrat d'hébergement doit préciser les obligations de l'Hébergeur à l'égard de son Client en cas de modifications ou d'évolutions techniques introduites par lui ou imposées par le cadre légal applicable. Le contrat d'hébergement doit en outre prévoir l'accord préalable du Client dans le cas où ces modifications ou évolutions introduites par l'Hébergeur ne respectent pas :\n→Les niveaux de service tels que requis au chapitre 6.5\n→Les garanties définies aux chapitres 6.2 et.6.9"
  9_label: "Garanties"
  9_desc: "Conformément au 10° de l'article R.1111-11 du CSP, le contrat d'hébergement conclu entre l'Hébergeur et son Client doit prévoir une information sur les garanties et les procédures mises en place par l'Hébergeur permettant de couvrir toute défaillance éventuelle de sa part."
  10_label: "Interdiction liée au traitement des données hébergées"
  10_desc: "Conformément au 11° de l'article R.1111-11 du CSP, le contrat d'hébergement conclu entre l'Hébergeur et son Client doit rappeler l'interdiction pour l'Hébergeur d'utiliser les données de santé hébergées à d'autres fins que l'exécution de l'activité d'hébergement de données de santé."
  11_label: "Réversibilité"
  11_desc: "Conformément aux 12° à 14° de l'article R.1111-11 du CSP, une clause relative à la réversibilité doit en présenter les modalités à la fin de la prestation ou en cas d'arrêt anticipé de la prestation quel qu'en soit le motif, avec a minima :\n→L'engagement de restitution de la totalité des informations confiées au titre de la prestation\n→L'engagement de destruction de toute copie de ces informations à l'issue de la restitution\n→Les modalités de calcul des coûts et délais pour la restitution des copies\n→Les formats de restitution, lisibles et exploitables à des fins de portabilité des données de santé, et le cas échéant les modalités permettant le déplacement des machines virtuelles/conteneurs."
7:
  title: "Souveraineté des données"
  1_desc: "Quelle que soit l'activité d'hébergement de DSCP proposée au Client par l'Hébergeur ou l'un de ses sous-traitants, et dès lors que celle-ci implique un stockage de DSCP, alors l'Hébergeur ou ses sous-traitants doivent stocker ces DSCP exclusivement au sein de l'Espace Économique Européen (EEE), sans préjudice des cas d'accès à distance visée à l'exigence n°29. L'Hébergeur documente et communique au Client la localisation de ce stockage."
  2_desc: "Lorsque la prestation proposée par l'Hébergeur ou l'un de ses sous-traitants implique un accès à distance depuis un pays qui ne fait pas partie de l'Espace Économique Européen (EEE), cet accès doit être fondé sur une décision d'adéquation de la Commission adoptée vertu de l'article 45 du RGPD1 ou, à défaut, sur l'une des garanties appropriées prévues à l'article 46 du règlement. Dans ce dernier cas, l'hébergeur informe son client de l'absence de décision d'adéquation, d'une part, et des garanties appropriées au sens de l'article 46 du RGPD mises en place pour encadrer cet accès à distance, d'autre part. L'hébergeur indique au client et documente les garanties appropriées mises en place, ainsi que le cas échéant, tout autre mesure permettant d'assurer un niveau de protection des données équivalent à celui garanti par le droit de l'Union Européenne. l'hébergeur doit tenir compte des recommandations du comité européen de la protection des données 01/2020 sur les mesures qui complètent les instruments de transfert destinés à garantir le respect du niveau de protection des données à caractère personnel de l'UE (version 2.0, adoptée le 18 juin 2021)."
  3_desc: "Lorsque l'Hébergeur, ou l'un de ses sous-traitants intervenant dans la prestation d'hébergement, est soumis à la législation d'un pays tiers n'assurant pas un niveau de protection adéquat au sens de l'article 45 du RGPD, l'Hébergeur doit indiquer dans le contrat qui le lie à son client et porter à la connaissance de l'organisme certificateur :\n→La liste des réglementations extra-européennes en vertu desquelles l'Hébergeur, ou l'un de ses sous-traitants intervenant dans la prestation d'hébergement, serait tenu de permettre un accès non autorisé par le droit de l'Union aux DSCP, au sens de l'article 48 du RGPD\n→Les mesures mises en œuvre par l'Hébergeur pour atténuer les risques d'accès non autorisé aux DSCP induits par ces réglementations extra-européennes\n→La description des risques résiduels d'accès non autorisés aux DSCP via des réglementations extra- européennes qui demeureraient malgré ces mesures. l'hébergeur tient compte des lignes directrices du comité européen de la protection des données 01/2020 sur les mesures qui complètent les instruments de transfert destinés à garantir le respect du niveau de protection des données à caractère personnel de l'UE (version 2.0, adoptée le 18 juin 2021)."
  4_desc: "L'Hébergeur doit rendre publiques et mettre à jour la cartographie des transferts des DSCP vers un pays n'appartenant pas à l'Espace Économique Européen y compris les accès distants éventuels mentionnés à l'exigence n° 29 ainsi que la description des risques d'accès non autorisé visés par l'exigence n° 30. Les modalités d'information du public doivent prendre la forme suivante :\n→Dans le cas où l'activité certifiée bénéficie d'une qualification SecNumCloud (version 3.2), l'Hébergeur doit communiquer l'information suivante : « Aucun risque d'accès imposé par la législation d'un pays tiers en violation du droit de l'Union »\n→Dans le cas où l'activité certifiée ne bénéficie pas d'une qualification SecNumCloud (version 3.2) et ne comporte pas de transfert de DSCP vers un pays n'appartenant pas à l'Espace Économique Européen, l'Hébergeur doit communiquer l'information suivante : « Aucun transfert de données de santé à caractère personnel vers un pays tiers à l'espace économique européen »\n→Dans le cas où l'activité certifiée ne bénéficie pas d'une qualification SecNumCloud (version 3.2) et comporte un ou plusieurs transferts de DSCP vers un pays n'appartenant pas à l'Espace Économique Européen ou un risque d'accès non autorisé visé par l'exigence n°30, l'Hébergeur doit communiquer les informations figurant dans le tableau fourni au chapitre 8. L'Hébergeur doit mettre ces informations à la disposition du public de manière lisible sur une page dédiée d'un site internet accessible et communiquer l'URL de la page à l'organisme certificateur. Cette URL a vocation à être publiée dans la liste des hébergeurs certifiés sur le site de l'ANS."
