1:
  prefix: "1.4.2.4"
  title: "Réponses aux incidents liés à la sécurité des systèmes d’information classifiés"
  1_prefix: "#INC_01"
  1_desc: "Lorsqu’un organisme détient un système d’information pour le traitement des informations classifiées qu’il échange ou détient, il se dote d'un dispositif technique et humain de gestion des incidents afin de détecter et d'analyser les attaques et de réagir face à des événements susceptibles d’affecter la sécurité du système d’information classifié.\nCe dispositif s'appuie notamment sur des systèmes de détection conformes au paragraphe 6.6.4.5."
2:
  prefix: "3.1"
  title: "Portée et fondement de la procédure d’habilitation"
  1_prefix: "3.1.1"
  1_label: "Portée de l’habilitation et besoin d’en connaître"
  1_desc: "Conformément aux articles 413-10 et suivants du code pénal, l’accès par des personnes non qualifiées à des informations ou supports protégés par le secret de la défense nationale est prohibé. \n\n Pour qu’une personne physique puisse être considérée comme qualifiée au sens du code pénal, elle doit répondre à deux exigences cumulatives : \n\t- avoir été dûment habilitée au niveau de classification requis, à l’issue d’une enquête administrative destinée à évaluer les vulnérabilités qu’elle est susceptible de présenter pour le secret de la défense nationale (cf. 3.3) ou être habilitée ès qualités de par la loi ou son statut constitutionnel (cf. 3.1.4) ; \n\t- justifier du besoin d’en connaître. En effet, l’habilitation ne permet pas d’accéder sans limite à toute information ou support classifié. D’une part, elle ne permet d’accéder qu’aux informations et supports portant un timbre de classification de niveau inférieur ou égal au niveau mentionné sur la décision d’habilitation. D’autre part, une personne habilitée ne peut ni ne doit accéder à une information ou un support classifié que si l’autorité ayant sollicité son habilitation estime absolument nécessaire qu’elle ait accès à l’information ou au support considéré. La procédure d’habilitation ne peut être lancée que pour les fonctions et missions figurant au catalogue des emplois de l’organisme concerné, justifiant la nécessité pour le candidat à l’habilitation d’accéder à des informations et supports classifiés au niveau requis."
  2:
    prefix: "3.1.2"
    title: "Justification de la demande d’habilitation au regard du catalogue des emplois"
    1_prefix: "3.1.2.1"
    1_label: "Autorités compétentes pour l’établissement et la mise à jour des catalogues des emplois"
    1_desc: "En application de l’article R. 2311-7 du code de la défense, nul ne peut faire l’objet d’une demande d’habilitation si la fonction ou la mission justifiant son besoin d’accéder à des informations ou supports classifiés ne figure sur un catalogue des emplois établi par une autorité compétente. \n\n Chaque ministre précise pour les services centraux, les services déconcentrés, les services à compétence nationale, les organismes extérieurs relevant de son autorité, ainsi que les établissements publics placés sous sa tutelle et les opérateurs d’importance vitale relevant d’un secteur d’activités dont il est le coordonnateur, les autorités chargées d’établir, en lien avec leur officier de sécurité, les catalogues des emplois."
    2_prefix: "3.1.2.2"
    2_label: "Contenu et actualisation annuelle du catalogue des emplois"
    2_desc: "Un catalogue des emplois est établi pour chaque niveau de classification. Il identifie, via l’octroi d’un numéro de poste, chaque fonction ou mission impliquant nécessairement l’accès à des informations et supports classifiés au niveau de classification considéré, ainsi que les noms et prénoms des personnes physiques occupant les postes inscrits au catalogue des emplois. Chaque catalogue des emplois est mis à jour par l’officier de sécurité. \n\n Dès l’ouverture d’un catalogue des emplois, l’officier de sécurité en adresse une copie au haut fonctionnaire de défense et de sécurité, sauf dispositions contraires prévues par l’instruction ministérielle. \n\n Il lui adresse par ailleurs chaque année une version mise à jour en date du 31 décembre au plus tard le 1er février de l’année suivante. À cette occasion, il vérifie auprès des titulaires des postes répertoriés s’ils ont effectivement eu accès à des informations et supports classifiés pour le niveau concerné et inscrit les postes qui requièrent un accès au secret de la défense nationale. Le cas échéant, l’officier de sécurité, en lien avec l’autorité compétente, réévalue le niveau d’habilitation requis par les fonctions ou missions. Dans le cas où elles ne nécessitent plus d’accéder au secret de la défense nationale, il les supprime du catalogue des emplois, notifie aux titulaires des emplois concernés que leur décision d’habilitation est abrogée et leur fait signer le second volet de l’engagement de responsabilité (cf. 3.5.2)."
    3_prefix: "3.1.2.3"
    3_label: "Référence au catalogue des emplois dans les demandes d’habilitation et mise à jour éventuelle"
    3_desc: "Les demandes d’habilitation sont établies en référence au catalogue des emplois et précisent le numéro de poste du catalogue des emplois auquel correspond la demande. \n\n Lorsqu’une demande d’habilitation porte sur une fonction ou une mission nouvelle, ou sur une fonction ou une mission non préalablement inscrite sur un catalogue des emplois, et que la fonction ou la mission considérée nécessite sans conteste que son titulaire accède à des informations et supports classifiés, l’officier de sécurité met à jour le catalogue des emplois en concertation avec l’autorité d’habilitation."
  3_prefix: "3.1.3"
  3_label: "Responsabilité de l’autorité hiérarchique ou administrative sollicitant l’habilitation"
  3_desc: "De même qu’une habilitation ne doit pas être sollicitée pour une personne appelée à exercer une fonction ou à accomplir une mission qui ne figure pas sur un catalogue des emplois, il appartient au responsable d’organisme de s’assurer, avec l’appui de l’officier de sécurité, que toute personne occupant un poste ou accomplissant une mission figurant dans le ou l’un des catalogues des emplois de son organisme a été dûment habilitée selon les modalités définies dans la présente instruction. \n\n Dans le cas contraire, la personne est écartée des fonctions ou missions nécessitant l’accès aux informations et supports classifiés dans l’attente de son habilitation au niveau requis. Toute personne occupant ou visant un poste pour lequel le besoin d’habilitation est avéré et qui refuserait de se soumettre à la procédure d’habilitation est définitivement écartée du poste. \n\n À titre exceptionnel, un service de l’État peut solliciter l’inscription à l’un de ses catalogues des emplois d’une personne physique ou d’un ensemble de personnes physiques non rattachées à lui, ni hiérarchiquement, ni fonctionnellement, ni sous couvert d’une convention ou d’un contrat au titre des parties 4.3 et 4.4. À cet effet, il adresse une demande motivée, justifiant précisément son besoin, au haut fonctionnaire de défense et de sécurité dont il dépend. Ce dernier rend sa décision après consultation du secrétariat général de la défense et de la sécurité nationale."
  4_prefix: "3.1.4"
  4_label: "Personnes physiques habilitées ès qualités"
  4_desc: "Compte tenu de leur statut constitutionnel, le chef de l’État, le Premier ministre et les membres du gouvernement sont habilités ès qualités à connaître d’informations et supports couverts par le secret de la défense nationale. \n\n Il en va de même des personnes dont la loi détermine qu’elles sont habilitées ès qualités pour l’exercice de leurs fonctions ou l’accomplissement de leurs missions et dans ces seules limites. Sont uniquement concernés : \n\t- les membres de la délégation parlementaire au renseignement ; \n\t- les membres de la formation spécialisée du Conseil d’État ; \n\t- les membres de la commission du secret de la défense nationale ; \n\t- les membres de la commission nationale de contrôle des techniques de renseignement. \n\n En revanche, les personnes susceptibles de les assister dans l’exercice de leur fonction ou dans l’accomplissement de leur mission font l’objet d’une procédure d’habilitation conforme aux dispositions des parties 3.2 et 3.3."
3:
  prefix: "3.2"
  title: "Différents types de procédure"
  desc: "La demande d’habilitation déclenche une procédure destinée à vérifier que le candidat à l’habilitation peut, sans risque pour la défense et la sécurité nationale ou pour sa propre sécurité, accéder à des informations et supports classifiés dans l’exercice de sa fonction ou l’accomplissement de sa mission."
  1_prefix: "3.2.1"
  1_label: "Balance des risques dans le choix de la procédure"
  1_desc: "Plusieurs cas de figure peuvent justifier la mise en œuvre de procédures d’habilitation dérogatoires que sont les procédures simplifiée (cf. 3.2.3) et d’urgence (cf. 3.2.4). L’autorité qui sollicite l’habilitation doit avoir à l’esprit que ces procédures offrent des garanties de sécurité moindres que la procédure de droit commun. Il revient ainsi au responsable d’organisme sollicitant l’habilitation, par le biais de son officier de sécurité, de procéder systématiquement à une balance « coût-avantage » avant de solliciter l’enclenchement d’une procédure dérogatoire. \n\n En tous les cas, le recours à la procédure simplifiée ou à la procédure d’urgence est prohibé pour l’habilitation des agents des services spécialisés de renseignement visés à l’article R. 811-1 du code de la sécurité intérieure, à l’exception de ceux nommés conformément à l’article 13 de la Constitution ou relevant du chapitre Ier du titre II du décret n° 2019-1594 du 31 décembre 2019 relatif aux emplois de direction de l’État. Par ailleurs, conformément aux règles propres à leur service, les agents des services de renseignement peuvent faire l’objet d’une procédure d’habilitation plus approfondie que celle décrite dans la présente instruction."
  2_prefix: "3.2.2"
  2_label: "Procédure d’habilitation de droit commun"
  2_desc: "Cette procédure (cf. Annexe 5) concerne toutes les personnes appelées à occuper un poste pour lequel le besoin d’habilitation au niveau Secret ou Très Secret, y compris pour les classifications spéciales de ce dernier niveau, est avéré. \n\n Une habilitation temporaire peut être délivrée à l’issue de cette procédure selon les conditions définies au paragraphe 3.4.1.1. \n\n Une procédure d’habilitation en urgence peut être engagée selon les conditions détaillées au paragraphe 3.3.2."
  3_prefix: "3.2.3"
  3_label: "Procédure simplifiée"
  3_desc: "Distincte de l’enquête réalisée par le service enquêteur dans le cadre de la procédure d’habilitation de droit commun, cette procédure, uniquement applicable aux demandes d’habilitation au niveau Secret et réservée aux seuls agents publics (fonctionnaires ou agents non-titulaires, civils ou militaires), permet de délivrer une décision d’habilitation sur le fondement d’une enquête administrative réalisée au moment du recrutement, de la nomination ou de l’affectation, conformément aux articles L. 114-1 et L. 114-2 du code de la sécurité intérieure (cf. Annexe 6), sous réserve, pour le candidat à l’habilitation, de remplir une notice individuelle de sécurité comportant une attestation sur l’honneur de l’exactitude des informations mentionnées. \n\n La décision d’habilitation délivrée dans le cadre d’une procédure simplifiée est valide pour une durée limitée ne dépassant pas la durée maximale déterminée par l’instruction ministérielle du ministère dont relève la personne habilitée. \n\n L’autorité ayant sollicité l’habilitation par procédure simplifiée peut, à tout moment, solliciter une enquête administrative auprès du service enquêteur compétent conformément au II de l’article L. 114-1 du code de la sécurité intérieure. \n\n La procédure simplifiée n’est pas applicable aux agents des services spécialisés de renseignement visés à l’article R. 811-1 du code de la sécurité intérieure, à l’exception des agents nommés conformément à l’article 13 de la Constitution ou relevant du chapitre Ier du titre II du décret n° 2019-1594 du 31 décembre 2019 relatif aux emplois de direction de l’État."
  4_prefix: "3.2.4"
  4_label: "Procédure d’urgence"
  4_desc: "Distincte de la procédure simplifiée, cette procédure exceptionnelle, applicable quel que soit le niveau de l’habilitation, Secret ou Très Secret, sollicité, permet de délivrer une habilitation à une personne dans des délais très brefs selon les modalités détaillées au 3.3.2 afin que cette dernière puisse avoir accès à des informations et supports classifiés dès sa prise de fonction. \n\n La procédure d’urgence s’applique aux seuls cas exceptionnels de personnes affectées dans des conditions ne permettant pas le respect des délais mentionnés au 3.3.1.3 c) et exerçant des fonctions exigeant un accès immédiat à des informations et supports classifiés. \n\n La procédure d’urgence n’est pas applicable aux agents des services spécialisés de renseignement visés à l’article R. 811-1 du code de la sécurité intérieure, à l’exception des agents nommés conformément à l’article 13 de la Constitution ou relevant du chapitre Ier du titre II du décret n° 2019-1594 du 31 décembre 2019 relatif aux emplois de direction de l’État."
  5:
    prefix: "3.2.5"
    title: "Habilitation des ressortissants étrangers"
    desc: "Les ressortissants étrangers occupant une fonction ou accomplissant une mission nécessitant l’accès à des informations ou supports classifiés, dans la limite du strict besoin d’en connaître, peuvent être habilités au niveau Secret ou Très Secret, à la condition qu’il existe un accord de sécurité, général ou spécifique, entre la France et l’État dont l’intéressé est ressortissant. \n\n Par dérogation au paragraphe précédent, lorsqu’il n’existe aucun accord de sécurité entre la France et l’État dont l’intéressé est ressortissant, à titre exceptionnel, si le besoin d’en connaître est avéré, le responsable de l’organisme dont il relève saisit, en motivant sa demande, via le haut fonctionnaire de défense et de sécurité compétent, le secrétaire général de la défense et de la sécurité nationale qui apprécie l’opportunité de l’habilitation et définit, le cas échéant, la procédure à suivre."
    1_prefix: "3.2.5.1"
    1_label: "Attestation d’habilitation ou de sécurité dans le cadre d’une coopération étatique"
    1_desc: "Lorsque, dans le cadre d’une coopération étatique, un ressortissant d’un État étranger ou relevant d’un organisme de droit international public avec lequel la France a conclu un accord de sécurité, général ou spécifique applicable au cas d’espèce, est envoyé en mission ou détaché dans un organisme français, l’attestation d’habilitation ou le certificat de sécurité délivré(e) par l’autorité étrangère ou internationale compétente suffit à permettre la délivrance d’une décision d’habilitation au niveau requis conformément au tableau d’équivalence de l’accord de sécurité applicable, sans qu’il soit nécessaire de diligenter une enquête administrative au préalable."
    2_prefix: "3.2.5.2"
    2_label: "Procédure d’habilitation hors coopération étatique"
    2_desc: "Lorsqu’un ressortissant étranger d’un État avec lequel la France a conclu un accord de sécurité général ou spécifique applicable au cas d’espèce, présente sa candidature à un emploi en France nécessitant l’accès à des informations et supports classifiés, la procédure d’habilitation est engagée par le responsable de l’organisme français concerné avec l’appui de son officier de sécurité, selon les modalités suivantes : \n\t- le responsable d’organisme adresse la demande d’habilitation à l’autorité d’habilitation dont il dépend, après avoir vérifié que le dossier remplit toutes les exigences fixées au 3.3.1.1 ; \n\t- l’autorité d’habilitation saisit le service enquêteur compétent selon les procédures habituelles détaillées à la partie 3.3 ; \n\t- parallèlement, l’autorité d’habilitation saisit le secrétaire général de la défense et de la sécurité nationale, en sa qualité d’autorité nationale de sécurité. Cette saisine est transmise via le haut fonctionnaire de défense et de sécurité compétent quand l’autorité d’habilitation est distincte de celui-ci (cf. 3.3.1.2) ; \n\t- le secrétaire général de la défense et de la sécurité nationale assure la liaison avec les autorités nationales de sécurité étrangères afin d’obtenir l’assurance qu’il n’existe aucune information défavorable sur l’intéressé de nature à constituer une vulnérabilité pour le secret de la défense nationale, sans pour autant que ces éléments soient liant pour la délivrance de la décision d’habilitation ; \n\t- le secrétaire général de la défense et de la sécurité nationale transmet les éléments reçus de son homologue étranger au haut fonctionnaire de défense et de sécurité compétent, qui les retransmet à l’autorité d’habilitation lorsque l’autorité d’habilitation est distincte de celui-ci. \n\n Dans le cas particulier où l’autorité d’habilitation est autorité de sécurité déléguée, et sous réserve des dispositions de l’accord de sécurité applicable, cette dernière peut saisir directement son homologue étranger. L’autorité de sécurité déléguée peut, en outre, au besoin, solliciter une démarche analogue du secrétaire général de la défense et de la sécurité nationale vers l’autorité nationale de sécurité étrangère. \n\n La décision d’habilitation n’est prise par l’autorité française d’habilitation qu’à l’issue de cette procédure."
  6:
    prefix: "3.2.6"
    title: "Habilitation des ressortissants français au profit d’une organisation internationale, d’une institution, d’un organisme ou d’un organe de l’Union européenne ou d’une personne morale de droit étranger"
    desc: "Les ressortissantsfrançais, occupant une fonction ou accomplissant une mission au sein d’une organisation internationale, d’une institution, d’un organisme ou d’un organe de l’Union européenne ou d’un organisme de droit étranger et nécessitant l’accès à des informations et supports classifiés étrangers peuvent être habilités au niveau requis selon les modalités ciaprès détaillées."
    1_prefix: "3.2.6.1"
    1_label: "Procédure d’habilitation pour les ressortissants français mis à disposition ou envoyés en mission dans le cadre d’une coopération étatique ou détachés par la France dans une organisation internationale, une institution, un organisme ou un organe de l’Union européenne"
    1_desc: "Lorsque, dans le cadre d’une coopération étatique, un ressortissant français est envoyé en mission ou détaché dans un organisme étranger ou relevant du droit international public, l’officier de sécurité de l’organisme français dont il ressort délivre, sur demande de l’autorité d’accueil, une attestation d’habilitation ou un certificat de sécurité conformément au tableau d’équivalence de l’accord de sécurité conclu entre la France, l’État partenaire ou l’organisation internationale, l’institution, l’organe ou l’organisme de l’Union européenne concerné. \n\n Dans le cas où le ressortissant français ne dispose pas d’une habilitation en cours de validité, une demande d’habilitation est transmise par le responsable de l’organisme français dont le ressortissant français relève, selon les mêmes modalités que pour tout autre candidat à l’habilitation relevant de son organisme."
    2_prefix: "3.2.6.2"
    2_label: "Procédures applicables aux ressortissants français candidats à un poste ou employés, sans lien avec l’État français, par un organisme étranger ou relevant du droit international public"
    2_desc: "Lorsqu’un ressortissant français candidate à un poste ou est employé, sans lien avec l’État français, par une personne morale de droit étranger, la procédure d’habilitation est engagée par l’autorité étrangère compétente. \n\n L’autorité de sécurité étrangère compétente en vertu de l’accord de sécurité applicable ou des règles de sécurité de l’organisation internationale concernée saisit le secrétaire général de la défense et de la sécurité nationale, en sa qualité d’autorité nationale de sécurité ou, le cas échéant, l’autorité de sécurité déléguée compétente, afin d’obtenir l’assurance qu’il n’existe aucune information défavorable sur l’intéressé de nature à constituer une vulnérabilité pour la protection du secret. \n\n Le secrétaire général de la défense et de la sécurité nationale ou, le cas échéant, l’autorité de sécurité déléguée compétente, saisit le service enquêteur compétent pour vérifier si l’intéressé dispose d’un avis de sécurité en cours de validité ou procéder à l’enquête. \n\n Dès le retour du service enquêteur, le secrétaire général de la défense et de la sécurité nationale, ou, le cas échéant, l’autorité de sécurité déléguée compétente, répond à l’autorité étrangère à l’origine de la demande conformément aux modalités définies dans l’accord de sécurité applicable ou par les règles de sécurité de l’organisation internationale concernée. \n\n Indépendamment de la forme que prend la réponse française (acte préparatoire à la décision d’habilitation de l’autorité étrangère ou décision d’habilitation au profit de cette dernière), cette dernière peut, lorsqu’elle fait grief, faire l’objet de recours administratifs ou contentieux (cf. 3.4.2.2)."
4:
  prefix: "3.3"
  title: "Déroulement des procédures d’habilitation"
  desc: "Sauf cas particulier, la procédure d’habilitation n’est engagée qu’au profit de la personne effectivement nommée dans l’emploi afin d’éviter toute surcharge inutile des services chargés d’en assurer la conduite. Elle doit toutefois être anticipée, sans attendre la prise effective de fonction, de façon à permettre à la personne de prendre connaissance d’informations et supports classifiés au plus tôt à sa prise de fonction. Ainsi, le dossier d’habilitation dûment constitué (cf. 3.3.1.1) doit être transmis à l’autorité d’habilitation compétente avant toute prise de poste. S’agissant des personnes candidates à un poste au sein des services spécialisés de renseignement définis à l’article R. 811-1 du code de la sécurité intérieure, à l’exception des personnes nommées conformément à l’article 13 de la Constitution ou relevant du chapitre Ier du titre II du décret n° 2019-1594 du 31 décembre 2019 relatif aux emplois de direction de l’État, la procédure d’habilitation est conduite dès la phase de recrutement et doit être finalisée avant la prise de fonction dans le service concerné. Si cette procédure débouche sur un refus d’habilitation, conformément à l’article L. 114-1 du code de la sécurité intérieure, la personne candidate n’est pas recrutée. Tout candidat à l’habilitation est informé par l’officier de sécurité, lors de sa demande, des obligations induites par l’habilitation ainsi que des dispositions relatives à sa responsabilité pénale en cas de compromission."
  1:
    prefix: "3.3.1"
    title: "Procédures de droit commun"
    1_prefix: "3.3.1.1"
    1_label: "Constitution du dossier"
    1_desc: "Le dossier d’habilitation (cf. Annexe 7) a pour objet de réunir les éléments nécessaires à la conduite de l’enquête administrative. Il est constitué de : \n\t- la demande d’habilitation formulée par l’autorité compétente attestant le besoin de connaître des informations et supports classifiés à un niveau donné, pour une personne nommément désignée à un poste donné ; \n\t- la notice individuelle de sécurité, renseignée intégralement et signée par le candidat et vérifiée par l’officier de sécurité de l’organisme dont il relève. \n\n L’officier de sécurité adresse le dossier d’habilitation à l’autorité d’habilitation et en conserve une copie datée et signée au plus tard jusqu’à un an après la durée de l’avis de sécurité en cours de validité. La transmission du dossier par voie électronique est privilégiée à condition que le système d’information employé garantisse l’identification et l’authentification de l’émetteur comme du destinataire, assure la confidentialité et l’intégrité des données et permette de tracer les actions effectuées. Dans le cas contraire, le dossier d’habilitation est établi en trois exemplaires (un original et deux photocopies, datées et revêtues de la signature originale du candidat) et accompagné de trois photographies d’identité originales, identiques et récentes."
    2_prefix: "3.3.1.2"
    2_label: "Autorité d’habilitation"
    2_desc: "L’autorité d’habilitation est : \n\t- le ministre pour les organismes relevant de son champ d’attribution (cf. 2.1.2.1) ou, par délégation, le haut fonctionnaire de défense et de sécurité, ainsi que toute autre personne désignée par arrêté ; \n\t- le secrétaire général de la défense et de la sécurité nationale : \n\t\t- par délégation du Premier ministre pour les demandes d’habilitation au niveau Très Secret faisant l’objet d’une classification spéciale ; \n\t\t- pour les personnes relevant des organismes entrant dans son champ de compétence au titre du décret n° 2012-383 du 20 mars 2012 relatif aux attributions du haut fonctionnaire de défense et de sécurité auprès du Premier ministre, à l’exception des agents du groupement interministériel de contrôle ; \n\t- dans les limites des compétences définies par la décision de délégation mentionnée à l’article R. 2311-10-1 du code de la défense, l’autorité de sécurité déléguée pour les ressortissants français candidats à un poste ou employés, sans lien avec l’État français, par une personne morale de droit étranger ; \n\t- les autorités endossant la fonction de haut fonctionnaire de défense et de sécurité selon les modalités décrites au 2.1.3. L’autorité d’habilitation vérifie que le dossier d’habilitation est complet et le transmet au service enquêteur compétent afin qu’il diligente une enquête administrative. La transmission du dossier par voie électronique est privilégiée à condition que le système d’information employé soit conforme aux conditions détaillées au 3.3.1.1. \n\n Le secrétaire général de la défense et de la sécurité nationale est également autorité d’habilitation des ressortissants français candidats à un poste ou employés, sans lien avec l’État français, par une personne morale de droit étranger sous réserve des compétences des autorités de sécurité déléguées."
    3_prefix: "3.3.1.3"
    3_label: "Enquête administrative"
    3_desc: "\ta. Finalité de l’enquête administrative préalable à la décision d’habilitation Cette enquête administrative est fondée sur des critères objectifs permettant de déterminer si l’intéressé, par son comportement ou par son environnement proche, présente une vulnérabilité, soit parce qu’il constitue lui-même une menace pour le secret, soit parce qu’il se trouve exposé à un risque de chantage ou de pressions pouvant mettre en péril les intérêts de l’État, chantage ou pressions exercés notamment par un service étranger de renseignement, un groupe terroriste, une organisation ou une personne se livrant à des activités subversives. \n\tb. Service enquêteur chargé de diligenter l’enquête administrative Sont services enquêteurs : \n\t\t- la direction du renseignement et de la sécurité de la défense (DRSD) pour le personnel civil ou militaire relevant du ministère de la défense, le personnel militaire de la gendarmerie, les organismes relevant du champ d’attribution de ce ministère ainsi que leur personnel à l’exception de ceux travaillant au profit de la direction générale de la sécurité extérieure, les auditeurs de l’institut des hautes études de défense nationale ; \n\t\t- la direction générale de la sécurité extérieure (DGSE) pour son personnel, les organismes travaillant à son profit et leur personnel ; \n\t\t- la direction générale de la sécurité intérieure (DGSI) pour le personnel civil, y compris pour le personnel civil travaillant pour la gendarmerie, les organismes et leur personnel travaillant dans le domaine civil. \n\tc. Durée et priorisation des enquêtes par les services enquêteurs La durée de l’enquête administrative est en principe de trois mois pour un dossier d’habilitation au niveau Secret et six mois au niveau Très Secret, à compter de sa réception par le service chargé de la réaliser. Dans le cadre d’une procédure d’urgence (cf. 3.2.4 et 3.3.2), ce dernier peut délivrer, sur demande de l’autorité compétente, un avis de sécurité provisoire qui ne prolonge pas la durée de l’enquête. Cet avis de sécurité provisoire est valable jusqu’à réception de l’avis de sécurité définitif ou, au plus tard, six mois après sa date d’émission. \n\n Les enquêtes administratives relatives aux agents des services spécialisés de renseignement mentionnés à l’article R. 811-1 du code de la sécurité intérieure sont diligentées en priorité. \n\td. Clôture de l’instruction et avis de sécurité L’enquête administrative donne lieu à un avis de sécurité dans lequel le service chargé de la réaliser adresse ses conclusions à l’autorité d’habilitation. Cet avis permet à l’autorité d’habilitation d’apprécier l’opportunité d’habiliter le candidat, au regard des éléments communiqués, des garanties qu’il présente et du niveau d’habilitation requis. \n\n Les conclusions de l’avis de sécurité sont de trois types : \n\t\t- « avis sans objection » : l’instruction n’a révélé aucune vulnérabilité de nature à constituer un risque pour la sécurité des informations et supports classifiés ni pour celle de l’intéressé ; \n\t\t- « avis restrictif » : le candidat présente certaines vulnérabilités constituant des risques directs ou indirects pour la sécurité des informations et supports classifiés auxquels il aurait accès, mais que des mesures de sécurité spécifiques prises par l’officier de sécurité et, le cas échéant, une sensibilisation particulière du candidat, permettraient de maîtriser. Dans ce cas, le service ayant réalisé l’enquête recommande une procédure de mise en garde de l’employeur ou de mise en éveil de l’intéressé, ou qu’il soit recouru à ces deux procédures (cf. 3.4.1.2) ; \n\t\t- « avis défavorable » : des informations précises font apparaître que le candidat présente des vulnérabilités faisant peser sur le secret de la défense nationale des risques tels qu’aucune mesure de sécurité ne permettrait de maîtriser. \n\n L’avis de sécurité est émis pour un niveau donné d’habilitation. L’avis « sans objection » est valable pour le niveau pour lequel il a été requis et, le cas échéant, pour le niveau inférieur. Sa durée de validité ne dépasse pas celle de l’avis initial. Sauf précision contraire du service enquêteur, l’avis restrictif ou défavorable vaut pour le niveau d’habilitation concerné et le niveau inférieur. \n\n Les avis restrictifs et défavorables sont assortis d’une fiche confidentielle classifiée indiquant les motifs de l’avis. Cette fiche distingue clairement : \n\t- les éléments classifiés qui ne sont communiqués qu’à l’autorité d’habilitation et, de façon strictement nécessaire, dans le cas où : \n\t\t- une procédure de mise en garde est recommandée, aux autorités chargées de procéder à la mise en garde de l’autorité compétente ou de l’officier de sécurité dont relève le candidat à l’habilitation ainsi que, le cas échéant, à ladite autorité ou au dit officier de sécurité ; \n\t\t- une procédure de mise en éveil est recommandée, à l’autorité chargée de procéder à la mise en éveil du candidat selon les modalités définies par l’autorité d’habilitation, en liaison avec le service enquêteur conformément aux dispositions du paragraphe b). \n\t- les éléments communicables, y compris au candidat. \n\n Ne pouvant être reproduite, la fiche confidentielle est retournée après communication et sans délai au service enquêteur qui l’a émise, aux fins de conservation. L’autorité d’habilitation peut, en tant que de besoin, demander à nouveau communication des éléments qu’elle contient, en particulier, lorsqu’elle est chargée de mettre en garde l’autorité d’emploi, en cas de changement de comportement ou de situation de l’intéressé, à l’occasion de l’instruction d’une nouvelle demande d’habilitation le concernant ou pour l’instruction des recours gracieux ou contentieux dont la décision qu’elle a prise sur la base de l’avis de sécurité du service enquêteur peut faire l’objet. \n\n La durée de validité de l’avis de sécurité dépend du niveau d’habilitation demandé. Elle ne peut excéder : \n\t- sept ans pour le niveau Secret ; \n\t- cinq ans pour le niveau Très Secret. \n\n L’avis de sécurité constitue un acte préparatoire à la décision d’habilitation. Il ne constitue en soi ni une autorisation, ni un refus, et ne lie pas l’autorité d’habilitation, qui prend sa décision après avoir apprécié l’ensemble des éléments recueillis pendant l’instruction du dossier."
  2_prefix: "3.3.2"
  2_label: "Procédure d’urgence"
  2_desc: "La procédure d’urgence est engagée dans les seuls cas prévus au 3.2.4. Le dossier d’habilitation est identique à celui prévu au 3.3.1.1. Il est constitué selon la procédure de droit commun, à la différence près que l’autorité compétente doit, dans la demande, préciser et motiver l’urgence de l’habilitation et l’impossibilité de procéder autrement. Pour les classifications spéciales, seul le secrétaire général de la défense et de la sécurité nationale peut, en sa qualité d’autorité d’habilitation, engager une telle procédure au regard des éléments transmis par l’autorité d’emploi. \n\n Dans les quinze jours ouvrables suivant sa saisine, le service enquêteur émet un avis de sécurité provisoire. La procédure de droit commun se poursuit après l’émission de l’avis de sécurité provisoire. \n\n Au vu de ce dernier, l’autorité d’habilitation peut prendre une décision d’habilitation provisoire qui expire : \n\t- soit lorsqu’à réception de l’avis de sécurité définitif, la décision d’habilitation ou de refus d’habilitation est prise ; \n\t- soit au plus tard six mois après sa date d’émission."
5:
  prefix: "3.4"
  title: "Décision d’habilitation ou de refus d’habilitation"
  1:
    prefix: "3.4.1"
    title: "Typologie des décisions"
    1_prefix: "3.4.1.1"
    1_label: "Décision d’habilitation"
    1_desc: "La décision d’habilitation est l’autorisation donnée à une personne, sous réserve de son besoin d’en connaître, d’accéder à des informations et supports classifiés au niveau précisé dans la décision, ainsi qu’au niveau inférieur (cf. Annexe 8). \n\n Elle est prononcée par l’autorité d’habilitation au regard notamment des conclusions du service enquêteur, quel que soit le sens de l’avis de sécurité. L’autorité d’habilitation informe le service enquêteur de sa décision. \n\n L’autorité d’habilitation peut également décider d’accorder une décision d’habilitation temporaire, à l’issue d’une procédure d’habilitation de droit commun (cf. 3.3.1) à un agent de l’État ou d’un de ses établissements publics lorsque l’intéressé fait l’objet d’une habilitation au niveau Secret pour lequel il est inscrit au catalogue des emplois et qu’il a besoin, de façon ponctuelle, d’accéder à des informations et supports classifiés au niveau Très Secret, hors classification spéciale. Cette décision, non renouvelable, est valable pour une durée maximale de trois mois, à l’exception des décisions délivrées aux militaires pour l’accomplissement de leur mission en opération intérieure ou extérieure, qui sont valables la durée de la projection. \n\n L’autorité d’habilitation est tenue d’en informer le service enquêteur."
    2_prefix: "3.4.1.2"
    2_label: "Décision d’habilitation assortie de mesures particulières"
    2_desc: "L’autorité d’habilitation peut décider, lorsque l’enquête a mis en évidence des éléments de vulnérabilité, d’accorder l’habilitation après avoir pris des précautions particulières. Les deux procédures sont éventuellement cumulables. \n\n \n\ta. Procédure de mise en garde \n L’autorité d’habilitation peut décider d’accorder l’habilitation à l’intéressé sous réserve de la mise en garde de l’autorité compétente ou de l’officier de sécurité de l’organisme ayant fait la demande d’habilitation dont relève le candidat à l’habilitation. \n\n Cette procédure permet à ces derniers de mettre en œuvre des mesures de sécurité ou de prendre des précautions particulières à l’égard de l’intéressé, si besoin avec le conseil de l’autorité d’habilitation ou du service enquêteur. \n\n A l’issue de l’entretien de mise en garde, une attestation (cf. Annexe 9) est signée par l’autorité compétente ou l’officier de sécurité dont relève l’intéressé et conservée par l’autorité d’habilitation. La décision d’habilitation n’est rendue qu’à l’issue de la procédure. L’autorité d’habilitation en informe le service enquêteur. \n\n \n\tb. Procédure de mise en éveil L’autorité d’habilitation peut décider d’accorder l’habilitation après une mise en éveil de l’intéressé, qui consiste à sensibiliser ce dernier sur les éléments communicables de vulnérabilité révélés par l’enquête. \n\n L’autorité d’habilitation définit conjointement avec l’officier de sécurité de l’organisme ayant demandé l’habilitation les modalités de la mise en éveil. Elle consulte à cette fin le service enquêteur et peut solliciter sa présence lors de l’entretien avec l’intéressé. L’officier de sécurité étudie avec le service enquêteur les mesures de sécurité complémentaires à mettre en œuvre au regard de la situation lorsque cela s’avère justifié. \n\n À l’issue de l’entretien de mise en éveil, une attestation (cf. Annexe 10) est signée par l’autorité d’habilitation ou son représentant, par l’officier de sécurité et par l’intéressé. Elle est conservée par l’autorité d’habilitation. La décision d’habilitation n’est prise qu’à l’issue de la procédure. L’autorité d’habilitation en informe le service enquêteur."
    3_prefix: "3.4.1.3"
    3_label: "Décision de refus d’habilitation"
    3_desc: "La décision de refus d’habilitation est prononcée par l’autorité d’habilitation au regard notamment des conclusions du service enquêteur, quel que soit le sens de l’avis de sécurité."
  2:
    prefix: "3.4.2"
    title: "Notification de la décision"
    desc: "L’officier de sécurité qui a fait la demande d’habilitation est informé par l’autorité d’habilitation de la décision prise par cette dernière. La décision ou, à défaut, le sens de la décision est communiqué à l’officier de sécurité. À réception, ce dernier notifie au candidat à l’habilitation la décision individuelle prise à son endroit, qu’elle soit favorable ou non."
    1_prefix: "3.4.2.1"
    1_label: "Décision favorable"
    1_desc: "L’officier de sécurité notifie la décision d’habilitation à l’intéressé en le sensibilisant aux obligations particulières imposées par l’accès à des informations et supports classifiés, aux risques liés à la sécurité des systèmes d’information classifiés lorsque des droits d’accès à un tel système lui sont accordés ainsi qu’aux sanctions prévues par le code pénal en cas d’inobservation de la réglementation protégeant le secret de la défense nationale. L’intéressé signe le premier volet de l’engagement de responsabilité (cf. Annexe 11) par lequel il reconnaît avoir connaissance de ces obligations. \n\n L’intéressé est également avisé de ce qu’il est tenu d’informer sans délai l’officier de sécurité, pendant toute la durée de son habilitation, de tout changement affectant sa vie personnelle (concubinage, pacte civil de solidarité, mariage, séparation, etc.), professionnelle ou géographique (lieu de domicile ou de résidence). Il lui est également signifié qu’il doit l’informer de toute relation suivie, dépassant le cadre professionnel, avec un ou plusieurs ressortissants étrangers et de le consigner dans une notice individuelle de sécurité transmise à l’autorité d’habilitation. De tels changements de situation peuvent justifier un réexamen du dossier d’habilitation et, le cas échéant, la saisine ou l’auto-saisine du service enquêteur, qui émet un nouvel avis de sécurité."
    2_prefix: "3.4.2.2"
    2_label: "Refus d’habilitation"
    2_desc: "La décision par laquelle l’autorité d’habilitation refuse d’habiliter une personne au titre de la protection du secret de la défense nationale (cf. Annexe 12), est notifiée à l’intéressé par l’officier de sécurité. Cette décision est dispensée de l’obligation de motivation. \n\n Lors de cet entretien, l’officier de sécurité remet à l’intéressé la décision de refus d’habilitation ainsi qu’un récépissé de notification de décision de refus d’habilitation (cf. Annexe 13) qui comporte la mention des voies et délais de recours et dont un exemplaire, daté et signé par l’intéressé, est conservé par l’autorité d’habilitation. Le refus d’habilitation ou l’avis défavorable à l’habilitation d’un ressortissant français pour l’exercice d’une fonction ou l’accomplissement d’une mission au profit d’une personne morale de droit étranger suit le même formalisme (cf. 3.2.6.2)."
  3_prefix: "3.4.3"
  3_label: "Obligation de discrétion de la personne habilitée"
  3_desc: "Une personne titulaire d’une décision d’habilitation ne peut en faire état ni révéler son niveau d’habilitation sauf si la communication de ces informations est nécessaire à l’exercice de ses fonctions ou de l’accomplissement d’une mission à raison desquelles elle a été habilitée."
  4_prefix: "3.4.4"
  4_label: "Portée de la décision en matière internationale"
  4_desc: "Toute décision d’habilitation émise au niveau national pour un ressortissant français peut, sous réserve du besoin d’en connaître, donner accès, de manière exceptionnelle, aux informations et supports classifiés du niveau correspondant et des niveaux inférieurs échangés dans un cadre international en application de l’accord de sécurité conclu entre les États membres de l’OTAN et des dispositions mises en place dans le cadre de l’Union européenne. \n\n Un certificat de sécurité peut être émis par l’autorité d’habilitation."
6:
  prefix: "3.5"
  title: "Cycle de vie de la decision d’habilitation"
  1_prefix: "3.5.1"
  1_label: "Durée de validité"
  1_desc: "La décision d’habilitation cesse de produire ses effets : \n\t- soit à la fin de validité figurant sur la décision qui peut être au plus égale à celle de l’avis de sécurité (cf. 3.3.1.3 d)) ; \n\t- soit lorsque la fonction ou la mission l’ayant justifié disparaît, y compris si la date de fin de validité figurant sur la décision est postérieure. \n\n Ainsi, la décision d’habilitation est implicitement abrogée au terme de la durée de validité de la décision ou lorsque la fonction ou la mission cesse, quand bien même la date de fin de validité inscrite sur la décision d’habilitation n’est pas échue."
  2_prefix: "3.5.2"
  2_label: "Abrogation explicite d’une décision d’habilitation"
  2_desc: "Une décision d’habilitation peut être abrogée à tout moment ou ne pas être renouvelée si l’intéressé ne remplit plus les conditions nécessaires à sa délivrance. \n\n L’abrogation fait l’objet d’une décision explicite, notifiée à l’intéressé selon les modalités prévues au 3.4.2.2. Lors de la notification, l’intéressé signe le second volet de l’engagement de responsabilité (cf. Annexe 11). L’officier de sécurité met alors en œuvre les mesures du 3.5.8. L’autorité d’habilitation informe le service enquêteur de la décision d’abrogation."
  3_prefix: "3.5.3"
  3_label: "Enquêtes administratives pendant la durée de l’habilitation"
  3_desc: "Afin de s’assurer que le comportement de la personne habilitée n’est pas devenu incompatible avec les exigences relatives à la protection du secret de la défense nationale, l’autorité d’habilitation peut, d’elle-même ou après signalement par l’officier de sécurité ou l’autorité d’emploi dont la personne habilitée relève, d’un changement de comportement ou de situation, diligenter une nouvelle enquête administrative conformément au II de l’article L. 114-1 du code de la sécurité intérieure. \n\n Si des vulnérabilités sont apparues, l’autorité d’habilitation peut décider d’abroger la décision d’habilitation selon les modalités décrites au 3.5.2."
  4_prefix: "3.5.4"
  4_label: "Conservation des décisions"
  4_desc: "Pendant leur durée de validité, les décisions d’habilitation sont conservées par l’officier de sécurité ou par l’autorité compétente désignée dans l’instruction ministérielle. Ces documents ne sont en aucun cas remis aux intéressés, ni reproduits."
  5_prefix: "3.5.5"
  5_desc: "Afin d’attester de son habilitation, il peut être remis à l’intéressé un certificat de sécurité (cf. Annexe 14) d’une durée de validité limitée à un an au maximum et pour une mission déterminée. Ce certificat de sécurité est délivré par l’autorité d’habilitation ou par l’officier de sécurité de l’organisme de l’intéressé. \n\n L’intéressé procède ou fait procéder à sa destruction avant la fin de validité mentionnée sur le certificat."
  6_prefix: "3.5.6"
  6_label: "Renouvellement"
  6_desc: "Afin d’éviter une interruption inopportune des conditions d’emploi, dans l’exercice de la fonction ou l’accomplissement de la mission du titulaire d’une décision d’habilitation lorsque la durée d’habilitation, qui ne peut excéder celle de l’avis de sécurité, est inférieure à celle de la fonction ou de la mission la justifiant, la validité de la décision initiale est tacitement prorogée d’une durée maximale de douze mois après la fin de validité de la décision initiale sous réserve qu’une demande de renouvellement, pour la même fonction ou la même mission, soit engagée dans un délai d’un an minimum et, au plus tard, trois mois avant la date d’expiration de l’habilitation en cours. \n\n Cette demande de renouvellement s’accompagne d’un nouveau dossier de demande d’habilitation (cf. 3.3.1.1). \n\n Si la procédure de renouvellement n’est pas engagée dans les délais impartis, aucune prorogation tacite n’est, en revanche, possible. Le titulaire doit quitter sans délai les fonctions ou cesser la mission ayant justifié son habilitation à expiration de la décision initiale."
  7_prefix: "3.5.7"
  7_label: "Portabilité de l’avis de sécurité en cas de changement de fonction ou de mission nécessitant une nouvelle habilitation"
  7_desc: "En cas de changement de fonction ou de mission de la personne habilitée, l’habilitation détenue à ce titre devient caduque. Si l’intéressé exerce une nouvelle fonction ou accomplit une nouvelle mission pour laquelle une habilitation est requise, une nouvelle procédure est engagée. \n\n Lorsque l’avis de sécurité ayant fondé l’habilitation précédente est toujours en cours de validité et qu’aucun changement de situation justifiant sa révision (cf. 3.5.3) n’est survenu, la nouvelle décision d’habilitation est délivrée sur la base de l’avis de sécurité en cours et n’excède pas la durée de validité de ce dernier. \n\n Afin de garantir la portabilité de l’avis de sécurité en cas de changement d’autorité d’habilitation, l’officier de sécurité de l’organisme quitté ou l’autorité compétente renvoie la décision d’habilitation et l’engagement de responsabilité à l’autorité ayant décidé l’habilitation. La précédente autorité d’habilitation transmet à la nouvelle autorité d’habilitation une attestation d’avis de sécurité (cf. Annexe 15) assortie de sa durée de validité. Parallèlement, afin d’éclairer sa décision, la nouvelle autorité d’habilitation peut demander au service enquêteur que l’avis de sécurité lui soit renvoyé, ainsi que les motifs l’ayant justifié."
  8_prefix: "3.5.8"
  8_label: "Cessation ou modification des droits associés à l’habilitation"
  8_desc: "Le service des ressources humaines collabore avec l’autorité d’emploi et l’officier de sécurité afin de gérer les aspects liés au départ ou au changement de fonction de la personne habilitée (sensibilisation, retrait des droits d’accès au site et aux systèmes d’information classifiés, etc.). En outre, l’officier de sécurité s’assure du retrait immédiat des différents droits d’accès. Il en informe l’officier de sécurité des systèmes d’information concernés qui veille au retrait des droits et moyens d’accès aux systèmes d’information classifiés. \n\n Un inventaire des informations et supports classifiés dont l’intéressé a été le détenteur est établi dans les conditions énumérées à la partie 7.4. \n\n Les obligations relatives à la protection des informations classifiées auxquelles il a pu être donné accès, perdurent au-delà du terme mis aux fonctions ou à l’habilitation de l’intéressé. Ce dernier en est informé lorsqu’il signe le second volet de l’engagement de responsabilité. Une fois signé, ce document est retourné à l’autorité d’habilitation."
7:
  prefix: "3.6"
  title: "Formation et sensibilisation de la personne habilitée"
  1_prefix: "3.6"
  1_label: "Formation et sensibilisation de la personne habilitée"
  1_desc: "Lors de la notification de sa décision d’habilitation, la personne habilitée est sensibilisée aux enjeux de la protection du secret. À cette occasion, elle est informée qu’elle ne peut se prévaloir de sa décision d’habilitation en dehors de l’exercice de ses fonctions ou de l’accomplissement de sa mission (cf. 3.4.3). \n\n La personne habilitée est formée de manière adaptée à ses fonctions, à la protection du secret, de façon à développer les compétences nécessaires pour traiter des informations et supports classifiés. Ces actions de formation sont renforcées pour les personnes ayant des responsabilités particulièrement sensibles au regard de la protection du secret. \n\n La formation, organisée par l’officier de sécurité et l’officier de sécurité des systèmes d’information, porte notamment sur : \n\t- les risques d’investigations ou d’approches par des individus ou des organisations étrangers ; \n\t- les dispositions législatives et réglementaires en vigueur (code pénal, code de la défense, présente instruction, instruction ministérielle), ainsi que les accords et règles internationales applicables ; \n\t- la politique de protection du secret, y compris celle des systèmes d’information de l’organisme ; \n\t- les bonnes pratiques à mettre en œuvre dans l’environnement de travail et celles relatives à la sécurité informatique appliquées aux systèmes d’information ; \n\t- les mesures à prendre en cas de compromission, ainsi qu’en cas d’incident affectant la sécurité d’un système d’information. \n\n Lorsque la personne habilitée est amenée à se rendre hors du territoire national, elle en avertit l’officier de sécurité qui, le cas échéant, peut organiser une action de sensibilisation spécifique avant son déplacement et éventuellement, à son retour. \n\n L’officier de sécurité et l’officier de sécurité des systèmes d’information ou toute autre personne désignée par eux, dans leur domaine respectif de compétence, sont chargés de veiller à l’application de la présente instruction et, le cas échéant, de l’instruction ministérielle, ainsi qu’à la sensibilisation du personnel sur les nécessités de garantir la protection du secret."
8:
  prefix: "4.1"
  title: "Établissements publics de l’état"
  1_prefix: ""
  1_desc: "Tout établissement public sous tutelle de l’État peut accéder à des informations et supports classifiés sous réserve : \n\t- de disposer d’un besoin d’en connaître reconnu par le ministre dont il relève ; \n\t- du respect des mesures définies par la présente instruction, complétée de l’instruction ministérielle de son ministre de tutelle et, le cas échéant, des directives techniques particulières applicables à son secteur d’activité. \n\n Le responsable de l’établissement est, en sa qualité de responsable d’organisme, responsable du respect des règles de la protection du secret en son sein et par son personnel (cf. 2.2.1), sous le contrôle de son ministre et, par délégation, du haut fonctionnaire de défense et de sécurité, de tutelle. \n\n À ce titre, notamment, le responsable de l’établissement s’assure de l’aptitude de ses locaux à abriter des éléments couverts par le secret de la défense nationale au regard de la présente instruction, complétée de l’instruction ministérielle de son ministre de tutelle et, le cas échéant, des directives techniques particulières applicables à son secteur d’activité. En cas d’utilisation d’un système d’information, il s’assure, de la même façon, que ce système est apte à traiter et protéger les informations et supports classifiés qu’il héberge. \n\n Lorsqu’un établissement public candidate à un appel d’offres ou un appel à projet international nécessitant l’accès à des informations et supports classifiés, il se conforme aux exigences de l’autorité contractante étrangère et suit, le cas échéant, la procédure décrite au 4.4.1.4 g)."
9:
  prefix: "4.2"
  title: "Opérateurs d’importance vitale"
  1_prefix: ""
  1_desc: "Les opérateurs d’importance vitale ayant accès, en cette qualité, à des informations et supports classifiés n’ont pas à faire l’objet d’une habilitation « personne morale » mais se conforment aux dispositions de la présente instruction, complétée de l’instruction ministérielle du ministre coordonnateur dont ils relèvent, des directives techniques particulières, le cas échéant, applicables, ainsi qu’aux dispositions spécifiques détaillées dans le plan de sécurité d’opérateur et le plan particulier de protection. \n\n En dehors des activités liées à sa désignation en tant qu’opérateur d’importance vitale, un tel opérateur ne peut accéder au secret de la défense nationale sauf s’il est partie à une convention ou un contrat nécessitant l’accès au secret de la défense nationale, conformément aux dispositions des parties 4.3 et 4.4. \n\n Le délégué pour la défense et la sécurité, prévu par la réglementation relative à la sécurité des activités d’importance vitale, exerce la fonction d’officier de sécurité. Le cas échéant, cette fonction peut être exercée par son adjoint."
10:
  prefix: "4.3"
  title: "Autres personnes morales associées à la protection des intérêts fondamentaux de la nation"
  1_prefix: ""
  1_desc: "La recrudescence de l’espionnage par les services de renseignements étrangers, les évolutions de la menace non-étatique et les tentatives accrues de captation du patrimoine scientifique et technologique de la Nation nécessitent d’associer pleinement les collectivités territoriales et les acteurs privés à la protection des intérêts fondamentaux de la Nation. \n\n Lorsqu’il est justifié par cette association, fondée sur le volontariat de la collectivité territoriale ou de la personne morale de droit privé, l’accès à des informations ou supports classifiés est autorisé sous réserve d’être encadré par une convention précisant l’objet et l’objectif de cette association et comportant un plan contractuel de sécurité énumérant, conformément aux exigences décrites au paragraphe 4.4.2.3 a) et en Annexe 17, les engagements pris par la personne morale pour protéger ces informations et supports classifiés. L’État peut décider de suspendre ou de mettre fin unilatéralement à la convention à tout moment. En cas de fin de la convention, les informations et supports classifiés transmis à la collectivité territoriale ou à la personne morale de droit privé sont restitués ou détruits conformément aux stipulations du plan contractuel de sécurité. \n\n Lorsque la coopération le justifie, l’État peut exiger que l’exécution de la convention soit conditionnée à l’habilitation préalable de la personne morale selon les modalités décrites à la partie 4.4. Cette exigence est stipulée dans le plan contractuel de sécurité adossé à la convention. \n\n Les conventions conclues au titre du présent paragraphe sont élaborées selon le modèle établi par le secrétaire général de la défense et de la sécurité nationale et conclues après avis favorable du haut fonctionnaire de défense et de sécurité dont l’autorité étatique contractante relève. Le haut fonctionnaire de défense et de sécurité en contrôle la mise en œuvre, adresse une copie de chaque convention signée au secrétaire général de la défense et de la sécurité nationale et en dresse le bilan qualitatif dans le compte rendu annuel sur la protection du secret (cf. 2.3.4)."
11:
  prefix: "4.4"
  title: "Mesures applicables dans le cadre d’un contrat de la commande publique, d’un contrat de sous-traitance ou d’un sous-contrat a un contrat de la commande publique ou d’un contrat de subvention"
  desc: "Les dispositions de la présente partie s’appliquent, selon les modalités définies ci-après, aux personnes morales (y compris les autoentrepreneurs), candidates ou parties à un contrat de la commande publique, à un contrat de sous-traitance, à un sous-contrat à un contrat de la commande publique, à un contrat de subvention, ci-après désigné sous le terme générique de « contrat », ou à un contrat exécuté au profit d’une entité étrangère impliquant l’accès du contractant à des informations et supports classifiés (cf. Annexe 18). \n\n L’État doit pouvoir, y compris dans l’exercice de ses missions en matière de défense et de sécurité nationale, s’appuyer sur des compétences extérieures, en particulier dans les domaines technique, technologique, industriel ou pour l’optimisation des fonctions de soutien. Il doit alors être en mesure d’échanger en toute confiance avec ses cocontractants et leurs sous-traitants, y compris des informations et supports couverts par le secret de la défense nationale. \n\n Ainsi, la procédure d’habilitation propre à la personne morale vise un double objectif : \n\t- à travers les vérifications effectuées dans son cadre sur l’actionnariat de la personne morale, son équipe dirigeante, ses modes de financement, sa stratégie, ses relations contractuelles, elle permet à l’État de prendre des garanties sur la fiabilité de ses cocontractants et leur chaîne de sous-traitance, indépendamment de celle qu’offre la procédure d’habilitation du représentant légal de la personne morale et de ses seuls préposés susceptibles d’accéder à des informations et supports classifiés ; \n\t- à travers les vérifications faites sur l’organisation de la chaîne de sécurité mise en place par la personne morale (cf. 4.4.1.2), elle permet de s’assurer que la personne morale dispose de la structure de sécurité nécessaire à la protection des informations et supports classifiés auxquels elle est susceptible d’avoir accès et d’engager pénalement son représentant légal en cas de défaillance de cette structure de sécurité. L’habilitation de la personne morale impose des exigences plus ou moins étendues, selon qu’elle autorise : \n\t- uniquement l’accès de la personne morale à des informations et supports classifiés, sans détention de ces informations et supports par la personne morale dans ses locaux ou au sein d’un système d’information qu’elle détient ; \n\t- l’accès de la personne morale à des informations et supports classifiés avec détention physique de tout ou partie de ces informations et supports au sein d’au moins l’un de ses établissements ; \n\t- la détention par la personne morale d’informations et supports classifiés au sein d’un système d’information qu’elle détient."
  1:
    prefix: "4.4.1"
    title: "Avant signature du contrat"
    1_prefix: "4.4.1.1"
    1_label: "Obligation d’information par l’autorité publique contractante"
    1_desc: "\ta. Information relative à l’obligation d’habilitation \n Le responsable légal est informé, dans la mesure du possible dès la pré-information et au plus tard dès l’avis d’appel public à la concurrence ou, à défaut de mise en concurrence, dès le début de la procédure de passation, de son obligation d’obtenir, pour lui-même et pour la personne morale qu’il représente, des habilitations de même niveau, préalablement à la signature du contrat, voire dès le dépôt de leur candidature. \n\n L’autorité publique contractante l’informe des délais impartis pour fournir les éléments constitutifs des dossiers de demande d’habilitation. Elle lui adresse les formulaires nécessaires ou, à défaut, lui indique les modalités pour se les procurer ainsi que, le cas échéant, le service compétent pour traiter le dossier. Dans le cadre d’un contrat de sous-traitance ou d’un souscontrat à un contrat de la commande publique impliquant également l’accès à des informations ou supports classifiés, le primo-contractantest tenu à la même obligation d’information à l’égard de ses sous-traitants et sous-contractants.\n \n\tb. Informations relatives à l’obligation de mise en conformité physique en cas de détention d’informations ou supports classifiés Lorsque le contrat ou sa procédure de passation ou de conclusion impliquent la détention au sein d’un ou plusieurs établissements de la personne morale d’informations et supports classifiés, l’autorité publique contractante informe la personne morale des normes physiques que cette détention implique et dont la conformité aux exigences de la présente instruction est sanctionnée par l’obtention d’un avis d’aptitude physique délivré par le service enquêteur compétent. \n \n\tc. Informations relatives à l’obligation d’homologation des systèmes d’information appelés à traiter des informations classifiées et aux procédures de sécurité à mettre en place pour la gestion des articles contrôlés de la sécurité des systèmes d’information \n\n Si l’utilisation d’un système d’information classifié est requise pour l’exécution du contrat, voire dans le cadre de sa passation ou de sa conclusion, l’autorité publique contractante précise que ce système doit faire l’objet, préalablement à son emploi, d’une décision d’homologation et que la mise en œuvre ou l’accès à des articles contrôlés de la sécurité des systèmes d’information (ACSSI) impliquent le respect des mesures de sécurité requises par la présente instruction."
    2_prefix: "4.4.1.2"
    2_label: "Préfiguration de la chaîne de sécurité de la personne morale"
    2_desc: "Pour toutes les démarches engagées avant la signature du contrat, le représentant légal de la personne morale désigne, parmi son personnel, la personne qui exercera la fonction d’officier de sécurité (cf. Annexe 19) et, le cas échéant, celle qui exercera la fonction d’officier de sécurité des systèmes d’information, répondant aux exigences définies aux 2.2.2.1 et 2.2.3.2 pour être les correspondants de l’autorité publique contractante et de l’autorité d’habilitation."
    3_prefix: "4.4.1.3"
    3_label: "Communication d’informations et supports classifiés en phase précontractuelle"
    3_desc: "Sauf si l’autorité publique contractante exige l’habilitation dès la candidature, lorsqu’en phase précontractuelle d’un contrat de la commande publique ou d’un contrat de subvention, l’accès à des informations et supports classifiés par les candidats admis est nécessaire, l’habilitation des personnes physiques employées par la personne morale candidate est possible sans que la personne morale qui les emploie ne soit elle-même habilitée, à condition que la procédure d’habilitation la concernant ait été engagée et que les lieux destinés à abriter les informations et supports classifiés soient aptes à les conserver conformément aux dispositions mentionnées au chapitre 5, à moins que l’autorité publique contractante ou le pouvoir adjudicateur lui permette de disposer d’un accès aux informations et supports classifiés dans ses propres locaux. \n\n Le candidat désigne parmi son personnel, au plus tard lorsque sa candidature a été retenue pour établir une offre, les personnes qui accèderont aux informations et supports classifiés dans le strict besoin de l’élaboration de l’offre. Si les personnes désignées ne sont pas titulaires d’une habilitation ou si la décision d’habilitation les concernant n’est pas appropriée aux besoins du contrat, le candidat dépose simultanément une demande d’habilitation pour chacune d’elles. Cette demande est instruite en procédure d’urgence (cf. 3.3.2). La délivrance d’une décision d’habilitation provisoire des personnes qui accèderont aux informations et supports classifiés dans le strict besoin de l’élaboration de l’offre ne préjuge pas de l’habilitation de la personne morale pour exécuter ledit contrat. \n\n Le candidat dont l’offre n’est pas retenue détenant des informations et supports classifiés est tenu de les restituer à l’autorité contractante dès la notification du rejet de son offre et selon les modalités définies par l’autorité publique contractante. Il remet à l’autorité publique contractante une attestation par laquelle il certifie ne conserver aucune information ni support classifié. Dans le cas où des informations ou supports classifiés ont été transmis sous forme dématérialisée, il fournit une attestation précisant que les documents ont été effacés conformément aux dispositions de la présente instruction. Si les systèmes d’information classifiés et les articles contrôlés de la sécurité des systèmes d’information utilisés pour consulter les informations dématérialisées ne sont plus utilisés dans le cadre d’autres conventions ou contrats, ils sont détruits selon les dispositions de la présente instruction."
    4_prefix: "4.4.1.4"
    4_label: "Procédure d’habilitation de la personne morale"
    4_desc: "À l’exception des établissements publics de l’État pour les contrats conclus avec une autorité publique contractante française, les personnes morales souhaitant conclure un contrat nécessitant pour son exécution l’accès à des informations et supports classifiés doivent être habilitées. La personne morale doit pouvoir justifier de son habilitation, ainsi que de celle de son responsable légal dès la candidature si l’autorité publique contractante l’exige ou au plus tard au moment de la signature du contrat (cf. 4.4.1.4 d)). \n \n\ta. Constitution du dossier d’habilitation \n Afin d’enclencher la procédure d’habilitation, la personne morale constitue un dossier d’habilitation (cf. Annexe 20). Ce dossier comprend également les éléments nécessaires au lancement de la procédure d’habilitation de son responsable légal conformément à la procédure détaillée à la partie 3.3. \n\n Si la personne morale a déjà fait l’objet d’une décision d’habilitation à l’occasion d’un précédent contrat, elle est tenue de présenter : \n\t\t- une attestation d’avis de sécurité (cf. Annexe 21) produite par l’autorité d’habilitation mentionnant la fin de validité de l’avis de sécurité délivré par le service enquêteur compétent ou, dans le cas où l’autorité d’habilitation est identique à celle ayant délivré la précédente habilitation, une attestation d’habilitation (cf. Annexe 22) ; \n\t\t- une attestation précisant qu’aucun changement dans la direction ou les statuts de la personne morale n’est intervenu depuis la délivrance de la précédente habilitation. \n \n\tb. Envoi du dossier d’habilitation \n Le dossier d’habilitation est transmis par l’officier de sécurité de la personne morale à l’autorité publique contractante. \n\n Dans le cadre d’un contrat de sous-traitance ou de sous-contrat à un contrat de la commande publique ou à un contrat de subvention, le dossier constitué par le sous-traitant ou le souscontractant est transmis soit par l’officier de sécurité du primo-contractant à l’autorité publique contractante, après vérification par ce dernier, de la complétude du dossier, soit directement à l’autorité publique contractante. Cette transmission est assortie d’une justification par le primo-contractant du besoin d’habilitation de son sous-traitant ou souscontractant et d’une copie du plan contractuel de sécurité du contrat que le primo-contractant prévoit de conclure avec le sous-traitant ou le sous-contractant, afin que l’autorité publique contractante puisse apprécier sa conformité avec la réglementation applicable et le plan contractuel de sécurité du contrat principal. \n\n L’envoi du dossier d’habilitation par voie dématérialisée est privilégié. \n \n\tc. Instruction du dossier d’habilitation \n L’autorité publique contractante vérifie la complétude des dossiers d’habilitation. Lorsque le dossier est incomplet, elle informe la personne morale des pièces manquantes et du délai imparti pour les fournir. À expiration de ce délai, la personne morale n’ayant pas fourni les documents nécessaires à la complétude de son dossier est réputée avoir renoncé au contrat. Le dossier d’habilitation est ensuite vérifié : \n\t\t- dans le cadre d’un contrat de la commande publique ou d’un appel à projet : par l’autorité publique contractante. Seuls les dossiers des candidats retenus sont ensuite transmis à l’autorité d’habilitation. L’autorité publique contractante informe l’autorité d’habilitation des candidats écartés aux différents stades de la compétition. Elle lui transmet le projet de plan contractuel de sécurité. Seuls les candidats retenus se voient délivrés une décision d’habilitation ; \n\t\t- dans le cadre d’un contrat de sous-traitance ou d’un sous-contrat : par l’autorité d’habilitation du primo-contractant. \n Après cette première phase d’instruction, l’autorité d’habilitation transmet les dossiers d’habilitation au service enquêteur compétent conformément au 3.3.1.3 b). Le service enquêteur mène les investigations nécessaires sur chaque personne morale pour évaluer l’absence de vulnérabilité pour la défense et la sécurité nationale.\n\n Le service enquêteur émet un avis de sécurité qui est ensuite transmis à l’autorité d’habilitation. Sauf changement dans la situation de fait ou de droit de la personne morale, la durée de validité de l’avis de sécurité émis est fixée conformément au 3.3.1.3 d). \n\n Au regard du principe de reconnaissance des habilitations entre autorités d’habilitation (cf. 4.4.1.4 e)), l’avis de sécurité ainsi que tous les éléments relatifs à l’habilitation de la personne morale détenue par l’autorité d’habilitation précédente sont transmis à la nouvelle autorité d’habilitation. À cet effet, la personne morale fait état des habilitations en cours ou précédemment détenues par la personne morale, ainsi que des autorités d’habilitation correspondantes (cf. Annexe 20). \n \n\td. Délivrance de la décision d’habilitation \n La décision d’habilitation de la personne morale est une décision explicite délivrée par l’autorité d’habilitation (cf. Annexe 23), notamment sur le fondement de l’avis de sécurité émis par le service enquêteur compétent. L’autorité d’habilitation n’est pas liée par cet avis, qui n’est qu’un des éléments parmi les actes préparatoires à sa décision. La décision d’habilitation comporte une durée de validité fixée par l’autorité d’habilitation ainsi que, s’il y a lieu, un domaine de validité. Cette durée ne peut excéder la durée de validité de l’avis de sécurité émis conformément au 3.3.1.3 d). \n\n Dans le cas où le service enquêteur n’a pas encore rendu son avis, en cas d’urgence justifiée et après saisine du service enquêteur, l’autorité d’habilitation, peut exceptionnellement prendre sa décision au vu d’autres éléments utiles en sa possession. L’habilitation ainsi délivrée est provisoire. \n\n Tout changement de fait ou de droit dans la situation de la personne morale de droit privé intervenant après la décision doit être signalé à l’autorité d’habilitation afin de lui permettre, le cas échéant, de reconsidérer sa décision. \n\n La décision de refus d’habilitation (cf. Annexe 24) est notifiée au représentant légal de la personne morale (cf. Annexe 25) dans les conditions prévues au 3.4.2.2. Une décision de refus ne préjuge pas de la conclusion de conventions ou de contrats de toute nature n’impliquant pas la mise en œuvre de mesures de protection du secret de la défense et de la sécurité nationale ou impliquant l’accès au secret de la défense nationale pour un besoin autre que celui résultant du contrat pour lequel l’habilitation est refusée. \n \n\te. Principe de reconnaissance de la décision d’habilitation d’une personne morale \n Dans le cas où une personne morale a déjà fait l’objet d’une habilitation à l’occasion d’une convention ou d’un contrat, cette habilitation demeure valable, pour toute autre convention ou contrat passé avec cette même personne morale par le ministère ou le service de l’État dont l’autorité d’habilitation relève, dans les limites de date et de domaine de validité de l’habilitation initiale et sauf changement dans la situation de fait ou de droit de la personne morale. \n\n Dans le cas où une personne morale a déjà fait l’objet d’une habilitation à l’occasion d’une convention ou d’un contrat par une autorité d’habilitation relevant d’un autre ministère ou d’un autre service de l’État et lorsque l’avis de sécurité émis à cette occasion est toujours valide, sauf changement dans la situation de droit ou de fait de la personne morale, une nouvelle décision d’habilitation est prise sur la base de l’avis de sécurité en cours. Cette décision ne peut excéder ni la durée de validité ni le domaine d’application de l’avis de sécurité initial. \n \n\tf. Cas particulier des personnes morales de droit étranger soumissionnant à un contrat de droit français nécessitant l’accès à des informations ou supports classifiés \n Seule une personne morale établie sur le territoire d’un État avec lequel la France dispose d’un accord général ou spécifique de sécurité (cf. 7.2.1.3) peut être habilitée dans le cadre d’un contrat de droit français prévoyant l’accès à des informations ou supports classifiés. \n\n La personne morale de droit étranger souhaitant conclure un tel contrat est alors tenue, à l’appui de sa candidature, de produire une attestation justifiant de son habilitation, délivrée par l’autorité compétente de l’État dont elle relève. Si la personne morale de droit étranger n’est pas habilitée, l’autorité française d’habilitation saisit le secrétaire général de la défense et de la sécurité nationale, en sa qualité d’autorité nationale de sécurité, ou, le cas échéant, l’autorité de sécurité déléguée compétente afin de solliciter de l’autorité compétente de l’État, sous la juridiction de laquelle la personne morale de droit étranger se trouve, qu’elle procède à son habilitation. \n\n Aucune personne morale de droit étranger ne peut candidater ou présenter une offre lorsque l’exécution du contrat implique la détention au sein d’un établissement de la personne morale d’un système d’informations, d’informations ou supports portant la mention Spécial France.\n \n\tg. Cas des personnes morales de droit français soumissionnant dans un cadre international\n Lorsqu’une personne morale de droit français, non préalablement habilitée, candidate à un marché ou à un appel à projet au profit d’une autorité contractante de droit étranger, en vue d’un contrat nécessitant l’accès à des informations ou supports classifiés étrangers, elle adresse un dossier d’habilitation au secrétaire général de la défense et de la sécurité nationale, en sa qualité d’autorité nationale de sécurité ou, le cas échéant, à l’autorité de sécurité déléguée compétente. \n\n Le secrétaire général de la défense et de la sécurité nationale ou, le cas échéant, l’autorité de sécurité déléguée, transmet le dossier d’habilitation au service du haut fonctionnaire de défense et de sécurité compétent au regard du domaine d’activité de la personne morale ou du contrat considéré, en vue de la délivrance d’une décision d’habilitation conformément à la procédure décrite au sein de la présente partie. Lorsque la procédure d’habilitation permet la délivrance d’une décision d’habilitation, le haut fonctionnaire de défense et de sécurité adresse une attestation d’habilitation (cf. Annexe 22) à l’officier de sécurité de la personne morale candidate à l’habilitation, directement ou via le secrétaire général de la sécurité et de la défense nationale ou, le cas échant, l’autorité de sécurité déléguée compétente. Dans tous les cas, une copie de la décision d’habilitation ou du refus d’habilitation est transmise au secrétaire général de la sécurité et de la défense nationale et, le cas échant, à l’autorité de sécurité déléguée compétente. \n\n Une personne morale déjà habilitée et disposant d’un avis de sécurité en cours de validité s’adresse à son autorité d’habilitation pour une extension éventuelle de son domaine d’habilitation. L’autorité d’habilitation adresse une attestation d’habilitation à l’officier de sécurité de la personne morale candidate, directement ou via le secrétaire général de la défense et de la sécurité nationale ou, le cas échant, l’autorité de sécurité déléguée compétente. Dans tous les cas, une copie de l’attestation d’habilitation est transmise au secrétaire général de la défense et de la sécurité nationale et, le cas échant, à l’autorité de sécurité déléguée compétente."
    5_prefix: "4.4.1.5"
    5_label: "Lancement de la procédure d’aptitude physique"
    5_desc: "\ta. Cas où la personne morale ne dispose pas d’avis technique d’aptitude des locaux et des systèmes d’information contribuant à la sécurité des locaux \n Lorsque le contrat implique la détention par la personne morale d’informations et supports classifiés, la personne morale dépose, parallèlement au dossier d’habilitation et le cas échéant d’homologation du ou des systèmes d’information classifiés qui ont vocation à être utilisés pour l’exécution du contrat, un dossier d’aptitude pour chacun des établissements situés sur le territoire français dans lesquels elle envisage de conserver des informations et supports classifiés. Ce dossier est destiné à évaluer l’aptitude desdits établissements à assurer la protection des éléments couverts par le secret de la défense nationale. \n\n Un contrôle initial d’aptitude portant sur les mesures prises par la personne morale pour assurer la sécurité des informations et supports classifiés et, le cas échéant, du système d’information chargé du contrôle d’accès, est effectué par le service enquêteur dans le ou les établissement(s) concerné(s), préalablement à la signature de la convention ou du contrat. \n\n À l’issue du contrôle initial, l’avis technique d’aptitude physique délivré par le service enquêteur est transmis à l’autorité publique contractante et à l’autorité d’habilitation et notifié à la personne morale : \n\t\t- si l’avis est sans réserve : le responsable légal de la personne morale établit une attestation de conformité physique certifiant la conformité aux normes des locaux du ou des établissements concernés (cf. Annexe 26) ; \n\t\t- si l’avis fait état de carences dans le dispositif de sécurité mis en œuvre au sein de la personne morale : son responsable légal s’engage à mettre en œuvre toutes les mesures nécessaires à la mise en conformité de son établissement et des systèmes d’information contribuant à la sécurité des locaux, dans un délai défini en liaison avec le service enquêteur et l’autorité publique contractante et compatible avec la date de début des prestations du contrat nécessitant la détention d’informations et de supports classifiés. \n\n À l’issue des travaux de mise aux normes et, au plus tard, à la date d’échéance du délai défini en liaison avec le service enquêteur, le responsable légal de la personne morale transmet le certificat de mise aux normes de sécurité physique (cf. Annexe 27) à l’autorité publique contractante et à l’autorité d’habilitation. Cette dernière en informe le service enquêteur et peut, en lien avec l’autorité publique contractante, le solliciter pour diligenter un contrôle. \n \n\tb. Cas où un avis technique d’aptitude des locaux et des systèmes d’information contribuant à la sécurité des locaux est déjà en cours de validité \n Si les locaux où seront abrités les informations et supports classifiés dans le cadre de la convention ou du contrat considéré disposent d’un avis technique d’aptitude physique en cours de validité et qu’aucun changement des conditions qui ont présidé à sa délivrance n’est intervenu, cet avis suffit. Le responsable d’organisme le communique alors à l’autorité publique contractante et à l’autorité d’habilitation, accompagné d’une attestation de nonchangement des conditions qui ont présidé à sa délivrance. \n\n Il en va de même pour le système d’information chargé du contrôle d’accès."
    6_prefix: "4.4.1.6"
    6_label: "Lancement de la démarche d’homologation"
    6_desc: "Lorsque l’exécution de la convention ou du contrat prévoit l’utilisation d’un système d’information classifié, la personne morale engage parallèlement à la procédure d’habilitation et à la démarche d’aptitude physique, une démarche d’homologation conformément aux modalités précisées à la partie 6.1. \n\n Si la personne morale dispose déjà d’un système d’information classifié homologué au niveau requis, la décision d’homologation demeure valide. La personne morale adresse alors une copie de la décision d’homologation à l’autorité publique contractante, ainsi qu’à l’autorité d’habilitation."
  2:
    prefix: "4.4.2"
    title: "Exécution du contrat"
    1_prefix: "4.4.2.1"
    1_label: "Décisions administratives préalables au lancement de l’exécution des prestations du contrat nécessitant l’accès à des informations ou supports classifiés"
    1_desc: "\ta. Finalisation du dossier d’aptitude physique Si les attestations d’aptitude physique ne sont pas parvenues dans le délai prédéfini ou si des carences sont constatées lors des contrôles effectués par le service enquêteur conformément au 4.4.1.5 a), une mise en demeure de se conformer aux prescriptions de la présente instruction est effectuée par l’autorité publique contractante. Le défaut d’exécution des travaux de mise en conformité fait obstacle à l’exécution du contrat et engage la responsabilité du représentant légal de la personne morale. \n \n\tb. Finalisation de la démarche d’homologation des systèmes d’information classifiés Dans le cas où la procédure d’homologation du système d’information classifié devant être utilisé pour l’exécution du contrat n’a pas été finalisée avant la signature du contrat, l’homologation du système doit intervenir au plus tard avant le début des prestations du contrat nécessitant son utilisation selon un calendrier établi en liaison avec l’autorité publique contractante. \n\n L’autorité publique contractante peut, en parallèle de la démarche d’homologation ou de confirmation de l’existence d’une décision d’homologation en cours de validité, solliciter auprès du service enquêteur compétent, un contrôle d’aptitude visant à vérifier la capacité du système d’information à traiter des informations et supports classifiés au niveau requis conformément aux exigences de la présente instruction et de l’instruction interministérielle n° 300 sur les signaux parasitaires compromettants. \n \n\tc. Habilitation des personnes physiques participant à l’exécution du contrat prévoyant l’accès à des informations ou supports classifiés \n Sont seules autorisées à connaître des informations et supports classifiés pour le compte d’une personne morale habilitée les personnes rattachées à cette dernière qui ont fait l’objet d’une décision d’habilitation délivrée à l’issue de l’une des procédures d’habilitation définies à la partie 3.3. \n\n Cette décision doit intervenir avant le début d’exécution par la personne physique considérée de ses missions nécessitant l’accès à des informations ou supports classifiés. \n\n Afin d’éviter tout retard dans le lancement de l’exécution des prestations du contrat nécessitant l’accès à des informations ou supports classifiés, les procédures d’habilitation des personnes non encore habilitées sont lancées dès la signature du contrat, ou en amont de celleci, si la conclusion du contrat avec la personne morale considérée est certaine. \n\n Sauf exception relative aux administrateurs et auditeurs des systèmes d’information classifiés et internes à la personne morale (cf. 3.2.2), le niveau et la durée de validité de cette habilitation ne peuvent excéder ceux de l’habilitation de la personne morale. \n\n Un catalogue des emplois, tenu par l’officier de sécurité de la personne morale, est établi et mis à jour selon les modalités définies au 3.1.2.2, complétées le cas échéant des dispositions de l’instruction ministérielle, des directives techniques particulières applicables et des stipulations du plan contractuel de sécurité. \n\n Ce catalogue des emplois tient lieu de répertoire des postes nécessitant l’accès à des informations ou supports classifiés. Il indique le niveau, les dates de délivrance et de fin de validité des décisions d’habilitation du personnel. Une mise à jour annuelle est réalisée et, à cette occasion, le représentant légal de la personne morale vérifie que les personnes habilitées ont effectivement eu accès à des informations et supports classifiés pour le niveau concerné et supprime, le cas échéant, les fonctions et missions ne nécessitant plus d’accéder au secret de la défense nationale. \n\n Dès lors qu’une personne physique est susceptible, dans l’exécution de son contrat de travail, de connaître ou de détenir des informations et supports classifiés, son contrat de travail comporte, dans la mesure du possible, une clause de protection du secret de la défense nationale conforme à la clause-type figurant à l’Annexe 17. En cas de changement d’affectation amenant le salarié à travailler dans les conditions définies au premier alinéa, le contrat de travail fait l’objet d’un avenant écrit conforme aux présentes dispositions. Les parties au contrat de travail peuvent compléter ou adapter la clause-type selon les spécificités dudit contrat sans lui être contraire."
  3:
    prefix: "4.4.3"
    title: "Résiliation et terme du contrat"
    1_prefix: "4.4.3.1"
    1_label: "Fin de l’habilitation de la personne morale"
    1_desc: "Si la décision d’habilitation arrive à expiration au cours de l’exécution d’un contrat visé par les présentes dispositions, une demande de renouvellement est déposée auprès de l’autorité d’habilitation dans l’année et, au plus tard, six mois avant cette date d’expiration. La durée de validité de la décision est alors prorogée dans les conditions définies au paragraphe 3.5.6. \n\n L’habilitation peut être abrogée en cours de validité ou peut ne pas être renouvelée si la personne morale de droit privé ne remplit plus les conditions nécessaires à sa délivrance. \n\n L’abrogation de la décision d’habilitation (cf. Annexe 24) est notifiée au représentant légal de la personne morale dans les mêmes formes que le refus d’habilitation (cf. 3.4.2.2). \n\n L’abrogation de la décision d’habilitation n’entraîne pas nécessairement la résiliation du contrat, en particulier si l’accès aux informations et supports classifiés n’est plus nécessaire à son exécution. Les conséquences d’une telle décision doivent ainsi être examinées au cas par cas."
    2_prefix: "4.4.3.2"
    2_label: "Mesures particulières en fin d’exécution du contrat"
    2_desc: "Lorsque les prestations du contrat nécessitant l’accès à des informations et supports classifiés ont été réalisées, la personne morale en informe dans le délai d’un mois l’autorité publique contractante qui lui précise la destination à donner aux informations et supports classifiés qu’elle détenait jusqu’alors. À cet effet, les modalités de destruction, d’archivage ou de restitution des informations et supports classifiés ainsi que celles portant sur le démantèlement des systèmes d’information classifiés sont définies par l’autorité publique contractante de référence en liaison avec les services concernés dans une fiche de clôture du plan contractuel de sécurité. Le plan contractuel de sécurité du contrat est clôturé sauf s’il a donné lieu à un ou plusieurs sous-traités ou sous-contrats. Dans ce cas, il ne peut être clôturé qu’après la clôture des plans contractuels de sécurité de chaque sous-contrat. \n\n Si la personne morale conserve des informations et supports classifiés après la clôture du plan contractuel de sécurité, elle est tenue de : \n\t- maintenir la chaîne fonctionnelle de protection du secret, complétée, le cas échéant, de la chaîne fonctionnelle de la sécurité des systèmes d’information ; \n\t- disposer d’une décision d’habilitation pour elle-même, valide et cohérente avec les informations et supports classifiés conservés ; \n\t- maintenir les habilitations de son personnel ayant le besoin d’en connaître ; \n\t- entretenir les aptitudes physiques des locaux abritant des informations et supports classifiés ; \n\t- tenir à jour les dossiers d’homologation des systèmes d’information classifiés et maintenir l’homologation de ces systèmes. \n\n Un suivi de ces obligations est assuré par le service enquêteur compétent."
12:
  prefix: "4.5"
  title: "Mesures de sécurité applicables en cas de cessation d’activité ou de dissolution de la personne morale"
  1_prefix: ""
  1_desc: "Le plan contractuel de sécurité précise les modalités de destruction, d’archivage ou de restitution des informations et supports classifiés détenus par la personne morale, en cas de cessation d’activité ou de dissolution de cette dernière"
13:
  prefix: "5.1"
  title: "Principe de defense en profondeur et analyse de risques"
  1_prefix: ""
  1_desc: "La protection du secret de la défense nationale appelle la mise en place de mesures de sécurité plus ou moins élevées selon qu’il s’agit de : \n\t- lieux dit « abritant », c’est-à-dire de lieux ayant vocation à conserver des informations et supports classifiés, quels qu’en soient le niveau et le volume90 ; \n\t- ou de lieux, telles que les salles de réunion, où des informations et supports classifiés sont communiqués, échangés ou manipulés mais où ces informations et supports n’ont pas vocation à être conservés. Dans les deux cas, le système de protection déployé est destiné à protéger les informations et supports classifiés contre toute menace, interne ou externe, qui pourrait mettre en cause leur disponibilité, leur intégrité, leur confidentialité et leur traçabilité et à empêcher qu’une personne non qualifiée puisse y accéder. Il s’appuie sur une analyse de risques et s’inscrit dans une logique de défense en profondeur qui repose sur des barrières successives répondant aux critères suivants : \n\t- être multifonctions, c’est-à-dire comporter plusieurs dispositifs successifs, complémentaires, de nature différente, associés ou combinés à un ou plusieurs dispositifs de détection-alarme reposant eux-mêmes sur des principes différents ; \n\t- être homogènes, c’est-à-dire garantir la même efficacité en tous points, l’atteinte aux informations et supports classifiés se mesurant toujours dans la zone de moindre résistance et la valeur d’un système équivalant à celle de son élément le plus faible ; \n\t- être dissuasives, c’est-à-dire contribuer à réduire le risque d’une tentative d’atteinte aux informations et supports classifiés ; \n\t- être contrôlées, c’est-à-dire être testées fréquemment afin de vérifier qu’elles sont en état opérationnel ; \n\t- être traçables, c’est-à-dire fournir tout moyen pouvant apporter un historique du fonctionnement des différents composants. La sécurité des lieux résulte de l’articulation des différentes mesures de protection définies à l’Annexe 29. La sécurité des lieux abritant repose sur une articulation de l’ensemble de ces mesures, conforme au niveau de classification des informations et supports qu’ils conservent. Les lieux où des informations et supports classifiés sont communiqués ou manipulés sans y être conservés garantissent a minima le respect des règles relatives à la classe du bâtiment et/ ou de l’emprise, ainsi qu’à la classe du local (cf. 2. a) et b) de l’Annexe 30). Il est à noter qu’un lieu où est installé ou conservé un système d’information classifié est considéré comme un lieu abritant."
14:
  prefix: "5.2"
  title: "Protection physique"
  1_prefix: "5.2.1"
  1_label: "Règles générales"
  1_desc: "Conformément au principe de défense en profondeur, la sécurité des informations et supports classifiés est assurée par un ensemble de mesures destinées à garantir l’intégrité des bâtiments, des lieux qui abritent les meubles dans lesquels ils sont conservés ou dans lesquels un système d’information classifié est déployé, ainsi que par la fiabilité des meubles dans lesquels ils sont conservés. Ces mesures ont pour objet d’éviter toute dégradation, compromission ou risque de compromission des informations et supports classifiés. \n\n Le degré de sécurité physique à appliquer pour assurer la protection des lieux abritant dépend des niveaux de classification et, le cas échéant, de protection logique des informations et supports classifiés qu’ils abritent et des menaces auxquelles ils sont exposés. \n\n Le dispositif global de protection et la solution technique retenue reposent sur les conclusions rendues par l’autorité compétente qui s’appuient sur l’évaluation des menaces et des contraintes inhérentes à l’environnement du site, ainsi que sur les méthodes de travail et de gestion des informations et supports classifiés concernés (par exemple, en fonction de la circulation de ces informations et supports dans le site et du nombre de personnes y ayant accès). \n\n La sécurisation physique des accès d’énergie, des locaux techniques et des moyens de communication participe également de la protection physique des informations et supports classifiés. \n\n Les informations et supports classifiés qui ne sont plus sous la surveillance de l’utilisateur font l’objet, selon les risques liés à leur environnement, de mesures de protection adaptées, déterminées par l’autorité compétente."
  2_prefix: "5.2.2"
  2_label: "Dispositif global de protection"
  2_desc: "Le dispositif de protection physique des informations, supports et systèmes d’information classifiés est constitué de plusieurs barrières successives, que sont : \n\t- l’emprise du bâtiment et/ou le bâtiment lui-même ; \n\t- les locaux qui contiennent le meuble ou les éléments du système d’information ; \n\t- le meuble dans lequel sont conservés les informations et supports classifiés ; \n\t- et, pour les systèmes d’information, la sécurité logique à l’égard des utilisateurs du système et éventuellement, à l’égard des ressources du système d’information. Le degré de protection de l’ensemble du dispositif est fonction du niveau de protection assuré par les mesures appliquées à chacune de ces barrières. Les types de mesures de sécurité physique, leur articulation selon le type de barrière et les mesures spécifiques aux niveaux supérieurs de classification sont détaillés de l’Annexe 29 à l’Annexe 32. \n\n Compte tenu de leur environnement particulier, les lieux dans lesquels sont conservés des informations et supports classifiés et, le cas échéant, des systèmes d’information classifiés, peuvent faire l’objet de dispositions de sécurité adaptées. \n\n Sur un territoire étranger et compte tenu de leur environnement particulier, les organismes détenteurs d’informations et supports classifiés français relevant administrativement ou contractuellement de la juridiction de l’État français, doivent, sauf urgence ou contrainte majeure (opérationnelle, etc.), appliquer les mesures de protection décrites dans la présente instruction. \n\n Lorsque les circonstances imposent la détention et la production d’informations et supports classifiés mais ne permettent pas la mise en place des moyens adéquats de sécurité physique, des mesures compensatoires sont prises afin de conserver le même niveau de protection. Ces mesures de substitution procèdent d’une analyse précise des risques, réalisée par le responsable du site concerné ou, le cas échéant, par le service enquêteur compétent. Elles sont évaluées par le service enquêteur compétent. Le service du haut fonctionnaire de défense et de sécurité est destinataire de l’analyse de risques et de l’avis du service enquêteur. Le niveau de protection doit, en toute hypothèse, être suffisant pour permettre la prise en compte du délai réel d’intervention avant la compromission."
15:
  prefix: "5.3"
  title: "Contrôle d'accès"
  1:
    prefix: "5.3.1"
    title: "Contrôle physique des accès"
    desc: "Le contrôle d’accès s’intègre dans un système de management de la sûreté qui comprend aussi bien des moyens de détection que de surveillance. Il combine des moyens techniques, organisationnels et humains et a pour objectif : \n\t- de filtrer les flux de circulation, les individus et les véhicules qui souhaitent entrer ou sortir d’un site, d’un bâtiment ou d’un local. L’accès à un local technique d’un système d’information classifié fait l’objet de mesures de protection physique supplémentaires ; \n\t- d’empêcher ou de limiter les déplacements de personnes non autorisées. \n\n Il peut s’appuyer sur la création de zones protégées et réservées."
    1_prefix: "5.3.1.1"
    1_label: "Zones protégées"
    1_desc: "La création d’une zone protégée est conseillée pour les lieux abritant des informations et supports classifiés au niveau Secret et obligatoire au niveau Très Secret. Une zone protégée est un local ou un terrain clos rattaché à une entreprise, un service, un établissement, public ou privé, intéressant la défense nationale, auquel l’accès est soumis à autorisation afin de protéger les installations, les matériels, le secret des recherches, des études ou des fabrications ou les informations et supports classifiés qui s’y trouvent. Elle est créée par arrêté ministériel selon les modalités définies aux articles R. 413-1 à R. 413-5 du code pénal et permet d’assurer aux lieux abritant des informations et supports protégés par le secret de la défense nationale une protection juridique renforcée, et notamment pénale, contre les intrusions, que ces lieux soient rattachés à un service de l’État, à un établissement public ou à toute personne physique ou morale, publique ou privée, intéressant la défense nationale. \n\n L’ensemble des accès est contrôlé et tracé en permanence afin d’éviter toute pénétration intentionnelle ou fortuite dans la zone protégée. Le système d’information permettant de contrôler et tracer les accès en zone protégée, homologué par l’autorité d’emploi, met en œuvre des mécanismes d’authentification et d’intégrité garantissant l’accès à ce système par les seules personnes autorisées. À défaut d’un tel système, un registre physique répondant aux mêmes objectifs, accessible aux seules personnes ayant le besoin d’en connaître, est utilisé. Les limites de la zone protégée et les mesures d’interdiction d’accès dont elle fait l’objet sont rendues apparentes afin de ne pas être franchies par inadvertance. À cet effet, des panneaux sont disposés en nombre suffisant aux endroits appropriés. \n\n Par principe, l’autorisation de pénétrer dans une zone protégée est donnée par le chef du service, de l’établissement ou de l’entreprise, selon les directives et sous le contrôle du ministre ayant déterminé le besoin de protection. Lorsque la zone est instituée pour protéger des recherches, études ou fabrications qui doivent être tenues secrètes dans l’intérêt de la défense nationale, l’autorisation est délivrée uniquement par le ministre qui a déterminé le besoin de protection. \n\n Conformément à l’article L. 114-1 du code de la sécurité intérieure, l’autorité chargée de prendre la décision peut diligenter une enquête administrative afin de s’assurer que le comportement de la personne, physique ou morale, n’est pas incompatible avec l’accès à cette zone ou ne l’est pas devenu. L’officier de sécurité du site saisit alors le service compétent d’une demande d’enquête administrative (cf. Annexe 6) avant d’autoriser l’accès à la zone protégée. Après instruction du dossier et sur la base des éléments qu’il a pu réunir, le service compétent émet un avis qu’il adresse au demandeur. Cet avis peut être favorable, défavorable ou réservé. La durée de validité de cet avis est laissée à l’appréciation de chaque ministre. L’autorisation d’accéder à une zone protégée est délivrée par écrit et peut être retirée à tout moment dans les mêmes formes. \n\n Sans préjudice des sanctions disciplinaires, toute personne non autorisée s’introduisant ou tentant de s’introduire dans une zone protégée encourt la peine prévue à l’article 413-7 du code pénal."
    2_prefix: "5.3.1.2"
    2_label: "Zones réservées"
    2_desc: "La création d’une zone réservée, par définition incluse dans une zone protégée et pouvant même lui correspondre, vise à apporter une protection complémentaire. Elle est obligatoire pour les lieux abritant des informations et supports classifiés, y compris les systèmes d’information classifiés, au niveau Très Secret. \n\n Les zones réservées sont créées par décision du responsable d’organisme. Chaque ministre veille à ce que des zones réservées soient créées dans tous les organismes qui, de manière habituelle, élaborent, traitent, reçoivent ou détiennent des informations et supports classifiés au niveau Très Secret. \n\n Les mesures de sécurité propres aux zones réservées sont définies en Annexe 32. \n\n Lorsqu’un organisme est amené à traiter ou détenir de tels informations et supports au niveau Très Secret pour des raisons opérationnelles et de manière temporaire, le responsable d’organisme crée une zone réservée temporaire soumise aux mesures de sécurité détaillées en Annexe 32, y compris lorsque les conditions de création d’une zone protégée ne sont pas réunies."
  2:
    prefix: "5.3.2"
    title: "Accès des personnes non habilitées dans le cadre de l’exécution d’un contrat « sensible »"
    1_prefix: "5.3.2.1"
    1_label: "Mesures de sécurité relatives au contrat sensible"
    1_desc: "Un contrat « sensible » est un contrat, quel que soit son régime juridique ou sa dénomination, qui n’implique pas l’accès à des informations ou supports classifiés mais dont l’exécution nécessite l’accès à un lieu abritant des éléments couverts par le secret de la défense nationale. \n\n Il s’agit notamment des contrats de gardiennage, d’entretien ou de maintenance de lieux abritant des éléments couverts par le secret de la défense nationale. \n\n Sauf si un accord de sécurité ou des règles de sécurité d’une organisation internationale, d’une institution, d’un organe ou d’un organisme de l’Union européenne impose, au cas d’espèce, des règles plus strictes, il n’y a pas lieu de procéder à l’habilitation de la personne morale ni à celle de son personnel. En revanche, l’autorité publique contractante ou le primo-contractant dans le cadre d’un contrat sensible en sous-traitance ou sous-contrat à un contrat classifié (cf. 4.4) ou sensible fait figurer au contrat les stipulations nécessaires pour garantir que ses conditions d’exécution ne portent pas atteinte au secret de la défense nationale. Ces stipulations prennent la forme d’une clause de protection du secret sur le modèle de clausetype présenté en Annexe 33, complétée ou adaptée, le cas échéant, selon les spécificités du contrat considéré, sans toutefois être contraire ou moins disante que le modèle."
    2_prefix: "5.3.2.2"
    2_label: "Mesures de sécurité relatives à la personne morale exécutant un contrat sensible"
    2_desc: "En application des dispositions des articles L. 114-1 et R. 114-4 du code de la sécurité intérieure, l’autorité contractante peut solliciter du service compétent que soit diligentée une enquête administrative à l’encontre d’une personne morale, ainsi que de ses éventuels souscontractants et leur personnel, sur la base des éléments fournis à l’occasion de la procédure de passation du marché ou lors de la demande d’acceptation du sous-contractant. \n\n Le service compétent adresse son avis, consigné sur une fiche navette (cf. Annexe 34), à l’autorité contractante et au service du haut fonctionnaire de défense et de sécurité concerné. Lorsque l’avis révèle un fait constituant un motif d’exclusion au sens des articles L. 2141-1 à L. 2141-5 de la commande publique, l’autorité publique contractante écarte la candidature de la personne morale concernée, sauf si des raisons impérieuses imposent le recours à la dite personne morale, que le marché en cause ne peut être confié qu’à ce seul opérateur économique et qu’un jugement définitif d’une juridiction d’un État membre de l’Union européenne n’exclut pas expressément l’opérateur concerné des marchés. \n\n Lorsque l’avis révèle un fait pouvant constituer un motif d’exclusion au sens des articles L 2141-7 à L. 2141-10 de la commande publique, l’autorité publique contractante peut écarter la candidature de la personne morale concernée selon les modalités prévues à l’article L. 2141-11 du même code."
    3_prefix: "5.3.2.3"
    3_label: "Mesures de sécurité relatives au personnel de la personne morale exécutant un contrat sensible"
    3_desc: "En application des dispositions des articles L. 114-1 et R. 114-4 du code de la sécurité intérieure, le personnel de la personne morale chargé d’exécuter la prestation prévue par le contrat sensible peut préalablement faire l’objet d’une enquête administrative par le service compétent. \n\n Il est recommandé d’insérer une clause de protection du secret (cf. Annexe 17, point 5) dans les contrats de travail des personnes exécutant un contrat sensible. Lorsqu’un salarié exécutant un contrat de travail ordinaire se trouve soumis aux conditions applicables aux contrats sensibles, un avenant conforme aux présentes dispositions peut être introduit dans son contrat de travail. \n\n Les parties contractantes peuvent compléter ou adapter la clause du contrat de travail mentionnée précédemment selon les spécificités dudit contrat sensible sans jamais lui être contraires."
    4_prefix: "5.3.2.4"
    4_label: "Accès des personnes non habilitées à des lieux abritant des éléments couverts par le secret de la défense nationale, dans le cadre de la législation du travail"
    4_desc: "Les règles de protection du secret de la défense nationale s’appliquent à toute inspection ou à tout contrôle prévu par des dispositions législatives ou réglementaires. En matière de législation sociale, les personnes morales de droit privé liées par un contrat prévoyant l’accès à des informations et supports classifiés (cf. chapitre 4) doivent concilier l’impératif de protection du secret de la défense nationale avec la nécessité d’appliquer les règles propres au droit du travail relatives aux contrôles et inspections (par exemple les médecins ou les inspecteurs du travail, les ingénieurs de prévention, les instances représentatives du personnel). Lorsque la personne morale de droit privé détient des éléments couverts par le secret de la défense nationale conformément aux dispositions précédentes, seule l’autorité responsable du site auquel le lieu abritant est rattaché, après contrôle de la qualité et vérification de l’identité des contrôleurs ou inspecteurs, les autorise à pénétrer dans les zones où sont abrités des informations et supports classifiés. \n\n Bien que les contrôleurs ou inspecteurs s’engagent à ne rien révéler des secrets de fabrication ou procédés d’exploitation qui pourraient leur être révélés à cette occasion, sous peine d’encourir des poursuites sur le fondement de la violation du secret professionnel98, ils ne sont nullement autorisés, sauf à être dûment habilités et à justifier du besoin d’en connaître pour l’exercice de leur fonction ou l’accomplissement de leur mission, à accéder ou à prendre connaissance d’informations et supports classifiés, cet accès restant subordonné au respect des règles énoncées par la présente instruction. \n\n Si, dans des circonstances exceptionnelles, l’un d’eux accède fortuitement à un secret de la défense nationale, il s’expose, en cas de divulgation, aux peines prévues à l’article 413-11 du code pénal."
    5_prefix: "5.3.2.5"
    5_label: "Exception en cas de secours, de sécurité ou d’incendie"
    5_desc: "Le personnel d’intervention en matière de secours, de sécurité ou d’incendie, agissant dans des cas d’urgence avérée, est autorisé à procéder aux opérations requises par la situation sans être soumis aux formalités ordinaires. \n\n Si, dans des circonstances exceptionnelles, l’une de ces personnes accède fortuitement à un secret de la défense nationale, elle s’expose, en cas de divulgation, aux peines prévues à l’article 413-11 du code pénal."
  3:
    prefix: "5.3.3"
    title: "Vérification de la protection physique par les services enquêteurs"
    1_prefix: "5.3.3.1"
    1_label: "Règles générales"
    1_desc: "Les lieux abritant des informations et supports classifiés font l’objet d’un avis technique d’aptitude physique à un niveau au moins égal au niveau de classification des informations et supports qu’ils ont vocation à abriter. \n\n Cet avis est délivré par le service enquêteur compétent. \n\ta. Au niveau Secret \n\t\t- pour les services de l’État : cet avis est facultatif ; \n\t\t- pour les établissements publics de l’État, les opérateurs d’importance vitale dans le cadre de leur accès à des informations et supports classifiés en raison de leur désignation en tant qu’opérateur d’importance vitale, les personnes morales, publiques ou privées, dans le cadre d’une convention au titre de la partie 4.3 : cet avis n’est pas obligatoire avant la détention et intervient au plus tard à l’occasion d’un contrôle organisé par le haut fonctionnaire de défense et de sécurité conformément au 2.3.3 ; \n\t\t- pour les personnes morales, publiques ou privées, liées par un contrat au sens de la partie 4.4, cet avis est obligatoire préalablement à la détention (cf. 4.4.1.1 b)). \n\tb. Au niveau Très Secret \n\n Cet avis est obligatoire, pour tout organisme, indépendamment de son statut juridique et de la finalité de détention, préalablement à la détention, sauf en cas d’impossibilité majeure."
    2_prefix: "5.3.3.2"
    2_label: "Évaluation de la sécurité physique"
    2_desc: "Le service enquêteur s’assure de la cohérence de l’analyse de risques et des moyens mis en œuvre pour contrer une atteinte aux informations et supports classifiés, notamment que les mesures de protection physique des locaux et de protection logique des systèmes d’information chargés de la sûreté, qu’elles soient réglementaires ou compensatoires, permettent de détecter une intrusion suffisamment tôt et de la freiner le temps nécessaire à une intervention (cf. Annexe 30). Cette évaluation figure dans l’avis technique d’aptitude physique. En raison de la diversité des dispositifs de protection disponibles sur le marché et de l’évolution constante des techniques utilisées, le responsable d’organisme peut, en cas de besoin, consulter les services enquêteurs sur les normes que doivent respecter les matériels et les systèmes de protection qu’ils désirent mettre en place. \n\n Lorsque les moyens techniques et, le cas échéant, logiques ne permettent pas de contrer une atteinte à la protection des informations et supports classifiés, le service enquêteur émet un avis technique d’inaptitude physique. Il peut également émettre un avis technique avec réserve si la mise aux normes est envisageable sous réserve de la réalisation de travaux de sécurité physique dans un délai défini en liaison avec l’officier de sécurité de l’organisme concerné. \n\n L’avis technique d’aptitude physique précise le niveau de classification des informations et supports classifiés qui peuvent être traités et conservés dans le local. En cas de changement affectant l’aptitude physique du lieu abritant pour lequel un avis technique d’aptitude physique a été délivré ou à l’occasion d’une inspection, d’un contrôle ou d’un audit réalisé par le service enquêteur ou par l’autorité administrative, une demande de réévaluation est formulée par l’officier de sécurité dans les plus brefs délais et avant l’échéance de l’avis, auprès du service enquêteur. \n\n Les éléments de vulnérabilité décelés à l’occasion d’une évaluation technique sollicitée par l’officier de sécurité, lors d’une demande de renouvellement ou à l’occasion d’une inspection, d’un contrôle ou d’un audit peuvent entraîner une réévaluation des avis techniques précédemment émis par le service enquêteur."
16:
  prefix: "5.4"
  title: "Sécurisation des salles, bureaux et équipements"
  1_prefix: "5.4.1"
  1_label: "Principe d’identification"
  1_desc: "Les informations et supports classifiés sont traités dans des locaux qui sont à l’abri des captations, réémissions ou enregistrements non autorisés de sons, d’images et d’informations. \n\n Le niveau de classification des informations et supports qui peuvent être traités dans le local est indiqué à l’intérieur de celui-ci. Le contrôle du local est effectué de manière régulière sous la responsabilité de l’officier de sécurité."
  2_prefix: "5.4.2"
  2_label: "Politique du bureau propre et de l’écran vide"
  2_desc: "En dehors des heures de travail ou lorsqu’une personne pénètre dans son espace de travail, tout détenteur d’information ou support classifié s’assure qu’aucune information ou support classifié n’est susceptible d’être accessible par une personne non qualifiée au sens de la présente instruction."
  3_prefix: "5.4.3"
  3_label: "Organisation des réunions"
  3_desc: "La tenue d’une réunion de travail, d’une conférence, d’un exercice ou la présentation de matériels impliquant l’accès de ses participants à des informations et supports classifiés exige la mise en œuvre de mesures de sécurité. L’autorité organisatrice veille à la protection des informations et supports classifiés échangés au cours ou dans la suite d’une réunion de travail, d’une conférence, d’un exercice ou d’une présentation de matériels et s’assure notamment que : \n\t- le local où se tient la réunion présente les garanties de sécurité prévues par la présente instruction complétées, le cas échéant, par l’instruction ministérielle, les directives techniques particulières et le plan contractuel de sécurité applicables ; \n\t- les participants à la réunion sont habilités au niveau requis par la réunion et ont le besoin d’en connaître ; \n\t- les informations et supports classifiés communiqués aux participants à l’issue de la réunion sont traités et gérés conformément à la réglementation applicable. \n\n Les mesures de sécurité devant être mises en œuvre, avant, pendant et après la réunion, sont détaillées en Annexe 35."
17:
  prefix: "5.5"
  title: "Protection contre les menaces exterieures et environnementales"
  1_prefix: ""
  1_desc: "Selon le besoin en disponibilité des systèmes d’information classifiés et le résultat de l’analyse de risques, le responsable d’organisme détermine les mesures de protection physique contre les menaces extérieures et environnementales adéquates. Lorsque le site abrite des systèmes d’information classifiés, ces mesures figurent dans le dossier d’homologation (cf. 6.1.4). \n\n Ces mesures concernent notamment les dispositifs contre les incendies, les dégâts des eaux, les risques liés à l’alimentation électrique et tout autre risque environnemental identifié."
18:
  prefix: "6.1"
  title: "Homologation du système d'information classifié"
  1:
    prefix: "6.1.1"
    title: "Démarche d'homologation"
    1_prefix: "#HOMOL_01"
    1_desc: "Le traitement d’informations dont le niveau de classification est supérieur au niveau de classification prévu par la décision d’homologation du système d’information est interdit"
    2_prefix: "#HOMOL_02"
    2_desc: "Le périmètre d’homologation d’un système d’information classifié inclut les éventuels supports amovibles mis à disposition par l’autorité d’emploi pour ce système d’information"
    3_prefix: "#HOMOL_03"
    3_desc: "[Dans le cadre de la démarche d'homologation] Une grande attention est prêtée à :\n\t- l’interconnexion avec d’autres systèmes\n\t- l’usage de supports amovibles\n\t- l’accès à distance par des utilisateurs en mobilité\n\t- les moyens de visualisation et d’hébergement des informations classifiées\n\t- les opérations de maintenance ou d’exploitation du système ou d’administration, en particulier lorsqu’elles sont effectuées par des prestataires externes."
  2:
    prefix: "6.1.2"
    title: "Autorité d'homologation"
    1_prefix: "#HOMOL_04"
    1_desc: "L'autorité d'homologation est le SGDSN pour :\n\t- les systèmes d’information traitant d’informations classifiées au niveau Très Secret faisant l’objet d’une classification spéciale\n\t - les systèmes d’information amenés à traiter des informations classifiées de l’Union européenne ou de l’OTAN, ou toute autre autorité à laquelle il délègue cette responsabilité\n\t - les systèmes d’information classifiés utilisés par des organismes relevant de son périmètre au titre de l’article 2 du décret n° 2012-383 du 20 mars 2012 relatif aux attributions du haut fonctionnaire de défense et de sécurité auprès du Premier ministre."
    2_prefix: "#HOMOL_05"
    2_desc: "L'autorité d'homologation  est l’autorité qualifiée en sécurité des systèmes d’information ou la personne qu’elle désigne pour les systèmes d’information traitant d’informations classifiées au niveau Secret ou Très Secret, hors classifications spéciales.\nDans le cas où le système d’information classifié dépend de la responsabilité de plusieurs ministres, les autorités qualifiées en sécurité des systèmes d’information désignent une autorité d’homologation unique."
  3:
    prefix: "6.1.3"
    title: "Commission d’homologation"
    1_prefix: "#HOMOL_06"
    1_desc: "Cette commission comprend notamment des représentants de l’autorité d’emploi du système d’information, dont l’officier de sécurité des systèmes d’information et le responsable de la sécurité du système d’information, ainsi que des représentants du service du haut fonctionnaire de défense et de sécurité compétent. Des représentants du service enquêteur compétent peuvent être conviés à la commission et sont obligatoirement présents lorsque l’homologation est au profit d’une personne morale de droit privé. Dans le cadre de l’utilisation d’un système d’information classifié en exécution d’un contrat au sens de la partie 4.4, l’autorité contractante participe également à la commission."
    2_prefix: "#HOMOL_07"
    2_desc: "En tant qu’autorité nationale en matière de sécurité des systèmes d’information, l’agence nationale de la sécurité des systèmes d’information peut participer à toute commission d’homologation d’un système d’information classifié. Afin de lui permettre d’apprécier la nécessité de sa participation, l’autorité d’homologation l’informe dans un délai raisonnable de la date de la commission et lui transmet, le cas échéant, les pièces nécessaires à l’instruction du dossier d’homologation."
    3_prefix: "#HOMOL_08"
    3_desc: "Les modalités de transmission des décisions et d’accès aux dossiers sont déterminées en accord avec le service du haut fonctionnaire de défense et de sécurité compétent."
    4_prefix: "#HOMOL_09"
    4_desc: "L’agence nationale de la sécurité des systèmes d’information est membre de droit de la commission d’homologation lorsque le secrétaire général de la défense et de la sécurité nationale est autorité d’homologation."
  4:
    prefix: "6.1.4"
    title: "Dossier d'homologation"
    1_prefix: "#HOMOL_10"
    1_desc: "Le dossier d’homologation est établi selon les recommandations de l’agence nationale de la sécurité des systèmes d’information"
    2_prefix: "#HOMOL_11"
    2_desc: "Le dossier d’homologation, initié dès la conception du système, est par la suite tenu à jour tout au long du cycle de vie du système d’information classifié."
    3_prefix: "#HOMOL_12"
    3_desc: "La stratégie d’homologation précise, à partir de l’analyse de risques pesant sur le système d’information classifié et conformément à la politique de sécurité des systèmes d’information applicable, la constitution du dossier d’homologation."
    4_prefix: "#HOMOL_13"
    4_desc: "Peuvent être versés au dossier d’homologation, au regard de la stratégie d'homologation, les documents suivants :\n\t- la politique de sécurité du système d’information applicable\n\t- les procédures d’exploitation sécurisée du système, y compris la documentation à destination des utilisateurs et des administrateurs\n\t- les modalités de gestion des risques résiduels\n\t- le plan d’amélioration continue de la sécurité\n\t- les résultats des tests et des audits menés pour vérifier l’état de sécurité du système\n\t- la documentation relative à la gestion des éléments cryptographiques mis en oeuvre dans le système d’information\n\t- la cartographie complète du système d’information qui comprend notamment la liste des équipements externes pouvant être connectés au système d’information (matériel de maintenance, d’audit, etc.)\n\t- les schémas détaillés de l’architecture du système d’information\n\t- les agréments des dispositifs de sécurité\n\t- l’analyse de risques et les mesures de mitigation envisagées, lorsque, par dérogation, il est envisagé de recourir à des dispositifs de sécurité non agréés (cf. 6.5.1).\nLa nécessité de verser au dossier d’homologation les documents listés ci-après est ainsi évaluée et justifiée au regard de l’analyse de risques et de la stratégie d’homologation. Si un document n’est pas versé au dossier d’homologation, la justification associée y figure."
    5_prefix: "#HOMOL_14"
    5_desc: "Une fois le système d’information classifié déployé, les documents relatifs aux lieux d’installation, et notamment les mesures de protection physique et les avis techniques d’aptitude physique, sont versés au dossier d’homologation."
    6_prefix: "#HOMOL_15"
    6_desc: "Le dossier d’homologation est tenu à disposition :\n\t- du service du haut fonctionnaire de défense et de sécurité\n\t- de l’agence nationale de la sécurité des systèmes d’information."
  5:
    prefix: "6.1.5"
    title: "Durée de la décision d'homologation"
    1_prefix: "#HOMOL_16"
    1_desc: "La décision d’homologation est prononcée pour une durée maximale de trois ans pour un système d’information au niveau Secret"
    2_prefix: "#HOMOL_17"
    2_desc: "La décision d’homologation est prononcée pour une durée maximale de deux ans pour un système d’information au niveau Très Secret"
    3_prefix: "#HOMOL_18"
    3_desc: "L’agence nationale de la sécurité des systèmes d’information est destinataire de toute décision d’homologation portant sur les systèmes d’information classifiés et peut demander le dossier d’homologation correspondant."
    4_prefix: "#HOMOL_19"
    4_desc: "Les modalités de transmission des décisions et d’accès aux dossiers sont déterminées en accord avec le service du haut fonctionnaire de défense et de sécurité de chaque ministère."
    5_prefix: "#HOMOL_20"
    5_desc: "Le service du haut fonctionnaire de défense et de sécurité et, le cas échéant, l’autorité contractante, sont également destinataires de la décision d’homologation."
    6_prefix: "#HOMOL_21"
    6_desc: "Le service enquêteur compétent est destinataire de la décision d’homologation prise au profit d’une personne morale de droit privé."
  6:
    prefix: "6.1.6"
    title: "Contrôle et renouvellement de l'homologation"
    1_prefix: "#HOMOL_22"
    1_desc: "Conformément aux lignes directrices de l’autorité qualifiée en sécurité des systèmes d’information (cf. 2.2.3.1 b), l’autorité d’homologation fixe les conditions du maintien de l’homologation de sécurité tout au long du cycle de vie du système d’information. Elle contrôle régulièrement que le système fonctionne effectivement selon les conditions qu’elle a approuvées."
    2_prefix: "#HOMOL_23"
    2_desc: "L’autorité d’homologation procède au renouvellement de l’homologation avant le terme prévu. Elle s’assure de la complétude du dossier d’homologation et vérifie que les pièces nécessaires à son actualisation y figurent."
    3_prefix: "#HOMOL_24"
    3_desc: "Une nouvelle décision d’homologation est nécessaire lorsque :\n\t- les conditions d’emploi et d’exploitation du système ont été significativement modifiées\n\t- de nouvelles fonctionnalités ou applications ont été installées\n\t- le système a été interconnecté à de nouveaux systèmes\n\t- des problèmes d’application des mesures de sécurité ou des conditions de maintien de l’homologation ont été révélés, par exemple lors d’un audit de sécurité\n\t- les menaces sur le système ont significativement évolué\n\t- de nouvelles vulnérabilités non corrigées ont été identifiées\n\t- le système a fait l’objet d’un incident de sécurité significatif au regard de l’analyse de risques."
    4_prefix: "#HOMOL_25"
    4_desc: "Si le système d’information classifié n’a pas connu de changements significatifs, une procédure simplifiée d’homologation est mise en oeuvre."
  7:
    prefix: "6.1.7"
    title: "Procédure dérogatoire en cas d'urgence opérationnelle"
    1_prefix: "#HOMOL_26"
    1_desc: "Lorsque l’urgence opérationnelle le requiert, il peut être procédé à une mise en service provisoire, sans attendre l’homologation du système, en tenant compte de l’avancement de la procédure d’homologation et des risques résiduels de sécurité. Dans ce cas, l’autorité d’homologation délivre une autorisation provisoire d’emploi (APE) pour une durée courte et associée à un plan de mise en conformité."
19:
  prefix: "6.2"
  title: "Homologation des interconnexions d'un système d'information classifié"
  1:
    prefix: "6.2.1"
    title: "Interconnexion entre deux systèmes d'information classifiés de même niveau"
    1_prefix: "#INTERCO_01"
    1_desc: "Toute interconnexion entre systèmes d’information classifiés de même niveau doit être justifiée et faire l'objet d'une homologation spécifique à ce même niveau."
    2_prefix: "#INTERCO_02"
    2_desc: "L'ajout d'une interconnexion nécessite une nouvelle homologation des systèmes d’information interconnectés."
    3_prefix: "#INTERCO_03"
    3_desc: "L’autorité d’homologation est désignée après concertation entre les autorités d’homologation de chaque système d’information interconnecté."
    4_prefix: "#INTERCO_04"
    4_desc: "L’autorité d’homologation est le secrétariat général de la sécurité et de la défense nationale, ou toute autorité à qui il en délègue la responsabilité, dans les cas suivants :\n\t- pour les transferts d'informations entre des systèmes d’information classifiés de même niveau, dont l’un n’est pas sous maîtrise nationale\n\t- pour les transferts d'informations entre des systèmes d’information classifiés de même niveau, dont l’un est amené à traiter des informations classifiées de l’Union européenne ou de l’OTAN\n\t- lorsque l’utilisation de dispositifs de sécurité agréés est obligatoire mais impossible, notamment lorsqu’il n’existe pas de dispositif de sécurité agréé ou lorsqu’il n’est pas agréé au bon niveau."
    5_prefix: "#INTERCO_05"
    5_desc: "L'interconnexion est obligatoirement réalisée à l’aide de dispositifs de sécurité agréés lorsqu’ils sont utilisés comme moyens essentiels de protection contre les accès non autorisés aux informations classifiées ou au système :\n\t- pour les transferts d'informations entre des systèmes d’information classifiés de même niveau ou de niveaux équivalents, dont l’un n’est pas sous maîtrise nationale\n\t- pour les transferts d'informations entre des systèmes d’information classifiés de même niveau ou de niveaux équivalents, dont l’un est amené à traiter des informations classifiées de l’Union européenne ou de l’OTAN.\nCes dispositifs de sécurité agréés sont déployés dans les conditions d’emploi associées aux décisions d’agrément pour cet usage."
  2:
    prefix: "6.2.2"
    title: "Autres interconnexions"
    1_prefix: "#INTERCO_06"
    1_desc: "Les interconnexions entre systèmes d’information de niveaux de classification différents ou entre un système d’information classifié et un système d’information non classifié sont par principe interdites."
    2_prefix: "#INTERCO_07"
    2_desc: "Toute interconnexion de ce type dérogeant à l’interdiction de principe doit être justifiée par un besoin opérationnel strictement nécessaire. La justification est versée au dossier d’homologation."
    3_prefix: "#INTERCO_08"
    3_desc: "Toute interconnexion d’un système d’information classifié avec un système d’information non classifié ou de niveau de classification différent est homologuée au niveau du système d’information le plus élevé. Cette interconnexion fait l'objet d'une homologation spécifique."
    4_prefix: "#INTERCO_09"
    4_desc: "L'ajout d'une interconnexion nécessite une nouvelle homologation des systèmes d’information interconnectés."
    5_prefix: "#INTERCO_10"
    5_desc: "L’autorité d’homologation est par défaut l’autorité d’homologation du système d’information du niveau le plus élevé, mais elle peut être aussi désignée après concertation entre les autorités d’homologation de chaque système d’information interconnecté."
    6_prefix: "#INTERCO_11"
    6_desc: "L’autorité d’homologation est le secrétariat général de la sécurité et de la défense nationale, ou toute autorité à qui il en délègue la responsabilité, dans les cas suivants :\n\t- pour les transferts d'informations entre des systèmes d’information classifiés de même niveau, dont l’un n’est pas sous maîtrise nationale\n\t- pour les transferts d'informations entre des systèmes d’information classifiés de même niveau, dont l’un est amené à traiter des informations classifiées de l’Union européenne ou de l’OTAN\n\t- lorsque l’utilisation de dispositifs de sécurité agréés est obligatoire mais impossible, notamment lorsqu’il n’existe pas de dispositif de sécurité agréé ou lorsqu’il n’est pas agréé au bon niveau."
    7_prefix: "#INTERCO_12"
    7_desc: "L'interconnexion est obligatoirement réalisée à l’aide de dispositifs de sécurité agréés lorsqu’ils sont utilisés comme moyens essentiels de protection contre les accès non autorisés aux informations classifiées ou au système et sont déployés dans les conditions prévues par la décision d'agrément."
20:
  prefix: "6.3"
  title: "Mesures de sécurité applicables en cas de sous-traitance du développement ou de la maintenance d'un système d'information classifié"
  1_prefix: "#TIERS_01"
  1_desc: "Aucun sous-traitant ne peut accéder à un système d’information classifié s’il ne fait pas l’objet d’une décision d’habilitation (cf. partie 4.4)."
  2_prefix: "#TIERS_02"
  2_desc: "Toute information spécifique liée au développement ou à la configuration d’un logiciel ou d’un système d’information classifié et dont la divulgation est susceptible de porter atteinte à la sécurité du système d’information classifié ou des informations classifiées qu’il contient est classifiée à un niveau équivalent ou supérieur à celui du système d’information classifié lui-même."
  3_prefix: "#TIERS_03"
  3_desc: "Lorsqu'ils sont considérés comme des documents administratifs au sens de l’article L. 300-2 du CRPA, les codes sources et les éléments de configuration d’un système d’information classifié ne sont pas librement communicables et peuvent être classifiés en fonction de leur sensibilité."
  4_prefix: "#TIERS_04"
  4_desc: "Les besoins de protection du code source et des éléments de configuration d’un système d’information classifié sont définis dans le plan contractuel de sécurité du contrat correspondant."
21:
  prefix: "6.4"
  title: "Mesures de sécurité physique et prise en compte des signaux parasites compromettants"
  1:
    prefix: "6.4.1"
    title: "Lieux abritant le système d'information classifié"
    1_prefix: "#PROT_PHY_01"
    1_desc: "Les lieux abritant des systèmes d’information classifiés doivent satisfaire aux règles énoncées au chapitre 5."
    2_prefix: "#PROT_PHY_02"
    2_desc: "Les lieux abritant des systèmes d'information classifiés respectent la réglementation en matière de protection contre les signaux parasites compromettants, y compris en matière de câblage."
  2:
    prefix: "6.4.2"
    title: "Matériel classifié laissé sans surveillance par son détenteur"
    1_prefix: "#PROT_PHY_03"
    1_desc: "La démarche d’homologation tient compte des risques liés à la protection physique des matériels classifiés, y compris lorsque des matériels classifiés peuvent être laissés sans surveillance par leur détenteur."
    2_prefix: "#PROT_PHY_04"
    2_desc: "Pour tenir compte des risques liés à la protection physique, différentes mesures de défense en profondeur sont combinées conformément aux dispositions de l’Annexe 30."
    3_prefix: "#PROT_PHY_05"
    3_desc: "Des mesures spécifiques sont également prises pour protéger l'accès aux éléments physiques des systèmes d’information classifiés hors équipements de mobilité.\nLe cas échéant, l’homologation du système d’information classifié prévoit des mesures de protection adaptées."
22:
  prefix: "6.5"
  title: "Mesures de sécurité inhérentes aux systèmes d'information classifiés"
  1_prefix: "#CONF_01"
  1_desc: "Tout équipement constitutif d’un système d’information classifié est équipé de moyens de protection et doté d’une configuration durcie."
  2:
    prefix: "6.5.2"
    title: "Recours à des dispositifs de sécurité"
    1_prefix: "#DISP_SEC_01"
    1_desc: "Un dispositif de sécurité mis en place dans un système d’information qui traite d’informations classifiées est agréé par l’agence nationale de la sécurité des systèmes d’information lorsqu’il est utilisé, en complément de mesures organisationnelles de sécurité, comme un moyen essentiel de protection contre les accès non autorisés aux informations classifiées ou au système."
    2_prefix: "#DISP_SEC_02"
    2_desc: "À titre exceptionnel, et sur le fondement d’une analyse de risques réalisée par le responsable de la sécurité du système d’information dans le cadre de l’homologation, l’autorité d’homologation peut autoriser le recours à des matériels et logiciels agréés à un niveau inférieur, voire non agréés lorsqu’il n’existe pas de dispositif de sécurité agréé au bon niveau.\nLa justification de cette autorisation est motivée dans le dossier d’homologation du système."
23:
  prefix: "6.6.1"
  title: "Administration des systèmes d'information classifiés"
  1_prefix: "#ADMIN_01"
  1_desc: "De manière générale, les principes suivants doivent être appliqués :\n\t- les actions d’administration sont menées par du personnel spécialement formé et sensibilisé\n\t - le système d'information d'administration est classifié au même niveau que le système d'information administré."
  2_prefix: "#ADMIN_02"
  2_desc: "L’administration d’un système d’information classifié au niveau Secret est faite dans une zone protégée."
  3_prefix: "#ADMIN_03"
  3_desc: "L’administration d’un système d’information classifié au niveau Tres Secret est faite dans une zone réservée."
  4_prefix: "#ADMIN_04"
  4_desc: "Les pratiques d'administration, en particulier pour la gestion des comptes privilégiés et la protection de leurs mécanismes d'authentification, sont établies suivant les recommandations de l’agence nationale de la sécurité des systèmes d’information.\nToute non-conformité est justifiée et intégrée dans les risques résiduels présentés lors de la commission d’homologation après avoir été notifiée à l’autorité qualifiée en sécurité des systèmes d’information et au service du haut fonctionnaire de défense et de sécurité compétents."
  5_prefix: "#ADMIN_05"
  5_desc: "Au niveau Très Secret, les non-conformités aux recommandations de l'agence nationale de la sécurité des systèmes d'information sont également déclarées à cette agence, au plus tard lors de la commission d’homologation."
  6_prefix: "#ADMIN_06"
  6_desc: "Les ressources matérielles, les ressources logicielles et les informations d’authentification sont strictement séparées selon leur usage. Ainsi, toute action d’administration est réalisée exclusivement par un administrateur depuis un compte administrateur individuel et dédié à cet usage. En outre, les actions d’administration sont conduites depuis des ressources d’administration dédiées (postes de travail, serveurs, ou autres équipements spécifiques). Les ressources d'administration, matérielles et logicielles, en particulier les postes d'administration, sont utilisées exclusivement pour les actions d’administration. Ces ressources sont gérées et configurées par l’autorité responsable de l’administration du système d’information classifié ou par le prestataire qu’elle a mandaté pour réaliser les actions d’administration."
  7_prefix: "#ADMIN_07"
  7_desc: "Les flux d’administration sont cloisonnés à l’égard des flux métier au niveau des ressources administrées. Les ressources d'administration accèdent aux ressources administrées au moyen d’une interface réseau dédiée à l'administration. Cette interface est physique ou, à défaut, logique. L’interface réseau utilisée pour les actions d’administration n’est accessible qu’aux seules ressources d’administration. En\nl’absence de mesure d’isolation physique de cette interface, un filtrage logique assure cette restriction d’accès. Quand des raisons techniques ou opérationnelles ne permettent pas l’administration des ressources administrées par des interfaces réseau dédiées, les actions d’administration sont faites par l'unique interface réseau de la ressource administrée. Ce cas de figure est justifié dans le dossier d'homologation"
  8_prefix: "#ADMIN_08"
  8_desc: "Les flux réseau entre les ressources administrées et les ressources d’administration sont filtrés. Afin de réduire le risque de compromission des ressources d’administration depuis les ressources administrées, les ressources d’administration sont déployées sur un réseau dédié à cet usage. Ce réseau portant les ressources d’administration est un réseau physiquement cloisonné de préférence ou, à défaut, un réseau logiquement cloisonné à l’aide de mécanismes de chiffrement et d’authentification réseau. Un filtrage strict des flux réseau entre les ressources administrées et les ressources d’administration est mis en place. Pour minimiser les possibilités de rebonds entre ressources administrées en cas de compromission de l’une d’entre elles, un mécanisme de filtrage restreint les possibilités de communication sur ce réseau  d’administration."
24:
  prefix: "6.6.2"
  title: "Maîtrise des logiciels en exploitation"
  1_prefix: "#MLOG_01"
  1_desc: "Seuls les services et fonctionnalités qui sont indispensables au fonctionnement ou à la sécurité du système d’information sont installés sur un système d'information classifié."
  2_prefix: "#MLOG_02"
  2_desc: "Les services et les fonctionnalités qui ne sont pas indispensables, notamment ceux installés par défaut, sont désactivés désinstallés si cela est possible."
  3_prefix: "#MLOG_03"
  3_desc: "Lorsque la désinstallation n’est pas possible, cela est mentionné dans le dossier d’homologation du système d’information classifié en précisant les services et fonctionnalités concernés, ainsi que les mesures de réduction du risque mises en oeuvre."
  4_prefix: "#MLOG_04"
  4_desc: "Des dispositifs sont prévus pour empêcher l’installation de services et fonctionnalités hors de ces procédures. En cas d’impossibilité, il y est fait mention dans le dossier d’homologation."
25:
  prefix: "6.6.3"
  title: "Contrôle d'accès au système d'information classifié"
  1:
    prefix: "6.6.3.1"
    title: "Gestion des droits d’accès sur la base du principe du moindre privilège, corolaire du respect du besoin d’en connaître"
    1_prefix: "#ACC_01"
    1_desc: "Par principe, toute personne habilitée accédant à des informations ou supports classifiés depuis un système d’information classifié utilise, à cette fin, un compte utilisateur individuel assorti des droits d'accès correspondant à son profil et à son besoin d’en connaître."
    2_prefix: "#ACC_02"
    2_desc: "Les comptes utilisateurs individuels ne disposent pas de droits d’administration sur le système d’information classifié."
    3_prefix: "#ACC_03"
    3_desc: "L’administrateur d’un système d’information classifié et l’administrateur de sécurité disposent de comptes individuels dédiés pour chacune de ces fonctions, distincts de leur compte utilisateur."
    4_prefix: "#ACC_04"
    4_desc: "Par défaut, un administrateur est habilité au niveau d'habilitation correspondant au moins au niveau de classification du système d'information classifié administré. Lorsque les droits qui lui sont octroyés sur le système d'information classifié sont étendus, lui permettant notamment\nd'outrepasser ses droits ou de masquer ses actions sur le système d'information classifié, l'administrateur doit être habilité au niveau Très Secret, sans incidence sur le niveau d’habilitation de la personne morale."
    5_prefix: "#ACC_05"
    5_desc: "À titre dérogatoire, lorsque des raisons techniques ou opérationnelles ne permettent pas de créer de compte individuel, ni de restreindre les droits d’administration aux seules personnes autorisées, cela est justifié dans le dossier d’homologation et l’autorité qualifiée en sécurité des systèmes d’information et le service du haut fonctionnaire de défense et de sécurité compétents en sont informés. Le responsable de la sécurité du système d’information met alors en place les mesures nécessaires pour réduire le risque lié à l’utilisation de comptes partagés et assurer la traçabilité et l’imputabilité de l’utilisation de ces comptes."
    6_prefix: "#ACC_06"
    6_desc: "Seule l’agence nationale de la sécurité des systèmes d’information peut autoriser une dérogation à l'usage de compte individuel ou à la restriction des droits d'administration pour les systèmes d’information classifiés au niveau Très Secret. L’autorité d’homologation sollicite son autorisation dès la phase de conception du système d’information classifié."
    7_prefix: "#ACC_07"
    7_desc: "Les utilisateurs d’un système d’information classifié ont uniquement accès aux données, systèmes et services auxquels ils sont autorisés à accéder au regard de leur niveau d’habilitation et de leur besoin d’en connaître."
    8_prefix: "#ACC_08"
    8_desc: "Les éléments constitutifs du système d’information s’authentifient, dans la mesure du possible, auprès des réseaux et des services."
    9_prefix: "#ACC_09"
    9_desc: "Le principe de moindre privilège est pris en compte dans la mesure du possible."
    10_prefix: "#ACC_10"
    10_desc: "La politique de sécurité des systèmes d'information précise la procédure relative au retrait des droits d'accès"
  1a:
    prefix: "6.6.3.1a"
    title: "Maîtrise de la gestion des accès utilisateurs"
    1_prefix: "#ACC_11"
    1_desc: "La politique de gestion des éléments d’authentification liés aux comptes utilisateurs et administrateurs est mise en place en suivant les recommandations de l’agence nationale de la sécurité des systèmes d’information"
    2_prefix: "#ACC_12"
    2_desc: "Dans le cas d'un système d’information classifié au niveau Très Secret, le mécanisme de contrôle d'accès permet également de tracer chaque accès (consultation, copie, modification, impression, etc.) à chaque information classifiée."
    3_prefix: "#ACC_13"
    3_desc: "Le mécanisme de contrôle d’accès repose sur des mécanismes d’authentification forte établis selon le référentiel général de sécurité."
    4_prefix: "#ACC_14"
    4_desc: "Si la mise en œuvre de tels mécanismes n’est pas possible pour des raisons techniques ou opérationnelles et après en avoir rendu compte à l’autorité qualifiée en sécurité des systèmes d’information et au service du haut fonctionnaire de défense et de sécurité compétents, des mesures organisationnelles sont prises pour pallier cette lacune et sont décrites dans le dossier d’homologation."
    5_prefix: "#ACC_15"
    5_desc: "Au niveau Très Secret, cette exception est soumise à l'autorisation de l’agence nationale de la sécurité des systèmes d’information dès la phase de conception du système d’information."
  1b:
    prefix: "6.6.3.1b"
    title: "Revue des droits d'accès des comptes"
    1_prefix: "#ACC_16"
    1_desc: "Pour chaque système d’information classifié et système d’administration des systèmes d’information classifiés, une revue des droits d’accès des comptes est mise en place."
    2_prefix: "#ACC_17"
    2_desc: "La périodicité et les modalités de cette revue sont fixées par l’autorité d’homologation en cohérence avec les besoins opérationnels et ne doit pas excéder un an."
    3_prefix: "#ACC_18"
    3_desc: "Les conditions précises de cette revue sont décrites dans le dossier d’homologation, ainsi que dans les exigences relatives à la sécurité des systèmes d’information intégrées dans la politique des informations et supports classifiés de l’organisme (cf. 2.3.1.2 et 2.3.1.3)."
  1c:
    prefix: "6.6.3.1c"
    title: "Mesures de sécurité logiques relatives aux mentions complémentaires de protection"
    1_prefix: "#ACC_19"
    1_desc: "Les systèmes d’information susceptibles de traiter des informations portant une mention complémentaire de protection, notamment la mention Spécial France, font l’objet de mesures de sécurité particulières techniques ou organisationnelles pour garantir l’accès aux seules personnes ayant le besoin d’en connaître."
    2_prefix: "#ACC_20"
    2_desc: "Le processus d’homologation tient compte du fait que le système d’information est susceptible de traiter d'informations portant la mention Spécial France."
    3_prefix: "#ACC_21"
    3_desc: "Dans le cas d’un système devant traiter à la fois des informations portant la mention complémentaire de protection et d’autres ne la portant pas, et accessible à des personnes non autorisées à accéder à des informations portant la mention complémentaire de protection, le système d’information considéré et les mesures organisationnelles afférentes garantissent notamment que :\n\t- pour chaque mention de protection, les informations classifiées en étant marquées sont stockées dans des zones du système d’information clairement identifiées et indiquées dans le dossier d’homologation\n\t\t- les zones du système d’information ainsi identifiées sont cloisonnées du reste du système d’information avec des mesures conformes aux recommandations de l’agence nationale de la sécurité des systèmes d’information\n\t\t- le contrôle d’accès du système d’information permet d’assurer la protection du besoin d’en connaître pour les informations classifiées marquées de la mention de protection considérée. Si nécessaire, un contrôle d’accès dédié est mis en place\n\t\t- lorsque des données portant une mention de protection circulent hors des zones identifiées, elles sont chiffrées avec des moyens conformes aux recommandations de l’agence nationale de la sécurité des systèmes d’information\n\t\t- l’accès aux informations portant une mention de protection complémentaire ou aux zones les contenant est tracé et indique explicitement les éventuelles mentions de protection."
  2:
    prefix: "6.6.3.2"
    title: "Responsabilité des utilisateurs"
    1_prefix: "#AUTH_01"
    1_desc: "Chaque utilisateur est responsable de la protection de ses informations d’authentification et du bon usage des outils associés (de type ACSSI, cartes à puce, etc.)."
    2_prefix: "#AUTH_02"
    2_desc: "Des moyens de conservation sécurisés et adaptés des informations d'authentification sont mis en place"
  3:
    prefix: "6.6.3.3"
    title: "Articles contrôlés de la sécurité des systèmes d’information classifiés"
    1_prefix: "#ACSSI_01"
    1_desc: "Les articles contrôlés de la sécurité des systèmes d’information, sont traités conformément à l’instruction interministérielle n° 910/SGDSN/ANSSI du 22 octobre 2013 relative aux articles contrôlés de la sécurité des systèmes d’information (ACSSI)."
26:
  prefix: "6.6.4"
  title: "Supervision logicielle de la sécurité et traçabilité"
  1:
    prefix: "6.6.4.1"
    title: "Synchronisation des horloges"
    1_prefix: "#SUP_01"
    1_desc: "Pour les besoins en traçabilité, les composantes d’un système d’information classifié sont synchronisées sur une source de temps unique. Lorsque des raisons techniques ou opérationnelles ne le permettent pas, cette impossibilité est mentionnée dans le dossier d’homologation et des mesures palliatives sont mises en place par le responsable de la sécurité des systèmes d’information."
  2:
    prefix: "6.6.4.2"
    title: "Journalisation des événements"
    1_prefix: "#LOG_01"
    1_desc: "À des fins d’investigation, de suivi a posteriori des échanges, de traitement des incidents et d’archivage, une journalisation des événements est mise en place pour tracer et imputer les actions réalisées sur les systèmes d’information classifiés selon les recommandations de l’agence nationale de la sécurité des systèmes d’information."
    2_prefix: "#LOG_02"
    2_desc: "Les événements enregistrés par le système de journalisation sont horodatés au moyen de sources de temps synchronisées entre elles."
    3_prefix: "#LOG_03"
    3_desc: "Les événements enregistrés par le système de journalisation sont horodatés au moyen de sources de temps synchronisées entre elles. Ils sont, pour chaque système d’information classifié, centralisés et archivés pour une durée d’au moins trois ans pour le niveau Secret."
    4_prefix: "#LOG_04"
    4_desc: "Les événements enregistrés par le système de journalisation sont horodatés au moyen de sources de temps synchronisées entre elles. Ils sont, pour chaque système d’information classifié, centralisés et archivés pour une durée d’au moins cinq ans pour le niveau Très Secret."
    5_prefix: "#LOG_05"
    5_desc: "Le format d’archivage des événements permet de réaliser des recherches automatisées sur ces événements.\nSi la mise en œuvre de tels mécanismes est impossible pour des raisons techniques ou organisationnelles et, après en avoir rendu compte à\nl’autorité qualifiée en sécurité des systèmes d’information et au service du haut fonctionnaire de défense et de sécurité compétents, des mesures palliatives sont prises et décrites dans le dossier d’homologation."
  3:
    prefix: "6.6.4.3"
    title: "Protection de l'information journalisée"
    1_prefix: "#LOG_06"
    1_desc: "Les journaux des événements ne doivent pas être conçus pour contenir d’informations permettant de retrouver les informations d’authentification (de type mots de passe, codes PIN, clés privées, etc.)."
    2_prefix: "#LOG_07"
    2_desc: "Les journaux d'événements sont sauvegardés et protégés de manière à assurer leur intégrité et leur disponibilité."
  4:
    prefix: "6.6.4.4"
    title: "Accès aux journaux"
    1_prefix: "#LOG_08"
    1_desc: "Pour chaque système d’information classifié, une procédure portant sur la manipulation des journaux est élaborée. Elle précise les personnes autorisées à y accéder, leurs modes de traitement ainsi que les moyens techniques et opérationnels mis en œuvre pour assurer le respect du besoin d’en connaître et la traçabilité des accès."
    2_prefix: "#LOG_09"
    2_desc: "Les données de traçabilité des accès sont archivées sur une durée d'au moins trois ans pour le niveau Secret et cinq ans."
    3_prefix: "#LOG_10"
    3_desc: "Les données de traçabilité des accès sont archivées sur une durée d'au moins cinq ans pour le niveau Très Secret."
  5:
    prefix: "6.6.4.5"
    title: "Système de détection"
    1_prefix: "#DETEC_01"
    1_desc: "Une procédure de détection des incidents de sécurité affectant le système d’information classifié est établie."
    2_prefix: "#DETEC_02"
    2_desc: "La procédure de détection prévoit des mesures organisationnelles et techniques destinées à détecter les incidents de sécurité affectant le système d’information classifié : \n\t- les mesures organisationnelles comprennent les modalités d'exploitation des dispositifs de détection et décrivent la chaîne de traitement des événements de sécurité identifiés par ces dispositifs.\n\t- les mesures techniques précisent la nature et le positionnement des dispositifs de détection."
    3_prefix: "#DETEC_03"
    3_desc: "Des dispositifs de détection capables d'identifier des événements caractéristiques d'un incident de sécurité notamment d'une attaque en cours ou à venir et de permettre la recherche de traces d'incidents antérieurs sont mis en oeuvre. À cet effet, ces dispositifs :\n\t- collectent les données représentatives de l’activité du système d’information, issues du réseau, des systèmes et/ou des applications, à partir de capteurs positionnés de manière à optimiser la couverture du dispositif de supervision global\n\t\t- analysent les données issues des capteurs notamment en recherchant des marqueurs techniques d'attaques connus ou des anomalies, dans le but d'identifier les événements de sécurité et de les caractériser."
    4_prefix: "#DETEC_04"
    4_desc: "Ces dispositifs de détection archivent les métadonnées des événements identifiés afin de permettre une rechercheposteriori de marqueurs techniques d'attaques ou de compromission sur une durée d'au moins trois ans pour le niveau Secret."
    5_prefix: "#DETEC_05"
    5_desc: "Ces dispositifs de détection archivent les métadonnées des événements identifiés afin de permettre une rechercheposteriori de marqueurs techniques d'attaques ou de compromission sur une durée d’au moins cinq ans pour le niveau Très Secret."
    6_prefix: "#DETEC_06"
    6_desc: "Les stratégies de collecte et d’analyse sont élaborées."
    7_prefix: "#DETEC_07"
    7_desc: "Le recours à plusieurs sources de données pour détecter des activités malveillantes est encouragé. Un système de corrélation et d’analyse des journaux des événements doit être mis en œuvre et exploité."
    8_prefix: "#DETEC_08"
    8_desc: "L'architecture de déploiement des systèmes de détection ne doit pas remettre en cause la sécurité du système d’information classifié. Dans le cadre de systèmes de détection réseau, des dispositifs de type « TAP » qualifiés, qui concourent à l’atteinte de cet objectif de sécurité, sont utilisés."
    9_prefix: "#DETEC_09"
    9_desc: "Ces systèmes de détection sont exploités en s’appuyant sur les exigences du référentiel en matière de détection des incidents de sécurité pris conformément à l’article 10 du décret n° 2015-350 du 27 mars 2015 relatif à la qualification des produits de sécurité et des prestataires\nde service de confiance pour les besoins de la sécurité des systèmes d’information."
    10_prefix: "#DETEC_10"
    10_desc: "Les systèmes de détection sont pris en compte dans le périmètre de l’homologation et les risques propres à ces systèmes font l’objet d’une attention particulière. Si les systèmes de détection sont communs à plusieurs systèmes d’information classifiés, ils font l’objet d’une homologation spécifique."
    11_prefix: "#DETEC_11"
    11_desc: "Si la mise en oeuvre de tels systèmes de détection est impossible pour des raisons techniques ou organisationnelles et, après en avoir rendu compte à l’autorité qualifiée en sécurité des systèmes d’information et au service du haut fonctionnaire de défense et de sécurité compétents, des mesures palliatives sont prises et décrites dans le dossier d’homologation."
27:
  prefix: "6.6.5"
  title: "Maintenance et maintien en condition opérationnelle et en condition de sécurité"
  1_prefix: "#MCS_01"
  1_desc: "Les opérations de maintenance, qui incluent les opérations de maintien en condition opérationnelle et en condition de sécurité sur un système d’information classifié sont tracées et imputées à leur auteur. Elles sont réalisées par des personnes habilitées conformément à la partie 3.3."
  2_prefix: "#MCS_02"
  2_desc: "Le matériel connecté au système d’information classifié pour sa maintenance et son maintien en condition opérationnelle ou de sécurité lui est dédié et est classifié au même niveau que le système d’information. Les équipements sont utilisés conformément aux parties 6.5 et 6.7."
  3_prefix: "#MCS_03"
  3_desc: "Tout élément constitutif d’un système d’information traitant d’informations classifiées est maintenu en condition opérationnelle et en condition de sécurité."
  4_prefix: "#MCS_04"
  4_desc: "Une procédure de maintien en condition de sécurité des ressources matérielles et logicielles de ses systèmes d’information classifiés est élaborée."
  5_prefix: "#MCS_05"
  5_desc: "La procédure de maintien en condition de sécurité des ressources matérielles et logicielles prévoit :\n\t- l’installation et la maintenance de toutes les ressources matérielles et logicielles des systèmes d’information classifiés dans des versions supportées par leurs fournisseurs ou leurs fabricants et mises à jour du point de vue de la sécurité, sauf en cas de difficultés techniques ou opérationnelles justifiées\n\t\t- préalablement à l’installation de toute nouvelle version, la vérification de l’origine de cette version et de son intégrité, et l’analyse de l’impact, d'un point de vue technique et opérationnel, de cette version sur le système d’information classifié concerné\n\t\t- une veille sur les vulnérabilités affectant le système d’information classifié afin de pouvoir mettre en œuvre, dès qu’une vulnérabilité est connue, des mesures palliatives en attente de la publication d’une mesure correctrice de sécurité\n\t\t- l’installation sans délai sous le contrôle du responsable de la sécurité du système d’information, de toute mesure correctrice de sécurité concernant l’une de ses ressources, après s'être assuré de l'origine de cette mesure et de son intégrité."
  6_prefix: "#MCS_06"
  6_desc: "Lorsque des raisons techniques ou opérationnelles le justifient, l’autorité d’emploi du système d’information peut décider, pour certaines ressources de ses systèmes d’information classifiés et des systèmes d’administration de systèmes d’information classifiés, de ne pas installer une version supportée par le fournisseur ou le fabricant de la ressource concernée ou de ne pas installer une mesure correctrice de sécurité. Dans ce cas, des mesures techniques ou organisationnelles pour réduire les risques liés à l’utilisation d’une version obsolète ou comportant des vulnérabilités connues sont mises en oeuvre, documentées et intégrées au cycle de maintien en condition de sécurité de son système d'information."
28:
  prefix: "6.6.6"
  title: "Cloisonnement"
  1_prefix: "#CLOIS_01"
  1_desc: "Les systèmes d’information classifiés sont séparés physiquement des systèmes d’information de classification différente, des systèmes d’information non classifiés ou des systèmes d'information de même niveau mais dont l'un n'est pas sous maîtrise nationale. À défaut, des moyens agréés sont utilisés pour cloisonner logiquement ces systèmes d’information."
  2_prefix: "#CLOIS_02"
  2_desc: "Tout système d'information classifié est découpé en zones fonctionnelles ayant des besoins de sécurité homogènes, cloisonnées entre elles suivant les recommandations de l’agence nationale de la sécurité des systèmes d’information"
29:
  prefix: "6.6.7"
  title: "Mécanisme de filtrage des flux de données"
  1_prefix: "#FILTR_01"
  1_desc: "Des mécanismes de filtrage des flux de données circulant dans ou entre les systèmes d’information classifiés afin de bloquer la circulation des flux susceptibles de faciliter des attaques informatiques."
  2_prefix: "#FILTR_02"
  2_desc: "Ces mécanismes respectent les règles suivantes :\n\t- une liste des règles de filtrage mentionnant l’ensemble des règles en vigueur ou supprimées est tenue à jour\n\t - la circulation des flux de données est limitée autant que possible aux seuls flux nécessaires au fonctionnement et à la sécurité du système d’information classifié\n\t -  les flux entrants et sortants ainsi que les flux entre sous-systèmes du système d’information classifié sont filtrés au niveau de leurs interconnexions de manière à ne permettre que la circulation des seuls flux strictement nécessaires au fonctionnement et à la sécurité du système d’information. Les flux qui ne sont pas conformes aux règles de filtrage sont bloqués."
30:
  prefix: "6.6.8"
  title: "Gestion de la continuité et de la reprise d'activité"
  1_prefix: "#PCA_01"
  1_desc: "Tout système d’information classifié le nécessitant fait l'objet d'un plan de continuité ou de reprise informatique (PCI/PRI)."
  2_prefix: "#PCA_02"
  2_desc: "Ce PCI/PRI se conforme au plan de protection des sites, au plan de continuité ou de reprise d'activité (PCA/PRA) de l'organisme et ainsi que, le cas échéant, aux exigences du contrat au profit duquel le système d’information classifié est mis en œuvre."
  3_prefix: "#PCA_03"
  3_desc: "Ce PCI/PRI est tenu à jour et régulièrement testé à l'occasion d'exercices."
  4_prefix: "#PCA_04"
  4_desc: "L’absence de plan de continuité ou de reprise informatique est mentionnée et justifiée dans le dossier d’homologation."
31:
  prefix: "6.7"
  title: "Sécurité en mobilité"
  1:
    prefix: "6.7.1"
    title: "Sécurité des équipements en mobilité"
    1_prefix: "#NOMAD_01"
    1_desc: "L’utilisation en mobilité d’équipements informatiques exploitant des informations classifiées est soumise à une analyse de risques dédiée qui est intégrée au dossier d’homologation."
    2_prefix: "#NOMAD_02"
    2_desc: "Des mécanismes et des fonctions de sécurité sont mis en place afin de protéger les informations classifiées sur les équipements de mobilité."
    3_prefix: "#NOMAD_03"
    3_desc: "Seuls les équipements mis à disposition et administrés par l’autorité d’emploi du système d’information classifié pour un usage en mobilité peuvent être utilisés."
    4_prefix: "#NOMAD_04"
    4_desc: "De plus, si un équipement permet d’exploiter en mobilité des informations classifiées, il fait l’objet d’un agrément et est utilisé dans les conditions prévues par la décision d’agrément du produit."
    5_prefix: "#NOMAD_05"
    5_desc: "Les règles minimales applicables aux équipements utilisés en mobilité sont :\n\t- l’équipement est sous la surveillance permanente de l'utilisateur conformément aux conditions prévues par l’agrément de l’équipement\n\t - l'utilisation d’un équipement contenant des informations classifiées n’est pas autorisée dès lors qu'une personne non habilitée ou n’ayant pas le besoin d’en connaître est susceptible d'en prendre connaissance directement ou indirectement\n\t - la sortie du territoire national d’un équipement contenant des informations classifiées est soumise à autorisation de l’officier de sécurité des systèmes d’information qui fixe des règles particulières d'emploi et de l’officier de sécurité.\nCes règles sont, le cas échéant, complétées par l’officier de sécurité des systèmes d’information"
    6_prefix: "#NOMAD_06"
    6_desc: "Une information sur les règles spécifiques d'utilisation des équipements de mobilités est adressée aux utilisateurs"
    7_prefix: "#NOMAD_07"
    7_desc: "Une sensibilisation au profit des utilisateurs sur les risques liés à l'utilisation d'un équipement de mobilité est réalisée"
  2:
    prefix: "6.7.2"
    title: "Sécurisation des accès à distance"
    1_prefix: "#NOMAD_08"
    1_desc: "Par principe, les systèmes d’information classifiés sont conçus et paramétrés pour interdire les accès à distance."
    2_prefix: "#NOMAD_09"
    2_desc: "Lorsqu’un accès à distance est absolument nécessaire pour des raisons opérationnelles, cet accès est protégé au moyen de dispositifs de sécurité agréés au niveau de classification du système d'information auquel il donne accès."
32:
  prefix: "6.8"
  title: "Supports amovibles"
  1_prefix: "#AMOV_01"
  1_desc: "La connexion ou l’installation d'équipements personnels à un système d’information classifié est strictement interdite."
  2_prefix: "#AMOV_02"
  2_desc: "La connexion d’un support amovible non classifié à un système d’information classifié est possible sous réserve de la mise en place de mesures techniques de protection, notamment des mesures de détection ou de protection contre l’introduction de codes malveillants ou d’exfiltration d’information."
  3_prefix: "#AMOV_03"
  3_desc: "Avant toute utilisation sur un système d’information traitant d'informations classifiées, l'innocuité de tout support est vérifiée."
  4_prefix: "#AMOV_04"
  4_desc: "Si l’utilisation de supports amovibles est autorisée, ceux-ci sont intégrés au périmètre d’homologation du système d’information classifié (cf. 6.1.1) lorsqu’ils sont gérés, administrés et mis à disposition par l’autorité d’emploi du système d’information classifié."
  5_prefix: "#AMOV_05"
  5_desc: "Tout support amovible susceptible de contenir ou d’avoir contenu de l’information classifiée d’un niveau donné est classifié au moins au même niveau et est soumis à ce titre aux obligations décrites au chapitre 7. En aucun cas, un support amovible classifié ne peut être connecté à un système d'information non classifié ou de classification inférieure."
  6_prefix: "#AMOV_06"
  6_desc: "Lorsque des informations classifiées sont transportées à l’aide de supports amovibles, les supports amovibles respectent les exigences en matière de transport d’informations classifiées sur un support amovible (cf. 7.3.2.2)."
  7_prefix: "#AMOV_07"
  7_desc: "Une sensibilisation des utilisateurs aux mesures de sécurité à respecter dans l'emploi des supports amovibles est réalisée"
  8:
    prefix: "6.8.1"
    title: "Supports amovibles en sein du système d'information classifié"
    1_prefix: "#AMOV_08"
    1_desc: "Seuls les supports amovibles gérés, administrés et mis à disposition par l’autorité d’emploi du système d’information classifié sont autorisés à se connecter à ce système d’information classifié."
    2_prefix: "#AMOV_09"
    2_desc: "Des dispositifs de sécurité permettant de prévenir la connexion ou l’installation de supports amovibles non autorisés sont mis en place."
  9:
    prefix: "6.8.2"
    title: "Supports amovibles entre un système d'information classifié et d'autres systèmes"
    1_prefix: "#AMOV_10"
    1_desc: "Lorsque des supports amovibles sont utilisés pour importer et exporter des informations à partir d’un système d’information classifié, ce transfert d’information est réalisé exclusivement en connectant ces supports amovibles à des points de connexion appartenant au système d’information classifié."
    2_prefix: "#AMOV_11"
    2_desc: "Le point de connexion appartenant au système d'information classifié et permettant l'importation ou l'exportation d'informations est dédié à cet usage et garantit notamment les exigences de sécurité suivantes :\n\t- contrôle d’autorisation (approbation de la sortie d’information)\n\t - rupture protocolaire : (rupture du flux transitant entre le support amovible et le système d’information émetteur ou destinataire)\n\t - traçabilité et imputabilité du transfert."
    3_prefix: "#AMOV_12"
    3_desc: "Les exportations d’informations classifiées réalisées à partir de supports amovibles sont tracées par des moyens techniques ou organisationnels qui permettent notamment d’horodater le transfert et de l’imputer à un utilisateur du système d’information classifié."
    4_prefix: "#AMOV_13"
    4_desc: "Pour les systèmes d'information classifiés au niveau Très Secret, les mécanismes d'importation et d'exportation d'informations par support amovible permettent d’identifier l’émetteur et les destinataires de l’information classifiée."
    5_prefix: "#AMOV_14"
    5_desc: "L’utilisation de supports amovibles entre un système d’information classifié et un système d’information non classifié ou de classification différente est par principe interdite.\nToute dérogation à l’interdiction de principe doit être justifiée par un besoin opérationnel strictement nécessaire. La justification est versée au dossier d’homologation et les mesures de protection minimales suivantes s’appliquent :\n\t- une analyse de risques est conduite pour identifier les mesures techniques et organisationnelles visant à prévenir tout risque de sortie incontrôlée d’information classifiée lié aux cas d’usage de ces supports amovibles\n\t - les échanges d’information entre un système d’information classifié et un système d’information non classifié ou de classification différente s’effectuent au moyen de points de connexion des supports amovibles mettant en oeuvre des dispositifs de sécurité utilisés comme moyens essentiels de protection contre les accès non-autorisés aux informations classifiées. Ces dispositifs de sécurité sont agréés (cf. 6.5.2). En absence de dispositifs agréés et après en avoir rendu compte à l’autorité qualifiée en sécurité des systèmes d’information et au service du haut fonctionnaire de défense et de sécurité compétents, des mesures palliatives sont prises et décrites dans le dossier d’homologation."
33:
  prefix: "6.9"
  title: "Audit des systèmes d'information"
  1_prefix: "#AUDIT_01"
  1_desc: "Des audits de sécurité périodiques des systèmes d’information classifiés, avant chaque homologation ou renouvellement d’homologation doivent être réalisés."
  2_prefix: "#AUDIT_02"
  2_desc: "Les conditions du déroulement de l’audit, notamment de l’utilisation et de la restitution des équipements nécessaires à l’audit, sont précisées. Ces conditions sont, le cas échéant, formalisées dans une convention d'audit."
  3_prefix: "#AUDIT_03"
  3_desc: "Ces audits de sécurité doivent, au-delà de la conformité aux règles de la présente instruction, évaluer le niveau de robustesse des systèmes d’information eu égard aux évolutions de la menace informatique. Il s’agit de vérifier l’application de mesures de défense en profondeur, de les éprouver par des techniques et outils à l’état de l’art et de réaliser des tests complémentaires qui peuvent être conduits inopinément en fonction des relevés d’audit initiaux."
  4_prefix: "#AUDIT_04"
  4_desc: "Les risques associés à l’utilisation des outils d’audit, des privilèges et de communication des relevés techniques nécessaires à la réalisation de l’audit de sécurité figurent dans le dossier d’homologation du système visé, quel que soit son niveau de classification et sans préjudice des dispositions de la présente instruction."
  5_prefix: "#AUDIT_05"
  5_desc: "Les rapports d'audit portant sur des systèmes d’information classifiés sont classifiés au moins au niveau Secret.\nCes rapports sont tenus à la disposition de l'Agence nationale de la sécurité des systèmes d'information, du service du haut fonctionnaire de défense et de sécurité et du service enquêteur compétent.\nLes modalités de consultation des rapports d’audit sont déterminées en accord avec le service du haut fonctionnaire de défense et de sécurité."
  6_prefix: "#AUDIT_06"
  6_desc: "Les relevés techniques d'audit sont classifiés au maximum au même niveau que le rapport."
  7_prefix: "#AUDIT_07"
  7_desc: "En cas de recours, pour un audit d’un système d’information classifié, à un prestataire privé, la prestation d’audit doit être qualifiée par l’agence nationale de la sécurité des systèmes d’information."
  8_prefix: "#AUDIT_08"
  8_desc: "Par principe, les auditeurs doivent être habilités au niveau de classification du système d’information classifié audité selon les modalités détaillées à la partie 3.3. Toutefois, lorsque les droits qui leur sont octroyés initialement sur le système d'information classifié sont étendus, leur permettant notamment d'outrepasser leurs droits ou de masquer leurs actions sur celui-ci, les auditeurs doivent être habilités au niveau Très Secret."
34:
  prefix: "7.1.2"
  title: "Marquage"
  5:
    prefix: "7.1.2.5"
    title: "Marquage d’un support immatériel"
    1_prefix: "#MARQ_01"
    1_desc: "Le marquage d’un support immatériel d’informations classifiées (message ou fichier électronique, base de données, etc.) est adapté au type de support et est toujours visible. Il consiste en :\n\t- un timbre spécifiant le niveau de classification en toutes lettres et ayant une dimension adaptée à celle du support (abréviations). Il peut contenir la mention Spécial France si l’information doit être divulguée aux seuls ressortissants français\n\t\t- la référence et, le cas échéant, le volume de chacune des informations enregistrées."
    2_prefix: "#MARQ_02"
    2_desc: "Dans la mesure du possible, les règles de marquage d’un support immatériel doivent respecter les règles de marquage d’un support papier (cf. 7.1.2.3)."
    3_prefix: "#MARQ_03"
    3_desc: "S’il est matériellement impossible d’apposer le marquage sur le support classifié ou contenant une information classifiée, il convient de mettre en oeuvre les mesures techniques et organisationnelles décrites dans le dossier d’homologation et la documentation utilisateur."
  6:
    prefix: "7.1.2.6"
    title: "Marquage des éléments constitutifs d’un système d’information classifié"
    1_prefix: "#MARQ_04"
    1_desc: "Le marquage des éléments constitutifs d’un système d’information classifié est adapté au type d’élément et toujours visible. Il consiste en :\n\t- un timbre spécifiant le niveau de classification en toutes lettres et ayant une dimension adaptée à celle de l’élément\n\t\t- une identification assurée par l’inscription des références de l’élément."
    2_prefix: "#MARQ_05"
    2_desc: "S’il est matériellement impossible d’apposer le marquage sur l’élément, il convient de mettre en oeuvre les mesures techniques et organisationnelles décrites dans le dossier d’homologation et la documentation utilisateur."
    3_prefix: "#MARQ_06"
    3_desc: "Les claviers et autres périphériques d’entrée similaires peuvent être exemptés de marquage. Cette exemption doit être mentionnée dans le dossier d’homologation."
  7:
    prefix: "7.1.2.7"
    title: "Marquage d’un support amovible"
    1_prefix: "#MARQ_07"
    1_desc: "Le marquage d’un support amovible d’informations classifiées est adapté au type d’élément et toujours visible. Il consiste en :\n\t- un timbre spécifiant le niveau de classification en toutes lettres et ayant une dimension adaptée à celle du support\n\t\t- une identification assurée par l’inscription des références du support."
    2_prefix: "#MARQ_08"
    2_desc: "S’il est matériellement impossible d’apposer le marquage sur le support, il convient de mettre en oeuvre les mesures techniques et organisationnelles décrites dans le dossier d’homologation et la documentation utilisateur."
    3_prefix: "#MARQ_09"
    3_desc: "Pour les supports amovibles agréés, le marquage est réalisé dans les conditions prévues par les instructions d’emploi du support, mentionnées dans la décision d’agrément."
35:
  prefix: "7.3.2.2"
  title: "Transport d’informations classifiées sur un support amovible"
  1_prefix: "#TRANS_01"
  1_desc: "Par principe, les informations classifiées stockées sur un support amovible en vue de leur transport sont chiffrées."
  2_prefix: "#TRANS_02"
  2_desc: "En l’absence de solution agréée au niveau de classification requis ou lorsqu’à titre exceptionnel le chiffrement est impossible, le support amovible est transporté conformément aux dispositions du paragraphe 7.3.2.1."
36:
  prefix: "7.5.2"
  title: "Mise au rebut ou réaffectation sécurisée du matériel informatique classifié"
  1_prefix: "#REBUT_01"
  1_desc: "Un support classifié ou ayant contenu des informations classifiées ne peut être affecté à un nouvel utilisateur ou à un nouveau besoin qu’après effacement sécurisé de l’ensemble des informations et supports classifiés qu’il contient."
  2_prefix: "#REBUT_02"
  2_desc: "Un support classifié ou ayant contenu des informations classifiées reste classifié à un niveau au moins égal au niveau de classification des informations et supports classifiés qu’il a préalablement contenus."
  3_prefix: "#REBUT_03"
  3_desc: "Tout support de stockage électronique classifié mis au rebut est préalablement effacé selon les recommandations de l’agence nationale de la sécurité des systèmes d’information."
  4_prefix: "#REBUT_04"
  4_desc: "En l'absence d'effacement sécurisé, le support de stockage électronique classifié est détruit physiquement, selon un procédé conforme aux recommandations du secrétariat général de la défense et de la sécurité nationale, qui rend impossible la reconstitution de tout ou partie de l’information classifiée qu’il a contenue"
37:
  title: "Barrières de protection physique et logique, répartition en classes et tableaux de combinaison des classes"
  prefix: "Annexe 30"
  2d:
    title: "Détermination des classes - Classes des postes utilisateurs classifiés"
    prefix: "2D"
    1_prefix: "#CL_POSTE_01"
    1_desc: "Les postes de travail de classe Y doivent, pour garantir l'intégrité physique des éléments constitutifs du SI :\n\t- utiliser des scellés génériques de contrôle d’ouverture de l’équipement avec traçabilité des équipements ayant reçu des scellés\n\t\t- faire l'objet d'un contrôle ponctuel de l’intégrité des scellés par l’utilisateur."
    2_prefix: "#CL_POSTE_02"
    2_desc: "Les postes de travail de classe Y doivent, pour garantir la confidentialité des données lorsque le terminal n’est pas en fonctionnement :\n\t- faire l'objet d'un chiffrement des données utilisateur par un logiciel agréé pour la protection des informations portant la mention Diffusion Restreinte ; OU\n\t- faire l'objet d'un stockage à distance des données sur l’infrastructure d’hébergement du SI ; OU\n\t- disposer d'une mémoire de masse extractible ou équipement mobile stockable dans un meuble de classe adaptée à la classification des\ndonnées en clair."
    3_prefix: "#CL_POSTE_03"
    3_desc: "Les postes de travail de classe Y doivent, pour garantir la sécurité du contrôle d'accès de l’utilisateur, disposer d'un mot de passe avec politique de sécurité des mots de passe conforme à la politique de sécurité de l’organisme."
    4_prefix: "#CL_POSTE_04"
    4_desc: "Dans le cadre de postes de travail de classe Y, l'accès aux dispositifs d’import-export du poste utilisateur :\n\t- est réservé aux utilisateurs authentifiés sur le terminal ; ET\n\t- s'effectue au moyen de supports amovibles préalablement « enrôlés » sur le système et autorisés pour cet utilisateur."
    5_prefix: "#CL_POSTE_05"
    5_desc: "Les postes de travail de classe Y doivent, pour garantir le contrôle des équipements connectés au réseau, avoir les services non utilisés désactivités (conformité)."
    6_prefix: "#CL_POSTE_06"
    6_desc: "Les postes de travail de classe Y doivent, pour garantir le cloisonnement et le filtrage, faire l'objet d'un cloisonnement par fonction homogène au  sein du SI   (cloisonnement des  réseaux locaux-LANs-par population)"
    7_prefix: "#CL_POSTE_07"
    7_desc: "Les postes de travail de classe Y doivent, pour garantir la capacité à restreindre la visualisation des IC par un tiers, faire l'objet d'une disposition par rapport aux ouvertures du local  (portes, fenêtres, vasistas, hublots, etc.) et d'une protection des vis-à-vis"
    8_prefix: "#CL_POSTE_08"
    8_desc: "Les postes de travail de classe B doivent, pour garantir l'intégrité physique des éléments constitutifs du SI :\n\t- bénéficier d'une protection de classe Y\n\t\t- faire l'objet d'un contrôle annuel de l’intégrité des scellés."
    9_prefix: "#CL_POSTE_09"
    9_desc: "Les postes de travail de classe B doivent, pour garantir la confidentialité des données lorsque le terminal n’est pas en fonctionnement :\n\t- faire l'objet d'un chiffrement intégral du disque par un logiciel agréé pour la protection des informations portant la mention Diffusion Restreinte ; OU\n\t- faire l'objet d'un stockage à distance des données sur l’infrastructure d’hébergement du SI ; OU\n\t- disposer d'une mémoire de masse extractible ou équipement mobile stockable dans un meuble de classe adaptée à la classification des\ndonnées en clair."
    10_prefix: "#CL_POSTE_10"
    10_desc: "Les postes de travail de classe B doivent, pour garantir la sécurité du contrôle d'accès de l’utilisateur, disposer d'un dispositif d’authentification forte, par exemple basée sur une infrastructure de gestion de clefs (IGC) conforme au RGS** - homologué par l'organisme."
    11_prefix: "#CL_POSTE_11"
    11_desc: "Dans le cadre de postes de travail de classe B, l'accès aux dispositifs d’import-export du poste utilisateur bénéficie d'une protection de la classe Y."
    12_prefix: "#CL_POSTE_12"
    12_desc: "Les postes de travail de classe B doivent, pour garantir le contrôle des équipements connectés au réseau :\n\t- bénéficier d'une protection de la classe Y ; ET\n\t- être authentifiés sur le réseau."
    13_prefix: "#CL_POSTE_13"
    13_desc: "Les postes de travail de classe B doivent, pour garantir le cloisonnement et le filtrage, faire l'objet d'un cloisonnement entre les utilisateurs d’une même  population, exemple P-VLAN."
    14_prefix: "#CL_POSTE_14"
    14_desc: "Les postes de travail de classe B doivent, pour garantir la capacité à restreindre la visualisation des IC par un tiers, faire l'objet d'une protection de la classe Y."
    15_prefix: "#CL_POSTE_15"
    15_desc: "Les postes de travail de classe A doivent, pour garantir l'intégrité physique des éléments constitutifs du SI, bénéficier d'un dispositif de détection d’ouverture de l’équipement ou scellés numérotés de contrôle d’ouverture de l’équipement avec traçabilité des équipements ayant reçu ces scellés Contrôle semestriel de l’intégrité des scellés."
    16_prefix: "#CL_POSTE_16"
    16_desc: "Les postes de travail de classe A doivent, pour garantir la confidentialité des données lorsque le terminal n’est pas en fonctionnement, bénéficier d'une protection de classe B."
    17_prefix: "#CL_POSTE_17"
    17_desc: "Les postes de travail de classe A doivent, pour garantir la sécurité du contrôle d'accès de l’utilisateur, disposer d'un dispostif d’authentification forte, par exemple basée sur une infrastructure de gestion de clefs (IGC) conforme au RGS**."
    18_prefix: "#CL_POSTE_18"
    18_desc: "Dans le cadre de postes de travail de classe A, l'accès aux dispositifs d’import-export du poste utilisateur est réservé aux utilisateurs assurant une fonction d’enregistrement des documents classifiés ou de gestion des échanges"
    19_prefix: "#CL_POSTE_19"
    19_desc: "Les postes de travail de classe A doivent, pour garantir le contrôle des équipements connectés au réseau, bénéficier d'une protection de la classe B"
    20_prefix: "#CL_POSTE_20"
    20_desc: "Les postes de travail de classe A doivent, pour garantir le cloisonnement et le filtrage, faire l'objet d'un cloisonnement par le chiffre pour chaque poste utilisateur (tunnel dédié vers les services)."
    21_prefix: "#CL_POSTE_21"
    21_desc: "Les postes de travail de classe A doivent, pour garantir la capacité à restreindre la visualisation des IC par un tiers, faire l'objet d'une protection de la classe B."
  3b:
    title: "Tableaux de combinaison des classes - Protection des systèmes d'information classifiés"
    prefix: "3B"
    1_prefix: "#PROT_SIC_01"
    1_desc: "Au niveau Secret, il est nécessaire de recourir à un système d'information de classe Y lorsque :\n\t- la classe du bâtiment est : 1, 2, 3 ou 4 ; ET\n\t- la classe du local est : a ou b."
    2_prefix: "#PROT_SIC_02"
    2_desc: "Au niveau Secret, il est nécessaire de recourir à un système d'information de classe B lorsque :\n\t- la classe du bâtiment est : 1, 2 ou 3 ; ET\n\t- la classe du local est : c."
    3_prefix: "#PROT_SIC_03"
    3_desc: "Au niveau Secret, il est nécessaire de recourir à un système d'information de classe B lorsque :\n\t- la classe du bâtiment est : 1 ou 2 ; ET\n\t- la classe du local est : d."
    4_prefix: "#PROT_SIC_04"
    4_desc: "Au niveau Secret, il est nécessaire de recourir à un système d'information de classe A lorsque :\n\t- la classe du bâtiment est : 4 ; ET\n\t- la classe du local est : c."
    5_prefix: "#PROT_SIC_05"
    5_desc: "Au niveau Secret, il est nécessaire de recourir à un système d'information de classe A lorsque :\n\t- la classe du bâtiment est : 3 ; ET\n\t- la classe du local est : d."
    6_prefix: "#PROT_SIC_06"
    6_desc: "Aucun système d'information classifié au niveau Secret ne peut être mis en œuvre dans un local de classe d situé dans un bâtiment de classe 4."
    7_prefix: "#PROT_SIC_07"
    7_desc: "Au niveau Très Secret, il est nécessaire de recourir à un système d'information de classe B lorsque :\n\t- la classe du bâtiment est : 1, 2 ou 3 ; ET\n\t- la classe du local est : a, b ou c."
    8_prefix: "#PROT_SIC_08"
    8_desc: "Aucun système d'information classifié au niveau Très Secret ne peut être mis en œuvre dès lors que le bâtiment est de classe 4 ou que le local est de classe c ou d."
    9_prefix: "#PROT_SIC_09"
    9_desc: "Pour le seul niveau Secret, et dans l'hypothèse où les barrières physiques sont assurés par le local et un meuble adapté, il est nécessaire de mettre en œuvre un système d'information classifié de classe Y lorsque :\n\t- la classe du local est : a ou b ; ET\n\t- la classe du meuble est : A ou B."
    10_prefix: "#PROT_SIC_10"
    10_desc: "Pour le seul niveau Secret, et dans l'hypothèse où les barrières physiques sont assurés par le local et un meuble adapté, il est nécessaire de mettre en œuvre un système d'information classifié de classe Y lorsque :\n\t- la classe du local est : a ; ET\n\t- la classe du meuble est : C."
    11_prefix: "#PROT_SIC_11"
    11_desc: "Pour le seul niveau Secret, et dans l'hypothèse où les barrières physiques sont assurés par le local et un meuble adapté, il est nécessaire de mettre en œuvre un système d'information classifié de classe B lorsque :\n\t- la classe du local est : b ; ET\n\t- la classe du meuble est : C."
    12_prefix: "#PROT_SIC_12"
    12_desc: "Pour le seul niveau Secret, et dans l'hypothèse où les barrières physiques sont assurés par le local et un meuble adapté, il est nécessaire de mettre en œuvre un système d'information classifié de classe B lorsque :\n\t- la classe du local est : c ; ET\n\t- la classe du meuble est : A ou B."
    13_prefix: "#PROT_SIC_13"
    13_desc: "Pour le seul niveau Secret, et dans l'hypothèse où les barrières physiques sont assurés par le local et un meuble adapté, il est nécessaire de mettre en œuvre un système d'information classifié de classe A lorsque :\n\t- la classe du local est : c ; ET\n\t- la classe du meuble est : C."
    14_prefix: "#PROT_SIC_14"
    14_desc: "Pour le seul niveau Secret, et dans l'hypothèse où les barrières physiques sont assurés par le local et un meuble adapté, il est nécessaire de mettre en œuvre un système d'information classifié de classe A lorsque :\n\t- la classe du local est : d ; ET\n\t- la classe du meuble est : A, B ou C."
