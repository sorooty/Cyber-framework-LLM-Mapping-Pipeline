2:
  prefix: "Chapitre II"
  title: "mise à disposition sur le marché et mise en service des dispositifs, obligations des opérateurs économiques, retraitement, marquage ce et libre circulation"
  1:
    prefix: "Article 5"
    title: "Mise sur le marché et mise en service"
    1_prefix: "5.1"
    1_label: "Un dispositif ne peut être mis sur le marché ou mis en service que s'il est conforme au présent réglement au moment où il est dûment fourni et depuis lors qu'il est correctement installé, entretenu et utilisé conformément à sa destination."
    2_prefix: "5.2"
    2_label: "Un dispositif est conforme aux exigences générales en matière de sécurité et de performances énoncées à l'annexe I qui lui sont applicables, compte tenu de sa destination."
    3_prefix: "5.3"
    3_label: "La démonstration de la conformité avec les exigences générales en matière de sécurité et de performances comprend une évaluation clinique telle qu'elle est prévue à l'article 61."
    4_prefix: "5.4"
    4_label: "Les dispositifs fabriqués et utilisés dans les établissements de santé sont considérés comme ayant été mis en service."
    5_prefix: "5.5"
    5_label: "À l'exception des exigences générales en matière de sécurité et de performances énoncées à l'annexe I, les dispositions du présent règlement ne s'appliquent pas aux dispositifs fabriqués et utilisés exclusivement dans les établissements de santé établis dans l'Union, si toutes les conditions suivantes sont remplies"
    5_desc: "\ta. les dispositifs ne sont pas transférés vers une autre entité juridique; \n\tb. la fabrication et l'utilisation des dispositifs s'effectuent dans le cadre de systèmes de gestion de la qualité appropriés; \n\tc. l'établissement de santé justifie dans sa documentation que les besoins spécifiques du groupe cible de patients ne peuvent pas être satisfaits ou ne peuvent pas être satisfaits au niveau de performances approprié par un dispositif équivalent disponible sur le marché; \n\td. l'établissement de santé fournit, sur demande, à son autorité compétente des informations concernant l'utilisation de ces dispositifs, qui comportent une justification de leur fabrication, de leur modification et de leur utilisation; \n\te. l'établissement de santé établit une déclaration, qu'il rend publique, comprenant: \n\t\ti. le nom et l'adresse de l'établissement de santé de fabrication; \n\t\tii. les détails nécessaires pour identifier les dispositifs; \n\t\tiii. une déclaration indiquant que les dispositifs satisfont aux exigences générales en matière de sécurité et de performances énoncées à l'annexe I et, le cas échéant, des informations sur celles auxquelles il n'est pas entièrement satisfait, accompagnées d'une justification motivée; \n\tf. l'établissement de santé établit une documentation permettant de comprendre les installations de fabrication, le procédé de fabrication, la conception et les données sur les performances des dispositifs, y compris leur destination, et de manière suffisamment détaillée pour que l'autorité compétente puisse s'assurer que les exigences générales en matière de sécurité et de performances énoncées à l'annexe I sont remplies; \n\tg. l'établissement de santé prend toutes les mesures nécessaires pour garantir que l'ensemble des dispositifs sont fabriqués conformément à la documentation visée au point \n\tf.; et \n\th. l'établissement de santé examine l'expérience issue de l'utilisation clinique des dispositifs et prend toutes les mesures correctives nécessaires. \n\nℹ️ \n Les États membres peuvent exiger de ces établissements de santé qu'ils transmettent à l'autorité compétente toute autre information pertinente concernant les dispositifs de ce type qui ont été fabriqués et sont utilisés sur leur territoire. Les États membres conservent le droit de restreindre la fabrication et l'utilisation de tout type particulier de dispositif et ont le droit de contrôler les activités des établissements de santé. \n\nℹ️ \n Le présent paragraphe ne s'applique pas aux dispositifs qui sont fabriqués à l'échelle industrielle."
    6_prefix: "5.6"
    6_label: "Afin d'assurer l'application uniforme de l'annexe I, la Commission peut adopter des actes d'exécution dans la mesure nécessaire pour résoudre les problèmes liés à des différences d'interprétation et à l'application pratique. Ces actes d'exécution sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3."
  2:
    prefix: "Article 6"
    title: "Ventes à distance"
    1_prefix: "6.1"
    1_label: "Un dispositif proposé au moyen de services de la société de l'information, au sens de l'article 1er, paragraphe 1, point b), de la directive (UE) 2015/1535, à une personne physique ou morale établie dans l'Union est conforme au présent règlement."
    2_prefix: "6.2"
    2_label: "Sans préjudice des dispositions de droit national relatives à l'exercice de la profession médicale, un dispositif qui n'est pas mis sur le marché mais utilisé dans le cadre d'une activité commerciale, à titre onéreux ou gratuit, aux fins d'une prestation diagnostique ou thérapeutique fournie au moyen de services de la société de l'information au sens de l'article 1er, paragraphe 1, point b), de la directive (UE) 2015/1535 ou par d'autres moyens de communication, directement ou via des intermédiaires, à une personne physique ou morale établie dans l'Union est conforme au présent règlement."
    3_prefix: "6.3"
    3_label: "À la demande d'une autorité compétente, toute personne physique ou morale proposant un dispositif conformément au paragraphe 1 ou assurant une prestation de service conformément au paragraphe 2 met à disposition une copie de la déclaration de conformité UE du dispositif concerné."
    4_prefix: "6.4"
    4_label: "Un État membre peut, pour des motifs liés à la protection de la santé publique, exiger d'un fournisseur de services de la société de l'information au sens de l'article 1er, paragraphe 1, point b), de la directive (UE) 2015/1535 qu'il mette fin à son activité."
  3_prefix: "Article 7"
  3_title: "Allégations"
  3_desc: "Au niveau de l'étiquetage, de la notice d'utilisation, de la mise à disposition et de la mise en service des dispositifs ainsi que de la publicité les concernant, il est interdit d'utiliser du texte, des noms, des marques, des images et des signes figuratifs ou autres susceptibles d'induire l'utilisateur ou le patient en erreur en ce qui concerne la destination, la sécurité et les performances du dispositif: \n\ta. en attribuant au dispositif des fonctions et des propriétés qu'il n'a pas; \n\tb. en donnant une impression trompeuse sur le traitement ou le diagnostic, ou sur des fonctions ou des propriétés qui ne sont pas celles du dispositif en question; \n\tc. en omettant d'informer l'utilisateur ou le patient d'un risque probable lié à l'utilisation du dispositif conformément à sa destination; \n\td. en suggérant d'autres utilisations du dispositif que celles déclarées relever de la destination pour laquelle l'évaluation de la conformité a été réalisée."
  4:
    prefix: "Article 8"
    title: "Application de normes harmonisées"
    1_prefix: "8.1"
    1_desc: "Les dispositifs conformes aux normes harmonisées applicables, ou à des parties pertinentes de ces normes, dont les références ont été publiées au Journal officiel de l'Union européenne sont présumés conformes aux exigences du présent règlement relevant de ces normes ou de parties de celles-ci. \n\n Le premier alinéa s'applique également aux mesures imposées par le présent règlement aux opérateurs économiques ou aux promoteurs en matière de systèmes ou de procédés, y compris celles relatives aux systèmes de gestion de la qualité, à la gestion des risques, aux systèmes de surveillance après commercialisation, aux investigations cliniques, à l'évaluation clinique ou au suivi clinique après commercialisation (SCAC). \n\n Les références faites dans le présent règlement à des normes harmonisées s'entendent comme les références à des normes harmonisées qui ont été publiées au Journal officiel de l'Union européenne."
    2_prefix: "8.2"
    2_desc: "Les références faites dans le présent réglement à des normes harmonisées incluent aussi les monographies de la pharmacopée européenne adoptées en vertu de la convention relative à l'élaboration d'une pharmacopée européenne, en particulier celles relatives aux sutures chirurgicales et aux interactions entre médicaments et matériaux composant les dispositifs contenant ces médicaments, pour autant que les références auxdites monographies aient été publiées au Journal officiel de l'Union européenne."
  5:
    prefix: "Article 9"
    title: "Spécifications communes"
    1_prefix: "9.1"
    1_desc: "Sans préjudice de l'article 1er, paragraphe 2, et de l'article 17, paragraphe 5, et du délai qui est fixé dans lesdites dispositions, la Commission, après avoir consulté le GCDM, peut, au moyen d'actes d'exécution, adopter des spécifications communes, lorsqu'il n'existe pas de normes harmonisées, lorsque les normes harmonisées applicables ne suffisent pas, ou lorsqu'il y a lieu de répondre à des préoccupations de santé publique, en ce qui concerne les exigences générales en matière de sécurité et de performances énoncées à l'annexe I, la documentation technique prévue aux annexes II et III, l'évaluation clinique et SCAC prévus à l'annexe XIV ou les exigences relatives aux investigations cliniques énoncées à l'annexe XV. Ces actes d'exécution sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3."
    2_prefix: "9.2"
    2_label: "Les dispositifs conformes aux spécifications communes visées au paragraphe 1 sont présumés conformes aux exigences du présent réglement relevant de ces spécifications ou de parties pertinentes de celles-ci."
    3_prefix: "9.3"
    3_label: "Les fabricants se conforment aux spécifications communes visées au paragraphe 1 à moins qu'ils puissent dûment justifier avoir adopté des solutions qui garantissent un niveau de sécurité et de performances au moins équivalent à celui prévu par ces spécifications."
    4_prefix: "9.4"
    4_label: "Nonobstant le paragraphe 3, les fabricants des produits énumérés à l'annexe XVI se conforment aux spécifications communes pertinentes pour ces produits."
  6:
    prefix: "Article 10"
    title: "Obligations générales des fabricants"
    1_prefix: "10.1"
    1_label: "Lorsqu'ils mettent leurs dispositifs sur le marché ou en service, les fabricants veillent à ce que ceux-ci aient été conçus et fabriqués conformément aux exigences du présent règlement."
    2_prefix: "10.2"
    2_label: "Les fabricants établissent, documentent, mettent en œuvre et maintiennent un système de gestion des risques tel qu'il est décrit à l'annexe I, section 3."
    3_prefix: "10.3"
    3_label: "Les fabricants réalisent une évaluation clinique conformément aux exigences énoncées à l'article 61 et à l'annexe XIV, notamment un SCAC."
    4_prefix: "10.4"
    4_desc: "Les fabricants de dispositifs autres que des dispositifs sur mesure établissent et tiennent à jour la documentation technique relative auxdits dispositifs. La documentation technique est de nature à permettre l'évaluation de la conformité du dispositif avec les exigences du présent règlement. Cette documentation technique contient les éléments prévus aux annexes II et III. \n\n La Commission est habilitée à adopter des actes délégués conformément à l'article 115 pour modifier, eu égard aux progrès techniques, les annexes II et III."
    5_prefix: "10.5"
    5_label: "Les fabricants de dispositifs sur mesure établissent, tiennent à jour et tiennent à disposition des autorités compétentes la documentation visée à l'annexe XIII, section 2."
    6_prefix: "10.6"
    6_label: "Lorsque la conformité avec les exigences applicables est démontrée à l'issue de la procédure d'évaluation de la conformité applicable, les fabricants de dispositifs autres que des dispositifs sur mesure ou faisant l'objet d'une investigation établissent une déclaration de conformité UE conformément à l'article 19 et apposent le marquage de conformité CE conformément à l'article 20."
    7_prefix: "10.7"
    7_label: "Les fabricants se conforment aux obligations concernant le système IUD visées à l'article 27 et aux obligations liées à l'enregistrement visées aux articles 29 et 31."
    8_prefix: "10.8"
    8_desc: "Les fabricants tiennent la documentation technique, la déclaration de conformité UE et, le cas échéant, une copie de tout certificat applicable délivré conformément à l'article 56, y compris toute modification et tout document complémentaire, à la disposition des autorités compétentes pour une durée d'au moins dix ans à partir de la mise sur le marché du dernier dispositif visé par la déclaration de conformité UE. Dans le cas de dispositifs implantables, la durée est d'au moins quinze ans à partir de la mise sur le marché du dernier dispositif. \n\n À la demande d'une autorité compétente, le fabricant communique, comme indiqué dans cette demande, l'ensemble de la documentation technique ou un résumé de celle-ci. \n\n Afin que son mandataire puisse s'acquitter des tâches prévues à l'article 11, paragraphe 3, le fabricant dont le siège social se situe en dehors de l'Union fait en sorte que le mandataire ait en permanence à sa disposition la documentation nécessaire."
    9_prefix: "10.9"
    9_desc: "Les fabricants veillent à ce que des procédures existent pour maintenir la production en série conforme aux exigences du présent règlement. Il est dûment tenu compte, en temps opportun, des modifications de la conception ou des caractéristiques du dispositif et des modifications des normes harmonisées ou des spécifications communes sur la base desquelles la conformité d'un dispositif est déclarée. Les fabricants de dispositifs, autres que des dispositifs faisant l'objet d'une investigation, établissent, documentent, appliquent, maintiennent, mettent à jour et améliorent en permanence un système de gestion de la qualité qui garantit la conformité avec les dispositions du présent règlement et ce, de la façon la plus efficace possible et d'une manière qui soit proportionnée à la classe de risque et au type de dispositif. \n\n Le système de gestion de la qualité englobe toutes les parties et éléments de l'organisation d'un fabricant en rapport avec la qualité des processus, des procédures et des dispositifs. Il régit les ressources requises en matière de structure, de responsabilités, de procédures, de processus et de gestion pour appliquer les principes et les mesures nécessaires pour garantir la conformité avec les dispositions du présent règlement. \n\nLe système de gestion de la qualité porte au moins sur les aspects suivants: \n\ta. une stratégie de respect de la réglementation, notamment le respect des procédures d'évaluation de la conformité et des procédures de gestion des modifications apportées aux dispositifs concernés par le système; \n\tb. l'identification des exigences générales en matière de sécurité et de performances et la recherche de solutions pour les respecter; \n\tc. la responsabilité de la gestion; \n\td. la gestion des ressources, et notamment la sélection et le contrôle des fournisseurs et sous-traitants; \n\te. la gestion des risques visée à l'annexe I, section 3; \n\tf. l'évaluation clinique conformément à l'article 61 et à l'annexe XIV, y compris le SCAC; \n\tg. la réalisation du produit, y compris la planification, la conception, l'élaboration, la production et la fourniture de services; \n\th. la vérification des attributions d'IUD conformément à l'article 27, paragraphe 3, à l'ensemble des dispositifs concernés en veillant à la cohérence et à la validité des informations fournies conformément à l'article 29; \n\ti. l'élaboration, la mise en œuvre et le maintien d'un système de surveillance après commercialisation conformément à l'article 83; \n\tj. la gestion de la communication avec les autorités compétentes, les organismes notifiés, les autres opérateurs économiques, les clients et/ou d'autres parties prenantes; \n\tk. les processus de notification des incidents graves et des mesures correctives de sécurité dans un contexte de vigilance; \n\tl. la gestion des mesures correctives et préventives et la vérification de leur efficacité; \n\tm. les procédures de contrôle et de mesure des résultats, d'analyse des données et d'amélioration des produits."
    10_prefix: "10.10"
    10_label: "Les fabricants de dispositifs appliquent et mettent à jour le système de surveillance après commercialisation conformément à l'article 83."
    11_prefix: "10.11"
    11_label: "Les fabricants veillent à ce que le dispositif soit accompagné des informations figurant à l'annexe I, section 23, dans une ou des langues officielles de l'Union définies par l'État membre dans lequel le dispositif est mis à la disposition de l'utilisateur ou du patient. Les indications figurant sur l'étiquette sont indélébiles, facilement lisibles et clairement compréhensibles pour le patient ou l'utilisateur auquel le dispositif est destiné."
    12_prefix: "10.12"
    12_desc: "Les fabricants qui considèrent ou ont des raisons de croire qu'un dispositif qu'ils ont mis sur le marché ou mis en service n'est pas conforme au présent règlement prennent immédiatement les mesures correctives nécessaires pour le mettre en conformité, le retirer ou le rappeler, selon le cas. Ils informent les distributeurs du dispositif en question et, le cas échéant, le mandataire et les importateurs en conséquence. \n\n Lorsque le dispositif présente un risque grave, les fabricants informent immédiatement les autorités compétentes des États membres dans lesquels ils ont mis le dispositif à disposition et, le cas échéant, l'organisme notifié ayant délivré un certificat conformément à l'article 56, en particulier, du cas de non-conformité et des éventuelles mesures correctives prises."
    13_prefix: "10.13"
    13_label: "Les fabricants disposent d'un système d'enregistrement et de notification des incidents et des mesures correctives de sécurité décrit aux articles 87 et 88."
    14_prefix: "10.14"
    14_desc: "À la demande d'une autorité compétente, les fabricants lui communiquent toutes les informations et tous les documents nécessaires pour démontrer la conformité du dispositif, dans une langue officielle de l'Union définie par l'État membre concerné. L'autorité compétente de l'État membre dans lequel le fabricant a son siège social peut demander que le fabricant fournisse des échantillons du dispositif gratuitement ou, si c'est impossible, donne accès au dispositif. Les fabricants coopèrent avec une autorité compétente, à sa demande, à toute mesure corrective prise en vue d'éliminer ou, si ce n'est pas possible, d'atténuer les risques présentés par des dispositifs qu'ils ont mis sur le marché ou mis en service. \n\n Si le fabricant ne coopère pas ou si les informations et documents qu'il a communiqués sont incomplets ou incorrects, l'autorité compétente peut, aux fins de la protection de la santé publique et de la sécurité du patient, prendre toute mesure appropriée pour interdire ou limiter la mise à disposition du dispositif sur son marché national, retirer le dispositif dudit marché ou le rappeler jusqu'à ce que le fabricant coopère ou fournisse des informations complètes et correctes. \n\n Si une autorité compétente considère ou a des raisons de croire qu'un dispositif a causé un dommage, elle facilite la communication, sur demande, des informations et des documents visés au premier alinéa au patient ou à l'utilisateur ayant potentiellement subi un dommage et, le cas échéant, à son ayant-droit, à sa compagnie d'assurance maladie ou à d'autres parties tierces concernées par le dommage causé au patient ou à l'utilisateur, sans préjudice des règles en matière de protection des données et, à moins qu'un intérêt public supérieur ne justifie la divulgation des informations en question, sans préjudice de la protection des droits de propriété intellectuelle. \n\n L'autorité compétente n'est pas tenue de respecter l'obligation prévue au troisième alinéa lorsque la divulgation des informations et de la documentation visées au premier alinéa s'effectue habituellement dans le cadre d'une procédure judiciaire."
    15_prefix: "10.15"
    15_label: "Lorsque les fabricants font concevoir ou fabriquer leurs dispositifs par une autre personne morale ou physique, les informations sur l'identité de celle-ci font partie des informations à transmettre en application de l'article 30, paragraphe 1."
    16_prefix: "10.16"
    16_desc: "Les personnes physiques ou morales peuvent demander réparation pour des dommages causés par un dispositif défectueux conformément à la législation de l'Union et à la législation nationale applicables. \n\n Les fabricants auront, d'une manière qui soit proportionnée à la classe de risque, au type de dispositif et à la taille de l'entreprise, pris des mesures pour disposer d'une couverture financière suffisante au regard de leur éventuelle responsabilité en application de la directive 85/374/CEE, sans préjudice de l'adoption de mesures plus protectrices en vertu du droit national."
  7:
    prefix: "Article 11"
    title: "Mandataire"
    1_prefix: "11.1"
    1_label: "Lorsque le fabricant d'un dispositif n'est pas établi dans un État membre, le dispositif ne peut être mis sur le marché de l'Union que si le fabricant désigne un mandataire unique."
    2_prefix: "11.2"
    2_label: "La désignation constitue le mandat du mandataire, elle n'est valable que si elle est acceptée par écrit par le mandataire et vaut au moins pour tous les dispositifs du même groupe générique de dispositifs."
    3_prefix: "11.3"
    3_desc: "Le mandataire s'acquitte des tâches précisées dans le mandat dont il aura convenu avec le fabricant. Il fournit une copie du mandat à l'autorité compétente, sur demande. Le mandat oblige le mandataire, et le fabricant l'autorise, à s'acquitter au moins des tâches suivantes en rapport avec les dispositifs relevant de son mandat: \n\ta. vérifier que la déclaration de conformité UE et la documentation technique ont été établies et, le cas échéant, qu'une procédure d'évaluation de la conformité appropriée a été appliquée par le fabricant; \n\tb. tenir disponible une copie de la documentation technique, de la déclaration de conformité UE et, le cas échéant, du certificat applicable délivré conformément à l'article 56, y compris toute modification et tout document complémentaire, à la disposition des autorités compétentes pour la durée visée à l'article 10, paragraphe 8; \n\tc. se conformer aux obligations liées à l'enregistrement visées à l'article 31 et vérifier que le fabricant s'est conformé aux obligations liées à l'enregistrement visées aux articles 27 et 29; \n\td. à la demande d'une autorité compétente, lui communiquer toutes les informations et tous les documents nécessaires à la démonstration de la conformité d'un dispositif, dans une langue officielle de l'Union définie par l'État membres concerné; \n\te. transmettre au fabricant toute demande d'échantillons ou d'accès à un dispositif faite par une autorité compétente de l'État membre dans lequel le mandataire a son siège social, et vérifier que l'autorité compétente reçoive les échantillons ou ait accès au dispositif; \n\tf. coopérer avec les autorités compétentes à toute mesure préventive ou corrective prise en vue d'éliminer ou, si ce n'est pas possible, d'atténuer les risques présentés par des dispositifs; \n\tg. informer immédiatement le fabricant des réclamations et signalements de professionnels de la santé, de patients et d'utilisateurs relatifs à des incidents supposés liés à un dispositif relevant de son mandat; \n\th. mettre fin au mandat si le fabricant ne respecte pas les obligations qui lui incombent en vertu du présent règlement."
    4_prefix: "11.4"
    4_label: "Le mandat visé au paragraphe 3 du présent article ne délègue pas les obligations du fabricant prévues par l'article 10, paragraphes 1, 2, 3, 4, 6, 7, 9, 10, 11 et 12."
    5_prefix: "11.5"
    5_label: "Sans préjudice du paragraphe 4 du présent article, lorsque le fabricant n'est pas établi dans un État membre et n'a pas satisfait aux obligations visées à l'article 10, le mandataire et le fabricant sont solidairement responsables des dispositifs défectueux, selon des modalités identiques."
    6_prefix: "11.6"
    6_label: "Un mandataire qui met fin à son mandat sur la base du paragraphe 3, point h), informe immédiatement de la fin du mandat et des raisons de cette décision l'autorité compétente de l'État membre dans lequel il est établi et, le cas échéant, l'organisme notifié qui est intervenu dans l'évaluation de la conformité du dispositif."
    7_prefix: "11.7"
    7_label: "Toute référence dans le présent règlement à l'autorité compétente de l'État membre dans lequel est situé le siège social du fabricant s'entend comme faite à l'autorité compétente de l'État membre dans lequel est situé le siège social du mandataire désigné par un fabricant visé au paragraphe 1."
  8_prefix: "Article 12"
  8_label: "Changement de mandataire"
  8_desc: "Les modalités de changement de mandataire sont clairement définies dans un accord entre le fabricant, si possible le mandataire sortant et le nouveau mandataire. Cet accord précise au moins les informations suivantes: \n\ta. la date de fin du mandat du mandataire sortant et la date de début du mandat du nouveau mandataire; \n\tb. la date jusqu'à laquelle le mandataire sortant peut être indiqué dans les informations fournies par le fabricant, y compris tout document publicitaire; \n\tc. les modalités de transfert des documents, y compris les questions de confidentialité et de droits de propriété; \n\td. l'obligation du mandataire sortant de transmettre au fabricant ou au nouveau mandataire, après la fin du mandat, toute réclamation ou tout signalement de professionnels de la santé, de patients ou d'utilisateurs relatifs à des incidents supposés liés à un dispositif qui relevait de son mandat."
  9:
    prefix: "Article 13"
    title: "Obligations générales des importateurs"
    1_prefix: "13.1"
    1_label: "Les importateurs ne mettent sur le marché de l'Union que des dispositifs conformes au présent règlement."
    2_prefix: "13.2"
    2_label: "Pour mettre un dispositif sur le marché, les importateurs vérifient que:"
    2_desc: "Pour mettre un dispositif sur le marché, les importateurs vérifient que: \n\ta. le dispositif porte le marquage CE et la déclaration de conformité UE du dispositif a été établie; \n\tb. le fabricant est identifié et a désigné un mandataire conformément à l'article 11; \n\tc. le dispositif est étiqueté conformément au présent règlement et accompagné de la notice d'utilisation requise; \n\td. le fabricant a attribué, le cas échéant, un IUD au dispositif conformément à l'article 27. \n\n Lorsqu'un importateur considère ou a des raisons de croire qu'un dispositif n'est pas conforme aux exigences du présent règlement, il ne met le dispositif sur le marché qu'après la mise en conformité de celui-ci et informe le fabricant et le mandataire de celui-ci. Lorsque l'importateur considère ou a des raisons de croire que le dispositif présente un risque grave ou est un dispositif falsifié, il informe également l'autorité compétente de l'État membre dans lequel l'importateur est établi."
    3_prefix: "13.3"
    3_label: "Les importateurs indiquent sur le dispositif ou sur son conditionnement ou dans un document accompagnant le dispositif leur nom, leur raison sociale ou leur marque déposée, leur siège social et l'adresse à laquelle ils peuvent être joints afin de pouvoir établir leur emplacement. Ils veillent à ce qu'aucune étiquette supplémentaire ne dissimule les informations figurant sur l'étiquette du fabricant."
    4_prefix: "13.4"
    4_label: "Les importateurs vérifient que le dispositif est enregistré dans le système électronique conformément à l'article 29. Les importateurs ajoutent leurs coordonnées dans cet enregistrement conformément à l'article 31."
    5_prefix: "13.5"
    5_label: "Les importateurs veillent à ce que, tant qu'un dispositif est sous leur responsabilité, les conditions de stockage ou de transport ne compromettent pas sa conformité avec les exigences générales en matière de sécurité et de performances énoncées à l'annexe I, et ils se conforment aux conditions éventuellement fixées par le fabricant."
    6_prefix: "13.6"
    6_label: "Les importateurs tiennent un registre des réclamations, des dispositifs non conformes et des rappels et retraits, et fournissent au fabricant, au mandataire et aux distributeurs toute information que ceux-ci demandent, afin de leur permettre de procéder à l'investigation des réclamations."
    7_prefix: "13.7"
    7_desc: "Les importateurs qui considèrent ou ont des raisons de croire qu'un dispositif qu'ils ont mis sur le marché n'est pas conforme au présent règlement informent immédiatement le fabricant et son mandataire. Les importateurs coopèrent avec le fabricant, le mandataire de celui-ci et les autorités compétentes pour faire en sorte que les mesures correctives nécessaires soient prises pour que ce dispositif soit mis en conformité, retiré ou rappelé. Lorsque le dispositif présente un risque grave, ils informent immédiatement les autorités compétentes des États membres dans lesquels ils ont mis le dispositif à disposition et, le cas échéant, l'organisme notifié ayant délivré un certificat conformément à l'article 56 pour le dispositif en question, et précisent, notamment, le cas de non-conformité et les éventuelles mesures correctives prises."
    8_prefix: "13.8"
    8_label: "Les importateurs qui ont reçu des réclamations ou des signalements de professionnels de la santé, de patients ou d'utilisateurs relatifs à des incidents supposés liés à un dispositif qu'ils ont mis sur le marché transmettent immédiatement cette information au fabricant et à son mandataire."
    9_prefix: "13.9"
    9_label: "Les importateurs conservent pour la durée visée à l'article 10, paragraphe 8, une copie de la déclaration de conformité UE et, le cas échéant, de tout certificat pertinent délivré conformément à l'article 56, y compris toute modification et tout document complémentaire."
    10_prefix: "13.10"
    10_label: "Les importateurs coopèrent avec les autorités compétentes, à la demande de ces dernières, à toute mesure prise en vue d'éliminer ou, si ce n'est pas possible, d'atténuer les risques présentés par des produits qu'ils ont mis sur le marché. À la demande d'une autorité compétente de l'État membre dans lequel l'importateur a son siège social, les importateurs fournissent des échantillons du dispositif gratuitement ou, si c'est impossible, donnent accès au dispositif."
  10:
    prefix: "Article 14"
    title: "Obligations générales des distributeurs"
    1_prefix: "14.1"
    1_label: "Lorsqu'ils mettent un dispositif à disposition sur le marché, les distributeurs agissent, dans le cadre de leurs activités, avec la diligence requise pour respecter les exigences applicables."
    2_prefix: "14.2"
    2_label: "Avant de mettre un dispositif à disposition sur le marché, les distributeurs vérifient que les conditions suivantes sont remplies:"
    2_desc: "\ta. le dispositif porte le marquage CE et la déclaration de conformité UE du dispositif a été établie; \n\tb. le dispositif est accompagné des informations que le fabricant est tenu de fournir conformément à l'article 10, paragraphe 11;  \n\tc. dans le cas de dispositifs importés, l'importateur s'est conformé aux exigences visées à l'article 13, paragraphe 3; \n\td. le fabricant a attribué un IUD, le cas échéant. \n\n Afin de respecter les exigences visées aux points a), b) et d), du premier alinéa, le distributeur peut appliquer une méthode d'échantillonnage représentative des dispositifs fournis par ledit distributeur. \n\n Lorsqu'un distributeur considère ou a des raisons de croire qu'un dispositif n'est pas conforme aux exigences du présent règlement, il ne met le dispositif à disposition sur le marché qu'après la mise en conformité de celui-ci et informe le fabricant et, le cas échéant, le mandataire de ce dernier et l'importateur. Lorsque le distributeur considère ou a des raisons de croire que le dispositif présente un risque grave ou est un dispositif falsifié, il informe également l'autorité compétente de l'État membre dans lequel il est établi."
    3_prefix: "14.3"
    3_label: "Les distributeurs veillent à ce que, tant que le dispositif est sous leur responsabilité, les conditions de stockage ou de transport soient conformes aux conditions fixées par le fabricant."
    4_prefix: "14.4"
    4_desc: "Les distributeurs qui considèrent ou ont des raisons de croire qu'un dispositif qu'ils ont mis à disposition sur le marché n'est pas conforme au présent règlement informent immédiatement le fabricant et, le cas échéant, le mandataire de ce dernier et l'importateur. Les distributeurs coopèrent avec le fabricant et, le cas échéant, le mandataire de ce dernier et l'importateur, ainsi qu'avec les autorités compétentes, pour faire en sorte que les mesures correctives nécessaires soient prises pour que ce dispositif soit mis en conformité, retiré ou rappelé, selon le cas. Lorsque le distributeur considère ou à des raisons de croire que le dispositif présente un risque grave, il informe aussi immédiatement les autorités compétentes des États membres dans lesquels il a mis le dispositif à disposition et précise, notamment, le cas de non-conformité et les éventuelles mesures correctives prises."
    5_prefix: "14.5"
    5_desc: "Les distributeurs qui ont reçu des réclamations ou des signalements de professionnels de la santé, de patients ou d'utilisateurs relatifs à des incidents supposés liés à un dispositif qu'ils ont mis à disposition transmettent immédiatement cette information au fabricant et, le cas échéant, au mandataire de ce dernier et à l'importateur. Ils tiennent un registre des réclamations, des dispositifs non conformes et des rappels et retraits, et tiennent le fabricant et, le cas échéant, le mandataire et l'importateur informés de ces activités de suivi et leur fournissent toute information sur demande."
    6_prefix: "14.6"
    6_desc: "À la demande d'une autorité compétente, les distributeurs lui communiquent toutes les informations et tous les documents dont ils disposent et qui sont nécessaires à la démonstration de la conformité d'un dispositif. \n\n Les distributeurs sont réputés avoir rempli l'obligation visée au premier alinéa lorsque le fabricant ou, le cas échéant, le mandataire pour le dispositif en question fournit les informations requises. Les distributeurs coopèrent avec les autorités compétentes, à leur demande, à toute mesure prise pour éliminer les risques présentés par des dispositifs qu'ils ont mis à disposition sur le marché. À la demande d'une autorité compétente, les distributeurs fournissent des échantillons gratuits du dispositif ou, si c'est impossible, donnent accès au dispositif."
  11:
    prefix: "Article 15"
    title: "Personne chargée de veiller au respect de la réglementation"
    1_prefix: "15.1"
    1_label: "Les fabricants disposent au sein de leur organisation d'au moins une personne chargée de veiller au respect de la réglementation possédant l'expertise requise dans le domaine des dispositifs médicaux. Cette expertise est attestée par l'une des qualifications suivantes:"
    1_desc: "\ta. un diplôme, un certificat ou un autre document de certification formelle sanctionnant des études universitaires en droit, en médecine, en pharmacie, en ingénierie ou dans une autre discipline scientifique pertinente, ou un cycle de cours reconnu équivalent par l'État membre concerné, et une expérience professionnelle d'au moins un an dans le domaine de la réglementation ou des systèmes de gestion de la qualité en rapport avec les dispositifs médicaux; \n\tb. une expérience professionnelle de quatre ans dans le domaine de la réglementation ou des systèmes de gestion de la qualité en rapport avec les dispositifs médicaux. \n\n Sans préjudice des dispositions nationales relatives aux qualifications professionnelles, les fabricants de dispositifs sur mesure peuvent attester qu'ils possèdent l'expertise requise visée au premier alinéa en apportant la preuve d'une expérience professionnelle d'au moins deux ans dans un domaine de fabrication pertinent. "
    2_prefix: "15.2"
    2_label: "Les micro et petites entreprises au sens de la recommandation 2003/361/CE de la Commission (36) ne sont pas tenues de disposer, au sein de leur organisation, d'une personne chargée de veiller au respect de la réglementation mais une telle personne est en permanence et sans interruption à leur disposition."
    3_prefix: "15.3"
    3_label: "La personne chargée de veiller au respect de la réglementation a au moins pour mission de faire en sorte que:"
    3_desc: "\ta. la conformité des dispositifs soit correctement vérifiée, conformément au système de gestion de la qualité dans le cadre duquel les dispositifs concernés sont fabriqués, avant la libération d'un dispositif; \n\tb. la documentation technique et la déclaration de conformité UE soient établies et tenues à jour; \n\tc. les obligations en matière de surveillance après commercialisation soient remplies, conformément à l'article 10, paragraphe 10; \n\td. les obligations en matière de notification visées aux articles 87 à 91 soient remplies; \n\te. dans le cas de dispositifs faisant l'objet d'une investigation, la déclaration visée à l'annexe XV, chapitre II, section 4.1, soit délivrée."
    4_prefix: "15.4"
    4_label: "Si plusieurs personnes sont solidairement responsables du respect de la réglementation conformément aux paragraphes 1, 2 et 3, leurs domaines de responsabilité respectifs sont précisés par écrit."
    5_prefix: "15.5"
    5_label: "La personne chargée de veiller au respect de la réglementation ne subit, au sein de l'organisation du fabricant, aucun désavantage en relation avec la bonne exécution de ses tâches, qu'elle soit ou non employée par l'organisation."
    6_prefix: "15.6"
    6_label: "Les mandataires disposent en permanence et sans interruption d'au moins une personne chargée de veiller au respect de la réglementation et possédant l'expertise requise dans le domaine de la réglementation des dispositifs médicaux dans l'Union. Cette expertise est attestée par l'une des qualifications suivantes:"
    6_desc: "\ta. un diplôme, un certificat ou un autre document de certification formelle sanctionnant des études universitaires en droit, en médecine, en pharmacie, en ingénierie ou dans une autre discipline scientifique pertinente, ou un cycle de cours reconnu équivalent par l'État membre concerné, et une expérience professionnelle d'au moins un an dans le domaine de la réglementation ou des systèmes de gestion de la qualité en rapport avec les dispositifs médicaux; \n\tb. une expérience professionnelle de quatre ans dans le domaine de la réglementation ou des systèmes de gestion de la qualité en rapport avec les dispositifs médicaux."
  12:
    prefix: "Article 16"
    title: "Cas dans lesquels les obligations des fabricants s'appliquent aux importateurs, aux distributeurs ou à d'autres personnes"
    1_prefix: "16.1"
    1_label: "Un distributeur, un importateur ou une autre personne physique ou morale s'acquitte des obligations incombant aux fabricants s'il procède à l'une des tâches suivantes:"
    1_desc: "\ta. mettre à disposition sur le marché un dispositif sous son nom propre, sous sa raison sociale ou sous sa marque déposée, sauf si un distributeur ou un importateur conclut avec le fabricant un accord selon lequel ce dernier est mentionné en tant que tel sur l'étiquette et demeure responsable du respect des exigences imposées aux fabricants par le présent règlement; \n\tb. modifier la destination d'un dispositif déjà mis sur le marché ou mis en service; \n\tc. modifier un dispositif déjà mis sur le marché ou mis en service d'une manière telle que cela peut influer sur la conformité avec les exigences applicables. \n\n Le premier alinéa ne s'applique pas aux personnes qui, sans être considérées comme des fabricants au sens de l'article 2, point 30), assemblent un dispositif déjà sur le marché ou l'adaptent à l'intention d'un patient donné sans en modifier la destination."
    2_prefix: "16.2"
    2_label: "Aux fins du paragraphe 1, point c), ne sont pas considérées comme des modifications d'un dispositif susceptibles d'influer sur la conformité avec les exigences applicables:"
    2_desc: "\ta. la fourniture, traduction comprise, des informations fournies par le fabricant en application de l'annexe I, section 23, relatives à un dispositif déjà mis sur le marché, et des informations complémentaires nécessaires à la commercialisation du dispositif dans l'État membre concerné; \n\tb. les modifications apportées au conditionnement extérieur d'un dispositif déjà mis sur le marché, y compris toute modification de la taille du conditionnement, si le reconditionnement est nécessaire à la commercialisation du dispositif dans l'État membre concerné et s'il est effectué dans des conditions telles qu'il n'altère en aucune façon l'état d'origine du dispositif. Dans le cas de dispositifs mis sur le marché à l'état stérile, il est présumé que l'état d'origine du dispositif est altéré si le conditionnement nécessaire pour en préserver l'état stérile est ouvert, endommagé ou altéré de toute autre manière par le reconditionnement."
    3_prefix: "16.3"
    3_desc: "Un distributeur ou un importateur qui réalise l'une des activités mentionnées au paragraphe 2, points a) et b), indique sur le dispositif ou, si c'est impossible, sur son conditionnement ou dans un document accompagnant le dispositif, l'activité effectuée, ainsi que son nom, sa raison sociale ou sa marque déposée, son siège social et l'adresse à laquelle il peut être joint afin de pouvoir établir son emplacement. \n\n Les distributeurs et les importateurs veillent à disposer d'un système de gestion de la qualité prévoyant des procédures qui garantissent que la traduction des informations est fidèle et à jour, que les activités mentionnées au paragraphe 2, points a) et b), sont réalisées par des moyens et dans des conditions qui préservent l'état d'origine du dispositif et que le conditionnement du dispositif reconditionné n'est ni défectueux, ni de piètre qualité, ni en mauvais état. Le système de gestion de la qualité comporte, entre autres, des procédures garantissant que le distributeur ou l'importateur est informé de toute mesure corrective prise par le fabricant en rapport avec le dispositif en question afin de résoudre des problèmes de sécurité ou de mettre le dispositif en conformité avec le présent règlement."
    4_prefix: "16.4"
    4_desc: "Au moins vingt-huit jours avant la mise à disposition sur le marché du dispositif réétiqueté ou reconditionné, les distributeurs ou importateurs effectuant toute activité visée au paragraphe 2, points a) et b), informent le fabricant et l'autorité compétente de l'État membre dans lequel ils entendent mettre le dispositif à disposition de l'intention de mettre le dispositif réétiqueté ou reconditionné à disposition et fournissent, sur demande, au fabricant et à l'autorité compétente, un exemplaire ou une maquette du dispositif réétiqueté ou reconditionné, accompagné de toute étiquette et toute notice d'utilisation traduites. Dans ce même délai de vingt-huit jours, le distributeur ou l'importateur transmet à l'autorité compétente un certificat, délivré par un organisme notifié désigné pour le type de dispositifs faisant l'objet des activités mentionnées au paragraphe 2, points a) et b), attestant que le système de gestion de la qualité du distributeur ou de l'importateur est conforme aux exigences du paragraphe 3."
  13:
    prefix: "Article 17"
    title: "Dispositifs à usage unique et leur retraitement"
    1_prefix: "17.1"
    1_label: "Le retraitement et la réutilisation de dispositifs à usage unique ne peuvent avoir lieu que s'ils sont autorisés par la législation nationale et uniquement conformément au présent article."
    2_prefix: "17.2"
    2_desc: "Toute personne physique ou morale qui retraite un dispositif à usage unique pour le rendre apte à être réutilisé dans l'Union est réputée être le fabricant du dispositif retraité et s'acquitte des obligations incombant aux fabricants énoncées dans le présent règlement, notamment pour ce qui concerne la traçabilité du dispositif retraité, conformément au chapitre III du présent règlement. La personne qui procède au retraitement du dispositif est considérée comme un producteur aux fins de l'article 3, paragraphe 1, de la directive 85/374/CEE."
    3_prefix: "17.3"
    3_label: "Par dérogation au paragraphe 2, en ce qui concerne les dispositifs à usage unique qui sont retraités et utilisés dans un établissement de santé, les États membres peuvent décider de ne pas appliquer l'ensemble des règles relatives aux obligations des fabricants énoncées dans le présent règlement à condition de veiller à ce que:"
    3_desc: "\ta. la sécurité et les performances du dispositif retraité soient équivalentes à celles du dispositif d'origine et les exigences figurant à l'article 5, paragraphe 5, points a), b), d), e), f), g) et h), soient respectées; \n\tb. le retraitement soit effectué conformément aux spécifications communes qui détaillent les exigences concernant: \n\t\t- la gestion des risques, y compris l'analyse de la construction et des matériaux, des propriétés connexes du dispositif (rétro-ingénierie) et des procédures visant à repérer les modifications de la conception du dispositif d'origine, ainsi que son usage prévu après le retraitement, \n\t\t- la validation des procédures pour la totalité du processus, y compris les phases de nettoyage, \n\t\t- la libération du produit et les tests de performances, \n\t\t- le système de gestion de la qualité, \n\t\t- la déclaration d'incidents portant sur des dispositifs qui ont fait l'objet d'un retraitement, et \n\t\t- la traçabilité des dispositifs retraités. \n\n Les États membres encouragent, et peuvent obliger, les établissements de santé à fournir aux patients des informations sur l'utilisation de dispositifs retraités en leur sein et, le cas échéant, toute autre information pertinente sur le dispositif retraité au moyen duquel les patients sont traités. \n\n Les États membres notifient à la Commission et aux autres États membres les dispositions nationales introduites en vertu du présent paragraphe et les raisons de leur introduction. La Commission rend ces informations publiques."
    4_prefix: "17.4"
    4_label: "Les États membres peuvent choisir d'appliquer les dispositions visées au paragraphe 3 également en ce qui concerne les dispositifs à usage unique qui sont retraités par une entreprise de retraitement externe à la demande d'un établissement de santé, pour autant que le dispositif retraité soit restitué dans sa totalité à cet établissement de santé et que l'entreprise de retraitement externe se conforme aux exigences visées au paragraphe 3, points a) et b)."
    5_prefix: "17.5"
    5_desc: "La Commission adopte, conformément à l'article 9, paragraphe 1, les spécifications communes nécessaires visées au paragraphe 3, point b), au plus tard le 26 mai 2020. Ces spécifications communes sont conformes aux données scientifiques les plus récentes et portent sur l'application des exigences générales en matière de sécurité et de performances énoncées dans le présent règlement. Si les spécifications communes ne sont pas adoptées au plus tard le 26 mai 2020, le retraitement s'effectue conformément à toutes normes harmonisées et dispositions nationales pertinentes qui couvrent les aspects mentionnés au paragraphe 3, point b). La conformité avec les spécifications communes ou, en l'absence de spécifications communes, avec toutes normes harmonisées et dispositions nationales pertinentes, est certifiée par un organisme notifié."
    6_prefix: "17.6"
    6_label: "Seuls les dispositifs à usage unique qui ont été mis sur le marché conformément au présent règlement ou avant le 26 mai 2020 conformément à la directive 93/42/CEE peuvent être retraités."
    7_prefix: "17.7"
    7_label: "Seul le retraitement de dispositifs à usage unique réputé sûr, eu égard aux données scientifiques les plus récentes, peut être réalisé."
    8_prefix: "17.8"
    8_desc: "Le nom et l'adresse de la personne morale ou physique visée au paragraphe 2 et les autres informations pertinentes visées à l'annexe I, section 23, sont indiqués sur l'étiquette et, le cas échéant, dans la notice d'utilisation du dispositif retraité. \n\n Le nom et l'adresse du fabricant du dispositif à usage unique d'origine ne figurent plus sur l'étiquette mais sont mentionnés dans la notice d'utilisation du dispositif retraité."
    9_prefix: "17.9"
    9_label: "Un État membre qui autorise le retraitement de dispositifs à usage unique peut maintenir ou introduire des dispositions nationales plus strictes que celles prévues par le présent règlement et qui restreignent ou interdisent sur son territoire:"
    9_desc: "\ta. le retraitement de dispositifs à usage unique et le transfert de dispositifs à usage unique vers un autre État membre ou vers un pays tiers en vue de leur retraitement; \n\tb. la mise à disposition ou la réutilisation de dispositifs à usage unique retraités. \n\n Les États membres notifient ces dispositions nationales à la Commission et aux autres États membres. La Commission met ces informations à la disposition du public."
    10_prefix: "17.10"
    10_label: "La Commission établit au plus tard le 27 mai 2024 un rapport sur l'exécution du présent article, qu'elle soumet au Parlement européen et au Conseil. Sur la base de ce rapport, la Commission fait, le cas échéant, des propositions de modifications du présent règlement."
  14:
    prefix: "Article 18"
    title: "Carte d'implant et informations à fournir au patient avec un dispositif implantable"
    1_prefix: "18.1"
    1_label: "Le fabricant d'un dispositif implantable joint au dispositif les éléments suivants:"
    1_desc: "\ta. les informations permettant l'identification du dispositif, dont le nom, le numéro de série, le numéro de lot, l'IUD, le modèle du dispositif, ainsi que le nom, l'adresse et le site internet du fabricant; \n\tb. les mises en garde, précautions ou mesures à prendre par le patient ou par un professionnel de la santé à l'égard des interférences réciproques avec des sources ou conditions d'environnement extérieures ou des examens médicaux raisonnablement prévisibles; \n\tc. toute information sur la durée de vie prévue du dispositif et le suivi éventuellement nécessaire; \n\td. toute autre information destinée à garantir l'utilisation sûre du dispositif par le patient, notamment les informations figurant à l'annexe I, section 23.4, point u). \n\n Les informations visées au premier alinéa sont fournies, aux fins de les mettre à la disposition du patient auquel on a implanté le dispositif, par tout moyen permettant un accès rapide à ces informations et elles sont rédigées dans la ou les langues définies par l'État membre concerné. Les informations sont écrites de manière à être aisément comprises par un profane et sont mises à jour, le cas échéant. Les mises à jour des informations sont mises à la disposition du patient via le site internet mentionné au premier alinéa, point a). \n\n En outre, le fabricant fournit les informations visées au du premier alinéa, point a), sur une carte d'implant remise avec le dispositif."
    2_prefix: "18.2"
    2_label: "Les États membres exigent des établissements de santé qu'ils mettent à la disposition des patients chez lesquels le dispositif a été implanté les informations visées au paragraphe 1, par tout moyen permettant un accès rapide auxdites informations, ainsi que la carte d'implant, sur laquelle est mentionnée leur identité."
    3_prefix: "18.3"
    3_label: "Les implants suivants sont exemptés des obligations énoncées au présent article: sutures, agrafes, produits d'obturation dentaire, appareils orthodontiques, couronnes dentaires, vis, cales, plaques, guides, broches, clips et dispositifs de connexion. La Commission est habilitée à adopter des actes délégués conformément à l'article 115 pour modifier la liste en y ajoutant d'autres types d'implants ou en en retirant."
  15:
    prefix: "Article 19"
    title: "Déclaration de conformité UE"
    1_prefix: "19.1"
    1_label: "La déclaration de conformité UE atteste que les exigences du présent règlement ont été respectées pour ce qui est du dispositif concerné. Le fabricant tient à jour la déclaration de conformité UE. La déclaration de conformité UE contient, au minimum, les informations qui figurent à l'annexe IV et est traduite dans une ou des langues officielles de l'Union requises par le ou les États membres dans lesquels le dispositif est mis à disposition."
    2_prefix: "19.2"
    2_desc: "Lorsque, en ce qui concerne des aspects ne relevant pas du présent règlement, des dispositifs font l'objet d'autres actes législatifs de l'Union qui imposent aussi une déclaration de conformité UE du fabricant attestant que le respect des exigences de ces actes législatifs a été démontré, une seule déclaration de conformité UE est établie pour tous les actes de l'Union applicables au dispositif. La déclaration contient toutes les informations nécessaires à l'identification des actes législatifs de l'Union auxquels la déclaration se rapporte."
    3_prefix: "19.3"
    3_label: "Lors de l'établissement de la déclaration de conformité UE, le fabricant assume la responsabilité du respect des exigences du présent règlement et de tous les autres actes législatifs de l'Union applicables au dispositif."
    4_prefix: "19.4"
    4_label: "La Commission est habilitée à adopter des actes délégués conformément à l'article 115 pour modifier le contenu minimal de la déclaration de conformité UE prévu à l'annexe IV eu égard aux progrès techniques."
  16:
    prefix: "Article 20"
    title: "Marquage de conformité CE"
    1_prefix: "20.1"
    1_label: "Les dispositifs, autres que les dispositifs sur mesure ou les dispositifs faisant l'objet d'une investigation, réputés conformes aux exigences du présent règlement, portent le marquage de conformité CE présenté à l'annexe V."
    2_prefix: "20.2"
    2_label: "Le marquage CE est soumis aux principes généraux énoncés à l'article 30 du règlement (CE) no 765/2008."
    3_prefix: "20.3"
    3_label: "Le marquage CE est apposé de façon visible, lisible et indélébile sur le dispositif ou sur le conditionnement qui en garantit la stérilité. Si la nature du dispositif ne permet pas cette apposition ou ne le justifie pas, le marquage CE est apposé sur le conditionnement. Le marquage CE figure aussi dans toute notice d'utilisation et sur tout conditionnement commercial."
    4_prefix: "20.4"
    4_label: "Le marquage CE est apposé avant la mise sur le marché du dispositif. Il peut être suivi d'un pictogramme ou de tout autre marquage indiquant un risque ou un usage particulier."
    5_prefix: "20.5"
    5_label: "Le cas échéant, le marquage CE est suivi du numéro d'identification de l'organisme notifié responsable des procédures d'évaluation de la conformité prévues à l'article 52. Le numéro d'identification est également indiqué dans tous les documents publicitaires mentionnant qu'un dispositif est conforme aux exigences applicables au marquage CE."
    6_prefix: "20.6"
    6_label: "Lorsque des dispositifs relèvent d'autres actes législatifs de l'Union qui prévoient aussi l'apposition du marquage CE, le marquage CE indique que les dispositifs satisfont également aux exigences de ces autres actes législatifs."
  17:
    prefix: "Article 21"
    title: "Dispositifs destinés à des usages particuliers"
    1_prefix: "21.1"
    1_label: "Les États membres ne font pas obstacle à ce que:"
    1_desc: "\ta. les dispositifs faisant l'objet d'une investigation soient fournis à un investigateur aux fins de l'investigation clinique, s'ils remplissent les conditions énoncées aux articles 62 à 80 et à l'article 82, dans les actes d'exécution adoptés en vertu de l'article 81 et à l'annexe XV; \n\tb. les dispositifs sur mesure soient mis à disposition sur le marché, si l'article 52, paragraphe 8, et l'annexe XIII ont été respectés. \n\n Les dispositifs visés au premier alinéa ne portent pas le marquage CE, à l'exception des dispositifs visés à l'article 74."
    2_prefix: "21.2"
    2_desc: "Les dispositifs sur mesure sont accompagnés de la déclaration visée à l'annexe XIII, section 1, qui est mise à la disposition du patient ou de l'utilisateur identifié par son nom, par un acronyme ou par un code numérique. \n\n Les États membres peuvent imposer que le fabricant d'un dispositif sur mesure transmette à l'autorité compétente une liste des dispositifs de ce type qui ont été mis à disposition sur leur territoire."
    3_prefix: "21.3"
    3_label: "Les États membres ne font pas obstacle à la présentation de dispositifs qui ne sont pas conformes au présent règlement lors de foires commerciales, d'expositions, de démonstrations ou d'événements similaires, à la condition qu'une marque visible indique clairement que ces dispositifs sont destinés exclusivement à la présentation ou à la démonstration et ne peuvent être mis à disposition avant d'avoir été mis en conformité avec le présent règlement."
  18:
    prefix: "Article 22"
    title: "Systèmes et nécessaires"
    1_prefix: "22.1"
    1_label: "Toute personne physique ou morale établit une déclaration si elle associe des dispositifs portant un marquage CE avec les autres dispositifs ou produits suivants, d'une manière qui soit compatible avec la destination des dispositifs ou autres produits et dans les limites d'utilisation précisées par leurs fabricants, en vue de les mettre sur le marché sous la forme d'un système ou d'un nécessaire:"
    1_desc: "\ta. d'autres dispositifs portant le marquage CE; \n\tb. des dispositifs médicaux de diagnostic in vitro portant le marquage CE conformément au règlement (UE) 2017/746; \n\tc. d'autres produits conformes à la législation applicable à ces produits, uniquement s'ils sont utilisés dans le cadre d'une intervention ou si leur présence dans le système ou le nécessaire se justifie d'une autre manière."
    2_prefix: "22.2"
    2_label: "Dans la déclaration faite conformément au paragraphe 1, la personne physique ou morale concernée déclare:"
    2_desc: "\ta. avoir vérifié la compatibilité réciproque des dispositifs et, le cas échéant, des autres produits, conformément aux instructions des fabricants, et avoir réalisé ses activités en suivant ces instructions; \n\tb. avoir conditionné le système ou le nécessaire et fourni les informations utiles aux utilisateurs, comprenant les informations à fournir par les fabricants des dispositifs ou des autres produits qui ont été assemblés; \n\tc. avoir soumis l'association des dispositifs et, le cas échéant, des autres produits sous la forme d'un système ou d'un nécessaire à des méthodes de contrôle, de vérification et de validation internes appropriées."
    3_prefix: "22.3"
    3_desc: "Toute personne physique ou morale qui stérilise des systèmes ou nécessaires visés au paragraphe 1 en vue de les mettre sur le marché applique l'une des procédures prévues à l'annexe IX ou à l'annexe XI, partie A, au choix. L'application de ces procédures et l'intervention de l'organisme notifié sont limitées aux aspects de la procédure visant à garantir la stérilité jusqu'à ouverture ou endommagement du conditionnement qui garantit la stérilité. La personne physique ou morale établit une déclaration attestant que la stérilisation a été effectuée conformément aux instructions du fabricant."
    4_prefix: "22.4"
    4_desc: "Lorsque le système ou le nécessaire incorpore des dispositifs qui ne portent pas le marquage CE ou lorsque l'association de dispositifs choisie n'est pas compatible compte tenu de la destination d'origine de ces dispositifs ou lorsque la stérilisation n'a pas été effectuée conformément aux instructions du fabricant, le système ou le nécessaire est considéré comme un dispositif à part entière et fait l'objet de la procédure d'évaluation de la conformité applicable prévue à l'article 52. La personne physique ou morale assume les obligations qui incombent aux fabricants."
    5_prefix: "22.5"
    5_desc: "Les systèmes ou nécessaires visés au paragraphe 1 du présent article ne portent pas de marquage CE supplémentaire mais portent le nom, la raison sociale ou la marque déposée de la personne visée aux paragraphes 1 et 3 du présent article, ainsi que l'adresse à laquelle cette personne peut être jointe afin de pouvoir établir son emplacement. Les systèmes ou nécessaires sont accompagnés des informations visées à l'annexe I, section 23. La déclaration visée au paragraphe 2 du présent article est tenue à la disposition des autorités compétentes, après assemblage du système ou nécessaire, pour la durée applicable, en vertu de l'article 10, paragraphe 8, aux dispositifs qui ont été associés. En cas de durées divergentes, la durée la plus longue s'applique."
  19:
    prefix: "Article 23"
    title: "Parties et composants"
    1_prefix: "23.1"
    1_desc: "Toute personne physique ou morale qui met à disposition sur le marché un article spécifiquement destiné à remplacer une partie intégrante ou un composant identique ou similaire d'un dispositif défaillant ou usé afin de maintenir ou de rétablir la fonction du dispositif sans en altérer les performances, les caractéristiques de sécurité ou la destination, veille à ce que l'article ne compromette pas la sécurité et les performances du dispositif. Des pièces justificatives sont tenues à la disposition des autorités compétentes des États membres."
    2_prefix: "23.2"
    2_label: "Un article destiné à remplacer une partie ou un composant d'un dispositif et qui en change considérablement les performances, les caractéristiques de sécurité ou la destination est considéré comme un dispositif et respecte les exigences énoncées par le présent règlement."
  20_prefix: "Article 24"
  20_label: "Libre circulation"
  20_desc: "Sauf indication contraire dans le présent règlement, les États membres ne refusent pas, n'interdisent pas et ne restreignent pas la mise à disposition sur le marché ou la mise en service sur leur territoire de dispositifs conformes aux exigences du présent règlement."
3:
  prefix: "Chapitre III"
  title: "Identification et traçabilité des dispositifs, enregistrement des dispositifs et des opérateurs économiques, résumé des caractéristiques de sécurité et des performances cliniques et base de données européenne sur les dispositifs médicaux"
  1:
    prefix: "Article 25"
    title: "Identification dans la chaîne d'approvisionnement"
    1_prefix: "25.1"
    1_label: "Les distributeurs et les importateurs coopèrent avec les fabricants ou leur mandataire pour atteindre un niveau approprié de traçabilité des dispositifs."
    2_prefix: "25.2"
    2_label: "Les opérateurs économiques sont en mesure d'identifier, pour l'autorité compétente et pour la durée visée à l'article 10, paragraphe 8:"
    3_prefix: "25.3"
    3_desc: "\ta. tout opérateur économique auquel ils ont directement fourni un dispositif; \n\tb. tout opérateur économique qui leur a directement fourni un dispositif; \n\tc. tout établissement de santé ou professionnel de la santé auquel ils ont directement fourni un dispositif."
  2_prefix: "Article 26"
  2_label: "Nomenclature des dispositifs médicaux"
  2_desc: "Afin de faciliter le fonctionnement de la base de données européenne sur les dispositifs médicaux (Eudamed) visée à l'article 33, la Commission fait en sorte que les fabricants et les autres personnes physiques ou morales tenues par le présent règlement d'utiliser cette nomenclature aient accès gratuitement à une nomenclature des dispositifs médicaux internationalement reconnue. La Commission s'efforce également de faire en sorte que cette nomenclature soit accessible gratuitement à d'autres parties prenantes, dans la mesure où cela est raisonnablement possible."
  3:
    prefix: "Article 27"
    title: "Système d'identification unique des dispositifs"
    1_prefix: "27.1"
    1_label: "Le système d'identification unique des dispositifs (ci-après dénommé «système IUD») décrit à l'annexe VI, partie C, permet l'identification et facilite la traçabilité des dispositifs autres que les dispositifs sur mesure et les dispositifs faisant l'objet d'une investigation et prévoit ce qui suit:"
    1_desc: "\ta. la production d'un IUD comprenant: \n\t\ti. un identifiant «dispositif» IUD (IUD-ID), propre à un fabricant et à un dispositif, qui donne accès aux informations prévues à l'annexe VI, partie B; \n\t\tii. un identifiant «production» IUD (IUD-IP), qui identifie l'unité de production du dispositif et, le cas échéant, les dispositifs conditionnés, comme indiqué à l'annexe VI, partie C; \n\tb. l'apposition de l'IUD sur l'étiquette du dispositif ou sur son conditionnement; \n\tc. l'enregistrement de l'IUD par les opérateurs économiques, les établissements de santé et les professionnels de la santé, conformément aux conditions fixées respectivement aux paragraphes 8 et 9 du présent article; \n\td. l'établissement d'un système électronique d'identification unique des dispositifs (ci-après dénommé «base de données IUD») conformément à l'article 28."
    2_prefix: "27.2"
    2_label: "La Commission désigne, au moyen d'actes d'exécution, une ou plusieurs entités chargées de mettre en œuvre un système d'attribution d'IUD en application du présent règlement (ci-après dénommé «entité d'attribution»). Ces entités satisfont à tous les critères suivants:"
    2_desc: "\ta. l'entité est une organisation dotée de la personnalité juridique; \n\tb. son système d'attribution d'IUD permet l'identification d'un dispositif tout au long de sa distribution et son utilisation conformément aux exigences du présent règlement; \n\tc. son système d'attribution d'IUD est conforme aux normes internationales applicables; \n\td. l'entité donne accès à son système d'attribution d'IUD à tous les utilisateurs intéressés selon des modalités et des conditions prédéterminées et transparentes; \n\te. l'entité fait en sorte: \n\t\ti. de mettre en œuvre son système d'attribution d'IUD pendant au moins dix ans après avoir été désignée; \n\t\tii. de mettre à la disposition de la Commission et des États membres, sur demande, des informations sur son système d'attribution d'IUD; \n\t\tiii. de respecter les critères et les modalités de désignation pour la durée de sa désignation. \n Lorsqu'elle désigne les entités d'attribution, la Commission s'efforce de veiller à ce que les supports d'IUD définis à l'annexe VI, partie C, soient lisibles en toute circonstance quel que soit le système utilisé par l'entité d'attribution, en vue de réduire le plus possible la charge financière et administrative pour les opérateurs économiques et les établissements de santé."
    3_prefix: "27.3"
    3_desc: "Avant de mettre sur le marché un dispositif autre qu'un dispositif sur mesure, le fabricant attribue au dispositif et, le cas échéant, à tous les niveaux de conditionnement supérieurs, un IUD créé en conformité avec les règles édictées par l'entité d'attribution désignée par la Commission en vertu du paragraphe 2. \n\n Avant qu'un dispositif, autre qu'un dispositif sur mesure ou faisant l'objet d'une investigation, ne soit mis sur le marché, le fabricant veille à ce que les informations visées à l'annexe VI, partie B, concernant le dispositif en question soient correctement soumises et transférées à la base de données IUD visée à l'article 28."
    4_prefix: "27.4"
    4_label: "Les supports d'IUD sont apposés sur l'étiquette du dispositif et sur tous les niveaux de conditionnement supérieurs. Les niveaux de conditionnement supérieurs n'incluent pas les conteneurs de transport."
    5_prefix: "27.5"
    5_label: "Les IUD sont utilisés aux fins de la notification d'incidents graves et de mesures correctives de sécurité en application de l'article 87."
    6_prefix: "27.6"
    6_label: "L'IUD-ID de base, tel qu'il est défini à l'annexe VI, partie C, du dispositif figure sur la déclaration de conformité UE visée à l'article 19."
    7_prefix: "27.7"
    7_label: "Le fabricant maintient à jour une liste de tous les IUD qu'il a attribués, qui fait partie de la documentation technique visée à l'annexe II."
    8_prefix: "27.8"
    8_label: "Les opérateurs économiques enregistrent et conservent, de préférence par des moyens électroniques, l'IUD des dispositifs qu'ils ont fournis ou qu'on leur a fournis, si ces dispositifs font partie:"
    8_desc: "\t — des dispositifs implantables de classe III, \n\t — des dispositifs et catégories ou groupes de dispositifs déterminés par un acte adopté conformément au paragraphe 11, point a)."
    9_prefix: "27.9"
    9_desc: "Les établissements de santé enregistrent et conservent, de préférence par des moyens électroniques, l'IUD des dispositifs qu'ils ont fournis ou qu'on leur a fournis, si ces dispositifs font partie des dispositifs implantables de classe III. \n\n Pour les dispositifs autres que les dispositifs implantables de classe III, les États membres encouragent les établissements de santé à enregistrer et conserver, de préférence par des moyens électroniques, l'IUD des dispositifs qu'on leur a fournis, et peuvent exiger qu'ils le fassent. \n\n Les États membres encouragent les professionnels de la santé à enregistrer et conserver, de préférence par des moyens électroniques, l'IUD des dispositifs qu'on leur a fournis, et peuvent exiger qu'ils le fassent."
    10_prefix: "27.10"
    10_label: "La Commission est habilitée à adopter des actes délégués conformément à l'article 115:"
    10_desc: "\ta. pour modifier la liste des informations établie à l'annexe VI, partie B, eu égard aux progrès techniques; et \n\tb. pour modifier l'annexe VI eu égard aux avancées et aux progrès techniques intervenus sur le plan international dans le domaine de l'identification unique des dispositifs."
    11_prefix: "27.11"
    11_label: "La Commission peut, au moyen d'actes d'exécution, préciser les modalités et les aspects procéduraux du système IUD en vue d'assurer son application harmonisée pour ce qui concerne les points suivants:"
    11_desc: "\ta. la détermination des dispositifs et catégories ou groupes de dispositifs auxquels l'obligation visée au paragraphe 8 s'applique; \n\tb. l'indication des données devant figurer dans l'IUD-IP de dispositifs ou groupes de dispositifs particuliers. \n\n Les actes d'exécution visés au premier alinéa sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3."
    12_prefix: "27.12"
    12_label: "Lorsqu'elle adopte les actes visés au paragraphe 11, la Commission tient compte de tous les points suivants:"
    12_desc: "\ta. la confidentialité et la protection des données visées respectivement aux articles 109 et 110; \n\tb. l'approche fondée sur les risques; \n\tc. le rapport coût-efficacité des actes; \n\td. la convergence des systèmes d'IUD mis au point au niveau international; \n\te. la nécessité d'éviter les doubles emplois dans le système IUD; \n\tf. les besoins des systèmes de soins de santé des États membres et, dans la mesure du possible, la compatibilité avec d'autres systèmes d'identification des dispositifs médicaux utilisés par les parties prenantes."
  4:
    prefix: "Article 28"
    title: "Base de données IUD"
    1_prefix: "28.1"
    1_label: "La Commission, après avoir consulté le GCDM, établit et gère une base de données IUD afin de valider, de rassembler, de traiter et de mettre à la disposition du public les informations figurant à l'annexe VI, partie B."
    2_prefix: "28.2"
    2_label: "Lors de la conception de la base de données IUD, la Commission tient compte des principes généraux énoncés à l'annexe VI, partie C, section 5. La base de données IUD est conçue notamment de telle sorte qu'aucun IUD-IP ni aucune information confidentielle de nature commerciale concernant les produits n'y figure."
    3_prefix: "28.3"
    3_label: "Les principaux éléments de données à intégrer dans la base de données IUD, visés à l'annexe VI, partie B, sont mis gratuitement à la disposition du public."
    4_prefix: "28.4"
    4_label: "La conception technique de la base de données IUD garantit une accessibilité maximale des informations qui y sont stockées, notamment l'accès de multiples utilisateurs et des téléchargements automatiques de ces informations. La Commission fournit un soutien technique et administratif aux fabricants et aux autres utilisateurs de la base de données IUD."
  5:
    prefix: "Article 29"
    title: "Enregistrement des dispositifs"
    1_prefix: "29.1"
    1_label: "La Commission, après avoir consulté le GCDM, établit et gère une base de données IUD afin de valider, de rassembler, de traiter et de mettre à la disposition du public les informations figurant à l'annexe VI, partie B."
    2_prefix: "29.2"
    2_label: "Avant la mise sur le marché, conformément à l'article 22, paragraphes 1 et 3, d'un système ou d'un nécessaire qui n'est pas un dispositif sur mesure, la personne physique ou morale responsable attribue au système ou au nécessaire, conformément aux règles de l'entité d'attribution, un IUD-ID de base et le transmet à la base de données IUD avec les autres principaux éléments de données visés à l'annexe VI, partie B, en rapport avec le système ou le nécessaire en question."
    3_prefix: "29.3"
    3_desc: "Dans le cas des dispositifs qui font l'objet d'une évaluation de conformité visée à l'article 52, paragraphe 3, et à l'article 52, paragraphe 4, deuxième et troisième alinéas, l'attribution d'un IUD-ID de base visé au paragraphe 1 du présent article s'effectue avant que le fabricant n'introduise une demande auprès d'un organisme notifié en vue de cette évaluation. \n\n Pour les dispositifs visés au premier alinéa, l'organisme notifié fait référence à l'IUD-ID de base sur le certificat délivré conformément à l'annexe XII, chapitre I, section 4, point a), et confirme dans Eudamed que les informations visées à l'annexe VI, partie A, section 2.2, sont correctes. Après la délivrance du certificat pertinent et avant la mise sur le marché du dispositif, le fabricant transmet l'IUD-ID de base à la base de données IUD ainsi que les autres principaux éléments de données visés à l'annexe VI, partie B, en rapport avec le dispositif en question."
    4_prefix: "29.4"
    4_label: "Avant la mise sur le marché d'un dispositif autre qu'un dispositif sur mesure, le fabricant enregistre ou, s'il les a déjà fournies, vérifie dans Eudamed les informations visées à l'annexe VI, partie A, section 2, à l'exception de celles visées en sa section 2.2, et tient, par la suite, ces informations à jour."
  6:
    prefix: "Article 30"
    title: "Système électronique d'enregistrement des opérateurs économiques"
    1_prefix: "30.1"
    1_label: "La Commission, après avoir consulté le GCDM, établit et gère un système électronique afin de créer le numéro d'enregistrement unique visé à l'article 31, paragraphe 2, et de rassembler et traiter les informations utiles et nécessaires à l'identification du fabricant et, le cas échéant, du mandataire et de l'importateur. Les informations précises devant être transmises à ce système électronique par les opérateurs économiques sont énoncées à l'annexe VI, partie A, section 1."
    2_prefix: "30.2"
    2_label: "Les États membres peuvent maintenir ou introduire des dispositions nationales concernant l'enregistrement des distributeurs des dispositifs qui ont été mis à disposition sur leur territoire."
    3_prefix: "30.3"
    3_desc: "Dans un délai de deux semaines suivant la mise sur le marché d'un dispositif autre qu'un dispositif sur mesure, les importateurs vérifient que le fabricant ou le mandataire a fourni au système électronique les informations visées au paragraphe 1. \n\n Le cas échéant, les importateurs informent le fabricant ou le mandataire en question si les informations visées au paragraphe 1 sont manquantes ou incorrectes. Les importateurs ajoutent leurs coordonnées à la ou aux rubriques correspondantes."
  7:
    prefix: "Article 31"
    title: "Enregistrement des fabricants, mandataires et importateurs"
    1_prefix: "31.1"
    1_desc: "Avant la mise sur le marché d'un dispositif autre qu'un dispositif sur mesure, les fabricants, les mandataires et les importateurs, transmettent au système électronique visé à l'article 30, aux fins de leur enregistrement, les informations figurant à l'annexe VI, partie A, section 1, pour autant qu'ils ne se soient pas déjà enregistrés conformément au présent article. Lorsque la procédure d'évaluation de la conformité prévoit l'intervention d'un organisme notifié conformément à l'article 52, les informations visées à l'annexe VI, partie A, section 1, sont transmises à ce système électronique avant qu'une demande ne soit introduite auprès de l'organisme notifié."
    2_prefix: "31.2"
    2_label: "Après avoir vérifié les données saisies conformément au paragraphe 1 du présent article, l'autorité compétente obtient un numéro d'enregistrement unique à partir du système électronique visé à l'article 30, qu'elle délivre au fabricant, à son mandataire ou à l'importateur."
    3_prefix: "31.3"
    3_label: "Le fabricant utilise le numéro d'enregistrement unique lorsqu'il introduit une demande auprès d'un organisme notifié pour l'évaluation de conformité et pour accéder à Eudamed afin de s'acquitter de ses obligations au titre de l'article 29."
    4_prefix: "31.4"
    4_label: "Dans un délai d'une semaine suivant tout changement en rapport avec les informations visées au paragraphe 1 du présent article, l'opérateur économique met à jour les données dans le système électronique visé à l'article 30."
    5_prefix: "31.5"
    5_label: "Au plus tard un an après la transmission des informations en application du paragraphe 1, puis tous les deux ans, l'opérateur économique confirme l'exactitude des données. En cas de défaut de confirmation dans un délai de six mois suivant l'expiration de ces délais, tout État membre peut prendre des mesures correctives appropriées sur son territoire jusqu'à ce que l'opérateur économique satisfasse à cette obligation."
    6_prefix: "31.6"
    6_label: "Sans préjudice de la responsabilité de l'opérateur économique à l'égard des données, l'autorité compétente vérifie les données confirmées visées à l'annexe VI, partie A, section 1."
    7_prefix: "31.7"
    7_label: "Les données saisies dans le système électronique visé à l'article 30 conformément au paragraphe 1 du présent article sont accessibles au public."
    8_prefix: "31.8"
    8_label: "L'autorité compétence peut utiliser les données pour imposer une redevance au fabricant, au mandataire ou à l'importateur conformément à l'article 111."
  8:
    prefix: "Article 32"
    title: "Résumé des caractéristiques de sécurité et des performances cliniques"
    1_prefix: "32.1"
    1_desc: "Dans le cas des dispositifs implantables et des dispositifs de classe III, autres que des dispositifs sur mesure ou les dispositifs faisant l'objet d'une investigation, le fabricant produit un résumé des caractéristiques de sécurité et des performances cliniques. \n\n Le résumé des caractéristiques de sécurité et des performances cliniques est écrit de manière à être clair pour l'utilisateur auquel le dispositif est destiné et, le cas échéant, pour le patient, et il est mis à la disposition du public via Eudamed. \n\n Le projet de ce résumé fait partie de la documentation à fournir à l'organisme notifié intervenant dans l'évaluation de la conformité prévue à l'article 52 et est validé par cet organisme. Après sa validation, l'organisme notifié télécharge le résumé dans Eudamed. Le fabricant mentionne sur l'étiquette ou sur la notice d'utilisation où le résumé est disponible."
    2_prefix: "32.2"
    2_label: "Le résumé des caractéristiques de sécurité et des performances cliniques contient au moins les éléments suivants:"
    2_desc: "\ta. l'identifiant du dispositif et du fabricant, y compris l'IUD-ID de base et le numéro d'enregistrement unique; \n\tb. la destination du dispositif ainsi que d'éventuelles indications ou contre-indications et les populations cibles; \n\tc. une description du dispositif, y compris une référence à la ou aux générations précédentes et aux variantes, s'il en existe, et une description des différences, ainsi que, le cas échéant, une description des accessoires, et des autres dispositifs et produits destinés à être utilisés en combinaison avec le dispositif; \n\td. les autres solutions diagnostiques ou thérapeutiques possibles; \n\te. une référence aux normes harmonisées et aux spécifications communes appliquées; \n\tf. le résumé de l'évaluation clinique visé à l'annexe XIV et les informations pertinentes sur le suivi clinique après commercialisation; \n\tg. le profil et la formation suggérés pour les utilisateurs; \n\th. des informations sur les risques résiduels et sur tout effet indésirable, les mises en garde et les précautions."
    3_prefix: "32.3"
    3_label: "La Commission peut, au moyen d'actes d'exécution, prescrire la forme et la présentation des données devant figurer dans le résumé des caractéristiques de sécurité et des performances cliniques. Ces actes d'exécution sont adoptés en conformité avec la procédure consultative visée à l'article 114, paragraphe 2."
  9:
    prefix: "Article 33"
    title: "Base de données européenne sur les dispositifs médicaux"
    1_prefix: "33.1"
    1_label: "La Commission, après avoir consulté le GCDM, établit, met à jour et gère la base de données européenne sur les dispositifs médicaux (Eudamed), dont les objectifs sont les suivants:"
    1_desc: "\ta. permettre au public d'être correctement informé des dispositifs mis sur le marché, des certificats correspondants délivrés par les organismes notifiés et des opérateurs économiques concernés; \n\tb. permettre l'identification unique des dispositifs dans le marché intérieur et faciliter leur traçabilité; \n\tc. permettre au public d'être correctement informé des investigations cliniques et aux promoteurs d'investigations cliniques de se conformer aux obligations énoncées aux articles 62 à 80, à l'article 82, et dans tout acte adopté conformément à l'article 81; \n\td. permettre aux fabricants de se conformer aux obligations en matière d'information énoncées aux articles 87 à 90 et dans tout acte adopté conformément à l'article 91; \n\te. permettre aux autorités compétentes des États membres et à la Commission de s'acquitter des tâches que leur impose le présent règlement en connaissance de cause et renforcer la coopération entre elles."
    2_prefix: "33.2"
    2_label: "Les systèmes électroniques suivants font partie d'Eudamed:"
    2_desc: "\ta. le système électronique d'enregistrement des dispositifs visé à l'article 29, paragraphe 4; \n\tb. la base de données IUD visée à l'article 28; \n\tc. le système électronique d'enregistrement des opérateurs économiques visé à l'article 30; \n\td. le système électronique relatif aux organismes notifiés et aux certificats visé à l'article 57; \n\te. le système électronique relatif aux investigations cliniques visé à l'article 73; \n\tf. le système électronique relatif à la vigilance et à la surveillance après commercialisation visé à l'article 92; \n\tg. le système électronique relatif à la surveillance du marché visé à l'article 100."
    3_prefix: "33.3"
    3_label: "Pour la conception d'Eudamed, la Commission prend dûment en considération la compatibilité avec les bases de données nationales et les interfaces internet nationales afin de permettre l'importation et l'exportation des données."
    4_prefix: "33.4"
    4_label: "Les données sont saisies dans Eudamed par les États membres, les organismes notifiés, les opérateurs économiques et les promoteurs conformément aux dispositions relatives aux systèmes électroniques visés au paragraphe 2. La Commission fournit un soutien technique et administratif aux utilisateurs d'Eudamed."
    5_prefix: "33.5"
    5_label: "Toutes les informations rassemblées et traitées par Eudamed sont accessibles aux États membres et à la Commission. L'accès des organismes notifiés, des opérateurs économiques, des promoteurs et du public aux informations est défini dans les dispositions relatives aux systèmes électroniques visés au paragraphe 2. La Commission veille à ce que les parties publiques d'Eudamed soient conviviales et permettent une consultation facile."
    6_prefix: "33.6"
    6_label: "Eudamed ne contient des données à caractère personnel que dans la mesure où celles-ci sont nécessaires aux systèmes électroniques visés au paragraphe 2 du présent article pour rassembler et traiter des informations conformément au présent règlement. Les données à caractère personnel sont conservées sous une forme qui permet l'identification des personnes concernées pour une durée qui ne dépasse pas celle visée à l'article 10, paragraphe 8."
    7_prefix: "33.7"
    7_desc: "La Commission et les États membres veillent à ce que les personnes concernées puissent effectivement exercer leurs droits à l'information, leurs droits d'accès, de rectification et d'opposition conformément au règlement (CE) no 45/2001 et à la directive 95/46/CE, respectivement. Ils veillent également à ce que les personnes concernées puissent effectivement exercer leur droit d'accès aux données les concernant et leur droit d'obtenir la correction et l'effacement de données inexactes ou incomplètes. Dans le cadre de leurs responsabilités respectives, la Commission et les États membres veillent à ce que les données ayant fait l'objet d'un traitement erroné et illicite soient supprimées, conformément à la législation applicable. Les données sont corrigées ou supprimées dès que possible, mais au plus tard soixante jours après la demande de la personne concernée."
    8_prefix: "33.8"
    8_desc: "La Commission prévoit, au moyen d'actes d'exécution, les modalités nécessaires à l'établissement et à la gestion d'Eudamed. Ces actes d'exécution sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3. Lorsqu'elle adopte ces actes d'exécution, la Commission veille à ce que, dans la mesure du possible, le système soit conçu de manière à éviter d'avoir à saisir deux fois une même information à l'intérieur du même module ou de différents modules du système."
    9_prefix: "33.9"
    9_label: "Pour ce qui est des responsabilités que lui confère le présent article et du traitement de données à caractère personnel que ces responsabilités entraînent, la Commission est considérée comme la responsable du traitement pour Eudamed et ses systèmes électroniques."
  10:
    prefix: "Article 34"
    title: "Fonctionnalités d'Eudamed"
    1_prefix: "34.1"
    1_desc: "La Commission, en collaboration avec le GCDM, définit les spécifications fonctionnelles d'Eudamed. La Commission établit un plan pour la mise en œuvre de ces spécifications au plus tard le 26 mai 2018. Ce plan vise à faire en sorte qu'Eudamed soit pleinement opérationnelle à une date permettant à la Commission de publier l'avis visé au paragraphe 3 du présent article au plus tard le 25 mars 2020 et que tous les autres délais pertinents prévus à l'article 123 du présent règlement et à l'article 113 du règlement (UE) 2017/746 soient respectés."
    2_prefix: "34.2"
    2_label: "La Commission, sur la base d'un rapport d'audit indépendant, informe le GCDM lorsqu'elle a vérifié qu'Eudamed est pleinement opérationnelle et qu'elle correspond aux spécifications fonctionnelles définies conformément au paragraphe 1."
    3_prefix: "34.3"
    3_label: "La Commission, après avoir consulté le GCDM, et lorsqu'elle estime que les conditions visées au paragraphe 2 sont remplies, publie un avis à cet effet au Journal officiel de l'Union européenne."
4:
  prefix: "Chapitre IV"
  title: "Organisme notifiés"
  1:
    prefix: "Article 35"
    title: "Autorités responsables des organismes notifiés"
    1_prefix: "35.1"
    1_desc: "Tout État membre qui entend désigner un organisme d'évaluation de la conformité en tant qu'organisme notifié, ou a désigné un organisme notifié, pour mener des activités d'évaluation de la conformité en application du présent règlement nomme une autorité (ci-après dénommée «autorité responsable des organismes notifiés»), qui peut être composée d'entités constituantes distinctes en vertu de la législation nationale et est chargée de la mise en place et du suivi des procédures nécessaires à l'évaluation, à la désignation et à la notification des organismes d'évaluation de la conformité et du contrôle des organismes notifiés, ainsi que de leurs sous-traitants et filiales."
    2_prefix: "35.2"
    2_label: "L'autorité responsable des organismes notifiés est établie, organisée et gérée d'une manière telle que l'objectivité et l'impartialité de ses activités sont préservées et que tout conflit d'intérêts avec les organismes d'évaluation de la conformité est évité."
    3_prefix: "35.3"
    3_label: "L'autorité responsable des organismes notifiés est organisée de telle manière que la désignation ou la notification est décidée par des membres du personnel autres que ceux qui ont procédé à l'évaluation."
    4_prefix: "35.4"
    4_label: "L'autorité responsable des organismes notifiés ne réalise aucune des activités que les organismes notifiés réalisent à des fins commerciales ou dans un contexte concurrentiel."
    5_prefix: "35.5"
    5_label: "L'autorité responsable des organismes notifiés préserve les aspects confidentiels des informations qu'elle détient. Toutefois, elle échange des informations sur des organismes notifiés avec les autres États membres, la Commission et, si nécessaire, d'autres autorités chargées de la réglementation."
    6_prefix: "35.6"
    6_desc: "L'autorité responsable des organismes notifiés dispose en permanence d'un personnel compétent en nombre suffisant pour s'acquitter correctement de ses tâches. \n\n Lorsque l'autorité responsable des organismes notifiés est distincte de l'autorité nationale compétente pour les dispositifs médicaux, elle veille à ce que cette dernière soit consultée sur les questions pertinentes."
    7_prefix: "35.7"
    7_label: "Les États membres mettent à la disposition du public des informations générales concernant leurs mesures régissant l'évaluation, la désignation et la notification des organismes d'évaluation de la conformité et concernant le contrôle des organismes notifiés, ainsi que les modifications ayant un impact important sur ces tâches."
    8_prefix: "35.8"
    8_label: "L'autorité responsable des organismes notifiés participe aux activités d'évaluation par les pairs prévues à l'article 48."
  2:
    prefix: "Article 36"
    title: "Exigences applicables aux organismes notifiés"
    1_prefix: "36.1"
    1_desc: "Les organismes notifiés s'acquittent des tâches pour lesquelles ils sont désignés en vertu du présent règlement. Ils se conforment aux exigences organisationnelles et générales et aux exigences en matière de gestion de la qualité, de ressources et de procédures qui sont nécessaires à l'exécution de ces tâches. Les organismes notifiés se conforment notamment aux exigences de l'annexe VII. \n\n Afin de se conformer aux exigences visées au premier alinéa, les organismes notifiés disposent en permanence d'un personnel administratif, technique et scientifique en nombre suffisant conformément à l'annexe VII, section 3.1.1, et d'un personnel possédant une expertise clinique appropriée conformément à l'annexe VII, section 3.2.4, employé si possible par les organismes notifiés eux-mêmes. \n\n Les membres du personnel visé à l'annexe VII, sections 3.2.3 et 3.2.7 sont employés par l'organisme notifié lui-même et ne sont ni des experts externes ni des sous-traitants."
    2_prefix: "36.2"
    2_label: "Les organismes notifiés mettent à disposition de l'autorité responsable des organismes notifiés et lui soumettent sur demande toute la documentation pertinente, y compris celle du fabricant, afin de lui permettre de réaliser ses activités d'évaluation, de désignation, de notification, de contrôle et de surveillance et pour faciliter les évaluations décrites au présent chapitre."
    3_prefix: "36.3"
    3_label: "Afin d'assurer l'application uniforme des exigences énoncées à l'annexe VII, la Commission peut adopter des actes d'exécution, dans la mesure nécessaire pour résoudre les problèmes liés à des différences d'interprétation et à l'application pratique. Ces actes d'exécution sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3."
  3:
    prefix: "Article 37"
    title: "Filiales et sous-traitance"
    1_prefix: "37.1"
    1_label: "Lorsqu'un organisme notifié sous-traite des tâches particulières relatives à l'évaluation de la conformité ou confie de telles tâches à une filiale, il vérifie que le sous-traitant ou la filiale respecte les exigences applicables énoncées à l'annexe VII et informe l'autorité responsable des organismes notifiés en conséquence."
    2_prefix: "37.2"
    2_label: "Les organismes notifiés assument l'entière responsabilité des tâches réalisées en leur nom par des sous-traitants ou des filiales."
    3_prefix: "37.3"
    3_label: "Les organismes notifiés mettent à la disposition du public une liste de leurs filiales."
    4_prefix: "37.4"
    4_label: "Les activités d'évaluation de la conformité peuvent être sous-traitées ou confiées à une filiale pour autant que la personne morale ou physique ayant demandé l'évaluation de la conformité ait été informée en conséquence."
    5_prefix: "37.5"
    5_label: "Les organismes notifiés tiennent à la disposition de l'autorité responsable des organismes notifiés tous les documents pertinents concernant la vérification des qualifications du sous-traitant ou de la filiale et des tâches qu'ils réalisent en vertu du présent règlement."
  4:
    prefix: "Article 38"
    title: "Demande de désignation d'organismes d'évaluation de la conformité"
    1_prefix: "38.1"
    1_label: "Les organismes d'évaluation de la conformité introduisent une demande de désignation auprès de l'autorité responsable des organismes notifiés."
    2_prefix: "38.2"
    2_desc: "La demande précise les activités d'évaluation de la conformité telles qu'elles sont définies par le présent règlement et les types de dispositifs pour lesquels l'organisme demande à être désigné, et est accompagnée des documents attestant le respect de l'annexe VII. \n\n En ce qui concerne les exigences organisationnelles et générales et les exigences en matière de gestion de la qualité énoncées à l'annexe VII, sections 1 et 2, un certificat d'accréditation en cours de validité et le rapport d'évaluation correspondant délivrés par un organisme national d'accréditation conformément au règlement (CE) no 765/2008 peuvent être transmis et sont pris en considération lors de l'évaluation décrite à l'article 39. Toutefois, le demandeur met à disposition, sur demande, toute la documentation visée au premier alinéa pour attester le respect de ces exigences."
    3_prefix: "38.3"
    3_label: "L'organisme notifié met à jour la documentation visée au paragraphe 2 dès que des changements pertinents interviennent afin de permettre à l'autorité responsable des organismes notifiés de contrôler et de vérifier que toutes les exigences énoncées à l'annexe VII demeurent observées."
  5:
    prefix: "Article 39"
    title: "Évaluation de la demande"
    1_prefix: "39.1"
    1_desc: "L'autorité responsable des organismes notifiés vérifie, dans un délai de trente jours, que la demande visée à l'article 38 est complète et invite le demandeur à fournir toute information manquante. Lorsque la demande est complète, cette autorité l'adresse à la Commission. \n\n L'autorité responsable des organismes notifiés examine la demande et les documents qui l'accompagnent conformément à ses propres procédures et produit un rapport d'évaluation préliminaire."
    2_prefix: "39.2"
    2_label: "L'autorité responsable des organismes notifiés soumet le rapport d'évaluation préliminaire à la Commission, qui le transmet immédiatement au GCDM."
    3_prefix: "39.3"
    3_desc: "Dans un délai de quatorze jours suivant la transmission du rapport visée au paragraphe 2 du présent article, la Commission, conjointement avec le GCDM, désigne une équipe d'évaluation conjointe composée de trois experts, à moins que des circonstances particulières ne nécessitent un nombre d'experts différent, choisis dans la liste visée à l'article 40, paragraphe 2. Un de ces experts est un représentant de la Commission qui coordonne les activités de l'équipe d'évaluation conjointe. Les deux autres experts viennent d'États membres autres que celui dans lequel est établi l'organisme d'évaluation de la conformité demandeur. \n\n L'équipe d'évaluation conjointe réunit des experts compétents pour évaluer les activités d'évaluation de la conformité et les types de dispositifs qui font l'objet de la demande ou, en particulier lorsque la procédure d'évaluation est engagée conformément à l'article 47, paragraphe 3, pour veiller à ce que le problème spécifique puisse être évalué comme il convient."
    4_prefix: "39.4"
    4_label: "Dans un délai de quatre-vingt-dix jours suivant sa désignation, l'équipe d'évaluation conjointe passe en revue les documents fournis à l'appui de la demande en application de l'article 38. L'équipe d'évaluation conjointe peut fournir en retour à l'autorité responsable des organismes notifiés des informations relatives à la demande et à l'évaluation qui est prévue sur place ou lui demander des précisions à ce sujet. \n\n L'autorité responsable des organismes notifiés ainsi que l'équipe d'évaluation conjointe planifient et réalisent une évaluation sur place de l'organisme d'évaluation de la conformité demandeur et, le cas échéant, de ses filiales ou sous-traitants, situés dans ou hors de l'Union, qui interviendront dans la procédure d'évaluation de la conformité. \n\n L'évaluation sur place de l'organisme demandeur est menée par l'autorité responsable des organismes notifiés."
    5_prefix: "39.5"
    5_desc: "Les cas de non-respect, par un organisme d'évaluation de la conformité demandeur, des exigences énoncées à l'annexe VII sont constatés durant la procédure d'évaluation et sont examinés conjointement par l'autorité responsable des organismes notifiés et l'équipe d'évaluation conjointe en vue de parvenir à un consensus et de résoudre toute divergence d'opinion sur l'évaluation de la demande. \n\n À l'issue de l'évaluation sur place, l'autorité responsable des organismes notifiés transmet à l'organisme d'évaluation de la conformité demandeur une liste des cas de non-respect constatés durant l'évaluation ainsi qu'un résumé de l'évaluation effectuée par l'équipe d'évaluation conjointe. \n\n Dans un délai donné, l'organisme d'évaluation de la conformité demandeur soumet à l'autorité nationale un plan de mesures correctives et préventives en vue de remédier aux cas de non-respect."
    6_prefix: "39.6"
    6_label: "Dans un délai de trente jours suivant la réalisation de l'évaluation sur place, l'équipe d'évaluation conjointe documente toute divergence d'opinion persistant au sujet de l'évaluation et en fait part à l'autorité responsable des organismes notifiés."
    7_prefix: "39.7"
    7_desc: "L'autorité responsable des organismes notifiés évalue, après avoir reçu un plan de mesures correctives et préventives établi par l'organisme demandeur, s'il a été correctement remédié aux cas de non-respect constatés durant l'évaluation. Ce plan indique la raison essentielle des cas de non-respect constatés et comprend un calendrier de mise en œuvre des mesures qui y sont prévues. \n\n Après avoir confirmé le plan de mesures correctives et préventives, l'autorité responsable des organismes notifiés transmet ce plan et son avis sur celui-ci à l'équipe d'évaluation conjointe. L'équipe d'évaluation conjointe peut demander des précisions supplémentaires et des modifications à l'autorité responsable des organismes notifiés. \n\n L'autorité responsable des organismes notifiés rédige son rapport définitif d'évaluation, qui comprend les éléments suivants: \n\t — le résultat de l'évaluation, \n\t — la confirmation que les mesures correctives et préventives ont été correctement prises en compte et, si nécessaire, mises en œuvre, \n\t — toute divergence d'opinion persistant avec l'équipe d'évaluation conjointe et, le cas échéant, \n\t — une recommandation concernant le champ couvert par la désignation."
    8_prefix: "39.8"
    8_label: "L'autorité responsable des organismes notifiés soumet son rapport définitif d'évaluation et, s'il y a lieu, le projet de désignation à la Commission, au GCDM et à l'équipe d'évaluation conjointe."
    9_prefix: "39.9"
    9_desc: "L'équipe d'évaluation conjointe communique à la Commission un avis définitif sur le rapport d'évaluation élaboré par l'autorité responsable des organismes notifiés et, s'il y a lieu, le projet de désignation dans un délai de vingt et un jours suivant la date de réception de ces documents, avis final que la Commission transmet immédiatement au GCDM. Dans un délai de quarante-deux jours suivant la réception de l'avis de l'équipe d'évaluation conjointe, le GCDM émet une recommandation relative au projet de désignation, dont l'autorité responsable des organismes notifiés tient dûment compte lorsqu'elle statue sur la désignation de l'organisme notifié."
    10_prefix: "39.10"
    10_desc: "La Commission peut, au moyen d'actes d'exécution, adopter des mesures fixant les modalités définissant les procédures et les rapports concernant la demande de désignation visée à l'article 38 et l'évaluation de la demande prévue au présent article. Ces actes d'exécution sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3."
  6:
    prefix: "Article 40"
    title: "Nomination d'experts pour l'évaluation conjointe des demandes de notification"
    1_prefix: "40.1"
    1_label: "Les États membres et la Commission nomment des experts qualifiés pour évaluer les organismes d'évaluation de la conformité dans le domaine des dispositifs médicaux en vue de leur participation aux activités visées aux articles 39 et 48."
    2_prefix: "40.2"
    2_label: "La Commission tient une liste des experts nommés en application du paragraphe 1 du présent article, et des informations sur leur domaine de compétences et leur expertise spécifiques. Cette liste est mise à la disposition des autorités compétentes des États membres via le système électronique visé à l'article 57."
  7_prefix: "Article 41"
  7_label: "Exigences linguistiques"
  7_desc: "Tous les documents requis au titre des articles 38 et 39 sont rédigés dans une ou des langues définies par l'État membre concerné. \n\n En application du premier alinéa, les États membres envisagent l'adoption et l'utilisation d'une langue couramment comprise dans le domaine médical pour tout ou partie de la documentation concernée. \n\n La Commission fournit les traductions de la documentation ou parties de celle-ci conformément aux articles 38 et 39 dans une langue officielle de l'Union de telle sorte qu'elle puisse être aisément comprise par l'équipe d'évaluation conjointe désignée en application de l'article 39, paragraphe 3."
  8:
    prefix: "Article 42"
    title: "Procédure de désignation et de notification"
    1_prefix: "42.1"
    1_label: "Les États membres ne peuvent désigner que les organismes d'évaluation de la conformité pour lesquels l'évaluation en application de l'article 39 est achevée et qui satisfont à l'annexe VII."
    2_prefix: "42.2"
    2_label: "Les États membres notifient à la Commission et aux autres États membres les organismes d'évaluation de la conformité qu'ils ont désignés, à l'aide de l'outil de notification électronique de la base de données des organismes notifiés mis en place et géré par la Commission (NANDO)."
    3_prefix: "42.3"
    3_label: "La notification précise clairement, en utilisant les codes visés au paragraphe 13 du présent article, le champ couvert par la désignation et indique les activités d'évaluation de la conformité définies dans le présent règlement et les types de dispositifs que l'organisme notifié est habilité à évaluer et, sans préjudice de l'article 44, toute condition associée à la désignation."
    4_prefix: "42.4"
    4_label: "La notification est assortie du rapport définitif d'évaluation de l'autorité responsable des organismes notifiés, de l'avis définitif de l'équipe d'évaluation conjointe visé à l'article 39, paragraphe 9, et de la recommandation du GCDM. Si l'État membre notifiant ne suit pas la recommandation du GCDM, sa décision est dûment motivée."
    5_prefix: "42.5"
    5_label: "Sans préjudice de l'article 44, l'État membre notifiant informe la Commission et les autres États membres de toute condition associée à la désignation et fournit des pièces justificatives relatives aux dispositions prises pour garantir que l'organisme notifié sera contrôlé régulièrement et satisfera sans discontinuer aux exigences énoncées à l'annexe VII."
    6_prefix: "42.6"
    6_label: "Dans un délai de vingt-huit jours suivant la notification visée au paragraphe 2, un État membre ou la Commission peut formuler des objections écrites, exposant ses arguments, à l'encontre de l'organisme notifié ou de son contrôle par l'autorité responsable des organismes notifiés. En l'absence d'objection, la Commission publie la notification dans NANDO dans un délai de quarante-deux jours suivant la notification visée au paragraphe 2."
    7_prefix: "42.7"
    7_desc: "Lorsqu'un État membre ou la Commission formule des objections en application du paragraphe 6, la Commission saisit le GCDM du dossier dans un délai de dix jours suivant l'expiration du délai prévu au paragraphe 6. Après consultation des parties concernées, le GCDM rend son avis dans un délai de quarante jours suivant la date à laquelle il a été saisi du dossier. Si le GCDM est d'avis que la notification est recevable, la Commission la publie dans NANDO dans un délai de quatorze jours."
    8_prefix: "42.8"
    8_label: "Lorsque, après avoir été consulté conformément au paragraphe 7, le GCDM confirme l'objection ou en formule une autre, l'État membre notifiant répond par écrit à l'avis du GCDM dans un délai de quarante jours suivant sa réception. La réponse concerne les objections soulevées dans l'avis et énonce les raisons pour lesquelles l'État membre notifiant décide de désigner ou non l'organisme d'évaluation de la conformité."
    9_prefix: "42.9"
    9_label: "Lorsque l'État membre notifiant, ayant énoncé ses raisons conformément au paragraphe 8, décide de confirmer sa décision de désigner l'organisme d'évaluation de la conformité, la Commission publie la notification dans NANDO dans un délai de quatorze jours après en avoir été informée."
    10_prefix: "42.10"
    10_label: "Lors de la publication de la notification dans NANDO, la Commission ajoute également les informations relatives à la notification de l'organisme notifié au système électronique visé à l'article 57, de même que les documents mentionnés au paragraphe 4 du présent article et l'avis et les réponses visés aux paragraphes 7 et 8 du présent article."
    11_prefix: "42.11"
    11_label: "La désignation prend effet le jour suivant celui de la publication de la notification dans NANDO. La notification publiée détermine le champ des activités légales d'évaluation de la conformité de l'organisme notifié."
    12_prefix: "42.12"
    12_label: "L'organisme d'évaluation de la conformité concerné ne peut mener les activités d'un organisme notifié qu'après la prise d'effet de la désignation conformément au paragraphe 11."
    13_prefix: "42.13"
    13_desc: "Au plus tard le 26 novembre 2017, la Commission dresse, au moyen d'actes d'exécution, une liste des codes et des types correspondants de dispositifs aux fins de préciser le champ couvert par la désignation des organismes notifiés. Ces actes d'exécution sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3. Après avoir consulté le GCDM, la Commission peut mettre à jour cette liste, notamment sur la base des informations provenant des activités de coordination visées à l'article 48."
  9:
    prefix: "Article 43"
    title: "Numéro d'identification et liste des organismes notifiés"
    1_prefix: "43.1"
    1_desc: "La Commission attribue un numéro d'identification à chaque organisme notifié dont la notification prend effet en application de l'article 42, paragraphe 11. Elle attribue un numéro d'identification unique, même si l'organisme est notifié en application de plusieurs actes législatifs de l'Union. S'ils sont désignés conformément au présent règlement, les organismes notifiés en vertu des directives 90/385/CEE et 93/42/CEE conservent le numéro d'identification qui leur a été attribué au titre de ces directives."
    2_prefix: "43.2"
    2_desc: "La Commission rend publique dans NANDO la liste des organismes notifiés en application du présent règlement, laquelle indique les numéros d'identification qui leur ont été attribués ainsi que les activités d'évaluation de la conformité définies dans le présent règlement et les types de dispositifs pour lesquels ils sont notifiés. Elle met également cette liste à disposition via le système électronique visé à l'article 57. La Commission veille à ce que la liste soit tenue à jour."
  10:
    prefix: "Article 44"
    title: "Surveillance et réévaluation des organismes notifiés"
    1_prefix: "44.1"
    1_label: "Les organismes notifiés informent sans tarder, et au plus tard dans un délai de quinze jours, l'autorité responsable des organismes notifiés des changements pertinents susceptibles d'influer sur le respect des exigences énoncées à l'annexe VII ou sur leur capacité à mener les activités d'évaluation de la conformité des dispositifs pour lesquels ils ont été désignés."
    2_prefix: "44.2"
    2_desc: "Les autorités responsables des organismes notifiés contrôlent les organismes notifiés établis sur leur territoire ainsi que leurs filiales et leurs sous-traitants pour veiller à ce que les exigences et obligations qui leur incombent énoncées dans le présent règlement demeurent respectées. Les organismes notifiés fournissent, à la demande de leur autorité responsable des organismes notifiés, toutes les informations et tous les documents nécessaires pour permettre à l'autorité, à la Commission et aux autres États membres de vérifier le respect de ces exigences et obligations."
    3_prefix: "44.3"
    3_desc: "Lorsque la Commission ou l'autorité d'un État membre soumet une demande à un organisme notifié établi sur le territoire d'un autre État membre concernant une évaluation de la conformité réalisée par ledit organisme notifié, elle adresse une copie de cette demande à l'autorité responsable des organismes notifiés de l'État membre en question. L'organisme notifié concerné répond à la demande sans tarder, et au plus tard dans un délai de quinze jours. L'autorité responsable des organismes notifiés de l'État membre dans lequel l'organisme a son siège veille à ce que les demandes des autorités de tout autre État membre ou de la Commission soient traitées par l'organisme notifié, à moins qu'il y ait une raison légitime de ne pas le faire, auquel cas la question peut être soumise au GCDM."
    4_prefix: "44.4"
    4_desc: "Au moins une fois par an, les autorités responsables des organismes notifiés évaluent une nouvelle fois si les organismes notifiés établis sur leur territoire respectif et, le cas échéant, les filiales et sous-traitants placés sous la responsabilité desdits organismes notifiés respectent toujours les exigences et obligations qui leur incombent énoncées à l'annexe VII. Cet examen prévoit un audit sur place de chacun des organismes notifiés et, si nécessaire, de leurs filiales et sous-traitants. L'autorité responsable des organismes notifiés mène ses activités de contrôle et d'évaluation selon un plan d'évaluation annuel visant à garantir qu'elle puisse effectivement contrôler qu'un organisme notifié continue de respecter les exigences du présent règlement. Ce plan contient un calendrier motivé exposant la fréquence d'évaluation de l'organisme notifié et, en particulier, des filiales et sous-traitants associés. L'autorité soumet au GCDM et à la Commission son plan annuel de contrôle ou d'évaluation pour chaque organisme notifié sous sa responsabilité."
    5_prefix: "44.5"
    5_label: "Le contrôle des organismes notifiés par l'autorité responsable des organismes notifiés comporte des audits du personnel de l'organisme notifié, y compris, si nécessaire, du personnel des filiales et sous-traitants, réalisés en présence d'observateurs, au moment où le personnel effectue l'évaluation des systèmes de gestion de la qualité dans les installations d'un fabricant."
    6_prefix: "44.6"
    6_desc: "Le contrôle d'organismes notifiés par l'autorité responsables des organismes notifiés tient compte des données provenant de la surveillance du marché, de la vigilance et de la surveillance après commercialisation en vue d'aider à orienter les activités concernées. \n\n L'autorité responsable des organismes notifiés prévoit un suivi systématique des réclamations et autres informations, notamment celles transmises par d'autres États membres, susceptibles de donner à penser qu'un organisme notifié ne satisfait pas à ses obligations ou s'écarte de la pratique générale ou des bonnes pratiques."
    7_prefix: "44.7"
    7_label: "L'autorité responsable des organismes notifiés peut, en plus du contrôle régulier ou d'évaluations sur place, procéder à des examens à préavis limité, inopinés ou dus à une cause spécifique si cela est nécessaire pour traiter une question particulière ou vérifier le respect des exigences."
    8_prefix: "44.8"
    8_label: "L'autorité responsable des organismes notifiés examine les évaluations de la documentation technique du fabricant, en particulier, de la documentation relative aux évaluations cliniques, auxquelles ont procédé les organismes notifiés, comme précisé à l'article 45."
    9_prefix: "44.9"
    9_label: "L'autorité responsable des organismes notifiés documente et enregistre tout cas de non-respect des exigences énoncées à l'annexe VII par l'organisme notifié et contrôle la mise en œuvre en temps utile des mesures correctives et préventives."
    10_prefix: "44.10"
    10_desc: "Trois ans après la notification d'un organisme notifié, puis tous les quatre ans par la suite, une nouvelle évaluation complète du respect des exigences énoncées à l'annexe VII par l'organisme notifié est réalisée par l'autorité responsable des organismes notifiés de l'État membre dans lequel l'organisme a son siège et par une équipe d'évaluation conjointe nommée aux fins de la procédure prévue aux articles 38 et 39."
    11_prefix: "44.11"
    11_label: "La Commission est habilitée à adopter des actes délégués conformément à l'article 115 afin de modifier le paragraphe 10 pour changer la fréquence des nouvelles évaluations complètes visées dans ledit paragraphe."
    12_prefix: "44.12"
    12_desc: "Les États membres adressent à la Commission et au GCDM, au moins une fois par an, un rapport rendant compte de leurs activités de contrôle et d'évaluation sur place à l'égard des organismes notifiés et, le cas échéant, des filiales et sous-traitants. Le rapport fournit les détails du résultat de ces activités, y compris les activités visées au paragraphe 7 et fait l'objet d'un traitement confidentiel par le GCDM et la Commission; il contient toutefois un résumé qui est rendu public. \n\n Le résumé du rapport est transmis au système électronique visé à l'article 57."
  11:
    prefix: "Article 45"
    title: "Examen de l'évaluation de la documentation technique et de la documentation relative aux évaluations cliniques effectuées par l'organisme notifié"
    1_prefix: "45.1"
    1_desc: "Dans le cadre du contrôle permanent qu'elle exerce sur les organismes notifiés, l'autorité responsable des organismes notifiés examine un nombre approprié d'évaluations de la documentation technique du fabricant, en particulier de la documentation relative aux évaluations cliniques visée à l'annexe II, section 6.1, points c) et d),, auxquelles a procédé l'organisme notifié, afin de vérifier les conclusions tirées par cet organisme sur la base des informations fournies par le fabricant. Les examens effectués par l'autorité responsable des organismes notifiés le sont à la fois hors site et sur place."
    2_prefix: "45.2"
    2_desc: "L'échantillonnage de dossiers à examiner conformément au paragraphe 1 fait l'objet d'une planification et est représentatif des types de dispositifs qui sont certifiés par l'organisme notifié, ainsi que des risques correspondants, en particulier les dispositifs à haut risque; il est justifié et documenté comme il convient dans un plan d'échantillonnage qui est mis, sur demande, à la disposition du GCDM par l'autorité responsable des organismes notifiés."
    3_prefix: "45.3"
    3_desc: "L'autorité responsable des organismes notifiés examine si l'évaluation à laquelle a procédé l'organisme notifié a été menée comme il convient et elle vérifie les procédures utilisées, la documentation associée et les conclusions tirées par cet organisme. Cette vérification porte notamment sur la documentation technique et la documentation relative aux évaluations cliniques présentées par le fabricant, sur lesquelles l'organisme notifié a fondé son évaluation. La réalisation de ces examens s'appuie sur les spécifications communes."
    4_prefix: "45.4"
    4_label: "Ces examens font également partie de la nouvelle évaluation des organismes notifiés conformément à l'article 44, paragraphe 10, et des activités d'évaluation conjointe visées à l'article 47, paragraphe 3. Ces examens sont réalisés en s'appuyant sur des compétences appropriées."
    5_prefix: "45.5"
    5_desc: "Sur la base des rapports des examens et évaluations réalisés par l'autorité responsable des organismes notifiés ou les équipes d'évaluation conjointe, des résultats des activités de surveillance du marché, de vigilance et de surveillance après commercialisation décrites au chapitre VII, du suivi permanent des progrès techniques, ou de la mise en évidence des préoccupations et des questions qui se font jour en matière de sécurité et de performances des dispositifs, le GCDM peut recommander que l'échantillonnage effectué au titre du présent article porte sur une proportion plus ou moins grande de la documentation technique et de la documentation relative aux évaluations cliniques évaluées par un organisme notifié."
    6_prefix: "45.6"
    6_desc: "La Commission peut, au moyen d'actes d'exécution, adopter des mesures fixant les modalités de l'examen des évaluations de la documentation technique et de la documentation relative aux évaluations cliniques visées au présent article et précisant les documents qui y sont liés et les dispositions en matière de coordination. Ces actes d'exécution sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3."
  12:
    prefix: "Article 46"
    title: "Modifications des désignations et des notifications"
    1_prefix: "46.1"
    1_desc: "L'autorité responsable des organismes notifiés informe la Commission et les autres États membres de toute modification pertinente apportée à la désignation d'un organisme notifié. \n\n Les procédures décrites aux articles 39 et 42 s'appliquent en cas d'extension du champ couvert par la désignation. \n\n En cas de modification de la désignation autre qu'une extension de son champ, les procédures prévues aux paragraphes ci-après s'appliquent."
    2_prefix: "46.2"
    2_label: "La Commission publie immédiatement la notification modifiée dans NANDO. La Commission introduit immédiatement les informations concernant la modification de la désignation de l'organisme notifié dans le système électronique visé à l'article 57."
    3_prefix: "46.3"
    3_desc: "Lorsqu'un organisme notifié décide de cesser ses activités d'évaluation de la conformité, il informe l'autorité responsable des organismes notifiés et les fabricants concernés dès que possible et, dans le cas d'un arrêt prévu de ses activités, un an avant de mettre un terme à ses activités. Les certificats peuvent rester valables pendant une période temporaire de neuf mois après l'arrêt des activités de l'organisme notifié, à condition qu'un autre organisme notifié confirme par écrit qu'il assumera la responsabilité des dispositifs concernés par ces certificats. Le nouvel organisme notifié procède à une évaluation complète des dispositifs concernés avant la fin de cette période, avant de délivrer de nouveaux certificats pour les dispositifs en question. Lorsque l'organisme notifié cesse ses activités, l'autorité nationale responsable des organismes notifiés retire la désignation."
    4_prefix: "46.4"
    4_desc: "Lorsqu'une autorité responsable des organismes notifiés a établi qu'un organisme notifié ne satisfait plus aux exigences énoncées à l'annexe VII ou ne s'acquitte pas de ses obligations ou n'a pas mis en œuvre les mesures correctives nécessaires, elle suspend, restreint ou retire en tout ou en partie la désignation, selon la gravité du cas de non-respect de ces exigences ou de ces obligations. La suspension ne peut durer plus d'un an et peut être reconduite une fois pour la même durée. \n\n L'autorité responsable des organismes notifiés informe immédiatement la Commission et les autres États membres de toute suspension, de toute restriction ou de tout retrait d'une désignation."
    5_prefix: "46.5"
    5_label: "Lorsque sa désignation a été suspendue, restreinte ou retirée en tout ou en partie, l'organisme notifié en informe les fabricants concernés dans un délai maximal de dix jours."
    6_prefix: "46.6"
    6_label: "En cas de restriction, de suspension ou de retrait d'une désignation, l'autorité responsable des organismes notifiés prend les mesures appropriées pour assurer que les dossiers de l'organisme notifié en question sont conservés et mis à la disposition des autorités d'autres États membres responsables des organismes notifiés et des autorités responsables de la surveillance du marché, à leur demande."
    7_prefix: "46.7"
    7_label: "En cas de restriction, de suspension ou de retrait d'une désignation, l'autorité responsable des organismes notifiés:"
    7_desc: "\ta. évalue l'incidence sur les certificats délivrés par l'organisme notifié; \n\tb. transmet un rapport sur ses conclusions à la Commission et aux autres États membres dans un délai de trois mois après avoir signalé la modification; \n\tc. exige de l'organisme notifié qu'il suspende ou retire, dans un délai raisonnable qu'elle détermine, tous les certificats délivrés à tort afin d'assurer la sécurité des dispositifs présents sur le marché; \n\td. introduit dans le système électronique visé à l'article 57 des informations relatives aux certificats dont elle a demandé la suspension ou le retrait; \n\te. notifie à l'autorité compétente pour les dispositifs médicaux de l'État membre dans lequel le fabricant a son siège via le système électronique visé à l'article 57 les certificats dont elle a demandé la suspension ou le retrait. Cette autorité compétente prend les mesures appropriées si cela est nécessaire pour éviter un risque potentiel pour la santé ou la sécurité des patients, des utilisateurs ou d'autres personnes."
    8_prefix: "46.8"
    8_label: "À l'exception des certificats délivrés à tort, et lorsqu'une désignation a été suspendue ou restreinte, les certificats restent valables dans les cas suivants:"
    8_desc: "\ta. l'autorité responsable des organismes notifiés a confirmé, dans un délai d'un mois suivant la suspension ou la restriction, qu'il n'y a pas de problème de sécurité en liaison avec les certificats concernés par la suspension ou la restriction, et l'autorité responsable des organismes notifiés a défini un calendrier et les mesures prévues pour remédier à la suspension ou à la restriction; ou \n\tb. l'autorité responsable des organismes notifiés a confirmé qu'aucun certificat ayant trait à la suspension ne sera délivré, modifié ou délivré à nouveau pendant la période de suspension/restriction et indique si l'organisme notifié est en mesure de continuer à contrôler les certificats existants délivrés et à en être responsable pour la durée de la suspension ou de la restriction. Si l'autorité responsable des organismes notifiés considère que l'organisme notifié n'est pas en mesure de confirmer les certificats existants délivrés, le fabricant adresse à l'autorité compétente pour les dispositifs médicaux de l'État membre dans lequel le fabricant du dispositif faisant l'objet du certificat a son siège, dans un délai de trois mois suivant la suspension ou la restriction, la confirmation écrite qu'un autre organisme notifié qualifié assume temporairement les fonctions de contrôle de l'organisme notifié et continue d'assumer la responsabilité des certificats pour la durée de la suspension ou de la restriction."
    9_prefix: "46.9"
    9_label: "À l'exception des certificats délivrés à tort, et lorsqu'une désignation a été retirée, les certificats restent valables pendant une durée de neuf mois dans les cas suivants:"
    9_desc: "\ta. l'autorité compétente pour les dispositifs médicaux de l'État membre dans lequel le fabricant du dispositif faisant l'objet du certificat a son siège, a confirmé qu'il n'y a pas de problème de sécurité pour ce qui est des dispositifs en question; et \n\tb. un autre organisme notifié a confirmé par écrit qu'il assumera la responsabilité immédiate de ces dispositifs et qu'il achèvera leur évaluation dans un délai de douze mois à compter de le retrait de la désignation. \n\n Dans le cas visé au premier alinéa, l'autorité compétente pour les dispositifs médicaux de l'État membre dans lequel le fabricant du dispositif faisant l'objet du certificat a son siège, peut prolonger à plusieurs reprises la durée de validité provisoire des certificats de trois mois supplémentaires, pour une durée totale maximale de douze mois. \n\n L'autorité ou l'organisme notifié qui assume les fonctions de l'organisme notifié concerné par la modification de la désignation en informe immédiatement la Commission, les autres États membres et les autres organismes notifiés."
  13:
    prefix: "Article 47"
    title: "Contestation de la compétence des organismes notifiés"
    1_prefix: "47.1"
    1_desc: "La Commission procède, conjointement avec le GCDM, à une enquête à chaque fois qu'elle est avisée que des organismes notifiés, ou une ou plusieurs de leurs filiales ou un ou plusieurs de leurs sous-traitants, sont soupçonnés de ne plus respecter les exigences de l'annexe VII ou les obligations qui leur incombent. Elle veille à ce que l'autorité responsable des organismes notifiés concernée soit informée et ait la possibilité de procéder à une enquête à ce sujet."
    2_prefix: "47.2"
    2_label: "L'État membre notifiant fournit à la Commission, sur demande, toutes les informations relatives à la désignation de l'organisme notifié concerné."
    3_prefix: "47.3"
    3_desc: "La Commission peut, conjointement avec le GCDM, entamer, le cas échéant, la procédure d'évaluation visée à l'article 39, paragraphes 3 et 4, lorsqu'il existe des craintes plausibles quant au respect des exigences énoncées à l'annexe VII par un organisme notifié ou par une filiale ou un sous-traitant de l'organisme notifié et lorsque l'enquête de l'autorité responsable des organismes notifiés n'a pas levé tous les doutes, ou à la demande de l'autorité responsable des organismes notifiés. Le rapport et les résultats de cette évaluation suivent les principes fixés à l'article 39. En fonction de la sévérité de la question, la Commission peut aussi, conjointement avec le GCDM, demander que l'autorité responsable des organismes notifiés permette à maximum deux experts figurant sur la liste établie conformément à l'article 40, de participer à une évaluation sur place dans le cadre des activités de contrôle et d'évaluation planifiées conformément à l'article 44 et selon le plan d'évaluation annuel visé à l'article 44, paragraphe 4."
    4_prefix: "47.4"
    4_desc: "Lorsque la Commission établit qu'un organisme notifié ne satisfait plus aux conditions de sa désignation, elle informe l'État membre notifiant en conséquence et l'invite à prendre les mesures correctives qui s'imposent, dont la suspension, la restriction ou le retrait de la désignation si nécessaire. \n\n Si l'État membre ne prend pas les mesures correctives qui s'imposent, la Commission peut, au moyen d'actes d'exécution, suspendre, restreindre ou retirer la désignation. Ces actes d'exécution sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3. La Commission notifie sa décision à l'État membre concerné et procède à la mise à jour de NANDO et du système électronique visé à l'article 57."
    5_prefix: "47.5"
    5_label: "La Commission s'assure que toutes les informations confidentielles obtenues au cours de ses enquêtes sont traitées en conséquence."
  14:
    prefix: "Article 48"
    title: "Évaluation par les pairs et échange d'expérience entre les autorités responsables des organismes notifiés"
    1_prefix: "48.1"
    1_label: "La Commission prévoit l'organisation d'un échange d'expérience et la coordination des pratiques administratives entre les autorités responsables des organismes notifiés. Cet échange porte notamment sur les éléments suivants:"
    1_desc: "\ta. l'élaboration de documents sur les bonnes pratiques liées aux activités des autorités responsables des organismes notifiés; \n\tb. l'élaboration de documents d'orientation à l'intention des organismes notifiés, en rapport avec l'application du présent règlement; \n\tc. la formation et la qualification des experts visés à l'article 40; \n\td. le suivi des tendances concernant les modifications des désignations et des notifications d'organismes notifiés, les retraits de certificats et les transferts entre organismes notifiés; \n\te. le contrôle de l'application et du caractère applicable des codes relatifs au champ de la désignation visés à l'article 42, paragraphe 13; \n\tf. la mise en place d'un mécanisme d'évaluations par les pairs entre les autorités et la Commission; \n\tg. des méthodes pour l'information du public sur les activités de contrôle et de surveillance menées par les autorités et la Commission à l'égard des organismes notifiés en ce qui concerne les dispositifs médicaux."
    2_prefix: "48.2"
    2_label: "Les autorités responsables des organismes notifiés participent tous les trois ans à une évaluation par les pairs sur la base du mécanisme mis en place en application du paragraphe 1 du présent article. Ces évaluations s'effectuent en principe parallèlement aux évaluations conjointes sur place visées à l'article 39. Mais une autorité peut également décider de les inclure dans ses activités de contrôle visées à l'article 44."
    3_prefix: "48.3"
    3_label: "La Commission participe à l'organisation et fournit une assistance à la mise en œuvre du mécanisme d'évaluation par les pairs."
    4_prefix: "48.4"
    4_label: "La Commission établit un rapport de synthèse annuel des activités d'évaluation par les pairs qui est rendu public."
    5_prefix: "48.5"
    5_label: "La Commission peut, au moyen d'actes d'exécution, adopter des mesures fixant les modalités du mécanisme d'évaluation par les pairs, de la formation et de la qualification, ainsi que les documents qui y sont liés, comme indiqué au paragraphe 1 du présent article. Ces actes d'exécution sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3."
  15_prefix: "Article 49"
  15_label: "Coordination des organismes notifiés"
  15_desc: "La Commission veille à ce que les organismes notifiés coordonnent leurs activités et coopèrent dans le cadre d'un groupe de coordination des organismes notifiés dans le domaine des dispositifs médicaux, en ce compris les dispositifs médicaux de diagnostic in vitro. Ce groupe se réunit régulièrement et au moins une fois par an. \n\n Les organismes notifiés aux fins du présent règlement participent aux travaux de ce groupe. \n\n La Commission peut définir les modalités pour le fonctionnement du groupe de coordination des organismes notifiés."
  16_prefix: "Article 50"
  16_label: "Listes de redevances standard"
  16_desc: "Les organismes notifiés établissent des listes de leurs redevances standard concernant les activités d'évaluation de la conformité qu'ils effectuent et rendent ces listes publiques."
5:
  prefix: "Chapitre V"
  title: "Classification et évaluation de la conformité"
  1:
    prefix: "Article 51"
    title: "Classification des dispositifs"
    1_prefix: "51.1"
    1_label: "Les dispositifs sont répartis en classe I, classe IIa, classe IIb et classe III en fonction de la destination des dispositifs et des risques qui leur sont inhérents. La classification est effectuée conformément à l'annexe VIII."
    2_prefix: "51.2"
    2_desc: "Tout litige entre le fabricant et l'organisme notifié concerné résultant de l'application de l'annexe VIII est soumis pour décision à l'autorité compétente de l'État membre dans lequel le fabricant a son siège social. Lorsque le fabricant ne dispose pas d'un siège social dans l'Union et n'a pas encore désigné de mandataire, l'affaire est portée devant l'autorité compétente de l'État membre dans lequel le mandataire visé à l'annexe IX, section 2.2, deuxième alinéa, point b), dernier tiret, a son siège social. Lorsque l'organisme notifié concerné est établi dans un État membre autre que celui du fabricant, l'autorité compétente arrête sa décision après avoir consulté l'autorité compétente de l'État membre qui a désigné l'organisme notifié. \n\n L'autorité compétente de l'État membre où le fabricant a son siège notifie sa décision au GCDM et à la Commission. La décision est communiquée sur demande."
    3_prefix: "51.3"
    3_label: "À la demande d'un État membre, la Commission, après avoir consulté le GCDM, statue, au moyen d'actes d'exécution, sur les éléments suivants:"
    3_desc: "\ta. l'application de l'annexe VIII à un dispositif donnée ou à une catégorie ou un groupe de dispositifs en vue de déterminer la classification des dispositifs en question; \n\tb. la reclassification d'un dispositif ou d'une catégorie ou d'un groupe de dispositifs pour des raisons de santé publique fondées sur de nouvelles données scientifiques, ou sur toute information devenant disponible au cours des activités de vigilance et de surveillance du marché, par dérogation à l'annexe VIII."
    4_prefix: "51.4"
    4_label: "La Commission peut aussi, de sa propre initiative et après avoir consulté le GCDM, statuer, au moyen d'actes d'exécution, sur les questions visées au paragraphe 3, points a) et b)."
    5_prefix: "51.5"
    5_label: "Afin d'assurer l'application uniforme de l'annexe VIII, et compte tenu des avis scientifiques pertinents des comités scientifiques concernés, la Commission peut adopter des actes d'exécution dans la mesure nécessaire pour résoudre les problèmes liés à des différences d'interprétation et à l'application pratique."
    6_prefix: "51.6"
    6_label: "Les actes d'exécution visés aux paragraphes 3, 4 et 5 du présent article sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3."
  2:
    prefix: "Article 52"
    title: "Procédures d'évaluation de la conformité"
    1_prefix: "52.1"
    1_label: "Avant la mise sur le marché d'un dispositif, les fabricants en évaluent la conformité, conformément aux procédures d'évaluation de la conformité applicables, définies aux annexes IX à XI."
    2_prefix: "52.2"
    2_label: "Avant la mise en service d'un dispositif qui n'est pas mis sur le marché, les fabricants en évaluent la conformité, conformément aux procédures d'évaluation de la conformité applicables, définies aux annexes IX à XI."
    3_prefix: "52.3"
    3_label: "Les fabricants de dispositifs de classe III, autres que des dispositifs sur mesure ou les dispositifs faisant l'objet d'une investigation, sont soumis à une procédure d'évaluation de la conformité conformément à l'annexe IX. Le fabricant peut aussi choisir de réaliser une évaluation de la conformité conformément à l'annexe X, conjuguée à une évaluation de la conformité conformément à l'annexe XI."
    4_prefix: "52.3"
    4_desc: "Les fabricants de dispositifs de classe IIb, autres que des dispositifs sur mesure ou les dispositifs faisant l'objet d'une investigation, sont soumis à une procédure d'évaluation de la conformité conformément à l'annexe IX, chapitres I et III, avec évaluation de la documentation technique visée à la section 4 de ladite annexe concernant au moins un dispositif représentatif par groupe générique de dispositifs. \n\n Toutefois, pour les dispositifs implantables de classe IIb, à l'exception des sutures, agrafes, produits d'obturation dentaire, appareils orthodontiques, couronnes dentaires, vis, cales, plaques, guides, broches, clips et dispositifs de connexion, l'évaluation de la documentation technique conformément à l'annexe IX, section 4, est réalisée pour chaque dispositif. \n\n Le fabricant peut aussi choisir de réaliser une évaluation de la conformité sur la base de l'examen de type conformément à l'annexe X, conjuguée à une évaluation de la conformité sur la base d'une vérification de la conformité du produit conformément à l'annexe XI."
    5_prefix: "52.4"
    5_desc: "Lorsque cela est justifié par l'utilisation, dans d'autres dispositifs implantables de classe IIb, de technologies éprouvées similaires à celles utilisées dans les dispositifs exemptés énumérés au paragraphe 4, deuxième alinéa, du présent article, ou afin de protéger la santé et la sécurité des patients, des utilisateurs ou d'autres personnes ou encore compte tenu d'autres aspects de la santé publique, la Commission est habilitée à adopter des actes délégués conformément à l'article 115 pour modifier ladite liste, en y ajoutant ou en en retirant d'autres types de dispositifs implantables de classe IIb."
    6_prefix: "52.5"
    6_desc: "Les fabricants de dispositifs de classe IIa, autres que des dispositifs sur mesure ou les dispositifs faisant l'objet d'une investigation, sont soumis à une procédure d'évaluation de la conformité conformément à l'annexe IX, chapitres I et III, avec évaluation de la documentation technique visée à la section 4 de ladite annexe concernant au moins un dispositif représentatif pour chaque catégorie de dispositifs. \n\n Le fabricant peut aussi choisir d'établir la documentation technique prévue aux annexes II et III, associée à une évaluation de la conformité conformément à l'annexe XI, section 10 ou 18. L'évaluation de la documentation technique s'applique pour au moins un dispositif représentatif pour chaque catégorie de dispositifs."
    7_prefix: "52.6"
    7_desc: "Les fabricants de dispositifs de classe I, autres que des dispositifs sur mesure ou les dispositifs faisant l'objet d'une investigation, attestent la conformité de leurs produits en établissant la déclaration de conformité UE visée à l'article 19, après avoir établi la documentation technique prévue aux annexes II et III. Si ces dispositifs sont mis sur le marché à l'état stérile, ont une fonction de mesurage ou sont des instruments chirurgicaux réutilisables, le fabricant applique les procédures prévues à l'annexe IX, chapitres I et III, ou à l'annexe XI, partie A. L'intervention de l'organisme notifié dans le cadre de ces procédures se limite toutefois: \n\ta. dans le cas des dispositifs mis sur le marché à l'état stérile, aux aspects liés à l'obtention, à la préservation et au maintien de cet état \n\tb. dans le cas des dispositifs ayant une fonction de mesurage, aux aspects liés à la conformité des dispositifs aux exigences métrologiques \n\tc. dans le cas des instruments chirurgicaux réutilisables, aux aspects liés à la réutilisation du dispositif, en particulier le nettoyage, la désinfection, la stérilisation, la maintenance et l'essai de fonctionnement, ainsi que la notice d'utilisation correspondante."
    8_prefix: "52.7"
    8_desc: "Les fabricants de dispositifs sur mesure appliquent la procédure visée à l'annexe XIII et établissent, avant la mise sur le marché des dispositifs concernés, la déclaration figurant à la section 1 de ladite annexe. \n\n Outre la procédure applicable en vertu du premier alinéa, les fabricants de dispositifs sur mesure implantables de classe III sont également soumis à la procédure d'évaluation de la conformité conformément à l'annexe IX, chapitre I. Le fabricant peut aussi choisir d'appliquer une procédure d'évaluation de la conformité conformément à l'annexe XI, partie A."
    9_prefix: "52.8"
    9_label: "Outre les procédures applicables conformément au paragraphe 3, 4, 6 ou 7 du présent article, dans le cas des dispositifs visés à l'article 1er, paragraphe 8, premier alinéa, la procédure établie à l'annexe IX, section 5.2, ou à l'annexe X, section 6, selon le cas, s'applique également."
    10_prefix: "52.9"
    10_label: "Outre les procédures applicables conformément au paragraphe 3, 4, 6, ou 7 du présent article, dans le cas des dispositifs relevant du présent règlement en vertu de l'article 1er, paragraphe 6, point f) ou g), et de l'article 1er, paragraphe 10, la procédure établie à l'annexe IX, section 5.3, ou à l'annexe X, section 6, selon le cas, s'applique également."
    11_prefix: "52.10"
    11_desc: "Outre les procédures applicables conformément au paragraphe 3, 4, 6 ou 7, dans le cas des dispositifs qui sont composés de substances ou de combinaisons de substances qui sont destinées à être introduites dans le corps humain par un orifice du corps ou par application sur la peau et qui sont absorbées par le corps humain ou dispersées localement dans celui-ci, la procédure établie à l'annexe IX, section 5.4, ou à l'annexe X, section 6, selon le cas, s'applique également."
    12_prefix: "52.11"
    12_desc: "L'État membre d'établissement de l'organisme notifié peut exiger que tout ou partie des documents, notamment la documentation technique et les rapports d'audit, d'évaluation et d'inspection, relatifs aux procédures visées aux paragraphes 1 à 7 et 9 à 11 soient mis à disposition dans une ou des langues officielles de l'Union définies par l'État membre en question. En l'absence d'une telle exigence, ces documents sont disponibles dans toute langue officielle de l'Union acceptée par l'organisme notifié."
    13_prefix: "52.12"
    13_label: "Les dispositifs faisant l'objet d'une investigation sont soumis aux exigences énoncées aux articles 62 à 81."
    14_prefix: "52.13"
    14_label: "La Commission peut, au moyen d'actes d'exécution, préciser les modalités et les aspects procéduraux en vue de l'application harmonisée des procédures d'évaluation de la conformité par les organismes notifiés concernant les points suivants:"
    14_desc: "\ta. la fréquence et la base d'échantillonnage pour l'évaluation d'un échantillon représentatif de la documentation technique, conformément à l'annexe IX, section 2.3, troisième alinéa, et section 3.5, pour les dispositifs des classes IIa et IIb, et à l'annexe XI, section 10.2 pour les dispositifs de classe IIa; \n\tb. la fréquence minimale des audits sur place inopinés et des essais pratiqués sur les échantillons par les organismes notifiés conformément à l'annexe IX, section 3.4, compte tenu de la classe de risque et du type de dispositif; \n\tc. les essais physiques, les essais en laboratoire et les autres essais devant être réalisés par les organismes notifiés dans le contexte des essais sur les échantillons, de l'évaluation de la documentation technique et de l'examen de type, conformément à l'annexe IX, sections 3.4 et 4.3, à l'annexe X, section 3, et à l'annexe XI, section 15. \n\n Les actes d'exécution visés au premier alinéa sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3."
  3:
    prefix: "Article 53"
    title: "Intervention des organismes notifiés dans les procédures d'évaluation de la conformité"
    1_prefix: "53.1"
    1_label: "Lorsque la procédure d'évaluation de la conformité prévoit l'intervention d'un organisme notifié, le fabricant peut introduire une demande auprès de l'organisme notifié de son choix, à condition que l'organisme notifié choisi soit désigné pour réaliser les activités d'évaluation de la conformité liées aux types de dispositifs concernés. Le fabricant ne peut introduire une demande en parallèle auprès d'un autre organisme notifié pour la même procédure d'évaluation de la conformité."
    2_prefix: "53.2"
    2_label: "L'organisme notifié concerné informe, via le système électronique visé à l'article 57, les autres organismes notifiés lorsqu'un fabricant retire sa demande avant que ledit organisme ne soit parvenu à une décision dans le cadre de l'évaluation de la conformité."
    3_prefix: "53.3"
    3_label: "Lorsqu'ils introduisent une demande auprès d'un organisme notifié comme indiqué au paragraphe 1, les fabricants déclarent s'ils ont retiré une demande introduite auprès d'un autre organisme notifié avant que ledit organisme ne soit parvenu à une décision et communiquent des informations sur toute demande antérieure concernant la même évaluation de la conformité qui a été refusée par un autre organisme notifié."
    4_prefix: "53.4"
    4_label: "L'organisme notifié peut exiger du fabricant toute information ou donnée nécessaire au bon déroulement de la procédure d'évaluation de la conformité retenue."
    5_prefix: "53.5"
    5_desc: "Les organismes notifiés et leur personnel accomplissent les activités d'évaluation de la conformité avec toute l'intégrité professionnelle et la compétence technique et scientifique requises dans le domaine concerné et ne sont soumis à aucune pression ni incitation, notamment d'ordre financier, susceptibles d'influencer leur jugement ou les résultats de leurs activités d'évaluation de la conformité, en particulier de la part de personnes ou de groupes de personnes ayant un intérêt dans les résultats de ces activités."
  4:
    prefix: "Article 54"
    title: "Procédure de consultation dans le cadre de l'évaluation clinique pour certains dispositifs des classes IIb et III"
    1_prefix: "54.1"
    1_label: "Outre les procédures applicables au titre de l'article 52, un organisme notifié suit la procédure de consultation dans le cadre de l'évaluation clinique visée à l'annexe IX, section 5.1, ou à l'annexe X, section 6, selon le cas, lorsqu'il procède à l'évaluation de la conformité des dispositifs suivants:"
    1_desc: "\ta. dispositifs implantables de classe III; et \n\tb. dispositifs actifs de classe IIb destinés à administrer dans l'organisme et/ou à retirer de l'organisme un médicament, tels qu'ils sont visés à l'annexe VIII, section 6.4 (règle 12)."
    2_prefix: "54.2"
    2_label: "La procédure visée au paragraphe 1 n'est pas requise pour les dispositifs qui y figurent:"
    2_desc: "\ta. en cas de renouvellement du certificat délivré au titre du présent règlement; \n\tb. lorsque le dispositif a été conçu en modifiant un dispositif déjà commercialisé par le même fabricant pour la même destination pour autant que le fabricant ait démontré, à la satisfaction de l'organisme notifié, que les modifications n'ont pas d'incidence négative sur le rapport bénéfice/risque du dispositif; ou \n\tc. lorsque les principes de l'évaluation clinique pour le type ou la catégorie du dispositif font l'objet de spécifications communes visées à l'article 9 et que l'organisme notifié confirme que l'évaluation clinique établie par le fabricant pour ce dispositif est conforme à la spécification commune pertinente pour l'évaluation clinique de ce type de dispositif."
    3_prefix: "54.3"
    3_label: "L'organisme notifié informe les autorités compétentes, les autorités responsables des organismes notifiés et la Commission via le système électronique visé à l'article 57 de la nécessité ou non d'appliquer la procédure visée au paragraphe 1 du présent article. Cette notification s'accompagne du rapport d'évaluation sur l'évaluation clinique."
    4_prefix: "54.4"
    4_desc: "La Commission établit un relevé annuel des dispositifs qui ont fait l'objet de la procédure visée à l'annexe IX, section 5.1, et à l'annexe X, section 6. Le relevé annuel comprend les notifications conformément au paragraphe 3 du présent article et à l'annexe IX, section 5.1, point e), et une liste des cas dans lesquels l'organisme notifié n'a pas suivi l'avis du groupe d'experts. La Commission soumet ce relevé au Parlement européen, au Conseil et au GCDM."
    5_prefix: "54.5"
    5_label: "La Commission établit au plus tard le 27 mai 2025 un rapport sur l'exécution du présent article, qu'elle soumet au Parlement européen et au Conseil. Le rapport tient compte des relevés annuels et de toute recommandation pertinente émanant du GCDM. Sur la base de ce rapport, la Commission fait, le cas échéant, des propositions de modifications du présent règlement."
  5:
    prefix: "Article 55"
    title: "Mécanisme de contrôle des évaluations de la conformité de certains dispositifs des classes IIb et III"
    1_prefix: "55.1"
    1_desc: "Un organisme notifié informe les autorités compétentes des certificats qu'il a délivrés pour des dispositifs dont l'évaluation de la conformité a été réalisée conformément à l'article 54, paragraphe 1. Cette notification est effectuée via le système électronique visé à l'article 57 et est accompagnée du résumé des caractéristiques de sécurité et des performances cliniques en vertu de l'article 32, du rapport d'évaluation de l'organisme notifié, de la notice d'utilisation visée à l'annexe I, section 23.4, et, le cas échéant, de l'avis scientifique des groupes d'experts visés à l'annexe IX, section 5.1, ou à l'annexe X, section 6, selon le cas. En cas de divergence d'opinions entre l'organisme notifié et les groupes d'experts, une justification complète est également fournie."
    2_prefix: "55.2"
    2_label: "Une autorité compétente et, le cas échéant, la Commission peut, pour des motifs de préoccupation raisonnables, appliquer d'autres procédures conformément aux articles 44, 45, 46, 47 ou 94 et, si nécessaire, prendre des mesures appropriées conformément aux articles 95 et 97."
    3_prefix: "55.3"
    3_label: "Le GCDM et, le cas échéant, la Commission, peut, pour des motifs de préoccupation raisonnables, demander un avis scientifique aux groupes d'experts en ce qui concerne la sécurité et les performances de tout dispositif."
  6:
    prefix: "Article 56"
    title: "Certificats de conformité"
    1_prefix: "56.1"
    1_label: "Les certificats délivrés par les organismes notifiés conformément aux annexes IX, X et XI sont établis dans une langue officielle de l'Union déterminée par l'État membre où l'organisme notifié est établi ou, à défaut, dans une langue officielle de l'Union acceptée par l'organisme notifié. Le contenu minimal des certificats est établi à l'annexe XII."
    2_prefix: "56.2"
    2_desc: "Les certificats sont valables pendant la période indiquée sur ceux-ci, qui n'excède pas cinq ans. À la demande du fabricant, la durée de validité du certificat peut être prolongée d'une durée maximale de cinq ans à chaque fois, sur la base d'une nouvelle évaluation suivant les procédures d'évaluation de la conformité applicables. Tout document complémentaire à un certificat est valable aussi longtemps que l'est le certificat qu'il complète."
    3_prefix: "56.3"
    3_label: "Les organismes notifiés peuvent imposer à certains groupes de patients des restrictions à la destination d'un dispositif ou exiger des fabricants qu'ils entreprennent des études spécifiques de SCAC conformément à l'annexe XIV, partie B."
    4_prefix: "56.4"
    4_desc: "Lorsqu'un organisme notifié constate que les exigences énoncées par le présent règlement ne sont plus respectées par le fabricant, il suspend ou annule le certificat délivré ou l'assortit de restrictions, en tenant compte du principe de proportionnalité, sauf si le fabricant applique, en vue du respect de ces exigences, des mesures correctives appropriées dans le délai imparti à cet effet par l'organisme notifié. L'organisme notifié motive sa décision."
    5_prefix: "56.5"
    5_label: "L'organisme notifié introduit dans le système électronique visé à l'article 57 les informations concernant les certificats délivrés et les modifications et documents complémentaires y afférents, ainsi que les certificats suspendus, rétablis, annulés ou refusés et les certificats assortis de restrictions. Ces informations sont accessibles au public."
    6_prefix: "56.6"
    6_label: "La Commission est habilitée à adopter des actes délégués conformément à l'article 115 pour modifier, eu égard aux progrès techniques, le contenu minimal des certificats exposés à l'annexe XII."
  7:
    prefix: "Article 57"
    title: "Système électronique relatif aux organismes notifiés et aux certificats de conformité"
    1_prefix: "57.1"
    1_label: "La Commission, après avoir consulté le GCDM, établit et gère un système électronique de collecte et de traitement des informations suivantes:"
    1_desc: "\ta. la liste des filiales visée à l'article 37, paragraphe 3; \n\tb. la liste des experts visée à l'article 40, paragraphe 2; \n\tc. les informations concernant la notification visée à l'article 42, paragraphe 10, et les notifications modifiées visées à l'article 46, paragraphe 2; \n\td. la liste des organismes notifiés visée à l'article 43, paragraphe 2; \n\te. le résumé du rapport visé à l'article 44, paragraphe 12; \n\tf. les notifications relatives aux évaluations de la conformité et aux certificats visées à l'article 54, paragraphe 3, et à l'article 55, paragraphe 1; \n\tg. le retrait ou les refus de demandes de certificats visés à l'article 53, paragraphe 2, et à l'annexe VII, section 4.3; \n\th. les informations concernant les certificats visées à l'article 56, paragraphe 5; \n\ti. le résumé des caractéristiques de sécurité et des performances visé à l'article 32."
    2_prefix: "57.2"
    2_label: "Les informations collectées et traitées par le système électronique sont accessibles aux autorités compétentes des États membres, à la Commission, le cas échéant aux organismes notifiés et, lorsque le présent règlement ou le règlement (UE) 2017/746 le prévoit, au public."
  8:
    prefix: "Article 58"
    title: "Changement volontaire d'organisme notifié"
    1_prefix: "58.1"
    1_label: "Lorsqu'un fabricant résilie le contrat qui le lie à un organisme notifié et en conclut un nouveau avec un autre organisme notifié pour l'évaluation de la conformité d'un même dispositif, les modalités du changement d'organisme notifié sont clairement établies dans un accord entre le fabricant, le nouvel organisme notifié et, si possible, l'organisme notifié sortant. Cet accord porte au moins sur les points suivants:"
    1_desc: "\ta. la date d'invalidation des certificats délivrés par l'organisme notifié sortant; \n\tb. la date jusqu'à laquelle le numéro d'identification de l'organisme notifié sortant peut figurer dans les informations fournies par le fabricant, y compris sur tout support publicitaire; \n\tc. les modalités de transfert des documents, y compris les questions de confidentialité et de droits de propriété; \n\td. la date après laquelle le nouvel organisme notifié assume les tâches d'évaluation de la conformité de l'organisme notifié sortant; \n\te. le dernier numéro de série ou numéro de lot dont l'organisme notifié sortant assume la responsabilité."
    2_prefix: "58.2"
    2_label: "L'organisme notifié sortant retire les certificats qu'il a délivrés pour le dispositif concerné à la date d'invalidation fixée."
  9:
    prefix: "Article 59"
    title: "Dérogation aux procédures d'évaluation de la conformité"
    1_prefix: "59.1"
    1_label: "Par dérogation à l'article 52, toute autorité compétente peut, sur demande dûment justifiée, autoriser la mise sur le marché ou la mise en service, sur le territoire de l'État membre concerné, d'un dispositif donné pour lequel les procédures visées à l'article en question n'ont pas été appliquées mais dont l'utilisation est dans l'intérêt de la santé publique ou de la sécurité ou de la santé des patients."
    2_prefix: "59.2"
    2_label: "L'État membre informe la Commission et les autres États membres de toute décision d'autorisation de mise sur le marché ou de mise en service d'un dispositif en application du paragraphe 1, dès lors que cette autorisation est accordée pour une utilisation concernant plus d'un patient."
    3_prefix: "59.3"
    3_desc: "Après avoir été informée comme le prévoit le paragraphe 2 du présent article, la Commission, dans des cas exceptionnels liés à la santé publique ou à la sécurité ou la santé des patients peut, au moyen d'actes d'exécution, étendre pour une durée limitée la validité d'une autorisation accordée par un État membre en application du paragraphe 1 du présent article au territoire de l'Union et définir les conditions de mise sur le marché ou de mise en service du dispositif concerné. Ces actes d'exécution sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3. \n\n Pour des raisons d'urgence impérieuses dûment justifiées liées à la santé et à la sécurité des personnes, la Commission adopte des actes d'exécution immédiatement applicables en conformité avec la procédure visée à l'article 114, paragraphe 4."
  10:
    prefix: "Article 60"
    title: "Certificat de libre vente"
    1_prefix: "60.1"
    1_desc: "À des fins d'exportation et à la demande d'un fabricant ou d'un mandataire, l'État membre dans lequel le fabricant ou le mandataire a son siège social délivre un certificat de libre vente attestant que le fabricant ou le mandataire, selon le cas, a son siège sur son territoire et que le dispositif en question muni du marquage CE conformément au présent règlement peut être commercialisé dans l'Union. Le certificat de libre vente comporte l'IUD-ID de base du dispositif tel qu'il a été transmis à la base de données IUD en application de l'article 29. Lorsqu'un organisme notifié a délivré un certificat conformément à l'article 56, le certificat de libre vente comporte le numéro unique permettant d'identifier le certificat délivré par l'organisme notifié, conformément à l'annexe XII, chapitre II, section 3."
    2_prefix: "60.2"
    2_label: "La Commission peut, au moyen d'actes d'exécution, établir un modèle pour les certificats de libre vente, en tenant compte des pratiques internationales relatives à l'utilisation de tels certificats. Ces actes d'exécution sont adoptés en conformité avec la procédure consultative visée à l'article 114, paragraphe 2."
6:
  prefix: "Chapitre VI"
  title: "Évaluation clinique et investigations cliniques"
  1:
    prefix: "Article 61"
    title: "Évaluation clinique"
    1_prefix: "61.1"
    1_desc: "La confirmation de la conformité aux exigences générales pertinentes en matière de sécurité et de performances énoncées à l'annexe I dans des conditions normales d'utilisation d'un dispositif, ainsi que l'évaluation des effets secondaires indésirables et du caractère acceptable du rapport bénéfice/risque visé à l'annexe I, sections 1 et 8, sont fondées sur des données cliniques apportant une preuve clinique suffisante, notamment, le cas échéant, les données pertinentes visées à l'annexe III. \n\n Le fabricant précise et justifie le niveau de preuve clinique nécessaire pour démontrer la conformité aux exigences générales pertinentes en matière de sécurité et de performances. Ce niveau de preuve clinique est approprié, eu égard aux caractéristiques du dispositif et à sa destination. \n\n À cet effet, les fabricants planifient, réalisent et documentent une évaluation clinique conformément au présent article et à l'annexe XIV, partie A."
    2_prefix: "61.2"
    2_desc: "Pour tous les dispositifs de classe III et pour les dispositifs de classe IIb visés à l'article 54, paragraphe 1, point b), le fabricant peut, avant d'effectuer son évaluation clinique et/ou son investigation clinique, consulter un groupe d'experts visé à l'article 106, dans le but d'examiner la stratégie de développement clinique prévue par le fabricant et les propositions d'investigation clinique. Le fabricant tient dûment compte des avis exprimés par le groupe d'experts. Cette prise en compte est documentée dans le rapport sur l'évaluation clinique visé au paragraphe 12 du présent article. \n\n Le fabricant ne peut faire valoir aucun droit par rapport aux points de vue exprimés par le groupe d'experts en ce qui concerne toute future procédure d'évaluation de la conformité."
    3_prefix: "61.3"
    3_label: "Une évaluation clinique suit une procédure définie et méthodologiquement fondée sur:"
    3_desc: "\ta. une évaluation critique des publications scientifiques pertinentes actuellement disponibles concernant la sécurité, les performances, les caractéristiques de conception et la destination du dispositif, à condition que: \n\t\t— l'équivalence du dispositif faisant l'objet de l'évaluation clinique, en ce qui concerne la destination, et du dispositif auquel se rapportent les données soit démontrée, conformément à l'annexe XIV, section 3, et \n\t\t— le respect des exigences générales pertinentes en matière de sécurité et de performances soit dûment établi; \n\tb. une évaluation critique des résultats de toutes les investigations cliniques disponibles, en tenant dûment compte de la question de savoir si les investigations ont été conduites au titre des articles 62 à 80, de tout acte adopté en vertu de l'article 81 et de l'annexe XV; et \n\tc. la prise en compte des alternatives de traitement actuellement disponibles à cette fin, s'il en existe."
    4_prefix: "61.4"
    4_label: "Dans le cas des dispositifs implantables et des dispositifs de classe III, des investigations cliniques sont conduites, sauf si:"
    4_desc: "\t— le dispositif a été conçu en modifiant un dispositif déjà commercialisé par le même fabricant, \n\t— le fabricant a démontré que le dispositif modifié est équivalent au dispositif commercialisé, conformément à l'annexe XIV, section 3, et cette démonstration a été approuvée par l'organisme notifié, et \n\t— l'évaluation clinique du dispositif commercialisé suffit à démontrer la conformité du dispositif modifié avec les exigences pertinentes en matière de sécurité et de performances. \n\n Dans ce cas, l'organisme notifié vérifie que le plan de SCAC est approprié et inclut des études après commercialisation pour démontrer la sécurité et les performances du dispositif. \n\n Par ailleurs, il n'y a pas lieu de conduire des investigations cliniques dans les cas visés au paragraphe 6."
    5_prefix: "61.5"
    5_label: "Le fabricant d'un dispositif pour lequel il a été démontré qu'il est équivalent à un dispositif déjà commercialisé et non fabriqué par lui, peut également se fonder sur le paragraphe 4 pour ne pas conduire d'investigation clinique, pour autant que les conditions suivantes soient remplies en plus de ce qui est exigé audit paragraphe:"
    5_desc: "\t— les deux fabricants ont conclu un contrat qui accorde explicitement au fabricant du second dispositif un accès total et permanent à la documentation technique, et \n\t— l'évaluation clinique d'origine a été effectuée conformément aux exigences du présent règlement, et le fabricant du second dispositif en apporte la preuve manifeste à l'organisme notifié."
    6_prefix: "61.6"
    6_label: "L'obligation de conduire des investigations cliniques en vertu du paragraphe 4 ne s'applique pas aux dispositifs implantables et aux dispositifs de classe III:"
    6_desc: "\ta. qui ont été légalement mis sur le marché ou mis en service conformément à la directive 90/385/CEE ou à la directive 93/42/CEE et pour lesquels l'évaluation clinique: \n\t\t— est fondée sur des données cliniques suffisantes, et \n\t\t— est conforme à la spécification commune par produit qui est applicable pour l'évaluation clinique de ce type de dispositif, lorsqu'il en existe une; ou \n\tb. qui sont des sutures, agrafes, produits d'obturation dentaire, appareils orthodontiques, couronnes dentaires, vis, cales, plaques, guides, broches, clips ou dispositifs de connexion et pour lesquels l'évaluation clinique est fondée sur des données cliniques suffisantes et est conforme à la spécification commune par produit qui est applicable, lorsqu'il en existe une."
    7_prefix: "61.7"
    7_label: "Les cas dans lesquels le paragraphe 4 n'est pas appliqué en vertu du paragraphe 6 sont justifiés par le fabricant dans le rapport sur l'évaluation clinique et par l'organisme notifié dans le rapport d'évaluation sur l'évaluation clinique."
    8_prefix: "61.8"
    8_desc: "Lorsque cela est justifié par l'utilisation, dans d'autres dispositifs, de technologies éprouvées similaires à celles utilisées dans les dispositifs exemptés énumérés au paragraphe 6, point b), du présent article, ou afin de protéger la santé et la sécurité des patients, des utilisateurs ou d'autres personnes ou encore compte tenu d'autres aspects de la santé publique, la Commission est habilitée à adopter des actes délégués conformément à l'article 115 pour modifier la liste des dispositifs exemptés visés à l'article 52, paragraphe 4, deuxième alinéa, et au paragraphe 6, point b), du présent article, en y ajoutant ou en en retirant d'autres types de dispositifs implantables ou de classe III."
    9_prefix: "61.9"
    9_desc: "Dans le cas des produits n'ayant pas de destination médicale prévue énumérés à l'annexe XVI, l'obligation de démontrer l'existence d'un bénéfice clinique conformément au présent chapitre et aux annexes XIV et XV s'entend comme une obligation de démontrer la performance du dispositif. Les évaluations cliniques de ces produits sont fondées sur des données pertinentes concernant la sécurité, y compris des données issues de la surveillance après commercialisation, du SCAC, et, le cas échéant, d'investigations cliniques spécifiques. Des investigations cliniques sont conduites pour ces produits, sauf si la prise en compte des données cliniques existantes provenant d'un dispositif médical analogue est dûment justifiée."
    10_prefix: "61.10"
    10_desc: "Sans préjudice du paragraphe 4, lorsque la conformité aux exigences générales en matière de sécurité et de performances est considérée comme n'ayant pas été démontrée de manière satisfaisante par des données cliniques, une justification appropriée est fournie pour tout cas exceptionnel de ce type sur la base des résultats de la gestion des risques par le fabricant et de l'examen des données détaillées relatives à l'interaction entre le dispositif et le corps humain, aux performances cliniques prévues et aux allégations du fabricant. Dans ce cas, le fabricant justifie dûment dans la documentation technique visée à l'annexe II pourquoi il juge adéquate une démonstration de la conformité aux exigences générales en matière de sécurité et de performances qui se fonde uniquement sur les résultats de méthodes d'essai non cliniques, comme l'évaluation des performances, les bancs d'essai et l'évaluation préclinique."
    11_prefix: "61.11"
    11_desc: "L'évaluation clinique et la documentation y afférente sont actualisées tout au long du cycle de vie du dispositif concerné à l'aide des données cliniques obtenues par le fabricant à la suite de l'application de son plan de SCAC conformément à l'annexe XIV, partie B, et de son plan de surveillance après commercialisation visé à l'article 84. \n\n Pour les dispositifs de classe III et les dispositifs implantables, le rapport d'évaluation du SCAC et, s'il y a lieu, le résumé des caractéristiques de sécurité et des performances cliniques visé à l'article 32, sont mis à jour au moins annuellement en y ajoutant les données en question."
    12_prefix: "61.12"
    12_label: "L'évaluation clinique, ses résultats et la preuve clinique qui en découle sont documentés dans le rapport sur l'évaluation clinique visé à l'annexe XIV, section 4, qui, sauf pour ce qui est des dispositifs sur mesure, fait partie de la documentation technique relative au dispositif concerné visée à l'annexe II."
    13_prefix: "61.13"
    13_label: "Si nécessaire afin d'assurer l'application uniforme de l'annexe XIV, la Commission peut, en tenant dûment compte des progrès techniques et scientifiques, adopter des actes d'exécution dans la mesure nécessaire pour résoudre les problèmes liés à des différences d'interprétation et à l'application pratique. Ces actes d'exécution sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3."
  2:
    prefix: "Article 62"
    title: "Exigences générales relatives aux investigations cliniques conduites pour établir la conformité des dispositifs"
    1_prefix: "62.1"
    1_label: "Les investigations cliniques sont conçues, autorisées, conduites, documentées et notifiées conformément aux dispositions du présent article et des articles 63 à 80, des actes adoptés en vertu de l'article 81, et de l'annexe XV lorsqu'elles sont effectuées, dans le cadre de l'évaluation clinique en vue de l'évaluation de la conformité, aux fins de l'un des objectifs suivants:"
    1_desc: "\n\ta. établir et vérifier que, dans des conditions normales d'utilisation, un dispositif est conçu, fabriqué et conditionné de manière à convenir à l'une ou plusieurs des fins énumérées à l'article 2, point 1), et qu'il atteint les performances prévues, telles qu'elles sont spécifiées par son fabricant; \n\tb. établir et vérifier les bénéfices cliniques d'un dispositif, tels qu'ils sont spécifiés par son fabricant; \n\tc. établir et vérifier la sécurité clinique du dispositif et détecter les éventuels effets secondaires indésirables dans des conditions normales d'utilisation du dispositif et évaluer si ceux-ci constituent un risque acceptable au regard des bénéfices attendus du dispositif concerné."
    2_prefix: "62.2"
    2_desc: "Lorsque le promoteur d'une investigation clinique n'est pas établi dans l'Union, il veille à ce qu'une personne physique ou morale y soit établie en qualité de représentant légal. Ce représentant légal est chargé de garantir le respect des obligations incombant au promoteur au titre du présent règlement et est le destinataire de toutes les communications adressées au promoteur conformément au présent règlement. Toute communication avec le représentant légal vaut communication avec le promoteur. \n\n Les États membres peuvent choisir de ne pas appliquer le premier alinéa en ce qui concerne les investigations cliniques devant être conduites uniquement sur leur territoire ou sur leur territoire et sur le territoire d'un pays tiers, à condition qu'ils s'assurent que le promoteur établit au moins une personne de contact sur leur territoire pour l'investigation clinique concernée, qui est le destinataire de toutes les communications adressées au promoteur conformément au présent règlement."
    3_prefix: "62.3"
    3_desc: "Les investigations cliniques sont conçues et conduites de manière à garantir la protection des droits, de la sécurité, de la dignité et du bien-être des personnes y participant, à faire prévaloir ces considérations sur toute autre et à garantir la validité scientifique, la fiabilité et la robustesse des données cliniques qu'elles génèrent. \n\n Les investigations cliniques font l'objet d'un examen scientifique et éthique. L'examen éthique est réalisé par un comité d'éthique conformément au droit national. Les États membres veillent à ce que les procédures pour l'examen effectué par les comités d'éthique soient compatibles avec les procédures établies dans le présent règlement en ce qui concerne l'évaluation de la demande d'autorisation d'une investigation clinique. Un profane au moins participe à l'examen éthique."
    4_prefix: "62.4"
    4_label: "Une investigation clinique visée au paragraphe 1 ne peut être conduite que si toutes les conditions suivantes sont remplies:"
    4_desc: "\ta. l'investigation clinique fait l'objet d'une autorisation par le ou les États membres dans lesquels elle doit être conduite, conformément au présent règlement, sauf dispositions contraires; \n\tb. un comité d'éthique, instauré conformément au droit national, n'a pas émis d'avis défavorable en rapport avec l'investigation clinique, qui soit valable pour l'ensemble de cet État membre en vertu de son droit national; \n\tc. le promoteur, ou son représentant légal ou une personne de contact au sens du paragraphe 2, est établi dans l'Union; \n\td. les populations et participants vulnérables bénéficient d'une protection appropriée, conformément aux articles 64 à 68; \n\te. les bénéfices attendus pour les participants ou la santé publique justifient les risques et inconvénients prévisibles et le respect de cette condition est contrôlé en permanence; \n\tf. le participant ou, s'il n'est pas en mesure de le faire, son représentant légal a donné son consentement éclairé conformément à l'article 63; \n\tg. le participant ou, s'il n'est pas en mesure de donner son consentement éclairé, son représentant légal a reçu les coordonnées d'une entité auprès de laquelle il peut recevoir de plus amples informations en cas de besoin; \n\th. les droits du participant à l'intégrité physique et mentale, au respect de la vie privée et à la protection des données le concernant conformément à la directive 95/46/CE sont préservés; \n\ti. l'investigation clinique a été conçue pour causer aussi peu de douleur, de désagrément et de peur que possible et pour réduire autant que possible tout autre risque prévisible pour les participants, et tant le seuil de risque que le degré d'angoisse sont définis expressément dans le protocole d'investigation clinique et contrôlés en permanence; \n\tj. les soins médicaux dispensés aux participants sont de la responsabilité d'un médecin dûment qualifié ou, le cas échéant, d'un dentiste qualifié ou de toute autre personne habilité par le droit national à dispenser les soins concernés aux patients dans des conditions d'investigation clinique; \n\tk. aucune contrainte, y compris de nature financière, n'est exercée sur le participant ou, le cas échéant, son représentant légal, pour qu'il participe à l'investigation clinique; \n\tl. le ou les dispositifs en question faisant l'objet d'une investigation respectent les exigences générales en matière de sécurité et de performances énoncées à l'annexe I, sauf pour ce qui est des aspects relevant de l'investigation clinique et, en ce qui concerne ces aspects, toutes les précautions ont été prises pour protéger la santé et la sécurité des participants. Il s'agit notamment, le cas échéant, de tests portant sur la sécurité biologique et technique et d'évaluation préclinique, ainsi que de dispositions dans le domaine de la sécurité au travail et de prévention des accidents, compte tenu de l'état de l'art; \n\tm. les exigences figurant à l'annexe XV sont respectées."
    5_prefix: "62.5"
    5_desc: "Tout participant ou, s'il n'est pas en mesure de donner son consentement éclairé, son représentant légal, peut, sans encourir de préjudice et sans devoir se justifier, se retirer de l'investigation clinique à tout moment en révoquant son consentement éclairé. Sans préjudice de la directive 95/46/CE, le retrait du consentement éclairé n'a pas d'incidence sur les activités déjà menées ni sur l'utilisation des données obtenues sur la base du consentement éclairé avant que celui-ci ne soit retiré."
    6_prefix: "62.6"
    6_desc: "L'investigateur est une personne dont la profession donne le droit, dans l'État membre concerné, de jouer le rôle d'investigateur en raison des connaissances scientifiques et de l'expérience nécessaires dans le domaine des soins dispensés aux patients. Toute autre personne participant à la conduite d'une investigation clinique a le niveau d'études, la formation ou l'expérience appropriés dans la discipline médicale concernée et pour ce qui est de la méthodologie de recherche clinique pour accomplir les tâches qui lui incombent."
    7_prefix: "62.7"
    7_label: "Les installations dans lesquelles l'investigation clinique doit s'effectuer sont appropriées pour la conduite de l'investigation clinique et sont similaires à celles dans lesquelles le dispositif est destiné à être utilisé."
  3:
    prefix: "Article 63"
    title: "Consentement éclairé"
    1_prefix: "63.1"
    1_desc: "Le consentement éclairé est écrit, daté et signé par la personne qui effectue l'entretien visé au paragraphe 2, point c), et par le participant ou, si ce dernier n'est pas en mesure de donner son consentement éclairé, par son représentant légal après avoir été dûment informé conformément au paragraphe 2. Si le participant n'est pas en mesure d'écrire, son consentement peut être donné et documenté par d'autres moyens appropriés en présence d'au moins un témoin impartial. Dans ce cas, le témoin signe et date le document relatif au consentement éclairé. Le participant ou, s'il n'est pas en mesure de donner son consentement éclairé, son représentant légal se voit remettre une copie du document ou autre moyen de documentation, selon le cas, par lequel il a donné son consentement éclairé. Le consentement éclairé est documenté. Le participant ou son représentant légal dispose d'un temps de réflexion approprié pour réfléchir à sa décision de participer à l'investigation clinique."
    2_prefix: "63.2"
    2_label: "Les informations communiquées au participant ou, s'il n'est pas en mesure de donner son consentement éclairé, à son représentant légal pour obtenir son consentement éclairé:"
    2_desc: "\ta. permettent au participant ou à son représentant légal de comprendre: \n\t\ti. la nature, les objectifs, les avantages, les conséquences, les risques et les inconvénients de l'investigation clinique; \n\t\tii. les droits et garanties du participant concernant sa protection, en particulier son droit de refuser de participer à l'investigation clinique et son droit de s'en retirer à tout moment sans encourir de préjudice et sans devoir se justifier; \n\t\tiii. les conditions dans lesquelles l'investigation clinique doit avoir lieu, y compris la durée envisagée de la participation de l'intéressé à l'investigation clinique; et \n\t\tiv. les traitements alternatifs éventuels, y compris les mesures de suivi s'il est mis un terme à la participation de l'intéressé à l'investigation clinique; \n\tb. sont complètes, concises, claires, pertinentes et compréhensibles par l'intéressé ou son représentant légal; \n\tc. sont fournies lors d'un entretien préalable avec un membre de l'équipe d'investigateurs qui est dûment qualifié en vertu du droit national; \n\td. comprennent des informations sur le système d'indemnisation des dommages applicable, visé à l'article 69; et \n\te. comprennent le numéro d'identification unique, visé à l'article 70, paragraphe 1, valable dans l'ensemble de l'Union attribué à l'investigation clinique et des informations sur la disponibilité des résultats de l'investigation clinique, conformément au paragraphe 6 du présent article."
    3_prefix: "63.3"
    3_label: "Les informations visées au paragraphe 2 sont préparées par écrit et mises à la disposition du participant ou, s'il n'est pas en mesure de donner son consentement éclairé, de son représentant légal."
    4_prefix: "63.4"
    4_label: "Lors de de l'entretien visé au paragraphe 2, point c), une attention particulière est apportée aux besoins d'information des groupes spécifiques de patients et des participants individuels, ainsi qu'aux méthodes employées pour transmettre les informations."
    5_prefix: "63.5"
    5_label: "Lors de l'entretien visé au paragraphe 2, point c), il est vérifié que le participant a compris les informations."
    6_prefix: "63.6"
    6_desc: "Le participant est informé qu'un rapport sur l'investigation clinique et un résumé présenté en des termes compréhensibles pour l'utilisateur auquel le dispositif est destiné seront mis à disposition en application de l'article 77, paragraphe 5, dans le système électronique relatif aux investigations cliniques visé à l'article 73, quel que soit le résultat de l'investigation clinique, et est informé, dans la mesure du possible, au moment de leur mise à disposition."
    7_prefix: "63.7"
    7_label: "Le présent règlement s'applique sans préjudice de toute disposition du droit national prévoyant que, en plus du consentement éclairé donné par le représentant légal, un mineur en mesure de se forger une opinion et d'évaluer les informations qui lui sont données donne également son accord pour participer à une investigation clinique."
  4:
    prefix: "Article 64"
    title: "Investigations cliniques sur des participants incapables"
    1_prefix: "64.1"
    1_label: "Dans le cas de participants incapables qui n'ont pas donné leur consentement éclairé ou qui n'ont pas refusé de le faire avant la survenance de leur incapacité, une investigation clinique ne peut être conduite que si, outre les conditions prévues à l'article 62, paragraphe 4, toutes les conditions suivantes sont remplies:"
    1_desc: "\ta. le consentement éclairé de leur représentant légal a été obtenu; \n\tb. le participant incapable a reçu les informations visées à l'article 63, paragraphe 2, d'une manière adaptée au regard de leur capacité à les comprendre; \n\tc. le souhait explicite d'un participant incapable, en mesure de se forger une opinion et d'évaluer les informations visées à l'article 63, paragraphe 2, de refuser de participer à l'investigation clinique ou de s'en retirer à tout moment, est respecté par l'investigateur; \n\td. aucune incitation et aucun avantage financier ne sont offerts aux participants ou à leur représentant légal, hormis une compensation pour les frais et pertes de revenus directement liés à la participation à l'investigation clinique; \n\te. l'investigation clinique est essentielle en ce qui concerne les participants incapables et des données d'une validité comparable ne peuvent être obtenues lors d'investigations cliniques sur des personnes capables de donner leur consentement éclairé ou par d'autres méthodes de recherche; \n\tf. l'investigation clinique se rapporte directement à une affection dont est atteint le participant; \n\tg. il existe des raisons scientifiques de penser que la participation à l'investigation clinique entraînera pour le participant incapable un bénéfice direct supérieur aux risques et aux contraintes en jeu."
    2_prefix: "64.2"
    2_label: "Dans la mesure du possible, le participant prend part à la procédure de consentement éclairé."
  5_prefix: "Article 65"
  5_label: "Investigations cliniques sur des mineurs"
  5_desc: "Une investigation clinique ne peut être conduite sur des mineurs que si, outre les conditions prévues à l'article 62, paragraphe 4, toutes les conditions suivantes sont remplies: \n\ta. le consentement éclairé de leur représentant légal a été obtenu \n\tb. les mineurs ont reçu, de la part des investigateurs ou de membres de l'équipe d'investigateurs formés ou rompus au travail avec des enfants, les informations visées à l'article 63, paragraphe 2, d'une façon adaptée à leur âge et à leur maturité mentale \n\tc. le souhait explicite d'un participant mineur, en mesure de se forger une opinion et d'évaluer les informations visées à l'article 63, paragraphe 2, de refuser de participer à l'investigation clinique ou de s'en retirer à tout moment, est respecté par l'investigateur \n\td. aucune incitation et aucun avantage financier ne sont offerts au participant ou à son représentant légal, hormis une compensation pour les frais et pertes de revenus directement liés à la participation à l'investigation clinique \n\te. l'investigation clinique est destinée à étudier des traitements pour une affection qui ne touche que les mineurs ou l'investigation clinique est essentielle en ce qui concerne les mineurs pour valider les données obtenues lors d'investigations cliniques sur des personnes capables de donner leur consentement éclairé ou par d'autres méthodes de recherche \n\tf. l'investigation clinique se rapporte directement à une affection touchant le mineur concerné ou est d'une nature telle qu'elle ne peut être conduite que sur des mineurs \n\tg. il existe des raisons scientifiques de penser que la participation à l'investigation clinique entraînera pour le participant mineur un bénéfice direct supérieur aux risques et aux contraintes en jeu \n\th. le mineur participe à la procédure de consentement éclairé d'une façon adaptée à son âge et à sa maturité mentale \n\ti. si, au cours d'une investigation clinique, le mineur atteint l'âge auquel il est légalement habilité à donner son consentement éclairé tel qu'il est défini par le droit national, son consentement éclairé est obtenu avant que ce participant ne puisse poursuivre sa participation à l'investigation clinique."
  6_prefix: "Article 66"
  6_label: "Investigations cliniques sur des femmes enceintes ou allaitantes"
  6_desc: "Une investigation clinique ne peut être conduite sur des femmes enceintes ou allaitantes que si, outre les conditions prévues à l'article 62, paragraphe 4, toutes les conditions suivantes sont remplies: \n\ta. l'investigation clinique a le potentiel de produire un bénéfice direct pour la femme enceinte ou allaitante concernée ou pour son embryon, son fœtus ou l'enfant après sa naissance, supérieur aux risques et aux contraintes en jeu \n\tb. lorsque des recherches sont menées sur des femmes allaitantes, il convient de veiller en particulier à éviter tout effet indésirable sur la santé de l'enfant \n\tc. aucune incitation et aucun avantage financier ne sont offerts à la participante, hormis une compensation pour les frais et pertes de revenus directement liés à la participation à l'investigation clinique."
  7_prefix: "Article 67"
  7_label: "Mesures nationales supplémentaires"
  7_desc: "Les États membres peuvent maintenir des mesures supplémentaires concernant les personnes qui accomplissent un service militaire obligatoire, les personnes privées de liberté, les personnes qui, en raison d'une décision de justice, ne peuvent participer à des investigations cliniques ou les personnes placées dans des établissements d'hébergement et de soins."
  8:
    prefix: "Article 68"
    title: "Investigations cliniques en situation d'urgence"
    1_prefix: "68.1"
    1_desc: "Par dérogation à l'article 62, paragraphe 4, point f), à l'article 64, paragraphe 1, points a) et b), et à l'article 65, points a) et b), le consentement éclairé pour participer à une investigation clinique peut être obtenu et des informations sur l'investigation clinique peuvent être communiquées après la décision d'inclure le participant dans l'investigation clinique à condition que cette décision soit prise au moment de la première intervention sur le participant, conformément au protocole de cette investigation clinique, et que toutes les conditions suivantes soient remplies: \n\ta. en raison de l'urgence de la situation, causée par une affection soudaine qui met sa vie en danger ou par toute autre affection grave et soudaine, le participant n'est pas en mesure de donner son consentement éclairé préalable et de recevoir des informations préalables sur l'investigation clinique \n\tb. des raisons scientifiques donnent à penser que la participation à l'investigation clinique sera à même de produire un bénéfice direct pertinent sur le plan clinique pour le participant, entraînant une amélioration mesurable sur le plan médical, susceptible d'alléger les souffrances et/ou d'améliorer la santé du participant ou le diagnostic de son affection \n\tc. il est impossible, dans l'intervalle thérapeutique, de fournir toutes les informations préalables au représentant légal du participant et d'obtenir son consentement éclairé préalable \n\td. l'investigateur certifie qu'il n'a pas connaissance d'objections à la participation à l'investigation clinique préalablement exprimées par le participant \n\te. l'investigation clinique se rapporte directement à l'affection du participant en raison de laquelle il est impossible, dans l'intervalle thérapeutique, d'obtenir le consentement éclairé préalable du participant ou de son représentant légal et de communiquer des informations préalables, et l'investigation clinique est d'une nature telle qu'elle ne peut avoir lieu qu'en situation d'urgence \n\tf. l'investigation clinique comporte un risque minimal et impose une contrainte minimale pour le participant par rapport au traitement standard de l'affection dont il est atteint."
    2_prefix: "68.2"
    2_label: "À la suite d'une intervention conformément au paragraphe 1 du présent article, le consentement éclairé conformément à l'article 63 est sollicité pour poursuivre la participation de l'intéressé à l'investigation clinique et les informations sur l'investigation clinique sont communiquées conformément aux exigences suivantes:"
    2_desc: "\ta. en ce qui concerne les participants incapables et les mineurs, l'investigateur sollicite sans retard injustifié le consentement éclairé de leurs représentants désignés légalement et les informations visées à l'article 63, paragraphe 2, sont communiquées dans les plus brefs délais au participant et à son représentant légal; \n\tb. en ce qui concerne les autres participants, l'investigateur sollicite sans retard injustifié le consentement éclairé du participant ou de son représentant légal, selon ce qui peut être le plus rapide, et les informations visées à l'article 63, paragraphe 2, sont communiquées dans les plus brefs délais au participant ou à son représentant légal, selon le cas. \n\n Aux fins du point b), si le consentement éclairé a été obtenu auprès du représentant légal, il est obtenu, pour la poursuite de la participation à l'investigation clinique, auprès du participant dès que celui-ci est en mesure de donner un consentement éclairé."
    3_prefix: "68.3"
    3_label: "Si le participant ou, le cas échéant, son représentant légal ne donne pas son consentement, il est informé de son droit de s'opposer à l'utilisation des données recueillies dans le cadre de l'investigation clinique."
  9:
    prefix: "Article 69"
    title: "Compensation de dommages"
    1_prefix: "69.1"
    1_label: "Les États membres veillent à ce que des systèmes de compensation de tout dommage que subirait un participant en raison de sa participation à une investigation clinique conduite sur leur territoire soient en place sous la forme d'une assurance, d'une garantie ou de dispositions similaires, qui sont équivalentes pour ce qui est de leur finalité et adaptées à la nature et à l'ampleur du risque."
    2_prefix: "69.2"
    2_label: "Le promoteur et l'investigateur ont recours au système visé au paragraphe 1 sous la forme appropriée pour l'État membre dans lequel l'investigation clinique est conduite."
  10:
    prefix: "Article 70"
    title: "Demande relative aux investigations cliniques"
    1_prefix: "70.1"
    1_desc: "Le promoteur d'une investigation clinique introduit, auprès de l'État membre ou des États membres dans lesquels cette investigation clinique doit être conduite (ci-après dénommés «État membre concerné» aux fins du présent article), une demande accompagnée de la documentation visée à l'annexe XV, chapitre II \n\n La demande est introduite via le système électronique visé à l'article 73 qui génère, pour cette investigation clinique, un numéro d'identification unique valable dans l'ensemble de l'Union qui est utilisé pour toute communication ayant trait à cette investigation clinique. Dans un délai de dix jours suivant la réception de la demande, l'État membre concerné indique au promoteur si l'investigation clinique relève du champ d'application du présent règlement et si le dossier de demande est complet, conformément à l'annexe XV, chapitre II."
    2_prefix: "70.2"
    2_label: "Dans un délai d'une semaine suivant tout changement relatif à la documentation visée à l'annexe XV, chapitre II, le promoteur met à jour les données correspondantes dans le système électronique visé à l'article 73 et rend ce changement apporté à la documentation clairement identifiable. L'État membre concerné est informé de la mise à jour via ce système électronique."
    3_prefix: "70.3"
    3_desc: "Lorsque l'État membre concerné estime que l'investigation clinique pour laquelle une demande a été introduite ne relève pas du présent règlement ou que le dossier de demande est incomplet, il en informe le promoteur, qui dispose d'un délai maximal de dix jours pour formuler des observations ou compléter la demande via le système électronique visé à l'article 73. L'État membre concerné peut, le cas échéant, prolonger ce délai de vingt jours au maximum. \n\n Lorsque le promoteur ne formule pas d'observations ni ne complète la demande dans le délai visé au premier alinéa, la demande est réputée caduque. Lorsque le promoteur estime que la demande relève du présent règlement et/ou qu'elle est complète mais que l'État membre concerné n'est pas de cet avis, la demande est considérée comme rejetée. L'État membre concerné prévoit une procédure de recours pour un tel refus. \n\n L'État membre concerné indique au promoteur, dans un délai de cinq jours suivant la réception des observations ou des informations complémentaires demandées, si l'investigation clinique est réputée relever du présent règlement et si la demande est complète."
    4_prefix: "70.4"
    4_label: "L'État membre concerné peut également prolonger chacun des délais visés aux paragraphes 1 et 3 de cinq jours supplémentaires."
    5_prefix: "70.5"
    5_label: "Aux fins du présent chapitre, la date à laquelle le promoteur est informé conformément au paragraphe 1 ou 3 correspond à la date de validation de la demande. Lorsque le promoteur n'est pas informé, la date de validation correspond au dernier jour des délais visés aux paragraphes 1, 3 et 4 respectivement."
    6_prefix: "70.6"
    6_label: "Pendant la période au cours de laquelle la demande est évaluée, l'État membre peut demander des informations complémentaires au promoteur. Le délai visé au paragraphe 7, point b), cesse de courir entre la date de la première demande et la réception des informations complémentaires."
    7_prefix: "70.7"
    7_label: "Le promoteur peut débuter l'investigation clinique:"
    7_desc: "\ta. dans le cas de dispositifs de classe I faisant l'objet d'une investigation ou de dispositifs non invasifs de classe IIa et IIb, sauf dispositions contraires du droit national, immédiatement après la date de validation de la demande conformément au paragraphe 5 et pour autant que le comité d'éthique dans l'État membre concerné n'ait pas émis, concernant l'investigation clinique, d'avis défavorable valable pour l'ensemble de cet État membre conformément à son droit national; \n\tb. dans le cas de dispositifs faisant l'objet d'une investigation autres que ceux visés au point a), dès que l'État membre concerné a notifié son autorisation au promoteur et pour autant que le comité d'éthique dans l'État membre concerné n'ait pas émis, concernant l'investigation clinique, d'avis défavorable valable pour l'ensemble de cet État membre conformément à son droit national. L'État membre notifie l'autorisation au promoteur dans un délai de quarante-cinq jours suivant la date de validation visée au paragraphe 5. L'État membre peut prolonger ce délai de vingt jours supplémentaires aux fins de la consultation d'experts."
    8_prefix: "70.8"
    8_label: "La Commission est habilitée à adopter des actes délégués conformément à l'article 115 pour modifier, à la lumière du progrès technique et de l'évolution globale de la réglementation, les exigences énoncées à l'annexe XV, chapitre II."
    9_prefix: "70.9"
    9_label: "Afin d'assurer l'application uniforme des exigences énoncées à l'annexe XV, chapitre II, la Commission peut adopter des actes d'exécution, dans la mesure nécessaire pour résoudre les problèmes liés à des différences d'interprétation et à l'application pratique. Ces actes d'exécution sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3."
  11:
    prefix: "Article 71"
    title: "Évaluation par les États membres"
    1_prefix: "71.1"
    1_label: "Les États membres veillent à ce que les personnes chargées de valider et d'évaluer la demande, ou de statuer sur celle-ci, soient libres de conflits d'intérêts, soient indépendantes du promoteur, des investigateurs et des personnes physiques ou morales finançant l'investigation clinique, et soient libres de toute influence injustifiée."
    2_prefix: "71.2"
    2_label: "Les États membres veillent à ce que l'évaluation soit menée conjointement par un nombre de personnes approprié possédant collectivement les qualifications et l'expérience nécessaires."
    3_prefix: "71.3"
    3_label: "Les États membres évaluent si l'investigation clinique est conçue de telle manière que les risques résiduels potentiels pour les participants ou des tiers, après minimisation des risques, sont justifiés au regard des bénéfices cliniques escomptés. Tout en tenant compte des spécifications communes ou des normes harmonisées applicables, ils examinent en particulier:"
    3_desc: "\ta. s'il a été démontré que le ou les dispositifs faisant l'objet d'une investigation respectent les exigences générales applicables en matière de sécurité et de performances, sauf pour ce qui est des aspects relevant de l'investigation clinique, et si, en ce qui concerne ces aspects, toutes les précautions ont été prises pour protéger la santé et la sécurité des participants. Il s'agit notamment, le cas échéant, de s'assurer que les tests sur la sécurité technique et biologique et l'évaluation préclinique ont été réalisés; \n\tb. si les solutions retenues par le promoteur pour minimiser les risques sont décrites dans les normes harmonisées et, dans les cas où le promoteur n'applique pas de normes harmonisées, si les solutions visant à minimiser les risques assurent un niveau adéquat de protection équivalent à celui assuré par les normes harmonisées; \n\tc. si les mesures prévues pour assurer l'installation, la mise en service et la maintenance en toute sécurité du dispositif faisant l'objet d'une investigation sont appropriées; \n\td. la fiabilité et la robustesse des données issues de l'investigation clinique, au vu des modalités statistiques, de la conception de l'investigation et des aspects méthodologiques, y compris la taille de l'échantillon, le dispositif comparateur et les critères d'évaluation; \n\te. si les exigences figurant à l'annexe XV sont respectées; \n\t f. dans le cas de dispositifs destinés à être utilisés à l'état stérile, la preuve de la validation des procédures de stérilisation par le fabricant ou les informations concernant les procédures de reconditionnement et de stérilisation qui doivent être appliquées sur le site d'investigation; \n\tg. la preuve de la sécurité, de la qualité et de l'utilité de tout composant d'origine animale ou humaine ou de substances susceptibles d'être considérées comme des médicaments conformément à la directive 2001/83/CE."
    4_prefix: "71.4"
    4_label: "Les États membres refusent l'autorisation de l'investigation clinique:"
    4_desc: "\n\ta. si le dossier de demande introduit conformément à l'article 70, paragraphe 1, demeure incomplet; \n\tb. si le dispositif ou les documents fournis, en particulier le protocole d'investigation et la brochure pour l'investigateur, ne correspondent pas à l'état des connaissances scientifiques et si l'investigation clinique, notamment, n'est pas adaptée pour apporter la preuve de la sécurité ou des caractéristiques de performance du dispositif ou des bénéfices qu'il présente pour les intéressés ou les patients; \n\tc. si les exigences de l'article 62 ne sont pas respectées; ou \n\td. si toute évaluation effectuée en vertu du paragraphe 3 est négative. \n\n Les États membres prévoient une procédure de recours en ce qui concerne un refus en application du premier alinéa."
  12:
    prefix: "Article 72"
    title: "Conduite d'une investigation clinique"
    1_prefix: "72.1"
    1_label: "Le promoteur et l'investigateur veillent à ce que l'investigation clinique soit conduite conformément au protocole d'investigation clinique qui a été approuvé."
    2_prefix: "72.2"
    2_label: "Afin de vérifier que les droits, la sécurité et le bien-être des participants sont protégés, que les données notifiées sont fiables et robustes, et que la conduite de l'investigation clinique est conforme aux exigences du présent règlement, le promoteur assure un suivi approprié de la conduite de l'investigation clinique. La portée et la nature du suivi sont définies par le promoteur sur la base d'une évaluation qui tient compte de l'ensemble des caractéristiques de l'investigation clinique, y compris des suivantes:"
    2_desc: "\ta. l'objectif et la méthode de l'investigation clinique; et \n\tb. le degré de déviation de l'intervention par rapport à la pratique clinique normale."
    3_prefix: "72.3"
    3_label: "Toutes les informations relatives aux investigations cliniques sont enregistrées, traitées, gérées et archivées par le promoteur ou l'investigateur, selon le cas, de manière à pouvoir être notifiées, interprétées et vérifiées avec précision dans le respect de la confidentialité des informations et des données à caractère personnel relatives aux participants, conformément au droit applicable en matière de protection des données à caractère personnel."
    4_prefix: "72.4"
    4_label: "Des mesures techniques et organisationnelles appropriées sont mises en œuvre afin que les informations et les données à caractère personnel traitées ne puissent pas être consultées, communiquées, diffusées, modifiées sans autorisation ou de manière illicite ou encore détruites ou perdues de façon accidentelle, en particulier lorsque le traitement suppose leur transmission par l'intermédiaire d'un réseau."
    5_prefix: "72.5"
    5_label: "Les États membres inspectent, au niveau approprié, le ou les sites d'investigation afin de vérifier que l'investigation clinique est conduite dans le respect des exigences du présent règlement et du protocole d'investigation qui a été approuvé."
    6_prefix: "72.6"
    6_label: "Le promoteur établit une procédure pour les situations d'urgence qui permet l'identification immédiate et, si nécessaire, le rappel immédiat des dispositifs utilisés dans le cadre de l'investigation."
  13:
    prefix: "Article 73"
    title: "Système électronique relatif aux investigations cliniques"
    1_prefix: "73.1"
    1_label: "En collaboration avec les États membres, la Commission met en place, gère et tient à jour un système électronique:"
    1_desc: "\ta. pour la création des numéros d'identification uniques des investigations cliniques visés à l'article 70, paragraphe 1; \n\tb. pour servir de point d'entrée pour l'introduction de toutes les demandes ou notifications relatives à des investigations cliniques visées aux articles 70, 74, 75 et 78 et pour toute autre communication ou tout autre traitement de données dans ce cadre; \n\tc. pour l'échange d'informations relatives aux investigations cliniques conformément au présent règlement entre les États membres et entre ceux-ci et la Commission, y compris l'échange d'information visé aux articles 70 et 76; \n\td. pour les informations devant être communiquées par le promoteur conformément à l'article 77, y compris le rapport sur l'investigation clinique et son résumé, comme prévu au paragraphe 5 dudit article; \n\te. pour la notification d'événements indésirables graves et de défectuosités de dispositifs, ainsi que pour les actualisations y afférentes, visés à l'article 80."
    2_prefix: "73.2"
    2_desc: "Dans le contexte de la mise en place du système électronique visé au paragraphe 1 du présent article, la Commission veille à l'interopérabilité de celui-ci avec la base de données de l'Union sur les essais cliniques de médicaments à usage humain établie en application de l'article 81 du règlement (UE) no 536/2014 du Parlement européen et du Conseil (37) en ce qui concerne les investigations cliniques de dispositifs combinées avec un essai clinique en application dudit règlement."
    3_prefix: "73.3"
    3_label: "Les informations visées au paragraphe 1, point c), ne sont accessibles qu'aux États membres et à la Commission. Les informations visées aux autres points dudit paragraphe sont accessibles pour le public, sauf s'il est justifié d'en préserver la confidentialité en tout ou partie pour l'un des motifs suivants:"
    3_desc: "\ta. la protection des données à caractère personnel conformément au règlement (CE) no 45/2001; \n\t b. la protection d'informations confidentielles de nature commerciale, spécialement dans la brochure pour l'investigateur, notamment par la prise en compte du statut de l'évaluation de la conformité pour le dispositif, à moins qu'un intérêt public supérieur ne justifie la divulgation des informations en question; \n\tc. la surveillance effective de la conduite de l'investigation clinique par le ou les États membres concernés."
    4_prefix: "73.4"
    4_label: "Aucune donnée à caractère personnel sur les participants n'est mise à la disposition du public."
    5_prefix: "73.5"
    5_label: "L'interface utilisateur du système électronique visé au paragraphe 1 est disponible dans toutes les langues officielles de l'Union."
  14:
    prefix: "Article 74"
    title: "Investigations cliniques concernant des dispositifs portant le marquage CE"
    1_prefix: "74.1"
    1_desc: "Lorsqu'une investigation clinique doit être conduite afin d'approfondir l'évaluation d'un dispositif déjà muni du marquage CE, dans les limites de sa destination prévue en vertu de l'article 20, paragraphe 1 (ci-après dénommée «investigation SCAC»), et lorsque l'investigation impliquerait de soumettre les participants à des procédures additionnelles à celles déjà menées dans des conditions normales d'utilisation du dispositif et que ces procédures supplémentaires sont invasives ou lourdes, le promoteur informe les États membres concernés au moins trente jours avant que l'investigation clinique ne commence, via le système électronique visé à l'article 73. Le promoteur y joint la documentation visée à l'annexe XV, chapitre II. L'article 62, paragraphe 4, points b) à k) et m), les articles 75, 76 et 77, l'article 80, paragraphe 5, et les dispositions pertinentes de l'annexe XV s'appliquent aux investigations SCAC."
    2_prefix: "74.2"
    2_label: "Lorsqu'une investigation clinique doit être conduite afin d'évaluer, en dehors des limites de sa destination prévue, un dispositif déjà muni du marquage CE en vertu de l'article 20, paragraphe 1, les articles 62 à 81 s'appliquent."
  15:
    prefix: "Article 75"
    title: "Modifications substantielles d'une investigation clinique"
    1_prefix: "75.1"
    1_desc: "Lorsqu'un promoteur a l'intention d'apporter à une investigation clinique des modifications susceptibles d'avoir une incidence substantielle sur la sécurité, la santé ou les droits des participants, ou sur la robustesse ou la fiabilité des données cliniques issues de l'investigation, il informe, dans un délai d'une semaine, via le système électronique visé à l'article 73, le ou les États membres dans lesquels l'investigation clinique est ou doit être conduite, des raisons et de la nature de ces modifications. Le promoteur y joint une version actualisée de la documentation pertinente visée à l'annexe XV, chapitre II. Les modifications apportées dans cette documentation sont clairement visibles."
    2_prefix: "75.2"
    2_label: "L'État membre évalue toute modification substantielle apportée à l'investigation clinique conformément à la procédure prévue à l'article 71."
    3_prefix: "75.3"
    3_label: "Le promoteur peut appliquer les modifications visées au paragraphe 1 au plus tôt trente-huit jours après la notification visée audit paragraphe, sauf si:"
    3_desc: "\ta. l'État membre dans lequel l'investigation clinique est ou doit être conduite a informé le promoteur de son refus sur la base des motifs visés à l'article 71, paragraphe 4, ou pour des raisons liées à la santé publique, à la sécurité ou la santé des participants et des utilisateurs, ou à l'ordre public; ou \n\tb. un comité d'éthique dudit État membre a émis un avis défavorable en rapport avec la modification substantielle apportée à l'investigation clinique qui, conformément au droit national, est valable pour l'ensemble dudit État membre."
    4_prefix: "75.4"
    4_label: "Le ou les États membres concernés peuvent également prolonger le délai visé au paragraphe 3 de sept jours supplémentaires aux fins de la consultation d'experts."
  16:
    prefix: "Article 76"
    title: "Mesures correctives à prendre par les États membres et échange d'informations entre les États membres"
    1_prefix: "76.1"
    1_label: "Lorsque l'État membre dans lequel une investigation clinique est ou doit être conduite a des raisons de considérer que les exigences énoncées dans le présent règlement ne sont pas respectées, il peut prendre au moins les mesures suivantes sur son territoire:"
    1_desc: "\ta. révoquer l'autorisation de l'investigation clinique; \n\tb. suspendre ou mettre fin à l'investigation clinique; \n\tc. demander au promoteur de modifier tout aspect de l'investigation clinique."
    2_prefix: "76.2"
    2_label: "Avant de prendre les mesures visées au paragraphe 1, l'État membre concerné demande l'avis du promoteur ou de l'investigateur, ou des deux, sauf lorsqu'une action immédiate s'impose. Cet avis lui est transmis dans un délai de sept jours."
    3_prefix: "76.3"
    3_label: "Lorsqu'un État membre a pris une mesure visée au paragraphe 1 du présent article ou a refusé une investigation clinique, ou a été informé par le promoteur que celui-ci a mis fin à l'investigation clinique avant son terme pour des raisons de sécurité, cet État membre communique la décision correspondante et les motifs y afférents à tous les États membres et à la Commission via le système électronique visé à l'article 73."
    4_prefix: "76.4"
    4_label: "Lorsque le promoteur retire une demande avant qu'un État membre n'ait arrêté une décision, cette information est mise à la disposition de tous les États membres et de la Commission via le système électronique visé à l'article 73."
  17:
    prefix: "Article 77"
    title: "Information par le promoteur à la fin d'une investigation clinique ou en cas d'interruption temporaire ou d'arrêt anticipé"
    1_prefix: "77.1"
    1_desc: "Lorsque le promoteur interrompt temporairement une investigation clinique ou met fin à une investigation clinique de manière anticipée, il en informe, dans un délai de quinze jours, via le système électronique visé à l'article 73, l'État membre dans lequel cette investigation clinique a été temporairement interrompue ou arrêtée de manière anticipée, en motivant sa décision. Lorsque le promoteur interrompt temporairement une investigation clinique ou y met fin de manière anticipée pour des raisons de sécurité, il en informe, dans un délai de vingt-quatre heures, tous les États membres dans lesquels cette investigation clinique est en cours."
    2_prefix: "77.2"
    2_label: "Une investigation clinique est réputée prendre fin avec la dernière visite du dernier participant, à moins que le protocole d'investigation clinique ne prévoie qu'elle se termine à un autre moment."
    3_prefix: "77.3"
    3_label: "Le promoteur notifie à chaque État membre dans lequel une investigation clinique était en cours la fin de ladite investigation clinique dans l'État membre en question. Cette notification est effectuée dans un délai de quinze jours suivant la fin de l'investigation clinique concernant cet État membre."
    4_prefix: "77.4"
    4_label: "Lorsqu'une investigation clinique est conduite dans plus d'un État membre, le promoteur informe tous les États membres dans lesquels cette investigation était en cours de la fin de celle-ci dans l'ensemble des États membres. Cette notification est effectuée dans un délai de quinze jours suivant la fin de l'investigation clinique."
    5_prefix: "77.5"
    5_desc: "Quel que soit le résultat de l'investigation clinique, dans l'année suivant la fin de l'investigation clinique ou dans un délai de trois mois suivant l'arrêt anticipé ou l'interruption temporaire, le promoteur transmet aux États membres dans lesquels une investigation clinique était en cours, le rapport sur l'investigation clinique visé à l'annexe XV, chapitre I, section 2.8, et chapitre III, section 7. \n\n Le rapport sur l'investigation clinique est accompagné d'un résumé rédigé en des termes aisément compréhensibles par l'utilisateur auquel le dispositif est destiné. Le rapport et le résumé sont transmis par le promoteur via le système électronique visé à l'article 73. \n\n Lorsque, pour des raisons scientifiques, le rapport sur l'investigation clinique ne peut être transmis dans un délai d'un an après la fin de l'investigation, il l'est dès qu'il est disponible. Dans ce cas, le protocole d'investigation clinique visé à l'annexe XV, chapitre II, section 3, précise la date à laquelle les résultats de l'investigation clinique seront disponibles, accompagnée d'une justification."
    6_prefix: "77.6"
    6_desc: "La Commission établit des lignes directrices concernant le contenu et la structure du résumé du rapport sur l'investigation clinique. \n\n En outre, la Commission peut établir des lignes directrices concernant le format et les modalités de partage des données brutes pour les cas où le promoteur décide librement de partager de telles données. Ces lignes directrices peuvent s'appuyer, en les adaptant, dans la mesure du possible, sur des lignes directrices existantes en matière de partage de données brutes dans le cadre des investigations cliniques."
    7_prefix: "77.7"
    7_desc: "Le résumé et le rapport sur l'investigation clinique visés au paragraphe 5 du présent article deviennent accessibles pour le public via le système électronique visé à l'article 73, au plus tard lorsque le dispositif est enregistré conformément à l'article 29 et avant qu'il soit mis sur le marché. En cas d'arrêt anticipé ou d'interruption temporaire, le résumé et le rapport deviennent accessibles pour le public immédiatement après leur transmission. \n\n Si le dispositif n'est pas enregistré conformément à l'article 29 dans un délai d'un an après que le résumé et le rapport ont été introduits dans le système électronique conformément au paragraphe 5 du présent article, ceux-ci deviennent accessibles pour le public à ce moment-là."
  18:
    prefix: "Article 78"
    title: "Procédure d'évaluation coordonnée concernant les investigations cliniques"
    1_prefix: "78.1"
    1_label: "Via le système électronique visé à l'article 73, le promoteur d'une investigation clinique devant être conduite dans plus d'un État membre peut, aux fins de l'article 70, introduire une demande unique, transmise dès réception par voie électronique à tous les États membres dans lesquels l'investigation clinique doit être conduite."
    2_prefix: "78.2"
    2_desc: "Dans la demande unique visée au paragraphe 1, le promoteur propose l'un des États membres dans lesquels l'investigation clinique doit être conduite comme État membre coordonnateur. Dans un délai de six jours suivant l'introduction de la demande, les États membres dans lesquels l'investigation clinique doit être conduite s'entendent sur celui d'entre eux qui fera fonction d'État membre coordonnateur. S'ils ne s'entendent pas sur un État membre coordonnateur, c'est à l'État membre proposé par le promoteur qu'échoit la fonction."
    3_prefix: "78.3"
    3_desc: "Sous la direction de l'État membre coordonnateur visé au paragraphe 2, les États membres concernés coordonnent leur évaluation de la demande, notamment de la documentation visée à l'annexe XV, chapitre II.\n\nCependant, le caractère complet de la documentation visée à l'annexe XV, chapitre II, sections 1.13, 3.1.3, 4.2, 4.3 et 4.4, est évalué séparément par chacun des États membres concernés conformément à l'article 70, paragraphes 1 à 5."
    4_prefix: "78.4"
    4_label: "En ce qui concerne la documentation autre que celle visée au paragraphe 3, deuxième alinéa, l'État membre coordonnateur:"
    4_desc: "\ta. notifie au promoteur, dans un délai de six jours suivant la réception de la demande unique, qu'il est l'État membre coordonnateur (date de notification);\n\n\tb. prend en compte, aux fins de la validation de la demande, toute observation formulée par un État membre concerné dans un délai de sept jours suivant la date de notification;\n\n\tc. dans un délai de dix jours suivant la date de notification, évalue si l'investigation clinique relève du présent règlement et si la demande est complète et en informe le promoteur en conséquence. L'article 70, paragraphes 1 et 3 à 5, s'applique à l'État membre coordonnateur pour ce qui est de cette évaluation;\n\n\td. documente les résultats de son évaluation dans un projet de rapport d'évaluation qui doit être transmis aux États membres concernés dans un délai de vingt-six jours à suivant la date de validation. Au plus tard le trente-huitième jour suivant la date de validation, les autres États membres concernés transmettent leurs observations et propositions à propos du projet de rapport d'évaluation et de la demande sous-jacente à l'État membre coordonnateur, qui en tient dûment compte lors de l'établissement du rapport définitif d'évaluation, qui doit être transmis au promoteur et aux autres États membres concernés dans un délai de quarante-cinq jours suivant la date de validation.\n\nTous les États membres concernés tiennent compte du rapport définitif d'évaluation pour statuer sur la demande du promoteur conformément à l'article 70, paragraphe 7."
    5_prefix: "78.5"
    5_desc: "En ce qui concerne l'évaluation de la documentation visée au paragraphe 3, deuxième alinéa, chacun des États membres concernés peut demander, à une seule reprise, des informations complémentaires au promoteur. Le promoteur communique les informations complémentaires demandées dans le délai fixé par l'État membre concerné, qui ne dépasse pas douze jours à compter de la réception de la demande. Le dernier délai visé au paragraphe 4, point d), cesse de courir entre la date de la demande et la réception des informations complémentaires."
    6_prefix: "78.6"
    6_label: "Pour les dispositifs de classe IIb et III, l'État membre coordonnateur peut également prolonger les délais visés au paragraphe 4 de cinquante jours supplémentaires aux fins de la consultation d'experts."
    7_prefix: "78.7"
    7_desc: "La Commission peut, au moyen d'actes d'exécution, définir avec davantage de précision les procédures et les calendriers applicables aux évaluations coordonnées que doivent prendre en compte les États membres concernés pour statuer sur la demande du promoteur. Ces actes d'exécution peuvent aussi définir les procédures et les calendriers applicables aux évaluations coordonnées en cas de modifications substantielles conformément au paragraphe 12 du présent article, de notification d'événements indésirables conformément à l'article 80, paragraphe 4, et en cas d'investigation clinique de produits combinant des dispositifs médicaux et des médicaments, lorsque ces derniers font l'objet d'une évaluation coordonnée parallèle d'un essai clinique au titre du règlement (UE) no 536/2014. Ces actes d'exécution sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3."
    8_prefix: "78.8"
    8_desc: "Lorsque, concernant le volet faisant l'objet d'une évaluation coordonnée, l'État membre coordonnateur parvient à la conclusion que la conduite de l'investigation clinique est acceptable, ou acceptable sous réserve du respect de conditions spécifiques, cette conclusion est réputée être la conclusion de tous les États membres concernés.\n\nNonobstant le premier alinéa, un État membre concerné peut contester la conclusion de l'État membre coordonnateur pour ce qui concerne le volet faisant l'objet d'une évaluation coordonnées uniquement pour les motifs suivants:\n\ta. lorsqu'il considère que la participation à l'investigation clinique entraînerait pour le participant un traitement de qualité inférieure à la pratique clinique normale dans l'État membre concerné;\n\tb. en cas de violation du droit national; ou \n\tc. en cas d'observations relatives à la sécurité des participants ainsi qu'à la fiabilité et à la robustesse des données transmises au titre du paragraphe 4, point b).\n\nLorsque l'un des États membres concernés conteste la conclusion sur la base du deuxième alinéa du présent paragraphe, il communique son désaccord, auquel est jointe une justification détaillée, à la Commission, à tous les autres États membres concernés et au promoteur via le système électronique visé à l'article 73."
    9_prefix: "78.9"
    9_label: "Lorsque la conclusion de l'État membre coordonnateur concernant le volet faisant l'objet d'une évaluation coordonnée est que l'investigation clinique n'est pas acceptable, cette conclusion est réputée être la conclusion de tous les États membres concernés."
    10_prefix: "78.10"
    10_desc: "Un État membre concerné refuse d'autoriser une investigation clinique s'il est en désaccord avec la conclusion de l'État membre coordonnateur pour l'un des motifs visés au paragraphe 8, deuxième alinéa, ou s'il estime, pour des raisons dûment justifiées, que les aspects traités à l'annexe XV, chapitre II, sections 1.13, 3.1.3, 4.2, 4.3 et 4.4, ne sont pas respectés, ou lorsqu'un comité d'éthique a émis, concernant ladite investigation clinique, un avis défavorable qui, conformément au droit national, est valable pour l'ensemble dudit État membre. L'État membre en question prévoit une procédure de recours pour un tel refus."
    11_prefix: "78.11"
    11_desc: "Chaque État membre concerné indique au promoteur, via le système électronique visé à l'article 73, si l'investigation clinique est autorisée, si elle est autorisée sous conditions ou si l'autorisation a été refusée. La notification s'effectue sous la forme d'une décision unique dans un délai de cinq jours suivant la transmission, par l'État membre coordonnateur, du rapport définitif d'évaluation conformément au paragraphe 4, point d). Lorsqu'une autorisation d'investigation clinique est soumise à des conditions, il ne peut s'agir que de conditions qui, de par leur nature, ne peuvent pas être respectées au moment de ladite autorisation."
    12_prefix: "78.12"
    12_desc: "Les modifications substantielles visées à l'article 75 sont notifiées aux États membres concernés via le système électronique visé à l'article 73. Toute évaluation destinée à déterminer d'éventuels motifs de désaccord, tels qu'ils sont visés au paragraphe 8, deuxième alinéa, du présent article, est menée sous la direction de l'État membre coordonnateur, sauf pour ce qui concerne les modifications substantielles concernant l'annexe XV, chapitre II, sections 1.13, 3.1.3, 4.2, 4.3 et 4.4, qui sont évaluées séparément par chacun des États membres concernés."
    13_prefix: "78.13"
    13_label: "La Commission apporte son appui administratif à l'État membre coordonnateur dans l'exécution de ses tâches en vertu du présent chapitre."
    14_prefix: "78.14"
    14_label: "La procédure prévue au présent article ne s'applique, jusqu'au 27 mai 2027, qu'aux États membres dans lesquels l'investigation clinique doit être menée et qui ont accepté le recours à cette procédure. Après cette date, la procédure s'applique à tous les États membres."
  19_prefix: "Article 79"
  19_label: "Réexamen de la procédure d'évaluation coordonnée"
  19_desc: "Au plus tard le 27 mai 2026, la Commission présente au Parlement européen et au Conseil un rapport sur l'expérience acquise dans le cadre de l'application de l'article 78 et, au besoin, propose de réexaminer l'article 78, paragraphe 14, et l'article 123, paragraphe 3, point h)."
  20:
    prefix: "Article 80"
    title: "Enregistrement et notification des événements indésirables survenant pendant les investigations cliniques"
    1_prefix: "80.1"
    1_label: "Le promoteur enregistre intégralement:"
    1_desc: "\ta. tout événement indésirable d'un type défini dans le protocole d'investigation clinique comme étant déterminant pour l'évaluation des résultats de ladite investigation clinique; \n\tb. tout événement indésirable grave; \n\tc. toute défectuosité d'un dispositif qui aurait pu déboucher sur un événement indésirable grave en l'absence de mesures appropriées ou d'une intervention, ou si les circonstances avaient été moins favorables; \n\td. tout nouvel élément concernant un événement visé aux points a) à c)."
    2_prefix: "80.2"
    2_label: "Le promoteur notifie sans tarder à tous les États membres dans lesquels une investigation clinique est en cours, via le système électronique visé à l'article 73:"
    2_desc: "\ta. tout événement indésirable grave entretenant avec le dispositif faisant l'objet de l'investigation, le dispositif comparateur ou la procédure d'investigation, un lien de causalité avéré ou raisonnablement envisageable; \n\tb. toute défectuosité d'un dispositif qui aurait pu déboucher sur un événement indésirable grave en l'absence de mesures appropriées ou d'une intervention, ou si les circonstances avaient été moins favorables; \n\tc. tout nouvel élément concernant un événement visé aux points a) et b). \n\n Le délai de notification tient compte de la sévérité de l'événement. Pour permettre une notification en temps opportun, le promoteur peut, s'il y a lieu, présenter un premier rapport incomplet avant d'en remettre un qui soit complet. \n\n À la demande de tout État membre dans lequel l'investigation clinique est en cours, le promoteur fournit toutes les informations visées au paragraphe 1."
    3_prefix: "80.3"
    3_label: "Le promoteur notifie également aux États membres dans lesquels l'investigation clinique est en cours, via le système électronique visé à l'article 73, tout événement visé au paragraphe 2 du présent article survenu dans un pays tiers dans lequel une investigation clinique est conduite suivant le même protocole d'investigation clinique que celui appliqué à une investigation clinique relevant du présent règlement."
    4_prefix: "80.4"
    4_desc: "Dans le cas d'une investigation clinique pour laquelle le promoteur a introduit la demande unique visée à l'article 78, celui-ci notifie tout événement visé au paragraphe 2 du présent article via le système électronique visé à l'article 73. Dès sa réception, le rapport correspondant est transmis par voie électronique à tous les États membres dans lesquels l'investigation clinique est en cours. \n\n Sous la direction de l'État membre coordonnateur visé à l'article 78, paragraphe 2, les États membres coordonnent leur évaluation des événements indésirables graves et des défectuosités de dispositifs pour déterminer s'il faut modifier, suspendre ou mettre fin à l'investigation clinique ou s'il faut retirer l'autorisation relative à ladite investigation clinique. \n\n Le présent paragraphe est sans effet sur le droit des autres États membres de réaliser leur propre évaluation et d'adopter des mesures conformément au présent règlement pour garantir la protection de la santé publique et de la sécurité des patients. L'État membre coordonnateur et la Commission sont informés des résultats d'une telle évaluation et de l'adoption de telles mesures."
    5_prefix: "80.5"
    5_label: "Dans le cas des investigations SCAC visées à l'article 74, paragraphe 1, ce sont les dispositions relatives à la vigilance établies aux articles 87 à 90 et dans les actes adoptés conformément à l'article 91 qui s'appliquent, et non celles du présent article."
    6_prefix: "80.6"
    6_label: "Nonobstant le paragraphe 5, le présent article s'applique lorsqu'un lien de causalité a été établi entre l'événement indésirable grave et la procédure d'investigation qui le précède."
  21_prefix: "Article 81"
  21_label: "Actes d'exécution"
  21_desc: "La Commission peut, au moyen d'actes d'exécution, définir les modalités et les aspects procéduraux liés à l'application du présent chapitre en ce qui concerne: \n\ta. des formulaires électroniques harmonisés pour les demandes relatives aux investigations cliniques et leur évaluation, visées aux articles 70 et 78, eu égard aux catégories ou groupes spécifiques de dispositifs \n\tb. le fonctionnement du système électronique visé à l'article 73 \n\tc. des formulaires électroniques harmonisés pour la notification d'investigations SCAC visées à l'article 74, paragraphe 1, et de modifications substantielles visées à l'article 75 \n\td. l'échange d'informations entre les États membres visé à l'article 76 \n\te. des formulaires électroniques harmonisés pour la notification d'événements indésirables graves et de défectuosités de dispositifs, visés à l'article 80 \n\tf. les délais de notification d'événements indésirables graves et de défectuosités de dispositifs, eu égard à la sévérité de l'événement devant faire l'objet d'un rapport visé à l'article 80 \n\tg. l'application uniforme des exigences en ce qui concerne les preuves ou les données cliniques requises pour démontrer la conformité avec les exigences générales en matière de sécurité et de performances énoncées à l'annexe I. \n\n Les actes d'exécution visés au premier alinéa sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3."
  22:
    prefix: "Article 82"
    title: "Exigences relatives à d'autres investigations cliniques"
    1_prefix: "82.1"
    1_label: "Les investigations cliniques conduites à des fins autres que celles énumérées à l'article 62, paragraphe 1, se conforment aux dispositions de l'article 62, paragraphes 2 et 3, de l'article 62, paragraphe 4, points b), c), d), f), h) et l), et de l'article 62, paragraphe 6."
    2_prefix: "82.2"
    2_label: "Afin de protéger les droits, la sécurité, la dignité et le bien-être des participants et l'intégrité scientifique et éthique des investigations cliniques conduites à des fins autres que celles énumérées à l'article 62, paragraphe 1, chaque État membre définit des exigences supplémentaires pour lesdites investigations, selon ses besoins."
7:
  prefix: "Chapitre VII"
  title: "Surveillance après commercialisation, vigilance et surveillance du marché"
  1:
    prefix: "Article 83"
    title: "Système de surveillance après commercialisation mis en place par le fabricant"
    1_prefix: "83.1"
    1_label: "Pour chaque dispositif, les fabricants conçoivent, établissent, documentent, appliquent, maintiennent et mettent à jour un système de surveillance après commercialisation en fonction de la classe de risque et du type de dispositif. Ce système fait partie intégrante du système de gestion de la qualité mis en place par le fabricant, visé à l'article 10, paragraphe 9."
    2_prefix: "83.2"
    2_label: "Le système de surveillance après commercialisation permet de collecter, d'enregistrer et d'analyser, d'une manière active et systématique, les données pertinentes sur la qualité, les performances et la sécurité d'un dispositif pendant toute sa durée de vie, de tirer les conclusions qui s'imposent et de définir et d'appliquer toute mesure préventive ou corrective et d'en assurer le suivi."
    3_prefix: "83.3"
    3_label: "Les données collectées au titre du système de surveillance après commercialisation mis en place par le fabricant sont en particulier utilisées pour:"
    3_desc: "\ta. actualiser la détermination du rapport bénéfice/risque et améliorer la gestion des risques visées à l'annexe I, chapitre I; \n\tb. actualiser les informations sur la conception et la fabrication, la notice d'utilisation et l'étiquetage; \n\tc. actualiser l'évaluation clinique; \n\td. actualiser le résumé des caractéristiques de sécurité et des performances cliniques visé à l'article 32; \n\te. faire apparaître les besoins en matière de mesures préventives, de mesures correctives ou de mesures correctives de sécurité; \n\tf. répertorier les possibilités d'amélioration de la facilité d'utilisation, des performances et de la sécurité du dispositif; \n\tg. le cas échéant, contribuer à la surveillance après commercialisation d'autres dispositifs; et \n\th. identifier les tendances et en rendre compte conformément à l'article 88. \n\n La documentation technique est mise à jour en conséquence."
    4_prefix: "83.4"
    4_label: "Si, dans le cadre de la surveillance après commercialisation, il apparaît que des mesures préventives ou correctives, ou les deux, sont nécessaires, le fabricant applique les mesures appropriées et informe les autorités compétentes concernées ainsi que, le cas échéant, l'organisme notifié. Lorsqu'un incident grave est constaté ou qu'une mesure corrective de sécurité est appliquée, cela est notifié conformément à l'article 87."
  2_prefix: "Article 84"
  2_label: "Plan de surveillance après commercialisation"
  2_desc: "Le système de surveillance après commercialisation visé à l'article 83 est fondé sur un plan de surveillance après commercialisation, dont les caractéristiques sont exposées à l'annexe III, section 1.1. Dans le cas de dispositifs autres que des dispositifs sur mesure, le plan de surveillance après commercialisation fait partie de la documentation technique prévue à l'annexe II."
  3_prefix: "Article 85"
  3_label: "Rapport sur la surveillance après commercialisation"
  3_desc: "Les fabricants de dispositifs de classe I établissent un rapport sur la surveillance après commercialisation faisant la synthèse des résultats et des conclusions de l'analyse des données de surveillance après commercialisation qui ont été collectées dans le cadre du plan de surveillance après commercialisation visé à l'article 84, exposant la justification de toute mesure préventive ou corrective prise et les décrivant. Le rapport est mis à jour selon les besoins et mis à la disposition de l'autorité compétente sur demande."
  4:
    prefix: "Article 86"
    title: "Rapport périodique actualisé de sécurité"
    1_prefix: "86.1"
    1_desc: "Les fabricants de dispositifs des classes IIa, IIb et III établissent, pour chaque dispositif et, le cas échéant, pour chaque catégorie ou groupe de dispositifs, un rapport périodique actualisé de sécurité (PSUR) faisant la synthèse des résultats et des conclusions de l'analyse des données de surveillance après commercialisation qui ont été collectées dans le cadre du plan de surveillance après commercialisation visé à l'article 84, exposant la justification de toute mesure préventive ou corrective prise et les décrivant. Pendant toute la durée de vie du dispositif concerné, le PSUR décrit: \n\ta. les conclusions à utiliser dans le cadre de la détermination du rapport bénéfice/risque; \n\tb. les principales constatations du SCAC; et \n\tc. le volume des ventes du dispositif et une estimation de la taille et d'autres caractéristiques de la population utilisant le dispositif et, si possible, la fréquence d'utilisation du dispositif. \n\n Les fabricants de dispositifs des classes IIb et III mettent le PSUR à jour au moins une fois par an. Ce PSUR fait partie de la documentation technique prévue aux annexes II et III, sauf pour ce qui est des dispositifs sur mesure. \n\n Les fabricants de dispositifs de classe IIa mettent le PSUR à jour selon les besoins et au moins tous les deux ans. Ce PSUR fait partie de la documentation technique prévue aux annexes II et III, sauf pour ce qui est des dispositifs sur mesure. \n\n Dans le cas des dispositifs sur mesure, le PSUR fait partie de la documentation visée à l'annexe XIII, section 2."
    2_prefix: "86.2"
    2_desc: "Pour les dispositifs de classe III ou les dispositifs implantables, les fabricants communiquent les PSUR à l'organisme notifié intervenant dans l'évaluation de la conformité conformément à l'article 52, via le système électronique visé à l'article 92. L'organisme notifié examine les rapports et enregistre son évaluation, assortie de toute mesure prise, dans ce système électronique. Ces PSUR ainsi que l'évaluation de l'organisme notifié sont mis à la disposition des autorités compétentes via ce système électronique."
    3_prefix: "86.3"
    3_label: "Pour les dispositifs autres que ceux visés au paragraphe 2, les fabricants mettent les PSUR à la disposition de l'organisme notifié intervenant dans l'évaluation de la conformité et, sur demande, des autorités compétentes."
  5:
    prefix: "Article 87"
    title: "Notification des incidents graves et des mesures correctives de sécurité"
    1_prefix: "87.1"
    1_label: "Les fabricants de dispositifs mis à disposition sur le marché de l'Union, autres que les dispositifs faisant l'objet d'une investigation, notifient aux autorités compétentes concernées, conformément à l'article 92, paragraphes 5 et 7, les éléments suivants:"
    1_desc: "\ta. tout incident grave concernant des dispositifs mis à disposition sur le marché de l'Union, à l'exception des effets secondaires attendus qui sont clairement documentés dans les informations relatives au produit et quantifiés dans la documentation technique et qui font l'objet d'un rapport de tendances en application de l'article 88; \n\tb. toute mesure corrective de sécurité prise à l'égard de dispositifs mis à disposition sur le marché de l'Union, ainsi que toute mesure corrective de sécurité prise dans un pays tiers concernant un dispositif qui est aussi légalement mis à disposition sur le marché de l'Union, lorsque la raison justifiant la mesure ne concerne pas exclusivement le dispositif mis à disposition dans le pays tiers. \n\n Les rapports visés au premier alinéa sont soumis via le système électronique visé à l'article 92."
    2_prefix: "87.2"
    2_label: "D'une manière générale, le délai de notification visé au paragraphe 1 tient compte de la sévérité de l'incident."
    3_prefix: "87.3"
    3_label: "Les fabricants notifient tout incident grave visé au paragraphe 1, point a), immédiatement après avoir établi un lien de causalité avéré ou raisonnablement envisageable entre cet incident et leur dispositif, et au plus tard quinze jours après qu'ils ont eu connaissance de l'incident."
    4_prefix: "87.4"
    4_label: "Nonobstant le paragraphe 3, en cas de menace grave pour la santé publique, la notification visée au paragraphe 1 a lieu immédiatement, et au plus tard deux jours après que le fabricant a eu connaissance de cette menace."
    5_prefix: "87.5"
    5_label: "Nonobstant le paragraphe 3, en cas de décès ou de détérioration grave inattendue de l'état de santé d'une personne, la notification a lieu immédiatement après que le fabricant a établi ou dès qu'il soupçonne un lien de causalité entre le dispositif et l'incident grave, mais au plus tard dix jours après qu'il a eu connaissance de l'incident grave."
    6_prefix: "87.6"
    6_label: "Pour permettre une notification en temps opportun, le fabricant peut, s'il y a lieu, présenter un premier rapport incomplet, avant d'en remettre un définitif qui soit complet."
    7_prefix: "87.7"
    7_label: "Si, après avoir eu connaissance d'un incident susceptible de devoir être notifié, le fabricant nourrit des incertitudes sur ce point, il présente néanmoins un rapport dans le délai prescrit conformément aux paragraphes 2 à 5."
    8_prefix: "87.8"
    8_label: "Sauf en cas d'urgence où il doit prendre immédiatement une mesure corrective de sécurité, le fabricant notifie, sans retard injustifié, la mesure corrective de sécurité visée au paragraphe 1, point b), avant que cette mesure ne soit prise."
    9_prefix: "87.9"
    9_desc: "Pour les incidents graves similaires ayant trait au même dispositif ou type de dispositif, dont la cause a été déterminée ou pour lesquels une mesure corrective de sécurité a été appliquée, ou lorsque les incidents sont communs et bien documentés, le fabricant peut transmettre périodiquement des rapports de synthèse au lieu de rapports d'incidents graves individuels, à condition que l'autorité compétente coordonnatrice visée à l'article 89, paragraphe 9, en concertation avec les autorités compétentes visées à l'article 92, paragraphe 8, point a), ait convenu avec le fabricant du format, du contenu et de la périodicité des rapports de synthèse. Lorsqu'une seule autorité compétente est visée à l'article 92, paragraphe 8, points a) et b), le fabricant peut transmettre périodiquement des rapports de synthèse en accord avec cette autorité compétente."
    10_prefix: "87.10"
    10_desc: "Les États membres prennent les mesures appropriées, telles que l'organisation de campagnes d'information ciblées, pour encourager les professionnels de la santé, les utilisateurs et les patients à communiquer aux autorités compétentes les incidents graves supposés visés au paragraphe 1, point a), et leur donner les moyens de le faire. \n\n Les autorités compétentes enregistrent au niveau national de manière centralisée les déclarations qu'elles reçoivent des professionnels de la santé, des utilisateurs et des patients."
    11_prefix: "87.11"
    11_desc: "Lorsque l'autorité compétente d'un État membre reçoit, d'un professionnel de la santé, d'un utilisateur ou d'un patient, les déclarations concernant un incident grave supposé visé au paragraphe 1, point a), elle prend les mesures nécessaires pour garantir que le fabricant du dispositif est informé sans tarder de l'incident grave supposé. \n\n Lorsque le fabricant du dispositif concerné estime que l'incident constitue un incident grave, il présente, conformément aux paragraphes 1 à 5 du présent article, un rapport sur cet incident grave à l'autorité compétente de l'État membre dans lequel cet incident s'est produit et prend les mesures de suivi appropriées conformément à l'article 89. \n\n Lorsque le fabricant du dispositif concerné estime que l'incident ne constitue pas un incident grave ou qu'il constitue un effet secondaire indésirable attendu qui fera l'objet d'un rapport de tendances conformément à l'article 88, il fournit une déclaration explicative. Si l'autorité compétente ne partage pas les conclusions de la déclaration explicative, elle peut exiger du fabricant qu'il fasse une notification conformément aux paragraphes 1 à 5 du présent article et qu'il prenne les mesures de suivi appropriées conformément à l'article 89."
  6:
    prefix: "Article 88"
    title: "Rapport de tendances"
    1_prefix: "88.1"
    1_desc: "Les fabricants notifient, via le système électronique visé à l'article 92, toute augmentation statistiquement significative de la fréquence ou de la sévérité des incidents qui ne sont pas des incidents graves ou qui constituent des effets secondaires indésirables attendus qui pourraient avoir une incidence significative sur le rapport bénéfice/risque visé à l'annexe I, sections 1 et 5, et qui ont entraîné ou pourraient entraîner des risques pour la santé et la sécurité des patients, des utilisateurs ou d'autres personnes, inacceptables au regard des bénéfices recherchés. Cette augmentation significative est établie par comparaison avec la fréquence ou la sévérité prévisible de ces incidents pour le dispositif ou la catégorie ou le groupe de dispositifs en question sur une période donnée, comme indiqué dans la documentation technique et les informations relatives au produit. \n\n Le fabricant indique comment gérer les incidents visés au premier alinéa ainsi que la méthodologie utilisée pour identifier toute augmentation statistiquement significative de la fréquence ou de la sévérité de ces incidents ainsi que la période d'observation dans le plan de surveillance après commercialisation visé à l'article 84."
    2_prefix: "88.2"
    2_desc: "Les autorités compétentes peuvent réaliser leur propre évaluation des rapports de tendances visés au paragraphe 1 et exiger des fabricants qu'ils adoptent des mesures appropriées conformément au présent règlement pour garantir la protection de la santé publique et de la sécurité des patients. Chaque autorité compétente informe la Commission, les autres autorités compétentes et l'organisme notifié qui a délivré le certificat des résultats d'une telle évaluation et de l'adoption de telles mesures."
  7:
    prefix: "Article 89"
    title: "Analyse des incidents graves et des mesures correctives de sécurité"
    1_prefix: "89.1"
    1_desc: "À la suite de la notification d'un incident grave en application de l'article 87, paragraphe 1, le fabricant mène sans tarder les investigations nécessaires liées à cet incident et aux dispositifs concernés. Ces investigations comprennent notamment une évaluation des risques résultant de l'incident et des mesures correctives de sécurité en tenant compte, le cas échéant, des critères visés au paragraphe 3 du présent article. \n\n Au cours des investigations visées au premier alinéa, le fabricant coopère avec les autorités compétentes et, le cas échéant, avec l'organisme notifié concerné; ce faisant, il n'entreprend aucune investigation qui soit susceptible de modifier le dispositif ou un échantillon du lot concerné au point de compromettre toute évaluation ultérieure des causes de l'incident, sans en informer au préalable les autorités compétentes."
    2_prefix: "89.2"
    2_desc: "Les États membres prennent les mesures nécessaires pour que toute information concernant un incident grave survenu sur leur territoire ou une mesure corrective de sécurité mise en œuvre ou devant être mise en œuvre sur leur territoire, et qui leur a été notifiée conformément à l'article 87, fassent l'objet d'une évaluation centralisée au niveau national par leur autorité compétente, si possible en collaboration avec le fabricant et, le cas échéant, avec l'organisme notifié concerné."
    3_prefix: "89.3"
    3_desc: "Dans le cadre de l'évaluation visée au paragraphe 2, l'autorité compétente évalue les risques résultant de l'incident grave notifié et d'éventuelles mesures correctives de sécurité qui s'y rapportent en tenant compte de la protection de la santé publique et de critères comme la causalité, la détectabilité et la probabilité de récurrence du problème, la fréquence d'utilisation du dispositif, la probabilité de survenance d'un dommage direct ou indirect, la sévérité de celui-ci, les bénéfices cliniques du dispositif, les utilisateurs auxquels les dispositifs sont ou pourraient être destinés et la population concernée. L'autorité compétente apprécie également le caractère adéquat des mesures correctives de sécurité envisagées ou mises en œuvre par le fabricant, ainsi que la nécessité et la nature de toute autre mesure corrective, compte tenu notamment du principe de sûreté inhérente inscrit à l'annexe I. \n\n À la demande de l'autorité nationale compétente, les fabricants fournissent tous les documents nécessaires à l'évaluation des risques."
    4_prefix: "89.4"
    4_label: "L'autorité compétente assure le suivi de l'investigation menée par le fabricant sur un incident grave. Au besoin, une autorité compétente peut intervenir dans l'investigation du fabricant ou lancer une investigation indépendante."
    5_prefix: "89.5"
    5_label: "Le fabricant présente à l'autorité compétente un rapport final énonçant les conclusions qu'il a tirées de l'investigation, via le système électronique visé à l'article 92. Le rapport énonce des conclusions et, le cas échéant, indique les mesures correctives à prendre."
    6_prefix: "89.6"
    6_desc: "Pour les dispositifs visés à l'article 1er, paragraphe 8, premier alinéa, lorsqu'un incident grave ou une mesure corrective de sécurité peut avoir un lien avec une substance qui, utilisée seule, serait considérée comme un médicament, l'autorité compétente qui réalise l'évaluation ou l'autorité compétente coordonnatrice visée au paragraphe 9 du présent article informe l'autorité nationale compétente ou l'EMA, selon que la première ou la seconde a délivré l'avis scientifique sur ladite substance en application de l'article 52, paragraphe 9, dudit incident grave ou de ladite mesure corrective de sécurité. \n\n Pour les dispositifs relevant du présent règlement en vertu de l'article 1er, paragraphe 6, point g), lorsqu'un incident grave ou une mesure corrective de sécurité peut avoir un lien avec les dérivés de tissus ou de cellules d'origine humaine, utilisés pour la fabrication du dispositif, et pour les dispositifs relevant du champ d'application du présent règlement en vertu de l'article 1er, paragraphe 10, l'autorité compétente ou l'autorité compétente coordonnatrice visée au paragraphe 9 du présent article informe l'autorité compétente pour les tissus et les cellules humains qui a été consultée par l'organisme notifié en application de l'article 52, paragraphe 10."
    7_prefix: "89.7"
    7_desc: "Au terme de l'évaluation effectuée conformément au paragraphe 3 du présent article, l'autorité compétente qui réalise l'évaluation informe sans tarder les autres autorités compétentes, via le système électronique visé à l'article 92, de la mesure corrective prise ou envisagée par le fabricant ou imposée à ce dernier pour réduire à un minimum le risque de réapparition de l'incident grave, et leur communique des informations relatives aux événements sous-jacents et aux résultats de l'évaluation qu'elle a réalisée."
    8_prefix: "89.8"
    8_desc: "Le fabricant veille à ce que les informations relatives aux mesures correctives prises soient portées sans tarder à l'attention des utilisateurs du dispositif en question au moyen d'un avis de sécurité. L'avis de sécurité est rédigé dans une ou des langues officielles de l'Union définies par l'État membre dans lequel la mesure corrective de sécurité est prise. Sauf en cas d'urgence, le contenu du projet d'avis de sécurité est soumis à l'autorité compétente chargée de l'évaluation ou, dans les cas visés au paragraphe 9, à l'autorité compétente coordonnatrice, pour lui permettre de formuler des observations. À moins que la situation particulière d'un État membre ne le justifie, le contenu de l'avis de sécurité est uniforme dans tous les États membres. \n\n L'avis de sécurité permet l'identification correcte du ou des dispositifs concernés, notamment en indiquant les IUD pertinentes et l'identification correcte, notamment en indiquant, s'il est déjà émis, le numéro d'enregistrement unique du fabricant qui a appliqué la mesure corrective de sécurité. L'avis de sécurité expose clairement, sans sous-estimer le niveau de risque, les raisons de la mesure corrective de sécurité par référence au dysfonctionnement du dispositif et aux risques associés qui en résultent pour les patients, les utilisateurs ou d'autres personnes, et indique clairement toutes les dispositions que les utilisateurs doivent prendre. \n\n Le fabricant enregistre l'avis de sécurité dans le système électronique visé à l'article 92, de manière à ce qu'il soit accessible pour le public."
    9_prefix: "89.9"
    9_label: "Les autorités compétentes participent activement à une procédure visant à coordonner leurs évaluations visées au paragraphe 3 dans les cas suivants:"
    9_desc: "\ta. un incident grave donné ou un ensemble d'incidents graves liés au même dispositif ou type de dispositif du même fabricant suscite des préoccupations dans plus d'un État membre; \n\tb. le caractère approprié d'une mesure corrective de sécurité proposée par un fabricant dans plus d'un État membre est mis en doute. Cette procédure coordonnée porte sur: \n\t\t— la désignation d'une autorité compétente coordonnatrice au cas par cas, s'il y a lieu, \n\t\t— la définition de la procédure d'évaluation coordonnée, notamment des tâches et des responsabilités de l'autorité compétente coordonnatrice et l'implication d'autres autorités compétentes. \n\n Sauf si les autorités compétentes en conviennent autrement, l'autorité compétente coordonnatrice est l'autorité compétente de l'État membre dans lequel le fabricant a son siège social. \n\n L'autorité compétente coordonnatrice informe, via le système électronique visé à l'article 92, le fabricant, les autres autorités compétentes et la Commission qu'elle assume ladite fonction."
    10_prefix: "89.10"
    10_desc: "La désignation d'une autorité compétente coordonnatrice est sans effet sur le droit des autres autorités compétentes de réaliser leur propre évaluation et d'adopter des mesures conformément au présent règlement pour garantir la protection de la santé publique et de la sécurité des patients. L'autorité compétente coordonnatrice et la Commission sont tenues informées des résultats d'une telle évaluation et de l'adoption de telles mesures."
    11_prefix: "89.11"
    11_label: "La Commission apporte son appui administratif à l'autorité compétente coordonnatrice dans l'exécution des tâches prévues par le présent chapitre."
  8_prefix: "Article 90"
  8_label: "Analyse des données issues de la vigilance"
  8_desc: "La Commission met en place, en collaboration avec les États membres, des systèmes et processus destinés à l'analyse active des données disponibles dans le système électronique visé à l'article 92, afin d'identifier les tendances, les évolutions ou les signaux qui, dans les données, mettraient en évidence de nouveaux risques ou de nouvelles sources de préoccupation en matière de sécurité. \n\n Lorsqu'un risque précédemment inconnu est identifié ou lorsque la fréquence d'un risque escompté modifie significativement et défavorablement la détermination du rapport bénéfice/risque, l'autorité compétente ou, le cas échéant, l'autorité compétente coordonnatrice informe le fabricant ou, le cas échéant, le mandataire, qui prend alors les mesures correctives de sécurité nécessaires."
  9_prefix: "Article 91"
  9_label: "Actes d'exécution"
  9_desc: "La Commission peut, au moyen d'actes d'exécution, et après avoir consulté le GCDM, définir les modalités et les aspects procéduraux pour l'application des articles 85 à 90 et de l'article 92 en ce qui concerne les éléments suivants: \n\ta. la typologie des incidents graves et des mesures correctives de sécurité concernant des dispositifs ou des catégories ou groupes de dispositifs donnés \n\tb. la notification des incidents graves et des mesures correctives de sécurité et les avis de sécurité, ainsi que la fourniture par les fabricants des rapports de synthèse périodiques, des rapports sur la surveillance après commercialisation, des PSUR et des rapports de tendances, visés respectivement aux articles 85, 86, 87, 88 et 89 \n\tc. des formulaires standard structurés pour la notification électronique et non électronique, comprenant un ensemble minimal de données pour la notification des incidents graves supposés par les professionnels de la santé, les utilisateurs et les patients \n\td. les délais pour la notification des mesures correctives de sécurité et pour la fourniture des rapports de synthèse périodiques et des rapports de tendances par les fabricants, eu égard à la sévérité de l'incident à notifier, comme indiqué à l'article 87 \n\te. des formulaires harmonisés pour l'échange d'informations entre autorités compétentes visé à l'article 89 \n\tf. des procédures pour la désignation d'une autorité compétente coordonnatrice, la procédure d'évaluation coordonnée, notamment les tâches et responsabilités de l'autorité compétente coordinatrice et l'implication d'autres autorités compétentes dans cette procédure. \n\n Les actes d'exécution visés au premier alinéa sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3."
  10:
    prefix: "Article 92"
    title: "Système électronique relatif à la vigilance et à la surveillance après commercialisation"
    1_prefix: "92.1"
    1_label: "La Commission, en collaboration avec les États membres, établit et gère un système électronique de collecte et de traitement des informations suivantes:"
    1_desc: "\ta. les rapports des fabricants sur les incidents graves et les mesures correctives de sécurité, visés à l'article 87, paragraphe 1, et à l'article 89, paragraphe 5; \n\tb. les rapports de synthèse périodiques établis par les fabricants, visés à l'article 87, paragraphe 9; \n\tc. les rapports de tendances établis par les fabricants, visés à l'article 88; \n\td. les PSUR visés à l'article 86; \n\te. les avis de sécurité des fabricants, visés à l'article 89, paragraphe 8; \n\tf. les informations échangées entre les autorités compétentes des États membres et entre celles-ci et la Commission conformément à l'article 89, paragraphes 7 et 9. \n\n Ce système électronique contient tous les liens pertinents vers la base de données IUD."
    2_prefix: "92.2"
    2_label: "Les informations visées au paragraphe 1 du présent article sont mises à la disposition des autorités compétentes des États membres et de la Commission au moyen du système électronique. Les organismes notifiés ont également accès à ces informations, dans la mesure où elles ont un lien avec les dispositifs pour lesquels ils ont délivré un certificat en application de l'article 53."
    3_prefix: "92.3"
    3_label: "La Commission veille à ce que les professionnels de la santé et le public aient un niveau d'accès approprié au système électronique visé au paragraphe 1."
    4_prefix: "92.4"
    4_label: "Sur la base d'accords entre la Commission et les autorités compétentes de pays tiers ou des organisations internationales, la Commission peut accorder à celles-ci un accès au système électronique visé au paragraphe 1, selon le niveau approprié. Ces accords sont fondés sur la réciprocité et prévoient des règles de confidentialité et de protection des données équivalentes à celles qui sont applicables dans l'Union."
    5_prefix: "92.5"
    5_label: "Les rapports sur les incidents graves visés à l'article 87, paragraphe 1, point a), sont automatiquement transmis, dès réception, via le système électronique visé au paragraphe 1 du présent article, à l'autorité compétente de l'État membre dans lequel l'incident est survenu."
    6_prefix: "92.6"
    6_label: "Les rapports de tendances visés à l'article 88, paragraphe 1, sont automatiquement transmis, dès réception, via le système électronique visé au paragraphe 1 du présent article, à l'autorité compétente de l'État membre dans lequel les incidents sont survenus."
    7_prefix: "92.7"
    7_label: "Les rapports sur les mesures correctives de sécurité visés à l'article 87, paragraphe 1, point b), sont automatiquement transmis, dès réception, via le système électronique visé au paragraphe 1 du présent article, à l'autorité compétente des États membres suivants:"
    7_desc: "\ta. les États membres dans lesquels la mesure corrective de sécurité est ou doit être mise en œuvre; \n\tb. l'État membre dans lequel le fabricant a son siège social."
    8_prefix: "92.8"
    8_label: "Les rapports de synthèse périodiques visés à l'article 87, paragraphe 9, sont automatiquement transmis, dès réception, via le système électronique visé au paragraphe 1 du présent article, à l'autorité compétente:"
    8_desc: "\ta. de l'État membre ou des États membres participant à la procédure de coordination visée à l'article 89, paragraphe 9, et qui ont donné leur accord sur le rapport de synthèse périodique; \n\tb. de l'État membre dans lequel le fabricant a son siège social."
    9_prefix: "92.9"
    9_label: "Les informations visées aux paragraphes 5 à 8 du présent article sont automatiquement transmises, dès réception, via le système électronique visé au paragraphe 1 du présent article, à l'organisme notifié qui a délivré le certificat pour le dispositif concerné conformément à l'article 56."
  11:
    prefix: "Article 93"
    title: "Activités de surveillance du marché"
    1_prefix: "93.1"
    1_desc: "Les autorités compétentes contrôlent de manicère appropriée les caractéristiques et les performances des dispositifs en matière de conformité, notamment, le cas échéant, par l'examen de la documentation et par des essais physiques ou en laboratoire sur la base d'échantillons adéquats. Les autorités compétentes tiennent notamment compte des principes établis en matière d'évaluation et de gestion des risques, des données issues de la vigilance et des réclamations."
    2_prefix: "93.2"
    2_label: "Les autorités compétentes élaborent des programmes annuels pour les activités de surveillance et y consacrent les ressources matérielles et humaines appropriées pour pouvoir réaliser ces activités, compte tenu du programme européen de surveillance du marché mis au point par le GCDM conformément à l'article 105 et aux circonstances locales."
    3_prefix: "93.3"
    3_label: "Afin de satisfaire aux obligations qui leur incombent en vertu du paragraphe 1, les autorités compétentes:"
    3_desc: "\ta. peuvent exiger, entre autres, que la documentation et les informations nécessaires pour mener leurs activités soient mises à disposition par les opérateurs economiques et, si cela est justifié, que ceux-ci fournissent gratuitement les échantillons de dispositifs dont elles ont besoin ou donnent accès gratuitement aux dispositifs; et \n\tb. effectuent des inspections annoncées et, si nécessaire, des inspections inopinées dans les locaux des opérateurs economiques, ainsi que des fournisseurs et/ou sous-traitants, et, au besoin, dans les installations des utilisateurs professionnels."
    4_prefix: "93.4"
    4_label: "Les autorités compétentes établissent un résumé annuel des résultats de leurs activités de surveillance et le mettent à la disposition des autres autorités compétentes via le système électronique visé à l'article 100."
    5_prefix: "93.5"
    5_label: "Les autorités compétentes peuvent confisquer, détruire ou rendre inutilisables par d'autres moyens les dispositifs qui présentent un risque inacceptable ou les dispositifs falsifiés si elles le jugent nécessaire dans l'intérêt de la protection de la santé publique."
    6_prefix: "93.6"
    6_label: "Après chacune des inspections effectuées aux fins visées au paragraphe 1, l'autorité compétente établit un rapport sur les conclusions de l'inspection concernant le respect des exigences légales et techniques applicables en vertu du présent règlement. Le rapport indique d'éventuelles mesures correctives nécessaires."
    7_prefix: "93.7"
    7_label: "L'autorité compétente qui a effectué l'inspection communique la teneur du rapport visé au paragraphe 6 du présent article à l'opérateur économique qui a fait l'objet de l'inspection. Avant d'adopter le rapport définitif, l'autorité compétente donne à cet opérateur économique la possibilité de présenter des observations. Ledit rapport d'inspection définitif est introduit dans le système électronique prévu à l'article 100."
    8_prefix: "93.8"
    8_label: "Les États membres procèdent à l'examen et à l'évaluation du fonctionnement de leurs activités de surveillance du marché. Cet examen et cette évaluation sont réalisés au moins tous les quatre ans et leurs résultats sont communiqués aux autres États membres et à la Commission. Chaque État membre met un résumé de ces résultats à la disposition du public via le système électronique visé à l'article 100."
    9_prefix: "93.9"
    9_desc: "Les autorités compétentes des États membres coordonnent leurs activités de surveillance du marché, coopèrent et partagent, également avec la Commission, les résultats y afférents, afin d'assurer un niveau élevé et harmonisé de surveillance du marché dans l'ensemble des États membres. \n\n S'il y a lieu, les autorités compétentes des États membres conviennent de partager leurs tâches, de mener des activités conjointes de surveillance du marché et de se spécialiser."
    10_prefix: "93.10"
    10_label: "Lorsque, dans un même État membre, plusieurs autorités sont responsables de la surveillance du marché et des contrôles aux frontières extérieures, elles coopèrent en partageant les informations relatives à leur rôle et à leurs fonctions."
    11_prefix: "93.11"
    11_label: "S'il y a lieu, les autorités compétentes des États membres coopèrent avec celles de pays tiers en matière d'échange d'informations, d'assistance technique et de développement d'activités liées à la surveillance du marché."
  12_prefix: "Article 94"
  12_label: "Évaluation des dispositifs dont on suspecte qu'ils présentent un risque inacceptable ou une autre non-conformité"
  12_desc: "Lorsque les autorités compétentes d'un État membre, sur la base des données issues de la vigilance ou des activités de surveillance du marché ou d'autres informations, ont des raisons de croire qu'un dispositif: \n\ta. est susceptible de présenter un risque inacceptable pour la santé ou la sécurité des patients, des utilisateurs ou d'autres personnes, ou compte tenu d'autres aspects liés à la protection de la santé publique; ou \n\tb. n'est pas conforme, de toute autre façon, aux exigences du présent règlement; \n\n elles réalisent une évaluation du dispositif concerné, portant sur toutes les exigences du présent règlement relatives au risque présenté par le dispositif ou à toute autre non-conformité du dispositif. \n\n Les opérateurs économiques concernés coopèrent avec les autorités compétentes."
  13:
    prefix: "Article 95"
    title: "Procédure applicable aux dispositifs présentant un risque inacceptable pour la santé et la sécurité"
    1_prefix: "95.1"
    1_desc: "Lorsque, à l'issue d'une évaluation réalisée en application de l'article 94, les autorités compétentes concluent qu'un dispositif présente un risque inacceptable pour la santé ou la sécurité des patients, des utilisateurs ou d'autres personnes, ou compte tenu d'autres aspects liés à la protection de la santé publique, elles exigent sans tarder du fabricant du dispositif concerné, de son mandataire et de tous les autres opérateurs économiques concernés qu'ils prennent toutes les mesures correctives appropriées et dûment justifiées pour rendre le dispositif conforme aux exigences du présent règlement relatives au risque présenté par le dispositif et, d'une manière qui soit proportionnée à la nature du risque, pour restreindre la mise à disposition du dispositif sur le marché, l'assortir d'exigences particulières, retirer le dispositif du marché ou le rappeler, dans un délai raisonnable clairement défini qui est communiqué à l'opérateur économique concerné."
    2_prefix: "95.2"
    2_label: "Les autorités compétentes notifient sans tarder à la Commission, aux autres États membres et, lorsqu'un certificat a été délivré conformément à l'article 56 pour le dispositif concerné, à l'organisme notifié qui a délivré ce certificat, les résultats de l'évaluation et les mesures imposées aux opérateurs économiques concernés, via le système électronique visé à l'article 100."
    3_prefix: "95.3"
    3_label: "Les opérateurs économiques visés au paragraphe 1 s'assurent sans tarder que toutes les mesures correctives appropriées sont prises dans l'ensemble de l'Union pour tous les dispositifs en cause qu'il a mis à disposition sur le marché."
    4_prefix: "95.4"
    4_desc: "Lorsque l'opérateur économique visé au paragraphe 1 ne prend pas de mesures correctives adéquates dans le délai visé au paragraphe 1, les autorités compétentes prennent toutes les mesures appropriées pour interdire ou restreindre la mise à disposition du dispositif sur leur marché national, pour l'en retirer ou pour le rappeler. \n\n Les autorités compétentes notifient sans tarder ces mesures à la Commission, aux autres États membres et à l'organisme notifié visé au paragraphe 2 du présent article, via le système électronique visé à l'article 100."
    5_prefix: "95.5"
    5_label: "La notification visée au paragraphe 4 précise toutes les données disponibles, notamment celles permettant d'identifier le dispositif non conforme, d'en assurer la traçabilité et de déterminer son origine, la nature et les raisons de la non-conformité alléguée et du risque encouru, ainsi que la nature et la durée des mesures prises au niveau national et les arguments avancés par l'opérateur économique concerné."
    6_prefix: "95.6"
    6_desc: "Les États membres autres que celui qui engage la procédure notifient sans tarder à la Commission et aux autres États membres, via le système électronique visé à l'article 100, toute information supplémentaire pertinente dont ils disposent concernant la non-conformité du dispositif concerné ainsi que toute mesure qu'ils ont adoptée à l'égard de celui-ci. \n\n En cas de désaccord avec la mesure nationale notifiée, ils informent sans tarder la Commission et les autres États membres de leurs objections, via le système électronique visé à l'article 100."
    7_prefix: "95.7"
    7_desc: "Lorsque, dans un délai de deux mois à compter de la réception de la notification visée au paragraphe 4, aucune objection n'a été soulevée par un État membre ou par la Commission à l'encontre d'une des mesures prises par un État membre, ces mesures sont considérées comme justifiées. \n\n Dans ce cas, tous les États membres veillent à ce que des mesures restrictives ou des mesures d'interdiction appropriées, y compris le retrait, le rappel ou la limitation de la mise à disposition du dispositif sur leur marché national, soient prises sans tarder à l'égard du dispositif concerné."
  14:
    prefix: "Article 96"
    title: "Procédure d'évaluation des mesures nationales au niveau de l'Union"
    1_prefix: "96.1"
    1_desc: "Lorsque, dans un délai de deux mois suivant la réception de la notification visée à l'article 95, paragraphe 4, un État membre soulève des objections à l'encontre d'une mesure prise par un autre État membre ou que la Commission estime que celle-ci est contraire au droit de l'Union, la Commission évalue cette mesure nationale, après avoir consulté les autorités compétentes concernées et, le cas échéant, les opérateurs économiques concernés. En fonction des résultats de cette évaluation, la Commission peut décider, au moyen d'actes d'exécution, si la mesure nationale est justifiée ou non. Ces actes d'exécution sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3."
    2_prefix: "96.2"
    2_desc: "Lorsque la Commission estime que la mesure nationale est justifiée en application du paragraphe 1 du présent article, l'article 95, paragraphe 7, deuxième alinéa, s'applique. Si la Commission estime que la mesure nationale n'est pas justifiée, l'État membre concerné retire la mesure en cause. \n\n Lorsque la Commission ne prend pas de décision en application du paragraphe 1 du présent article dans un délai de huit mois suivant la réception de la notification visée à l'article 95, paragraphe 4, la mesure nationale est considérée comme justifiée."
    3_prefix: "96.3"
    3_desc: "Lorsqu'un État membre ou la Commission considère que le risque pour la santé et la sécurité présenté par un dispositif ne peut pas être atténué de manière satisfaisante par les mesures prises par le ou les États membres concernés, la Commission, à la demande d'un État membre ou de sa propre initiative, peut prendre, au moyen d'actes d'exécution, les mesures nécessaires et dûment justifiées pour garantir la protection de la santé et de la sécurité, notamment des mesures de restriction ou d'interdiction de la mise sur le marché et de la mise en service du dispositif concerné. Ces actes d'exécution sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3."
  15:
    prefix: "Article 97"
    title: "Autre non-conformité"
    1_prefix: "97.1"
    1_desc: "Lorsque, à l'issue d'une évaluation réalisée conformément à l'article 94, les autorités compétentes d'un État membre concluent qu'un dispositif n'est pas conforme aux exigences du présent règlement mais ne présente pas un risque inacceptable pour la santé ou la sécurité des patients, des utilisateurs ou d'autres personnes, ou compte tenu d'autres aspects liés à la protection de la santé publique, elles exigent de l'opérateur économique concerné qu'il mette un terme à la non-conformité en cause dans un délai raisonnable clairement défini qui est communiqué à l'opérateur économique et qui est proportionné à la non-conformité."
    2_prefix: "97.2"
    2_desc: "Lorsque l'opérateur économique ne met pas un terme à la non-conformité dans le délai visé au paragraphe 1 du présent article, l'État membre concerné prend sans tarder toutes les mesures appropriées pour restreindre ou interdire la mise à disposition du produit sur le marché, ou pour que celui-ci soit rappelé ou retiré du marché. Il notifie sans tarder ces mesures à la Commission et aux autres États membres via le système électronique visé à l'article 100."
    3_prefix: "97.3"
    3_label: "Afin d'assurer l'application uniforme du présent article, la Commission peut, au moyen d'actes d'exécution, définir les mesures appropriées à prendre par les autorités compétentes pour traiter certains types de non-conformité. Ces actes d'exécution sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3."
  16:
    prefix: "Article 98"
    title: "Mesures préventives de protection de la santé"
    1_prefix: "98.1"
    1_desc: "Lorsqu'un État membre, à l'issue d'une évaluation indiquant qu'un dispositif ou une catégorie ou un groupe spécifique de dispositifs présente un risque potentiel, considère que, pour protéger la santé et la sécurité des patients, des utilisateurs ou d'autres personnes, ou compte tenu d'autres aspects liés à la santé publique, la mise à disposition sur le marché ou la mise en service d'un dispositif ou d'une catégorie ou d'un groupe spécifique de dispositifs devrait être interdite, restreinte ou assortie d'exigences particulières, ou que le dispositif ou la catégorie ou le groupe de dispositifs en question devrait être retiré du marché ou rappelé, il peut prendre toute mesure nécessaire et justifiée."
    2_prefix: "98.2"
    2_label: "L'État membre visé au paragraphe 1 notifie immédiatement ces mesures, en motivant sa décision, à la Commission et à tous les autres États membres via le système électronique visé à l'article 100."
    3_prefix: "98.3"
    3_desc: "La Commission, en concertation avec le GCDM et, le cas échéant, les opérateurs économiques concernés, évalue les mesures nationales prises. La Commission peut décider, au moyen d'actes d'exécution, si les mesures nationales sont justifiées ou non. En l'absence de décision de la Commission dans un délai de six mois suivant leur notification, les mesures nationales sont considérées comme justifiées. Ces actes d'exécution sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3."
    4_prefix: "98.4"
    4_desc: "Lorsque l'évaluation visée au paragraphe 3 du présent article montre que la mise à disposition sur le marché ou la mise en service d'un dispositif ou d'une catégorie ou d'un groupe spécifique de dispositifs devrait être interdite, restreinte ou assortie d'exigences particulières, ou que le dispositif ou la catégorie ou le groupe de dispositifs en question devrait être retiré du marché ou rappelé dans tous les États membres pour protéger la santé et la sécurité des patients, des utilisateurs ou d'autres personnes, ou compte tenu d'autres aspects liés à la santé publique, la Commission peut adopter des actes d'exécution pour prendre les mesures nécessaires et dûment justifiées. Ces actes d'exécution sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3."
  17:
    prefix: "Article 99"
    title: "Bonnes pratiques administratives"
    1_prefix: "99.1"
    1_desc: "Toute mesure adoptée par les autorités compétentes des États membres en vertu des articles 95 à 98 indique les motifs exacts sur lesquels elle repose. Lorsqu'une telle mesure est adressée à un opérateur économique particulier, l'autorité compétente la notifie sans tarder à l'opérateur économique en question et elle l'informe en même temps des voies de recours dont il dispose en vertu du droit ou des pratiques administratives de l'État membre concerné ainsi que des délais y afférents. Si la mesure présente une applicabilité générale, elle est publiée en conséquence."
    2_prefix: "99.2"
    2_desc: "Sauf lorsqu'une action immédiate est requise en raison d'un risque inacceptable pour la santé et la sécurité des personnes, l'opérateur économique concerné doit avoir la possibilité de présenter ses observations à l'autorité compétente dans un délai approprié clairement défini avant l'adoption d'une mesure. \n\n Lorsqu'une mesure a été prise sans que l'opérateur économique ait eu la possibilité de présenter des observations conformément au premier alinéa, il doit pouvoir présenter ses observations dès que possible, après quoi la mesure adoptée est réexaminée dans les meilleurs délais."
    3_prefix: "99.3"
    3_label: "Toute mesure adoptée est immédiatement retirée ou modifiée si l'opérateur économique prouve qu'il a pris des mesures correctives efficaces et que le dispositif est conforme aux exigences du présent règlement."
    4_prefix: "99.4"
    4_label: "Lorsqu'une mesure adoptée en vertu des articles 95 à 98 concerne un dispositif pour l'évaluation de la conformité duquel un organisme notifié est intervenu, les autorités compétentes informent celui-ci ainsi que l'autorité responsable dont il relève de la mesure prise, via le système électronique visé à l'article 100."
  18:
    prefix: "Article 100"
    title: "Système électronique relatif à la surveillance du marché"
    1_prefix: "100.1"
    1_label: "La Commission, en collaboration avec les États membres, établit et gère un système électronique de collecte et de traitement:"
    1_desc: "\ta. des résumés des résultats des activités de surveillance, visés à l'article 93, paragraphe 4; \n\tb. du rapport d'inspection définitif visé à l'article 93, paragraphe 7; \n\tc. des informations relatives aux dispositifs présentant un risque inacceptable pour la santé et la sécurité, visées à l'article 95, paragraphes 2, 4 et 6; \n\td. des informations relatives à la non-conformité des produits, visées à l'article 97, paragraphe 2; \n\te. des informations relatives aux mesures préventives de protection de la santé, visées à l'article 98, paragraphe 2; \n\tf. des résumés des résultats des examens et évaluations des activités de surveillance du marche menées par les États membres, visés à l'article 93, paragraphe 8."
    2_prefix: "100.2"
    2_label: "Les informations visées au paragraphe 1 du présent article sont immédiatement transmises via le système électronique à toutes les autorités compétentes concernées et, le cas échureant, à l'organisme notifié qui a délivré le certificat conformément à l'article 56 pour le dispositif concerné, et sont accessibles aux États membres et à la Commission."
    3_prefix: "100.3"
    3_label: "Les informations échangées entre États membres ne sont pas rendues publiques lorsque les activités de surveillance du marché et la coopération entre les États membres risqueraient de s'en ressentir."
8:
  prefix: "Chapitre VIII"
  title: "Coopération entre les états membres, le groupe de coordination en matière de dispositifs médicaux, les laboratoires spécialisés, les groupes d'experts et les registres de dispositifs"
  1_prefix: "Article 101"
  1_label: "Autorités compétentes"
  1_desc: "Les États membres désignent la ou les autorités compétentes chargées de la mise en œuvre du présent règlement. Ils veillent à ce que celles-ci disposent des pouvoirs, des ressources, de l'équipement et des connaissances nécessaires pour accomplir correctement les tâches qui leur incombent en vertu du présent règlement. Les États membres communiquent les noms et coordonnées des autorités compétentes à la Commission, qui en publie la liste."
  2:
    prefix: "Article 102"
    1_prefix: "102.1"
    title: "Coopération"
    1_label: "Les autorités compétentes des États membres coopèrent les unes avec les autres ainsi qu'avec la Commission. La Commission veille à l'organisation des échanges d'informations nécessaires à une application uniforme du présent règlement."
    2_prefix: "102.2"
    2_label: "Les États membres, avec le soutien de la Commission, participent, s'il y a lieu, aux initiatives mises au point au niveau international dans le but d'assurer la coopération des autorités chargées de la réglementation dans le domaine des dispositifs médicaux."
  3:
    prefix: "Article 103"
    title: "Groupe de coordination en matière de dispositifs médicaux"
    1_prefix: "103.1"
    1_label: "Un groupe de coordination en matière de dispositifs médicaux (GCDM) est institué."
    2_prefix: "103.2"
    2_desc: "Chaque État membre nomme dans le GCDM, pour un mandat de trois ans renouvelable, un membre titulaire et un suppléant compétents dans le domaine des dispositifs médicaux, ainsi qu'un membre titulaire et un suppléant compétents dans le domaine des dispositifs médicaux de diagnostic in vitro. Un État membre peut choisir de ne nommer qu'un membre titulaire et un suppléant compétents chacun dans ces deux domaines. \n\n Les membres du GCDM sont choisis pour leurs compétences et leur expérience dans le domaine des dispositifs médicaux et des dispositifs médicaux de diagnostic in vitro. Ils représentent les autorités compétentes des États membres. Le nom et l'organisme d'affiliation des membres sont rendus publics par la Commission. \n\n Les suppléants représentent les membres titulaires et votent pour ceux-ci en leur absence."
    3_prefix: "103.3"
    3_desc: "Le GCDM se réunit à intervalles réguliers et, dès que la situation l'exige, à la demande de la Commission ou d'un État membre. Assistent aux réunions, selon le cas, les membres désignés au titre de leur fonction et de leurs compétences dans le domaine des dispositifs médicaux, les membres désignés pour leurs compétences dans le domaine des dispositifs médicaux de diagnostic in vitro ou les membres désignés pour leurs compétences dans les deux domaines, ou leurs suppléants."
    4_prefix: "103.4"
    4_label: "Le GCDM s'efforce de parvenir à un consensus. Faute de consensus, il statue à la majorité de ses membres. Les membres dont la position diverge peuvent demander que celle-ci, ainsi que les motifs sur lesquels elle s'appuie, soient documentées dans la prise de position du GCDM."
    5_prefix: "103.5"
    5_label: "Le GCDM est présidé par un représentant de la Commission. Le président ne prend pas part aux votes du GCDM."
    6_prefix: "103.6"
    6_label: "Le GCDM peut, ponctuellement, inviter des experts et d'autres tiers à assister aux réunions ou à apporter des contributions écrites."
    7_prefix: "103.7"
    7_label: "Le GCDM peut créer des sous-groupes permanents ou temporaires. S'il y a lieu, des organisations représentant les intérêts de l'industrie des dispositifs médicaux, des professionnels de la santé, des laboratoires, des patients et des consommateurs à l'échelle de l'Union sont invités dans ces sous-groupes en qualité d'observateurs."
    8_prefix: "103.8"
    8_label: "Le GCDM établit son règlement intérieur, qui définit notamment les procédures concernant:"
    8_desc: "\t— l'adoption des avis, des recommandations ou d'autres prises de position, y compris en cas d'urgence, \n\t— la délégation de tâches aux membres faisant office de rapporteur et de corapporteur, \n\t— la mise en œuvre de l'article 107 relatif aux conflits d'intérêts, \n\t— le fonctionnement des sous-groupes."
    9_prefix: "103.9"
    9_label: "Le GCDM exécute les tâches énoncées à l'article 105 du présent règlement et à l'article 99 du règlement (UE) 2017/746."
  4_prefix: "Article 104"
  4_label: "Soutien de la Commission"
  4_desc: "La Commission apporte son soutien à la coopération entre les autorités compétentes nationales. Elle veille en particulier à l'organisation d'échanges d'expérience entre les autorités compétentes et fournit un soutien technique, scientifique et logistique au GCDM et à ses sous-groupes. Elle organise les réunions du GCDM et de ses sous-groupes, auxquelles elle participe et dont elle assure le suivi."
  5_prefix: "Article 105"
  5_label: "Tâches du GCDM"
  5_desc: "En vertu du présent règlement, les tâches du GCDM sont les suivantes: \n\ta. contribuer à l'évaluation des candidats à la fonction d'organisme d'évaluation de la conformité et d'organisme notifié conformément aux dispositions établies au chapitre IV; \n\tb. fournir des conseils à la Commission, à sa demande, pour les questions concernant le groupe de coordination des organismes notifiés mis en place en vertu de l'article 49 \n\tc. contribuer à l'élaboration d'orientations pour une application efficace et harmonisée du présent règlement, notamment en ce qui concerne la désignation et la surveillance des organismes notifiés, l'application des exigences générales en matière de sécurité et de performances et la réalisation d'évaluations et la conduite d'investigations cliniques par les fabricants, l'évaluation réalisée par les organismes notifiés et les activités de vigilance \n\td. contribuer à assurer le suivi permanent des progrès techniques, à évaluer si les exigences générales en matière de sécurité et de performances énoncées dans le présent règlement et dans le règlement (UE) 2017/746 permettent de garantir la sécurité et les performances des dispositifs, et contribuer ainsi à apprécier la nécessité de modifier l'annexe I du présent règlement \n\te. contribuer à l'élaboration de normes concernant les dispositifs, de spécifications communes et d'orientations scientifiques, y compris des orientations par produit, concernant les investigations cliniques de certains dispositifs, en particulier les dispositifs implantables et de classe III \n\tf. assister les autorités compétentes des États membres dans leurs activités de coordination, notamment dans les domaines de la classification et de la détermination du statut des dispositifs au regard de la réglementation, des investigations cliniques, de la vigilance et de la surveillance du marché, y compris l'élaboration et le maintien d'un cadre pour un programme européen de surveillance du marché, dans un souci d'efficacité et d'harmonisation de la surveillance du marché dans l'Union, conformément à l'article 93 \n\tg. fournir des conseils, de sa propre initiative ou à la demande de la Commission, dans l'examen de toute question liée à l'application du présent règlement \n\th. contribuer à l'harmonisation des pratiques administratives relatives aux dispositifs dans les États membres."
  6:
    prefix: "Article 106"
    title: "Avis et conseils scientifiques, techniques et cliniques"
    1_prefix: "106.1"
    1_desc: "La Commission, au moyen d'actes d'exécution et en concertation avec le GCDM, veille à ce que des groupes d'experts soient désignés pour évaluer l'évaluation clinique dans les différentes disciplines médicales, conformément au paragraphe 9 du présent article, et pour communiquer leurs points de vue sur l'évaluation des performances de certains dispositifs médicaux de diagnostic in vitro, conformément à l'article 48, paragraphe 6, du règlement (UE) 2017/746 et, au besoin, pour des catégories ou groupes de dispositifs, ou pour des dangers particuliers liés à des catégories ou groupes de dispositifs, dans le respect des principes des compétences scientifiques, de l'impartialité, de l'indépendance et de la transparence les plus élevées. Les mêmes principes s'appliquent lorsque la Commission décide de désigner des laboratoires spécialisés conformément au paragraphe 7 du présent article."
    2_prefix: "106.2"
    2_label: "Les groupes d'experts et les laboratoires spécialisés peuvent être désignés dans des domaines pour lesquels la Commission, en concertation avec le GCDM, a constaté que l'application du présent règlement nécessite des conseils scientifiques, techniques et/ou cliniques cohérents ou l'expertise de laboratoires spécialisés. Les groupes d'experts et les laboratoires spécialisés peuvent être désignés à titre permanent ou temporaire."
    3_prefix: "106.3"
    3_desc: "Les groupes d'experts sont composés de conseillers nommés par la Commission en fonction de leur expertise clinique, scientifique ou technique de pointe dans la discipline concernée et selon une répartition géographique correspondant à la diversité des approches scientifiques et cliniques dans l'Union. La Commission fixe le nombre de membres de chaque groupe en fonction des besoins. \n\n Les membres des groupes d'experts accomplissent leurs tâches avec impartialité et objectivité. Ils n'acceptent d'instructions d'aucun organisme notifié ni d'aucun fabricant. Chaque membre établit une déclaration d'intérêts, qui est rendue publique. \n\n La Commission met en place des systèmes et des procédures visant à prévenir et gérer efficacement les conflits d'intérêts potentiels."
    4_prefix: "106.4"
    4_label: "Lorsqu'ils élaborent leurs avis scientifiques, les groupes d'experts tiennent compte des informations pertinentes fournies par les parties prenantes, y compris les organisations de patients et les professionnels de la santé."
    5_prefix: "106.5"
    5_desc: "La Commission peut, après avoir consulté le GCDM, nommer des conseillers auprès des groupes d'experts à la suite de la publication d'un appel à manifestation d'intérêt au Journal officiel de l'Union européenne et sur le site internet de la Commission. En fonction du type de tâche et du besoin d'expertise particulière, les conseillers peuvent être nommés auprès des groupes d'experts pour une durée maximale de trois ans et leur mandat est renouvelable."
    6_prefix: "106.6"
    6_label: "La Commission peut, après avoir consulté le GCDM, inscrire des conseillers sur une liste centrale d'experts disponibles qui, sans être officiellement nommés auprès d'un groupe, sont disponibles pour conseiller le groupe d'experts et soutenir ses travaux, le cas échéant. Cette liste est publiée sur le site internet de la Commission."
    7_prefix: "106.7"
    7_label: "La Commission peut, au moyen d'actes d'exécution et après consultation du GCDM, désigner des laboratoires spécialisés, en fonction de leur expertise en:"
    7_desc: "\t— caractérisation physico-chimique, ou \n\t— méthodes d'essai microbiologiques, de biocompatibilité, mécaniques, électriques, électroniques et toxicologiques non cliniques de dispositifs ou de catégories ou groupes de dispositifs donnés. \n\n La Commission ne désigne que des laboratoires spécialisés pour lesquels une candidature a été présentée à cette fin par un État membre ou par le Centre commun de recherche."
    8_prefix: "106.8"
    8_label: "Les laboratoires spécialisés satisfont aux critères suivants:"
    8_desc: "\ta. ils disposent d'un personnel suffisant et qualifié doté des connaissances et de l'expérience adéquates dans le domaine des dispositifs pour lequel ils sont désignés; \n\tb. ils disposent des équipements nécessaires pour exécuter les tâches qui leur incombent \n\tc. ils disposent d'une connaissance adéquate des normes et bonnes pratiques internationales \n\td. ils disposent d'une organisation et d'une structure administratives appropriées \n\te. ils garantissent que les membres de leur personnel respectent la confidentialité des informations et données obtenues dans l'exécution de leurs tâches. "
    9_prefix: "106.9"
    9_label: "Les groupes d'experts désignés pour l'évaluation clinique dans les différentes disciplines médicales accomplissent les tâches prévues à l'article 54, paragraphe 1, à l'article 61, paragraphe 2, et à l'annexe IX, section 5.1, ou à l'annexe X, section 6, selon le cas."
    10_prefix: "106.10"
    10_label: "Les groupes d'experts et les laboratoires spécialisés peuvent réaliser les tâches suivantes, selon les besoins:"
    10_desc: "\ta. fournir une assistance scientifique, technique et clinique à la Commission et au GCDM en rapport avec l'application du présent règlement; \n\tb. contribuer à l'élaboration et au maintien d'orientations et de spécifications communes appropriées pour: \n\t\t— les investigations cliniques \n\t\t— l'évaluation clinique et le SCAC \n\t\t— les études de performances \n\t\t— l'évaluation des performances et le suivi des performances après commercialisation \n\t\t— la caractérisation physico-chimique, e \n\t\t— les méthodes d'essai microbiologiques, de biocompatibilité, mécaniques, électriques, électroniques ou toxicologiques non cliniques \n\n pour des dispositifs donnés ou une catégorie ou un groupe de dispositifs, ou pour des dangers particuliers liés à une catégorie ou un groupe de dispositifs; \n\tc. élaborer et examiner des orientations pour l'évaluation clinique et pour l'évaluation des performances aux fins de la réalisation de l'évaluation de la conformité correspondant à l'état de l'art en ce qui concerne l'évaluation clinique, l'évaluation des performances, la caractérisation physico-chimique, et les méthodes d'essai microbiologique, de biocompatibilité, mécaniques, électriques, électroniques ou toxicologiques non cliniques \n\td. contribuer à l'élaboration de normes au niveau international, en veillant à ce qu'elles correspondent à l'état de l'art \n\te. émettre des avis sur consultation des fabricants conformément à l'article 61, paragraphe 2, des organismes notifiés et des États membres conformément aux paragraphes 11 à 13 du présent article \n\tf. contribuer à identifier les préoccupations et les questions qui se font jour en matière de sécurité et de performances des dispositifs médicaux \n\tg. communiquer leurs points de vue sur l'évaluation des performances de certains dispositifs médicaux de diagnostic in vitro, conformément à l'article 48, paragraphe 4, du règlement (UE) 2017/746."
    11_prefix: "106.11"
    11_desc: "La Commission facilite l'accès des États membres, des organismes notifiés et des fabricants aux conseils fournis par les groupes d'experts et les laboratoires spécialisés concernant, entre autres, les critères pour une série de données appropriée permettant d'évaluer la conformité d'un dispositif, en particulier pour ce qui est des données cliniques requises pour l'évaluation clinique, en ce qui concerne la caractérisation physico-chimique, ainsi que les méthodes d'essai microbiologiques, de biocompatibilité, mécaniques, électriques, électroniques et toxicologiques non cliniques."
    12_prefix: "106.12"
    12_desc: "Lorsqu'ils adoptent un avis scientifique conformément au paragraphe 9, les membres des groupes d'experts s'efforcent de parvenir à un consensus. Faute de consensus, les groupes d'experts statuent à la majorité de leurs membres et l'avis scientifique mentionne les positions divergentes et les motifs sur lesquels elles s'appuient. \n\n La Commission publie les avis et conseils scientifiques émis conformément aux paragraphes 9 et 11 du présent article, en veillant à la confidentialité conformément à l'article 109. Les orientations pour l'évaluation clinique visées au paragraphe 10, point c), du présent article sont publiées après consultation du GCDM."
    13_prefix: "106.13"
    13_desc: "La Commission peut exiger des fabricants et des organismes notifiés qu'ils s'acquittent d'une redevance pour les conseils fournis par les groupes d'experts et les laboratoires spécialisés. La structure et le montant des redevances ainsi que le niveau et la structure des frais remboursables sont adoptés par la Commission, au moyen d'actes d'exécution, eu égard aux objectifs en matière d'application correcte du présent règlement, de protection de la santé et de la sécurité, de stimulation de l'innovation, d'efficacité au regard des coûts et compte tenu de la nécessité de susciter une participation active aux groupes d'experts. Ces actes d'exécution sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3."
    14_prefix: "106.14"
    14_desc: "Les redevances dues à la Commission conformément à la procédure prévue au paragraphe 13 du présent article sont fixées de manière transparente et sur la base des coûts des services fournis. Les redevances dues sont réduites au cas où est engagée, conformément à l'annexe IX, section 5.1, point c), une procédure de consultation dans le cadre d'une évaluation clinique concernant un fabricant qui est une micro, petite ou moyenne entreprise au sens de la recommandation 2003/361/CE."
    15_prefix: "106.15"
    15_label: "La Commission est habilitée à adopter des actes délégués conformément à l'article 115 pour modifier la définition des tâches des groupes d'experts et des laboratoires spécialisés visés au paragraphe 10 du présent article."
  7:
    prefix: "Article 107"
    title: "Conflits d'intérêts"
    1_prefix: "107.1"
    1_desc: "Les membres du GCDM et de ses sous-groupes, et les membres des groupes d'experts et des laboratoires spécialisés ne doivent avoir aucun intérêt de nature financière ou autre dans l'industrie des dispositifs médicaux susceptible de compromettre leur impartialité. Ils s'engagent à agir dans l'intérêt général et de manière indépendante. Ils déclarent tout intérêt direct ou indirect qu'ils peuvent avoir dans l'industrie des dispositifs médicaux et actualisent cette déclaration dès lors qu'intervient une modification pertinente dans leur situation. La déclaration d'intérêts est mise à la disposition du public sur le site internet de la Commission. Le présent article ne s'applique pas aux représentants des organisations de parties prenantes participant aux sous-groupes du GCDM."
    2_prefix: "107.2"
    2_label: "Les experts et autres tiers ponctuellement invités par le GCDM déclarent tout intérêt qu'ils peuvent avoir par rapport à la question en cause."
  8_prefix: "Article 108"
  8_label: "Registres de dispositifs et banques de données"
  8_desc: "La Commission et les États membres prennent toutes les mesures appropriées pour encourager la mise en place de registres et de banques de données pour des types de dispositifs donnés, en définissant des principes communs pour collecter des données comparables. Ces registres et banques de données contribuent à l'évaluation indépendante de la sécurité et des performances à long terme des dispositifs ou à la traçabilité des dispositifs implantables, ou à l'ensemble de ces caractéristiques."
9:
  prefix: "Chapitre IX"
  title: "Confidentialité, Protection des données, financement et sanctions"
  1:
    prefix: "Article 109"
    title: "Confidentialité"
    1_prefix: "109.1"
    1_label: "Sauf disposition contraire du présent règlement et sans préjudice des dispositions et pratiques nationales en vigueur dans les États membres en matière de confidentialité, toutes les parties concernées par l'application du présent règlement respectent la confidentialité des informations et données obtenues dans l'exécution de leurs tâches de manière à protéger:"
    1_desc: "\ta. les données à caractère personnel, conformément à l'article 110; \n\tb. les informations confidentielles de nature commerciale et les secrets d'affaires des personnes physiques ou morales, y compris les droits de propriété intellectuelle, sauf si l'intérêt public justifie la divulgation; \n\tc. l'application effective du présent règlement, notamment en ce qui concerne les inspections, les investigations ou les audits."
    2_prefix: "109.2"
    2_label: "Sans préjudice du paragraphe 1, les informations échangées à titre confidentiel entre les autorités compétentes et entre celles-ci et la Commission ne sont pas divulguées sans l'accord préalable de l'autorité dont elles émanent."
    3_prefix: "109.3"
    3_label: "Les paragraphes 1 et 2 sont sans effet sur les droits et obligations de la Commission, des États membres et des organismes notifiés en matière d'échange d'informations et de diffusion de mises en garde, et sur les obligations d'information incombant aux personnes concernées en vertu du droit pénal."
    4_prefix: "109.4"
    4_label: "La Commission et les États membres peuvent échanger des informations confidentielles avec les autorités de réglementation de pays tiers avec lesquels ils ont conclu des accords bilatéraux ou multilatéraux en matière de confidentialité."
  2:
    prefix: "Article 110"
    title: "Protection des données"
    1_prefix: "110.1"
    1_label: "Les États membres appliquent la directive 95/46/CE au traitement des données à caractère personnel effectué dans les États membres en vertu du présent règlement."
    2_prefix: "110.2"
    2_label: "Le règlement (CE) no 45/2001 s'applique au traitement des données à caractère personnel effectué par la Commission en vertu du présent règlement."
  3:
    prefix: "Article 111"
    title: "Perception de redevances"
    1_prefix: "111.1"
    1_label: "Le présent règlement ne préjuge pas de la possibilité des États membres de prélever une redevance pour les activités prévues par le présent règlement, à condition que le montant de celle-ci soit fixé de manière transparente et conformément au principe de couverture des coûts."
    2_prefix: "111.2"
    2_label: "Les États membres informent la Commission et les autres États membres, au moins trois mois avant leur mise en place, de la structure et du montant des redevances. La structure et le montant des redevances sont rendus publics sur demande."
  4_prefix: "Article 112"
  4_label: "Financement des activités liées à la désignation et au contrôle des organismes notifiés"
  4_desc: "Les coûts liés aux activités d'évaluation conjointe sont à la charge de la Commission. La Commission établit, au moyen d'actes d'exécution, le niveau et la structure des frais remboursables ainsi que d'autres modalités d'application nécessaires. Ces actes d'exécution sont adoptés en conformité avec la procédure d'examen visée à l'article 114, paragraphe 3."
  5_prefix: "Article 113"
  5_label: "Sanctions"
  5_desc: "Les États membres déterminent le régime des sanctions applicables aux violations des dispositions du présent règlement et prennent toutes les mesures nécessaires pour assurer leur mise en œuvre. Les sanctions prévues sont effectives, proportionnées et dissuasives. Les États membres notifient ce régime et ces mesures à la Commission au plus tard le 25 février 2020 et toute modification ultérieure les concernant dans les meilleurs délais."
10:
  prefix: "Chapitre X"
  title: "Disposition finales"
  1:
    prefix: "Article 114"
    title: "Comité"
    1_prefix: "114.1"
    1_label: "La Commission est assistée par le comité «Dispositifs médicaux». Ledit comité est un comité au sens du règlement (UE) no 182/2011."
    2_prefix: "114.2"
    2_label: "Lorsqu'il est fait référence au présent paragraphe, l'article 4 du règlement (UE) no 182/2011 s'applique."
    3_prefix: "114.3"
    3_desc: "Lorsqu'il est fait référence au présent paragraphe, l'article 5 du règlement (UE) no 182/2011 s'applique. \n\n Lorsque le comité n'émet aucun avis, la Commission n'adopte pas le projet d'acte d'exécution, et l'article 5, paragraphe 4, troisième alinéa, du règlement (UE) no 182/2011 s'applique."
    4_prefix: "114.4"
    4_label: "Lorsqu'il est fait référence au présent paragraphe, l'article 8 du règlement (UE) no 182/2011 s'applique, en liaison avec l'article 4 ou l'article 5, selon le cas."
  2:
    prefix: "Article 115"
    title: "Exercice de la délégation"
    1_prefix: "115.1"
    1_label: "Le pouvoir d'adopter des actes délégués conféré à la Commission est soumis aux conditions fixées au présent article."
    2_prefix: "115.2"
    2_desc: "Le pouvoir d'adopter des actes délégués visé à l'article 1er, paragraphe 5, à l'article 3, à l'article 10, paragraphe 4, à l'article 18, paragraphe 3, à l'article 19, paragraphe 4, à l'article 27, paragraphe 10, à l'article 44, paragraphe 11, à l'article 52, paragraphe 5, à l'article 56, paragraphe 6, à l'article 61, paragraphe 8, à l'article 70, paragraphe 8, et à l'article 106, paragraphe 15, est conféré à la Commission pour une période de cinq ans à compter du 25 mai 2017. La Commission élabore un rapport relatif à la délégation de pouvoir au plus tard neuf mois avant la fin de la période de cinq ans. La délégation de pouvoir est tacitement prorogée pour des périodes d'une durée identique, sauf si le Parlement européen ou le Conseil s'oppose à cette prorogation trois mois au plus tard avant la fin de chaque période."
    3_prefix: "115.3"
    3_desc: "La délégation de pouvoir visée à l'article 1er, paragraphe 5, à l'article 3, à l'article 10, paragraphe 4, à l'article 18, paragraphe 3, à l'article 19, paragraphe 4, à l'article 27, paragraphe 10, à l'article 44, paragraphe 11, à l'article 52, paragraphe 5, à l'article 56, paragraphe 6, à l'article 61, paragraphe 8, à l'article 70, paragraphe 8, et à l'article 106, paragraphe 15, peut être révoquée à tout moment par le Parlement européen ou le Conseil. La décision de révocation met fin à la délégation de pouvoir qui y est précisée. La révocation prend effet le jour suivant celui de la publication de ladite décision au Journal officiel de l'Union européenne ou à une date ultérieure qui est précisée dans ladite décision. Elle ne porte pas atteinte à la validité des actes délégués déjà en vigueur."
    4_prefix: "115.4"
    4_label: "Avant l'adoption d'un acte délégué, la Commission consulte les experts désignés par chaque État membre, conformément aux principes définis dans l'accord interinstitutionnel du 13 avril 2016«Mieux légiférer»."
    5_prefix: "115.5"
    5_label: "Aussitôt qu'elle adopte un acte délégué, la Commission le notifie au Parlement européen et au Conseil simultanément."
    6_prefix: "115.6"
    6_desc: "Un acte délégué adopté en vertu de l'article 1er, paragraphe 5, de l'article 3, de l'article 10, paragraphe 4, de l'article 18, paragraphe 3, de l'article 19, paragraphe 4, de l'article 27, paragraphe 10, de l'article 44, paragraphe 11, de l'article 52, paragraphe 5, de l'article 56, paragraphe 6, de l'article 61, paragraphe 8, de l'article 70, paragraphe 8, et de l'article 106, paragraphe 15, n'entre en vigueur que si le Parlement européen ou le Conseil n'a pas exprimé d'objections dans un délai de trois mois à compter de la notification de cet acte au Parlement européen et au Conseil ou si, avant l'expiration de ce délai, le Parlement européen et le Conseil ont tous deux informé la Commission de leur intention de ne pas exprimer d'objections. Ce délai est prolongé de trois mois à l'initiative du Parlement européen ou du Conseil."
  3_prefix: "Article 116"
  3_label: "Actes délégués distincts pour chaque délégation de pouvoir"
  3_desc: "La Commission adopte un acte délégué distinct pour chaque délégation de pouvoir prévue par le présent règlement."
  4_prefix: "Article 117"
  4_label: "Modification de la directive 2001/83/CE"
  4_desc: "À l'annexe I de la directive 2001/83/CE, section 3.2, le point (12) est remplacé par le texte suivant: \n\n «(12) \n\n Lorsque, en application de l'article 1er, paragraphe 8, deuxième alinéa, ou de l'article 1er, paragraphe 9, deuxième alinéa, du règlement (UE) 2017/745 du Parlement européen et du Conseil (*1), un produit est régi par la présente directive, le dossier de demande d'autorisation de mise sur le marché contient, si ces données sont disponibles, les résultats de l'évaluation de la conformité de la partie constituant le dispositif avec les exigences générales en matière de sécurité et de performances énoncées à l'annexe I dudit règlement, contenus dans la déclaration de conformité UE du fabricant ou dans le certificat délivré par un organisme notifié autorisant le fabricant à apposer le marquage CE sur le dispositif médical. \n\n Lorsque le dossier ne contient pas les résultats de l'évaluation de la conformité visés au premier alinéa et que l'évaluation de la conformité du dispositif, s'il est utilisé séparément, requiert l'intervention d'un organisme notifié en vertu du règlement (UE) 2017/745, l'autorité exige du demandeur qu'il fournisse un avis sur la conformité de la partie constituant le dispositif avec les exigences générales en matière de sécurité et de performances énoncées à l'annexe I dudit règlement, émis par un organisme notifié désigné conformément audit règlement pour le type de dispositif en question."
  5_prefix: "Article 118"
  5_label: "Modification du règlement (CE) no 178/2002"
  5_desc: "À l'article 2, troisième alinéa, du règlement (CE) no 178/2002, le point suivant est ajouté: \n\n «\n\ti. les dispositifs médicaux au sens du règlement (UE) 2017/745 du Parlement européen et du Conseil (*2)."
  6_prefix: "Article 119"
  6_label: "Modification du règlement (CE) no 1223/2009"
  6_desc: "À l'article 2 du règlement (CE) no 1223/2009, le paragraphe suivant est ajouté: \n\n «4.   La Commission peut, à la demande d'un État membre ou de sa propre initiative, adopter les mesures nécessaires pour déterminer si un produit ou groupe de produits donné relève de la définition de “produit cosmétique”. Ces mesures sont adoptées conformément à la procédure de réglementation visée à l'article 32, paragraphe 2.»"
  7:
    prefix: "Article 120"
    title: "Dispositions transitoires"
    1_prefix: "120.1"
    1_label: "À compter du 26 mai 2020, toute publication d'une notification relative à un organisme notifié conformément aux directives 90/385/CEE et 93/42/CEE est invalidée."
    2_prefix: "120.2"
    2_desc: "Les certificats délivrés par des organismes notifiés conformément aux directives 90/385/CEE et 93/42/CEE avant le 25 mai 2017 conservent leur validité jusqu'à la fin de la période indiquée sur ces certificats, sauf pour les certificats délivrés conformément à l'annexe IV de la directive 90/385/CEE ou à l'annexe IV de la directive 93/42/CEE, qui sont invalidés au plus tard le 27 mai 2022. \n\n Les certificats délivrés par des organismes notifiés conformément aux directives 90/385/CEE et 93/42/CEE à partir du 25 mai 2017 restent valables jusqu'à la fin de la période indiquée sur le certificat, laquelle n'excède pas cinq ans après la délivrance dudit certificat. Ils sont toutefois invalidés au plus tard le 27 mai 2024."
    3_prefix: "120.3"
    3_desc: "Par dérogation à l'article 5 du présent règlement, un dispositif muni d'un certificat délivré conformément à la directive 90/385/CEE ou à la directive 93/42/CEE et qui est valide en vertu du paragraphe 2 du présent article, ne peut être mis sur le marché ou mis en service que si, à compter de la date d'application du présent règlement, il continue de respecter l'une de ces directives et pour autant qu'il n'y ait pas de changement significatif dans la conception et la finalité. Cependant, les exigences du présent règlement relatives à la surveillance après commercialisation, à la surveillance du marché, à la vigilance, à l'enregistrement des opérateurs économiques et des dispositifs, s'appliquent en lieu et place des exigences correspondantes desdites directives. \n\n Sans préjudice du chapitre IV et du paragraphe 1 du présent article, l'organisme notifié qui a délivré le certificat visé au premier alinéa continue d'être responsable de la surveillance appropriée en ce qui concerne l'ensemble des exigences applicables relatives aux dispositifs qu'il a certifiés."
    4_prefix: "120.4"
    4_label: "Les dispositifs légalement mis sur le marché conformément aux directives 90/385/CEE et 93/42/CEE avant le 26 mai 2020 et les dispositifs mis sur le marché à compter du 26 mai 2020 en vertu d'un certificat visé au paragraphe 2, du présent article, peuvent continuer d'être mis à disposition sur le marché ou mis en service jusqu'au 27 mai 2025."
    5_prefix: "120.5"
    5_label: "Par dérogation aux directives 90/385/CEE et 93/42/CEE, les dispositifs conformes au présent règlement peuvent être mis sur le marché avant le 26 mai 2020."
    6_prefix: "120.6"
    6_desc: "Par dérogation aux directives 90/385/CEE et 93/42/CEE, les organismes d'évaluation de la conformité conformes au présent règlement peuvent être désignés et notifiés avant le 26 mai 2020. Les organismes notifiés qui sont désignés et notifiés conformément au présent règlement peuvent mettre en œuvre les procédures d'évaluation de la conformité établies par celui-ci et délivrer des certificats conformément au présent règlement avant le 26 mai 2020."
    7_prefix: "120.7"
    7_label: "Pour ce qui est des dispositifs faisant l'objet de la procédure de consultation prévue à l'article 54, le paragraphe 5 du présent article s'applique pour autant qu'il ait été procédé aux nominations nécessaires au sein du GCDM et des groupes d'experts."
    8_prefix: "120.8"
    8_desc: "Par dérogation à l'article 10 bis et à l'article 10 ter, paragraphe 1, point a), de la directive 90/385/CEE, ainsi qu'à l'article 14, paragraphes 1 et 2, et à l'article 14 bis, paragraphe 1, points a) et b), de la directive 93/42/CEE, les fabricants, les mandataires, les importateurs et les organismes notifiés qui, pendant la période commençant à la plus tardive des dates visées à l'article 123, paragraphe 3, point d), et se terminant dix-huit mois plus tard, se conforment à l'article 29, paragraphe 4, et à l'article 56, paragraphe 5, du présent règlement, sont réputés se conformer aux dispositions législatives et réglementaires adoptées par les États membres en application, respectivement, de l'article 10 bis de la directive 90/385/CEE ou de l'article 14, paragraphes 1 et 2, de la directive 93/42/CEE, et, respectivement, de l'article 10 ter, paragraphe 1, point a), de la directive 90/385/CEE, ou de l'article 14 bis, paragraphe 1, points a) et b), de la directive 93/42/CEE, comme prévu dans la décision 2010/227/UE."
    9_prefix: "120.9"
    9_label: "Les autorisations accordées par les autorités compétentes des États membres conformément à l'article 9, paragraphe 9, de la directive 90/385/CEE ou à l'article 11, paragraphe 13, de la directive 93/42/CEE, conservent leur validité pour la durée indiquée sur ces autorisations."
    10_prefix: "120.10"
    10_label: "Les dispositifs relevant du présent règlement en vertu de l'article 1er, paragraphe 6, points f) et g), qui ont été légalement mis sur le marché ou mis en service conformément aux règles en vigueur dans les États membres avant le 26 mai 2020 peuvent continuer d'être mis sur le marché et mis en service dans les États membres concernés."
    11_prefix: "120.11"
    11_label: "Les investigations cliniques entamées conformément à l'article 10 de la directive 90/385/CEE ou à l'article 15 de la directive 93/42/CEE avant le 26 mai 2020 peuvent être poursuivies. Toutefois, à compter du 26 mai 2020, la notification d'événements indésirables graves et de défectuosités de dispositifs s'effectue conformément au présent règlement."
    12_prefix: "120.12"
    12_label: "Tant que la Commission n'a pas désigné, conformément à l'article 27, paragraphe 2, les entités d'attribution, GS1, HIBCC et ICCBBA sont considérées comme les entités d'attribution désignées."
  8_prefix: "Article 121"
  8_label: "Évaluation"
  8_desc: "Au plus tard le 27 mai 2027, la Commission évalue l'application du présent règlement et établit un rapport d'évaluation sur les progrès réalisés en vue des objectifs qui y figurent, ainsi que sur les ressources nécessaires à la mise en œuvre de celui-ci. Une attention particulière est accordée à la traçabilité des dispositifs médicaux grâce à l'enregistrement de l'IUD, en vertu de l'article 27, par les opérateurs économiques, les établissements de santé et les professionnels de la santé."
  9_prefix: "Article 122"
  9_label: "Abrogation"
  9_desc: "Sans préjudice de l'article 120, paragraphes 3 et 4, du présent règlement, et sans préjudice des obligations des États membres et des fabricants en ce qui concerne la vigilance et des obligations des fabricants en ce qui concerne la mise à disposition de la documentation, au titre des directives 90/385/CEE et 93/42/CEE, ces dernières sont abrogées avec effet à compter du 26 mai 2020, à l'exception: \n\t— des articles 8 et 10, de l'article 10 ter, paragraphe 1, points b) et c), de l'article 10 ter, paragraphes 2 et 3, de la directive 90/385/CEE et des obligations relatives à la vigilance et aux investigations cliniques prévues dans les annexes correspondantes, qui sont abrogés avec effet à compter de la plus tardive des dates visées à l'article 123, paragraphe 3, point d), du présent règlement \n\t— de l'article 10 bis et de l'article 10 ter, paragraphe 1, point a), de la directive 90/385/CEE et des obligations relatives à l'enregistrement des dispositifs et des opérateurs économiques et aux notifications de certificat prévues dans les annexes correspondantes, qui sont abrogés avec effet à compter d'une date postérieure de dix-huit mois à la plus tardive des dates visées à l'article 123, paragraphe 3, point d), du présent règlement \n\t— de l'article 10, de l'article 14 bis, paragraphe 1, points c) et d), de l'article 14 bis, paragraphes 2 et 3, et de l'article 15 de la directive 93/42/CEE et des obligations relatives à la vigilance et aux investigations cliniques prévues dans les annexes correspondantes, qui sont abrogés avec effet à compter de la plus tardive des dates visées à l'article 123, paragraphe 3, point d), du présent règlement, e \n\t— de l'article 14, paragraphes 1 et 2, de l'article 14 bis, paragraphe 1, points a) et b), de la directive 93/42/CEE et des obligations relatives à l'enregistrement des dispositifs et des opérateurs économiques et aux notifications de certificat prévues dans les annexes correspondantes, qui sont abrogés avec effet à compter d'une date postérieure de dix-huit mois à la plus tardive des dates visées à l'article 123, paragraphe 3, point d), du présent règlement. \n\n En ce qui concerne les dispositifs visés à l'article 120, paragraphes 3 et 4, du présent règlement, les directives visées au premier alinéa continuent d'être applicables jusqu'au 27 mai 2025 dans la mesure où cela est nécessaire à l'application desdits articles. \n\n Nonobstant le premier alinéa, les règlements (UE) no 207/2012 et (UE) no 722/2012 restent en vigueur et continuent à s'appliquer tant qu'ils ne sont pas abrogés par des actes d'exécution adoptés par la Commission en vertu du présent règlement. \n\n Les références faites aux directives abrogées s'entendent comme faites au présent règlement et sont à lire selon le tableau de correspondance figurant à l'annexe XVII du présent règlement."
  10:
    prefix: "Article 123"
    title: "Entrée en vigueur et date d'application"
    1_prefix: "123.1"
    1_label: "Le présent règlement entre en vigueur le vingtième jour suivant celui de sa publication au Journal officiel de l'Union européenne."
    2_prefix: "123.2"
    2_label: "Il est applicable à partir du 26 mai 2020."
    3_prefix: "123.3"
    3_label: "Par dérogation au paragraphe 2:"
    3_desc: "\n\ta. les articles 35 à 50 s'appliquent à compter du 26 novembre 2017. Cependant, entre cette date et le 26 mai 2020, les obligations incombant aux organismes notifiés en vertu des articles 35 à 50 ne s'appliquent qu'aux organismes qui présentent une demande de désignation conformément à l'article 38; \n\tb. les articles 101 et 103 s'appliquent à compter du 26 novembre 2017;  \n\tc. l'article 102 s'applique à compter du 26 mai 2018; \n\td. sans préjudice des obligations incombant à la Commission en vertu de l'article 34, lorsque, en raison de circonstances qui n'étaient pas raisonnablement prévisibles lors de l'élaboration du plan visé à l'article 34, paragraphe 1, Eudamed n'est pas pleinement opérationnelle le 26 mai 2020, les obligations et les exigences qui ont trait à Eudamed s'appliquent à compter d'une date postérieure de six mois à la date de publication de l'avis visé à l'article 34, paragraphe 3. Les dispositions visées à la phrase précédente sont: \n\t\t— l'article 29, \n\t\t— l'article 31, \n\t\t— l'article 32, \n\t\t— l'article 33, paragraphe 4, \n\t\t— l'article 40, paragraphe 2, deuxième phrase, \n\t\t— l'article 42, paragraphe 10, \n\t\t— l'article 43, paragraphe 2, \n\t\t— l'article 44, paragraphe 12, deuxième alinéa, \n\t\t— l'article 46, paragraphe 7, points d) et e), \n\t\t— l'article 53, paragraphe 2, \n\t\t— l'article 54, paragraphe 3, \n\t\t— l'article 55, paragraphe 1, \n\t\t— les articles 70 à 77, \n\t\t— l'article 78, paragraphes 1 à 13, \n\t\t— les articles 79 à 82, \n\t\t— l'article 86, paragraphe 2, \n\t\t— les articles 87 et 88, \n\t\t— l'article 89, paragraphes 5 et 7, et l'article 89, paragraphe 8, troisième alinéa, \n\t\t— l'article 90, \n\t\t— l'article 93, paragraphes 4, 7 et 8, \n\t\t— l'article 95, paragraphes 2 et 4, \n\t\t— l'article 97, paragraphe 2, dernière phrase, \n\t\t— l'article 99, paragraphe 4, \n\t\t— l'article 120, paragraphe 3, premier alinéa, deuxième phrase. \n\n ant qu'Eudamed n'est pas pleinement fonctionnelle, les dispositions correspondantes des directives 90/385/CEE et 93/42/CEE continuent de s'appliquer aux fins de satisfaire aux obligations énoncées dans les dispositions énumérées au premier alinéa du présent point en ce qui concerne l'échange d'informations, y compris et en particulier les informations relatives aux notifications dans le cadre de la vigilance, aux investigations cliniques, à l'enregistrement des dispositifs et des opérateurs économiques et aux notifications de certificats; \n\te. l'article 29, paragraphe 4, et l'article 56, paragraphe 5, s'appliquent à compter d'une date postérieure de dix-huit mois à la plus tardive des dates visées au point d); \n\tf. pour les dispositifs implantables et les dispositifs de classe III, l'article 27, paragraphe 4, s'applique à compter du 26 mai 2021. Pour les dispositifs des classes IIa et IIb, l'article 27, paragraphe 4, s'applique à compter du 26 mai 2023. Pour les dispositifs de classe I, l'article 27, paragraphe 4, s'applique à compter du 26 mai 2025; \n\tg. pour les dispositifs réutilisables dont le support IUD doit être apposé sur le dispositif lui-même, l'article 27, paragraphe 4, s'applique à compter d'une date postérieure de deux ans à la date visée au point f) du présent paragraphe pour la classe de dispositifs respective prévue audit point; \n\th. la procédure prévue à l'article 78 s'applique à compter du 26 mai 2027, sans préjudice de l'article 78, paragraphe 14; \n\ti. l'article 120, paragraphe 12, s'applique à compter du 26 mai 2019. \n\n Le présent règlement est obligatoire dans tous ses éléments et directement applicable dans tout État membre. \n\n Fait à Strasbourg, le 5 avril 2017."
11:
  prefix: "Annexe I"
  title: "Exigences générales en matière de sécurité et de performances"
  1:
    prefix: "Chapitre I"
    title: "Exigences Générales"
    1_prefix: "1"
    1_desc: "Les dispositifs atteignent les performances prévues par leur fabricant et sont conçus et fabriqués de telle manière que, dans des conditions normales d'utilisation, ils soient adaptés à leur destination. Ils sont sûrs et efficaces et ne compromettent pas l'état clinique ou la sécurité des patients ni la sécurité ou la santé des utilisateurs ou, le cas échéant, d'autres personnes, étant entendu que les risques éventuels liés à leur utilisation constituent des risques acceptables au regard des bénéfices pour le patient et compatibles avec un niveau élevé de protection de la santé et de la sécurité, compte tenu de l'état de l'art généralement admis."
    2_prefix: "2"
    2_label: "La exigence de la présente annexe prévoyant qu'il convient de réduire les risques autant que possible signifie réduire les risques autant que possible sans altérer le rapport bénéfice/risque."
    3_prefix: "3"
    3_desc: "Les fabricants établissent, appliquent, documentent et maintiennent un système de gestion des risques. \n\n La gestion des risques s'entend comme un processus itératif continu concernant l'ensemble du cycle de vie d'un dispositif, qui doit périodiquement faire l'objet d'une mise à jour systématique. Lorsqu'ils assurent la gestion des risques, les fabricants \n\ta. établissent et documentent un plan de gestion des risques pour chaque dispositif; \n\tb. déterminent et analysent les dangers connus et prévisibles associés à chaque dispositif; \n\tc. estiment et évaluent les risques associés à l'utilisation prévue et à une mauvaise utilisation raisonnablement prévisible et qui se présentent lors desdites utilisations; \n\td. éliminent ou maîtrisent les risques visés au point c) conformément aux exigences de la section 4; \n\te. évaluent l'incidence des informations issues de la phase de production et, en particulier, du système de surveillance après commercialisation, sur les dangers et la fréquence à laquelle ils se présentent, sur les estimations des risques associés aux dangers, ainsi que sur le risque global, le rapport bénéfice/risque et le caractère acceptable du risque; et \n\tf. sur la base de l'évaluation de l'incidence des informations visées au point e), au besoin, modifient les mesures de maîtrise des risques conformément aux exigences de la section 4."
    4_prefix: "4"
    4_desc: "Les mesures de maîtrise des risques adoptées par les fabricants pour la conception et la fabrication des dispositifs sont conformes aux principes de sécurité, compte tenu de l'état de l'art généralement admis. Pour réduire les risques, les fabricants gèrent ceux-ci de sorte que le risque résiduel associé à chaque danger ainsi que le risque résiduel global soient jugés acceptables. Lorsqu'ils choisissent les solutions les plus appropriées, les fabricants appliquent les principes suivants, dans l'ordre de priorité suivant: \n\ta. éliminer ou réduire les risques autant que possible grâce à une conception et une fabrication sûres; \n\tb. le cas échéant, prendre des mesures de protection adéquates, notamment au besoin sous la forme d'alarmes, pour les risques qui ne peuvent être éliminés; et \n\tc. fournir des informations de sécurité (mises en garde/précautions/contre-indications) et, le cas échéant, une formation aux utilisateurs. \n\n Les fabricants informent les utilisateurs concernant tout risque résiduel."
    5_prefix: "5"
    5_label: "Lorsqu'il s'agit d'éliminer ou de réduire les risques liés à une erreur d'utilisation, le fabricant applique les principes suivants:"
    5_desc: "\ta. réduire autant que possible les risques liés aux caractéristiques ergonomiques du dispositif et à l'environnement dans lequel le dispositif est destiné à être utilisé (conception tenant compte de la sécurité du patient); et \n\tb. prendre en compte les connaissances techniques, l'expérience, le niveau d'éducation et de formation et l'environnement d'utilisation s'il y a lieu, ainsi que l'état de santé et la condition physique des utilisateurs auxquels le dispositif est destiné (conception pour des utilisateurs profanes, professionnels, handicapés ou autres)."
    6_prefix: "6"
    6_label: "Les caractéristiques et les performances d'un dispositif ne sont pas altérées au point de mettre en danger la santé ou la sécurité du patient, de l'utilisateur et, le cas échéant, d'autres personnes pendant la durée de vie du dispositif, telle qu'elle est indiquée par le fabricant, lorsque le dispositif est soumis aux contraintes pouvant survenir dans des conditions normales d'utilisation et qu'il a été entretenu selon les instructions du fabricant."
    7_prefix: "7"
    7_label: "Les dispositifs sont conçus, fabriqués et conditionnés de façon à ce que leurs caractéristiques et leurs performances pendant leur utilisation prévue ne soient pas altérées pendant le transport et le stockage, par exemple par des variations de température et d'humidité, en tenant compte des instructions et des informations fournies par le fabricant."
    8_prefix: "8"
    8_label: "Tous les risques connus et prévisibles ainsi que tous les effets secondaires indésirables sont réduits au minimum et sont acceptables au regard des bénéfices quantifiés que présentent pour le patient et/ou l'utilisateur les performances effectives du dispositif dans des conditions normales d'utilisation."
    9_prefix: "9"
    9_desc: "Pour les dispositifs visés à l'annexe XVI, les exigences générales en matière de sécurité établies aux points 1 et 8 de la présente annexe sont interprétées en ce sens que le dispositif, utilisé dans des conditions normales et conformément à sa destination, présente un risque nul ou un risque qui n'est pas supérieur au risque maximum acceptable lié à l'utilisation du produit, de manière à garantir un niveau élevé de protection de la sécurité et de la santé des personnes."
  2:
    prefix: "Chapitre II"
    title: "Exigences relatives à la conception et à la fabrication"
    1_prefix: "10.1"
    1_label: "Les dispositifs sont conçus et fabriqués de manière à garantir que les caractéristiques et les exigences en matière de performance visées au chapitre I sont satisfaites. Une attention particulière est accordée:"
    1_desc: "\ta. au choix des matériaux et des substances utilisés, eu égard notamment à la toxicité et, s'il y a lieu, à l'inflammabilité; \n\tb. à la compatibilité des matériaux et des substances utilisés avec les tissus biologiques, les cellules et les liquides corporels, eu égard à la destination du dispositif et, le cas échéant, à l'absorption, à la distribution, au métabolisme et à l'excrétion; \n\tc. à la compatibilité entre les différentes parties d'un dispositif consistant en plus d'une partie implantable; \n\td. à l'incidence des procédés sur les propriétés des matériaux; \n\te. s'il y a lieu, aux résultats des recherches en biophysique ou en modélisation dont la validité a été préalablement démontrée; \n\tf. aux propriétés mécaniques des matériaux utilisés eu égard, s'il y a lieu, à des aspects comme la résistance, la ductilité, la résistance à la rupture, la résistance à l'usure et la résistance à la fatigue; \n\tg. aux propriétés de surface; et \n\th. à la confirmation que le dispositif satisfait à toute exigence chimique et/ou physique qui a été définie."
    2_prefix: "10.2"
    2_label: "Les dispositifs sont conçus, fabriqués et conditionnés de manière à réduire au minimum le risque lié aux contaminants et aux résidus pour les patients, eu égard à la destination du dispositif, et pour les personnes intervenant dans le transport, le stockage et l'utilisation des dispositifs. Une attention particulière est accordée aux tissus exposés à ces contaminants et résidus, ainsi qu'à la durée et à la fréquence de l'exposition."
    3_prefix: "10.3"
    3_desc: "Les dispositifs sont conçus et fabriqués de manière à pouvoir être utilisés en toute sécurité avec les matériaux et substances, dont les gaz, avec lesquels ils entrent en contact au cours de leur utilisation prévue; si les dispositifs sont destinés à administrer des médicaments, ils sont conçus et fabriqués de manière à être compatibles avec les médicaments concernés conformément aux dispositions et restrictions applicables à ceux-ci et de sorte que les performances à la fois des médicaments et des dispositifs restent conformes aux indications et à l'utilisation prévue. "
    4_prefix: "10.4.1"
    4_label: "Conception et fabrication des dispositifs"
    4_desc: "Les dispositifs sont conçus et fabriqués de manière à réduire autant que possible les risques liés aux substances ou aux particules, y compris les débris dus à l'usure, les produits de dégradation et les résidus de transformation, susceptibles d'être libérés d'un dispositif. \n\n Les dispositifs, ou les parties de dispositifs ou matériaux utilisés qui: \n\t\t— sont invasifs et entrent en contact direct avec le corps humain, ou \n\t\t— sont destinés à (ré)introduire et/ou prélever un médicament, des fluides corporels ou d'autres substances, dont des gaz, dans le corps, ou \n\t\t— sont destinés à transporter ou stocker des médicaments, des fluides corporels ou d'autres substances, dont des gaz, destinés à être (ré)introduits dans le corps ne contiennent les substances ci-après dans une concentration supérieure à 0,1 % en fraction massique (m/m) que lorsque cela est justifié conformément à la section 10.4.2: \n\ta. substances cancérogènes, mutagènes ou toxiques pour la reproduction de catégorie 1A ou 1B, conformément à l'annexe VI, partie 3, du règlement (CE) no 1272/2008 du Parlement européen et du Conseil (1); ou \n\tb. substances possédant des propriétés perturbant le système endocrinien, pour lesquelles il est scientifiquement prouvé qu'elles peuvent avoir des effets graves sur la santé humaine et qui ont été identifiées soit conformément à la procédure prévue à l'article 59 du règlement (CE) no 1907/2006 du Parlement européen et du Conseil (2), soit conformément aux critères pertinents pour la santé humaine parmi ceux établis dans l'acte délégué qui aura été adopté par la Commission en application de l'article 5, paragraphe 3, premier alinéa, du règlement (UE) no 528/2012 du Parlement européen et du Conseil (3)."
    5_prefix: "10.4.2"
    5_label: "Justification portant sur la présence de substances cancérogènes, mutagènes ou toxiques pour la reproduction et/ou de perturbateurs endocriniens"
    5_desc: "La justification de la présence de ces substances repose sur les éléments suivants: \n\ta. une analyse et une estimation de l'exposition potentielle du patient ou de l'utilisateur à la substance; \n\tb. une analyse des substances, matériaux ou conceptions de substitution possibles, y compris des informations sur la recherche indépendante, les études ayant fait l'objet d'une évaluation par les pairs et les avis scientifiques des comités scientifiques concernés, lorsqu'ils sont disponibles, ainsi qu'une analyse de la disponibilité de ces solutions de substitution; \n\tc. des arguments expliquant pourquoi les substances et/ou matériaux de substitution, s'ils sont disponibles, ou une modification de la conception, si elle est réalisable, ne conviennent pas pour maintenir le fonctionnement, les performances et le rapport bénéfice/risque du produit; y compris la prise en compte du fait que l'utilisation prévue des dispositifs inclut le traitement d'enfants ou de femmes enceintes ou allaitantes ou d'autres groupes de patients considérés comme particulièrement vulnérables à ces substances et/ou matériaux; et \n\td. le cas échéant et s'il en existe, les orientations les plus récentes du comité scientifique concerné, conformément aux sections 10.4.3 et 10.4.4."
    6_prefix: "10.4.3"
    6_label: "Orientations concernant les phtalates"
    6_desc: "Aux fins de la section 10.4, la Commission, dans les plus brefs délais et au plus tard le 26 mai 2018, donne mandat au comité scientifique concerné d'élaborer des orientations qui seront disponibles avant le 26 mai 2020. Le mandat du comité prévoit au moins une évaluation bénéfice/risque de la présence de phtalates faisant partie de l'un des groupes de substances visés à la section 10.4.1, points a) et b). L'évaluation bénéfice/risque tient compte de la destination et du contexte dans lequel le dispositif est utilisé, ainsi que des substances et matériaux et des conceptions et/ou traitements médicaux de substitution disponibles. Lorsque cela paraît approprié compte tenu des données scientifiques les plus récentes, mais au moins tous les cinq ans, les orientations sont actualisées."
    7_prefix: "10.4.4"
    7_label: "Orientations concernant d'autres substances cancérogènes, mutagènes ou toxiques pour la reproduction ou perturbateurs endocriniens"
    7_desc: "Par la suite, la Commission donne mandat au comité scientifique concerné d'établir des orientations, telles qu'elles sont visées à la section 10.4.3, également pour les autres substances visées à la section 10.4.1, points a) et b), s'il y a lieu."
    8_prefix: "10.4.5"
    8_label: "Étiquetage"
    8_desc: "Lorsque des dispositifs, des parties de dispositifs ou des matériaux utilisés, tels qu'ils sont visés à la section 10.4.1, contiennent des substances visées à la section 10.4.1, points a) et b), dans une concentration supérieure à 0,1 % en fraction massique (m/m), des étiquettes signalant la présence de ces substances sont apposées sur le dispositif lui-même et/ou sur le conditionnement de chaque unité ou, s'il y a lieu, sur le conditionnement de vente. Si l'utilisation prévue de ces dispositifs inclut le traitement d'enfants ou de femmes enceintes ou allaitantes ou d'autres groupes de patients considérés comme particulièrement vulnérables à ces substances et/ou matériaux, la notice d'utilisation contient des informations sur les risques résiduels pour ces groupes de patients et, le cas échéant, sur les mesures de précaution appropriées."
    9_prefix: "10.5"
    9_label: "Les dispositifs sont conçus et fabriqués de façon à réduire autant que possible les risques liés à la pénétration non intentionnelle de substances dans le dispositif, en tenant compte de la nature du dispositif et de l'environnement dans lequel il est destiné à être utilisé."
    10_prefix: "10.6"
    10_label: "Les dispositifs sont conçus et fabriqués de façon à réduire autant que possible les risques associés à la taille et aux propriétés des particules qui sont libérées dans le corps du patient ou de l'utilisateur, ou sont susceptibles de l'être, sauf si elles entrent en contact uniquement avec une peau intacte. Une attention particulière est accordée aux nanomatériaux."
    11_prefix: "11.1"
    11_label: "Les dispositifs et leurs procédés de fabrication sont conçus de manière à éliminer ou à réduire autant que possible le risque d'infection des patients, des utilisateurs et, le cas échéant, d'autres personnes. Leur conception:"
    11_desc: "\ta. réduit autant que possible et dans la mesure appropriée les risques de coupure ou piqûre involontaire, par exemple les blessures causées par une seringue; \n\tb). permet une manipulation simple et sûre; \n\tc. réduit autant que possible toute émission microbienne par le dispositif et/ou toute exposition microbienne pendant l'utilisation; et \n\td. prévient la contamination microbienne du dispositif ou de son contenu (échantillons ou fluides, par exemple)."
    12_prefix: "11.2"
    12_label: "Au besoin, les dispositifs sont conçus de manière à en faciliter le nettoyage, la désinfection et/ou la stérilisation en toute sécurité."
    13_prefix: "11.3"
    13_label: "Les dispositifs étiquetés comme présentant un état microbien particulier sont conçus, fabriqués et conditionnés de manière à garantir que cet état est préservé lors de la mise sur le marché ainsi que dans les conditions de transport et de stockage spécifiées par le fabricant."
    14_prefix: "11.4"
    14_desc: "Les dispositifs livrés à l'état stérile sont conçus, fabriqués et conditionnés selon des procédures appropriées, pour garantir qu'ils sont stériles lors de leur mise sur le marché et qu'à moins que le conditionnement destiné à en préserver l'état stérile ne soit endommagé, ils restent stériles dans les conditions de transport et de stockage préconisées par le fabricant, jusqu'à ce que ce conditionnement soit ouvert au moment de l'utilisation. Il est veillé à ce que l'utilisateur final se rende parfaitement compte de l'intégrité du conditionnement."
    15_prefix: "11.5"
    15_label: "Les dispositifs étiquetés comme étant stériles sont traités, fabriqués, conditionnés et stérilisés grâce à des méthodes appropriées et validées."
    16_prefix: "11.6"
    16_label: "Les dispositifs destinés à être stérilisés sont fabriqués et conditionnés dans des conditions et des installations contrôlées et appropriées."
    17_prefix: "11.7"
    17_label: "Les systèmes de conditionnement destinés à des dispositifs non stériles garantissent l'intégrité et la propreté du produit et, lorsque ces dispositifs sont destinés à être stérilisés avant leur utilisation, réduisent au minimum le risque de contamination microbienne; le système de conditionnement est adapté à la méthode de stérilisation préconisée par le fabricant."
    18_prefix: "11.8"
    18_label: "L'étiquetage des dispositifs permet de distinguer les dispositifs identiques ou similaires placés sur le marché à la fois à l'état stérile et non stérile, parallèlement au symbole utilisé pour indiquer que les dispositifs sont stériles."
    19_prefix: "12"
    19_label: "Dispositifs contenant une substance considérée comme un médicament et dispositifs composés de substances ou de combinaisons de substances qui sont absorbées par le corps humain ou dispersées localement dans celui-ci"
    20_prefix: "12.1"
    20_label: "Dans le cas des dispositifs visés à l'article 1er, paragraphe 8, premier alinéa, la qualité, la sécurité et l'utilité de la substance qui, utilisée séparément, serait considérée comme un médicament au sens de l'article 1er, point 2), de la directive 2001/83/CE, sont vérifiées par analogie au moyen des méthodes prévues à l'annexe I de la directive 2001/83/CE, comme le prévoit la procédure d'évaluation de la conformité applicable en vertu du présent règlement."
    21_prefix: "12.2"
    21_label: "Les dispositifs qui sont composés de substances ou de combinaisons de substances qui sont destinées à être introduites dans le corps humain et qui sont absorbées par le corps humain ou dispersées localement dans celui-ci sont, le cas échéant et uniquement pour les aspects ne relevant pas du présent règlement, conformes aux exigences applicables prévues à l'annexe I de la directive 2001/83/CE, en ce qui concerne l'absorption, la distribution, le métabolisme, l'excrétion, la tolérance locale, la toxicité, les interactions avec d'autres dispositifs, médicaments ou substances et les risques d'effets indésirables, comme le prévoit la procédure d'évaluation de la conformité applicable en vertu du présent règlement."
    22_prefix: "13.1"
    22_label: "Pour les dispositifs fabriqués à partir de dérivés de tissus ou de cellules d'origine humaine, non viables ou rendus non viables, relevant du présent règlement conformément à l'article 1er, paragraphe 6, point g), les dispositions ci-après s'appliquent:"
    22_desc: "\ta. le don, l'obtention et le contrôle des tissus, ainsi que des cellules sont conformes à la directive 2004/23/CE; \n\tb. le traitement, la conservation et toute autre manipulation de ces tissus et cellules ou de leurs dérivés sont effectués de manière à garantir la sécurité des patients, des utilisateurs et, le cas échéant, d'autres personnes. En particulier, la sécurité en ce qui concerne les virus et autres agents transmissibles est assurée par des méthodes d'approvisionnement appropriées et par l'application de méthodes validées d'élimination ou d'inactivation au cours du processus de fabrication; \n\tc. le système de traçabilité de ces dispositifs complète et respecte les exigences en matière de traçabilité et de protection des données établies par la directive 2004/23/CE et la directive 2002/98/CE."
    23_prefix: "13.2"
    23_label: "Pour les dispositifs fabriqués à partir de tissus ou de cellules d'origine animale, ou de leurs dérivés, non viables ou rendus non viables, les dispositions ci-après s'appliquent:"
    23_desc: "\ta. compte tenu de l'espèce animale, si possible, les tissus et cellules d'origine animale, ou leurs dérivés, proviennent d'animaux qui ont été soumis à des contrôles vétérinaires adaptés à leur utilisation prévue. Les informations sur l'origine géographique des animaux sont conservées par les fabricants; \n\tb. l'approvisionnement en tissus, cellules et substances d'origine animale, ou leurs dérivés, ainsi que leur traitement, leur conservation, leur contrôle et leur manipulation sont effectués de manière à garantir la sécurité des patients, des utilisateurs et, le cas échéant, d'autres personnes. En particulier, la sécurité en ce qui concerne les virus et autres agents transmissibles est assurée par l'application de méthodes validées d'élimination ou d'inactivation au cours du processus de fabrication, sauf lorsque le recours à ces méthodes entraînerait une détérioration inacceptable du dispositif mettant en péril son bénéfice clinique; \n\tc. pour les dispositifs fabriqués à partir de tissus ou de cellules d'origine animale, ou de leurs dérivés, visés au règlement (UE) no 722/2012, les exigences particulières qui y sont établies s'appliquent."
    24_prefix: "13.3"
    24_desc: "Pour les dispositifs fabriqués à partir de substances biologiques non viables autres que celles visées aux sections 13.1 et 13.2, le traitement, la conservation, le contrôle et la manipulation de ces substances sont effectués de manière à garantir une sécurité optimale aux patients, aux utilisateurs et, s'il y a lieu, à d'autres personnes, y compris dans la chaîne d'élimination des déchets. En particulier, la sécurité en ce qui concerne les virus et autres agents transmissibles est assurée par des méthodes d'approvisionnement appropriées et par l'application de méthodes validées d'élimination ou d'inactivation au cours du processus de fabrication."
    25_prefix: "14.1"
    25_desc: "Si le dispositif est destiné à être utilisé en combinaison avec d'autres dispositifs ou équipements, l'ensemble, y compris le système de raccordement, est sûr et n'altère pas les performances prévues des dispositifs. Toute restriction d'utilisation applicable à de telles combinaisons figure sur l'étiquette et/ou dans la notice d'utilisation. Les raccordements qui doivent être manipulés par l'utilisateur, comme les systèmes de transfert de fluides ou de gaz ou les systèmes de couplage mécanique ou électrique, sont conçus et construits de manière à réduire au minimum tous les risques possibles tels qu'une erreur de raccordement."
    26_prefix: "14.2"
    26_label: "Les dispositifs sont conçus et fabriqués de manière à éliminer ou à réduire autant que possible:"
    26_desc: "\ta. tout risque de blessure lié à leurs caractéristiques physiques, y compris le rapport volume/pression, et leurs caractéristiques dimensionnelles et, le cas échéant ergonomiques; \n\tb. tout risque lié à des influences externes ou des conditions d'environnement raisonnablement prévisibles, telles que les champs magnétiques, les effets électriques et électromagnétiques externes, les décharges électrostatiques, les radiations associées aux procédures diagnostiques et thérapeutiques, la pression, l'humidité, la température, les variations de pression et d'accélération ou encore les interférences radio; \n\tc. tout risque associé à l'utilisation du dispositif lorsqu'il entre en contact avec des matériaux, des liquides et des substances, dont les gaz, auxquels il est exposé dans des conditions normales d'utilisation; \n\td. tout risque associé à une éventuelle interaction négative entre les logiciels et l'environnement informatique dans lequel ceux-ci fonctionnent et avec lequel ils interagissent; \n\te. tout risque de pénétration accidentelle de substances dans le dispositif; \n\tf. tout risque d'interférence avec d'autres dispositifs normalement utilisés dans le cadre des investigations ou du traitement administré; et \n\tg. tout risque découlant, lorsque la maintenance ou l'étalonnage est impossible (comme pour les implants), du vieillissement des matériaux utilisés ou de la diminution de la précision d'un mécanisme de mesure ou de contrôle."
    27_prefix: "14.3"
    27_label: "Les dispositifs sont conçus et fabriqués de façon à réduire au minimum les risques d'incendie ou d'explosion dans des conditions normales d'utilisation et en condition de premier défaut. Une attention particulière est accordée aux dispositifs dont l'utilisation prévue implique une exposition à des substances inflammables ou explosives ou à des substances susceptibles de favoriser la combustion, ou une utilisation en association avec de telles substances."
    28_prefix: "14.4"
    28_label: "Les dispositifs sont conçus et fabriqués de manière à ce que toute opération de réglage, d'étalonnage et de maintenance puisse être réalisée en toute sécurité et de manière efficace."
    29_prefix: "14.5"
    29_label: "Les dispositifs qui sont destinés à être mis en œuvre avec d'autres dispositifs ou produits sont conçus et fabriqués de manière à ce que leur interopérabilité et leur compatibilité soient fiables et sûres."
    30_prefix: "14.6"
    30_label: "Toute échelle de mesure, de contrôle ou d'affichage est conçue et fabriquée suivant des principes ergonomiques, en tenant compte de la destination, des utilisateurs et des conditions d'environnement dans lesquelles les dispositifs sont destinés à être utilisés."
    31_prefix: "14.7"
    31_label: "Les dispositifs sont conçus et fabriqués de manière à favoriser leur élimination sûre et l'élimination sûre des déchets associés par l'utilisateur, le patient ou toute autre personne. À cet effet, les fabricants recensent et expérimentent des procédures et des mesures permettant une élimination sûre de leurs dispositifs après utilisation. Ces procédures sont décrites dans la notice d'utilisation."
    32_prefix: "15.1"
    32_label: "Les dispositifs de diagnostic et les dispositifs ayant une fonction de mesurage sont conçus et fabriqués de manière à garantir une exactitude, une précision et une stabilité suffisantes eu égard à leur destination, sur la base de méthodes scientifiques et techniques appropriées. Les limites de précision sont indiquées par le fabricant."
    33_prefix: "15.2"
    33_label: "Les mesures effectuées par les dispositifs ayant une fonction de mesurage sont exprimées en unités légales conformes aux dispositions de la directive 80/181/CEE du Conseil (4)."
    34_prefix: "16.1"
    34_label: "Protection contre les rayonnements - Généralités"
    34_desc: "\ta. Les dispositifs sont conçus, fabriqués et conditionnés de façon à réduire autant que possible l'exposition des patients, des utilisateurs et d'autres personnes aux rayonnements, d'une manière qui soit compatible avec la destination des dispositifs, sans restreindre l'application des doses appropriées spécifiées à des fins thérapeutiques ou diagnostiques. \n\tb. La notice d'utilisation des dispositifs émettant des rayonnements dangereux ou potentiellement dangereux comporte des informations détaillées sur la nature des rayonnements émis ainsi que sur les moyens de protéger le patient et l'utilisateur, d'éviter les mauvaises utilisations et de réduire autant que possible et dans la mesure appropriée les risques inhérents à l'installation. Des informations sont également communiquées concernant les essais d'acceptation et de performances, les critères d'acceptation et la procédure de maintenance."
    35_prefix: "16.2"
    35_label: "Protection contre les rayonnements - Irradiation intentionnelle"
    35_desc: "\ta. Lorsque des dispositifs sont conçus pour émettre des doses dangereuses ou potentiellement dangereuses de rayonnements ionisants et/ou non ionisants dans un but médical précis dont les avantages sont considérés comme supérieurs aux risques inhérents à l'irradiation, l'utilisateur doit pouvoir contrôler l'émission de rayonnements. Ces dispositifs sont conçus et fabriqués de façon à garantir la reproductibilité des paramètres variables pertinents avec une marge de tolérance acceptable. \n\tb. Lorsque des dispositifs sont destinés à émettre des rayonnements dangereux ou potentiellement dangereux, ionisants et/ou non ionisants, ils sont équipés, dans la mesure du possible, d'indicateurs visuels et/ou sonores signalant l'émission de rayonnements."
    36_prefix: "16.3"
    36_label: "Protection contre les rayonnements"
    36_desc: "Les dispositifs sont conçus et fabriqués de façon à réduire autant que possible l'exposition des patients, des utilisateurs et d'autres personnes aux rayonnements non intentionnels, parasites ou diffus. Il convient, dans la mesure du possible et dans la mesure appropriée, de choisir des méthodes qui réduisent l'exposition aux rayonnements des patients, des utilisateurs et d'autres personnes susceptibles d'être affectées."
    37_prefix: "16.4"
    37_label: "Protection contre les rayonnements - Rayonnements ionisants"
    37_desc: "\ta. Les dispositifs destinés à émettre des rayonnements ionisants sont conçus et fabriqués compte tenu des exigences de la directive 2013/59/Euratom fixant les normes de base relatives à la protection sanitaire contre les dangers résultant de l'exposition aux rayonnements ionisants. \n\tb. Les dispositifs destinés à émettre des rayonnements ionisants sont conçus et fabriqués de manière à garantir que la quantité, la géométrie et la qualité du rayonnement puissent, dans la mesure du possible, être réglées et contrôlées eu égard à l'utilisation prévue et, si possible, surveillées pendant le traitement. \n\tc. Les dispositifs émettant des rayonnements ionisants destinés au radiodiagnostic sont conçus et fabriqués de manière à permettre d'atteindre une qualité d'image et/ou de résultat convenant aux fins médicales recherchées tout en réduisant au minimum l'exposition du patient et de l'utilisateur aux rayonnements. \n\td. Les dispositifs émettant des rayonnements ionisants et destinés à la radiothérapie sont conçus et fabriqués de manière à permettre une surveillance et un contrôle fiables de la dose administrée, du type et de l'énergie de faisceau et, s'il y a lieu, de la qualité des rayonnements."
    38_prefix: "17.1"
    38_label: "Systèmes électroniques programmables — Dispositifs comportant des systèmes électroniques programmables et logiciels qui sont des dispositifs à part entière"
    38_desc: "Les dispositifs comportant des systèmes électroniques programmables, notamment des logiciels, ou les logiciels qui sont des dispositifs à part entière sont conçus de manière à garantir la répétabilité, la fiabilité et les performances eu égard à leur utilisation prévue. En condition de premier défaut, des moyens adéquats sont adoptés pour éliminer ou réduire autant que possible les risques qui en résultent ou la dégradation des performances."
    39_prefix: "17.2"
    39_label: "Systèmes électroniques programmables — Dispositifs comportant des systèmes électroniques programmables et logiciels qui sont des dispositifs à part entière"
    39_desc: "Pour les dispositifs qui comprennent des logiciels ou pour les logiciels qui sont des dispositifs à part entière, ces logiciels sont développés et fabriqués conformément à l'état de l'art, compte tenu des principes du cycle de développement, de gestion des risques, y compris la sécurité de l'information, de vérification et de validation."
    40_prefix: "17.3"
    40_label: "Systèmes électroniques programmables — Dispositifs comportant des systèmes électroniques programmables et logiciels qui sont des dispositifs à part entière"
    40_desc: "Les logiciels visés à la présente section qui sont destinés à être utilisés en combinaison avec des plateformes informatiques mobiles sont conçus et fabriqués en tenant compte des caractéristiques spécifiques de la plateforme mobile (par exemple, taille et rapport de contraste de l'écran) et des facteurs externes liés à leur utilisation (variation du niveau sonore ou de la luminosité dans l'environnement)."
    41_prefix: "17.4"
    41_label: "Systèmes électroniques programmables — Dispositifs comportant des systèmes électroniques programmables et logiciels qui sont des dispositifs à part entière"
    41_desc: "Les fabricants énoncent les exigences minimales concernant le matériel informatique, les caractéristiques des réseaux informatiques et les mesures de sécurité informatique, y compris la protection contre l'accès non autorisé, qui sont nécessaires pour faire fonctionner le logiciel comme prévu."
    42_prefix: "18.1"
    42_label: "Dispositifs actifs et dispositifs raccordés à des dispositifs actifs"
    42_desc: "Pour les dispositifs actifs non implantables, en condition de premier défaut, des moyens adéquats sont adoptés pour éliminer ou réduire autant que possible les risques qui en résultent."
    43_prefix: "18.2"
    43_label: "Dispositifs actifs et dispositifs raccordés à des dispositifs actifs"
    43_desc: "Les dispositifs pour lesquels la sécurité des patients dépend d'une source d'énergie interne sont munis d'un moyen de vérification de l'état de celle-ci et comportent une mise en garde ou une indication appropriée au cas où l'alimentation en énergie devient critique. Au besoin, cette mise en garde ou indication intervient avant que l'alimentation en énergie ne devienne critique."
    44_prefix: "18.3"
    44_label: "Dispositifs actifs et dispositifs raccordés à des dispositifs actifs"
    44_desc: "Les dispositifs pour lesquels la sécurité des patients dépend d'une source d'énergie externe sont équipés d'un système d'alarme signalant toute défaillance de celle-ci."
    45_prefix: "18.4"
    45_label: "Dispositifs actifs et dispositifs raccordés à des dispositifs actifs"
    45_desc: "Les dispositifs destinés à surveiller un ou plusieurs paramètres cliniques d'un patient sont munis de systèmes d'alarme appropriés permettant de prévenir l'utilisateur de toute situation pouvant entraîner la mort du patient ou une dégradation sévère de son état de santé."
    46_prefix: "18.5"
    46_label: "Dispositifs actifs et dispositifs raccordés à des dispositifs actifs"
    46_desc: "Les dispositifs sont conçus et fabriqués de manière à réduire autant que possible les risques de perturbations électromagnétiques susceptibles d'affecter le fonctionnement du dispositif lui-même ou d'autres dispositifs ou équipements situés dans l'environnement prévu."
    47_prefix: "18.6"
    47_label: "Dispositifs actifs et dispositifs raccordés à des dispositifs actifs"
    47_desc: "Les dispositifs sont conçus et fabriqués de manière à garantir le niveau d'immunité intrinsèque contre les interférences électromagnétiques qui est approprié pour leur permettre de fonctionner comme prévu."
    48_prefix: "18.7"
    48_label: "Dispositifs actifs et dispositifs raccordés à des dispositifs actifs"
    48_desc: "Les dispositifs sont conçus et fabriqués de manière à éviter autant que possible les risques d'électrocution accidentelle des patients, des utilisateurs ou de toute autre personne dans des conditions normales d'utilisation et en condition de premier défaut, lorsque les dispositifs sont installés et entretenus conformément aux instructions du fabricant."
    49_prefix: "18.8"
    49_label: "Dispositifs actifs et dispositifs raccordés à des dispositifs actifs"
    49_desc: "Les dispositifs sont conçus et fabriqués de façon à les protéger autant que possible contre un accès non autorisé qui les empêcherait de fonctionner comme prévu."
    50_prefix: "19.1"
    50_label: "Exigences particulières pour les dispositifs implantables actifs"
    50_desc: "Les dispositifs implantables actifs sont conçus et fabriqués de manière à éliminer ou à réduire au minimum, autant que possible: \n\ta. les risques liés à l'utilisation des sources d'énergie en portant, dans le cas de l'utilisation de l'électricité, une attention particulière notamment à l'isolation, aux courants de fuite et à l'échauffement des dispositifs; \n\tb. les risques liés à des interventions médicales, notamment ceux résultant de l'utilisation des défibrillateurs ou des équipements chirurgicaux à haute fréquence; et \n\tc. les risques pouvant survenir pour autant que la maintenance ou l'étalonnage ne soient pas possibles, et liés notamment: \n\t\t— à une augmentation excessive des courants de fuite, \n\t\t— au vieillissement des matériaux utilisés, \n\t\t— à un accroissement excessif de la chaleur engendrée par le dispositif, \n\t\t— à une détérioration de la précision d'un mécanisme de mesure ou de contrôle."
    51_prefix: "19.2"
    51_label: "Exigences particulières pour les dispositifs implantables actifs"
    51_desc: "Les dispositifs implantables actifs sont conçus et fabriqués de manière à garantir: \n\t— la compatibilité des dispositifs avec les substances qu'ils sont destinés à administrer, et \n\t— la fiabilité de la source d'énergie."
    52_prefix: "19.3"
    52_label: "Exigences particulières pour les dispositifs implantables actifs"
    52_desc: "Les dispositifs implantables actifs et, le cas échéant, leurs composants sont identifiables de façon à rendre possible toute action appropriée s'avérant nécessaire à la suite de la découverte d'un risque potentiel lié aux dispositifs ou à leurs composants."
    53_prefix: "19.4"
    53_label: "Exigences particulières pour les dispositifs implantables actifs"
    53_desc: "Les dispositifs implantables actifs comportent un code permettant l'identification univoque du dispositif (notamment le type de dispositif et l'année de fabrication) et du fabricant; ce code peut être détecté, le cas échéant, sans devoir recourir à une intervention chirurgicale."
    54_prefix: "20.1"
    54_label: "Protection contre les risques mécaniques et thermiques"
    54_desc: "Les dispositifs sont conçus et fabriqués de manière à protéger le patient et l'utilisateur contre les risques mécaniques liés, par exemple, à la résistance au mouvement, à l'instabilité et aux pièces mobiles."
    55_prefix: "20.2"
    55_label: "Protection contre les risques mécaniques et thermiques"
    55_desc: "Les dispositifs sont conçus et fabriqués de manière à réduire au minimum les risques résultant des vibrations produites par les dispositifs, compte tenu du progrès technique et des moyens disponibles d'atténuation des vibrations, notamment à la source, sauf si les vibrations font partie des performances prévues."
    56_prefix: "20.3"
    56_label: "Protection contre les risques mécaniques et thermiques"
    56_desc: "Les dispositifs sont conçus et fabriqués de manière à réduire au minimum les risques résultant des émissions sonores, compte tenu du progrès technique et des moyens disponibles de réduction du bruit, notamment à la source, sauf si les émissions sonores font partie des performances prévues."
    57_prefix: "20.4"
    57_label: "Protection contre les risques mécaniques et thermiques"
    57_desc: "Les terminaux et les systèmes de raccordement à des sources d'électricité, de gaz et d'énergie hydraulique ou pneumatique qui doivent être manipulés par l'utilisateur ou d'autres personnes, sont conçus et construits de manière à réduire au minimum tous les risques possibles."
    58_prefix: "20.5"
    58_label: "Protection contre les risques mécaniques et thermiques"
    58_desc: "Les erreurs susceptibles d'être commises lors du montage et du remontage de certaines pièces et qui peuvent engendrer des risques, sont rendues impossibles par la conception et la construction de ces pièces ou, à défaut, par des indications figurant sur les pièces elles-mêmes et/ou sur leur enveloppe. \n\n Ces indications figurent aussi sur les éléments mobiles et/ou sur leur enveloppe lorsqu'il est nécessaire de connaître le sens du mouvement pour éviter un risque."
    59_prefix: "20.6"
    59_label: "Les parties accessibles des dispositifs (à l'exclusion des parties ou des zones destinées à fournir de la chaleur ou à atteindre une température donnée) et leur environnement n'atteignent pas des températures susceptibles de présenter un danger dans des conditions normales d'utilisation."
    60_prefix: "21.1"
    60_label: "Protection contre les risques pour le patient ou l'utilisateur émanant de dispositifs destinés à fournir de l'énergie ou à administrer des substances"
    60_desc: "Les dispositifs destinés à fournir de l'énergie ou à administrer des substances au patient sont conçus et construits de manière à ce que la dose à délivrer puisse être réglée et maintenue avec une précision suffisante pour garantir la sécurité du patient et de l'utilisateur."
    61_prefix: "21.2"
    61_label: "Protection contre les risques pour le patient ou l'utilisateur émanant de dispositifs destinés à fournir de l'énergie ou à administrer des substances"
    61_desc: "Les dispositifs sont dotés de moyens permettant d'empêcher et/ou de signaler toute anomalie de dosage d'énergie ou de substances susceptible de présenter un danger. Les dispositifs sont munis de systèmes appropriés permettant d'éviter, dans la mesure du possible, la libération accidentelle de quantités dangereuses d'énergie ou de substance par une source d'énergie ou de substances."
    62_prefix: "21.3"
    62_label: "Protection contre les risques pour le patient ou l'utilisateur émanant de dispositifs destinés à fournir de l'énergie ou à administrer des substances"
    62_desc: "La fonction des commandes et des indicateurs est clairement indiquée sur les dispositifs. Lorsque des instructions relatives à l'utilisation ou des paramètres de fonctionnement ou de réglage sont indiqués sur un dispositif à l'aide d'un système de visualisation, ces informations sont compréhensibles pour l'utilisateur et, s'il y a lieu, pour le patient."
    63_prefix: "22.1"
    63_label: "Protection contre les risques émanant des dispositifs destinés par le fabricant à des profanes"
    63_desc: "Les dispositifs destinés à des profanes sont conçus et fabriqués de manière à fonctionner conformément à leur destination compte tenu des aptitudes et des moyens dont disposent ces personnes ainsi que de l'influence des variations raisonnablement prévisibles de leur maîtrise technique et de leur environnement. Les informations et les instructions fournies par le fabricant sont faciles à comprendre et à appliquer par le profane."
    64_prefix: "22.2"
    64_label: "Protection contre les risques émanant des dispositifs destinés par le fabricant à des profanes"
    64_desc: "Les dispositifs destinés à des profanes sont conçus et fabriqués de manière: \n\t— à garantir que le dispositif peut être utilisé correctement et en toute sécurité par l'utilisateur auquel il est destiné à tous les stades de la procédure, au besoin après une information et/ou une formation appropriées, \n\t— à réduire autant que possible et dans la mesure appropriée les risques de coupure ou piqûre involontaire, par exemple les blessures causées par une seringue, et \n\t— à réduire autant que possible les risques d'erreur de manipulation et, s'il y a lieu, d'interprétation des résultats par l'utilisateur auquel le dispositif est destiné."
    65_prefix: "22.3"
    65_label: "Protection contre les risques émanant des dispositifs destinés par le fabricant à des profanes"
    65_desc: "Les dispositifs destinés à des profanes prévoient, le cas échéant, une procédure permettant à la personne: \n\t— de vérifier, au moment de l'utilisation, que les performances du dispositif seront celles prévues par le fabricant, et \n\t— s'il y a lieu, d'être averti si le dispositif n'a pas fourni un résultat valable."
  3:
    prefix: "Chapter III"
    title: "Éxigences relatives aux informations fournis avec le dispositif"
    1_prefix: "23.1"
    1_label: "Étiquetage et notice d'utilisation - Exigences générales relatives aux informations fournies par le fabricant"
    1_desc: "Chaque dispositif est accompagné des informations nécessaires à l'identification de celui-ci et de son fabricant, ainsi que de toute information relative à la sécurité et aux performances utile à l'utilisateur ou à toute autre personne, le cas échéant. Ces informations peuvent figurer sur le dispositif lui-même, sur le conditionnement ou dans la notice d'utilisation et, si le fabricant dispose d'un site internet, sont mises à disposition et mises à jour sur le site internet; en outre: \n\ta. le support, le format, le contenu, la lisibilité et l'emplacement de l'étiquette et de la notice d'utilisation sont adaptés au dispositif concerné, à sa destination ainsi qu'aux connaissances techniques, à l'expérience et au niveau d'éducation et de formation du ou des utilisateurs auxquels le dispositif est destiné. En particulier, la notice d'utilisation est rédigée dans des termes faciles à comprendre par l'utilisateur auquel le dispositif est destiné et, s'il y a lieu, complétée par des dessins et des graphiques; \n\tb. les informations devant être mentionnées sur l'étiquette figurent sur le dispositif proprement dit. Si cette solution ne peut être mise en pratique ou n'est pas adaptée, tout ou partie des informations peuvent figurer sur le conditionnement de chaque unité et/ou sur le conditionnement de dispositifs multiples; \n\tc. les étiquettes sont fournies dans un format lisible par l'homme et peuvent être complétées par des informations lisibles par machine, comme l'identification par radiofréquence (RFID) ou des codes à barres; \n\td. une notice d'utilisation est fournie avec les dispositifs. À titre d'exception, une notice d'utilisation n'est pas requise pour les dispositifs des classes I et IIa si ceux-ci peuvent être utilisés en toute sécurité sans l'aide d'une telle notice et sauf si indication contraire ailleurs dans la présente section; \n\te. lorsque des dispositifs multiples sont fournis à un seul utilisateur et/ou en un seul lieu, la notice d'utilisation peut être fournie en un exemplaire unique si l'acheteur y consent, étant entendu que celui-ci peut, en tout état de cause, demander à recevoir gratuitement d'autres exemplaires; \n\tf. la notice d'utilisation peut être fournie à l'utilisateur autrement que sous forme imprimée (fichier électronique, par exemple), uniquement sous réserve des conditions établies par le règlement (UE) no 207/2012 ou de toute règle d'exécution ultérieure adoptée en application du présent règlement; \n\tg. les risques résiduels qui doivent être communiqués à l'utilisateur et/ou à d'autres personnes figurent dans les informations fournies par le fabricant sous la forme de restrictions, de contre-indications, de précautions ou de mises en garde; \n\th. le cas échéant, les informations fournies par le fabricant sont indiquées sous la forme de symboles reconnus au niveau international. Tout symbole ou couleur d'identification est conforme aux normes harmonisées ou aux spécifications communes. Dans les domaines où il n'existe ni norme harmonisée ni spécification commune, les symboles et couleurs utilisés sont décrits dans la documentation fournie avec le dispositif."
    2_prefix: "23.2"
    2_label: "Étiquetage et notice d'utilisation - Informations figurant sur l'étiquette"
    2_desc: "L'étiquette comporte toutes les informations suivantes: \n\ta. le nom ou la dénomination commerciale du dispositif; \n\tb. les données strictement nécessaires pour permettre à l'utilisateur d'identifier le dispositif et de déterminer le contenu du conditionnement et, si elle n'est pas manifeste pour l'utilisateur, la destination du dispositif; \n\tc. le nom, la raison sociale ou la marque déposée du fabricant, ainsi que l'adresse de son siège social; \n\td. si le fabricant a son siège social en dehors de l'Union, le nom et l'adresse du siège social du mandataire; \n\te. le cas échéant, une indication précisant que sont contenus ou intégrés dans le dispositif: \n\t\t— un médicament, y compris un dérivé de sang ou de plasma d'origine humaine, ou \n\t\t— des tissus ou cellules d'origine humaine ou leurs dérivés, ou \n\t\t— des tissus ou cellules d'origine animale ou leurs dérivés, visés dans le règlement (UE) no 722/2012; \n\tf. le cas échéant, des informations étiquetées conformément à la section 10.4.5; \n\tg. le numéro de lot ou le numéro de série du dispositif précédé, selon le cas, par la mention «NUMÉRO DE LOT» ou «NUMÉRO DE SÉRIE» ou par un symbole équivalent; \n\th. le support d'IUD visé à l'article 27, paragraphe 4, et à l'annexe VII, partie C; \n\ti. une indication univoque de la date limite d'utilisation ou d'implantation du dispositif en toute sécurité, exprimée au moins par l'année et le mois, s'il y a lieu; \n\tj. en l'absence d'une indication de la date jusqu'à laquelle le dispositif peut être utilisé en toute sécurité, la date de fabrication. Cette date peut être intégrée dans le numéro de lot ou le numéro de série, à condition d'être clairement identifiable; \n\tk. une indication de toute condition particulière de stockage et/ou de manipulation applicable; \n\tl. si le dispositif est fourni à l'état stérile, une indication de cet état et de la méthode de stérilisation utilisée; \n\tm. les mises en garde ou les précautions requises devant être immédiatement portées à l'attention de l'utilisateur du dispositif ou de toute autre personne. Ces informations peuvent être indiquées de façon succincte, auquel cas elles doivent être détaillées dans la notice d'utilisation, compte tenu des utilisateurs auxquels les dispositifs sont destinés; \n\tn. le cas échéant, une indication précisant que le dispositif est à usage unique. L'indication par le fabricant du fait que le dispositif est à usage unique est uniformisée dans l'ensemble de l'Union; \n\to. le cas échéant, une indication précisant que le dispositif concerné est un dispositif à usage unique qui a été retraité, le nombre de cycles de retraitement effectués ainsi que toute limitation concernant le nombre de cycles de retraitement; \n\tp. s'il s'agit d'un dispositif sur mesure, la mention «dispositif sur mesure»; \n\tq. une indication précisant que le dispositif est un dispositif médical. S'il s'agit d'un dispositif uniquement destiné à des investigations cliniques, la mention «exclusivement pour des investigations cliniques»; \n\tr. dans le cas des dispositifs qui sont composés de substances ou de combinaisons de substances qui sont destinées à être introduites dans le corps humain par un orifice du corps ou par application sur la peau et qui sont absorbées par le corps humain ou dispersées localement dans celui-ci, la composition qualitative globale du dispositif et des informations quantitatives sur le ou les composants principaux permettant d'obtenir l'action principale voulue; \n\ts. pour les dispositifs implantables actifs, le numéro de série et, pour les autres dispositifs implantables, le numéro de série ou le numéro de lot."
    3_prefix: "23.3"
    3_label: "Étiquetage et notice d'utilisation - Informations figurant sur le conditionnement qui préserve l'état stérile d'un dispositif («conditionnement stérile»)"
    3_desc: "Les informations suivantes figurent sur le conditionnement stérile: \n\ta. l'indication permettant de reconnaître le conditionnement stérile; \n\tb. l'indication que le dispositif est en état stérile; \n\tc. la méthode de stérilisation; \n\td. le nom et l'adresse du fabricant; \n\te. la description du dispositif; \n\tf. s'il s'agit d'un dispositif destiné à des investigations cliniques, la mention: «exclusivement pour des investigations cliniques»; \n\tg. s'il s'agit d'un dispositif sur mesure, la mention «dispositif sur mesure»; \n\th. l'indication du mois et de l'année de fabrication; \n\ti. une indication univoque de la date limite d'utilisation ou d'implantation du dispositif en toute sécurité, exprimée au moins par l'année et le mois; et \n\tj. l'instruction indiquant qu'il convient de se reporter à la notice d'utilisation afin de savoir comment procéder lorsque le conditionnement stérile est endommagé ou involontairement ouvert avant utilisation."
    4_prefix: "23.4"
    4_label: "Étiquetage et notice d'utilisation - Informations figurant dans la notice d'utilisation"
    4_desc: "La notice d'utilisation contient toutes les informations suivantes: \n\ta. les informations visées à la section 23.2, points a), c), e), f), k), l), n) et r); \n\tb. la destination du dispositif, assortie d'une description précise des indications et des contre-indications, du ou des groupes cibles de patients et des utilisateurs auquel le dispositif est destiné, le cas échéant; \n\tc. le cas échéant, une description des bénéfices cliniques escomptés; \n\td. le cas échéant, des liens vers le résumé des caractéristiques de sécurité et des performances visé à l'article 32; \n\te. les caractéristiques en matière de performances du dispositif; \n\tf. le cas échéant, les informations permettant au professionnel de la santé de vérifier si le dispositif est adéquat et de sélectionner le logiciel et les accessoires adaptés; \n\tg. tout risque résiduel, contre-indication et effet secondaire indésirable, ainsi que les informations à transmettre au patient à cet égard; \n\th. les indications nécessaires à l'utilisateur pour utiliser le dispositif correctement, comme le degré de précision s'il s'agit d'un dispositif ayant une fonction de mesurage, par exemple; \n\ti. les indications concernant tout traitement ou manipulation préparatoire requis avant l'utilisation du dispositif ou en cours d'utilisation (telles que stérilisation, assemblage final ou étalonnage, etc.), y compris les niveaux de désinfection requis pour garantir la sécurité du patient et toutes les méthodes disponibles pour parvenir à ces niveaux; \n\tj. toute spécification particulière concernant les installations requises ou la formation ou la qualification de l'utilisateur du dispositif et/ou d'autres personnes; \n\tk. les informations nécessaires pour vérifier que le dispositif est correctement installé et qu'il est prêt à fonctionner en toute sécurité et comme prévu par le fabricant, ainsi que, s'il y a lieu: \n\t\t— les informations relatives à la nature et à la fréquence des opérations préventives et régulières de maintenance, ainsi qu'à toute opération préparatoire de nettoyage ou de désinfection, \n\t\t— l'indication de tout composant consommable et de la manière de le remplacer, \n\t\t— les informations relatives à tout étalonnage nécessaire pour garantir que le dispositif fonctionne correctement et en toute sécurité pendant sa durée de vie prévue, et \n\t\t— les méthodes d'élimination des risques auxquels sont exposées les personnes intervenant dans l'installation, l'étalonnage ou la maintenance du dispositif; \n\tl. si le dispositif est fourni à l'état stérile, les instructions à suivre si le conditionnement stérile a été endommagé ou involontairement ouvert avant utilisation; \n\tm. si le dispositif est fourni à l'état non stérile et qu'il doit être stérilisé avant utilisation, les instructions à suivre en vue de sa stérilisation; \n\tn. si le dispositif est réutilisable, les informations relatives aux procédés appropriés pour permettre sa réutilisation, notamment le nettoyage, la désinfection, le conditionnement et, s'il y a lieu, la méthode validée de stérilisation convenant à l'État ou aux États membres dans lesquels le dispositif a été mis sur le marché. Des informations sont fournies permettant de déterminer quand un dispositif ne devrait plus être réutilisé, comme par exemple les signes de dégradation matérielle ou le nombre maximal de réutilisations admissibles; \n\to. l'indication, le cas échéant, qu'un dispositif ne peut être réutilisé que s'il a été reconditionné sous la responsabilité du fabricant pour être conforme aux exigences générales en matière de sécurité et de performances; \n\tp. si le dispositif porte une indication précisant qu'il est à usage unique, des informations sur les caractéristiques et facteurs techniques connus du fabricant susceptibles d'engendrer un risque en cas de réutilisation du dispositif. Ces informations reposent sur une section spécifique de la documentation du fabricant relative à la gestion des risques, exposant en détail ces caractéristiques et facteurs techniques. Si, conformément à la section 23.1, point d), aucune notice d'utilisation n'est requise, ces informations sont fournies à l'utilisateur sur demande; \n\tq. pour les dispositifs destinés à être utilisés avec d'autres dispositifs et/ou des équipements d'usage général: \n\t\t— les informations permettant d'identifier ces dispositifs ou équipements, de manière à permettre une combinaison sûre, et/ou \n\t\t— les informations sur toute restriction connue à la combinaison avec des dispositifs et des équipements; \n\tr. si le dispositif émet des rayonnements à des fins médicales: \n\t\t— des informations détaillées sur la nature, le type et, s'il y a lieu, l'intensité et la distribution des rayonnements émis, \n\t\t— les moyens de protection du patient, de l'utilisateur ou de toute autre personne contre une irradiation non intentionnelle lors de l'utilisation du dispositif; \n\ts. les informations permettant à l'utilisateur et/ou au patient d'avoir connaissance de toute mise en garde, précaution, contre-indication, mesure requise et restriction d'utilisation concernant le dispositif. Ces informations permettent à l'utilisateur, le cas échéant, d'informer le patient de toute mise en garde, précaution, contre-indication, mesure requise et restriction d'utilisation concernant le dispositif. Ces informations concernent, s'il y a lieu: \n\t\t— les mises en garde, précautions et/ou mesures requises en cas de dysfonctionnement du dispositif ou de variation de ses performances susceptible d'influer sur la sécurité, \n\t\t— les mises en garde, précautions et/ou mesures requises en ce qui concerne l'exposition à des influences externes ou des conditions d'environnement raisonnablement prévisibles, telles que les champs magnétiques, les effets électriques et électromagnétiques externes, les décharges électrostatiques, les radiations associées aux procédures diagnostiques et thérapeutiques, la pression, l'humidité ou la température, \n\t\t— les mises en garde, précautions et/ou mesures requises en ce qui concerne les risques d'interférence liée à la présence raisonnablement prévisible du dispositif lors d'investigations diagnostiques, d'évaluations, de traitements thérapeutiques ou d'autres procédures spécifiques, par exemple des interférences électromagnétiques du dispositif avec d'autres équipements, \n\t\t— si le dispositif est destiné à administrer des médicaments, des tissus ou cellules d'origine humaine ou animale ou leurs dérivés, ou des substances biologiques, toute restriction ou incompatibilité concernant le choix des substances administrées, \n\t\t— les mises en garde, précautions et/ou restrictions concernant le médicament ou la matière biologique qui fait partie intégrante du dispositif, et \n\t\t— les précautions relatives aux matériaux intégrés au dispositif qui consistent en substances cancérogènes, mutagènes ou toxiques pour la reproduction ou en perturbateurs endocriniens, ou qui contiennent de telles substances, ou qui peuvent provoquer une sensibilisation ou une réaction allergique du patient ou de l'utilisateur; \n\tt. dans le cas des dispositifs qui sont composés de substances ou de combinaisons de substances qui sont destinées à être introduites dans le corps humain et qui sont absorbées par le corps humain ou dispersées localement dans celui-ci, les mises en garde et précautions, le cas échéant, liées au profil général d'interaction entre le dispositif et les produits de son métabolisme et d'autres dispositifs, médicaments et substances, ainsi que les contre-indications, les effets secondaires indésirables et les risques liés au surdosage; \n\tu. dans le cas des dispositifs implantables, les informations quantitatives et qualitatives générales sur les matériaux et substances auxquels les patients sont susceptibles d'être exposés; \n\tv. les mises en garde ou les précautions requises pour favoriser une élimination sûre du dispositif, de ses accessoires et des consommables avec lesquels il est utilisé, le cas échéant. Ces informations portent notamment, s'il y a lieu: \n\t\t— sur les risques d'infection et les risques microbiens dus par exemple à des explants, des aiguilles ou un équipement chirurgical contaminés par des substances d'origine humaine potentiellement infectieuses, et \n\t\t— sur les risques physiques provenant, par exemple, d'objets piquants et coupants. \n Si, conformément à la section 23.1, point d), aucune notice d'utilisation n'est requise, ces informations sont fournies à l'utilisateur sur demande; \n\tw. pour les dispositifs destinés à être utilisés par des profanes, les circonstances dans lesquelles l'utilisateur devrait consulter un professionnel de la santé; \n\tx. pour les dispositifs relevant du présent règlement en application de l'article 1er, paragraphe 2, des informations concernant l'absence de bénéfice clinique et les risques liés à l'utilisation du dispositif; \n\ty. la date de publication de la notice d'utilisation ou, si celle-ci a été révisée, la date de publication et le numéro de version de la notice d'utilisation; \n\tz. une mention à l'intention de l'utilisateur et/ou du patient indiquant que tout incident grave survenu en lien avec le dispositif devrait faire l'objet d'une notification au fabricant et à l'autorité compétente de l'État membre dans lequel l'utilisateur et/ou le patient est établi; \n\taa. les informations à fournir au patient avec un dispositif implantable conformément à l'article 18; \n\tab. pour les dispositifs comportant des systèmes électroniques programmables, notamment des logiciels, ou des logiciels qui sont des dispositifs à part entière, les exigences minimales concernant le matériel informatique, les caractéristiques des réseaux informatiques et les mesures de sécurité informatique, y compris la protection contre l'accès non autorisé, qui sont nécessaires pour faire fonctionner le logiciel comme prévu."
12:
  prefix: "Annexe II"
  title: "Documentation technique"
  desc: "DOCUMENTATION TECHNIQUE \n\n La documentation technique et, le cas échéant, un résumé de celle-ci, que le fabricant doit établir, sont présentés de manière claire, organisée et non ambiguë, sous une forme facilement consultable, et comprennent en particulier les éléments énumérés dans la présente annexe."
  1_prefix: "1.1"
  1_label: "Description et spécification du dispositif"
  1_desc: "\ta. Le nom ou la dénomination commerciale du produit et une description générale du dispositif, y compris sa destination, et les utilisateurs auxquels il est destiné. \n\tb. L'IUD-ID visé à l'annexe VI, partie C, attribué par le fabricant au dispositif en question, dès lors que l'identification du dispositif est basée sur un système IUD, ou une autre identification claire au moyen d'un code de produit, d'un numéro dans le catalogue ou d'une autre référence non équivoque permettant la traçabilité. \n\tc. La population de patients visée, l'affection à diagnostiquer, à traiter et/ou à contrôler et d'autres considérations telles que les critères de sélection applicables aux patients, les indications, les contre-indications et les mises en garde. \n\td. Les principes de fonctionnement du dispositif et son mode d'action, démontré scientifiquement si nécessaire. \n\te. Les raisons pour lesquelles le produit constitue un dispositif. \n\tf. La classe de risque du dispositif et la justification de la ou des règles de classification appliquées conformément à l'annexe VIII. \n\tg. Une explication de toute nouvelle caractéristique. \n\th. Une description des accessoires de dispositif, des autres dispositifs et des produits autres que des dispositifs destinés à être utilisés en combinaison avec le dispositif. \n\ti. Une description ou la liste complète des différentes configurations ou variantes du dispositif qui doivent être mises à disposition sur le marché. \n\tj. Une description générale des éléments fonctionnels clés tels que les pièces ou composants (y compris le logiciel, le cas échéant), la formulation, la composition, la fonctionnalité et, le cas échéant, la composition qualitative et quantitative. Si nécessaire, celle-ci doit comprendre des représentations visuelles légendées (schémas, photos, dessins, etc.) indiquant clairement les pièces ou composants clés et incluant l'explication nécessaire à la compréhension des dessins et des schémas. \n\tk. Une description des matières premières intégrées dans les éléments fonctionnels clés et les éléments en contact direct avec le corps humain ou en contact indirect, par exemple, lors de la circulation extracorporelle des liquides corporels. \n\tl. Les spécifications techniques, telles que caractéristiques, dimensions et caractéristiques de performance, du dispositif et de toute variante/configuration ou de tout accessoire qui figurent habituellement dans les spécifications du produit mises à disposition de l'utilisateur, par exemple dans des brochures, des catalogues et des publications similaires."
  2_prefix: "1.2"
  2_label: "Référence à des générations précédentes et similaires du dispositif"
  2_desc: "\ta. Une présentation générale de la ou des générations précédentes du dispositif produites par le fabricant, s'il en existe. \n\tb. Une présentation générale des dispositifs similaires identifiés disponibles sur le marché de l'Union ou le marché international, s'il en existe."
  3_prefix: "2"
  3_label: "Informations devant être fournies par le fabricant"
  3_desc: "Un jeu complet comprenant: \n\t— la ou les étiquettes présentes sur le dispositif et sur son conditionnement, par exemple le conditionnement de chaque unité, le conditionnement de vente, le conditionnement de transport en cas de conditions particulières de manipulation, dans les langues acceptées dans les États membres dans lesquels il est envisagé de vendre le dispositif, e \n\t— la notice d'utilisation dans les langues acceptées dans les États membres dans lesquels il est envisagé de vendre le dispositif."
  4_prefix: "3"
  4_label: "Informations sur la conception et la fabrication"
  4_desc: " \ta. Informations permettant la compréhension des étapes de la conception du dispositif. \n\tb. Informations et spécifications complètes, y compris concernant les processus de fabrication et leur validation, les adjuvants, le contrôle continu et les essais sur le produit final. Les données figurent intégralement dans la documentation technique. \n\tc. Identification de tous les sites, y compris ceux des fournisseurs et des sous-traitants, où ont lieu les activités de conception et de fabrication."
  5_prefix: "4"
  5_label: "Exigences générales en matière de sécurité et de performance"
  5_desc: "La documentation contient des informations permettant de démontrer la conformité avec les exigences générales en matière de sécurité et de performances établies à l'annexe I qui sont applicables au dispositif compte tenu de sa destination, y compris une justification, une validation et une vérification des solutions retenues pour satisfaire auxdites exigences. La démonstration de conformité contient: \n\t a. les exigences générales en matière de sécurité et de performances qui s'appliquent au dispositif et les raisons pour lesquelles les autres exigences ne s'y appliquent pas;  \n\t b. la ou les méthodes utilisées pour démontrer la conformité avec chaque exigence générale applicable en matière de sécurité et de performances;  \n\t c. les normes harmonisées, spécifications communes ou autres solutions appliquées; et  \n\t d. la référence précise des documents contrôlés fournissant la preuve du respect de chaque norme harmonisée, spécification commune ou autre méthode appliquée pour démontrer la conformité avec les exigences générales en matière de sécurité et de performances. Les informations visées au présent point indiquent où trouver cette preuve dans la documentation technique complète et, le cas échéant, dans le résumé de la documentation technique."
  6_prefix: "5"
  6_label: "Analyse bénéfice/risque et gestion des risques"
  6_desc: "La documentation contient des informations sur: \n\ta. l'analyse bénéfice/risque visée à l'annexe I, sections 1 et 8; et \n\tb. les solutions retenues et les résultats de la gestion des risques visée à l'annexe I, section 3."
  7_prefix: "6"
  7_label: "Vérification et validation du produit"
  7_desc: "La documentation contient les résultats et les analyses critiques de l'ensemble des études et/ou des essais de vérification et de validation qui ont été effectués pour démontrer que le dispositif respecte les exigences du présent règlement, en particulier les exigences générales en matière de sécurité et de performances."
  8_prefix: "6.1"
  8_label: "Données précliniques et cliniques"
  8_desc: "\ta. Les résultats d'essais, tels que des essais d'ingénierie, en laboratoire, des simulations, et des essais sur des animaux, et d'évaluations contenus dans la littérature publiée qui sont applicables au dispositif, compte tenu de sa destination, ou à des dispositifs similaires, concernant la sécurité préclinique du dispositif et le respect des spécifications. \n\tb. Des informations détaillées relatives à la conception des essais, aux protocoles d'essai ou d'étude complets, aux méthodes d'analyse des données, ainsi que des synthèses de données et des conclusions des essais concernant en particulier: \n\t\t— la biocompatibilité du dispositif, y compris le recensement de tous les matériaux en contact direct ou indirect avec le patient ou l'utilisateur, \n\t\t— la caractérisation physico-chimique et microbiologique, \n\t\t— la sécurité électrique et la compatibilité électromagnétique, \n\t\t— la vérification et la validation du logiciel: description de la conception et du processus de développement du logiciel et preuve de la validation de celui-ci, tel qu'il est utilisé dans le dispositif fini. Ces informations incluent en règle générale un résumé des résultats de l'ensemble de la vérification, de la validation et des essais réalisés en interne et dans un environnement d'utilisation simulé ou réel avant la libération finale. En outre, elles prennent en compte toutes les différentes configurations du matériel informatique et, le cas échéant, des différents systèmes d'exploitation figurant dans les informations fournies par le fabricant, \n\t\t— la stabilité, y compris la durée de conservation en stock, et \n\t\t— les performances et la sécurité. \n\n Le cas échéant, il convient de démontrer la conformité avec les dispositions de la directive 2004/10/CE du Parlement européen et du Conseil (1). \n\n Si aucun nouvel essai n'a été effectué, la documentation en explique la raison. Cela peut par exemple tenir au fait que des essais de biocompatibilité sur des matériaux identiques ont été réalisés lorsque ces matériaux ont été utilisés dans une version précédente du dispositif, qui a été légalement mise sur le marché ou mise en service. \n\tc. Le rapport sur l'évaluation clinique ainsi que ses mises à jour et le plan d'évaluation clinique visé à l'article 61, paragraphe 12, et à l'annexe XIV, partie A. \n\td. Le plan de suivi clinique après commercialisation (SCAC) et le rapport d'évaluation du SCAC, visés à l'annexe XIV, partie B ou une justification expliquant pourquoi un SCAC n'est pas applicable."
  9_prefix: "6.2"
  9_label: "Informations supplémentaires requises dans des cas spécifiques"
  9_desc: "\ta. Une mention indiquant si un dispositif incorpore comme partie intégrante une substance qui, utilisée séparément, est susceptible d'être considérée comme un médicament au sens de l'article 1er, point 2, de la directive 2001/83/CE, notamment un médicament dérivé du sang ou du plasma humain, visé à l'article 1er, paragraphe 8, premier alinéa, du présent règlement. Dans ce cas, la documentation indique la source de cette substance et fournit les données des essais effectués pour évaluer la sécurité, la qualité et l'utilité de cette substance, compte tenu de la destination du dispositif. \n\tb. Une mention indiquant si un dispositif est fabriqué à partir de tissus ou de cellules d'origine humaine ou animale, ou de leurs dérivés, et relève du présent règlement conformément à l'article 1er, paragraphe 6, points f) et g), et si un dispositif incorpore comme partie intégrante des tissus ou cellules d'origine humaine ou animale, ou leurs dérivés, dont l'action est accessoire à celle du dispositif et relève du présent règlement conformément à l'article 1er, paragraphe 10, premier alinéa. Dans ce cas, la documentation indique tous les matériaux d'origine humaine ou animale utilisés et fournit des informations détaillées relatives au respect de l'annexe I, section 13.1 ou 13.2. \n\tc. Dans le cas des dispositifs qui sont composés de substances ou de combinaisons de substances qui sont destinées à être introduites dans le corps humain et qui sont absorbées par le corps humain ou dispersées localement dans celui-ci, des informations détaillées relatives notamment à la conception des essais, aux protocoles d'essai ou d'étude complets, aux méthodes d'analyse des données, ainsi que des synthèses de données et des conclusions des essais, dans le cas d'études portant sur \n\t— l'absorption, la distribution, le métabolisme et l'excrétion \n\t— d'éventuelles interactions de ces substances ou de leurs produits de métabolisme dans le corps humain, avec d'autres dispositifs, médicaments ou substances, eu égard à la population cible et à son état de santé \n\t— la tolérance locale, e \n\t— la toxicité, y compris la toxicité résultant d'une dose unique et de doses répétées, la génotoxicité, la carcinogénicité et la toxicité pour la reproduction ou le développement, selon le cas, en fonction du niveau et de la nature de l'exposition au dispositif. \n\n En l'absence de telles études, une justification est fournie. \n\td. Dans le cas des dispositifs contenant des substances cancérogènes, mutagènes ou toxiques pour la reproduction ou des perturbateurs endocriniens visés à l'annexe I, section 10.4.1, la justification visée à la section 10.4.2 de ladite annexe. \n\te. Dans le cas des dispositifs mis sur le marché à l'état stérile ou dans des conditions microbiologiques particulières, une description des conditions environnementales pour les étapes de fabrication. Dans le cas des dispositifs mis sur le marché à l'état stérile, une description des méthodes utilisées, y compris les rapports de validation, pour le conditionnement, la stérilisation et le maintien de la stérilité. Le rapport de validation tient compte des tests de biocharge, des essais de recherche de pyrogènes et, s'il y a lieu, des essais de recherche de résidus de stérilisation. \n\tf. Dans le cas des dispositifs mis sur le marché ayant une fonction de mesurage, une description des méthodes utilisées pour garantir l'exactitude indiquée dans les spécifications. \n\tg. Si le dispositif doit être raccordé à un ou plusieurs autres dispositifs pour pouvoir fonctionner comme prévu, une description du raccordement/de la configuration incluant la preuve qu'il/elle est conforme aux exigences générales en matière de sécurité et de performances pour tous les dispositifs concernés une fois connectés, au regard des caractéristiques indiquées par le fabricant."
13:
  prefix: "Annexe III"
  title: "Documentation technique relative à la surveillance après commercialisation"
  desc: "DOCUMENTATION TECHNIQUE RELATIVE À LA SURVEILLANCE APRÈS COMMERCIALISATION \n\n La documentation technique relative à la surveillance après commercialisation, que le fabricant est tenu d'établir conformément aux articles 83 à 86, est présentée de manière claire, organisée et non ambiguë, sous une forme facilement consultable, et comprend les éléments visés dans la présente annexe."
  1_prefix: "1.1"
  1_desc: "Plan de surveillance après commercialisation établi conformément à l'article 84. \n\n Le fabricant démontre, dans un plan de surveillance après commercialisation, qu'il satisfait à l'obligation visée à l'article 83. \n\ta. Le plan de surveillance après commercialisation concerne la collecte et l'utilisation des informations disponibles, notamment: \n\t\t— les informations concernant les incidents graves, y compris les informations provenant des PSUR, et les mesures correctives de sécurité \n\t\t— les informations concernant les incidents qui ne sont pas des incidents graves et les données relatives aux éventuels effets secondaires indésirables \n\t\t— les informations provenant du rapport de tendances \n\t\t— les publications, bases de données et/ou registres techniques ou spécialisés \n\t\t— les informations fournies par les utilisateurs, les distributeurs et les importateurs, y compris les retours d'information et réclamations, e \n\t\t— les informations publiques concernant des dispositifs médicaux similaires. \n\tb. Le plan de surveillance après commercialisation comprend au moins: \n\t\t— un processus proactif et systématique de collecte des informations visées au point a). Ce processus permet de définir correctement les caractéristiques de performance des dispositifs et d'effectuer une comparaison entre les dispositifs et des produits similaires disponibles sur le marché \n\t\t— des méthodes et des processus appropriés et efficaces pour l'évaluation des données collectées \n\t\t— des indicateurs et des seuils adaptés à utiliser pour procéder à la réévaluation continue de l'analyse bénéfice/risque et de la gestion des risques conformément à l'annexe I, section 3 \n\t\t— des méthodes et des outils appropriés et efficaces pour donner suite aux réclamations et analyser les données d'expérience en matière de commercialisation collectées sur le terrain \n\t\t— des méthodes et des protocoles pour gérer les événements faisant l'objet du rapport de tendances, conformément à l'article 88, notamment les méthodes et protocoles servant à établir une éventuelle progression statistiquement significative de la fréquence ou de la sévérité des incidents ainsi que la période d'observation \n\t\t— des méthodes et des protocoles permettant une communication efficace avec les autorités compétentes, les organismes notifiés, les opérateurs économiques et les utilisateurs \n\t\t— une référence aux procédures permettant aux fabricants de satisfaire aux obligations visées aux articles 83, 84 et 86 \n\t\t— des procédures systématiques pour définir et engager les mesures appropriées, y compris des mesures correctives \n\t\t— des outils efficaces permettant d'identifier et de retrouver les dispositifs susceptibles de nécessiter des mesures correctives, e \n\t\t— un plan de SCAC comme indiqué à l'annexe XIV, partie B, ou tout élément justifiant qu'un SCAC n'est pas applicable."
  2_prefix: "1.2"
  2_label: "PSUR visé à l'article 86 et rapport sur la surveillance après commercialisation visé à l'article 85."
14:
  prefix: "Annexe IV"
  title: "Déclaration de conformité UE"
  desc: "La déclaration de conformité UE contient l'ensemble des informations suivantes:"
  1_prefix: "1"
  1_label: "Le nom, la raison sociale ou la marque déposée, et, s'il a déjà été délivré, le numéro d'enregistrement unique visé à l'article 31 du fabricant et, le cas échéant, de son mandataire, et l'adresse de leur siège social à laquelle ils peuvent être joints et celle de leur lieu d'établissement."
  2_prefix: "2"
  2_label: "Une attestation certifiant que la déclaration de conformité UE est établie sous la seule responsabilité du fabricant."
  3_prefix: "3"
  3_label: "L'IUD-ID de base visé à l'annexe VI, partie C."
  4_prefix: "4"
  4_desc: "Le nom et la dénomination commerciale du produit, le code du produit, le numéro dans le catalogue ou une autre référence non équivoque permettant l'identification et la traçabilité du dispositif faisant l'objet de la déclaration de conformité UE, telle qu'une photo, si nécessaire, ainsi que sa destination. À l'exception du nom ou de la dénomination commerciale du produit, les informations permettant l'identification et la traçabilité peuvent être contenues dans l'IUD-ID de base visé au point 3."
  5_prefix: "5"
  5_label: "La classe de risque du dispositif conformément aux règles établies à l'annexe VIII."
  6_prefix: "6"
  6_label: "Une déclaration attestant que le dispositif faisant l'objet de la déclaration de conformité UE respecte le présent règlement et, le cas échéant, toute autre législation de l'Union applicable prévoyant l'établissement d'une déclaration de conformité UE."
  7_prefix: "7"
  7_label: "Des références aux spécifications communes qui ont été utilisées et par rapport auxquelles la conformité est déclarée."
  8_prefix: "8"
  8_label: "Le cas échéant, le nom et le numéro d'identification de l'organisme notifié, une description de la procédure d'évaluation de la conformité suivie et la référence du ou des certificats délivrés."
  9_prefix: "9"
  9_label: "Le cas échéant, des informations supplémentaires."
  10_prefix: "10"
  10_label: "Le lieu et la date de délivrance de la déclaration, le nom et la fonction du signataire ainsi que la mention de la personne pour le compte de laquelle ce dernier a signé, et la signature."
15:
  prefix: "Annexe V"
  title: "Marquage de conformité CE"
  1_prefix: "1"
  1_label: "Le marquage CE est constitué des initiales «CE»"
  2_prefix: "2"
  2_label: "En cas de réduction ou d'agrandissement du marquage CE, les proportions telles qu'elles ressortent du graphisme gradué figurant ci-dessus sont respectées."
  3_prefix: "3"
  3_label: "Les différents éléments du marquage CE ont sensiblement la même dimension verticale, qui ne peut être inférieure à 5 mm. Il peut être dérogé à cette dimension minimale pour les dispositifs de petites dimensions."
16:
  prefix: "Annexe VI"
  title: "Informations à fournir lors de l'enregistrement des dispositifs et des opérateurs économiques conformément à l'article 29, paragraphe 4, et à l'article 31; principaux éléments de données à fournir à la base de données IUD avec l'IUD-ID conformément aux articles 8 et 29 et système IUD"
  1:
    prefix: "Partie A.1"
    title: "Informations relatives à l'opérateur économique"
    desc: "INFORMATIONS À FOURNIR LORS DE L'ENREGISTREMENT DES DISPOSITIFS ET DES OPÉRATEURS ÉCONOMIQUES CONFORMÉMENT À L'ARTICLE 29, PARAGRAPHE 4, ET À L'ARTICLE 31 \n\n Les fabricants ou, le cas échéant, leurs mandataires et, le cas échéant, les importateurs fournissent les informations visées à la section 1 et veillent à ce que les informations concernant leurs dispositifs visées à la section 2 soient complètes et exactes et mises à jour par la partie concernée."
    1_prefix: "A1.1"
    1_label: "le type d'opérateur économique (fabricant, mandataire ou importateur);"
    2_prefix: "A1.2"
    2_label: "le nom, l'adresse et les coordonnées de l'opérateur économique;"
    3_prefix: "A1.3"
    3_label: "lorsque les informations sont communiquées par une tierce personne pour le compte de l'un des opérateurs économiques mentionnés à la section 1.1, le nom, l'adresse et les coordonnées de cette tierce personne;"
    4_prefix: "A1.4"
    4_label: "le nom, l'adresse et les coordonnées de la ou des personnes chargées de veiller au respect de la réglementation visée à l'article 15."
  2:
    prefix: "Partie A.2"
    title: "Informations relatives au dispositif"
    desc: "INFORMATIONS À FOURNIR LORS DE L'ENREGISTREMENT DES DISPOSITIFS ET DES OPÉRATEURS ÉCONOMIQUES CONFORMÉMENT À L'ARTICLE 29, PARAGRAPHE 4, ET À L'ARTICLE 31 \n\n Les fabricants ou, le cas échéant, leurs mandataires et, le cas échéant, les importateurs fournissent les informations visées à la section 1 et veillent à ce que les informations concernant leurs dispositifs visées à la section 2 soient complètes et exactes et mises à jour par la partie concernée."
    1_prefix: "A2.1"
    1_label: "IUD-ID de base;"
    2_prefix: "A2.2"
    2_label: "le type, le numéro et la date d'expiration du certificat délivré par l'organisme notifié ainsi que le nom ou le numéro d'identification dudit organisme et le lien vers les informations figurant sur le certificat qui ont été enregistrées par l'organisme notifié dans le système électronique relatif aux organismes notifiés et aux certificats;"
    3_prefix: "A2.3"
    3_label: "l'État membre dans lequel le dispositif doit être ou a été mis sur le marché dans l'Union;"
    4_prefix: "A2.4"
    4_label: "dans le cas des dispositifs de classe IIa, IIb ou III, les États membres dans lesquels le dispositif est ou sera mis à disposition;"
    5_prefix: "A2.5"
    5_label: "la classe de risque du dispositif;"
    6_prefix: "A2.6"
    6_label: "dispositif à usage unique retraité (oui/non);"
    7_prefix: "A2.7"
    7_label: "la présence d'une substance qui, utilisée séparément, est susceptible d'être considérée comme un médicament et le nom de cette substance;"
    8_prefix: "A2.8"
    8_label: "la présence d'une substance qui, utilisée séparément, est susceptible d'être considérée comme un médicament dérivé du sang ou du plasma d'origine humaine et le nom de cette substance;"
    9_prefix: "A2.9"
    9_label: "présence de cellules ou de tissus d'origine humaine, ou de leurs dérivés, (oui/non);"
    10_prefix: "A2.10"
    10_label: "présence de cellules ou de tissus d'origine animale, ou de leurs dérivés, visés dans le règlement (UE) no 722/2012 (oui/non);"
    11_prefix: "A2.11"
    11_label: "le cas échéant, le numéro d'identification unique de la ou des investigations cliniques conduites en rapport avec le dispositif ou un lien vers l'enregistrement des investigations cliniques dans le système électronique relatif à ces investigations;"
    12_prefix: "A2.12"
    12_label: "dans le cas des dispositifs énumérés à l'annexe XVI, une mention précisant si la destination du dispositif est autre qu'une destination médicale;"
    13_prefix: "A2.13"
    13_label: "dans le cas des dispositifs conçus et fabriqués par une autre personne physique ou morale visée à l'article 10, paragraphe 15, le nom, l'adresse et les coordonnées de cette personne physique ou morale;"
    14_prefix: "A2.14"
    14_label: "dans le cas des dispositifs de classe III ou des dispositifs implantables, le résumé des caractéristiques de sécurité et des performances cliniques;"
    15_prefix: "A2.15"
    15_label: "le statut du dispositif (sur le marché, plus mis sur le marché, rappelé, mesures correctives de sécurité mises en place)."
  3:
    prefix: "Partie B"
    title: "Principaux éléments de données à forunir à la base de données IUID avec l'IUD-ID conformément aux articles 28 et 29"
    desc: "Le fabricant fournit à la base de données IUD l'IUD-ID et toutes les informations suivantes relatives au fabricant et au dispositif:"
    1_prefix: "B.1"
    1_label: "la quantité par unité de conditionnement;"
    2_prefix: "B.2"
    2_label: "l'IUD-ID de base visé à l'article 29 et toutes UDI-ID supplémentaires;"
    3_prefix: "B.3"
    3_label: "la manière selon laquelle la production du dispositif est contrôlée (date d'expiration ou date de fabrication, numéro de lot, numéro de série);"
    4_prefix: "B.4"
    4_label: "le cas échéant, l'ID de l'unité d'utilisation UDI-ID (lorsqu'un IUD n'est pas indiqué sur l'étiquette du dispositif au niveau de son unité d'utilisation, un ID «Unité d'utilisation» est attribué de manière à associer l'utilisation d'un dispositif à un patient);"
    5_prefix: "B.5"
    5_label: "le nom et l'adresse du fabricant (tels qu'ils figurent sur l'étiquette);"
    6_prefix: "B.6"
    6_label: "le numéro d'enregistrement unique délivré conformément à l'article 31, paragraphe 2;"
    7_prefix: "B.7"
    7_label: "le cas échéant, le nom et l'adresse du mandataire (tels qu'ils figurent sur l'étiquette);"
    8_prefix: "B.8"
    8_label: "le code de la nomenclature des dispositifs médicaux prévu à l'article 26;"
    9_prefix: "B.9"
    9_label: "la classe de risque du dispositif;"
    10_prefix: "B.10"
    10_label: "le cas échéant, le nom ou la dénomination commerciale;"
    11_prefix: "B.11"
    11_label: "le cas échéant, le modèle du dispositif, la référence ou le numéro dans le catalogue;"
    12_prefix: "B.12"
    12_label: "le cas échéant, les dimensions cliniques (dont le volume, la longueur, le calibre, le diamètre);"
    13_prefix: "B.13"
    13_label: "une description supplémentaire du produit (facultatif);"
    14_prefix: "B.14"
    14_label: "le cas échéant, les conditions de stockage et/ou de manipulation (telles qu'elles sont indiquées sur l'étiquette ou dans la notice d'utilisation);"
    15_prefix: "B.15"
    15_label: "le cas échéant, d'autres dénominations commerciales du dispositif;"
    16_prefix: "B.16"
    16_label: "étiqueté comme un dispositif à usage unique (oui/non);"
    17_prefix: "B.17"
    17_label: "le cas échéant, le nombre maximal de réutilisations;"
    18_prefix: "B.18"
    18_label: "dispositif étiqueté comme stérile (oui/non);"
    19_prefix: "B.19"
    19_label: "stérilisation nécessaire avant utilisation (oui/non);"
    20_prefix: "B.20"
    20_label: "contenant du latex (oui/non);"
    21_prefix: "B.21"
    21_label: "le cas échéant, des informations étiquetées conformément à l'annexe I, à la section 10.4.5;"
    22_prefix: "B.22"
    22_label: "une URL pour des informations supplémentaires, telles qu'une notice d'utilisation électronique (facultatif);"
    23_prefix: "B.23"
    23_label: "le cas échéant, des mises en garde ou contre-indications importantes;"
    24_prefix: "B.24"
    24_label: "le statut du dispositif (sur le marché, plus mis sur le marché, rappelé, mesures correctives de sécurité mises en place)."
  4:
    prefix: "Partie C.2 - LE SYSTÈME IUD"
    title: "Exigences générales"
    1_prefix: "C.2.1"
    1_label: "L'apposition de l'IUD est une exigence supplémentaire; elle ne remplace aucune des autres exigences de marquage ou d'étiquetage énoncées à l'annexe I du présent règlement."
    2_prefix: "C.2.2"
    2_label: "Le fabricant attribue et maintient des IUD uniques pour ses dispositifs."
    3_prefix: "C.2.3"
    3_label: "Seul le fabricant peut apposer l'IUD sur le dispositif ou son conditionnement."
    4_prefix: "C.2.4"
    4_label: "Seules les normes de codification fournies par les entités d'attribution désignées par la Commission conformément à l'article 27, paragraphe 2, peuvent être utilisées."
  5:
    prefix: "Partie C.3 - LE SYSTÈME IUD"
    title: "IUD"
    1_prefix: "C.3.1"
    1_label: "Un IUD est attribué au dispositif proprement dit ou à son conditionnement. Les niveaux de conditionnement supérieurs ont leur propre IUD."
    2_prefix: "C.3.2"
    2_desc: "Les conteneurs de transport sont exemptés de l'exigence visée à la section 3.1. Par exemple, un IUD n'est pas requis sur une unité logistique; lorsqu'un professionnel de la santé commande des dispositifs multiples au moyen de l'IUD ou du numéro de modèle des dispositifs individuels et que le fabricant met ces dispositifs dans un conteneur en vue de leur transport ou de protéger les dispositifs conditionnés séparément, le conteneur (unité logistique) n'est pas soumis aux exigences en matière d'IUD."
    3_prefix: "C.3.3"
    3_label: "L'IUD se compose de deux parties: un IUD-ID et un IUD-IP."
    4_prefix: "C.3.4"
    4_label: "L'IUD-ID est unique pour chaque niveau de conditionnement du dispositif."
    5_prefix: "C.3.5"
    5_label: "Si un numéro de lot, un numéro de série, un identifiant de logiciel ou une date d'expiration apparaît sur l'étiquette, il fait partie de l'IUD-IP. Si l'étiquette comprend également une date de fabrication, celle-ci ne doit pas être incluse dans l'IUD-IP. Si l'étiquette comprend uniquement une date de fabrication, celle-ci fait office d'IUD-IP."
    6_prefix: "C.3.6"
    6_label: "Chaque composant qui est considéré comme un dispositif et est disponible en tant que tel dans le commerce se voit attribuer un IUD distinct, sauf si les composants font partie d'un dispositif configurable portant son propre IUD."
    7_prefix: "C.3.7"
    7_label: "Les systèmes et nécessaires visés à l'article 22 se voient attribuer et portent leurs propres IUD."
    8_prefix: "C.3.8"
    8_label: "Le fabricant attribue l'IUD à un dispositif conformément à la norme de codification applicable."
    9_prefix: "C.3.9"
    9_label: "Un nouvel IUD-ID est requis chaque fois qu'une modification est susceptible de susciter une erreur d'identification du dispositif et/ou une ambiguïté dans sa traçabilité; en particulier, toute modification de l'un des éléments de données suivants figurant dans la base de données IUD exige un nouvel IUD-ID:"
    9_desc: "\ta. nom ou dénomination commerciale; \n\tb. version ou modèle de dispositif; \n\tc. dispositif étiqueté comme étant à usage unique; \n\td. dispositif sous conditionnement stérile; \n\te. stérilisation nécessaire avant utilisation; \n\tf. quantité de dispositifs contenus dans le conditionnement; \n\tg. mises en garde ou contre-indications importantes, par exemple dispositif contenant du latex ou du DEHP."
    10_prefix: "C.3.10"
    10_label: "Les fabricants qui reconditionnent et/ou réétiquettent des dispositifs en y apposant leur propre étiquette, gardent une trace de l'IUD du fabricant du dispositif d'origine (FEO)."
  6:
    prefix: "Partie C.4 - LE SYSTÈME IUD"
    title: "Support IUD"
    1_prefix: "C.4.1"
    1_label: "Le support IUD (transcription AIDC et marquage en clair de l'IUD) est apposé sur l'étiquette ou sur le dispositif proprement dit et sur tous les niveaux de conditionnement supérieurs du dispositif. Les conteneurs de transport ne font pas partie des niveaux de conditionnement supérieurs."
    2_prefix: "C.4.2"
    2_label: "En cas d'espace limité sur le conditionnement de l'unité d'utilisation, le support IUD peut être apposé sur le niveau de conditionnement supérieur suivant."
    3_prefix: "C.4.3"
    3_label: "Pour les dispositifs à usage unique des classes I et IIa conditionnés et étiquetés séparément, le support IUD ne doit pas obligatoirement apparaître sur le conditionnement mais sur un niveau de conditionnement supérieur, par exemple une boîte en carton contenant plusieurs dispositifs conditionnés séparément. Cependant, lorsque le professionnel de la santé n'est pas censé avoir accès, en cas de soins à domicile par exemple, au niveau de conditionnement supérieur, l'IUD est apposé sur le conditionnement de chaque dispositif."
    4_prefix: "C.4.4"
    4_label: "Pour les dispositifs exclusivement destinés à des points de vente au consommateur, les IUD-IP AIDC ne doivent pas obligatoirement apparaître sur le conditionnement au point de vente."
    5_prefix: "C.4.5"
    5_label: "Lorsque des supports AIDC autres que le support IUD font partie de l'étiquetage du produit, ce dernier est aisément identifiable."
    6_prefix: "C.4.6"
    6_label: "S'il est fait usage de codes à barres linéaires, l'IUD-ID et l'IUD-IP peuvent être concaténés ou non concaténés en deux codes à barres ou plus. Toutes les parties et tous les éléments du code à barres linéaire sont reconnaissables et identifiables."
    7_prefix: "C.4.7"
    7_label: "Si des contraintes importantes limitent l'utilisation de l'AIDC et du marquage en clair sur l'étiquette, seul l'AIDC doit y apparaître. Pour les dispositifs destinés à une utilisation en dehors des établissements de soins, par exemple pour les soins à domicile, le marquage en clair figure néanmoins sur l'étiquette, même s'il n'y a dès lors plus de place pour l'AIDC."
    8_prefix: "C.4.8"
    8_label: "Le marquage en clair est conforme aux règles de l'entité délivrant le code IUD."
    9_prefix: "C.4.9"
    9_label: "Si le fabricant recourt à la technologie RFID, un code à barres linéaire ou à deux dimensions conforme à la norme prévue par les entités d'attribution apparaît également sur l'étiquette."
    10_prefix: "C.4.10"
    10_label: "Les dispositifs réutilisables comportent un support IUD apposé sur le dispositif proprement dit. Les dispositifs réutilisables devant être nettoyés, désinfectés, stérilisés ou remis à neuf entre deux utilisations comportent un support IUD permanent qui reste lisible après chaque opération destinée à permettre l'utilisation ultérieure du dispositif, tout au long de sa durée de vie prévue. Les présentes exigences ne s'appliquent pas aux dispositifs dans les cas suivants:"
    10_desc: "\ta. tout type de marquage direct compromettrait la sécurité ou les performances du dispositif; \n\tb. le dispositif ne peut faire l'objet d'un marquage direct car ce n'est pas possible sur le plan technique."
    11_prefix: "C.4.11"
    11_label: "Le support IUD est lisible pendant l'utilisation normale et tout au long de la durée de vie prévue du dispositif."
    12_prefix: "C.4.12"
    12_label: "Si le support IUD peut être aisément lu, ou s'il s'agit d'un AIDC, scanné à travers le conditionnement, il n'est pas nécessaire de l'apposer sur le conditionnement."
    13_prefix: "C.4.13"
    13_label: "Dans le cas d'un dispositif fini unique composé de plusieurs parties qui doivent être assemblées avant sa première utilisation, il suffit d'apposer le support IUD sur une seule partie de chaque dispositif."
    14_prefix: "C.4.14"
    14_label: "Le support IUD est apposé de façon que l'on puisse accéder à l'AIDC pendant le fonctionnement normal ou le stockage."
    15_prefix: "C.4.15"
    15_label: "Les supports de codes à barres comprenant à la fois un IUD-ID et un IUD-IP peuvent également comprendre des données essentielles pour le fonctionnement du dispositif ou d'autres données."
  7:
    prefix: "Partie C.5 - LE SYSTÈME IUD"
    title: "Principes généraux de la base de données IUD"
    1_prefix: "C.5.1"
    1_label: "La base de données IUD facilite l'utilisation de tous les principaux éléments de données qu'elle contient, visés à la partie B de la présente annexe."
    2_prefix: "C.5.2"
    2_label: "Les fabricants sont responsables de l'introduction initiale et de la mise à jour des données d'identification et des autres éléments de données concernant le dispositif dans la base de données IUD."
    3_prefix: "C.5.3"
    3_label: "Des méthodes/procédures appropriées sont appliquées pour valider les données fournies."
    4_prefix: "C.5.4"
    4_label: "Les fabricants vérifient périodiquement l'exactitude de toutes les données pertinentes relatives aux dispositifs qu'ils ont mis sur le marché, sauf en ce qui concerne ceux qui ne sont plus disponibles sur le marché."
    5_prefix: "C.5.5"
    5_label: "La présence de l'IUD-ID d'un dispositif dans la base de données IUD n'est pas interprétée comme signifiant que ce dispositif est conforme au présent règlement."
    6_prefix: "C.5.6"
    6_label: "La base de données permet d'établir un lien entre l'ensemble des niveaux de conditionnement du dispositif."
    7_prefix: "C.5.7"
    7_label: "Les données relatives à de nouveaux IUD-ID sont disponibles au moment où le dispositif est mis sur le marché."
    8_prefix: "C.5.8"
    8_label: "Les fabricants mettent à jour les données correspondantes enregistrées dans la base de données IUD dans un délai de trente jours après que des modifications ont été apportées à un élément qui n'exige pas de nouvel IUD-ID."
    9_prefix: "C.5.9"
    9_label: "Dans toute la mesure du possible, la base de données IUD applique des normes acceptées à l'échelle internationale pour l'introduction et la mise à jour des données."
    10_prefix: "C.5.10"
    10_label: "L'interface utilisateur de la base de données IUD est disponible dans toutes les langues officielles de l'Union. Les champs de texte libre sont toutefois réduits au minimum afin de limiter les besoins de traduction."
    11_prefix: "C.5.11"
    11_label: "Les données relatives aux dispositifs qui ne sont plus disponibles sur le marché sont conservées dans la base de données IUD."
  8:
    prefix: "Partie C.6 - LE SYSTÈME IUD"
    title: "Règles applicables à certains types de dispositifs"
    1_label: "Dispositifs implantables"
    2_prefix: "C.6.1.1"
    2_label: "Les dispositifs implantables, à leur niveau de conditionnement inférieur (unités de conditionnement), sont identifiés, ou font l'objet d'un marquage grâce à l'AIDC, au moyen d'un IUD (IUD-ID + IUD-IP);"
    3_prefix: "C.6.1.2"
    3_label: "L'IUD-IP présente au moins les caractéristiques suivantes:"
    3_desc: "\ta. numéro de série pour les dispositifs implantables actifs; \n\tb. numéro de série ou numéro de lot pour les autres dispositifs implantables."
    4_prefix: "C.6.1.3"
    4_label: "L'IUD d'un dispositif implantable est identifiable avant implantation."
    5_prefix: "C.6.2.1"
    5_label: "Dispositifs réutilisables devant être nettoyés, désinfectés, stérilisés ou remis à neuf entre deux utilisations."
    5_desc: "L'IUD de ces dispositifs est apposé sur le dispositif et est aisément lisible après chaque opération destinée à permettre la réutilisation du dispositif."
    6_prefix: "C.6.2.2"
    6_label: "Dispositifs réutilisables devant être nettoyés, désinfectés, stérilisés ou remis à neuf entre deux utilisations."
    6_desc: "Les caractéristiques de l'IUD-IP, telles que le numéro de série ou de lot, sont définies par le fabricant."
    7_prefix: "C.6.3.1"
    7_label: "La personne physique ou morale visée à l'article 22 est responsable de l'identification du système ou nécessaire au moyen d'un IUD comprenant à la fois un IUD-ID et un IUD-IP."
    8_prefix: "C.6.3.2"
    8_label: "Le contenu d'un système ou nécessaire comporte un support IUD apposé sur le conditionnement ou sur le dispositif proprement dit."
    8_desc: "\ta. les dispositifs individuels à usage unique dont l'utilisation est généralement familière aux personnes auxquelles ils sont destinés, qui font partie d'un système ou nécessaire, et qui ne sont pas censés être utilisés individuellement en dehors du cadre du système ou nécessaire, ne doivent pas comporter un support IUD propre; \n\tb. les dispositifs qui sont exemptés de l'obligation de comporter un support IUD sur le niveau de conditionnement pertinent ne doivent pas comporter un support IUD lorsqu'ils font partie d'un système ou nécessaire."
    9_prefix: "C.6.3.3"
    9_label: "Application du support IUD sur les systèmes ou nécessaires"
    9_desc: "\ta. Le support IUD d'un système ou nécessaire est en règle générale apposé à l'extérieur du conditionnement. \n\tb. Le support IUD peut être lu ou, s'il s'agit d'un AIDC, scanné, qu'il soit apposé à l'extérieur du conditionnement du système ou nécessaire ou à l'intérieur d'un conditionnement transparent."
    10_prefix: "C.6.4.1"
    10_label: "Un IUD est attribué au dispositif configurable pris dans son intégralité, dénommé «IUD de dispositif configurable»."
    11_prefix: "C.6.4.2"
    11_label: "Un IUD-ID de dispositif configurable est attribué à des groupes de configurations et non à chaque configuration à l'intérieur d'un groupe. Un groupe de configurations est l'ensemble des configurations possibles pour un dispositif donné selon les indications figurant dans la documentation technique."
    12_prefix: "C.6.4.3"
    12_label: "Un IUD-IP de dispositif configurable est attribué à chaque dispositif configurable."
    13_prefix: "C.6.4.4"
    13_label: "Le support de l'IUD de dispositif configurable est apposé sur l'assemblage qui risque le moins d'être échangé au cours de la durée de vie du système et est identifié comme l'IUD de dispositif configurable."
    14_prefix: "C.6.4.5"
    14_label: "Chaque composant qui est considéré comme un dispositif et est disponible en tant que tel dans le commerce se voit attribuer un IUD distinct."
    15_prefix: "C.6.5.2"
    15_desc: "ℹ️ \n L'IUD est attribué au niveau du système du logiciel. Seuls les logiciels qui sont disponibles en soi dans le commerce et ceux qui constituent un dispositif à part entière sont soumis à cette exigence. \n\n L'identification du logiciel est considérée comme un mécanisme de contrôle de la fabrication et est indiquée dans l'IUD-IP. \n\n Un nouvel IUD-ID est exigé en cas de modification portant sur: \n\ta. les performances initiales; \n\tb. la sécurité ou l'utilisation prévue du logiciel; \n\tc. l'interprétation des données. \n\n Ces modifications peuvent consister en algorithmes nouveaux ou modifiés ou peuvent concerner les structures de la base de données, la plateforme d'exploitation, l'architecture, de nouvelles interfaces utilisateurs ou de nouveaux canaux d'interopérabilité."
    16_prefix: "C.6.5.3"
    16_desc: "ℹ️ \n L'IUD est attribué au niveau du système du logiciel. Seuls les logiciels qui sont disponibles en soi dans le commerce et ceux qui constituent un dispositif à part entière sont soumis à cette exigence. \n\n L'identification du logiciel est considérée comme un mécanisme de contrôle de la fabrication et est indiquée dans l'IUD-IP. \n\n Les révisions mineures d'un logiciel exigent un nouvel IUD-IP et non un nouvel IUD-ID. \n\n Les révisions mineures d'un logiciel sont généralement associées à la suppression de bogues, à une amélioration de la facilité d'utilisation à des fins qui ne sont pas des fins de sûreté, à des correctifs de sécurité ou à l'efficacité. \n\n Elles sont identifiées par une forme d'identifiant «fabricant» spécifique."
    17_prefix: "C.6.5.4"
    17_label: "Critères d'application de l'IUD pour les logiciels"
    17_desc: "\ta. lorsque le logiciel est livré sur un support physique, comme un CD ou un DVD, chaque niveau de conditionnement comporte l'IUD complet (marquage en clair et AIDC). L'IUD qui est apposé sur le support physique contenant le logiciel et sur son conditionnement doit être identique à celui attribué au niveau du système logiciel; \n\tb. l'IUD est disponible sur un écran aisément accessible pour l'utilisateur sous la forme d'un texte en clair aisément lisible, dans un fichier «en savoir plus» ou sur la page d'accueil par exemple; \n\tc. les logiciels sans interface utilisateurs tels que les intergiciels de conversion d'images, sont en mesure de transmettre l'IUD au moyen d'une interface de programme d'application (API); \n\td. seule la partie «marquage en clair» de l'IUD est requise dans les affichages électroniques du logiciel. Le marquage de l'IUD à l'aide de l'AIDC n'est pas requis dans les affichages électroniques tels que les menus «en savoir plus», les écrans d'accueil, etc.; \n\te. le marquage en clair de l'IUD pour le logiciel comprend les identificateurs d'applications (AI) pour la norme utilisée par les entités d'attribution, de manière à aider l'utilisateur à identifier l'IUD et à déterminer quelle est la norme utilisée pour le créer."
17:
  prefix: "Annexe VII"
  title: "Exigences auxquelles doivent satisfaire les organismes notifiés"
  1:
    prefix: "1.1"
    title: "Statut juridique et structure organisationnelle"
    1_prefix: "1.1.1"
    1_label: "Les organismes notifiés sont établis conformément au droit national des États membres ou à la législation d'un pays tiers avec lequel l'Union a conclu un accord à cet égard. Leur personnalité et leur statut juridiques sont entièrement documentés. Cette documentation inclut des informations sur la propriété et les personnes physiques ou morales exerçant un contrôle sur les organismes notifiés."
    2_prefix: "1.1.2"
    2_label: "Si l'organisme notifié est une entité juridique faisant partie d'une organisation plus vaste, les activités de cette organisation, sa structure organisationnelle et sa gouvernance ainsi que sa relation avec l'organisme notifié sont clairement documentées. Dans ce cas, les exigences de la section 1.2 s'appliquent à la fois à l'organisme notifié et à l'organisation dont il fait partie."
    3_prefix: "1.1.3"
    3_label: "Si un organisme notifié détient, entièrement ou partiellement, des entités juridiques établies dans un État membre ou dans un pays tiers ou est détenu par une autre entité juridique, les activités et les responsabilités de ces entités ainsi que leurs relations sur le plan juridique et opérationnel avec l'organisme notifié sont clairement définies et documentées. Le personnel de ces entités qui mène des activités d'évaluation de la conformité au titre du présent règlement est soumis aux exigences applicables du présent règlement."
    4_prefix: "1.1.4"
    4_label: "La structure organisationnelle, la répartition des responsabilités, les liens hiérarchiques et le fonctionnement de l'organisme notifié sont tels qu'ils garantissent la fiabilité des activités d'évaluation de conformité menées par l'organisme notifié et de leurs résultats."
    5_prefix: "1.1.5"
    5_label: "L'organisme notifié documente clairement sa structure organisationnelle et les fonctions, les responsabilités et l'autorité des cadres supérieurs et des autres membres du personnel qui peuvent avoir une influence sur les activités d'évaluation de la conformité menées par l'organisme notifié et sur leurs résultats."
    6_prefix: "1.1.6"
    6_label: "L'organisme notifié indique quels sont les cadres supérieurs qui détiennent l'autorité et la responsabilité générales pour chacun des éléments suivants:"
    6_desc: "\t— la mise à disposition de ressources adéquates pour les activités d'évaluation de la conformité, \n\t— la définition de procédures et de politiques relatives au fonctionnement de l'organisme notifié, \n\t— le contrôle de l'application des procédures, des politiques et des systèmes de gestion de la qualité mis en place par l'organisme notifié, \n\t— le contrôle financier de l'organisme notifié, \n\t— les activités et décisions de l'organisme notifié, y compris les accords contractuels, \n\t— la délégation de l'autorité aux membres du personnel et/ou aux comités, le cas échéant, pour mener des activités précises, \n\t— les liens avec l'autorité responsable des organismes notifiés et les obligations concernant les communications avec d'autres autorités compétentes, la Commission et d'autres organismes notifiés."
  2:
    prefix: "1.2"
    title: "Indépendance et impartialité"
    1_prefix: "1.2.1"
    1_label: "Les organismes notifiés sont des organismes tiers qui sont indépendants du fabricant du dispositif pour lequel ils mènent les activités d'évaluation de la conformité. Les organismes notifiés sont également indépendants de tout autre opérateur économique ayant un intérêt dans le dispositif ainsi que de tout concurrent du fabricant, ce qui n'exclut pas la possibilité pour un organisme notifié de mener des activités d'évaluation de la conformité pour des fabricants concurrents."
    2_prefix: "1.2.2"
    2_desc: "Les organismes notifiés sont organisés et fonctionnent de façon à garantir l'indépendance, l'objectivité et l'impartialité de leurs activités. Les organismes notifiés documentent et appliquent une structure et des procédures permettant de garantir l'impartialité et d'encourager et appliquer les principes d'impartialité dans l'ensemble de leur organisation, du personnel et des activités d'évaluation. Ces procédures permettent de détecter toute situation qui pourrait donner lieu à un conflit d'intérêts, y compris la participation à des services de conseil dans le domaine des dispositifs avant l'entrée en fonctions auprès de l'organisme notifié, ainsi que de mener une enquête à ce sujet et de trouver une solution. L'enquête, son résultat et la solution sont documentés."
    3_prefix: "1.2.3"
    3_label: "L'organisme notifié, ses cadres supérieurs et le personnel chargé d'exécuter les tâches d'évaluation de la conformité:"
    3_desc: "\ta. ne peuvent être le concepteur, le fabricant, le fournisseur, l'installateur, l'acheteur, le propriétaire ou le responsable de la maintenance des dispositifs qu'ils évaluent, ni le mandataire d'une de ces parties. Ces restrictions n'excluent pas l'achat et l'utilisation de dispositifs évalués nécessaires aux activités de l'organisme notifié et à la réalisation de l'évaluation de la conformité, ni l'utilisation de tels dispositifs à des fins personnelles; \n\tb. ne peuvent intervenir dans la conception, la fabrication ou la construction, la commercialisation, l'installation et l'utilisation ou la maintenance des dispositifs pour lesquels ils sont désignés ni représenter les parties menant ces activités; \n\tc. ne peuvent participer à aucune activité susceptible d'entrer en conflit avec l'indépendance de leur jugement ou leur intégrité dans le cadre des activités d'évaluation de la conformité pour lesquelles ils sont désignés; \n\td. ne peuvent offrir ou fournir aucun service susceptible de compromettre l'assurance de leur indépendance, de leur impartialité ou de leur objectivité. Ils ne peuvent, en particulier, offrir ou fournir des services de conseil au fabricant, au mandataire de celui-ci, à un fournisseur ou à un concurrent commercial en rapport avec la conception, la fabrication, la construction, la commercialisation ou la maintenance des dispositifs ou des procédés faisant l'objet de l'évaluation; et \n\te. ne peuvent être liés à aucune organisation qui fournit elle-même des services de conseil visés au point d). Ces restrictions n'excluent pas les activités de formation générale qui ne sont pas spécifiques à un client et qui concernent la réglementation des dispositifs ou les normes connexes."
    4_prefix: "1.2.4"
    4_desc: "La participation à des services de conseil dans le domaine des dispositifs avant l'entrée en fonctions auprès d'un organisme notifié est pleinement documentée au moment de l'entrée en fonctions et les conflits d'intérêts potentiels sont examinés et résolus conformément à la présente annexe. Les membres du personnel qui ont été auparavant employés par un client donné ou lui ont fourni des services de conseils dans le domaine des dispositifs avant de prendre leurs fonctions auprès d'un organisme notifié ne sont pas désignés, pendant une période de trois ans, pour mener des activités d'évaluation de la conformité pour ce client en particulier ou pour des entreprises faisant partie du même groupe que ce client."
    5_prefix: "1.2.5"
    5_label: "L'impartialité des organismes notifiés, de leurs cadres supérieurs et de leur personnel effectuant l'évaluation est garantie. Le niveau de rémunération des cadres supérieurs d'un organisme notifié et du personnel effectuant l'évaluation ainsi que des sous-traitants participant aux activités d'évaluation ne dépend pas des résultats des évaluations. Les organismes notifiés mettent à la disposition du public les déclarations d'intérêts de leurs cadres supérieurs."
    6_prefix: "1.2.6"
    6_label: "Si un organisme notifié appartient à une entité ou une institution publique, l'indépendance et l'absence de conflit d'intérêts entre l'autorité responsable des organismes notifiés et/ou l'autorité compétente, d'une part, et l'organisme notifié, d'autre part, sont garanties et documentées."
    7_prefix: "1.2.7"
    7_label: "Les organismes notifiés veillent à ce que les activités de leurs filiales, de leurs sous-traitants ou de tout organisme associé, y compris les activités de leurs propriétaires, ne portent pas atteinte à leur indépendance, à leur impartialité ou à l'objectivité de leurs activités d'évaluation de la conformité et le prouvent par des documents."
    8_prefix: "1.2.8"
    8_label: "Les organismes notifiés agissent conformément à un ensemble de conditions cohérentes, justes et raisonnables, en tenant compte des intérêts des petites et moyennes entreprises au sens de la recommandation 2003/361/CE pour ce qui est des redevances."
    9_prefix: "1.2.9"
    9_label: "Les exigences énoncées dans la présente section n'excluent en aucun cas les échanges d'informations techniques et d'orientations en matière de réglementation entre un organisme notifié et un fabricant introduisant une demande d'évaluation de la conformité."
  3:
    prefix: "1.3"
    title: "Confidentialité"
    1_prefix: "1.3.1"
    1_label: "Les organismes notifiés disposent de procédures documentées pour veiller à ce que leur personnel, leurs comités, leurs filiales, leurs sous-traitants et tout organisme associé ou le personnel d'organismes externes respectent la confidentialité des informations auxquelles ils accèdent durant l'exercice de leurs activités d'évaluation de la conformité, sauf lorsque leur divulgation est requise par la loi."
    2_prefix: "1.3.2"
    2_label: "Le personnel d'un organisme notifié est lié par le secret professionnel dans l'exercice de ses fonctions en vertu du présent règlement ou de toute disposition de la législation nationale lui donnant effet, sauf à l'égard des autorités responsables des organismes notifiés, des autorités compétentes pour les dispositifs médicaux dans les États membres ou de la Commission. Les droits de propriété sont protégés. Les organismes notifiés disposent de procédures documentées conformément aux exigences de la présente section."
  4:
    prefix: "1.4"
    title: "Responsabilité"
    1_prefix: "1.4.1"
    1_label: "Les organismes notifiés souscrivent pour leurs activités d'évaluation de la conformité une assurance de responsabilité civile appropriée à moins que cette responsabilité ne soit couverte par l'État membre concerné sur la base de la législation nationale ou que l'évaluation de la conformité ne soit réalisée directement par cet État membre."
    2_prefix: "1.4.2"
    2_label: "La couverture et la valeur financière globale de l'assurance de responsabilité civile correspondent à l'ampleur et au champ géographique des activités de l'organisme notifié et sont proportionnées au profil de risque des dispositifs certifiés par l'organisme notifié. L'assurance couvre les cas dans lesquels l'organisme notifié pourrait être obligé d'annuler ou de suspendre des certificats ou de les assortir de restrictions."
  5_prefix: "1.5"
  5_label: "Exigences en matière financière"
  5_desc: "Les organismes notifiés disposent des ressources financières requises pour mener leurs activités d'évaluation de la conformité dans le cadre du champ couvert par la désignation et les opérations commerciales connexes. Ils documentent et fournissent la preuve de leur capacité financière et de leur viabilité économique à long terme, en tenant compte, le cas échéant, des circonstances spécifiques liées à une phase initiale de démarrage."
  6:
    prefix: "1.6"
    title: "Participation aux activités de coordination"
    1_prefix: "1.6.1"
    1_label: "Les organismes notifiés participent aux activités de normalisation pertinentes et aux activités de leur groupe de coordination visé à l'article 49, ou veillent à ce que leur personnel effectuant l'évaluation en soit informé, et veillent également à ce que leur personnel effectuant l'évaluation et leurs décideurs aient connaissance de l'ensemble de la législation applicable, des documents d'orientation et des documents sur les bonnes pratiques adoptés dans le cadre du présent règlement."
    2_prefix: "1.6.2"
    2_label: "Les organismes notifiés tiennent compte des documents d'orientation et des documents sur les bonnes pratiques."
  7:
    prefix: "2"
    title: "Exigences en matière de gestion de la qualité"
    1_prefix: "2.1"
    1_label: "Les organismes notifiés établissent, documentent, mettent en œuvre, mettent à jour et exploitent un système de gestion de la qualité approprié à la nature, au domaine et à l'ampleur de leurs activités d'évaluation de la conformité et permettant de favoriser et de démontrer le respect constant des exigences du présent règlement."
    2_prefix: "2.2"
    2_label: "Le système de gestion de la qualité de l'organisme notifié porte, au minimum, sur les aspects suivants:"
    2_desc: "\t— la structure du système de gestion et les documents s'y rapportant, y compris les politiques et les objectifs concernant ses activités, \n\t— les politiques concernant l'affectation des activités et des responsabilités au personnel, \n\t— l'évaluation et les processus décisionnels en conformité avec les tâches, les responsabilités et le rôle du personnel et des cadres supérieurs de l'organisme notifié, \n\t— la planification, la réalisation, l'évaluation et, au besoin, l'adaptation des procédures d'évaluation de la conformité, \n\t— le contrôle de la documentation, \n\t— le contrôle des enregistrements, \n\t— l'examen de la gestion, \n\t— les audits internes, \n\t— les mesures correctives et préventives, \n\t— les réclamations et les recours, et \n\t— la formation continue. \n\n Lorsque les documents existent dans plusieurs langues, l'organisme notifié s'assure et vérifie que leur contenu est identique."
    3_prefix: "2.3"
    3_label: "Les cadres supérieurs des organismes notifiés font en sorte que le système de gestion de la qualité est compris, appliqué et mis à jour dans l'ensemble de l'organisation de l'organisme notifié, y compris les filiales et sous-traitants participant aux activités d'évaluation de la conformité conformément au présent règlement."
    4_prefix: "2.4"
    4_desc: "Les organismes notifiés exigent que l'ensemble du personnel s'engage formellement, par une signature ou un procédé équivalent, à respecter les procédures définies par chacun des organismes notifiés. Cet engagement porte sur des aspects ayant trait à la confidentialité et à l'indépendance par rapport à des intérêts commerciaux et autres, ainsi qu'à tout lien antérieur ou actuel avec des clients. Les membres du personnel sont invités à faire une déclaration écrite attestant de leur engagement vis-à-vis des principes de confidentialité, d'indépendance et d'impartialité."
  8:
    prefix: "3.1"
    title: "Exigences en matières de ressources - Généralités"
    1_prefix: "3.1.1"
    1_desc: "Les organismes notifiés sont en mesure d'accomplir toutes les tâches qui leur incombent au titre du présent règlement avec la plus haute intégrité professionnelle et la compétence requise dans le domaine spécifique, qu'ils exécutent eux-mêmes ces tâches ou que celles-ci soient exécutées pour leur compte et sous leur responsabilité. \n\n En particulier, les organismes notifiés disposent du personnel suffisant et possèdent l'ensemble des équipements, installations et compétences nécessaires pour accomplir de façon adéquate les tâches techniques, scientifiques et administratives liées aux activités d'évaluation de la conformité pour lesquelles ils ont été désignés, ou ont accès à de tels équipements, installations et compétences. \n\n Cette exigence suppose que, en toutes circonstances et pour chaque procédure d'évaluation de la conformité et chaque type de dispositifs pour lequel ils ont été désignés, les organismes notifiés disposent en permanence d'un personnel administratif, technique et scientifique en nombre suffisant et doté d'une expérience et de connaissances liées aux dispositifs concernés et aux technologies correspondantes. Ce personnel est en nombre suffisant pour que l'organisme notifié concerné puisse exécuter les tâches d'évaluation de la conformité, y compris l'évaluation, sur le plan médical, du caractère fonctionnel, des évaluations cliniques, ainsi que des performances et de la sécurité des dispositifs pour lesquels il a été désigné par rapport aux exigences du présent règlement, notamment celles de l'annexe I. \n\n Les compétences cumulées d'un organisme notifié sont telles qu'elles lui permettent d'évaluer les types de dispositifs pour lesquels il a été désigné. L'organisme notifié dispose de compétences internes suffisantes pour procéder à une évaluation critique des évaluations réalisées par des experts externes. Les tâches qu'un organisme notifié n'est pas autorisé à sous-traiter figurent à la section 4.1. \n\n Le personnel participant à la gestion de l'exercice des activités d'un organisme notifié dans le domaine de l'évaluation de la conformité dispose de connaissances appropriées pour mettre en place et exploiter un système permettant de sélectionner le personnel effectuant l'évaluation et la vérification, de vérifier ses compétences, de lui délivrer les autorisations, de répartir ses tâches, d'organiser sa formation initiale et permanente, d'attribuer ses fonctions à ce personnel et de procéder à des contrôles pour s'assurer que le personnel qui prend en charge et effectue les activités d'évaluation et de vérification a les compétences requises pour exécuter les tâches qu'on attend de lui. \n\n Les organismes notifiés désignent, parmi leurs cadres supérieurs, au moins une personne physique qui a la responsabilité générale de l'ensemble des activités d'évaluation de la conformité des dispositifs."
    2_prefix: "3.1.2"
    2_label: "Les organismes notifiés veillent à ce que le personnel participant aux activités d'évaluation de la conformité maintienne son niveau de qualification et d'expertise, en mettant en œuvre un système d'échange d'expérience et un programme d'éducation et de formation permanentes."
    3_prefix: "3.1.3"
    3_label: "Les organismes notifiés documentent clairement l'étendue et les limites des fonctions et des responsabilités ainsi que le niveau des autorisations octroyées au personnel, y compris les sous-traitants et les experts externes, participant aux activités d'évaluation de la conformité et informe ce personnel en conséquence."
  9:
    prefix: "3.2"
    title: "Exigences en matières de ressources - Critères de qualification du personnel"
    1_prefix: "3.2.1"
    1_desc: "Les organismes notifiés établissent et documentent les critères de qualification et les procédures de sélection et d'autorisation des personnes participant aux activités d'évaluation de la conformité, notamment en termes de connaissances, d'expérience et d'autres compétences requises, ainsi que la formation initiale et permanente requise. Les critères de qualification se rapportent aux différentes fonctions du processus d'évaluation de la conformité, telles que l'audit, l'évaluation ou le test des produits, l'examen de la documentation technique et la prise de décision, ainsi qu'aux dispositifs, aux technologies et aux secteurs, tels que la biocompatibilité, la stérilisation, les tissus et cellules d'origine humaine et animale et l'évaluation clinique, relevant du champ couvert par la désignation."
    2_prefix: "3.2.2"
    2_desc: "Les critères de qualification visés à la section 3.2.1 font référence au champ couvert par la désignation d'un organisme notifié conformément à la description du champ utilisée par l'État membre pour la notification visée à l'article 42, paragraphe 3, et présentent un niveau de détail suffisant pour les qualifications requises dans les subdivisions de la description du champ. \n\n Des critères de qualification spécifiques sont définis au moins pour l'évaluation portant sur: \n\t— l'évaluation préclinique, \n\t— l'évaluation clinique, \n\t— les tissus et cellules d'origine humaine et animale, \n\t— la sécurité fonctionnelle, \n\t— le logiciel, \n\t— le conditionnement, \n\t— les dispositifs qui incorporent comme partie intégrante un médicament, \n\t— les dispositifs qui sont composés de substances ou de combinaisons de substances qui sont absorbées par le corps humain ou dispersées localement dans celui-ci, et \n\t— les différents types de procédés de stérilisation."
    3_prefix: "3.2.3"
    3_label: "Les membres du personnel chargés d'établir des critères de qualification et d'autoriser d'autres membres du personnel à exécuter des activités d'évaluation de la conformité spécifiques sont employés par l'organisme notifié lui-même et ne sont ni des experts externes ni des sous-traitants. Ce personnel possède des connaissances et une expérience attestées dans l'ensemble des domaines suivants:"
    3_desc: "\t— la législation de l'Union relative aux dispositifs et les documents d'orientation pertinents, \n\t— les procédures d'évaluation de la conformité prévues par le présent règlement, \n\t— une connaissance étendue des technologies en matière de dispositifs ainsi que de la conception et de la fabrication des dispositifs, \n\t— le système de gestion de la qualité de l'organisme notifié, les procédures connexes et les critères de qualification requis, \n\t— la formation pertinente pour le personnel participant aux activités d'évaluation de la conformité des dispositifs, \n\t— les évaluations de la conformité en vertu du présent règlement ou de la législation précédemment applicable au sein d'un organisme notifié."
    4_prefix: "3.2.4"
    4_label: "Les organismes notifiés disposent en permanence d'un personnel possédant une expertise clinique pertinente et employé si possible par les organismes notifiés eux-mêmes. Ce personnel participe à l'ensemble du processus décisionnel et du processus d'évaluation des organismes notifiés pour:"
    4_desc: "\t— déterminer quand la contribution d'un spécialiste est nécessaire pour évaluer l'évaluation clinique effectuée par le fabricant et identifier les experts possédant les qualifications adéquates, \n\t— former de manière appropriée les experts cliniques externes aux exigences pertinentes du présent règlement, des spécifications communes, des documents d'orientation et des normes harmonisées et garantir que les experts cliniques externes ont pleinement connaissance du contexte et des incidences de leur évaluation et des conseils qu'ils donnent, \n\t— pouvoir examiner et contester sur des bases scientifiques les données cliniques contenues dans l'évaluation clinique et dans toute investigation clinique y afférente, et guider correctement les experts cliniques externes en ce qui concerne l'évaluation de l'évaluation clinique présentée par le fabricant, \n\t— pouvoir évaluer et, au besoin, contester sur des bases scientifiques l'évaluation clinique présentée et les résultats de l'appréciation, par les experts cliniques externes, de l'évaluation clinique réalisée par le fabricant, \n\t— pouvoir s'assurer de la comparabilité et de la cohérence des évaluations des évaluations cliniques réalisées par les experts cliniques, \n\t— pouvoir évaluer l'évaluation clinique réalisée par le fabricant et émettre un jugement clinique sur l'avis rendu par tout expert externe et adresser une recommandation au décideur de l'organisme notifié, et \n\t— être capable de rédiger des procès-verbaux et des rapports démontrant que les activités d'évaluation de la conformité ont été réalisées de manière adéquate."
    5_prefix: "3.2.5"
    5_label: "Le personnel chargé d'effectuer les examens relatifs à un produit (examinateurs de produits), par exemple les examens de la documentation technique ou l'examen de type incluant des aspects tels que l'évaluation clinique, la sécurité biologique, la stérilisation et la validation du logiciel, possède l'ensemble des qualifications attestées suivantes:"
    5_desc: "\t— un titre universitaire, un titre d'une école professionnelle ou un titre équivalent dans un domaine approprié, par exemple en médecine, en pharmacie, en ingénierie ou dans une autre discipline scientifique pertinente, \n\t— quatre ans d'expérience professionnelle dans le domaine des produits de santé ou dans des activités connexes, notamment dans la fabrication, l'audit ou la recherche, dont deux ans dans la conception, la fabrication, les essais ou l'utilisation du dispositif ou de la technologie à évaluer ou dans des domaines en rapport avec les aspects scientifiques à évaluer, \n\t— une connaissance de la législation relative aux dispositifs, y compris les exigences générales en matière de sécurité et de performances établies à l'annexe I, \n\t— une connaissance et une expérience appropriées des normes harmonisées, des spécifications communes et des documents d'orientation pertinents, \n\t— une connaissance et une expérience appropriées de la gestion des risques ainsi que des normes et des documents d'orientation connexes relatifs aux dispositifs, \n\t— une connaissance et une expérience appropriées de l'évaluation clinique, \n\t— une connaissance appropriée des dispositifs évalués, \n\t— une connaissance et une expérience appropriées des procédures d'évaluation de la conformité définies aux annexes IX à XI, notamment des aspects de ces procédures dont ce personnel est chargé, et une autorisation appropriée pour exécuter ces évaluations, \n\t— l'aptitude à rédiger des procès-verbaux et des rapports démontrant que les activités d'évaluation de la conformité ont été réalisées de manière adéquate."
    6_prefix: "3.2.6"
    6_label: "Le personnel chargé d'effectuer les audits du système de gestion de la qualité mis en place par le fabricant (auditeurs sur place) possède l'ensemble des qualifications attestées suivantes:"
    6_desc: "\t— un titre universitaire, un titre d'une école professionnelle ou un titre équivalent dans un domaine approprié, par exemple en médecine, en pharmacie, en ingénierie ou dans une autre discipline scientifique pertinente, \n\t— quatre ans d'expérience professionnelle dans le domaine des produits de santé ou dans des activités connexes, notamment dans la fabrication, l'audit ou la recherche, dont deux ans dans le domaine de la gestion de la qualité, \n\t— une connaissance appropriée de la législation relative aux dispositifs ainsi que des normes harmonisées, des spécifications communes et des documents d'orientation connexes, \n\t— une connaissance et une expérience appropriées de la gestion des risques ainsi que des normes et des documents d'orientation connexes relatifs aux dispositifs, \n\t— une connaissance appropriée des systèmes de gestion de la qualité ainsi que des normes et des documents d'orientation connexes, \n\t— une connaissance et une expérience appropriées des procédures d'évaluation de la conformité définies aux annexes IX à XI, notamment des aspects de ces procédures dont ce personnel est chargé, et une autorisation appropriée pour exécuter ces évaluations, \n\t— une formation aux techniques d'audit lui permettant de contester les systèmes de gestion de la qualité, \n\t— l'aptitude à rédiger des procès-verbaux et des rapports démontrant que les activités d'évaluation de la conformité ont été réalisées de manière adéquate."
    7_prefix: "3.2.7"
    7_label: "Les membres du personnel assumant la responsabilité générale des examens finaux et de la prise de décision en matière de certification sont employés par l'organisme notifié lui-même et ne sont ni des experts externes ni des sous-traitants. Ce personnel possède, à titre collectif, des connaissances attestées et une expérience étendue dans l'ensemble des domaines suivants:"
    7_desc: "\t— la législation de l'Union relative aux dispositifs et les documents d'orientation pertinents, \n\t— les évaluations de la conformité des dispositifs relevant du présent règlement, \n\t— les types de qualifications, d'expérience et d'expertise pertinents aux fins de l'évaluation de la conformité des dispositifs, \n\t— une connaissance étendue des technologies en matière de dispositifs, y compris une expérience suffisante de l'évaluation de la conformité des dispositifs examinés en vue de la certification, de l'industrie des dispositifs ainsi que la conception et la fabrication des dispositifs, \n\t— le système de gestion de la qualité de l'organisme notifié, les procédures connexes et les qualifications du personnel requises, \n\t— l'aptitude à rédiger des procès-verbaux et des rapports démontrant que les activités d'évaluation de la conformité ont été réalisées de manière adéquate."
  10:
    prefix: "3.3"
    title: "Exigences en matières de ressources - Documentation relative à la qualification, à la formation et à l'autorisation du personnel"
    1_prefix: "3.3.1"
    1_desc: "Les organismes notifiés ont mis en place une procédure afin de documenter de façon complète la qualification de chaque membre du personnel participant aux activités d'évaluation de la conformité et le respect des critères de qualification établis à la section 3.2. Lorsque, dans des cas exceptionnels, le respect des critères de qualification établis à la section 3.2 ne peut être entièrement prouvé, l'organisme notifié justifie auprès de l'autorité responsable des organismes notifiés l'autorisation des membres du personnel concernés à exécuter les activités spécifiques d'évaluation de la conformité."
    2_prefix: "3.3.2"
    2_label: "Pour l'ensemble du personnel visé aux sections 3.2.3 à 3.2.7, les organismes notifiés établissent et tiennent à jour:"
    2_desc: "\t— un tableau détaillant les autorisations et responsabilités du personnel en ce qui concerne les activités d'évaluation de la conformité, et \n\t— des documents prouvant la connaissance et l'expérience requises pour l'activité d'évaluation de la conformité pour laquelle ce personnel possède une autorisation. Ces documents contiennent des principes permettant de définir les responsabilités de chaque membre du personnel d'évaluation et des relevés des activités d'évaluation de la conformité réalisées par chacun d'eux."
  11:
    prefix: "3.4"
    title: "Exigences en matières de ressources - Sous-traitants et experts externes"
    1_prefix: "3.4.1"
    1_desc: "Sans préjudice de la section 3.2, les organismes notifiés peuvent sous-traiter certaines parties clairement définies d'une activité d'évaluation de la conformité. \n\n La sous-traitance de l'ensemble de l'audit des systèmes de gestion de la qualité ou des examens relatifs au produit n'est pas autorisée; une partie de ces activités peut toutefois être effectuée par des sous-traitants et des auditeurs et experts externes au nom de l'organisme notifié. L'organisme notifié concerné assume l'entière responsabilité d'être en mesure d'apporter la preuve que les sous-traitants et experts ont les compétences pour accomplir leurs tâches spécifiques et de prendre toute décision sur la base de l'évaluation réalisée par un sous-traitant, ainsi que des activités réalisées en son nom par des sous-traitants et des experts. \n\n Les organismes notifiés ne peuvent pas sous-traiter les activités suivantes: \n\t— l'examen des qualifications et le contrôle des performances des experts externes, \n\t— les activités d'audit et de certification lorsque les sous-traitants concernés sont des organisations d'audit ou de certification, \n\t— l'attribution de tâches aux experts externes pour des activités spécifiques d'évaluation de la conformité, et \n\t— les fonctions liées à l'examen final et à la prise de décision."
    2_prefix: "3.4.2"
    2_label: "Lorsqu'un organisme notifié sous-traite certaines activités d'évaluation de la conformité à une organisation ou à une personne physique, il applique une politique de sous-traitance décrivant les conditions dans lesquelles celle-ci peut avoir lieu et veille à ce que:"
    2_desc: "\t— le sous-traitant se conforme aux exigences de la présente annexe, \n\t— les sous-traitants et experts externes ne sous-traitent pas les tâches à des organisations ou des personnes, et \n\t— la personne physique ou morale qui a sollicité l'évaluation de la conformité ait été informée des exigences visées aux premier et deuxième tirets. \n\n Toute sous-traitance ou consultation de personnes externes est documentée de manière appropriée, ne fait intervenir aucun intermédiaire et fait l'objet d'un accord écrit concernant, entre autres, la confidentialité et les conflits d'intérêts. L'organisme notifié concerné assume l'entière responsabilité des tâches réalisées en son nom par des sous-traitants."
    3_prefix: "3.4.3"
    3_desc: "Lorsqu'il fait appel à des sous-traitants ou à des experts externes dans le cadre d'une évaluation de la conformité, en particulier en ce qui concerne les technologies ou les dispositifs nouveaux, invasifs et implantables, l'organisme notifié concerné possède des compétences internes dans chaque type de produit pour lequel il est désigné, qui lui permettent de diriger l'ensemble de l'évaluation de la conformité, de vérifier l'adéquation et la validité des avis d'experts et de prendre des décisions quant à la certification."
  12:
    prefix: "3.5"
    title: "Exigences en matières de ressources - Surveillance des compétences, formation et échange d'expérience"
    1_prefix: "3.5.1"
    1_label: "Les organismes notifiés établissent des procédures pour l'évaluation initiale et la surveillance permanente des compétences, des activités d'évaluation de la conformité et des performances de l'ensemble du personnel interne et externe et des sous-traitants participant à des activités d'évaluation de la conformité."
    2_prefix: "3.5.2"
    2_label: "Les organismes notifiés font périodiquement le bilan des compétences de leur personnel, recensent les besoins en formation et établissent un plan de formation afin de maintenir le niveau de qualification et de connaissance requis de chacun des membres du personnel. Dans le cadre de ce bilan, ils vérifient au minimum que le personnel:"
    2_desc: "\t— a connaissance de la législation de l'Union et de la législation nationale applicables aux dispositifs, des normes harmonisées, spécifications communes, des documents d'orientation pertinents et des résultats des activités de coordination visées à la section 1.6, et \n\t— participe à l'échange interne d'expérience et au programme d'éducation et de formation permanentes visés à la section 3.1.2."
  13_prefix: "4.1"
  13_label: "Exigences relatives au processus - Généralités"
  13_desc: "Les organismes notifiés ont mis en place des processus documentés et des procédures suffisamment détaillées pour la réalisation de chacune des activités d'évaluation de la conformité pour lesquelles ils sont désignés, qui vont des activités préalables à la demande jusqu'à la prise de décision et à la surveillance et compte tenu, au besoin, des spécificités respectives des dispositifs. \n\n Les exigences énoncées aux sections 4.3, 4.4, 4.7 et 4.8 sont respectées dans le cadre des activités internes des organismes notifiés et ne font pas l'objet de sous-traitance."
  14_prefix: "4.2"
  14_label: "Exigences relatives au processus - Devis et activités préalables à la demande"
  14_desc: "Les organismes notifiés: \n\ta. publient une description de la procédure par laquelle les fabricants peuvent solliciter auprès d'eux la certification. Cette description précise les langues acceptables pour la documentation à présenter et la correspondance; \n\tb. disposent de procédures et de modalités documentées concernant les redevances prévues pour des activités spécifiques d'évaluation de la conformité et toute autre condition financière attachée à leurs activités d'évaluation de la conformité des dispositifs; \n\tc. disposent de procédures documentées concernant la publicité relative à leurs services d'évaluation de la conformité. Ces procédures sont destinées à garantir que la publicité ou les activités promotionnelles n'impliquent aucunement ni ne sont susceptibles de donner à penser que l'évaluation de la conformité à laquelle ils procéderont permettra aux fabricants d'accéder plus tôt au marché ou sera plus rapide, plus facile ou moins rigoureuse que celle d'autres organismes notifiés; \n\td. disposent de procédures documentées prévoyant l'examen de certaines informations préalables à la demande, notamment une vérification préliminaire permettant d'établir si le produit relève du présent règlement et quelle est sa classification avant de remettre au fabricant un devis pour une évaluation spécifique de la conformité; et \n\te. veille à ce que l'ensemble des contrats concernant des activités d'évaluation de la conformité relevant du présent règlement soient conclus directement avec le fabricant et non avec toute autre organisation."
  15_prefix: "4.3"
  15_label: "Exigences relatives au processus - Examen de la demande et contrat"
  15_desc: "Les organismes notifiés exigent une demande formelle signée par un fabricant ou un mandataire, contenant toutes les informations et déclarations du fabricant requises par les procédures d'évaluation de la conformité visées aux annexes IX à XI. \n\n Le contrat entre un organisme notifié et un fabricant prend la forme d'un accord écrit signé par les deux parties. Il est conservé par l'organisme notifié. Ce contrat contient des conditions et des obligations précises permettant à l'organisme notifié d'agir comme le prescrit le présent règlement, y compris l'obligation pour le fabricant d'informer l'organisme notifié des rapports issus de la vigilance, le droit pour l'organisme notifié de suspendre ou d'annuler des certificats qu'il a délivrés, ou de les assortir de restrictions, et le devoir pour l'organisme notifié de remplir les obligations qui lui incombent en matière d'information. \n\n L'organisme notifié dispose de procédures documentées pour examiner les demandes, portant sur les aspects suivants: \n\ta. le caractère complet de ces demandes au regard des exigences de la procédure d'évaluation de la conformité pertinente, comme indiqué dans l'annexe correspondante, en application de laquelle l'approbation a été demandée; \n\tb. la vérification permettant d'établir si les produits couverts par ces demandes sont des dispositifs et quelle est leur classification respective; \n\tc. la question de savoir si les procédures d'évaluation de la conformité retenues par le demandeur sont applicables au dispositif en question en vertu du présent règlement; \n\td. la capacité de l'organisme notifié à évaluer la demande sur la base de sa désignation; et \n\te. l'existence de ressources suffisantes et appropriées. \n\n Le résultat de chaque examen d'une demande est documenté. Le rejet ou le retrait d'une demande est notifié dans le système électronique visé à l'article 57 et l'information en la matière est accessible aux autres organismes notifiés."
  16_prefix: "4.4"
  16_label: "Exigences relatives au processus - Répartition des ressources"
  16_desc: "Les organismes notifiés disposent de procédures documentées pour veiller à ce que toutes les activités d'évaluation de la conformité soient réalisées par du personnel dûment qualifié et autorisé et ayant une expérience suffisante de l'évaluation des dispositifs, systèmes et processus et de la documentation connexe faisant l'objet de l'évaluation de la conformité. \n\n Pour chaque demande, l'organisme notifié détermine les ressources nécessaires et désigne une personne physique chargée de veiller à ce que l'évaluation de cette demande soit réalisée dans le respect des procédures applicables et à ce que les ressources appropriées, notamment en termes de personnel, soient mobilisées pour chacune des tâches de l'évaluation. La répartition des tâches qui doivent être exécutées dans le cadre de l'évaluation de la conformité et toute modification ultérieure de celle-ci est documentée."
  17:
    prefix: "4.5"
    title: "Exigences relatives au processus - Activités d'évaluation de la conformité"
    1_prefix: "4.5.1"
    1_label: "Généralités"
    1_desc: "Les organismes notifiés et leur personnel accomplissent les activités d'évaluation de la conformité avec toute l'intégrité professionnelle et la compétence technique et scientifique requises dans les domaines concernés. \n\n Les organismes notifiés disposent de l'expertise, d'installations et de procédures documentées suffisantes pour mener avec efficacité les activités d'évaluation de la conformité pour lesquelles ils sont désignés, compte tenu des exigences pertinentes énoncées aux annexes IX à XI, et notamment toutes les exigences suivantes: \n\t— planifier d'une manière appropriée la réalisation de chaque projet, \n\t— veiller à ce que les équipes d'évaluation soient composées de manière à garantir une expérience suffisante de la technologie concernée et à assurer une objectivité et une indépendance constantes, et prévoir un roulement des membres de l'équipe d'évaluation à des intervalles appropriés, \n\t— indiquer les principes permettant de déterminer les délais d'exécution des activités d'évaluation de la conformité, \n\t— évaluer la documentation technique du fabricant et les solutions retenues pour satisfaire aux exigences énoncées à l'annexe I, \n\t— examiner les procédures et la documentation du fabricant concernant l'évaluation des aspects précliniques, \n\t— examiner les procédures et la documentation du fabricant concernant l'évaluation clinique, \n\t— traiter la question de l'interface entre le processus de gestion des risques mis en place par le fabricant et son appréciation et analyse de l'évaluation préclinique et clinique, et évaluer leur pertinence en vue de démontrer la conformité avec les exigences applicables de l'annexe I, \n\t— mener à bien les procédures spéciales visées aux sections 5.2 à 5.4 de l'annexe IX, \n\t— dans le cas des dispositifs de classe IIa ou IIb, évaluer la documentation technique des dispositifs sélectionnés sur une base représentative, \n\t— planifier et effectuer périodiquement des audits et évaluations de surveillance appropriés, effectuer ou demander certains essais afin de vérifier le bon fonctionnement du système de gestion de la qualité et procéder à des audits sur place inopinés, \n\t— en ce qui concerne l'échantillon de dispositifs, vérifier que le dispositif fabriqué est conforme à la documentation technique; les exigences en question définissent les critères d'échantillonnage et la procédure d'essai pertinents avant le prélèvement d'échantillons, \n\t— évaluer et vérifier que le fabricant se conforme aux dispositions des annexes applicables. \n\nLe cas échéant, l'organisme notifié tient compte des spécifications communes, des documents d'orientation et des documents sur les bonnes pratiques disponibles et des normes harmonisées, même si le fabricant ne prétend pas s'y être conformé."
    2_prefix: "4.5.2"
    2_label: "Audits du système de gestion de la qualité"
    2_desc: "\ta. Dans le cadre de l'évaluation du système de gestion de la qualité, un organisme notifié, avant de procéder à un audit et conformément à ses procédures documentées: \n\t\t— évalue la documentation présentée conformément à l'annexe applicable relative à l'évaluation de la conformité et établit un programme d'audit précisant clairement le nombre et la succession des activités requises pour démontrer que l'audit couvre l'ensemble du système de gestion de la qualité mis en place par un fabricant et pour déterminer si ce système est conforme aux exigences du présent règlement, \n\t\t— recense les liens qui existent entre les différents sites de fabrication et indique la répartition des responsabilités entre ces sites, identifie les fournisseurs et/ou sous-traitants concernés du fabricant, et étudie s'il est nécessaire de procéder à un audit spécifique d'un de ces fournisseurs ou sous-traitants ou des deux, \n\t\t— définit clairement, pour chaque audit répertorié dans le programme d'audit, les objectifs, les critères et le champ de l'audit et établit un plan d'audit traitant et tenant compte de manière appropriée des exigences spécifiques applicables aux dispositifs, technologies et processus concernés, \n\t\t— établit et maintient à jour, pour les dispositifs des classes IIa et IIb, un plan d'échantillonnage pour l'évaluation de la documentation technique visée aux annexes II et III, portant sur les dispositifs concernés par la demande du fabricant. Ce plan garantit que tous les dispositifs couverts par le certificat font l'objet d'un échantillonnage pendant la durée de validité du certificat, et \n\t\t— sélectionne du personnel dûment qualifié et autorisé et le charge de procéder aux différents audits. Les rôles, responsabilités et pouvoirs respectifs des membres de l'équipe sont clairement précisés et documentés. \n\tb. Sur la base du programme d'audit qu'il a établi, l'organisme notifié, conformément à ses procédures documentées: \n\t\t— audite le système de gestion de la qualité du fabricant, afin de vérifier que le système de gestion de la qualité garantit que les dispositifs couverts sont conformes aux dispositions du présent règlement qui leur sont applicables à tous les stades, depuis la conception jusqu'à la surveillance permanente en passant par le contrôle de qualité final, et détermine s'il est satisfait aux exigences du présent règlement, \n\t\t— sur la base de la documentation technique et afin de déterminer si le fabricant se conforme aux exigences visées à l'annexe pertinente en matière d'évaluation de la conformité, examine et audite les processus et sous-systèmes du fabricant, en particulier en ce qui concerne: \n\t\t\t— la conception et le développement, \n\t\t\t— les contrôles de la production et des processus, \n\t\t\t— la documentation relative au produit, \n\t\t\t— les contrôles des achats, y compris la vérification des dispositifs achetés, \n\t\t\t— les mesures préventives et correctives, y compris pour la surveillance après commercialisation, et \n\t\t\t— le SCAC, \n\t\t\tet examine et audite les exigences et dispositions adoptées par le fabricant, y compris celles visant à satisfaire aux exigences générales en matière de sécurité et de performances énoncées à l'annexe I. \n\t\t\tLa documentation fait l'objet d'un échantillonnage de manière à tenir compte des risques associés à l'utilisation prévue du dispositif, de la complexité des technologies de fabrication, de la gamme et des classes de dispositifs produits et de toute information disponible issue de la surveillance après commercialisation, \n\t\t— si le programme d'audit ne le prévoit pas déjà, audite le contrôle des processus dans les locaux des fournisseurs du fabricant, lorsque la conformité des dispositifs finis est nettement influencée par les activités des fournisseurs et, en particulier, lorsque le fabricant ne peut apporter la preuve d'un contrôle suffisant sur ses fournisseurs, \n\t\t— réalise des évaluations de la documentation technique sur la base de son plan d'échantillonnage et compte tenu des sections 4.5.4 et 4.5.5 pour les évaluations précliniques et cliniques, et \n\t\t— veille à ce que les constatations d'audit soient classées, de manière appropriée et cohérente, conformément aux exigences du présent règlement et aux normes pertinentes ou aux documents sur les bonnes pratiques élaborés ou adoptés par le groupe de coordination en matière de dispositifs médicaux (GCDM)."
    3_prefix: "4.5.3"
    3_label: "Vérification du produit"
    3_desc: "Évaluation de la documentation technique \n\n En ce qui concerne l'évaluation de la documentation technique visée à l'annexe IX, chapitre II, les organismes notifiés disposent de l'expertise, d'installations et de procédures documentées suffisantes portant sur les éléments suivants: \n\t— la désignation d'un personnel dûment qualifié et autorisé pour procéder à l'examen des différents aspects, tels que l'utilisation du dispositif, la biocompatibilité, l'évaluation clinique, la gestion des risques et la stérilisation, et \n\t— l'évaluation de la conformité de la conception avec le présent règlement et la prise en compte des sections 4.5.4 à 4.5.6. Cette évaluation comporte l'examen de la mise en œuvre, par les fabricants, des vérifications lors de la réception, des vérifications en cours de fabrication et des vérifications finales, ainsi que de leurs résultats. Si 'autres essais ou d'autres éléments de preuve sont nécessaires aux fins de l'évaluation de la conformité avec les exigences du présent règlement, l'organisme notifié concerné soumet le dispositif à des essais physiques ou des essais en laboratoire ou demande au fabricant d'effectuer de tels essais. \n\n Examen de type \n\n En ce qui concerne l'examen de type des dispositifs conformément à l'annexe X, les organismes notifiés disposent de procédures documentées ainsi que de l'expertise et d'installations suffisantes, notamment la capacité nécessaire pour: \n\t— examiner et évaluer la documentation technique compte tenu des sections 4.5.4 à 4.5.6 et vérifier que le type a été fabriqué en conformité avec cette documentation, \n\t— établir un plan d'essais répertoriant tous les paramètres pertinents et critiques qui doivent faire l'objet d'essais de la part de l'organisme notifié ou sous sa responsabilité, \n\t— documenter les raisons justifiant le choix desdits paramètres, \n\t— procéder aux contrôles et essais appropriés afin de vérifier que les solutions retenues par le fabricant satisfont aux exigences générales en matière de sécurité et de performances énoncées à l'annexe I. Ces contrôles et essais comprennent tous les essais nécessaires pour vérifier que le fabricant a effectivement appliqué les normes pertinentes qu'il a choisi d'utiliser, \n\t— convenir avec le demandeur de l'endroit où les essais nécessaires auront lieu s'ils ne sont pas effectués directement par l'organisme notifié, et \n\t— assumer l'entière responsabilité des résultats des essais. Les rapports d'essais présentés par le fabricant ne sont pris en considération que s'ils émanent d'organismes d'évaluation de la conformité qui sont compétents et indépendants du fabricant. \n\nVérification par contrôle et essai de chaque produit \n\nLes organismes notifiés: \n\ta. disposent de procédures documentées ainsi que de l'expertise et d'installations suffisantes pour la vérification par contrôle et essai de chaque produit conformément à l'annexe XI, partie B; \n\tb. établissent un plan d'essais répertoriant tous les paramètres pertinents et critiques qui doivent faire l'objet d'essais de la part des organismes notifiés ou sous leur responsabilité, afin de: \n\t\t— vérifier, pour les dispositifs de classe IIb, leur conformité avec le type décrit dans le certificat d'examen UE de type et avec les exigences du présent règlement applicables à ces dispositifs, \n\t\t— confirmer, pour les dispositifs de classe IIa, la conformité avec la documentation technique visée aux annexes II et III et avec les exigences du présent règlement applicables à ces dispositifs; \n\tc. documentent les raisons justifiant le choix des paramètres visés au point b); \n\td. disposent de procédures documentées pour effectuer les évaluations et essais appropriés afin de vérifier la conformité du dispositif avec les exigences du présent règlement en procédant par contrôle et essai de chaque produit comme prévu à l'annexe XI, section 15; \n\te. disposent de procédures documentées permettant de parvenir à un accord avec le demandeur en ce qui concerne le moment et l'endroit où doivent avoir lieu les essais qui ne sont pas effectués par les organismes notifiés eux-mêmes; et \n\tf. assument l'entière responsabilité des résultats des essais conformément à des procédures documentées; les rapports d'essais présentés par le fabricant ne sont pris en considération que s'ils émanent d'organismes d'évaluation de la conformité qui sont compétents et indépendants du fabricant."
    4_prefix: "4.5.4"
    4_label: "Évaluation de l'évaluation préclinique"
    4_desc: "Un organisme notifié dispose de procédures documentées pour examiner les procédures et la documentation du fabricant relatives à l'évaluation des aspects précliniques. Il examine et valide les procédures et la documentation du fabricant et vérifie qu'elles traitent de manière adéquate des éléments suivants: \n\ta. la planification, la réalisation, l'évaluation, la notification et, le cas échéant, la mise à jour de l'évaluation préclinique, en particulier: \n\t\t— les recherches dans la documentation préclinique scientifique, et \n\t\t— les essais précliniques, par exemple les essais en laboratoire, les essais d'utilisation simulée, la modélisation informatique, l'utilisation de modèles animaux; \n\tb. la nature et la durée du contact avec le corps et les risques biologiques associés spécifiques \n\tc. l'interface avec le processus de gestion des risques \n\td. l'appréciation et l'analyse des données précliniques disponibles et leur pertinence en vue de démontrer la conformité avec les exigences applicables de l'annexe I. \n\n L'évaluation, par les organismes notifiés, des procédures et de la documentation relatives à l'évaluation préclinique porte sur les résultats des recherches dans la documentation et l'ensemble des validations, vérifications et essais effectués ainsi que sur les conclusions tirées, et elle inclut en règle générale des éléments de réflexion concernant l'utilisation d'autres matériaux ou substances et tient compte du conditionnement et de la stabilité du dispositif fini, notamment de sa durée de conservation en stock. Lorsqu'aucun nouvel essai n'a été effectué par un fabricant ou lorsqu'on s'écarte des procédures, l'organisme notifié concerné fait un examen critique approprié de la justification avancée par le fabricant."
    5_prefix: "4.5.5"
    5_label: "Évaluation de l'évaluation clinique"
    5_desc: "Les organismes notifiés ont mis en place des procédures documentées pour évaluer les procédures et la documentation du fabricant relatives à l'évaluation clinique, à la fois pour l'évaluation initiale de la conformité et sur une base permanente. Les organismes notifiés examinent et valident les procédures et la documentation des fabricants et vérifient qu'elles traitent de manière adéquate des éléments suivants: \n\t— la planification, la réalisation, l'évaluation, la notification et la mise à jour de l'évaluation clinique prévues à l'annexe XIV, \n\t— la surveillance après commercialisation et le SCAC, \n\t— l'interface avec le processus de gestion des risques, \n\t— l'appréciation et l'analyse des données précliniques disponibles et leur pertinence en vue de démontrer la conformité avec les exigences applicables de l'annexe I, et \n\t— les conclusions tirées en ce qui concerne les preuves cliniques et l'élaboration du rapport sur l'évaluation clinique. \n\n Les procédures visées au premier alinéa tiennent compte des spécifications communes, documents d'orientation et documents sur les bonnes pratiques disponibles. \n\n Les évaluations faites par les organismes notifiés des évaluations cliniques prévues à l'annexe XIV portent sur: \n\t— l'utilisation prévue déclarée par le fabricant et ses allégations à propos du dispositif, \n\t— la planification de l'évaluation clinique, \n\t— la méthode pour les recherches dans la documentation, \n\t— les données pertinentes issues des recherches dans la documentation, \n\t— l'investigation clinique, \n\t— le bien-fondé de l'équivalence alléguée avec d'autres dispositifs, la démonstration de cette équivalence, le caractère approprié des dispositifs équivalents et similaires et les conclusions tirées à cet égard, \n\t— la surveillance après commercialisation et le SCAC, \n\t— le rapport sur l'évaluation clinique, et \n\t— les éléments justifiant l'absence d'investigations cliniques ou de SCAC. \n\n Pour ce qui est des données cliniques issues des investigations cliniques comprises dans l'évaluation clinique, l'organisme notifié concerné veille à ce que les conclusions tirées par le fabricant soient valables au regard du protocole d'investigation clinique qui a été approuvé. \n\n L'organisme notifié veille à ce que l'évaluation clinique traite de manière adéquate des exigences en matière de sécurité et de performances énoncées à l'annexe I, cadre avec les exigences en matière de gestion des risques, soit réalisée conformément à l'annexe XIV et trouve un écho approprié dans les informations fournies à propos du dispositif."
    6_prefix: "4.5.6"
    6_label: "Procédures spéciales"
    6_desc: "Les organismes notifiés disposent de procédures documentées ainsi que de l'expertise et d'installations suffisantes pour les procédures prévues à l'annexe IX, sections 5 et 6, à l'annexe X, section 6, et à l'annexe XI, section 16, pour lesquelles ils sont désignés. \n\n Dans le cas de dispositifs fabriqués à partir de tissus ou cellules d'origine animale ou de leurs dérivés, provenant par exemple d'espèces sensibles aux EST, visés par le règlement (UE) no 722/2012, les organismes notifiés ont mis en place des procédures documentées conformes aux exigences énoncées dans ledit règlement, y compris l'élaboration d'une synthèse du rapport d'évaluation à l'intention de l'autorité compétente concernée."
  18_prefix: "4.6"
  18_label: "Exigences relatives au processus - Rapports"
  18_desc: "Les organismes notifiés: \n\t— veillent à ce que toutes les étapes de l'évaluation de la conformité soient documentées de sorte que les conclusions de l'évaluation soient claires et démontrent la conformité avec les exigences du présent règlement et puissent représenter une preuve objective de cette conformité pour les personnes qui ne participent pas elles-mêmes à l'évaluation, par exemple le personnel des autorités qui ont désigné l'organisme, \n\t— veillent à ce que des rapports permettant un suivi transparent des audits soient disponibles pour les audits des systèmes de gestion de la qualité, \n\t— documentent clairement les conclusions des évaluations qu'ils ont faites de l'évaluation clinique dans un rapport d'évaluation sur les évaluations cliniques, et \n\t— pour chaque projet donné, fournissent un rapport détaillé, sur la base d'un format standard, contenant un ensemble minimal d'éléments défini par le GCDM. \n\n Le rapport d'un organisme notifié: \n\t— documente clairement le résultat de son évaluation et tire des conclusions précises de la vérification du respect, par le fabricant, des exigences du présent règlement, \n\t— contient une recommandation concernant l'examen final par l'organisme notifié et sa décision finale; cette recommandation est validée par le membre du personnel responsable au sein de l'organisme notifié, et \n\t— est communiqué au fabricant concerné."
  19_prefix: "4.7"
  19_label: "Exigences relatives au processus - Examen final"
  19_desc: "Avant de prendre une décision finale, les organismes notifiés: \n\t— veillent à ce que les membres du personnel chargés de l'examen final et de la prise de décision concernant des projets donnés soient dûment autorisés et ne soient pas les mêmes que ceux qui ont réalisé les évaluations \n\t— vérifient que le ou les rapports et les pièces justificatives qui sont nécessaires à la prise de décision, y compris en ce qui concerne la solution à apporter aux cas de non-conformité constatés durant l'évaluation, soient complets et suffisants au regard du champ de la demande, e \n\t— vérifient qu'il n'existe aucun cas de non-conformité auquel il n'a pas été remédié et qui empêche la délivrance d'un certificat."
  20_prefix: "4.8"
  20_label: "Exigences relatives au processus - Décision et certification"
  20_desc: "Les organismes notifiés disposent de procédures documentées pour la prise de décision, y compris en ce qui concerne la répartition des responsabilités en matière de délivrance, de suspension ou d'annulation de certificats ou l'imposition de restrictions. Ces procédures comportent les exigences en matière de notification énoncées au chapitre V du présent règlement. Les procédures permettent à l'organisme notifié concerné: \n\t— de décider, sur la base des documents issus de l'évaluation et de toute information supplémentaire disponible, s'il est satisfait aux exigences du présent règlement, \n\t— de décider, sur la base des résultats de son évaluation de l'évaluation clinique et de la gestion des risques, si le plan de surveillance après commercialisation, y compris le plan de SCAC, est adéquat, \n\t— de fixer des échéances pour l'examen, par l'organisme notifié, de l'évaluation clinique actualisée, \n\t— de décider si des conditions ou dispositions particulières doivent être définies pour la certification, \n\t— de fixer, en fonction de la nouveauté, de la classe de risque, de l'évaluation clinique et des conclusions de l'analyse des risques liés au dispositif, une durée de certification n'excédant pas cinq ans, \n\t— de documenter clairement la prise de décision et les étapes de l'approbation, y compris l'approbation, au moyen d'une signature, par les membres du personnel responsables, \n\t— de documenter clairement les responsabilités et les mécanismes pour la communication des décisions, en particulier lorsque le signataire final d'un certificat n'est pas la ou les personnes qui ont pris la décision ou ne satisfait pas aux exigences visées à la section 3.2.7, \n\t— de délivrer un ou des certificats conformément aux exigences minimales énoncées à l'annexe XII pour une durée de validité maximale de cinq ans, en indiquant si la certification est assortie de conditions ou restrictions spécifiques, \n\t— de délivrer un ou des certificats exclusivement au demandeur et non des certificats adressés à plusieurs entités, et \n\t— de veiller à ce que le fabricant soit informé du résultat de l'évaluation et de la décision qui s'ensuit et que ceux-ci soient introduits dans le système électronique visé à l'article 57."
  21_prefix: "4.9"
  21_label: "Exigences relatives au processus - Modifications"
  21_desc: "Les organismes notifiés ont mis en place des procédures documentées et des arrangements contractuels avec les fabricants concernant les obligations d'information du fabricant et l'évaluation des modifications apportées: \n\t— au(x) système(s) de gestion de la qualité approuvé(s) ou à la gamme de produits couverts, \n\t— à la conception approuvée d'un dispositif, \n\t— à l'utilisation prévue d'un dispositif ou aux allégations le concernant, \n\t— au type approuvé d'un dispositif, et \n\t— à toute substance incorporée dans un dispositif ou à partir de laquelle un dispositif est fabriqué, qui fait l'objet des procédures spéciales visées à la section 4.5.6. \n\n Les procédures et arrangements contractuels visés au premier alinéa comportent des mesures permettant de contrôler la portée des modifications visées à l'alinéa en question. \n\n Conformément à ses procédures documentées, l'organisme notifié concerné: \n\t— veille à ce que les fabricants présentent, pour approbation préalable, les projets de modification visés au premier alinéa et les informations y afférentes, \n\t— évalue les modifications envisagées et vérifie qu'une fois modifié, le système de gestion de la qualité ou la conception ou le type d'un dispositif satisfait toujours aux exigences du présent règlement, et \n\t— notifie sa décision au fabricant et établit un rapport ou, selon le cas, un rapport complémentaire, contenant les conclusions dûment justifiées de son évaluation."
  22_prefix: "4.10"
  22_label: "Exigences relatives au processus - Activités de surveillance et contrôle après certification"
  22_desc: "Les organismes notifiés disposent de procédures documentées: \n\t— précisant comment et quand il convient de mener des activités de surveillance auprès des fabricants. Ces procédures comportent des arrangements relatifs aux audits sur place inopinés chez les fabricants et, selon le cas, chez les sous-traitants et les fournisseurs, à la réalisation d'essais de produits et au contrôle du respect de toute condition imposée aux fabricants et en rapport avec les décisions de certification, telle que l'obligation de mettre périodiquement à jour les données cliniques, \n\t— concernant l'examen des sources pertinentes de données scientifiques et cliniques et d'informations après commercialisation en rapport avec le champ de leur désignation. Ces informations sont prises en considération lors de la planification et de la réalisation des activités de surveillance, et \n\t— concernant l'examen des données issues de la vigilance auxquelles ils ont accès en vertu de l'article 92, paragraphe 2, afin d'en estimer l'incidence éventuelle sur la validité des certificats existants. Les résultats de l'évaluation et toute décision qui est prise sont pleinement documentés. \n\n Lorsqu'un fabricant ou les autorités compétentes lui communiquent que des produits font l'objet d'une vigilance, l'organisme notifié concerné décide laquelle des options suivantes choisir: \n\t— n'entreprendre aucune action étant donné que le cas n'est manifestement pas lié à la certification qui a été accordée, \n\t— observer les activités du fabricant et de l'autorité compétente ainsi que les résultats de l'enquête du fabricant afin de déterminer si la certification accordée est compromise ou si des mesures correctives appropriées ont été prises, \n\t— recourir à des mesures de surveillance extraordinaires, telles que des examens de documents, des audits à bref délai ou inopinés et des essais de produits, lorsque la certification accordée est susceptible d'être compromise, \n\t— augmenter la fréquence des audits de surveillance, \n\t— réexaminer certains produits ou processus à l'occasion du prochain audit chez le fabricant, ou \n\t— prendre toute autre mesure pertinente. \n\n En ce qui concerne les audits de surveillance chez les fabricants, les organismes notifiés disposent de procédures documentées pour: \n\t— effectuer des audits de ce type au moins une fois par an, planifiés et menés conformément aux exigences de la section 4.5, \n\t— veiller à la bonne évaluation de la documentation du fabricant sur la vigilance, la surveillance après commercialisation et le SCAC, ainsi qu'à l'application par le fabricant des dispositions en la matière, \n\t— procéder à l'échantillonnage et à des essais concernant les dispositifs et la documentation technique, au cours des audits, selon des critères d'échantillonnage et des procédures d'essais prédéfinis pour s'assurer que le fabricant applique en permanence le système de gestion de la qualité qui a été approuvé, \n\t— veiller à ce que le fabricant se conforme aux obligations en matière de documentation et d'information prévues dans les annexes pertinentes et à ce que ses procédures tiennent compte des bonnes pratiques dans la mise en œuvre du système de gestion de la qualité, \n\t— veiller à ce que le fabricant ne fasse pas un usage trompeur du système de gestion de la qualité ou de l'approbation des dispositifs, \n\t— rassembler suffisamment d'informations pour déterminer si le système de gestion de la qualité est toujours conforme aux exigences du présent règlement, \n\t— demander au fabricant, si des cas de non-conformité sont détectés, de procéder à des corrections, d'appliquer des mesures correctives et, s'il y a lieu, des mesures préventives, et \n\t— au besoin, assortir le certificat concerné de restrictions ou le suspendre ou l'annuler. \n\n Si cela figure parmi les conditions dont est assortie la certification, l'organisme notifié: \n\t— procède à un examen approfondi de l'évaluation clinique dans sa version la plus récente mise à jour par le fabricant sur la base de la surveillance après commercialisation et du SCAC que celui-ci a mis en place ainsi que de la documentation clinique pertinente au regard de l'affection traitée au moyen du dispositif ou de la documentation clinique pertinente pour des dispositifs similaires, \n\t— documente clairement les résultats de cet examen approfondi et communique au fabricant tout sujet de préoccupation ou lui impose toute condition spécifique, et \n\t— veille à ce que l'évaluation clinique la plus récente soit dûment prise en compte dans la notice d'utilisation et, selon le cas, dans le résumé des caractéristiques de sécurité et des performances."
  23_prefix: "4.11"
  23_label: "Exigences relatives au processus - Recertification"
  23_desc: "Les organismes notifiés ont mis en place des procédures documentées concernant les examens liés à la recertification et au renouvellement des certificats. Tous les cinq ans au moins, il est prévu de recertifier les systèmes de gestion de la qualité qui ont été approuvés ou de renouveler les certificats d'évaluation UE de la documentation technique et les certificats d'examen UE de type. \n\n Les organismes notifiés disposent de procédures documentées concernant le renouvellement des certificats d'évaluation UE de la documentation technique et des certificats d'examen UE de type, et ces procédures exigent du fabricant concerné qu'il présente un résumé des modifications et des données scientifiques récentes concernant le dispositif, notamment: \n\ta. toutes les modifications apportées au dispositif approuvé initialement, y compris les modifications non encore notifiées; \n\tb. l'expérience tirée de la surveillance après commercialisation; \n\tc. l'expérience tirée de la gestion des risques; \n\td. l'expérience tirée de la mise à jour des éléments démontrant la conformité avec les exigences générales en matière de sécurité et de performances énoncées à l'annexe I; \n\te. l'expérience tirée des examens de l'évaluation clinique, y compris les résultats de toute investigation clinique et de tout SCAC; \n\tf. les modifications des exigences, d'éléments du dispositif ou de l'environnement scientifique ou réglementaire; \n\tg. les modifications des normes harmonisées appliquées ou nouvelles, des spécifications communes ou de documents équivalents; et \n\th. l'évolution des connaissances médicales, scientifiques et techniques, par exemple: \n\t— nouveaux traitements, \n\t— modification des méthodes d'essai, \n\t— découvertes scientifiques concernant les matériaux et les composants, y compris des découvertes concernant leur biocompatibilité, \n\t— expérience tirée d'études sur des dispositifs comparables, \n\t— données provenant de registres, \n\t— expérience tirée d'investigations cliniques portant sur des dispositifs comparables. \n\n Les organismes notifiés disposent de procédures documentées pour évaluer les informations visées au deuxième alinéa et accordent une attention particulière aux données cliniques issues des activités de surveillance après commercialisation et de SCAC entreprises depuis la certification ou la recertification précédente, y compris les actualisations des rapports d'évaluation clinique établis par les fabricants. \n\n Pour statuer sur la recertification, l'organisme notifié concerné utilise les mêmes méthodes et principes que pour la décision de certification initiale. Au besoin, des formulaires distincts sont établis pour la recertification compte tenu des mesures prises pour la certification, telles que la demande et l'examen de la demande."
18:
  prefix: "Annexe VIII"
  title: "Règles de classification"
  1:
    prefix: "Chaptire II"
    title: "Règles d'application"
    1_prefix: "3.1"
    1_label: "Les règles de classification s'appliquent en fonction de la destination des dispositifs."
    2_prefix: "3.2"
    2_label: "Si le dispositif en question est destiné à être utilisé en combinaison avec un autre dispositif, les règles de classification s'appliquent séparément à chacun des dispositifs. Les accessoires d'un dispositif médical et d'un produit énuméré à l'annexe XVI sont classés en soi, indépendamment des dispositifs avec lesquels ils sont utilisés."
    3_prefix: "3.3"
    3_label: "Le logiciel commandant un dispositif ou agissant sur son utilisation relève de la même classe que le dispositif. \n\n Si le logiciel est indépendant de tout autre dispositif, il est classé en tant que tel."
    4_prefix: "3.4"
    4_label: "Si le dispositif n'est pas destiné à être utilisé exclusivement ou principalement dans une partie spécifique du corps, il est considéré et classé suivant l'utilisation la plus critique spécifiée."
    5_prefix: "3.5"
    5_label: "Si plusieurs règles ou, dans le cadre d'une même règle, plusieurs sous-règles s'appliquent au même dispositif du fait de la destination de celui-ci, la règle ou la sous-règle qui s'applique est la plus stricte, le dispositif étant classé dans la classe la plus élevée."
    6_prefix: "3.6"
    6_label: "Pour le calcul de la durée visée à la section 1, on entend par «utilisation en continu»:"
    6_desc: "\ta. la durée totale d'utilisation du même dispositif sans tenir compte d'une interruption temporaire d'utilisation au cours d'une procédure ou du retrait temporaire pour le nettoyage ou la désinfection du dispositif. Le caractère temporaire de l'interruption de l'utilisation ou du retrait est établi au regard de la durée de l'utilisation avant et après la période pendant laquelle l'utilisation est interrompue ou le dispositif est retiré; et \n\tb. l'utilisation accumulée d'un dispositif destiné par le fabricant à être immédiatement remplacé par un autre du même type."
    7_prefix: "3.7"
    7_label: "Un dispositif est réputé permettre un diagnostic direct lorsqu'il fournit lui-même le diagnostic de la maladie ou de l'état pathologique en question ou lorsqu'il fournit des informations décisives pour l'établissement du diagnostic."
  2:
    prefix: "Chapitre III"
    title: "Règles de classification"
    1_prefix: "4.1"
    1_label: "Dispositifs non invasifs - Règle 1"
    1_desc: "Tous les dispositifs non invasifs relèvent de la classe I, sauf si l'une des règles ci-après s'applique."
    2_prefix: "4.2"
    2_label: "Dispositifs non invasifs - Règle 2"
    2_desc: "Tous les dispositifs non invasifs destinés à acheminer ou à stocker du sang, des liquides, cellules ou tissus corporels, des liquides ou des gaz en vue d'une perfusion, d'une administration ou d'une introduction dans le corps relèvent de la classe IIa: \n\t— s'ils peuvent être raccordés à un dispositif actif de classe IIa, IIb ou III, o \n\t— s'ils sont destinés à être utilisés pour l'acheminement ou le stockage du sang ou d'autres liquides corporels ou le stockage d'organes, de parties d'organes ou de cellules et tissus corporels, à l'exception des poches à sang; les poches à sang relèvent de la classe IIb. \n\n Dans tous les autres cas, ces dispositifs relèvent de la classe I."
    3_prefix: "4.3"
    3_label: "Dispositifs non invasifs - Règle 3"
    3_desc: "Tous les dispositifs non invasifs visant à modifier la composition biologique ou chimique des tissus ou cellules humains, du sang, d'autres liquides corporels ou d'autres liquides destinés à être implantés ou administrés dans le corps relèvent de la classe IIb, sauf si le traitement pour lequel le dispositif est utilisé consiste en une filtration, une centrifugation ou des échanges de gaz ou de chaleur, auxquels cas ils relèvent de la classe IIa. \n\n Tous les dispositifs non invasifs consistant en une substance ou un mélange de substances et destinés à une utilisation in vitro en contact direct avec des cellules, tissus ou organes humains prélevés dans le corps humain ou utilisés in vitro avec des embryons humains avant leur implantation ou leur administration dans le corps relèvent de la classe III."
    4_prefix: "4.4"
    4_label: "Dispositifs non invasifs - Règle 4"
    4_desc: "Tous les dispositifs non invasifs qui entrent en contact avec de la peau ou de la muqueuse lésée: \n\t— relèvent de la classe I s'ils sont destinés à être utilisés comme barrière mécanique, pour la compression ou pour l'absorption des exsudats \n\t— relèvent de la classe IIb s'ils sont destinés à être utilisés principalement pour des plaies comportant une destruction du derme ou de la muqueuse et ne pouvant se cicatriser que par deuxième intention \n\t— relèvent de la classe IIa s'ils sont destinés principalement à agir sur le micro-environnement de la peau ou muqueuse lésée, e \n\t— relèvent de la classe IIa dans tous les autres cas. \n\n La présente règle s'applique également aux dispositifs invasifs qui entrent en contact avec une muqueuse lésée."
    5_prefix: "5.1"
    5_label: "Dispositifs invasifs - Règle 5"
    5_desc: "Tous les dispositifs invasifs en rapport avec les orifices du corps, autres que les dispositifs invasifs de type chirurgical, qui ne sont pas destinés à être raccordés à un dispositif actif ou qui sont destinés à être raccordés à un dispositif actif de classe I: \n\t— relèvent de la classe I s'ils sont destinés à un usage temporaire \n\t— relèvent de la classe IIa s'ils sont destinés à un usage à court terme, sauf s'ils sont utilisés dans la cavité buccale jusqu'au pharynx, dans le conduit auditif externe jusqu'au tympan ou dans la cavité nasale, auxquels cas ils relèvent de la classe I, e \n\t— relèvent de la classe IIb s'ils sont destinés à un usage à long terme, sauf s'ils sont utilisés dans la cavité buccale jusqu'au pharynx, dans le conduit auditif externe jusqu'au tympan ou dans la cavité nasale et ne sont pas susceptibles d'être absorbés par la muqueuse, auxquels cas ils relèvent de la classe IIa. \n\n Tous les dispositifs invasifs en rapport avec les orifices du corps, autres que les dispositifs invasifs de type chirurgical, destinés à être raccordés à un dispositif actif de classe IIa, IIb ou III, relèvent de la classe IIa."
    6_prefix: "5.2"
    6_label: "Dispositifs invasifs - Règle 6"
    6_desc: "Tous les dispositifs invasifs de type chirurgical destinés à un usage temporaire relèvent de la classe IIa, sauf: \n\t— s'ils sont spécifiquement destinés à contrôler, diagnostiquer, surveiller ou corriger une défaillance du cœur ou du système circulatoire central par contact direct avec ces parties du corps, auxquels cas ils relèvent de la classe III, \n\t— s'il s'agit d'instruments chirurgicaux réutilisables, auquel cas ils relèvent de la classe I, \n\t— s'ils sont spécifiquement destinés à être utilisés en contact direct avec le cœur, le système circulatoire central ou le système nerveux central, auxquels cas ils relèvent de la classe III, \n\t— s'ils sont destinés à fournir de l'énergie sous la forme de rayonnements ionisants, auquel cas ils relèvent de la classe IIb, \n\t— s'ils ont un effet biologique ou sont absorbés en totalité ou en grande partie, auxquels cas ils relèvent de la classe IIb, ou \n\t— s'ils sont destinés à administrer des médicaments par un mécanisme de libération et que ce mode d'administration peut présenter des risques, auquel cas ils relèvent de la classe IIb."
    7_prefix: "5.3"
    7_label: "Dispositifs invasifs - Règle 7"
    7_desc: "Tous les dispositifs invasifs de type chirurgical destinés à un usage à court terme relèvent de la classe IIa, sauf: \n\t— s'ils sont spécifiquement destinés à contrôler, diagnostiquer, surveiller ou corriger une défaillance du cœur ou du système circulatoire central par contact direct avec ces parties du corps, auxquels cas ils relèvent de la classe III, \n\t— s'ils sont spécifiquement destinés à être utilisés en contact direct avec le cœur, le système circulatoire central ou le système nerveux central, auxquels cas ils relèvent de la classe III, \n\t— s'ils sont destinés à fournir de l'énergie sous la forme de rayonnements ionisants, auquel cas ils relèvent de la classe IIb, \n\t— s'ils ont un effet biologique ou sont absorbés en totalité ou en grande partie, auxquels cas ils relèvent de la classe III, \n\t— s'ils sont destinés à subir une transformation chimique dans le corps, auquel cas ils relèvent de la classe IIb, sauf s'ils sont placés dans les dents, ou \n\t— s'ils sont destinés à administrer des médicaments, auquel cas ils relèvent de la classe IIb."
    8_prefix: "5.4"
    8_label: "Dispositifs invasifs - Règle 8"
    8_desc: "Tous les dispositifs implantables et les dispositifs invasifs de type chirurgical pour un usage à long terme relèvent de la classe IIb, sauf: \n\t— s'ils sont destinés à être placés dans les dents, auquel cas ils relèvent de la classe IIa, \n\t— s'ils sont destinés à être utilisés en contact direct avec le cœur, le système circulatoire central ou le système nerveux central, auxquels cas ils relèvent de la classe III, \n\t— s'ils ont un effet biologique ou sont absorbés en totalité ou en grande partie, auxquels cas ils relèvent de la classe III, \n\t— s'ils sont destinés à subir une transformation chimique dans le corps, auquel cas ils relèvent de la classe III, sauf s'ils sont placés dans les dents, ou \n\t— s'ils sont destinés à administrer des médicaments, auquel cas ils relèvent de la classe III, \n\t— s'il s'agit de dispositifs implantables actifs ou de leurs accessoires, auxquels cas ils relèvent de la classe III, \n\t— s'il s'agit d'implants mammaires ou de treillis chirurgicaux, auxquels cas ils relèvent de la classe III, \n\t— s'il s'agit de prothèses articulaires totales ou partielles, auquel cas ils relèvent de la classe III, à l'exception des composants annexes tels que les vis, les cales, les plaques et les instruments, ou \n\t— s'il s'agit de prothèses discales ou de dispositifs implantables entrant en contact avec la colonne vertébrale, auxquels cas ils relèvent de la classe III, à l'exception des composants tels que les vis, les cales, les plaques et les instruments."
    9_prefix: "6.1"
    9_label: "Dispositifs invasifs - Règle 9"
    9_desc: "Tous les dispositifs actifs thérapeutiques destinés à fournir ou à transférer de l'énergie relèvent de la classe IIa, sauf si leurs caractéristiques sont telles qu'ils peuvent fournir de l'énergie au corps humain ou assurer des transferts d'énergie avec celui-ci d'une manière potentiellement dangereuse, compte tenu de la nature, de la densité et du site d'application de cette énergie, auxquels cas ils relèvent de la classe IIb. \n\nTous les dispositifs actifs destinés à commander ou à contrôler les performances des dispositifs actifs thérapeutiques de classe IIb ou destinés à agir directement sur les performances de ces dispositifs relèvent de la classe IIb \n\nTous les dispositifs actifs destinés à émettre des rayonnements ionisants à usage thérapeutique, y compris les dispositifs qui commandent ou contrôlent les performances de ces dispositifs ou agissent directement sur celles-ci, relèvent de la classe IIb \n\nTous les dispositifs actifs destinés à commander, à contrôler ou à agir directement sur les performances des dispositifs implantables actifs relèvent de la classe III."
    10_prefix: "6.2"
    10_label: "Dispositifs invasifs - Règle 10"
    10_desc: "Les dispositifs actifs destinés au diagnostic et au contrôle relèvent de la classe IIa: \n\t— s'ils sont destinés à fournir de l'énergie qui sera absorbée par le corps humain, à l'exception des dispositifs destinés à éclairer le corps du patient dans le spectre visible, auquel cas ils relèvent de la classe I \n\t— s'ils sont destinés à visualiser la distribution de produits radiopharmaceutiques in vivo, o \n\t— s'ils sont destinés à permettre un diagnostic ou un contrôle direct des processus physiologiques vitaux, sauf s'ils sont spécifiquement destinés à contrôler les paramètres physiologiques vitaux et si des variations de certains de ces paramètres, notamment ceux des fonctions cardiaques ou respiratoires ou de l'activité du système nerveux central, peuvent présenter un danger immédiat pour la vie du patient, ou s'ils sont destinés à poser un diagnostic dans des situations cliniques où le patient est en danger immédiat, auxquels cas ils relèvent de la classe IIb. \n\n Les dispositifs actifs destinés à émettre des rayonnements ionisants et destinés au radiodiagnostic ou à la radiothérapie, y compris les dispositifs de radiologie interventionnelle et les dispositifs qui commandent ou contrôlent ces dispositifs ou agissent directement sur leurs performances, relèvent de la classe IIb."
    11_prefix: "6.3"
    11_label: "Dispositifs invasifs - Règle 11"
    11_desc: "Les logiciels destinés à fournir des informations utilisées pour prendre des décisions à des fins thérapeutiques ou diagnostiques relèvent de la classe IIa, sauf si ces décisions ont une incidence susceptible de causer: \n\t— la mort ou une détérioration irréversible de l'état de santé d'une personne, auxquels cas ils relèvent de la classe III, o \n\t— une grave détérioration de l'état de santé d'une personne ou une intervention chirurgicale, auxquels cas ils relèvent de la classe IIb. \n\n Les logiciels destinés à contrôler des processus physiologiques relèvent de la classe IIa, sauf s'ils sont destinés à contrôler des paramètres physiologiques vitaux, lorsque des variations de certains de ces paramètres peuvent présenter un danger immédiat pour la vie du patient, auxquels cas ils relèvent de la classe IIb. \n\n Tous les autres logiciels relèvent de la classe I."
    12_prefix: "6.4"
    12_label: "Dispositifs invasifs - Règle 12"
    12_desc: "Tous les dispositifs actifs destinés à administrer dans l'organisme et/ou à retirer de l'organisme des médicaments, des liquides corporels ou d'autres substances relèvent de la classe IIa, sauf si l'opération s'effectue d'une manière potentiellement dangereuse, compte tenu de la nature des substances en question, de la partie du corps concernée et du mode d'administration, auquel cas ils relèvent de la classe IIb."
    13_prefix: "6.5"
    13_label: "Dispositifs invasifs - Règle 13"
    13_desc: "Tous les autres dispositifs actifs relèvent de la classe I."
    14_prefix: "7.1"
    14_label: "Dispositifs invasifs - Règle 14"
    14_desc: "Tous les dispositifs incorporant comme partie intégrante une substance qui, utilisée séparément, peut être considérée comme un médicament au sens de l'article 1er, point 2, de la directive 2001/83/CE, y compris un médicament dérivé du sang ou du plasma humain tel que défini à l'article 1er, point 10, de ladite directive, et dont l'action est accessoire à celle des dispositifs, relèvent de la classe III."
    15_prefix: "7.2"
    15_label: "Dispositifs invasifs - Règle 15"
    15_desc: "Tous les dispositifs utilisés pour la contraception ou pour prévenir la transmission de maladies sexuellement transmissibles relèvent de la classe IIb, sauf s'il s'agit de dispositifs implantables ou de dispositifs invasifs pour un usage à long terme, auxquels cas ils relèvent de la classe III."
    16_prefix: "7.3"
    16_label: "Dispositifs invasifs - Règle 16"
    16_desc: "Tous les dispositifs spécifiquement destinés à désinfecter, nettoyer, rincer ou, le cas échéant, hydrater des lentilles de contact relèvent de la classe IIb. \n\n Tous les dispositifs spécifiquement destinés à être utilisés pour désinfecter ou stériliser des dispositifs médicaux relèvent de la classe IIa, sauf s'il s'agit de solutions désinfectantes ou de laveurs désinfecteurs spécifiquement destinés à être utilisés pour désinfecter des dispositifs invasifs à la fin du processus, auquel cas ils relèvent de la classe IIb. \n\n La présente règle ne s'applique pas aux dispositifs destinés à nettoyer les dispositifs autres que les lentilles de contact par des moyens physiques uniquement."
    17_prefix: "7.4"
    17_label: "Dispositifs invasifs - Règle 17"
    17_desc: "Les dispositifs spécifiquement destinés à enregistrer les images de diagnostic générées par irradiation aux rayons X relèvent de la classe IIa."
    18_prefix: "7.5"
    18_label: "Dispositifs invasifs - Règle 18"
    18_desc: "Tous les dispositifs fabriqués à partir de tissus ou de cellules d'origine humaine ou animale, ou de leurs dérivés, non viables ou rendus non viables, relèvent de la classe III, sauf si ces dispositifs sont fabriqués à partir de tissus ou de cellules d'origine animale, ou de leurs dérivés, non viables ou rendus non viables et sont des dispositifs destinés à entrer en contact uniquement avec une peau intacte."
    19_prefix: "7.6"
    19_label: "Dispositifs invasifs - Règle 19"
    19_desc: "Tous les dispositifs qui incorporent un nanomatériau ou qui en sont constitués relèvent: \n\t— de la classe III s'ils présentent un potentiel d'exposition interne moyen ou élevé \n\t— de la classe IIb s'ils présentent un faible potentiel d'exposition interne, e \n\t— de la classe IIa s'ils présentent un potentiel d'exposition interne négligeable."
    20_prefix: "7.7"
    20_label: "Dispositifs invasifs - Règle 20"
    20_desc: "Tous les dispositifs invasifs en rapport avec les orifices du corps, autres que les dispositifs invasifs de type chirurgical, destinés à administrer des médicaments par inhalation relèvent de la classe IIa, sauf si leur mode d'action a une incidence essentielle sur l'efficacité et la sûreté du médicament administré ou s'ils sont destinés à traiter une affection susceptible de mettre la vie en danger, auquel cas ils relèvent de la classe IIb."
    21_prefix: "7.8"
    21_label: "Dispositifs invasifs - Règle 21"
    21_desc: "Les dispositifs qui sont composés de substances ou de combinaisons de substances qui sont destinées à être introduites dans le corps humain par un orifice du corps ou par application sur la peau et qui sont absorbées par le corps humain ou dispersées localement dans celui-ci relèvent: \n\t— de la classe III si les substances en question, ou les produits de leur métabolisme, sont systémiquement absorbés par le corps humain conformément à la destination du dispositif \n\t— de la classe III si les substances en question atteignent leur destination dans l'estomac ou plus loin dans le tractus gastro-intestinal et si elles, ou les produits de leur métabolisme, sont systémiquement absorbés par le corps humain \n\t— de la classe IIa si les substances en question sont appliquées sur la peau ou si elles sont appliquées dans la cavité nasale ou buccale jusqu'au pharynx et atteignent leur destination dans ces cavités, e \n\t— de la classe IIb dans tous les autres cas."
    22_prefix: "7.9"
    22_label: "Dispositifs invasifs - Règle 22"
    22_desc: "Les dispositifs actifs thérapeutiques ayant une fonction de diagnostic intégrée ou incorporée qui détermine largement la prise en charge du patient par le dispositif, tels que les systèmes en circuit fermé ou les défibrillateurs automatisés externes, relèvent de la classe III."
19:
  prefix: "Annexe IX"
  title: "Évaluation de la conformité sur la base d'un système de gestion de la qualité et de l'évaluation de la documentation technique"
  1:
    prefix: "Chapitre I"
    title: "Système de gestion de la qualité"
    1_prefix: "1"
    1_desc: "Le fabricant établit, documente et applique un système de gestion de la qualité tel qu'il est décrit à l'article 10, paragraphe 9, et en maintient l'efficacité tout au long du cycle de vie des dispositifs concernés. Le fabricant veille à l'application du système de gestion de la qualité tel qu'il est décrit à la section 2 et est soumis à l'audit prévu aux sections 2.3 et 2.4 et à la surveillance prévue à la section 3."
    2_prefix: "2.1"
    2_label: "Évaluation du système de gestion de la qualité"
    2_desc: "Le fabricant soumet une demande d'évaluation de son système de gestion de la qualité à un organisme notifié. La demande comprend: \n\t— le nom du fabricant et l'adresse de son siège social et de tout autre lieu de fabrication supplémentaire concerné par le système de gestion de la qualité et, si la demande du fabricant est présentée par son mandataire, le nom du mandataire et l'adresse du siège social du mandataire, \n\t— toutes les informations appropriées concernant le dispositif ou le groupe de dispositifs relevant du système de gestion de la qualité, \n\t— une déclaration écrite spécifiant qu'aucune demande portant sur le même système de gestion de la qualité lié au dispositif n'a été introduite auprès d'un autre organisme notifié ou des informations concernant toute demande précédente portant sur le même système de gestion de la qualité lié au dispositif, \n\t— un projet de déclaration de conformité UE conformément à l'article 19 et à l'annexe IV pour le modèle de dispositif faisant l'objet de la procédure d'évaluation de la conformité, \n\t— la documentation relative au système de gestion de la qualité mis en place par le fabricant, \n\t— une description documentée des procédures en place pour respecter les obligations découlant du système de gestion de la qualité et requises par le présent règlement et l'engagement par le fabricant en question d'appliquer ces procédures, \n\t— une description des procédures en place pour garantir que le système de gestion de la qualité reste adéquat et efficace et l'engagement par le fabricant d'appliquer ces procédures, \n\t— la documentation relative au système de surveillance après commercialisation mis en place par le fabricant et, le cas échéant, au plan de SCAC, ainsi que les procédures mises en place pour garantir le respect des obligations découlant des dispositions sur la vigilance énoncées aux articles 87 à 92, \n\t— une description des procédures en place pour tenir à jour le système de surveillance après commercialisation et, le cas échéant, le plan de SCAC, ainsi que les procédures visant à garantir le respect des obligations découlant des dispositions sur la vigilance énoncées aux articles 87 à 92, ainsi que l'engagement par le fabricant d'appliquer ces procédures, \n\t— la documentation relative au plan d'évaluation clinique, et \n\t— une description des procédures en place pour tenir à jour le plan d'évaluation clinique, compte tenu de l'état de l'art."
    3_prefix: "2.2"
    3_label: "Évaluation du système de gestion de la qualité"
    3_desc: "L'application du système de gestion de la qualité garantit la conformité avec le présent règlement. L'ensemble des éléments, des exigences et des dispositions adoptés par le fabricant pour son système de gestion de la qualité figurent dans une documentation tenue de manière systématique et ordonnée sous la forme d'un manuel de la qualité et de politiques et de procédures écrites, telles que des programmes, des plans et des enregistrements relatifs à la qualité. \n\n De plus, la documentation à présenter pour l'évaluation du système de gestion de la qualité comprend notamment une description adéquate des éléments suivants: \n\ta. les objectifs de qualité du fabricant; \n\tb. l'organisation de l'entreprise, et notamment: \n\t\t— les structures organisationnelles précisant la répartition des responsabilités entre les membres du personnel en matière de procédures critiques, les responsabilités des cadres et leur autorité organisationnelle, \n\t\t— les méthodes permettant de contrôler le bon fonctionnement du système de gestion de la qualité et notamment l'aptitude dudit système à atteindre la qualité voulue de la conception et du dispositif, y compris le contrôle des dispositifs non conformes, \n\t\t— lorsque la conception, la fabrication et/ou la vérification finale et les essais des dispositifs, ou des parties de ces procédés sont effectués par un tiers, les méthodes permettant de contrôler le bon fonctionnement du système de gestion de la qualité et notamment le type et l'ampleur du contrôle auquel le tiers est soumis, et \n\t\t— lorsque le fabricant ne dispose pas d'un siège social dans un État membre, le projet du mandat pour la désignation d'un mandataire et une lettre dans laquelle le mandataire fait part de son intention d'accepter le mandat; \n\tc. les procédures et des techniques pour la surveillance, la vérification, la validation et le contrôle de la conception des dispositifs, et la documentation correspondante ainsi que des données et des enregistrements résultant de ces procédures et de ces techniques. Ces procédures et ces techniques portent spécifiquement sur les points suivants: \n\t\t— la stratégie pour le respect de la réglementation, y compris des processus permettant de déterminer les exigences juridiques pertinentes, les qualifications, la classification, le traitement de l'équivalence, le choix et le respect des procédures d'évaluation de la conformité, \n\t\t— la détermination des exigences générales en matière de sécurité et de performances qui sont applicables et les solutions retenues pour satisfaire à ces exigences, compte tenu des spécifications communes et, si cette solution a été retenue, des normes harmonisées ou d'autres solutions adéquates, \n\t\t— la gestion des risques visée à l'annexe I, section 3, \n\t\t— l'évaluation clinique conformément à l'article 61 et à l'annexe XIV, y compris le suivi clinique après commercialisation, \n\t\t— les solutions retenues pour satisfaire aux exigences spécifiques relatives à la conception et à la construction qui sont applicables, y compris une évaluation préclinique appropriée, en particulier les exigences établies à l'annexe I, chapitre II, \n\t\t— les solutions retenues pour satisfaire aux exigences spécifiques relatives aux informations fournies avec le dispositif qui sont applicables, en particulier les exigences établies à l'annexe I, chapitre III, \n\t\t— les procédures d'identification du dispositif établies et tenues à jour à partir de dessins, de spécifications applicables ou d'autres documents pertinents, au cours de toutes les phases de la fabrication, et \n\t\t— la gestion des modifications de la conception ou du système de gestion de la qualité; \n\td. les techniques de vérification et d'assurance de la qualité au niveau de la fabrication, et notamment les procédés et les procédures qui doivent être utilisés, notamment en ce qui concerne la stérilisation et les documents pertinents; et \n\te. les examens et des essais appropriés qui doivent être effectués avant, pendant et après la fabrication, la fréquence à laquelle ils doivent avoir lieu et les équipements d'essai devant être utilisés; la traçabilité de l'étalonnage des équipements d'essai est assurée de manière appropriée. \n\n De plus, les fabricants permettent aux organismes notifiés l'accès à la documentation technique visée aux annexes II et III."
    4_prefix: "2.3"
    4_label: "Évaluation du système de gestion de la qualité - Audit"
    4_desc: "L'organisme notifié effectue un audit du système de gestion de la qualité pour déterminer s'il satisfait aux exigences visées à la section 2.2. Dans les cas où le fabricant applique une norme harmonisée ou une spécification commune ayant trait à un système de gestion de la qualité, l'organisme notifié évalue la conformité avec ces normes et spécifications. Sauf raisons dûment justifiées, l'organisme notifié présume qu'un système de gestion de la qualité qui satisfait aux normes harmonisées ou spécifications communes pertinentes est conforme aux exigences couvertes par lesdites normes ou spécifications. \n\n L'équipe d'audit de l'organisme notifié comprend au moins un membre ayant déjà l'expérience d'évaluations de la technologie concernée, conformément à l'annexe VII, sections 4.3 à 4.5. Lorsque cette expérience n'est pas immédiatement manifeste ou applicable, l'organisme notifié expose, documents à l'appui, les raisons justifiant la composition de cette équipe. La procédure d'évaluation comprend un audit dans les locaux du fabricant et, le cas échéant, des fournisseurs et/ou des sous-traitants du fabricant pour vérifier les procédés de fabrication et autres processus pertinents. \n\n De plus, dans le cas des dispositifs de classe IIa ou IIb, l'évaluation du système de gestion de la qualité va de pair avec l'évaluation de la documentation technique en ce qui concerne les dispositifs sélectionnés sur une base représentative, conformément aux sections 4.4 à 4.8. Pour le choix des échantillons représentatifs, l'organisme notifié tient compte des orientations élaborées et publiées par le GCDM conformément à l'article 105 et notamment de la nouveauté de la technologie, des similitudes dans la conception, la technologie, la fabrication et les méthodes de stérilisation, de la destination et des résultats de toute évaluation antérieure pertinente, concernant, par exemple, les propriétés physiques, chimiques, biologiques ou cliniques, réalisée conformément au présent règlement. L'organisme notifié en question établit un dossier justifiant le choix des échantillons. \n\n Si le système de gestion de la qualité est conforme aux dispositions pertinentes du présent règlement, l'organisme notifié délivre un certificat UE relatif au système de gestion de la qualité. L'organisme notifié informe le fabricant de sa décision de délivrer le certificat. Cette décision contient les conclusions de l'audit et un rapport motivé."
    5_prefix: "2.4"
    5_label: "Évaluation du système de gestion de la qualité"
    5_desc: "Le fabricant en question informe l'organisme notifié qui a approuvé le système de gestion de la qualité de tout projet de modification substantielle de ce système ou de la gamme des dispositifs couverts. L'organisme notifié évalue les modifications envisagées, détermine si des audits supplémentaires sont nécessaires et vérifie qu'une fois modifié, le système de gestion de la qualité satisfait toujours aux exigences visées à la section 2.2. Il informe le fabricant de sa décision, laquelle contient les conclusions de l'évaluation et, le cas échéant, les conclusions des audits supplémentaires. L'approbation de toute modification importante du système de gestion de la qualité ou de la gamme des dispositifs couverts prend la forme d'un document complémentaire au certificat UE relatif au système de gestion de la qualité."
    6_prefix: "3.1"
    6_label: "Évaluation de la surveillance applicable aux dispositifs de classe IIa, IIb et III"
    6_desc: "Le but de la surveillance est d'assurer que le fabricant remplit correctement les obligations qui découlent du système de gestion de la qualité approuvé."
    7_prefix: "3.2"
    7_label: "Évaluation de la surveillance applicable aux dispositifs de classe IIa, IIb et III"
    7_desc: "Le fabricant autorise l'organisme notifié à effectuer tous les audits nécessaires, y compris des audits sur place, et lui fournit toutes les informations pertinentes, en particulier: \n\t— la documentation relative à son système de gestion de la qualité \n\t— la documentation relative à toute constatation et conclusion résultant de l'application du plan de surveillance après commercialisation, incluant le plan de SCAC, pour un échantillon représentatif de dispositifs, et de l'application des dispositions sur la vigilance énoncées aux articles 87 à 92 \n\t— les données prévues dans la partie du système de gestion de la qualité relative à la conception, telles que les résultats des analyses, des calculs et des essais, ainsi que les solutions retenues concernant la gestion des risques visées à l'annexe I, section 4 \n\t— les données prévues dans la partie du système de gestion de la qualité relative à la fabrication, telles que les rapports de contrôle de qualité et les données d'essais, les données d'étalonnage et les renseignements sur la qualification du personnel concerné."
    8_prefix: "3.3"
    8_label: "Évaluation de la surveillance applicable aux dispositifs de classe IIa, IIb et III"
    8_desc: "Les organismes notifiés effectuent périodiquement, au moins tous les douze mois, les audits et les évaluations appropriés pour s'assurer que le fabricant en question applique le système de gestion de la qualité approuvé et le plan de surveillance après commercialisation. Ces audits et évaluations incluent des audits dans les locaux du fabricant et, le cas échéant, des fournisseurs et/ou des sous-traitants du fabricant. Lors de ces audits sur place, l'organisme notifié effectue ou fait effectuer, s'il l'estime nécessaire, des essais pour vérifier le bon fonctionnement du système de gestion de la qualité. Il fournit au fabricant un rapport d'audit de surveillance et, si un essai a été effectué, un rapport d'essai."
    9_prefix: "3.4"
    9_label: "Évaluation de la surveillance applicable aux dispositifs de classe IIa, IIb et III"
    9_desc: "L'organisme notifié effectue de manière aléatoire, au moins une fois tous les cinq ans, des audits sur place inopinés chez le fabricant et, le cas échéant, chez les fournisseurs et/ou les sous-traitants du fabricant, audits qui peuvent être réalisés parallèlement à l'évaluation de surveillance périodique visée à la section 3.3 ou en sus de celle-ci. Pour ces audits sur place inopinés, l'organisme notifié établit un plan mais ne doit pas le communiquer au fabricant. \n\n Dans le cadre de ces audits sur place inopinés, l'organisme notifié procède à des essais sur un échantillon adéquat des dispositifs produits ou sur un échantillon adéquat issu du procédé de fabrication pour vérifier que le dispositif fabriqué est conforme à la documentation technique, sauf pour ce qui est des dispositifs visés à l'article 52, paragraphe 8, deuxième alinéa. Avant l'audit sur place inopiné, l'organisme notifié précise les critères d'échantillonnage et la procédure d'essai. \n\n Au lieu ou en plus du prélèvement d'échantillons visé au deuxième alinéa, l'organisme notifié prélève des échantillons des dispositifs sur le marché pour vérifier que le dispositif fabriqué est conforme à la documentation technique, sauf pour ce qui est des dispositifs visés à l'article 52, paragraphe 8, deuxième alinéa. Avant le prélèvement d'échantillons, l'organisme notifié en question précise les critères d'échantillonnage et la procédure d'essai. \n\n L'organisme notifié fournit au fabricant en question un rapport d'audit sur place incluant, le cas échéant, le résultat des essais auxquels ont été soumis les échantillons."
    10_prefix: "3.5"
    10_label: "Évaluation de la surveillance applicable aux dispositifs de classe IIa, IIb et III"
    10_desc: "Dans le cas des dispositifs de classe IIa ou IIb, l'évaluation de surveillance inclut également l'évaluation de la documentation technique visée aux sections 4.4 à 4.8 du ou des dispositifs concernés, sur la base d'échantillons représentatifs choisis suivant les critères établis et documentés par l'organisme notifié conformément à la section 2.3, deuxième alinéa. \n\n Dans le cas des dispositifs de classe III, l'évaluation de surveillance inclut également un essai des pièces et/ou des matériaux approuvés qui sont essentiels pour l'intégrité du dispositif et, le cas échéant, la vérification que les quantités de pièces et/ou de matériaux produits ou achetés correspondent aux quantités de dispositifs finis."
    11_prefix: "3.6"
    11_label: "Évaluation de la surveillance applicable aux dispositifs de classe IIa, IIb et III"
    11_desc: "L'organisme notifié veille à ce que la composition de l'équipe d'évaluation garantisse une expérience suffisante dans l'évaluation des dispositifs, des systèmes et des procédés concernés, une objectivité et une neutralité constantes, ce qui suppose un roulement des membres de l'équipe d'évaluation à des intervalles appropriés. En règle générale, un auditeur n'est pas responsable ou chargé des audits auprès d'un même fabricant pendant plus de trois années consécutives."
    12_prefix: "3.7"
    12_label: "Évaluation de la surveillance applicable aux dispositifs de classe IIa, IIb et III"
    12_desc: "Si l'organisme notifié constate qu'il existe une divergence entre l'échantillon prélevé parmi les dispositifs produits ou sur le marché et les spécifications définies dans la documentation technique ou la conception approuvée, il suspend ou annule le certificat correspondant ou l'assortit de restrictions."
  2:
    prefix: "Chapitre II"
    title: "Évaluation de la documentation technique"
    1_prefix: "4.1"
    1_label: "Évaluation de la documentation technique applicable aux dispositifs de classe III et aux dispositifs de classe IIb visés à l'article 52, paragraphe 4, deuxième alinéa"
    1_desc: "Outre les obligations énoncées à la section 2, le fabricant soumet à l'organisme notifié une demande d'évaluation de la documentation technique relative au dispositif qu'il prévoit de mettre sur le marché ou de mettre en service et qui est concerné par le système de gestion de la qualité visé à la section 2."
    2_prefix: "4.2"
    2_label: "Évaluation de la documentation technique applicable aux dispositifs de classe III et aux dispositifs de classe IIb visés à l'article 52, paragraphe 4, deuxième alinéa"
    2_desc: "La demande contient une description de la conception, de la fabrication et des performances du dispositif en question. Elle inclut la documentation technique visée aux annexes II et III."
    3_prefix: "4.3"
    3_label: "Évaluation de la documentation technique applicable aux dispositifs de classe III et aux dispositifs de classe IIb visés à l'article 52, paragraphe 4, deuxième alinéa"
    3_desc: "L'organisme notifié fait examiner la demande par un personnel qu'il emploie et qui possède des connaissances et une expérience attestées de la technologie concernée et de sa mise en œuvre clinique. L'organisme notifié peut exiger que la demande soit complétée en faisant réaliser des essais ou en demandant que des preuves supplémentaires soient fournies, afin de permettre l'évaluation de la conformité avec l'ensemble des exigences applicables du présent règlement. L'organisme notifié effectue les essais physiques ou les essais en laboratoire adéquats pour le dispositif ou demande au fabricant d'effectuer ces essais."
    4_prefix: "4.4"
    4_label: "Évaluation de la documentation technique applicable aux dispositifs de classe III et aux dispositifs de classe IIb visés à l'article 52, paragraphe 4, deuxième alinéa"
    4_desc: "L'organisme notifié examine les preuves cliniques présentées par le fabricant dans le rapport d'évaluation clinique et l'évaluation clinique connexe qui a été réalisée. Aux fins de cet examen, l'organisme notifié emploie des examinateurs de dispositifs qui disposent d'une expertise clinique suffisante et, au besoin, il a recours à des experts cliniques externes ayant une expérience directe et récente en rapport avec le dispositif en question ou l'état clinique dans le cadre duquel il est utilisé."
    5_prefix: "4.5"
    5_label: "Évaluation de la documentation technique applicable aux dispositifs de classe III et aux dispositifs de classe IIb visés à l'article 52, paragraphe 4, deuxième alinéa"
    5_desc: "Dans le cas où les preuves cliniques reposent, en totalité ou en partie, sur des données se rapportant à des dispositifs revendiqués comme équivalents au dispositif faisant l'objet de l'évaluation, l'organisme notifié évalue s'il est approprié d'employer ces données, compte tenu de facteurs tels que les nouvelles indications et l'innovation. L'organisme notifié documente clairement ses conclusions sur l'équivalence alléguée et sur la pertinence et la validité des données destinées à démontrer la conformité. Pour toute caractéristique du dispositif dont le fabricant fait valoir le caractère innovant ou pour les nouvelles indications, l'organisme notifié évalue dans quelle mesure ces allégations sont étayées par des données précliniques et cliniques et par l'analyse des risques."
    6_prefix: "4.6"
    6_label: "Évaluation de la documentation technique applicable aux dispositifs de classe III et aux dispositifs de classe IIb visés à l'article 52, paragraphe 4, deuxième alinéa"
    6_desc: "L'organisme notifié vérifie la validité des preuves cliniques et de l'évaluation clinique et les conclusions tirées par le fabricant quant à la conformité avec les exigences générales en matière de sécurité et de performances. Cette vérification porte sur l'examen de la pertinence de la détermination du rapport bénéfice/risque, de la gestion des risques, de la notice d'utilisation, de la formation de l'utilisateur et du plan de surveillance après commercialisation établi par le fabricant, et comporte également un examen de la nécessité et de la validité du plan de SCAC proposé, selon le cas."
    7_prefix: "4.7"
    7_label: "Évaluation de la documentation technique applicable aux dispositifs de classe III et aux dispositifs de classe IIb visés à l'article 52, paragraphe 4, deuxième alinéa"
    7_desc: "Sur la base de l'évaluation qu'il fait des preuves cliniques, l'organisme notifié analyse l'évaluation clinique et la détermination du rapport bénéfice/risque et examine s'il convient de fixer des échéances spécifiques pour lui permettre d'examiner les actualisations des preuves cliniques reposant sur les données issues de la surveillance après commercialisation et du SCAC."
    8_prefix: "4.8"
    8_label: "Évaluation de la documentation technique applicable aux dispositifs de classe III et aux dispositifs de classe IIb visés à l'article 52, paragraphe 4, deuxième alinéa"
    8_desc: "L'organisme notifié documente clairement les résultats de son évaluation dans le rapport d'évaluation sur l'évaluation clinique."
    9_prefix: "4.9"
    9_label: "Évaluation de la documentation technique applicable aux dispositifs de classe III et aux dispositifs de classe IIb visés à l'article 52, paragraphe 4, deuxième alinéa"
    9_desc: "L'organisme notifié fournit au fabricant un rapport sur l'évaluation de la documentation technique comprenant un rapport d'évaluation sur l'évaluation clinique. Si le dispositif est conforme aux dispositions pertinentes du présent règlement, l'organisme notifié délivre un certificat d'évaluation UE de la documentation technique. Le certificat contient les conclusions de l'évaluation de la documentation technique, les conditions de validité dont il est assorti, les données nécessaires à l'identification de la conception approuvée et, le cas échéant, une description de la destination du dispositif."
    10_prefix: "4.10"
    10_label: "Évaluation de la documentation technique applicable aux dispositifs de classe III et aux dispositifs de classe IIb visés à l'article 52, paragraphe 4, deuxième alinéa"
    10_desc: "Les modifications du dispositif approuvé requièrent une approbation complémentaire par l'organisme notifié qui a délivré le certificat d'évaluation UE de la documentation technique si elles sont susceptibles de remettre en cause la sécurité et les performances du dispositif ou les conditions prescrites pour l'utilisation du dispositif. Lorsque le fabricant envisage une modification de ce type, il en informe l'organisme notifié qui a délivré le certificat d'évaluation UE de la documentation technique. L'organisme notifié évalue les modifications envisagées et décide si celles-ci exigent une nouvelle évaluation de la conformité conformément à l'article 52 ou si elles peuvent faire l'objet d'un document complémentaire au certificat d'évaluation UE de la documentation technique. Dans ce dernier cas, l'organisme notifié évalue les modifications, informe le fabricant de sa décision et, lorsque les modifications sont approuvées, lui fournit un document complémentaire au certificat d'évaluation UE de la documentation technique."
    11_prefix: "5.1"
    11_label: "Procédures spéciales complémentaires - Procédure d'évaluation pour certains dispositifs des classes III et IIb"
    11_desc: "\ta. Pour les dispositifs implantables de classe III et pour les dispositifs actifs de classe IIb destinés à administrer dans l'organisme et/ou à retirer de l'organisme un médicament, tels qu'ils sont visés à l'annexe VIII, section 6.4 (règle 12), l'organisme notifié, après avoir vérifié la qualité des données cliniques à l'appui du rapport sur l'évaluation clinique établi par le fabricant et visé à l'article 61, paragraphe 12, établit un rapport d'évaluation sur l'évaluation clinique exposant ses conclusions concernant les preuves cliniques fournies par le fabricant, notamment à propos de la détermination du rapport bénéfice/risque, de la cohérence entre ces preuves et la destination du dispositif, y compris la ou les indications médicales, et du plan de SCAC visé à l'article 10, paragraphe 3, et à l'annexe XIV, partie B. \n\n L'organisme notifié transmet à la Commission son rapport d'évaluation sur l'évaluation clinique ainsi que la documentation relative à l'évaluation clinique faite par le fabricant, visée à l'annexe II, section 6.1, points c) et d). \n\n La Commission transmet aussitôt ces documents au groupe d'experts concerné visé à l'article 106. \n\tb. L'organisme notifié peut être invité à présenter au groupe d'experts concerné ses conclusions visées au point a). \n\tc. Le groupe d'experts décide, sous le contrôle de la Commission et sur la base de l'ensemble des critères suivants: \n\t\ti. la nouveauté du dispositif ou de la procédure clinique afférente concernée et ses éventuelles incidences cliniques ou sanitaires majeures; \n\t\tii. une dégradation significative du rapport bénéfice/risque d'une catégorie ou d'un groupe spécifique de dispositifs, liée à des préoccupations scientifiquement valables du point de vue de la santé, concernant certains composants ou matériaux de base ou l'incidence sur la santé en cas de défaillance du dispositif; \n\t\tiii. une augmentation significative du nombre d'incidents graves notifiés conformément à l'article 87 concernant une catégorie ou un groupe spécifique de dispositifs, \n\n de l'opportunité d'émettre un avis scientifique sur le rapport d'évaluation sur l'évaluation clinique établi par l'organisme notifié sur la base des preuves cliniques fournies par le fabricant, notamment à propos de la détermination du rapport bénéfice/risque, de la cohérence entre ces preuves et la ou les indications médicales et du plan de SCAC. Cet avis scientifique est rendu dans un délai de soixante jours à compter de la réception des documents transmis par la Commission conformément au point a). Les motifs ayant présidé à la décision d'émettre un avis scientifique sur la base des critères énumérés aux points i), ii et iii) sont exposés dans l'avis scientifique. Si les informations présentées ne sont pas suffisantes pour permettre au groupe d'experts de tirer des conclusions, l'avis scientifique en fait état. \n\td. Le groupe d'experts peut décider, sous le contrôle de la Commission et sur la base des critères énumérés au point c), de ne pas émettre d'avis scientifique, auquel cas il informe l'organisme notifié dans les plus brefs délais et en tout état de cause dans un délai de vingt et un jours suivant la réception des documents visés au point a) transmis par la Commission. Dans ce délai, le groupe d'experts expose à l'organisme notifié et à la Commission les raisons de sa décision, à la suite de quoi l'organisme notifié peut engager la procédure de certification du dispositif. \n\te. Dans un délai de vingt et un jours suivant la réception des documents transmis par la Commission, le groupe d'experts notifie à celle-ci, via Eudamed, s'il entend émettre un avis scientifique conformément au point c) ou s'il entend ne pas en émettre conformément au point d). \n\tf. En l'absence d'avis dans un délai de soixante jours, l'organisme notifié peut engager la procédure de certification du dispositif en question. \n\tg. L'organisme notifié prend dûment en considération les vues exprimées dans l'avis scientifique du groupe d'experts. Si le groupe d'experts conclut que le niveau de preuves cliniques n'est pas suffisant ou suscite, pour d'autres raisons, des inquiétudes quant à la détermination du rapport bénéfice/risque, à la cohérence entre ces preuves et la destination du dispositif, y compris la ou les indications médicales, et le plan de SCAC, l'organisme notifié conseille, au besoin, au fabricant de restreindre la destination du dispositif à certains groupes de patients ou à certaines indications médicales, et/ou d'imposer une limite de la durée de validité du certificat, d'entreprendre certaines études de suivi clinique après commercialisation, d'adapter la notice d'utilisation ou le résumé des caractéristiques de sécurité et des performances ou d'imposer d'autres restrictions dans son rapport sur l'évaluation de la conformité, le cas échéant. Au cas où il ne suit pas l'avis du groupe d'experts, l'organisme notifié le justifie pleinement dans son rapport sur l'évaluation de la conformité et la Commission, sans préjudice de l'article 109, met l'avis scientifique du groupe d'experts et la justification écrite fournie par l'organisme notifié à la disposition du public via Eudamed. \n\th. Avant le 26 mai 2020, la Commission, après avoir consulté les États membres et les experts scientifiques concernés, fournit des orientations à l'intention des groupes d'experts en vue d'une interprétation cohérente des critères énumérés au point c)."
    12_prefix: "5.2"
    12_label: "Procédures spéciales complémentaires - Procédure pour les dispositifs incorporant une substance médicamenteuse"
    12_desc: "\ta. Lorsqu'un dispositif incorpore comme partie intégrante une substance qui, utilisée séparément, est susceptible d'être considérée comme un médicament au sens de l'article 1er, point 2), de la directive 2001/83/CE, y compris un médicament dérivé du sang ou du plasma humain, et dont l'action est accessoire à celle du dispositif, la qualité, la sécurité et l'utilité de cette substance sont vérifiées par analogie avec les méthodes prévues à l'annexe I de la directive 2001/83/CE. \n\tb. Avant de délivrer un certificat d'évaluation UE de la documentation technique, l'organisme notifié, après avoir vérifié l'utilité de la substance en tant que partie du dispositif et en tenant compte de la destination du dispositif, demande à l'une des autorités compétentes désignées par les États membres conformément à la directive 2001/83/CE ou à l'EMA, l'une ou l'autre ci-après dénommée l'«autorité des médicaments consultée» dans la présente section, en fonction de celle qui a été consultée conformément au présent point, un avis scientifique sur la qualité et la sécurité de la substance, y compris sur le bénéfice ou le risque lié à l'incorporation de la substance dans le dispositif. Lorsque le dispositif incorpore un dérivé de sang ou de plasma humain ou une substance qui, utilisée séparément, est susceptible d'être considérée comme un médicament relevant exclusivement du champ d'application de l'annexe du règlement (CE) no 726/2004, l'organisme notifié demande l'avis de l'EMA. \n\tc. En formulant son avis, l'autorité des médicaments consultée tient compte du procédé de fabrication et des données relatives à l'utilité de l'incorporation de la substance dans le dispositif telle qu'elle a été déterminée par l'organisme notifié. \n\td. L'autorité des médicaments consultée rend son avis dans un délai de deux cent dix jours à compter de la réception de l'ensemble de la documentation nécessaire. \n\te. L'avis scientifique de l'autorité des médicaments consultée, ainsi que toute mise à jour éventuelle dudit avis, sont inclus dans la documentation de l'organisme notifié concernant le dispositif. En arrêtant sa décision, l'organisme notifié prend dûment en considération les vues exprimées dans l'avis scientifique. L'organisme notifié ne délivre pas le certificat si l'avis scientifique est défavorable et il fait part de sa décision finale à l'autorité des médicaments consultée. \n\tf. Avant d'apporter une quelconque modification affectant une substance accessoire incorporée dans un dispositif médical, en particulier concernant son procédé de fabrication, le fabricant informe l'organisme notifié des modifications. Ledit organisme notifié demande l'avis de l'autorité des médicaments consultée afin d'obtenir la confirmation que la qualité et la sécurité de la substance accessoire demeurent inchangées. L'autorité des médicaments consultée prend en considération les données relatives à l'utilité de l'incorporation de la substance dans le dispositif telle qu'elle a été déterminée par l'organisme notifié afin de garantir que les modifications n'ont pas d'incidence négative sur le risque ou le bénéfice précédemment établis concernant l'incorporation de la substance dans le dispositif. L'autorité des médicaments consultée rend son avis dans un délai de soixante jours à compter de la réception de l'ensemble de la documentation nécessaire concernant les modifications. L'organisme notifié ne délivre pas le document complémentaire au certificat d'évaluation UE de la documentation technique si l'avis scientifique rendu par l'autorité des médicaments consultée est défavorable. L'organisme notifié fait part de sa décision finale à l'autorité des médicaments consultée. \n\tg. Si l'autorité des médicaments consultée obtient des informations sur la substance accessoire susceptibles d'avoir une incidence sur le risque ou le bénéfice précédemment établis concernant l'incorporation de la substance dans le dispositif, elle donne un avis à l'organisme notifié sur le fait de savoir si les informations en question ont une incidence sur le risque ou le bénéfice précédemment établis concernant l'incorporation de la substance dans le dispositif. L'organisme notifié prend en compte cet avis et reconsidère son évaluation de la procédure d'évaluation de la conformité."
    13_prefix: "5.3.1"
    13_label: "Procédure pour les dispositifs fabriqués en utilisant ou en incorporant des tissus ou des cellules d'origine humaine ou animale, ou leurs dérivés, qui sont non viables ou rendus non viables - Tissus ou cellules d'origine humaine ou leurs dérivés"
    13_desc: "\ta. Pour les dispositifs fabriqués à partir de dérivés de tissus ou de cellules d'origine humaine relevant du présent règlement conformément à l'article 1er, paragraphe 6, point g), et pour les dispositifs incorporant comme partie intégrante des tissus ou des cellules d'origine humaine, ou leurs dérivés, relevant de la directive 2004/23/CE, dont l'action est accessoire à celle des dispositifs, avant de délivrer un certificat d'évaluation UE de la documentation technique, l'organisme notifié demande un avis scientifique à l'une des autorités compétentes désignées par les États membres conformément à la directive 2004/23/CE (ci-après dénommée «autorité compétente en matière de tissus et cellules humains») sur les aspects en rapport avec le don, l'obtention et le contrôle des tissus ou cellules d'origine humaine, ou de leurs dérivés. L'organisme notifié soumet un résumé de l'évaluation préliminaire de la conformité fournissant, entre autres, les informations relatives à la non-viabilité des tissus ou des cellules humains en question, au don, à l'obtention et au contrôle ainsi qu'au risque ou au bénéfice découlant de l'incorporation des tissus ou des cellules d'origine humaine, ou de leurs dérivés, dans le dispositif. \n\tb. Dans un délai de cent-vingt jours à compter de la réception de l'ensemble de la documentation nécessaire, l'autorité compétente en matière de tissus et cellules humains communique son avis à l'organisme notifié. \n\tc. L'avis scientifique de l'autorité compétente en matière de tissus et cellules humains et toute mise à jour éventuelle sont inclus dans la documentation de l'organisme notifié concernant le dispositif. En arrêtant sa décision, l'organisme notifié prend dûment en considération les vues exprimées dans l'avis scientifique de l'autorité compétente en matière de tissus et cellules humains. L'organisme notifié ne délivre pas le certificat si cet avis scientifique est défavorable. Il fait part de sa décision finale à l'autorité compétente en matière de tissus et cellules humains concernée. \n\td. Avant d'apporter une quelconque modification affectant des tissus ou des cellules d'origine humaine non viables, ou leurs dérivés, incorporés dans un dispositif, en particulier concernant leur don ou leur obtention et le contrôle réalisé, le fabricant informe l'organisme notifié des modifications envisagées. L'organisme notifié consulte l'autorité qui a participé à la consultation initiale afin d'obtenir la confirmation du maintien de la qualité et de la sécurité des tissus ou des cellules d'origine humaine, ou de leurs dérivés, incorporés dans le dispositif. L'autorité compétente concernée en matière de tissus ou cellules d'origine humaine prend en considération les données relatives à l'utilité de l'incorporation des tissus ou des cellules d'origine humaine, ou de leurs dérivés, dans le dispositif telle qu'elle a été déterminée par l'organisme notifié afin de garantir que les modifications n'ont pas d'incidence négative sur le rapport bénéfice/risque de l'ajout des tissus ou des cellules d'origine humaine, ou de leurs dérivés, au dispositif qui a été établi. Elle rend son avis dans un délai de soixante jours à compter de la réception de l'ensemble de la documentation nécessaire concernant les modifications envisagées. L'organisme notifié ne délivre pas le document complémentaire au certificat d'évaluation UE de la documentation technique si l'avis scientifique est défavorable et il fait part de sa décision finale à l'autorité compétente concernée en matière de tissus ou cellules d'origine humaine."
    14_prefix: "5.3.2"
    14_label: "Procédure pour les dispositifs fabriqués en utilisant ou en incorporant des tissus ou des cellules d'origine humaine ou animale, ou leurs dérivés, qui sont non viables ou rendus non viables - Tissus ou cellules d'origine animale ou leurs dérivés"
    14_desc: "Dans le cas des dispositifs fabriqués à partir de tissus d'origine animale rendus non viables ou de produits non viables dérivés de tissus d'origine animale visés par le règlement (UE) no 722/2012, l'organisme notifié applique les critères pertinents énoncés dans ledit règlement."
    15_prefix: "5.4"
    15_label: "Procédure pour les dispositifs composés de substances ou de combinaisons de substances qui sont absorbées par le corps humain ou dispersées localement dans celui-ci"
    15_desc: "\ta. La qualité et la sécurité des dispositifs qui sont composés de substances ou de combinaisons de substances qui sont destinées à être introduites dans le corps humain par un orifice du corps ou par application sur la peau et qui sont absorbées par le corps humain ou dispersées localement dans celui-ci, sont vérifiées, le cas échéant, uniquement pour ce qui est des exigences ne relevant pas du présent règlement, conformément aux exigences applicables établies à l'annexe I de la directive 2001/83/CE, en ce qui concerne l'absorption, la distribution, le métabolisme, l'excrétion, la tolérance locale, la toxicité, les interactions avec d'autres dispositifs, médicaments ou substances et les risques d'effets indésirables. \n\tb. En outre, pour les dispositifs ou les produits de leur métabolisme dont la destination exige l'absorption systémique par le corps humain, l'organisme notifié demande à l'une des autorités compétentes désignées par les États membres conformément à la directive 2001/83/CE ou à l'EMA, l'une ou l'autre ci-après dénommée l'«autorité des médicaments consultée» dans la présente section, en fonction de celle qui a été consultée conformément au présent point, un avis scientifique sur la conformité du dispositif avec les exigences applicables établies à l'annexe I de la directive 2001/83/CE. \n\tc. L'avis de l'autorité des médicaments consultée est formulé dans un délai de cent cinquante jours après réception de l'ensemble de la documentation nécessaire. \n\td. L'avis scientifique de l'autorité des médicaments consultée, ainsi que toute mise à jour éventuelle, sont inclus dans la documentation de l'organisme notifié concernant le dispositif. En arrêtant sa décision, l'organisme notifié prend dûment en considération les vues exprimées dans l'avis scientifique et il fait part de sa décision finale à l'autorité des médicaments consultée."
    16_prefix: "6"
    16_label: "Vérification du lot pour les dispositifs incorporant comme partie intégrante une substance médicamenteuse qui, utilisée séparément, serait considérée comme un médicament dérivé du sang ou du plasma humain visé à l'article 1er, paragraphe 8"
    16_desc: "Au terme de la fabrication de chaque lot de dispositifs incorporant comme partie intégrante une substance médicamenteuse qui, utilisée séparément, serait considérée comme un médicament dérivé du sang ou du plasma humain visé à l'article 1er, paragraphe 8, premier alinéa, du présent règlement, le fabricant informe l'organisme notifié de la libération du lot de dispositifs et lui transmet le certificat officiel de libération du lot de la substance dérivée du sang ou du plasma humain utilisée dans le dispositif, délivré par un laboratoire d'un État membre ou un laboratoire désigné à cet effet par un État membre, conformément à l'article 114, paragraphe 2, de la directive 2001/83/CE."
  3:
    prefix: "Chapitre III"
    title: "Dispositions administratives"
    1_prefix: "7"
    1_label: "Le fabricant ou, lorsque le fabricant ne dispose pas d'un siège social dans un État membre, son mandataire tient à la disposition des autorités compétentes, pendant une période expirant au plus tôt dix ans après la mise sur le marché du dernier dispositif, et dans le cas de dispositifs implantables, au plus tôt quinze ans après:"
    1_desc: "\t— la déclaration de conformité UE, \n\t— la documentation visée à la section 2.1, cinquième tiret, notamment les données et les enregistrements résultant des procédures visées à la section 2.2, point c), deuxième alinéa, \n\t— les informations relatives aux modifications visées à la section 2.4, \n\t— la documentation visée à la section 4.2, et \n\t— les décisions et rapports de l'organisme notifié visés à la présente annexe."
    2_prefix: "8"
    2_label: "Chaque État membre exige que la documentation visée à la section 7 soit tenue à la disposition des autorités compétentes pendant la période indiquée à ladite section si un fabricant, ou son mandataire, établi sur son territoire fait faillite ou met fin à son activité commerciale avant la fin de cette période."
20:
  prefix: "Annexe X"
  title: "Évaluation de la conformité sur la base de l'examen de type"
  1_prefix: "1"
  1_label: "L'examen UE de type est la procédure par laquelle un organisme notifié constate et atteste qu'un dispositif, y compris sa documentation technique et les processus du cycle de vie pertinents ainsi qu'un échantillon représentatif correspondant de la production de dispositifs envisagée, satisfait aux dispositions pertinentes du présent règlement."
  2_prefix: "2"
  2_label: "Demande"
  2_desc: "Le fabricant présente une demande d'évaluation auprès d'un organisme notifié. La demande comprend: \n\t— le nom du fabricant et l'adresse du siège social du fabricant et, si la demande est présentée par le mandataire, le nom du mandataire et l'adresse de son siège social \n\t— la documentation technique visée aux annexes II et III. Le demandeur met un échantillon représentatif des dispositifs produits envisagés (ci-après dénommé «type») à la disposition de l'organisme notifié. L'organisme notifié peut au besoin demander d'autres échantillons, ainsi qu \n\t— une déclaration écrite spécifiant qu'aucune demande portant sur le même type n'a été introduite auprès d'un autre organisme notifié, ou des informations concernant toute demande précédente portant sur le même type qui a été refusée par un autre organisme notifié ou qui a été retirée par le fabricant ou son mandataire avant que l'autre organisme notifié n'ait mené à bien l'évaluation."
  3_prefix: "3"
  3_label: "Évaluation"
  3_desc: "L'organisme notifié: \n\ta. fait examiner la demande par un personnel qui possède des connaissances et une expérience attestées de la technologie concernée et de la mise en œuvre clinique de ladite technologie. L'organisme notifié peut exiger que la demande soit complétée en faisant réaliser des essais supplémentaires ou en demandant que soient fournies des preuves supplémentaires, afin de permettre l'évaluation de la conformité avec l'ensemble des exigences applicables du présent règlement. L'organisme notifié effectue les essais physiques ou les essais en laboratoire adéquats pour le dispositif ou demande au fabricant d'effectuer ces essais; \n\tb. examine et évalue la documentation technique aux fins de la conformité avec les exigences du présent règlement qui sont applicables au dispositif et vérifie que le type a été fabriqué en conformité avec cette documentation. Il établit également un relevé des éléments qui ont été conçus conformément aux normes applicables visées à l'article 8 ou aux spécifications communes applicables, et un relevé des éléments pour lesquels la conception ne s'appuie pas sur les normes pertinentes visées à l'article 8 ou sur les spécifications communes pertinentes; \n\tc. examine les preuves cliniques présentées par le fabricant dans le rapport sur l'évaluation clinique conformément à l'annexe XIV, section 4. Aux fins de cet examen, l'organisme notifié emploie des examinateurs de dispositifs qui disposent d'une expertise clinique suffisante, et, au besoin, il recourt à des experts cliniques externes ayant une expérience directe et récente en rapport avec le dispositif en question ou l'état clinique dans le cadre duquel il est utilisé; \n\td. évalue, dans le cas où les preuves cliniques reposent partiellement ou totalement sur des données provenant de dispositifs revendiqués comme similaires ou équivalents au dispositif faisant l'objet de l'évaluation, s'il convient d'utiliser ces données, compte tenu de facteurs tels que les nouvelles indications et l'innovation. L'organisme notifié documente clairement ses conclusions sur l'équivalence alléguée et sur la pertinence et la validité des données pour ce qui est de démontrer la conformité; \n\te. documente clairement les résultats de son évaluation dans un rapport d'évaluation sur l'évaluation préclinique et clinique dans le cadre du rapport d'examen UE de type visé au point i); \n\tf. effectue ou fait effectuer les évaluations appropriées ainsi que les essais physiques et les essais en laboratoire nécessaires pour vérifier si les solutions retenues par le fabricant satisfont aux exigences générales en matière de sécurité et de performances énoncées dans le présent règlement au cas où les normes visées à l'article 8 ou les spécifications communes n'auraient pas été appliquées. Lorsque le dispositif doit être raccordé à un ou plusieurs autres dispositifs pour pouvoir fonctionner comme prévu, il convient d'apporter la preuve qu'il satisfait aux exigences générales en matière de sécurité et de performances lorsqu'il est raccordé à ce ou ces dispositifs ayant les caractéristiques indiquées par le fabricant; \n\tg. effectue ou fait effectuer les évaluations appropriées ainsi que les essais physiques et les essais en laboratoire nécessaires pour vérifier, au cas où le fabricant a choisi d'appliquer les normes harmonisées pertinentes, si ces normes ont réellement été appliquées; \n\th. convient avec le demandeur de l'endroit où les évaluations et les essais nécessaires doivent être effectués; et \n\ti. établit un rapport d'examen UE de type exposant les résultats des évaluations et des essais effectués en application des points a) à g)."
  4_prefix: "4"
  4_label: "Certificat"
  4_desc: "Si le type est conforme au présent règlement, l'organisme notifié délivre un certificat d'examen UE de type. Le certificat comporte le nom et l'adresse du fabricant, les conclusions de l'évaluation de l'examen de type, les conditions de validité du certificat et les données nécessaires à l'identification du type approuvé. Le certificat est établi conformément à l'annexe XII. Les parties pertinentes de la documentation sont annexées au certificat et une copie est conservée par l'organisme notifié."
  5:
    prefix: "5"
    title: "Modifications du type"
    1_prefix: "5.1"
    1_label: "Le demandeur informe l'organisme notifié qui a délivré le certificat d'examen UE de type de toute modification prévue du type approuvé, de sa destination et des conditions d'utilisation."
    2_prefix: "5.2"
    2_desc: "Les modifications du dispositif approuvé, y compris la limitation de sa destination ou des conditions d'utilisation, requièrent une approbation par l'organisme notifié qui a délivré le certificat d'examen UE de type si elles sont susceptibles de remettre en cause la conformité avec les exigences générales en matière de sécurité et de performances ou les conditions prescrites pour l'utilisation du produit. L'organisme notifié examine les modifications envisagées, informe le fabricant de sa décision et lui fournit un document complémentaire au rapport d'examen UE de type. L'approbation de toute modification du type approuvé prend la forme d'un document complémentaire au certificat d'examen UE de type."
    3_prefix: "5.3"
    3_label: "Les modifications de la destination ou des conditions d'utilisation du dispositif approuvé, sauf s'il s'agit d'une limitation de la destination ou des conditions d'utilisation, nécessitent une nouvelle demande d'évaluation de la conformité."
  6_prefix: "6"
  6_label: "Procédures spéciales complémentaires"
  6_desc: "L'annexe IX, section 5, s'applique à condition que toute référence à un certificat d'évaluation UE de la documentation technique soit entendue comme une référence à un certificat d'examen UE de type."
  7_prefix: "7"
  7_label: "Dispositions administratives"
  7_desc: "Le fabricant ou, lorsque le fabricant ne dispose pas d'un siège social dans un État membre, son mandataire, tient à la disposition des autorités compétentes, pendant une période expirant au plus tôt dix ans après la mise sur le marché du dernier dispositif, et dans le cas de dispositifs implantables, au plus tôt quinze ans après: \n\t— la documentation visée à la section 2, deuxième tiret \n\t— les informations relatives aux modifications visées à la section 5, e \n\t— des copies des certificats d'examen UE de type, des avis scientifiques et des rapports ainsi que de leurs ajouts/documents complémentaires. \n\n L'annexe IX, section 8, s'applique."
21:
  prefix: "Annexe XI"
  title: "Évaluation de la conformité sur la base de la vérification de la conformité du produit"
  desc: "ÉVALUATION DE LA CONFORMITÉ SUR LA BASE DE LA VÉRIFICATION DE LA CONFORMITÉ DU PRODUIT \n\n\t1. L'objectif de l'évaluation de la conformité sur la base de la vérification de la conformité du produit est d'assurer que les dispositifs sont conformes au type pour lequel un certificat d'examen UE de type a été délivré et qu'ils satisfont aux dispositions du présent règlement qui leur sont applicables \n\n\t2. Lorsqu'un certificat d'examen UE de type a été délivré conformément à l'annexe X, le fabricant peut appliquer la procédure prévue à la partie A (assurance de la qualité de la production) ou la procédure prévue à la partie B (vérification du produit) de la présente annexe \n\n\t3. Par dérogation aux sections 1 et 2 ci-dessus, les procédures prévues à la présente annexe peuvent également être appliquées par les fabricants de dispositifs de classe IIa, parallèlement à l'établissement d'une documentation technique telle que définie aux annexes II et III."
  1_prefix: "Partie A.4"
  1_label: "Le fabricant veille à la mise en œuvre du système de gestion de la qualité approuvé pour la fabrication des dispositifs concernés, effectue la vérification finale, comme prévu à la section 6, et est soumis à la surveillance visée à la section 7."
  2_prefix: "Partie A.5"
  2_desc: "Si le fabricant respecte les obligations définies à la section 4, il établit et conserve une déclaration de conformité UE conformément à l'article 19 et à l'annexe IV pour le dispositif concerné par la procédure d'évaluation de la conformité. En délivrant une déclaration de conformité UE, le fabricant est réputé assurer et déclarer que le dispositif concerné est conforme au type décrit dans le certificat d'examen UE de type et satisfait aux exigences du présent règlement applicables audit dispositif."
  3:
    prefix: "Partie A.6"
    title: "Système de gestion de la qualité"
    1_prefix: "Partie A.6.1"
    1_label: "Le fabricant soumet une demande d'évaluation de son système de gestion de la qualité à un organisme notifié. La demande comprend:"
    1_desc: "\t— tous les éléments énumérés à l'annexe IX, section 2.1 \n\t— la documentation technique visée aux annexes II et III pour les types approuvés, e \n\t— une copie des certificats d'examen UE de type visés à l'annexe X, section 4. Si les certificats d'examen UE de type ont été délivrés par le même organisme notifié que celui auprès duquel la demande est introduite, la référence de la documentation technique et de ses actualisations ainsi que des certificats délivrés est également mentionnée dans la demande."
    2_prefix: "Partie A.6.2"
    2_desc: "L'application du système de gestion de la qualité permet de garantir la conformité avec le type décrit dans le certificat d'examen UE de type et avec les dispositions du présent règlement qui sont applicables aux dispositifs à chaque étape. L'ensemble des éléments, des exigences et des dispositions adoptés par le fabricant pour son système de gestion de la qualité figurent dans une documentation tenue de manière systématique et ordonnée sous la forme d'un manuel de la qualité et de politiques et de procédures écrites, telles que des programmes, des plans et des enregistrements relatifs à la qualité. \n\n Cette documentation comprend notamment une description adéquate de tous les éléments énumérés à l'annexe IX, section 2.2, points a), b), d) et e)."
    3_prefix: "Partie A.6.3"
    3_desc: "L'annexe IX, section 2.3, premier et deuxième alinéas, s'applique. \n\n Si le système de gestion de la qualité est de nature à garantir que les dispositifs sont conformes au type décrit dans le certificat d'examen UE de type et aux dispositions pertinentes du présent règlement, l'organisme notifié délivre un certificat UE d'assurance de la qualité. L'organisme notifié informe le fabricant de sa décision de délivrer le certificat. Ladite décision contient les conclusions de l'audit de l'organisme notifié et une évaluation motivée."
    4_prefix: "Partie A.6.4"
    4_label: "L'annexe IX, section 2.4, s'applique."
  4_prefix: "Partie A.7"
  4_label: "Surveillance"
  4_desc: "L'annexe IX, section 3.1, section 3.2, premier, deuxième et quatrième tirets, sections 3.3, 3.4, 3.6 et 3.7, s'applique. \n\n Dans le cas des dispositifs de classe III, la surveillance inclut également une vérification que les quantités de matières premières ou de composants essentiels produites ou achetées approuvées pour le type correspondent aux quantités de dispositifs finis."
  5_prefix: "Partie A.8"
  5_desc: "Vérification du lot pour les dispositifs incorporant comme partie intégrante une substance médicamenteuse qui, utilisée séparément, serait considérée comme un médicament dérivé du sang ou du plasma humain visé à l'article 1er, paragraphe 8 \n\n Au terme de la fabrication de chaque lot de dispositifs incorporant comme partie intégrante une substance médicamenteuse qui, utilisée séparément, serait considérée comme un médicament dérivé du sang ou du plasma humain visé à l'article 1er, paragraphe 8, premier alinéa, du présent règlement, le fabricant informe l'organisme notifié de la libération du lot de dispositifs et lui transmet le certificat officiel de libération du lot de la substance dérivée du sang ou du plasma humain utilisée dans le dispositif, délivré par un laboratoire d'un État membre ou un laboratoire désigné à cet effet par un État membre, conformément à l'article 114, paragraphe 2, de la directive 2001/83/CE."
  6_prefix: "Partie A.9"
  6_label: "Dispositions administratives"
  6_desc: "Le fabricant ou, lorsque le fabricant ne dispose pas d'un siège social dans un État membre, son mandataire, tient à la disposition des autorités compétentes, pendant une période expirant au plus tôt dix ans après la mise sur le marché du dernier dispositif, et dans le cas de dispositifs implantables, au plus tôt quinze ans après: \n\t— la déclaration de conformité UE, \n\t— la documentation visée à l'annexe IX, section 2.1, cinquième tiret, \n\t— la documentation visée à l'annexe IX, section 2.1, huitième tiret, y compris le certificat d'examen UE de type visé à l'annexe X, \n\t— les informations relatives aux modifications visées à l'annexe IX, section 2.4, et \n\t— les décisions et rapports de l'organisme notifié visés à l'annexe IX, sections 2.3, 3.3 et 3.4. \n\n L'annexe IX, section 8, s'applique."
  7:
    prefix: "Partie A.10"
    title: "Application aux dispositifs de classe IIa"
    1_prefix: "Partie A.10.1"
    1_label: "Par dérogation à la section 5 de la présente annexe, le fabricant est réputé assurer et déclarer par la déclaration de conformité UE que les dispositifs de classe IIa en question sont fabriqués conformément à la documentation technique visée aux annexes II et III et satisfont aux exigences du présent règlement qui leur sont applicables."
    2_prefix: "Partie A.10.2"
    2_desc: "Pour les dispositifs de classe IIa, l'organisme notifié évalue, dans le cadre de l'évaluation visée à la section 6.3 de la présente annexe, si la documentation technique visée aux annexes II et III pour les dispositifs sélectionnés sur une base représentative sont conformes aux dispositions du présent règlement. \n\n Pour sélectionner un ou des échantillons représentatifs des dispositifs, l'organisme notifié tient compte de la nouveauté de la technologie, des similitudes dans la conception, la technologie, la fabrication et les méthodes de stérilisation, de l'utilisation prévue et des résultats de toute évaluation antérieure pertinente (concernant, par exemple, les propriétés physiques, chimiques, biologiques ou cliniques) réalisée conformément au présent règlement. L'organisme notifié établit un dossier justifiant le choix du ou des échantillons de dispositifs."
    3_prefix: "Partie A.10.3"
    3_label: "Lorsque l'évaluation visée à la section 10.2 de la présente annexe confirme que les dispositifs de classe IIa en question sont conformes à la documentation technique visée aux annexes II et III et satisfont aux exigences du présent règlement qui leur sont applicables, l'organisme notifié délivre un certificat au titre de la présente partie de la présente annexe."
    4_prefix: "Partie A.10.4"
    4_label: "Des échantillons supplémentaires par rapport à ceux pris pour l'évaluation initiale de la conformité des dispositifs sont évalués par l'organisme notifié dans le cadre de l'évaluation de surveillance visée à la section 7."
    5_prefix: "Partie A.10.5"
    5_label: "Par dérogation à la section 6 de la présente annexe, le fabricant, ou son mandataire, tient à la disposition des autorités compétentes, pendant une période expirant au plus tôt dix ans après la mise sur le marché du dernier dispositif:"
    5_desc: "\t— la déclaration de conformité UE, \n\t— la documentation technique visée aux annexes II et III, et \n\t— le certificat visé à la section 10.3 de la présente annexe. \n\n L'annexe IX, section 8, s'applique."
  8_prefix: "Partie B.11"
  8_desc: "La vérification du produit s'entend comme la procédure par laquelle, après avoir contrôlé chaque dispositif fabriqué, le fabricant, en délivrant une déclaration de conformité UE conformément à l'article 19 et à l'annexe IV, est réputé assurer et déclarer que les dispositifs ayant fait l'objet de la procédure établie aux sections 14 et 15 de la présente annexe sont conformes au type décrit dans le certificat d'examen UE de type et satisfont aux exigences du présent règlement qui leur sont applicables, y compris les processus continus du cycle de vie."
  9_prefix: "Partie B.12"
  9_desc: "Le fabricant prend toutes les mesures nécessaires pour que le procédé de fabrication assure la conformité des dispositifs avec le type décrit dans le certificat d'examen UE de type et avec les exigences du présent règlement qui leur sont applicables. Il établit, avant le début de la fabrication, une documentation définissant les procédés de fabrication, en particulier, le cas échéant, en matière de stérilisation, ainsi que l'ensemble des procédures préétablies qui seront appliquées systématiquement pour assurer l'homogénéité de la production et, le cas échéant, la conformité des dispositifs avec le type décrit dans le certificat d'examen UE de type et avec les exigences du présent règlement qui leur sont applicables. \n\n En outre, dans le cas des dispositifs mis sur le marché à l'état stérile, et pour les seuls aspects de la fabrication liés à l'obtention et au maintien de l'état stérile, le fabricant applique les dispositions des sections 6 et 7."
  10_prefix: "Partie B.13"
  10_label: "Le fabricant s'engage à mettre en place et à tenir à jour un plan de surveillance après commercialisation, incluant un plan de SCAC, et les procédures garantissant le respect des obligations du fabricant découlant des dispositions relatives à la vigilance et au système de surveillance après commercialisation établies au chapitre VII."
  11_prefix: "Partie B.14"
  11_label: "L'organisme notifié effectue les examens et les essais appropriés afin de vérifier la conformité du dispositif avec les exigences du présent règlement en contrôlant et en essayant chaque produit conformément à la section 15. \n\n Les examens et les essais visés au premier alinéa de la présente section ne s'appliquent pas en ce qui concerne les aspects de fabrication ayant trait à l'obtention de la stérilité."
  12:
    prefix: "Partie B.15"
    title: "Vérification par contrôle et essai de chaque produit"
    1_prefix: "Partie B.15.1"
    1_label: "Chaque dispositif est examiné individuellement et les essais physiques ou les essais en laboratoire appropriés, définis dans la ou les normes applicables visées à l'article 8, ou des essais et évaluations équivalents sont effectués afin de vérifier, le cas échéant, la conformité des dispositifs avec le type décrit dans le certificat d'examen UE de type et avec les exigences du présent règlement qui leur sont applicables."
    2_prefix: "Partie B.15.2"
    2_label: "L'organisme notifié appose ou fait apposer son numéro d'identification sur chaque dispositif approuvé et établit un certificat UE de vérification du produit en rapport avec les essais et évaluations effectués."
  13_prefix: "Partie B.16"
  13_desc: "Vérification du lot pour les dispositifs incorporant comme partie intégrante une substance médicamenteuse qui, utilisée séparément, serait considérée comme un médicament dérivé du sang ou du plasma humain visé à l'article 1er, paragraphe 8 \n\n Au terme de la fabrication de chaque lot de dispositifs incorporant comme partie intégrante une substance médicamenteuse qui, utilisée séparément, serait considérée comme un médicament dérivé du sang ou du plasma humain visé à l'article 1er, paragraphe 8, premier alinéa, du présent règlement, le fabricant informe l'organisme notifié de la libération du lot de dispositifs et lui transmet le certificat officiel de libération du lot de la substance dérivée du sang ou du plasma humain utilisée dans le dispositif, délivré par un laboratoire d'un État membre ou un laboratoire désigné à cet effet par un État membre, conformément à l'article 114, paragraphe 2, de la directive 2001/83/CE."
  14_prefix: "Partie B.17"
  14_label: "Dispositions administratives"
  14_desc: "Le fabricant, ou son mandataire, tient à la disposition des autorités compétentes, pendant une période expirant au plus tôt dix ans après la mise sur le marché du dernier dispositif, et dans le cas de dispositifs implantables, au plus tôt quinze ans après: \n\t— la déclaration de conformité UE, \n\t— la documentation visée à la section 12 de la présente annexe, \n\t— le certificat visé à la section 15.2 de la présente annexe, et \n\t— le certificat d'examen UE de type visé à l'annexe X. \n\n L'annexe IX, section 8, s'applique."
  15:
    prefix: "Partie B.18"
    title: "Application aux dispositifs de classe IIa"
    1_prefix: "Partie B.18.1"
    1_label: "Par dérogation à la section 11 de la présente annexe, le fabricant est réputé assurer et déclarer par la déclaration de conformité UE que les dispositifs de classe IIa en question sont fabriqués conformément à la documentation technique visée aux annexes II et III et satisfont aux exigences du présent règlement qui leur sont applicables."
    2_prefix: "Partie B.18.2"
    2_label: "La vérification effectuée par l'organisme notifié conformément à la section 14 de la présente annexe est destinée à vérifier la conformité des dispositifs de classe IIa en question avec la documentation technique visée aux annexes II et III et les exigences du présent règlement qui leur sont applicables."
    3_prefix: "Partie B.18.3"
    3_label: "Si la vérification visée à la section 18.2 de la présente annexe confirme que les dispositifs de classe IIa en question sont conformes à la documentation technique visée aux annexes II et III et satisfont aux exigences du présent règlement qui leur sont applicables, l'organisme notifié délivre un certificat au titre de la présente partie de la présente annexe."
    4_prefix: "Partie B.18.4"
    4_label: "Par dérogation à la section 17, le fabricant, ou son mandataire, tient à la disposition des autorités compétentes, pendant une période expirant au plus tôt dix ans après la mise sur le marché du dernier dispositif:"
    4_desc: "\t— la déclaration de conformité UE, \n\t— la documentation technique visée aux annexes II et III, et \n\t— le certificat visé à la section 18.3 de la présente annexe. \n\n L'annexe IX, section 8, s'applique."
22:
  prefix: "Annexe XII"
  title: "Certificats délivrés par un organisme notifié"
  1:
    prefix: "Chapitre I"
    title: "Exigences Générales"
    1_prefix: "1"
    1_label: "Les certificats sont établis dans une des langues officielles de l'Union."
    2_prefix: "2"
    2_label: "Chaque certificat ne se réfère qu'à une seule procédure d'évaluation de la conformité."
    3_prefix: "3"
    3_label: "Les certificats ne sont délivrés qu'à un seul fabricant. Le nom et l'adresse du fabricant figurant sur le certificat sont les mêmes que ceux enregistrés dans le système électronique visé à l'article 30."
    4_prefix: "4"
    4_label: "Le champ d'application des certificats identifie sans ambiguïté le ou les dispositifs auxquels ils se rapportent:"
    4_desc: "Le champ d'application des certificats identifie sans ambiguïté le ou les dispositifs auxquels ils se rapportent: \n\ta. les certificats d'évaluation UE de la documentation technique, les certificats d'examen UE de type et les certificats UE de vérification du produit comportent une identification claire, incluant le nom, le modèle et le type du ou des dispositifs, la destination mentionnée par le fabricant dans la notice d'utilisation et au sujet de laquelle le dispositif a fait l'objet de la procédure d'évaluation de la conformité, la classe de risque et l'IUD-ID de base visé à l'article 27, paragraphe 6 \n\tb. les certificats UE concernant le système de gestion de la qualité et les certificats UE d'assurance de la qualité comportent l'identification des dispositifs ou groupes de dispositifs, la classe de risque et, pour les dispositifs de classe IIb, la destination."
    5_prefix: "5"
    5_label: "L'organisme notifié est en mesure de démontrer, sur demande, quels sont les (différents) dispositifs auxquels le certificat se rapporte. L'organisme notifié met en place un système permettant de déterminer quels sont les dispositifs, y compris leur classe, auxquels le certificat se rapporte."
    6_prefix: "6"
    6_label: "Les certificats contiennent, s'il y a lieu, une note indiquant que, aux fins de la mise sur le marché du ou des dispositifs auxquels le certificat se rapporte, un autre certificat délivré conformément aux dispositions du présent règlement est requis."
    7_prefix: "7"
    7_label: "Les certificats UE concernant le système de gestion de la qualité et les certificats UE d'assurance de la qualité pour les dispositifs de classe I pour lesquels l'intervention d'un organisme notifié est requise en vertu de l'article 52, paragraphe 7, comprennent une déclaration selon laquelle l'audit du système de gestion de la qualité réalisé par l'organisme notifié était limité aux aspects prévus audit paragraphe."
    8_prefix: "8"
    8_label: "Lorsqu'un certificat est complété, modifié ou délivré à nouveau, le nouveau certificat comporte une référence au certificat précédent et à sa date de délivrance et précise les modifications apportées."
  2:
    prefix: "Chapitre II"
    title: "Contenu minimal des certificats"
    1_prefix: "1"
    1_label: "Le nom, l'adresse et le numéro d'identification de l'organisme notifié."
    2_prefix: "2"
    2_label: "Le nom et l'adresse du fabricant et, le cas échéant, du mandataire."
    3_prefix: "3"
    3_label: "Le numéro unique permettant d'identifier le certificat."
    4_prefix: "4"
    4_label: "S'il a déjà été délivré, le numéro d'enregistrement unique du fabricant visé à l'article 31, paragraphe 2."
    5_prefix: "5"
    5_label: "La date de délivrance."
    6_prefix: "6"
    6_label: "La date d'expiration."
    7_prefix: "7"
    7_label: "Les données nécessaires pour l'identification non équivoque du ou des dispositifs, le cas échéant, comme indiqué au chapitre I, section 4."
    8_prefix: "8"
    8_label: "Le cas échéant, la référence à un éventuel certificat précédent, comme indiqué au chapitre I, section 8."
    9_prefix: "9"
    9_label: "Une référence au présent règlement et à l'annexe correspondante conformément à laquelle l'évaluation de la conformité a été effectuée."
    10_prefix: "10"
    10_label: "Les contrôles et les essais effectués, par exemple une référence aux spécifications communes, aux normes harmonisées, aux rapports d'essais ou au(x) rapport(s) d'audit correspondants."
    11_prefix: "11"
    11_label: "Le cas échéant, une référence aux parties correspondantes de la documentation technique ou d'autres certificats requis pour la mise sur le marché du ou des dispositifs concernés."
    12_prefix: "12"
    12_label: "Le cas échéant, les informations relatives à la surveillance par l'organisme notifié."
    13_prefix: "13"
    13_label: "Les conclusions de l'évaluation de la conformité par l'organisme notifié, compte tenu de l'annexe applicable."
    14_prefix: "14"
    14_label: "Les conditions ou les limitations de la validité du certificat."
    15_prefix: "15"
    15_label: "La signature autorisée de l'organisme notifié conformément au droit national applicable."
23:
  prefix: "Annexe XIII"
  title: "Procédure pour les dispositifs sur mesure"
  1_prefix: "1"
  1_label: "Pour les dispositifs sur mesure, le fabricant, ou son mandataire, établit une déclaration contenant toutes les informations suivantes:"
  1_desc: "\t— le nom et l'adresse du fabricant et de tous les lieux de fabrication, \n\t— le nom et l'adresse du mandataire éventuel, \n\t— les données permettant d'identifier le dispositif en question, \n\t— une déclaration selon laquelle le dispositif est destiné à être utilisé exclusivement par un patient ou un utilisateur particulier, identifié par son nom, par un acronyme ou par un code numérique, \n\t— le nom de la personne qui a établi l'ordonnance et qui est autorisée à le faire par la législation nationale en vertu de ses qualifications professionnelles et, le cas échéant, le nom de l'établissement de santé concerné, \n\t— les caractéristiques spécifiques du produit, telles qu'elles sont indiquées sur l'ordonnance, \n\t— une déclaration selon laquelle le dispositif en question est conforme aux exigences générales en matière de sécurité et de performances énoncées à l'annexe I et, le cas échéant, l'indication des exigences auxquelles il n'a pas été entièrement satisfait, avec mention des motifs, \n\t— le cas échéant, une indication selon laquelle le dispositif contient ou incorpore une substance médicamenteuse, y compris un dérivé du sang ou du plasma humain ou des tissus ou des cellules d'origine humaine, ou d'origine animale conformément au règlement (UE) no 722/2012."
  2_prefix: "2"
  2_label: "Le fabricant s'engage à tenir à la disposition des autorités nationales compétentes la documentation indiquant son ou ses lieux de fabrication et permettant de comprendre la conception, la fabrication et les performances du dispositif, y compris les performances prévues, de manière à permettre l'évaluation de la conformité avec les exigences du présent règlement."
  3_prefix: "3"
  3_label: "Le fabricant prend toutes les mesures nécessaires pour que le procédé de fabrication assure que les dispositifs fabriqués sont conformes à la documentation visée à la section 2."
  4_prefix: "4"
  4_label: "La déclaration visée dans la partie introductive de la section 1 est conservée pendant une période d'au moins dix ans après la mise sur le marché du dispositif. Dans le cas des dispositifs implantables, cette durée est d'au moins quinze ans. \n\n L'annexe IX, section 8, s'applique."
  5_prefix: "5"
  5_label: "Le fabricant examine et documente les données acquises après la production, notamment dans le cadre du SCAC visé à l'annexe XIV, partie B, et met en œuvre des moyens appropriés pour appliquer les éventuelles mesures correctives nécessaires. À cet égard, il notifie aux autorités compétentes, conformément à l'article 87, paragraphe 1, tout incident grave ou toute mesure corrective de sécurité dès qu'il en a connaissance."
24:
  prefix: "Annexe XIV"
  title: "Évaluation clinique et suivi clinique après commercialisation"
  1_prefix: "Partie A.1"
  1_label: "Pour planifier, effectuer en continu et documenter une évaluation clinique, les fabricants:"
  1_desc: "\ta. établissent et mettent à jour un plan d'évaluation clinique qui, au minimum: \n\t\t— recense les exigences générales en matière de sécurité et de performances qui devront être étayées par des données cliniques pertinentes, \n\t\t— précise la destination du dispositif, \n\t\t— indique clairement les groupes cibles prévus, en précisant les indications et contre-indications, \n\t\t— décrit en détail les bénéfices cliniques recherchés pour les patients, au moyen de paramètres pertinents et précis en matière de résultats cliniques, \n\t\t— précise les méthodes à utiliser pour l'examen des aspects quantitatifs et qualitatifs de la sécurité clinique, avec une référence claire à l'identification des risques résiduels et des effets secondaires, \n\t\t— énumère à titre indicatif et décrit les paramètres à utiliser pour établir, sur la base de l'état de l'art dans le domaine médical, le caractère acceptable du rapport bénéfice/risque au regard des différentes indications et de la ou des destinations du dispositif, \n\t\t— indique comment traiter les questions liées au rapport bénéfice/risque concernant des composants spécifiques, telles que le recours à des produits pharmaceutiques ou à des tissus d'origine humaine ou animale non viables, et \n\t\t— comporte un plan de développement clinique décrivant le passage des investigations exploratoires, telles que la première étude chez l'humain la faisabilité et les études pilotes, aux investigations de confirmation, telles que les investigations cliniques pivots, et un SCAC tel que visé à la partie B de la présente annexe, avec indication des échéances et des critères d'acceptation potentiels; \n\tb. recense les données cliniques disponibles présentant un intérêt pour le dispositif et sa destination, ainsi que tout écart dans les preuves cliniques, grâce à une recherche systématique dans la littérature scientifique; \n\tc. évalue l'ensemble des données cliniques pertinentes en appréciant leur validité pour la détermination de la sécurité et des performances du dispositif; \n\td. obtient, au moyen d'investigations cliniques bien conçues, conformément au plan de développement clinique, toute donnée clinique nouvelle ou supplémentaire nécessaire pour traiter les questions non résolues; et \n\te. analyse toutes les données cliniques pertinentes pour parvenir à des conclusions concernant la sécurité et les performances cliniques du dispositif, y compris ses bénéfices cliniques."
  2_prefix: "Partie A.2"
  2_label: "L'évaluation clinique est approfondie et objective et tient compte des données aussi bien favorables que défavorables. Son ampleur et sa portée sont proportionnées et adaptées à la nature, à la classification, à la destination et aux risques du dispositif en question, ainsi qu'aux allégations du fabricant au sujet du dispositif."
  3_prefix: "Partie A.3"
  3_label: "L'évaluation clinique peut reposer sur les données cliniques relatives à un dispositif pour lequel l'équivalence avec le dispositif en question peut être démontrée. Les caractéristiques techniques, biologiques et cliniques ci-après sont prises en considération pour démontrer l'équivalence:"
  3_desc: "\t— sur le plan technique: le dispositif est de conception similaire; est utilisé dans des conditions similaires; possède des spécifications et des propriétés similaires, notamment des propriétés physicochimiques telles que l'intensité énergétique, la résistance à la traction, la viscosité, les propriétés de surface, la longueur d'onde et les algorithmes; utilise des méthodes d'installation similaires, le cas échéant; est sujet aux mêmes principes opératoires et exigences en matière de performances critiques, \n\t— sur le plan biologique: le dispositif emploie les mêmes matériaux ou substances en contact avec les mêmes tissus humains ou fluides corporels pour un même type ou une même durée de contact et des caractéristiques de libération des substances similaires, y compris les produits de dégradation et substances relargables, \n\t— sur le plan clinique: le dispositif est utilisé pour un même état clinique, ou une même destination, notamment sévérité et stade similaires de la maladie, en un même endroit du corps, auprès d'une population similaire, notamment pour ce qui est de l'âge, l'anatomie et la physiologie; a le même type d'utilisateur; a des performances critiques pertinentes similaires au regard de l'effet clinique escompté pour une destination donnée. \n\n Les caractéristiques énumérées au premier alinéa sont similaires au point qu'il n'y aurait pas de différence cliniquement significative en ce qui concerne la sécurité et les performances cliniques du dispositif. Les questions d'équivalence s'appuient sur une justification scientifique appropriée. Il est démontré clairement que les fabricants ont un accès suffisant aux données relatives aux dispositifs qu'ils considèrent comme équivalents pour justifier leurs allégations d'équivalence."
  4_prefix: "Partie A.4"
  4_desc: "Les résultats de l'évaluation clinique et les preuves cliniques sur lesquelles celle-ci est fondée sont documentés dans un rapport sur l'évaluation clinique, qui corrobore l'évaluation de la conformité du dispositif. \n\n Les preuves cliniques et les données non cliniques obtenues à partir des méthodes d'essai non cliniques et toute autre documentation pertinente permettent au fabricant de démontrer la conformité avec les exigences générales en matière de sécurité et de performances et sont incluses dans la documentation technique du dispositif en question. \n\n Les données favorables et défavorables prises en compte dans l'évaluation clinique figurent toutes dans la documentation technique."
  5_prefix: "Partie B.5"
  5_desc: "Le SCAC s'entend comme un processus continu de mise à jour de l'évaluation clinique visée à l'article 61 et à la partie A de la présente annexe et il s'inscrit dans le plan de surveillance après commercialisation établi par le fabricant. Dans le cadre du SCAC, le fabricant collecte et évalue de manière proactive les données cliniques résultant de l'utilisation chez ou sur les humains d'un dispositif qui porte le marquage CE et est mis sur le marché ou mis en service conformément à sa destination, comme prévu dans la procédure d'évaluation de la conformité correspondante, dans le but de confirmer la sécurité et les performances pendant toute la durée de vie prévue du dispositif, d'assurer le caractère constamment acceptable des risques identifiés et de détecter les risques émergents sur la base d'éléments de preuve concrets."
  6:
    prefix: "Partie B.6"
    title: "Le SCAC est effectué conformément à une méthode documentée exposée dans un plan de SCAC."
    1_prefix: "Partie B.6.1"
    1_label: "Le plan de SCAC précise les méthodes et les procédures à suivre pour collecter et évaluer de manière proactive des données cliniques dans le but:"
    1_desc: "\ta. de confirmer la sécurité et les performances du dispositif pendant toute sa durée de vie prévue; \n\tb. d'identifier les effets secondaires inconnus jusqu'alors et de surveiller ces effets et les contre-indications; \n\tc. d'identifier et d'analyser les risques émergents sur la base d'éléments de preuve concrets; \n\td. de garantir le caractère constamment acceptable du rapport bénéfice/risque visé à l'annexe I, sections 1 et 9; et \n\te. d'identifier toute mauvaise utilisation systématique ou toute utilisation hors destination éventuelle du dispositif en vue de vérifier l'adéquation de la destination."
    2_prefix: "Partie B.6.2"
    2_label: "Le plan de SCAC comprend au moins:"
    2_desc: "\ta. les méthodes et les procédures générales du SCAC à appliquer, telles que la collecte de l'expérience clinique acquise et des retours d'information des utilisateurs ainsi que la consultation de la littérature scientifique et d'autres sources de données cliniques; \n\tb. les méthodes et les procédures spécifiques du SCAC à appliquer, par exemple l'évaluation des registres appropriés ou des études de SCAC; \n\tc. une justification de l'adéquation des méthodes et des procédures visées aux points a) et b); \n\td. une référence aux parties pertinentes du rapport sur l'évaluation clinique visé à la section 4 de la présente annexe, et à la gestion des risques visée à l'annexe I, section 3; \n\te. les objectifs spécifiques fixés pour le SCAC; \n\tf. une évaluation des données cliniques relatives à des dispositifs équivalents ou similaires; \n\tg. une référence aux spécifications communes ou normes harmonisées éventuellement utilisées par le fabricant, ainsi qu'aux documents d'orientation applicables concernant le SCAC; et \n\th. un calendrier détaillé et dûment justifié pour les activités de SCAC (par exemple, analyse des données issues du SCAC et rapport) que doit mener le fabricant."
  7_prefix: "Partie B.7"
  7_label: "Le fabricant analyse les résultats du SCAC et les documente dans un rapport d'évaluation du SCAC, qui fait partie du rapport sur l'évaluation clinique et de la documentation technique."
  8_prefix: "Partie B.8"
  8_label: "Les conclusions du rapport d'évaluation du SCAC sont prises en compte pour l'évaluation clinique visée à l'article 61 et à la partie A de la présente annexe ainsi que pour la gestion des risques visée à l'annexe I, section 3. Si le SCAC met en évidence la nécessité de mesures préventives et/ou correctives, le fabricant met en place de telles mesures."
25:
  prefix: "Annexe XV"
  title: "Investigations cliniques"
  1_prefix: "Chapitre I.1"
  1_label: "Principes éthiques"
  1_desc: "Toutes les étapes de l'investigation clinique, depuis la réflexion initiale sur la nécessité et la justification de l'étude jusqu'à la publication des résultats, respectent des principes éthiques reconnus."
  2:
    prefix: "Chapitre I.2"
    title: "Méthodes"
    1_prefix: "2.1"
    1_desc: "Les investigations cliniques sont conduites selon un protocole d'investigation approprié correspondant au dernier état de la science et de la technique et défini de manière à confirmer ou à réfuter les allégations du fabricant concernant la sécurité, les performances et les aspects relatifs au rapport bénéfice/risque des dispositifs visés à l'article 62, paragraphe 1. Les investigations cliniques comportent un nombre d'observations suffisant pour garantir la validité scientifique des conclusions. Les raisons du choix de la conception et de la méthode statistique sont exposées comme prévu au chapitre II, section 3.6, de la présente annexe."
    2_prefix: "2.2"
    2_label: "Les procédures utilisées pour conduire l'investigation clinique sont adaptées au dispositif faisant l'objet d'une investigation."
    3_prefix: "2.3"
    3_label: "Les méthodes de recherche utilisées pour conduire les investigations cliniques sont adaptées au dispositif faisant l'objet d'une investigation."
    4_prefix: "2.4"
    4_label: "Les investigations cliniques sont conduites conformément au protocole d'investigation clinique auprès d'un nombre suffisant d'utilisateurs auxquels le dispositif est destiné et dans un environnement clinique qui soit représentatif des conditions normales d'utilisation du dispositif prévues dans la population de patients visée. Les investigations cliniques sont conformes au plan d'évaluation clinique visé à l'annexe XIV, partie A."
    5_prefix: "2.5"
    5_label: "Toutes les caractéristiques techniques et fonctionnelles pertinentes du dispositif, en particulier celles relatives à la sécurité et aux performances, et leurs résultats cliniques escomptés sont correctement traités lors de la conception de l'investigation. Une liste des caractéristiques techniques et fonctionnelles du dispositif et des résultats cliniques escomptés est fournie."
    6_prefix: "2.6"
    6_label: "Les critères d'évaluation de l'investigation clinique portent sur la destination, les bénéfices cliniques, les performances et la sécurité du dispositif. Ils sont déterminés et évalués au moyen de méthodes scientifiquement valides. Le critère d'évaluation primaire est adapté au dispositif et pertinent sur le plan clinique."
    7_prefix: "2.7"
    7_label: "Les investigateurs ont accès aux données techniques et cliniques relatives au dispositif. Le personnel qui participe à la conduite d'une investigation reçoit les instructions et la formation adéquates au sujet de la bonne utilisation du dispositif faisant l'objet d'une investigation et en ce qui concerne le protocole d'investigation clinique et les bonnes pratiques cliniques. Cette formation, organisée au besoin par le promoteur, fait l'objet d'une vérification et est correctement documentée."
    8_prefix: "2.8"
    8_label: "Le rapport sur l'investigation clinique, signé par l'investigateur, contient une évaluation critique de toutes les données obtenues au cours de l'investigation clinique, y compris les éventuelles constatations négatives."
  3:
    prefix: "Chapitre II.1"
    title: "Formulaire de demande"
    desc: "chapitre II - Documentation relative à la demande d'investigation clinique \n\n Pour les dispositifs faisant l'objet d'une investigation relevant de l'article 62, le promoteur élabore et introduit la demande conformément à l'article 70, accompagnée des documents énumérés ci-après. \n\n Le formulaire de demande est dûment complété et contient ce qui suit:"
    1_prefix: "1.1"
    1_label: "le nom, l'adresse et les coordonnées du promoteur et, s'il y a lieu, ceux de sa personne de contact ou de son représentant légal conformément à l'article 62, paragraphe 2, qui est établi dans l'Union;"
    2_prefix: "1.2"
    2_label: "s'ils sont différents de ceux de la section 1.1, le nom, l'adresse et les coordonnées du fabricant du dispositif destiné à faire l'objet de l'investigation clinique et, s'il y a lieu, ceux de son mandataire;"
    3_prefix: "1.3"
    3_label: "l'intitulé de l'investigation clinique;"
    4_prefix: "1.4"
    4_label: "le statut de la demande d'investigation clinique (première demande, réintroduction de la demande, modification significative, etc.);"
    5_prefix: "1.5"
    5_label: "les détails et/ou les références du plan d'évaluation clinique;"
    6_prefix: "1.6"
    6_label: "s'il s'agit de la réintroduction d'une demande relative à un dispositif pour lequel une demande a déjà été introduite, la ou les dates et le ou les numéros de référence de la demande précédente ou, en cas de modification significative, la référence de la demande initiale. Le promoteur met en évidence toutes les modifications par rapport à la demande précédente, en les justifiant, et indique par exemple si des modifications ont été apportées pour répondre aux conclusions d'examens précédents de l'autorité compétente ou du comité d'éthique;"
    7_prefix: "1.7"
    7_label: "si la demande est introduite parallèlement à une demande d'essai clinique conformément au règlement (UE) no 536/2014, la référence au numéro d'enregistrement officiel de l'essai clinique;"
    8_prefix: "1.8"
    8_label: "la mention des États membres et des pays tiers dans lesquels l'investigation clinique doit être menée dans le cadre d'une étude multicentrique ou multinationale au moment de la demande;"
    9_prefix: "1.9"
    9_label: "une description succincte du dispositif faisant l'objet d'une investigation, sa classification et d'autres informations nécessaires aux fins de l'identification du dispositif et du type de dispositif;"
    10_prefix: "1.10"
    10_label: "des informations sur la présence éventuelle dans le dispositif d'une substance médicamenteuse, y compris un dérivé du sang ou plasma humain, ou sur la fabrication éventuelle du dispositif à l'aide de tissus ou cellules d'origine humaine ou animale non viables ou de dérivés de ceux-ci;"
    11_prefix: "1.11"
    11_label: "un résumé du protocole d'investigation clinique indiquant le ou les objectifs de l'investigation clinique, le nombre et le sexe des participants, les critères de sélection des participants, la présence éventuelle de participants de moins de 18 ans, la conception de l'investigation, notamment s'il s'agit d'une étude contrôlée et/ou aléatoire, ainsi que les dates prévues du début et de la fin de l'investigation clinique;"
    12_prefix: "1.12"
    12_label: "le cas échéant, des informations sur un dispositif comparateur, sa classification et d'autres informations nécessaires aux fins de l'identification du dispositif comparateur;"
    13_prefix: "1.13"
    13_label: "des éléments de preuve fournis par le promoteur, indiquant que l'investigateur et le site d'investigation sont aptes à la conduite de l'investigation clinique selon le protocole d'investigation clinique;"
    14_prefix: "1.14"
    14_label: "des indications concernant la date prévue pour le début de l'investigation et sa durée envisagée;"
    15_prefix: "1.15"
    15_label: "des informations permettant d'identifier l'organisme notifié, si celui-ci est déjà impliqué au stade de la demande d'investigation clinique;"
    16_prefix: "1.16"
    16_label: "la confirmation que le promoteur est conscient que l'autorité compétente peut contacter le comité d'éthique qui évalue ou a évalué la demande; et"
    17_prefix: "1.17"
    17_label: "la déclaration visée à la section 4.1."
  4:
    prefix: "Chapitre II.2"
    title: "Brochure pour l'investigateur"
    desc: "chapitre II - Documentation relative à la demande d'investigation clinique \n\n Pour les dispositifs faisant l'objet d'une investigation relevant de l'article 62, le promoteur élabore et introduit la demande conformément à l'article 70, accompagnée des documents énumérés ci-après. \n\n La brochure pour l'investigateur contient les données cliniques et non cliniques sur le dispositif faisant l'objet d'une investigation qui sont utiles à l'investigation et disponibles au moment de la demande. Toute mise à jour de la brochure pour l'investigateur ou toute autre information utile ultérieure est portée en temps voulu à l'attention des investigateurs. La brochure pour l'investigateur est clairement identifiée et contient notamment ce qui suit:"
    1_prefix: "2.1"
    1_label: "les données d'identification et la description du dispositif, et notamment des informations sur la destination, la classification en fonction des risques et la règle de classification applicable prévue à l'annexe VIII, la conception et la fabrication du dispositif et la référence aux générations précédentes et similaires du dispositif;"
    2_prefix: "2.2"
    2_label: "les instructions du fabricant concernant l'installation, la maintenance, le maintien des normes d'hygiène et l'utilisation, notamment les conditions de stockage et de manipulation, ainsi que, dans la mesure où ces informations sont disponibles, les données devant figurer sur l'étiquette et la notice d'utilisation devant être fournie avec le dispositif lors de sa mise sur le marché; en outre, des informations sur toute formation requise;"
    3_prefix: "2.3"
    3_label: "une évaluation préclinique fondée sur les données des essais précliniques et les données expérimentales pertinentes, notamment sur les calculs de conception, les essais in vitro, les essais in vivo, les essais sur des animaux, les essais mécaniques ou électriques, les essais de fiabilité, la validation de la stérilisation, la vérification et la validation de logiciels, les essais de performances, l'évaluation de la biocompatibilité et de la sécurité biologique, le cas échéant;"
    4_prefix: "2.4"
    4_label: "les données cliniques existantes, provenant notamment:"
    4_desc: "\t— de la littérature scientifique pertinente relative à la sécurité, aux performances, aux bénéfices cliniques pour les patients, aux caractéristiques de conception et à la destination du dispositif et/ou de dispositifs équivalents ou similaires \n\t— d'autres données cliniques pertinentes disponibles relatives à la sécurité, aux performances, aux bénéfices cliniques pour les patients, aux caractéristiques de conception et à la destination de dispositifs équivalents ou similaires du même fabricant, dont la durée de présence sur le marché et un examen des éléments liés aux performances, au bénéfice clinique et à la sécurité ainsi que les mesures correctives éventuellement prises;"
    5_prefix: "2.5"
    5_label: "un résumé de l'analyse bénéfice/risque et de la gestion des risques, et notamment des informations sur les risques connus ou prévisibles, les effets indésirables, les contre-indications et les mises en garde;"
    6_prefix: "2.6"
    6_desc: "dans le cas des dispositifs incorporant une substance médicamenteuse, y compris un dérivé du sang ou plasma humain ou des dispositifs fabriqués à l'aide de tissus ou cellules d'origine humaine ou animale non viables, ou de leurs dérivés, des informations détaillées sur la substance médicamenteuse ou sur les tissus, les cellules ou leurs dérivés, ainsi que sur le respect des exigences générales en matière de sécurité et de performances et sur la gestion des risques particuliers posés par la substance ou par les tissus, les cellules ou leurs dérivés, ainsi que des éléments de preuve concernant la valeur ajoutée que présente l'incorporation de ces substances en termes de bénéfice clinique et/ou de sécurité du dispositif;"
    7_prefix: "2.7"
    7_desc: "une liste détaillant le respect des exigences générales en matière de sécurité et de performances énoncées à l'annexe I, y compris des normes et des spécifications communes appliquées, en totalité ou en partie, ainsi qu'une description des solutions retenues pour satisfaire aux exigences générales en matière de sécurité et de performances, dans la mesure où ces normes et spécifications communes n'ont pas été respectées, ou ne l'ont été que partiellement, ou en l'absence de normes et spécifications;"
    8_prefix: "2.8"
    8_label: "une description détaillée des procédures cliniques et des essais diagnostiques utilisés au cours de l'investigation clinique et, notamment, des informations sur tout écart par rapport à la pratique clinique courante."
  5:
    prefix: "Chapitre II.3"
    title: "Protocole d'investigation clinique"
    desc: "Le protocole d'investigation clinique présente la justification, les objectifs, la conception, les méthodologies, le contrôle, la conduite de l'investigation clinique, la documentation de ses résultats et la méthode d'analyse la concernant. Il contient notamment les informations énoncées dans la présente annexe. Si une partie de ces informations est fournie dans un document distinct, le protocole en fait état."
    1_prefix: "3.1.1 - Généralités"
    1_label: "Numéro d'investigation unique de l'investigation clinique visé à l'article 70, paragraphe 1."
    2_prefix: "3.1.2 - Généralités"
    2_label: "Données d'identification du promoteur — nom, adresse et coordonnées du promoteur et, s'il y a lieu, ceux de la personne de contact/du représentant légal du promoteur conformément à l'article 62, paragraphe 2, qui est établi dans l'Union."
    3_prefix: "3.1.3 - Généralités"
    3_label: "Informations sur l'investigateur principal sur chaque site d'investigation, sur l'investigateur coordonnateur pour l'investigation en question, l'adresse de chaque site d'investigation et les coordonnées d'urgence de l'investigateur principal sur chaque site. Les rôles, responsabilités et qualifications des différents types d'investigateurs sont précisés dans le protocole d'investigation clinique."
    4_prefix: "3.1.4 - Généralités"
    4_label: "Brève description des modalités de financement de l'investigation clinique et de l'accord conclu entre le promoteur et le site."
    5_prefix: "3.1.5 - Généralités"
    5_label: "Scénario général de l'investigation clinique, dans une langue officielle de l'Union définie par l'État membres concerné."
    6_prefix: "3.2"
    6_label: "Données d'identification et description du dispositif, notamment sa destination, son fabricant, sa traçabilité, la population cible, les matériaux entrant en contact avec le corps humain, les interventions médicales ou chirurgicales associées à son utilisation et la formation nécessaire et l'expérience tirée de son utilisation, l'examen de la documentation générale, l'état de l'art concernant les soins cliniques dans le domaine d'application concerné et les bénéfices escomptés du nouveau dispositif."
    7_prefix: "3.3"
    7_label: "Risques et bénéfices cliniques du dispositif à examiner, avec justification des résultats cliniques correspondants escomptés dans le protocole d'investigation clinique."
    8_prefix: "3.4"
    8_label: "Description du bien-fondé de l'investigation clinique dans le cadre de l'état de l'art dans le domaine de la pratique clinique."
    9_prefix: "3.5"
    9_label: "Objectifs et hypothèses de l'investigation clinique."
    10_prefix: "3.6.1"
    10_label: "Informations générales, comme le type d'investigation et les raisons justifiant ce choix, les critères de son évaluation et ses variables, tels qu'exposés dans le plan d'évaluation clinique."
    11_prefix: "3.6.2"
    11_label: "Informations sur le dispositif faisant l'objet d'une investigation, sur tout dispositif comparateur et sur tout autre dispositif ou traitement destiné à être utilisé pour l'investigation clinique."
    12_prefix: "3.6.3"
    12_label: "Informations sur les participants, les critères de sélection, la taille de la population visée par l'investigation et sa représentativité par rapport à la population cible et, le cas échéant, sur les participants vulnérables tels que des enfants, des femmes enceintes, des personnes immunodéficientes ou des personnes âgées."
    13_prefix: "3.6.4"
    13_label: "Détails des mesures à prendre pour réduire au minimum le biais, tel que l'aléa, et gestion des facteurs de confusion potentiels."
    14_prefix: "3.6.5"
    14_label: "Description des procédures cliniques et des méthodes diagnostiques relatives à l'investigation clinique et, notamment, mise en évidence de tout écart par rapport à la pratique clinique courante."
    15_prefix: "3.6.6"
    15_label: "Plan de surveillance."
    16_prefix: "3.7"
    16_label: "Considérations statistiques, avec justification, y compris un calcul de la puissance statistique de la taille de l'échantillon, le cas échéant."
    17_prefix: "3.8"
    17_label: "Gestion des données."
    18_prefix: "3.9"
    18_label: "Informations sur les modifications éventuellement apportées au protocole d'investigation clinique."
    19_prefix: "3.10"
    19_label: "Politique en matière de suivi et de gestion de tout écart par rapport au protocole d'investigation clinique sur le site d'investigation et interdiction claire du recours à toute dérogation au protocole."
    20_prefix: "3.11"
    20_label: "Responsabilité concernant le dispositif, notamment en matière de contrôle de l'accès à celui-ci, de suivi de l'utilisation de celui-ci dans le cadre de l'investigation clinique et de retour des dispositifs inutilisés, arrivés à expiration ou présentant un dysfonctionnement."
    21_prefix: "3.12"
    21_label: "Déclaration de conformité avec les principes éthiques reconnus applicables à la recherche médicale impliquant des êtres humains et avec les principes des bonnes pratiques cliniques en matière d'investigations cliniques des dispositifs, ainsi qu'avec les exigences de la réglementation applicables."
    22_prefix: "3.13"
    22_label: "Description de la procédure de consentement éclairé."
    23_prefix: "3.14"
    23_label: "Notification des problèmes de sécurité, y compris l'indication des événements indésirables et événements indésirables graves et des défectuosités de dispositifs, et procédures et délais de notification."
    24_prefix: "3.15"
    24_label: "Critères et procédures de suivi des participants après la fin, l'interruption temporaire ou l'arrêt anticipé d'une investigation clinique et de suivi des participants qui ont retiré leur consentement, ainsi que procédures à l'égard des participants qui échappent au suivi. En ce qui concerne les dispositifs implantables, ces procédures portent au minimum sur la traçabilité."
    25_prefix: "3.16"
    25_label: "Description des modalités de prise en charge des participants une fois leur participation à l'investigation clinique terminée, lorsque des soins supplémentaires sont nécessaires du fait de leur participation à l'investigation clinique et s'ils diffèrent des soins normalement attendus eu égard à l'affection concernée."
    26_prefix: "3.17"
    26_label: "Politique en matière d'élaboration du rapport sur l'investigation clinique et de publication des résultats conformément aux exigences légales et aux principes éthiques visés à la section I, point 1."
    27_prefix: "3.18"
    27_label: "Politique en matière d'élaboration du rapport sur l'investigation clinique et de publication des résultats conformément aux exigences légales et aux principes éthiques visés à la section I, point 1."
    28_prefix: "3.19"
    28_label: "Bibliographie."
  6:
    prefix: "Chapitre II.4"
    title: "Autres informations"
    1_prefix: "4.1"
    1_label: "Déclaration signée par la personne physique ou morale responsable de la fabrication du dispositif faisant l'objet d'une investigation, selon laquelle le dispositif en question est conforme aux exigences générales en matière de sécurité et de performances indépendamment des aspects relevant de l'investigation clinique et selon laquelle, en ce qui concerne ces aspects, toutes les précautions ont été prises pour protéger la santé et la sécurité du participant."
    2_prefix: "4.2"
    2_label: "Lorsque le droit national le prévoit, copie du ou des avis du ou des comités d'éthique concernés. Lorsque le droit national n'exige pas l'avis ou les avis du ou des comités d'éthique au moment de la présentation de la demande, une copie du ou des avis est transmise dans les plus brefs délais."
    3_prefix: "4.3"
    3_label: "Preuve de la souscription d'une assurance ou de l'affiliation à un régime d'indemnisation des participants en cas de blessure, conformément à l'article 69 et au droit national correspondant."
    4_prefix: "4.4"
    4_label: "Documents à utiliser aux fins de l'obtention d'un consentement éclairé, y compris la fiche d'information du patient et le document relatif au consentement éclairé."
    5_prefix: "4.5"
    5_label: "Description des dispositions prises pour respecter les règles en matière de protection et de confidentialité des données à caractère personnel, notamment:"
    5_desc: "\t— des dispositions organisationnelles et techniques qui seront mises en œuvre pour éviter l'accès non autorisé, la divulgation, la diffusion, l'altération ou la perte d'informations et de données à caractère personnel traitées, \n\t— une description des mesures qui seront mises en œuvre pour garantir la confidentialité des informations et des données à caractère personnel des participants, et \n\t— une description des mesures qui seront mises en œuvre en cas d'atteinte à la sécurité des données, afin d'en atténuer les éventuels effets indésirables."
    6_prefix: "4.6"
    6_label: "Description complète de la documentation technique disponible, par exemple celle relative à la gestion/l'analyse des risques ou des rapports d'essais spécifiques, à présenter sur demande à l'autorité compétente chargée de l'examen d'une demande."
  7:
    prefix: "Chapitre III"
    title: "Autres obligations du promoteur"
    1_prefix: "1"
    1_label: "Le promoteur s'emploie à tenir à la disposition des autorités nationales compétentes toutes les pièces justificatives des documents visés à la section II de la présente annexe. Si le promoteur n'est pas la personne physique ou morale responsable de la fabrication du dispositif faisant l'objet d'une investigation, cette obligation peut être remplie par ladite personne au nom du promoteur."
    2_prefix: "2"
    2_label: "Le promoteur a conclu un accord garantissant que les événements indésirables graves ou tout autre événement visé à l'article 80, paragraphe 2, lui sont notifiés en temps utile par le ou les investigateurs."
    3_prefix: "3"
    3_desc: "Les documents mentionnés dans la présente annexe sont conservés pour une durée d'au moins dix ans après la fin de l'investigation clinique concernant le dispositif en question ou, si le dispositif est ensuite mis sur le marché, d'au moins dix ans après la mise sur le marché du dernier dispositif. Dans le cas des dispositifs implantables, cette durée est d'au moins quinze ans. \n\n Chaque État membre exige que ces documents soient tenus à la disposition des autorités compétentes pour la durée visée au premier alinéa si le promoteur, ou sa personne de contact ou son représentant légal visé à l'article 62, paragraphe 2, établi sur son territoire fait faillite ou met fin à ses activités avant la fin de cette période."
    4_prefix: "4"
    4_label: "Le promoteur nomme un contrôleur indépendant du site d'investigation, chargé de veiller à ce que l'investigation soit conduite conformément au protocole d'investigation clinique, aux principes des bonnes pratiques cliniques et au présent règlement."
    5_prefix: "5"
    5_label: "Le promoteur assure le suivi des participants."
    6_prefix: "6"
    6_label: "Le promoteur apporte des éléments de preuve attestant que l'investigation est conduite dans le respect des bonnes pratiques cliniques, par exemple au moyen d'une inspection interne ou externe."
    7_prefix: "7"
    7_label: "Le promoteur établit un rapport sur l'investigation clinique comprenant au moins les éléments suivants:"
    7_desc: "\t— une ou des pages de couverture/d'introduction mentionnant l'intitulé de l'investigation, le dispositif faisant l'objet d'une investigation, le numéro d'identification unique, le numéro du protocole d'investigation clinique et les coordonnées, accompagnées des signatures, des investigateurs principaux et coordonnateurs de chaque site d'investigation, \n\t— les coordonnées de l'auteur du rapport et la date de celui-ci, \n\t— un résumé mentionnant l'intitulé et la finalité de l'investigation, contenant une description de l'investigation, de sa conception et des méthodes utilisées, ainsi que des résultats et conclusions de l'investigation, et précisant sa date d'achèvement, notamment les détails en cas d'arrêt anticipé, d'interruption temporaire ou de suspension de l'investigation, \n\t— une description du dispositif faisant l'objet d'une investigation, notamment de sa destination, clairement définie, \n\t— un résumé du protocole d'investigation clinique mentionnant les objectifs, la conception, les aspects éthiques, les mesures de contrôle et de qualité, les critères de sélection, les populations de patients visées, la taille de l'échantillon, le schéma thérapeutique, la durée du suivi, la thérapie concomitante, le plan statistique, notamment les hypothèses, le calcul de la taille de l'échantillon et les méthodes d'analyse, ainsi que les justifications, \n\t— les résultats de l'investigation clinique mentionnant, outre les raisons et les justifications, les données démographiques relatives aux participants, l'analyse des résultats en liaison avec des critères d'évaluation donnés, les détails de l'analyse des sous-groupes, ainsi que le respect du protocole d'investigation clinique, et mentionnant également le suivi des données manquantes et des patients se retirant de l'investigation clinique ou échappant au suivi, \n\t— un résumé des événements indésirables graves, des effets indésirables d'un dispositif, des défectuosités d'un dispositif et toute mesure corrective correspondante, \n\t— un débat et des conclusions globales portant sur les résultats en termes de sécurité et de performances, l'évaluation des risques et des bénéfices cliniques, l'examen de la pertinence clinique selon l'état de l'art, toute précaution spécifique s'adressant à des populations de patients spécifiques, les conséquences pour le dispositif faisant l'objet d'une investigation et les limites de l'investigation."
