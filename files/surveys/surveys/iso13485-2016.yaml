4:
  title: "Système de management de la qualité"
  1:
    title: "Exigences générales"
    1_desc: "L’organisme doit documenter un système de management de la qualité et en maintenir l’efficacité conformément aux exigences de la présente Norme internationale et aux exigences réglementaires applicables. \n\n L’organisme doit établir, mettre en œuvre et entretenir toute exigence, procédure, activité oudisposition devant être documentée conformément à la présente Norme internationale et aux exigencesréglementaires applicables.\n\n L’organisme doit documenter le(s) rôle(s) exercé(s) par l’organisme dans le cadre des exigences réglementaires applicables.\n\nℹ️ Les rôles exercés par l’organisme peuvent inclure les rôles de fabricant, de représentant autorisé, d’importateur ou de distributeur."
    2_desc: "L’organisme doit:\n\ta. déterminer les processus nécessaires au système de management de la qualité et l’application de ces derniers dans tout l’organisme en tenant compte des rôles qu’il exerce; \n\tb. appliquer une approche fondée sur les risques en ce qui concerne la maîtrise des processus appropriés nécessaires au système de management de la qualité; \n\tc. déterminer la séquence et l’interaction de ces processus."
    3_desc: "Pour chaque processus du système de management de la qualité, l’organisme doit: \n\ta. déterminer les critères et les méthodes nécessaires pour assurer l’efficacité du fonctionnement et de la maîtrise de ces processus; \n\tb. assurer la disponibilité des ressources et des informations nécessaires au fonctionnement et à la surveillance de ces processus; \n\tc. mettre en œuvre les actions nécessaires pour obtenir les résultats planifiés et maintenir l’efficacité de ces processus; \n\td. surveiller, mesurer lorsque approprié et analyser ces processus; \n\te. établir et conserver les enregistrements nécessaires pour démontrer la conformité à la présente Norme internationale et la conformité aux exigences réglementaires applicables (voir 4.2.5)"
    4_desc: "L’organisme doit gérer les processus de ce système de management de la qualité conformément aux exigences de la présente Norme internationale et aux exigences réglementaires applicables. Les modifications à apporter à ces processus doivent être: \n\ta. évaluées pour leur incidence sur le système de management de la qualité; \n\tb. évaluées pour leur incidence sur les dispositifs médicaux produits dans le cadre de ce système de management de la qualité; \n\tc. maîtrisées conformément aux exigences de la présente Norme internationale et des exigences réglementaires applicables."
    5_desc: "Lorsqu’un organisme décide d’externaliser un processus ayant une incidence sur la conformité du produit aux exigences, il doit le surveiller et en assurer la maîtrise. L’organisme doit rester responsable de la conformité à la présente Norme internationale ainsi qu’aux exigences réglementaires des clients et aux exigences réglementaires applicables pour les processus externalisés. Les éléments de maîtrise doivent être proportionnés au risque associé et à l’aptitude de la partie externe à satisfaire aux exigences conformément à 7.4. Les éléments de maîtrise doivent comprendre des dispositions écrites relatives à la qualité."
    6_desc: "L’organisme doit documenter des procédures pour la validation des applications logicielles utilisées dans le système de management de la qualité. Ces applications logicielles doivent être validées avant leur première utilisation et, lorsque approprié, après la modification de ce logiciel ou de son application. \n\n L’approche spécifique et les activités associées à la validation et la revalidation du logiciel doivent être proportionnées au risque associé à son utilisation. \n\n Les enregistrements de ces activités doivent être conservés (voir 4.2.5)."
  2:
    title: "Exigences relatives à la documentation"
    1_label: "Généralités"
    1_desc: "La documentation du système de management de la qualité (voir 4.2.4) doit comprendre: \n\ta. l’expression documentée de la politique qualité et des objectifs qualité; \n\tb. un manuel qualité; \n\tc. les procédures documentées et les enregistrements exigés par la présente Norme internationale; \n\td. les documents, y compris les enregistrements, jugés nécessaires par l’organisme pour assurer la planification, le fonctionnement et la maîtrise efficaces de ses processus; \n\te. toute autre documentation spécifiée par des exigences réglementaires applicables."
    2_label: "Manuel qualité"
    2_desc: "L’organisme doit documenter un manuel qualité qui comprend: \n\ta. le domaine d’application du système de management de la qualité, y compris le détail et la justification des exclusions ou de la non-application; \n\tb. les procédures documentées établies pour le système de management de la qualité ou la référence à celles-ci; \n\tc. une description des interactions entre les processus du système de management de la qualité. \n\nLe manuel qualité doit donner un aperçu de la structure de la documentation employée dans le système de management de la qualité."
    3_label: "Dossier du dispositif médical"
    3_desc: "L’organisme doit, pour chaque type ou famille de dispositifs médicaux, établir et tenir à jour un ou plusieurs dossiers contenant ou identifiant les documents élaborés pour prouver la conformité aux exigences de la présente Norme internationale et aux exigences réglementaires applicables. Le contenu de ce(s) dossier(s) doit inclure, sans toutefois s’y limiter: \n\ta. une description générale du dispositif médical, l’usage/objectif prévu et l’étiquetage, y compris les instructions d’utilisation; \n\tb. les spécifications du produit; \n\tc. les spécifications ou procédures relatives à la fabrication, le conditionnement, le stockage, la manutention et la distribution; \n\td. les procédures de mesure et de surveillance; \n\te. lorsque approprié, les exigences relatives à l’installation; \n\tf. lorsque approprié, les procédures des prestations associées."
    4_label: "Maîtrise des documents"
    4_desc: "Les documents requis pour le système de management de la qualité doivent être maîtrisés. Les enregistrements sont des documents particuliers qui doivent être maîtrisés conformément aux exigences figurant en 4.2.5. \n\n Une procédure documentée doit définir les contrôles nécessaires pour: \n\ta. revoir et approuver les documents quant à leur adéquation avant diffusion; \n\tb. revoir, mettre à jour si nécessaire et approuver de nouveau les documents; \n\tc. s’assurer que le statut de la version en vigueur et les modifications des documents sont identifiés; \n\td. assurer la disponibilité sur les lieux d’utilisation des versions pertinentes des documents applicables; \n\te. assurer que les documents restent lisibles et facilement identifiables; \n\tf. assurer que les documents d’origine extérieure jugés nécessaires par l’organisme pour la planification et le fonctionnement du système de management de la qualité sont identifiés et que leur diffusion est maîtrisée; \n\tg. prévenir la détérioration ou la perte des documents; \n\th. empêcher toute utilisation non intentionnelle de documents périmés et les identifier de manière adéquate. \n\n L’organisme doit s’assurer que les modifications apportées aux documents sont revues et approuvées soit par l’autorité d’approbation d’origine, soit par toute autre autorité désignée ayant accès à des informations connexes pertinentes lui permettant d’étayer sa décision. \n\n L’organisme doit définir la période durant laquelle une copie au moins des documents périmés doit être conservée. Cette période doit donner l’assurance que les documents conformément auxquels les dispositifs médicaux ont été fabriqués et soumis à l’essai sont disponibles pendant une durée au moins égale à la durée de vie du dispositif médical définie par l’organisme, mais non inférieure à la durée de conservation de tout enregistrement résultant (voir 4.2.5) ou telle que spécifiée par les exigences réglementaires applicables."
    5_label: "Maîtrise des enregistrements"
    5_desc: "Les enregistrements doivent être conservés pour apporter la preuve de la conformité aux exigences et du fonctionnement efficace du système de management de la qualité. \n\n L’organisme doit documenter des procédures pour définir les mesures de contrôle nécessaires à l’identification, au stockage, à la sécurité et à l’intégrité, à l’accessibilité, à la durée de conservation et à l’élimination des enregistrements. \n\n L’organisme doit définir et mettre en œuvre des méthodes pour protéger les informations médicales à caractère confidentiel contenues dans les enregistrements en tenant compte des exigences réglementaires applicables. \n\n Les enregistrements doivent rester lisibles, faciles à identifier et accessibles. Les modifications apportées à un enregistrement doivent rester identifiables. \n\n L’organisme doit conserver les enregistrements au minimum jusqu’à la fin de vie du dispositif médical, telle que définie par l’organisme, ou pendant une durée spécifiée par les exigences réglementaires applicables, mais pendant au moins deux ans à partir de la mise à disposition du dispositif médical par l’organisme."
5:
  title: "Responsabilité de la direction"
  1_label: "Engagement de la direction"
  1_desc: "Afin de fournir la preuve de son engagement au développement et à la mise en œuvre du système de management de la qualité ainsi qu’au maintien de son efficacité, la direction doit: \n\ta. communiquer au sein de l’organisme l’importance de satisfaire aux exigences des clients ainsi qu’aux exigences réglementaires applicables; \n\tb. établir la politique qualité; \n\tc. assurer que des objectifs qualité sont établis; \n\td. mener des revues de direction; \n\te. assurer la disponibilité des ressources."
  2_label: "Orientation client"
  2_desc: "La direction doit assurer que les exigences des clients et les exigences réglementaires applicables sont déterminées et respectées."
  3_label: "Politique qualité"
  3_desc: "La direction doit assurer que la politique qualité: \n\ta. est adaptée à la finalité de l’organisme; \n\tb. comprend l’engagement à satisfaire aux exigences et à maintenir l’efficacité du système de management de la qualité; \n\tc. fournit un cadre pour établir et revoir les objectifs qualité; \n\td. est communiquée et comprise au sein de l’organisme; \n\te. est revue quant à son adéquation permanente."
  4:
    title: "Planification"
    1_label: "Objectifs qualité"
    1_desc: "La direction doit assurer que les objectifs qualité, y compris ceux nécessaires pour satisfaire aux exigences relatives au produit et aux exigences réglementaires applicables, sont établis pour les fonctions et niveaux appropriés au sein de l’organisme. Les objectifs qualité doivent être mesurables et cohérents avec la politique qualité."
    2_label: "Planification du système de management de la qualité"
    2_desc: "La direction doit assurer que: \n\ta. la planification du système de management de la qualité est réalisée dans le but de satisfaire aux exigences données en 4.1, ainsi qu’aux objectifs qualité; \n\tb. la cohérence du système de management de la qualité n’est pas affectée lorsque des modifications du système de management de la qualité sont planifiées et mises en œuvre."
  5:
    title: "Responsabilité, autorité et communication"
    1_label: "Responsabilité et autorité"
    1_desc: "La direction doit assurer que les responsabilités et autorités sont définies, documentées et communiquées au sein de l’organisme. \n\n La direction doit documenter les liens qui existent entre toutes les personnes chargées de gérer, de réaliser et d’évaluer les travaux ayant une incidence sur la qualité, et assurer l’autonomie et l’autorité nécessaires pour la réalisation de ces tâches."
    2_label: "Représentant de la direction"
    2_desc: "La direction doit nommer un membre de l’encadrement de l’organisme qui, nonobstant d’autres responsabilités, doit avoir la responsabilité et l’autorité pour: \n\ta. assurer que les processus nécessaires au management de la qualité sont documentés; \n\tb. rendre compte à la direction de l’efficacité du système de management de la qualité et de tout besoin d’amélioration; \n\tc. assurer que la sensibilisation aux exigences réglementaires applicables et aux exigences du système de management de la qualité est encouragée dans tout l’organisme."
    3_label: "Communication interne"
    3_desc: "La direction doit assurer que les processus appropriés de communication sont mis en place au sein de l’organisme et que la communication concernant l’efficacité du système de management de la qualité a bien lieu."
  6:
    title: "Revue de direction"
    1_label: "Généralités"
    1_desc: "L’organisme doit documenter des procédures relatives à la revue de direction. À des intervalles planifiés documentés, la direction doit procéder à la revue du système de management de la qualité mis en place par l’organisme, afin de s’assurer qu’il est toujours approprié, adapté et efficace. Cette revue doit comprendre l’évaluation des opportunités d’amélioration et du besoin de modifier le système de management de la qualité, y compris la politique qualité et les objectifs qualité. \n\n Les enregistrements de revues de direction doivent être conservés (voir 4.2.5)."
    2_label: "Éléments d’entrée de la revue"
    2_desc: "Les éléments d’entrée de la revue de direction doivent comprendre, sans toutefois s’y limiter, des informations provenant: \n\ta. des retours d’information; \n\tb. du traitement des réclamations; \n\tc. du signalement aux autorités réglementaires; \n\td. des audits; \n\te. de la surveillance et de la mesure des processus; \n\tf. de la surveillance et de la mesure du produit; \n\tg. des actions correctives; \n\th. des actions préventives; \n\ti. des actions issues des revues de direction précédentes; \n\tj. des changements pouvant affecter le système de management de la qualité; \n\tk. des recommandations d’amélioration; \n\tl. des exigences réglementaires applicables nouvelles ou révisées."
    3_label: "Éléments de sortie de la revue"
    3_desc: "Les éléments de sortie de la revue de direction doivent être enregistrés (voir 4.2.5) et comprendre les éléments d’entrée revus et les décisions et actions relatives: \n\ta. à l’amélioration nécessaire au maintien de la pertinence, de l’adéquation et de l’efficacité du système de management de la qualité et de ses processus; \n\tb. à l’amélioration du produit en rapport avec les exigences du client; \n\tc. aux changements nécessaires pour répondre aux exigences réglementaires applicables nouvelles ou révisées; \n\td. aux besoins en ressources."
6:
  title: "Management des ressources"
  1_label: "Mise à disposition des ressources"
  1_desc: "L’organisme doit déterminer et fournir les ressources nécessaires pour: \n\ta. mettre en œuvre le système de management de la qualité et en maintenir l’efficacité; \n\tb. satisfaire aux exigences réglementaires applicables et aux exigences des clients."
  2_label: "Ressources humaines"
  2_desc: "Le personnel effectuant un travail ayant une incidence sur la qualité du produit doit être compétent sur la base de la formation initiale et professionnelle, du savoir-faire et de l’expérience. \n\n L’organisme doit documenter le(s) processus nécessaire(s) pour définir les compétences, dispenser la formation nécessaire et assurer la sensibilisation du personnel. \n\n L’organisme doit: \n\ta. déterminer les compétences nécessaires pour le personnel effectuant un travail ayant une incidence sur la qualité du produit; \n\tb. pourvoir à la formation ou entreprendre d’autres actions pour acquérir ou entretenir les compétences nécessaires; \n\tc. évaluer l’efficacité des actions entreprises; \n\td. assurer que les membres de son personnel ont conscience de la pertinence et de l’importance de leurs activités et de la manière dont ils contribuent à la réalisation des objectifs qualité; \n\te. conserver les enregistrements appropriés concernant la formation initiale et professionnelle, le savoir-faire et l’expérience (voir 4.2.5). \n\nℹ️ La méthodologie utilisée pour vérifier l’efficacité est proportionnée au risque associé au travail pour lequel la formation ou toute autre action est fournie."
  3_label: "Infrastructures"
  3_desc: "L’organisme doit documenter les exigences relatives aux infrastructures nécessaires pour garantir la conformité aux exigences relatives au produit, empêcher les mélanges de produits et assurer la manutention ordonnée de ces derniers. Les infrastructures comprennent, lorsque approprié: \n\ta. les bâtiments, les espaces de travail et les installations associées; \n\tb. les équipements (tant logiciels que matériels) associés aux processus; \n\tc. les services support (tels que la logistique, les moyens de communication ou les systèmes d’information). \n\n L’organisme doit documenter les exigences relatives aux activités de maintenance, y compris l’intervalle selon lequel elles doivent être réalisées, lorsque ces activités, ou leur absence, peuvent avoir une incidence sur la qualité du produit. Lorsque approprié, les exigences doivent s’appliquer aux équipements utilisés pour la production, la maîtrise de l’environnement de travail, la surveillance et les mesures. \n\n Les enregistrements de ces activités de maintenance doivent être conservés (voir 4.2.5)."
  4:
    title: "Environnement de travail et maîtrise de la contamination"
    1_label: "Environnement de travail"
    1_desc: "L’organisme doit documenter les exigences relatives à l’environnement de travail nécessaires pour obtenir la conformité du produit. \n\n Lorsque les conditions de l’environnement de travail peuvent avoir une incidence négative sur la qualité du produit, l’organisme doit documenter des exigences relatives à l’environnement de travail, ainsi que des procédures relatives à la surveillance et à la maîtrise de l’environnement de travail. \n\n L’organisme doit: \n\ta. documenter des exigences en matière de santé, propreté et habillement du personnel dans le cas où un contact du personnel avec le produit ou l’environnement de travail peut avoir une incidence sur la sécurité ou les performances du dispositif médical; \n\tb. s’assurer que toutes les personnes qui doivent travailler temporairement dans des conditions d’environnement particulières possèdent les compétences requises ou sont surveillées par une personne ayant les compétences requises. \n\nℹ️ Des informations supplémentaires sont disponibles dans l’ISO 14644 et l’ISO 14698."
    2_label: "Maîtrise de la contamination"
    2_desc: "Lorsque approprié, des dispositions particulières doivent être planifiées et documentées pour la maîtrise du produit contaminé ou potentiellement contaminé, afin d’éviter la contamination de l’environnement de travail, du personnel ou du produit. \n\n Pour les dispositifs médicaux stériles, l’organisme doit documenter des exigences relatives à la maîtrise de la contamination par les microorganismes ou les particules et maintenir la propreté requise au cours des processus d’assemblage ou de conditionnement."
7:
  title: "Réalisation du produit"
  1_label: "Planification de la réalisation du produit"
  1_desc: "L’organisme doit planifier et développer les processus nécessaires à la réalisation du produit. La planification de la réalisation du produit doit être cohérente avec les exigences relatives aux autres processus du système de management de la qualité. \n\n L’organisme doit documenter un ou plusieurs processus relatifs à la gestion des risques au cours de la réalisation du produit. Les enregistrements des activités de gestion des risques doivent être conservés (voir 4.2.5). \n\n Lors de la planification de la réalisation du produit, l’organisme doit déterminer, suivant le cas: \n\ta. les objectifs qualité et les exigences relatives au produit; \n\tb. la nécessité d’établir des processus, des documents (voir 4.2.4) et de fournir des ressources spécifiques au produit, y compris les infrastructures et l’environnement de travail; \n\tc. les activités requises de vérification, validation, surveillance, mesurage, contrôle et essai, manipulation, stockage, distribution et traçabilité spécifiques au produit et les critères d’acceptation du produit; \n\td. les enregistrements nécessaires pour apporter la preuve que les processus de réalisation et le produit résultant satisfont aux exigences (voir 4.2.5). Les éléments de sortie de cette planification doivent être documentés sous une forme adaptée au mode de fonctionnement de l’organisme. \n\nℹ️ Des informations supplémentaires sont disponibles dans l’ISO 14971"
  2:
    title: "Processus relatifs aux clients"
    1_label: "Détermination des exigences relatives au produit"
    1_desc: "L’organisme doit déterminer: \n\ta. les exigences spécifiées par le client, y compris les exigences relatives à la livraison et aux activités  après livraison; \n\tb. les exigences non formulées par le client mais nécessaires pour l’usage spécifié ou l’usage prévu, tel  qu’il est connu; \n\tc. les exigences réglementaires applicables relatives au produit; \n\td. toute formation de l’utilisateur nécessaire pour assurer les performances spécifiées et l’utilisation  sûre du produit; \n\te. toute exigence complémentaire déterminée par l’organisme."
    2_label: "Revue des exigences relatives au produit"
    2_desc: "L’organisme doit revoir les exigences relatives au produit. Cette revue doit être menée avant que l’organisme ne s’engage à livrer un produit au client (par exemple soumission d’appels d’offres, acceptation de contrats ou de commandes, acceptation d’avenants aux contrats ou aux commandes) et doit assurer que: \n\ta. les exigences relatives au produit sont définies et documentées; \n\tb. les écarts entre les exigences d’un contrat ou d’une commande et celles précédemment exprimées ont été résolus; \n\tc. les exigences réglementaires applicables sont satisfaites; \n\td. toute formation de l’utilisateur identifiée conformément aux exigences de 7.2.1 est disponible ou planifiée pour être disponible ultérieurement; \n\te. l’organisme est apte à satisfaire aux exigences définies. Les enregistrements des résultats de la revue et des actions qui en résultent doivent être conservés (voir 4.2.5). \n\n Lorsque les exigences du client ne sont pas fournies sous une forme documentée, elles doivent être confirmées par l’organisme avant d’être acceptées. \n\n Lorsque les exigences relatives au produit sont modifiées, l’organisme doit s’assurer que les documents correspondants sont amendés et que le personnel concerné est informé des exigences modifiées."
    3_label: "Communication"
    3_desc: "L’organisme doit planifier et documenter des dispositions pour communiquer avec les clients à propos: \n\ta. des informations relatives au produit; \n\tb. du traitement des consultations, des contrats ou des commandes, y compris de leurs avenants; \n\tc. des retours d’information des clients, y compris leurs réclamations; \n\td. des fiches d’avertissement. L’organisme doit communiquer avec les autorités réglementaires conformément aux exigences réglementaires applicables."
  3:
    title: "Conception et développement"
    1_label: "Généralités"
    1_desc: "L’organisme doit documenter des procédures pour la conception et le développement."
    2_label: "Planification de la conception et du développement"
    2_desc: "L’organisme doit planifier et maîtriser la conception et le développement du produit. Les documents de planification relatifs à la conception et au développement doivent être conservés et mis à jour, lorsque approprié, au cours du déroulement de la conception et du développement. \n\n Lors de la planification de la conception et du développement, l’organisme doit documenter: \n\ta. les étapes de la conception et du développement; \n\tb. la (les) revue(s) nécessaire(s) à chaque étape de la conception et du développement; \n\tc. les activités de vérification, de validation et de transfert de conception appropriées à chaque étape de la conception et du développement; \n\td. les responsabilités et autorités pour la conception et le développement; \n\te. les méthodes permettant d’assurer la traçabilité des éléments de sortie de la conception et du développement par rapport aux éléments d’entrée de la conception et du développement; \n\tf. les ressources nécessaires, y compris la compétence nécessaire du personnel."
    3_label: "Éléments d’entrée de la conception et du développement"
    3_desc: "Les éléments d’entrée concernant les exigences relatives au produit doivent être déterminés et des enregistrements doivent être conservés (voir 4.2.5). Ces éléments doivent comprendre: \n\ta. les exigences fonctionnelles, de performance, d’aptitude à l’utilisation et de sécurité, selon l’usage prévu; \n\tb. les exigences réglementaires et normes applicables; \n\tc. le(s) élément(s) de sortie applicable(s) de la gestion des risques; \n\td. lorsque approprié, les informations issues de conceptions similaires précédentes; \n\te. les autres exigences essentielles pour la conception et le développement du produit et des processus. Ces éléments d’entrée doivent être revus quant à leur adéquation et approuvés. \n\n Les exigences doivent être complètes, non ambiguës, vérifiables ou validables et non contradictoires. \n\nℹ️ Des informations supplémentaires sont disponibles dans l’IEC 62366–1."
    4_label: "Éléments de sortie de la conception et du développement"
    4_desc: "Les éléments de sortie de la conception et du développement doivent: \n\ta. satisfaire aux exigences d’entrée de la conception et du développement; \n\tb. fournir les informations appropriées pour les achats, la production et la prestation de service; \n\tc. contenir les critères d’acceptation du produit ou y faire référence; \n\td. spécifier les caractéristiques du produit essentielles pour son utilisation correcte et en toute sécurité. \n\n Les éléments de sortie de la conception et du développement doivent être sous une forme adéquate pour leur vérification par rapport aux éléments d’entrée et doivent être approuvés avant leur mise à disposition. \n\n Les enregistrements des éléments de sortie de la conception et du développement doivent être conservés (voir 4.2.5)."
    5_label: "Revue de la conception et du développement"
    5_desc: "Des revues systématiques de la conception et du développement doivent être réalisées, aux étapes appropriées, conformément aux dispositions planifiées et documentées afin: \n\ta. d’évaluer l’aptitude des résultats de la conception et du développement à satisfaire aux exigences; \n\tb. d’identifier tous les problèmes et de proposer les actions nécessaires. \n Les participants à ces revues doivent comprendre des représentants des fonctions concernées par l’étape de conception et de développement faisant l’objet de la revue, ainsi que d’autres personnes spécialisées. \n\n Les enregistrements des résultats des revues et de toutes les actions nécessaires doivent être conservés et doivent comprendre l’identification de la conception faisant l’objet de la revue, les participants impliqués ainsi que la date de la revue (voir 4.2.5)."
    6_label: "Vérification de la conception et du développement"
    6_desc: "La vérification de la conception et du développement doit être réalisée conformément aux dispositions planifiées et documentées pour assurer que les éléments de sortie de la conception et du développement satisfont aux exigences des éléments d’entrée de la conception et du développement. \n\n L’organisme doit documenter les plans de vérification qui comprennent les méthodes, les critères d’acceptation et, lorsque approprié, les techniques statistiques accompagnées d’une justification de la taille d’échantillonnage. \n\n Si l’usage prévu nécessite que le dispositif médical soit raccordé à un ou plusieurs autres dispositifs médicaux ou comporte une interface avec un ou plusieurs dispositifs médicaux, la vérification doit comprendre la confirmation du fait que les éléments de sortie de la conception satisfont aux éléments d’entrée de la conception lorsque le dispositif médical est raccordé ou mis en interface. \n\n Les enregistrements des résultats et des conclusions de la vérification doivent être conservés (voir 4.2.4 et 4.2.5)."
    7_label: "Validation de la conception et du développement"
    7_desc: "La validation de la conception et du développement doit être réalisée conformément aux dispositions planifiées et documentées pour assurer que le produit résultant est apte à satisfaire aux exigences pour l’application spécifiée ou l’usage prévu. \n\n L’organisme doit documenter les plans de validation qui comprennent les méthodes, les critères d’acceptation et, lorsque approprié, les techniques statistiques accompagnées d’une justification de la taille d’échantillonnage. \n\n La validation de la conception doit être réalisée sur un produit représentatif. Un produit représentatif comprend les unités de production ou lots initiaux, ou leurs équivalents. La justification du choix du produit utilisé pour la validation doit être enregistrée (voir 4.2.5). \n\n Dans le cadre de la validation de la conception et du développement, l’organisme doit réaliser des évaluations cliniques ou des évaluations des performances du dispositif médical conformément aux exigences réglementaires applicables. Un dispositif médical utilisé pour une évaluation clinique ou une évaluation de la performance n’est pas considéré comme étant mis à la disposition d’un client pour utilisation. \n\n Si l’usage prévu nécessite que le dispositif médical soit raccordé à un ou plusieurs autres dispositifs médicaux ou comporte une interface avec un ou plusieurs dispositifs médicaux, la validation doit comprendre la confirmation du fait que les exigences pour l’application spécifiée ou l’usage prévu sont satisfaites lorsque le dispositif médical est ainsi raccordé ou mis en interface. La validation doit être effectuée avant l’autorisation de mise à disposition pour utilisation du produit auprès des clients. \n\n Les enregistrements des résultats et des conclusions de la validation doivent être conservés (voir 4.2.4 et 4.2.5)."
    8_label: "Transfert de la conception et du développement"
    8_desc: "L’organisme doit documenter des procédures pour le transfert des éléments de sortie de la conception et du développement à la fabrication. Ces procédures doivent permettre d’assurer que les éléments de sortie de la conception et du développement sont vérifiés comme étant adaptés à la fabrication avant qu’ils ne deviennent des spécifications de production finales et d’assurer que les moyens de production envisagés peuvent satisfaire aux exigences relatives au produit. \n\n Les résultats et les conclusions du transfert doivent être enregistrés (voir 4.2.5)."
    9_label: "Maîtrise des modifications de la conception et du développement"
    9_desc: "L’organisme doit documenter des procédures pour maîtriser les modifications de la conception et du développement. L’organisme doit déterminer la conséquence de la modification sur la fonction, les performances, l’aptitude à l’utilisation, la sécurité du produit et les exigences réglementaires applicables relatives au dispositif médical et à son usage prévu. \n\n Les modifications de la conception et du développement doivent être identifiées. Avant leur mise en œuvre, les modifications doivent être: \n\ta. revues; \n\tb. vérifiées; \n\tc. validées, lorsque approprié; \n\td. approuvées. \n\n La revue des modifications de la conception et du développement doit inclure l’évaluation de l’incidence des modifications sur les composants du produit et le produit en cours de livraison ou déjà livré, les éléments d’entrée ou de sortie de la gestion des risques et les processus de réalisation du produit. \n\n Les enregistrements des modifications, leur revue et toutes les actions nécessaires doivent être conservés (voir 4.2.5)."
    10_label: "Dossiers de conception et de développement"
    10_desc: "L’organisme doit tenir à jour un dossier de conception et de développement pour chaque type de dispositif médical ou famille de dispositifs médicaux. Ce dossier doit inclure les enregistrements créés pour démontrer la conformité aux exigences en matière de conception et de développement ainsi que les enregistrements des modifications de conception et de développement, ou y faire référence."
  4:
    title: "Achats"
    1_label: "Processus d’achat"
    1_desc: "L’organisme doit documenter des procédures (voir 4.2.4) pour s’assurer que le produit acheté est conforme aux informations relatives aux achats spécifiées. \n\n L’organisme doit établir des critères d’évaluation et de sélection des fournisseurs. Les critères doivent être: \n\ta. fondés sur la capacité du fournisseur à fournir un produit conforme aux exigences de l’organisme; \n\tb. fondés sur les performances du fournisseur; \n\tc. fondés sur l’incidence du produit acheté sur la qualité du dispositif médical; \n\td. proportionnés au risque associé au dispositif médical. L’organisme doit planifier la surveillance et la réévaluation des fournisseurs. Les performances d’un fournisseur quant au respect des exigences relatives au produit acheté doivent être surveillées. Les résultats de la surveillance doivent constituer un élément d’entrée du processus de réévaluation du fournisseur. \n\n Le non-respect des spécifications d’achat doit être traité avec le fournisseur de manière proportionnée au risque associé au produit acheté et conformément aux exigences réglementaires applicables. \n\n Les enregistrements des résultats de l’évaluation, de la sélection, de la surveillance et de la réévaluation des performances ou de l’aptitude du fournisseur et de toutes les actions nécessaires qui en résultent doivent être conservés (voir 4.2.5)."
    2_label: "Informations relatives aux achats"
    2_desc: "Les informations relatives aux achats doivent décrire le produit à acheter ou y faire référence, en incluant lorsque approprié: \n\ta. les spécifications du produit; \n\tb. les exigences pour l’acceptation du produit, les procédures, les processus et les équipements; \n\tc. les exigences relatives à la qualification du personnel du fournisseur; \n\td. les exigences relatives au système de management de la qualité. L’organisme doit assurer l’adéquation des exigences d’achat spécifiées avant de les communiquer au fournisseur. \n\n Les informations relatives aux achats doivent comprendre, si applicable, un accord écrit selon lequel le fournisseur notifie à l’organisme les modifications apportées au produit acheté avant la mise en œuvre d’une quelconque modification ayant une incidence sur la capacité du produit acheté à satisfaire aux exigences d’achat spécifiées. \n\n Pour les besoins des exigences particulières concernant la traçabilité spécifiées en 7.5.9, l’organisme doit conserver les informations relatives aux achats pertinentes, c’est-à-dire les documents (voir 4.2.4) et les enregistrements (voir 4.2.5)."
    3_label: "Vérification du produit acheté"
    3_desc: "L’organisme doit établir et mettre en œuvre le contrôle ou les autres activités nécessaires pour assurer que le produit acheté satisfait aux exigences d’achat spécifiées. L’étendue des activités de vérification doit être fondée sur les résultats de l’évaluation du fournisseur et proportionnée aux risques associés au produit acheté.\n\n Lorsque l’organisme prend connaissance d’une quelconque modification apportée au produit acheté, ce dernier doit déterminer si ces modifications ont une incidence sur le processus de réalisation du produit ou le dispositif médical. \n\n Lorsque l’organisme ou son client a l’intention d’effectuer des vérifications chez le fournisseur, l’organisme doit faire état, dans les informations relatives aux achats, des activités liées à la vérification et des modalités de libération du produit prévues. \n\n Les enregistrements de la vérification doivent être conservés (voir 4.2.5)."
  5:
    title: "Production et prestation de service"
    1_label: "Maîtrise de la production et de la prestation de service"
    1_desc: "La production et la prestation de service doivent être planifiées, réalisées, surveillées et maîtrisées pour s’assurer que le produit est conforme aux spécifications. Lorsque approprié, les activités de maîtrise de la production doivent comprendre, sans toutefois s’y limiter: \n\ta. la documentation des procédures et des méthodes relatives à la maîtrise de la production (voir 4.2.4); \n\tb. la qualification des infrastructures; \n\tc. la mise en œuvre de la surveillance et de la mesure des paramètres du processus et des caractéristiques du produit; \n\td. la disponibilité et l’utilisation d’équipements de surveillance et de mesure; \n\te. la mise en œuvre d’opérations d’étiquetage et de conditionnement définies; \n\tf. la mise en œuvre d’activités de libération du produit, de livraison et de prestation de service après livraison. \n\n L’organisme doit établir et tenir à jour un enregistrement (voir 4.2.5) pour chaque dispositif médical ou lot de dispositifs médicaux, qui donne la traçabilité dans les termes exigés par 7.5.9 et qui identifie la quantité fabriquée ainsi que la quantité approuvée pour la distribution. L’enregistrement doit être vérifié et approuvé."
    2_label: "Propreté du produit"
    2_desc: "L’organisme doit documenter les exigences relatives à la propreté du produit ou à la maîtrise de la contamination du produit si: \n\ta. le produit est nettoyé par l’organisme avant sa stérilisation ou son utilisation; \n\tb. le produit est fourni à l’état non stérile et doit être soumis à une procédure de nettoyage avant sa stérilisation ou son utilisation; \n\tc. le produit ne peut pas être nettoyé avant d’être stérilisé ou utilisé et sa propreté est importante lors de son utilisation; \n\td. le produit est fourni pour être utilisé à l’état non stérile et sa propreté est importante lors de son utilisation; \n\te. des agents de traitement doivent être éliminés du produit pendant sa fabrication. Si le produit est nettoyé conformément à a) ou b) ci-dessus, les exigences de 6.4.1 ne s’appliquent pas avant la procédure de nettoyage."
    3_label: "Activités d’installation"
    3_desc: "L’organisme doit documenter les exigences relatives à l’installation du dispositif médical et les critères d’acceptation pour la vérification de l’installation, lorsque approprié. \n\n Si les exigences du client convenues permettent une installation du dispositif médical par une partie externe autre que l’organisme ou son fournisseur, l’organisme doit fournir les exigences documentées relatives au dispositif médical pour l’installation et la vérification de l’installation du dispositif médical. \n\n Les enregistrements de l’installation et de la vérification de l’installation du dispositif médical réalisées par l’organisme ou par son fournisseur doivent être conservés (voir 4.2.5)."
    4_label: "Prestations associées"
    4_desc: "Si les prestations associées du dispositif médical constituent une exigence spécifiée, l’organisme doit documenter les procédures des prestations associées, les matériaux de référence et les mesures de référence, comme nécessaire, pour la réalisation des prestations associées et la vérification de leur conformité aux exigences du produit. L’organisme doit analyser les enregistrements des prestations associées réalisées par l’organisme ou son fournisseur: \n\ta. pour déterminer si les informations doivent être considérées comme une réclamation; \n\tb. lorsque approprié, comme données d’entrée pour le processus d’amélioration. \n\n Les enregistrements des prestations associées réalisées par l’organisme ou son fournisseur doivent être conservés (voir 4.2.5)."
    5_label: "Exigences particulières pour les dispositifs médicaux stériles"
    5_desc: "L’organisme doit conserver les enregistrements des paramètres du processus de stérilisation utilisé pour chaque lot de stérilisation (voir 4.2.5). Ces enregistrements de stérilisation doivent permettre de garantir la traçabilité de chaque lot de production de dispositifs médicaux."
    6_label: "Validation des processus de production et de prestation de service"
    6_desc: "L’organisme doit valider tout processus de production et de prestation de service dont les éléments de sortie ne peuvent pas être vérifiés ou ne sont pas vérifiés par une surveillance ou une mesure effectuée a posteriori et dont les déficiences n’apparaissent, de ce fait, qu’une fois le produit en usage ou le service fourni. \n\n La validation doit démontrer l’aptitude de ces processus à atteindre de manière reproductible les résultats attendus. \n\n L’organisme doit documenter des procédures pour la validation des processus, notamment: \n\ta. les critères définis pour la revue et l’approbation des processus; \n\tb. la qualification des équipements et la qualification du personnel; \n\tc. l’utilisation de méthodes, de procédures et de critères d’acceptation spécifiques; \n\td. lorsque approprié, les techniques statistiques accompagnées d’une justification de la taille d’échantillonnage; \n\te. les exigences relatives aux enregistrements (voir 4.2.5); \n\tf. la revalidation, y compris les critères de revalidation; \n\tg. l’approbation des modifications apportées aux processus. \n\n L’organisme doit documenter des procédures pour la validation des applications logicielles utilisées en production et dans le cadre des prestations de service. Ces applications logicielles doivent être validées avant leur première utilisation et, lorsque approprié, après la modification de ce logiciel ou de son application. L’approche spécifique et les activités associées à la validation et la revalidation du logiciel doivent être proportionnées au risque associé à son utilisation, y compris leur incidence sur l’aptitude du produit à respecter les spécifications. \n\n Les enregistrements des résultats et des conclusions de la validation ainsi que les actions nécessaires résultant de la validation doivent être conservés (voir 4.2.4 et 4.2.5)."
    7_label: "Exigences spécifiques relatives à la validation des procédés de stérilisation et des systèmes de barrière stérile"
    7_desc: "L’organisme doit documenter des procédures (voir 4.2.4) pour la validation des procédés de stérilisation et des systèmes de barrière stérile. \n\n Les procédés de stérilisation et des systèmes de barrière stérile doivent être validés avant leur mise en œuvre et après toute modification du produit ou du procédé, lorsque approprié. \n\n Les enregistrements des résultats et des conclusions de la validation ainsi que les actions nécessaires résultant de la validation doivent être conservés (voir 4.2.4 et 4.2.5). \n\nℹ️ Des informations supplémentaires sont disponibles dans l’ISO 11607-1 et l’ISO 11607-2."
    8_label: "Identification"
    8_desc: "L’organisme doit documenter des procédures d’identification du produit et identifier le produit à l’aide de moyens adaptés tout au long de sa réalisation. \n\n L’organisme doit identifier l’état du produit par rapport aux exigences de surveillance et de mesure tout au long de la réalisation du produit. L’identification de l’état du produit doit être maintenue à chaque étape de la production, du stockage, de l’installation et des prestations associées afin de s’assurer que seul un produit ayant passé avec succès les contrôles et essais requis (ou libéré par dérogation autorisée) est diffusé, utilisé ou installé. \n\n Si les exigences réglementaires applicables l’exigent, l’organisme doit documenter un système pour attribuer un identifiant unique au dispositif médical. \n\n L’organisme doit documenter des procédures pour assurer que les dispositifs médicaux retournés à l’organisme sont identifiés et distingués du produit conforme."
    9_prefix: "7.5.9.1"
    9_label: "Généralités"
    9_desc: "L’organisme doit documenter des procédures sur la traçabilité. Ces procédures doivent définir l’étendue de la traçabilité conformément aux exigences réglementaires applicables et les enregistrements requis (voir 4.2.5)."
    10_prefix: "7.5.9.2"
    10_label: "Exigences particulières pour les dispositifs médicaux implantables"
    10_desc: "Les enregistrements nécessaires à la traçabilité, doivent inclure les enregistrements des composants, matériaux et conditions d’environnement de travail utilisés, si ces paramètres peuvent entraîner une non-conformité du dispositif médical par rapport aux exigences spécifiées en matière de sécurité et de performance. \n\n L’organisme doit exiger que ses fournisseurs de services de distribution ou ses distributeurs conservent des enregistrements de la distribution des dispositifs médicaux en vue d’en assurer la traçabilité, et que ces enregistrements soient accessibles pour contrôle. \n L’enregistrement du nom et de l’adresse du destinataire du colis doit être conservé (voir 4.2.5)."
    11_prefix: "7.5.10"
    11_label: "Propriété du client"
    11_desc: "L’organisme doit identifier, vérifier, protéger et sauvegarder la propriété que le client a fournie pour être utilisée ou intégrée dans le produit lorsqu’il est maîtrisé ou utilisé par l’organisme. Lorsqu’une propriété du client est perdue, endommagée ou encore jugée impropre à l’utilisation, l’organisme doit le notifier au client et conserver des enregistrements (voir 4.2.5)."
    12_prefix: "7.5.11"
    12_label: "Préservation du produit"
    12_desc: "L’organisme doit documenter des procédures pour préserver la conformité du produit aux exigences au cours des opérations de traitement, de stockage, de manutention et de distribution. La préservation doit s’appliquer aux composants d’un dispositif médical. \n\n L’organisme doit protéger le produit contre tous dommages, altérations ou contaminations lorsqu’il est exposé aux conditions prévues et aux dangers connexes pendant le traitement, le stockage, la manutention et la distribution: \n\ta. en concevant et en fabriquant des emballages et des conteneurs d’expédition adaptés; \n\tb. en documentant les exigences relatives aux conditions particulières nécessaires si l’emballage ne peut pas assurer à lui seul la préservation. \n\n S’il est nécessaire de respecter des conditions particulières, celles-ci doivent être maîtrisées et enregistrées (voir 4.2.5)."
  6_label: "Maîtrise des équipements de surveillance et de mesure"
  6_desc: "L’organisme doit déterminer les activités de surveillance et de mesure à entreprendre et les équipements de surveillance et de mesure nécessaires pour apporter la preuve de la conformité du produit aux exigences déterminées. \n\n L’organisme doit documenter des procédures pour assurer que les activités de surveillance et de mesure peuvent être effectuées et sont effectuées de manière cohérente par rapport aux exigences de surveillance et de mesure. \n\n Lorsque cela est nécessaire pour assurer des résultats valables, les équipements de mesure doivent être: \n\ta. étalonnés et/ou vérifiés à intervalles spécifiés ou avant leur utilisation, par rapport à des étalons de mesure reliés à des étalons de mesure internationaux ou nationaux: lorsque ces étalons n’existent pas, la référence utilisée pour l’étalonnage ou la vérification doit faire l’objet d’un enregistrement (voir 4.2.5); \n\tb. réglés ou réglés de nouveau autant que nécessaire: ces réglages doivent être enregistrés (voir 4.2.5); \n\tc. identifiés afin de pouvoir déterminer la validité de leur étalonnage; \n\td. protégés contre les réglages susceptibles d’invalider le résultat de la mesure; \n\te. protégés contre tous dommages et détériorations au cours de leur manutention, maintenance et stockage. \n\n L’organisme doit procéder à l’étalonnage ou à la vérification conformément aux procédures documentées. En outre, l’organisme doit évaluer et enregistrer la validité des résultats de mesure antérieurs lorsqu’un équipement se révèle non conforme aux exigences. L’organisme doit entreprendre les actions appropriées concernant l’équipement et tout produit affecté. \n\n Les enregistrements des résultats d’étalonnage et de vérification doivent être conservés (voir 4.2.5). \n\n L’organisme doit documenter des procédures pour la validation des applications logicielles utilisées pour la surveillance et la mesure des exigences. Ces applications logicielles doivent être validées avant leur première utilisation et, lorsque approprié, après la modification de ce logiciel ou de son application. L’approche spécifique et les activités associées à la validation et la revalidation du logiciel doivent être proportionnées au risque associé à son utilisation, y compris leur incidence sur l’aptitude du produit à respecter les spécifications. \n\n Les enregistrements des résultats et des conclusions de la validation ainsi que les actions nécessaire résultant de la validation doivent être conservés (voir 4.2.4 et 4.2.5). \n\nℹ️ Des informations supplémentaires sont disponibles dans l’ISO 10012."
8:
  title: "Mesurage, analyse et amélioration"
  1_label: "Généralités"
  1_desc: "L’organisme doit planifier et mettre en œuvre les processus de surveillance, de mesure, d’analyse et d’amélioration nécessaires pour: \n\ta. démontrer la conformité du produit; \n\tb. assurer la conformité du système de management de la qualité; \n\tc. maintenir l’efficacité du système de management de la qualité. \n\n Ceci doit inclure la détermination des méthodes appropriées, y compris les techniques statistiques, ainsi que l’étendue de leur utilisation."
  2:
    title: "Surveillance et mesurage"
    1_label: "Retours d’information"
    1_desc: "L’organisme doit recueillir et surveiller les informations relatives au niveau de satisfaction des exigences du client par l’organisme comme une des mesures de l’efficacité du système de management de la qualité. Les méthodes permettant d’obtenir et d’utiliser ces informations doivent être documentées. \n\n L’organisme doit documenter des procédures pour le processus de retour d’information. Ce processus de retour d’information doit comprendre des dispositions pour recueillir des données provenant de la production ainsi que des activités postproduction. \n\n Les informations recueillies dans le cadre de ce processus de retour d’information doivent servir éventuellement d’élément d’entrée dans la gestion des risques pour la surveillance et la tenue à jour des exigences relatives au produit ainsi que pour les processus de réalisation du produit ou d’amélioration. \n\n Si les exigences réglementaires applicables exigent que l’organisme acquière une expérience spécifique à partir des activités postproduction, la revue de cette expérience doit faire partie du processus de retour d’information."
    2_label: "Traitement des réclamations"
    2_desc: "L’organisme doit documenter des procédures pour le traitement des réclamations dans des délais appropriés, conformément aux exigences réglementaires applicables. Ces procédures doivent au moins comprendre les exigences et responsabilités pour: \n\ta. la réception et l’enregistrement des informations; \n\tb. l’évaluation des informations pour déterminer si le retour d’information constitue une réclamation; \n\tc. l’analyse des réclamations; \n\td. la détermination de la nécessité de signaler les informations aux autorités réglementaires appropriées; \n\te. le traitement du produit en rapport avec les réclamations; \n\tf. la détermination de la nécessité de mettre en œuvre des corrections ou des actions correctives. Si une réclamation ne fait pas l’objet d’une expertise, la justification doit être documentée. Toute correction ou action corrective résultant du processus de gestion des réclamations doit être documentée. \n\n Si une expertise détermine que des activités menées en dehors de l’organisme ont joué un rôle dans la réclamation, les informations pertinentes doivent être échangées entre l’organisme et la partie externe impliquée. \n\n Les enregistrements de gestion des réclamations doivent être conservés (voir 4.2.5)."
    3_label: "Signalement aux autorités réglementaires"
    3_desc: "Si les exigences réglementaires applicables exigent une notification des réclamations répondant à des critères de signalement spécifiés ou des événements indésirables, ou la diffusion d’une fiche d’avertissement, l’organisme doit documenter des procédures pour fournir la notification aux autorités réglementaires appropriées. \n\n Les enregistrements des signalements aux autorités réglementaires doivent être conservés (voir 4.2.5)."
    4_label: "Audit interne"
    4_desc: "L’organisme doit réaliser des audits internes à intervalles planifiés pour déterminer si le système de management de la qualité: \n\ta. est conforme aux dispositions planifiées ou documentées, aux exigences de la présente Norme internationale, aux exigences du système de management de la qualité établies par l’organisme et aux exigences réglementaires applicables; \n\tb. est efficacement mis en œuvre et tenu à jour. \n\n L’organisme doit documenter une procédure pour décrire les responsabilités et exigences pour planifier et mener les audits, et enregistrer et rendre compte des résultats d’audit. \n\n Un programme d’audit doit être planifié, en tenant compte de l’état et de l’importance des processus et des domaines à auditer, ainsi que des résultats des audits précédents. Les critères, le périmètre, l’intervalle et les méthodes d’audit doivent être définis et enregistrés (voir 4.2.5). Le choix des auditeurs et la réalisation des audits doivent assurer l’objectivité et l’impartialité du processus d’audit. Les auditeurs ne doivent pas auditer leur propre travail. \n\n Les enregistrements des audits et de leurs résultats, y compris l’identification des processus et des domaines audités ainsi que les conclusions, doivent être conservés (voir 4.2.5). \n\n La direction responsable du domaine audité doit assurer que toutes les corrections et actions correctives nécessaires sont entreprises sans délai pour éliminer les non-conformités détectées et leurs causes. Les activités de suivi doivent inclure la vérification des actions entreprises et le compte rendu des résultats de cette vérification. \n\nℹ️ Des informations supplémentaires sont disponibles dans l’ISO 19011."
    5_label: "Surveillance et mesure des processus"
    5_desc: "L’organisme doit utiliser des méthodes appropriées pour la surveillance et, lorsque approprié, la mesure des processus du système de management de la qualité. Ces méthodes doivent démontrer l’aptitude des processus à atteindre les résultats planifiés. Lorsque les résultats planifiés ne sont pas atteints, des corrections et des actions correctives doivent être entreprises, lorsque approprié."
    6_label: "Surveillance et mesure du produit"
    6_desc: "L’organisme doit surveiller et mesurer les caractéristiques du produit afin de vérifier que les exigences relatives au produit sont satisfaites. Ceci doit être effectué à des étapes applicables du processus de réalisation du produit conformément aux dispositions planifiées et documentées et aux procédures documentées. \n\n La preuve de la conformité aux critères d’acceptation doit être conservée. L’identité de la personne ayant autorisé la libération du produit doit être enregistrée (voir 4.2.5). Lorsque approprié, les enregistrements doivent identifier les équipements d’essai utilisés pour effectuer les activités de mesure. \n\n La libération du produit et la prestation du service au client ne doivent pas être effectuées avant l’exécution satisfaisante de toutes les dispositions planifiées et documentées. \n\n Pour les dispositifs médicaux implantables, l’organisme doit enregistrer l’identité des personnes chargées d’effectuer un contrôle ou un essai."
  3:
    title: "Maîtrise du produit non conforme"
    1_label: "Généralités"
    1_desc: "L’organisme doit assurer que le produit qui n’est pas conforme aux exigences relatives au produit est identifié et maîtrisé de manière à empêcher son utilisation ou fourniture non intentionnelle. L’organisme doit documenter une procédure pour définir les mesures de contrôles ainsi que les responsabilités et autorités associées pour l’identification, la documentation, l’isolement, l’évaluation et le traitement du produit non conforme. \n\n L’évaluation de la non-conformité doit comprendre une détermination de la nécessité d’entreprendre une expertise et la notification de toute partie externe responsable de la non-conformité. \n\n Les enregistrements de la nature des non-conformités et de toutes les actions ultérieures entreprises, y compris l’évaluation, toute expertise et la justification des décisions, doivent être conservés (voir 4.2.5)"
    2_label: "Actions en réponse à une non-conformité du produit détectée avant livraison"
    2_desc: "L’organisme doit traiter le produit non conforme de l’une ou plusieurs des manières suivantes: \n\ta. en menant les actions permettant d’éliminer la non-conformité détectée; \n\tb. en menant les actions permettant d’empêcher son utilisation ou son application prévue à l’origine; \n\tc. en autorisant son utilisation, sa libération ou son acceptation par dérogation. \n\n L’organisme doit s’assurer que le produit non conforme n’est accepté par dérogation que si la justification est fournie, l’approbation est obtenue et les exigences réglementaires applicables sont satisfaites. Les enregistrements de l’acceptation par dérogation et l’identité de la personne ayant autorisé la dérogation doivent être conservés (voir 4.2.5)."
    3_label: "Actions en réponse à une non-conformité du produit détectée après livraison"
    3_desc: "Lorsqu’un produit non conforme est détecté après livraison ou après que son utilisation a commencé, l’organisme doit mener les actions adaptées aux effets, réels ou potentiels, de la non-conformité. Les enregistrements des actions entreprises doivent être conservés (voir 4.2.5). \n\n L’organisme doit documenter des procédures concernant la diffusion de fiches d’avertissement conformément aux exigences réglementaires applicables. Ces procédures doivent pouvoir être mises en œuvre à tout moment. Les enregistrements des actions liées à la diffusion de fiches d’avertissement doivent être conservés (voir 4.2.5)."
    4_label: "Retouches"
    4_desc: "L’organisme doit procéder aux retouches conformément à des procédures documentées qui tiennent compte de tout effet négatif potentiel de la retouche sur le produit. Ces procédures doivent être soumises à la même revue et à la même approbation que les procédures initiales. \n\n Après la réalisation de la retouche, le produit doit être vérifié pour s’assurer qu’il satisfait aux critères d’acceptation et aux exigences réglementaires applicables. \n\n Les enregistrements des retouches doivent être conservés (voir 4.2.5)."
  4_label: "Analyse des données"
  4_desc: "L’organisme doit documenter des procédures pour déterminer, recueillir et analyser les données appropriées pour démontrer la pertinence, l’adéquation et l’efficacité du système de management de la qualité. Les procédures doivent inclure la détermination des méthodes appropriées, y compris les techniques statistiques, ainsi que l’étendue de leur utilisation. \n\n L’analyse des données doit comprendre les données résultant des activités de surveillance et de mesure ainsi que d’autres sources pertinentes et au moins comprendre des éléments d’entrée provenant: \n\ta. des retours d’information; \n\tb. de la conformité aux exigences relatives au produit; \n\tc. des caractéristiques et des évolutions des processus et des produits, y compris les opportunités d’amélioration; \n\td. les fournisseurs; \n\te. des audits; \n\tf. des comptes rendus de prestations de services, lorsque approprié. \n\n Si l’analyse des données montre que le système de management de la qualité n’est pas approprié, adéquat ou efficace, l’organisme doit utiliser cette analyse comme élément d’entrée d’amélioration, comme indiqué en 8.5. \n\n Les enregistrements des résultats d’analyse doivent être conservés (voir 4.2.5)."
  5:
    title: "Amélioration"
    1_label: "Généralités"
    1_desc: "L’organisme doit identifier et mettre en œuvre toutes les modifications nécessaires pour assurer et maintenir la pertinence, l’adéquation et l’efficacité permanentes du système de management de la qualité ainsi que la sécurité et les performances du dispositif médical en utilisant la politique qualité, les objectifs qualité, les résultats d’audits, la surveillance après mise sur le marché, l’analyse des données, les actions correctives et préventives ainsi que la revue de direction."
    2_label: "Actions correctives"
    2_desc: "L’organisme doit mener des actions pour éliminer les causes des non-conformités afin d’éviter qu’elles se reproduisent. Toutes les actions correctives nécessaires doivent être entreprises sans délai. Les actions correctives doivent être proportionnées aux effets des non-conformités rencontrées. \n\n L’organisme doit documenter une procédure afin de définir les exigences pour: \n\ta. procéder à la revue des non-conformités (y compris les réclamations); \n\tb. déterminer les causes des non-conformités; \n\tc. évaluer le besoin d’entreprendre des actions pour que les non-conformités ne se reproduisent pas; \n\td. planifier et documenter les actions nécessaires et mettre en œuvre ces actions y compris, lorsque approprié, la mise à jour de la documentation; \n\te. vérifier que l’action corrective n’a pas d’effet négatif sur la capacité à satisfaire aux exigences réglementaires applicables ou sur la sécurité et les performances du dispositif médical; \n\tf. revoir l’efficacité des actions correctives mises en œuvre. \n\n Les enregistrements des résultats de toutes les évaluations et actions mises en œuvre doivent être conservés (voir 4.2.5)."
    3_label: "Actions préventives"
    3_desc: "L’organisme doit déterminer les actions permettant d’éliminer les causes de non-conformités potentielles afin d’éviter qu’elles ne surviennent. Les actions préventives doivent être proportionnées aux effets des problèmes potentiels. \n\n L’organisme doit documenter une procédure afin de décrire les exigences pour: \n\ta. déterminer les non-conformités potentielles et leurs causes; \n\tb. évaluer le besoin d’entreprendre des actions pour éviter l’apparition de non-conformités; \n\tc. planifier et documenter les actions nécessaires et mettre en œuvre ces actions y compris, lorsque approprié, la mise à jour de la documentation; \n\td. vérifier que l’action n’a pas d’effet négatif sur la capacité à satisfaire aux exigences réglementaires applicables ou sur la sécurité et les performances du dispositif médical; \n\te. revoir l’efficacité des actions préventives mises en œuvre, lorsque approprié. \n\n Les enregistrements des résultats de toutes les évaluations et actions mises en œuvre doivent être conservés (voir 4.2.5)."
