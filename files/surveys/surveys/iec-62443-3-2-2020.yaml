4:
  title: "Exigences en matière d'évaluation des zones, des conduits et des risques"
  1_label: "Vue d’ensemble"
  1_desc: "L'Article 4 décrit les exigences pour la division d'un SUC en zones et conduits, ainsi que les exigences pour évaluer le risque de cybersécurité et déterminer le SL-T pour chaque zone et conduit définis. Les exigences présentées à l’Article 4 sont appelées exigences de zone et de conduit (ZCR). L'Article 4 fournit également une justification et des recommandations supplémentaires relatives à chacune des exigences. La Figure 1 représente un diagramme de flux de travail décrivant les principales étapes exigées pour établir des zones et des conduits et évaluer les risques. Les étapes sont numérotées pour indiquer leur relation avec les ZCR."
  2:
    title: "ZCR 1: Identifier le SUC"
    1_label: "ZCR 1.1: Identifier le périmètre SUC et les points d'accès"
    1_desc: "Exigence:\n\nL'organisation doit clairement identifier le SUC, délimiter clairement le périmètre de sécurité et identifier tous les points d'accès au SUC.\n\nJustification et recommandations supplémentaires :\n\nLes organisations possèdent et exploitent généralement plusieurs systèmes de commande, en particulier les grandes organisations possédant plusieurs installations industrielles. Chacun de ces systèmes de commande peut être défini comme un SUC. Par exemple, il y a généralement au moins un système de commande dans une installation industrielle, mais il y a souvent plusieurs systèmes qui commandent différentes fonctions au sein de l'installation.\nCette exigence précise que les SUC sont identifiés dans le but d'effectuer des analyses de cybersécurité. La définition d’un SUC est destinée à inclure tous les actifs de l’IACS nécessaires pour fournir une solution d'automatisation complète.\nLes diagrammes d'inventaire et d'architecture du système, les diagrammes de réseau et les flux de données peuvent être utilisés pour déterminer et représenter les actifs de l'IACS inclus dans la description du SUC.\n\n ℹ️NOTE \nLe SUC peut inclure plusieurs sous-systèmes tels que les systèmes de commande de processus de base (BPCS), les systèmes à commande distribuée (DCS), les systèmes de sécurité instrumentés (SIS), les systèmes de supervision, contrôle et acquisition de données (SCADA) et les paquetages de fournisseurs de produits IACS. Cela peut également inclure les technologies émergentes telles que l'Internet des objets industriel (IIoT) ou les solutions fondées sur le cloud."
  3:
    title: "ZCR 2: Appréciation initiale du risque de cybersécurité"
    1_label: "ZCR 2.1: Réalisation d’une appréciation initiale du risque de cybersécurité"
    1_desc: "Exigence :\n\nL'organisation doit effectuer une appréciation du risque de cybersécurité du SUC ou confirmer qu'une appréciation initiale précédente du risque de cybersécurité est toujours applicable, afin d'identifier le risque de cybersécurité non atténué le plus défavorable qui peut résulter de l'interférence avec des opérations critiques de l'IACS, d’infractions ou de perturbations de l'IACS ou de sa désactivation. \n\nJustification et recommandations supplémentaires :\n\nL'objectif de l'appréciation initiale du risque de cybersécurité est d'appréhender initialement le risque le plus défavorable que le SUC représente pour l'organisation s'il est compromis. Elle est généralement évaluée par rapport à l'impact sur la santé, la sécurité, l'environnement, l'interruption des activités, la perte de production, la qualité des produits, les aspects financiers, juridiques, réglementaires, la réputation, etc. Cette appréciation aide à hiérarchiser les appréciations détaillées du risque, et facilite le regroupement des actifs dans les zones et les conduits au sein du SUC.\nPour les processus potentiellement dangereux, il convient que les résultats de l'analyse des dangers liés aux processus (PHA) et les évaluations de sécurité fonctionnelle définies dans l’IEC 61511-2 [8] soient référencés dans le cadre de l'appréciation initiale du risque de cybersécurité, afin d'identifier les impacts les plus défavorables. Il convient, pour les organisations, de prendre également en considération les renseignements sur les menaces émanant des gouvernements, des centres d’échange et d’analyse d’informations (ISAC) sectoriels et d'autres sources pertinentes."
  4:
    title: "ZCR 3: Division du SUC en zones et conduits"
    1_label: "Vue d’ensemble"
    1_desc: "Les paragraphes 4.4.2 à 4.8.1 décrivent les ZCR pour diviser le SUC en zones et conduits, et fournissent une justification et des recommandations supplémentaires pour chaque exigence. Le paragraphe 4.4.2 stipule l'exigence de base pour l'établissement de zones et conduits au sein du SUC. Les paragraphes 4.4.3 à 4.4.7 sont destinés à fournir des recommandations relatives à l'affectation des actifs aux zones, en se fondant sur les meilleures pratiques de l'industrie. Il ne s'agit pas d'une liste exhaustive."
    2_label: "ZCR 3.1: Établissement de zones et conduits"
    2_desc: "Exigence :\n\nL'organisation doit regrouper l'IACS et les actifs associés en zones ou en conduits selon le risque déterminé. Le regroupement doit être fondé sur les résultats de l'appréciation initiale du risque de cybersécurité ou sur d'autres critères tels que la criticité des actifs, la fonction opérationnelle, l'emplacement physique ou logique, l'accès exigé (par exemple, les principes de droit d'accès minimal) ou l'organisation responsable.\n\nJustification et recommandations supplémentaires :\n\nLe regroupement d'actifs en zones et conduits consiste à identifier les actifs qui partagent des exigences de sécurité communes, et à admettre l'identification des mesures de sécurité communes exigées pour atténuer les risques. L'affectation des actifs de l'IACS aux zones et conduits peut être ajustée selon les résultats de l'appréciation détaillée du risque. Il s'agit d'une exigence générale, mais il convient d'accorder une attention particulière aux systèmes liés à la sécurité, notamment aux systèmes instrumentés de sécurité, aux systèmes sans fil, aux systèmes directement connectés aux terminaux Internet et aux systèmes qui interagissent avec l'IACS, mais sont gérés par d'autres appareils mobiles (y compris des systèmes externes).Par exemple, une installation peut d'abord être divisée en zones opérationnelles, telles que des zones de stockage du matériel, de traitement, de finition, etc. Les zones opérationnelles peuvent souvent être subdivisées en couches fonctionnelles, telles que des systèmes industriels d’exécution (MES), des systèmes de supervision (par exemple, les interfaces homme-machine [IHM]), des systèmes de commande principaux (par exemple, BCPS, DCS, des terminaux à distance [RTU] et des automates programmables [PLC]), ainsi que des systèmes de sécurité. Des modèles tels que le modèle de référence Purdue, comme cela est défini dans l’IEC 62264-1 [9] sont souvent utilisés comme base pour cette division. Les architectures de référence du fournisseur du produit IACS peuvent également être utiles."
    3_label: "ZCR 3.2: Séparation des actifs des systèmes métiers et des IACS"
    3_desc: "Exigence :\n\nLes actifs de l'IACS doivent être regroupés en zones qui sont logiquement ou physiquement séparées des actifs des systèmes métier ou de l'entreprise.\n\nJustification et recommandations supplémentaires :\n\nLes systèmes métier et les IACS sont deux types de systèmes différents qu’il est nécessaire de diviser en zones distinctes, car leurs fonctionnalités, leur organisation responsable, les résultats de l'appréciation initiale du risque et leur emplacement sont souvent fondamentalement différents. Il est important de comprendre la différence fondamentale entre les systèmes métier et les IACS, et l'impact possible des IACS sur la santé, la sécurité et l'environnement (HSE)."
    4_label: "ZCR 3.3: Séparation des actifs liés à la sécurité"
    4_desc: "Exigence :\n\nLes actifs de l’IACS liés à la sécurité doivent ëtre regroupés en zones qui sont logiquement ou physiquement séparées des zones comprenant des actifs de l’IACS non liés à la sécurité. Cependant, s'ils ne peuvent pas être séparés, toute la zone doit être identifiée comme zone liée à la sécurité.\n\nJustification et recommandations supplémentaires :\n\nLes actifs de l’IACS liés à la sécurité ont généralement des exigences de sécurité différentes de celles des composants de systèmes ou des systèmes de commande de base et des composants interfacés aux composants de système de commande. Les zones liées à la sécurité exigent généralement une protection de sécurité plus élevée en raison des risques potentiels élevés pour la santé, la sécurité et l'environnement si la zone est compromise."
    5_label: "ZCR 3.4: Séparation temporaire des appareils connectés"
    5_desc: "Recommandation :\n\nIl convient de regrouper les appareils autorisés à établir des connexions temporaires avec le SUC dans une ou des zones distinctes des actifs destinés à être connectés en permanence à l'IACS.\n\nJustification et recommandations supplémentaires :\n\nLes appareils qui sont temporairement connectés au SUC (par exemple, les ordinateurs portables de maintenance, les équipements de traitement portables, les appareils de sécurité portables et les appareils USB) sont plus susceptibles d'être exposés à des menaces, différentes et plus diverses que les appareils qui font partie intégrante de la zone. Par conséquent, il convient de modéliser ces appareils dans une ou des zones distinctes. La principale préoccupation concernant ces appareils est que, en raison de la nature temporaire de la connexion, ils peuvent également se connecter à d'autres réseaux, en dehors de la zone. Cependant, il existe des exceptions. Par exemple, un appareil portatif qui n'est utilisé que dans une seule zone et ne quitte jamais la frontière physique de la zone peut être inclus dans la zone."
    6_label: "ZCR 3.5: Séparation des appareils sans fil"
    6_desc: "Recommandation :\n\nIl convient de placer les appareils sans fil dans une ou plusieurs zones, séparées des appareils câblés.\n\nJustification et recommandations supplémentaires :\n\nLes signaux sans fil ne sont pas contrôlés par des clôtures ou des armoires et sont donc plus accessibles que les réseaux câblés normaux. Du fait de cette possibilité de plus grande facilité d’accês, ils sont plus susceptibles d'être exposés à des menaces, différentes et plus diverses que les appareils câblés.\n\nGénéralement, un point d'accès sans fil est modélisé comme conduit entre une zone sans fil et une zone câblée. Selon les fonctionnalités du point d'accès sans fil, des contrôles de sécurité supplémentaires (par exemple, pare-feu) peuvent être exigés pour assurer un niveau de séparation approprié."
    7_label: "ZCR 3.6: Séparation des appareils connectés au moyen des réseaux externes"
    7_desc: "Recommandation :\n\nIl convient de regrouper dans une ou des zones distinctes les appareils autorisés à établir des connexions avec le SUC au moyen des réseaux externes au SUC.\n\nJustification et recommandations supplémentaires\n\nIl n'est pas rare que des organisations accordent un accès à distance aux différents acteurs impliqués dans leurs activités, par exemple à leurs employés, aux fournisseurs et autres partenaires commerciaux, à des fins de maintenance, d'optimisation et d’établissement de rapports. L'accès à distance se situant à l'extérieur de la frontière physique du SUC, il convient de le modéliser en tant que zone ou zones distinctes, avec ses propres exigences de sécurité. "
  5:
    title: "ZCR 4: Comparaison des risques"
    1_label: "Vue d’ensemble"
    1_desc: "Le paragraphe 4.5.2 inclut une ZCR pour comparer le risque initial au risque tolérable."
    2_label: "ZCR 4.1: Comparaison du risque initial avec le risque tolérable"
    2_desc: "Exigence :\n\nLe risque initial déterminé au 4.3 doit être comparé au risque tolérable pour l'organisation. Si le risque initial dépasse le risque tolérable, l'organisation doit effectuer une appréciation détaillée du risque de cybersécurité définie au 4.6.\n\nJustification et recommandations supplémentaires :\n\nL'objectif de cette étape est de déterminer si le risque initial est tolérable ou exige une atténuation supplémentaire."
  6:
    title: "ZCR 5: Réalisation d'une appréciation détaillée du risque de cybersécurité"
    1_label: "Vue d’ensemble"
    1_desc: "La présente ZCR traite des exigences d'appréciation détaillée du risque pour un IACS, et fournit des justifications et des recommandations supplémentaires relatives à chaque exigence. Les exigences décrites dans la présente ZCR s'appliquent à chaque zone et conduit. Si des zones ou des conduits partagent une ou des menaces similaires, des conséquences et/ou des actifs similaires, il est admissible d'analyser ensemble des groupes de zones ou de conduits, si ce regroupement permet d’optimiser l’analyse. Il est admissible d'utiliser les résultats existants si la zone est normalisée (par exemple, en cas de réplication d'instances multiples d'une conception de référence). L'organigramme donné à la Figure 2 représente le déroulement des opérations d'appréciation du risque de cybersécurité.\n\nToute méthodologie d'appréciation détaillée du risque (par exemple, ISO 31000 [13], NIST SP 800-39 [15] et ISO/IEC 27005 [11]) peut être suivie, à condition que la méthodologie choisie satisfasse aux exigences d’appréciation du risque. Il convient d'utiliser les méthodologies d'appréciation initiale et détaillée du risque provenant du même cadre, de la même norme ou de la même source, et ces méthodologies doivent utiliser une échelle de classement des risques cohérente, afin de produire des résultats cohérents."
    2_label: "ZCR 5.1: Identification des menaces"
    2_desc: "Exigence :\n\nUne liste des menaces susceptibles d'affecter les actifs contenus dans la zone ou le conduit doit être établie.\n\nJustification et recommandations supplémentaires :\n\nIl est important d'établir une liste complète et réaliste des menaces, afin d'effectuer une appréciation du risque de sécurité. Dans la description d'une menace, il convient d'inclure, entre autres:\n\t\ta) une description de la source de la menace; \n\t\tb) une description de la capacité ou du niveau de qualification de la source de la menace; \n\t\tc) une description des vecteurs de menace possibles; \n\t\td) une identification du ou des actifs potentiellement affectés.\n\nQuelques exemples de descriptions de menaces: \n\t\t• un employé non malveillant accède physiquement à la zone de contrôle du processus et branche une clé USB dans l'un des ordinateurs; \n\t\t• un employé de support habilité accède logiquement à la zone de contrôle du processus à l'aide d'un ordinateur portable infecté; \n\t\t• un employé non malveillant ouvre un courriel d'hameçonnage qui compromet ses informations d'accès.\n\nÉtant donné le nombre potentiel élevé de menaces possibles, il est acceptable de résumer en regroupant les sources, les actifs, les points d'entrée, etc., en classes."
    3_label: "ZCR 5.2: Identification des vulnérabilités"
    3_desc: "Exigence :\n\nLa zone ou le conduit doit être analysé afin d'identifier et de documenter les vulnérabilités connues associées aux actifs contenus dans la zone ou le conduit, y compris celles des points d'accès.\n\nJustification et recommandations supplémentaires :\n\nPour qu'une menace aboutisse, il est nécessaire d’exploiter une ou plusieurs vulnérabilités dans un actif. Par conséquent, il est nécessaire d'identifier les vulnérabilités connues associées aux actifs pour mieux comprendre les vecteurs de menace.\nUne approche généralement acceptée pour identifier les vulnérabilités dans un IACS consiste à effectuer une évaluation de la vulnérabilité. De plus amples informations sur les évaluations de la vulnérabilité de cybersécurité de l’IACS sont disponibles dans l’ISA TR84.00.09.\nEn outre, il existe de nombreuses sources d'informations sur les vulnérabilités connues et courantes dans les IACS, telles que les équipes de réaction en informatique pour les systèmes de commande industriels (ICS-CERT), les fournisseurs de produits IACS, etc."
    4_label: "ZCR 5.3: Détermination des conséquences et de l'impact"
    4_desc: "Exigence :\n\nChaque scénario de menace doit être évalué pour déterminer les conséquences et l'impact dans le cas d’une menace. Il convient de documenter les conséquences en matière d'impact le plus défavorable sur les zones de risque, notamment sur la sécurité du personnel, les pertes financières, l'interruption des activités et l'environnement.\n\nJustification et recommandations supplémentaires :\n\nL'estimation de l'impact le plus défavorable d'une menace cybernétique constitue une contribution importante à l'analyse coût/bénéfice des contrôles de sécurité. Si l'impact le plus défavorable est faible, l'équipe d'appréciation du risque peut décider de passer à la menace suivante.\nIl convient d'examiner les évaluations PHA et autres appréciations du risque associées (comme les risques liés aux technologies de l'information, à la sécurité fonctionnelle, à la sécurité des entreprises et à la sécurité physique), afin de déterminer les conséquences et l'impact de la menace.\nLa mesure de l'impact peut être qualitative ou quantitative. Une méthode consiste à utiliser une échelle de conséquences définie par l'organisation dans le cadre de son système de management du risque (voir les exemples donnés dans l’Annexe B)."
    5_label: "ZCR 5.4: Détermination de la vraisemblance non atténuée"
    5_desc: "Exigence :\n\nChaque menace doit être évaluée pour déterminer la vraisemblance non atténuée. Il s'agit de la vraisemblance que la menace se réalise.\n\nJustification et recommandations supplémentaires :\n\nDans la terminologie du management du risque, le mot \"vraisemblance\" est utilisé pour indiquer la possibilité que quelque chose se produise, que cette possibilité soit définie, mesurée ou déterminée de façon objective ou subjective, qualitative ou quantitative, et qu'elle soit décrite au moyen de termes généraux ou mathématiques (comme une probabilité ou une fréquence sur une période donnée). Une méthode courante d’estimation de la vraisemblance consiste à utiliser une échelle de vraisemblance semi-quantitative définie par l'organisation dans le cadre de son système de management du risque (voir les exemples donnés dans l’Annexe B). Le présent document admet des méthodes qualitatives ou quantitatives.\nLors de l’estimation de la vraisemblance non atténuée, un certain nombre de facteurs sont pris en considération tels que la motivation et les capacités à l’origine des menaces, l’historique de menaces similaires, les vulnérabilités connues, l’attrait de la cible, etc.\nIl convient de ne pas prendre en considération les contremesures de cybersécurité existantes pour la zone ou le conduit évalué lors de la détermination de la vraisemblance non atténuée; il convient de les éliminer de manière hypothétique. Cependant, la détermination de la vraisemblance reconnaît les contremesures inhérentes aux composants IACS et toutes les couches de protection indépendantes (IPL), hors cybersécurité, telles que la sécurité physique, les dispositifs de protection mécaniques (par exemple, les soupapes de sécurité) ou les procédures d'urgence mises en place pour réduire la vraisemblance.\nLa vraisemblance est évaluée deux fois au cours du processus d'appréciation détaillée du risque. Elle est initialement déterminée sans prendre en considération les contremesures existantes, afin d'établir le risque non atténué. Elle est réévaluée au 4.6.10, en tenant compte des contremesures existantes et de leur efficacité, afin de déterminer le risque résiduel.\nDes méthodes d'appréciation du risque axées uniquement sur les conséquences peuvent être utilisées pour satisfaire aux exigences du présent document. Ces méthodes ne tiennent généralement pas compte de la vraisemblance dans la détermination du risque de cybersécurité non atténué et posent implicitement le principe que la vraisemblance est constante (par exemple, selon l’hypothèse que la vraisemblance est déjà présente ou, quantitativement, correspond à un \"1\")."
    6_label: "ZCR 5.5: Détermination du risque de cybersécurité non atténué"
    6_desc: "Exigence :\n\nLe risque de cybersécurité non atténué pour chaque menace doit être déterminé en combinant la mesure de l'impact déterminé au 4.6.4 et la mesure de vraisemblance non atténuée déterminée au 4.6.5.\n\nJustification et recommandations supplémentaires :\n\nLe risque de cybersécurité non atténué est souvent déterminé à l'aide d'une matrice de risques qui établit la relation entre la vraisemblance, l'impact et le risque, comme une matrice de risques organisationnels (voir les exemples donnés dans l’Annexe B)."
    7_label: "ZCR 5.6: Détermination du SL-T"
    7_desc: "Exigenc :\n\nUn SL-T doit être établi pour chaque zone de sécurité ou conduit.\n\nJustification et recommandations supplémentaires :\n\nLe SL-T est le niveau de sécurité souhaité pour un IACS, une zone ou un conduit particulier. Il est établi pour communiquer clairement cette information aux responsables de la conception, de la mise en œuvre, du fonctionnement et de la maintenance de la cybersécurité.\nLe SL-T peut être exprimé sous forme d'une valeur unique ou d'un vecteur. Consulter l'Annexe A de l'IEC 62443-3-3:2013 pour de plus amples informations sur l'approche du vecteur SL.\nAucune méthode n'est exigée pour l'établissement du SL-T. Certaines organisations choisissent d'établir le SL-T selon la différence entre le risque de cybersécurité non atténué et le risque tolérable. D'autres choisissent d'établir le SL-T sur la base des définitions de SL fournies dans l’Annexe A du présent document et dans l’IEC 62443-3-3:2013. Une autre approche, si une matrice de risques est utilisée (voir les exemples à l’Annexe B), consiste à établir qualitativement le SL. En partant d'une estimation raisonnable du SL (qui peut également être nulle), le risque de cybersécurité est évalué par la matrice de risques en tenant compte des contremesures impliquées par le SL. Si le risque n'est pas acceptable, le SL est augmenté (ce qui signifie que des contremesures supplémentaires sont ajoutées) jusqu'à ce que le risque de cybersécurité soit acceptable. Le SL dérivé de cette analyse devient un SL-T."
    8_label: "ZCR 5.7: Comparaison du risque non atténué avec le risque tolérable"
    8_desc: "Exigence :\n\nLe risque non atténué déterminé pour chaque menace identifiée au 4.6.6 doit être comparé au risque tolérable pour l'organisation. Si le risque non atténué dépasse le risque tolérable, l'organisation doit déterminer si elle souhaite accepter, transférer ou atténuer le risque. Pour atténuer le risque, il s’agit de poursuivre l’évaluation de la menace en réalisant les dispositions de 4.6.9 à 4.6.13. Sinon, l'organisation peut documenter les résultats obtenus avec 4.6.14 et passer à la menace suivante.\n\nJustification et recommandations supplémentaires \n\nL'objectif de cette étape est de déterminer si le risque non atténué est tolérable ou exige une évaluation supplémentaire."
    9_label: "ZCR 5.8: Identification et évaluation des contremesures existantes"
    9_desc: "Exigence :\n\nLes contremesures existantes dans le SUC doivent être identifiées et évaluées afin de déterminer leur efficacité pour réduire la vraisemblance ou l'impact de la menace.\n\nJustification et recommandations supplémentaires \n\nAfin de déterminer le risque résiduel, il convient d'évaluer la vraisemblance et l'impact en tenant compte de la présence et de l'efficacité des contremesures existantes. Cette étape du processus se concentre sur l'identification et l'évaluation des contremesures existantes.\nL’IEC 62443-3-3 fournit des recommandations relatives aux types de contremesures et leur efficacité, en attribuant un SL de capacité (SL-C) à chaque exigence du système."
    10_label: "ZCR 5.9: Réévaluation de la vraisemblance et de l'impact"
    10_desc: "Exigence\n\nLa vraisemblance et l'impact doivent être réévalués en tenant compte des contremesures et de leur efficacité. \n\nJustification et recommandations supplémentaires \n\nLa vraisemblance non atténuée déterminée au 4.6.5 ne prend pas en compte les contremesures existantes. Dans cette étape, les contremesures, comme les contrôles techniques, administratifs ou de procédure, sont prises en considération et utilisées pour déterminer la vraisemblance atténuée. De même, il convient également de réévaluer les conséquences et l'impact déterminés au 4.6.4 en tenant compte des contremesures identifiées."
    11_label: "ZCR 5.10: Détermination du risque résiduel"
    11_desc: "Exigence\n\nLe risque résiduel pour chaque menace identifiée au 4.6.2 doit être déterminé en combinant la mesure de vraisemblance atténuée et les valeurs d'impact atténué, déterminées au 4.6.10.\n\nJustification et recommandations supplémentaires \n\nLa détermination du risque résiduel fournit une mesure du niveau de risque actuel ainsi qu'une mesure de l'efficacité des contremesures existantes. Il s'agit d'une étape essentielle pour déterminer si le niveau de risque actuel dépasse les lignes directrices en matière de risques tolérables. "
    12_label: "ZCR 5.11: Comparaison du risque résiduel avec le risque tolérable"
    12_desc: "Exigence\n\nLe risque résiduel déterminé pour chaque menace identifiée au 4.6.2, ZCR 5.1: Identification des menaces doit être comparé au risque tolérable pour l'organisation. Si le risque résiduel dépasse le risque tolérable, l'organisation doit déterminer si ce risque résiduel sera accepté, transféré ou atténué, selon la politique de l'organisation.\n\nJustification et recommandations supplémentaires \n\nL'objectif de cette étape est de déterminer si le risque résiduel est tolérable ou exige une atténuation supplémentaire. De nombreuses organisations définissent le risque tolérable dans leurs politiques de management du risque."
    13_label: "ZCR 5.12: Identification des contremesures de cybersécurité supplémentaires"
    13_desc: "Exigence\n\nDes contremesures de cybersécurité supplémentaires, comme des contrôles techniques, administratifs ou de procédure, doivent être identifiées pour atténuer les risques, lorsque le risque résiduel dépasse le risque tolérable pour l'organisation, à moins que l'organisation ne choisisse de tolérer ou de transférer le risque.\n\nJustification et recommandations supplémentaires \n\nLorsque le risque résiduel dépasse la tolérance au risque d'une organisation, il est nécessaire de prendre des mesures pour réduire le risque à des niveaux tolérables.\nDes contremesures sont appliquées pour réduire le risque. Les contremesures de cybersécurité peuvent être une combinaison de mesures techniques et non techniques (politiques et procédures par exemple). Un autre moyen de réduire le risque consiste à réaffecter un actif de l’IACS d'une zone ou d'un conduit de sécurité inférieure à une zone ou un conduit de sécurité supérieure afin de bénéficier des contremesures de sécurité de la zone ou du conduit de sécurité supérieure.\nL’IEC 62443-3-3 peut servir de guide pour choisir les contremesures techniques appropriées. Une notation SL-C, utile pour l'évaluation de l'efficacité de la contremesure, a été attribuée aux contremesures identifiées dans l'IEC 62443-3-3.\nLes utilisateurs peuvent également évaluer le coût et la complexité des contremesures dans le cadre du processus de conception."
    14_label: "ZCR 5.13: Documentation et communication des résultats"
    14_desc: "Exigence\n\nLes résultats de l'appréciation détaillée du cyberrisque doivent être documentés, communiqués et mis à la disposition des parties prenantes appropriées de l'organisation. Une classification de sécurité des informations appropriée doit être assignée pour assurer la confidentialité de la documentation. La documentation doit inclure la date de chaque session ainsi que les noms et fonctions des participants. La documentation qui a joué un rôle dans l'appréciation du cyberrisque (telle que les diagrammes d'architecture du système, les PHA, les évaluations de vulnérabilité, les évaluations des lacunes et les sources d'informations sur les menaces) doit être enregistrée et archivée avec l'appréciation du cyberrisque.\n\nJustification et recommandations supplémentaires \n\nIl convient de documenter et de mettre à la disposition du personnel approprié de l'organisation les appréciations du risque de cybersécurité. Les appréciations du risque de cybersécurité sont des documents évolutifs qui peuvent être utilisés à de multiples fins, notamment les essais, les audits et les appréciations futures du risque. Cependant, il est également important de protéger correctement ces informations, car elles contiennent souvent des informations sensibles sur les systèmes, les vulnérabilités connues et les protections existantes."
  7:
    title: "ZCR 6: Documentation des exigences, hypothèses et contraintes liées à la cybersécurité"
    1_label: "Vue d’ensemble"
    1_desc: "Les paragraphes 4.7.2 à 4.7.10 décrivent les exigences relatives à la documentation des exigences, des hypothèses et des contraintes en matière de cybersécurité au sein du SUC, nécessaires pour atteindre le SL-T, et fournissent une justification et des recommandations supplémentaires pour chaque exigence."
    2_label: "ZCR 6.1: Spécification des exigences de cybersécurité"
    2_desc: "Exigence : \n\nUne spécification des exigences de cybersécurité (CRS) doit être créée pour documenter les contremesures de sécurité obligatoires du SUC, sur la base des résultats de l'appréciation détaillée du risque, des exigences générales de sécurité fondées sur les politiques de l'entreprise ou du site, ainsi que sur les normes et les réglementations applicables.\nAu minimum, la CRS doit comprendre les points suivants:\n\t\t• ZCR 6.2: Description du SUC (voir 4.7.3);  \n\t\t• ZCR 6.3: Schémas des zones et des conduits (voir 4.7.4); \n\t\t• ZCR 6.4: Caractéristiques des zones et des conduits (voir 4.7.5); \n\t\t• ZCR 6.5: Hypothèses liées à l'environnement d'exploitation (voir 4.7.6); \n\t\t• ZCR 6.6: Environnement de la menace (voir 4.7.7); \n\t\t• ZCR 6.7: Politiques en matière de sécurité organisationnelle (voir 4.7.8); \n\t\t• ZCR 6.8: Risque tolérable (voir 4.7.9); \n\t\t• ZCR 6.9: Exigences réglementaires (voir 4.7.10).  \n\nJustification et recommandations supplémentaires\n\nIl convient de documenter les exigences en matière de cybersécurité afin de vérifier qu'elles sont clairement communiquées à toutes les parties prenantes et correctement mises en œuvre. Il n'est pas nécessaire que la CRS se présente sous forme d'un seul document. De nombreuses organisations créent une section sur les exigences en matière de cybersécurité, dans d'autres documents IACS.\n\n ℹ️NOTE \nLe document ISA TR84.00.09 fournit des recommandations supplémentaires relatives aux éléments recommandés à inclure dans une CRS."
    3_label: "ZCR 6.2: Description du SUC"
    3_desc: "Exigence :\n\nUne description de haut niveau et une représentation du SUC doivent être incluses dans la CRS. Au minimum, la CRS doit inclure le nom, une description de haut niveau de la fonction et l'utilisation prévue du SUC, ainsi qu'une description de l'équipement ou du processus contrôlé.\n\nJustification et recommandations supplémentaires :\n\nIl est important d'identifier clairement et de définir la portée du SUC dans la CRS. Cette exigence garantit qu'une quantité minimale d'informations est fournie. Il convient d'inclure une représentation du SUC, des flux de données et des flux de processus associés."
    4_label: "ZCR 6.3: Schémas des zones et des conduits"
    4_desc: "Exigence :\n\nL'organisation doit: \n\t\ta) Produire un schéma ou un ensemble de schémas représentant la division des zones et conduits de l'ensemble du SUC.\n\t\tb) Attribuer chaque actif dans le SUC à une zone ou un conduit.\n\nJustification et recommandations supplémentaires :\n\nIl est important de disposer d'un schéma de la vue d'ensemble du SUC, représentant les frontières des zones et conduits ainsi que les actifs compris dans ces frontières, afin de communiquer efficacement sur la façon dont le SUC est divisé."
    5_label: "ZCR 6.4: Caractéristiques des zones et des conduits"
    5_desc: "Exigence :\n\nLes éléments suivants doivent être identifiés et documentés pour chaque zone et conduit définis:\n\t\ta) Nom et/ou identifiant unique;\n\t\tb) Organisations responsables;\n\t\tc) Définition de la frontière logique;\n\t\td) Définition de la frontière physique, le cas échéant;\n\t\te) Désignation de sécurité;\n\t\tf) Liste de tous les points d'accès logiques;\n\t\tg) Liste de tous les points d'accès physiques;\n\t\th) Liste des flux de données associés à chaque point d'accès;\n\t\ti) Zones ou conduits connectés;\n\t\tj) Liste des actifs et leur classification, criticité et valeur commerciale;\n\t\tk) SL-T;\n\t\tl) Exigences applicables en matière de sécurité; \n\t\tm) Politiques de sécurité applicable;\n\t\tn) Hypothèses et dépendances externes. \n\nJustification et recommandations supplémentaires :\n\nIl est important de caractériser et de documenter les attributs d'une zone ou d'un conduit. Chaque élément énuméré dans les exigences ci-dessus a un but spécifique, décrit ci-dessous:\n\t\ta) Nom et/ou identifiant unique: il est important, à des fins de conception et de documentation, de pouvoir identifier de façon unique chaque zone ou conduit.\n\t\tb) Organisations responsables: l'organisation responsable est la personne, le groupe ou les groupes responsables et décisionnaires en matière de sécurité de la zone ou du conduit.\n ℹ️NOTE : Les organisations responsables et les organisations décisionnaires peuvent être différentes. Dans ce cas, elles sont identifiées.\n\t\tc) Frontière logique: la frontière logique est importante, car elle indique la frontière entre la zone ou le conduit et le reste du système. Elle aide également à identifier le point de démarcation de toutes les communications entrant ou sortant de la zone ou du conduit.\n\t\td) Frontière physique: il est important de documenter la frontière physique si la zone ou le conduit exige une sécurité physique pour atteindre son SL-T. Si la sécurité physique peut améliorer le SL-T (mais n'est pas exigée), il convient de la documenter.\n\t\te) Désignation de sécurité: il est important d'identifier si la zone ou le conduit est lié à la sécurité ou contient des actifs liés à la sécurité.\n\t\tf) Liste des points d'accès logiques: les points d'accès logiques correspondent à n'importe quel emplacement dans lequel des informations électroniques peuvent traverser la frontière logique d'une zone ou d'un conduit. Il est nécessaire d’identifier et de documenter les points d'accès logiques, car ils peuvent présenter des vulnérabilités pouvant être exploitées par des menaces.\n\t\tg) Liste des points d'accès physiques: les points d'accès physiques (par exemple, les clôtures, les portes et les boîtiers) correspondent à n’importe quel emplacement dans lequel le personnel peut accéder physiquement aux actifs de la zone ou du conduit. Il est nécessaire d’identifier et de documenter les points d'accès physiques pour déterminer les moyens appropriés de surveillance et de prévention des accès non autorisés.\n\t\th) Liste des flux de données: afin de détecter les anomalies, il est important d'identifier et de documenter le flux attendu de données (par exemple, la source, la destination et le protocole) dans tout le système, et en particulier le flux de données entrant et sortant d'une zone ou d'un conduit.\n\t\ti) Les zones ou conduits connectés: il est important d'identifier la connectivité entre les zones et les conduits afin d'identifier tous les points d'accès logiques au système et dans le système. Généralement, cela est représenté dans un diagramme de zone et de conduit. \n\t\tj) Liste des actifs et leur classification, criticité et valeur commerciale: il est important d'identifier les actifs de l'IACS contenus dans chaque zone ou conduit, ainsi que leur classification, leur criticité et leur valeur commerciale, afin de comprendre les conséquences au cas où cette zone ou ce conduit est compromis. Lors de l'identification des conséquences, il est important de prendre en considération les conséquences pour les autres zones et conduits, ainsi que pour la zone et le conduit en question.\n\t\tk) SL-T: le SL-T indique le niveau de protection exigé pour une zone ou un conduit, selon les résultats de l'appréciation du risque. Pour de plus amples informations, se reporter au 4.6.7.\n\t\tl) Exigences de sécurité applicables: pour chaque zone et conduit, il est nécessaire d'identifier les exigences de sécurité applicables, nécessaires pour atteindre le SL-T. Certaines exigences peuvent être communes à toutes les zones ou tous les conduits du SUC, tandis que d'autres peuvent être spécifiques.\n ℹ️NOTE : La spécification des exigences de sécurité ne peut être finalisée qu'après l'achèvement de l'appréciation détaillée du risque (voir 4.6).\n\t\tm) Politiques de sécurité applicables: pour chaque zone et conduit, il est nécessaire d'identifier les politiques de sécurité organisationnelles, nécessaires pour atteindre le SL-T. Certaines politiques peuvent être communes à toutes les zones ou tous les conduits du SUC, tandis que d'autres peuvent être spécifiques.\n\t\tn) Hypothèses et dépendances externes: souvent, la sécurité d'une zone ou d'un conduit dépend de facteurs extérieurs à la zone ou au conduit, tels que l'énergie propre et les couches supplémentaires de sécurité physique et de réseau. Il convient de documenter ces hypothèses et interdépendances."
    6_label: "ZCR 6.5: Hypothèses liées à l'environnement d'exploitation"
    6_desc: "Exigence :\n\nLa CRS doit identifier et documenter l'environnement physique et logique dans lequel le SUC est situé ou sera situé.\n\nJustification et recommandations supplémentaires :\n\nIl convient de documenter l'environnement physique du SUC pour vérifier que les actifs de l'IACS sont correctement protégés. Les documents pouvant être utilisés pour communiquer sur l'environnement physique peuvent être, par exemple, des plans du site, des plans de l'étage, des schémas de câblage, des configurations de connecteur et des plans de sécurité du site. Il convient également de référencer les évaluations de vulnérabilité de sécurité existantes.\nIl convient également de documenter l'environnement logique du SUC pour avoir une compréhension claire des réseaux, des technologies de l'information, des protocoles et des systèmes de l'IACS pouvant s'interfacer avec le SUC. Les exemples de documentation pertinente comprennent les schémas d'architecture du réseau, les schémas d'architecture du système, les plans de l'installation électrique et de raccordement de climatisation/chauffage (HVAC), les documents sur la détection et l'élimination des incendies et du gaz et autres documents de conception pertinents. "
    7_label: "ZCR 6.6: Environnement de la menace"
    7_desc: "Exigence :\n\nLa CRS doit inclure une description de l'environnement de la menace ayant un impact sur le SUC. La description doit inclure la ou les sources de renseignement sur les menaces, et inclure les menaces actuelles et émergentes.\n\nJustification et recommandations supplémentaires :\n\nIl existe un certain nombre de facteurs pouvant affecter l'environnement de la menace d'un SUC, y compris le climat géopolitique, l'environnement physique et la sensibilité du système. Les sources appropriées faisant autorité peuvent inclure: \n\t\t• les équipes de réaction en informatique (CERT); \n\t\t• les ICS-CERT; \n\t\t• les partenariats public-privé tels que les ISAC; \n\t\t• les fournisseurs de produits de l’IACS; \n\t\t• les groupes consultatifs de l'industrie;  \n\t\t• les agences gouvernementales telles qu'une agence de sécurité de l'information; \n\t\t• les services de renseignement sur les menaces."
    8_label: "ZCR 6.7: Politiques en matière de sécurité organisationnelle"
    8_desc: "Exigence :\n\nLes contremesures de sécurité et les fonctionnalités des politiques en matière de sécurité organisationnelle doivent être incluses dans la CRS.\n\nJustification et recommandations supplémentaires :\n\nIl est important que tous les systèmes intègrent les politiques de sécurité de base, établies par l'organisation."
    9_label: "ZCR 6.8: Risque tolérable"
    9_desc: "Exigence :\n\nLe risque tolérable de l'organisation pour le SUC doit être inclus dans la CRS.\n\nJustification et recommandations supplémentaires :\n\nIl est important que les parties prenantes connaissent le niveau de risque tolérable de l'organisation, afin de garantir que le niveau de risque du SUC correspond."
    10_label: "ZCR 6.9: Exigences réglementaires"
    10_desc: "Exigence :\n\nToute exigence réglementaire pertinente en matière de cybersécurité, s'appliquant au SUC, doit être incluse dans la CRS.\n\nJustification et recommandations supplémentaires :\n\nCela est important pour garantir la conformité réglementaire."
  8:
    title: "ZCR 7: Approbation du propriétaire de l'actif"
    1_label: "Vue d’ensemble"
    1_desc: "Le paragraphe 4.8.2 inclut une ZCR pour obtenir l'approbation du propriétaire de l’actif."
    2_label: "ZCR 7.1: Obtention de l'approbation du propriétaire de l'actif"
    2_desc: "Exigence :\n\n La direction du propriétaire de l'actif, responsable de la sécurité, de l'intégrité et de la fiabilité du processus contrôlé par le SUC, doit revoir et approuver les résultats de l'appréciation du risque.\n\nJustification et recommandations supplémentaires\n\n Les appréciations du risque sont souvent organisées par des tierces parties, avec la participation de différents experts en la matière, ayant une connaissance approfondie du fonctionnement du processus industriel et des fonctionnalités de l'IACS et des systèmes informatiques associés. Bien que ces personnes possèdent les connaissances et les compétences nécessaires pour effectuer l'appréciation du risque, elles n'ont généralement pas le pouvoir de prendre des décisions pour accepter les risques. Par conséquent, les résultats de l'appréciation doivent être présentés à la direction appropriée ayant le pouvoir de prendre de telles décisions."
