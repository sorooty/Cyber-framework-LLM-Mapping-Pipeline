1:
  prefix: "CC1"
  title: "Environnement de contrôle"
  1_prefix: "CC1.1"
  1_label: "Principe COSO 1 : L’entité démontre un engagement en faveur de l’intégrité et des valeurs éthiques."
  1_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n**Points de focus spécifiés dans le cadre COSO :**\n\t\t● Donne le ton au sommet — Le conseil d’administration et la direction, à tous les niveaux, démontrent, par leurs directives, actions et comportement, l’importance de l’intégrité et des valeurs éthiques pour soutenir le fonctionnement du système de contrôle interne.\n\t\t● Établit des normes de conduite — Les attentes du conseil d’administration et de la direction concernant l’intégrité et les valeurs éthiques sont définies dans les normes de conduite de l’entité et comprises à tous les niveaux de l’entité ainsi que par les prestataires de services externalisés et les partenaires commerciaux.\n\t\t● Évalue le respect des normes de conduite — Des processus sont en place pour évaluer la performance des individus et des équipes par rapport aux normes de conduite attendues de l’entité.\n\t\t● Traite les écarts de manière opportune — Les écarts par rapport aux normes de conduite attendues de l’entité sont identifiés et corrigés de manière opportune et cohérente.\n\n**Point de focus supplémentaire lors de l’utilisation des critères de services de confiance :**\n\t\t● Prend en compte les contractants et les employés des fournisseurs dans la démonstration de son engagement — La direction et le conseil d’administration prennent en compte l’utilisation de contractants et d’employés de fournisseurs dans leurs processus d’établissement des normes de conduite, d’évaluation du respect de ces normes et de traitement des écarts de manière opportune."
  2_prefix: "CC1.2"
  2_label: "Principe COSO 2 : Le conseil d’administration démontre son indépendance vis-à-vis de la direction et exerce une surveillance sur le développement et la performance du contrôle interne."
  2_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n**Points de focus spécifiés dans le cadre COSO :**\n\t\t● Établit les responsabilités de surveillance — Le conseil d’administration identifie et accepte ses responsabilités de surveillance en relation avec les exigences et attentes établies.\n\t\t● Applique une expertise pertinente — Le conseil d’administration définit, maintient et évalue périodiquement les compétences et l’expertise nécessaires parmi ses membres pour leur permettre de poser des questions approfondies à la direction et de prendre des mesures proportionnées.\n\t\t● Fonctionne de manière indépendante fn 15 — Le conseil d’administration compte suffisamment de membres indépendants de la direction et objectifs dans les évaluations et la prise de décision.\nPoint de focus supplémentaire lors de l’utilisation des critères de services de confiance :\n\t\t● Complète l’expertise du conseil — Le conseil d’administration complète son expertise en matière de sécurité, disponibilité, intégrité du traitement, confidentialité et confidentialité, selon les besoins, par l’utilisation d’un sous-comité ou de consultants."
  3_prefix: "CC1.3"
  3_label: "Principe COSO 3 : La direction établit, sous la supervision du conseil, des structures, des lignes de reporting et des autorités et responsabilités appropriées dans la poursuite des objectifs."
  3_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n**Points de focus spécifiés dans le cadre COSO :**\n\t\t● Prend en compte toutes les structures de l’entité — La direction et le conseil d’administration prennent en compte les multiples structures utilisées (y compris les unités opérationnelles, les entités juridiques, la répartition géographique et les prestataires de services externalisés) pour soutenir la réalisation des objectifs.\n\t\t● Établit des lignes de reporting — La direction conçoit et évalue les lignes de reporting pour chaque structure de l’entité afin de permettre l’exécution des autorités et responsabilités et la circulation des informations pour gérer les activités de l’entité.\n\t\t● Définit, attribue et limite les autorités et responsabilités — La direction et le conseil d’administration délèguent l’autorité, définissent les responsabilités et utilisent des processus et technologies appropriés pour attribuer les responsabilités et séparer les tâches si nécessaire aux différents niveaux de l’organisation.\n\n**Points de focus supplémentaires lors de l’utilisation des critères de services de confiance :**\n\t\t● Répond à des exigences spécifiques lors de la définition des autorités et responsabilités — La direction et le conseil d’administration prennent en compte les exigences relatives à la sécurité, la disponibilité, l’intégrité du traitement, la confidentialité et la confidentialité lors de la définition des autorités et responsabilités.\n\t\t● Prend en compte les interactions avec les parties externes lors de l’établissement des structures, des lignes de reporting, des autorités et des responsabilités — La direction et le conseil d’administration prennent en compte le besoin pour l’entité d’interagir avec et de surveiller les activités des parties externes lors de l’établissement des structures, des lignes de reporting, des autorités et des responsabilités.\n\n**Point de focus supplémentaire lors de l’utilisation des critères de services de confiance pour la confidentialité :**\n\t\t● Établit des structures, des lignes de reporting et des autorités pour soutenir la conformité aux exigences légales et contractuelles en matière de confidentialité — Lors de l’établissement des structures, des lignes de reporting et des autorités, la direction prend en compte les exigences légales et contractuelles en matière de confidentialité et les objectifs."
  4_prefix: "CC1.4"
  4_label: "Principe COSO 4 : L’entité démontre un engagement à attirer, développer et retenir des individus compétents en alignement avec les objectifs."
  4_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n**Points de focus spécifiés dans le cadre COSO :**\n\t\t● Établit des politiques et pratiques — Les politiques et pratiques reflètent les attentes de compétence nécessaires pour soutenir la réalisation des objectifs.\n\t\t● Évalue la compétence et traite les lacunes — Le conseil d’administration et la direction évaluent la compétence au sein de l’entité et chez les prestataires de services externalisés par rapport aux politiques et pratiques établies et agissent si nécessaire pour remédier aux lacunes.\n\t\t● Attire, développe et retient les individus — L’entité fournit le mentorat et la formation nécessaires pour attirer, développer et retenir un personnel et des prestataires de services externalisés suffisants et compétents pour soutenir la réalisation des objectifs.\n\t\t● Planifie et prépare la succession — La direction et le conseil d’administration développent des plans de continuité pour les affectations de responsabilités importantes pour le contrôle interne.\n\n**Points de focus supplémentaires lors de l’utilisation des critères de services de confiance :**\n\t\t● Prend en compte le parcours des individus — L’entité prend en compte le parcours des personnel potentiel et existant, des contractants et des employés de fournisseurs lors de la décision de les embaucher ou de les retenir.\n\t\t● Prend en compte la compétence technique des individus — L’entité prend en compte la compétence technique des personnel potentiel et existant, des contractants et des employés de fournisseurs lors de la décision de les embaucher ou de les retenir.\n\t\t● Fournit une formation pour maintenir les compétences techniques — L’entité propose des programmes de formation, y compris une formation continue, pour garantir que les compétences et la compétence technique du personnel existant, des contractants et des employés de fournisseurs sont développées et maintenues."
  5_prefix: "CC1.5"
  5_label: "Principe COSO 5 : L’entité tient les individus responsables de leurs responsabilités en matière de contrôle interne dans la poursuite des objectifs."
  5_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n**Points de focus spécifiés dans le cadre COSO :**\n\t\t● Applique la responsabilité par le biais des structures, autorités et responsabilités — La direction et le conseil d’administration établissent des mécanismes pour communiquer et tenir les individus responsables de l’exécution des responsabilités en matière de contrôle interne au sein de l’entité et mettent en œuvre des actions correctives si nécessaire.\n\t\t● Établit des mesures de performance, des incitations et des récompenses — La direction et le conseil d’administration établissent des mesures de performance, des incitations et d’autres récompenses appropriées pour les responsabilités à tous les niveaux de l’entité, reflétant les dimensions appropriées de la performance et les normes de conduite attendues, et en tenant compte de la réalisation des objectifs à court et à long terme.\n\t\t● Évalue les mesures de performance, les incitations et les récompenses pour leur pertinence continue — La direction et le conseil d’administration alignent les incitations et les récompenses sur l’accomplissement des responsabilités en matière de contrôle interne dans la réalisation des objectifs.\n\t\t● Prend en compte les pressions excessives — La direction et le conseil d’administration évaluent et ajustent les pressions associées à la réalisation des objectifs lorsqu’ils attribuent des responsabilités, développent des mesures de performance et évaluent la performance.\n\t\t● Évalue la performance et récompense ou sanctionne les individus — La direction et le conseil d’administration évaluent la performance des responsabilités en matière de contrôle interne, y compris le respect des normes de conduite et des niveaux de compétence attendus, et fournissent des récompenses ou exercent des actions disciplinaires, selon le cas.\n\n**Point de focus supplémentaire lors de l’utilisation des critères de services de confiance pour la confidentialité :**\n\t\t● Prend des mesures disciplinaires — Un processus de sanctions est défini et appliqué si nécessaire lorsqu’un employé enfreint les politiques de confidentialité de l’entité ou qu’un comportement négligent d’un employé provoque un incident lié à la confidentialité."
2:
  prefix: "CC2"
  title: "Information et communication"
  1_prefix: "CC2.1"
  1_label: "Principe COSO 13 : L’entité obtient ou génère et utilise des informations pertinentes et de qualité pour soutenir le fonctionnement du contrôle interne."
  1_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n**Points de focus spécifiés dans le cadre COSO :**\n\t\t● Identifie les exigences en matière d’information — Un processus est en place pour identifier les informations requises et attendues pour soutenir le fonctionnement des autres composantes du contrôle interne et la réalisation des objectifs de l’entité.\n\t\t● Capture les sources internes et externes de données — Les systèmes d’information capturent les sources internes et externes de données.\n\t\t● Traite les données pertinentes en informations — Les systèmes d’information traitent et transforment les données pertinentes en informations.\n\t\t● Maintient la qualité tout au long du traitement — Les systèmes d’information produisent des informations qui sont opportunes, actuelles, précises, complètes, accessibles, protégées, vérifiables et conservées. Les informations sont examinées pour évaluer leur pertinence dans le soutien aux composantes du contrôle interne.\n\n**Points de focus supplémentaires lors de l’utilisation des critères de services de confiance :**\n\t\t● Documente les flux de données — L’entité documente et utilise les flux d’informations et de données internes et externes pour soutenir la conception et le fonctionnement des contrôles.\n\t\t● Gère les actifs — L’entité identifie, documente et tient à jour les enregistrements des composants du système tels que l’infrastructure, les logiciels et autres actifs informationnels. Les actifs informationnels incluent les dispositifs physiques et systèmes de point de terminaison, les systèmes virtuels, les données et flux de données, les systèmes d’information externes et les rôles organisationnels.\n\t\t● Classe les informations — L’entité classe les informations selon leurs caractéristiques pertinentes (par exemple, informations personnellement identifiables, informations confidentielles des clients et propriété intellectuelle) pour soutenir l’identification des menaces pesant sur les informations et la conception et le fonctionnement des contrôles.\n\t\t● Utilise des informations complètes et précises — L’entité utilise des informations et rapports qui sont complets, précis, actuels et valides dans le fonctionnement des contrôles.\n\t\t● Gère l’emplacement des actifs — L’entité identifie, documente et tient à jour les enregistrements de l’emplacement physique et de la garde des actifs informationnels, en particulier pour ceux stockés en dehors du contrôle physique de sécurité de l’entité (par exemple, les logiciels et données stockés sur les appareils des fournisseurs ou les téléphones mobiles des employés dans le cadre d’une politique « bring-your-own-device »)."
  2_prefix: "CC2.2"
  2_label: "Principe COSO 14 : L’entité communique en interne les informations, y compris les objectifs et responsabilités pour le contrôle interne, nécessaires pour soutenir le fonctionnement du contrôle interne."
  2_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n**Points de focus spécifiés dans le cadre COSO :**\n\t\t● Communique les informations de contrôle interne — Un processus est en place pour communiquer les informations requises afin de permettre à tout le personnel de comprendre et d’exercer leurs responsabilités en matière de contrôle interne.\n\t\t● Communique avec le conseil d’administration — Une communication existe entre la direction et le conseil d’administration afin que les deux disposent des informations nécessaires pour remplir leurs rôles par rapport aux objectifs de l’entité.\n\t\t● Fournit des lignes de communication séparées — Des canaux de communication séparés, tels que des lignes d’alerte éthique, sont en place et servent de mécanismes de secours pour permettre une communication anonyme ou confidentielle lorsque les canaux normaux sont inopérants ou inefficaces.\n\t\t● Sélectionne une méthode de communication pertinente — La méthode de communication prend en compte le timing, le public et la nature de l’information.\n\n**Points de focus supplémentaires lors de l’utilisation des critères de services de confiance :**\n\t\t● Communique les responsabilités — Le personnel de l’entité responsable de la conception, du développement, de la mise en œuvre, de l’exploitation, de la maintenance ou de la surveillance des contrôles du système reçoit des communications concernant leurs responsabilités, y compris les changements dans leurs responsabilités, et dispose des informations nécessaires pour exercer ces responsabilités.\n\t\t● Communique les informations sur les défaillances, incidents, préoccupations et autres sujets — Le personnel de l’entité est informé de la manière de signaler les défaillances du système, les incidents, les préoccupations et autres plaintes.\n\t\t● Communique les objectifs et les changements d’objectifs — L’entité communique ses objectifs et les changements apportés à ces objectifs au personnel de manière opportune.\n\t\t● Communique des informations pour améliorer les connaissances et la sensibilisation à la sécurité — L’entité communique des informations pour améliorer les connaissances et la sensibilisation à la sécurité et pour modéliser des comportements de sécurité appropriés auprès du personnel par le biais d’un programme de formation à la sensibilisation à la sécurité.\n\n**Point de focus supplémentaire lors de l’utilisation des critères de services de confiance pour la confidentialité :**\n\t\t● Communique des informations pour améliorer les connaissances et la sensibilisation à la confidentialité — L’entité communique des informations pour améliorer les connaissances et la sensibilisation à la confidentialité et pour modéliser des comportements appropriés auprès du personnel par le biais d’un programme de formation à la sensibilisation à la confidentialité.\n\t\t● Communique les méthodes de signalement des incidents — L’entité a communiqué aux employés et autres au sein de l’entité le processus utilisé pour signaler un incident présumé lié à la confidentialité.\n\n**Points de focus supplémentaires lors de l’utilisation des critères de services de confiance au niveau du système :**\n\t\t● Communique des informations sur le fonctionnement et les limites du système — L’entité prépare et communique des informations sur la conception et le fonctionnement du système et ses limites au personnel autorisé pour leur permettre de comprendre leur rôle dans le système et les résultats du fonctionnement du système.\n\t\t● Communique les objectifs du système — L’entité communique ses objectifs au personnel pour leur permettre d’exercer leurs responsabilités.\n\t\t● Communique les changements du système — Les changements du système qui affectent les responsabilités ou la réalisation des objectifs de l’entité sont communiqués de manière opportune."
  3_prefix: "CC2.3"
  3_label: "Principe COSO 15 : L’entité communique avec les parties externes concernant les questions affectant le fonctionnement du contrôle interne."
  3_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n**Points de focus spécifiés dans le cadre COSO :**\n\t\t● Communique aux parties externes — Des processus sont en place pour communiquer des informations pertinentes et opportunes aux parties externes, y compris les actionnaires, partenaires, propriétaires, régulateurs, clients, analystes financiers et autres parties externes.\n\t\t● Permet les communications entrantes — Des canaux de communication ouverts permettent des retours des clients, consommateurs, fournisseurs, auditeurs externes, régulateurs, analystes financiers et autres, fournissant à la direction et au conseil d’administration des informations pertinentes.\n\t\t● Communique avec le conseil d’administration — Les informations pertinentes résultant des évaluations menées par des parties externes sont communiquées au conseil d’administration.\n\t\t● Fournit des lignes de communication séparées — Des canaux de communication séparés, tels que des lignes d’alerte éthique, sont en place et servent de mécanismes de secours pour permettre une communication anonyme ou confidentielle lorsque les canaux normaux sont inopérants ou inefficaces.\n\t\t● Sélectionne une méthode de communication pertinente — La méthode de communication prend en compte le timing, le public et la nature de la communication ainsi que les exigences et attentes légales, réglementaires et fiduciaires.\n\n**Point de focus supplémentaire lors de l’utilisation des critères de services de confiance pour la confidentialité :**\n\t\t● Communique les objectifs liés à la confidentialité et les changements apportés à ces objectifs — L’entité communique, aux utilisateurs externes, fournisseurs, partenaires commerciaux et autres dont les produits ou services, ou les deux, font partie du système, les objectifs de l’entité liés à la confidentialité et à la protection des informations confidentielles, ainsi que les changements apportés à ces objectifs.\n\n**Point de focus supplémentaire lors de l’utilisation des critères de services de confiance pour la confidentialité :**\n\t\t● Communique les objectifs liés à la confidentialité et les changements apportés à ces objectifs — L’entité communique, aux utilisateurs externes, fournisseurs, partenaires commerciaux et autres dont les produits ou services, ou les deux, font partie du système, les objectifs de l’entité liés à la confidentialité et à la protection des informations personnelles, ainsi que les changements apportés à ces objectifs.\n\t\t● Communique les méthodes de signalement des incidents — L’entité communique aux entités utilisatrices, tiers, sujets de données et autres le processus utilisé pour signaler un incident présumé lié à la confidentialité.\n\n**Points de focus supplémentaires lors de l’utilisation des critères de services de confiance au niveau du système :**\n\t\t● Communique des informations sur le fonctionnement et les limites du système — L’entité prépare et communique des informations sur la conception et le fonctionnement du système et ses limites aux utilisateurs externes autorisés pour leur permettre de comprendre leur rôle dans le système et les résultats du fonctionnement du système.\n\t\t● Communique les objectifs du système — L’entité communique ses objectifs du système aux utilisateurs externes appropriés.\n\t\t● Communique les responsabilités du système — Les utilisateurs externes responsables de la conception, du développement, de la mise en œuvre, de l’exploitation, de la maintenance et de la surveillance des contrôles du système reçoivent des informations sur ces responsabilités et disposent des informations nécessaires pour exercer ces responsabilités.\n\t\t● Communique des informations sur le signalement des défaillances du système, incidents, préoccupations et autres sujets — Les utilisateurs externes sont informés de la manière de signaler les défaillances du système, les incidents, les préoccupations et autres plaintes au personnel approprié de l’entité."
3:
  prefix: "CC3"
  title: "Évaluation des risques"
  1_prefix: "CC3.1"
  1_label: "Principe COSO 6 : L’entité spécifie des objectifs avec une clarté suffisante pour permettre l’identification et l’évaluation des risques liés aux objectifs."
  1_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n**Points de focus spécifiés dans le cadre COSO :**\n\n**Objectifs opérationnels**\n\t\t● Reflète les choix de la direction — Les objectifs opérationnels reflètent les choix de la direction concernant la structure, les considérations sectorielles et la performance de l’entité.\n\t\t● Prend en compte les tolérances aux risques — La direction considère les niveaux acceptables de variation par rapport à la réalisation des objectifs opérationnels.\n\t\t● Inclut les objectifs de performance opérationnelle et financière — L’organisation reflète le niveau souhaité de performance opérationnelle et financière pour l’entité dans les objectifs opérationnels.\n\t\t● Constitue une base pour l’engagement des ressources — La direction utilise les objectifs opérationnels comme base pour allouer les ressources nécessaires à l’atteinte des performances opérationnelles et financières souhaitées.\n\n**Objectifs de reporting financier externe**\n\t\t● Respecte les normes comptables applicables — Les objectifs de reporting financier sont conformes aux principes comptables adaptés et disponibles pour cette entité. Les principes comptables sélectionnés sont appropriés dans les circonstances.\n\t\t● Prend en compte la matérialité — La direction considère la matérialité dans la présentation des états financiers.\n\t\t● Reflète les activités de l’entité — Le reporting externe reflète les transactions et événements sous-jacents pour montrer les caractéristiques qualitatives et les assertions.\n\n**Objectifs de reporting non financier externe**\n\t\t● Respecte les cadres établis en externe — La direction établit des objectifs conformes aux lois et réglementations ou aux normes et cadres d’organisations externes reconnues.\n\t\t● Prend en compte le niveau de précision requis — La direction reflète le niveau de précision et d’exactitude requis, adapté aux besoins des utilisateurs et basé sur des critères établis par des tiers dans le reporting non financier.\n\t\t● Reflète les activités de l’entité — Le reporting externe reflète les transactions et événements sous-jacents dans une plage de limites acceptables.\n\n**Objectifs de reporting interne**\n\t\t● Reflète les choix de la direction — Le reporting interne fournit à la direction des informations exactes et complètes concernant les choix de la direction et les informations nécessaires à la gestion de l’entité.\n\t\t● Prend en compte le niveau de précision requis — La direction reflète le niveau de précision et d’exactitude requis, adapté aux besoins des utilisateurs dans les objectifs de reporting non financier et la matérialité dans les objectifs de reporting financier.\n\t\t● Reflète les activités de l’entité — Le reporting interne reflète les transactions et événements sous-jacents dans une plage de limites acceptables.\n\n**Objectifs de conformité** \n\t\t● Reflète les lois et réglementations externes — Les lois et réglementations établissent des normes minimales de conduite, que l’entité intègre dans ses objectifs de conformité.\n\t\t● Prend en compte les tolérances aux risques — La direction considère les niveaux acceptables de variation par rapport à la réalisation des objectifs opérationnels.\n\n**Point de focus supplémentaire lors de l’utilisation des critères de services de confiance :**\n\t\t● Établit des sous-objectifs pour l’évaluation des risques — La direction identifie des sous-objectifs à utiliser dans l’évaluation des risques liés à la sécurité, la disponibilité, l’intégrité du traitement, la confidentialité ou la confidentialité pour soutenir la réalisation des objectifs de l’entité."
  2_prefix: "CC3.2"
  2_label: "Principe COSO 7 : L’entité identifie les risques pour la réalisation de ses objectifs au sein de l’entité et analyse les risques comme base pour déterminer comment les risques doivent être gérés."
  2_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n**Points de focus spécifiés dans le cadre COSO :**\n\t\t● Inclut l’entité, les filiales, les divisions, les unités opérationnelles et les niveaux fonctionnels — L’entité identifie et évalue les risques au niveau de l’entité, des filiales, des divisions, des unités opérationnelles et des niveaux fonctionnels pertinents pour la réalisation des objectifs.\n\t\t● Analyse les facteurs internes et externes — L’identification des risques prend en compte les facteurs internes et externes et leur impact sur la réalisation des objectifs.\n\t\t● Implique les niveaux appropriés de la direction — L’entité met en place des mécanismes efficaces d’évaluation des risques qui impliquent les niveaux appropriés de la direction.\n\t\t● Estime la signification des risques identifiés — Les risques identifiés sont analysés par un processus qui inclut l’estimation de la signification potentielle du risque.\n\t\t● Détermine comment répondre aux risques — L’évaluation des risques inclut la considération de la manière dont le risque doit être géré et s’il faut l’accepter, l’éviter, le réduire ou le partager.\n\n**Points de focus supplémentaires lors de l’utilisation des critères de services de confiance :**\n\t\t● Identifie les menaces pour les objectifs — L’entité identifie les menaces pesant sur la réalisation de ses objectifs, qu’elles proviennent d’actes intentionnels (y compris malveillants) ou non intentionnels, ainsi que d’événements environnementaux.\n\t\t● Identifie la vulnérabilité des composants du système — L’entité identifie les vulnérabilités des composants du système, y compris les processus système, l’infrastructure, les logiciels et autres actifs informationnels.\n\t\t● Analyse les menaces et vulnérabilités provenant des fournisseurs, partenaires commerciaux et autres parties — Le processus d’évaluation des risques de l’entité inclut l’analyse des menaces et vulnérabilités potentielles provenant des fournisseurs de biens et services, ainsi que des menaces et vulnérabilités provenant des partenaires commerciaux, clients et autres tiers ayant accès aux systèmes d’information de l’entité.\n\t\t● Évalue la signification des risques — L’entité évalue la signification des risques identifiés, y compris (1) la détermination de la criticité des composants du système, y compris les actifs informationnels, dans la réalisation des objectifs ; (2) l’évaluation de la susceptibilité des vulnérabilités identifiées aux menaces identifiées ; (3) l’évaluation de la probabilité des risques identifiés ; (4) l’évaluation de l’ampleur de l’effet des risques potentiels sur la réalisation des objectifs ; (5) la prise en compte des effets potentiels des menaces et vulnérabilités non identifiées sur les risques évalués ; (6) le développement de stratégies d’atténuation des risques pour traiter les risques évalués ; et (7) l’évaluation de l’adéquation du risque résiduel (y compris s’il faut accepter, réduire ou partager ces risques)."
  3_prefix: "CC3.3"
  3_label: "Principe COSO 8 : L’entité prend en compte le potentiel de fraude dans l’évaluation des risques pour la réalisation des objectifs."
  3_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n**Points de focus spécifiés dans le cadre COSO :**\n\t\t● Prend en compte divers types de fraude — L’évaluation de la fraude considère les rapports frauduleux, la perte possible d’actifs et la corruption résultant des diverses manières dont la fraude et les inconduites peuvent se produire.\n\t\t● Évalue les incitations et pressions — L’évaluation des risques de fraude considère les incitations et pressions.\n\t\t● Évalue les opportunités — L’évaluation des risques de fraude considère les opportunités d’acquisition, d’utilisation ou de disposition non autorisées d’actifs, de modification des registres de reporting de l’entité ou de commission d’autres actes inappropriés.\n\t\t● Évalue les attitudes et rationalisations — L’évaluation des risques de fraude considère comment la direction et les autres membres du personnel pourraient s’engager dans ou justifier des actions inappropriées.\n\n**Point de focus supplémentaire lors de l’utilisation des critères de services de confiance :**\n\t\t● Prend en compte les risques liés à l’utilisation des TI et à l’accès à l’information — L’évaluation des risques de fraude inclut la considération des menaces et vulnérabilités internes et externes qui découlent spécifiquement de l’utilisation des TI et de l’accès à l’information."
  4_prefix: "CC3.4"
  4_label: "Principe COSO 9 : L’entité identifie et évalue les changements qui pourraient avoir un impact significatif sur le système de contrôle interne."
  4_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n**Points de focus spécifiés dans le cadre COSO :**\n\t\t● Évalue les changements dans l’environnement externe — Le processus d’identification des risques considère les changements dans l’environnement réglementaire, économique et physique dans lequel l’entité opère.\n\t\t● Évalue les changements dans le modèle économique — L’entité considère les impacts potentiels des nouvelles lignes de métier, des compositions radicalement modifiées des lignes de métier existantes, des opérations commerciales acquises ou cédées sur le système de contrôle interne, de la croissance rapide, de l’évolution de la dépendance aux géographies étrangères et des nouvelles technologies.\n\t\t● Évalue les changements dans la direction — L’entité considère les changements dans la direction et les attitudes et philosophies respectives concernant le système de contrôle interne.\n\n**Points de focus supplémentaires lors de l’utilisation des critères de services de confiance :**\n\t\t● Évalue les changements dans les systèmes et la technologie — Le processus d’identification des risques considère les changements découlant des modifications des systèmes de l’entité et des changements dans l’environnement technologique.\n\t\t● Évalue les changements dans les relations avec les fournisseurs et partenaires commerciaux — Le processus d’identification des risques considère les changements dans les relations avec les fournisseurs et partenaires commerciaux.\n\t\t● Évalue les changements dans les menaces et vulnérabilités — Le processus d’identification des risques évalue les changements dans (1) les menaces internes et externes et les vulnérabilités des composants des systèmes de l’entité et (2) la probabilité et l’ampleur des risques résultants pour la réalisation des objectifs de l’entité."
4:
  prefix: "CC4"
  title: "Activités de surveillance"
  1_prefix: "CC4.1"
  1_label: "Principe COSO 16 : L’entité sélectionne, développe et réalise des évaluations continues et/ou distinctes pour déterminer si les composantes du contrôle interne sont présentes et fonctionnent."
  1_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n**Points de focus spécifiés dans le cadre COSO :**\n\t\t● Prend en compte un mélange d’évaluations continues et distinctes — La direction inclut un équilibre entre les évaluations continues et distinctes.\n\t\t● Prend en compte le rythme de changement — La direction considère le rythme de changement dans les activités et les processus métiers lors de la sélection et du développement des évaluations continues et distinctes.\n\t\t● Établit une compréhension de référence — La conception et l’état actuel d’un système de contrôle interne sont utilisés pour établir une référence pour les évaluations continues et distinctes.\n\t\t● Utilise du personnel compétent — Les évaluateurs réalisant les évaluations continues et distinctes ont suffisamment de connaissances pour comprendre ce qui est évalué.\n\t\t● Intègre aux processus métiers — Les évaluations continues sont intégrées aux processus métiers et s’adaptent aux conditions changeantes.\n\t\t● Ajuste la portée et la fréquence — La direction fait varier la portée et la fréquence des évaluations distinctes en fonction des risques.\n\t\t● Évalue de manière objective — Les évaluations distinctes sont réalisées périodiquement pour fournir des retours objectifs.\n\n**Point de focus supplémentaire lors de l’utilisation des critères de services de confiance :**\n\t\t● Prend en compte différents types d’évaluations continues et distinctes — La direction utilise une variété d’évaluations continues et distinctes des risques et des contrôles pour déterminer si les contrôles internes sont présents et fonctionnent. Selon les objectifs de l’entité, ces évaluations des risques et des contrôles peuvent inclure la surveillance et les tests de contrôle de première et deuxième ligne, les évaluations d’audit interne, les évaluations de conformité, les évaluations de résilience, les analyses de vulnérabilités, les évaluations de sécurité, les tests d’intrusion et les évaluations tierces."
  2_prefix: "CC4.2"
  2_label: "Principe COSO 17 : L’entité évalue et communique les défaillances du contrôle interne de manière opportune aux parties responsables de la prise d’actions correctives, y compris la direction et le conseil d’administration, le cas échéant."
  2_desc: "Les points de focus suivants, spécifiés dans le cadre COSO, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Évalue les résultats — La direction et le conseil d’administration, le cas échéant, évaluent les résultats des évaluations continues et distinctes.\n\t\t● Communique les défaillances — Les défaillances sont communiquées aux parties responsables de la prise d’actions correctives et à la direction et au conseil d’administration, le cas échéant.\n\t\t● Surveille les actions correctives — La direction suit si les défaillances sont corrigées de manière opportune."
5:
  prefix: "CC5"
  title: "Activités de contrôle"
  1_prefix: "CC5.1"
  1_label: "Principe COSO 10 : L’entité sélectionne et développe des activités de contrôle qui contribuent à l’atténuation des risques pour la réalisation des objectifs à des niveaux acceptables."
  1_desc: "Les points de focus suivants, spécifiés dans le cadre COSO, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Intègre à l’évaluation des risques — Les activités de contrôle aident à garantir que les réponses aux risques qui traitent et atténuent les risques sont mises en œuvre.\n\t\t● Prend en compte les facteurs spécifiques à l’entité — La direction considère comment l’environnement, la complexité, la nature et la portée de ses opérations, ainsi que les caractéristiques spécifiques de son organisation, affectent la sélection et le développement des activités de contrôle.\n\t\t● Détermine les processus métiers pertinents — La direction détermine quels processus métiers pertinents nécessitent des activités de contrôle.\n\t\t● Évalue une variété de types d’activités de contrôle — Les activités de contrôle incluent une gamme et une variété de contrôles et peuvent inclure un équilibre d’approches pour atténuer les risques, en considérant à la fois les contrôles manuels et automatisés, ainsi que les contrôles préventifs et détectifs.\n\t\t● Prend en compte à quel niveau les activités sont appliquées — La direction considère les activités de contrôle à divers niveaux au sein de l’entité.\n\t\t● Traite la séparation des tâches — La direction sépare les tâches incompatibles et, lorsque cette séparation n’est pas pratique, la direction sélectionne et développe des activités de contrôle alternatives."
  2_prefix: "CC5.2"
  2_label: "Principe COSO 11 : L’entité sélectionne et développe également des activités de contrôle général sur la technologie pour soutenir la réalisation des objectifs."
  2_desc: "Les points de focus suivants, spécifiés dans le cadre COSO, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Détermine la dépendance entre l’utilisation de la technologie dans les processus métiers et les contrôles généraux technologiques — La direction comprend et détermine la dépendance et le lien entre les processus métiers, les activités de contrôle automatisées et les contrôles généraux technologiques.\n\t\t● Établit des activités de contrôle pertinentes pour l’infrastructure technologique — La direction sélectionne et développe des activités de contrôle sur l’infrastructure technologique, qui sont conçues et mises en œuvre pour aider à garantir l’exhaustivité, l’exactitude et la disponibilité du traitement technologique.\n\t\t● Établit des activités de contrôle pertinentes pour les processus de gestion de la sécurité — La direction sélectionne et développe des activités de contrôle qui sont conçues et mises en œuvre pour restreindre les droits d’accès à la technologie aux utilisateurs autorisés en fonction de leurs responsabilités professionnelles et pour protéger les actifs de l’entité contre les menaces externes.\n\t\t● Établit des activités de contrôle pertinentes pour les processus d’acquisition, de développement et de maintenance de la technologie — La direction sélectionne et développe des activités de contrôle sur l’acquisition, le développement et la maintenance de la technologie et de son infrastructure pour atteindre les objectifs de la direction."
  3_prefix: "CC5.3"
  3_label: "Principe COSO 12 : L’entité déploie des activités de contrôle par le biais de politiques qui établissent ce qui est attendu et de procédures qui mettent les politiques en action."
  3_desc: "Les points de focus suivants, spécifiés dans le cadre COSO, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Établit des politiques et procédures pour soutenir le déploiement des directives de la direction — La direction établit des activités de contrôle qui sont intégrées aux processus métiers et aux activités quotidiennes des employés par le biais de politiques établissant ce qui est attendu et de procédures pertinentes spécifiant les actions.\n\t\t● Établit la responsabilité et l’obligation de rendre compte pour l’exécution des politiques et procédures — La direction établit la responsabilité et l’obligation de rendre compte pour les activités de contrôle avec la direction (ou d’autres personnel désigné) de l’unité commerciale ou de la fonction dans laquelle résident les risques pertinents.\n\t\t● Exécute de manière opportune — Le personnel responsable exécute les activités de contrôle de manière opportune comme défini par les politiques et procédures.\n\t\t● Prend des actions correctives — Le personnel responsable enquête et agit sur les questions identifiées à la suite de l’exécution des activités de contrôle.\n\t\t● Exécute avec du personnel compétent — Un personnel compétent doté d’une autorité suffisante exécute les activités de contrôle avec diligence et une attention continue.\n\t\t● Réévalue les politiques et procédures — La direction examine périodiquement les activités de contrôle pour déterminer leur pertinence continue et les actualise si nécessaire."
6:
  prefix: "CC6"
  title: "Contrôles d'accès logique et physique"
  1_prefix: "CC6.1"
  1_label: "L’entité met en œuvre des logiciels, infrastructures et architectures de sécurité d’accès logique pour protéger les actifs informationnels contre les événements de sécurité afin de répondre aux objectifs de l’entité."
  1_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n**Points de focus lors de l’utilisation des critères de services de confiance pour toutes les missions :**\n\t\t● Identifie et gère l’inventaire des actifs informationnels — L’entité identifie, inventorie, classe et gère les actifs informationnels (par exemple, l’infrastructure, les logiciels et les données).\n\t\t● Évalue les nouvelles architectures — L’entité identifie les nouvelles architectures système et évalue leur sécurité avant leur mise en œuvre dans l’environnement système.\n\t\t● Restreint l’accès logique — L’entité restreint l’accès logique aux actifs informationnels, y compris l’infrastructure (par exemple, serveurs, stockage, éléments réseau, API et terminaux), les logiciels et les données (au repos, pendant le traitement ou en transmission) par l’utilisation de logiciels de contrôle d’accès, de jeux de règles et de processus de durcissement de configuration standard.\n\t\t● Identifie et authentifie les utilisateurs — L’entité identifie et authentifie les personnes, l’infrastructure et les logiciels avant l’accès aux actifs informationnels, que ce soit localement ou à distance. L’entité utilise des techniques d’authentification utilisateur plus complexes ou avancées, telles que l’authentification multifactorielle, lorsque de telles protections sont jugées appropriées en fonction de sa stratégie d’atténuation des risques.\n\t\t● Prend en compte la segmentation du réseau — L’entité utilise la segmentation du réseau, les architectures zero trust et d’autres techniques pour isoler les parties non liées de la technologie de l’information de l’entité les unes des autres, en fonction de la stratégie d’atténuation des risques de l’entité.\n\t\t● Gère les points d’accès — Les points d’accès par des entités externes et les types de données qui transitent par ces points d’accès sont identifiés, inventoriés et gérés. Les types d’individus et de systèmes utilisant chaque point d’accès sont identifiés, documentés et gérés.\n\t\t● Restreint l’accès aux actifs informationnels — Des combinaisons de classification des données, de structures de données distinctes, de restrictions de ports, de restrictions de protocoles d’accès, d’identification des utilisateurs et de certificats numériques sont utilisées pour établir des règles de contrôle d’accès et des normes de configuration pour les actifs informationnels.\n\t\t● Gère l’identification et l’authentification — Les exigences d’identification et d’authentification sont établies, documentées et gérées pour les individus et les systèmes accédant aux informations, à l’infrastructure et aux logiciels de l’entité.\n\t\t● Gère les identifiants pour l’infrastructure et les logiciels — Les nouvelles infrastructures et logiciels internes et externes sont enregistrés, autorisés et documentés avant de se voir attribuer des identifiants d’accès et d’être mis en œuvre sur le réseau ou le point d’accès. Les identifiants sont supprimés et l’accès est désactivé lorsque l’accès n’est plus requis ou que l’infrastructure et les logiciels ne sont plus utilisés.\n\t\t● Utilise le chiffrement pour protéger les données — L’entité utilise le chiffrement pour protéger les données (au repos, pendant le traitement ou en transmission), lorsque de telles protections sont jugées appropriées en fonction de la stratégie d’atténuation des risques de l’entité.\n\t\t● Protège les clés cryptographiques — L’entité protège les clés cryptographiques pendant leur génération, leur stockage, leur utilisation et leur destruction. Les modules cryptographiques, les algorithmes, les longueurs de clé et les architectures sont appropriés en fonction de la stratégie d’atténuation des risques de l’entité.\n\n**Point de focus supplémentaire lors de l’utilisation des critères de services de confiance pour la confidentialité :**\n\t\t● Restreint l’accès et l’utilisation des informations confidentielles à des fins identifiées — L’accès logique et l’utilisation des informations confidentielles sont restreints à des fins identifiées.\n\n**Point de focus supplémentaire lors de l’utilisation des critères de services de confiance pour la confidentialité :**\n\t\t● Restreint l’accès et l’utilisation des informations personnelles — L’accès logique et l’utilisation des informations personnelles sont restreints au personnel autorisé qui nécessite un tel accès pour remplir les objectifs identifiés afin de soutenir la réalisation des objectifs de l’entité liés à la confidentialité."
  2_prefix: "CC6.2"
  2_label: "Avant de délivrer des identifiants système et d’accorder l’accès au système, l’entité enregistre et autorise les nouveaux utilisateurs internes et externes dont l’accès est administré par l’entité. Pour les utilisateurs dont l’accès est administré par l’entité, les identifiants système des utilisateurs sont supprimés lorsque l’accès de l’utilisateur n’est plus autorisé."
  2_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Crée des identifiants d’accès aux actifs informationnels protégés — L’entité crée des identifiants pour accéder aux actifs informationnels protégés sur la base d’une autorisation du propriétaire de l’actif ou du responsable autorisé du système. Une autorisation est requise pour la création de tous les types d’identifiants des individus (par exemple, employés, contractants, fournisseurs et personnel des partenaires commerciaux), des systèmes et des logiciels.\n\t\t● Examine la validité des identifiants d’accès — L’entité examine périodiquement la validité des identifiants d’accès (par exemple, employés, contractants, fournisseurs et personnel des partenaires commerciaux) et des comptes système ou de service inappropriés.\n\t\t● Empêche l’utilisation des identifiants lorsqu’ils ne sont plus valides — Des processus sont en place pour désactiver, détruire ou autrement empêcher l’utilisation des identifiants d’accès lorsqu’ils ne sont plus valides."
  3_prefix: "CC6.3"
  3_label: "L’entité autorise, modifie ou supprime l’accès aux données, logiciels, fonctions et autres actifs informationnels protégés en fonction des rôles, des responsabilités ou de la conception du système et des changements, en tenant compte des concepts de moindre privilège et de séparation des tâches, afin de répondre aux objectifs de l’entité."
  3_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Crée ou modifie l’accès aux actifs informationnels protégés — Des processus sont en place pour créer ou modifier l’accès aux actifs informationnels protégés sur la base d’une autorisation du propriétaire de l’actif.\n\t\t● Supprime l’accès aux actifs informationnels protégés — Des processus sont en place pour supprimer l’accès aux actifs informationnels protégés lorsqu’il n’est plus requis.\n\t\t● Utilise des structures de contrôle d’accès — L’entité utilise des structures de contrôle d’accès, telles que les contrôles d’accès basés sur les rôles, pour restreindre l’accès aux actifs informationnels protégés, limiter les privilèges et soutenir la séparation des fonctions incompatibles.\n\t\t● Examine les rôles et règles d’accès — La pertinence des rôles d’accès et des règles d’accès est examinée périodiquement pour les individus inutiles ou inappropriés (par exemple, employés, contractants, fournisseurs, personnel des partenaires commerciaux) et les comptes système ou de service inappropriés. Les rôles et règles d’accès sont modifiés, le cas échéant."
  4_prefix: "CC6.4"
  4_label: "L’entité restreint l’accès physique aux installations et aux actifs informationnels protégés (par exemple, les installations de centres de données, le stockage des supports de sauvegarde et autres emplacements sensibles) au personnel autorisé afin de répondre aux objectifs de l’entité."
  4_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Crée ou modifie l’accès physique — Des processus sont en place pour créer ou modifier l’accès physique des employés, contractants, fournisseurs et personnel des partenaires commerciaux aux installations telles que les centres de données, les espaces de bureau et les zones de travail, sur la base d’une autorisation appropriée.\n\t\t● Supprime l’accès physique — Des processus sont en place pour supprimer l’accès physique aux installations et aux actifs informationnels protégés lorsqu’un employé, un contractant, un fournisseur ou un partenaire commercial n’a plus besoin d’y accéder.\n\t\t● Récupère les dispositifs physiques — Des processus sont en place pour récupérer les dispositifs de l’entité (par exemple, badges, ordinateurs portables et appareils mobiles) lorsqu’un employé, un contractant, un fournisseur ou un partenaire commercial n’a plus besoin d’y accéder.\n\t\t● Examine l’accès physique — Des processus sont en place pour examiner périodiquement l’accès physique afin de garantir sa cohérence avec les responsabilités professionnelles."
  5_prefix: "CC6.5"
  5_label: "L’entité met fin aux protections logiques et physiques sur les actifs physiques uniquement après que la capacité de lire ou de récupérer des données et des logiciels à partir de ces actifs a été réduite et n’est plus requise pour répondre aux objectifs de l’entité."
  5_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Supprime les données et logiciels pour leur élimination — Des procédures sont en place pour supprimer, effacer ou rendre autrement inaccessibles les données et logiciels des actifs physiques et autres dispositifs appartenant à l’entité, à ses fournisseurs et à ses employés lorsque les données et logiciels ne sont plus requis sur l’actif ou que l’actif ne sera plus sous le contrôle de l’entité."
  6_prefix: "CC6.6"
  6_label: "L’entité met en œuvre des mesures de sécurité d’accès logique pour se protéger contre les menaces provenant de sources extérieures à ses limites système."
  6_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Restreint l’accès — Les types d’activités pouvant se produire via un canal de communication (par exemple, site FTP, port de routeur) sont restreints.\n\t\t● Protège les identifiants et informations d’authentification — Les identifiants et informations d’authentification sont protégés pendant la transmission en dehors de ses limites système.\n\t\t● Exige une authentification ou des identifiants supplémentaires — Des informations ou identifiants d’authentification supplémentaires sont requis lors de l’accès au système depuis l’extérieur de ses limites.\n\t\t● Met en œuvre des systèmes de protection des frontières — Les systèmes de protection des frontières (par exemple, pare-feu, zones démilitarisées, systèmes de détection ou de prévention des intrusions et systèmes de détection et de réponse des terminaux) sont configurés, mis en œuvre et maintenus pour protéger les points d’accès externes."
  7_prefix: "CC6.7"
  7_label: "L’entité restreint la transmission, le déplacement et le retrait des informations aux utilisateurs et processus internes et externes autorisés et les protège pendant la transmission, le déplacement ou le retrait afin de répondre aux objectifs de l’entité."
  7_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Restreint la capacité d’effectuer une transmission — Des processus et technologies de prévention des pertes de données sont utilisés pour restreindre la capacité d’autoriser et d’exécuter la transmission, le déplacement et le retrait des informations.\n\t\t● Utilise des technologies de chiffrement ou des canaux de communication sécurisés pour protéger les données — Des technologies de chiffrement ou des canaux de communication sécurisés sont utilisés pour protéger la transmission des données et autres communications au-delà des points d’accès de connectivité.\n\t\t● Protège les supports amovibles — Des technologies de chiffrement et des protections des actifs physiques sont utilisées pour les supports amovibles (tels que les clés USB et les bandes de sauvegarde), le cas échéant.\n\t\t● Protège les terminaux — Des processus et contrôles sont en place pour protéger les terminaux (tels que les appareils mobiles, les ordinateurs portables, les ordinateurs de bureau et les capteurs)."
  8_prefix: "CC6.8"
  8_label: "L’entité met en œuvre des contrôles pour prévenir ou détecter et agir sur l’introduction de logiciels non autorisés ou malveillants afin de répondre aux objectifs de l’entité."
  8_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Restreint l’installation et la modification des applications et logiciels — La capacité d’installer et de modifier des applications et logiciels est restreinte aux individus autorisés. Les logiciels utilitaires capables de contourner les procédures normales d’exploitation ou de sécurité sont limités aux individus autorisés et sont régulièrement surveillés.\n\t\t● Détecte les changements non autorisés dans les logiciels et les paramètres de configuration — Des processus sont en place pour détecter les changements dans les logiciels et les paramètres de configuration qui peuvent indiquer la présence de logiciels non autorisés ou malveillants.\n\t\t● Utilise un processus de contrôle des changements défini — Un processus de contrôle des changements défini par la direction est utilisé pour la mise en œuvre des logiciels.\n\t\t● Utilise des logiciels antivirus et anti-programmes malveillants — Les logiciels antivirus et anti-programmes malveillants sur les serveurs et terminaux sont configurés, mis en œuvre et maintenus pour permettre l’interception ou la détection et la remédiation des programmes malveillants.\n\t\t● Analyse les actifs informationnels provenant de l’extérieur de l’entité pour détecter les programmes malveillants et autres logiciels non autorisés — Des procédures sont en place pour analyser les actifs informationnels qui ont été transférés ou retournés à la garde de l’entité afin de détecter les programmes malveillants et autres logiciels non autorisés. Les programmes malveillants ou autres logiciels détectés sont supprimés avant la connexion au réseau de l’entité."
7:
  prefix: "CC7"
  title: "Exploitation des systèmes"
  1_prefix: "CC7.1"
  1_label: "Pour atteindre ses objectifs, l’entité utilise des procédures de détection et de surveillance pour identifier (1) les changements de configuration entraînant l’introduction de nouvelles vulnérabilités, et (2) les susceptibilités aux vulnérabilités nouvellement découvertes."
  1_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Utilise des normes de configuration définies — L’entité dispose de normes de configuration définies à utiliser pour le durcissement des systèmes.\n\t\t● Surveille l’infrastructure et les logiciels — L’entité surveille l’infrastructure et les logiciels pour détecter les non-conformités aux normes, qui pourraient menacer la réalisation des objectifs de l’entité.\n\t\t● Met en œuvre des mécanismes de détection des changements — Le système informatique comprend un mécanisme de détection des changements (par exemple, des outils de surveillance de l’intégrité des fichiers) pour alerter le personnel des modifications non autorisées des fichiers système critiques, des fichiers de configuration ou des fichiers de contenu.\n\t\t● Détecte les composants inconnus ou non autorisés — Des procédures sont en place pour détecter l’introduction de composants inconnus ou non autorisés.\n\t\t● Effectue des analyses de vulnérabilités — L’entité effectue des analyses de vulnérabilités de l’infrastructure et des logiciels conçues pour identifier les vulnérabilités potentielles ou les mauvaises configurations de manière périodique et après des changements significatifs apportés à l’environnement. Des actions sont entreprises pour remédier aux déficiences identifiées en temps opportun afin de soutenir la réalisation des objectifs de l’entité."
  2_prefix: "CC7.2"
  2_label: "L’entité surveille les composants du système et le fonctionnement de ces composants pour détecter les anomalies indicatives d’actes malveillants, de catastrophes naturelles et d’erreurs affectant la capacité de l’entité à atteindre ses objectifs ; les anomalies sont analysées pour déterminer si elles représentent des événements de sécurité."
  2_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Met en œuvre des politiques, procédures et outils de détection — Des politiques, procédures et outils de détection sont définis et mis en œuvre sur l’infrastructure et les logiciels pour identifier les intrusions potentielles, les accès inappropriés et les anomalies dans le fonctionnement ou les activités inhabituelles sur les systèmes. Les procédures peuvent inclure (1) un processus de gouvernance défini pour la détection et la gestion des événements de sécurité ; (2) l’utilisation de sources de renseignement pour identifier les nouvelles menaces et vulnérabilités découvertes ; et (3) la journalisation des activités système inhabituelles.\n\t\t● Conçoit des mesures de détection — Les mesures de détection sont conçues pour identifier les anomalies qui pourraient résulter de tentatives ou de réalisations de (1) compromission des barrières physiques ; (2) actions non autorisées du personnel autorisé ; (3) utilisation d’identifiants et de données d’authentification compromis ; (4) accès non autorisé depuis l’extérieur des limites du système ; (5) compromission de parties externes autorisées ; et (6) mise en œuvre ou connexion de matériel et de logiciels non autorisés.\n\t\t● Met en œuvre des filtres pour analyser les anomalies — La direction a mis en place des procédures pour filtrer, résumer et analyser les anomalies afin d’identifier les événements de sécurité.\n\t\t● Surveille les outils de détection pour un fonctionnement efficace — La direction a mis en place des processus pour surveiller et maintenir l’efficacité des outils de détection."
  3_prefix: "CC7.3"
  3_label: "L’entité évalue les événements de sécurité pour déterminer s’ils pourraient ou ont entraîné une défaillance de l’entité à atteindre ses objectifs (incidents de sécurité) et, le cas échéant, prend des mesures pour prévenir ou traiter de telles défaillances."
  3_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n**Points de focus lors de l’utilisation des critères de services de confiance pour toutes les missions :**\n\t\t● Répond aux incidents de sécurité — Des procédures sont en place pour répondre aux incidents de sécurité et évaluer l’efficacité de ces politiques et procédures de manière périodique.\n\t\t● Communique et examine les événements de sécurité détectés — Les événements de sécurité détectés sont communiqués et examinés par les personnes responsables de la gestion du programme de sécurité, et des actions sont entreprises, si nécessaire.\n\t\t● Développe et met en œuvre des procédures pour analyser les incidents de sécurité — Des procédures sont en place pour analyser les incidents de sécurité et déterminer l’impact sur le système.\n\n**Points de focus supplémentaires lors de l’utilisation des critères de services de confiance pour la confidentialité :**\n\t\t● Évalue l’impact sur les informations confidentielles — Les événements de sécurité détectés sont évalués pour déterminer s’ils pourraient ou ont entraîné une divulgation ou une utilisation non autorisée d’informations confidentielles.\n\t\t● Détermine les informations confidentielles utilisées ou divulguées — Lorsqu’une utilisation ou une divulgation non autorisée d’informations confidentielles s’est produite, les informations concernées sont identifiées et des actions sont entreprises pour aider à prévenir une récurrence future et traiter les défaillances de contrôle afin de soutenir la réalisation des objectifs de l’entité.\n\n**Points de focus supplémentaires lors de l’utilisation des critères de services de confiance pour la confidentialité :**\n\t\t● Évalue l’impact sur les informations personnelles — Les événements de sécurité détectés sont évalués pour déterminer s’ils pourraient ou ont entraîné une divulgation ou une utilisation non autorisée d’informations personnelles et s’il y a eu une défaillance de conformité avec les lois ou réglementations applicables.\n\t\t● Détermine les informations personnelles utilisées ou divulguées — Lorsqu’une utilisation ou une divulgation non autorisée d’informations personnelles s’est produite, les informations concernées sont identifiées et des actions sont entreprises pour aider à prévenir une récurrence future et traiter les défaillances de contrôle afin de soutenir la réalisation des objectifs de l’entité."
  4_prefix: "CC7.4"
  4_label: "L’entité répond aux incidents de sécurité identifiés en exécutant un programme de réponse aux incidents défini pour comprendre, contenir, remédier et communiquer les incidents de sécurité, le cas échéant."
  4_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n**Points de focus lors de l’utilisation des critères de services de confiance pour toutes les missions :**\n\t\t● Attribue les rôles et responsabilités — Les rôles et responsabilités pour la conception, la mise en œuvre, la maintenance et l’exécution du programme de réponse aux incidents sont attribués, y compris l’utilisation de ressources externes lorsque cela est nécessaire.\n\t\t● Contient et répond aux incidents de sécurité — Des procédures sont en place pour répondre et contenir les incidents de sécurité qui menacent activement les objectifs de l’entité.\n\t\t● Atténue les incidents de sécurité en cours — Des procédures sont en place pour atténuer les effets des incidents de sécurité en cours.\n\t\t● Résout les incidents de sécurité — Des procédures sont en place pour résoudre les incidents de sécurité par la fermeture des vulnérabilités, la suppression des accès non autorisés et d’autres actions de remédiation.\n\t\t● Restaure les opérations — Des procédures sont en place pour restaurer les données et les opérations commerciales dans un état intermédiaire permettant la réalisation des objectifs de l’entité.\n\t\t● Développe et met en œuvre la communication des incidents de sécurité — Des protocoles pour communiquer, en temps opportun, des informations concernant les incidents de sécurité et les actions entreprises aux parties concernées sont développés et mis en œuvre pour soutenir la réalisation des objectifs de l’entité.\n\t\t● Obtient une compréhension de la nature de l’incident et détermine la stratégie de confinement — Une compréhension de la nature (par exemple, la méthode par laquelle l’incident s’est produit et les ressources système affectées) et de la gravité de l’incident de sécurité est obtenue pour déterminer la réponse et la stratégie de confinement appropriées, y compris (1) une détermination du délai de réponse approprié, et (2) la détermination et l’exécution de l’approche de confinement.\n\t\t● Remédie aux vulnérabilités identifiées — Les vulnérabilités identifiées sont remédiées par le développement et l’exécution d’activités de remédiation.\n\t\t● Communique les activités de remédiation — Les activités de remédiation sont documentées et communiquées conformément au programme de réponse aux incidents.\n\t\t● Évalue l’efficacité de la réponse aux incidents — La conception des activités de réponse aux incidents est évaluée pour son efficacité de manière périodique.\n\t\t● Évalue périodiquement les incidents — Périodiquement, la direction examine les incidents liés à la sécurité, la disponibilité, l’intégrité du traitement, la confidentialité et la confidentialité et identifie le besoin de changements système en fonction des schémas d’incidents et des causes profondes.\n\n**Points de focus supplémentaires lors de l’utilisation des critères de services de confiance pour la confidentialité :**\n\t\t● Applique les procédures de réponse aux violations — Les procédures de réponse aux violations sont définies et appliquées en cas d’incident de confidentialité confirmé.\n\t\t● Communique l’utilisation et la divulgation non autorisées — Les événements ayant entraîné une utilisation ou une divulgation non autorisée d’informations personnelles sont communiqués aux sujets de données, aux autorités légales et réglementaires et à d’autres, selon les besoins.\n\t\t● Application de sanctions — La conduite des individus et des organisations agissant sous l’autorité de l’entité et impliqués dans l’utilisation ou la divulgation non autorisée d’informations personnelles est évaluée et, le cas échéant, sanctionnée conformément aux politiques de l’entité et aux exigences légales et réglementaires."
  5_prefix: "CC7.5"
  5_label: "L’entité identifie, développe et met en œuvre des activités pour se rétablir des incidents de sécurité identifiés."
  5_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Restaure l’environnement affecté — Les activités restaurent l’environnement affecté en état de fonctionnement par la reconstruction des systèmes, la mise à jour des logiciels, l’installation de correctifs, la modification des contrôles d’accès et le changement des configurations, selon les besoins.\n\t\t● Communique des informations sur l’incident — Des communications sur la nature de l’incident, les actions de rétablissement entreprises et les activités requises pour la prévention des futurs incidents de sécurité sont faites à la direction et à d’autres, selon le cas (internes et externes).\n\t\t● Détermine la cause profonde de l’incident — La cause profonde de l’incident est déterminée.\n\t\t● Met en œuvre des changements pour prévenir et détecter les récidives — Des architectures supplémentaires ou des changements aux contrôles préventifs et détectifs sont mis en œuvre pour prévenir et détecter les récidives d’incidents en temps opportun.\n\t\t● Améliore les procédures de réponse et de rétablissement — Les leçons tirées sont analysées et le plan de réponse aux incidents et les procédures de rétablissement sont améliorés.\n\t\t● Met en œuvre des tests du plan de rétablissement après incident — Des tests du plan de rétablissement après incident sont effectués de manière périodique. Les tests incluent (1) le développement de scénarios de test basés sur la probabilité et l’ampleur des menaces ; (2) la prise en compte des composants système pertinents de l’ensemble de l’entité pouvant affecter la disponibilité ; (3) des scénarios qui considèrent le potentiel de manque de disponibilité du personnel clé ; et (4) la révision de la posture de résilience et des plans de continuité en fonction des résultats des tests."
8:
  prefix: "CC8"
  title: "Gestion des changements"
  1_prefix: "CC8.1"
  1_label: "L’entité autorise, conçoit, développe ou acquiert, configure, documente, teste, approuve et met en œuvre des changements apportés à l’infrastructure, aux données, aux logiciels et aux procédures pour atteindre ses objectifs."
  1_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n**Points de focus lors de l’utilisation des critères de services de confiance pour toutes les missions :**\n\t\t● Gère les changements tout au long du cycle de vie du système — Un processus de gestion des changements du système tout au long du cycle de vie du système et de ses composants (infrastructure, données, logiciels et procédures manuelles et automatisées) est utilisé pour soutenir la réalisation des objectifs de l’entité.\n\t\t● Autorise les changements — Un processus est en place pour autoriser les changements du système et de l’architecture avant la conception, le développement ou l’acquisition et la configuration.\n\t\t● Conçoit et développe les changements — Un processus est en place pour concevoir et développer les changements du système de manière sécurisée afin de soutenir la réalisation des objectifs de l’entité.\n\t\t● Documente les changements — Un processus est en place pour documenter les changements du système afin de soutenir la maintenance continue du système et d’aider les utilisateurs internes et externes à remplir leurs responsabilités.\n\t\t● Suit les changements du système — Un processus est en place pour suivre les changements du système avant leur mise en œuvre.\n\t\t● Configure les logiciels — Un processus est en place pour sélectionner, mettre en œuvre, maintenir et surveiller les paramètres de configuration utilisés pour contrôler la fonctionnalité des logiciels développés et acquis.\n\t\t● Teste les changements du système — Un processus est en place pour tester les changements du système développés en interne et acquis avant leur mise en œuvre dans l’environnement de production. Des exemples de tests peuvent inclure des tests unitaires, d’intégration, de régression, de code source d’application statique et dynamique, d’assurance qualité ou automatisés (ponctuels ou continus).\n\t\t● Approuve les changements du système — Un processus est en place pour approuver les changements du système avant leur mise en œuvre.\n\t\t● Déploie les changements du système — Un processus est en place pour mettre en œuvre les changements du système en tenant compte de la séparation des responsabilités (par exemple, en restreignant le développement ou les tests unilatéraux du code et la mise en œuvre par un seul utilisateur) pour prévenir ou détecter les changements non autorisés.\n\t\t● Identifie et évalue les changements du système — Les objectifs affectés par les changements du système sont identifiés, et la capacité du système modifié à soutenir la réalisation des objectifs est évaluée tout au long du cycle de vie du développement du système.\n\t\t● Identifie les changements d’infrastructure, de données, de logiciels et de procédures nécessaires pour remédier aux incidents — Les changements d’infrastructure, de données, de logiciels et de procédures nécessaires pour remédier aux incidents sont identifiés et le processus de changement est initié lors de l’identification.\n\t\t● Crée une configuration de base de la technologie informatique — Une configuration de base des systèmes informatiques et de contrôle est créée et maintenue.\n\t\t● Prévoyance des changements nécessaires en situation d’urgence — Un processus est en place pour autoriser, concevoir, tester, approuver et mettre en œuvre les changements nécessaires en situation d’urgence (c’est-à-dire les changements qui doivent être mis en œuvre dans un délai urgent).\n\t\t● Gère les changements de correctifs — Un processus est en place pour identifier, évaluer, tester, approuver et mettre en œuvre les correctifs en temps opportun sur l’infrastructure et les logiciels.\n\n**Points de focus supplémentaires lors de l’utilisation des critères de services de confiance pour la disponibilité :**\n\t\t● Prend en compte la résilience du système — L’entité prend en compte la résilience du système lors de la conception de ses systèmes et teste la résilience pendant le développement pour aider à garantir la capacité de l’entité à répondre, à se rétablir et à reprendre les opérations après des perturbations significatives.\n\n**Points de focus supplémentaires lors de l’utilisation des critères de services de confiance pour la confidentialité :**\n\t\t● Protège les informations confidentielles — L’entité protège les informations confidentielles pendant la conception, le développement, les tests, la mise en œuvre et les processus de changement du système pour soutenir la réalisation des objectifs de l’entité liés à la confidentialité.\n\n**Points de focus supplémentaires lors de l’utilisation des critères de services de confiance pour la confidentialité :**\n\t\t● Protège les informations personnelles — L’entité protège les informations personnelles pendant la conception, le développement, les tests, la mise en œuvre et les processus de changement du système pour soutenir la réalisation des objectifs de l’entité liés à la confidentialité.\n\t\t● confidentialité dès la conception — L’entité prend en compte les exigences de confidentialité dans la conception de ses systèmes et processus et limite la collecte et le traitement des informations personnelles à ce qui est nécessaire pour la finalité identifiée."
9:
  prefix: "CC9"
  title: "Atténuation des risques"
  1_prefix: "CC9.1"
  1_label: "L’entité identifie, sélectionne et développe des activités d’atténuation des risques pour les risques découlant de perturbations potentielles des activités."
  1_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Prend en compte l’atténuation des risques de perturbation des activités — Les activités d’atténuation des risques incluent le développement de politiques, procédures, communications et solutions de traitement alternatives planifiées pour répondre, atténuer et se rétablir des incidents qui perturbent les opérations commerciales. Ces politiques et procédures de résilience incluent des processus de surveillance, des informations et des communications pour soutenir la réalisation des objectifs de l’entité pendant les efforts de réponse, d’atténuation et de rétablissement.\n\t\t● Prend en compte l’utilisation de l’assurance pour atténuer les risques d’impact financier — Les activités de gestion des risques considèrent l’utilisation de l’assurance pour compenser l’impact financier des événements de perte qui pourraient autrement nuire à la capacité de l’entité à soutenir la réalisation de ses objectifs."
  2_prefix: "CC9.2"
  2_label: "L’entité évalue et gère les risques associés aux fournisseurs et partenaires commerciaux."
  2_desc: "Les points de focus suivants mettent en lumière les caractéristiques importantes liées à ce critère :\n\n**Points de focus lors de l’utilisation des critères de services de confiance pour toutes les missions :**\n\t\t● Établit des exigences pour les engagements avec les fournisseurs et partenaires commerciaux — L’entité établit des exigences spécifiques pour les engagements avec les fournisseurs et partenaires commerciaux, qui incluent (1) la portée des services et les spécifications des produits, (2) les rôles et responsabilités, (3) les exigences de conformité, et (4) les niveaux de service.\n\t\t● Identifie les vulnérabilités — L’entité évalue les vulnérabilités découlant des relations avec les fournisseurs et partenaires commerciaux, y compris l’accès des tiers aux systèmes informatiques de l’entité et les connexions avec les réseaux de tiers.\n\t\t● Évalue les risques liés aux fournisseurs et partenaires commerciaux — L’entité inventorie, classe et évalue, de manière périodique, les menaces découlant des relations avec les fournisseurs et partenaires commerciaux (et les fournisseurs et partenaires commerciaux de ces entités) et la vulnérabilité des objectifs de l’entité à ces menaces. Des exemples de menaces découlant des relations avec les fournisseurs et partenaires commerciaux incluent celles découlant de leur (1) défaillance financière, (2) vulnérabilités de sécurité, (3) perturbation opérationnelle, et (4) incapacité à répondre aux exigences commerciales ou réglementaires.\n\t\t● Attribue la responsabilité et l’obligation de rendre compte pour la gestion des fournisseurs et partenaires commerciaux — L’entité attribue la responsabilité et l’obligation de rendre compte pour la gestion des risques et des changements liés aux services associés aux fournisseurs et partenaires commerciaux.\n\t\t● Établit des protocoles de communication pour les fournisseurs et partenaires commerciaux — L’entité établit des protocoles de communication et de résolution pour les problèmes de service ou de produit liés aux fournisseurs et partenaires commerciaux.\n\t\t● Établit des procédures de gestion des exceptions pour les fournisseurs et partenaires commerciaux — L’entité établit des procédures de gestion des exceptions pour les problèmes de service ou de produit liés aux fournisseurs et partenaires commerciaux.\n\t\t● Évalue la performance des fournisseurs et partenaires commerciaux — L’entité évalue la performance des fournisseurs et partenaires commerciaux, aussi fréquemment que nécessaire, en fonction du risque associé au fournisseur ou partenaire commercial.\n\t\t● Met en œuvre des procédures pour traiter les problèmes identifiés lors des évaluations des fournisseurs et partenaires commerciaux — L’entité met en œuvre des procédures pour traiter les problèmes identifiés dans les relations avec les fournisseurs et partenaires commerciaux.\n\t\t● Met en œuvre des procédures pour mettre fin aux relations avec les fournisseurs et partenaires commerciaux — L’entité met en œuvre des procédures pour mettre fin aux relations avec les fournisseurs et partenaires commerciaux en fonction de considérations prédéfinies. Ces procédures peuvent inclure le retour sécurisé des données et leur suppression du système du fournisseur ou partenaire commercial.\n\n**Points de focus supplémentaires lors de l’utilisation des critères de services de confiance pour la confidentialité :**\n\t\t● Obtient des engagements de confidentialité de la part des fournisseurs et partenaires commerciaux — L’entité obtient des engagements de confidentialité conformes aux engagements et exigences de confidentialité de l’entité de la part des fournisseurs et partenaires commerciaux ayant accès à des informations confidentielles.\n\t\t● Évalue la conformité aux engagements de confidentialité des fournisseurs et partenaires commerciaux — De manière périodique et selon les besoins, l’entité évalue la conformité des fournisseurs et partenaires commerciaux aux engagements et exigences de confidentialité de l’entité.\n\n**Points de focus supplémentaires lors de l’utilisation des critères de services de confiance pour la confidentialité :**\n\t\t● Obtient des engagements de protection de la confidentialité de la part des fournisseurs et partenaires commerciaux — L’entité obtient des engagements de protection de la confidentialité, conformes aux engagements et exigences de protection de la confidentialité de l’entité, de la part des fournisseurs et partenaires commerciaux ayant accès à des informations personnelles.\n\t\t● Évalue la conformité aux engagements de protection de la confidentialité des fournisseurs et partenaires commerciaux — De manière périodique et selon les besoins, l’entité évalue la conformité des fournisseurs et partenaires commerciaux aux engagements et exigences de protection de la confidentialité de l’entité et prend des mesures correctives si nécessaire."
10:
  prefix: "A1"
  title: "Critères supplémentaires pour la disponibilité"
  1_prefix: "A1.1"
  1_label: "L’entité maintient, surveille et évalue la capacité de traitement actuelle et l’utilisation des composants du système (infrastructure, données et logiciels) pour gérer la demande de capacité et permettre la mise en œuvre de capacités supplémentaires afin de répondre à ses objectifs."
  1_desc: "Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour la disponibilité, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Mesure l’utilisation actuelle — L’utilisation des composants du système est mesurée pour établir une référence pour la gestion de la capacité et pour l’utiliser lors de la surveillance et de l’évaluation du risque de disponibilité réduite en raison de contraintes de capacité.\n\t\t● Prévision de la capacité — L’utilisation moyenne et maximale prévue des composants du système est prévue et comparée à la capacité du système et aux tolérances associées. La prévision prend en compte la résilience du système et la capacité en cas de défaillance des composants du système qui limitent la capacité.\n\t\t● Effectue des changements basés sur les prévisions — Le processus de gestion des changements du système est initié lorsque l’utilisation prévue dépasse les tolérances de capacité."
  2_prefix: "A1.2"
  2_label: "L’entité autorise, conçoit, développe ou acquiert, met en œuvre, exploite, approuve, maintient et surveille les protections environnementales, les logiciels, les processus de sauvegarde des données et l’infrastructure de récupération pour répondre à ses objectifs."
  2_desc: "Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour la disponibilité, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Identifie les menaces environnementales — Dans le cadre du processus d’évaluation des risques, la direction identifie les menaces environnementales qui pourraient nuire à la disponibilité du système, y compris les menaces résultant de conditions météorologiques défavorables, de défaillances des systèmes de contrôle environnemental, de décharges électriques, d’incendies et d’inondations.\n\t\t● Conçoit des mesures de détection — Des mesures de détection sont mises en œuvre pour identifier les anomalies qui pourraient résulter d’événements de menace environnementale.\n\t\t● Met en œuvre et maintient des mécanismes de protection environnementale — La direction met en œuvre et maintient des mécanismes de protection environnementale pour prévenir et atténuer les événements environnementaux.\n\t\t● Met en œuvre des alertes pour analyser les anomalies — La direction met en œuvre des alertes qui sont communiquées au personnel pour analyse afin d’identifier les événements de menace environnementale.\n\t\t● Répond aux événements de menace environnementale — Des procédures sont en place pour répondre aux événements de menace environnementale et pour évaluer l’efficacité de ces politiques et procédures de manière périodique. Cela inclut les systèmes de mitigation automatique (par exemple, système d’alimentation sans interruption et sous-système de secours par générateur).\n\t\t● Communique et examine les événements de menace environnementale détectés — Les événements de menace environnementale détectés sont communiqués et examinés par les personnes responsables de la gestion du système, et des actions sont entreprises, si nécessaire.\n\t\t● Détermine les données nécessitant une sauvegarde — Les données sont évaluées pour déterminer si une sauvegarde est requise.\n\t\t● Effectue la sauvegarde des données — Des procédures sont en place pour sauvegarder les données, surveiller afin de détecter les échecs de sauvegarde et initier des actions correctives lorsque de tels échecs se produisent.\n\t\t● Traite le stockage hors site — Les données de sauvegarde sont stockées dans un emplacement suffisamment éloigné de leur emplacement de stockage principal pour réduire à un niveau approprié la probabilité qu’un événement de menace de sécurité ou environnementale affecte les deux ensembles de données.\n\t\t● Met en œuvre une infrastructure de traitement alternative — Des mesures sont mises en œuvre pour migrer le traitement vers une infrastructure alternative en cas d’indisponibilité de l’infrastructure de traitement normale. Les mesures peuvent inclure la séparation géographique, la redondance et les capacités de basculement pour les composants.\n\t\t● Prend en compte la récupérabilité des données — La direction identifie les menaces pesant sur la récupérabilité des données (par exemple, les attaques par ransomware) qui pourraient nuire à la disponibilité du système et des données associées et met en œuvre des procédures d’atténuation."
  3_prefix: "A1.3"
  3_label: "L’entité teste les procédures de plan de récupération soutenant la récupération du système pour répondre à ses objectifs."
  3_desc: "Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour la disponibilité, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Met en œuvre des tests du plan de continuité des activités — Des tests du plan de continuité des activités sont effectués de manière périodique pour tester la capacité de l’entité à répondre, à se rétablir et à reprendre les opérations après des perturbations significatives. Les tests incluent (1) le développement de scénarios de test basés sur la probabilité et l’ampleur des menaces ; (2) la prise en compte des composants du système de l’ensemble de l’entité et des fournisseurs pouvant nuire à la disponibilité ; (3) des scénarios qui considèrent le potentiel d’indisponibilité du personnel clé ou des fournisseurs ; et (4) la révision des plans et systèmes de continuité en fonction des résultats des tests.\n\t\t● Teste l’intégrité et l’exhaustivité des données de sauvegarde — L’intégrité et l’exhaustivité des informations de sauvegarde sont testées de manière périodique."
11:
  prefix: "C1"
  title: "Critères supplémentaires pour la confidentialité"
  1_prefix: "C1.1"
  1_label: "L’entité identifie et maintient les informations confidentielles pour répondre aux objectifs de l’entité liés à la confidentialité."
  1_desc: "Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour la confidentialité, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Définit et identifie les informations confidentielles — Des procédures sont en place pour définir, identifier et désigner les informations confidentielles lorsqu’elles sont reçues ou créées.\n\t\t● Conserve les informations confidentielles — Les informations confidentielles sont conservées pas plus longtemps que nécessaire pour remplir la finalité identifiée, sauf si une loi ou un règlement l’exige spécifiquement.\n\t\t● Protège les informations confidentielles de la destruction — Des politiques et procédures sont en place pour protéger les informations confidentielles de l’effacement ou de la destruction pendant la période de conservation spécifiée des informations."
  2_prefix: "C1.2"
  2_label: "L’entité élimine les informations confidentielles pour répondre aux objectifs de l’entité liés à la confidentialité."
  2_desc: "Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour la confidentialité, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Identifie les informations confidentielles à détruire — Des procédures sont en place pour identifier les informations confidentielles nécessitant une destruction lorsque la fin de la période de conservation est atteinte.\n\t\t● Détruit les informations confidentielles — Des politiques et procédures sont en place pour effacer automatiquement ou manuellement, ou détruire autrement, les informations confidentielles qui ont été identifiées pour destruction."
12:
  prefix: "PI1"
  title: "Critères supplémentaires pour l'intégrité du traitement (sur la fourniture de services ou la production, la fabrication ou la distribution de biens)"
  1_prefix: "PI1.1"
  1_label: "L’entité obtient ou génère, utilise et communique des informations pertinentes et de qualité concernant les objectifs liés au traitement, y compris les définitions des données traitées et les spécifications des produits et services, pour soutenir l’utilisation des produits et services."
  1_desc: "**Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour l’intégrité du traitement, mettent en lumière les caractéristiques importantes liées à ce critère :**\n\t● Identifie les exigences fonctionnelles et non fonctionnelles et les spécifications d’information — L’entité identifie et communique les exigences fonctionnelles et non fonctionnelles liées au traitement du système et les spécifications d’information requises pour soutenir l’utilisation des produits et services.\n\t● Définit les données nécessaires pour soutenir un produit ou un service — Lorsque des données sont fournies dans le cadre d’un service ou d’un produit ou dans le cadre d’une obligation de reporting liée à un produit ou un service :\n\t\t1. La définition et la finalité des données sont disponibles pour les utilisateurs des données.\n\t\t2. La définition des données inclut les informations suivantes :\n\t\t\ta. La population d’événements ou d’instances incluse dans l’ensemble de données\n\t\t\tb. La nature de chaque élément (par exemple, champ) de l’ensemble de données (c’est-à-dire l’événement ou l’instance auquel l’élément de données se rapporte, par exemple, le prix de transaction d’une vente d’action de la société XYZ pour le dernier échange de cette action un jour donné)\n\t\t\tc. Les sources des données au sein de l’ensemble\n\t\t\td. Les unités de mesure des éléments de données (par exemple, champs)\n\t\t\te. La précision, l’exactitude ou la justesse de la mesure\n\t\t\tf. L’incertitude ou l’intervalle de confiance inhérent à chaque élément de données et à la population de ces éléments\n\t\t\tg. Les périodes sur lesquelles l’ensemble de données a été mesuré ou la période pendant laquelle les événements auxquels les données se rapportent se sont produits\n\t\t\th. En plus de la date ou de la période, les facteurs qui ont déterminé l’inclusion et l’exclusion d’éléments dans les éléments de données et la population\n\t\t3. La définition des données est complète et exacte.\n\t\t4. La description des données identifie toute information nécessaire pour comprendre chaque élément de données et la population de manière cohérente avec sa définition et sa finalité prévue (métadonnées) qui n’a pas été incluse dans les données.\n\n**Le point de focus suivant, qui s’applique uniquement à une mission utilisant les critères de services de confiance pour l’intégrité du traitement pour un système qui produit, fabrique ou distribue des produits, met en lumière les caractéristiques importantes liées à ce critère :**\n\t● Définit les informations nécessaires pour soutenir l’utilisation d’un bien ou d’un produit — Lorsque des informations fournies par l’entité sont nécessaires pour utiliser le bien ou le produit conformément à ses spécifications :\n\t\t1. Les informations requises sont disponibles pour l’utilisateur du bien ou du produit.\n\t\t2. Les informations requises sont clairement identifiables.\n\t\t3. Les informations requises sont validées pour leur exhaustivité et leur exactitude."
  2_prefix: "PI1.2"
  2_label: "L’entité met en œuvre des politiques et procédures sur les entrées du système, y compris des contrôles sur l’exhaustivité et l’exactitude, pour obtenir des produits, services et rapports répondant aux objectifs de l’entité."
  2_desc: "Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour l’intégrité du traitement, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Définit les caractéristiques des entrées de traitement — Les caractéristiques des entrées de traitement nécessaires pour répondre aux exigences sont définies.\n\t\t● Évalue les entrées de traitement — Les entrées de traitement sont évaluées pour leur conformité aux exigences d’entrée définies.\n\t\t● Crée et maintient des enregistrements des entrées du système — Des enregistrements des activités d’entrée du système sont créés et maintenus de manière complète et exacte en temps opportun."
  3_prefix: "PI1.3"
  3_label: "L’entité met en œuvre des politiques et procédures sur le traitement du système pour obtenir des produits, services et rapports répondant aux objectifs de l’entité."
  3_desc: "Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour l’intégrité du traitement, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Définit les spécifications de traitement — Les spécifications de traitement nécessaires pour répondre aux exigences des produits ou services sont définies.\n\t\t● Définit les activités de traitement — Les activités de traitement sont définies pour obtenir des produits ou services qui répondent aux spécifications.\n\t\t● Détecte et corrige les erreurs d’activité de traitement ou de production — Les erreurs rencontrées dans les activités de traitement ou de production sont détectées et corrigées en temps opportun.\n\t\t● Enregistre les activités de traitement du système — Les activités de traitement du système sont enregistrées de manière complète et exacte en temps opportun.\n\t\t● Traite les entrées — Les entrées sont traitées de manière complète, exacte et opportune, comme autorisé conformément aux activités de traitement définies."
  4_prefix: "PI1.4"
  4_label: "L’entité met en œuvre des politiques et procédures pour rendre disponibles ou livrer les sorties de manière complète, exacte et opportune conformément aux spécifications pour répondre aux objectifs de l’entité."
  4_desc: "Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour l’intégrité du traitement, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Protège les sorties — Les sorties sont protégées lorsqu’elles sont stockées ou livrées, ou les deux, pour éviter le vol, la destruction, la corruption ou la détérioration qui empêcherait les sorties de répondre aux spécifications.\n\t\t● Distribue les sorties uniquement aux parties destinataires — Les sorties sont distribuées ou mises à disposition uniquement aux parties destinataires.\n\t\t● Distribue les sorties de manière complète et exacte — Des procédures sont en place pour garantir l’exhaustivité, l’exactitude et la ponctualité des sorties distribuées.\n\t\t● Crée et maintient des enregistrements des activités de sortie du système — Des enregistrements des activités de sortie du système sont créés et maintenus de manière complète et exacte en temps opportun."
  5_prefix: "PI1.5"
  5_label: "L’entité met en œuvre des politiques et procédures pour stocker les entrées, les éléments en cours de traitement et les sorties de manière complète, exacte et opportune conformément aux spécifications du système pour répondre aux objectifs de l’entité."
  5_desc: "Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour l’intégrité du traitement, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Protège les éléments stockés — Les éléments stockés sont protégés pour éviter le vol, la corruption, la destruction ou la détérioration qui empêcherait les sorties de répondre aux spécifications.\n\t\t● Archive et protège les enregistrements du système — Les enregistrements du système sont archivés et les archives sont protégées contre le vol, la corruption, la destruction ou la détérioration qui les empêcherait d’être utilisés.\n\t\t● Stocke les données de manière complète et exacte — Des procédures sont en place pour garantir le stockage complet, exact et ponctuel des données.\n\t\t● Crée et maintient des enregistrements des activités de stockage du système — Des enregistrements des activités de stockage du système sont créés et maintenus de manière complète et exacte en temps opportun."
13:
  prefix: "P"
  title: "Critères supplémentaires pour la confidentialité"
  desc: "[P] = Ce point d'attention est susceptible d'être pertinent pour un sous-traitant de données.\n\n[C] = Ce point d'attention est susceptible d'être pertinent pour un responsable de traitement."
  1:
    prefix: "P1"
    title: "Critères de confidentialité liés à la notification et à la communication des objectifs liés à la confidentialité"
    1_prefix: "P1.1"
    1_label: "L’entité informe les sujets de données de ses pratiques en matière de confidentialité pour répondre aux objectifs de l’entité liés à la confidentialité. La notification est mise à jour et communiquée aux sujets de données de manière opportune pour les changements apportés aux pratiques de confidentialité de l’entité, y compris les changements dans l’utilisation des informations personnelles, pour répondre aux objectifs de l’entité liés à la confidentialité."
    1_desc: "Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour la confidentialité, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t● Communique aux sujets de données [C] — Une notification est fournie aux sujets de données concernant les éléments suivants :\n\t\t— La finalité de la collecte d’informations personnelles\n\t\t— Le choix et le consentement\n\t\t— Les types d’informations personnelles collectées\n\t\t— Les méthodes de collecte (par exemple, l’utilisation de cookies ou d’autres techniques de suivi)\n\t\t— L’utilisation, la conservation et l’élimination\n\t\t— L’accès\n\t\t— La divulgation à des tiers\n\t\t— La sécurité pour la confidentialité\n\t\t— La qualité, y compris les responsabilités des sujets de données en matière de qualité\n\t\t— La surveillance et l’application\n\tSi des informations personnelles sont collectées à partir de sources autres que l’individu, ces sources sont décrites dans la notification de confidentialité.\n\t\t● Fournit une notification aux sujets de données [C] — Une notification est fournie aux sujets de données (1) au moment ou avant la collecte des informations personnelles ou dès que possible après, (2) au moment ou avant que l’entité modifie sa notification de confidentialité ou dès que possible après, ou (3) avant que les informations personnelles ne soient utilisées à de nouvelles fins non précédemment identifiées.\n\t\t● Couvre les entités et activités dans la notification [C] — Une description objective des entités et activités couvertes est incluse dans la notification de confidentialité de l’entité.\n\t\t● Utilise un langage clair et présente une notification de confidentialité actuelle dans un emplacement facilement accessible aux sujets de données [C] — La notification de confidentialité de l’entité est actuelle, datée, utilise un langage clair et se trouve dans un emplacement facilement accessible aux sujets de données.\n\t\t● Examine la notification de confidentialité [C] — Un processus est défini pour examiner périodiquement le contenu de la notification de confidentialité et pour mettre en œuvre les mises à jour identifiées.\n\t\t● Communique les changements apportés à la notification [C] — Les sujets de données sont informés lorsque des changements sont apportés à la notification de confidentialité et de la nature de ces changements.\n\t\t● Conserve les versions antérieures de la notification — Les versions antérieures de la notification de confidentialité sont conservées conformément aux exigences internes pour documenter les communications antérieures."
  2:
    prefix: "P2"
    title: "Critères de confidentialité liés au choix et au consentement"
    1_prefix: "P2.1"
    1_label: "L’entité communique les choix disponibles concernant la collecte, l’utilisation, la conservation, la divulgation et l’élimination des informations personnelles aux sujets de données et les conséquences, le cas échéant, de chaque choix. Le consentement explicite pour la collecte, l’utilisation, la conservation, la divulgation et l’élimination des informations personnelles est obtenu auprès des sujets de données ou d’autres personnes autorisées, si nécessaire. Un tel consentement est obtenu uniquement pour la finalité prévue des informations afin de répondre aux objectifs de l’entité liés à la confidentialité. La base de l’entité pour déterminer le consentement implicite pour la collecte, l’utilisation, la conservation, la divulgation et l’élimination des informations personnelles est documentée."
    1_desc: "Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour la confidentialité, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Communique aux sujets de données [C] — Les sujets de données sont informés (a) des choix qui s’offrent à eux concernant la collecte, l’utilisation et la divulgation des informations personnelles et (b) que le consentement implicite ou explicite est requis pour collecter, utiliser et divulguer des informations personnelles, sauf si une loi ou un règlement l’exige ou le permet spécifiquement.\n\t\t● Communique les conséquences du refus ou du retrait du consentement [C] — Lorsque des informations personnelles sont collectées, les sujets de données sont informés des conséquences du refus de fournir des informations personnelles ou du refus ou du retrait du consentement pour utiliser des informations personnelles aux fins identifiées dans la notification.\n\t\t● Obtient le consentement implicite ou explicite [C] — Le consentement implicite ou explicite est obtenu auprès des sujets de données au moment ou avant la collecte des informations personnelles ou peu après. Les préférences de l’individu exprimées dans son consentement sont confirmées et mises en œuvre.\n\t\t● Documente et obtient le consentement pour de nouvelles finalités et utilisations [C] — Si des informations précédemment collectées doivent être utilisées à des fins non précédemment identifiées dans la notification de confidentialité, la nouvelle finalité est documentée, le sujet de données est informé et le consentement implicite ou explicite est obtenu avant cette nouvelle utilisation ou finalité.\n\t\t● Obtient le consentement explicite pour les informations sensibles [C] — Le consentement explicite est obtenu directement auprès du sujet de données lorsque des informations personnelles sensibles sont collectées, utilisées ou divulguées, sauf si une loi ou un règlement l’exige spécifiquement.\n\t\t● Obtient le consentement pour les transferts de données [C] — Le consentement est obtenu avant que les informations personnelles ne soient transférées vers ou depuis un appareil terminal d’un individu."
  3:
    prefix: "P3"
    title: "Critères de confidentialité liés à la collecte"
    1_prefix: "P3.1"
    1_label: "Les informations personnelles sont collectées conformément aux objectifs de l’entité liés à la confidentialité."
    1_desc: "Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour la confidentialité, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Limite la collecte d’informations personnelles [P][C] — La collecte d’informations personnelles est limitée à ce qui est nécessaire pour soutenir la réalisation des objectifs de l’entité.\n\t\t● Collecte les informations de manière équitable et légale [P][C] — Les méthodes de collecte des informations personnelles sont examinées par la direction avant leur mise en œuvre pour confirmer que les informations personnelles sont obtenues (a) de manière équitable, sans intimidation ni tromperie, et (b) légalement, en respectant toutes les règles de droit pertinentes, qu’elles soient issues de lois ou de la common law, relatives à la collecte d’informations personnelles.\n\t\t● Collecte les informations auprès de sources fiables [P][C] — La direction confirme que les tiers auprès desquels des informations personnelles sont collectées (c’est-à-dire des sources autres que l’individu) sont des sources fiables qui collectent les informations de manière équitable et légale.\n\t\t● Informe les sujets de données lorsqu’une information supplémentaire est acquise [P][C] — Les sujets de données sont informés si l’entité développe ou acquiert des informations supplémentaires les concernant pour son usage."
    2_prefix: "P3.2"
    2_label: "Pour les informations nécessitant un consentement explicite, l’entité communique le besoin d’un tel consentement ainsi que les conséquences d’un refus de fournir ce consentement pour la demande d’informations personnelles et obtient le consentement avant la collecte des informations pour répondre aux objectifs de l’entité liés à la confidentialité."
    2_desc: "Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour la confidentialité, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Informe les sujets de données des conséquences d’un refus de fournir le consentement [C] — Les sujets de données sont informés des conséquences d’un refus de fournir à l’entité un consentement explicite.\n\t\t● Documente le consentement explicite pour conserver les informations [C] — La documentation du consentement explicite pour la collecte, l’utilisation ou la divulgation d’informations personnelles sensibles est conservée pour soutenir la réalisation des objectifs de l’entité liés à la confidentialité."
  4:
    prefix: "P4"
    title: "Critères de confidentialité liés à l’utilisation, la conservation et l’élimination"
    1_prefix: "P4.1"
    1_label: "L’entité limite l’utilisation des informations personnelles aux finalités identifiées dans les objectifs de l’entité liés à la confidentialité."
    1_desc: "Le point de focus suivant, qui s’applique uniquement à une mission utilisant les critères de services de confiance pour la confidentialité, met en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Utilise les informations personnelles aux finalités prévues [P][C] — Les informations personnelles sont utilisées uniquement aux finalités pour lesquelles elles ont été collectées et uniquement lorsqu’un consentement implicite ou explicite a été obtenu, sauf si une loi ou un règlement l’exige spécifiquement."
    2_prefix: "P4.2"
    2_label: "L’entité conserve les informations personnelles conformément aux objectifs de l’entité liés à la confidentialité."
    2_desc: "Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour la confidentialité, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Conserve les informations personnelles [P][C] — Les informations personnelles sont conservées pas plus longtemps que nécessaire pour remplir les finalités déclarées, sauf si une loi ou un règlement l’exige spécifiquement.\n\t\t● Protège les informations personnelles [P][C] — Des politiques et procédures ont été mises en place pour protéger les informations personnelles contre l’effacement ou la destruction pendant la période de conservation spécifiée des informations."
    3_prefix: "P4.3"
    3_label: "L’entité élimine de manière sécurisée les informations personnelles pour répondre aux objectifs de l’entité liés à la confidentialité."
    3_desc: "Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour la confidentialité, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Capture, identifie et signale les demandes de suppression [P][C] — Les demandes de suppression d’informations personnelles sont capturées et les informations liées aux demandes sont identifiées et signalées pour destruction afin de soutenir la réalisation des objectifs de l’entité liés à la confidentialité.\n\t\t● Élimine, détruit et anonymise les informations personnelles [P][C] — Les informations personnelles qui ne sont plus conservées sont anonymisées, éliminées ou détruites de manière à prévenir toute perte, vol, utilisation abusive ou accès non autorisé.\n\t\t● Détruit les informations personnelles [P][C] — Des politiques et procédures sont mises en œuvre pour effacer ou détruire autrement les informations personnelles qui ont été identifiées pour destruction."
  5:
    prefix: "P5"
    title: "Critères de confidentialité liés à l’accès"
    1_prefix: "P5.1"
    1_label: "L’entité accorde aux sujets de données identifiés et authentifiés la possibilité d’accéder à leurs informations personnelles stockées pour examen et, sur demande, fournit des copies physiques ou électroniques de ces informations aux sujets de données pour répondre aux objectifs de l’entité liés à la confidentialité. Si l’accès est refusé, les sujets de données sont informés du refus et de la raison de ce refus, comme requis, pour répondre aux objectifs de l’entité liés à la confidentialité."
    1_desc: "Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour la confidentialité, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Répond aux demandes des responsables de traitement [P] — L’entité dispose d’un processus pour répondre aux demandes des sujets de données reçues des responsables de traitement conformément aux accords de service et aux objectifs de confidentialité. Ce processus peut inclure l’authentification de la demande, l’autorisation d’accès le cas échéant, une réponse dans un délai raisonnable et une notification si la demande est refusée.\n\t\t● Authentifie l’identité des sujets de données [P][C] — L’identité des sujets de données qui demandent l’accès à leurs informations personnelles est authentifiée avant qu’ils ne se voient accorder cet accès.\n\t\t● Permet aux sujets de données d’accéder à leurs informations personnelles [P][C] — Les sujets de données peuvent déterminer si l’entité détient des informations personnelles les concernant et, sur demande, peuvent obtenir l’accès à leurs informations personnelles.\n\t\t● Fournit des informations personnelles compréhensibles dans un délai raisonnable [P][C] — Les informations personnelles sont fournies aux sujets de données sous une forme compréhensible, dans un délai raisonnable et à un coût raisonnable, le cas échéant.\n\t\t● Informe les sujets de données si l’accès est refusé [P][C] — Lorsque l’accès aux informations personnelles est refusé aux sujets de données, l’entité les informe du refus et de la raison de ce refus dans un délai raisonnable, sauf interdiction par une loi ou un règlement."
    2_prefix: "P5.2"
    2_label: "L’entité corrige, modifie ou complète les informations personnelles sur la base des informations fournies par les sujets de données et communique ces informations aux tiers, comme convenu ou requis, pour répondre aux objectifs de l’entité liés à la confidentialité. Si une demande de correction est refusée, les sujets de données sont informés du refus et de la raison de ce refus pour répondre aux objectifs de l’entité liés à la confidentialité."
    2_desc: "Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour la confidentialité, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Répond aux demandes des responsables de traitement [P] — L’entité dispose d’un processus pour répondre aux demandes de mise à jour des responsables de traitement, y compris les mises à jour des informations personnelles et le refus des demandes, conformément aux accords de service pour soutenir la réalisation des objectifs de l’entité liés à la confidentialité.\n\t\t● Communique le refus des demandes d’accès [P][C] — Les sujets de données sont informés, par écrit, de la raison pour laquelle une demande d’accès à leurs informations personnelles a été refusée, de la source du droit légal de l’entité de refuser un tel accès, le cas échéant, et du droit de l’individu, s’il y a lieu, de contester ce refus, tel que spécifiquement permis ou requis par la loi ou le règlement.\n\t\t● Permet aux sujets de données de mettre à jour ou de corriger les informations personnelles [P][C] — Les sujets de données peuvent mettre à jour ou corriger les informations personnelles détenues par l’entité. L’entité communique les mises à jour, corrections et demandes de suppression aux tiers auxquels les informations personnelles du sujet de données ont été précédemment fournies, conformément aux objectifs de l’entité liés à la confidentialité.\n\t\t● Communique le refus des demandes de correction [P][C] — Les sujets de données sont informés, par écrit, de la raison pour laquelle une demande de correction d’informations personnelles a été refusée et de la manière dont ils peuvent faire appel."
  6:
    prefix: "P6"
    title: "Critères de confidentialité liés à la divulgation et à la notification"
    1_prefix: "P6.1"
    1_label: "L’entité divulgue les informations personnelles à des tiers avec le consentement explicite des sujets de données et un tel consentement est obtenu avant la divulgation pour répondre aux objectifs de l’entité liés à la confidentialité."
    1_desc: "Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour la confidentialité, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Communique les politiques de confidentialité aux tiers [P][C] — Les politiques de confidentialité ou d’autres instructions ou exigences spécifiques pour le traitement des informations personnelles sont communiquées aux tiers auxquels les informations personnelles sont divulguées.\n\t\t● Divulgue les informations personnelles uniquement lorsque cela est approprié [P][C] — Les informations personnelles sont divulguées à des tiers uniquement aux finalités pour lesquelles elles ont été collectées ou créées et uniquement lorsqu’un consentement implicite ou explicite a été obtenu du sujet de données, sauf si une loi ou un règlement l’exige spécifiquement.\n\t\t● Divulgue les informations personnelles uniquement à des tiers appropriés [P][C] — Les informations personnelles sont divulguées uniquement à des tiers qui ont des accords avec l’entité pour protéger les informations personnelles de manière conforme aux aspects pertinents de la notification de confidentialité de l’entité ou d’autres instructions ou exigences spécifiques.\n\t\t● Divulgue les informations aux tiers pour de nouvelles finalités et utilisations [P][C] — Les informations personnelles sont divulguées à des tiers pour de nouvelles finalités ou utilisations uniquement avec le consentement implicite ou explicite préalable des sujets de données."
    2_prefix: "P6.2"
    2_label: "L’entité crée et conserve un enregistrement complet, exact et opportun des divulgations autorisées d’informations personnelles pour répondre aux objectifs de l’entité liés à la confidentialité."
    2_desc: "Le point de focus suivant, qui s’applique uniquement à une mission utilisant les critères de services de confiance pour la confidentialité, met en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Crée et conserve un enregistrement des divulgations autorisées [P][C] — L’entité crée et maintient un enregistrement des divulgations autorisées d’informations personnelles qui est complet, exact et opportun."
    3_prefix: "P6.3"
    3_label: "L’entité crée et conserve un enregistrement complet, exact et opportun des divulgations non autorisées détectées ou signalées (y compris les violations) d’informations personnelles pour répondre aux objectifs de l’entité liés à la confidentialité."
    3_desc: "Le point de focus suivant, qui s’applique uniquement à une mission utilisant les critères de services de confiance pour la confidentialité, met en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Crée et conserve un enregistrement des divulgations non autorisées détectées ou signalées [P][C] — L’entité crée et maintient un enregistrement des divulgations non autorisées détectées ou signalées d’informations personnelles qui est complet, exact et opportun."
    4_prefix: "P6.4"
    4_label: "L’entité obtient des engagements de protection de la confidentialité de la part des fournisseurs et autres tiers ayant accès aux informations personnelles pour répondre aux objectifs de l’entité liés à la confidentialité. L’entité évalue la conformité de ces parties de manière périodique et selon les besoins, et prend des mesures correctives, si nécessaire."
    4_desc: "Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour la confidentialité, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Évalue la conformité des tiers aux engagements de protection de la confidentialité [P][C] — L’entité dispose de procédures pour évaluer si les tiers disposent de contrôles efficaces pour respecter les termes de l’accord, des instructions ou des exigences.\n\t\t● Prend des mesures correctives en cas de mauvaise utilisation des informations personnelles par un tiers [P][C] — L’entité prend des mesures correctives en réponse à la mauvaise utilisation des informations personnelles par un tiers auquel l’entité a transféré de telles informations.\n\t\t● Obtient des engagements pour signaler les divulgations non autorisées [P][C] — Un processus existe pour obtenir des engagements de la part des fournisseurs et autres tiers afin de signaler à l’entité les divulgations non autorisées réelles ou suspectées d’informations personnelles."
    5_prefix: "P6.5"
    5_label: "L’entité obtient des engagements de la part des fournisseurs et autres tiers ayant accès aux informations personnelles pour notifier l’entité en cas de divulgations non autorisées réelles ou suspectées d’informations personnelles. Ces notifications sont signalées au personnel approprié et traitées conformément aux procédures de réponse aux incidents établies pour répondre aux objectifs de l’entité liés à la confidentialité."
    5_desc: "Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour la confidentialité, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Prend des mesures correctives en cas de mauvaise utilisation des informations personnelles par un tiers [P][C] — L’entité prend des mesures correctives en réponse à la mauvaise utilisation des informations personnelles par un tiers auquel l’entité a transféré de telles informations.\n\t\t● Signale les divulgations non autorisées réelles ou suspectées [P][C] — Un processus existe pour obtenir des engagements de la part des fournisseurs et autres tiers afin de signaler à l’entité les divulgations non autorisées réelles ou suspectées d’informations personnelles."
    6_prefix: "P6.6"
    6_label: "L’entité fournit une notification des violations et incidents aux sujets de données concernés, aux régulateurs et autres pour répondre aux objectifs de l’entité liés à la confidentialité."
    6_desc: "Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour la confidentialité, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Identifie les exigences de notification [P][C] — L’entité dispose d’un processus pour déterminer si une notification de violation de la confidentialité est requise, y compris la méthode à utiliser, le calendrier et l’identification des destinataires de ces notifications.\n\t\t● Fournit une notification des violations et incidents [P][C] — L’entité dispose d’un processus pour fournir une notification des violations et incidents aux sujets de données concernés, aux régulateurs et autres pour soutenir la réalisation des objectifs de l’entité liés à la confidentialité."
    7_prefix: "P6.7"
    7_label: "L’entité fournit aux sujets de données un compte rendu des informations personnelles détenues et de la divulgation des informations personnelles des sujets de données, sur demande de ces derniers, pour répondre aux objectifs de l’entité liés à la confidentialité."
    7_desc: "Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour la confidentialité, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Répond aux demandes des responsables de traitement [P] — L’entité dispose d’un processus pour répondre aux demandes des responsables de traitement concernant un compte rendu des informations personnelles détenues conformément aux accords de service et aux objectifs de confidentialité.\n\t\t● Identifie les types d’informations personnelles et le processus de traitement [P][C] — Les types d’informations personnelles et d’informations personnelles sensibles, ainsi que les processus, systèmes et tiers impliqués dans le traitement de ces informations, sont identifiés.\n\t\t● Capture, identifie et communique les demandes d’informations [P][C] — Les demandes de compte rendu des informations personnelles détenues et des divulgations des informations personnelles des sujets de données sont capturées et les informations liées aux demandes sont identifiées et communiquées aux sujets de données pour soutenir la réalisation des objectifs de l’entité liés à la confidentialité."
  7:
    prefix: "P7"
    title: "Critères de confidentialité liés à la qualité"
    1_prefix: "P7.1"
    1_label: "L’entité collecte et maintient des informations personnelles exactes, à jour, complètes et pertinentes pour répondre aux objectifs de l’entité liés à la confidentialité."
    1_desc: "Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour la confidentialité, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Garantit l’exactitude et l’exhaustivité des informations personnelles [P][C] — Les informations personnelles sont exactes et complètes pour les finalités pour lesquelles elles doivent être utilisées.\n\t\t● Garantit la pertinence des informations personnelles [P][C] — Les informations personnelles sont pertinentes pour les finalités pour lesquelles elles doivent être utilisées."
  8:
    prefix: "P8"
    title: "Critères de confidentialité liés à la surveillance et à l’application"
    1_prefix: "P8.1"
    1_label: "L’entité met en œuvre un processus pour recevoir, traiter, résoudre et communiquer la résolution des demandes, plaintes et litiges émanant des sujets de données et d’autres, et surveille périodiquement la conformité pour répondre aux objectifs de l’entité liés à la confidentialité. Les corrections et autres actions nécessaires liées aux déficiences identifiées sont effectuées ou prises en temps opportun."
    1_desc: "Les points de focus suivants, qui s’appliquent uniquement à une mission utilisant les critères de services de confiance pour la confidentialité, mettent en lumière les caractéristiques importantes liées à ce critère :\n\n\t\t● Communique aux sujets de données ou aux responsables de traitement [P][C] — Les sujets de données ou les responsables de traitement sont informés de la manière de contacter l’entité pour les demandes, plaintes et litiges.\n\t\t● Traite les demandes, plaintes et litiges [P][C] — Un processus est en place pour traiter les demandes, plaintes et litiges.\n\t\t● Documente et communique la résolution des litiges et les recours [P][C] — Chaque plainte est traitée et la résolution est documentée et communiquée à l’individu.\n\t\t● Documente et signale les cas de non-conformité [P][C] — Les cas de non-conformité avec les objectifs liés à la confidentialité sont documentés et signalés et, si nécessaire, des mesures correctives et disciplinaires sont prises en temps opportun.\n\t\t● Effectue une surveillance continue [P][C] — Des procédures continues sont mises en œuvre pour surveiller l’efficacité des contrôles sur les informations personnelles et pour prendre des actions correctives en temps opportun lorsque cela est nécessaire."
