4:
  title: "Principes de la responsabilité sociétale"
  1_label: "Généralités"
  1_desc: "Le présent article fournit des lignes directrices relatives aux sept principes de responsabilité sociétale.\nLorsqu'une organisation aborde et pratique la responsabilité sociétale, son objectif primordial est de maximiser sa contribution au développement durable. Dans cet objectif, bien que l'on n'ait pas établi de liste définitive des principes de responsabilité sociétale, il convient que les organisations prennent en compte les sept principes soulignés ci-après, de même que les principes propres à chacune des questions centrales exposées dans l'Article 6.\n\nIl convient que les organisations fondent leur comportement sur des normes, des lignes directrices ou des règles de conduite en conformité avec les principes acceptés d'une conduite juste ou bonne dans le contexte de situations spécifiques, même lorsque ces situations constituent des défis.\n\nLors de l'application de la présente Norme internationale, il est recommandé que l'organisation prenne en considération les différences sociales, environnementales, juridiques, culturelles, politiques et la diversité des organisations ainsi que les différences de conditions économiques, en toute cohérence avec les normes internationales de comportement."
  2_label: "Redevabilité"
  2_desc: "Le principe est le suivant: il convient qu'une organisation soit en mesure de répondre de ses impacts sur la société, l'économie et l'environnement.\n\nCe principe suggère qu'il convient que l'organisation accepte un examen approprié ainsi que le devoir de réponse correspondant.\n\nLa redevabilité implique d'une part, pour la direction l'obligation de pouvoir répondre des intérêts des mandants de l'organisation et d'autre part, pour l'organisation l'obligation de pouvoir répondre du respect de la législation et de la réglementation vis-à-vis des autorités. La redevabilité de l'impact général de ses décisions et activités sur la société et l'environnement implique également que le degré jusqu'auquel l'organisation est comptable de ses décisions et activités envers ceux qui en sont affectés, ainsi qu'envers la société en général, varie en fonction de la nature de l'impact exercé et des circonstances.\n\nEn étant redevable, l'organisation aura un impact positif à la fois sur elle-même et sur la société. Le degré de cette redevabilité peut varier mais il convient qu'il aille toujours de pair avec l'ampleur du pouvoir exercé. Les organisations détenant le pouvoir décisionnaire sont censées porter plus d'attention à la qualité de leurs décisions et de leur contrôle. La redevabilité englobe également le fait d'assumer une pratique fautive, de prendre les mesures appropriées pour y remédier et de mener les actions permettant d'éviter qu'elle ne se reproduise.\n\nIl convient que l'organisation réponde:\n\t\t - des impacts de ses décisions et activités sur la société, l'environnement et l'économie, notamment des conséquences négatives importantes; et\n\t\t - des actions entreprises pour prévenir toute répétition des impacts négatifs involontaires et imprévus."
  3_label: "Transparence"
  3_desc: "Le principe est le suivant: il convient qu'une organisation assure la transparence des décisions qu'elle prend et des activités qu'elle mène lorsque celles-ci ont une incidence sur la société et l'environnement.\n\nIl convient que l'organisation diffuse de manière claire, juste et exhaustive et à un degré raisonnable et suffisant, les politiques, décisions et activités dont elle est responsable, de même que leurs effets connus et probables sur la société et l'environnement. Il convient que ces informations soient disponibles, directement accessibles et compréhensibles pour ceux qui sont ou peuvent être touchés de diverses manières par l'organisation. Il convient qu'elles soient actualisées, basées sur des faits et présentées de manière claire et objective, pour permettre aux parties prenantes d'évaluer avec justesse l'impact des décisions et activités de l'organisation sur leurs intérêts.\n\nLe principe de la transparence ne nécessite pas de rendre publiques des informations exclusives et il n'entraîne pas la mise à disposition d'informations confidentielles ou qui contreviendraient à des obligations juridiques, commerciales ou touchant à la sécurité ou à la vie privée.\n\nIl convient que l'organisation fasse preuve de transparence en ce qui concerne:\n\t\t - l'objet, la nature et l'emplacement de ses activités;\n\t\t - l'identité de toute participation de contrôle à l'activité de l'organisation;\n\t\t - la manière dont ses décisions sont prises, appliquées et revues, y compris pour la définition des rôles, responsabilités, redevabilité et pouvoirs déclinés sur les différentes fonctions au sein de l'organisation;\n\t\t - les normes et les critères par rapport auxquels elle évalue ses propres performances en matière de responsabilité sociétale;\n\t\t - ses performances dans des domaines d'action de responsabilité sociétale importants et significatifs;\n\t\t - les sources, montants et emplois de ses fonds;\n\t\t - les effets connus ou probables de ses décisions et activités sur ses parties prenantes, la société, l'économie et l'environnement; et\n\t\t - ses parties prenantes ainsi que les critères et procédures utilisés pour les identifier, les choisir et dialoguer avec elles."
  4_label: "Comportement éthique"
  4_desc: "Le principe est le suivant: il convient que l'organisation se comporte de manière éthique.\nIl convient que le comportement de l'organisation soit fondé sur les valeurs de l'honnêteté, de l'équité et de l'intégrité. Ces valeurs impliquent que l'on se préoccupe d'autrui, des animaux et de l'environnement et que l'on s'engage à traiter l'impact de ses décisions et activités sur les intérêts des parties prenantes.\n\nIl convient que l'organisation favorise activement l'adoption d'un comportement éthique:\n\t\t - en identifiant et en déclarant ses principes et valeurs essentielles;\n\t\t - en élaborant et en utilisant des structures de gouvernance qui contribuent à promouvoir un comportement éthique au sein de l'organisation, dans ses prises de décision et dans le cadre de ses interactions avec les autres;\n\t\t - en identifiant, adoptant et appliquant des standards de comportement éthique en fonction de son objet social et de ses activités, et en accord avec les principes décrits dans la présente Norme internationale;\n\t\t - en encourageant et en assurant la promotion du respect de ses standards de comportement éthique;\n\t\t - en définissant et en communiquant les standards du comportement éthique attendu de sa structure de gouvernance, de son personnel, de ses fournisseurs, sous-traitants et, le cas échéant, de ses propriétaires et managers, et, notamment, de ceux qui ont la possibilité, tout en préservant l'identité culturelle locale, d'exercer une influence significative sur les valeurs, la culture, l'intégrité, la stratégie et le fonctionnement de l'organisation, ainsi que des personnes agissant en son nom;\n\t\t - en prévenant ou en résolvant les conflits d'intérêt au sein de l'organisation qui, s'ils ne l'étaient pas, pourraient entraîner un comportement non éthique;\n\t\t - en établissant et en entretenant des mécanismes de surveillance et des contrôles pour mettre en place un comportement éthique, le vérifier et le soutenir;\n\t\t - en établissant et en entretenant des mécanismes visant à faciliter l'alerte par rapport à un comportement non éthique sans crainte de représailles;\n\t\t - en reconnaissant et en traitant les situations dans lesquelles la réglementation locale n'existe pas ou s'oppose à un comportement éthique;\n\t\t - en adoptant et en appliquant les standards de comportement éthique reconnus à l'échelle internationale dans le cadre des travaux de recherche impliquant des sujets humains; et\n\t\t - en respectant le bien être des animaux lorsque cela a un impact sur leur vie, en prévoyant notamment des conditions décentes de gardiennage, d'élevage, de production, de transport et d'utilisation des animaux."
  5_label: "Reconnaissance des intérêts des parties prenantes"
  5_desc: "Le principe est le suivant: il convient qu'une organisation reconnaisse et prenne en considération les intérêts de ses parties prenantes et qu'elle y réponde.\n\nBien que les objectifs de l'organisation puissent se limiter aux intérêts de ses propriétaires, membres, clients ou mandataires sociaux, d'autres individus ou groupes peuvent également avoir des droits et exprimer des demandes ou des intérêts spécifiques qu'il convient de prendre en compte. Collectivement, ces individus ou groupes constituent les parties prenantes de l'organisation.\n\nIl convient que l'organisation:\n\t\t - identifie ses parties prenantes;\n\t\t - identifie et tienne pleinement compte des intérêts et des droits de ses parties prenantes accordés par la législation et réponde aux préoccupations que celles-ci expriment;\n\t\t - reconnaisse que certaines parties prenantes peuvent avoir une influence significative sur les activités de l'organisation;\n\t\t - évalue et prenne en considération la capacité relative des parties prenantes à prendre contact avec l'organisation, à dialoguer avec elle et à l'influencer;\n\t\t - tienne compte du rapport entre les intérêts de ses parties prenantes et les attentes plus larges de la société et le développement durable, ainsi que de la nature du rapport existant entre les parties prenantes et l'organisation (voir également 3.3.1); et qu'elle\n\t\t - prenne en considération le point de vue des parties prenantes dont les intérêts sont susceptibles d'être affectés par une décision ou activité, même si celles-ci ne jouent aucun rôle formel dans la gouvernance de l'organisation ou si elles n'ont pas conscience de ces intérêts."
  6_label: "Respect du principe de légalité"
  6_desc: "Le principe est le suivant: il convient qu'une organisation accepte que le respect du principe de légalité soit obligatoire.\n\nLe principe de légalité se réfère à la primauté du droit et, en particulier, à l'idée d'une part, qu'aucun individu ou organisation n'est au-dessus des lois, et d'autre part, que les pouvoirs publics y sont également soumis. Le principe de légalité est en opposition avec l'exercice arbitraire du pouvoir. Il sous-entend généralement que les lois et la réglementation sont écrits, diffusés publiquement et appliqués de manière équitable conformément à des procédures établies. Dans le contexte de la responsabilité sociétale, le respect du principe de légalité implique qu'une organisation se conforme à toutes les législations et réglementations en vigueur. Cela signifie qu'il convient que l'organisation prenne des mesures pour prendre connaissance des lois et réglementations en vigueur, pour informer ceux qui font partie de l'organisation qu'ils sont tenus d'observer et de mettre en œuvre les mesures en question.\n\nIl convient que l'organisation:\n\t\t - se conforme aux obligations légales dans toutes les juridictions où elle opère, même si ces lois et réglementations ne sont pas appliquées de manière adéquate;\n\t\t - fasse en sorte que ses relations et activités soient en accord avec le cadre juridique applicable et prévu;\n\t\t - se tienne informée de toutes les obligations légales; et\n\t\t - examine périodiquement sa conformité aux lois et réglementations en vigueur."
  7_label: "Prise en compte des normes internationales de comportement"
  7_desc: "Le principe est le suivant: il convient qu'une organisation prenne en compte les normes internationales de comportement tout en respectant le principe de légalité.\n\n- Dans les situations où la législation ou sa mise en application ne comporte pas de garde-fous environnementaux ou sociaux adéquats, il convient que l'organisation s'efforce a minima de prendre en compte, les normes internationales de comportement.\n\n- Dans les pays où la législation ou sa mise en application contredit les normes internationales de comportement, il convient que l'organisation s'efforce de les prendre en compte dans toute la mesure du possible.\n\n- Dans les situations dans lesquelles la législation ou sa mise en application est en opposition avec les normes internationales de comportement, et lorsque le fait de ne pas prendre en compte lesdites normes pourrait avoir des conséquences significatives, il convient que l'organisation revoie, lorsque cela est faisable et approprié, la nature de ses relations et activités au sein de la juridiction en question.\n\n- Il convient que l'organisation considère les voies et moyens légitimes pour parvenir à influencer les organisations et les autorités pertinentes en vue de remédier à ce type d'écart.\n\n- Il convient qu'une organisation évite d'être complice des activités d'une autre organisation qui ne seraient pas en cohérence avec les normes internationales de comportement."
  8_label: "Respect des droits de l'Homme"
  8_desc: "Le principe est le suivant: il convient qu'une organisation respecte les droits de l'Homme et reconnaisse à la fois leur importance et leur universalité (voir également la question centrale des droits de l'Homme en 6.3).\n\nIl convient que l'organisation:\n\t\t - respecte et, chaque fois que possible, promeuve les droits énoncés dans la Déclaration internationale des droits de l'Homme;\n\t\t - accepte l'universalité de ces droits, c'est-à-dire le fait qu'ils soient applicables de manière indivisible dans tous les pays, toutes les cultures et situations;\n\t\t - prenne des mesures pour respecter les droits de l'Homme, et dans les cas où ceux-ci ne sont pas protégés, évite de tirer avantage de ces situations; et\n\t\t - accepte le principe de prendre en compte les normes internationales de comportement (voir 4.7) dans les cas où la législation ou sa mise en application n'assure aucune protection adéquate des droits de l'Homme."
5:
  title: "Identifier sa responsabilité sociétale et dialoguer avec les parties prenantes"
  1_label: "Généralités"
  1_desc: "Le présent article aborde deux pratiques fondamentales de la responsabilité sociétale: l'identification, par une organisation, de sa responsabilité sociétale, et l'identification de ses parties prenantes et le dialogue avec celles-ci. Comme dans le cas des principes décrits dans l'Article 4, il convient de garder ces pratiques à l'esprit lorsque sont abordées les questions centrales de responsabilité sociétale décrites dans l'Article 6.\n\nL'identification de la responsabilité sociétale implique d'identifier, d'une part, les domaines d'action concernés par les impacts des décisions et activités de l'organisation, et d'autre part, la manière dont il convient d'aborder ces domaines d'action pour contribuer au développement durable.\n\nL'identification de la responsabilité sociétale sous-entend également que soient reconnues les parties prenantes de l'organisation. Comme décrit en 4.5, l'un des principes fondamentaux de la responsabilité sociétale est la reconnaissance et la prise en considération des intérêts des parties prenantes de l'organisation qui seront affectés par les décisions et activités de cette dernière."
  2:
    title: "Identifier sa responsabilité sociétale"
    1_label: "Impacts, intérêts et attentes"
    1_desc: "Lorsqu'une organisation traite de sa responsabilité sociétale, il convient qu'elle discerne trois relations (voir Figure 2):\n\n- La relation entre elle-même et la société: Il convient que l'organisation comprenne la manière dont ses décisions et activités impactent la société et l'environnement. Il convient qu'elle appréhende également les attentes de la société en matière de comportement responsable concernant ces impacts. Pour ce faire, il convient qu'elle tienne compte des questions centrales et des domaines d'action de responsabilité sociétale (voir 5.2.2);\n\n- La relation entre elle-même et ses parties prenantes: Il convient que l'organisation ait conscience de la diversité de ses parties prenantes. Ces dernières regroupent les individus ou groupes dont les intérêts pourraient être affectés par les décisions et activités de l'organisation (voir 3.3.1); et\n\n- La relation entre ses parties prenantes et la société: Il convient que l'organisation comprenne le lien existant entre les intérêts des parties prenantes qui sont touchés par l'organisation d'une part et les attentes de la société, d'autre part. Bien que les parties prenantes soient intégrées dans la société, elles peuvent avoir un intérêt qui ne soit pas en cohérence avec les attentes de la société. Les parties prenantes ont des intérêts particuliers eu égard à l'organisation, qui peuvent se distinguer des attentes de la société au regard d'un comportement responsable, pour un quelconque domaine d'action. Par exemple, l'intérêt d'un fournisseur à être payé et l'intérêt de la société à ce que les contrats soient honorés correspondent à des visions différentes du même domaine d'action."
    2_label: "Identifier les questions centrales et les principaux domaines d'action de responsabilité sociétale"
    2_desc: "Pour une organisation, l'un des moyens efficaces d'identifier sa responsabilité sociétale consiste à se familiariser avec les domaines d'action de responsabilité sociétale qui se déclinent à partir des sept questions centrales suivantes: la gouvernance de l'organisation, les droits de l'Homme, les relations et conditions de travail, l'environnement, la loyauté des pratiques, les questions relatives aux consommateurs ainsi que l'implication auprès des communautés et la contribution au développement local (voir de 6.2 à 6.8).\n\nCes questions centrales traitent des impacts économiques, environnementaux et sociaux les plus probables auxquels sont confrontées les organisations. Chacune de ces questions centrales est examinée dans l'Article 6. La discussion qui porte sur chaque question centrale couvre des domaines d'actions spécifiques qu'il convient que l'organisation prenne en considération lorsqu'elle identifie sa responsabilité sociétale. Chaque question centrale mais pas nécessairement chaque domaine d'action a un certain degré de pertinence pour chacune des organisations.\n\nLes lignes directrices relatives à chaque domaine d'action comprennent un certain nombre d'actions qui sont censées être entreprises par l'organisation, et des attentes concernant la manière dont l'organisation est censée se comporter. Lorsqu'elle envisage sa responsabilité sociétale, il convient que l'organisation identifie chacun des domaines d'action en rapport avec ses décisions et activités, ainsi que les attentes et les actions correspondantes. Des lignes directrices supplémentaires relatives à l'identification des domaines d'action sont données en 7.2 et 7.3.\n\nIl convient que les impacts des décisions et activités de l'organisation soient pris en considération dans la perspective de ces domaines d'action. En outre, les questions centrales et les domaines d'action correspondants peuvent être décrits ou classés de diverses manières. Certains aspects importants concernant la santé, la sécurité, l'économie et la chaîne de valeur sont abordés dans le cadre de plusieurs questions centrales, dans l'Article 6.\n\nIl convient que l'organisation passe en revue toutes les questions centrales pour identifier les domaines d'action importants. Il convient que l'identification des domaines d'action pertinents soit suivie d'une évaluation de l'importance des impacts qui sont induits par l'organisation. Il y a lieu de considérer l'importance d'un impact, tant par rapport aux parties prenantes concernées que par rapport à la manière dont l'impact en question affecte le développement durable.\n\nPour identifier les questions centrales et les domaines d'action relevant de sa responsabilité sociétale, une organisation peut examiner ses interactions avec les autres organisations. Il convient qu'elle étudie également l'impact de ses décisions et activités sur ses parties prenantes.\n\nIl est recommandé à toute organisation cherchant à identifier sa responsabilité sociétale de prendre en compte à la fois les obligations juridiquement contraignantes et toutes les autres obligations existantes. Les obligations juridiquement contraignantes comprennent la législation et la réglementation en vigueur ainsi que les obligations afférentes aux domaines d'action sociaux, économiques ou environnementaux qui sont susceptibles d'exister dans des contrats en vigueur. Il convient qu'une organisation respecte les engagements qu'elle a pris en matière de responsabilité sociétale. Ceux-ci pourraient être intégrés dans des lignes directrices ou codes de conduite éthiques ou bien dans les conditions d'adhésion aux associations auxquelles elle appartient.\n\nL'identification de la responsabilité sociétale est un processus continu. Il convient que les impacts potentiels des décisions et activités soient déterminés et pris en compte pendant l'étape de planification des nouvelles activités. Il est recommandé de passer en revue les activités habituelles en tant que de besoin afin de s'assurer d'une part, que la responsabilité sociétale est bien traitée et d'autre part, de déterminer si de nouveaux domaines d'action ont besoin d'être pris en compte."
    3_label: "La responsabilité sociétale et la sphère d'influence de l'organisation"
    3_desc: "Une organisation est responsable des impacts des décisions et des activités sur lesquelles elle exerce un contrôle formel et/ou de fait (un contrôle de fait renvoie à des situations dans lesquelles une organisation a la capacité de dicter les décisions et activités d'une tierce partie, même lorsqu'elle ne détient pas l'autorité juridique ou formelle de le faire). Ces impacts peuvent être de grande envergure. Outre le fait d'être responsable de ses propres décisions et activités, une organisation peut, dans certaines situations, avoir la capacité d'influencer le comportement des organisations/parties avec lesquelles elle a des relations. Ces situations sont considérées comme faisant partie de la sphère d'influence d'une organisation.\n\nCette sphère d'influence inclut des relations au sein et au-delà de la chaîne de valeur de l'organisation. Cependant, ce n'est pas toute la chaîne de valeur de l'organisation qui fait nécessairement partie de sa sphère d'influence. Elle peut inclure les associations formelles et informelles auxquelles elle participe, ainsi que des organisations de pairs ou des concurrents.\n\nUne organisation n'a pas toujours la responsabilité d'exercer une influence juste parce qu'elle a la capacité de le faire. Par exemple, elle ne peut pas être tenue pour responsable des impacts d'autres organisations sur lesquelles elle est susceptible d'avoir une influence, si l'impact considéré ne découle pas de ses décisions et activités. Cependant, il y aura des situations où une organisation aura la responsabilité d'exercer une influence. Ces situations sont déterminées par le degré auquel la relation de l'organisation contribue à des impacts négatifs.\n\nPar ailleurs, il y aura des situations où, en dépit du fait que l'organisation ne détient aucune responsabilité pour exercer une influence, elle peut néanmoins souhaiter le faire volontairement ou être sollicitée en ce sens.\n\nUne organisation peut choisir d'avoir une relation avec une autre organisation et décider de la nature et de la portée de cette relation. Il y aura des situations où une organisation aura la responsabilité de faire attention aux impacts créés par les décisions et activités des autres organisations et de prendre des mesures pour éviter ou atténuer les impacts négatifs liés à sa relation avec ces organisations.\n\nAu moment d'évaluer sa sphère d'influence et de déterminer ses responsabilités, il convient que l'organisation exerce une vigilance raisonnable afin d'éviter de contribuer aux impacts négatifs à travers ses relations. D'autres recommandations sont données en 7.3.3."
  3:
    title: "Identifier les parties prenantes et dialoguer avec elles"
    1_label: "Généralités"
    1_desc: "L'identification des parties prenantes et le dialogue avec elles sont essentiels pour aborder la responsabilité sociétale d'une organisation."
    2_label: "Identifier les parties prenantes"
    2_desc: "Les parties prenantes sont des organisations ou des individus qui ont un ou plusieurs intérêts dans une décision ou activité quelconques d'une organisation. Du fait que ces intérêts peuvent être affectés par l'organisation, il se crée un lien avec celle-ci. Cette relation n'a pas besoin d'être formelle. La relation suscitée par cet intérêt existe indépendamment du fait que les parties en aient conscience ou non. Il se peut que l'organisation ne connaisse pas toujours toutes ses parties prenantes bien qu'elle soit censée les identifier. De la même manière, nombreuses sont les parties prenantes qui méconnaissent la capacité potentielle d'une organisation à impacter leurs intérêts.\n\nDans ce contexte, «intérêt» se réfère au fondement réel ou potentiel d'une réclamation; à savoir exiger quelque chose qui est dû ou exiger le respect d'un droit. Ce type de réclamation n'implique pas nécessairement qu'il s'agisse de réclamations financières ou de droits accordés par la législation. Parfois, il peut simplement s'agir du droit d'être entendu. La meilleure façon de déterminer la pertinence ou l'importance d'un intérêt consiste à considérer son lien avec le développement durable.\n\nComprendre la manière dont des individus ou groupes sont ou peuvent être affectés par les décisions et activités d'une organisation permet d'identifier les intérêts qui instaurent un lien avec l'organisation. Ainsi, en déterminant les impacts induits par ses décisions et activités, l'organisation identifie aisément ses parties prenantes les plus importantes (voir Figure 2).\n\nLes organisations peuvent avoir plusieurs parties prenantes. De plus, les différentes parties prenantes ont des intérêts variés et parfois, concurrents ou conflictuels. Par exemple, les intérêts des riverains pourraient englober les impacts positifs d'une organisation comme l'emploi, ainsi que les impacts négatifs de cette même organisation comme la pollution.\n\nCertaines parties prenantes font partie intégrante de l'organisation. Ce sont les membres, les employés ou les propriétaires de l'organisation. Ces parties prenantes ont un intérêt commun dans l'objet de l'organisation et à sa réussite. Toutefois, cela n'implique pas que leurs intérêts vis-à-vis de l'organisation soient tous les mêmes.\n\nLes intérêts de la plupart des parties prenantes peuvent avoir un lien avec la responsabilité sociétale de l'organisation, et sont souvent très semblables à certains des intérêts de la société. À titre d'exemple, l'intérêt d'un propriétaire foncier dont le bien perd de la valeur en raison d'une nouvelle source de pollution.\n\nToutes les parties prenantes d'une organisation n'appartiennent pas à des groupes organisés qui ont pour but de représenter leurs intérêts face à des organisations spécifiques. Il se peut que de nombreuses parties prenantes ne soient pas organisées du tout et que, pour cette raison, elles puissent être négligées ou ignorée. Cette question peut se révéler importante en particulier pour les groupes vulnérables et les générations futures.\n\nDes groupes ayant pour vocation de défendre des causes sociales ou environnementales peuvent être des parties prenantes d'une organisation dont les décisions et activités exercent un impact essentiel et significatif sur ces causes.\n\nIl est recommandé à toute organisation de contrôler la représentativité et la crédibilité des groupes qui revendiquent de s'exprimer au nom de parties prenantes spécifiques ou de défendre des causes particulières. Dans certains cas, des intérêts importants ne pourront pas être représentés directement. Par exemple il est rare que des enfants gèrent ou contrôlent des groupes organisés; quant à la faune et à la flore, elles ne le peuvent pas. En l'occurrence, il convient que l'organisation prête attention aux opinions de groupes crédibles, désireux de protéger ce genre d'intérêts.\n\nPour identifier des parties prenantes, il convient que l'organisation se pose les questions suivantes:\n\t\t - Envers qui l'organisation a-t-elle des obligations légales?\n\t\t - Qui pourrait être affecté positivement ou négativement par les décisions ou activités de l'organisation?\n\t\t - Qui est susceptible de s'inquiéter des décisions et activités de l'organisation?\n\t\t - Qui s'est trouvé impliqué, dans le passé, quand il a fallu aborder des préoccupations semblables?\n\t\t - Qui peut aider l'organisation à traiter des impacts spécifiques?\n\t\t - Qui peut influer sur la capacité de l'organisation à s'acquitter de ses responsabilités?\n\t\t - Qui serait désavantagé s'il était exclu du dialogue?\n\t\t - Qui, dans la chaîne de valeur, est touché?"
    3_label: "Dialoguer avec les parties prenantes"
    3_desc: "Le dialogue avec les parties prenantes implique l'instauration d'un dialogue entre l'organisation et une ou plusieurs de ses parties prenantes. Il aide l'organisation à aborder sa responsabilité sociétale en fournissant un éclairage à ses décisions.\n\nLe dialogue avec les parties prenantes peut prendre plusieurs formes. Il peut être lancé par une organisation ou peut commencer sous la forme d'une réponse donnée par une organisation à l'une de ses parties prenantes ou à plusieurs d'entre elles. Il peut se dérouler dans le cadre de réunions informelles ou formelles, sous diverses formes telles qu'entretiens individuels, conférences, ateliers, audiences publiques, tables rondes, comités consultatifs, procédures régulières et structurées d'information et de consultation, négociations collectives et forums interactifs sur la toile. Il convient que le dialogue avec les parties prenantes soit interactif; il est censé permettre aux parties prenantes de faire entendre leur point de vue. Il a pour caractéristique essentielle d'impliquer une communication bilatérale.\n\nIl y a différentes raisons pour qu'une organisation dialogue avec ses parties prenantes. Le dialogue avec les parties prenantes peut être utilisé pour:\n\t\t - faciliter l'appréhension par l'organisation des conséquences probables de ses décisions et activités sur des parties prenantes spécifiques;\n\t\t - déterminer la meilleure façon d'accroître les impacts bénéfiques des décisions et activités de l'organisation et celle d'atténuer tout impact défavorable;\n\t\t - déterminer si les déclarations de l'organisation à propos de sa responsabilité sociétale sont perçues comme étant crédibles;\n\t\t - aider l'organisation à revoir ses performances de façon à ce qu'elle puisse s'améliorer;\n\t\t - lever les conflits impliquant ses propres intérêts, les intérêts de ses parties prenantes et les attentes de la société en général;\n\t\t - aborder le lien existant entre les intérêts des parties prenantes et les responsabilités de l'organisation vis-à-vis de la société dans son ensemble;\n\t\t - contribuer à la formation continue par le biais de l'organisation;\n\t\t - répondre aux obligations juridiques (par exemple vis-à-vis des employés);\n\t\t - traiter des intérêts opposés, soit entre l'organisation et la partie prenante, soit entre parties prenantes;\n\t\t - faire bénéficier l'organisation des avantages de l'obtention de perspectives diverses;\n\t\t - accroître la transparence de ses décisions et activités; et\n\t\t - constituer des partenariats pour atteindre des objectifs mutuellement bénéfiques.\n\nLes attentes de la société, portant sur la manière dont il convient que l'organisation aborde ses impacts, sont généralement, connues de l'organisation, ou à sa portée. Dans ces circonstances, elle n'a pas besoin de s'appuyer sur le dialogue avec des parties prenantes spécifiques pour appréhender ces attentes, bien que le processus de dialogue avec les parties prenantes puisse procurer d'autres avantages. Les attentes de la société peuvent être trouvées dans les lois et réglementations, dans les attentes sociales et culturelles largement acceptées, et dans des normes et bonnes pratiques établies sur des questions particulières. Les attentes concernant les intérêts des parties prenantes sont précisées dans les sections intitulées «Actions et attentes associées», après la description des différents domaines d'action dans l'Article 6. Il convient que les attentes établies par le dialogue avec les parties prenantes complètent celles déjà établies concernant le comportement de l'organisation, plutôt qu'elles ne les remplacent.\n\nIl est recommandé de mettre au point un processus adéquat et loyal s'appuyant sur un dialogue avec les parties prenantes les plus pertinentes. Il convient que l'intérêt (ou les intérêts) d'organisations ou d'individus identifiés comme parties prenantes soit authentique(s). Il convient que le processus d'identification vise à évaluer s'ils ont été impactés par une quelconque décision et activité de l'organisation ou s'ils sont susceptibles de l'être. Chaque fois que cela est possible et réalisable, il convient d'établir un dialogue avec les organisations les plus représentatives qui reflètent ces intérêts. Un dialogue effectif avec les parties prenantes repose sur la bonne foi et va bien au-delà des relations publiques.\n\nLorsqu'une organisation dialogue avec des parties prenantes, il lui est recommandé de ne pas privilégier un groupe organisé parce qu'il est plus «sympathique» ou qu'il soutient mieux les objectifs de l'organisation qu'un autre groupe. Il convient qu'une organisation n'omette pas de dialoguer avec des parties prenantes du simple fait de leur discrétion. Il est recommandé à l'organisation de ne pas créer ou soutenir des groupes particuliers pour faire comme si elle avait un partenaire avec qui dialoguer lorsque le partenaire supposé n'est, en fait, pas indépendant. Un véritable dialogue avec des parties prenantes sous-entend que les parties soient indépendantes et que tout soutien financier ou analogue soit exposé en toute transparence.\n\nIl convient qu'une organisation soit consciente de l'effet entraîné par ses décisions et activités sur les intérêts et les besoins de ses parties prenantes. Il convient qu'elle tienne dûment compte de ses parties prenantes ainsi que de leur capacité et de leurs besoins variables d'entrer en contact et de dialoguer avec elle.\n\nIl y a plus de chances pour que le dialogue avec les parties prenantes soit utile si l'on est en présence des éléments suivants: le dialogue poursuit un objectif clair; les intérêts de la partie prenante ont été identifiés; la relation établie entre les intérêts de la partie prenante et l'organisation est directe ou importante; les intérêts des parties prenantes sont pertinents et significatifs au regard du développement durable; et les parties prenantes détiennent les informations et la compréhension nécessaires pour prendre leurs décisions."
6:
  title: "Lignes directrices relatives aux questions centrales de responsabilité sociétale"
  1_label: "Description du contenu"
  1_desc: "Pour définir le périmètre de sa responsabilité sociétale, identifier les domaines d'action pertinents et fixer ses priorités, il convient que l'organisation traite les questions centrales suivantes (voir également Figure 3) :\n\t\t - la gouvernance de l'organisation;\n\t\t - les droits de l'Homme;\n\t\t - les relations et conditions de travail;\n\t\t - l'environnement;\n\t\t - la loyauté des pratiques;\n\t\t - les questions relatives aux consommateurs; et\n\t\t - les communautés et le développement local.\nLes aspects économiques, de même que ceux relatifs à la santé, à la sécurité et à la chaîne de valeur sont abordés dans les sept questions centrales lorsque cela est approprié. Les différentes façons dont les hommes et les femmes peuvent être affectés par chacune des sept questions centrales sont également examinées.\nChaque question centrale comprend un éventail de domaines d'action de responsabilité sociétale. Ils sont décrits dans le présent article, avec les actions et attentes associées. La responsabilité sociétale étant une notion dynamique qui reflète l'évolution des préoccupations sociétales, environnementales et économiques, d'autres domaines d'action peuvent apparaître à l'avenir.\nIl convient que toute action exercée sur ces questions centrales et domaines d'action repose sur les principes et les pratiques de la responsabilité sociétale (voir Articles 4 et 5). Pour chaque question centrale, il est recommandé à l'organisation d'identifier et de traiter tous les domaines d'action qui sont pertinents ou significatifs pour ses décisions et activités (voir Article 5). Lors de l'évaluation de la pertinence d'un domaine d'action, il convient de prendre en considération des objectifs à court terme et à long terme. Toutefois, il n'existe pas d'ordre préétabli dans lequel il convient que l'organisation aborde les questions centrales et les domaines d'action; cela variera en fonction de l'organisation, de sa situation particulière ou du contexte.\nBien que toutes les questions centrales soient liées et complémentaires, la nature de la gouvernance de l'organisation est quelque peu différente des autres questions centrales (voir 6.2.1.2). Une gouvernance effective de l'organisation permet à cette dernière de prendre des mesures concernant les autres questions centrales et domaines d'action, et d'appliquer les principes décrits dans l'Article 4.\n\nIl convient que l'organisation prenne en compte les questions centrales de manière holistique, c'est-à-dire qu'elle considère la totalité des questions centrales et domaines d'action, ainsi que leur interdépendance, et qu'elle ne se focalise pas sur un seul domaine d'action. Il convient que les organisations aient conscience du fait que les efforts déployés pour traiter un domaine d'action peuvent entraîner des répercussions sur d'autres domaines d'action. Il convient que des améliorations particulières ciblant un domaine d'action spécifique n'affectent pas défavorablement d'autres domaines d'action ou qu'elles n'entraînent pas d'impacts défavorables sur le cycle de vie de ses produits ou services, sur ses parties prenantes ou sur la chaîne de valeur.\nD'autres lignes directrices relatives à l'intégration de la responsabilité sociétale sont données dans l'Article 7.\nEn traitant ces questions centrales et domaines d'action, et en intégrant la responsabilité sociétale dans ses décisions et activités, une organisation peut tirer d'importants bénéfices (voir Encadré 5)."
  2:
    title: "Gouvernance de l'organisation"
    1_prefix: "6.2.1.1"
    1_label: "Vue d'ensemble - Organisations et gouvernance des organisations"
    1_desc: "La gouvernance de l'organisation est le système par lequel une organisation prend des décisions et les applique en vue d'atteindre ses objectifs.\n\nLa gouvernance de l'organisation peut comprendre à la fois des mécanismes formels de gouvernance, reposant sur des processus et des structures définis, et des mécanismes informels, émergeant en fonction des valeurs et de la culture de l'organisation, souvent sous l'influence des personnes qui dirigent l'organisation. La gouvernance de l'organisation est une fonction essentielle de tout type d'organisation car c'est le cadre des prises de décision au sein de l'organisation.\n\nLes systèmes de gouvernance varient en fonction de la taille et du type de l'organisation ainsi que du contexte environnemental, économique, politique, culturel et social dans lequel celle-ci opère. Ces systèmes sont dirigés par une personne ou par un groupe de personnes (propriétaires, membres, mandataires sociaux ou autres) détenant le pouvoir et ayant la responsabilité d'atteindre les objectifs de l'organisation."
    2_prefix: "6.2.1.2"
    2_label: "Vue d'ensemble - Gouvernance de l'organisation et responsabilité sociétale"
    2_desc: "La gouvernance de l'organisation est le facteur le plus important car il permet à une organisation d'assumer la responsabilité des impacts de ses décisions et activités, et d'intégrer la responsabilité sociétale en son sein et dans ses relations.\n\nDans le contexte de la responsabilité sociétale, la gouvernance des organisations présente la particularité d'être, à la fois, une question centrale qui suscite des actions de la part des organisations, et un moyen d'augmenter la capacité desdites organisations à se comporter de manière responsable vis-à-vis des autres questions centrales.\n\nCette particularité tient au fait qu'il convient que toute organisation souhaitant être responsable détienne un système de gouvernance lui permettant d'assurer une surveillance et d'appliquer les principes de responsabilité sociétale décrits dans l'Article 4."
    3_prefix: "6.2.2"
    3_label: "Principes et considérations"
    3_desc: "Il convient qu'une gouvernance efficace repose sur l'intégration des principes de la responsabilité sociétale (voir Article 4) dans les processus de décision et de mise en œuvre. Ces principes sont la redevabilité, la transparence, un comportement éthique, la reconnaissance des intérêts des parties prenantes et le respect du principe de légalité, la prise en compte des normes internationales de comportement et le respect des droits de l'Homme (voir Article 4). En plus de ces principes, il convient que l'organisation étudie les pratiques, les questions centrales et les domaines d'action de la responsabilité sociétale lorsqu'elle établit et effectue la revue de son système de gouvernance. D'autres lignes directrices relatives à l'intégration de la responsabilité sociétale dans l'ensemble de l'organisation sont données dans l'Article 7.\n\nLa Direction est également un élément critique pour une gouvernance efficace de l'organisation. Cela vaut non seulement pour les prises de décision, mais aussi pour la motivation des employés à appliquer la responsabilité sociétale et à l'intégrer dans la culture de l'organisation.\n\nLe devoir de vigilance peut être une approche utile qui permet à l'organisation d'aborder les domaines d'action de responsabilité sociétale. Pour consulter d'autres recommandations, voir 7.3.1."
    4_prefix: "6.2.3.1"
    4_label: "Structures et processus de prise de décision - Description du domaine d'action"
    4_desc: "Les structures et les processus de prise de décision facilitant la responsabilité sociétale sont ceux qui promeuvent l'utilisation des principes et pratiques décrits dans les Articles 4 et 5.\n\nChaque organisation possède des structures et des processus de prise de décision. Dans certains cas, ceux-ci sont formels, sophistiqués et même soumis à la législation et à la réglementation alors que dans d'autres cas, ils sont informels, implantés dans les valeurs et la culture de l'organisation. Il est recommandé à toutes les organisations de mettre en place des processus, systèmes, structures ou d'autres mécanismes, leur permettant de mettre en oeuvre les principes et pratiques de responsabilité sociétale."
    5_prefix: "6.2.3.2"
    5_label: "Structures et processus de prise de décision - Actions et attentes associées"
    5_desc: "Il convient que les structures et les processus de prise de décision de l'organisation permettent à celle-ci:\n\t\t - de développer des stratégies, des objectifs et des cibles reflétant son engagement dans la responsabilité sociétale;\n\t\t - de démontrer l'engagement et la redevabilité de la direction;\n\t\t - de créer et d'alimenter un environnement et une culture dans lesquels sont mis en œuvre les principes de la responsabilité sociétale (voir Article 4);\n\t\t - de créer un système d'incitations économiques et non-économiques en rapport avec les performances à atteindre en matière de responsabilité sociétale;\n\t\t - d'utiliser efficacement les ressources financières, les ressources naturelles et le capital humain;\n\t\t - d'accorder de bonnes chances aux groupes sous-représentés (y compris les femmes, les groupes raciaux et les groupes ethniques) d'occuper des postes de responsabilité dans l'organisation;\n\t\t - d'arbitrer de manière équilibrée entre les besoins de l'organisation et ceux de ses parties prenantes, y compris entre les besoins immédiats et ceux des générations futures;\n\t\t - d'instaurer des processus de communication bilatéraux avec ses parties prenantes, d'identifier les terrains d'accord et de désaccord et de négocier pour résoudre les conflits éventuels;\n\t\t - d'encourager la participation effective des employés à tous les niveaux, aux activités de l'organisation en rapport avec la responsabilité sociétale;\n\t\t - d'équilibrer le niveau de pouvoir, de responsabilité et de compétence des personnes qui prennent les décisions au nom de l'organisation;\n\t\t - de conserver une trace de la mise en œuvre des décisions afin de garantir qu'elles sont appliquées de manière responsable et de déterminer la redevabilité pour les résultats découlant des décisions et activités de l'organisation, qu'ils soient positifs ou négatifs; et\n\t\t - d'effectuer une revue périodique des processus de gouvernance de l'organisation et de les évaluer. Ajuster les processus en fonction du résultat des revues et communiquer les changements à l'ensemble de l'organisation."
  3:
    title: "Droits de l'Homme"
    1_prefix: "6.3.1.1"
    1_label: "Vue d'ensemble - Organisations et droits de l'Homme"
    1_desc: "Les droits de l'Homme sont les droits fondamentaux auxquels tous les êtres humains ont droit. Il existe deux grandes catégories de droits de l'Homme. La première catégorie regroupe les droits civils et politiques et comprend des droits comme le droit à la vie et à la liberté, l'égalité face à la loi et la liberté d'expression. La seconde catégorie regroupe les droits économiques, sociaux et culturels et inclut des droits comme le droit au travail, le droit à la nourriture, le droit au meilleur niveau de santé possible, le droit à l'éducation et le droit à la sécurité sociale.\n\nDiverses règles intellectuelles, morales et juridiques reposent sur le principe selon lequel les droits de l'Homme transcendent les lois ou les traditions culturelles. La suprématie des droits de l'Homme est soulignée par la communauté internationale dans la Déclaration internationale des droits de l'Homme et par les principaux instruments des droits de l'Homme (décrits dans l'Encadré 6). Plus largement, les organisations bénéficieront d'un ordre social et international dans lequel les droits et les libertés peuvent être pleinement réalisés.\n\nAlors que la législation relative aux droits de l'Homme se rapporte aux relations existant entre l'État et les individus, il est largement reconnu que les organisations privées peuvent exercer une influence sur les droits de l'Homme des individus, et donc, qu'elles sont tenues de les respecter."
    2_prefix: "6.3.1.2"
    2_label: "Vue d'ensemble - Droits de l'Homme et responsabilité sociétale"
    2_desc: "La reconnaissance et le respect des droits de l'Homme sont largement considérés d'une part, comme essentiels pour le principe de légalité et les concepts de justice sociale et d'équité, et d'autre part, comme fondamentaux pour les institutions essentielles de la société telles que le système judiciaire.\n\nLes États ont le devoir et la responsabilité de respecter, de protéger, d'appliquer les droits de l'Homme. Une organisation a la responsabilité de respecter les droits de l'Homme, y compris dans sa sphère d'influence."
    3_prefix: "6.3.2.1"
    3_label: "Principes et considérations - Principes"
    3_desc: "Les droits de l'Homme sont naturels, inaliénables, universels, indivisibles et interdépendants:\n\t\t - ils sont naturels car toute personne peut s'en prévaloir en raison de son appartenance au genre humain;\n\t\t - ils sont inaliénables car nul ne peut consentir à y renoncer ou à en être privé par des gouvernements ou toute autre institution;\n\t\t - ils sont universels car ils s'appliquent à tout un chacun indépendamment de son statut;\n\t\t - ils sont indivisibles car aucun d'eux ne peut sélectivement être ignoré; et\n\t\t - ils sont interdépendants car la réalisation d'un seul droit contribue à la réalisation des autres droits."
    4_prefix: "6.3.2.2"
    4_label: "Considérations"
    4_desc: "Les États ont le devoir de protéger les individus et les groupes contre tout manquement aux droits de l'Homme, de respecter ces derniers au sein de leurs juridictions et de les mettre en application. Les États prennent de plus en plus de mesures destinées à encourager les organisations établies dans leur juridiction à respecter les droits de l'Homme, même lorsqu'elles opèrent en dehors de la juridiction en question. Il est largement admis que les organisations et les individus ont la possibilité d'influer sur les droits de l'Homme, directement et indirectement, et cette influence est reconnue. Les organisations ont la responsabilité de respecter tous les droits de l'Homme, indépendamment du fait que l'État soit incapable d'assurer son devoir de protection ou non désireux de le faire. Le fait de respecter les droits de l'Homme implique, en premier lieu, de ne pas empiéter sur les droits d'autrui. Cette responsabilité implique de prendre des mesures proactives pour assurer que l'organisation évite de contribuer passivement au non-respect des droits ou de participer activement à leur violation. Assumer sa responsabilité de respecter les droits de l'Homme nécessite d'exercer son devoir de vigilance. Lorsque l'État manque à son devoir de protection, il est recommandé à l'organisation d'être particulièrement vigilante pour garantir qu'elle assume sa responsabilité de respecter les droits de l'Homme; le devoir de vigilance par rapport aux droits de l'Homme peut indiquer qu'il y a lieu de mener des actions allant plus loin que ce qui est nécessaire pour le cours normal des affaires.\n\nCertaines règles fondamentales du droit pénal imposent une redevabilité légale et une responsabilité juridique des individus et des organisations ainsi que des États, pour tout manquement grave aux droits de l'Homme internationaux. Elles comprennent l'interdiction de la torture, des crimes contre l'humanité, de l'esclavage et des génocides. Dans certains pays, les organisations font l'objet de poursuites en vertu de la législation nationale sur la base de crimes reconnus à l'échelle internationale. D'autres instruments des droits de l'Homme déterminent la portée des obligations légales des organisations en matière de droits de l'Homme ainsi que la manière dont elles sont réalisées et mises en application.\n\nLe respect des droits de l'Homme est la responsabilité première des organisations privées. Toutefois, il se peut qu'une organisation soit confrontée aux attentes de ses parties prenantes, désireuses qu'elle aille au delà du respect des droits de l'Homme; il est aussi possible qu'elle ait la volonté d'aller plus loin pour contribuer à la réalisation des droits de l'Homme. Le concept de sphère d'influence aide l'organisation à appréhender l'étendue des opportunités dont elle dispose pour renforcer les droits de l'Homme auprès des différents détenteurs des droits. Ainsi, il peut être utile à une organisation d'analyser sa capacité à influencer ou à encourager d'autres parties ainsi que les domaines d'action touchant aux droits de l'Homme sur lesquels elle est susceptible d'avoir le plus fort impact, et également d'identifier les détenteurs des droits qui seraient éventuellement concernés.\n\nLes opportunités dont dispose une organisation pour défendre les droits de l'Homme seront souvent plus importantes dans le périmètre de ses propres activités et parmi ses employés. De plus, une organisation aura des opportunités de travailler avec ses fournisseurs, des pairs ou d'autres organisations et la société au sens large. Dans certains cas, les organisations peuvent être désireuses de renforcer leur influence en collaborant avec d'autres organisations et individus. L'évaluation des opportunités d'action et de renforcement de l'influence est fonction de circonstances particulières, propres à l'organisation et au contexte dans lequel celle-ci opère. Toutefois, il convient que les organisations envisagent toujours que des conséquences négatives ou involontaires puissent se faire jour lorsqu'elles cherchent à influencer d'autres organisations.\n\nIl convient que les organisations envisagent de faciliter l'éducation aux droits de l'Homme en vue de promouvoir une sensibilisation aux droits de l'Homme parmi les détenteurs de ces droits et parmi ceux pouvant les impacter."
    5_prefix: "6.3.3.1"
    5_label: "Droits de l'Homme - Domaine d'action 1: Devoir de vigilance - Description du domaine d'action"
    5_desc: "Pour respecter les droits de l'Homme, il incombe aux organisations d'accomplir un devoir de vigilance visant à identifier, prévenir et traiter les impacts réels ou potentiels sur les droits de l'Homme, résultant de leurs propres activités ou de celles menées par ceux avec lesquels elles ont des relations. Le devoir de vigilance peut également alerter une organisation sur l'obligation qui lui incombe d'influencer le comportement des autres lorsqu'ils peuvent être la cause de violations des droits de l'Homme dans lesquelles l'organisation pourrait se trouver impliquée."
    6_prefix: "6.3.3.2"
    6_label: "Droits de l'Homme - Domaine d'action 1: Devoir de vigilance - Actions et attentes associées"
    6_desc: "Comme le devoir de vigilance s'applique à toutes les questions centrales, y compris aux droits de l'Homme, d'autres recommandations peuvent être consultées sur le devoir de vigilance en 7.3.1. Pour ce sujet des droits de l'Homme, il convient que l'accomplissement du devoir de vigilance englobe les composantes suivantes, en fonction de la taille et de la situation de l'organisation:\n\t\t - une politique des droits de l'Homme qui fournisse des lignes directrices qui font sens pour ceux qui font partie de l'organisation et pour leurs proches interlocuteurs;\n\t\t - un moyen d'évaluer comment des activités proposées ou déjà existantes peuvent avoir une incidence sur les droits de l'Homme;\n\t\t - un moyen d'intégrer la politique des droits de l'Homme dans l'ensemble de l'organisation;\n\t\t - des moyens d'effectuer un suivi des performances dans le temps, pour être en mesure de réaliser les ajustements nécessaires au niveau des priorités et de l'approche adoptée; et\n\t\t - des actions destinées à traiter les impacts négatifs de ses décisions et activités."
    7_prefix: "6.3.4.1"
    7_label: "Droits de l'Homme - Domaine d'action 2: Situations présentant un risque pour les droits de l'Homme - Description du domaine d'action"
    7_desc: "Il y a des circonstances et des environnements dans lesquels les organisations sont plus susceptibles d'être confrontées à des défis et à des dilemmes en rapport avec les droits de l'Homme et où le risque d'atteinte aux droits de l'Homme peut se trouver exacerbé. Ces cas comprennent:\n\t\t - les conflits ou une instabilité politique extrême, une défaillance du système démocratique ou judiciaire, l'absence de droits politiques ou civils;\n\t\t - la pauvreté, la sécheresse, les défis extrêmes en matière sanitaire ou les catastrophes naturelles;\n\t\t - toute participation à des activités extractives ou autres qui pourraient avoir une influence importante sur les ressources naturelles telles que l'eau, les forêts ou l'atmosphère, ou qui perturbent les communautés;\n\t\t - l'existence d'exploitations à proximité de communautés de peuples autochtones;\n\t\t - des activités pouvant avoir une incidence sur des enfants ou en impliquer;\n\t\t - une corruption structurelle;\n\t\t - des chaînes de la valeur complexes impliquant des travaux réalisés sur une base informelle, sans protection juridique; et\n\t\t - le besoin d'instaurer des mesures de grande envergure pour garantir la sécurité de locaux ou d'autres biens."
    8_prefix: "6.3.4.2"
    8_label: "Droits de l'Homme - Domaine d'action 2: Situations présentant un risque pour les droits de l'Homme - Actions et attentes associées"
    8_desc: "Il convient que les organisations fassent particulièrement attention lorsqu'elles abordent les situations mentionnées ci-dessus. En effet, ces situations peuvent nécessiter une mise en œuvre renforcée du devoir de vigilance pour garantir le respect des droits de l'Homme. Cela peut prendre la forme, par exemple, d'une évaluation indépendante de l'impact généré sur les droits de l'Homme.\n\nLorsqu'elles opèrent dans des environnements dans lesquels s'applique l'une de ces circonstances (ou plusieurs d'entre elles), les organisations sont susceptibles d'être confrontées à des jugements délicats et complexes sur le comportement qu'elles doivent adopter. Bien qu'il ne puisse y avoir de formule ou de solution simple, il convient que l'organisation fasse reposer ses décisions sur la responsabilité fondamentale du respect des droits de l'Homme, tout en contribuant également à en promouvoir et à en défendre la jouissance pleine et entière.\n\nLors de sa réponse, il convient que l'organisation examine les conséquences potentielles de ses actions de façon à ce que l'objectif souhaité qui est de respecter les droits de l'Homme, soit réellement atteint. Il importe, en particulier, de ne pas aggraver les situations et de ne pas entraîner d'autres violations de droits. Il convient de ne pas utiliser la complexité d'une situation pour justifier l'inaction."
    9_prefix: "6.3.5.1"
    9_label: "Droits de l'Homme - Domaine d'action 3: Prévention de la complicité - Description du domaine d'action"
    9_desc: "Le terme «complicité» a une acception juridique et une acception non juridique.\nDans le contexte juridique, la «complicité» a été définie dans certaines juridictions comme le fait de se prêter à la réalisation d'un acte ou de ne pas agir, avec pour effet un impact important sur la réalisation d'un acte répréhensible, tel qu'un crime, et ce, en connaissance de cause ou avec l'intention de contribuer à cet acte illégal.\n\nLa complicité est associée à la notion d'aide à la réalisation d'un acte illégal, ou à la notion d'omission.\nDans le contexte non juridique, la «complicité» a sa source dans de larges attentes sociétales en matière de comportement. En l'occurrence, une organisation peut être considérée comme complice lorsqu'elle aide autrui à commettre des actes fautifs qui ne sont pas en cohérence avec les normes internationales de comportement ou qui ne les prennent pas en compte, actes dont elle savait ou aurait dû savoir, par l'exercice de son devoir de vigilance, qu'ils entraîneraient des impacts négatifs considérables sur la société, l'économie ou l'environnement. Une organisation peut également être considérée comme complice lorsqu'elle passe sous silence de tels actes fautifs ou qu'elle en tire profit.\n\nBien que leurs limites soient imprécises et instables, trois formes de complicité peuvent être décrites:\n\t\t - La complicité active: Tel est le cas lorsqu'une organisation aide sciemment autrui à violer les droits de l'Homme;\n\t\t - La complicité passive: Cela implique qu'une organisation ou des filiales tirent directement profit des violations des droits de l'Homme perpétrées par autrui. À titre d'exemple, citons une organisation qui tolère les opérations menées par les forces de l'ordre pour réprimer une manifestation pacifique contre ses décisions et activités, ou l'application de mesures répressives alors que ses locaux sont sous surveillance, ou encore celle qui profite économiquement de la violation par ses fournisseurs des droits fondamentaux au travail; et\n\t\t - La complicité silencieuse: Cela peut sous-entendre le manquement d'une organisation à aborder avec les autorités appropriées la question d'une violation systématique ou continue des droits de l'Homme, comme le fait de ne pas s'élever contre une discrimination systématique à l'emploi, à l'encontre de groupes particuliers."
    10_prefix: "6.3.5.2"
    10_label: "Droits de l'Homme - Domaine d'action 3: Prévention de la complicité - Actions et attentes associées"
    10_desc: "Un domaine important dans lequel il peut apparaître des cas de complicité de violation des droits de l'Homme est constitué par les règlements de sécurité. À cet égard, il convient, entre autres choses, que l'organisation vérifie que ses règlements de sécurité respectent les droits de l'Homme et qu'ils sont en accord avec les normes et standards internationaux d'application de la loi. Il convient que les personnels de sécurité (employés, personnel sous contrat ou sous-traitant) aient reçu une formation adéquate, également en accord avec les standards des droits de l'Homme, et que les plaintes concernant des procédures ou du personnel de sécurité soient traitées et examinées rapidement et, le cas échéant, de manière indépendante. En outre, il convient que l'organisation exerce son devoir de vigilance pour garantir qu'elle ne participe pas à des violations des droits de l'Homme perpétrées par des forces de l'ordre public, qu'elle ne les facilite pas ou n'en bénéficie pas.\n\nDe plus, il convient que l'organisation:\n\t\t - ne fournisse pas de marchandises ou de services à une entité qui s'en sert pour perpétrer des violations des droits de l'Homme;\n\t\t - n'établisse pas de partenariat formel ou informel, ni de relation contractuelle avec un partenaire qui porte atteinte aux droits de l'Homme dans le contexte du partenariat ou dans l'exécution du travail faisant l'objet du contrat;\n\t\t - se renseigne sur les conditions sociales et environnementales de fourniture des biens et de prestation des services;\n\t\t - garantisse qu'elle n'est complice d'aucun déplacement de personnes hors de leur territoire sauf si ce transfert se déroule en conformité avec la législation nationale et les normes internationales, ce qui inclut la recherche d'autres solutions et garantit que les parties concernées reçoivent une compensation adéquate;\n\t\t - envisage de faire des déclarations publiques ou d'entreprendre toute autre action pour indiquer qu'elle ne laisse pas commettre des violations des droits de l'Homme, tels que des actes de discrimination à l'emploi dans le pays concerné; et\n\t\t - évite d'entretenir des relations avec des entités engagées dans des activités antisociales.\n\nUne organisation peut prendre conscience des risques de complicité, les prévenir et les traiter en intégrant, dans la mise en œuvre de son devoir de vigilance, les caractéristiques courantes de références juridiques et sociétales."
    11_prefix: "6.3.6.1"
    11_label: "Droits de l'Homme - Domaine d'action 4: Remédier aux atteintes aux droits de l'Homme - Description du domaine d'action"
    11_desc: "Même lorsque les institutions fonctionnent de manière optimale, des litiges peuvent apparaître à propos de l'impact des décisions et activités de l'organisation sur les droits de l'Homme. Les mécanismes effectifs pour remédier aux atteintes aux droits jouent un rôle important dans le devoir de protection des droits de l'Homme qui incombe à l'État. De la même façon, pour exercer sa responsabilité en matière de respect des droits de l'Homme, il convient que l'organisation établisse un mécanisme permettant à ceux qui estiment avoir été lésés, de porter l'information à l'attention de l'organisation et de demander réparation. Il convient que ce mécanisme n'empêche pas d'accéder aux voies juridiques existantes. Il convient que les mécanismes privés ne freinent pas le renforcement des institutions de l'État, notamment les mécanismes judiciaires, mais qu'ils puissent offrir des opportunités supplémentaires pour les recours et réparations."
    12_prefix: "6.3.6.2"
    12_label: "Droits de l'Homme - Domaine d'action 4: Remédier aux atteintes aux droits de l'Homme - Actions et attentes associées"
    12_desc: "Il convient qu'une organisation établisse des mécanismes de recours pour son propre usage et pour celui de ses parties prenantes, ou qu'elle en assure la disponibilité. Pour que ces mécanismes soient efficaces, il convient qu'ils soient:\n\t\t - légitimes: Cela inclut des structures de gouvernance claires, transparentes et suffisamment indépendantes pour garantir qu'aucune partie à un processus de traitement d'un conflit particulier ne peut interférer avec la gestion juste dudit processus;\n\t\t - accessibles: Il convient de rendre publique leur existence et de fournir une assistance adéquate aux parties lésées, susceptibles d'être confrontées à des obstacles, tels que la langue, l'illettrisme, une sensibilisation insuffisante ou un manque de moyens financiers, l'éloignement, une incapacité ou la crainte de représailles;\n\t\t - prévisibles: Il convient qu'il existe des procédures claires et connues, une échéance claire pour chaque étape et des précisions sur les différents types d'actes d'assignation en justice et sur les résultats qu'ils peuvent (ou non) offrir, en association avec un moyen de surveiller la mise en œuvre de l'éventuel résultat;\n\t\t - équitables: Il convient que les parties lésées aient accès aux sources d'information, de conseil et d'expertise nécessaires à l'engagement dans un juste processus de traitement du conflit;\n\t\t - compatibles avec les droits: Il convient que les résultats et les compensations concordent avec les normes relatives aux droits de l'Homme reconnues à l'échelle internationale;\n\t\t - clairs et transparents: Bien que la confidentialité puisse parfois être appropriée, il convient que le processus et le résultat soient suffisamment ouverts et soumis au regard de l'opinion publique et qu'ils donnent tout leur poids à l'intérêt général; et\n\t\t - fondés sur le dialogue et la médiation: Il convient que le processus vise à remédier aux atteintes à l'aide de solutions mutuellement acceptées, obtenues par un dialogue entre les parties. Lorsqu'un jugement est souhaitable, il convient que les parties conservent le droit d'y parvenir au moyen de mécanismes distincts, indépendants."
    13_prefix: "6.3.7.1"
    13_label: "Droits de l'Homme - Domaine d'action 5: Discrimination et groupes vulnérables - Description du domaine d'action"
    13_desc: "Une discrimination implique une distinction, une exclusion ou une préférence qui a pour effet d'annihiler toute égalité des chances ou de traitement et qui est sous-tendue par un raisonnement fondé sur le préjudice plutôt que sur un motif légitime. Parmi les motifs illégitimes de discrimination, on compte, sans toutefois s'y limiter: la race, la couleur, le genre, l'âge, la langue, les avoirs, la nationalité ou l'ascendance nationale, la religion, l'origine ethnique ou sociale, la caste, des motifs économiques, l'invalidité, la grossesse, l'appartenance à une population autochtone, l'affiliation à un syndicat, à un parti politique, l'opinion politique ou autre. Des motifs illégitimes émergents de discrimination recouvrent aussi le statut marital ou familial, les relations personnelles et l'état de santé tel que l'infection par le VIH ou la séropositivité. La prohibition de la discrimination est l'un des principes les plus fondamentaux de la législation internationale sur les droits de l'Homme.\n\nLa participation pleine et entière de tous les groupes, y compris ceux qui sont vulnérables, et leur intégration dans la société, offrent des opportunités ou les renforcent pour toutes les organisations ainsi que pour les personnes concernées. Une organisation a beaucoup à gagner en contribuant activement à garantir l'égalité des chances et le respect de tous.\n\nLes groupes qui font l'objet d'une discrimination persistante avec, pour résultat, des préjudices récurrents, sont sujets à d'autres discriminations et il convient que les droits de l'Homme dont ils jouissent fassent l'objet d'une attention renforcée, en termes de protection et de respect, de la part des organisations. Bien que les groupes vulnérables comprennent généralement ceux mentionnés en 6.3.7.2, il peut y en avoir d'autres dans la communauté dans laquelle opère l'organisation.\n\nLa discrimination peut également être indirecte. Tel est le cas lorsqu'une disposition, un critère ou une pratique apparemment neutre désavantage des personnes pourvues d'un attribut spécifique, par rapport à d'autres personnes, à moins que cette disposition, ce critère ou cette pratique ne soit justifié objectivement par un but légitime et que les moyens d'y parvenir soient adaptés et nécessaires."
    14_prefix: "6.3.7.2"
    14_label: "Droits de l'Homme  Domaine d'action 5: Discrimination et groupes vulnérables - Actions et attentes associées"
    14_desc: "Il convient que l'organisation veille à garantir qu'elle n'exerce aucune discrimination à l'encontre de ses employés, partenaires, clients, parties prenantes, membres et de quiconque avec lequel elle est en contact ou sur lequel elle peut exercer une influence.\n\nIl convient que l'organisation examine ses propres activités et celles des autres parties au sein de sa sphère d'influence pour déterminer l'existence éventuelle d'une discrimination directe ou indirecte. Il convient également qu'elle garantisse ne pas contribuer à des pratiques discriminatoires à travers les relations qui sont liées à ses activités. En l'occurrence, il convient que l'organisation encourage et aide les autres parties à assumer leur responsabilité de prévention de la discrimination. En cas d'échec, il convient de reconsidérer ses relations avec de telles organisations. Elle peut, par exemple, procéder à l'analyse de ses modes d'interaction avec les femmes en comparaison avec les hommes et évaluer si les politiques et décisions à cet égard sont objectives ou si elles sont le reflet d'idées préconçues. Elle peut chercher à consulter des organisations locales ou internationales possédant une expertise en matière de droits de l'Homme. Une organisation peut être guidée par les conclusions et recommandations découlant de procédures de surveillance ou d'enquête nationales ou internationales.\n\nIl convient que l'organisation envisage de faciliter la sensibilisation des membres des groupes vulnérables à leurs droits.\n\nIl convient également que l'organisation contribue à redresser les discriminations ou l'héritage d'une discrimination passée, lorsque cela est réalisable. Par exemple, il lui est recommandé de s'efforcer d'employer des organisations gérées par des personnes issues de groupes ayant fait l'objet de discriminations passées ou de conclure des affaires avec elles; dans la mesure du possible, il convient qu'elle soutienne les démarches entreprises pour faciliter l'accès à l'éducation, aux infrastructures ou aux services sociaux, pour les groupes ne bénéficiant pas du libre accès.\n\nUne organisation peut avoir une vision positive et constructive de la diversité des personnes avec lesquelles elle est en relation. Il lui est recommandé de s'intéresser non seulement aux aspects touchant aux droits de l'Homme mais aussi aux avantages qu'elle pourrait en retirer pour ses propres activités, en termes de valeur ajoutée par le plein développement de la variété des ressources et relations humaines.\n\nLes exemples suivants de groupes vulnérables sont décrits avec des actions et des attentes connexes spécifiques:\n\t\t - Les femmes et les jeunes filles constituent la moitié de la population mondiale mais il est fréquent qu'elles ne soient pas sur un pied d'égalité avec les hommes et les jeunes garçons pour ce qui concerne l'accès aux ressources et aux opportunités. Les femmes ont le droit de jouir de tous les droits de l'Homme sans discrimination, y compris dans le domaine de l'éducation, de l'emploi et des activités socioéconomiques, de même qu'elles ont le droit de prendre des décisions en matière de mariage et d'affaires familiales ainsi qu'en ce qui concerne leur contraception. Il convient que les politiques et les activités de l'organisation prennent en considération, comme il se doit, les droits de la femme et promeuvent l'égalité de traitement des femmes et des hommes dans les sphères politiques, économiques et sociales.\n\t\t - Les personnes en situation de handicap sont souvent vulnérables, en partie en raison d'une perception erronée de leurs compétences et de leurs aptitudes. Il convient que les organisations contribuent à assurer que l'on accorde, aux hommes et aux femmes en situation de handicap, dignité, autonomie et pleine participation à la société. Il convient que le principe de non-discrimination soit respecté et il est recommandé aux organisations de prendre des dispositions raisonnables en matière d'accessibilité aux locaux.\n\t\t - Les enfants sont particulièrement vulnérables, essentiellement en raison de leur statut de dépendance. Lorsqu'il s'agit de prendre des mesures susceptibles d'avoir une incidence sur des enfants, il convient de veiller avant tout à préserver les intérêts de l'enfant. Il convient de toujours respecter et prendre en considération les principes de la Convention sur les droits de l'enfant qui comprennent la non-discrimination, le droit de l'enfant à la survie, à la vie, au développement et à la liberté d'expression. Il convient que les organisations disposent de politiques destinées à empêcher que leurs employés ne s'engagent dans l'exploitation sexuelle des enfants et dans toute autre forme d'exploitation de ceux-ci.\n\t\t - Les populations autochtones peuvent être considérées comme un groupe vulnérable car elles connaissent une discrimination systémique qui inclut la colonisation, la dépossession de leurs terres, un statut distinct de celui des autres citoyens et des violations de leurs droits de l'Homme. Les populations autochtones jouissent de droits collectifs et les individus qui appartiennent à ces peuples partagent les droits de l'Homme universels, en particulier le droit à l'égalité des chances et de traitement. Les droits collectifs comprennent: l'autodétermination (qui implique le droit de déterminer son identité, son statut politique et son mode de développement); l'accès aux terres, à l'eau et aux ressources traditionnelles ainsi que leur gestion; la conservation et la jouissance de ses coutumes, de sa culture, de sa langue et de son savoir traditionnel sans discrimination, et la gestion de sa propriété intellectuelle et culturelle. Il convient que l'organisation reconnaisse et respecte les droits des populations autochtones lorsqu'elle applique ses décisions et poursuit ses activités. Il convient que l'organisation reconnaisse et respecte le principe de la non-discrimination et les droits des individus qui appartiennent à une population autochtone quand elle applique ses décisions et réalise ses activités.\n\t\t - Les migrants, les travailleurs migrants et leurs familles peuvent également être vulnérables en raison de leur origine étrangère ou régionale, en particulier lorsque ce sont des migrants sans papiers ou en situation irrégulière. Il convient que l'organisation respecte leurs droits et contribue à promouvoir un climat de respect des droits de l'Homme des migrants, des travailleurs migrants et de leur famille.\n\t\t - Personnes ayant fait l'objet d'une discrimination sur la base de leur origine, y compris leur caste. Des centaines de millions d'individus font l'objet d'une discrimination à cause de leur origine ou de leur hérédité. Cette forme de discrimination repose sur des antécédents en matière de violation des droits justifiés par le concept arbitraire selon lequel certaines personnes sont considérées comme impures ou moins respectables en raison de l'appartenance au groupe dans lequel elles sont nées. Il est recommandé à l'organisation d'éviter ces pratiques et, chaque fois que possible, de chercher à éliminer ces préjudices.\n\t\t - Personnes ayant fait l'objet d'une discrimination sur la base de leur race Des personnes subissent une discrimination en raison de leur race, de leur identité culturelle et de leur origine ethnique. Il existe des antécédents en matière de violation des droits qui sont justifiés par le concept arbitraire selon lequel certaines personnes sont inférieures en raison de leur couleur ou de leur culture. Le racisme est souvent présent dans les régions ayant connu l'esclavage ou l'oppression d'un groupe racial par un autre.\n\t\t - D'autres groupes vulnérables comprennent, par exemple, les personnes âgées, les personnes déplacées, les pauvres, les personnes illettrées, les personnes séropositives ou vivant avec le VIH, les minorités et les groupes religieux."
    15_prefix: "6.3.8.1"
    15_label: "Droits de l'Homme - Domaine d'action 6: Droits civils et politiques - Description du domaine d'action"
    15_desc: "Les droits civils et politiques comprennent des droits absolus tels que le droit à la vie, le droit de vivre dans la dignité, le droit d'être protégé contre la torture, le droit à la sécurité de sa personne, le droit à la propriété individuelle, à la liberté et à l'intégrité de la personne ainsi que le droit à un procès en bonne et due forme et le droit d'être entendu équitablement lorsque l'on est accusé d'une infraction. Ils englobent également la liberté d'opinion et d'expression, le droit de réunion pacifique et de libre association, la liberté d'adopter et de pratiquer une religion, la liberté de croyance, l'absence d'immixtion arbitraire dans la vie privée, la famille, la résidence ou la correspondance, la protection contre les atteintes à l'honneur et à la réputation, le droit à l'accès aux services publics et le droit de participer à des élections."
    16_prefix: "6.3.8.2"
    16_label: "Droits de l'Homme - Domaine d'action 6: Droits civils et politiques - Actions et attentes associées"
    16_desc: "Il convient qu'une organisation respecte tous les droits politiques et civils individuels. Citons, entre autres, les exemples suivants:\n\t\t - la vie des individus;\n\t\t - la liberté d'opinion et d'expression. Il convient que l'organisation n'ait pas pour but de radier les points de vue ou les opinions de quiconque, même si la personne formule des critiques à l'encontre de l'organisation, en interne ou à l'extérieur;\n\t\t - le droit de réunion pacifique et de libre association;\n\t\t - la liberté de chercher, de recevoir et de répandre, sans considérations de frontières, les informations et les idées par quelque moyen d'expression que ce soit;\n\t\t - le droit d'être propriétaire, seul ou en association avec autrui, et la protection contre la dépossession arbitraire; et\n\t\t - l'accès à un procès en bonne et due forme et le droit d'être entendu équitablement avant que ne soit prise une éventuelle mesure disciplinaire en interne. Il convient que toute mesure disciplinaire soit proportionnée à la faute et ne comprenne pas de châtiment physique ou de traitement inhumain ou dégradant."
    17_prefix: "6.3.9.1"
    17_label: "Droits de l'Homme - Domaine d'action 7: Droits économiques, sociaux et culturels - Description du domaine d'action"
    17_desc: "Chaque personne, en sa qualité de membre de la société, a des droits économiques, sociaux et culturels, nécessaires à sa dignité et à son épanouissement personnel. Ceux-ci comprennent le droit: à l'éducation, au travail dans des conditions justes et favorables, à la liberté d'association, à un niveau adéquat de santé, à un niveau de vie suffisant pour assurer sa santé physique et morale et son bien-être ainsi que celui de sa famille, à une nourriture suffisante, à l'habillement, au logement, aux soins médicaux et à la protection sociale nécessaire, telle que la sécurité en cas de chômage, de maladie, d'invalidité, de veuvage, de vieillesse ou de toute autre perte de ses moyens de subsistance par suite de circonstances indépendantes de sa volonté, le droit à la pratique religieuse et culturelle ainsi qu'à de véritables opportunités de prendre part, sans discrimination, aux prises de décisions qui soutiennent les pratiques positives et découragent les pratiques négatives en rapport avec ces droits."
    18_prefix: "6.3.9.2"
    18_label: "Droits de l'Homme - Domaine d'action 7: Droits économiques, sociaux et culturels - Actions et attentes associées"
    18_desc: "Pour respecter ces droits, il incombe à l'organisation d'exercer son devoir de vigilance afin de garantir qu'elle ne s'engage pas dans des activités entravant, faisant obstacle ou empêchant la jouissance de ces droits. Ci-après sont mentionnés des exemples de ce qu'il convient qu'une organisation fasse pour respecter ces droits. Il est recommandé à l'organisation d'évaluer les impacts possibles de ses décisions, activités, produits et services ainsi que ceux de ses nouveaux projets, sur les droits en question, y compris les droits de la communauté locale. De plus, il convient qu'elle ne limite pas, directement ou indirectement, ou n'interdise pas l'accès à un produit important ou à une ressource essentielle telle que l'eau. Par exemple, il convient que des procédés de production ne compromettent pas l'approvisionnement en une ressource peu abondante d'eau de boisson. Il convient que les organisations, selon le cas, envisagent d'adopter ou de maintenir des politiques spécifiques pour garantir la distribution efficiente de biens et de services essentiels lorsque cette distribution est menacée.\n\nIl convient qu'une organisation responsable puisse également contribuer au respect de ces droits, chaque fois qu'il convient, en gardant à l'esprit les différents rôles et capacités des gouvernements et autres organisations en rapport avec la matérialisation de ces droits.\n\nUne organisation peut envisager, par exemple:\n\t\t - de faciliter l'accès à l'éducation et à la formation permanente des membres d'une communauté, et si possible, de fournir une assistance et des locaux;\n\t\t - d'unir ses efforts à ceux d'autres organisations et institutions gouvernementales favorisant le respect et la réalisation des droits économiques, sociaux et culturels;\n\t\t - d'explorer des moyens en rapport avec ses activités principales pour contribuer au respect de ces droits; et\n\t\t - d'adapter les biens ou services au pouvoir d'achat des pauvres.\n\nIl est également recommandé de considérer les droits économiques, sociaux et culturels comme tout autre droit dans le contexte local. D'autres lignes directrices relatives aux actions et attentes associées sont données en 6.8 qui traite de l'implication auprès des communautés et de la contribution au développement local."
    19_prefix: "6.3.10.1"
    19_label: "Droits de l'Homme - Domaine d'action 8: Principes fondamentaux et droits au travail - Description du domaine d'action"
    19_desc: "Les principes fondamentaux et les droits au travail sont axés sur les domaines d'action liés au travail. Ils ont été adoptés par la communauté internationale comme des droits fondamentaux de l'Homme et sont, en tant que tels, abordés dans la section relative aux droits de l'Homme.\n\nL'Organisation internationale du Travail (OIT) a identifié des droits fondamentaux au travail. Ceux-ci comprennent:\n\t\t - la liberté d'association et la reconnaissance effective du droit de négociation collective;\n\t\t - l'élimination de toute forme de travail forcé ou obligatoire;\n\t\t - l'abolition effective du travail des enfants; et\n\t\t - l'élimination de la discrimination en matière d'emploi et de profession."
    20_prefix: "6.3.10.2"
    20_label: "Droits de l'Homme - Domaine d'action 8: Principes fondamentaux et droits au travail - Actions et attentes associées"
    20_desc: "Bien que ces droits soient prévus par la législation dans de nombreuses juridictions, il convient que l'organisation s'assure de manière indépendante qu'elle aborde les questions suivantes:\n\t\t - liberté d'association et négociation collective Les travailleurs et les employeurs, sans aucune distinction, ont le droit de fonder des organisations et, sous réserve d'en respecter le règlement, de s'affilier aux organisations de leur propre choix, sans autorisation préalable. Il convient que les organisations représentatives constituées par les travailleurs ou auxquelles ceux-ci adhèrent soient reconnues pour les besoins des négociations collectives. Les termes et conditions de travail peuvent être fixés dans le cadre de négociations collectives volontaires lorsque les travailleurs en font le choix. Il convient que les représentants des travailleurs disposent de locaux appropriés leur permettant d'effectuer leur travail de manière efficace et de jouer leur rôle sans subir d'ingérence. Il convient que les conventions collectives comportent des dispositions relatives au règlement des litiges. Il convient que les représentants des travailleurs obtiennent les informations requises pour mener des négociations valables. (Voir 6.4 pour de plus amples informations sur la liberté d'association et le lien existant entre, d'une part, la liberté d'association et la négociation collective et d'autre part, le dialogue social).\n\t\t - travail forcé Il convient qu'une organisation ne fasse pas effectuer de travail forcé ou obligatoire et qu'elle n'en bénéficie pas. Il convient qu'aucun travail ou service ne soit exigé de quelqu'un sous la menace d'une sanction ou dans des conditions dans lesquelles le travail n'est pas exécuté de manière volontaire. Il convient qu'une organisation ne soit pas engagée dans le travail carcéral ou n'en bénéficie pas, sauf si les prisonniers ont été reconnus coupables par un tribunal et si leur travail est supervisé et contrôlé par une administration publique. De plus, il convient que le travail carcéral ne soit pas mis à profit par des organisations privées, sauf s'il est réalisé sur une base de volontariat, comme en témoigneraient, entre autres choses, des conditions de travail décentes et équitables.\n\t\t - égalité des chances et non-discrimination Il convient que l'organisation confirme que ses politiques de recrutement sont exemptes de discrimination fondée sur la race, la couleur, le genre, la religion, la nationalité ou l'ascendance nationale, l'origine sociale, l'opinion politique, l'âge ou l'invalidité. Parmi les motifs illégitimes émergeants, on peut également citer le statut marital ou familial, les relations personnelles et l'état de santé tel que l'infection par le VIH ou la séropositivité. Ces dispositions s'accordent avec le principe général selon lequel il convient que les pratiques et les politiques d'embauche, les rémunérations, les conditions d'emploi, l'accès à la formation et l'avancement, ainsi que la cessation de la relation de travail reposent uniquement sur les exigences relatives au travail. Il convient que les organisations prennent également des mesures pour prévenir tout harcèlement sur le lieu de travail:\n\t\t\t - en évaluant régulièrement l'impact de ses politiques et activités sur la promotion de l'égalité des chances et de la non-discrimination;\n\t\t\t - en menant des actions positives pour assurer la protection et la promotion des groupes vulnérables. Cela pourrait inclure la création de postes de travail destinés aux personnes en situation de handicap pour les aider à gagner leur vie dans des conditions adéquates, et l'établissement de programmes (ou la participation à ceux-ci) abordant des domaines d'action tels que la promotion de l'emploi des jeunes et des séniors, l'égalité des opportunités d'emploi pour les femmes, ainsi qu'une représentation plus équilibrée de celles-ci aux postes de responsabilité.\n\t\t - travail des enfants L'âge minimum d'admission à l'emploi est déterminé par des instruments internationaux (voir Encadré 7). Il convient que les organisations ne fassent pas appel au travail des enfants et n'en bénéficient pas. Si une organisation constate le travail d'enfants dans ses activités ou dans sa sphère d'influence, il convient qu'elle garantisse non seulement que les enfants sont libérés du travail mais aussi que d'autres solutions appropriées leur sont offertes, en particulier l'éducation. Les travaux légers qui ne sont pas néfastes pour un enfant ou n'interfèrent pas avec l'assiduité scolaire ou avec d'autres activités nécessaires à l'épanouissement de l'enfant (telles que les activités de loisirs) ne sont pas considérés comme du travail des enfants."
  4:
    title: "Relations et conditions de travail"
    1_prefix: "6.4.2.1"
    1_label: "Principes et considérations - Description du contenu"
    1_desc: "Un principe fondamental de la Déclaration de Philadelphie [72] de l'OIT de 1944 est que le travail n'est pas une marchandise. Cela signifie qu'il convient de ne pas traiter les travailleurs comme un facteur de production et de ne pas les soumettre aux mêmes mécanismes du marché que ceux qui s'appliquent aux marchandises. La vulnérabilité inhérente des travailleurs et la nécessité de protéger leurs droits fondamentaux se reflètent dans la Déclaration universelle des droits de l'Homme et dans le Pacte international des droits économiques, sociaux et culturels [144][156]. Les principes en jeu comportent le droit de chacun à gagner sa vie en effectuant un travail librement choisi et le droit d'avoir des conditions de travail équitables et satisfaisantes."
    2_prefix: "6.4.2.2"
    2_label: "Principes et considérations - Considérations"
    2_desc: "Les droits de l'Homme reconnus par l'OIT comme constituant des droits fondamentaux au travail sont traités en 6.3.10. De nombreuses autres conventions et recommandations de l'OIT complètent et renforcent les diverses dispositions de la Déclaration universelle des droits de l'Homme et des deux Pactes mentionnés dans l'Encadré 6 et peuvent servir de guide pratique concernant la signification des divers droits de l'Homme.\nLa responsabilité de garantir aux travailleurs un traitement juste et équitable incombe avant tout aux États. Cela peut se faire par :\n\t\t - l'adoption d'une législation compatible avec la Déclaration universelle des droits de l'Homme et avec les normes de travail de l'OIT en vigueur;\n\t\t - la mise en application de cette législation, notamment par l'élaboration et le financement de systèmes nationaux d'inspection du travail; et\n\t\t - la garantie que les travailleurs et les organisations ont l'accès voulu à la justice.\nLa législation et les pratiques en matière de relations et conditions de travail varient d'un pays à l'autre. Lorsque les gouvernements n'ont pas légiféré, il convient qu'une organisation respecte les principes de comportement sur lesquels reposent ces instruments internationaux. Si la législation est adaptée, il convient que les organisations se conforment à la loi, même si sa mise en application par le gouvernement est inadaptée.\nIl importe de faire la distinction entre le rôle du gouvernement en qualité d'organe de l'État et son rôle en qualité d'employeur. Les organismes publics ou les organisations d'État ont les mêmes responsabilités en matière de relations et de conditions de travail que d'autres organisations."
    3_prefix: "6.4.3"
    3_label: "Relations et conditions de travail - Domaine d'action 1: Emploi et relations employeur/employé"
    3_desc: "L'importance de l'emploi pour l'accomplissement personnel est universellement admise. En tant qu'employeur, une organisation contribue à atteindre l'un des objectifs de la société les plus largement admis, à savoir l'amélioration du niveau de vie en assurant le plein emploi et la stabilité de l'emploi ainsi qu'un travail décent.\nChaque pays assure un cadre juridique qui réglemente les relations entre employeurs et employés. Bien que les tests et critères précis permettant de déterminer s'il existe des relations employeur/employé varient d'un pays à l'autre, le fait que les parties contractantes n'ont pas le même pouvoir et que les employés ont donc besoin d'une protection supplémentaire est universellement accepté et constitue la base de la législation du travail.\nLes relations employeur/employé confèrent des droits et imposent des obligations tant aux employeurs qu'aux employés, dans l'intérêt de l'organisation et de la société.\nLe travail n'est pas toujours réalisé dans une relation employeur/employé. Le travail et les services sont également assurés par des hommes et des femmes exerçant en indépendants; en pareil cas, les parties sont jugées indépendantes l'une de l'autre et ont des relations plus égales et commerciales. La distinction entre emploi et relations commerciales n'est pas toujours claire et elle est parfois erronée, si bien que les travailleurs n'obtiennent pas toujours les protections et les droits auxquels ils peuvent prétendre. Tant pour la société que pour la personne effectuant un travail, il est important qu'un cadre juridique et institutionnel approprié soit reconnu et mis en œuvre. Que le travail soit effectué sous contrat de travail ou sous contrat commercial, toutes les parties au contrat sont habilitées à connaître leurs droits et leurs responsabilités et à avoir les recours appropriés si les termes du contrat ne sont pas respectés.\n\n\nIl convient que l'organisation :\n\t\t - soit sûre que tout le travail est réalisé par des hommes et des femmes qui sont juridiquement reconnus comme employés ou travaillant en indépendants;\n\t\t - ne cherche pas à se soustraire à l'obligation que la loi impose à l'employeur en déguisant des relations qui seraient sinon reconnues comme une relation employeur/employé soumise à la loi; \n\t\t - reconnaisse l'importance de la stabilité de l'emploi tant pour l'employé que pour la société, procède à une planification active de ses effectifs pour éviter tout recours excessif au travail occasionnel ou temporaire, sauf si le travail est saisonnier ou s'il est réellement de courte durée; \n\t\t - donne un préavis raisonnable, des informations actualisées et étudie avec les représentants des travailleurs, lorsqu'il en existe, la façon d'atténuer, dans toute la mesure du possible, les impacts négatifs des modifications envisagées dans ses activités, telles que les fermetures qui affectent l'emploi ;\n\t\t - garantisse l'égalité des chances et de traitement à tous les travailleurs et ne fasse aucune discrimination, directe ou indirecte, en matière de relations et conditions de travail;\n\t\t - élimine les éventuelles pratiques de licenciement arbitraires ou discriminatoires\n\t\t - protège les données personnelles des employés et leur vie privée\n\t\t - prenne des mesures pour garantir que les contrats de travail ou de sous-traitance ne sont passés qu'avec des organisations juridiquement reconnues ou capables d'assumer des responsabilités d'employeur et d'assurer des conditions de travail décentes, et disposées à le faire. Il convient qu'une organisation ne fasse appel qu'à des intermédiaires juridiquement reconnus et, en cas d'autres arrangements pour la réalisation d'un travail, consente des droits juridiques à ceux qui effectuent ce travail. Il convient que les travailleurs à domicile ne soient pas traités plus mal que les autres salariés;\n\t\t - ne profite pas de relations et conditions de travail non équitables, abusives ou visant à exploiter leurs partenaires, fournisseurs ou sous-traitants, y compris les travailleurs à domicile. Il convient qu'une organisation fasse des efforts raisonnables pour encourager les autres organisations intervenant dans sa sphère d'influence à respecter des relations et des conditions de travail responsables, reconnaissant qu'un niveau d'influence élevé est susceptible de correspondre à un niveau de responsabilité élevé dans l'exercice de cette influence. En fonction de la situation et de l'influence exercée, des efforts raisonnables pourraient inclure l'établissement d'obligations contractuelles imposées aux fournisseurs et sous-traitants, des visites et inspections inopinées ainsi que le respect du devoir de vigilance pour superviser les contractants et les intermédiaires. Lorsque les fournisseurs et les sous-traitants sont tenus de se conformer à un code de bonnes relations et conditions de travail, il convient qu'il y ait cohérence entre ce code et la Déclaration universelle des droits de l'Homme et les principes sous-jacents dans les normes du travail de l'OIT (voir en 5.2.3 les informations complémentaires relatives aux responsabilités dans la sphère d'influence); et \n\t\t - lorsqu'elle opère à l'international, déploie des efforts afin de favoriser l'emploi, l'évolution professionnelle, la promotion et l'avancement des ressortissants du pays d'accueil. Cela comprend l'approvisionnement et la distribution par des entreprises locales, lorsque cela est possible."
    4_prefix: "6.4.4"
    4_label: "Relations et conditions de travail - Domaine d'action 2: Conditions de travail et protection sociale"
    4_desc: "Les conditions de travail et la protection sociale sont des éléments essentiels des relations et conditions de travail. Elles couvrent un large éventail de questions, notamment les heures de travail, les congés, la rémunération, les avantages sociaux, la sécurité sociale, la santé et la sécurité au travail, et la protection contre les licenciements abusifs.\nLes conditions de travail et la protection sociale sont importantes pour les travailleurs et leurs familles, car elles ont un impact direct sur leur bien-être et leur qualité de vie. Elles sont également importantes pour les organisations, car elles peuvent avoir un impact sur la productivité, la motivation et la fidélisation des employés.\nLes conditions de travail et la protection sociale sont réglementées par la législation nationale et les normes internationales, notamment les conventions et recommandations de l'OIT. Il convient que les organisations respectent ces réglementations et normes, et qu'elles mettent en place des politiques et pratiques qui garantissent des conditions de travail équitables et une protection sociale adéquate pour leurs employés.\n\n\nIl convient que l'organisation :\n\t\t - s'assure que les conditions de travail sont conformes à la législation et à la réglementation nationale et sont compatibles avec les normes internationales du travail en vigueur; \n\t\t - respecte les dispositions établies à des niveaux plus élevés par d'autres instruments juridiquement contraignants, tels que les conventions collectives;\n\t\t - observe au moins les dispositions minimales définies dans les normes internationales du travail établies par l'OIT, notamment lorsqu'aucune législation nationale n'a encore été adoptée; \n\t\t - assure des conditions de travail décentes en ce qui concerne les salaires, la durée de travail, le repos hebdomadaire, les congés, la santé et la sécurité, la protection de la maternité et la possibilité de concilier travail et responsabilités familiales;\n\t\t - dans toute la mesure du possible, respecte les traditions et coutumes nationales ou religieuses; \n\t\t - assure à tous les travailleurs des conditions de travail permettant, dans toute la mesure du possible, d'équilibrer vie personnelle et vie professionnelle, et comparables à celles offertes par des employeurs similaires dans la localité concernée ; \n\t\t - assure des salaires et autres formes de rémunération conformes à la législation, à la réglementation ou aux conventions collectives au niveau national. Il convient qu'une organisation verse des salaires au moins adaptés aux besoins des travailleurs et de leurs familles. Ce faisant, il convient qu'elle prenne en compte le niveau général des salaires dans le pays, le coût de la vie, les avantages de la sécurité sociale et les niveaux de vie relatifs d'autres groupes sociaux. Il convient également qu'elle prenne en compte des facteurs économiques, y compris les exigences du développement économique, les niveaux de productivité et l'opportunité d'atteindre et de conserver un niveau d'emploi élevé. Lorsqu'elle fixe des salaires et des conditions de travail reflétant ces considérations, il convient qu'une organisation mène des négociations collectives avec ses travailleurs ou leurs représentants, en particulier les syndicats, s'ils le souhaitent, conformément aux systèmes nationaux de conventions collectives ;\n\t\t - assure l'égalité de rémunération pour un travail de valeur égale ;\n\t\t - verse directement des salaires aux travailleurs concernés, sauf restriction ou autre déduction autorisée par la législation, la réglementation ou les conventions collectives ;\n\t\t - se conforme à toute obligation concernant la protection sociale des travailleurs dans le pays dans lequel elle opère ;\n\t\t - respecte le droit des travailleurs à des horaires de travail normaux ou convenus, établis dans la législation, les réglementations ou conventions collectives. Il convient également qu'elle assure aux travailleurs un repos hebdomadaire et des congés payés annuels ;\n\t\t - respecte les responsabilités familiales des travailleurs en leur assurant des horaires de travail raisonnables, un congé parental et, si possible, des crèches et autres installations qui peuvent aider les travailleurs à concilier correctement vie professionnelle et vie personnelle; et\n\t\t - assure aux travailleurs des compensations pour les heures supplémentaires conformément à la législation, à la réglementation ou aux conventions collectives. Lorsqu'une organisation demande à des travailleurs de faire des heures supplémentaires, il convient qu'elle tienne compte des intérêts, de la sécurité et du bien-être des travailleurs concernés et de tout risque inhérent au travail. Il convient qu'une organisation respecte la législation et la réglementation interdisant les heures supplémentaires obligatoires et non compensées et respecte toujours les droits fondamentaux des travailleurs en matière de travail forcé."
    5_prefix: "6.4.5"
    5_label: "Relations et conditions de travail - Domaine d'action 3: Dialogue social"
    5_desc: "Le dialogue social est un processus de négociation, de consultation et d'échange d'informations entre les représentants des gouvernements, des employeurs et des travailleurs sur des questions d'intérêt commun concernant la politique économique et sociale. Il est un élément essentiel des relations et conditions de travail, car il permet aux parties prenantes de participer à la prise de décision et de contribuer à l'élaboration de politiques et de pratiques qui affectent leurs intérêts.\nLe dialogue social peut prendre différentes formes, notamment la négociation collective, la consultation et l'échange d'informations. Il peut avoir lieu au niveau de l'entreprise, du secteur, de la région ou du pays, et peut porter sur un large éventail de questions, notamment les conditions de travail, la rémunération, la formation, la santé et la sécurité au travail, et la protection sociale.\nLe dialogue social est reconnu par l'OIT comme un droit fondamental au travail et est réglementé par la législation nationale et les normes internationales. Il convient que les organisations respectent ces réglementations et normes, et qu'elles mettent en place des politiques et pratiques qui favorisent le dialogue social et la participation des travailleurs et de leurs représentants à la prise de décision.Il convient que l'organisation :\n\t\t - reconnaisse l'importance des institutions permettant le dialogue social, y compris au niveau international, et des structures de négociations collectives existantes; \n\t\t - respecte, en permanence, le droit des travailleurs à constituer leurs propres organisations ou à y adhérer afin de faire valoir leurs intérêts ou de mener des négociations collectives; \n\t\t - n'empêche pas les travailleurs de chercher à constituer leurs propres organisations ou à y adhérer et à mener des négociations collectives, par exemple en les licenciant ou en faisant de la discrimination à leur égard, en prenant des mesures de rétorsion ou en exerçant une menace directe ou indirecte risquant de créer une atmosphère d'intimidation ou de crainte;\n\t\t - informe dans des délais raisonnables les pouvoirs publics concernés et les représentants des travailleurs, en cas de changements d'activités risquant d'avoir des conséquences importantes sur l'emploi, afin qu'ils puissent en étudier ensemble les implications de façon à en atténuer le plus possible tout impact négatif; \n\t\t - assure, dans toute la mesure du possible et de manière raisonnable et non perturbatrice, aux représentants des travailleurs dûment désignés un contact avec les décideurs habilités, l'accès aux postes de travail et à ceux qu'ils représentent ainsi qu'aux locaux nécessaires pour leur permettre de jouer leur rôle et aux informations qui leur permettront d'avoir une image juste et équitable des finances et des activités de l'organisation; et \n\t\t - s'abstienne d'encourager les gouvernements à restreindre l'exercice des droits de libre association et de négociation collective reconnus à l'échelle internationale. Par exemple, il convient que les organisations évitent d'implanter une filiale ou de s'approvisionner auprès d'entreprises établies dans des zones industrielles spécialisées où la liberté d'association est restreinte, voire inexistante, même si la réglementation nationale reconnaît ce droit; il convient qu'elles s'abstiennent de participer à des programmes incitatifs basés sur de telles restrictions.\n\nDes organisations peuvent également envisager de coopérer, s'il y a lieu, avec les organisations patronales en vue de créer des opportunités de dialogue social et d'élargir leur représentation de la responsabilité sociétale par ces canaux. "
    6_prefix: "6.4.6"
    6_label: "Relations et conditions de travail - Domaine d'action 4: Santé et sécurité au travail"
    6_desc: "Le domaine de la santé et de la sécurité au travail concerne la promotion et le maintien du degré le plus élevé de bien-être physique, mental et social des travailleurs ainsi que la prévention d'effets négatifs sur la santé liés aux conditions de travail. Il porte également sur la protection des travailleurs contre les risques pour la santé et sur l'adaptation de l'environnement de travail aux besoins physiologiques et psychologiques des travailleurs.\nL'impact financier et social des maladies, blessures et décès d'origine professionnelle est élevé pour la société. La pollution accidentelle et chronique et autres risques professionnels préjudiciables aux travailleurs peuvent également avoir des effets sur les communautés et sur l'environnement. (Voir 6.5 pour plus d'informations sur les risques pour l'environnement). Les questions de santé et de sécurité se posent du fait de dangers que font courir équipements, processus, pratiques et substances (chimiques, physiques et biologiques).\n\n\nIl convient qu'une organisation : \n\t\t - élabore, mette en oeuvre et conserve une politique de santé et de sécurité au travail reposant sur le principe selon lequel l'application de normes strictes en matière de sécurité et de santé, d'une part, et les performances de l'organisation, d'autre part, sont deux éléments qui se soutiennent et se renforcent mutuellement. \n\t\t - comprenne et applique les principes de management de la santé et de la sécurité, y compris la hiérarchie des protections, à savoir: élimination, substitution, solutions techniques, contrôles administratifs, organisation du travail et équipement de protection individuelle; \n\t\t - analyse et maîtrise les risques engendrés par ses activités pour la santé et la sécurité;\n\t\t - formule l'exigence selon laquelle il convient que les travailleurs prennent en permanence toutes les précautions d'usage et s'assure que ces travailleurs suivent les bonnes procédures; \n\t\t - fournisse les équipements de sécurité, y compris les équipements de protection individuelle, requis pour empêcher les blessures et maladies professionnelles ainsi que les accidents de travail et pour traiter les urgences; \n\t\t - enregistre et étudie tous les incidents et problèmes de santé et de sécurité afin de les réduire le plus possible ou de les éliminer; \n\t\t - traite la spécificité des risques pour la santé et la sécurité au travail (SST) selon qu'il s'agit de femmes (notamment les femmes enceintes, celles qui viennent d'accoucher ou qui allaitent), d'hommes ou de certains cas particuliers (travailleurs souffrant d'un handicap, travailleurs inexpérimentés ou les très jeunes travailleurs); \n\t\t - assure une protection identique en matière de santé et de sécurité aux travailleurs à temps partiel et aux travailleurs temporaires ainsi qu'aux sous-traitants; \n\t\t - s'efforce d'éliminer les risques psychosociaux sur les lieux de travail, risques qui favorisent le stress et les maladies ou les provoquent; \n\t\t - assure à l'ensemble du personnel une formation adaptée sur toutes les questions pertinentes; \n\t\t - respecte le principe qui veut que les mesures de santé et de sécurité prises sur les lieux de travail n'entraînent pas de dépenses pour les travailleurs; et\n\t\t - base ses systèmes de santé, sécurité et environnement sur la participation des travailleurs concernés (voir Encadré) et reconnaisse et respecte les droits des travailleurs:\n\t\t\t\t - à recevoir des informations pertinentes, complètes et précises concernant les risques pour la santé et la sécurité et les bonnes pratiques mises en oeuvre pour faire face à ces risques;\n\t\t\t\t - à se documenter librement sur tous les aspects de leur santé et de leur sécurité ayant un rapport avec leur travail et à être consultés en la matière; \n\t\t\t\t - à refuser un travail qui est raisonnablement considéré comme présentant un péril imminent ou grave pour leur vie ou leur santé ou la vie et la santé des autres;\n\t\t\t\t - à demander conseil à l'extérieur à des organisations de travailleurs, d'employeurs et autres qui ont les compétences requises;\n\t\t\t\t - à rendre compte aux autorités compétentes de questions de santé et de sécurité;\n\t\t\t\t - à participer aux décisions et activités en matière de santé et de sécurité, y compris l'étude des incidents et accidents; et\n\t\t\t\t - à ne pas craindre de menaces de mesures de rétorsion pour avoir fait cela\n\n ℹ️Encadré : Comités mixtes salariés/direction pour la santé et la sécurité :\nUn programme efficace en matière de santé et de sécurité au travail dépend de l'implication des travailleurs.  Les comités mixtes travailleurs/direction pour la santé et la sécurité peuvent constituer la partie la plus importante du programme de l'organisation en matière de santé et de sécurité. Les comités mixtes peuvent:\n\t\t - réunir des informations; \n\t\t - élaborer et diffuser des manuels de sécurité et des programmes de formation;\n\t\t - rendre compte, enregistrer les accidents et effectuer les enquêtes sur ces accidents; et\n\t\t - étudier les problèmes soulevés par les travailleurs ou la Direction et y apporter une réponse.\nIl convient que les représentants des travailleurs dans ces comités ne soient pas nommés par la Direction mais élus par les travailleurs eux-mêmes. Il convient que les membres de ces comités soient en nombre égal des représentants de la Direction et des représentants des travailleurs et qu'il y ait, si possible, des hommes et des femmes. Il convient que ces comités soient suffisamment importants pour permettre de représenter l'ensemble des équipes, sections et sites de l'organisation. Il convient de ne pas les considérer comme un succédané des comités d'entreprise ou des organisations de travailleurs."
    7_prefix: "6.4.7"
    7_label: "Relations et conditions de travail - Domaine d'action 5: Développement du capital humain"
    7_desc: "Le développement du capital humain englobe le processus qui consiste à élargir les choix des personnes en développant leurs capacités, permettant ainsi aux femmes et aux hommes d'avoir une vie longue et saine, d'être bien informés et d'avoir un niveau de vie décent. Les opportunités politiques, économiques et sociales permettant d'être créatif et productif et de jouir du respect de soi-même et du sentiment d'appartenir à une communauté et d'apporter sa contribution à la société font également partie du développement du capital humain.\nPour favoriser le développement du capital humain, les organisations peuvent mettre en oeuvre une politique et des initiatives sur les lieux de travail en traitant des questions sociales importantes telles que la lutte contre la discrimination, l'équilibre entre vie familiale et responsabilités professionnelles, la promotion de la santé et du bien-être et la diversification de leur personnel. Ils peuvent également mettre à profit la politique et les initiatives sur le lieu de travail pour améliorer les capacités et l'employabilité des personnes. L'employabilité concerne l'expérience, les compétences et les qualifications qui augmentent les capacités d'une personne à obtenir et à conserver un travail décent.\n\n\nIl convient qu'une organisation : \n\t\t - donne à tous les travailleurs et à tous les stades de l'expérience professionnelle accès au développement des compétences, à la formation et à l'apprentissage et leur offre des opportunités d'avancement, sur une base d'égalité et de non-discrimination;\n\t\t - s'assure que, si nécessaire, les travailleurs exposés à un licenciement bénéficient d'une assistance en vue d'une reconversion et aient accès à une formation et à des prestations de conseil;\n\t\t - établisse des programmes mixtes salariés/direction pour la promotion de la santé et du bien-être."
  5:
    title: "L'environnement"
    1_prefix: "6.5.1.1"
    1_label: "Vue d'ensemble - Organisations et environnement"
    1_desc: "Les décisions et les activités des organisations ont immanquablement un impact sur l'environnement, quel que soit le site d'implantation de ces organisations. Ces impacts peuvent être liés à l'utilisation de ressources par l'organisation, à l'emplacement des activités de l'organisation, à la production de pollution et de déchets et aux impacts de ses activités sur les habitats naturels. Pour réduire leurs impacts sur l'environnement, il convient que les organisations adoptent une approche intégrée qui prend en compte les implications directes et indirectes de leurs décisions et de leurs activités d'un point de vue économique, social, sanitaire et environnemental."
    2_prefix: "6.5.1.2"
    2_label: "Vue d'ensemble - L'environnement et la responsabilité sociétale"
    2_desc: "La société est confrontée à de multiples défis environnementaux, y compris l'appauvrissement des ressources naturelles, la pollution, les changements climatiques, la destruction d'habitats, la disparition d'espèces et d'écosystèmes, ainsi que la dégradation des lieux d'implantation humains urbains et ruraux. Au fur et à mesure de l'accroissement de la population et de l'augmentation de la consommation, ces changements deviennent de plus en plus une menace pour la sécurité de l'Homme ainsi que pour la santé et le bien-être de la société. Il est nécessaire d'identifier des options permettant de réduire et d'éliminer les volumes et modes de production et de consommation non viables et de s'assurer que la consommation des ressources par personne devient durable. Tant au niveau local que mondial, les questions environnementales sont étroitement imbriquées. Les traiter nécessite une approche globale, systématique et collective.\nLa responsabilité environnementale est un préalable à la survie et à la prospérité des êtres humains. C'est donc un aspect important de la responsabilité sociétale. Les questions environnementales sont étroitement liées aux autres questions centrales et domaines d'action de la responsabilité sociétale. L'éducation en matière d'environnement et le renforcement des capacités sont fondamentaux pour promouvoir le développement de sociétés et de styles de vie durables.\nLes outils techniques pertinents, tels que les normes de la série des ISO 14000, peuvent servir de cadre général à l'organisation pour aborder de manière systématique les questions touchant à l'environnement; il convient de les prendre en compte pour l'évaluation des performances environnementales, la quantification des émissions de gaz à effet de serre et l'élaboration de rapports en la matière, l'évaluation du cycle de vie, l'éco-conception, l'étiquetage environnemental et la communication sur les questions environnementales."
    3_prefix: "6.5.2.1"
    3_label: "Principes et considérations - Principes"
    3_desc: "Il convient qu'une organisation respecte et promeuve les principes environnementaux suivants: \n\t\t - responsabilité environnementale: Il convient qu'une organisation non seulement respecte la législation et la réglementation mais aussi qu'elle assume la responsabilité de l'impact de ses activités sur l'environnement dans les zones rurales et urbaines et sur l'environnement au sens plus large. Compte tenu des limites écologiques, il convient qu'elle agisse pour améliorer ses propres performances ainsi que les performances des autres dans sa sphère d'influence.\n\t\t - principe de précaution: Extrait de la Déclaration de Rio sur l'environnement et le développement et des déclarations et conventions ultérieures qui mettent en avant le concept selon lequel, en cas de risque de dommages graves ou irréversibles pour l'environnement ou la santé humaine, il convient que l'absence de certitude scientifique absolue ne serve pas de prétexte pour remettre à plus tard l'adoption de mesures d'un coût économiquement acceptable visant à prévenir la dégradation de l'environnement ou un dommage pour la santé humaine. Pour évaluer le rapport coût-efficacité d'une mesure, il convient qu'une organisation considère - outre les coûts à court terme - les coûts à long terme et les avantages liés à cette mesure;\n\t\t - gestion du risque pour l'environnement: Il convient qu'une organisation applique des programmes dans une perspective de prise en compte du risque et de développement durable pour évaluer, éviter, limiter et atténuer les risques et impacts pour l'environnement liés à ses activités. Il convient qu'une organisation développe et mette en oeuvre des activités de sensibilisation ainsi que des procédures de réponse aux situations d'urgence afin de limiter et d'atténuer les impacts d'accidents sur l'environnement, la santé et la sécurité et transmette des informations concernant les incidents environnementaux aux autorités et communautés locales concernées; et\n\t\tprincipe pollueur-payeur: Il convient qu'une organisation supporte le coût de la pollution occasionnée par ses activités en fonction soit de l'impact environnemental pour la société et de l'action corrective requise soit du niveau de pollution (Principe 16 de la Déclaration de Rio [158]). Il convient qu'une organisation s'efforce de supporter le coût de la pollution et de quantifier les avantages économiques et environnementaux de la prévention de la pollution plutôt que de l'atténuation de ses impacts selon le principe pollueur-payeur. Une organisation peut choisir de coopérer avec d'autres pour développer des instruments économiques tels que les fonds de garantie afin de pouvoir faire face aux coûts engendrés par des incidents environnementaux majeurs."
    4_prefix: "6.5.2.2"
    4_label: "Principes et considérations - Considérations"
    4_desc: "Dans le cadre de ses activités de management environnemental, il convient qu'une organisation évalue la pertinence des approches et stratégies suivantes, et les applique, s'il y a lieu:\n\t\t - approche cycle de vie: L'approche cycle de vie vise principalement à réduire les impacts environnementaux des produits et services et à améliorer leurs performances socio-économiques pendant toute la durée de leur cycle de vie, depuis l'extraction de matières premières et la production d'énergie jusqu'à la mise au rebut ou à la récupération en fin de vie, en passant par la fabrication et l'utilisation. Il convient qu'une organisation se concentre sur les innovations, et non sur le seul respect de la loi, et oeuvre à l'amélioration continue de ses performances environnementales;\n\t\t - évaluation des impacts sur l'environnement: Il convient qu'une organisation évalue les impacts sur l'environnement avant de démarrer une nouvelle activité ou un nouveau projet et exploite les résultats de cette évaluation dans le cadre du processus de prise de décision;\n\t\t - production plus propre et éco-efficience: Il s'agit de stratégies destinées à répondre aux besoins de l'Homme en utilisant les ressources de manière plus efficace et en engendrant moins de pollution et de déchets. Un point important consiste à apporter des améliorations à la source plutôt qu'à la fin d'un processus ou d'une activité. Une approche de production plus propre, plus sûre et axée sur l'écoefficience englobe les éléments suivants: amélioration des pratiques de maintenance; introduction de nouvelles technologies ou de nouveaux processus; réduction de la consommation de matières premières et d'énergie; utilisation d'énergies renouvelables; rationalisation de l'utilisation de l'eau; élimination ou gestion en toute sécurité des matières et déchets toxiques et dangereux; et amélioration de la conception des produits et services;\n\t\t - approche système produits-services: Elle peut permettre de ne pas se focaliser sur les interactions commerciales de la vente ou de la fourniture de produits (à savoir, le transfert de la propriété par la vente ponctuelle ou la location avec option d'achat) mais sur la vente ou la fourniture d'un système de produits et de services qui, ensemble, répondent aux besoins des clients (sous la forme de divers mécanismes de services et d'approvisionnement). Les systèmes produits-services englobent la location avec option d'achat, la location ou le partage et la mise en commun de produits ainsi que le «paiement au service». Ces systèmes peuvent réduire l'utilisation de matières premières, décupler les revenus de l'écoulement des produits et impliquer les parties prenantes en promouvant un élargissement de la responsabilité du fabricant tout au long du cycle de vie du produit et des services d'accompagnement.\n\t\t - mise en oeuvre de techniques et de pratiques saines du point de vue environnemental: Il convient qu'une organisation cherche à adopter et, le cas échéant, à promouvoir la mise au point et la diffusion de techniques et de services sains du point de vue environnemental (Principe 9 de la Déclaration de Rio [158]); \n\t\t - achats responsables: Lors de ses décisions d'achat, il convient qu'une organisation tienne compte des performances environnementales, sociales et éthiques des produits ou services acquis, tout au long de leur cycle de vie. Si possible, il convient qu'elle privilégie les produits et services qui limitent le plus possible les impacts, en se référant à des programmes d'étiquetage fiables et efficaces, vérifiés de manière indépendante, ou à d'autres programmes de vérification, tels que l'écolabel ou les activités d'audit; et \n\t\t - apprentissage et sensibilisation: Il convient qu'une organisation fasse oeuvre de sensibilisation et promeuve un apprentissage approprié afin de soutenir les efforts en matière d'environnement au sein de l'organisation et de sa sphère d'influence."
    5_prefix: "6.5.3"
    5_label: "Environnement  Domaine d'action 1: Prévention de la pollution"
    5_desc: "Une organisation peut améliorer ses performances environnementales en empêchant une pollution, y compris:\n\t\t - émissions dans l'air: De par ses émissions dans l'air de polluants tels que le plomb, le mercure, les composés organiques volatils (COV), les oxydes de soufre (SOx), les oxydes d'azote (NOx), les dioxines, les particules et autres substances appauvrissant la couche d'ozone, une organisation peut avoir sur l'environnement et la santé des impacts qui peuvent toucher différemment les personnes. Ces émissions peuvent venir directement des installations et des activités d'une organisation ou être indirectement provoquées par l'emploi ou la manipulation en fin de vie de ses produits et services ou encore par la production de l'énergie qu'elle consomme.\n\t\t - rejets dans l'eau: Une organisation peut être à l'origine de la pollution de l'eau par des rejets directs, délibérés ou accidentels dans les eaux de surface, y compris l'environnement marin, par un ruissellement involontaire dans les eaux de surface ou encore par des infiltrations dans les eaux souterraines. Ces déversements peuvent venir directement des installations de l'organisation ou être provoqués indirectement par l'utilisation de ses produits et services.\n\t\t - gestion des déchets: Les activités d'une organisation peuvent engendrer une production de déchets liquides ou solides qui, mal gérés, peuvent provoquer une contamination de l'air, de l'eau, de la terre, des sols et de l'espace extérieur. Une gestion responsable des déchets cherche à éviter de produire des déchets. Elle respecte la hiérarchie de réduction des déchets suivante: réduction à la source, réutilisation, recyclage et retraitement, traitement et mise au rebut des déchets. Il convient d'appliquer la hiérarchie de réduction des déchets avec souplesse, selon l'approche cycle de vie. Il y a lieu de gérer les déchets dangereux, notamment les déchets radioactifs, de manière appropriée et transparente;\n\t\t - utilisation et mise au rebut de produits chimiques toxiques et dangereux: L'utilisation ou la production par une organisation de produits chimiques toxiques et dangereux (tant naturels que synthétiques) peut avoir des effets négatifs sur les écosystèmes et la santé humaine en ayant des répercussions aiguës (immédiates) ou chroniques (à long terme) dues aux émissions ou libérations. Cela peut toucher différemment les personnes, selon l'âge et le sexe; et \n\t\t - autres formes identifiables de pollution: Les activités, produits et services d'une organisation peuvent provoquer d'autres formes de pollution qui ont une incidence négative sur la santé et le bien-être des communautés et peuvent toucher différemment les personnes. Cela englobe le bruit, les odeurs, les impressions visuelles, la pollution lumineuse, les vibrations, les émissions électromagnétiques, les radiations, les agents infectieux (par exemple, d'origine virale ou bactérienne), les émissions de sources diffuses ou dispersées et les risques biologiques (les espèces invasives, par exemple).\n\n\nPour améliorer la prévention de la pollution résultant de ses activités, il convient qu'une organisation:\n\t\t - identifie les aspects et les impacts de ses décisions et de ses activités sur l'environnement; \n\t\t - identifie les sources de pollution et de déchets liées à ses activités;\n\t\t - mesure, enregistre et consigne dans un rapport ses sources significatives de pollution et la réduction de la pollution, la consommation d'eau, la production de déchets et la consommation d'énergie;\n\t\t - prenne des mesures visant à prévenir la pollution et les déchets, en mettant à profit la hiérarchie de gestion des déchets et en garantissant une gestion appropriée de la pollution et des déchets inévitables\n\t\t - dialogue avec les communautés locales concernant les émissions et déchets polluants, réels ou potentiels, les risques engendrés pour la santé et les mesures d'atténuation des effets prises ou proposées;\n\t\t - mette en oeuvre des mesures visant à réduire progressivement et le plus possible la pollution directe ou indirecte des activités qu'elle contrôle ou sur lesquelles elle exerce une influence, en particulier grâce au développement et à la promotion de produits et de services plus écologiques; \n\t\t - dévoile publiquement les quantités et les types de matières toxiques et dangereuses significatives utilisées et libérées, y compris les risques connus que font courir ces matières pour la santé humaine et l'environnement, dans le cadre d'activités normales ou de libérations accidentelles; \n\t\t - identifie systématiquement et évite l'utilisation:\n\t\t\t\t - de produits chimiques interdits, définis dans la législation nationale, ou de produits chimiques indésirables, mentionnés dans les conventions internationales; et \n\t\t\t\t - si possible, de produits chimiques identifiés comme inquiétants par les organismes scientifiques ou toute autre partie prenante, sur des motifs raisonnables et vérifiables. Il convient également qu'une organisation cherche à empêcher l'utilisation de ces produits chimiques par des organisations exerçant dans sa sphère d'influence. Ces produits chimiques comprennent, sans toutefois s'y limiter: les substances appauvrissant la couche d'ozone, les polluants organiques persistants (POP) et les produits chimiques relevant de la Convention de Rotterdam, les produits chimiques et pesticides dangereux (selon la définition de l'Organisation Mondiale de la Santé), les produits chimiques définis comme cancérigènes (y compris l'exposition à la fumée des produits du tabac) ou mutagènes, ainsi que les produits chimiques qui ont une incidence sur la reproduction, constituent des perturbateurs endocriniens ou sont persistants, bio-accumulatifs et toxiques (PBT) ou très persistants et très bio-accumulatifs.\n\t\t- mette en oeuvre un programme de prévention des accidents environnementaux et prépare un plan d'urgence couvrant les accidents et incidents se produisant tant sur site que hors site et impliquant les travailleurs, partenaires, autorités, communautés locales et autres parties prenantes concernées. Il convient qu'un tel programme comporte, entre autres, l'identification des dangers et l'évaluation des risques, les procédures de notification et les procédures de rappel, les systèmes de communication ainsi que l'éducation et l'information du public."
    6_prefix: "6.5.4.1"
    6_label: "Environnement  Domaine d'action 2: Utilisation durable des ressources - Description du domaine d'action"
    6_desc: "Pour pérenniser la disponibilité des ressources à l'avenir, il est nécessaire de modifier les schémas et volumes actuels de la consommation et de la production afin qu'ils s'inscrivent dans le cadre des capacités d'accueil de la Terre. L'utilisation durable de ressources renouvelables signifie un taux d'utilisation inférieur ou égal à celui de leur reconstitution naturelle. Dans le cas de ressources non renouvelables (telles que les combustibles fossiles, métaux et minéraux), la prise en compte du développement durable à long terme nécessite un taux d'utilisation inférieur au taux de remplacement possible par une ressource renouvelable. Une organisation peut progresser dans le sens d'un emploi durable des ressources en utilisant l'électricité, les combustibles, les matières premières et retraitées ainsi que les sols et l'eau de manière plus responsable et en combinant ressources non renouvelables et ressources renouvelables ou en remplaçant les premières par des ressources renouvelables durables, en utilisant, par exemple, des technologies innovantes. Les quatre domaines-clés d'amélioration de l'utilisation des ressources sont les suivants: \n\t\t- efficacité énergétique: Il convient qu'une organisation mette en uvre des programmes d'efficacité énergétique afin de réduire la demande d'énergie pour les bâtiments, les transports, les processus de production, les appareils et autres équipements électroniques, pour les prestations de services ou à d'autres fins. Il convient également que l'amélioration de l'efficacité en matière d'utilisation de l'énergie complète les efforts faits pour parvenir à un emploi durable des ressources renouvelables telles que l'énergie solaire, l'énergie géothermique, l'hydroélectricité, l'énergie marémotrice et houlomotrice, l'énergie éolienne et la biomasse; \n\t\t- conservation de l'eau, utilisation de l'eau et accès à l'eau: L'accès à un approvisionnement sûr et fiable en eau potable ainsi que la mise en place de services d'assainissement, est un besoin fondamental de l'Homme et un droit de l'Homme fondamental. Les objectifs du Millénaire pour le développement (voir Encadré 13) comportent un accès durable à de l'eau potable sûre. Il convient qu'une organisation assure la conservation de l'eau, en réduise la consommation et en organise la réutilisation dans le cadre de ses propres activités, et qu'elle stimule la conservation de l'eau dans sa sphère d'influence;\n\t\t- efficacité dans l'utilisation des matières premières: Il convient qu'une organisation mette en uvre des programmes d'optimisation de l'utilisation des matières premières afin de réduire l'impact sur l'environnement dû à l'utilisation des matières premières pour les processus de production ou les produits finis utilisés dans le cadre de ses activités ou lors de ses prestations de services. Les programmes d'optimisation de l'utilisation des matières premières reposent sur l'identification de moyens d'accroître l'efficacité de l'utilisation des matières premières dans la sphère d'influence de l'organisation. L'emploi de matières est à l'origine de nombreux impacts directs et indirects sur l'environnement associés, par exemple, à l'impact sur les écosystèmes des recherches minières et forestières ainsi qu'aux émissions résultant de l'utilisation, du transport et du traitement de ces matières; et\n\t\t- réduction des besoins en ressources pour un produit: Il convient de considérer les besoins en ressources du produit fini lors de son utilisation."
    7_prefix: "6.5.4.2"
    7_label: "Environnement  Domaine d'action 2: Utilisation durable des ressources - Actions et attentes associées"
    7_desc: "En liaison avec l'ensemble de ses activités, il convient qu'une organisation: \n\t\t- identifie les sources d'énergie, d'eau et autres ressources utilisées;\n\t\t- mesure, enregistre et consigne dans un rapport ses utilisations importantes d'énergie, d'eau et autres ressources; \n\t\t- mette en oeuvre des mesures d'économie des ressources destinées à réduire son utilisation d'énergie, d'eau et autres ressources en prenant en compte les indicateurs de bonnes pratiques et autres références;\n\t\t- complète ou remplace, si possible, les ressources non renouvelables par d'autres sources renouvelables durables et à faible impact sur l'environnement; \n\t\t- utilise des matières recyclées et réutilise l'eau, dans toute la mesure du possible;\n\t\t- gère les ressources en eau afin de garantir un accès à tous les utilisateurs dans les limites de son bassin hydrographique;\n\t\t- promeuve une politique d'achat durable;\n\t\t- envisage un élargissement de la responsabilité du fabricant; et\n\t\t- promeuve une consommation durable."
    8_prefix: "6.5.5.2.1"
    8_label: "Environnement  Domaine d'action 3: Atténuation des changements climatiques et adaptation - Actions et attentes associées - Atténuation des changements climatiques"
    8_desc: "Pour atténuer les effets des changements climatiques liés à ses activités, il convient qu'une organisation:\n\t\t- identifie les sources d'émissions directes et indirectes de gaz à effet de serre (GES) accumulées et définisse les limites (le domaine) de sa responsabilité;\n\t\t- mesure, enregistre et consigne dans un rapport ses émissions importantes de GES en appliquant, de préférence, des méthodes bien définies dans des normes ayant fait l'objet d'un consensus international (voir aussi des exemples d'initiatives et d'outils relatifs aux émissions de gaz à effet à l'Annexe A); \n\t\t- mette en oeuvre des mesures optimisées de réduction progressive des émissions directes et indirectes de gaz à effet de serre (GES) sous son contrôle et encourage des actions similaires dans sa sphère d'influence;\n\t\t- réexamine la quantité et le type d'utilisation de combustibles au sein de l'organisation et mette en oeuvre des programmes d'amélioration de l'efficience et de l'efficacité d'utilisation des ressources. Il convient d'engager une approche cycle de vie afin d'obtenir une réduction nette des émissions de gaz à effet de serre, même dans le contexte de technologies à faible taux d'émission et d'énergies renouvelables;\n\t\t- empêche ou réduise le rejet d'émissions de GES (notamment celles provoquant aussi un appauvrissement de la couche d'ozone) dues à l'utilisation des sols et au changement d'utilisation des sols, à des processus ou à des équipements, y compris les installations de chauffage, ventilation et conditionnement d'air, etc.;\n\t\t- réalise, si possible, des économies d'énergie au sein de l'organisation, en privilégiant l'efficacité énergétique des biens achetés et  des produits et services développés; et\n\t\t- envisage d'assurer une neutralité carbone en mettant en oeuvre des mesures destinées à compenser les émissions de GES restantes, soit par exemple par captation de carbone, soit en soutenant des programmes de réduction des émissions."
    9_prefix: "6.5.5.2.2"
    9_label: "Environnement  Domaine d'action 3: Atténuation des changements climatiques et adaptation - Actions et attentes associées - Adaptation aux changements climatiques"
    9_desc: "Pour réduire la vulnérabilité aux changements climatiques, il convient qu'une organisation:\n\t\t- prenne en compte les prévisions climatiques, au niveau mondial et local, afin d'identifier les risques et d'intégrer l'adaptation aux changements climatiques dans sa prise de décision;\n\t\t- identifie les opportunités d'éviter ou de limiter le plus possible les dommages associés aux changements climatiques et exploite, si possible, les possibilités offertes de s'adapter aux changements de conditions (voir Encadré 10); et \n\t\t- mette en oeuvre des mesures pour faire face aux impacts existants ou anticipés et, dans sa sphère d'influence, contribue au renforcement des capacités d'adaptation des parties prenantes."
    10_prefix: "6.5.6"
    10_label: "Environnement  Domaine d'action 4: Protection de l'environnement, biodiversité et réhabilitation des habitats naturels"
    10_desc: "Depuis les années 1960, l'activité de l'Homme a modifié les écosystèmes plus rapidement et plus profondément que durant toute période comparable de l'Histoire. La demande toujours plus grande en ressources naturelles a entraîné une perte considérable et souvent irréversible de l'habitat et de la diversité de la vie sur la Terre. De vastes zones (tant urbaines que rurales) ont été transformées par l'action de l'Homme.\nUne organisation peut devenir plus responsable en agissant en faveur de la protection de l'environnement et de la réhabilitation des habitats naturels et des diverses fonctions et services qu'assurent les écosystèmes (nourriture et eau, régulation du climat, formation des sols et loisirs, par exemple). Font partie des aspects clés de cette question:\n\t\t- valoriser et protéger la biodiversité: La biodiversité est la diversité de la vie sous toutes ses formes, à tous les niveaux et dans toutes les combinaisons; elle comprend la diversité au sein des espèces et entre espèces ainsi que celles des écosystèmes. La protection de la biodiversité vise à assurer la survie d'espèces terrestres et aquatiques, la diversité génétique et les écosystèmes naturels\n\t\t- valoriser, protéger et réhabiliter les services assurés par les écosystèmes: Les écosystèmes contribuent au bien-être de la société en assurant des services tels que l'approvisionnement en nourriture, en eau, en combustible, la lutte contre les inondations, la pollinisation, les fibres naturelles, les loisirs et l'absorption de la pollution et des déchets. Les écosystèmes étant dégradés ou détruits, ils perdent leur aptitude à assurer ces services; \n\t\t- utiliser les sols et les ressources naturelles de manière durable: Les projets d'utilisation des sols d'une organisation peuvent protéger ou dégrader l'habitat, l'eau, les sols et les écosystèmes ; et\n\t\t- aller dans le sens d'un développement urbain et rural sain d'un point de vue environnemental: Les décisions et les activités des organisations peuvent avoir un impact important sur l'environnement urbain ou rural et ses écosystèmes. Cet impact peut être associé, par exemple, à l'urbanisme, aux bâtiments et à la construction, aux systèmes de transport, à la gestion des déchets et des eaux usées et aux techniques agricoles.\n\n\nActions et attentes associées:\nEn liaison avec l'ensemble de ses activités, il convient qu'une organisation:\n\t\t- identifie les impacts négatifs potentiels sur la biodiversité et sur les services assurés par les écosystèmes et prenne des mesures pour éliminer ou réduire le plus possible ces impacts;\n\t\t- si cela s'avère réalisable et approprié, participe aux mécanismes du marché afin d'internaliser les coûts de ses impacts sur l'environnement et de valoriser économiquement la protection des services assurés par les écosystèmes;\n\t\t- s'efforce, en premier lieu, d'éviter la perte d'écosystèmes naturels, puis d'en réhabiliter et enfin, si ces deux actions ne sont pas possibles ou pas parfaitement efficaces, de compenser les pertes par des actions qui aboutiront à un gain net de services assurés par les écosystèmes avec le temps;\n\t\t- \n\t\t- établisse et mette en oeuvre une stratégie intégrée de la gestion des sols, de l'eau et des écosystèmes qui promeuve la conservation et l'utilisation durable d'une manière équitable;\n\t\t- prenne des mesures pour préserver toutes espèces endémiques, menacées ou en voie de disparition, ou les habitats susceptibles d'être affectés;\n\t\t- adopte des pratiques en matière de planification, conception et exploitation permettant de réduire le plus possible les éventuels impacts sur l'environnement de ses décisions touchant l'utilisation des sols, y compris les décisions liées au développement agricole et urbain;\n\t\t- intègre la protection de l'habitat naturel, des terrains marécageux, forêts, couloirs de vie sauvage, zones protégées et sols agricoles dans le développement des bâtiments et travaux de construction ;\n\t\t- adopte des pratiques durables en matière d'agriculture, de pêche et d'exploitation forestière, y compris les aspects liés à la protection des animaux, par exemple, selon les définitions des normes de référence et des programmes de certification ;\n\t\t- utilise progressivement une proportion plus importante de produits dont les fournisseurs utilisent des technologies et processus plus durables;\n\t\t- prenne en compte le fait que les animaux sauvages et leurs habitats font partie de nos écosystèmes naturels et qu'il convient donc de les valoriser, de les protéger et de respecter leur bien-être; et\n\t\t- évite des approches menaçant la survie ou entraînant une extinction mondiale, régionale ou locale d'espèces ou bien permettant l'expansion ou la prolifération d'espèces envahissantes."
  6:
    title: "Loyauté des pratiques"
    1_prefix: "6.6.1.1"
    1_label: "Vue d'ensemble - Organisations et loyauté des pratiques"
    1_desc: "La loyauté des pratiques concerne la conduite éthique des transactions entre une organisation et d'autres organisations. Elle englobe les relations entre les organisations et des organismes publics ainsi qu'entre des organisations et leurs partenaires, fournisseurs, sous-traitants, clients, concurrents et les associations dont elles sont membres.\nDes domaines d'action touchant la loyauté des pratiques se font jour en matière de lutte contre la corruption, d'implication responsable dans le domaine public, de concurrence loyale, de comportement responsable, de relations avec d'autres organisations et de respect des droits de propriété."
    2_prefix: "6.6.1.2"
    2_label: "Vue d'ensemble - Loyauté des pratiques et responsabilité sociétale"
    2_desc: "Dans le domaine de la responsabilité sociétale, la loyauté des pratiques porte sur la façon dont une organisation utilise ses relations avec d'autres organisations afin de favoriser l'obtention de résultats positifs. Des résultats positifs peuvent être obtenus en assurant une position d'exemplarité et en encourageant une adoption plus large de la responsabilité sociétale dans toute la sphère d'influence de l'organisation."
    3_prefix: "6.6.2"
    3_label: "Principe et considérations"
    3_desc: "Un comportement éthique est fondamental pour établir et maintenir des relations légitimes et productives entre les organisations. Le respect, la promotion et l'encouragement des normes de comportement éthique sous-tendent donc toute la loyauté des pratiques. Empêcher la corruption et mettre en pratique une implication politique responsable dépendent du respect de la Loi, de l adhésion aux normes déthique, de la redevabilité et de la transparence. Il ne peut y avoir de concurrence loyale et de respect des droits de propriété si les organisations ne traitent pas les unes avec les autres de façon honnête, équitable et intègre."
    4_prefix: "6.6.3"
    4_label: "Loyauté des pratiques  Domaine d'action 1: Lutte contre la corruption"
    4_desc: "La corruption est un abus du pouvoir confié en vue d'en retirer un avantage personnel. La corruption peut prendre de nombreuses formes. La corruption active (sollicitation, offre ou acceptation d'un pot-de-vin, en espèce ou en nature) impliquant des organisations publiques ou des personnes du secteur privé, les conflits d'intérêts, la fraude, le blanchiment d'argent sale, le détournement de biens, le recel, l'entrave à la justice et le trafic d'influence sont des exemples de corruption.\nLa corruption mine l'efficacité et la réputation d'une organisation et peut la rendre passible de poursuites pénales ainsi que de sanctions civiles et administratives. La corruption peut aboutir à la violation des droits de l'Homme, à l'érosion des processus politiques, à l'appauvrissement des sociétés et à la détérioration de l'environnement. Elle peut aussi fausser le jeu de la concurrence, la répartition des richesses et la croissance économique.\n\n\nPour prévenir la corruption, il convient qu'une organisation:\n\t\t- identifie les risques de corruption, mette en uvre et maintienne une politique et des pratiques qui luttent contre la corruption et l'extorsion;\n\t\t- garantisse que son leadership constitue un exemple de lutte contre la corruption et assure engagement, encouragement et supervision de la mise en oeuvre des politiques de lutte contre la corruption;\n\t\t- aide et forme ses employés et ses représentants dans leurs efforts pour éradiquer toute forme de corruption et prévoie des incitations à progresser;\n\t\t- sensibilise ses employés, représentants, sous-traitants et fournisseurs en matière de corruption et sur la façon de lutter contre elle;\n\t\t- confirme que la rémunération de ses employés et représentants est appropriée et est uniquement destinée à des prestations de services légitimes;\n\t\t- établisse et conserve un système efficace de lutte contre la corruption;\n\t\t- encourage ses employés, partenaires, représentants et fournisseurs à rendre compte des violations de la politique de l'organisation et de tout traitement ayant un aspect non éthique et déloyal, en adoptant des mécanismes permettant de rendre compte et d'assurer un suivi sans crainte de mesures de rétorsion;\n\t\t- attire l'attention des autorités compétentes en matière d'application des lois sur les violations du droit pénal; et \n\t\t- agisse pour s'opposer à la corruption en encourageant ceux avec lesquels elle est en relation pour qu'ils adoptent également des pratiques de lutte contre la corruption."
    5_prefix: "6.6.4"
    5_label: "Loyauté des pratiques  Domaine d'action 2: Engagement politique responsable"
    5_desc: "Description du domaine d'action:\nLes organisations peuvent appuyer les processus politiques publics et encourager le développement de politiques publiques bénéfiques pour la société au sens large. Il convient que les organisations interdisent l'abus d'autorité et évitent des comportements tels que manipulation, intimidation et coercition, qui peuvent miner le processus politique public.\n\nActions et attentes associées:\nIl convient que l'organisation:\n\t\t- forme ses employés et représentants et les sensibilise en matière d'engagement politique et de contributions responsables et sur la façon de traiter les conflits d'intérêt; \n\t\t- soit transparente en ce qui concerne sa politique et ses activités liées aux groupes de pression, aux contributions politiques et à l'engagement politique; \n\t\t- établisse et mette en uvre une politique et des lignes directrices permettant de gérer les activités des personnes choisies pour parler au nom de l'organisation; \n\t\t- évite toutes contributions politiques revenant à une tentative de contrôler les responsables politiques ou les décideurs en faveur d'une cause spécifique, ou qui pourraient être perçues comme représentant un abus d'autorité à leur égard; et \n\t\t- interdise les activités qui impliquent désinformation, fausse déclaration, menace ou coercition."
    6_prefix: "6.6.5"
    6_label: "Loyauté des pratiques  Domaine d'action 3: Concurrence loyale"
    6_desc: "Description du domaine d'action :\nUne concurrence large et loyale stimule l'innovation et l'efficience, réduit les coûts des produits et services, garantit que toutes les organisations ont les mêmes opportunités, encourage le développement de produits ou de processus nouveaux ou améliorés et, à long terme, favorise la croissance économique et améliore les niveaux de vie. Un comportement anticoncurrentiel risque de nuire à la réputation d'une organisation vis-à-vis de ses parties prenantes et peut créer des situations d'illégalité. Lorsque les organisations refusent de s'engager dans un comportement anticoncurrentiel, elles aident à créer un climat dans lequel un tel comportement n'est pas toléré, ce qui avantage tout le monde.\nIl existe de nombreuses formes de comportement anticoncurrentiel. Citons, par exemple, l'entente sur les prix, où les parties s'entendent pour vendre le même produit ou le même service au même prix, la collusion des soumissionnaires, où les parties s'entendent pour truquer un appel d'offres et des prix prédateurs consistant à vendre un produit ou un service à un prix très bas dans le but d'éliminer les concurrents du marché et d'imposer des conditions déloyales aux concurrents.\n\nActions et attentes associées :\n\t\t- mène ses activités d'une manière compatible avec la législation et la réglementation sur la concurrence et coopère avec les autorités appropriées; \n\t\t- établisse des procédures et autres garde-fous pour éviter de s'engager dans un comportement anticoncurrentiel ou d'en être complice; \n\t\t- sensibilise ses employés à l'importance de se conformer à la législation sur la concurrence et de se livrer à une concurrence loyale; \n\t\t- appuie les pratiques anti-trust et anti-dumping ainsi que les politiques officielles qui encouragent la concurrence; et \n\t\t- soit soucieuse du contexte social dans lequel elle opère et ne profite pas de conditions sociales telles que la pauvreté pour obtenir des avantages concurrentiels déloyaux."
    7_prefix: "6.6.6"
    7_label: "Loyauté des pratiques  Domaine d'action 4: Promotion de la responsabilité sociétale dans la chaîne de valeur"
    7_desc: "Description du domaine d'action :\nUne organisation peut influencer d'autres organisations en prenant ses décisions d'approvisionnement et d'achat. En tant que meneur et mentor le long de la chaîne de valeur, elle peut promouvoir l'adoption et le soutien des principes et pratiques de responsabilité sociétale.\nIl convient qu'une organisation envisage les impacts potentiels ou les conséquences involontaires de ses décisions d'achat ou d'approvisionnement sur les autres organisations et prenne des précautions pour éviter ou réduire le plus possible tout impact négatif. Elle peut également stimuler la demande de produits et services plus responsables. Il convient de ne pas considérer que ces actions remplacent le rôle des autorités qui est de mettre en oeuvre et de faire appliquer la législation et la réglementation.\nChaque organisation intervenant sur la chaîne de valeur est responsable du respect de la législation et de la réglementation applicables et de ses propres impacts sur la société et l'environnement.\n\nActions et attentes associées:\nPour promouvoir la responsabilité sociétale dans sa chaîne de valeur, il convient qu'une organisation: \n\t\t- intègre des critères éthiques, sociaux, environnementaux et relatifs à l'égalité entre hommes et femmes, de même que la santé et la sécurité, dans ses politiques et pratiques d'achat, de distribution et de passation de contrats afin d'en améliorer la compatibilité avec les objectifs de la responsabilité sociétale;\n\t\t- encourage d'autres organisations à adopter une politique similaire sans tomber ainsi dans un comportement anti-compétitif; \n\t\t- exerce de manière pertinente son devoir de vigilance et procède à une surveillance des organisations avec lesquelles elle est en relation, de manière à empêcher que ne soient compromis les engagements de l'organisation vis-à-vis de la responsabilité sociétale; \n\t\t- envisage d'apporter, si nécessaire, son appui aux petites et moyennes organisations, y compris en les sensibilisant aux questions de responsabilité sociétale et de bonnes pratiques et en leur apportant une assistance supplémentaire (technique, par exemple, sous forme de renforcement des capacités ou d'autres ressources) afin de répondre aux objectifs de responsabilité sociétale; \n\t\t- participe activement à la sensibilisation des organisations avec lesquelles elle est en relations en ce qui concerne les principes et domaines d'action en matière de responsabilité sociétale; et \n\t\t- promeuve la répartition équitable des coûts et bénéfices de la mise en oeuvre de pratiques de responsabilité sociétale sur toute la chaîne de valeur y compris, si possible, le renforcement des capacités des organisations de la chaîne de valeur à opérer pour atteindre les objectifs de responsabilité sociétale. Cela inclut des pratiques d'achat adéquates, consistant par exemple à payer le juste prix et à pratiquer des délais raisonnables, avec des contrats stables."
    8_prefix: "6.6.7"
    8_label: "Loyauté des pratiques  Domaine d'action 5: Respect des droits de propriété"
    8_desc: "Description du domaine d'action :\nLe droit de propriété est un droit de l'Homme reconnu dans la Déclaration universelle des droits de l'Homme. Les droits de propriété couvrent la propriété tant physique qu'intellectuelle et englobent les droits fonciers et autres avoirs physiques, les droits d'auteur, les brevets, les droits relatifs aux indications d'origine géographique, les droits moraux et autres. Ils peuvent également prendre en compte des revendications de propriété plus larges, telles que le savoir traditionnel de groupes spécifiques (des populations autochtones, par exemple) ou la propriété intellectuelle d'employés ou autres personnes.\nLa reconnaissance des droits de propriété favorise l'investissement ainsi que la sécurité économique et physique et encourage la créativité et l'innovation.\n\nActions et attentes associées :\nIl convient que l'organisation: \n\t\t- mette en oeuvre une politique et des pratiques qui promeuvent le respect des droits de propriété et du savoir traditionnel; \n\t\t- mène ses propres investigations pour être sûre qu'elle est légitimement en droit de jouir de la propriété ou de la céder;\n\t\t- ne s'engage pas dans des activités qui violent les droits de propriété, y compris l'abus de position dominante, la contrefaçon et le piratage; \n\t\t- verse une juste compensation pour la propriété qu'elle acquiert ou dont elle jouit; et \n\t\t- tienne compte des attentes de la société, des droits de l'Homme et des besoins fondamentaux des individus lors de l'exercice et de la protection de ses droits de propriété intellectuelle et physique."
  7:
    title: "Questions relatives aux consommateurs"
    1_prefix: "6.7.2.1"
    1_label: "Principes et considérations - Principes"
    1_desc: "Les Principes directeurs des Nations Unies pour la protection du consommateur et la Convention Internationale sur les Droits Économiques, Sociaux et Culturels expriment les principes qui devraient guider les pratiques responsables eu égard aux besoins légitimes des consommateurs, incluant la satisfaction des besoins fondamentaux et le droit de chacun à un niveau de vie suffisant, notamment en matière de nourriture, d'habillement et de logement, l'amélioration continue des conditions de vie et la disponibilité des produits et services essentiels, y compris financiers. Ils incluent également le droit de promouvoir un développement économique et social juste, équitable et durable, ainsi que la protection de l'environnement. Ces besoins légitimes incluent:\n\t\t- la sécurité: le droit d'avoir accès à des produits non dangereux et la protection des consommateurs contre les risques pour leur santé et leur sécurité engendrés par les processus de production, produits et services; \n\t\t- le fait d'être informé: Accès des consommateurs à des informations leur permettant de faire un choix éclairé en fonction de leurs souhaits et de leurs besoins, et d'être protégés contre les publicités ou étiquettes malhonnêtes ou mensongères; \n\t\t- le fait de faire des choix: La promotion et la protection des intérêts économiques des consommateurs, incluant la possibilité de faire un choix dans une gamme de produits et de services offerts à des prix compétitifs, avec l'assurance d'une qualité satisfaisante; \n\t\t- le fait d'être entendu: Liberté de constituer des associations de consommateurs et autres groupements ou organisations afin de faire entendre le point de vue des consommateurs dans le cadre des processus de prise de décision les concernant, en particulier au niveau de la conception et de l'exécution de la politique gouvernementale et du développement des produits et services; \n\t\t- la réparation: Possibilités effectives de recours offertes aux consommateurs, en particulier sous la forme d'une prise en compte honnête des plaintes justifiées, y compris la compensation pour une représentation insuffisante, des produits défectueux ou des services qui laissent à désirer;\n\t\t- l'éducation: Éducation du consommateur, incluant la sensibilisation aux impacts environnementaux, sociaux et économiques de ses choix, en lui permettant de faire des choix éclairés et en toute indépendance en matière de produits et services, tout en étant conscient de ses droits fondamentaux, de ses responsabilités et des possibilités d'action; et \n\t\t- un environnement sain: Il s'agit d'un environnement qui ne constitue pas une menace pour le bien-être des générations présentes et futures. La consommation durable consiste à satisfaire aux besoins des générations présentes et futures en matière de produits et services de manière durable du point de vue économique, social et environnemental.\nParmi les principes complémentaires, citons:\n\t\t- le respect du droit à la vie privée, principe extrait de l'Article 12 de la Déclaration universelle des droits de l'Homme qui prévoit que nul ne sera l'objet d'immixtions arbitraires dans sa vie privée, sa famille, son domicile ou sa correspondance ou d'atteintes à son honneur et à sa réputation et que toute personne a droit à la protection de la loi contre de telles immixtions ou de telles atteintes; \n\t\t- le principe de précaution: Extrait de la Déclaration de Rio sur l'environnement et le développement [158] et des déclarations et conventions ultérieures qui mettent en avant le concept selon lequel, en cas de risque de dommages graves ou irréversibles pour l'environnement ou la santé humaine, il convient que l'absence de certitude scientifique absolue ne serve pas de prétexte pour remettre à plus tard l'adoption de mesures d'un coût économiquement acceptable visant à prévenir la dégradation de l'environnement ou un dommage pour la santé humaine. Pour évaluer le rapport coût-efficacité d'une mesure, il convient qu'une organisation considère, outre les coûts économiques à court terme, les coûts à long terme et les avantages liés à cette mesure; \n\t\t- la promotion de l'égalité entre hommes et femmes et l'autonomisation des femmes: Principe extrait de la Déclaration universelle des droits de l'Homme et des objectifs du Millénaire pour le développement  (voir Encadrés 2, 6 et 13). Il fournit une base supplémentaire pour analyser les questions relatives aux consommateurs et prévenir la perpétuation de stéréotypes négatifs sur les hommes ou les femmes (voir Encadré 12); et \n\t\t- la promotion d'une conception universelle: Il s'agit de la conception de produits et environnements destinés à être utilisables par tous, dans la mesure du possible, sans nécessiter ni adaptation ni conception particulière. La conception universelle comporte sept principes: une utilisation équitable, la souplesse d'utilisation, une utilisation simple et intuitive, des informations compréhensibles, une tolérance pour les erreurs, un effort physique limité et une taille et un espace en vue de l'approche et de l'utilisation."
    2_prefix: "6.7.2.2"
    2_label: "Principes et considérations - Considérations"
    2_desc: "Bien qu'il incombe principalement à l'État de garantir le respect du droit à la satisfaction des besoins de base, une organisation peut contribuer au respect de ce droit. Notamment dans les domaines où l'État ne satisfait pas correctement les besoins de base des individus, il convient qu'une organisation soit sensibilisée à l'impact de ses activités sur la capacité des personnes à satisfaire ces besoins. Il convient également qu'elle évite des actions qui compromettraient cette capacité.\nLes groupes vulnérables (voir 6.3.7.2) ont différentes capacités et, en tant que consommateurs, ils ont des besoins particuliers et peuvent, dans certains cas, avoir besoin de produits et services spécialement adaptés. Ils ont des besoins particuliers car ils peuvent ne pas connaître leurs droits et leurs responsabilités ou encore ils peuvent être incapables d'agir sur leurs connaissances. Ils peuvent également ne pas être conscients des risques potentiels associés aux produits ou services ou être incapables de les évaluer, et par conséquent de porter des jugements équilibrés."
    3_prefix: "6.7.3"
    3_label: "Questions relatives aux consommateurs 1: Pratiques loyales en matière de commercialisation, d'informations et de contrats"
    3_desc: "Description du domaine d'action:\nLes pratiques loyales en matière de commercialisation, de fourniture d'informations concrètes et non biaisées et de contrats donnent des informations sur les produits et services d'une manière compréhensible pour les consommateurs. Cela permet à ces derniers de prendre des décisions avisées concernant la consommation et leurs achats et de comparer les caractéristiques des différents produits et services. Des processus contractuels loyaux visent à protéger les intérêts légitimes tant des fournisseurs que des consommateurs en atténuant les déséquilibres de pouvoir entre les parties à la négociation. Une commercialisation responsable peut impliquer la fourniture d'informations relatives aux impacts sociaux, économiques et environnementaux pendant tout le cycle de vie et sur toute la chaîne de valeur. Le détail des produits et services offerts par les fournisseurs joue un rôle important dans les décisions d'achat car ces informations peuvent fournir les seules données facilement disponibles pour les consommateurs. Une commercialisation et des informations ayant un aspect déloyal, incomplet, fallacieux ou trompeur peuvent entraîner l'achat de produits et de services qui ne répondent pas aux besoins des consommateurs et se traduire par une perte d'argent, de ressources et de temps [122][124], voire même être dangereux pour le consommateur ou l'environnement. Cela peut même entraîner une perte de confiance du consommateur, qui ne sait plus à qui ni à quoi se fier, et avoir une incidence négative sur la croissance des marchés de produits et services plus durables.\n\nActions et attentes associées:\nDans le cadre de la communication avec les consommateurs, il convient qu'une organisation:\n\t\t- ne s'engage dans aucune pratique trompeuse, fallacieuse, frauduleuse, déloyale, peu claire ou ambigüe, y compris l'omission d'informations cruciales; \n\t\t- consente à partager les informations pertinentes de façon transparente, ce qui permet au consommateur d'y accéder facilement et de faire des comparaisons, pour pouvoir faire un choix éclairé. \n\t\t- affiche clairement le caractère publicitaire et commercial de ses publications; \n\t\t- diffuse publiquement le prix total et les taxes, les termes et conditions concernant les produits et services (ainsi que tout accessoire requis pour leur utilisation) et les frais de livraison. En proposant un crédit à la consommation, il convient qu'elle fournisse les détails des taux d'intérêt annuels réels ainsi que le taux effectif global (TEG) appliqué qui comprend tous les coûts occasionnés, le montant à régler, le nombre de règlements et la date des versements; \n\t\t- justifie les déclarations ou assertions en fournissant, à la demande, faits et informations sous-jacents; \n\t\t- n'utilise pas de texte, de diffusion audio ou d'images qui perpétuent des stéréotypes en ce qui concerne, par exemple, le sexe, la religion, la race, l'invalidité ou les relations personnelles; \n\t\t- veille avant tout à ce que les opérations publicitaires et commerciales soient menées de manière à préserver les intérêts des groupes vulnérables, notamment les enfants, et ne s'engage pas dans des activités qui vont à l'encontre de leurs intérêts; \n\t\t- fournisse, dans les langues officielles ou couramment parlées du point de vente et conformément aux réglementations en vigueur, des informations complètes, précises, compréhensibles et comparables concernant:\n\t\t\t\t- tous les aspects importants relatifs aux produits et services, y compris produits financiers et produits d'investissement, en tenant compte, dans l'idéal, de la totalité du cycle de vie; \n\t\t\t\t- les aspects qualité clé des produits et services déterminés en appliquant des méthodes d'essai normalisées et comparés, si possible, avec les performances moyennes ou les bonnes pratiques. Il convient de limiter la fourniture de ces informations aux cas où cela est adapté et possible et où cela aiderait les consommateurs;\n\t\t\t\t- les aspects santé et sécurité des produits et services, tels que les usages potentiellement dangereux ainsi que les matières et produits chimiques dangereux contenus dans les produits ou dégagés par ces derniers pendant toute la durée de leur cycle de vie; \n\t\t\t\t- des informations relatives à l'accessibilité des produits et services; et \n\t\t\t\t- le lieu géographique, l'adresse postale, le numéro de téléphone et l'adresse Internet de l'organisation en cas de vente à distance sur le marché intérieur ou transfrontalier, y compris par le biais d'Internet, du commerce en ligne ou des commandes par messagerie;\n\t\t- utilise des contrats qui:\n\t\t\t\t- sont rédigés dans une langue claire, lisible et compréhensible; \n\t\t\t\t- ne comportent pas de termes contractuels abusifs, tels que les exclusions déloyales de recours en responsabilité, le droit de modifier unilatéralement les prix et les conditions, le transfert de risque d'insolvabilité aux consommateurs ou une durée des contrats trop longue, et évitent de recourir à des pratiques abusives en matière de prêt, notamment à des taux de crédit déraisonnables; et \n\t\t\t\t- fournissent des informations claires et suffisantes concernant les prix, caractéristiques, termes, conditions, coûts, durée du contrat et délais d'annulation."
    4_prefix: "6.7.4"
    4_label: "Questions relatives aux consommateurs 2: Protection de la santé et de la sécurité des consommateurs"
    4_desc: "Description du domaine d'action:\nLa protection de la santé et de la sécurité des consommateurs implique la fourniture de produits et services sûrs et ne présentant aucun risque inacceptable de dommage lorsqu'ils sont utilisés ou consommés dans le cadre de l'utilisation prévue ou d'un mauvais usage prévisible. Des instructions claires permettant une utilisation en toute sécurité, y compris l'assemblage et l'entretien, sont également un élément important de la protection de la santé et de la sécurité.\nUne organisation peut voir sa réputation directement affectée par l'impact de ses produits et services sur la santé et la sécurité des consommateurs.\nIl convient que les produits et services soient sûrs, qu'il existe ou non des exigences de sécurité réglementaires. La sécurité englobe l'anticipation des risques potentiels afin d'éviter un dommage ou un danger. Les risques éventuels ne pouvant pas tous être prévus ou éliminés, les mécanismes de retrait et de rappel des produits font partie des mesures de protection de la sécurité.\n\nActions et attentes associées:\nPour protéger la santé et la sécurité des consommateurs, il convient qu'une organisation entreprenne les actions suivantes et accorde une attention particulière aux groupes vulnérables (plus particulièrement les enfants) qui pourraient ne pas être en mesure de reconnaître ou d'évaluer les dangers potentiels. Il convient qu'elle:\n\t\t- fournisse des produits et services qui, dans les conditions d'utilisation normales ou raisonnablement prévisibles, sont sûrs pour les utilisateurs et autres personnes, leurs biens et l'environnement; \n\t\t- évalue l'adéquation des lois, réglementations, normes et autres spécifications relatives à la santé et à la sécurité traitant de tous les aspects santé et sécurité. Il convient qu'une organisation aille audelà des exigences minimales de sécurité lorsqu'il est évident que des exigences plus sévères assurent un niveau de protection sensiblement meilleur, ce qu'indiquent les accidents impliquant des produits ou services conformes aux exigences minimales ou la disponibilité de produits ou de types de produits susceptibles de réduire le nombre et/ou la gravité des accidents;\n\t\t- interrompe les services ou retire tous les produits se trouvant encore sur la chaîne de distribution si, après avoir été mis sur le marché, un produit présente un risque imprévisible ou un défaut sérieux ou encore contient des informations trompeuses ou fausses.  Il convient qu'une organisation rappelle les produits en prenant les mesures et en utilisant les moyens appropriés pour atteindre les personnes qui ont acheté le produit ou utilisé les services, et dédommage les consommateurs pour le préjudice subi. Des mesures relatives à la traçabilité dans la chaîne de valeur de l'organisation peuvent être pertinentes et utiles. \n\t\t- limite le plus possible les risques à la conception des produits:\n\t\t\t\t-en identifiant le ou les groupes d'utilisateurs probables, l'utilisation prévue et une mauvaise utilisation raisonnablement prévisible du processus, produit ou service, ainsi que les risques à tous les stades et dans toutes les conditions d'utilisation du produit ou du service et, dans certains cas, en fournissant des produits et services spécialement adaptés aux groupes vulnérables; \n\t\t\t\t-en estimant et en évaluant le risque que court chaque utilisateur/groupe de contact identifié (y compris les femmes enceintes) du fait des dangers recensés; et \n\t\t\t\t-en respectant l'ordre de priorité suivant: conception avec une sécurité inhérente, dispositifs de protection et information des utilisateurs;\n\t\t-conçoive de manière appropriée les informations accompagnant les produits et services en prenant en compte les différents besoins des consommateurs et en respectant leurs capacités différentes ou limitées, en particulier en termes de temps alloué au processus d'information; \n\t\t-évite, lors de l'élaboration de produits, l'utilisation de produits chimiques nocifs, y compris ceux qui sont classés cancérigènes, mutagènes, toxiques pour la reproduction ou persistants et bio-accumulatifs, mais sans que cela soit limitatif. Si des produits contenant ces produits chimiques sont mis en vente, il convient de les étiqueter clairement; \n\t\t-procède, s'il y a lieu, avant introduction de nouveaux matériaux, de nouvelles technologies ou de nouvelles méthodes de production, à une évaluation du risque que présentent les produits et services pour la santé humaine et fournisse, le cas échéant, une documentation à l'usage des consommateurs; \n\t\t-transmette aux consommateurs des informations vitales pour la sécurité, dans toute la mesure du possible à l'aide de symboles ayant, de préférence, fait l'objet d'un accord au niveau international et venant s'ajouter aux textes; \n\t\t-donne aux consommateurs des instructions pour leur permettre d'utiliser correctement les produits et les avertisse des risques existants lors de l'utilisation envisagée ou normalement prévisible; et \n\t\t-adopte des mesures permettant d'éviter qu'une manipulation ou un stockage inapproprié des produits ne les rendent peu sûrs lorsqu'ils sont confiés aux consommateurs."
    5_prefix: "6.7.5"
    5_label: "Questions relatives aux consommateurs 3: Consommation durable"
    5_desc: "Description du domaine d'action:\nLa consommation durable correspond à la consommation de produits et ressources dans des quantités compatibles avec le développement durable. Le concept est celui du Principe 8 de la Déclaration de Rio sur l'Environnement et le Développement qui stipule que, afin de parvenir à un développement durable et à une meilleure qualité de vie pour tous les peuples, les États devraient réduire et éliminer les modes de production et de consommation non durables. Le concept de consommation durable implique également de se préoccuper de la protection des animaux, en respectant leur intégrité physique et en évitant tout acte de cruauté.\nLe rôle d'une organisation en matière de consommation durable tient aux produits et services qu'elle propose, à leur cycle de vie et à leur chaîne de valeur ainsi qu'à la nature des informations qu'elle fournit aux consommateurs.\nLes niveaux de consommation actuels sont manifestement non durables, contribuant ainsi à détériorer l'environnement et à appauvrir les ressources. Les consommateurs jouent un rôle important en matière de développement durable en orientant leurs choix et leurs décisions d'achat en fonction de facteurs éthiques, sociétaux, économiques et environnementaux, sur la base d'informations précises.\n\nActions et attentes associées:\nPour contribuer à assurer une consommation durable, il convient, le cas échéant, qu'une organisation:\n\t\t-promeuve l'éducation nécessaire pour permettre aux consommateurs de comprendre les impacts de leurs choix de produits et services sur leur bien-être et sur l'environnement.  Des conseils pratiques visant à indiquer comment modifier les schémas de consommation et procéder aux changements nécessaires peuvent être fournis. \n\t\t-propose aux consommateurs des produits et des services bénéfiques d'un point de vue sociétal et environnemental en tenant compte du cycle de vie complet et réduise les effets néfastes sur la société et l'environnement: \n\t\t\t\t- en éliminant, si possible, ou en réduisant le plus possible tout impact négatif des produits et services sur la santé et l'environnement, et, s'il existe des alternatives moins néfastes et plus efficaces, en proposant des produits ou des services ayant moins d'effets négatifs sur la société et l'environnement; \n\t\t\t\t- en concevant des produits et des emballages de manière à ce qu'ils puissent être facilement utilisés, réutilisés, réparés ou recyclés et, si possible, en proposant ou en suggérant des services de recyclage et de mise au rebut; \n\t\t\t\t- en accordant la préférence à des approvisionnements susceptibles de contribuer au développement durable; \n\t\t\t\t- en proposant des produits de grande qualité, ayant une durée de vie plus longue, à des prix abordables; \n\t\t\t\t- en fournissant aux consommateurs des informations scientifiquement fiables, cohérentes, véridiques, précises, comparables et vérifiables concernant les facteurs environnementaux et sociétaux liés à la production et à la livraison de ses produits ou services, y compris, le cas échéant, des informations relatives aux économies de ressources, compte tenu de la chaîne de valeur; \n\t\t\t\t- en transmettant aux consommateurs des informations relatives aux produits et services, y compris en ce qui concerne: les performances, les impacts sur la santé, le pays d'origine, l'efficacité énergétique (le cas échéant), le contenu ou les ingrédients (y compris, le cas échéant, l'emploi d'organismes génétiquement modifiés et de nanoparticules), les aspects liés au bien-être des animaux (y compris, le cas échéant, le recours à l'expérimentation animale), la sécurité d'utilisation, la maintenance, le stockage et la mise au rebut des produits et de leur emballage; et \n\t\t\t\t- en se référant à des programmes d'étiquetage fiables et efficaces, vérifiés de manière indépendante, ou à d'autres programmes de vérification, tels que l'écolabel ou les activités d'audit, afin de communiquer sur les aspects environnementaux positifs, les rendements énergétiques et autres caractéristiques bénéfiques d'un point de vue sociétal et environnemental des produits et services."
    6_prefix: "6.7.6"
    6_label: "Questions relatives aux consommateurs 4: Service après-vente, assistance et résolution des réclamations et litiges pour les consommateurs"
    6_desc: "Description du domaine d'action:\nLe service après-vente, l'assistance et la résolution des réclamations et litiges sont des mécanismes auxquels une organisation fait appel pour traiter les besoins des consommateurs après l'achat des produits ou la prestation de services. Ces mécanismes englobent une installation adéquate, toutes les formes de garanties, l'assistance technique concernant l'utilisation ainsi que des dispositions relatives au retour, aux réparations et à la maintenance.\n\nLes produits et services dont les performances ne sont pas satisfaisantes, soit du fait de défauts ou d'altérations soit par suite d'une mauvaise utilisation, peuvent être source de violation des droits des consommateurs ainsi que de perte d'argent, de ressources et de temps.\n\nLes fournisseurs de produits et services peuvent améliorer la satisfaction du consommateur et diminuer les niveaux de réclamation en proposant des produits et des services de grande qualité. Il convient qu'ils prodiguent aux consommateurs des conseils clairs en matière d'utilisation adaptée et de recours ou de solutions en cas de performances défaillantes. Ils peuvent également surveiller l'efficacité de leur service après-vente, assistance et procédures de règlement des litiges en rendant visite à leurs utilisateurs.\n\n\nActions et attentes associées:\nIl convient que l'organisation:\n\t\t- prenne des mesures destinées à éviter les réclamations en proposant aux consommateurs, y compris ceux qui ont acquis les produits par vente à distance, l'option de retour des produits dans un délai spécifié ou d'autres solutions adaptées; \n\t\t- traite les réclamations et améliore ses pratiques en réponse aux réclamations; \n\t\t- le cas échéant, offre des garanties qui vont au-delà des périodes garanties par la loi et sont adaptées à la durée de vie prévue du produit; \n\t\t- fasse clairement connaître aux consommateurs le moyen d'accéder aux services après-vente et assistance ainsi qu'aux mécanismes de règlement des litiges et de réparation; \n\t\t- offre une assistance adaptée et efficace ainsi que des systèmes de conseil; \n\t\t- propose une maintenance et des réparations à un prix raisonnable et à des endroits accessibles et facilite l'accès aux informations concernant la disponibilité escomptée des pièces détachées pour les produits; et \n\t\t- fasse appel à d'autres mécanismes de règlement des litiges et à des mécanismes de résolution des conflits et de réparation reposant sur des normes nationales ou internationales, n'occasionnant aucun frais ou un minimum de frais pour les consommateurs et ne demandant pas à ces derniers de renoncer à leurs droits d'user de voies de recours."
    7_prefix: "6.7.7"
    7_label: "Questions relatives aux consommateurs 5: Protection des données et de la vie privée des consommateurs"
    7_desc: "Description du domaine d'action:\nLa protection des données et de la vie privée des consommateurs est destinée à sauvegarder les droits des consommateurs en matière de vie privée, en limitant les types d'informations réunies et les méthodes d'obtention, d'utilisation et de protection de ces informations. L'augmentation constante de l'emploi de moyens de communication électroniques (y compris pour les transactions financières) et les tests génétiques, ainsi que l'extension des bases de données à une grande échelle soulèvent des inquiétudes quant à la façon de protéger la vie privée des consommateurs, notamment en ce qui concerne les informations personnellement identifiables.\n\nLes organisations peuvent maintenir leur crédibilité et la confiance des consommateurs en faisant appel à des systèmes rigoureux pour l'obtention, l'utilisation et la protection des données relatives aux consommateurs.\n\n\nActions et attentes associées:\nAfin d'éviter que la collecte et le traitement de données personnelles n'empiète sur la vie privée, il convient qu'une organisation:\n\t\t- limite la collecte de données personnelles aux informations qui sont soit indispensables pour la fourniture des produits et services soit transmises avec le consentement éclairé et volontaire du consommateur; \n\t\t- s'abstienne de conditionner l'utilisation de services ou le bénéfice d'offres spéciales à l'acceptation de la part du consommateur d'une utilisation abusive de données à des fins commerciales; \n\t\t- obtienne ces données uniquement par des moyens légaux et loyaux;\n\t\t- spécifie l'objectif de la collecte de données personnelles, soit avant soit au moment de cette collecte; \n\t\t- s'abstienne de divulguer, de rendre accessibles ou d'utiliser des données personnelles à des fins autres que celles spécifiées, y compris la commercialisation, à l'exception de celles fournies avec le consentement éclairé et volontaire du consommateur ou selon les exigences de la loi; \n\t\t- donne aux consommateurs le droit de vérifier si l'organisation dispose de données les concernant et de contester ces données, selon la définition de la loi. Si la contestation aboutit, il convient que les données soient effacées, rectifiées, complétées ou modifiées, selon le cas; \n\t\t- protège les données personnelles en utilisant des sauvegardes de sécurité adaptées; \n\t\t- soit à l'écoute des développements, pratiques et politiques concernant les données personnelles et fournisse rapidement les moyens d'établir l'existence, la nature et les principales utilisations de ces données; et \n\t\t- divulgue l'identité et le siège habituel de la personne en mesure de répondre de la protection des données au sein de l'organisation (appelée parfois «contrôleur des données») et rende cette personne redevable du respect des mesures ci-dessus et de la loi en vigueur."
    8_prefix: "6.7.8"
    8_label: "Questions relatives aux consommateurs 6: Accès aux services essentiels"
    8_desc: "Description du domaine d'action:\nBien que le respect du droit à la satisfaction des besoins fondamentaux relève de la responsabilité de l'État, ce dernier ne garantit pas la protection de ce droit en de nombreux lieux et dans de nombreuses situations. Même lorsque la satisfaction de certains besoins fondamentaux, comme les soins de santé, est protégée, la protection du droit aux services essentiels, tels que l'électricité, le gaz, l'eau, les services des eaux résiduaires, le drainage, les eaux d'égout et les communications, peut ne pas être totalement assurée. Une organisation peut contribuer au respect de ce droit.\n\n\nActions et attentes associées:\nIl convient qu'une organisation qui assure des services essentiels:\n\t\t- n'interrompe pas la fourniture de services essentiels pour non-paiement sans donner au consommateur ou groupe de consommateurs la possibilité de trouver des délais raisonnables pour procéder au paiement;  n'ait pas recours à l'interruption collective des services qui pénalise tous les consommateurs sans tenir compte des paiements effectués; \n\t\t- propose, lors de l'établissement des prix et des charges, si cela est autorisé, un tarif qui permettra d'apporter une aide aux populations en difficulté; \n\t\t- agisse de manière transparente, en fournissant des informations relatives à la fixation des prix et des charges; \n\t\t- élargisse sa couverture et fournisse la même qualité et le même niveau de service à tous les groupes de consommateurs, sans aucune discrimination; \n\t\t- gère de manière équitable toute coupure ou interruption de l'alimentation, en évitant toute discrimination vis-à-vis de tout groupe de consommateurs; et \n\t\t- entretienne et mette à jour ses systèmes afin de prévenir toute interruption du service."
    9_prefix: "6.7.9"
    9_label: "Questions relatives aux consommateurs 7: Éducation et sensibilisation"
    9_desc: "Description du domaine d'action:\nLes initiatives en matière d'éducation et de sensibilisation permettent aux consommateurs d'être bien informés, conscients de leur droits et de leurs responsabilités, d'être mieux en mesure de jouer un rôle actif ainsi que de pouvoir prendre des décisions d'achat en connaissance de cause et de consommer de manière responsable. Tant dans les zones rurales que dans les zones urbaines, les consommateurs défavorisés, y compris les consommateurs ayant de faibles revenus et ceux qui sont peu instruits, ont des besoins particuliers en matière d'éducation et de meilleure sensibilisation. En cas de contrat formel entre une organisation et un consommateur, il convient que l'organisation vérifie que le consommateur est correctement informé de tous les droits et obligations en vigueur.\n\nL'éducation des consommateurs n'a pas seulement pour but de transmettre un savoir, mais également de permettre aux consommateurs d'agir sur ce savoir. Cela inclut le développement de savoir-faire permettant d'évaluer les produits et services et de faire des comparaisons. Elle vise également à sensibiliser le consommateur à l'impact de ses choix de consommation sur les autres et sur le développement durable [154]. L'éducation ne dispense pas une organisation d'être responsable si un dommage est causé au consommateur du fait de ses produits et services.\n\n\nActions et attentes associées:\nDans le cadre de l'éducation du consommateur, il convient qu'une organisation aborde, le cas échéant:\n\t\t- la santé et la sécurité, y compris les dangers présentés par les produits; \n\t\t- les informations relatives à la législation et aux réglementations appropriées, moyens d'obtenir réparation et agences et organisations de protection des consommateurs; \n\t\t- l'étiquetage des produits et services ainsi que les informations fournies dans les manuels et instructions; \n\t\t- les informations relatives aux poids et mesures, aux prix, à la qualité, aux conditions de crédit et à la disponibilité des services essentiels; \n\t\t- les informations relatives aux risques liés à l'utilisation et toutes précautions à prendre; \n\t\t- les produits et services financiers et les produits et services d'investissement; \n\t\t- la protection de l'environnement; \n\t\t- une utilisation efficiente des matières, de l'énergie et de l'eau; \n\t\t- une consommation durable; et \n\t\t- une mise au rebut adéquate des emballages, déchets et produits."
  8:
    title: "Communautés et développement local"
    1_prefix: "6.8.1"
    1_label: "Principes et considérations - Principes"
    1_desc: "De nos jours, il est largement admis que les organisations aient des relations avec les communautés au sein desquelles elles opèrent. Il convient que ces relations reposent sur une implication auprès des communautés afin de contribuer à leur développement. L'implication auprès des communautés  soit individuellement soit par l'intermédiaire d'associations cherchant à améliorer les biens publics - aide à renforcer la société civile. Les organisations qui dialoguent de manière respectueuse avec la communauté et ses institutions reflètent les valeurs démocratiques et civiques et les renforcent.\n\nDans le présent article, le terme «communauté» renvoie à la zone géographique où se situe une implantation résidentielle ou toute autre implantation humaine, à proximité physique des sites ou des zones d'impact de l'organisation. La zone et les membres de la communauté affectés par les impacts induits par une organisation dépendront du contexte et notamment de l'importance et de la nature de ces impacts. Toutefois, d'une manière générale, le terme «communauté» peut également désigner un groupe de personnes partageant des caractéristiques particulières, par exemple une communauté «virtuelle» qui s'intéresse à un domaine d'action particulier.\n\nL'implication auprès des communautés et la contribution au développement local font partie intégrante du développement durable.\n\nL'implication auprès des communautés va bien au-delà de l'identification des parties prenantes et du dialogue avec elles en ce qui concerne les impacts des activités d'une organisation; il englobe également l'appui et la construction d'une relation avec les communautés. Avant tout, il comporte la reconnaissance de leur valeur. Il convient que l'implication auprès des communautés d'une organisation naisse de la reconnaissance que l'organisation est une partie prenante au sein des communautés et qu'elle partage des intérêts communs avec elles.\n\nLa contribution d'une organisation au développement d'une communauté peut aider à promouvoir des niveaux plus élevés de bien-être au sein de la communauté. Ce développement, au sens général, correspond à l'amélioration de la qualité de vie d'une population. Le développement de la communauté n'est pas un processus linéaire; de plus, il s'agit d'un processus à long terme impliquant des intérêts différents et conflictuels. Des caractéristiques historiques et culturelles font que chaque communauté est unique et ont une incidence sur son évolution. Le développement de la communauté est donc le résultat de phénomènes sociaux, politiques, économiques et culturels et dépend des caractéristiques des forces sociales en jeu. Les parties prenantes de la communauté peuvent avoir des intérêts différents, voire conflictuels. Le partage de la responsabilité est nécessaire pour promouvoir le bien-être de la communauté comme objectif commun.\n\nLes domaines d'action du développement local auxquels une organisation peut apporter sa contribution englobent la création d'emploi en élargissant et en diversifiant ses activités économiques et le développement technologique. Elle peut aussi apporter sa contribution en procédant à des investissements dans la société de création de richesses et de revenus, en lançant des initiatives de développement économique local, en élargissant les programmes d'éducation et de développement des capacités, en promouvant et en préservant la culture et les arts et en assurant et/ou promouvant des services de santé collectifs. Le développement de la communauté peut comporter le renforcement institutionnel de la communauté, de ses groupes et forums collectifs, des programmes sociaux-culturels et environnementaux ainsi que des réseaux locaux impliquant de nombreuses institutions.\n\nLe développement de la communauté progresse généralement lorsque les forces sociales de cette communauté s'efforcent de promouvoir la participation publique et recherchent l'égalité des droits et des niveaux de vie dignes pour tous les citoyens, sans discrimination. Il s'agit d'un processus interne à la communauté qui prend en compte les relations existantes et surmonte les barrières entravant la jouissance des droits. Un comportement responsable stimule le développement local.\n\nLes investissements dans la société qui contribuent au développement local permettent de maintenir et de renforcer les relations d'une organisation avec ses communautés, et peuvent ou non être associés aux activités opérationnelles principales d'une organisation (voir 6.8.9).\n\nBien que certains aspects des actions discutées dans cette section peuvent être compris comme de la philanthropie, les activités philanthropiques ne suffisent pas à atteindre l'objectif d'intégrer la responsabilité sociétale dans l'organisation (tel que discuté en 3.3.4)."
    2_prefix: "6.8.2.1"
    2_label: "Principes et considérations - Principes"
    2_desc: "Outre les principes de responsabilité sociétale exposés à l'Article 4, les principes spécifiques suivants sont applicables à l'implication auprès des communautés et à la contribution au développement local. Il convient que l'organisation:\n\t\t- se considère comme faisant partie intégrante de la communauté et non comme distincte d'elle lorsqu'elle envisage de s'impliquer dans la communauté et de contribuer au développement local; \n\t\t- reconnaisse et prenne en considération les droits des membres de la communauté de prendre des décisions relatives à cette dernière, et recherche ainsi, dans la manière choisie, des moyens de maximiser leurs ressources et opportunités; \n\t\t- reconnaisse et prenne en considération les caractéristiques, par exemple les cultures, les religions, les traditions et l'histoire de la communauté tout en interagissant avec elle; et \n\t\t- reconnaisse la valeur de travailler en partenariat, en encourageant le partage d'expériences, de ressources et d'efforts."
    3_prefix: "6.8.2.2"
    3_label: "Principes et considérations - Considérations"
    3_desc: "La Déclaration de Copenhague reconnaît «l'urgente nécessité de s'attaquer aux problèmes sociaux les plus graves, en particulier la pauvreté, le chômage et l'exclusion sociale». La Déclaration de Copenhague et le Programme d'action invitent la communauté internationale à faire de l'élimination de la pauvreté, de l'objectif d'un emploi correctement rémunéré et librement choisi et du renforcement de l'intégration sociale les objectifs prioritaires du développement.\n\nLa Déclaration du Millénaire des Nations Unies fixe des objectifs qui, s'ils sont respectés, aident à répondre aux principaux défis mondiaux de développement (voir Encadré 13). La Déclaration du Millénaire des Nations Unies souligne à nouveau que, bien que ce soit principalement les politiques publiques qui guident et orientent le développement, le processus de développement dépend aussi des contributions de toutes les organisations. L'implication auprès des communautés aide à contribuer, au niveau local, à atteindre ces objectifs.\n\nLa Déclaration de Rio sur l'Environnement et le Développement [158] a adopté le programme Agenda 21, qui est un processus visant à développer un plan d'action global pouvant être mis en oeuvre au niveau des territoires par les organisations dans tous les domaines dans lesquels les activités humaines ont un impact sur la société et l'environnement.\n\nIl convient qu'une organisation envisage d'apporter son appui aux politiques publiques concernées lors du dialogue avec la communauté. Cela peut offrir des opportunités de maximiser les résultats recherchés qui promeuvent le développement durable par une vision partagée et une compréhension commune des priorités et des partenariats en matière de développement.\n\nLes organisations rejoignent souvent des partenariats et s'associent avec d'autres afin de défendre et de faire valoir leurs propres intérêts. Il convient cependant que ces associations représentent les intérêts de leurs membres, sur la base du respect des droits d'autres groupes et d'autres personnes d'en faire autant, et qu'elles agissent toujours de manière à améliorer le respect de la loi et des processus démocratiques.\n\nAvant de décider de son implication auprès des communautés et de sa contribution au développement local, il convient qu'une organisation recherche ses impacts potentiels sur la communauté et prévoie des moyens d'atténuer les impacts négatifs et d'optimiser les impacts positifs.\n\nLors de l'élaboration de plans en matière d'implication auprès des communautés et de contribution au développement local, il convient qu'une organisation cherche les opportunités de dialogue avec une large palette de parties prenantes (voir 4.5, 5.3 et Article 7). En outre, il est important d'identifier et de consulter les groupes vulnérables, marginalisés, discriminés ou sous-représentés et, si possible, de leur apporter un soutien.\n\nLes secteurs les plus importants pour l'implication auprès des communautés et la contribution au développement local dépendront de la communauté concernée et des connaissances, ressources et capacités uniques que chaque organisation apporte à la communauté.\n\nCertaines activités d'une organisation peuvent être explicitement destinées au développement local, d'autres pouvant être à des fins privées mais promouvoir indirectement un développement plus large.\n\nEn intégrant le concept d'implication auprès des communautés dans ses décisions et activités, une organisation peut minimiser ou éviter les impacts négatifs et maximiser les bénéfices de ces activités et le développement durable au sein de la communauté. Une organisation peut mettre à profit son propre fonds de compétences en faveur de l'implication auprès des communautés (voir Encadré 14).\n\nUne organisation pourrait se trouver confrontée à des crises humanitaires ou à d'autres circonstances qui menacent de perturber la vie de la communauté, aggrave les problèmes socio-économiques de cette communauté et peuvent également accroître les risques de violation des droits de l'Homme (voir 6.3.4). Les urgences en matière de sécurité alimentaire, des catastrophes naturelles comme une inondation, la sécheresse, des tsunamis et des tremblements de terre, ainsi que des déplacements de populations et des conflits armés sont des exemples de telles situations.\n\nIl convient que les organisations dont les activités, partenaires ou autres parties prenantes se trouvent dans une zone affectée envisagent de contribuer à améliorer ces situations; elles pourraient également souhaiter le faire par simple humanité. Les organisations peuvent contribuer de diverses manières, allant des secours en cas de catastrophe aux efforts de reconstruction. En tout état de cause, il convient de traiter la souffrance humaine en portant une attention particulière aux plus vulnérables dans une situation donnée et dans la population en général que sont, par exemple, les femmes et les enfants. Il convient de respecter la dignité et les droits de toutes les victimes et de leur apporter un appui.\n\nDans des situations de crise, il importe d'avoir une réponse coordonnée; il est donc important de travailler avec les autorités publiques et, le cas échéant, avec les organisations humanitaires internationales et autres entités appropriées."
    4_prefix: "6.8.3"
    4_label: "Communautés et développement local  Domaine d'action 1: Implication auprès des communautés"
    4_desc: "Description du domaine d'action:\nL'implication auprès des communautés est le travail de proximité proactif d'une organisation vis-à-vis de la communauté. Il vise à prévenir et à résoudre les problèmes, à favoriser les partenariats avec des organisations et des parties prenantes locales et à avoir un comportement citoyen/responsable vis-à-vis de la communauté. Il ne remplace pas la nécessité d'assumer la responsabilité des impacts sur la société et l'environnement. Les organisations apportent leur contribution à leurs communautés en étant membres d'institutions civiles et en les appuyant ainsi qu'en s'impliquant dans des réseaux de groupes et d'individus constituant la société civile.\nL'implication auprès des communautés aide également les organisations à se familiariser avec les besoins et les priorités de la communauté de manière à ce que les efforts de l'organisation en matière de développement et autres soient compatibles avec ceux de la communauté et de la société. Une organisation pourrait s'impliquer, par exemple, en participant à des forums organisés par les autorités locales et des associations de résidents ou en créant des forums de ce type.\nCertaines communautés traditionnelles ou autochtones, associations de voisinage ou réseaux Internet s'expriment sans constituer une «organisation» formelle. Il convient qu'une organisation soit consciente du fait qu'il existe de nombreux types de groupes, formels et informels, qui peuvent contribuer au développement. Il convient qu'une organisation respecte les droits culturels, sociaux et politiques de ces groupes.\nIl est important que les actions menées en faveur des communautés respectent le principe de légalité et les processus participatifs qui respectent les droits et les idées des autres quant à l'expression et à la défense de leurs intérêts.\n\n\nActions et attentes associées :\nIl convient que l'organisation:\n\t\t- consulte les groupes représentatifs de la communauté pour déterminer les priorités en matière d'investissement dans la société et d'activités de développement de la communauté. Il convient d'apporter une attention particulière aux groupes vulnérables, discriminés, marginalisés, non représentés ou sous-représentés afin de les impliquer de manière à les aider à développer leurs options et à respecter leurs droits; \n\t\t- consulte et accompagne les communautés, y compris les autochtones, en ce qui concerne les termes et conditions de développement qui les affectent. Il convient que la consultation intervienne avant le développement et repose sur des informations complètes, précises et accessibles; \n\t\t- soit présente, si c'est possible et s'il y a lieu, dans des associations locales avec l'objectif de contribuer au bien public et au développement des objectifs des communautés; \n\t\t- entretienne des relations transparentes avec les pouvoirs publics locaux et les représentants politiques, sans tentative de corruption active ou de trafic d'influence; \n\t\t- encourage les personnes à faire du bénévolat au service de la communauté et leur apporte un appui; et \n\t\t- contribue à la formulation d'une politique et à l'élaboration, à la mise en oeuvre, au contrôle et à l'évaluation de programmes de développement. Ce faisant, il convient qu'une organisation respecte les droits et les idées des autres quant à l'expression et à la défense de leurs intérêts."
    5_prefix: "6.8.4"
    5_label: "Communautés et développement local  Domaine d'action 2: Éducation et culture"
    5_desc: "Description du domaine d'action:\nL'éducation et la culture sont les fondements du développement socio-économique et font partie de l'identité de la communauté. La préservation et la promotion de la culture ainsi qu'une promotion de l'éducation compatible avec le respect des droits de l'Homme ont des impacts positifs sur la cohésion sociale et le développement social.\n\n\nActions et attentes associées :\nIl convient que l'organisation:\n\t\t- promeuve et appuie l'éducation à tous les niveaux et entame des actions destinées à améliorer la qualité de l'éducation et l'accès à l'éducation, promeuve le savoir local et participe à la suppression de l'analphabétisme; \n\t\t- promeuve, notamment, les opportunités d'apprentissage pour les groupes vulnérables et discriminés; \n\t\t- encourage l'inscription des enfants dans un établissement d'enseignement et contribue ainsi à l'élimination des barrières qui empêchent les enfants d'avoir accès à l'instruction (le travail des enfants par exemple); \n\t\t- promeuve les activités culturelles, le cas échéant, reconnaisse et valorise les cultures et traditions culturelles locales, compatibles avec le principe du respect des droits de l'Homme. Les actions destinées à appuyer les activités culturelles qui autonomisent les groupes historiquement défavorisés sont un moyen particulièrement important de combattre les discriminations; \n\t\t- envisage de faciliter l'éducation aux droits de l'Homme et la sensibilisation; \n\t\t- aider à conserver et à protéger le patrimoine culturel, notamment lorsque les activités de l'organisation peuvent avoir un impact sur ce patrimoine; et \n\t\t- le cas échéant, promeuve l'usage du savoir et des technologies traditionnelles des communautés autochtones."
    6_prefix: "6.8.5"
    6_label: "Communautés et développement local  Domaine d'action 3: Création d'emplois et développement des compétences"
    6_desc: "Description du domaine d'action:\nL'emploi est un objectif reconnu au niveau international et lié au développement socio-économique. En créant de l'emploi, toutes les organisations, grandes et petites, peuvent contribuer à la réduction de la pauvreté et à la promotion du développement socio-économique. En créant de l'emploi, il convient que les employeurs respectent les lignes directrices proposées en 6.3 et 6.4.\nLe développement des compétences est une composante essentielle de la promotion de l'emploi et de l'aide apportée aux personnes pour garantir un travail décent et productif; il est vital pour le développement socio-économique.\n\n\nActions et attentes associées:\nIl convient que l'organisation:\n\t\t- analyse l'impact de ses décisions d'investissement sur la création d'emplois et, si c'est économiquement viable, procède à des investissements directs réduisant la pauvreté par la création d'emplois; \n\t\t- étudie l'impact de ses choix technologiques sur l'emploi et, si c'est économiquement viable à long terme, choisisse des technologies qui maximisent les opportunités d'emploi; \n\t\t- étudie l'impact des décisions d'externalisation sur la création d'emploi, tant au sein de l'organisation qui prend la décision qu'au sein d'organisations extérieures affectées par ces décisions;\n\t\t- étudie les avantages que comporte la création d'emplois directs par rapport à des arrangements temporaires pour la réalisation d'un travail; \n\t\t- étudie la participation à des programmes locaux et nationaux de développement des compétences, y compris des programmes d'apprentissage, des programmes axés sur des groupes défavorisés donnés, des programmes de formation permanente et des programmes de reconnaissance et de certification des compétences; \n\t\t- étudie l'aide à apporter pour développer ou améliorer  en partenariat les programmes de développement des compétences au sein de la communauté; \n\t\t- porte une attention particulière aux groupes vulnérables en ce qui concerne l'emploi et le renforcement des capacités; et \n\t\t- étudie l'aide à apporter pour promouvoir les conditions-cadres nécessaires à la création d'emploi."
    7_prefix: "6.8.6"
    7_label: "Communautés et développement local  Domaine d'action 4: Développement des technologies et accès à la technologie"
    7_desc: "Description du domaine d'action:\nLes communautés et leurs membres ont besoin, entre autres choses, d'avoir un accès libre et sûr à la technologie moderne pour aider à promouvoir le développement socio-économique. Les organisations peuvent contribuer au développement des communautés au sein desquelles elles opèrent en leur offrant un savoir spécialisé, un savoir-faire et une technologie de manière à promouvoir le développement de leur capital humain et la diffusion des technologies.\nLes technologies de l'information et de la communication caractérisent la plus grande partie de la vie contemporaine et constituent une base valable pour de nombreuses activités économiques. L'accès à l'information est la clé permettant de surmonter les disparités qui existent entre les pays, les régions, les générations, les sexes, etc. Une organisation peut apporter sa contribution à l'amélioration de l'accès à ces technologies par la formation, des partenariats et autres actions.\n\n\nActions et attentes associées:\nIl convient que l'organisation:\n\t\t- étudie sa contribution au développement de technologies innovantes pouvant contribuer à traiter les questions sociales et environnementales dans les communautés locales; \n\t\t- étudie sa contribution au développement de technologies à faible coût, faciles à reproduire et ayant un impact très positif sur l'éradication de la pauvreté et de la faim; \n\t\t- si cela s'avère possible d'un point de vue économique, étudie la possibilité de développer le potentiel local et traditionnel en matière de savoir et de technologies tout en protégeant les droits de la communauté sur ce savoir et cette technologie; \n\t\t- étudie des partenariats avec des organisations telles que les universités ou des laboratoires de recherche afin d'améliorer le développement scientifique et technologique avec des partenaires issus de la population, et emploie la population locale pour ces travaux ; et \n\t\t- si c'est possible d'un point de vue économique, adopte des pratiques permettant le transfert et la diffusion des technologies. Le cas échéant, il convient qu'une organisation fixe des termes et des conditions raisonnables pour le transfert de licences ou de technologies de manière à contribuer au développement local. Il convient de tenir compte de la capacité de la population à gérer la technologie et de renforcer cette capacité."
    8_prefix: "6.8.7"
    8_label: "Communautés et développement local  Domaine d'action 5: Création de richesses et de revenus"
    8_desc: "Description du domaine d'action:\nDes entreprises et des coopératives compétitives et diversifiées sont un atout primordial pour la création de richesses au sein de toute communauté. Les organisations peuvent aider à créer un environnement dans lequel le soutien à la création d'entreprise peut prospérer, assurant des avantages durables aux communautés. Les organisations peuvent apporter une contribution positive à la création de richesses et de revenus sous la forme de programmes de soutien à la création d'entreprise, de développement des fournisseurs locaux et d'emploi de membres de la communauté ainsi que d'efforts plus importants pour renforcer les ressources économiques et les relations sociales qui facilitent le bien-être socio-économique ou génèrent des avantages pour la communauté. Qui plus est, en aidant à créer des richesses et des revenus au niveau local et en promouvant une répartition équilibrée des bénéfices de l'activité économique parmi les membres de la communauté, les organisations peuvent jouer un rôle important dans la réduction de la pauvreté. Les programmes de soutien à la création d'entreprise et les coopératives ciblant les femmes sont des initiatives particulièrement importantes car il est largement admis que l'autonomisation des femmes contribue grandement au bien-être de la société.\n\nLa création de richesses et de revenus dépend également de la répartition des bénéfices de l'activité économique. Les pouvoirs publics s'appuient sur les organisations respectant leurs obligations de paiement des taxes pour obtenir des revenus permettant de traiter les questions cruciales de développement.\n\nDans de nombreux cas, l'isolement physique et socio-économique des communautés peut être un obstacle à leur développement. Les organisations peuvent jouer un rôle positif dans le développement des communautés en intégrant la population locale et les groupes et organisations locaux dans leurs activités ou leur chaîne de valeur. De cette façon, des considérations en matière de développement des communautés peuvent faire partie intégrante des activités principales des organisations.\n\nUne organisation contribue au développement en se conformant à la législation et à la réglementation. Dans certains cas, ne pas opérer dans le cadre légal prévu est, pour certains groupes de la communauté, la conséquence de la pauvreté ou des conditions de développement. Il convient alors qu'une organisation intervenant avec des groupes opérant en dehors du cadre légal ait pour objectif de réduire la pauvreté et de promouvoir le développement. Il convient également qu'une organisation cherche à créer des occasions qui permettront à ces groupes de mieux se conformer à la loi et finalement de parfaitement la respecter, notamment en ce qui concerne les relations économiques.\n\n\nActions et attentes associées:\nIl convient que l'organisation:\n\t\t- étudie l'impact socio-économique d'entrer dans une communauté ou de la quitter, y compris les impacts sur les ressources de bases nécessaires pour le développement durable de la communauté; \n\t\t- étudie l'appui à apporter aux initiatives appropriées destinées à stimuler la diversification de l'activité économique existante au sein de la communauté; \n\t\t- étudie la possibilité de donner la préférence à des fournisseurs locaux de produits et services et de contribuer, si c'est possible, au développement de ces fournisseurs; \n\t\t- étudie les initiatives à prendre pour renforcer la capacité des fournisseurs locaux à contribuer à la chaîne de valeur et leurs opportunités, en portant une attention particulière aux groupes défavorisés au sein de la communauté;\n\t\t- étudie l'aide à apporter aux organisations pour opérer dans le cadre légal approprié; ISO 26000:2010(F) \n\t\t- ne s'engage dans des activités économiques avec des organisations qui, du fait de faibles niveaux de développement, ont du mal à satisfaire aux exigences légales que si: \n\t\t\t\t- le but est d'éradiquer la pauvreté; \n\t\t\t\t- les activités de ces organisations s'inscrivent dans le respect des droits de l'Homme et si l'on peut raisonnablement s'attendre à ce que ces organisations se mettent à mener leurs activités dans le cadre légal approprié;\n\t\t- envisage d'apporter sa contribution à des programmes et partenariats durables qui soutiennent les membres de la communauté, notamment les femmes et autres groupes socialement défavorisés et vulnérables, pour créer des entreprises et des coopératives, en améliorant la productivité et en promouvant le soutien à la création d'entreprise. Ces programmes peuvent, par exemple, assurer une formation en matière de planification des affaires, de commercialisation, de normes de qualité requises pour devenir fournisseur, de management et d'assistance technique, d'accès aux financements et de facilitation des joint-ventures; \n\t\t- encourage l'utilisation efficiente des ressources disponibles, y compris les soins appropriés pour les  animaux domestiques; \n\t\t- étudie les moyens appropriés de rendre les opportunités d'approvisionnement plus facilement accessibles aux organisations de la communauté y compris, par exemple, par le biais de renforcement des capacités à respecter les spécifications techniques et en fournissant des informations relatives aux opportunités d'approvisionnement; \n\t\t- envisage d'apporter son appui aux organisations et aux personnes qui fournissent les produits et services requis à la communauté, ce qui peut également générer de l'emploi local ainsi que des liens avec les marchés locaux, régionaux et urbains, lorsque c'est profitable au bien-être de la communauté; \n\t\t- étudie les moyens appropriés d'aider au développement d'associations d'entrepreneurs basés dans la communauté; \n\t\t- assume ses responsabilités en matière de taxes et fournisse aux autorités les informations nécessaires leur permettant de déterminer les taxes dues; et \n\t\t- étudie la possibilité de contribuer à la constitution de pensions et retraites pour leurs employés."
    9_prefix: "6.8.8"
    9_label: "Communautés et développement local  Domaine d'action 6: La santé"
    9_desc: "Description du domaine d'action:\nLa santé est un élément essentiel de la vie en société et elle est reconnue comme un des droits de l'Homme. Les menaces sur la santé publique peuvent avoir de graves conséquences pour les communautés et peuvent entraver leur développement. Il convient donc que toutes les organisations, grandes et petites, respectent le droit à la santé et contribuent, dans la limite de leurs moyens et s'il y a lieu, à la promotion de la santé, à la prévention des menaces pour la santé et des maladies et à l'atténuation des dommages éventuels pour la communauté (voir également 6.4.6, 6.5 et 6.7.4). Cela peut impliquer une participation à des campagnes publiques de santé. Il convient également qu'elles contribuent, dans toute la mesure du possible et s'il y a lieu, à l'amélioration de l'accès aux services de santé, en particulier en renforçant les services publics et en leur apportant un soutien. Même dans les pays où c'est le rôle de l'État de prévoir un système public de santé, toutes les organisations peuvent envisager d'apporter leur contribution à la bonne santé des communautés. Une communauté en bonne santé induit une réduction de la charge imposée au secteur public et contribue à créer un environnement économique et social sain pour toutes les organisations.\n\n\nActions et attentes associées:\nIl convient que l'organisation:\n\t\t- cherche à éliminer les conséquences néfastes sur la santé de tout processus de fabrication, produit ou service de l'organisation; \n\t\t- envisage de promouvoir la santé en contribuant, par exemple, à assurer l'accès aux médicaments et à la vaccination et en encourageant les styles de vie sains, y compris l'exercice physique et une bonne alimentation, en procédant à une détection précoce des maladies, en sensibilisant les populations aux méthodes de contraception et en déconseillant la consommation de produits et substances malsains. Il convient d'apporter une attention particulière à la nutrition des enfants; \n\t\t- envisage de sensibiliser aux menaces pour la santé ainsi qu'aux maladies graves, telles que le VIH/SIDA le cancer, les maladies cardiovasculaires, le paludisme, la tuberculose et l'obésité, et à leur prévention; et \n\t\t- envisage d'apporter une aide pour faciliter un accès universel et durable aux services essentiels de santé et à l'eau propre ainsi qu'à des installations sanitaires appropriées, comme moyen de prévenir les maladies."
    10_prefix: "6.8.9"
    10_label: "Communautés et développement local  Domaine d'action 7: Investissement dans la société"
    10_desc: "Description du domaine d'action:\nL'investissement dans la société intervient lorsque des organisations investissent leurs ressources dans des initiatives et programmes visant à améliorer les aspects sociaux de la vie de la communauté. Les projets en matière d'éducation, de formation, de culture, de soins de santé, de création de revenu, de développement de l'infrastructure, d'amélioration de l'accès à l'information ou toute autre activité susceptible de promouvoir le développement économique ou social peuvent s'inscrire parmi les différents types d'investissements sociaux.\n\nPour identifier les opportunités d'investissement dans la société, il convient qu'une organisation adapte sa contribution aux besoins et aux priorités des communautés au sein desquelles elle opère, en tenant compte des priorités fixées par les décideurs locaux et nationaux. Le partage des informations, la consultation et la négociation sont des outils utiles pour permettre une approche participative de l'identification et de la mise en oeuvre d'investissements dans la société.\n\nLes investissements dans la société n'excluent pas la philanthropie (dons, bénévolat et donations, par exemple).\nIl convient également que les organisations encouragent l'implication des communautés dans la conception et la mise en oeuvre de projets car cela peut aider les projets à survivre et à prospérer lorsque l'organisation n'est plus impliquée. Il convient que les investissements dans la société privilégient les projets qui sont viables à long terme et contribuent au développement durable.\n\n\nActions et attentes associées:\nIl convient que l'organisation:\n\t\t- tienne compte de la promotion du développement de la communauté dans la planification de projets d'investissements dans la société. Il convient que toutes les actions élargissent les opportunités offertes aux citoyens, par exemple en augmentant les achats locaux et en s'appuyant sur des ressources locales de manière à soutenir le développement local; \n\t\t- évite les actions qui perpétuent la dépendance d'une communauté vis-à-vis des activités philanthropiques, de la présence permanente ou de l'appui de l'organisation; \n\t\t- évalue ses propres initiatives liées à la communauté, élabore un rapport à l'attention de la communauté et des personnes au sein de l'organisation et identifie ce qui pourrait être amélioré; \n\t\t- envisage un partenariat avec d'autres organisations, y compris les pouvoirs publics, les entreprises ou les ONG, afin de maximiser les synergies et d'utiliser des ressources, connaissances et compétences complémentaires; et \n\t\t- envisage de participer aux programmes qui assurent l'accès à la nourriture et autres biens essentiels pour les groupes vulnérables ou discriminés et les personnes à faible revenu, en tenant compte de l'importance qu'il y a à augmenter leurs capacités, ressources et opportunités."
7:
  title: "Lignes directrices relatives à l'intégration de la responsabilité sociétale dans l'ensemble de l'organisation"
  1_label: "Généralités"
  1_desc: "Les précédents articles de la présente Norme internationale ont identifié les principes, questions centrales et domaines d'action de la responsabilité sociétale. Le présent article fournit des lignes directrices concernant la mise en pratique de la responsabilité sociétale au sein d'une organisation. Dans la plupart des cas, les organisations peuvent se reposer sur l'existence de systèmes, de politiques, de structures et de réseaux existants de l'organisation pour mettre la responsabilité sociétale en pratique, bien que certaines activités soient susceptibles d'être menées d'une manière nouvelle ou en envisageant un éventail plus large de facteurs.\n\nCertaines organisations peuvent déjà disposer de techniques bien établies pour introduire de nouvelles approches dans leurs prises de décision et activités ainsi que de systèmes efficaces de communication et de revue interne. D'autres peuvent avoir des systèmes moins bien élaborés pour la gouvernance de l'organisation ou d'autres aspects de la responsabilité sociétale. Les lignes directrices suivantes sont destinées à aider toutes les organisations à intégrer la responsabilité sociétale dans leur manière d'opérer, quel que soit leur point de départ (voir Figure 4)."
  2_label: "Relation entre les caractéristiques de l'organisation et la responsabilité sociétale"
  2_desc: "Pour apporter une base éclairée pour l'intégration de la responsabilité sociétale dans l'organisation, il est utile pour cette dernière de déterminer la façon dont ses caractéristiques-clés sont liées à la responsabilité sociétale (voir Article 5). Cette revue aidera également à déterminer les domaines d'action pertinents de la responsabilité sociétale pour chaque question centrale et à identifier les parties prenantes de l'organisation. Il convient que la revue couvre, selon le cas, des facteurs tels que:\n\t\t- le type, l'objectif, la nature des activités et la taille d'une organisation; \n\t\t- les sites où l'organisation opère, y compris: \n\t\t\t\t- le fait de savoir s'il existe un cadre juridique solide qui réglemente nombre des décisions et activités liées à la responsabilité sociétale; et \n\t\t\t\t- les caractéristiques sociales, environnementales et économiques de la zone dans laquelle l'organisation opère;\n\t\t- toute information relative aux performances historiques de l'organisation en matière de responsabilité sociétale; \n\t\t- les caractéristiques des effectifs ou des employés de l'organisation, y compris le travail sous contrat;\n\t\t- les organisations sectorielles dans lesquelles l'organisation intervient, y compris: \n\t\t\t\t- les activités liées à la responsabilité sociétale mises en uvre par ces organisations; et \n\t\t\t\t- les codes ou autres exigences liés à la responsabilité sociétale et appuyés par ces organisations;\n\t\t- la mission, la vision, les valeurs, les principes et le code de conduite propres à l'organisation; \n\t\t- les préoccupations des parties prenantes internes et externes liées à la responsabilité sociétale; \n\t\t- les structures et la nature de la prise de décision au sein de l'organisation; et \n\t\t- la chaîne de valeur de l'organisation.\nIl est également important pour une organisation d'être à l'écoute des attitudes actuelles, du niveau d'engagement de sa direction dans la responsabilité sociétale et de sa perception de cette responsabilité sociétale. Une compréhension approfondie des principes, questions centrales et avantages de la responsabilité sociétale sera d'une grande aide pour son intégration dans l'ensemble de l'organisation et dans sa sphère d'influence."
  3:
    title: "Appréhender la responsabilité sociétale de l'organisation"
    1_prefix: "7.3.1"
    1_label: "Devoir de vigilance"
    1_desc: "Le devoir de vigilance dans le contexte de la responsabilité sociétale est une démarche globale et proactive d'identification, visant à éviter ou atténuer les impacts négatifs sociaux, environnementaux et économiques réels et potentiels, qui résultent des décisions et activités d'une organisation.\n\nLe devoir de vigilance peut également conduire à influencer le comportement des autres, lorsque l'on constate que ceux-ci sont à l'origine de violations des droits de l'Homme ou autres violations, dans lesquelles l'organisation pourrait être compromise.\n\nDans tout processus lié au devoir de vigilance, il convient que l'organisation tienne compte du contexte propre au pays dans lequel elle opère ou dans lequel ont lieu ses activités; des impacts potentiels ou réels induits par ses propres activités; et du risque de conséquences négatives résultant des actions menées par d'autres entités ou personnes dont les activités sont étroitement liées aux siennes.\n\nDans la mise en uvre du devoir de vigilance, il convient que l'organisation intègre les éléments suivants en fonction de sa taille et des circonstances:\n\t\t- une politique de l'organisation liée à la question centrale concernée qui fournisse des lignes directrices à ceux qui font partie de l'organisation et à ceux qui entretiennent des relations étroites avec elle; \n\t\t- un moyen d'évaluer comment des activités proposées ou déjà existantes peuvent avoir une incidence sur les objectifs de la politique; \n\t\t- un moyen d'intégrer les questions centrales de la responsabilité sociétale dans l'ensemble de l'organisation; \n\t\t- un moyen permettant d'effectuer un suivi des performances dans le temps afin qu'il soit possible de procéder aux ajustements devant être apportés aux priorités et à l'approche définie; et \n\t\t- des actions appropriées destinées à traiter les impacts négatifs de ses décisions et activités.\nLorsqu'une organisation identifie les champs d'action potentiels, il convient qu'elle s'attache à bien appréhender les défis et dilemmes du point de vue des individus et des groupes qui peuvent être lésés.\n\nParallèlement à cette auto-évaluation, une organisation peut constater que, dans certains cas, il est à la fois possible et approprié de chercher à influencer le comportement d'autres entités en vue d'améliorer leurs performances en matière de responsabilité sociétale, notamment de celles avec lesquelles elle entretient des liens étroits; ce peut également être le cas lorsque l'organisation estime que les domaines d'action sont particulièrement contraignants ou adaptés à sa situation. Au fur et à mesure que l'organisation gagne de l'expérience dans l'amélioration des performances de responsabilité sociétale, elle peut gagner en capacité et en volonté d'intervenir avec d'autres entités pour prôner cet objectif."
    2_prefix: "7.3.2.1"
    2_label: "Déterminer la pertinence et l'importance des questions centrales et des domaines d'action pour l'organisation - Déterminer la pertinence"
    2_desc: "Toutes les questions centrales sont pertinentes pour chacune des organisations, mais pas nécessairement tous les domaines d'action. Il convient que l'organisation passe en revue toutes les questions centrales pour identifier les domaines d'action importants.\nPour démarrer le processus d'identification, il convient, le cas échéant, qu'une organisation:\n\t\t- dresse la liste de toute la gamme de ses activités; \n\t\t- identifie les parties prenantes (voir 5.3); \n\t\t- identifie les activités de l'organisation elle-même et celles des autres organisations dans sa sphère d'influence. Les décisions et activités des fournisseurs et des sous-traitants peuvent avoir un impact sur la responsabilité sociétale de l'organisation; \n\t\t- détermine les questions centrales et les domaines d'action susceptibles d'apparaître lorsque l'organisation elle-même et d'autres organisations dans sa sphère d'influence et/ou sur sa chaîne de valeur exercent ces activités, en tenant compte de la totalité de la législation en vigueur; \n\t\t- examine de quelles façons les décisions et les activités de l'organisation peuvent avoir des conséquences sur les parties prenantes et le développement durable; \n\t\t- examine de quelles façons les parties prenantes et les domaines d'action de la responsabilité sociétale peuvent avoir des conséquences sur les décisions, les activités et les projets de l'organisation; et \n\t\t- identifie tous les domaines d'action en matière de responsabilité sociétale qui sont liés aux activités quotidiennes ainsi que ceux qui ne sont qu'occasionnels dans des circonstances très particulières.\n\nBien qu'une organisation elle-même puisse penser appréhender sa responsabilité sociétale (voir 5.2.3), il convient qu'elle envisage néanmoins d'impliquer les parties prenantes dans le processus d'identification afin d'élargir la compréhension de ces questions centrales et domaines d'action. Il est cependant important de reconnaître que des domaines d'action peuvent être pertinents, même si les parties prenantes ne les ont pas identifiés.\n\nDans certains cas, une organisation pourrait assumer le fait que, étant donné qu'elle opère dans un secteur soumis à une législation qui traite des questions centrales de responsabilité sociétale, la conformité à la loi sera suffisante pour garantir que tous les domaines d'action pertinents de ces questions centrales sont abordés. Une analyse approfondie des questions centrales et domaines d'action mentionnés à l'Article 6 peut toutefois révéler que certains domaines d'action pertinents ne sont pas réglementés ou sont couverts par des réglementations qui ne sont pas correctement respectées ou ne sont pas explicitement ou suffisamment détaillées.\n\nMême dans le cas de questions centrales ou domaines d'action traités par la législation, se conformer à l'esprit de la loi peut, dans certains cas, impliquer une action allant au-delà du simple respect de la loi. À titre d'exemple, bien que certaines lois et réglementations environnementales limitent les émissions de polluants de l'air ou de l'eau à des quantités ou à des niveaux spécifiques, il convient qu'une organisation mette en oeuvre des bonnes pratiques pour réduire encore ses émissions de ces polluants ou remplacer les procédés qu'elle emploie afin d'éliminer totalement ces émissions. À titre d'autres exemples, citons une école qui décide volontairement de réutiliser l'eau de pluie à des fins sanitaires et un hôpital qui pourrait décider, non seulement de se conformer à la législation en ce qui concerne ses relations et conditions de travail, mais également de lancer un programme spécial visant à permettre à son personnel d'équilibrer vie professionnelle et vie personnelle."
    3_prefix: "7.3.2.2"
    3_label: "Déterminer l'importance"
    3_desc: "Après avoir identifié le large éventail des domaines d'action liés à ses décisions et activités, il convient qu'une organisation étudie avec soin ceux qui ont été identifiés et élabore un ensemble de critères lui permettant de décider des domaines d'action qui sont les plus pertinents et qui ont le plus d'importance pour elle. De tels critères peuvent comprendre:\n\t\t- l'étendue de l'impact du domaine d'action sur les parties prenantes et sur le développement durable; \n\t\t- l'effet potentiel de l'action entreprise ou de l'absence d'action sur le domaine d'action; \n\t\t- le niveau d'implication des parties prenantes quant au domaine d'action; et \n\t\t- l'identification des attentes sociétales d'un comportement responsable concernant ces impacts.\n\nLes domaines d'action généralement considérés comme significatifs sont la non-conformité à la législation, la non-prise en compte des normes internationales de comportement, les violations potentielles des droits de l'Homme, les pratiques susceptibles de mettre en danger la vie ou la santé et les pratiques qui pourraient nuire sérieusement à l'environnement."
    4_prefix: "7.3.3.1"
    4_label: "Sphère d'influence d'une organisation - Évaluer la sphère d'influence de l'organisation"
    4_desc: "L'influence d'une organisation trouve sa source par exemple dans:\n\t\t- la propriété et la gouvernance: Cela inclut la nature et l'étendue de la propriété ou de la représentation éventuelle au niveau de l'organe directeur de l'organisation associée; \n\t\t- la relation économique: Cela inclut l'étendue de la relation économique et l'importance relative de cette relation pour chaque organisation; plus grande est l'importance pour une organisation, plus grande pourra être sa capacité d'influencer l'autre organisation; \n\t\t- l'autorité juridique/politique: Elle repose, par exemple, sur des dispositions de contrats en vigueur ou sur l'existence d'un mandat juridique accordant à l'organisation la capacité d'imposer certains comportements à d'autres; et \n\t\t- l'opinion publique: Cela inclut la capacité de l'organisation à influencer l'opinion publique et l'impact de cette dernière sur ceux que l'organisation essaie d'influencer.\nL'influence d'une organisation peut dépendre d'un certain nombre de facteurs, dont la proximité physique, le domaine, la durée et la solidité des relations."
    5_prefix: "7.3.3.2"
    5_label: "Sphère d'influence d'une organisation - Exercer une influence"
    5_desc: "Une organisation peut, avec d'autres, exercer son influence, soit pour améliorer les impacts positifs sur le développement durable soit pour limiter le plus possible les impacts négatifs, soit pour les deux. Au moment d'évaluer sa sphère d'influence et de déterminer ses responsabilités, il convient qu'une organisation exerce son devoir de vigilance.\nEntre autres méthodes permettant d'exercer une influence, citons:\n\t\t- l'établissement de dispositions contractuelles ou de mesures d'incitation; \n\t\t- les déclarations publiques de l'organisation; \n\t\t- le dialogue avec la collectivité, des dirigeants politiques et d'autres parties prenantes; \n\t\t- la prise de décisions sur les investissements; \n\t\t- le partage des connaissances et des informations; \n\t\t- des projets menés en commun; \n\t\t- un lobbying responsable et l'utilisation des relations avec les médias; \n\t\t- la promotion de bonnes pratiques; et \n\t\t- des partenariats avec des associations, des organisations sectorielles et autres.\n\nIl convient qu'une organisation envisage les aspects environnementaux, sociaux et de gouvernance et la responsabilité sociétale des organisations avec lesquelles elle a ou cherche à avoir une relation.\n\nUne organisation peut influencer ses parties prenantes par ses décisions et ses activités, ainsi que par les informations qu'elle fournit à ses parties prenantes concernant les fondements de ces décisions et activités.\n\nIl convient qu'un comportement éthique et d'autres principes et pratiques de responsabilité sociétale guident toujours l'organisation pour exercer son influence (voir les Articles 4 et 5). Lorsqu'elle exerce son influence, il convient qu'une organisation envisage en premier lieu d'engager un dialogue dans le but de sensibiliser encore plus à la responsabilité sociétale et de favoriser l'adoption d'un comportement responsable. Si le dialogue est inefficace, il convient d'envisager d'autres actions, y compris de modifier la nature des relations.\n\nLorsqu'une organisation a un contrôle de fait sur les autres, sa responsabilité à agir peut être semblable à la responsabilité qui existe lorsqu'elle exerce un contrôle formel.  Un contrôle de fait renvoie à des situations dans lesquelles une organisation a la capacité de dicter les décisions et activités d'une tierce partie, même lorsqu'elle ne détient pas l'autorité juridique ou formelle de le faire."
    6_prefix: "7.3.4"
    6_label: "Établir des priorités pour aborder des domaines d'action"
    6_desc: "Il convient qu'une organisation fixe des priorités d'intégration de la responsabilité sociétale dans l'organisation et ses pratiques quotidiennes, et s'engage à les suivre. Il convient d'établir des priorités parmi les domaines d'action importants et pertinents (voir 7.3.2). Il convient que les parties prenantes soient impliquées dans l'identification des priorités (voir 5.3). Les priorités sont susceptibles de varier avec le temps.\n\nIl convient que les organisations tiennent compte des éléments suivants afin de décider si une action destinée à traiter un domaine d'action constitue ou non une priorité élevée: \n\t\t- les performances actuelles de l'organisation quant au respect de la loi, aux normes internationales, aux normes internationales de comportement, à l'état de l'art et aux bonnes pratiques; \n\t\t- la possibilité que les domaines d'action aient une influence significative sur la capacité de l'organisation à atteindre des objectifs importants; \n\t\t- l'effet potentiel de l'action associée, comparé aux ressources nécessaires à la mise en oeuvre de l'action; \n\t\t- la durée pour parvenir aux résultats désirés;\n\t\t- la possibilité d'implications importantes sur les coûts, en cas d'absence de traitement rapide; et \n\t\t- la facilité et la vitesse de mise en oeuvre, qui peuvent contribuer à accroître la sensibilisation et la motivation à agir en faveur de la responsabilité sociétale au sein de l'organisation.\n\nL'ordre des priorités variera en fonction des organisations.\n\nOutre les priorités à fixer en vue d'une action immédiate, une organisation peut établir des priorités portant sur la prise en compte de domaines d'action liés aux décisions et activités qu'elle prévoit d'engager, telles que construction de bâtiments, emploi de nouveaux effectifs, engagement de sous-traitants ou collectes de fonds. Les considérations de priorité feront alors partie de la planification de ces futures activités.\n\nIl convient de revoir et de mettre à jour les priorités à intervalles adaptés à l'organisation."
  4:
    title: "Pratiques d'intégration de la responsabilité sociétale dans l'ensemble de l'organisation"
    1_prefix: "7.4.1"
    1_label: "Sensibiliser et développer les compétences en matière de responsabilité sociétale"
    1_desc: "Intégrer la responsabilité sociétale dans tous les aspects d'une organisation implique un engagement et une compréhension à tous les niveaux de l'organisation. Aux premiers stades des efforts que fait une organisation en matière de responsabilité sociétale, il convient avant tout de sensibiliser à une meilleure compréhension des aspects de la responsabilité sociétale, y compris les principes, questions centrales et domaines d'action.\n\nS'engager et appréhender: il convient que cela démarre au sommet de l'organisation. Comprendre les avantages de la responsabilité sociétale pour l'organisation peut jouer un rôle important pour déterminer  l'engagement de la Direction de l'organisation. Il convient donc que des efforts soient faits pour permettre à la Direction de l'organisation d'appréhender parfaitement les implications et les avantages de la responsabilité sociétale.\n\nCertains employés et certaines parties d'une organisation seront plus intéressés et disposés que d'autres à agir en faveur de la responsabilité sociétale. Une organisation peut juger utile de concentrer ses premiers  efforts vis à vis des parties les plus réceptives afin de démontrer les effets pratiques de la responsabilité sociétale.\n\nCréer une culture de responsabilité sociétale au sein d'une organisation peut prendre beaucoup de temps, mais avancer systématiquement et travailler à partir des valeurs et cultures existantes a été efficace dans de nombreuses organisations.\n\nDévelopper les compétences pour mettre en oeuvre des pratiques de responsabilité sociétale peut impliquer le renforcement ou le développement de compétences dans des secteurs d'activité tels que le dialogue avec les parties prenantes et en matière d'amélioration de la connaissance et de l'appréhension des questions centrales. Il convient de s'appuyer sur les connaissances et compétences des personnes dans l'organisation. Le cas échéant, il convient également que le développement des compétences et la formation des dirigeants et des travailleurs sur la chaîne d'approvisionnement s'inscrivent dans le cadre de ces efforts. Une formation spécifique peut s'avérer utile pour certains domaines d'action.\n\nAfin d'intégrer effectivement la responsabilité sociétale, une organisation peut identifier la nécessité de changements des processus de prise de décision et de gouvernance, ce qui favoriserait une plus grande liberté, autorité et motivation dans le sens de nouvelles approches et de nouvelles idées. Une organisation peut également estimer que cela nécessite de perfectionner les outils dont elle dispose en matière de surveillance et de mesure de certains aspects de ses performances.\n\nL'éducation et une formation permanente sont indispensables pour sensibiliser et développer les compétences en matière de responsabilité sociétale. À cet égard, la formation en matière de développement durable établit une nouvelle orientation pour permettre aux individus d'aborder les domaines d'action de la responsabilité sociétale en les encourageant à respecter comme il se doit les valeurs qui favorisent une action énergique et proactive."
    2_prefix: "7.4.2"
    2_label: "Définir l'orientation de l'organisation en matière de responsabilité sociétale"
    2_desc: "Les déclarations et les actions de la direction de l'organisation ainsi que l'objectif de cette dernière, ses aspirations, ses valeurs, son éthique et sa stratégie définissent l'orientation de l'organisation. Pour faire de la responsabilité sociétale un élément important et effectif du fonctionnement de l'organisation, il convient qu'elle se reflète dans ces aspects de l'organisation.\n\nIl convient qu'une organisation définisse son orientation en faisant de la responsabilité sociétale une partie intégrante de ses politiques, de sa culture d'organisation, de ses stratégies, structures et activités. Parmi les moyens d'y parvenir, citons: \n\t\t- l'intégration, dans la déclaration de la vision ou des valeurs de l'organisation, d'une référence à la façon dont elle envisage l'évolution de ses activités au regard de la responsabilité sociétale; \n\t\t- l'intégration dans ses objectifs ou dans une déclaration de mission de références spécifiques claires et concises aux aspects importants de la responsabilité sociétale, y compris les principes et domaines d'action de responsabilité sociétale, qui aident à déterminer la façon dont l'organisation opère; \n\t\t- l'adoption de codes de conduite ou de déontologie écrits qui spécifient les engagements de l'organisation vis-à-vis de la responsabilité sociétale en traduisant les principes et valeurs en déclarations relatives au comportement adapté. Il convient que ces codes reposent sur les principes de responsabilité sociétale établis à l'Article 4 et sur les lignes directrices établies à l'Article 6; \n\t\t- la prise en compte de la responsabilité sociétale comme élément-clé de la stratégie de l'organisation, en l'intégrant dans les systèmes, la politique, les processus et la prise de décision; et \n\t\t- la traduction des priorités d'action dans les questions centrales et domaines d'action en objectifs de l'organisation compatibles avec ses stratégies, processus et calendriers. Il convient que les objectifs soient spécifiques et mesurables ou vérifiables. La contribution des parties prenantes peut aider à mettre en oeuvre ce processus. Il convient que des plans détaillés permettant d'atteindre les objectifs, y compris les responsabilités, les calendriers, les budgets et les effets sur d'autres activités de l'organisation, constituent un élément important en vue de fixer les objectifs et les stratégies."
    3_prefix: "7.4.3"
    3_label: "Intégrer la responsabilité sociétale dans la gouvernance, les systèmes et processus de l'organisation"
    3_desc: "La gouvernance de l'organisation, c'est-à-dire le système permettant de prendre et de mettre en oeuvre les décisions dans la poursuite de ses objectifs, constitue un moyen important et efficace d'intégrer la responsabilité sociétale dans l'organisation.\n\nIl convient qu'une organisation gère consciencieusement et méthodiquement les impacts qu'elle génère et qui sont associés à chaque question centrale et surveille les impacts des organisations qui se trouvent dans sa sphère d'influence de manière à limiter le plus possible le risque de préjudice social et de dommage environnemental, ainsi que de maximiser les opportunités et les impacts positifs. Lors de la prise de décisions, y compris en ce qui concerne de nouvelles activités, il convient qu'une organisation envisage les conséquences probables de ces décisions sur les parties prenantes. Ce faisant, il convient qu'une organisation envisage les meilleurs moyens de limiter le plus possible les impacts néfastes de ses activités et d'accroître les effets bénéfiques de son comportement sur la société et l'environnement. Il convient de tenir compte des ressources et de la planification requis à cet effet lors de la prise de décisions.\n\nIl convient qu'une organisation confirme que les principes de responsabilité sociétale (voir Article 4), s'appliquent à sa gouvernance et se reflètent dans sa structure et sa culture. Il lui est recommandé de revoir ses procédures et processus à intervalles appropriés afin de s'assurer qu'ils prennent bien en compte la responsabilité sociétale de l'organisation.\n\nParmi les procédures utiles, citons par exemple:\n\t\t- la garantie de pratiques de management établies pour refléter et traiter la responsabilité sociétale de l'organisation; \n\t\t- l'identification des divers modes d'application des principes de responsabilité sociétale et des questions centrales et domaines d'action aux diverses parties de l'organisation; \n\t\t- si cela convient à la taille et à la nature de l'organisation, la création de départements ou de groupes au sein de l'organisation pour revoir et réviser les procédures de fonctionnement de manière à ce qu'elles soient compatibles avec les principes et questions centrales de responsabilité sociétale; \n\t\t- la prise en compte de la responsabilité sociétale lors d'activités concernant l'organisation; et \n\t\t- l'intégration de la responsabilité sociétale dans les pratiques d'achat et d'investissement, dans la gestion du capital humain et dans d'autres fonctions de l'organisation.\n\nLes valeurs et la culture d'une organisation peuvent avoir un effet non négligeable sur la facilité et la rapidité de l'intégration complète de la responsabilité sociétale dans l'ensemble de l'organisation. Pour certaines organisations, où les valeurs et la culture sont déjà parfaitement alignées sur celles de la responsabilité sociétale, le processus d'intégration peut être très simple. Dans d'autres organisations, certains intervenants peuvent ne pas reconnaître les avantages de la responsabilité sociétale et opposer une résistance au changement. Il peut être nécessaire de faire des efforts systématiques sur une longue période vis à vis de ces intervenants pour intégrer l'approche responsabilité sociétale.\n\nIl est également important de reconnaître que le processus d'intégration de la responsabilité sociétale dans l'ensemble de l'organisation ne se déroule pas tout d'un coup, à la même vitesse, pour toutes les questions centrales et tous les domaines d'action. Il peut s'avérer utile d'élaborer un plan de traitement de certains domaines d'action de la responsabilité sociétale à court terme et d'autres à plus long terme. Il convient que ce plan soit réaliste et prenne en compte les capacités de l'organisation, les ressources disponibles et l'ordre de priorité des domaines d'action et des actions associées (voir 7.3.4)."
  5:
    title: "Communiquer sur la responsabilité sociétale"
    1_label: "Le rôle de la communication dans la responsabilité sociétale"
    1_desc: "De nombreuses pratiques liées à la responsabilité sociétale impliqueront une certaine forme de communication interne et externe. Communiquer peut être déterminant pour de nombreuses fonctions différentes en matière de responsabilité sociétale, notamment:\n\t\t- sensibiliser tant au sein de l'organisation qu'à l'extérieur en ce qui concerne ses stratégies, objectifs, plans, performances et défis en matière de responsabilité sociétale; \n\t\t- respecter les principes de responsabilité sociétale définis dans l'Article 4; \n\t\t- aider à établir le dialogue et à dialoguer avec les parties prenantes; \n\t\t- traiter les exigences juridiques et autres relatives à la diffusion des informations liées à la responsabilité sociétale; \n\t\t- montrer comment l'organisation respecte ses engagements en matière de responsabilité sociétale et répond aux intérêts des parties prenantes et aux attentes de la société en général; \n\t\t- fournir des informations concernant les impacts des activités, produits et services de l'organisation, y compris des détails sur les changements des impacts avec le temps;\n\t\t- aider à dialoguer avec les employés et autres personnes et à les motiver pour soutenir les activités de l'organisation en matière de responsabilité sociétale; \n\t\t- faciliter la comparaison avec des organisations paires, ce qui peut permettre d'améliorer encore les performances en matière de responsabilité sociétale; et \n\t\t- améliorer la réputation d'une organisation en matière d'action responsable, d'ouverture, d'intégrité et de redevabilité afin de renforcer la confiance des parties prenantes dans l'organisation."
    2_label: "Caractéristiques des informations en matière de responsabilité sociétale"
    2_desc: "Il convient que les informations fournies en matière de responsabilité sociétale soient:\n\t\t- complètes: Il convient que les informations abordent toutes les activités et impacts importants liés à la responsabilité sociétale; \n\t\t- compréhensibles: Il convient de fournir les informations en tenant compte des connaissances et du passé culturel, social, éducatif et économique des personnes concernées par la communication. Il convient que le langage utilisé et la façon de présenter la matière traitée, y compris son organisation, soient accessibles aux parties prenantes destinataires des informations; \n\t\t- réactives: Il convient que les informations correspondent aux intérêts des parties prenantes; \n\t\t- exactes: Il convient que les informations soient correctes au niveau des faits et suffisamment détaillées pour être utiles et adaptées à leur objectif; \n\t\t- équilibrées: Il convient que les informations soient équilibrées et justes et qu'elles n'omettent pas les aspects négatifs concernant les impacts des activités d'une organisation; \n\t\t- actualisées: Des informations obsolètes peuvent induire en erreur. Lorsque les informations décrivent des activités se déroulant dans un laps de temps déterminé, l'identification du laps de temps couvert permettra aux parties prenantes de comparer les performances actuelles de l'organisation avec des performances antérieures et avec les performances d'autres organisations; et \n\t\t- accessibles: Il convient que les informations relatives à des domaines d'action spécifiques soient à la disposition des parties prenantes concernées."
    3_label: "Types de communication en matière de responsabilité sociétale"
    3_desc: "Il existe de nombreux types différents de communication en matière de responsabilité sociétale. Citons, par exemple: \n\t\t- les réunions ou les conversations avec les parties prenantes; \n\t\t- la communication avec les parties prenantes sur des domaines d'action ou des projets spécifiques de responsabilité sociétale. Lorsque cela est possible et adapté, il convient que cette communication implique un dialogue avec les parties prenantes; \n\t\t- la communication entre les cadres et employés ou membres de l'organisation afin de les sensibiliser, d'une manière générale, à la responsabilité sociétale et aux activités associées et d'y apporter un appui. Cette communication est généralement plus efficace lorsqu'elle implique un dialogue; \n\t\t- des activités en équipe axées sur l'intégration de la responsabilité sociétale dans l'ensemble de l'organisation;\n\t\t- la communication avec les parties prenantes concernant des déclarations relatives à la responsabilité sociétale, liées aux activités de l'organisation. Une revue et un contrôle internes peuvent venir confirmer ces déclarations. Pour renforcer la crédibilité, un contrôle externe peut venir confirmer ces déclarations. Le cas échéant, il convient que les communications offrent des opportunités de retour d'information de la part des parties prenantes; \n\t\t- la communication avec les fournisseurs en ce qui concerne les exigences en matière d'approvisionnement liées à la responsabilité sociétale; \n\t\t- la communication au public concernant des situations de crise qui ont des conséquences sur la responsabilité sociétale. Avant une crise, il convient que la communication vise à sensibiliser encore plus et à intensifier l'alerte préventive. En cas de situation de crise, il convient d'informer en permanence les parties prenantes et de fournir des informations sur les actions appropriées; \n\t\t- la communication liée au produit, telle que l'étiquetage des produits, les informations relatives aux produits et autres informations destinées au consommateur. Des opportunités de retour d'information peuvent améliorer cette forme de communication; \n\t\t- des articles portant sur certains aspects de la responsabilité sociétale dans des magazines ou bulletins d'information destinés aux organisations paires; \n\t\t- des publicités ou autres déclarations publiques destinées à promouvoir un aspect particulier de la responsabilité sociétale; \n\t\t- des soumissions à des organismes publics ou des enquêtes publiques; et \n\t\t- l'élaboration de rapports publics périodiques offrant des opportunités de retour d'information de la part des parties prenantes (voir Encadré 15).\n\nIl existe nombre de méthodes et de moyens différents susceptibles d'être utilisés pour la communication. Citons, entre autres, réunions, événements publics, forums, rapports, bulletins d'informations, magazines, affiches, publicités, lettres, messagerie vocale, émission en direct, vidéo, sites Web, balados (diffusion audio sur Internet), blogues (forums de discussion sur Internet), notices et étiquettes. Il est également possible de communiquer par l'intermédiaire des médias sous forme de communiqués de presse, d'interviews, d'éditoriaux et d'articles.\n\nℹ️ Encadré :\nIl convient que, à intervalles appropriés, une organisation adresse aux parties prenantes concernées un rapport sur ses performances en matière de responsabilité sociétale. Un nombre croissant d'organisations établissent périodiquement un rapport destiné à leurs parties prenantes sur leurs performances en matière de responsabilité sociétale. Ce rapport aux parties prenantes peut se faire de différentes façons, y compris lors de réunions avec les parties prenantes, sous forme de lettres décrivant les activités de l'organisation en matière de responsabilité sociétale pour une période définie, d'informations sur un site Web et de rapports périodiques concernant la responsabilité sociétale.\nDans ces rapports aux parties prenantes, il convient qu'une organisation intègre des informations portant sur ses objectifs et ses performances en matière de questions centrales et domaines d'action pertinents de responsabilité sociétale. Il convient qu'elle décrive comment et quand les parties prenantes ont été impliquées dans l'élaboration du rapport sur la responsabilité sociétale.\nIl convient que l'organisation présente une image complète et juste des performances en matière de responsabilité sociétale, y compris les réalisations et les carences ainsi que les moyens de traiter ces carences.\nUne organisation peut choisir de couvrir ses activités dans leur ensemble à un moment donné ou d'élaborer un rapport distinct sur ses activités à un emplacement ou sur un site particulier. Les groupes de communautés estiment souvent que les rapports plus limités concernant un emplacement spécifique sont plus utiles qu'un rapport à l'échelle de l'organisation toute entière.\nLa publication d'un rapport sur la responsabilité sociétale peut constituer un aspect positif des activités d'une organisation en matière de responsabilité sociétale. Pour préparer un rapport sur la responsabilité sociétale, il convient qu'une organisation prenne en compte les considérations suivantes: \n\t\t- il convient que le domaine et l'échelle du rapport d'une organisation soient adaptés à la taille et à la nature de l'organisation; \n\t\t- le niveau de détail peut refléter l'étendue de l'expérience qu'a l'organisation de l'élaboration d'un tel rapport. Dans certains cas, les organisations se concentrent sur des rapports limités couvrant uniquement quelques aspects puis, au cours des années suivantes, élargissent la couverture lorsqu'elles ont plus d'expérience et disposent de données suffisantes sur lesquelles baser un rapport plus large; \n\t\t- il convient que le rapport décrive comment l'organisation a décidé des domaines d'action qu'elle compte couvrir et comment elle envisage de le faire; \n\t\t- il convient que le rapport présente les objectifs, performances opérationnelles, produits et services de l'organisation dans un contexte de développement durable; et \n\t\t- un rapport peut se présenter sous diverses formes, en fonction de la nature de l'organisation et des besoins de ses parties prenantes. Il peut s'agir, entre autres, de l'enregistrement électronique d'un rapport, de versions interactives sur le Web ou de copies papier. Il peut également s'agir d'un document isolé ou d'une partie du rapport annuel d'une organisation.\nLes initiatives et outils en matière d'élaboration de rapport (au niveau mondial, national ou sectoriel) de l'Annexe A (voir également 7.8 les lignes directrices en matière d'évaluation des initiatives) peuvent fournir des informations supplémentaires concernant l'élaboration d'un rapport sur la responsabilité sociétale."
    4_label: "Dialogue avec les parties prenantes en matière de communication sur la responsabilité sociétale"
    4_desc: "En dialoguant avec ses parties prenantes, une organisation peut bénéficier de la réception et de l'échange directs d'informations concernant les points de vue des parties prenantes. Il convient qu'une organisation cherche à dialoguer avec ses parties prenantes pour:\n\t\t- évaluer l'adéquation et l'efficacité du contenu, des moyens de communication, de la fréquence et de la portée de la communication pour les améliorer au besoin;\n\t\t- fixer des priorités pour le contenu de la future communication; ISO 26000:2010(F) \n\t\t- garantir une vérification des informations fournies par les parties prenantes et consignées dans le rapport, si cette approche de la vérification est utilisée; et \n\t\t- identifier les bonnes pratiques."
  6:
    title: "Améliorer la crédibilité en matière de responsabilité sociétale"
    1_label: "Méthodes permettant d'améliorer la crédibilité"
    1_desc: "Il existe divers moyens permettant à une organisation d'établir sa crédibilité. L'un d'eux est le dialogue avec les parties prenantes qui est un moyen important d'améliorer la confiance dans le fait que les intérêts et les intentions de tous les participants sont bien compris. Ce dialogue permet d'établir la confiance et d'améliorer la crédibilité. Le dialogue avec les parties prenantes peut constituer la base de l'implication de ces dernières dans la vérification des déclarations d'une organisation concernant ses performances. L'organisation et les parties prenantes peuvent prendre des dispositions permettant à ces dernières de revoir périodiquement ou de surveiller d'une façon ou d'une autre certains aspects des performances d'une organisation.\n\nLa participation à des programmes de certification spécifiques peut parfois permettre d'améliorer la crédibilité en ce qui concerne certains domaines d'action. Des initiatives ont été lancées pour certifier la sécurité d'un produit ou bien certains processus ou produits, quant à leurs impacts environnementaux, aux relations et conditions de travail et autres aspects de la responsabilité sociétale. Il convient que ces programmes soient indépendants et crédibles en eux-mêmes. Dans certains cas, des organisations impliquent des parties indépendantes dans leurs activités afin d'établir leur crédibilité. La création de comités consultatifs ou de comités de vérification se composant de personnes choisies parce qu'elles sont crédibles en est un exemple.\n\nLes organisations rejoignent parfois des associations d'organisations paires afin de mettre en place ou de promouvoir un comportement responsable dans leur domaine d'activité ou au sein de leurs communautés respectives.\n\nLes organisations peuvent améliorer leur crédibilité en prenant des engagements pertinents quant à leurs impacts, en menant des actions adaptées, en évaluant les performances et en élaborant un rapport sur les progrès et les résultats."
    2_label: "Améliorer la crédibilité des rapports et des déclarations en matière de responsabilité sociétale"
    2_desc: "Il existe de nombreuses façons d'améliorer la crédibilité des rapports et déclarations en matière de responsabilité sociétale. Entre autres:\n\t\t- rédiger des rapports sur les performances obtenues en matière de responsabilité sociétale, rapports comparables au fil du temps ainsi qu'avec ceux rédigés par des organisations paires, en reconnaissant que la nature du rapport dépendra du type, de la taille et des capacités de l'organisation; \n\t\t- fournir une brève explication de la raison de l'absence de mention de certains sujets peut également permettre de montrer que l'organisation s'est efforcée de traiter tous les sujets importants; \n\t\t- faire appel à un processus de vérification rigoureux et responsable au cours duquel on remonte à une source fiable des données et des informations afin de vérifier leur exactitude; \n\t\t- faire appel, au sein de l'organisation ou à l'extérieur, à une ou plusieurs personnes qui n'interviennent pas dans le processus de préparation du rapport, pour assurer la vérification; \n\t\t- rédiger une déclaration attestant la réalisation de la vérification et la publier dans le rapport;\n\t\t- faire appel à des groupes de parties prenantes afin d'établir que le rapport reflète les domaines d'action pertinents et importants pour l'organisation, qu'il répond aux besoins des parties prenantes et qu'il couvre totalement les domaines d'action traités; \n\t\t- prendre des dispositions particulières pour être transparent en fournissant des informations d'un type et sous une forme faciles à contrôler par d'autres. Par exemple, au lieu de se contenter de consigner des statistiques de ses performances dans le rapport, une organisation peut également donner le détail de ses sources d'information et des processus mis en uvre pour établir les statistiques. Dans certains cas, une organisation peut améliorer la crédibilité de ses déclarations concernant la chaîne d'approvisionnement en dressant la liste des endroits où ont lieu les activités; et \n\t\t- notifier la conformité aux lignes directrices établies par toute organisation extérieure en matière de rédaction de rapports."
    3_label: "Résoudre les conflits ou les désaccords entre une organisation et ses parties prenantes"
    3_desc: "Dans le cadre de ses activités en matière de responsabilité sociétale, une organisation peut se trouver confrontée à des conflits ou à des désaccords avec des parties prenantes isolées ou avec des groupes de parties prenantes. Des exemples spécifiques de types de conflits et des mécanismes permettant de les traiter sont abordés dans le contexte des droits de l'Homme (voir 6.3.6) et des questions relatives aux consommateurs (voir 6.7.6). Des méthodes formelles de résolution des conflits ou des désaccords sont également souvent intégrées dans les conventions collectives.\n\nIl convient qu'une organisation mette au point avec les parties prenantes des mécanismes de résolution des conflits ou des désaccords qui soient adaptés au type de conflit ou de désaccord en question et utiles pour les parties prenantes concernées. De tels mécanismes peuvent inclure:\n\t\t- des discussions directes avec les parties prenantes concernées; \n\t\t- la fourniture d'informations écrites permettant de traiter les malentendus; \n\t\t- des forums au cours desquels les parties prenantes et l'organisation peuvent présenter leurs points de vue respectifs et chercher des solutions; \n\t\t- des procédures formelles de traitement des réclamations; \n\t\t- des procédures de médiation ou d'arbitrage; \n\t\t- des systèmes permettant d'élaborer un rapport sur des actes préjudiciables sans crainte de mesure de rétorsion; et \n\t\t- d'autres types de procédures permettant de remédier aux atteintes.\n\nIl convient qu'une organisation assure aux parties prenantes l'accès à des informations détaillées relatives aux procédures permettant de résoudre conflits et désaccords. Il convient que ces procédures soient équitables et transparentes. Des informations plus spécifiques relatives aux procédures associées aux droits de l'Homme et aux questions relatives aux consommateurs sont présentées dans le cadre des questions centrales décrites à l'Article 6."
  7:
    title: "Revoir et améliorer les actions et pratiques de l'organisation liées à la responsabilité sociétale"
    1_label: "Généralités"
    1_desc: "L'efficacité des performances en matière de responsabilité sociétale dépend en partie de l'engagement, du soin apporté au contrôle, à l'évaluation et à la revue des activités entreprises, des progrès qui ont été faits, de la réalisation des objectifs identifiés, des ressources utilisées et d'autres aspects des efforts faits par l'organisation.\nLa surveillance ou l'observation permanente des activités liées à la responsabilité sociétale vise principalement à s'assurer que les activités se déroulent comme prévu, en identifiant toute crise ou événements anormaux et en apportant les modifications nécessaires à la façon de procéder.\nDes revues de performances, effectuées à intervalles appropriés, permettent de déterminer les progrès faits en matière de responsabilité sociétale, d'aider à bien cibler les programmes, d'identifier les domaines nécessitant des changements et de contribuer à l'amélioration des performances. Les parties prenantes peuvent jouer un rôle important dans la revue des performances d'une organisation en matière de responsabilité sociétale.\nOutre la revue des activités existantes, il convient qu'une organisation suive également l'évolution des conditions ou des attentes, les évolutions juridiques ou réglementaires affectant la responsabilité sociétale ainsi que les nouvelles opportunités d'intensifier ses efforts en matière de responsabilité sociétale. Les paragraphes suivants identifient certaines techniques que les organisations peuvent employer pour surveiller, passer en revue et améliorer leurs performances en matière de responsabilité sociétale."
    2_label: "Surveiller les activités en matière de responsabilité sociétale"
    2_desc: "Pour être confiant dans l'efficacité et l'efficience de la mise en pratique de la responsabilité sociétale par tous les membres d'une organisation, il est important de surveiller les performances en cours qui caractérisent les activités liées aux questions centrales et aux domaines d'action pertinents. L'étendue de ces efforts variera manifestement avec l'éventail des questions centrales couvertes, la taille et la nature de l'organisation et d'autres facteurs.\n\nPour décider des activités à surveiller, il convient qu'une organisation se concentre sur celles qui sont importantes et s'efforce de rendre les résultats de cette surveillance faciles à comprendre, fiables, opportuns et réactifs par rapport aux préoccupations des parties prenantes.\n\nIl existe de nombreuses méthodes différentes qui peuvent être employées pour surveiller les performances en matière de responsabilité sociétale, y compris les revues effectuées à intervalles appropriés, les évaluations comparatives et l'obtention d'un retour d'information de la part des parties prenantes. Cela permettra souvent d'éclairer les organisations sur leurs programmes en comparant leurs caractéristiques et leurs performances avec les activités d'autres organisations. Ces comparaisons peuvent mettre l'accent sur des actions liées à des questions centrales spécifiques ou sur des approches plus larges concernant l'intégration de la responsabilité sociétale dans l'ensemble de l'organisation.\n\nLa mesure par rapport à des indicateurs constitue une des méthodes les plus courantes. Un indicateur est une information qualitative ou quantitative concernant des résultats ou des effets en lien avec l'organisation; il est comparable et varie dans le temps. Les indicateurs peuvent, par exemple, servir à surveiller ou à évaluer si les objectifs d'un projet ont été atteints avec le temps. Il convient qu'ils soient clairs, informatifs, pratiques, comparables, précis, crédibles et fiables. De nombreuses références en matière de responsabilité sociétale et de développement durable donnent des détails supplémentaires exhaustifs sur le choix et l'utilisation d'indicateurs.\n\nLes indicateurs qui donnent des résultats quantitatifs sont, certes, relativement simples à utiliser; toutefois, ils peuvent ne pas être suffisants pour tous les aspects de la responsabilité sociétale. Dans le domaine des droits de l'Homme, par exemple, l'opinion des femmes et des hommes pour savoir s'ils s'estiment bien traités peut être plus éloquente que certains indicateurs quantitatifs de discrimination. Des indicateurs quantitatifs portant sur les résultats d'études ou de réunions de groupe peuvent être associés à des indicateurs qualitatifs décrivant les visions, tendances, conditions ou statuts. Il est également important de reconnaître que la responsabilité sociétale va plus loin que l'obtention de résultats spécifiques dans des activités mesurables, tels que la réduction de la pollution et le traitement des réclamations. La responsabilité sociétale reposant sur des valeurs, sur l'application de principes de responsabilité sociétale et sur des attitudes, la surveillance peut impliquer des approches plus subjectives, telles que des interviews, l'observation ainsi que d'autres techniques d'évaluation du comportement et des engagements."
    3_label: "Passer en revue les progrès et les performances d'une organisation en matière de responsabilité sociétale"
    3_desc: "En complément de la surveillance et des contrôles quotidiens des activités liées à la responsabilité sociétale, il convient qu'une organisation effectue des revues régulières pour déterminer si elle atteint ses performances au regard de ses cibles et de ses objectifs de responsabilité sociétale et d'identifier les modifications éventuelles des programmes et procédures.\n\nCes revues impliquent généralement la comparaison des performances dans les questions centrales de responsabilité sociétale avec les résultats de revues antérieures, afin de déterminer les progrès réalisés et de mesurer les réalisations par rapport aux cibles et aux objectifs. Il convient qu'elles comportent également un examen d'aspects des performances moins faciles à mesurer, tels que les attitudes vis-à-vis de la responsabilité sociétale, l'intégration de cette dernière dans l'ensemble de l'organisation et l'adhésion aux principes, déclarations de valeur et pratiques. La participation des parties prenantes à ces revues peut être précieuse.\n\nExemples de types de questions qui pourraient être posées lors de revues: \n\t\t- Est-ce que les objectifs et les cibles ont été atteints tels qu'ils avaient été envisagés? \n\t\t- Les stratégies et processus étaient-ils adaptés aux objectifs? \n\t\t- Qu'est-ce qui a marché et pourquoi? Qu'est-ce qui n'a pas marché et pourquoi? \n\t\t- Les objectifs étaient-ils appropriés? \n\t\t- Qu'est-ce qui aurait pu être mieux fait? \n\t\t- Toutes les personnes concernées ont-elles été impliquées?\n\nEn se basant sur les résultats de ses revues, il convient qu'une organisation identifie quelles modifications de ses programmes pourraient remédier à toute carence et améliorer les performances en matière de responsabilité sociétale."
    4_label: "Améliorer la fiabilité de la collecte et de la gestion des données et informations"
    4_desc: "Les organisations qui sont tenues de fournir des données de performance aux pouvoirs publics, à des organisations non gouvernementales, à d'autres organisations ou au public ou d'actualiser des bases de données contenant des informations sensibles, peuvent augmenter la confiance dans leurs systèmes de collecte et de gestion des données en procédant à des revues détaillées des systèmes. Il convient que ces revues aient pour but:\n\t\t- d'accroître la confiance d'une organisation dans l'exactitude des données qu'elle fournit à d'autres; \n\t\t- d'améliorer la crédibilité des données et informations; et \n\t\t- de confirmer la fiabilité des systèmes de protection de la sécurité et du secret des données, le cas échéant.\n\nDes exigences juridiques (ou autres) concernant la publication de données relatives aux émissions de gaz à effet de serre ou de polluants, des exigences de remise de données de programmes à des organismes de financement ou à des services de contrôle, des conditions de licences ou de permis environnementaux et des préoccupations relatives à la protection d'informations d'ordre privé (telles que données financières, médicales ou personnelles), peuvent être à l'origine de ces revues détaillées.\n\nDans le cadre de ces revues, il convient que des personnes ou des groupes de personnes indépendants, en interne ou à l'extérieur de l'organisation, étudient comment ces données sont collectées, enregistrées ou conservées, traitées et utilisées par l'organisation. Ces revues peuvent contribuer à identifier les vulnérabilités des systèmes de collecte et de gestion des données, qui risqueraient de laisser des erreurs contaminer les données ou de permettre un accès à des personnes non autorisées. Les résultats des revues peuvent aider l'organisation à renforcer et à améliorer ses systèmes. Une bonne formation des collecteurs de données, une claire attribution des responsabilités garantissant l'exactitude des données, un retour d'information direct aux personnes faisant des erreurs et des processus de qualité des données comparant les données consignées dans le rapport avec des données antérieures et des données obtenues dans des situations comparables, peuvent également améliorer l'exactitude et la fiabilité de l'information."
    5_label: "Améliorer les performances"
    5_desc: "Dans le cadre de revues périodiques ou à intervalles appropriés, il convient qu'une organisation étudie les moyens d'améliorer ses performances en matière de responsabilité sociétale. Il convient que les résultats des revues servent à obtenir une amélioration continue de la responsabilité sociétale de l'organisation. Les améliorations pourraient impliquer la modification des cibles et des objectifs afin de tenir compte de l'évolution des conditions ou de l'aspiration à de meilleurs résultats. Le domaine des activités et des programmes liés à la responsabilité sociétale pourrait être élargi. Prévoir des ressources supplémentaires ou différentes pour les activités liées à la responsabilité sociétale pourrait être une question à envisager. Les améliorations pourraient également comporter des programmes ou des activités profitant d'opportunités nouvellement identifiées.\n\nLes points de vue exprimés par les parties prenantes au cours de ces revues peuvent aider une organisation à identifier les nouvelles opportunités et l'évolution des attentes. Il convient que cela aide l'organisation à améliorer les performances de ses activités en matière de responsabilité sociétale.\n\nPour favoriser la réalisation de leurs objectifs, certaines organisations associent la concrétisation d'objectifs spécifiques de responsabilité sociétale aux revues de performances annuelles ou périodiques impliquant les cadres et dirigeants. Ces mesures soulignent que l'action de l'organisation en matière de responsabilité sociétale a vocation à être un engagement sérieux."
  8:
    title: "Initiatives volontaires en matière de responsabilité sociétale"
    1_label: "Généralités"
    1_desc: "De nombreuses organisations ont mis au point des initiatives volontaires destinées à aider d'autres organisations à mieux assumer leur responsabilité sociétale. Dans certains cas, une initiative en matière de responsabilité sociétale est en fait la création d'une organisation pour traiter expressément divers aspects de la responsabilité sociétale. Il en résulte une grande variété d'initiatives à disposition des organisations qui sont intéressées par la responsabilité sociétale. Certaines impliquent de s'unir avec d'autres organisations ou de les soutenir.\n\nCertaines de ces initiatives en matière de responsabilité sociétale traitent des aspects d'une question centrale ou d'un domaine d'action ou de plusieurs, d'autres traitant des divers moyens d'intégrer la responsabilité sociétale dans les décisions et les activités d'une organisation. Certaines créent ou promeuvent des outils spécifiques ou des guides pratiques susceptibles d'être utilisés pour intégrer la responsabilité sociétale dans une organisation. Certaines développent ou promeuvent des attentes minimales en matière de responsabilité sociétale. Ces attentes peuvent prendre de nombreuses formes, à savoir des codes de conduite, recommandations, lignes directrices, déclarations de principes et déclarations de valeur. Certaines initiatives ont été développées par différents secteurs dans un effort pour répondre à certains des défis spécifiques de leur secteur. L'existence d'une initiative en faveur de la responsabilité sociétale dans un secteur donné ne signifie pas que le secteur est nécessairement plus responsable ou potentiellement plus néfaste."
    2_label: "Le caractère volontaire de la participation"
    2_desc: "Une organisation n'a pas besoin de participer à l'une de ces initiatives en matière de responsabilité sociétale ou d'utiliser l'un de ces outils pour assumer sa responsabilité sociétale. De plus, la participation à une initiative ou l'utilisation des outils d'une initiative ne constitue pas en soi un indicateur fiable de la responsabilité sociétale d'une organisation. Lorsqu'elle évalue des initiatives de responsabilité sociétale, il convient que l'organisation soit consciente du fait que toutes les initiatives ne sont pas bien vues ou crédibles aux yeux des parties prenantes. Il convient également que l'organisation détermine objectivement si une initiative donnée l'aidera à traiter sa responsabilité sociétale et s'il s'agit, avant tout, d'une forme de relations publiques ou d'un moyen de protéger la réputation de ses membres ou d'organisations participantes. Il convient de ne pas traiter la responsabilité sociétale uniquement comme une forme de gestion du risque. Lors de l'évaluation d'une initiative de responsabilité sociétale, le fait de savoir si elle réinterprète unilatéralement des attentes déjà établies et reconnues de comportement responsable constitue un élément particulièrement important à prendre en compte.\n\nUn dialogue effectif avec les parties prenantes et des systèmes de gouvernance et de développement multiparties prenantes sont des caractéristiques-clés distinguant certaines initiatives de responsabilité sociétale d'autres, reconnaissant que les initiatives élaborées pour un seul secteur ou type d'organisation peuvent avoir des structures de gouvernance mono partie prenante. Il convient de considérer si l'initiative a été développée avec la contribution et l'engagement des organisations concernées et des parties prenantes susceptibles d'être touchées par cette initiative.\n\nUne organisation peut juger utile de participer à une ou plusieurs initiatives de responsabilité sociétale ou d'en utiliser les outils. Il convient que cette participation aboutisse, d'une manière ou d'une autre, à une action concrète au sein de l'organisation: obtenir un appui ou apprendre des autres, par exemple. La participation peut être tout particulièrement utile lorsqu'une organisation commence à recourir à des outils ou à toute autre aide  opérationnelle accompagnant cette initiative.\n\nLes organisations peuvent recourir à des initiatives de responsabilité sociétale pour rechercher une forme de reconnaissance. Certaines initiatives de responsabilité sociétale sont largement reconnues comme constituant une base crédible de reconnaissance publique de performances ou de conformité en ce qui concerne des pratiques ou des domaines d'action spécifiques. L'appui opérationnel apporté par ces initiatives de responsabilité sociétale peut se traduire par des outils allant de l'auto-évaluation à une vérification par tierce partie."
    3_label: "Considérations"
    3_desc: "Pour déterminer si elle va participer à une initiative de responsabilité sociétale ou y recourir, il convient qu'une organisation envisage les facteurs suivants:\n\t\t- savoir si l'initiative est compatible avec les principes décrits à l'Article 4; \n\t\t- savoir si l'initiative fournit une aide opérationnelle et valable pour aider l'organisation à aborder une question centrale ou un domaine d'action particulier, et/ou à intégrer la responsabilité sociétale dans l'ensemble de ses activités; \n\t\t- savoir si l'initiative est conçue pour ce type particulier d'organisation ou les secteurs qui l'intéressent; \n\t\t- savoir si l'initiative est applicable au niveau local ou régional ou si elle a une portée mondiale et si elle s'applique à tous les types d'organisations; \n\t\t- savoir si l'initiative aidera l'organisation à toucher des groupes spécifiques de parties prenantes; \n\t\t- le type de l'organisation ou des organisations qui ont élaboré et gèrent l'initiative, tels que les pouvoirs publics, une ONG, le monde du travail, le secteur privé ou le monde universitaire; \n\t\t- la réputation de l'organisation ou des organisations qui ont élaboré et gèrent l'initiative, en étudiant leur crédibilité et leur intégrité; \n\t\t- la nature du processus d'élaboration et de gestion de l'initiative (par exemple, savoir si l'initiative est élaborée ou gérée en suivant un processus transparent, ouvert et accessible multi-parties prenantes et comportant la participation de pays développés et en développement); et \n\t\t- l'accessibilité de l'initiative, par exemple savoir si une organisation a besoin de signer un contrat ou de payer pour participer à l'initiative.\n\nLors de l'évaluation de ces facteurs et d'autres, il convient qu'une organisation fasse preuve de prudence sur la façon d'interpréter les résultats. Par exemple, une large acceptation de l'initiative peut être une indication de sa faisabilité, de sa valeur, de sa réputation ou de sa pertinence quoiqu'elle puisse également être symptomatique d'exigences manquant de sévérité.  Au contraire, une initiative nouvelle et moins répandue avec une faisabilité et une valeur qui n'a pas encore fait ses preuves peut se révéler plus innovante ou stimulante. De plus, une initiative disponible gratuitement peut sembler attirante; toutefois, une initiative disponible contre paiement peut être plus susceptible d'être mise à jour et donc, rester valable sur le long terme. Il convient donc de ne pas considérer comme une indication du mérite d'une initiative ou d'un outil donné le fait qu'il soit disponible gratuitement ou contre paiement. \n\nIl est important de revoir périodiquement la valeur, la pertinence et/ou l'applicabilité de toute initiative sélectionnée."
    4_label: "Notes relatives à l'Annexe A "
    4_desc: "L'Annexe A présente une liste non exhaustive des initiatives volontaires et des outils de responsabilité sociétale. Ces initiatives et ces outils ont été identifiés par les experts du groupe de travail de l'ISO 26000 au cours de l'élaboration de la présente Norme internationale, en utilisant un ensemble spécifique de critères décrits dans l'Annexe A. Ces critères ne constituent pas un jugement de l'ISO quant à la valeur ou à l'efficacité de l'une des initiatives ou de l'un des outils de responsabilité sociétale énumérés dans l'Annexe A. De plus, le fait de mentionner une initiative ou un outil de responsabilité sociétale dans cette Annexe A n'implique pas une forme quelconque d'approbation par l'ISO de cette initiative ou de cet outil. Des caractéristiques importantes de l'initiative qui n'ont pas pu être objectivement mesurées dans le cadre du domaine d'application de la présente Norme internationale, telles que l'efficacité, la crédibilité, la légitimité et la représentativité, ne sont pas abordées ici. Il convient que ceux qui envisagent de participer à une initiative ou d'utiliser un outil évaluent directement ces caractéristiques. L'Encadré 16 contient des lignes directrices concernant d'autres aspects importants à prendre en compte lorsque l'on participe à des initiatives.\n\n ℹ️Encadré : Initiatives certifiables et initiatives liées aux intérêts commerciaux ou économiques\nCertaines initiatives de responsabilité sociétale énumérées à l'Annexe A (mais pas toutes) comportent la possibilité d'une certification par des tierces parties indépendantes. Dans certains cas, la certification est exigée pour concrétiser l'initiative. Il convient de ne pas considérer comme une indication de la valeur d'une initiative le fait qu'elle comporte la possibilité d'être certifiée ou que la certification est exigée. La mise en oeuvre de l'un des outils ou de l'une des initiatives mentionné dans l'Annexe A  y compris celles qui entraînent une certification  ne peut pas être utilisée comme une déclaration de conformité à l'ISO 26000 ou pour démontrer son adoption ou sa mise en oeuvre.\n\nQu'ils soient élaborés par des organisations «à but lucratif» ou «à but non lucratif», certaines initiatives ou certains outils sont liés à des intérêts commerciaux ou économiques, impliquant un paiement pour utilisation, une cotisation ou le paiement de services de vérification ou de certification. Utiliser une initiative ou un outil pour promouvoir un produit ou une organisation est un autre exemple de ce lien commercial. L'existence de tels intérêts n'est pas en soi un aspect négatif d'une initiative de responsabilité sociétale; ces intérêts pourraient, par exemple, être nécessaires pour permettre à l'organisation gérant l'initiative ou l'outil de couvrir ses frais et ses activités ou ils pourraient constituer un moyen légitime d'informer les parties prenantes des caractéristiques pertinentes d'un produit ou d'une organisation. Lors de l'évaluation d'une initiative ou d'un outil lié à de tels intérêts, il convient toutefois que l'utilisateur de la présente Norme internationale tienne compte de ces intérêts commerciaux associés et d'éventuels conflits d'intérêt. Par exemple, une organisation gérant une initiative de responsabilité sociétale peut privilégier indûment l'obtention de revenus de certifications, au détriment de l'exactitude de la vérification des exigences d'une telle certification. Il est donc particulièrement important d'évaluer la crédibilité des organisations gérant des initiatives ou des outils lorsque ces initiatives ou ces outils sont liés à des intérêts commerciaux ou économiques."
