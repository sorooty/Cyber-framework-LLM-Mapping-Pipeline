5:
  title: "Gouvernance et organisation"
  1_desc: "Les entités financières doivent disposer d'un cadre de gouvernance et de contrôle interne pour une gestion efficace et prudente du risque lié aux TIC."
  2_desc: "L'organe de direction de l'entité financière doit définir, approuver, superviser et être responsable de la mise en œuvre du cadre de gestion du risque lié aux TIC."
  3:
    title: "L'organe de direction doit :"
    1_desc: "Assumer la responsabilité ultime de la gestion du risque lié aux TIC."
    2_desc: "Mettre en place des stratégies pour maintenir des normes élevées de disponibilité, d'authenticité, d'intégrité et de confidentialité des données."
    3_desc: "Définir clairement les rôles et responsabilités pour toutes les fonctions liées aux TIC."
    4_desc: "Assumer la responsabilité globale de la définition et de l'approbation de la stratégie de résilience opérationnelle numérique."
    5_desc: "Approuver, superviser et examiner périodiquement la politique de continuité des activités de TIC et les plans de réponse et de rétablissement des TIC."
    6_desc: "Approuver et examiner périodiquement les plans d'audit des TIC."
    7_desc: "Allouer et réexaminer périodiquement le budget approprié pour la résilience opérationnelle numérique."
    8_desc: "Approuver et examiner périodiquement la politique concernant les modalités d'utilisation des services TIC fournis par des prestataires tiers."
  4_desc: "Les entités financières, autres que les microentreprises, doivent instituer un rôle de suivi des accords conclus avec des prestataires tiers de services TIC."
  5_desc: "Les membres de l'organe de direction doivent maintenir à jour des connaissances et des compétences suffisantes pour comprendre et évaluer le risque lié aux TIC."
6:
  title: "Cadre de gestion du risque lié aux TIC"
  1_desc: "Les entités financières doivent disposer d'un cadre de gestion du risque lié aux TIC solide, complet et bien documenté."
  2_desc: "Le cadre doit englober les stratégies, politiques, procédures, protocoles et outils de TIC nécessaires pour protéger tous les actifs informationnels et de TIC."
  3_desc: "Les entités financières doivent réduire l'impact du risque lié aux TIC en déployant des stratégies, politiques, procédures, protocoles et outils de TIC adéquats."
  4_desc: "Les entités financières, autres que les microentreprises, doivent confier la responsabilité de la gestion et de la surveillance du risque lié aux TIC à une fonction de contrôle indépendante."
  5_desc: "Le cadre de gestion du risque lié aux TIC doit être documenté et réexaminé au moins une fois par an."
  6_desc: "Le cadre doit faire l'objet d'audits internes réguliers pour les entités financières autres que les microentreprises."
  7_desc: "Le cadre doit comprendre une stratégie de résilience opérationnelle numérique qui définit les méthodes pour parer au risque lié aux TIC."
  8_desc: "Les entités financières peuvent définir une stratégie multi-fournisseurs en matière de TIC."
  9_desc: "Les entités financières peuvent externaliser les tâches de vérification du respect des exigences en matière de gestion du risque lié aux TIC, tout en restant pleinement responsables."
7:
  title: "Systèmes, protocoles et outils de TIC"
  1:
    title: "Les entités financières doivent utiliser et tenir à jour des systèmes, protocoles et outils de TIC qui sont :"
    1_desc: "Adaptés à l'ampleur de leurs opérations."
    2_desc: "Fiables."
    3_desc: "Équipés d'une capacité suffisante pour traiter les données avec exactitude et en temps utile."
    4_desc: "Suffisamment résilients sur le plan technologique pour répondre aux besoins supplémentaires en situation de tensions sur les marchés ou dans d'autres situations défavorables."
8:
  title: "Identification"
  1_desc: "Les entités financières doivent identifier, classer et documenter toutes les fonctions, rôles et responsabilités s'appuyant sur les TIC."
  2_desc: "Elles doivent identifier de manière continue toutes les sources de risque lié aux TIC."
  3_desc: "Les entités financières, autres que les microentreprises, doivent procéder à une évaluation des risques lors de modifications importantes de l'infrastructure du réseau et du système d'information."
  4_desc: "Les entités financières doivent identifier tous les actifs informationnels et actifs de TIC, y compris ceux situés sur des sites extérieurs."
  5_desc: "Elles doivent identifier et documenter tous les processus qui dépendent de prestataires tiers de services TIC."
  6_desc: "Les entités financières doivent tenir et mettre à jour des inventaires pertinents."
  7_desc: "Les entités financières, autres que les microentreprises, doivent procéder régulièrement à une évaluation spécifique du risque lié aux TIC sur tous les systèmes de TIC hérités."
9:
  title: "Protection et prévention"
  1_desc: "Les entités financières doivent assurer un suivi et un contrôle permanents de la sécurité et du fonctionnement des systèmes et outils de TIC."
  2_desc: "Elles doivent concevoir, acquérir et mettre en œuvre des stratégies, politiques, procédures, protocoles et outils de sécurité de TIC."
  3:
    title: "Les entités financières doivent utiliser des solutions et des processus de TIC qui :"
    1_desc: "Garantissent la sécurité des moyens de transfert de données."
    2_desc: "Réduisent au minimum le risque de corruption ou de perte de données."
    3_desc: "Empêchent le manque de disponibilité, les atteintes à l'authenticité et à l'intégrité, les violations de la confidentialité et la perte de données."
    4_desc: "Garantissent que les données sont protégées contre les risques de gestion des données."
  4:
    title: "Les entités financières doivent :"
    1_desc: "Élaborer et documenter une politique de sécurité de l'information."
    2_desc: "Instaurer une gestion solide des réseaux et des infrastructures."
    3_desc: "Mettre en œuvre des politiques limitant l'accès physique ou logique aux actifs informationnels et aux actifs de TIC."
    4_desc: "Mettre en œuvre des politiques et des protocoles pour des mécanismes d'authentification forte."
    5_desc: "Mettre en œuvre des politiques, procédures et contrôles documentés pour la gestion des changements dans les TIC."
    6_desc: "Disposer de stratégies documentées appropriées et globales en matière de correctifs et de mises à jour."
10:
  title: "Détection"
  1_desc: "Les entités financières doivent mettre en place des mécanismes permettant de détecter rapidement les activités anormales."
  2_desc: "Ces mécanismes de détection doivent être régulièrement testés."
  3_desc: "Les mécanismes doivent permettre la mise en place de plusieurs niveaux de contrôle et définir des seuils d'alerte."
  4_desc: "Les entités financières doivent consacrer des ressources et des capacités suffisantes pour surveiller l'activité des utilisateurs et les anomalies liées aux TIC."
  5_desc: "Les prestataires de services de communication de données doivent disposer de systèmes capables de vérifier l'exhaustivité des déclarations de transactions."
11:
  title: "Réponse et rétablissement"
  1_desc: "Les entités financières doivent se doter d'une politique de continuité des activités de TIC complète."
  2_desc: "Elles doivent mettre en œuvre cette politique au moyen de dispositifs, plans, procédures et mécanismes spécifiques."
  3_desc: "Les entités financières doivent mettre en œuvre des plans de réponse et de rétablissement des TIC."
  4_desc: "Elles doivent mettre en place, maintenir et tester périodiquement des plans de continuité des activités de TIC."
  5_desc: "Les entités financières doivent procéder à une analyse des incidences sur les activités de leurs expositions à de graves perturbations."
  6_desc: "Elles doivent tester les plans de continuité des activités de TIC et les plans de réponse et de rétablissement des TIC au moins une fois par an."
  7_desc: "Les entités financières doivent réexaminer régulièrement leur politique de continuité des activités de TIC et leurs plans de réponse et de rétablissement des TIC."
  8_desc: "Les entités financières, autres que les microentreprises, doivent disposer d'une fonction de gestion de crise."
  9_desc: "Les entités financières doivent tenir un registre des activités avant et pendant les perturbations."
  10_desc: "Les dépositaires centraux de titres doivent fournir aux autorités compétentes des copies des résultats des tests de continuité des activités de TIC."
  11_desc: "Les entités financières, autres que les microentreprises, doivent communiquer aux autorités compétentes une estimation des coûts et pertes annuels agrégés occasionnés par des incidents majeurs liés aux TIC."
12:
  title: "Politiques et procédures de sauvegarde, procédures et méthodes de restauration et de rétablissement"
  1_desc: "Les entités financières doivent définir et documenter des politiques et procédures de sauvegarde, ainsi que des procédures et méthodes de restauration et de rétablissement."
  2_desc: "Elles doivent mettre en place des systèmes de sauvegarde qui peuvent être activés conformément à ces politiques et procédures."
  3_desc: "Les entités financières doivent utiliser des systèmes de TIC séparés physiquement et logiquement du système de TIC source pour la restauration des données de sauvegarde."
  4_desc: "Les contreparties centrales doivent avoir des plans de rétablissement favorisant la reprise de toutes les transactions en cours au moment de la perturbation."
  5_desc: "Les prestataires de services de communication de données doivent maintenir des ressources adéquates et posséder des dispositifs de sauvegarde et de restauration."
  6_desc: "Les entités financières, autres que les microentreprises, doivent maintenir des capacités en matière de TIC redondantes."
  7_desc: "Les dépositaires centraux de titres doivent maintenir au moins un site de traitement secondaire avec des caractéristiques spécifiques."
  8_desc: "Les entités financières doivent déterminer des objectifs en matière de délai de rétablissement et de point de rétablissement pour chaque fonction."
  9_desc: "Lors du rétablissement, les entités financières doivent effectuer les contrôles nécessaires pour garantir l'intégrité des données."
13:
  title: "Apprentissage et évolution"
  1_desc: "Les entités financières doivent disposer de capacités et d'effectifs pour recueillir des informations sur les vulnérabilités et les cybermenaces."
  2_desc: "Elles doivent réaliser des examens post-incident lié aux TIC après un incident majeur."
  3_desc: "Les entités financières, autres que les microentreprises, doivent communiquer aux autorités compétentes les changements apportés suite aux examens post-incident."
  4_desc: "Les entités financières doivent intégrer les enseignements tirés des tests et des incidents dans leur processus d'évaluation du risque lié aux TIC."
  5_desc: "Elles doivent contrôler l'efficacité de la mise en œuvre de leur stratégie de résilience opérationnelle numérique."
  6_desc: "Les membres de l'encadrement supérieur responsables des TIC doivent rendre compte au moins une fois par an à l'organe de direction."
  7_desc: "Les entités financières doivent élaborer des programmes de sensibilisation à la sécurité des TIC et des formations à la résilience opérationnelle numérique."
  8_desc: "Les entités financières, autres que les microentreprises, doivent assurer un suivi continu des évolutions technologiques pertinentes."
14:
  title: "Communication"
  1_desc: "Les entités financières doivent mettre en place des plans de communication en situation de crise."
  2_desc: "Elles doivent mettre en œuvre des politiques de communication à l'intention des membres du personnel interne et des parties prenantes externes."
  3_desc: "Au moins une personne au sein de l'entité financière doit être chargée de mettre en œuvre la stratégie de communication concernant les incidents liés aux TIC."
15:
  title: "Harmonisation accrue des outils, méthodes, processus et politiques de gestion du risque lié aux TIC"
  1_desc: "Les AES doivent élaborer des projets communs de normes techniques de réglementation pour préciser divers aspects de la gestion du risque lié aux TIC."
  2_desc: "Ces normes doivent tenir compte de la taille et du profil de risque global de l'entité financière."
16:
  title: "Cadre simplifié de gestion du risque lié aux TIC"
  1_desc: "Mettre en place et maintenir un cadre de gestion du risque lié aux TIC solide et documenté."
  2_desc: "Surveiller en permanence la sécurité et le fonctionnement de tous les systèmes de TIC."
  3_desc: "Réduire au minimum l'impact du risque lié aux TIC grâce à l'utilisation de systèmes, protocoles et outils de TIC solides, résilients et actualisés."
  4_desc: "Permettre d'identifier et de détecter rapidement les sources de risque et les anomalies liés aux TIC."
  5_desc: "Recenser les principales dépendances vis-à-vis des prestataires tiers de services TIC."
  6_desc: "Assurer la continuité des fonctions critiques ou importantes au moyen de plans de continuité des activités et de mesures de réponse et de rétablissement."
  7_desc: "Tester régulièrement les plans et mesures, ainsi que l'efficacité des contrôles mis en œuvre."
  8_desc: "Mettre en œuvre les conclusions opérationnelles pertinentes résultant des tests et de l'analyse post-incident."
  9_desc: "Élaborer, en fonction des besoins et du profil de risque lié aux TIC, des programmes de sensibilisation en matière de sécurité des TIC et de formation à la résilience opérationnelle numérique."
17:
  title: "Processus de gestion des incidents liés aux TIC"
  1_desc: "Les entités financières doivent définir, établir et mettre en œuvre un processus de gestion des incidents liés aux TIC."
  2_desc: "Elles doivent enregistrer tous les incidents liés aux TIC et les cybermenaces importantes."
  3:
    title: "Le processus de gestion des incidents liés aux TIC doit :"
    1_desc: "Mettre en place des indicateurs d'alerte précoce."
    2_desc: "Instaurer des procédures pour identifier, suivre, consigner, catégoriser et classer les incidents liés aux TIC."
    3_desc: "Attribuer les rôles et les responsabilités pour différents types et scénarios d'incidents."
    4_desc: "Établir des plans de communication."
    5_desc: "Permettre de notifier au minimum les incidents majeurs liés aux TIC aux membres de la direction concernés."
    6_desc: "Définir des procédures de réponse en cas d'incident lié aux TIC."
18:
  title: "Classification des incidents liés aux TIC et des cybermenaces"
  1:
    title: "Les entités financières doivent classer les incidents liés aux TIC selon des critères spécifiques, notamment :"
    1_desc: "Le nombre et l'importance des clients ou contreparties touchés."
    2_desc: "La durée de l'incident."
    3_desc: "La répartition géographique."
    4_desc: "Les pertes de données occasionnées."
    5_desc: "La criticité des services touchés."
    6_desc: "Les conséquences économiques."
  2_desc: "Elles doivent classer les cybermenaces comme significatives en fonction de critères spécifiques."
  3_desc: "Les AES doivent élaborer des projets communs de normes techniques de réglementation pour préciser les critères de classification."
19:
  title: "Déclaration des incidents majeurs liés aux TIC et notification volontaire des cybermenaces importantes"
  1_desc: "Les entités financières doivent déclarer les incidents majeurs liés aux TIC à l'autorité compétente pertinente."
  2_desc: "Elles doivent établir une notification initiale et des rapports ultérieurs."
  3_desc: "Les entités financières doivent informer leurs clients des incidents majeurs liés aux TIC qui ont une incidence sur leurs intérêts financiers."
  4_desc: "Elles peuvent notifier volontairement les cybermenaces importantes."
  5_desc: "Les entités financières doivent soumettre des rapports spécifiques à l'autorité compétente concernée dans des délais définis."
  6_desc: "Elles peuvent externaliser les obligations de déclaration à un prestataire tiers."
  7_desc: "Les autorités compétentes doivent fournir des détails sur les incidents majeurs liés aux TIC à diverses parties prenantes."
20:
  title: "Harmonisation du contenu et des modèles des rapports de notification"
  1:
    title: "Les AES doivent élaborer des projets communs de normes techniques de réglementation pour définir :"
    1_desc: "Le contenu des rapports relatifs aux incidents majeurs liés aux TIC."
    2_desc: "Les délais pour la notification initiale et les rapports ultérieurs."
    3_desc: "Le contenu de la notification concernant les cybermenaces importantes."
  2_desc: "Les AES doivent élaborer des projets communs de normes techniques d'exécution pour définir les formulaires, modèles et procédures de notification."
21:
  title: "Centralisation des notifications d'incidents majeurs liés aux TIC"
  1_desc: "Les AES doivent élaborer un rapport conjoint évaluant la possibilité de créer une plateforme unique de l'Union pour la notification des incidents majeurs liés aux TIC."
  2_desc: "Ce rapport doit inclure divers éléments spécifiques concernant la création et le fonctionnement de cette plateforme."
22:
  title: "Retour d'information en matière de surveillance"
  1_desc: "Les autorités compétentes doivent accuser réception des notifications d'incidents et peuvent fournir un retour d'information aux entités financières."
  2_desc: "Les AES doivent présenter un rapport annuel anonymisé et agrégé sur les incidents majeurs liés aux TIC."
  3_desc: "Les AES doivent émettre des avertissements et produire des statistiques de haut niveau sur les menaces et vulnérabilités liées aux TIC."
23:
  title: "Incidents opérationnels ou de sécurité liés au paiement"
  1_desc: "Les exigences du chapitre s'appliquent également aux incidents opérationnels ou de sécurité liés au paiement pour certaines entités financières spécifiques."
24:
  title: "Exigences générales applicables à la réalisation de tests de résilience opérationnelle numérique"
  1_desc: "Les entités financières, autres que les microentreprises, doivent établir, maintenir et réexaminer un programme de tests de résilience opérationnelle numérique."
  2_desc: "Le programme doit comprendre une série d'évaluations, tests, méthodologies, pratiques et outils."
  3_desc: "Les entités doivent adopter une approche fondée sur le risque pour l'exécution du programme."
  4_desc: "Les tests doivent être effectués par des parties indépendantes, internes ou externes."
  5_desc: "Les entités doivent définir des procédures pour hiérarchiser, classer et résoudre les problèmes identifiés lors des tests."
  6_desc: "Elles doivent soumettre, au moins une fois par an, tous les systèmes et applications de TIC critiques à des tests appropriés."
25:
  title: "Test des outils et systèmes de TIC"
  1_desc: "Le programme de tests doit prévoir l'exécution de tests appropriés, tels que des évaluations de vulnérabilité, des analyses de sources ouvertes, des évaluations de sécurité des réseaux, etc."
  2_desc: "Les dépositaires centraux de titres et les contreparties centrales doivent procéder à des évaluations de vulnérabilité avant tout déploiement de nouvelles applications ou infrastructures."
  3_desc: "Les microentreprises doivent effectuer les tests en combinant une approche fondée sur les risques avec une planification stratégique."
26:
  title: "Tests avancés d'outils, de systèmes et de processus de TIC sur la base de tests de pénétration fondés sur la menace"
  1_desc: "Certaines entités financières doivent effectuer des tests avancés au moyen d'un test de pénétration fondé sur la menace au moins tous les trois ans."
  2_desc: "Ces tests doivent couvrir plusieurs ou toutes les fonctions critiques ou importantes de l'entité."
  3_desc: "Les entités doivent recenser tous les systèmes, processus et technologies de TIC sous-jacents pertinents."
  4_desc: "Elles doivent évaluer quelles fonctions critiques ou importantes doivent être couvertes par les tests."
  5_desc: "Les entités doivent prendre des mesures nécessaires pour assurer la participation des prestataires tiers de services TIC aux tests."
  6_desc: "Elles doivent procéder à des contrôles de gestion des risques pour atténuer les risques potentiels liés aux tests."
  7_desc: "Les entités doivent fournir une synthèse des conclusions, les plans de mesures correctives et la documentation à l'autorité compétente."
  8_desc: "Elles doivent faire appel à des testeurs conformes à certaines exigences."
  9_desc: "Les établissements de crédit importants doivent uniquement recourir à des testeurs externes."
27:
  title: "Exigences applicables aux testeurs afin de réaliser des tests de pénétration fondés sur la menace"
  1_desc: "Les testeurs doivent posséder certaines qualifications et caractéristiques spécifiques."
  2_desc: "Pour les testeurs internes, des conditions supplémentaires doivent être remplies."
  3_desc: "Les entités financières doivent veiller à une gestion efficace des résultats des tests."
28:
  title: "Principes généraux"
  1_desc: "Les entités financières doivent gérer les risques liés aux prestataires tiers de services TIC dans le cadre de leur gestion du risque lié aux TIC."
  2_desc: "Elles restent pleinement responsables du respect de leurs obligations réglementaires."
  3_desc: "Les entités financières, autres que les microentreprises, doivent adopter et réexaminer régulièrement une stratégie en matière de risques liés aux prestataires tiers de services TIC."
  4_desc: "Elles doivent tenir et mettre à jour un registre d'informations sur les accords contractuels avec les prestataires tiers de services TIC."
  5_desc: "Les entités doivent informer l'autorité compétente de tout projet d'accord contractuel critique."
  6_desc: "Avant de conclure un accord, elles doivent effectuer diverses évaluations et vérifications."
  7_desc: "Les entités financières ne peuvent conclure des accords qu'avec des prestataires respectant des normes adéquates en matière de sécurité de l'information."
  8_desc: "Elles doivent exercer leurs droits d'accès, d'inspection et d'audit de manière appropriée."
  9_desc: "Les entités doivent veiller à ce que les accords contractuels puissent être résiliés dans certaines circonstances."
  10_desc: "Elles doivent mettre en place des stratégies de sortie pour les services TIC critiques."
29:
  title: "Évaluation préliminaire du risque de concentration de TIC au niveau de l'entité"
  1_desc: "Les entités financières doivent déterminer si la conclusion d'un accord contractuel critique pourrait créer une dépendance excessive envers un prestataire."
  2_desc: "Elles doivent évaluer les avantages et les coûts de solutions alternatives."
  3_desc: "Les entités doivent évaluer les risques potentiels liés à la sous-traitance."
  4_desc: "Elles doivent tenir compte des dispositions de la législation en matière d'insolvabilité en cas de faillite du prestataire."
  5_desc: "Pour les prestataires établis dans un pays tiers, les entités doivent tenir compte du respect des règles de l'UE et de l'application effective de la législation locale."
  6_desc: "Les entités financières doivent évaluer les risques liés aux chaînes de sous-traitance potentiellement longues ou complexes."
30:
  title: "Principales dispositions contractuelles"
  1_desc: "Les droits et obligations de l'entité financière et du prestataire tiers de services TIC doivent être clairement définis et consignés par écrit."
  2_desc: "Les accords contractuels doivent comporter des éléments spécifiques, tels que la description des services, les lieux de fourniture, les dispositions sur la protection des données, etc."
  3_desc: "Pour les services TIC critiques, des dispositions supplémentaires sont requises, comme des descriptions détaillées des niveaux de service, des délais de préavis, des obligations pour le prestataire, etc."
  4_desc: "Les entités financières et les prestataires tiers de services TIC doivent envisager l'utilisation de clauses contractuelles types élaborées par les autorités publiques."
31:
  title: "Désignation de prestataires tiers critiques de services TIC"
  1_desc: "Les AES doivent désigner les prestataires tiers de services TIC qui sont critiques pour les entités financières."
  2_desc: "Elles doivent désigner un superviseur principal pour chaque prestataire tiers critique."
  3_desc: "La désignation doit reposer sur des critères spécifiques."
  4_desc: "Les prestataires tiers critiques de services TIC doivent désigner une personne morale comme point de coordination."
  5_desc: "Le superviseur principal doit notifier au prestataire les résultats de l'évaluation et la désignation."
  6_desc: "Les entités financières ne peuvent faire appel à un prestataire tiers critique établi dans un pays tiers que si celui-ci a établi une filiale dans l'UE dans un délai spécifié."
32:
  title: "Structure du cadre de supervision"
  1_desc: "Un forum de supervision doit être institué pour soutenir les travaux liés aux risques des prestataires tiers de services TIC."
  2_desc: "Le forum doit examiner régulièrement les évolutions pertinentes et procéder à des évaluations annuelles."
  3_desc: "Il doit soumettre des indices de référence concernant les prestataires tiers critiques."
  4_desc: "Le forum doit être composé de représentants spécifiques des autorités et organismes pertinents."
  5_desc: "Des experts indépendants peuvent être désignés pour conseiller le forum."
33:
  title: "Tâches du superviseur principal"
  1_desc: "Le superviseur principal doit assurer la supervision des prestataires tiers critiques de services TIC assignés."
  2_desc: "Il doit déterminer si chaque prestataire a mis en place des règles, procédures et mécanismes adéquats pour gérer le risque lié aux TIC."
  3_desc: "Le superviseur principal doit adopter un plan de supervision individuel pour chaque prestataire tiers critique."
  4_desc: "Il doit consulter le forum de supervision avant d'exercer certains pouvoirs."
34:
  title: "Coordination opérationnelle entre superviseurs principaux"
  1_desc: "Les trois superviseurs principaux doivent mettre en place un réseau de supervision commun."
  2_desc: "Ils doivent élaborer un protocole de supervision commun précisant les procédures détaillées de coordination."
  3_desc: "Les superviseurs principaux peuvent demander des conseils techniques à la BCE et à l'ENISA."
35:
  title: "Pouvoirs du superviseur principal"
  1:
    title: "Le superviseur principal dispose de pouvoirs spécifiques concernant les prestataires tiers critiques de services TIC, notamment :"
    1_desc: "Demander des informations et documents."
    2_desc: "Mener des enquêtes et des inspections."
    3_desc: "Demander des rapports sur les mesures prises."
    4_desc: "Formuler des recommandations dans divers domaines."
  2_desc: "Le superviseur principal doit assurer une coordination régulière au sein du réseau de supervision commun."
  3_desc: "Il doit consulter le forum de supervision avant d'exercer certains pouvoirs."
  4_desc: "Le superviseur principal peut imposer des astreintes en cas de non-conformité."
36:
  title: "Exercice des pouvoirs du superviseur principal en dehors de l'Union"
  1_desc: "Le superviseur principal peut exercer certains pouvoirs dans des locaux situés dans un pays tiers, sous certaines conditions."
  2_desc: "Les AES doivent conclure des accords de coopération administrative avec les autorités compétentes des pays tiers."
  3_desc: "Ces accords doivent préciser divers éléments, tels que les procédures de coordination, les mécanismes de transmission d'informations, etc."
37:
  title: "Demande d'informations"
  1_desc: "Le superviseur principal peut exiger des prestataires tiers critiques qu'ils fournissent toutes les informations nécessaires."
  2_desc: "Les demandes d'informations doivent respecter certaines formalités, que ce soit par simple demande ou par voie de décision."
  3_desc: "Les représentants des prestataires tiers critiques doivent fournir les informations demandées."
38:
  title: "Enquêtes générales"
  1_desc: "Le superviseur principal peut mener des enquêtes auprès des prestataires tiers critiques de services TIC."
  2:
    title: "Le superviseur principal dispose de pouvoirs spécifiques pour ces enquêtes, tels que :"
    1_desc: "L'examen des dossiers, données, procédures et autres documents pertinents."
    2_desc: "La prise de copies ou l'obtention d'extraits de ces documents."
    3_desc: "La convocation de représentants du prestataire pour obtenir des explications orales ou écrites."
    4_desc: "L'audition de toute autre personne physique ou morale qui accepte d'être interrogée."
  3_desc: "Les agents et autres personnes mandatés par le superviseur principal sont habilités à accéder aux locaux professionnels et aux terrains du prestataire."
39:
  title: "Inspections"
  1_desc: "Le superviseur principal peut effectuer toutes les inspections nécessaires dans les locaux professionnels des prestataires tiers critiques."
  2:
    title: "Les agents et personnes mandatés par le superviseur principal peuvent :"
    1_desc: "Pénétrer dans tous les locaux professionnels et sur tous les terrains."
    2_desc: "Examiner les livres et autres documents professionnels."
    3_desc: "Prendre des copies de ces documents."
    4_desc: "Demander des explications orales sur place."
    5_desc: "Accéder à tous les systèmes, réseaux, dispositifs, informations et données informatiques utilisés."
  3_desc: "Le superviseur principal doit informer l'autorité compétente de l'État membre concerné avant l'inspection."
  4_desc: "Les inspections doivent être effectuées sur la base d'une décision du superviseur principal."
  5_desc: "Les agents de l'autorité compétente de l'État membre concerné doivent, à la demande du superviseur principal, prêter activement assistance aux agents et personnes mandatés."
40:
  title: "Supervision continue"
  1_desc: "Le superviseur principal doit être assisté par une équipe d'examen conjoint pour chaque prestataire tiers critique de services TIC."
  2:
    title: "Composition de l'équipe d'examen conjoint :"
    1_desc: "Membres du personnel des AES."
    2_desc: "Membres des autorités compétentes surveillant les entités financières concernées."
    3_desc: "Facultativement, membres de l'autorité nationale compétente visée à l'article 32."
    4_desc: "Facultativement, membres d'une autorité nationale compétente de l'État membre où le prestataire est établi."
  3_desc: "Les membres de l'équipe doivent avoir une expertise en matière de TIC et de risque opérationnel."
  4_desc: "L'équipe doit être coordonnée par un membre désigné du personnel du superviseur principal."
  5_desc: "Le superviseur principal doit adopter des recommandations dans les 3 mois suivant la fin d'une enquête ou d'une inspection, après consultation du forum de supervision."
  6_desc: "Les recommandations doivent être immédiatement communiquées au prestataire tiers critique et aux autorités compétentes des entités financières concernées."
  7_desc: "Le superviseur principal peut prendre en compte les certifications tierces pertinentes et les rapports d'audit internes ou externes fournis par le prestataire."
41:
  title: "Harmonisation des conditions permettant l'exercice des activités de supervision"
  1:
    title: "Les AES doivent élaborer des projets de normes techniques de réglementation précisant :"
    1_desc: "Les informations requises pour la désignation volontaire comme prestataire critique."
    2_desc: "Le contenu, la structure et le format des informations à fournir par les prestataires."
    3_desc: "Les critères pour la composition de l'équipe d'examen conjoint."
    4_desc: "Les détails de l'évaluation des mesures prises suite aux recommandations."
  2_desc: "Ces projets doivent être soumis à la Commission au plus tard le 17 juillet 2024."
42:
  title: "Suivi par les autorités compétentes"
  1_desc: "Les prestataires tiers critiques doivent notifier au superviseur principal dans les 60 jours civils leur intention de suivre les recommandations ou fournir une explication de leur non-suivi."
  2_desc: "Le superviseur principal doit divulguer publiquement les cas de non-conformité, sauf si cela causerait un préjudice disproportionné."
  3_desc: "Les autorités compétentes doivent informer les entités financières des risques identifiés dans les recommandations."
  4_desc: "Les autorités compétentes peuvent exiger des entités financières qu'elles suspendent temporairement ou résilient les services d'un prestataire tiers critique si les risques ne sont pas gérés adéquatement."
  5_desc: "Les autorités compétentes doivent tenir compte de plusieurs critères lors de la prise de décision, notamment la gravité et la durée de la non-conformité."
  6_desc: "Les autorités compétentes doivent accorder aux entités financières un délai pour adapter leurs accords contractuels."
  7_desc: "Les décisions prises doivent être notifiées aux membres du forum de supervision."
43:
  title: "Redevances de supervision"
  1_desc: "Le superviseur principal doit percevoir des redevances auprès des prestataires tiers critiques pour couvrir les coûts de supervision."
  2_desc: "Le montant des redevances doit être proportionnel au chiffre d'affaires du prestataire."
  3_desc: "La Commission doit adopter un acte délégué déterminant le montant des redevances et leurs modalités de paiement au plus tard le 17 juillet 2024."
44:
  title: "Coopération internationale"
  1_desc: "Les AES peuvent conclure des accords administratifs avec les autorités de pays tiers pour faciliter la coopération internationale."
  2_desc: "Les AES doivent remettre tous les cinq ans un rapport conjoint confidentiel sur leurs discussions avec les autorités de pays tiers."
45:
  title: "Dispositifs de partage d'informations et de renseignements sur les cybermenaces"
  1:
    title: "Les entités financières peuvent partager des informations sur les cybermenaces sous certaines conditions :"
    1_desc: "Le partage doit viser à améliorer la résilience opérationnelle numérique."
    2_desc: "Il doit se dérouler au sein de communautés de confiance."
    3_desc: "Il doit respecter la confidentialité et la protection des données."
  2_desc: "Les dispositifs de partage doivent définir les conditions de participation et les modalités opérationnelles."
  3_desc: "Les entités financières doivent notifier aux autorités compétentes leur participation ou la cessation de leur participation à ces dispositifs de partage."
46:
  title: "Traitement des données à caractère personnel"
  1_desc: "Les entités financières doivent traiter les données à caractère personnel conformément au règlement (UE) 2016/679 (RGPD) et au règlement (UE) 2018/1725."
  2:
    title: "Les entités financières ne doivent traiter les données à caractère personnel que dans la mesure strictement nécessaire pour assurer la résilience opérationnelle numérique du secteur financier, notamment pour :"
    1_desc: "La gestion des risques liés aux TIC."
    2_desc: "La notification des incidents majeurs liés aux TIC."
    3_desc: "Les tests de résilience opérationnelle numérique."
    4_desc: "L'exercice des pouvoirs de supervision et de contrôle par les autorités compétentes."
