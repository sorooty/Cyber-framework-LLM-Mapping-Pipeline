5:
  title: "Exigences générales"
  1:
    title: "Domaine juridique et contractuel"
    1_label: "Responsabilité juridique"
    1_desc: "L’organisme de certification doit être une entité juridique ou une partie définie d’une entité juridique pouvant être tenue juridiquement responsable de toutes ses activités de certification. Un organisme de certification gouvernemental est considéré être une entité juridique sur la base de son statut gouvernemental."
    2_label: "Contrat de certification"
    2_desc: "L’organisme de certification doit disposer d’un contrat juridiquement exécutoire avec chaque client pour fournir des activités de certification conformément aux exigences pertinentes de la présente partie de l’ISO/IEC 17021. En outre, lorsque l’organisme de certification a plusieurs bureaux ou que le client certifié a plusieurs sites, l’organisme de certification doit assurer qu’il existe une relation contractuelle juridiquement exécutoire entre l’organisme de certification octroyant la certification et le client, couvrant tous les sites concernés par le périmètre de la certification.\n\n ℹ️NOTE \nUne relation contractuelle peut être obtenue au moyen de plusieurs contrats qui font référence les uns aux autres ou qui sont liés de toute autre manière."
    3_label: "Responsabilité en matière de décisions de certification"
    3_desc: "L’organisme de certification doit être responsable et conserver son autorité pour ses décisions en matière de certification, y compris l’octroi, le refus, le maintien de la certification, l’extension ou la réduction du périmètre de la certification, le renouvellement, la suspension ou le rétablissement après la suspension, ou le retrait de la certification."
  2:
    title: "Gestion de l’impartialité"
    1_label: "Gestion de l’impartialité - 1"
    1_desc: "Les activités d’évaluation de la conformité doivent être menées de manière impartiale. L’organisme de certification doit être responsable de l’impartialité de ses activités d’évaluation de la conformité et ne doit laisser aucune pression commerciale, financière ou autre compromettre cette impartialité."
    2_label: "Gestion de l’impartialité - 2"
    2_desc: "La direction de l’organisme de certification doit s’engager à exercer ses activités de certification de systèmes de management en toute impartialité. L’organisme de certification doit disposer d’une politique par laquelle il reconnaît l’importance de l’impartialité dans l’exercice de ses activités de certification des systèmes de management, et qu’il assure la bonne gestion des conflits d’intérêts et l’objectivité de ses activités de certification de systèmes de management."
    3_label: "Gestion de l’impartialité - 3"
    3_desc: "L’organisme de certification doit disposer d’un processus pour identifier, analyser, évaluer, traiter, surveiller et documenter les risques liés aux conflits d’intérêts résultant de la certification envisagée, y compris tous les conflits dus à ses propres relations, de façon continue. En cas de menaces pour l’impartialité, l’organisme de certification doit documenter et apporter la preuve de la manière dont il élimine ou limite ces menaces au minimum et documenter tout risque résiduel. La démonstration doit couvrir toutes les menaces potentielles identifiées, que ce soit au sein de l’organisme de certification ou du fait des activités d’autres personnes, entités ou organismes. Lorsqu’une relation menace de compromettre l’impartialité de manière inacceptable (par exemple dans le cas d’une filiale appartenant 100 % à l’organisme de certification demandant une certification de sa société mère), la prestation de certification ne doit pas être fournie.\nLa direction doit passer en revue tout risque résiduel afin de déterminer s’il se situe dans les limites d’un risque acceptable.\nLe processus d’évaluation des risques doit comprendre l’identification et la consultation des parties intéressées appropriées, pour donner des conseils sur des sujets affectant l’impartialité, y compris la transparence et l’image publique. La consultation des parties intéressées appropriées doit être équilibrée, sans prédominance d’un intérêt particulier.\n\n ℹ️NOTE 1\nLes sources des menaces compromettant l’impartialité de l’organisme de certification peuvent résulter de facteurs tels que la propriété, la gouvernance, la direction, le personnel, les ressources partagées, la situation financière, les contrats, la formation, la commercialisation, le paiement de commissions sur les ventes ou autres incitations d’apporter de nouveaux clients, etc.\n\n ℹ️NOTE 2\nLes parties intéressées peuvent inclure le personnel et les clients de l’organisme de certification, les clients des organismes dont les systèmes de management sont certifiés, les représentants d’organismes professionnels, les représentants des organismes gouvernementaux chargés de la réglementation ou autres services gouvernementaux, ou les représentants d’organismes non gouvernementaux, y compris les associations de consommateurs.\n\n ℹ️NOTE 3\nUne manière de satisfaire à l’exigence de consultation de ce paragraphe consiste à réunir ces parties intéressées en un comité."
    4_label: "Gestion de l’impartialité - 4"
    4_desc: "Un organisme de certification ne doit pas certifier le système de management de la qualité d’un autre organisme de certification."
    5_label: "Gestion de l’impartialité - 5"
    5_desc: "Un organisme de certification et toute autre partie de la même entité juridique et toute entité sous le contrôle organisationnel de l’organisme de certification [voir 9.5.1.2, point b)] ne doivent pas proposer ou fournir des prestations de conseil en matière de système de management. Cela s’applique également à une partie d’une entité gouvernementale identifiée comme organisme de certification.\n\n ℹ️NOTE\nCela n’exclut pas la possibilité d’échange d’informations (par exemple explication des constats ou clarification des exigences) entre l’organisme de certification et ses clients."
    6_label: "Gestion de l’impartialité - 6"
    6_desc: "La réalisation d’audits internes par l’organisme de certification et toute autre partie de la même entité juridique à ses clients certifiés constitue une menace significative pour l’impartialité. Par conséquent, l’organisme de certification et toute autre partie de la même entité juridique et toute entité sous le contrôle organisationnel de l’organisme de certification [voir 9.5.1.2, point b)] ne doivent pas proposer ou fournir des prestations d’audits internes à ses clients certifiés. Il est reconnu que pour atténuer cette menace, l’organisme de certification ne doit pas certifier un système de management pour lequel il effectue des audits internes, et ce au moins dans les deux années qui suivent la fin des audits internes.\n\n ℹ️NOTE\nVoir Note 1 de 5.2.3."
    7_label: "Gestion de l’impartialité - 7"
    7_desc: "Lorsqu’un client a reçu des conseils en matière de systèmes de management de la part d’un organisme qui est en relation avec un organisme de certification, cela constitue une menace significative pour l’impartialité. Un des moyens reconnus pour atténuer cette menace est que l’organisme de certification ne doit pas certifier le système de management de ce client au moins dans les deux années qui suivent la fin de l’activité de conseil.\n\n ℹ️NOTE\nVoir Note 1 de 5.2.3."
    8_label: "Gestion de l’impartialité - 8"
    8_desc: "L’organisme de certification ne doit pas sous-traiter des audits à un organisme de conseil en matière de système de management dans la mesure où ce fait constitue une menace inacceptable à l’impartialité de l’organisme de certification (voir 7.5). Cela ne s’applique pas aux auditeurs individuels sous contrat tel que spécifié en 7.3."
    9_label: "Gestion de l’impartialité - 9"
    9_desc: "Les activités de l’organisme de certification ne doivent pas être présentées ou proposées comme liées aux activités d’un organisme de conseil en matière de système de management. L’organisme de certification doit prendre des mesures appropriées pour corriger les liens ou les déclarations inappropriés d’un organisme de conseil déclarant ou suggérant que la certification serait plus simple, plus facile, plus rapide ou moins onéreuse si l’on faisait appel à un organisme de certification donné. De même, un organisme de certification ne doit pas déclarer ou suggérer que la certification serait plus simple, plus facile, plus rapide ou moins onéreuse si l’on faisait appel à un organisme de conseil spécifié."
    10_label: "Gestion de l’impartialité - 10"
    10_desc: "Afin de garantir l’absence de conflit d’intérêts, le personnel s’étant chargé d’une activité de conseil, y compris les personnes agissant dans une structure de direction, ne doit pas participer, pour le compte de l’organisme de certification, à un audit ou à des activités de certification s’il a pris part à des activités de conseil sur le même système de management vis-à-vis du client. Il est reconnu que pour atténuer cette menace, il ne doit pas être fait appel à ce personnel au moins dans les deux années qui suivent la fin de l’activité de conseil."
    11_label: "Gestion de l’impartialité - 11"
    11_desc: "L’organisme de certification doit prendre les mesures nécessaires lorsque son impartialité est menacée par les actions d’individus, d’organismes ou d’organisations."
    12_label: "Gestion de l’impartialité - 12"
    12_desc: "L’ensemble du personnel de l’organisme de certification, qu’il soit interne ou externe, et les comités qui pourraient influencer les activités de certification, doivent agir de manière impartiale et ne pas permettre que toutes pressions, commerciales, financières ou autres puissent compromettre l’impartialité."
    13_label: "Gestion de l’impartialité - 13"
    13_desc: "Les organismes de certification doivent exiger du personnel, qu’il soit interne ou externe, de leur révéler toute situation dont il a connaissance et qui pourrait créer pour ces personnes ou pour l’organisme de certification un conflit d’intérêts. Les organismes de certification doivent enregistrer et utiliser ces informations comme données d’entrée pour identifier les menaces que font peser sur l’impartialité les activités de ce personnel ou des organismes qui les emploient et ne doivent pas faire appel à ce personnel, qu’il soit interne ou externe, sauf s’ils peuvent apporter la preuve qu’il n’y a pas de conflit d’intérêts."
  3:
    title: "Responsabilité et situation financière"
    1_label: "Responsabilité et situation financière - 1"
    1_desc: "L’organisme de certification doit apporter la preuve qu’il a évalué les risques significatifs résultant de ses activités de certification et qu’il a pris les dispositions appropriées (par exemple assurance ou réserves) pour couvrir les responsabilités résultant de ses opérations dans chacun de ses domaines d’activités et pour chacune des zones géographiques où il opère."
    2_label: "Responsabilité et situation financière - 2"
    2_desc: "L’organisme de certification doit évaluer sa situation financière et ses sources de revenus et doit apporter la preuve, dès l’origine et par la suite, que toutes pressions commerciales, financières ou autres ne compromettent pas son impartialité."
6:
  title: "Exigences structurelles"
  1:
    title: "Organisation et direction"
    1_label: "Organisation et direction - 1"
    1_desc: "L’organisme de certification doit documenter l’organisation, les devoirs, la responsabilité et l’autorité de la direction et des autres membres du personnel impliqués dans la certification ainsi que de tous les comités. Lorsque l’organisme de certification est une partie définie d’une entité juridique, la structure doit indiquer l’autorité hiérarchique et la relation avec les autres parties au sein de la même entité juridique."
    2_label: "Organisation et direction - 2"
    2_desc: "Les activités de certification doivent être structurées et gérées de manière à préserver l’impartialité."
    3_label: "Organisation et direction - 3"
    3_desc: "L’organisme de certification doit identifier la direction (comité directeur, groupe de personnes ou personne) ayant l’autorité globale et la responsabilité de chacun des points suivants:\na) l’élaboration de politiques et la mise en place de processus et de procédures relatifs à son fonctionnement;\nb) la surveillance de la mise en œuvre des politiques, processus et des procédures;\nc) l’assurance de l’impartialité;\nd) la surveillance de sa situation financière;\ne) le développement des prestations et programmes de certification de systèmes de management;\nf) la réalisation des audits et de la certification, et le traitement des plaintes;\ng) les décisions en matière de certification;\ni) les dispositions contractuelles;\nj) la fourniture des ressources appropriées pour les activités de certification."
    4_label: "Organisation et direction - 4"
    4_desc: "L’organisme de certification doit disposer de règles formelles régissant la désignation, les missions et le fonctionnement de tous les comités engagés dans les activités de certification."
  2:
    title: "Maîtrise opérationnelle"
    1_label: "Maîtrise opérationnelle - 1"
    1_desc: "L’organisme de certification doit disposer d’un processus de maîtrise efficace des activités de certification exercées par ses succursales, partenaires, mandataires, franchisés, etc., quel que soit leur statut juridique, leurs relations ou leur localisation géographique. L’organisme de certification doit tenir compte du risque que ces activités présentent pour la compétence, la cohérence et l’impartialité de l’organisme de certification."
    2_label: "Maîtrise opérationnelle - 2"
    2_desc: "L’organisme de certification doit prendre en compte le niveau et la méthode appropriés de maîtrise des activités exercées, y compris les processus, les secteurs techniques des opérations réalisées par l’organisme de certification, la compétence du personnel, les moyens de contrôle de gestion, le compte rendu et l’accès à distance aux opérations, enregistrements inclus."
7:
  title: "Exigences relatives aux ressources"
  1:
    title: "Compétence du personnel"
    1_label: "Considérations générales"
    1_desc: "L’organisme de certification doit disposer de processus lui garantissant que le personnel a des connaissances et un savoir-faire appropriés concernant les types de systèmes de management (par exemple, systèmes de management environnemental, systèmes de management de la qualité, systèmes de management de la sécurité de l’information) et les zones géographiques qui entrent dans son périmètre d’action."
    2_label: "Détermination des critères de compétence"
    2_desc: "L’organisme de certification doit disposer d’un processus pour déterminer les critères de compétences des membres du personnel impliqués dans le management et la réalisation des audits et des autres activités de certification. Les critères de compétence doivent être déterminés en fonction des exigences propres à chaque type de norme ou de spécification de système de management, pour chaque secteur technique et pour chaque fonction du processus de certification. Les données de sortie du processus doivent être les critères documentés des connaissances et du savoir-faire exigés, nécessaires à la réalisation efficace des missions d’audit et de certification à remplir pour atteindre les résultats escomptés. L’Annexe A spécifie les connaissances et le savoir-faire qu’un organisme de certification doit définir pour remplir des fonctions spécifiques. Quand des critères de compétences supplémentaires ont été déterminés pour une norme ou programme de certification spécifique (par exemple ISO/IEC/ TS 17021-2, ISO/IEC/TS 17021-3 ou ISO/TS 22003), ce sont ces critères supplémentaires qui doivent s’appliquer.\n\n ℹ️NOTE \nLe terme « secteur technique » s’applique de façon différente en fonction de la norme de système de management considérée. Quel que soit le système de management, le terme s’applique aux produits, processus et services entrant dans le domaine d’application de la norme du système de management. Le secteur technique peut être défini par un programme de certification spécifique (par exemple l’ISO/TS 22003); sinon, il peut être déterminé par l’organisme de certification. Il sert à couvrir un certain nombre d’autres termes tels que « domaines », « catégories », « secteurs » etc. qui sont traditionnellement utilisés dans différentes disciplines de systèmes de management."
    3_label: "Processus d’évaluation"
    3_desc: "L’organisme de certification doit disposer de processus documentés d’évaluation initiale des compétences et de la surveillance continue des compétences et des performances de tous les membres du personnel impliqués dans le management et la réalisation des audits et d’autres activités de certification, en appliquant les critères de compétence déterminés. L’organisme de certification doit démontrer que ses méthodes d’évaluation sont efficaces. Les données de sortie de ces processus doivent permettre d’identifier le personnel ayant démontré le niveau de compétences requis pour les différentes fonctions du processus d’audit et de certification. Les compétences doivent être démontrées avant que la personne ne prenne la responsabilité de la réalisation de leurs activités au sein de l’organisme de certification.\n\n ℹ️NOTE 1\nL’Annexe B décrit un certain nombre de méthodes d’évaluation des compétences pouvant être utilisées.\n\n ℹ️NOTE 2\nL’Annexe C donne un exemple de logigramme de détermination et de maintien des compétences"
    4_label: "Autres considérations"
    4_desc: "L’organisme de certification doit pouvoir faire appel à l’expertise technique nécessaire pour conseiller sur des sujets relevant directement des activités de certification de tous les domaines techniques, de types de système de management et des zones géographiques qui entrent dans son périmètre d’action. Ces conseils peuvent être prodigués par des personnes extérieures ou par le personnel de l’organisme de certification."
  2:
    title: "Personnel intervenant dans les activités de certification"
    1_label: "Personnel intervenant dans les activités de certification - 1"
    1_desc: "L’organisme de certification doit employer suffisamment de personnel compétent pour gérer et prendre en charge le type et la gamme de programmes d’audit ainsi que les autres tâches de certification effectuées."
    2_label: "Personnel intervenant dans les activités de certification - 2"
    2_desc: "L’organisme de certification doit employer ou pouvoir faire appel à un nombre suffisant d’auditeurs, y compris pour les responsables d’équipe d’audit et les experts techniques, pour couvrir la totalité de ses activités et traiter le volume de travail représenté par les audits à effectuer."
    3_label: "Personnel intervenant dans les activités de certification - 3"
    3_desc: "L’organisme de certification doit définir clairement pour chaque personne concernée quels sont ses devoirs, ses responsabilités et ses autorités."
    4_label: "Personnel intervenant dans les activités de certification - 4"
    4_desc: "L’organisme de certification doit disposer de processus lui permettant de sélectionner, former, autoriser formellement les auditeurs et choisir et familiariser les experts techniques auxquels il fait appel dans le processus de certification. L’évaluation initiale des compétences d’un auditeur doit passer par une démonstration de sa capacité à mettre en œuvre, durant les audits, les connaissances et savoirfaire nécessaires qui sont déterminés par un évaluateur compétent observant l’auditeur durant un audit.\n\n ℹ️NOTE \nPendant le processus de sélection et de formation décrit ci-dessus, les comportements personnels souhaités peuvent être pris en compte. Ce sont des caractéristiques qui influencent la capacité d’une personne à réaliser des fonctions spécifiques. Par conséquent, le fait de connaître le comportement des personnes permet à un organisme de certification de tirer avantage de leurs forces et de réduire au minimum l’impact de leurs faiblesses. L’Annexe D décrit les comportements personnels souhaités qui présentent de l’importance pour le personnel impliqué dans les activités de certification."
    5_label: "Personnel intervenant dans les activités de certification - 5"
    5_desc: "L’organisme de certification doit disposer d’un processus pour obtenir et démontrer l’efficacité des audits, comprenant le déploiement d’auditeurs et de responsables d’équipe d’audit ayant aussi bien des compétences et connaissances génériques que des compétences et connaissances spécifiques nécessaires pour auditer dans des domaines techniques particuliers."
    6_label: "Personnel intervenant dans les activités de certification - 6"
    6_desc: "L’organisme de certification doit assurer que les auditeurs (et, le cas échéant, les experts techniques) connaissent les processus d’audit, les exigences de la certification ainsi que les autres exigences applicables. L’organisme de certification doit permettre aux auditeurs et aux experts techniques d’avoir accès à une collection de procédures documentées à jour donnant des instructions d’audit et toutes les informations pertinentes sur les opérations de certification."
    7_label: "Personnel intervenant dans les activités de certification - 7"
    7_desc: "L’organisme de certification doit identifier les besoins en formation et proposer ou donner accès à des formations spécifiques afin que ses auditeurs, experts techniques et autres personnes intervenant dans les activités de certification aient les compétences requises pour les fonctions qu’ils exercent."
    8_label: "Personnel intervenant dans les activités de certification - 8"
    8_desc: "Le groupe ou la personne qui prend la décision de l’octroi, du refus, du maintien, du renouvellement, de la suspension, du rétablissement, ou du retrait de la certification, ou de l’extension ou de la réduction du périmètre de la certification doit comprendre les exigences applicables de la norme et de la certification, et doit avoir démontré ses compétences pour évaluer les résultats des processus d’audit, y compris les recommandations correspondantes de l’équipe d’audit."
    9_label: "Personnel intervenant dans les activités de certification - 9"
    9_desc: "L’organisme de certification doit assurer des performances satisfaisantes de la part de tout le personnel impliqué dans les activités d’audit et autres activités de certification. Il doit exister un processus documenté pour surveiller les compétences et les performances de toutes les personnes impliquées, en se fondant sur la fréquence de leurs interventions et sur le niveau de risque lié à leurs activités. L’organisme de certification doit notamment procéder à une revue et à un enregistrement de compétence de son personnel à la lumière de leurs performances afin d’identifier les besoins de formation."
    10_label: "Personnel intervenant dans les activités de certification - 10"
    10_desc: "L’organisme de certification doit surveiller chaque auditeur en tenant compte de chaque type de système de management pour lequel l’auditeur est jugé compétent. Le processus documenté de surveillance des auditeurs doivent prévoir une combinaison d’évaluation sur site, de revues des rapports d’audit et de retours d’information des clients ou du marché. Cette surveillance doit être conçue de façon à perturber au minimum le déroulement normal des processus de certification, notamment du point de vue du client."
    11_label: "Personnel intervenant dans les activités de certification - 11"
    11_desc: "L’organisme de certification doit évaluer régulièrement les performances de chaque auditeur sur site. La fréquence des évaluations sur site doit être établie en fonction du besoin déterminé à partir de l’ensemble des informations recueillies pendant le processus de surveillance."
  3:
    title: "Intervention d'auditeurs et d'experts techniques externes individuels"
    1_label: "Intervention d'auditeurs et d'experts techniques externes individuels"
    1_desc: "L’organisme de certification doit exiger des auditeurs et des experts techniques externes de signer un accord aux termes duquel ils s’engagent à se conformer aux politiques et mettre en œuvre les processus applicables, définis par l’organisme de certification. L’accord doit aborder les aspects liés à la confidentialité et à l’impartialité, et exiger des auditeurs et experts techniques externes qu’ils lui indiquent toute relation existante ou passée qu’ils entretiennent ou ont pu entretenir avec l’organisme qu’ils peuvent être amenés à auditer.\n\n ℹ️NOTE \nL’intervention d’une personne ou d’un employé d’un autre organisme sous contrat en tant qu’auditeur externe ou expert technique ne constitue pas une externalisation."
  4:
    title: "Enregistrements relatifs au personnel"
    1_label: "Enregistrements relatifs au personnel"
    1_desc: "L’organisme de certification doit conserver des enregistrements du personnel à jour, y compris les qualifications, les formations, l’expérience, les affiliations, le statut professionnel et les la compétence. Cela inclut la direction et le personnel administratif en plus du personnel qui réalise les activités de certification."
  5:
    title: "Externalisation"
    1_label: "Externalisation - 1"
    1_desc: "L’organisme de certification doit avoir un processus décrivant les conditions dans lesquelles une externalisation peut se produire (sous-traitance à un autre organisme d’une partie des activités de certification pour le compte de l’organisme de certification). L’organisme de certification doit disposer d’un accord juridiquement exécutoire couvrant les dispositions adoptées, y compris la confidentialité et les conflits d’intérêts, avec chaque organisme sous-traitant."
    2_label: "Externalisation - 2"
    2_desc: "Les décisions de l’octroi, du refus, du maintien de la certification, de l’extension ou de la réduction du périmètre de la certification, du renouvellement, de la suspension ou du rétablissement, ou du retrait de la certification ne doivent pas être externalisées."
    3_label: "Externalisation - 3"
    3_desc: "L’organisme de certification doit:\na) assumer l’entière responsabilité de toutes les activités externalisées auprès d’un autre organisme;\nb) assurer que l’organisme sous-traitant, ainsi que les personnes auxquelles il fait appel, respectent les exigences de l’organisme de certification ainsi que les dispositions applicables de la présente partie de l’ISO/IEC 17021, y compris en ce qui concerne les compétences, l’impartialité et la confidentialité;\nc) assurer que l’organisme sous-traitant, ainsi que les personnes auxquelles il fait appel, ne sont pas liés, directement ou par le biais d’un autre employeur, à l’organisme à auditer d’une manière susceptible de compromettre l’impartialité."
    4_label: "Externalisation - 4"
    4_desc: "L’organisme de certification doit disposer d’un processus pour l’approbation et la surveillance de tous les sous-traitants auxquels il fait appel pour les activités de certification et doit assurer que les enregistrements relatifs aux compétences de l’ensemble du personnel impliqué dans les activités de certification sont conservés.\n\n ℹ️NOTE 1\nPour 7.5.1 à 7.5.4, lorsque l’organisme de certification engage des personnes ou des employés d’autres organismes afin de fournir des ressources ou une expertise supplémentaires, ces personnes ne constituent pas une externalisation dès lors qu’elles sont individuellement sous contrat pour opérer dans le cadre du système de management de l’organisme de certification (voir 7.3).\n\n ℹ️NOTE 2\nPour 7.5.1 à 7.5.4, les termes « externalisation » et « sous-traitance » sont considérés comme synonymes."
    5_label: "Externalisation - 5"
    5_desc: "L’organisme de certification doit assurer que les sous-trait"
8:
  title: "Exigences relatives aux informations"
  1:
    title: "Informations publiques"
    1_label: "Informations publiques - 1"
    1_desc: "L’organisme de certification doit conserver (par le biais de publications, de supports électroniques ou d’autres moyens) et rendre publiques, sans avoir à en faire la demande et dans toutes les zones géographiques qui entrent dans son périmètre d’action, les informations concernant:\na) les processus d’audit;\nb) les processus pour l’octroi, le refus, le maintien, le renouvellement, la suspension, le rétablissement ou le retrait de la certification ou l’extension ou la réduction du périmètre de la certification;\nc) les types de systèmes de management et les programmes de certification qui entrent dans son périmètre d’action;\nd) l’utilisation du nom de l’organisme de certification et de la marque ou du logo de certification;\ne) les processus de traitement des demandes d’informations, des plaintes et appels;\nf) sa politique en matière d’impartialité."
    2_label: "Informations publiques - 2"
    2_desc: "L’organisme de certification doit fournir, sur demande, les informations concernant\na) les zones géographiques qui entrent dans son périmètre d’action;\nb) le statut d’une certification donnée;\nc) le nom, le document normatif correspondant, le domaine d’activité et la localisation géographique (ville et pays) d’un client certifié particulier.\n\n ℹ️NOTE 1\nDans certains cas exceptionnels (par exemple pour des raisons de sécurité), l’accès à certaines informations peut être limité à la demande du client.\n\n ℹ️NOTE 2\nL’organisme de certification peut également rendre publiques les informations figurant en 8.1.2 par tous les moyens de son choix sans avoir à en faire la demande, par exemple sur son site Web."
    3_label: "Informations publiques - 3"
    3_desc: "L’organisme de certification doit s’assurer que les informations qu’il fournit au client ou au marché, y compris la publicité, ne sont ni fausses ni trompeuses."
  2:
    title: "Documents de certification"
    1_label: "Documents de certification - 1"
    1_desc: "L’organisme de certification doit fournir des documents de certification au client certifié par tous les moyens de son choix."
    2_label: "Documents de certification - 2"
    2_desc: "Le ou les documents de certification doivent permettre d’identifier:\na) le nom et la localisation géographique de chaque client certifié (ou bien la localisation géographique du siège social et celle de tous les sites rattachés à une certification multisite); \nb) la date d’entrée en vigueur de la délivrance, de l’extension ou de la réduction du périmètre de la certification, ou du renouvellement de la certification, qui ne doit pas être antérieure à la date de la décision de certification correspondante;\n ℹ️NOTE\nL’organisme de certification peut conserver la date de certification initiale sur le certificat lorsqu’un certificat expire pendant un certain temps à condition que: \n\t— la date de début et la date d’expiration du cycle de certification actuel soient clairement indiquées;\n\t— la date d’expiration du dernier cycle de certification soit indiquée avec la date de l’audit de renouvellement de la certification;\nc) la date d’expiration ou la date prévue pour un renouvellement coïncidant avec le cycle de renouvellement de la certification; \nd) un numéro d’identification unique; \ne) la norme de système de management et/ou tout autre document normatif, avec mention de la version (par exemple, date ou numéro de révision), utilisés pour l’audit du client certifié; \nf) le périmètre de la certification en fonction du type d’activités, de produits et de services, etc., tel que défini pour chaque site, sans qu’il ne soit ni trompeur, ni ambigu; \ng) le nom, l’adresse et la marque de certification de l’organisme de certification; d’autres marques (telles que la marque d’accréditation, le logo du client) peuvent être utilisées sous réserve qu’elles ne soient ni trompeuses, ni ambiguës; \nh) toute autre information requise par la norme et/ou tout autre document normatif utilisé pour la certification; \ni) dans le cas d’une révision de documents de certification, un moyen de distinguer les versions en vigueur par rapport aux versions précédentes périmées."
  3:
    title: "Référence à la certification et utilisation des marques"
    1_label: "Référence à la certification et utilisation des marques - 1"
    1_desc: "Un organisme de certification doit disposer de règles régissant toute marque de certification de système relative aux systèmes de management qu’il autorise des clients certifiés à utiliser. Ces règles doivent, entre autres, garantir la traçabilité vers l’organisme de certification. Il ne doit y avoir aucune ambiguïté dans la marque ou le texte d’accompagnement en ce qui concerne l’objet de la certification et l’organisme qui a accordé la certification. Cette marque ne doit pas être utilisée sur un produit ni un emballage de produit ni de toute autre manière pouvant être interprétée comme une indication de la conformité dudit produit.\n\n ℹ️NOTE \nL’ISO/IEC 17030 fournit les informations supplémentaires relatives à l’utilisation des marques de tierces parties."
    2_label: "Référence à la certification et utilisation des marques - 2"
    2_desc: "Un organisme de certification ne doit pas autoriser l’apposition de ses marques par les clients certifiés sur les rapports de laboratoire d’essai, sur les rapports d’étalonnage ou d’inspection ou sur les certificats."
    3_label: "Référence à la certification et utilisation des marques - 3"
    3_desc: "Un organisme de certification doit disposer de règles régissant l’utilisation de toute mention sur l’emballage du produit ou sur les documents d’accompagnement indiquant que le client certifié dispose d’un système de management certifié. L’emballage du produit correspond à celui qui peut être retiré sans casser ni endommager le produit. Les documents d’accompagnement sont considérés comme étant disponibles séparément ou facilement détachables. Les étiquettes ou les plaques signalétiques sont considérées comme faisant partie du produit. La mention ne doit en aucun cas sous-entendre que le produit, processus ou service est certifié par ce biais. Elle doit comprendre une référence:\n— à l’identification (par exemple marque ou nom) du client certifié; \n— au type de système de management (par exemple de la qualité, environnemental) et à la norme applicable; \n— à l’organisme de certification qui délivre le certificat."
    4_label: "Référence à la certification et utilisation des marques - 4"
    4_desc: "L’organisme de certification doit s’assurer que les mentionsPar le biais de dispositions juridiquement exécutoires, l’organisme de certification doit exiger que le client certifié:\na) se conforme aux exigences de l’organisme de certification lorsqu’il fait référence au statut de la certification dans ses moyens de communication, tels que Internet, brochures ou publicité et autres documents; \nb) ne fasse ou ne permette de faire aucune déclaration trompeuse concernant sa certification; \nc) n’utilise ou ne permette d’utiliser de manière abusive aucun document de certification, dans sa totalité ou en partie; \nd) cesse, en cas de retrait de sa certification, toute publicité qui se réfère à un statut de certifié, comme exigé par l’organisme de certification (voir 9.6.5); \ne) modifie tout objet de publicité en cas de réduction du périmètre de la certification; \nf) ne laisse pas utiliser la référence à la certification de son système de management pour laisser supposer qu’un produit (y compris les services) ou un processus est certifié par l’organisme de certification; \ng) ne sous-entende pas que la certification s’applique à des activités et des sites non couverts par le périmètre de la certification; \nh) n’utilise pas sa certification de façon qui puisse nuire à la réputation de l’organisme de certification et/ou du système de certification et compromette la confiance que lui accorde le public."
    5_label: "Référence à la certification et utilisation des marques - 5"
    5_desc: "L’organisme de certification doit exercer une maîtrise appropriée des droits de propriété et doit agir pour traiter toute référence incorrecte au statut de la certification ou tout usage abusif des documents, des marques de certification ou des rapports d’audit.\n\n ℹ️NOTE \nUne telle action pourrait entraîner une demande de correction et d’action corrective, la suspension ou le retrait du certificat, la publication de l’infraction et, si approprié, une action en justice."
  4:
    title: "Confidentialité"
    1_label: "Confidentialité - 1"
    1_desc: "Dans le cadre des engagements juridiquement exécutoires, l’organisme de certification doit être responsable de la gestion de toutes les informations obtenues ou générées au cours de ses activités de certification à tous les niveaux de son organisation, y compris celui des comités et des organismes ou personnes externes agissant en son nom."
    2_label: "Confidentialité - 2"
    2_desc: "L’organisme de certification doit indiquer au client, à l’avance, les informations qu’il a l’intention de rendre publiques. Toutes les autres informations, à l’exception de celles rendues publiques par le client, doivent être considérées comme confidentielles."
    3_label: "Confidentialité - 3"
    3_desc: "Sauf spécification contraire dans la présente partie de l’ISO/IEC 17021, les informations relatives à un client certifié ou à une personne en particulier ne doivent pas être divulguées à un tiers sans le consentement écrit du client certifié ou de la personne qui les a fournies."
    4_label: "Confidentialité - 4"
    4_desc: "Lorsqu’un organisme de certification est tenu par la loi, ou autorisé par des dispositions contractuelles (comme avec l’organisme d’accréditation), à divulguer des informations confidentielles, le client ou la personne en question doit être avisé, sauf si la loi l’interdit, des informations fournies."
    5_label: "Confidentialité - 5"
    5_desc: "Les informations relatives au client obtenues par d’autres sources que le client lui-même (par exemple plaignant, autorités de réglementation) doivent être considérées comme confidentielles, conformément à la politique de l’organisme de certification."
    6_label: "Confidentialité - 6"
    6_desc: "Le personnel, mais aussi tous les membres des comités, les fournisseurs, le personnel d’organismes ou de personnes externes agissant au nom de l’organisme de certification, doivent préserver la confidentialité de toutes les informations obtenues ou générées au cours des activités de l’organisme de certification, sauf spécification contraire dans la loi."
    7_label: "Confidentialité - 7"
    7_desc: "L’organisme de certification doit disposer de processus, et le cas échéant, d’équipements et d’installations lui permettant d’assurer en toute sécurité le traitement des informations confidentielles."
  5:
    title: "Échange d’informations entre l’organisme de certification et ses clients"
    1_label: "Informations relatives aux processus et aux exigences de certification"
    1_desc: "L’organisme de certification doit fournir à ses clients les informations suivantes à jour: \na) une description détaillée du processus de certification initiale et en cours, y compris la demande, les audits initiaux, les audits de surveillance et le processus d’octroi, de refus, de maintien de la certification, d’extension ou de réduction du périmètre de la certification, de renouvellement, de suspension ou de rétablissement, ou de retrait de la certification; \nb) les exigences normatives relatives à la certification; \nc) des informations relatives aux tarifs correspondants à la demande, à la certification initiale et au maintien de la certification; \nd) les exigences de l’organisme de certification pour que les clients: \n\t1) se conforment aux exigences de certification; \n\t2) prennent toutes les dispositions nécessaires pour la conduite des audits, y compris les dispositions en vue de l’examen de la documentation et de l’accès à tous les processus et zones, enregistrements et personnels pour les besoins de la certification initiale, des audits de surveillance, du renouvellement de la certification et du traitement des plaintes; \n\t3) prennent, le cas échéant, des dispositions pour accepter les observateurs (par exemple les évaluateurs d’accréditation ou un auditeur en cours de formation); \ne) les documents décrivant les droits et devoirs des clients certifiés, y compris les exigences à respecter pour faire référence à sa certification dans sa communication, conformément aux exigences de 8.3; \nf) des informations relatives aux processus de traitement des plaintes et appels."
    2_label: "Notification des modifications émanant d’un organisme de certification"
    2_desc: "L’organisme de certification doit dûment aviser ses clients certifiés de toute modification qu’il envisage d’apporter à ses exigences en matière de certification. Il doit vérifier que chaque client certifié se conforme aux nouvelles exigences."
    3_label: "Notification des modifications émanant d’un client certifié"
    3_desc: "L’organisme de certification doit prendre des dispositions exécutoires pour assurer que le client certifié l’informe sans délai des questions qui peuvent compromettre la capacité du système de management à continuer de se conformer aux exigences de la norme utilisée pour la certification, par exemple des modifications concernant: \na) son statut juridique, commercial, ses propriétaires ou l’organisation; \nb) l’organisation et le management (par exemple le personnel clé tel que les dirigeants, les décisionnaires ou les techniciens); \nc) les coordonnées de la personne à contacter et les sites principaux; \nd) le périmètre des opérations réalisées dans le cadre du système de management certifié; \ne) les modifications importantes apportées au système de management et aux processus. \nL’organisme de certification doit prendre les mesures appropriées."
9:
  title: "Exigences relatives aux processus"
  1:
    title: "Activités préalables à la certification"
    1_label: "Demande de certification"
    1_desc: "L’organisme de certification doit demander à un représentant dûment autorisé de l’organisme candidat de lui fournir les informations requises pour lui permettre d’établir: \na) le périmètre recherché pour la certification; \nb) les détails pertinents de l’organisme candidat tels qu’exigés par le schéma de certification spécifique, y compris son nom, l’adresse de son (ses) site(s), ses processus et opérations, ses ressources humaines et techniques, ses fonctions, ses relations et toute obligation juridique applicable; \nc) l’identification des processus externalisés utilisés par l’organisme et qui affecteront la conformité aux exigences; \nd) les normes ou les autres exigences par rapport auxquelles l’organisme candidat souhaite être certifié; \ne) si des prestations de conseil en matière de système de management pour la certification ont été fournies, et si tel est le cas, par qui."
    2_prefix: "9.1.2.1"
    2_label: "Revue de la demande - 1"
    2_desc: "L’organisme de certification doit effectuer une revue de la candidature et des informations complémentaires concernant la certification pour assurer que: \na) les informations relatives à l’organisme candidat et à son système de management sont suffisantes pour élaborer un programme d’audit (voir 9.1.3); \nb) tout malentendu identifié entre l’organisme de certification et l’organisme candidat est résolu; \nc) l’organisme de certification a la compétence et la capacité d’effectuer la prestation de certification; \nd) le périmètre de la certification recherchée, le (les) site(s) où l’organisme candidat réalise ses interventions, la durée requise pour réaliser les audits ainsi que tout autre point ayant une influence sur les activités de certification sont pris en compte (tels que la langue, les conditions de sécurité, les menaces pour l’impartialité, etc.)."
    3_prefix: "9.1.2.2"
    3_label: "Revue de la demande - 2"
    3_desc: "Suite à la revue de la demande, l’organisme de certification doit soit accepter, soit refuser la demande de certification. Lorsque l’organisme de certification refuse une demande de certification suite à la revue de la demande, il doit documenter les raisons de son refus et les indiquer clairement au client."
    4_prefix: "9.1.2.3"
    4_label: "Revue de la demande - 3"
    4_desc: "Sur la base de cette revue, l’organisme de certification doit déterminer les compétences nécessaires pour l’équipe d’audit à missionner et pour la décision de certification."
    5_prefix: "9.1.3.1"
    5_label: "Programme d’audit - 1"
    5_desc: "Un programme d’audit d’un cycle complet de certification doit être élaboré pour identifier clairement la (les) activité(s) d’audit requise(s) pour démontrer que le système de management du client répond aux exigences de la certification suivant la (les) norme(s) ou autres documents normatifs choisis. Le programme d’audit pour le cycle de certification doit couvrir l’ensemble des exigences relatives au système de management."
    6_prefix: "9.1.3.2"
    6_label: "Programme d’audit - 2"
    6_desc: "Le programme d’audit pour la certification initiale doit comprendre un audit initial en deux étapes, des audits de surveillance durant la première et la deuxième années après la décision de certification et un audit de renouvellement de certification durant la troisième année avant l’expiration de la certification. Le premier cycle de certification de trois ans commence avec la décision de certification. Les cycles suivants commencent avec la décision de renouvellement de la certification (voir 9.6.3.2.3). La détermination du programme d’audit et tout ajustement ultérieur doivent tenir compte de la taille du client, du périmètre et de la complexité du système de management du client, des produits et des processus ainsi que du niveau démontré d’efficacité du système de management et des résultats d’audits précédents.\n\n ℹ️NOTE 1\nL’Annexe E présente un logigramme d’un audit et d’un processus de certification typique.\n\n ℹ️NOTE 2\nLa liste suivante énumère des éléments supplémentaires qui peuvent être pris en compte lors de l’élaboration ou de la révision d’un programme d’audit et qu’il peut également être nécessaire de prendre en compte lors de la détermination du périmètre de l’audit et de l’élaboration du plan d’audit: \n—  les plaintes reçues par l’organisme de certification sur le client; \n—  le type de l’audit: combiné, intégré ou conjoint \n—  les modifications apportées aux exigences de certification; \n—  les modifications apportées aux exigences légales; \n—  les modifications apportées aux exigences d’accréditation; \n—  les données de performances de l’organisation [par exemple niveaux d’anomalies, les données des indicateurs clés de performance, etc.); \n—  les préoccupations pertinentes des parties intéressées.\n\n ℹ️NOTE 3\nSi elle est spécifiée par le programme de certification spécifique au secteur, la durée du cycle de certification peut ne pas être de trois ans."
    7_prefix: "9.1.3.3"
    7_label: "Programme d’audit - 3"
    7_desc: "Les audits de surveillance doivent être effectués au moins une fois par année civile, excepté les années de renouvellement de la certification. La date du premier audit de surveillance suivant la certification initiale doit être fixée dans un délai maximal de douze mois à compter de la date de décision de certification.\n\n ℹ️NOTE\nIl peut être nécessaire d’adapter la fréquence des audits de surveillance afin de prendre en compte des facteurs tels que la saisonnalité ou la certification de systèmes de management sur une durée limitée (par exemple site de construction temporaire)."
    8_prefix: "9.1.3.4"
    8_label: "Programme d’audit - 4"
    8_desc: "Si l’organisme de certification tient compte de la certification déjà accordée au client et des audits réalisés par un autre organisme de certification, il doit obtenir et conserver des preuves suffisantes, telles que des rapports et la documentation des actions correctives, en cas de nonconformité. La satisfaction des exigences de la présente partie de l’ISO/IEC 17021 doit être étayée par la documentation conservée. L’organisme de certification doit, en se basant sur les informations obtenues, justifier et enregistrer tout ajustement du programme d’audit existant et suivre la mise en œuvre des actions correctives concernant les non-conformités antérieures."
    9_prefix: "9.1.3.5"
    9_label: "Programme d’audit - 5"
    9_desc: "Lorsque le client gère des équipes, les activités qui ont lieu pendant les rotations des équipes doivent être prises en compte lors de l’élaboration du programme d’audit et des plans d’audit."
    10_prefix: "9.1.4.1"
    10_label: "Programme d’audit - 1"
    10_desc: "L’organisme de certification doit disposer de procédures documentées pour la détermination du temps d’audit. Pour chaque client, l’organisme de certification doit déterminer le temps nécessaire à la planification et à la réalisation d’un audit complet et efficace du système de management du client."
    11_prefix: "9.1.4.2"
    11_label: "Programme d’audit - 2"
    11_desc: "Lorsqu’il détermine le temps d’audit, il convient que l’organisme de certification tienne compte, entre autres, des aspects suivants:\na) les exigences de la norme de système de management applicable; \nb) la taille et la complexité du client et de son système de management; \nc) le cadre technologique et réglementaire; \nd) toute externalisation d’activités comprises dans le domaine d’application du système de management; \ne) les résultats d’audits antérieurs; \nf) la taille et le nombre de sites, leur emplacement géographique et toutes spécificités multisites; \ng) les risques associés aux produits, aux processus ou aux activités de l’organisme; \nh) si les audits sont combinés, conjoints ou intégrés.\n\n ℹ️NOTE 1\nLe temps passé pour se rendre sur les sites audités n’est pas inclus dans le calcul de la durée des jours d’audit du système de management.\n\n ℹ️NOTE 2\nL’organisme de certification peut utiliser les lignes directrices établies dans l’ISO/IEC/TS 17023 pour déterminer la durée de l’audit du système de management lors de la rédaction de ces procédures.\n\nQuand des critères de compétences supplémentaires ont été déterminés pour un programme de certification spécifique, par exemple l’ISO/TS 22003 ou l’ISO/IEC 27006, ces critères doivent être appliqués."
    12_prefix: "9.1.4.3"
    12_label: "Programme d’audit - 3"
    12_desc: "La durée de l’audit du système de management et sa justification doivent être enregistrées."
    13_prefix: "9.1.4.4"
    13_label: "Programme d’audit - 4"
    13_desc: "Le temps passé par un membre quelconque de l’équipe qui n’a pas été désigné comme auditeur (c’est-à-dire les experts techniques, les traducteurs, les interprètes, les observateurs et les auditeurs en formation) ne doit pas être compté dans la durée de l’audit du système de management déterminée ci-dessus.\n\n ℹ️NOTE \nLe recours à des traducteurs et à des interprètes, peut nécessiter du temps supplémentaire."
    14_prefix: "9.1.5"
    14_label: "Échantillonnage multisite"
    14_desc: "Lorsqu’il est nécessaire de procéder à un échantillonnage multisite pour auditer le système de management d’un client couvrant la même activité en plusieurs emplacements géographiques, l’organisme de certification doit élaborer un programme d’échantillonnage afin de garantir une évaluation correcte du système de management. Les fondements du plan d’échantillonnage doivent être documentés pour chaque client. Pour certains programmes de certification spécifiques, l’échantillonnage n’est pas autorisé, et quand des critères spécifiques ont été déterminés pour un programme de certification donné, par exemple dans l’ISO/TS 22003, ces critères doivent s’appliquer.\n\n ℹ️NOTE \nDans le cas de plusieurs sites activité pas la même activité, un échantillonnage n’est pas approprié."
    15_prefix: "9.1.6"
    15_label: "Normes de systèmes de management multiples"
    15_desc: "Lorsque l’organisme de certification a accordé la certification par rapport à plusieurs normes de systèmes de management, la planification de l’audit doit assurer un temps d’audit sur site suffisant pour donner confiance dans la certification."
  2:
    title: "Planification des audits"
    1_prefix: "9.2.1.1"
    1_label: "Détermination des objectifs, du périmètre et des critères de l’audit - 1"
    1_desc: "Les objectifs de l’audit doivent être déterminés par l’organisme de certification. Le périmètre de l’audit et ses critères, y compris toutes modifications, doivent être établis par l’organisme de certification après discussion avec le client."
    2_prefix: "9.2.1.2"
    2_label: "Détermination des objectifs, du périmètre et des critères de l’audit - 2"
    2_desc: "Les objectifs de l’audit doivent décrire ce qui doit être réalisé par l’audit et doivent comporter: \na) la détermination de la conformité de tout ou parties du système de management du client, aux critères de l’audit; \nb) la détermination de la capacité du système de management à assurer que le client répond aux exigences légales, réglementaires et contractuelles applicables; NOTE Un audit de certification d’un système de management n’est pas un audit de conformité juridique; \nc) la détermination de l’efficacité du système de management à assurer que le client peut raisonnablement s’attendre à atteindre ses objectifs spécifiés; \nd) suivant le cas, l’identification des parties du système de management susceptibles d’être améliorées."
    3_prefix: "9.2.1.3"
    3_label: "Détermination des objectifs, du périmètre et des critères de l’audit - 3"
    3_desc: "Le périmètre de l’audit doit décrire l’étendue et les limites de l’audit, comme des sites, des unités organisationnelles, des activités et des processus à auditer. Lorsque le processus initial ou de renouvellement de la certification comprend plus d’un audit (par exemple lorsqu’il couvre différents sites), le périmètre de l’audit individuel peut ne pas couvrir la totalité du périmètre de la certification, mais l’ensemble des audits doit correspondre au périmètre du document de certification."
    4_prefix: "9.2.1.4"
    4_label: "Détermination des objectifs, du périmètre et des critères de l’audit - 4"
    4_desc: "Les critères d’audit doivent servir de référence pour la détermination de la conformité et doivent comprendre: \n— les exigences d’un document normatif défini sur les systèmes de management; \n— les processus définis et la documentation du système de management élaboré par le client."
    5_prefix: "9.2.2.1.1"
    5_label: "Constitution de l’équipe d’audit et affectation des missions - Généralités - 1"
    5_desc: "L’organisme de certification doit disposer d’un processus de sélection et de désignation de l’équipe d’audit, y compris le responsable de l’équipe d’audit et ses experts techniques si nécessaire, tenant compte des compétences nécessaires pour atteindre les objectifs de l’audit et des exigences d’impartialité. S’il n’y a qu’un seul auditeur, l’auditeur doit avoir les compétences pour réaliser les tâches d’un responsable d’équipe d’audit applicables à l’audit concerné. L’équipe d’audit doit disposer collectivement de toutes les compétences identifiées par l’organisme de certification, telles que définies en 9.1.2.3 pour l’audit."
    6_prefix: "9.2.2.1.2"
    6_label: "Constitution de l’équipe d’audit et affectation des missions - Généralités - 2"
    6_desc: "En décidant de la taille et de la composition de l’équipe d’audit, les points suivants doivent être pris en considération: \na) les objectifs de l’audit, son périmètre, ses critères, et la durée estimée de l’audit; \nb) si l’audit est un audit combiné, conjoint ou intégré; \nc) les compétences d’ensemble de l’équipe d’audit nécessaires pour atteindre les objectifs de l’audit (voir le Tableau A.1);\nd) les exigences de la certification (y compris toutes les exigences légales, réglementaires ou contractuelles applicables); \ne) la langue et la culture.\n\n ℹ️NOTE \nOn attend du responsable d’équipe d’un audit combiné ou intégré qu’il possède des connaissances approfondies d’au moins une des normes et qu’il soit sensibilisé aux autres normes utilisées pour cet audit spécifique."
    7_prefix: "9.2.2.1.3"
    7_label: "Constitution de l’équipe d’audit et affectation des missions - Généralités - 3"
    7_desc: "Les connaissances et le savoir-faire nécessaires du responsable de l’équipe d’audit et des auditeurs peuvent être complétés par des experts techniques, des traducteurs et des interprètes qui doivent opérer sous la direction d’un auditeur. Lorsqu’il est fait appel à des traducteurs ou des interprètes, ceux-ci doivent être sélectionnés de sorte à ne pas influencer l’audit outre mesure.\n\n ℹ️NOTE \nLes critères de sélection des experts techniques sont déterminés au cas par cas par les besoins de l’équipe d’audit et le périmètre de l’audit."
    8_prefix: "9.2.2.1.4"
    8_label: "Constitution de l’équipe d’audit et affectation des missions - Généralités - 4"
    8_desc: "Des auditeurs en formation peuvent participer à l’audit, à condition qu’un auditeur soit nommé comme évaluateur. L’évaluateur doit avoir les compétences nécessaires pour prendre le contrôle des tâches et assurer la responsabilité finale des actions et des résultats de l’auditeur en formation."
    9_prefix: "9.2.2.1.5"
    9_label: "Constitution de l’équipe d’audit et affectation des missions - Généralités - 5"
    9_desc: "Le responsable de l’équipe d’audit, en concertation avec l’équipe d’audit, doit attribuer à chaque membre de l’équipe la responsabilité d’auditer des processus, des fonctions, des sites, des domaines ou des activités spécifiques. Ces distributions de tâches doivent tenir compte des compétences, de l’utilisation réelle et efficace de l’équipe d’audit, ainsi que des différents rôles et responsabilités des auditeurs, des auditeurs en formation et des experts techniques. Des changements à la distribution des tâches peuvent se faire au fur et à mesure de l’avancée de l’audit pour assurer l’atteinte des objectifs de l’audit."
    10_prefix: "9.2.2.2.1"
    10_label: "Observateurs, experts techniques et guides - Observateurs - 1"
    10_desc: "La présence d’observateurs pendant une activité d’audit et sa justification doivent être convenues entre l’organisme de certification et le client avant le démarrage de l’audit. L’équipe d’audit doit s’assurer que les observateurs n’influencent pas ou ne perturbent pas le processus d’audit ou les résultats de l’audit outre mesure.\n\n ℹ️NOTE \nLes observateurs peuvent être des membres de l’organisme client, des consultants, du personnel d’un organisme d’accréditation, des autorités de réglementation ou toutes autres personnes dont la présence est justifiée."
    11_prefix: "9.2.2.2.2"
    11_label: "Observateurs, experts techniques et guides - Experts techniques - 2"
    11_desc: "Le rôle des experts techniques pendant une activité d’audit doit être convenu entre l’organisme de certification et le client avant le démarrage de l’audit. Au sein de l’équipe d’audit, un expert technique ne doit pas agir en tant qu’auditeur. Les experts techniques doivent être accompagnés d’un auditeur.\n\n ℹ️NOTE \nLes experts techniques peuvent fournir des conseils à l’équipe d’audit lors des phases de préparation, de planification ou d’audit."
    12_prefix: "9.2.2.2.3"
    12_label: "Observateurs, experts techniques et guides - Guides"
    12_desc: "Chaque auditeur doit être accompagné d’un guide, à moins qu’il n’en soit convenu autrement entre le responsable de l’équipe d’audit et le client. Le ou les guides sont mis à la disponibilité de l’équipe d’audit pour faciliter l’audit. L’équipe d’audit doit s’assurer que les observateurs n’influencent pas ou ne perturbent pas le processus d’audit ou les résultats de l’audit.\n\n ℹ️NOTE 1\nLes responsabilités d’un guide peuvent consister à:\na)  établir des contacts et organiser des entretiens; \nb) organiser des visites dans des parties spécifiques du site ou de l’organisme; \nc) s’assurer que les règles concernant les procédures d’hygiène et de sécurité du site sont connues et respectées par les membres de l’équipe d’audit; \nd) être témoin de l’audit pour le compte du client; \ne) fournir des éclaircissements ou des informations sur demande d’un auditeur.\n\n ℹ️NOTE 2\nSi nécessaire, l’audité peut aussi agir en tant que guide."
    13_prefix: "9.2.3.1"
    13_label: "Plan d'audit - Généralités"
    13_desc: "L’organisme de certification doit assurer qu’un plan d’audit est préalablement établi pour chaque audit identifié dans le programme d’audit pour servir de base à un accord concernant la réalisation et la programmation des activités d’audit.\n\n ℹ️NOTE \nIl n’est pas nécessaire qu’un organisme de certification élabore un plan d’audit pour chaque audit au moment de l’élaboration du programme d’audit."
    14_prefix: "9.2.3.2"
    14_label: "Plan d'audit - Préparation du plan d’audit"
    14_desc: "Le plan d’audit doit être adapté aux objectifs et au périmètre de l’audit. Le plan d’audit doit au moins inclure ou faire référence à ce qui suit: \na) les objectifs de l’audit; \nb) les critères de l’audit; \nc) le périmètre de l’audit, y compris l’identification des unités organisationnelles et fonctionnelles ou des processus à auditer; \nd) les dates des audits et les sites sur lesquels les activités d’audit sur site seront menées, y compris les visites sur les sites temporaires et les activités d’audit à distance, le cas échéant; \ne) la durée escomptée des activités d’audit sur site; \nf) les rôles et les responsabilités des membres de l’équipe d’audit et des personnes les accompagnant, tels que les observateurs ou les interprètes.\n\n ℹ️NOTE \nLes informations du plan d’audit peuvent figurer sur plusieurs documents."
    15_prefix: "9.2.3.3"
    15_label: "Plan d'audit - Communication des tâches de l’équipe d’audit"
    15_desc: "Les tâches attribuées à l’équipe d’audit doivent être définies et doivent amener l’équipe d’audit à: \na) examiner et vérifier la structure, les politiques, les processus, les procédures, les enregistrements et les documents associés du client relevant de la norme de système de management; \nb) confirmer leur conformité à toutes les exigences applicables au périmètre de la certification; \nc) confirmer que les processus et procédures sont établis, mis en œuvre et maintenus de manière efficace pour pouvoir accorder la confiance au système de management du client; \nd) informer le client de toutes les incohérences entre sa politique, ses objectifs et ses cibles, pour qu’il prenne des dispositions."
    16_prefix: "9.2.3.4"
    16_label: "Plan d'audit - Communication du plan d’audit"
    16_desc: "Le plan d’audit doit être communiqué et les dates de l’audit doivent être convenues à l’avance avec le client."
    17_prefix: "9.2.3.5"
    17_label: "Plan d'audit - Communication concernant les membres de l’équipe d’audit"
    17_desc: "L’organisme de certification doit fournir le nom et, lorsque cela est demandé, les informations nécessaires concernant chacun des membres de l’équipe d’audit au client dans un délai suffisant pour permettre à ce dernier de formuler une objection à la désignation d’un membre particulier de l’équipe d’audit et ainsi permettre à l’organisme de certification de reformer l’équipe en réponse à toute objection valide."
  3:
    title: "Certification initiale"
    1_prefix: "9.3.1.1"
    1_label: "Audit de certification initiale - Généralités"
    1_desc: "L’audit de certification initiale d’un système de management doit être mené en deux étapes: Étape 1 et Étape 2.\n\n ℹ️NOTE \nL’étape 1 ne nécessite pas de plan d’audit formel (voir 9.2.3)."
    2_prefix: "9.3.1.2.2"
    2_label: "Audit de certification initiale - Étape 1"
    2_desc: "L’étape 1 a pour objectifs: \na) de revoir les informations documentées du système de management du client; \nb) d’évaluer les conditions spécifiques au site du client et créer l’occasion d’un échange d’informations avec le personnel du client afin de déterminer le niveau de préparation pour l’étape 2; \nc) de procéder à une revue de l’état de l’organisme client et de sa compréhension des exigences de la norme, notamment en ce qui concerne l’identification des performances clés ou des aspects, des processus, des objectifs et du fonctionnement significatifs du système de management; \nd) d’obtenir les informations nécessaires concernant le périmètre du système de management, y compris: — le ou les sites du client; — les processus et l’équipement utilisés; — les niveaux de maîtrises établis (en particulier dans le cas de clients multisites); — les exigences légales et réglementaires applicables; \ne) procéder à une revue de l’affectation des ressources pour l’étape 2 et convenir avec le client des détails de l’étape 2; \nf) de permettre la planification de l’étape 2, une fois acquise une compréhension suffisante du système de management du client et du fonctionnement du site dans le contexte de la norme de système de management ou d’un autre document normatif;\ng) de déterminer si les audits internes et les revues de direction ont été planifiés et réalisés et si le niveau de mise en œuvre du système de management atteste que l’organisme client indique qu’il est prêt pour l’étape 2.\n\n ℹ️NOTE \nIl n’est pas nécessaire que les données de sortie de l’étape 1 remplissent toutes les exigences d’un rapport (voir 9.4.8)."
    3_prefix: "9.3.1.2.3"
    3_label: "Audit de certification initiale - Étape 1"
    3_desc: "Les conclusions documentées concernant la réalisation des objectifs de l’étape 1 et le niveau de préparation pour l’étape 2 doivent être communiquées au client, y compris l’identification de tout problème susceptible d’être classé comme une non-conformité au cours de l’étape 2.\n\n ℹ️NOTE \nIl n’est pas nécessaire que les données de sortie de l’étape 1 remplissent toutes les exigences d’un rapport (voir 9.4.8)."
    4_prefix: "9.3.1.2.4"
    4_label: "Audit de certification initiale - Étape 1"
    4_desc: "Pour déterminer l’intervalle entre l’étape 1 et l’étape 2, il faut prendre en considération ce dont le client aura besoin pour résoudre les problèmes identifiés au cours de l’étape 1. L’organisme de certification peut également avoir besoin de revoir ses dispositions pour l’étape 2. Si des modifications significatives susceptibles d’affecter le système de management interviennent, l’organisme de certification doit envisager la nécessité de répéter tout ou partie de l’étape 1. Le client doit être informé que les résultats de l’étape 1 peuvent entraîner le report ou l’annulation de l’étape 2."
    5_prefix: "9.3.1.3"
    5_label: "Audit de certification initiale - Étape 2"
    5_desc: "L’objet de l’étape 2 est d’évaluer la mise en œuvre et l’efficacité du système de management du client. L’étape 2 doit se dérouler sur le ou les sites du client. Elle doit comprendre au minimum l’audit des éléments suivants: \na) les informations et les preuves relatives à la conformité à toutes les exigences de la norme relative au système de management ou d’autres documents normatifs applicables; \nb) la surveillance, le mesurage, le compte rendu et la revue des performances par rapport aux objectifs de performance clé et aux cibles (en cohérence avec les attentes de la norme de système de management ou de tout autre document normatif applicable); \nc) l’aptitude du système de management du client et ses performances concernant la satisfaction des exigences légales, réglementaires et contractuelles applicables; \nd) la maîtrise opérationnelle des processus du client; \ne) les audits internes et la revue de direction; \nf) les responsabilités de la direction vis-à-vis des politiques de l’organisme client."
    6_prefix: "9.3.1.4"
    6_label: "Audit de certification initiale - Conclusions de l’audit de certification initiale"
    6_desc: "L’équipe d’audit doit analyser toutes les informations et les preuves réunies au cours de l’étape 1 et de l’étape 2 afin de passer en revue les résultats et de déterminer les conclusions de l’audit."
  4:
    title: "Réalisation des audits"
    1_prefix: "9.4.1"
    1_label: "Généralités"
    1_desc: "Pour réaliser des audits sur site, l’organisme de certification doit disposer d’un processus. Ce processus doit comporter une réunion d’ouverture au début de l’audit et une réunion de clôture à la fin de l’audit. \nSi une partie de l’audit est réalisée par voie électronique, ou si le site à auditer est virtuel, l’organisme de certification doit s’assurer que ces activités sont menées par du personnel ayant les compétences appropriées. Les preuves obtenues au cours de ce type d’audit doivent être suffisantes pour permettre à l’auditeur de prendre une décision éclairée concernant la conformité de l’exigence en question.\n\n ℹ️NOTE \nLes audits « sur site » peuvent comprendre l’accès à distance à un ou des sites électroniques comportant des informations pertinentes pour l’audit du système de management. L’utilisation de moyens électroniques pour la conduite des audits peut également être prise en considération."
    2_prefix: "9.4.2"
    2_label: "Conduite de la réunion d’ouverture"
    2_desc: "Une réunion d’ouverture formelle doit être tenue avec la direction du client et, le cas échéant, les responsables des fonctions ou des processus à auditer. La réunion d’ouverture, normalement animée par le responsable de l’équipe d’audit, a pour objectif de fournir une courte explication sur la façon dont les activités d’audit vont se dérouler. Le degré de détail doit être adapté à la familiarité du client avec le processus d’audit et doit comporter les éléments suivants: \na) présentation des participants et une description succincte de leurs rôles; \nb) confirmation du périmètre de la certification; \nc) confirmation du plan d’audit (y compris le type et le périmètre de l’audit, les objectifs et les critères), des modifications éventuelles et des autres dispositions importantes, comme la date et l’heure de la réunion de clôture, des réunions intermédiaires entre l’équipe d’audit et la direction du client; \nd) confirmation des circuits de communication officiels entre l’équipe d’audit et le client; \ne) confirmation de la disponibilité des ressources et de la logistique nécessaire à l’équipe d’audit; \nf) confirmation des points relatifs à la confidentialité; \ng) confirmation des procédures d’hygiène, d’urgence et de sécurité pour l’équipe d’audit; \nh) confirmation de la disponibilité, des rôles et de l’identité des guides et des observateurs; \ni) méthode utilisée pour rendre compte des constats d’audit y compris leur classement; \nj)informations sur les conditions dans lesquelles il peut être mis fin à l’audit prématurément; \nk) confirmation que le responsable de l’équipe d’audit et l’équipe d’audit, qui représentent l’organisme de certification, sont responsables de l’audit et de l’exécution du plan d’audit, y compris des activités et des cheminements d’audit; \nl) confirmation du statut des constats de la revue ou de l’audit précédent, le cas échéant; \nm) méthodes et procédures utilisées pour conduire l’audit sur la base d’un échantillonnage; \nn) confirmation de la langue à utiliser pendant l’audit; \no) confirmation du fait que, pendant l’audit, le client sera tenu informé de l’avancement de l’audit; \np) opportunité du client de poser des questions."
    3_prefix: "9.4.3.1"
    3_label: "Conduite de la réunion de clôture - 1"
    3_desc: "Pendant l’audit, l’équipe d’audit doit évaluer périodiquement les avancées de l’audit et échanger des informations. Le responsable de l’équipe d’audit doit redistribuer, si nécessaire, le travail entre les membres de l’équipe d’audit et informer régulièrement le client des avancées de l’audit et des éventuelles difficultés."
    4_prefix: "9.4.3.2"
    4_label: "Conduite de la réunion de clôture - 2"
    4_desc: "Lorsque les preuves disponibles de l’audit indiquent que les objectifs de l’audit sont irréalisables ou suggèrent la présence d’un risque immédiat et significatif (par exemple en matière de sécurité), le responsable de l’équipe d’audit doit rapporter ces faits au client et, si possible, à l’organisme de certification pour déterminer une action appropriée. Une telle action peut comprendre la reconfirmation ou la modification du plan d’audit, la modification des objectifs ou du périmètre de l’audit, ou l’arrêt de l’audit. Le responsable de l’équipe d’audit doit rendre compte à l’organisme de certification du résultat de l’action entreprise."
    5_prefix: "9.4.3.3"
    5_label: "Conduite de la réunion de clôture - 3"
    5_desc: "Le responsable de l’équipe d’audit doit revoir avec le client toute nécessité de modification du périmètre de l’audit qui se dégage au fur et à mesure de l’avancée des activités d’audit sur site et en rendre compte à l’organisme de certification."
    6_prefix: "9.4.4.1"
    6_label: "Obtention et vérification des informations - 1"
    6_desc: "Pendant l’audit, les informations relatives aux objectifs, au périmètre et aux critères de l’audit (y compris les informations relatives aux interfaces entre les fonctions, les activités et les processus) doivent être obtenues à l’aide d’un échantillonnage approprié, puis vérifiées pour devenir des preuves d’audit."
    7_prefix: "9.4.4.2"
    7_label: "Obtention et vérification des informations - 2"
    7_desc: "Les méthodes permettant d’obtenir les informations comprennent les éléments suivants, dont la liste n’est pas exhaustive: \na) des entretiens; \nb) l’observation des processus et des activités; \nc) la revue des documents et des enregistrements."
    8_prefix: "9.4.5.1"
    8_label: "Identification et enregistrement des constats d’audit - 1"
    8_desc: "Les constats d’audit résumant la conformité et détaillant la non-conformité doivent être identifiés, classés et enregistrés pour décider, en toute connaissance de cause, de la délivrance ou du maintien d’une certification."
    9_prefix: "9.4.5.2"
    9_label: "Identification et enregistrement des constats d’audit - 2"
    9_desc: "À moins que les exigences d’un programme de certification de système de management ne l’interdisent, il est possible d’identifier et d’enregistrer des suggestions d’amélioration. Toutefois, les constats d’audit qui correspondent à des non-conformités ne doivent pas être enregistrés en tant que suggestions d’amélioration."
    10_prefix: "9.4.5.3"
    10_label: "Identification et enregistrement des constats d’audit - 3"
    10_desc: "Un constat de non-conformité doit être enregistré par rapport à une exigence spécifique et doit comporter un énoncé clair de la non-conformité, identifiant en détail les éléments objectifs sur lesquels repose la non-conformité. Les non-conformités doivent faire l’objet d’une discussion avec le client, en vue de s’assurer que les éléments de preuve sont exacts et que les non-conformités sont bien comprises. L’auditeur doit cependant s’abstenir d’avancer les causes des non-conformités ou de préconiser des solutions."
    11_prefix: "9.4.5.4"
    11_label: "Identification et enregistrement des constats d’audit - 4"
    11_desc: "Le responsable de l’équipe d’audit doit tenter de résoudre toute divergence d’opinion entre l’équipe d’audit et le client sur les preuves ou les constats d’audit. Les points non résolus doivent être enregistrés."
    12_prefix: "9.4.6"
    12_label: "Préparation des conclusions d’audit"
    12_desc: "Sous la responsabilité du responsable de l’équipe d’audit et avant la réunion de clôture, l’équipe d’audit doit: \na) procéder à une revue des constats d’audit et de toute autre information appropriée obtenue pendant l’audit, par rapport aux objectifs et aux critères de l’audit et classer les non-conformités;\nb) se mettre d’accord sur les conclusions de l’audit, en tenant compte de l’incertitude inhérente au processus d’audit; \nc) se mettre d’accord sur toute action de suivi le cas échéant; \nd) confirmer l’adéquation du programme d’audit ou identifier toute modification nécessaire pour les audits futurs (par exemple le périmètre de certification, le temps ou les dates de l’audit, la fréquence des actions de surveillance, les compétences de l’équipe d’audit)."
    13_prefix: "9.4.7.1"
    13_label: "Conduite de la réunion de clôture - 1"
    13_desc: "Une réunion de clôture formelle, pour laquelle la liste des participants doit être enregistrée, doit être tenue avec la direction du client et, le cas échéant, les responsables des fonctions ou des processus audités. La réunion de clôture, généralement animée par le responsable de l’équipe d’audit, a pour objectif de présenter les conclusions de l’audit, y compris les recommandations relatives à la certification. Les non-conformités doivent être présentées de façon à être comprises et le délai de réponse doit être fixé d’un commun accord.\n\n ℹ️NOTE\n« Comprises » ne signifie pas nécessairement que les non-conformités ont été acceptées par le client."
    14_prefix: "9.4.7.2"
    14_label: "Conduite de la réunion de clôture - 2"
    14_desc: "La réunion de clôture doit aussi inclure les éléments suivants lorsque le degré de détail doit être adapté à la familiarité du client avec le processus d’audit: \na) notifier au client que les preuves d’audit obtenues étaient fondées sur un échantillon d’informations, introduisant, de ce fait, un élément d’incertitude; \nb) la méthode et le délai utilisés pour rendre compte, y compris le classement des constats d’audit; \nc) le processus de l’organisme de certification pour le traitement des non-conformités, incluant toutes les conséquences relatives au statut de la certification du client; \nd) le délai dans lequel le client doit soumettre un plan de correction et une action corrective pour toute non-conformité identifiée pendant l’audit; \ne) les activités post-audit de l’organisme de certification; \nf) des informations sur les processus de traitement des plaintes et des appels."
    15_prefix: "9.4.7.3"
    15_label: "Conduite de la réunion de clôture - 3"
    15_desc: "Le client doit avoir la possibilité de poser des questions. Les divergences d’opinion sur les constats ou les conclusions d’audit entre l’équipe d’audit et le client doivent faire l’objet d’une discussion et, dans la mesure du possible, doivent être résolues. Les divergences d’opinion qui n’ont pas été résolues doivent être enregistrées et transmises à l’organisme de certification."
    16_prefix: "9.4.8.1"
    16_label: "Rapport d’audit - 1"
    16_desc: "L’organisme de certification doit fournir un rapport écrit pour chaque audit au client. L’équipe d’audit peut également présenter des suggestions à l’organisme client pour l’amélioration mais elle ne doit pas recommander des solutions spécifiques. Le rapport d’audit demeure la propriété de l’organisme de certification."
    17_prefix: "9.4.8.2"
    17_label: "Rapport d’audit - 2"
    17_desc: "Le responsable de l’équipe d’audit doit s’assurer de la préparation du rapport d’audit. Il doit être responsable de son contenu. Le rapport d’audit doit fournir un enregistrement précis, concis et clair de l’audit pour permettre de prendre une décision de certification éclairée et doit comporter ou faire référence à ce qui suit: \na) l’identification de l’organisme de certification; \nb) le nom et l’adresse du client et de la personne représentant le client;\nc) le type d’audit (par exemple audit initial, de surveillance, de renouvellement de la certification ou audits spéciaux); \nd) les critères de l’audit; \ne) les objectifs de l’audit; \nf) le périmètre d’audit, notamment l’identification des unités organisationnelles ou fonctionnelles ou les processus audités, ainsi que la durée de l’audit; \ng) tout écart par rapport au plan d’audit et les raisons expliquant ces écarts; \nh) tout élément significatif ayant des effets sur le programme d’audit; \ni) l’identification du responsable de l’équipe d’audit, des membres de l’équipe d’audit et des personnes accompagnantes; \nj) les dates et les lieux où les activités d’audit (sur site ou en dehors, sites permanents ou temporaires) ont été réalisées; \nk) les constats (voir 9.4.5), les références aux preuves et les conclusions de l’audit, correspondant aux exigences du type d’audit; \nl) toute modification significative affectant le système de management du client depuis la réalisation du dernier audit; \nm) tout problème non résolu, le cas échéant; \nn) le cas échéant, si l’audit est combiné, conjoint ou intégré; \no) une déclaration de non-responsabilité indiquant que l’audit est basé sur un processus d’échantillonnage des informations disponibles; \np) des recommandations formulées par l’équipe d’audit \nq) le client audité maîtrise efficacement l’utilisation des documents et marques de certification, le cas échéant; \nr) la vérification de l’efficacité des actions correctives menées concernant les non-conformités précédemment identifiées, le cas échéant."
    18_prefix: "9.4.8.3"
    18_label: "Rapport d’audit - 3"
    18_desc: "Le rapport doit également contenir: \na) une déclaration sur la conformité et l’efficacité du système de management ainsi qu’un récapitulatif des preuves relatives aux éléments suivants: \n\t— l’aptitude du système de management à satisfaire les exigences applicables et à obtenir les résultats escomptés; \n\t— les processus d’audit interne et de revue de direction; \nb) une conclusion concernant l’adéquation du périmètre de la certification; \nc) la confirmation que les objectifs de l’audit ont été remplis."
    19_prefix: "9.4.9"
    19_label: "Analyse des causes de non-conformités"
    19_desc: "L’organisme audité doit décrire les corrections et actions correctives spécifiques entreprises ou qu’il prévoit d’entreprendre afin d’éliminer, dans un délai déterminé, les non-conformités détectées et leurs causes et de remédier à toutes les non-conformités qui ont été identifiées."
    20_prefix: "9.4.10"
    20_label: "Efficacité des corrections et actions correctives"
    20_desc: "L’organisme de certification doit passer en revue les corrections, les causes identifiées et les actions correctives soumises par le client pour déterminer si elles sont acceptables. L’organisme de certification doit vérifier l’efficacité des corrections et des actions correctives entreprises. Les preuves obtenues pour confirmer la résolution des non-conformités doivent être enregistrées. Le client doit être tenu informé du résultat de la revue et de la vérification. Le client doit être informé de la nécessité de réaliser un audit complet ou un audit partiel supplémentaire ou de fournir une preuve documentée (à confirmer au cours des audits ultérieurs), pour vérifier que les corrections et actions correctives prévues ont bien été menées.\n\n ℹ️NOTE \nLa vérification de l’efficacité de la correction et de l’action corrective peut être réalisée sur la base d’un examen des informations documentées fournies par le client ou, si nécessaire, par une vérification sur site. Généralement cette activité est effectuée par un membre de l’équipe d’audit."
  5:
    title: "Décision de certification"
    1_prefix: "9.5.1.1"
    1_label: "Généralités - 1"
    1_desc: "L’organisme de certification doit assurer que les personnes ou les comités qui prennent les décisions d’octroi ou de refus de la certification, d’extension ou de réduction du périmètre de la certification, de suspension ou de rétablissement de la certification, de retrait ou de renouvellement de la certification, sont différents de celles ou ceux ayant réalisé les audits. La ou les personnes chargées de décider de la certification doivent avoir les compétences appropriées."
    2_prefix: "9.5.1.2"
    2_label: "Généralités - 2"
    2_desc: "La ou les personnes [à l’exclusion des membres des comités (voir 6.1.4)] désignées par l’organisme de certification pour prendre une décision de certification doivent être employées, ou soumises à une disposition exécutoire, par l’organisme de certification ou une entité sous maîtrise organisationnelle de l’organisme de certification. La maîtrise organisationnelle d’un organisme de certification doit se présenter sous l’une des formes suivantes: \na) possession totale ou majoritaire d’une autre entité par l’organisme de certification; \nb) participation majoritaire de l’organisme de certification dans le conseil d’administration d’une autre entité; \nc) une autorité documentée de l’organisme de certification sur une autre entité dans un réseau d’entités juridiques (dans lequel réside l’organisme de certification), fondée sur la propriété ou le contrôle du conseil d’administration.\n\n ℹ️NOTE \nPour les organismes de certification gouvernementaux, d’autres parties du même gouvernement peuvent être considérées comme liées par la propriété à l’organisme de certification."
    3_prefix: "9.5.1.3"
    3_label: "Généralités - 3"
    3_desc: "Les personnes employées par, ou sous contrat avec, des entités sous maîtrise organisationnelle doivent remplir les mêmes exigences de la présente partie de l’ISO/IEC 17021 que les personnes employées par, ou sous contrat avec, l’organisme de certification."
    4_prefix: "9.5.1.4"
    4_label: "Généralités - 4"
    4_desc: "L’organisme de certification doit enregistrer chaque décision de certification, y compris toute information supplémentaire ou tout éclaircissement obtenu(e) auprès de l’équipe d’audit ou de toute autre source."
    5_prefix: "9.5.2"
    5_label: "Actions précédant la prise de décision"
    5_desc: "Avant de prendre sa décision de l’octroi de la certification, de l’extension ou de la réduction du périmètre de la certification, du renouvellement, de la suspension ou du rétablissement, ou du retrait de la certification, l’organisme de certification doit disposer d’un processus pour conduire une revue efficace, incluant: \na) les informations fournies par l’équipe d’audit sont suffisantes eu égard aux exigences et au périmètre de la certification; \nb) pour toutes les non-conformités majeures, il a examiné, accepté et vérifié les corrections et actions correctives; \nc) pour toute non-conformité mineure, il a examiné et accepté le plan du client relatif aux corrections et actions correctives."
    6_prefix: "9.5.3.1"
    6_label: "Informations sur la délivrance d’une certification initiale - 1"
    6_desc: "Les informations fournies par l’équipe d’audit à l’organisme de certification pour lui permettre de prendre une décision doivent, au minimum, comprendre les éléments suivants: \na) le rapport d’audit; \nb) les observations relatives aux non-conformités et, le cas échéant, les corrections et actions correctives entreprises par l’organisme client; \nc) la confirmation des informations fournies à l’organisme de certification et utilisées pour la revue de la demande (voir 9.1.2); \nd) la confirmation que les objectifs de l’audit ont été atteints; \ne) une recommandation relative à la décision de délivrer ou non la certification, accompagnée de toutes réserves ou observations."
    7_prefix: "9.5.3.2"
    7_label: "Informations sur la délivrance d’une certification initiale - 2"
    7_desc: "Si l’organisme de certification n’est pas en mesure de vérifier la mise en œuvre des corrections et actions correctives pour toute non-conformité majeure dans un délai de 6 mois à compte du dernier jour de l’étape 2, l’organisme de certification doit recommencer l’étape 2 avant de recommander la certification."
    8_prefix: "9.5.3.3"
    8_label: "Informations sur la délivrance d’une certification initiale - 3"
    8_desc: "Si l’organisme de certification n’est pas en mesure de vérifier la mise en œuvre des corrections et actions correctives pour toute non-conformité majeure dans un délai de 6 mois à compte du dernier jour de l’étape 2, l’organisme de certification doit recommencer l’étape 2 avant de recommander la certification.\n\n ℹ️NOTE \nLes programmes de certification peuvent comprendre des règles spécifiques en matière de transfert de certification."
    9_prefix: "9.5.4"
    9_label: "Informations pour la délivrance d’un renouvellement de certification"
    9_desc: "L’organisme de certification doit prendre les décisions de renouvellement de la certification en se fondant sur les résultats de l’audit de renouvellement ainsi que sur les résultats de la revue du système correspondant à la période de certification et sur les plaintes reçues de la part des utilisateurs de la certification."
  6:
    title: "Maintien de la certification"
    1_prefix: "9.6.1"
    1_label: "Généralités"
    1_desc: "L’organisme de certification doit maintenir la certification en s’appuyant sur la démonstration que le client continue de satisfaire aux exigences de la norme de système de management. Il peut maintenir la certification d’un client sur la base d’une conclusion favorable formulée par le responsable de l’équipe d’audit, sans pour autant procéder à une revue ou une décision ultérieure indépendante, à condition que: \na) pour toute non-conformité majeure ou autre situation susceptible de donner lieu à la suspension ou au retrait de la certification, l’organisme de certification dispose d’un système imposant au responsable de l’équipe d’audit d’informer l’organisme de certification du besoin de réaliser une revue avec du personnel compétent (voir 7.2.8) et différentes de celui ayant effectué l’audit afin de déterminer le maintien ou non de la certification; \nb) l’organisme de certification emploie un personnel dûment qualifié pour surveiller ses activités de surveillance, y compris la surveillance des rapports de ses auditeurs, afin de confirmer que le processus de certification fonctionne de manière efficace."
    2_prefix: "9.6.2.1.1"
    2_label: "Activités de surveillance - Généralités - 1"
    2_desc: "L’organisme de certification doit concevoir ses activités de surveillance de manière que les domaines et les fonctions représentatifs couverts par le système de management fassent l’objet d’un suivi régulier. Il doit tenir compte des modifications effectuées chez le client certifié et apportées au système de management de celui-ci."
    3_prefix: "9.6.2.1.2"
    3_label: "Activités de surveillance - Généralités - 2"
    3_desc: "Les activités de surveillance doivent comporter des audits sur site permettant de vérifier la conformité du système de management du client certifié aux exigences spécifiées dans la norme par rapport à laquelle la certification est octroyée. D’autres activités de surveillance peuvent inclure: \na) des enquêtes de l’organisme de certification adressées au client certifié sur des aspects touchant la certification; \nb) la revue des déclarations du client certifié en ce qui concerne ses opérations (par exemple matériel promotionnel, site Web); \nc) les demandes faites au client certifié de fournir des informations documentées (sur papier ou par voie électronique); \nd) les autres moyens de surveillance des performances du client certifié."
    4_prefix: "9.6.2.2"
    4_label: "Activités de surveillance - Audit de surveillance"
    4_desc: "Les audits de surveillance sont des audits sur site qui ne sont pas nécessairement des audits du système complet et qui doivent donc être planifiés en même temps que les autres activités de surveillance de manière que l’organisme de certification puisse garder confiance dans le système de management certifié du client et dans sa capacité à rester conforme aux exigences de la certification dans l’intervalle entre deux audits de renouvellement de la certification. Chaque surveillance selon la norme de système de management applicable doit porter sur les éléments suivants: \na) les audits internes et la revue de direction; \nb) la revue des actions entreprises vis-à-vis des non-conformités identifiées au cours de l’audit précédent; \nc) le traitement des plaintes; \nd) l’efficacité du système de management par rapport à la réalisation des objectifs du client certifié et des résultats escomptés du(des) système(s) de management pertinent(s); \ne) l’état d’avancement des activités planifiées visant à l’amélioration continue; \nf) la maîtrise opérationnelle continue;e) la revue de toute modification apportée; \nh) l’utilisation des marques et/ou toute autre référence à la certification."
    5_prefix: "9.6.3.1.1"
    5_label: "Renouvellement de la certification - Planification de l’audit pour le renouvellement de la certification - 1"
    5_desc: "Le but de l’audit de renouvellement est de confirmer le maintien de la conformité et de l’efficacité du système de management dans son ensemble ainsi que sa pertinence et son applicabilité en permanence au regard du périmètre de la certification. Un audit de renouvellement de la certification doit être planifié et effectué en vue d’évaluer le maintien de la conformité à toutes les exigences de la norme relative au système de management ou de tout autre document normatif applicable. Ceci doit être planifié et effectué en temps opportun pour organiser le renouvellement avant la date d’expiration du certificat."
    6_prefix: "9.6.3.1.2"
    6_label: "Renouvellement de la certification - Planification de l’audit pour le renouvellement de la certification - 2"
    6_desc: "L’activité de renouvellement de la certification doit comprendre la revue des rapports d’audit de surveillance précédents et doit tenir compte des performances du système de management pendant le cycle de certification le plus récent."
    7_prefix: "9.6.3.1.3"
    7_label: "Renouvellement de la certification - Planification de l’audit pour le renouvellement de la certification - 3"
    7_desc: "Lorsque des modifications significatives sont apportées au système de management, à l’organisme client ou au contexte dans lequel le système de management opère (par exemple modifications de la législation), l’activité correspondant à un audit de renouvellement de la certification peut nécessiter une étape 1.\n\n ℹ️NOTE \nCes modifications peuvent intervenir à tout moment au cours du cycle de certification et il peut être nécessaire que l’organisme de certification réalise un audit spécial (voir 9.6.4) qui peut être ou non un audit en deux étapes."
    8_prefix: "9.6.3.2.1"
    8_label: "Renouvellement de la certification - Audit de renouvellement de la certification - 1"
    8_desc: "L’audit de renouvellement de la certification doit comporter un audit sur site, qui traite des points suivants: \na) l’efficacité du système de management dans sa totalité, à la lumière des changements internes et externes ainsi que sa pertinence et son applicabilité en permanence au regard du périmètre de la certification; \nb) la preuve de l’engagement à maintenir l’efficacité et l’amélioration du système de management afin d’augmenter les performances globales; \nc) l’efficacité du système de management par rapport à la réalisation des objectifs du client certifié et des résultats escomptés du(des) système(s) de management pertinent(s)."
    9_prefix: "9.6.3.2.2"
    9_label: "Renouvellement de la certification - Audit de renouvellement de la certification - 2"
    9_desc: "Pour toute non-conformité majeure, l’organisme de certification doit fixer des délais pour la mise en œuvre de corrections et d’actions correctives. Ces actions doivent être mises en œuvre et vérifiées avant l’expiration de la certification."
    10_prefix: "9.6.3.2.3"
    10_label: "Renouvellement de la certification - Audit de renouvellement de la certification - 3"
    10_desc: "Lorsque les activités de renouvellement de la certification sont terminées avec succès avant la date d’expiration de la certification existante, la date d’expiration de la nouvelle certification peut être basée sur la date d’expiration de la certification existante. La date de délivrance indiquée sur un nouveau certificat doit correspondre à la date de la décision de renouvellement de la certification ou à une date ultérieure."
    11_prefix: "9.6.3.2.4"
    11_label: "Renouvellement de la certification - Audit de renouvellement de la certification - 4"
    11_desc: "Si l’organisme de certification n’a pas terminé l’audit de renouvellement de la certification ou s’il n’est pas en mesure de vérifier la mise en œuvre des corrections et actions correctives pour toute nonconformité majeure (voir 9.5.2.1) avant la date d’expiration de la certification, alors le renouvellement de la certification ne doit pas être recommandé et la validité de la certification ne doit pas être prolongée. Le client doit en être informé et les conséquences doivent lui être expliquées."
    12_prefix: "9.6.3.2.5"
    12_label: "Renouvellement de la certification - Audit de renouvellement de la certification - 5"
    12_desc: "L’organisme de certification peut rétablir une nouvelle certification dans les 6 mois qui suivent l’expiration de la certification, sous réserve que les activités de renouvellement de la certification non résolues soient terminées, à défaut un audit d’étape 2 doit au minimum être réalisé. La date d’entrée en vigueur figurant sur le certificat doit correspondre à la date de la décision de renouvellement de la certification ou à une date ultérieure et la date d’expiration doit être basée sur le cycle de certification antérieur."
    13_prefix: "9.6.4.1"
    13_label: "Audits particuliers - Extension du périmètre"
    13_desc: "En réponse à une demande d’extension du périmètre d’une certification déjà accordée, l’organisme de certification doit entreprendre une revue de la candidature et déterminer toute activité d’audit nécessaire pour décider de la possibilité ou non d’accorder l’extension. Cette démarche peut être effectuée au même moment que l’audit de surveillance."
    14_prefix: "9.6.4.2"
    14_label: "Audits particuliers - Audits avec un préavis très court"
    14_desc: "L’organisme de certification peut être amené à réaliser des audits de clients certifiés avec un très court préavis ou inopinés afin d’instruire des plaintes ou suite à des modifications ou pour effectuer un suivi des clients suspendus. Dans ces cas: \na) l’organisme de certification doit décrire et porter préalablement à la connaissance des clients certifiés (par exemple dans les documents décrits en 8.5.1) les conditions dans lesquelles ces audits seront conduits; \nb) l’organisme de certification doit apporter un soin tout particulier à la désignation de l’équipe d’audit du fait de l’impossibilité pour l’organisme client de formuler une objection sur les membres de l’équipe d’audit."
    15_prefix: "9.6.5.1"
    15_label: "Audits particuliers - Suspension, retrait ou réduction du périmètre de la certification - 1"
    15_desc: "L’organisme de certification doit avoir une politique et une ou plusieurs procédures documentées traitant de la suspension, du retrait ou de la réduction du périmètre de la certification et il doit définir les actions qu’il doit mener en conséquence."
    16_prefix: "9.6.5.2"
    16_label: "Audits particuliers - Suspension, retrait ou réduction du périmètre de la certification - 2"
    16_desc: "L’organisme de certification doit suspendre la certification, par exemple, dans les cas où: \n— le système de management certifié a constamment ou gravement manqué au respect des exigences de la certification, y compris l’exigence relative à l’efficacité du système de management; \n— le client certifié n’a pas permis la réalisation des audits de surveillance ou de renouvellement de la certification selon la périodicité requise, ou; \n— l’organisme certifié a volontairement demandé une suspension."
    17_prefix: "9.6.5.3"
    17_label: "Audits particuliers - Suspension, retrait ou réduction du périmètre de la certification - 3"
    17_desc: "Lorsqu’elle est suspendue, la certification du système de management du client est provisoirement invalidée."
    18_prefix: "9.6.5.4"
    18_label: "Audits particuliers - Suspension, retrait ou réduction du périmètre de la certification - 4"
    18_desc: "L’organisme de certification doit rétablir la certification suspendue si le problème qui a abouti à la suspension a été résolu. Tout manquement à la résolution des problèmes dans le délai établi par l’organisme de certification doit donner lieu au retrait ou à la réduction du périmètre de la certification.\n\n ℹ️NOTE \nDans la plupart des cas, la suspension ne devrait pas dépasser six mois."
    19_prefix: "9.6.5.5"
    19_label: "Audits particuliers - Suspension, retrait ou réduction du périmètre de la certification - 5"
    19_desc: "Lorsque le client certifié a constamment ou gravement manqué au respect des exigences de la certification pour certains éléments relevant du périmètre de la certification, l’organisme de certification doit réduire le périmètre de la certification pour exclure les éléments ne satisfaisant pas aux exigences. Une telle réduction du périmètre doit être conforme aux exigences de la norme sur laquelle s’appuie la certification."
  7:
    title: "Appels"
    1_label: "Appels - 1"
    1_desc: "L’organisme de certification doit avoir un processus documenté lui permettant de recevoir, d’évaluer et de prendre des décisions en cas d’appel."
    2_label: "Appels - 2"
    2_desc: "L’organisme de certification doit être responsable de toutes les décisions prises à tous les niveaux du processus de traitement des appels. L’organisme de certification doit assurer que les personnes impliquées dans le processus de traitement des appels sont différentes de celles ayant réalisé les audits et pris des décisions de certification."
    3_label: "Appels - 3"
    3_desc: "Les soumissions, les analyses et les décisions relatives aux appels ne doivent pas donner lieu à des actions discriminatoires envers l’appelant."
    4_label: "Appels - 4"
    4_desc: "Le processus de traitement des appels doit au moins comprendre les éléments et les méthodes suivants: \na) le principe général du processus de réception, de validation et d’examen de l’appel ainsi que celui des prises de décisions des actions qu’il est nécessaire d’entreprendre pour traiter l’appel, en tenant compte des résultats d’appels précédents similaires; \nb) le suivi et l’enregistrement des appels, y compris les actions entreprises pour les résoudre; \nc) la vérification que toutes les corrections et actions correctives appropriées ont été entreprises."
    5_label: "Appels - 5"
    5_desc: "L’organisme de certification recevant l’appel doit être responsable de la collecte et de la vérification de toutes les informations nécessaires lui permettant de valider celui-ci."
    6_label: "Appels - 6"
    6_desc: "L’organisme de certification doit accuser réception de l’appel et fournir à l’appelant les rapports d’avancement et les résultats de l’appel."
    7_label: "Appels - 7"
    7_desc: "La décision signifiée à l’appelant doit être prise ou examinée et approuvée par une ou des personnes n’ayant pas été précédemment impliquées dans l’objet de l’appel."
    8_label: "Appels - 8"
    8_desc: "L’organisme de certification doit dûment aviser l’appelant de la fin du processus de traitement de l’appel."
  8:
    title: "Plaintes"
    1_label: "Plaintes - 1"
    1_desc: "L’organisme de certification doit être responsable de toutes les décisions prises à tous les niveaux du processus de traitement des plaintes."
    2_label: "Plaintes - 2"
    2_desc: "Les soumissions, les analyses et les décisions relatives aux plaintes ne doivent pas donner lieu à des actions discriminatoires envers le plaignant."
    3_label: "Plaintes - 3"
    3_desc: "Dès réception d’une plainte, l’organisme de certification doit confirmer si la plainte est liée aux activités de certification dont il a la responsabilité, et dans l’affirmative, il doit la traiter. Lorsque la plainte concerne un client certifié, elle doit être examinée du point de vue de l’efficacité du système de management certifié."
    4_label: "Plaintes - 4"
    4_desc: "Toute plainte valide relative à un client certifié doit également être notifiée en temps opportun par l’organisme de certification au client certifié concerné."
    5_label: "Plaintes - 5"
    5_desc: "L’organisme de certification doit avoir un processus documenté lui permettant de recevoir, d’évaluer et de prendre des décisions en cas de plainte. Ce processus doit tenir compte des exigences de confidentialité dans la mesure où il concerne le plaignant et l’objet de la plainte."
    6_label: "Plaintes - 6"
    6_desc: "Le processus de traitement des plaintes doit au moins comprendre les éléments et les méthodes suivants: \na) le principe général du processus de réception, de validation et d’examen de la plainte ainsi que celui des prises de décisions des actions qu’il est nécessaire d’entreprendre pour traiter celle-ci; \nb) le suivi et l’enregistrement des plaintes, y compris des actions entreprises pour les résoudre; \nc) la vérification que toutes les corrections et actions correctives appropriées ont été entreprises.\n\n ℹ️NOTE\nL’ISO 10002 fournit des lignes directrices relatives au traitement des plaintes."
    7_label: "Plaintes - 7"
    7_desc: "L’organisme de certification recevant la plainte doit être responsable de la collecte et de la vérification de toutes les informations nécessaires lui permettant de valider celle-ci."
    8_label: "Plaintes - 8"
    8_desc: "Dans la mesure du possible, l’organisme de certification doit accuser réception de la plainte et il doit fournir au plaignant les rapports d’avancement et le résultat de la plainte."
    9_label: "Plaintes - 9"
    9_desc: "La décision signifiée au plaignant doit être prise ou examinée et approuvée par une ou des personnes n’ayant pas été précédemment impliquées dans l’objet de la plainte."
    10_label: "Plaintes - 10"
    10_desc: "Dans la mesure du possible, l’organisme de certification doit dûment aviser le plaignant de la fin  du processus de traitement de la plainte."
    11_label: "Plaintes - 11"
    11_desc: "L’organisme de certification doit déterminer avec le client certifié et le plaignant si l’objet de la plainte et sa résolution doivent être rendus publics, et si oui, dans quelle mesure."
  9:
    title: "Enregistrements relatifs au client"
    1_label: "Enregistrements relatifs au client - 1"
    1_desc: "L’organisme de certification doit conserver les enregistrements relatifs à l’audit et aux autres activités de certification de tous les clients, y compris tous les organismes candidats ainsi que tous les organismes audités, certifiés ou dont la certification a été suspendue ou retirée."
    2_label: "Enregistrements relatifs au client - 2"
    2_desc: "Les enregistrements relatifs aux clients certifiés doivent comporter: \na) les informations relatives à la demande et les rapports d’audit initial, de surveillance et de renouvellement de la certification; \nb) le contrat de certification; \nc) la justification de la méthodologie utilisée pour l’échantillonnage des sites, le cas échéant; NOTE La méthodologie pour l’échantillonnage comprend l’échantillonnage utilisé pour auditer le système de management spécifique et/ou pour sélectionner les sites dans le cadre d’un audit multisites; \nd) la justification pour la détermination du temps imparti aux auditeurs (voir 9.1.4); \ne) la vérification des corrections et actions correctives; \nf) les enregistrements des plaintes et des appels ainsi que de toutes les corrections et actions correctives qui en découlent;\ng) les délibérations et décisions du comité, le cas échéant; \nh) la documentation relative aux décisions prises en matière de certification; \ni) des documents de certification, y compris le périmètre de la certification en termes de produit, de processus ou de service, selon le cas; \nj) les enregistrements associés nécessaires pour établir la crédibilité de la certification tels que les preuves des compétences des auditeurs et des experts techniques; \nk) les programmes d’audit."
    3_label: "Enregistrements relatifs au client - 3"
    3_desc: "L’organisme de certification doit conserver en lieu sûr les enregistrements relatifs aux candidats ainsi qu’à ses clients afin de garantir la confidentialité des informations. Lors du transport, de la transmission ou du transfert des enregistrements, le maintien de la confidentialité doit être assuré."
    4_label: "Enregistrements relatifs au client - 4"
    4_desc: "L’organisme de certification doit avoir une politique et des procédures documentées sur la conservation des enregistrements. Les enregistrements relatifs aux clients certifiés et aux clients auparavant certifiés doivent être conservés pendant la durée du cycle en cours plus un cycle complet de certification.\n\n ℹ️NOTE\nDans certaines juridictions, les exigences légales imposent de conserver les enregistrements sur une période plus longue."
10:
  title: "Exigences relatives au système de management des organismes de certification"
  1:
    title: "Options"
    1_label: "Options"
    1_desc: "L’organisme de certification doit établir, documenter, mettre en œuvre et entretenir un système de management de façon à pouvoir soutenir et démontrer qu’il satisfait de manière fiable aux exigences de la présente partie de l’ISO/IEC 17021. Outre la satisfaction aux exigences des Articles 5 à 9, l’organisme de certification doit mettre en œuvre un système de management conforme: \na) soit aux exigences générales relatives au système de management (voir 10.2); \nb) soit aux exigences de système de management conformément à l’ISO 9001 (voir 10.3). 10.2 Option A: Exigences générales relatives au système de management"
  2:
    title: "Option A: Exigences générales relatives au système de management"
    1_prefix: "10.2.1"
    1_label: "Généralités"
    1_desc: "L’organisme de certification doit établir, documenter, mettre en œuvre et entretenir un système de management de façon à pouvoir soutenir et démontrer qu’il satisfait de manière fiable aux exigences de la présente partie de l’ISO/IEC 17021. La direction de l’organisme de certification doit établir et documenter des politiques et des objectifs applicables à ses activités. La direction doit fournir la preuve de son engagement au développement et à la mise en œuvre du système de management conformément aux exigences de la présente partie de l’ISO/IEC 17021. La direction doit assurer que les politiques sont bien comprises, mises en œuvre et maintenues à tous les niveaux de l’organisme de certification. La direction de l’organisme de certification doit nommer une personne en charge de la responsabilité et de l’autorité pour: \na) assurer que les processus et les procédures nécessaires au système de management sont établis, mis en œuvre et entretenus;\nb) rendre compte à la direction du fonctionnement du système de management et de tout besoin d’amélioration."
    2_prefix: "10.2.2"
    2_label: "Manuel du système de management"
    2_desc: "Toutes les exigences applicables de la présente partie de l’ISO/IEC 17021 doivent être traitées soit dans un manuel soit dans des documents associés. L’organisme de certification doit assurer que le manuel et les documents associés correspondants sont accessibles à l’ensemble du personnel concerné."
    3_prefix: "10.2.3"
    3_label: "Maîtrise des documents"
    3_desc: "L’organisme de certification doit établir des procédures lui permettant de maîtriser les documents (internes et externes) liés au respect des exigences de la présente partie de l’ISO/IEC 17021. Ces procédures documentées doivent définir les mesures nécessaires pour: \na) approuver l’adéquation des documents avant diffusion; \nb) revoir, mettre à jour si nécessaire et approuver de nouveau les documents; \nc) assurer que les modifications et le statut de la version en vigueur des documents sont identifiés; \nd) assurer la disponibilité sur les lieux d’utilisation des versions pertinentes des documents applicables; \ne) assurer que les documents restent lisibles et facilement identifiables; \nf) assurer que les documents d’origine extérieure sont identifiés et que leur diffusion est maîtrisée; \ng) empêcher toute utilisation non intentionnelle de documents périmés, et les identifier de manière adéquate s’ils sont conservés dans un but quelconque.\n\n ℹ️NOTE\nLa documentation peut se présenter sous toute forme ou tout type de support."
    4_prefix: "10.2.4"
    4_label: "Maîtrise des enregistrements"
    4_desc: "L’organisme de certification doit établir des procédures pour assurer l’identification, le stockage, la protection, l’accessibilité, la durée de conservation et l’élimination des enregistrements générés dans le cadre des exigences de la présente partie de l’ISO/IEC 17021.\n L’organisme de certification doit établir des procédures définissant une période de conservation des enregistrements qui soit cohérente avec ses obligations contractuelles et légales. L’accès à ces enregistrements doit être conforme aux dispositions en matière de confidentialité.\n\n ℹ️NOTE\nEn ce qui concerne les exigences relatives aux enregistrements des clients certifiés, voir également 9.9."
    5_prefix: "10.2.5.1"
    5_label: "Revue de direction - Généralités"
    5_desc: "La direction de l’organisme de certification doit établir des procédures pour revoir, à intervalles planifiés, son système de management pour assurer qu’il demeure pertinent, adéquat et efficace, y compris les politiques et les objectifs déclarés relatifs au respect des exigences de la présente partie de l’ISO/IEC 17021. Ces revues doivent être réalisées au moins une fois par an."
    6_prefix: "10.2.5.2"
    6_label: "Revue de direction - Éléments d’entrée de la revue"
    6_desc: "Les éléments d’entrée de la revue de direction doivent comprendre des informations sur: \na) les résultats des audits internes et externes;\nb) le retour d’informations de la part des clients et des parties intéressées; \nc) la préservation de l’impartialité; \nd) l’état des actions correctives; \ne) l’état des actions destinées à faire face aux risques; \nf) le suivi des actions issues des revues de direction précédentes; \ng) la réalisation des objectifs; \nh) les changements pouvant affecter le système de management; \ni) les appels et les plaintes."
    7_prefix: "10.2.5.3"
    7_label: "Revue de direction - Éléments de sortie de la revue"
    7_desc: "Les éléments de sortie de la revue de direction doivent comprendre les décisions et actions relatives \na) à l’amélioration de l’efficacité du système de management et de ses processus; \nb) à l’amélioration des services de certification liés au respect des exigences de la présente partie de l’ISO/IEC 17021; \nc) aux besoins en ressources; \nd) aux révisions de la politique et des objectifs de l’organisme."
    8_prefix: "10.2.6.1"
    8_label: "Audits internes - 1"
    8_desc: "L’organisme de certification doit établir des procédures relatives aux audits internes pour vérifier qu’il se conforme aux exigences de la présente partie de l’ISO/IEC 17021 et que le système de management est mis en œuvre et entretenu de manière efficace.\n\n ℹ️NOTE\nL’ISO 19011 fournit des lignes directrices relatives à la réalisation des audits internes."
    9_prefix: "10.2.6.2"
    9_label: "Audits internes - 2"
    9_desc: "Un programme d’audits doit être planifié en tenant compte de l’importance des processus et des domaines à auditer, ainsi que des résultats des audits précédents."
    10_prefix: "10.2.6.3"
    10_label: "Audits internes - 3"
    10_desc: "Les audits internes doivent être réalisés au moins une fois par an. Ces audits peuvent être réalisés moins fréquemment si l’organisme de certification peut démontrer l’efficacité et la stabilité du système de management qu’il a mis en place conformément aux exigences de la présente partie de l’ISO/IEC 17021."
    11_prefix: "10.2.6.4"
    11_label: "Audits internes - 4"
    11_desc: "L’organisme de certification doit assurer que: \na) les audits internes sont réalisés par un personnel compétent disposant des connaissances requises en matière de certification, d’audit et des exigences de la présente partie de l’ISO/IEC 17021; \nb) les auditeurs n’auditent pas leur propre travail; \nc) le personnel responsable du domaine à auditer est informé des résultats de l’audit; \nd) toutes les actions résultant d’audits internes sont entreprises en temps opportun et de manière appropriée; \ne) toutes les opportunités d’amélioration sont identifiées."
    12_prefix: "10.2.7"
    12_label: "Actions correctives"
    12_desc: "L’organisme de certification doit établir des procédures pour identifier et gérer les non-conformités de ses opérations. L’organisme de certification doit également, si nécessaire, mener des actions pour éliminer les causes de non-conformités afin d’éviter qu’elles ne se reproduisent. Les actions correctives doivent être adaptées aux effets des non-conformités rencontrées. Les procédures doivent être établies afin de définir les exigences pour: \na) procéder à l’identification des non-conformités (par exemple celles issues des plaintes valides et des audits internes); \nb) déterminer les causes de non-conformité; \nc) corriger les non-conformités; \nd) évaluer le besoin d’entreprendre des actions pour que les non-conformités ne se reproduisent pas; \ne) déterminer et mettre en œuvre en temps opportun les actions nécessaires; \nf) enregistrer les résultats des actions mises en œuvre; \ng) procéder à la revue de l’efficacité des actions correctives mises en œuvre."
  3:
    title: "Option B: Exigences relatives au système de management conformément à l’ISO 9001"
    1_prefix: "10.3.1"
    1_label: "Généralités"
    1_desc: "L’organisme de certification doit établir et maintenir un système de management conformément aux exigences de l’ISO 9001 de façon à pouvoir soutenir et démontrer qu’il satisfait aux exigences de la présente partie de l’ISO/IEC 17021, complétées par celles spécifiées de 10.3.2 à 10.3.4."
    2_prefix: "10.3.2"
    2_label: "Domaine d’application"
    2_desc: "En application des exigences de l’ISO 9001, le domaine d’application du système de management doit comprendre les exigences de conception et de développement pour ses services de certification."
    3_prefix: "10.3.3"
    3_label: "Écoute client"
    3_desc: "En application des exigences de l’ISO 9001, lors de l’élaboration de son système de management, l’organisme de certification doit prendre en compte la crédibilité de la certification et traiter les besoins de toutes les parties (tels qu’énoncés en 4.1.2) qui comptent sur ses services d’audit et de certification et pas uniquement de ses clients."
    4_prefix: "10.3.4"
    4_label: "Revue de direction"
    4_desc: "En application des exigences de l’ISO 9001, l’organisme de certification doit considérer comme données d’entrée à la revue de direction, les informations relatives aux plaintes et appels pertinents émanant des utilisateurs des services de certification et une revue de l’impartialité."
