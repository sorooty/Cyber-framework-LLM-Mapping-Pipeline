1:
  title: "Cybersecurity Governance"
  1:
    title: "Cybersecurity Strategy"
    desc: "Objective \n To ensure that cybersecurity plans, goals, initiatives and projects are contributing to compliance with related laws and regulations."
    1_label: "A cybersecurity strategy must be defined, documented and approved. It must be supported by the head of the organization or his/her delegate (referred to in this document as Authorizing Official). The strategy goals must be in-line with related laws and regulations."
    2_label: "A roadmap must be executed to implement the cybersecurity strategy."
    3_label: "The cybersecurity strategy must be reviewed periodically according to planned intervals or upon changes to related laws and regulations."
  2:
    title: "Cybersecurity Management"
    desc: "Objective \n To ensure Authorizing Official’s support in implementing and managing cybersecurity programs within the organization as per related laws and regulations"
    1_desc: "A dedicated cybersecurity function (e.g., division, department) must be established within the organization. This function must be independent from the Information Technology/Information Communication and Technology (IT/ICT) functions (as per the Royal Decree number 37140 dated 14/8/1438H). It is highly recommended that this cybersecurity function reports directly to the head of the organization or his/her delegate while ensuring that this does not result in a conflict of interest."
    2_label: "The position of cybersecurity function head (e.g., CISO), and related supervisory and critical positions within the function, must be filled with full-time and experienced Saudi cybersecurity professionals."
    3_desc: "A cybersecurity steering committee must be established by the Authorizing Official to ensure the support and implementation of the cybersecurity programs and initiatives within the organization. Committee members, roles and responsibilities, and governance framework must be defined, documented and approved. The committee must include the head of the cybersecurity function as one of its members. It is highly recommended that the committee reports directly to the head of the organization or his/her delegate while ensuring that this does not result in a conflict of interest."
  3:
    title: "Cybersecurity Policies and Procedures"
    desc: "Objective \n To ensure that cybersecurity requirements are documented, communicated and complied with by the organization as per related laws and regulations, and organizational requirements."
    1_label: "Cybersecurity policies and procedures must be defined and documented by the cybersecurity function, approved by the Authorizing Official, and disseminated to relevant parties inside and outside the organization. "
    2_label: "The cybersecurity function must ensure that the cybersecurity policies and procedures are implemented."
    3_label: "The cybersecurity policies and procedures must be supported by technical security standards (e.g., operating systems, databases and firewall technical security standards)."
    4_label: "The cybersecurity policies and procedures must be reviewed periodically according to planned intervals or upon changes to related laws and regulations. Changes and reviews must be approved and documented."
  4:
    title: "Cybersecurity Roles and Responsibilities"
    desc: "Objective \n To ensure that roles and responsibilities are defined for all parties participating in implementing the cybersecurity controls within the organization."
    1_label: "Cybersecurity organizational structure and related roles and responsibilities must be defined, documented, approved, supported and assigned by the Authorizing Official while ensuring that this does not result in a conflict of interest. "
    2_label: "The cybersecurity roles and responsibilities must be reviewed periodically according to planned intervals or upon changes to related laws and regulations."
  5:
    title: "Cybersecurity Risk Management"
    desc: "Objective \n To ensure managing cybersecurity risks in a methodological approach in order to protect the organization’s information and technology assets as per organizational policies and procedures, and related laws and regulations."
    1_label: "Cybersecurity risk management methodology and procedures must be defined, documented and approved as per confidentiality, integrity and availability considerations of information and technology assets."
    2_label: "The cybersecurity risk management methodology and procedures must be implemented by the cybersecurity function."
    3_prefix: "1.5.3.1"
    3_label: "The cybersecurity risk assessment procedures must be implemented at least in the following cases:"
    3_desc: "Early stages of technology projects."
    4_prefix: "1.5.3.2"
    4_label: "The cybersecurity risk assessment procedures must be implemented at least in the following cases:"
    4_desc: "Before making major changes to technology infrastructure."
    5_prefix: "1.5.3.3"
    5_label: "The cybersecurity risk assessment procedures must be implemented at least in the following cases:"
    5_desc: "During the planning phase of obtaining third party services."
    6_prefix: "1.5.3.4"
    6_label: "The cybersecurity risk assessment procedures must be implemented at least in the following cases:"
    6_desc: "During the planning phase and before going live for new technology services and products"
    7_prefix: "1.5.4"
    7_label: "The cybersecurity risk management methodology and procedures must be reviewed periodically according to planned intervals or upon changes to related laws and regulations. Changes and reviews must be approved and documented."
  6:
    title: "Cybersecurity in Information and Technology Project Management"
    desc: "Objective \n To ensure that cybersecurity requirements are included in project management methodology and procedures in order to protect the confidentiality, integrity and availability of information and technology assets as per organization policies and procedures, and related laws and regulations."
    1_label: "Cybersecurity requirements must be included in project and asset (information/ technology) change management methodology and procedures to identify and manage cybersecurity risks as part of project management lifecycle. The cybersecurity requirements must be a key part of the overall requirements of technology projects."
    2_prefix: "1.6.2.1"
    2_label: "The cybersecurity requirements in project and assets (information/technology) change management must include at least the following:"
    2_desc: "Vulnerability assessment and remediation."
    3_prefix: "1.6.2.2"
    3_label: "The cybersecurity requirements in project and assets (information/technology) change management must include at least the following:"
    3_desc: "Conducting a configurations’ review, secure configuration and hardening and patching before changes or going live for technology projects."
    4_prefix: "1.6.3.1"
    4_label: "The cybersecurity requirements related to software and application development projects must include at least the following:"
    4_desc: "Using secure coding standards."
    5_prefix: "1.6.3.2"
    5_label: "The cybersecurity requirements related to software and application development projects must include at least the following:"
    5_desc: "Using trusted and licensed sources for software development tools and libraries."
    6_prefix: "1.6.3.3"
    6_label: "The cybersecurity requirements related to software and application development projects must include at least the following:"
    6_desc: "Conducting compliance test for software against the defined organizational cybersecurity requirements."
    7_prefix: "1.6.3.4"
    7_label: "The cybersecurity requirements related to software and application development projects must include at least the following:"
    7_desc: "Secure integration between software components."
    8_prefix: "1.6.3.5"
    8_label: "The cybersecurity requirements related to software and application development projects must include at least the following:"
    8_desc: "Conducting a configurations’ review, secure configuration and hardening and patching before going live for software products."
    9_prefix: "1.6.4"
    9_label: "The cybersecurity requirements in project management must be reviewed periodically."
  7:
    title: "Compliance with Cybersecurity Standards, Laws and Regulations"
    desc: "Objective \n To ensure that the organization’s cybersecurity program is in compliance with related laws and regulations."
    1_label: "The organization must comply with related national cybersecurity laws and regulations."
    2_label: "The organization must comply with any nationally-approved international agreements and commiments related to cybersecurity."
  8:
    title: "Periodical Cybersecurity Review and Audit"
    desc: "Objective \n To ensure that cybersecurity controls are implemented and in compliance with organizational policies and procedures, as well as related national and international laws, regulations and agreements."
    1_label: "Cybersecurity reviews must be conducted periodically by the cybersecurity function in the organization to assess the compliance with the cybersecurity controls in the organization."
    2_desc: "Cybersecurity audits and reviews must be conducted by independent parties outside the cybersecurity function (e.g., Internal Audit function) to assess the compliance with the cybersecurity controls in the organization. Audits and reviews must be conducted independently, while ensuring that this does not result in a conflict of interest, as per the Generally Accepted Auditing Standards (GAAS), and related laws and regulations."
    3_label: "Results from the cybersecurity audits and reviews must be documented and presented to the cybersecurity steering committee and Authorizing Official. Results must include the audit/review scope, observations, recommendations and remediation plans."
  9:
    title: "Cybersecurity in Human Resources"
    desc: "Objective \n To ensure that cybersecurity risks and requirements related to personnel (employees and contractors) are managed efficiently prior to employment, during employment and after termination/separation as per organizational policies and procedures, and related laws and regulations."
    1_label: "Personnel cybersecurity requirements (prior to employment, during employment and after termination/separation) must be defined, documented and approved."
    2_label: "The personnel cybersecurity requirements must be implemented."
    3_prefix: "1.9.3.1"
    3_label: "The personnel cybersecurity requirements prior to employment must include at least the following:"
    3_desc: "Inclusion of personnel cybersecurity responsibilities and non-disclosure clauses s(covering the cybersecurity requirements during employment and after termination/ separation) in employment contracts."
    4_prefix: "1.9.3.2"
    4_label: "The personnel cybersecurity requirements prior to employment must include at least the following:"
    4_desc: "Screening or vetting candidates of cybersecurity and critical/privileged positions."
    5_prefix: "1.9.4.1"
    5_label: "The personnel cybersecurity requirements during employment must include at least the following:"
    5_desc: "Cybersecurity awareness (during on-boarding and during employment)."
    6_prefix: "1.9.4.2"
    6_label: "The personnel cybersecurity requirements during employment must include at least the following:"
    6_desc: "Implementation of and compliance with the cybersecurity requirements as per the organizational cybersecurity policies and procedures."
    7_prefix: "1.9.5"
    7_label: "Personnel access to information and technology assets must be reviewed and removed immediately upon termination/separation."
    8_prefix: "1.9.6"
    8_label: "Personnel cybersecurity requirements must be reviewed periodically"
  10:
    title: "Cybersecurity Awareness and Training Program"
    desc: "Objective \n To ensure that personnel are aware of their cybersecurity responsibilities and have the required cybersecurity training, skills and credentials needed to accomplish their cybersecurity responsibilities and to protect the organization’s information and technology assets."
    1_label: "A cybersecurity awareness program must be developed and approved. The program must be conducted periodically through multiple channels to strengthen the awareness about cybersecurity, cyber threats and risks, and to build a positive cybersecurity awareness culture."
    2_label: "The cybersecurity awareness program must be implemented."
    3_prefix: "1.10.3.1"
    3_label: "The cybersecurity awareness program must cover the latest cyber threats and how to protect against them, and must include at least the following subjects:"
    3_desc: "Secure handling of email services, especially phishing emails."
    4_prefix: "1.10.3.2"
    4_label: "The cybersecurity awareness program must cover the latest cyber threats and how to protect against them, and must include at least the following subjects:"
    4_desc: "Secure handling of mobile devices and storage media."
    5_prefix: "1.10.3.3"
    5_label: "The cybersecurity awareness program must cover the latest cyber threats and how to protect against them, and must include at least the following subjects:"
    5_desc: "Secure Internet browsing."
    6_prefix: "1.10.3.4"
    6_label: "The cybersecurity awareness program must cover the latest cyber threats and how to protect against them, and must include at least the following subjects:"
    6_desc: "Secure use of social media."
    7_prefix: "1.10.4.1"
    7_label: "Essential and customized (i.e., tailored to job functions as it relates to cybersecurity) training and access to professional skillsets must be made available to personnel working directly on tasks related to cybersecurity including:"
    7_desc: "Cybersecurity function’s personnel."
    8_prefix: "1.10.4.2"
    8_label: "Essential and customized (i.e., tailored to job functions as it relates to cybersecurity) training and access to professional skillsets must be made available to personnel working directly on tasks related to cybersecurity including:"
    8_desc: "Personnel working on software/application development. and information and technology assets operations."
    9_prefix: "1.10.4.3"
    9_label: "Essential and customized (i.e., tailored to job functions as it relates to cybersecurity) training and access to professional skillsets must be made available to personnel working directly on tasks related to cybersecurity including:"
    9_desc: "Executive and supervisory positions."
    10_prefix: "1.10.5"
    10_label: "The implementation of the cybersecurity awareness program must be reviewed periodically"
2:
  title: "Cybersecurity Defense"
  1:
    title: "Asset Management"
    desc: "Objective \n To ensure that the organization has an accurate and detailed inventory of information and technology assets in order to support the organization’s cybersecurity and operational requirements to maintain the confidentiality, integrity and availability of information and technology assets."
    1_label: "Cybersecurity requirements for managing information and technology assets must be defined, documented and approved."
    2_label: "The cybersecurity requirements for managing information and technology assets must be implemented."
    3_label: "Acceptable use policy of information and technology assets must be defined, documented and approved."
    4_label: "Acceptable use policy of information and technology assets must be implemented."
    5_label: "Information and technology assets must be classified, labeled and handled as per related law and regulatory requirements."
    6_label: "The cybersecurity requirements for managing information and technology assets must be reviewed periodically."
  2:
    title: "Identity and Access Management"
    desc: "Objective \n To ensure the secure and restricted logical access to information and technology assets in order to prevent unauthorized access and allow only authorized access for users which are necessary to accomplish assigned tasks."
    1_label: "Cybersecurity requirements for identity and access management must be defined, documented and approved."
    2_label: "The cybersecurity requirements for identity and access management must be implemented."
    3_prefix: "2.2.3.1"
    3_label: "The cybersecurity requirements for identity and access management must include at least the following:"
    3_desc: "User authentication based on username and password."
    4_prefix: "2.2.3.2"
    4_label: "The cybersecurity requirements for identity and access management must include at least the following:"
    4_desc: "Multi-factor authentication for remote access."
    5_prefix: "2.2.3.3"
    5_label: "The cybersecurity requirements for identity and access management must include at least the following:"
    5_desc: "User authorization based on identity and access control principles: Need-to-Know and Need-to-Use, Least Privilege and Segregation of Duties."
    6_prefix: "2.2.3.4"
    6_label: "The cybersecurity requirements for identity and access management must include at least the following:"
    6_desc: "Privileged access management."
    7_prefix: "2.2.3.5"
    7_label: "The cybersecurity requirements for identity and access management must include at least the following:"
    7_desc: "Periodic review of users’ identities and access rights."
    8_prefix: "2.2.4"
    8_label: "The Implementation of the cybersecurity requirements for identity and access management must be reviewed periodically."
  3:
    title: "Information Systems and Information Processing Facilities Protection"
    desc: "Objective \n To ensure the protection of information systems and information processing facilities (including workstations and infrastructures) against cyber risks."
    1_label: "Cybersecurity requirements for protecting information systems and information processing facilities must be defined, documented and approved."
    2_label: "The cybersecurity requirements for protecting information systems and information processing facilities must be implemented."
    3_prefix: "2.3.3.1"
    3_label: "The cybersecurity requirements for protecting information systems and information processing facilities must include at least the following:"
    3_desc: "Advanced, up-to-date and secure management of malware and virus protection on servers and workstations."
    4_prefix: "2.3.3.2"
    4_label: "The cybersecurity requirements for protecting information systems and information processing facilities must include at least the following:"
    4_desc: "Restricted use and secure handling of external storage media."
    5_prefix: "2.3.3.3"
    5_label: "The cybersecurity requirements for protecting information systems and information processing facilities must include at least the following:"
    5_desc: "Patch management for information systems, software and devices."
    6_prefix: "2.3.3.4"
    6_label: "The cybersecurity requirements for protecting information systems and information processing facilities must include at least the following:"
    6_desc: "Centralized clock synchronization with an accurate and trusted source (e.g., Saudi Standards, Metrology and Quality Organization (SASO))."
    7_prefix: "2.3.4"
    7_label: "The cybersecurity requirements for protecting information systems and information processing facilities must be reviewed periodically."
  4:
    title: "Email Protection"
    desc: "Objective \n To ensure the protection of organization’s email service from cyber risks."
    1_label: "Cybersecurity requirements for protecting email service must be defined, documented and approved."
    2_label: "The cybersecurity requirements for email service must be implemented."
    3_prefix: "2.4.3.1"
    3_label: "The cybersecurity requirements for protecting the email service must include at the least the following:"
    3_desc: "Analyzing and filtering email messages (specifically phishing emails and spam) using advanced and up-to-date email protection techniques."
    4_prefix: "2.4.3.2"
    4_label: "The cybersecurity requirements for protecting the email service must include at the least the following:"
    4_desc: "Multi-factor authentication for remote and webmail access to email service."
    5_prefix: "2.4.3.3"
    5_label: "The cybersecurity requirements for protecting the email service must include at the least the following:"
    5_desc: "Email archiving and backup."
    6_prefix: "2.4.3.4"
    6_label: "The cybersecurity requirements for protecting the email service must include at the least the following:"
    6_desc: "Secure management and protection against Advanced Persistent Threats (APT), which normally utilize zero-day viruses and malware."
    7_prefix: "2.4.3.5"
    7_label: "The cybersecurity requirements for protecting the email service must include at the least the following:"
    7_desc: "Validation of the organization’s email service domains (e.g., using Sender Policy Framework (SPF))."
    8_prefix: "2.4.4"
    8_label: "The cybersecurity requirements for email service must be reviewed periodically."
  5:
    title: "Network Security Management"
    desc: "Objective \n To ensure the protection of organization’s network from cyber risks."
    1_label: "Cybersecurity requirements for network security management must be defined, documented and approved."
    2_label: "The cybersecurity requirements for network security management must be implemented."
    3_prefix: "2.5.3.1"
    3_label: "The cybersecurity requirements for network security management must include at least the following:"
    3_desc: "Logical or physical segregation and segmentation of network segments using firewalls and defense-in-depth principles."
    4_prefix: "2.5.3.2"
    4_label: "The cybersecurity requirements for network security management must include at least the following:"
    4_desc: "Network segregation between production, test and development environments."
    5_prefix: "2.5.3.3"
    5_label: "The cybersecurity requirements for network security management must include at least the following:"
    5_desc: "Secure browsing and Internet connectivity including restrictions on the use of file storage/sharing and remote access websites, and protection against suspicious websites."
    6_prefix: "2.5.3.4"
    6_label: "The cybersecurity requirements for network security management must include at least the following:"
    6_desc: "Wireless network protection using strong authentication and encryption techniques. A comprehensive risk assessment and management exercise must be conducted to assess and manage the cyber risks prior to connecting any wireless networks to the organization’s internal network."
    7_prefix: "2.5.3.5"
    7_label: "The cybersecurity requirements for network security management must include at least the following:"
    7_desc: "Management and restrictions on network services, protocols and ports."
    8_prefix: "2.5.3.6"
    8_label: "The cybersecurity requirements for network security management must include at least the following:"
    8_desc: "Intrusion Prevention Systems (IPS)."
    9_prefix: "2.5.3.7"
    9_label: "The cybersecurity requirements for network security management must include at least the following:"
    9_desc: "Security of Domain Name Service (DNS)."
    10_prefix: "2.5.3.8"
    10_label: "The cybersecurity requirements for network security management must include at least the following:"
    10_desc: "Secure management and protection of Internet browsing channel against Advanced Persistent Threats (APT), which normally utilize zero-day viruses and malware."
    11_prefix: "2.5.4"
    11_label: "The cybersecurity requirements for network security management must be reviewed periodically."
  6:
    title: "Mobile Devices Security"
    desc: "Objective \n To ensure the protection of mobile devices (including laptops, smartphones, tablets) from cyber risks and to ensure the secure handling of the organization’s information (including sensitive information) while utilizing Bring Your Own Device (BYOD) policy. "
    1_label: "Cybersecurity requirements for mobile devices security and BYOD must be defined, documented and approved."
    2_label: "The cybersecurity requirements for mobile devices security and BYOD must be implemented."
    3_prefix: "2.6.3.1"
    3_label: "The cybersecurity requirements for mobile devices security and BYOD must include at least the following:"
    3_desc: "Separation and encryption of organization’s data and information stored on mobile devices and BYODs."
    4_prefix: "2.6.3.2"
    4_label: "The cybersecurity requirements for mobile devices security and BYOD must include at least the following:"
    4_desc: "Controlled and restricted use based on job requirements."
    5_prefix: "2.6.3.3"
    5_label: "The cybersecurity requirements for mobile devices security and BYOD must include at least the following:"
    5_desc: "Secure wiping of organization’s data and information stored on mobile devices and BYOD in cases of device loss, theft or after termination/separation from the organization."
    6_prefix: "2.6.3.4"
    6_label: "The cybersecurity requirements for mobile devices security and BYOD must include at least the following:"
    6_desc: "Security awareness for mobile devices users."
    7_prefix: "2.6.4"
    7_label: "The cybersecurity requirements for mobile devices security and BYOD must be reviewed periodically."
  7:
    title: "Data and Information Protection"
    desc: "Objective \n To ensure the confidentiality, integrity and availability of organization’s data and information as per organizational policies and procedures, and related laws and regulations."
    1_label: "Cybersecurity requirements for protecting and handling data and information must be defined, documented and approved as per the related laws and regulations."
    2_label: "The cybersecurity requirements for protecting and handling data and information must be implemented."
    3_prefix: "2.7.3.1"
    3_label: "The cybersecurity requirements for protecting and handling data and information must include at least the following:"
    3_desc: "Data and information ownership. "
    4_prefix: "2.7.3.2"
    4_label: "The cybersecurity requirements for protecting and handling data and information must include at least the following:"
    4_desc: "Data and information classification and labeling mechanisms."
    5_prefix: "2.7.3.3"
    5_label: "The cybersecurity requirements for protecting and handling data and information must include at least the following:"
    5_desc: "Data and information privacy."
    6_prefix: "2.7.4"
    6_label: "The cybersecurity requirements for protecting and handling data and information must be reviewed periodically."
  8:
    title: "Cryptography"
    desc: "Objective \n To ensure the proper and efficient use of cryptography to protect information assets as per organizational policies and procedures, and related laws and regulations."
    1_label: "Cybersecurity requirements for cryptography must be defined, documented and approved."
    2_label: "The cybersecurity requirements for cryptography must be implemented."
    3_prefix: "2.8.3.1"
    3_label: "The cybersecurity requirements for cryptography must include at least the following:"
    3_desc: "Approved cryptographic solutions standards and its technical and regulatory limitations."
    4_prefix: "2.8.3.2"
    4_label: "The cybersecurity requirements for cryptography must include at least the following:"
    4_desc: "Secure management of cryptographic keys during their lifecycles."
    5_prefix: "2.8.3.3"
    5_label: "The cybersecurity requirements for cryptography must include at least the following:"
    5_desc: "Encryption of data in-transit and at-rest as per classification and related laws and regulations."
    6_prefix: "2.8.4"
    6_label: "The cybersecurity requirements for cryptography must be reviewed periodically."
  9:
    title: "Backup and Recovery Management"
    desc: "Objective \n To ensure the protection of organization’s data and information including information systems and software configurations from cyber risks as per organizational policies and procedures, and related laws and regulations."
    1_label: "Cybersecurity requirements for backup and recovery management must be defined, documented and approved."
    2_label: "The cybersecurity requirements for backup and recovery management must be implemented."
    3_prefix: "2.9.3.1"
    3_label: "The cybersecurity requirements for backup and recovery management must include at least the following:"
    3_desc: "Scope and coverage of backups to cover critical technology and information assets."
    4_prefix: "2.9.3.2"
    4_label: "The cybersecurity requirements for backup and recovery management must include at least the following:"
    4_desc: "Ability to perform quick recovery of data and systems after cybersecurity incidents."
    5_prefix: "2.9.3.3"
    5_label: "The cybersecurity requirements for backup and recovery management must include at least the following:"
    5_desc: "Periodic tests of backup’s recovery effectiveness."
  10:
    title: "Vulnerability Management"
    desc: "Objective \n To ensure timely detection and effective remediation of technical vulnerabilities to prevent or minimize the probability of exploiting these vulnerabilities to launch cyber attacks against the organization. "
    1_label: "Cybersecurity requirements for technical vulnerabilities management must be defined, documented and approved."
    2_label: "The cybersecurity requirements for technical vulnerabilities management must be implemented."
    3_prefix: "2.10.3.1"
    3_label: "The cybersecurity requirements for technical vulnerabilities management must include at least the following:"
    3_desc: "Periodic vulnerabilities assessments."
    4_prefix: "2.10.3.2"
    4_label: "The cybersecurity requirements for technical vulnerabilities management must include at least the following:"
    4_desc: "Vulnerabilities classification based on criticality level."
    5_prefix: "2.10.3.3"
    5_label: "The cybersecurity requirements for technical vulnerabilities management must include at least the following:"
    5_desc: "Vulnerabilities remediation based on classification and associated risk levels."
    6_prefix: "2.10.3.4"
    6_label: "The cybersecurity requirements for technical vulnerabilities management must include at least the following:"
    6_desc: "Security patch management."
    7_prefix: "2.10.3.5"
    7_label: "The cybersecurity requirements for technical vulnerabilities management must include at least the following:"
    7_desc: "Subscription with authorized and trusted cybersecurity resources for up-to-date information and notifications on technical vulnerabilities."
  11:
    title: "Penetration Testing"
    desc: "Objective \n To assess and evaluate the efficiency of the organization’s cybersecurity defense capabilities through simulated cyber-attacks to discover unknown weaknesses within the technical infrastructure that may lead to a cyber breach."
    1_label: "Cybersecurity requirements for penetration testing exercises must be defined, documented and approved."
    2_label: "The cybersecurity requirements for penetration testing processes must be implemented."
    3_prefix: "2.11.3.1"
    3_label: "The cybersecurity requirements for penetration testing processes must include at least the following:"
    3_desc: "Scope of penetration tests which must cover Internet-facing services and its technical components including infrastructure, websites, web applications, mobile apps, email and remote access."
    4_prefix: "2.11.3.2"
    4_label: "The cybersecurity requirements for penetration testing processes must include at least the following:"
    4_desc: "Conducting penetration tests periodically."
    5_prefix: "2.11.4"
    5_label: "Cybersecurity requirements for penetration testing processes must be reviewed periodically."
  12:
    title: "Cybersecurity Event Logs and Monitoring Management"
    desc: "Objective \n To ensure timely collection, analysis and monitoring of cybersecurity events for early detection of potential cyber-attacks in order to prevent or minimize the negative impacts on the organization’s operations."
    1_label: "Cybersecurity requirements for event logs and monitoring management must be defined, documented and approved."
    2_label: "The cybersecurity requirements for event logs and monitoring management must be implemented."
    3_prefix: "2.12.3.1"
    3_label: "The cybersecurity requirements for event logs and monitoring management must include at least the following:"
    3_desc: "Activation of cybersecurity event logs on critical information assets."
    4_prefix: "2.12.3.2"
    4_label: "The cybersecurity requirements for event logs and monitoring management must include at least the following:"
    4_desc: "Activation of cybersecurity event logs on remote access and privileged user accounts."
    5_prefix: "2.12.3.3"
    5_label: "The cybersecurity requirements for event logs and monitoring management must include at least the following:"
    5_desc: "Identification of required technologies (e.g., SIEM) for cybersecurity event logs collection."
    6_prefix: "2.12.3.4"
    6_label: "The cybersecurity requirements for event logs and monitoring management must include at least the following:"
    6_desc: " Continuous monitoring of cybersecurity events."
    7_prefix: "2.12.3.5"
    7_label: "The cybersecurity requirements for event logs and monitoring management must include at least the following:"
    7_desc: "Retention period for cybersecurity event logs (must be 12 months minimum)."
    8_prefix: "2.12.4"
    8_label: "The cybersecurity requirements for event logs and monitoring management must be reviewed periodically."
  13:
    title: "Cybersecurity Incident and Threat Management"
    desc: "Objective \n To ensure timely identification, detection, effective management and handling of cybersecurity incidents and threats to prevent or minimize negative impacts on organization’s operation taking into consideration the Royal Decree number 37140, dated 14/8/1438H."
    1_label: "Requirements for cybersecurity incidents and threat management must be defined, documented and approved."
    2_label: "The requirements for cybersecurity incidents and threat management must be implemented."
    3_prefix: "2.13.3.1"
    3_label: "The requirements for cybersecurity incidents and threat management must include at least the following:"
    3_desc: "Cybersecurity incident response plans and escalation procedures."
    4_prefix: "2.13.3.2"
    4_label: "The requirements for cybersecurity incidents and threat management must include at least the following:"
    4_desc: "Cybersecurity incidents classification."
    5_prefix: "2.13.3.3"
    5_label: "The requirements for cybersecurity incidents and threat management must include at least the following:"
    5_desc: "Cybersecurity incidents reporting to NCA."
    6_prefix: "2.13.3.4"
    6_label: "The requirements for cybersecurity incidents and threat management must include at least the following:"
    6_desc: "Sharing incidents notifications, threat intelligence, breach indicators and reports with NCA."
    7_prefix: "2.13.3.5"
    7_label: "The requirements for cybersecurity incidents and threat management must include at least the following:"
    7_desc: "Collecting and handling threat intelligence feeds."
    8_prefix: "2.13.4"
    8_label: "The requirements for cybersecurity incidents and threat management must be reviewed periodically."
  14:
    title: "Physical Security"
    desc: "Objective \n To ensure the protection of information and technology assets from unauthorized physical access, loss, theft and damage."
    1_label: "Cybersecurity requirements for physical protection of information and technology assets must be defined, documented and approved."
    2_label: "The cybersecurity requirements for physical protection of information and technology assets must be implemented."
    3_prefix: "2.14.3.1"
    3_label: "The cybersecurity requirements for physical protection of information and technology assets must include at least the following:"
    3_desc: "Authorized access to sensitive areas within the organization (e.g., data center, disaster recovery center, sensitive information processing facilities, security surveillance center, network cabinets)."
    4_prefix: "2.14.3.2"
    4_label: "The cybersecurity requirements for physical protection of information and technology assets must include at least the following:"
    4_desc: "Facility entry/exit records and CCTV monitoring."
    5_prefix: "2.14.3.3"
    5_label: "The cybersecurity requirements for physical protection of information and technology assets must include at least the following:"
    5_desc: "Protection of facility entry/exit and surveillance records."
    6_prefix: "2.14.3.4"
    6_label: "The cybersecurity requirements for physical protection of information and technology assets must include at least the following:"
    6_desc: "Secure destruction and re-use of physical assets that hold classified information (including documents and storage media)."
    7_prefix: "2.14.3.5"
    7_label: "The cybersecurity requirements for physical protection of information and technology assets must include at least the following:"
    7_desc: "Security of devices and equipment inside and outside the organization’s facilities."
    8_prefix: "2.14.4"
    8_label: "The cybersecurity requirements for physical protection of information and technology assets must be reviewed periodically."
  15:
    title: "Web Application Security"
    desc: "Objective \n To ensure the protection of external web applications against cyber risks."
    1_label: "Cybersecurity requirements for external web applications must be defined, documented and approved."
    2_label: "The cybersecurity requirements for external web applications must be implemented."
    3_prefix: "2.15.3.1"
    3_label: "The cybersecurity requirements for external web applications must include at least the following:"
    3_desc: "Use of web application firewall."
    4_prefix: "2.15.3.2"
    4_label: "The cybersecurity requirements for external web applications must include at least the following:"
    4_desc: "Adoption of the multi-tier architecture principle."
    5_prefix: "2.15.3.3"
    5_label: "The cybersecurity requirements for external web applications must include at least the following:"
    5_desc: "Use of secure protocols (e.g., HTTPS)."
    6_prefix: "2.15.3.4"
    6_label: "The cybersecurity requirements for external web applications must include at least the following:"
    6_desc: "Clarification of the secure usage policy for users."
    7_prefix: "2.15.3.5"
    7_label: "The cybersecurity requirements for external web applications must include at least the following:"
    7_desc: "Multi-factor authentication for users’ access."
    8_prefix: "2.15.4"
    8_label: "The cybersecurity requirements for external web applications must be reviewed periodically."
3:
  title: "Cybersecurity Resilience"
  1:
    title: "Cybersecurity Resilience Aspects of Business Continuity Management (BCM)"
    desc: "Objective \n To ensure the inclusion of the cybersecurity resiliency requirements within the organization’s business continuity management and to remediate and minimize the impacts on systems, information processing facilities and critical e-services from disasters caused by cybersecurity incidents."
    1_label: "Cybersecurity requirements for business continuity management must be defined, documented and approved."
    2_label: "The cybersecurity requirements for business continuity management must be implemented."
    3_prefix: "3.1.3.1"
    3_label: "The cybersecurity requirements for business continuity management must include at least the following:"
    3_desc: "Ensuring the continuity of cybersecurity systems and procedures."
    4_prefix: "3.1.3.2"
    4_label: "The cybersecurity requirements for business continuity management must include at least the following:"
    4_desc: "Developing response plans for cybersecurity incidents that may affect the business continuity."
    5_prefix: "3.1.3.3"
    5_label: "The cybersecurity requirements for business continuity management must include at least the following:"
    5_desc: "Developing disaster recovery plans."
    6_prefix: "3.1.4"
    6_label: "The cybersecurity requirements for business continuity management must be reviewed periodically"
4:
  title: "Third-Party and Cloud Computing Cybersecurity"
  1:
    title: "Third-Party Cybersecurity"
    desc: "Objective \n To ensure the protection of assets against the cybersecurity risks related to third-parties including outsourcing and managed services as per organizational policies and procedures, and related laws and regulations."
    1_label: "Cybersecurity requirements for contracts and agreements with third-parties must be identified, documented and approved."
    2_prefix: "4.1.2.1"
    2_label: "The cybersecurity requirements for contracts and agreements with third-parties (e.g., Service Level Agreement (SLA)) -which may affect, if impacted, the organization’s data or services- must include at least the following:"
    2_desc: "Non-disclosure clauses and secure removal of organization’s data by third parties upon end of service."
    3_prefix: "4.1.2.2"
    3_label: "The cybersecurity requirements for contracts and agreements with third-parties (e.g., Service Level Agreement (SLA)) -which may affect, if impacted, the organization’s data or services- must include at least the following:"
    3_desc: "Communication procedures in case of cybersecurity incidents."
    4_prefix: "4.1.2.3"
    4_label: "The cybersecurity requirements for contracts and agreements with third-parties (e.g., Service Level Agreement (SLA)) -which may affect, if impacted, the organization’s data or services- must include at least the following:"
    4_desc: "Requirements for third-parties to comply with related organizational policies and procedures, laws and regulations."
    5_prefix: "4.1.3.1"
    5_label: "The cybersecurity requirements for contracts and agreements with IT outsourcing and managed services third-parties must include at least the following:"
    5_desc: "Conducting a cybersecurity risk assessment to ensure the availability of risk mitigation controls before signing contracts and agreements or upon changes in related regulatory requirements."
    6_prefix: "4.1.3.2"
    6_label: "The cybersecurity requirements for contracts and agreements with IT outsourcing and managed services third-parties must include at least the following:"
    6_desc: "Cybersecurity managed services centers for monitoring and operations must be completely present inside the Kingdom of Saudi Arabia."
  2:
    title: "Cloud Computing and Hosting Cybersecurity"
    desc: "Objective \n To ensure the proper and efficient remediation of cyber risks and the implementation of cybersecurity requirements related to hosting and cloud computing as per organizational policies and procedures, and related laws and regulations. It is also to ensure the protection of the organization’s information and technology assets hosted on the cloud or processed/managed by third-parties."
    1_label: "Cybersecurity requirements related to the use of hosting and cloud computing services must be defined, documented and approved."
    2_label: "The cybersecurity requirements related to the use of hosting and cloud computing services must be implemented."
    3_prefix: "4.2.3.1"
    3_label: "In line with related and applicable laws and regulations, and in addition to the applicable ECC controls from main domains (1), (2), (3) and subdomain (4-1), the cybersecurity requirements related to the use of hosting and cloud computing services must include at least the following: "
    3_desc: "Classification of data prior to hosting on cloud or hosting services and returning data (in a usable format) upon service completion."
    4_prefix: "4.2.3.2"
    4_label: "In line with related and applicable laws and regulations, and in addition to the applicable ECC controls from main domains (1), (2), (3) and subdomain (4-1), the cybersecurity requirements related to the use of hosting and cloud computing services must include at least the following: "
    4_desc: "Separation of organization’s environments (specifically virtual servers) from other environments hosted at the cloud service provider."
    5_prefix: "4.2.3.3"
    5_label: "In line with related and applicable laws and regulations, and in addition to the applicable ECC controls from main domains (1), (2), (3) and subdomain (4-1), the cybersecurity requirements related to the use of hosting and cloud computing services must include at least the following: "
    5_desc: "Organization’s information hosting and storage must be inside the Kingdom of Saudi Arabia."
    6_prefix: "4.2.4"
    6_label: "The cybersecurity requirements related to the use of hosting and cloud computing services must be reviewed periodically."
5:
  title: "ICS Cybersecurity"
  1:
    title: "Industrial Control Systems and Devices (ICS) Protection"
    desc: "Objective \n To ensure the appropriate and effective cybersecurity management of Industrial Controls Systems and Operational Technology (ICS/OT) to protect the confidentiality, integrity and availability of the organization’s assets against cyber attacks (e.g., unauthorized access, destruction, spying and fraud) in line with the organization’s cybersecurity strategy and related and applicable local and international laws and regulations."
    1_label: "Cybersecurity requirements related to Industrial Controls Systems and Operational Technology (ICS/OT) must be defined, documented and approved."
    2_label: "The cybersecurity requirements related to Industrial Controls Systems and Operational Technology (ICS/OT) must be implemented."
    3_prefix: "5.1.3.1"
    3_label: "In addition to the applicable ECC controls from the main domains (1), (2), (3) and (4), the cybersecurity requirements related to Industrial Controls Systems and Operational Technology (ICS/OT) must include at least the following:"
    3_desc: "Strict physical and virtual segmentation when connecting industrial production networks to other networks within the organization (e.g., corporate network)."
    4_prefix: "5.1.3.2"
    4_label: "In addition to the applicable ECC controls from the main domains (1), (2), (3) and (4), the cybersecurity requirements related to Industrial Controls Systems and Operational Technology (ICS/OT) must include at least the following:"
    4_desc: "Strict physical and virtual segmentation when connecting systems and industrial networks with external networks (e.g., Internet, wireless, remote access)."
    5_prefix: "5.1.3.3"
    5_label: "In addition to the applicable ECC controls from the main domains (1), (2), (3) and (4), the cybersecurity requirements related to Industrial Controls Systems and Operational Technology (ICS/OT) must include at least the following:"
    5_desc: "Continuous monitoring and activation of cybersecurity event logs on the industrial networks and its connections."
    6_prefix: "5.1.3.4"
    6_label: "In addition to the applicable ECC controls from the main domains (1), (2), (3) and (4), the cybersecurity requirements related to Industrial Controls Systems and Operational Technology (ICS/OT) must include at least the following:"
    6_desc: "Isolation of Safety Instrumental Systems (SIS)."
    7_prefix: "5.1.3.5"
    7_label: "In addition to the applicable ECC controls from the main domains (1), (2), (3) and (4), the cybersecurity requirements related to Industrial Controls Systems and Operational Technology (ICS/OT) must include at least the following:"
    7_desc: "Strict limitation on the use of external storage media."
    8_prefix: "5.1.3.6"
    8_label: "In addition to the applicable ECC controls from the main domains (1), (2), (3) and (4), the cybersecurity requirements related to Industrial Controls Systems and Operational Technology (ICS/OT) must include at least the following:"
    8_desc: "Strict limitation on connecting mobile devices to industrial production networks."
    9_prefix: "5.1.3.7"
    9_label: "In addition to the applicable ECC controls from the main domains (1), (2), (3) and (4), the cybersecurity requirements related to Industrial Controls Systems and Operational Technology (ICS/OT) must include at least the following:"
    9_desc: "Periodic review and secure configuration and hardening of industrial, automated, support systems, and devices."
    10_prefix: "5.1.3.8"
    10_label: "In addition to the applicable ECC controls from the main domains (1), (2), (3) and (4), the cybersecurity requirements related to Industrial Controls Systems and Operational Technology (ICS/OT) must include at least the following:"
    10_desc: "Vulnerability management for industrial control systems and operational technology (ICS/OT)."
    11_prefix: "5.1.3.9"
    11_label: "In addition to the applicable ECC controls from the main domains (1), (2), (3) and (4), the cybersecurity requirements related to Industrial Controls Systems and Operational Technology (ICS/OT) must include at least the following:"
    11_desc: "Patch management for industrial control systems and operational technology (ICS/OT)."
    12_prefix: "5.1.3.10"
    12_label: "In addition to the applicable ECC controls from the main domains (1), (2), (3) and (4), the cybersecurity requirements related to Industrial Controls Systems and Operational Technology (ICS/OT) must include at least the following:"
    12_desc: "Cybersecurity applications management related to the protection of the industrial systems from viruses and malware."
    13_prefix: "5.1.4"
    13_label: "The cybersecurity requirements related to Industrial Controls Systems and Operational Technology(ICS/OT) must be reviewed periodically."
