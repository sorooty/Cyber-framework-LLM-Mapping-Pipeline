2:
  prefix: "Chapitre 2"
  title: "Rôle des professionnels de santé"
  desc: "ℹ️ Principes: \n 2.1 Certains professionnels de santé (médecin, pharmacien, chirurgien-dentiste ou sage-femme) ont l'obligation et d'autres ont la possibilité de déclarer immédiatement tout effet indésirable susceptible d'être dû à un médicament dont ils ont connaissance au CRPV dont ils dépendent géographiquement en vertu de l'article R. 5121-161 du CSP. \n\n 2.2 Certains professionnels de santé (médecin, pharmacien, chirurgien-dentiste ou sage-femme) ont l'obligation et d'autres ont la possibilité de déclarer immédiatement les cas graves de pharmacodépendance, d'abus ou d'usage détourné d'une substance, plante, médicament ou autre produit mentionné à l'article R. 5132-98 dont ils ont connaissance, au centre d'évaluation et d'information sur la pharmacodépendance (CEIP-A) dont ils dépendent géographiquement (la liste indiquant l'adresse et les départements couverts par chaque CEIP-A est disponible sur le site Internet de l'ANSM via les supports de déclaration mentionnés dans ce chapitre. \n\n 2.3 Toutes les déclarations émanant des professionnels de santé sont prises en compte dans le processus d'évaluation des données de sécurité des médicaments ; elles contribuent à l'identification des risques médicamenteux."
  2:
    prefix: ""
    title: "Professionnels de santé concernés"
    1_prefix: "2.4"
    1_desc: "Tout médecin, chirurgien-dentiste, pharmacien ou sage-femme, quel que soit son mode ou son secteur d’exercice, déclare immédiatement tout effet indésirable, dont il a connaissance, au CRPV dont il dépend géographiquement. \n\n En application des dispositions de l’article R. 5421-1 du CSP, le fait pour les médecins, chirurgiens- dentistes, pharmaciens ou sage-femmes de méconnaître les obligations de signalement immédiat d’un effet indésirable grave suspecté d’être dû à un médicament ou produit au sens du 2° de l’article R. 5121-152 dont ils ont eu connaissance est puni de l’amende prévue pour les contraventions de cinquième classe."
    2_prefix: "2.5"
    2_desc: "Tout autre professionnel de santé qui a connaissance d’un effet indésirable est encouragé à le déclarer au CRPV."
    3_prefix: "2.6"
    3_desc: "Tout établissement de santé, y compris les établissements médico-sociaux, met en œuvre les moyens nécessaires pour que les professionnels de santé déclarent les effets indésirables des médicaments dont ils ont connaissance au CRPV."
  3:
    prefix: ""
    title: "Situations concernées"
    1_prefix: "2.7"
    1_desc: "Fait l’objet d’une déclaration immédiate tout effet indésirable suspecté d’être lié à l’utilisation d’un ou plusieurs médicaments qu’il soit grave ou non, listé ou non dans le résumé des caractéristiques du produit (RCP) et la notice patient, survenant dans des conditions d’utilisation conforme ou non conforme aux termes de l’autorisation ou de l’enregistrement du ou des médicaments. Sont ainsi également concernés les effets indésirables résultant : \n\t - d’un surdosage ; \n\t - d’un mésusage ou d’un usage détourné ; \n\t - d’un abus ; \n\t - d’une erreur médicamenteuse ; \n\t - d’une exposition professionnelle ; \n\t - d’une interaction médicamenteuse ; \n\t - d’un défaut de qualité d’un médicament ou de médicaments falsifiés ; \n\t - d’une exposition en cours de grossesse (maternelle ou génération précédente ou via le sperme) ; \n\t - d’une exposition paternelle (altération potentielle des spermatozoïdes) ; \n\t - d’une exposition au cours de l’allaitement."
    2_prefix: "2.8"
    2_desc: "En outre, les professionnels de santé sont encouragés à déclarer également au CRPV : \n\t - toute erreur médicamenteuse sans effet indésirable, qu’elle soit avérée ou interceptée, en précisant la relation avec le médicament impliqué ainsi que tout risque d’erreur ; \n\t - toute suspicion d’inefficacité thérapeutique (partielle ou totale), en dehors des progressions naturelles de la maladie sous-jacente, en particulier avec les vaccins, les contraceptifs, les traitements de pathologies mettant en jeu le pronostic vital, les résistances inattendues à des traitements médicamenteux ou toute autre situation jugée cliniquement pertinente ; \n\t - toute suspicion de transmission d’agents infectieux liée à un médicament ou à un produit ; \n\t - toute exposition à un médicament au cours de la grossesse ou de l’allaitement sans survenue d’effet indésirable ; \n\t - toute situation que le professionnel de santé juge pertinente de déclarer."
    3_prefix: "2.9"
    3_desc: "Les professionnels de santé peuvent également s’adresser au CRPV pour toute demande de renseignement ou tout signalement relatif à la sécurité d’emploi des médicaments."
    4_prefix: "2.10"
    4_desc: "De plus, même en l’absence d’effet indésirable, peut être déclaré directement à l’ANSM tout défaut de qualité d’un médicament, susceptible d’avoir des conséquences pour la santé ou la sécurité des patients."
  4:
    prefix: ""
    title: "Procédure de déclaration"
    1_prefix: "2.11"
    1_desc: "Les déclarations de pharmacovigilance doivent être préférentiellement réalisées via le portail de signalement des évènements sanitaires indésirables du ministère chargé de la santé (https://signalement.social-sante.gouv.fr/). Elles sont alors transmises automatiquement au CRPV du territoire duquel dépend le professionnel de santé."
    2_prefix: "2.12"
    2_desc: "D’autres supports de déclaration peuvent être utilisés, tels qu’un courrier, un compte rendu d’hospitalisation, un fax, un courriel ou un appel téléphonique, adressés directement au CRPV du territoire duquel dépend le professionnel de santé. La liste indiquant l’adresse et les départements couverts par chaque CRPV est disponible sur le site Internet de l’ANSM."
    3_prefix: "2.13"
    3_desc: "Dans le cadre de suivis de pharmacovigilance particuliers (sur un médicament donné ou un effet indésirable particulier, lors de conditions épidémiques, dans le cadre d’un CPC, …), des outils spécifiques (guichet électronique, numéro d’appel téléphonique) peuvent être proposés pour simplifier la démarche de déclaration."
    4_prefix: "2.14"
    4_desc: "Les déclarations relatives aux médicaments faisant l’objet d’une AAP ou AAC et soumis à un « protocole d’utilisation thérapeutique et de recueil d’informations » (PUT-RD), sont effectuées selon les modalités prévues dans ledit protocole."
    5_prefix: "2.15"
    5_desc: "Les professionnels de santé informent les patients, conformément aux dispositions de la loi n° 78-17 du 6 janvier 1978 relative à l'informatique, aux fichiers et aux libertés modifiée, des déclarations les concernant et de leur droit d’accès et de rectification auprès de l’ANSM ou du CRPV, leur permettant d’avoir connaissance de la totalité des informations saisies les concernant et de corriger ou d’effacer d’éventuelles données inexactes, incomplètes ou équivoques, périmées. Ce droit d’accès peut aussi être exercé par le professionnel de santé qui a déclaré le cas."
  5:
    prefix: ""
    title: "Contenu de la déclaration"
    1_prefix: "2.16"
    1_desc: "Pour être valide, toute déclaration d’effet indésirable doit comporter au minimum les 4 éléments suivants : \n\t - un déclarant identifiable ; \n\t - un patient identifiable ; \n\t - un ou des médicaments suspectés ; \n\t - la nature du ou des effets indésirables, ou des situations motivant la déclaration."
    2_prefix: "2.17"
    2_desc: "Afin de mieux documenter la déclaration et de suivre son évolution, il importe que les informations fournies soient les plus précises et complètes possible en indiquant notamment : \n\t - le nom, la qualification et l'adresse du déclarant ; \n\t - les trois premières lettres du nom et la première lettre du prénom, le sexe et la date de naissance, l’âge (ou le groupe d’âge) du patient au moment de la survenue de l’effet indésirable ; \n\t - le poids et la taille du patient en particulier lorsqu’il s’agit d’un enfant ; \n\t - les numéros de lots incriminés pour les médicaments, si ceux-ci sont disponibles ; plus particulièrement en cas d’administration de médicament(s) biologique(s), par exemple médicament dérivé du sang ou vaccin, ou en cas de groupes de cas d’effets indésirables (cluster) ; \n\t - le critère de gravité de l’effet indésirable ; \n\t - la date de survenue de l’effet indésirable ; \n\t - l'évolution de l’effet indésirable ; \n\t - la chronologie des signes cliniques ou biologiques et des prises médicamenteuses, le diagnostic éventuellement retenu et les principaux diagnostics ayant été éliminés, sont à détailler dans la mesure du possible, les comptes rendus d’hospitalisation, les courriers médicaux, les résultats d’examens complémentaires peuvent également être joints à la déclaration ; \n\t - en cas de déclaration à toute autre structure de vigilance ou une autre institution comme l’ARS, le professionnel de santé est invité à le préciser afin de faciliter la détection de doublons et les investigations."
  6:
    prefix: ""
    title: "Traitement de déclaration"
    1_prefix: "2.18"
    1_desc: "Toute déclaration d’effet indésirable est instruite (analyse clinique, biologique et pharmacologique) par le CRPV et transmise, par l’intermédiaire de la base nationale de pharmacovigilance (BNPV), à l’ANSM sous forme pseudonymisée selon les modalités décrites au chapitre 5 « Rôle des centres régionaux de pharmacovigiloance (CRPV) » des présentes bonnes pratiques."
    2_prefix: "2.19"
    2_desc: "Le déclarant et les différents professionnels de santé qui sont intervenus dans la prise en charge d’un même patient peuvent être recontactés dans le cadre de l’évaluation initiale de la déclaration ou de son suivi. Ils mettent à la disposition du CRPV toutes les informations utiles à cette évaluation. \n\n De plus, en cas de déclaration d’effet indésirable par un patient, tout professionnel de santé peut être contacté, après accord du patient, par le CRPV pour documenter cette déclaration."
    3_prefix: "2.20"
    3_desc: "La déclaration ainsi que tous les documents sources fournis dans le cadre de la déclaration font partie du dossier médical du patient et doivent être traités dans le respect de la confidentialité des données, du secret médical et professionnel, notamment. Le professionnel de santé veillera à les protéger contre toute indiscrétion."
    4_prefix: "2.21"
    4_desc: "La déclaration ainsi que tous les documents sources relatifs à la déclaration sont conservés selon les modalités décrites à l’article R. 1112-7 du CSP concernant le dossier médical et pour les professionnels de santé déclarants en établissement de santé, selon les modalités prévues dans les procédures d’archivage qui y sont mises en place."
  7:
    prefix: ""
    title: "Autres implications des professionnels de santé"
    1_prefix: "2.22"
    1_desc: "Les professionnels de santé coopèrent à la mise en œuvre et à la réalisation d’enquêtes, d’études de pharmacovigilance ou d’études de pharmaco-épidémiologie."
    2_prefix: "2.23"
    2_desc: "Les professionnels de santé ont une obligation de formation (conformément à la loi n°2009-879 du 21 juillet 2009 modifiée) et doivent se tenir informés et tenir compte, dans leur pratique professionnelle, des données de sécurité des médicaments qu’ils prescrivent, dispensent ou administrent. Notamment, ils prennent en compte les informations communiquées via les informations de sécurité et mesures additionnelles de réduction du risque qui sont mis à leur disposition sous l’autorité de l’ANSM."
    3_prefix: "2.24"
    3_desc: "Les professionnels de santé sont les interlocuteurs privilégiés des patients. A ce titre, ils jouent un rôle essentiel de relais d’information entre les patients et les autorités sanitaires."
    4_prefix: "2.25"
    4_desc: "Les organisations représentatives de professionnels de santé (ordres, sociétés savantes, syndicats, …) sont régulièrement consultées ou participent à l’élaboration de message relatif à la pharmacovigilance et de plan de communication, à la diffusion d’information par leurs propres réseaux, et à la mesure d’impact des mesures de communication."
3:
  prefix: "Chapitre 3"
  title: "Rôle des patients en matière de pharmacovigilance"
  1:
    prefix: "Rôle des patients en matière de pharmacologie"
    title: "Droit de l’information"
    1_prefix: "3.1"
    1_desc: "Les patients, leurs représentants, les associations de patients agréées, ainsi que les usagers du système de santé participent à la pharmacovigilance. Ils peuvent déclarer tout effet indésirable qu'ils suspectent d’être lié à l’utilisation d’un ou plusieurs médicaments directement au CRPV dont la personne ayant présenté l’effet indésirable dépend géographiquement, en vertu de l’article R. 5121-161 du CSP."
    2_prefix: "3.2"
    2_desc: "Les patients peuvent déclarer les cas d’abus, de dépendance ou d’usage détourné liés à la prise de médicaments au centre d’évaluation et d’information sur la pharmacodépendance (CEIP-A) dont ils dépendent géographiquement (la liste indiquant l’adresse et les départements couverts par chaque CEIP-A est disponible sur le site Internet de l’ANSM) via les supports de déclaration mentionnés dans ce chapitre."
    3_prefix: "3.3"
    3_desc: "La déclaration d’effet indésirable s’inscrit dans le cadre des activités de pharmacovigilance et a pour objectif de permettre aux autorités de santé de prendre toute mesure utile en vue de prévenir, réduire ou faire cesser les risques résultant de l’utilisation de médicaments."
  2:
    prefix: ""
    title: "Situations concernées"
    1_prefix: "3.4"
    1_desc: "Lorsqu'un patient a pris ou prend un ou plusieurs médicaments et qu'il pense qu’au moins l'un d'entre eux peut être à l'origine d'un effet indésirable, il peut effectuer une déclaration auprès du CRPV dont il dépend géographiquement."
    2_prefix: "3.5"
    2_desc: "Sont concernés tous les effets indésirables suspectés d’être liés à l’utilisation d’un ou plusieurs médicaments, qu’ils soient graves ou non, mentionnés ou non dans la notice patient, survenant dans des conditions d’utilisation conforme ou non conforme aux termes de l’autorisation ou de l’enregistrement du ou des médicaments. \n Sont ainsi également concernés les effets indésirables résultant : \n\t - d’un surdosage ; \n\t - d’un mésusage ou d’un usage détourné ; \n\t - d’un abus ; \n\t - d’une erreur médicamenteuse ; \n\t - d’une exposition professionnelle ; \n\t - d’une interaction médicamenteuse ; \n\t - d’un défaut de qualité d’un médicament ou de médicaments falsifiés ; \n\t - d’une exposition en cours de grossesse (maternelle ou génération précédente ou via le sperme) \n\t - d’une exposition paternelle (altération potentielle des spermatozoïdes) ; \n\t - d’une exposition au cours de l’allaitement. \n\n En outre, peuvent également être déclarés au CRPV : \n \n\t - toute erreur médicamenteuse sans effet indésirable, qu’elle soit avérée ou interceptée en précisant la relation avec le médicament impliqué ainsi que tout risque d’erreur identifié ; \n\t - toute suspicion d’inefficacité thérapeutique (partielle ou totale), en dehors des progressions naturelles de la maladie sous-jacente, en particulier avec les vaccins, les contraceptifs, les traitements de pathologies mettant en jeu le pronostic vital, les résistances inattendues à des traitements médicamenteux ou toute autre situation jugée cliniquement pertinente ; \n\t - toute suspicion de transmission d’agents infectieux liée à un médicament ou à un produit ; \n\t - toute exposition à un médicament au cours de la grossesse ou de l’allaitement sans survenue d’effet indésirable ; \n\t - toute autre situation que le patient juge pertinente de déclarer. De plus, même en l’absence d’effet indésirable, peut être déclaré directement à l’ANSM tout défaut de qualité d’un médicament, susceptible d’avoir des conséquences pour la santé ou la sécurité des patients."
  3:
    prefix: ""
    title: "Déclaration"
    1_prefix: "3.6"
    1_desc: "La déclaration peut être effectuée par le patient lui-même, par une association de patients agréée, ou toute personne ayant connaissance d’un effet indésirable suspecté d’être dû à un médicament, notamment lorsque le patient ne peut effectuer lui-même cette déclaration."
    2_prefix: "3.7"
    2_desc: "Le patient est encouragé à se rapprocher de son médecin pour qu'il l'examine et effectue lui-même la déclaration de l'effet indésirable le cas échéant. Le patient peut également s'adresser à son pharmacien ou à tout autre professionnel de santé afin qu'il déclare l'effet indésirable ou qu'il l'aide à remplir le formulaire. De même, il peut aussi s'adresser à une association de patients agréée."
  4:
    prefix: ""
    title: "Procédure de déclaration"
    1_prefix: "3.8"
    1_desc: "La déclaration doit préférentiellement être réalisée via le portail de signalement des évènements sanitaires indésirables du ministère chargé de la santé (https://signalement.social-sante.gouv.fr/). Elle sera alors automatiquement transmise au centre régional de pharmacovigilance dont la personne ayant présenté l’effet indésirable dépend géographiquement."
    2_prefix: "3.9"
    2_desc: "D’autres supports de déclaration peuvent être utilisés, tels qu’un courrier, un courriel, ou un appel téléphonique, adressés directement au CRPV dont la personne ayant présenté l’effet indésirable dépend géographiquement. La liste indiquant l’adresse et les départements couverts par chaque CRPV est disponible sur le site Internet de l’ANSM. \n\n Dans le cadre de suivis de pharmacovigilance particuliers (d’un médicament donné ou d’un effet indésirable particulier, conditions épidémiques, …), des outils spécifiques (guichet électronique, numéro d’appel téléphonique) peuvent être proposés pour simplifier la démarche de déclaration."
  5:
    prefix: ""
    title: "Contenu de la déclaration"
    1_prefix: "3.10"
    1_desc: "En vue de l’instruction du cas, le déclarant est invité à joindre au formulaire tous documents permettant de compléter et d’étayer la déclaration (par exemple : compte rendu d’hospitalisation, correspondance médicale, résultats d’examens complémentaires, etc.), ainsi qu’à indiquer ses coordonnées et celles d’un professionnel de santé (médecin traitant, professionnel de santé qui a constaté ou pris en charge l’effet indésirable, ou qui a prescrit le médicament)."
    2_prefix: "3.11"
    2_desc: "Il importe que les informations fournies soient aussi précises et complètes que possible. Elles seront traitées dans le respect de la confidentialité des données et du secret médical et professionnel, et pseudonymisées (seules les initiales, l'âge (et/ou la date de naissance) et le sexe seront enregistrés dans la base nationale de pharmacovigilance)."
  6:
    prefix: ""
    title: "Formulaire de déclaration"
    1_prefix: "3.12"
    1_label: "Déclarant"
    1_desc: "Le déclarant renseigne ses coordonnées. Il peut s’agir de la personne qui a présenté l’effet indésirable elle-même ou par exemple d’un représentant légal, d’un tiers (famille, ami, …) ou encore d’une association de patients agréée. Il est recommandé de préciser le lien entre le déclarant et le patient."
    2_prefix: "3.13"
    2_label: "Personne qui a été exposée au(x) médicament(s) et qui a présenté les effets indésirables"
    2_desc: "La personne ayant présenté l’effet indésirable doit être identifiable par le CRPV dont elle dépend géographiquement. Pour cela, sont nécessaires au minimum les informations suivantes : les 3 premières lettres de son nom, la première lettre de son prénom, son sexe et son âge (ou une estimation de son âge). De plus il importe, en particulier lorsqu’il s’agit d’un enfant, d’indiquer son poids et sa taille."
    3_prefix: "3.14"
    3_label: "Médicament(s) utilisé(s)"
    3_desc: "S’agissant du ou des médicaments suspectés, il convient de mentionner, dans la mesure du possible : \n\t - le nom exact et complet tel qu'indiqué sur le conditionnement extérieur (emballage), ainsi que son dosage et la forme pharmaceutique sous laquelle il se présente (comprimé, sirop, suppositoire, poudre pour solution buvable, ...) (par exemple : Médic 500 mg, comprimé.) ; si le nom est incomplet, faux, illisible ou inconnu, il sera impossible d'évaluer le lien entre l'effet indésirable et le médicament en l’état et des investigations seront nécessaires ; \n\t - le numéro de lot de fabrication : il figure sur l'emballage du médicament, généralement à côté de la date de péremption, et permet de suivre le produit de sa fabrication jusqu'à son utilisation ; \n\t - le mode d'utilisation et la dose utilisée : le mode d’exposition du patient au(x) médicament(s) (avalé, injecté, appliqué sur la peau, instillé dans l'œil, ...) ainsi que la posologie (par exemple : dose utilisée et nombre de prises par jour), sont des informations particulièrement utiles, notamment s'il ne s'agit pas des conditions habituelles d'utilisation du médicament indiquées dans la notice ou prescrites par le médecin ; \n\t - les dates de début et de fin d'utilisation : elles permettent d'estimer la durée d'utilisation du médicament, sachant que certains effets indésirables ne se manifestent qu'après une certaine durée de traitement ; si le déclarant ne se souvient plus des dates exactes, la durée d'utilisation peut être mentionnée et/ou la période approximative du traitement ; \n\t - le motif de l'utilisation, c’est à dire la raison pour laquelle ce médicament (nature de la maladie, simple symptôme ou mesure de prévention) a été prescrit et/ou pris."
    4_prefix: "3.15"
    4_label: "Médicament(s) utilisé(s)"
    4_desc: "Les autres médicaments ou produits utilisés pendant la période précédant la survenue de l'effet indésirable doivent également être mentionnés. Il peut s'agir de traitements pris ponctuellement ou tous les jours, prescrits par un médecin, ou que le patient a pris de sa propre initiative (ou d’autres produits : complément alimentaire, phytothérapie, ...). \n\n Cette information est importante dans la mesure où : \n\t - l'interaction entre deux médicaments ou un médicament et un complément alimentaire est parfois à l'origine d'un effet indésirable ; \n\t - le médicament suspecté n'est pas forcément le produit réellement responsable, même si celui-ci a déjà été incriminé pour les mêmes effets indésirables ; \n\t - la connaissance des traitements suivis permet de mieux connaître l'état de santé général du patient."
    5_prefix: "3.16"
    5_label: "Description de l'effet indésirable et de son évolution"
    5_desc: "Lors de la description de l’effet indésirable, il importe de mentionner : \n\t - les manifestations ressenties (par exemple : tâches rouges sur la peau, démangeaisons, fourmillements, picotements, ...) ; tant que le diagnostic n’a pas été clairement posé par un médecin, il est recommandé de ne pas désigner les manifestations par des termes médicaux ou sous la forme d'un diagnostic médical ; \n\t - la date de survenue et la durée de l'effet indésirable ; \n\t - les conditions de survenue (progressivement, du jour au lendemain, après le repas, ...) ; \n\t - le délai entre l'administration du médicament et la survenue des premières manifestations de l'effet indésirable ; plus précisément, le délai entre la première utilisation du médicament et la survenue de l'effet indésirable, ou bien, si le patient avait déjà arrêté le traitement, le délai entre la dernière utilisation du médicament et la survenue de l'effet indésirable ; \n\t - l'évolution des manifestations (diminution, aggravation, disparition, persistance, séquelles, conséquences sur la vie quotidienne) et si le traitement médicamenteux a été arrêté ou non, ainsi que l'évolution constatée après l'éventuel arrêt ; \n\t - les soins effectués pour soulager le patient en étant si possible précis sur le déroulement des effets dans le temps (amélioration ou non des manifestations de l’effet indésirable)."
    6_prefix: "3.17"
    6_label: "Description de l'effet indésirable et de son évolution"
    6_desc: "Si la personne présentant l'effet indésirable est un enfant, il est recommandé de préciser si l’enfant a été exposé lui-même au médicament, ou par l’intermédiaire de son père ou sa mère (pendant la période pré-conceptionnelle, la grossesse ou l'allaitement). En cas d’effet indésirable lié à une exposition in utero ou pré-conceptionnelle, la période d’exposition doit être précisée."
    7_prefix: "3.18"
    7_label: "Médecin traitant du patient ou autre professionnel de santé"
    7_desc: "Si le médecin qui a prescrit le médicament suspecté d’être à l’origine de l’effet indésirable n'est pas le même que celui qui a pris en charge l'effet indésirable, ce sont les coordonnées de ce dernier qu'il faut préciser en priorité."
  7:
    prefix: ""
    title: "Traitement de la déclaration"
    1_prefix: "3.19"
    1_desc: "La déclaration ainsi réalisée est instruite (analyse clinique, biologique et pharmacologique) par un CRPV selon les modalités décrites au chapitre 5 « Rôle des centres régionaux de pharmacovigilance » des présentes bonnes pratiques. Il procède à la validation de la déclaration, qui conditionne sa prise en compte par le système de pharmacovigilance, et requiert la présence des quatre éléments suivants : \n\t - un déclarant identifiable (la personne ayant effectué la déclaration) ; \n\t - un patient identifiable ; \n\t - un ou des médicaments suspectés ; \n\t - la nature du ou des effets indésirables, ou des situations motivant la déclaration."
    2_prefix: "3.20"
    2_desc: "Le professionnel de santé du CRPV évalue la confirmation médicale de l’effet indésirable. Celle-ci repose sur l’analyse des documents médicaux relatifs à l’effet indésirable remis par le déclarant (par exemple : compte rendu d’hospitalisation, correspondance médicale, résultats d’examens complémentaires, ordonnances, etc...), notamment s’ils sont suffisants pour confirmer la présence du/des effet(s) indésirable(s), voire du diagnostic et l’exposition au médicament. Le CRPV peut contacter le professionnel de santé dont le déclarant a fourni les coordonnées ou le déclarant aux fins d’obtenir ces informations. \n C’est pourquoi il est indispensable que le CRPV puisse avoir accès à l'ensemble des données médicales disponibles concernant le patient."
    3_prefix: "3.21"
    3_desc: "Toutes les déclarations valides sont ensuite enregistrées, pseudonymisées et transmises à l’ANSM via la base nationale de pharmacovigilance dans le respect de la confidentialité des données et du secret médical et professionnel."
    4_prefix: "3.22"
    4_desc: "Un accusé de réception de sa déclaration est adressé au déclarant par le CRPV puis, le cas échéant, un courrier l’informant des suites qui ont été données à l’issue de l’instruction."
    5_prefix: "3.23"
    5_desc: "Conformément aux dispositions de la loi n° 78-17 du 6 janvier 1978 relative à l'informatique, aux fichiers et aux libertés, modifiée, le patient dispose d'un droit d'accès et de rectification auprès de l’ANSM ou du CRPV dont il dépend géographiquement, lui permettant d'avoir connaissance de la totalité des informations saisies le concernant et de corriger ou d’effacer d'éventuelles données inexactes, incomplètes, équivoques ou périmées. Ce droit d'accès peut aussi être exercé par le professionnel de santé qui a déclaré le cas."
    6_prefix: "3.24"
    6_desc: "La déclaration-patient ainsi que le dossier de pharmacovigilance du patient (c’est-à-dire les données du cas enregistrées dans la base nationale de pharmacovigilance et le cas échéant les documents annexes associés) font partie de son dossier médical."
  8:
    prefix: ""
    title: "Rôle des associations de patients"
    1_prefix: "3.25"
    1_desc: "Les associations de patients et d’usagers du système de santé participent aux processus d’évaluation, de décision, de communication et à l’échange d’informations entre les autorités sanitaires et les patients, notamment : \n\t - elles siègent dans les instances consultatives, notamment le comité scientifique permanent de pharmacovigilance, au conseil d’administration de l’ANSM ainsi qu’au comité pour l’évaluation des risques en matière de pharmacovigilance « Pharmacovigilance risk assessment committee » (PRAC) de l’Agence européenne du médicament ; \n\t - elles participent, à la demande de l’ANSM, notamment lorsqu’elles sont concernées par la mise sur le marché de médicaments faisant l’objet d’un plan de gestion des risques (PGR) ou de programme d’apprentissage patient, à la mise en place du dispositif de surveillance et à l’élaboration des outils de réduction du risque ; \n\t - elles transmettent aux autorités sanitaires toute information nouvelle sur la sécurité des médicaments ; \n\t - elles diffusent et relaient les informations de sécurité sanitaire à leurs adhérents et au sein de leurs réseaux ; \n\t - elles participent au processus d’élaboration des documents d’information à destination du public selon les modalités décrites au chapitre 7 « Bonnes pratiques de communication sur la sécurité d’emploi des médicaments » des présentes bonnes pratiques."
4:
  prefix: "Chapitre 4"
  title: "Rôle du titulaire et de l'exploitant"
  desc: "ℹ️ Principes: \n 4.1 Les activités relatives à la pharmacovigilance sont réalisées sur le territoire national par l'exploitant, entendu, au terme de l'article R. 5124-2 du CSP, comme l'entreprise se livrant à l'exploitation de médicament, laquelle est réalisée soit par le titulaire de l'AMM, soit pour le compte de ce titulaire par une autre entreprise, soit par l'un et par l'autre. \n\n 4.2 La mise en œuvre des activités de pharmacovigilance et du respect des obligations de pharmacovigilance incombant à toute entreprise exploitant des médicaments, s'exerce sur le territoire national sous la responsabilité du pharmacien responsable. \n\n 4.3 Lorsque le système de pharmacovigilance mis en œuvre par l'exploitant sur le territoire national ne constitue qu'une partie du système de pharmacovigilance mis en œuvre par le titulaire de l'AMM au niveau européen, le pharmacien responsable s'assure de pouvoir exercer pleinement l'ensemble des obligations qui lui incombent en matière de pharmacovigilance. Les responsabilités et rôles de chacun ainsi que les modalités de fonctionnement entre ces systèmes sont décrits dans un document spécifique dont le contenu est précisé au paragraphe 4.12 du présent chapitre."
  2:
    prefix: ""
    title: "Organisation du système de pharmacovigilance mis en place sur le territoire national"
    1_prefix: "4.4"
    1_label: "Désignation d’une personne de référence en matière de pharmacovigilance (RPV)"
    1_desc: "Afin d’assurer les obligations et les responsabilités qui lui incombent en matière de pharmacovigilance, l’exploitant dispose, conformément aux dispositions de l’article R. 5121-164 du CSP, des services d’une personne de référence en matière de pharmacovigilance sur le territoire national. Cette personne de référence, médecin ou pharmacien, réside et réalise ses activités en France et doit justifier d’une expérience en matière de pharmacovigilance. Elle peut être distincte (ou non) de la personne qualifiée responsable en matière de pharmacovigilance dans l’EEE (QPPV) et/ou du pharmacien responsable (PR). \n L’identité et la qualité ainsi que les coordonnées du RPV et du QPPV sont communiquées dès leur nomination au Directeur général de l’ANSM via la plateforme « démarche simplifiée » accessible depuis le site internet de l’ANSM. L’exploitant devra s’assurer que celles du QPPV sont communiquées par le(s) titulaire(s) des AMM des produits qu’il exploite à l’EMA par l’intermédiaire de la base de données « Article 57 » (telle que définie par le Règlement (CE) n° 726/2004 précité)."
    2_prefix: "4.5"
    2_label: "Désignation d’une personne de référence en matière de pharmacovigilance (RPV)"
    2_desc: "L’exploitant dispose d’un organigramme actualisé de l’entreprise indiquant les relations hiérarchiques et/ou fonctionnelles du RPV avec le PR et les autres services ainsi qu’avec le QPPV."
    3_prefix: "4.6"
    3_label: "Désignation d’une personne de référence en matière de pharmacovigilance (RPV)"
    3_desc: "L’exploitant s’assure de la continuité des activités de pharmacovigilance, qu’il doit garantir et notamment du remplacement du RPV en cas d’absence."
    4_prefix: "4.7"
    4_label: "Désignation d’une personne de référence en matière de pharmacovigilance (RPV)"
    4_desc: "Les modalités de collaboration entre le QPPV et le RPV, ainsi que les activités confiées à ce dernier, sont décrites dans un document établi entre les deux parties sauf si elles sont déjà décrites dans le cadre du dossier permanent du système de pharmacovigilance européen (PSMF)."
    5_prefix: "4.8"
    5_label: "Missions de la personne de référence en matière de pharmacovigilance (RPV)"
    5_desc: "Les missions du RPV sont détaillées à l’article R. 5121-164 du CSP. Il lui incombe notamment de : \n\ta. mettre en place et gérer le système de pharmacovigilance sur le territoire national ; \n\tb. veiller sur le territoire national : \n\t\t - à la maitrise du système de pharmacovigilance dans son ensemble ; \n\t\t - au respect des obligations qui lui incombent en matière de pharmacovigilance, notamment : \n\t\t\t - de déclaration des cas d’effets indésirables, de transmission des rapports périodiques actualisés de sécurité (PSUR) ; \n\t\t\t de mise en œuvre du système de gestion des risques ; \n\t\t\t de mise en œuvre et de mise à jour des mesures décrites dans le plan de gestion des risques européen au niveau national ainsi que des mesures spécifiques sur le territoire national demandées par l’ANSM, telles qu'une surveillance renforcée ou des activités de réduction de risque, ainsi que de surveiller les résultats des mesures de réduction des risques ; \n\t\t\t de mise en œuvre des conditions imposées par l’AMM, notamment la réalisation et le suivi des études de sécurité post-AMM. \n\t\t à ce que toute demande de l’ANSM et/ou des CRPV et CEIP-A, visant à obtenir des informations complémentaires nécessaires à l’exercice de la pharmacovigilance, soit suivie d’une réponse complète dans les délais impartis ; \n\tc. mettre en place les mesures nécessaires à la détection et à la validation des signaux et coopérer à l’évaluation d’un signal confirmé, conformément aux modalités décrites au module IX des GVP incluant l’estimation de l’incidence des effets indésirables suspectés (ou à défaut le taux de notifications) ; \n\td. disposer des éléments lui garantissant la maitrise des systèmes informatisés utilisés dans le cadre de l’exécution des activités de pharmacovigilance, de leur validation et de leur maintien à l'état validé. Par ailleurs, le RPV s’ assure de la mise à jour régulière de l’information sur les médicaments ou produits au regard des donnée"
    6_prefix: "4.9"
    6_label: "Le personnel du système de pharmacovigilance mis en place sur le territoire national"
    6_desc: "L’exploitant met à disposition du RPV les moyens matériels et humains nécessaires à l’exécution de ses obligations en matière de pharmacovigilance, conformément aux exigences de l’article 10 du règlement d’exécution (UE) n°520/2012 précité."
    7_prefix: "4.10"
    7_label: "Le personnel du système de pharmacovigilance mis en place sur le territoire national"
    7_desc: "Le RPV s’assure de la formation du personnel conformément aux dispositions du module I des GVP, notamment : \n\t - la formation de tous les membres du personnel de l’entreprise ou organisme exploitant et de tout prestataire intervenant dans l’exécution des activités de pharmacovigilance en lien avec leur fonction et leurs responsabilités ; \n\t - une formation de tous les membres du personnel de l’entreprise ou organisme exploitant afin qu’ils connaissent la conduite à tenir dès lors qu’ils ont connaissance d’un problème de sécurité (y compris d’une utilisation non conforme aux termes de l’autorisation ou de l’enregistrement). \n\n Les plans de formation et les dossiers de formation sont conservés et tenus à disposition en cas d'audit ou d'inspection."
    8_prefix: "4.11"
    8_label: "Description détaillée du système de pharmacovigilance mis en place sur le territoire national"
    8_desc: "L’exploitant tient à disposition des autorités compétentes outre la copie du dossier permanent du système de pharmacovigilance européen, un document écrit actualisé décrivant de façon détaillée le système de pharmacovigilance mis en place sur le territoire national lorsque celui-ci n’est pas décrit dans le cadre du PSMF. Il transmet une copie de ce(s) document(s) dans un délai de 7 jours au plus tard, en réponse à une demande de l’ANSM."
    9_prefix: "4.12"
    9_label: "Description détaillée du système de pharmacovigilance mis en place sur le territoire national"
    9_desc: "Ce document fournit une vue d’ensemble du système de pharmacovigilance mis en place sur le territoire national. Il renvoie au PSMF en tant que de besoin quand les informations y figurent. Il inclut : \n\ta. l’identité, la qualification, et les coordonnées du RPV ; \n\tb. l’organigramme du service en charge de la pharmacovigilance ainsi que l’organigramme actualisé de l’entreprise indiquant les relations hiérarchiques et/ou fonctionnelles du RPV avec le PR de l’entreprise et les autres services ; \n\tc. la description de l’organisation du système de pharmacovigilance (dont la gestion des activités de pharmacovigilance et de leur sous-traitance le cas échéant), de son système de management de la qualité relative à la pharmacovigilance ainsi que les modalités de fonctionnement en cas d’absence du RPV ; \n\td. la description des bases de données de pharmacovigilance et leur statut de validation ; \n\te. la description des modalités de formation à la pharmacovigilance de l’ensemble du personnel de l’exploitant ; \n\tf. la description des modalités d’archivage des données relatives à la pharmacovigilance. \n\tg. la liste des procédures en vigueur d’importance pour le système de pharmacovigilance ; \n\th. la liste des contrats conclus entre exploitants et/ou titulaires d’AMM, en détaillant les responsabilités, rôles et modalités de fonctionnement entre l’exploitant et le ou les titulaires d’AMM, les spécialités concernées et les dates des audits de ces organismes réalisés sur les cinq dernières années ; \n\ti. la liste des contrats de sous-traitance concernant une ou plusieurs activités de pharmacovigilance le cas échéant, en indiquant les dates des audits de ces organismes réalisés sur les cinq dernières années."
  3:
    prefix: ""
    title: "Obligations d'enregistrement et de déclaration"
    1_prefix: "4.13"
    1_label: "Enregistrement des effets indésirables et des situations particulières"
    1_desc: "Conformément aux modalités prévues au module VI des GVP, l’exploitant enregistre et traite informatiquement l’ensemble des données suivantes de manière à constituer et maintenir une base de données exploitable : \n\ta. tout effet indésirable suspecté d'être dû à un médicament ou situation particulière sans effet indésirable survenant dans des conditions d’utilisation conforme ou non conforme aux termes de l’autorisation ou de l’enregistrement du ou des médicaments ainsi que toute information ou demande de renseignements relatives à l’exposition à un médicament. Sont ainsi concernés les situations particulières suivantes : \n\t\t - un surdosage ; \n\t\t - un mésusage ; \n\t\t - un abus ; \n\t\t - un usage détourné ; \n\t\t - une erreur médicamenteuse ; \n\t\t - une exposition professionnelle ; \n\t\t - une interaction médicamenteuse ; \n\t\t - un défaut de qualité d’un médicament ou de médicaments falsifiés ; \n\t\t - une exposition en cours de grossesse (maternelle ou via le sperme) avec le cas échéant, enregistrement du suivi (issue de la grossesse et suivi des enfants exposés); \n\t\t - une exposition paternelle (altération potentielle des spermatozoïdes) ; \n\t\t - une exposition au cours de l’allaitement ; \n\t\t - une suspicion de transmission d’agents infectieux ; \n\t\t - une suspicion d’inefficacité thérapeutique (partielle ou totale) ; \n\nIl s’agit pour les effets indésirables, des effets signalés de façon spontanée par les professionnels de santé, les patients ou tout autre usager du système de santé, ou sollicitée lors d’une étude post- autorisation. Sont ainsi concernés les effets indésirables graves ou non graves, attendus ou inattendus ou de tout autre situation jugée cliniquement pertinente. Il peut s’agir des effets bénéfiques inattendus. \n En complément, il : \n\tb. prévient la création de doublons des cas enregistrés par la mise en place de procédures appropriées ; \n\tc. évalue l’imputabilité selon la méthode choisie par le titulaire d’AMM et/ou l’exploitant entre le médicament et les effets indésirables suspectés ; \n\td. assure un contrôle qualité des données enregistrées dans cette base, notamment au regard des documents originaux accessibles. Il assure la traçabilité de ce contrôle ; \n\te. documente l’évolution de l’effet indésirable et procède à l’actualisation des données en fonction des informations reçues lors des suivis. Une attention particulière sera portée aux cas graves et/ou inattendus et/ou identifiés dans les systèmes de gestion des risques et médicaments sous surveillance renforcée ou faisant l’objet d’une enquête nationale de pharmacovigilance ou l’objet d’une procédure de réévaluation du bénéfice/risque liée à un problème de sécurité ; \n\tf. recontacte le déclarant par tous moyens et dans des délais appropriés, de manière à recueillir oucompléter la déclaration. Dans le cas particulier des informations transmises directement par un patient ou un usager, l’exploitant cherchera à documenter médicalement la déclaration, si possible auprès du professionnel de santé qui a été consulté par le patient après avoir obtenu l’accord de celui-ci, ou directement auprès du patient lui-même. En outre, l’exploitant adaptera sa méthodologie de documentation des cas de pharmacovigilance afin d’optimiser la collecte des données manquantes. \n\tg. informe le déclarant des suites données à sa déclaration ; \n\th. conserve tout élément relatif au recueil et à la documentation du cas signalé et assure la traçabilité des échanges avec le déclarant. Toute information, y compris celle transmise par voie orale doit être consignée par écrit, datée et archivée ; \n\ti. garantit le respect de la confidentialité des données à caractère personnel, des informations relatives aux déclarations d’effets indésirables ainsi que de tous les documents sources relatifs à la déclaration ; \n\tj. vérifie que la sécurité des moyens de conservation, d’archivage et de transmission des données, quel que soit le support, est assurée ; \n\tk. réalise de façon hebdomadaire, la veille de la littérature internationale publiée, conformément aux dispositions du module VI des GVP. De plus, il met en place un système permettant la veille de la littérature nationale non indexée dans des bases de données internationales, en se dotant notamment d’un processus de création et de mise à jour d’une liste de revues nationales."
    2_prefix: "4.14"
    2_label: "Déclaration des effets indésirables"
    2_desc: "L’exploitant s’assure de la transmission des déclarations d’effets indésirables par voie électronique à EudraVigilance selon les modalités décrites au module VI des GVP ainsi que de toute information significative recueillie dans le cadre du suivi de ces effets indésirables."
    3_prefix: "4.15"
    3_label: "Déclaration des effets indésirables"
    3_desc: "Dans le cas de médicament contenant des substances actives figurant sur la liste faisant l’objet d’une veille bibliographique par l’EMA, l’exploitant n’est pas tenu de déclarer à EudraVigilance les effets indésirables dont font état ces publications. Il déclare cependant les effets indésirables détectés dans le cadre de la surveillance de toute autre publication médicale non couverte par la veille de l’EMA."
    4_prefix: "4.16"
    4_label: "Déclaration des effets indésirables"
    4_desc: "Il participe également à la détection des doublons conformément aux dispositions de l’article R. 5121-167 du CSP et aux modalités prévues au module VI des GVP."
    5_prefix: "4.17"
    5_label: "Spécificités des médicaments faisant l’objet d’un cadre de prescription compassionnelle (CPC)"
    5_desc: "Des outils spécifiques (guichet électronique, numéro d’appel téléphonique) peuvent être proposés pour simplifier la démarche de déclaration de pharmacovigilance pour les médicaments faisant l’objet d’un CPC."
    6_prefix: "4.18"
    6_label: "Spécificités des médicaments bénéficiant d’une AAP ou AAC"
    6_desc: "Le titulaire des droits d’exploitation déclare tout effet indésirable suspecté d’être dû à un médicament bénéficiant d’une AAP ou d’une AAC selon les modalités décrites au point 4.14."
    7_prefix: "4.19"
    7_label: "Spécificités des allergènes préparés spécialement pour un seul individu (APSI)"
    7_desc: "Tout effet indésirable suspecté d’être dû à un APSI est déclaré selon les modalités de l’article R.5121-174 du CSP, sauf si déjà déclaré par voie électronique à la base de données européenne « EudraVigilance »."
  4:
    prefix: ""
    title: "Gestion des signaux"
    1_prefix: "4.20"
    1_desc: "L’exploitant met en place au niveau national les mesures nécessaires à la détection et à la validation des signaux et coopère à l’évaluation d’un signal confirmé conformément aux dispositions du module IX des GVP."
    2_prefix: "4.21"
    2_desc: "L’exploitant et/ou le titulaire d’AMM notifie par voie électronique à l’ANSM (pharmacovigilance@ansm.sante.fr) et à l’EMA s’il s’agit d’un médicament autorisé dans plusieurs États de l’Union européenne (P-PV-emerging-safety-issue@ema.europa.eu), dès que possible et au plus tard dans les 3 jours ouvrables après validation, tout signal urgent de sécurité (« Emerging safety Issues ») pouvant entraîner une modification du rapport entre les bénéfices et les risques d’une spécialité et nécessitant une communication urgente auprès des patients et des professionnels de la santé, conformément au module IX des GVP et au chapitre 7 des BPPV."
  5:
    prefix: ""
    title: "Obligations de transmission des rapports périodiques actualisés de sécurité (PSUR, Dénomme également PBRER)"
    1_prefix: "4.22"
    1_desc: "Sauf dérogations prévues à l’article R. 5121-170 du CSP et détaillées dans le module VII des GVP, l’exploitant s’assure de la transmission du PSUR par voie électronique à l’EMA, par le biais du répertoire des rapports périodiques actualisés de sécurité (PSUR Repository) selon les modalités décrites à l’article R. 5121- 168 et au module VII des GVP."
    2_prefix: "4.23"
    2_desc: "Ces modalités de transmission s’appliquent quelle que soit la procédure d’évaluation à laquelle est soumis le PSUR (procédure européenne d’évaluation unique des PSUR par substance active (PSUSA) ou procédure d’évaluation purement nationale)."
    3_prefix: "4.24"
    3_desc: "Le format du PSUR soumis doit être conforme à l’annexe II du règlement d’exécution (UE) n°520/2012 précité et aux dispositions détaillées dans le module VII des GVP."
    4_prefix: "4.25"
    4_desc: "L’exploitant et/ou le titulaire d’AMM prend en compte dans le cadre du suivi de la sécurité d’emploi et de l’évaluation du rapport bénéfice/risque tout signalement d’erreur ou de risque d’erreur médicamenteuses. Les erreurs médicamenteuses avérées ayant entraîné ou non un effet indésirable sont évaluées dans le rapport périodique actualisé de sécurité."
    5_prefix: "4.26"
    5_label: "Spécificités des médicaments faisant l’objet d’un cadre de prescription compassionnelle (CPC)"
    5_desc: "Les modalités et la périodicité d’envoi à l’ANSM de rapports périodiques de synthèse sont mentionnés dans le protocole de suivi des patients et de recueil des données annexé au CPC."
    6_prefix: "4.27"
    6_label: "Spécificités des médicaments faisant l’objet d’une autorisation d’accès précoce (AAP) ou d’une autorisation d’accès compassionnel (AAC) et soumis à un PUT-RD"
    6_desc: "Pour les médicaments bénéficiant d’une AAP ou d’une AAC, le rapport périodique de synthèse lorsqu’il est requis est soumis selon les modalités et la fréquence fixées dans le PUT-RD du médicament concerné."
    7_prefix: "4.28"
    7_label: "Spécificités des APSI"
    7_desc: "Une synthèse des cas d’effets indésirables ainsi que toute information utile à l’évaluation du rapport entre les bénéfices et les risques de ces produits sont transmises à l’ANSM annuellement ou immédiatement sur demande du Directeur général de l’agence."
  6:
    prefix: ""
    title: "Système de gestion des risques"
    1_prefix: "4.29"
    1_desc: "L’exploitant s’assure de la transmission à l’ANSM, du PGR décrivant le système de gestion des risques mis en place pour le médicament concerné, selon la procédure d’enregistrement concernée, conformément aux modalités décrites au module V des GVP : \n\t - lors de la demande d’AMM ; \n\t - lors d’une demande de modification significative des termes de l’AMM conformément aux exigences du règlement (CE) n° 1234/2008 relatif aux modifications d’AMM et à ses lignes directrices ; \n\t - immédiatement sur demande de l’ANSM, d’une autorité compétente ou de l’EMA ; \n\t - lors de l'identification d'un nouveau risque important ou d'un changement de la balance bénéfice/risque ; \n\t - lors de la soumission d'un rapport final d'études avec conséquences significatives sur le PGR ; \n\t - lors de la soumission du PSUR dont le contenu impacte directement le plan de gestion des risques ; \n\t - le cas échéant, lors de la soumission d’une demande de renouvellement d'autorisation de mise sur le marché."
    2_prefix: "4.30"
    2_desc: "L’exploitant s’assure de la mise à jour du PGR selon le module V des GVP."
    3_prefix: "4.31"
    3_desc: "Le PGR est soumis selon le format décrit à l’annexe I du règlement d’exécution (UE) n°520/2012 précité et au module V des GVP. Quelle que soit la procédure par laquelle le médicament est autorisé, après validation du PGR par les autorités compétentes, l’exploitant soumet pour validation, le cas échéant, à l’ANSM les projets de mesures de réduction du risque qui doivent être mises en œuvre sur le territoire national, conformément aux modalités de soumission à l’ANSM des mesures de réduction des risques dans le cadre d’un PGR."
    4_prefix: "4.32"
    4_desc: "L’exploitant évalue l’efficacité des mesures de réduction de risque mises en place pour ses produits, pour les risques importants identifiés ou potentiels ou qui sont fixées comme condition de l’AMM, conformément aux modules V et XVI des GVP. Les résultats de cette évaluation sont à reporter dans les PSUR et le PGR afin de discuter de manière périodique l’efficacité ou les limites des mesures mises en place et proposer des alternatives ou des améliorations, le cas échéant."
  7:
    prefix: ""
    title: "Surveillance des études de sécurité post-autorisation"
    1_prefix: "4.33"
    1_desc: "Les études de sécurité post-autorisation sont menées conformément aux dispositions des articles R.5121-178 et suivants du CSP et du module VI des GVP ainsi qu’aux dispositions du module VIII des GVP en cas d’étude de sécurité post-autorisation."
  8:
    prefix: ""
    title: "Autres obligations de déclaration à l'ANSM"
    1_prefix: "4.34"
    1_desc: "L’exploitant et/ou le titulaire d’AMM transmet à l’ANSM : \n\ta. toute information de nature à modifier l’évaluation du rapport entre les bénéfices et les risques du médicament (cf. article R. 5121-37-1 du CSP), notamment les résultats tant positifs que négatifs des essais cliniques ou d’autres études, pour toutes les indications et populations, qu’elles figurent ou non dans l’autorisation de mise sur le marché ; \n\tb. toute utilisation non conforme à l’autorisation, non conforme au bon usage (cf. articles L. 5121- 14-3 et R. 5121-151 du CSP), selon les modalités décrites dans le guide de signalement par les entreprises d’une prescription ou utilisation non conforme de médicament, disponible sur le site Internet de l’Agence ; \n\tc. toute interdiction ou restriction d’utilisation imposée par les autorités compétentes de tout pays dans lequel le médicament est mis sur le marché ainsi que toute action engagée pour des raisons de pharmacovigilance pour suspendre la commercialisation, pour solliciter le retrait de cette autorisation ou ne pas en demander le renouvellement en précisant les motifs. \n Il propose les mesures destinées à garantir la sécurité d’emploi et le bon usage des médicaments concernés."
  9:
    prefix: ""
    title: "Information et communication des informations relatives à la pharmacovigilance"
    1_prefix: "4.35"
    1_desc: "Les modalités d’information et de communication sont définies au chapitre 7 « Bonnes pratiques de communication sur la sécurité d’emploi des médicaments » des présentes bonnes pratiques, notamment toute mesure de communication liée à l’une des actions mentionnées au paragraphe 4.31 du présent chapitre est transmise à l’ANSM pour validation."
  10:
    prefix: ""
    title: "Activités concédées en sous-traitance et activités réalisées pour le compte d'autre(s) titulaires d'AMM et/ou exploitants"
    1_prefix: "4.36"
    1_desc: "Lorsque l’exploitant concède tout ou partie des activités du système de pharmacovigilance dont il a la charge ou réalise, pour le compte d’autres titulaires d’AMM et/ou exploitants, tout ou partie de leurs activités de pharmacovigilance, le RPV doit être informé, dès que possible, de tout projet de convention en ce sens afin que le système de pharmacovigilance soit adapté en conséquence."
    2_prefix: "4.37"
    2_desc: "L’exploitant établit une liste des contrats en cours, pouvant impacter les activités de pharmacovigilance, en indiquant les médicaments et les territoires concernés."
    3_prefix: "4.38"
    3_desc: "Ces contrats sont élaborés conformément aux modalités décrites au module I des GVP."
    4_prefix: "4.39"
    4_label: "Activités concédées en sous-traitance par l’exploitant et/ou le titulaire d’AMM"
    4_desc: "Lorsque tout ou partie des activités de pharmacovigilance et/ou tout ou partie de la gestion des systèmes informatisés utilisés pour le traitement des données de pharmacovigilance est externalisé par l’exploitant et/ou le titulaire d’AMM, un contrat écrit doit être établi, conformément aux dispositions de l’article R. 5124-47 4° du CSP, entre le donneur d’ordre et le sous-traitant en vue de fixer clairement les rôles et obligations de chaque partie ainsi que les modalités d’échange des informations nécessaires pour mener à bien les activités de pharmacovigilance."
    5_prefix: "4.40"
    5_label: "Activités concédées en sous-traitance par l’exploitant et/ou le titulaire d’AMM"
    5_desc: "Dans ce cadre : \n\ta. le donneur d’ordre évalue la capacité du sous-traitant à effectuer les tâches demandées dans le cadre de la prestation conformément aux exigences de la réglementation en vigueur et des bonnes pratiques de pharmacovigilance. Les principes de cette évaluation sont décrits dans une procédure et les résultats enregistrés ; \n\tb. le sous-traitant doit mettre en place un système d’assurance et de contrôle de la qualité et accepter d’être audité par le donneur d’ordre. Il doit fournir des garanties au donneur dordre relatives à la sécurité, l’intégrité, la confidentialité et l’accessibilité des données de pharmacovigilance dont il assure le traitement (accessibilité pour le donneur d’ordre pendant la durée du contrat et restituer au donneur d'ordre l'intégralité des données de pharmacovigilance dont il assure le traitement) ou lorsqu'il héberge tout ou partie des systèmes informatisés utilisés pour le traitement de ces données en fin de contrat ; \n\tc. le sous-traitant ne peut sous-traiter à une tierce partie le travail qui lui est confié par le contrat sans que le donneur d’ordre n’ait effectué une évaluation préalable et donné son accord par écrit."
    6_prefix: "4.41"
    6_label: "Activités concédées en sous-traitance par l’exploitant et/ou le titulaire d’AMM"
    6_desc: "Ce contrat ne saurait avoir pour effet ou pour objet d’exonérer l’exploitant et/ou le titulaire d’AMM du médicament concerné de la responsabilité de l’exécution des obligations de pharmacovigilance qui lui incombent."
    7_prefix: "4.42"
    7_label: "Activités réalisées pour le compte d’autres exploitants et/ou titulaires d’AMM"
    7_desc: "Lorsque l’exploitant réalise tout ou partie des activités de pharmacovigilance pour le compte d’autres exploitants et/ou titulaires d’AMM, un contrat écrit doit indiquer clairement les rôles et obligations de chacune des parties au regard des dispositions législatives et réglementaires applicables."
    8_prefix: "4.43"
    8_label: "Activités réalisées pour le compte d’autres exploitants et/ou titulaires d’AMM"
    8_desc: "Chaque partie doit notamment s’assurer que toute information susceptible de remettre en cause l’évaluation du rapport entre les bénéfices et les risques du médicament faisant l’objet de l’accord lui est transmise."
  11:
    prefix: ""
    title: "Système de management de la qualité"
    1_prefix: "4.44"
    1_desc: "L’exploitant met en place et maintient un système qualité pour l’exécution des activités de pharmacovigilance, conformément aux exigences décrites à l’article 8 du règlement d’exécution (UE) n°520/2012 précité et au module I des GVP, afin d’assurer le bon fonctionnement et la maîtrise efficace de celles-ci. Tous les éléments, exigences et dispositions adoptés pour le système qualité doivent être documentés de manière structurée au travers notamment de la politique qualité, de manuel(s) qualité le cas échéant, de procédures écrites et d’enregistrements."
    2_prefix: "4.45"
    2_label: "Système documentaire"
    2_desc: "L’exploitant dispose de procédures décrivant l’organisation et les activités du système de pharmacovigilance mis en place sur le territoire national. Ces procédures sont conformes aux dispositions de l’article 11 du règlement d’exécution (UE) n°520/2012 précité et au module I des GVP."
    3_prefix: "4.46"
    3_label: "Contrôle de la qualité, gestion des déviations et suivi des actions correctives et préventives"
    3_desc: "L’exploitant et/ou le titulaire d’AMM met en place un processus de pilotage du système de pharmacovigilance et de son système qualité tel que défini dans le module I des GVP, utilisant notamment des indicateurs de résultats, conformément aux exigences de l’article 9 du règlement d’exécution (UE) n° 520/2012 précité. Les indicateurs et opérations de contrôle qualité mis en place pour vérifier la bonne exécution des activités de pharmacovigilance doivent être documentés et archivés et toute non-conformité ou déviation identifiée doit faire l’objet d’une gestion telle que décrite ci-après."
    4_prefix: "4.47"
    4_label: "Contrôle de la qualité, gestion des déviations et suivi des actions correctives et préventives"
    4_desc: "L’exploitant et/ou le titulaire d’AMM effectue la détection et l'enregistrement des déviations ainsi que la réalisation des actions correctives et préventives qui en résultent. Cette activité est supervisée et contrôlée par le RPV et est réalisée par les personnes en charge du système qualité applicable à l’exécution des activités de pharmacovigilance."
    5_prefix: "4.48"
    5_label: "Contrôle de la qualité, gestion des déviations et suivi des actions correctives et préventives"
    5_desc: "Les dispositions mentionnées ci-dessus s’appliquent également à tout organisme effectuant des activités de pharmacovigilance pour le compte de l’exploitant et/ou du titulaire d’AMM."
  12:
    prefix: ""
    title: "Audit"
    1_prefix: "4.49"
    1_desc: "L’exploitant effectue des audits selon les modalités prévues à l’article 13 du règlement d’exécution (UE) n° 520/2012 précité, au module IV des GVP et à l’article R.5121-162 du CSP. La formation, la qualification et/ou l’expérience adéquate des auditeurs sont conformes au module IV des GVP et font l’objet d’un enregistrement. Les auditeurs sont indépendants des activités auditées. \n\ta. l’exploitant établit et met à jour le programme d’audit des activités de pharmacovigilance dont il est responsable conformément aux dispositions du module IV des GVP. Le PR et le RPV s’assurent que ce programme répond bien à l’objectif défini au module IV des GVP ; \n\tb. chaque audit fait l’objet d’un rapport rédigé. Ce rapport, signé par les auditeurs est transmis au PR, au RPV et aux responsables des autres entités impliquées lors de l’audit. Les écarts constatés lors de l’audit sont classés en prenant en considération les seuils mentionnésdans le module IV des GVP ; \n\tc. en réponse au rapport d’audit, après sa diffusion auprès des personnes concernées, le RPV en accord avec l’entité en charge du système qualité définit un plan d’actions correctives et préventives ainsi que leur délai d’application. Le plan d’action est approuvé par le PR et est transmis aux auditeurs. Le PR et le RPV s’assurent du suivi et de la clôture du plan d’action. La preuve de la résolution des actions est enregistrée. Des audits de suivi sont effectués si besoin ; \n\td. lorsque des déviations majeures ou critiques concernant des activités de pharmacovigilance réalisées dans un pays autre que la France peuvent engendrer une déviation à la réglementation nationale, la partie d’intérêt du rapport d’audit correspondant doit être transmise au RPV et au PR ainsi que la documentation du suivi et de la clôture des actions correctives et préventives."
    2_prefix: "4.50"
    2_desc: "Les dispositions mentionnées ci-dessus s’appliquent aux audits des organismes effectuant des activités de pharmacovigilance ou des activités ayant des implications sur la gestion des données de pharmacovigilance pour le compte de l’exploitant et/ou du titulaire d’autorisation de mise sur le marché."
  13:
    prefix: ""
    title: "Archivage"
    1_prefix: "4.51"
    1_desc: "L’exploitant et le titulaire d’AMM sont tenus de conserver, chacun pour ce qui le concerne, toutes les données de pharmacovigilance pendant toute la durée de validité de l’AMM et pendant au moins 10 ans après l’expiration de celle-ci conformément aux exigences de l’article 12 du règlement d’exécution (UE) n°520/2012 précité."
    2_prefix: "4.52"
    2_desc: "Le système de gestion des documents mis en place et utilisé pour les activités de pharmacovigilance, la conservation des informations relatives à la pharmacovigilance et les mécanismes permettant la traçabilité et le suivi des rapports d’effets indésirables doivent être conformes aux dispositions de l’article 12(1) du règlement d’exécution (UE) n°520/2012 précité, du module I des GVP."
  14:
    prefix: ""
    title: "Confidentialité des données"
    1_prefix: "4.53"
    1_desc: "L’expoitant et le titulaire d’AMM garantissent le respect de la confidentialité des données à caractère personnel, notamment l’identité des patients et des déclarants, dont ils ont connaissance dans le cadre de la gestion des données de santé recueillies pour l’exercice de la pharmacovigilance. Il s’agit notamment de respecter les dispositions de la loi n°78-17 du 6 janvier 1978 modifiée relative à l’informatique, aux fichiers et aux libertés et du référentiel relatif aux traitements de données à caractère personnel mis en œuvre à des fins de gestion des vigilances sanitaires introduit par la délibération n°2019-057 du 9 mai 2019 de la CNIL."
  15:
    prefix: ""
    title: "Plan de continuité des activités"
    1_prefix: "4.54"
    1_desc: "L’exploitant et/ou le titulaire d’AMM prend les dispositions nécessaires pour assurer la continuité des activités critiques conformément aux exigences de l’article 10(4) du règlement d’exécution (UE) n°520/2012 précité au module I des GVP."
  16:
    prefix: ""
    title: "Maîtrise des systèmes informatisés"
    1_prefix: "4.55"
    1_desc: "L’exploitant et/ou le titulaire d’AMM mettent en place des dispositions permettant d’assurer la maîtrise des systèmes informatisés utilisés dans le cadre de l’exécution des activités de pharmacovigilance conformément aux dispositions du module I des GVP."
  17:
    prefix: ""
    title: "Sanctions financière"
    1_prefix: "4.56"
    1_desc: "La méconnaissance des obligations qui incombent aux titulaires d’AMM et/ou aux exploitants en matière de pharmacovigilance ainsi que la méconnaissance des présentes bonnes pratiques est passible de sanction financière prononcées selon les modalités décrites au point 1.33 des présentes bonnes pratiques."
5:
  prefix: "Chapitre 5"
  title: "Rôle des centres régionaux de pharmacovigilance (CRPV)"
  desc: "ℹ️ Principes: \n 5.1 Les centres régionaux de pharmacovigilance (CRPV) sont des structures opérationnelles du réseau national de pharmacovigilance, de pharmaco-épidémiologie et d'information sur le médicament. Ils effectuent leurs missions : \n\t - à l'échelon national et européen sous la coordination de l'ANSM ; \n\t - à l'échelon régional sur leur territoire d'intervention en tant que membres du Réseau Régional de Vigilance et d'Appui (RREVA) coordonné par leur agence régionale de santé (ARS) ; \n\t - au niveau local au sein des établissements de santé dans lesquels ils sont implantés et en lien avec ceux de leur territoire géographique d'intervention. Les CRPV assurent leurs missions selon les modalités et conditions prévues dans les conventions prévues à cet effet. \n\n 5.2 Pour assurer ces missions : \n\t - le responsable du CRPV désigne un suppléant afin d'assurer une continuité d'activité ; \n\t - le responsable du CRPV (ou son suppléant) coordonne et contrôle l'ensemble des activités de pharmacovigilance dévolues au CRPV ; \n\t - les CRPV appliquent les référentiels déterminés par l'ANSM relatifs à la pharmacovigilance."
  2:
    prefix: ""
    title: "Surveillance et investigation du risque médicamenteux - Recueil des déclarations d’effets indésirable et des informations relatives à la sécurité"
    1_prefix: "5.3"
    1_desc: "Les CRPV organisent et stimulent sur leur territoire d’intervention la déclaration des effets indésirables notamment à l’aide du portail de signalement des évènements sanitaires indésirables (https://signalement.social-sante.gouv.fr/) ainsi que la remontée de toute information sur les médicaments pouvant entrainer un risque potentiel ou avéré chez le patient."
    2_prefix: "5.4"
    2_desc: "Les CRPV recueillent, analysent et enregistrent dans la BNPV les informations et les déclarations relatives aux effets indésirables, graves ou non, listés ou non dans le RCP et dans la notice, survenant dans les conditions d’utilisation conforme ou non conforme aux termes de l’autorisation ou de l’enregistrement du ou des médicaments. \n\n Sont ainsi également concernées les situations résultant : \n\t - d’un surdosage ; \n\t - d’un mésusage ou d’un usage détourné ; \n\t - d’un abus d’une substance sans effets psychoactif ; \n\t - d’une erreur médicamenteuse ; \n\t - d’une exposition professionnelle ; \n\t - d’une interaction médicamenteuse ; \n\t - d’un défaut de qualité d’un médicament ou de médicaments falsifiés ; \n\t - d’une exposition en cours de grossesse (maternelle ou génération précédente ou via le sperme) ; \n\t - d’une exposition paternelle (altération potentielle des spermatozoïdes) ; \n\t - d’une exposition au cours de l’allaitement. \n\n Sont également concernées les autres situations suivantes : \n\t - toute erreur médicamenteuse sans effet indésirable, qu’elle soit avérée, potentielle ou latente, pour lequel le médicament est suspecté d’être responsable, pour tout ou partie ; \n\t - toute suspicion de transmission d’agents infectieux ; \n\t - toute suspicion d’inefficacité thérapeutique (partielle ou totale), en dehors des progressions naturelles de la maladie sous-jacente, en particulier avec les vaccins, les contraceptifs, les traitements de pathologies mettant en jeu le pronostic vital, les résistances inattendues à des traitements médicamenteux ou toute autre situation jugée cliniquement pertinente ;"
    3_prefix: "5.5"
    3_desc: "Ces informations sont communiquées au CRPV par : \n\t - les professionnels de santé, selon les modalités décrites au chapitre 2 « Rôle des professionnels de santé » des présentes bonnes pratiques ; \n\t - les établissements de santé, les correspondants locaux des autres vigilances et les structures de gestion des risques liés aux soins ; \n\t - les autres structures de santé publique et plus particulièrement les centres anti-poisons et de toxicovigilance (CAP-TV), les centres d’évaluation et d’information sur la pharmacodépendance et l’addictovigilance (CEIP-A), les centres de pharmacovigilance vétérinaire ; \n\t - les patients, leurs représentants, les associations de patients agréées, ainsi que tout autre usager du système de santé selon les modalités décrites au chapitre 3 « Rôle des patients en pharmacovigilance » des présentes bonnes pratiques. \n\t - Les Agences Régionales de Santé."
    4_prefix: "5.6"
    4_desc: "Les CRPV veillent à respecter la confidentialité des données mentionnées dans les déclarations qu’ils reçoivent, en occultant les mentions relevant des secrets légalement protégés."
    5_prefix: "5.7"
    5_desc: "Les CRPV adressent au déclarant un accusé de réception de sa déclaration qui peut, le cas échéant, comprendre une analyse clinique, biologique, pharmacologique et bibliographique et les suites qui ont été données par le CRPV à l’issue de l’instruction."
    6_prefix: "5.8"
    6_desc: "Les CRPV procèdent à la validation de toute déclaration en vérifiant la présence des quatre éléments indispensables à la validité de celle-ci, à savoir : \n\t - un déclarant identifiable ; \n\t - un patient identifiable ; \n\t - un ou plusieurs médicaments suspectés et identifiés par leur nom commercial ou leur DCI ; \n\t - la nature du ou des effets indésirables, ou des situations motivant la déclaration. \n\n La date à laquelle sont connus les quatre éléments constitue la date de notification qui sera enregistrée dans la BNPV."
    7_prefix: "5.9"
    7_desc: "Afin d’en réaliser l’analyse clinique, biologique et pharmacologique, ils mettent en œuvre les moyens nécessaires au recueil des informations indispensables pour rendre la déclaration la plus complète et la plus documentée possible, en se rapprochant notamment des différents professionnels de santé concernés. Ils valident les données fournies par rapport aux documents originaux accessibles."
    8_prefix: "5.10"
    8_desc: "Dans le cas particulier des informations transmises directement par un patient ou un usager, les CRPV incitent ce dernier à documenter médicalement les effets indésirables déclarés et le cas échéant les documentent auprès du professionnel de santé qui a été consulté par le patient et avec son accord."
    9_prefix: "5.11"
    9_desc: "S’il considère que les documents médicaux relatifs à l’effet indésirable et à sa survenue, dont il dispose, sont suffisants, tout professionnel de santé d’un CRPV peut confirmer médicalement la déclaration du patient."
    10_prefix: "5.12"
    10_desc: "Conformément à la loi n° 78-17 du 6 janvier 1978 relative à l'informatique, aux fichiers et aux libertés modifiée, le patient dispose d’un droit d’accès et de rectification auprès de l’ANSM ou du CRPV ou du professionnel de santé ayant fait la déclaration, lui permettant d’avoir connaissance de la totalité des informations saisies le concernant et de corriger d’éventuelles données inexactes, incomplètes, équivoques ou périmées."
    11_prefix: "5.13"
    11_desc: "La déclaration d’un patient ainsi que le dossier de pharmacovigilance du patient font partie de son dossier médical et sont traités dans le respect de la confidentialité des données et du secret médical et professionnel."
    12_prefix: "5.14"
    12_desc: "Une attention particulière est notamment portée sur les effets graves et/ou inattendus ainsi que sur les médicaments sous surveillance renforcée et/ou faisant l’objet d’une enquête nationale de pharmacovigilance."
    13_prefix: "5.15"
    13_desc: "Les déclarations de pharmacodépendance, d’addictovigilance et d’effets indésirables liés à un abus ou un usage détourné de médicament(s) à effet psychoactif doivent être portées à la connaissance du CEIP-A concerné par le CRPV. Réciproquement, les cas d’abus, d’usage détourné et de pharmacodépendance et d’effets indésirables liés à un abus de médicament(s) sans effet psychoactif rapportés à un CEIP-A sont portés à la connaissance du CRPV concerné."
  3:
    prefix: ""
    title: "Évaluation des informations et identification des signaux concernant le risque médicamenteux"
    1_prefix: "5.16"
    1_label: "Évaluation des déclarations d’effets indésirables et autres situations"
    1_desc: "Les CRPV analysent les déclarations qu’ils reçoivent sur le plan clinique, biologique et pharmacologique puis les évaluent au regard notamment de la sévérité, des critères de gravité, de la fréquence, du caractère inattendu de l’effet indésirable déclaré et de l’impact sur le rapport entre les bénéfices et les risques du médicament. Ils évaluent l’imputabilité de chaque médicament dans la survenue des effets indésirables suspectés selon la méthode française officielle."
    2_prefix: "5.17"
    2_label: "Évaluation des déclarations d’effets indésirables et autres situations"
    2_desc: "Les CRPV transmettent les déclarations valides à l’ANSM via la saisie informatique dans la BNPV selon les procédures en vigueur : \n\t - immédiatement en cas d’urgence ; \n\t - le jour même s’agissant d’effets indésirables susceptibles d’être dus à un médicament dérivé du sang ; \n\t - au plus tard dans les treize jours suivant la réception de la déclaration valide pour les cas graves ; \n\t - au plus tard dans les quatre-vingt-cinq jours suivant la réception de la déclaration valide pour les cas non graves. \n\n Ils alertent le directeur général de l’ANSM en cas d’effets indésirables graves ou de menace pour la santé publique, à travers la détection et la transmission à l’ANSM de signaux à partir de ces cas."
    3_prefix: "5.18"
    3_label: "Évaluation des déclarations d’effets indésirables et autres situations"
    3_desc: "Les CRPV mettent en œuvre les moyens nécessaires pour assurer la traçabilité de l’ensemble des cas qui leur ont été déclarés, y compris les déclarations non valides et non saisies dans la BNPV en précisant le motif."
    4_prefix: "5.19"
    4_label: "Évaluation des déclarations d’effets indésirables et autres situations"
    4_desc: "Selon les modalités définies avec l’ANSM, les CRPV identifient les cas marquants et les erreurs médicamenteuses marquantes à l’issue de l’analyse et de l’évaluation des déclarations reçues. Les CRPV documentent dans la mesure du possible l’évolution de l’effet indésirable et procèdent à l’actualisation des données de la BNPV notamment lorsque le patient n’est pas rétabli au moment de la déclaration initiale, en particulier lorsqu’il s’agit d’un effet indésirable grave."
    5_prefix: "5.20"
    5_label: "Évaluation des déclarations d’effets indésirables et autres situations"
    5_desc: "En cas de question relative à la reproduction, grossesse ou l’allaitement, ils assurent également un suivi des déclarations d’une prise de médicament lors de la reproduction, grossesse ou de l’allaitement afin d’en connaître l’issue et dans la mesure du possible, effectuent un suivi des enfants exposés au cours de l’allaitement ou un suivi à distance des enfants exposés in utero."
    6_prefix: "5.21"
    6_label: "Évaluation des déclarations d’effets indésirables et autres situations"
    6_desc: "Les CRPV peuvent associer les professionnels de santé, les patients, les associations de patients agréées, ayant déclaré un effet indésirable au suivi de cette déclaration."
    7_prefix: "5.22"
    7_label: "Évaluation des déclarations d’effets indésirables et autres situations"
    7_desc: "Les CRPV peuvent adresser à l’exploitant ou au titulaire d’AMM toute demande de renseignement ou d’information complémentaire concernant les effets indésirables suspectés d’être dus à un médicament qu’il commercialise et l’associer à la détection des doublons."
    8_prefix: "5.23"
    8_label: "Évaluation des déclarations d’effets indésirables et autres situations"
    8_desc: "Les cas sont enregistrés dans la BNPV dans le respect de la confidentialité des données selon les modalités prévues au paragraphe ci-après relatif à la confidentialité."
    9_prefix: "5.24"
    9_label: "Évaluation des déclarations d’effets indésirables et autres situations"
    9_desc: "Les situations d’erreurs médicamenteuses sans effet indésirable portées à la connaissance du CRPV doivent être documentées afin d’identifier une racine produit éventuelle (c’est-à-dire une responsabilité pour tout ou partie du médicament dans les causes potentielles de l’erreur)."
    10_prefix: "5.25"
    10_label: "Traitement des demandes de renseignements"
    10_desc: "Les CRPV assurent auprès des professionnels de santé et des usagers une mission de renseignement et d’information en pharmacovigilance en répondant aux questions d’ordre général ou individuel posées par les professionnels de santé ou les usagers sur les effets indésirables médicamenteux, sur la prescription et l’utilisation des médicaments, les interactions, les risques en cas d’exposition durant la grossesse ou l’allaitement. Ils adressent, si besoin, une réponse écrite aux professionnels de santé à la suite d’une demande de renseignement. \n Les CRPV identifient, à partir des demandes de renseignements, les éventuels signaux en termes d’utilisation du médicament et de risque médicamenteux."
    11_prefix: "5.26"
    11_label: "Traitement des demandes de renseignements"
    11_desc: "Les CRPV transmettent les informations les concernant aux autres structures de vigilances conformément aux dispositions du code de la santé publique et orientent le demandeur, notamment si la demande de renseignement ne relève pas de leur champ de compétence. \n\n Les CRPV assurent la traçabilité des demandes de renseignements et les enregistrent dans la BNPV dès qu’elles constituent un cas de PV, en indiquant qu’elles sont à l’origine de la déclaration."
    12_prefix: "5.27"
    12_label: "Archivage"
    12_desc: "Toutes les demandes de renseignements ainsi que les réponses formulées sont archivées dans un emplacement sécurisé et les CRPV en assurent la traçabilité."
    13_prefix: "5.28"
    13_label: "Archivage"
    13_desc: "Ils archivent tout élément relatif au recueil et à la documentation du cas signalé. Toute information, y compris celle transmise par oral, doit être consignée par écrit, datée et paraphée."
    14_prefix: "5.29"
    14_label: "Archivage"
    14_desc: "En l’absence de plan d’archivage spécifique prévu dans l’établissement de santé dans lequel est implanté le CRPV, l’ensemble de ces données est conservé et archivé selon les dispositions régissant le dossier médical prévues à l’article R. 1112-7 du CSP. \n\n En particulier, il s’agit de conserver ces documents pendant une durée d’au moins vingt ans après clôture du dossier d’instruction du cas et prorogé en cas de recours. \n La décision d'élimination est prise par le Directeur de l'établissement après avis du responsable du CRPV."
  4:
    prefix: ""
    title: "Appui en matière de pharmacovigilance, information et formation sur le risque médicamenteux"
    1_prefix: "5.30"
    1_desc: "Les CRPV coordonnent et animent des réseaux de professionnels de santé. \n\n Les CRPV contribuent à la diffusion des informations relevant de leur champ de compétence aux professionnels de santé en proposant un service de proximité accessible et des explications complémentaires adaptées, par tous moyens à leur disposition, ainsi qu’aux usagers du système de santé."
    2_prefix: "5.31"
    2_desc: "Les CRPV assurent auprès des professionnels de santé dans le cadre de la prise en charge du patient, une mission d’information et de conseil en délivrant un avis clinique et pharmacologique relatif : \n\t - au diagnostic et à la gestion d’une pathologie médicamenteuse ; \n\t - à la prise de décision thérapeutique devant une suspicion de pathologie médicamenteuse ; \n\t - à la prescription dans les populations ou situations à risque (par exemple grossesse,allaitement, pédiatrie, interactions, insuffisance rénale, déficits enzymatiques) ; \n\t - à l’évaluation du risque médicamenteux. \n\n Cette mission d’information et de conseil participe à l’évaluation individuelle du rapport entre les bénéfices et les risques du traitement du patient et peut aboutir à des propositions de conduite à tenir."
    3_prefix: "5.32"
    3_desc: "Les CRPV forment les différents professionnels de santé en participant à la formation initiale, spécialisée et continue, en matière de pharmacovigilance, de pharmaco-épidémiologie, de prévention du risque médicamenteux et de bon usage du médicament."
    4_prefix: "5.33"
    4_desc: "Les CRPV sensibilisent les usagers du système de santé à la pharmacovigilance et à la prévention des effets indésirables ainsi qu’au bon usage du médicament. \n\n Ces activités de formation auprès des personnels de santé de leur territoire d’intervention impliquent les médecins et pharmaciens du CRPV."
  5:
    prefix: ""
    title: "Expertise"
    1_prefix: "5.34"
    1_desc: "Les CRPV remplissent une mission d’expertise et de conseil en matière de pharmacovigilance, de pharmaco-épidémiologie, de prévention et de gestion du risque médicamenteux et de promotion du bon usage du médicament."
    2_prefix: "5.35"
    2_desc: "Ils participent aux missions locales et régionales entrant dans leur champ de compétence dans le cadre des RREVA, en particulier ils contribuent à l’analyse des effets indésirables médicamenteux observés dans le cadre de la déclaration d’évènement indésirable grave associé aux soins (EIGS)."
    3_prefix: "5.36"
    3_desc: "Au niveau national et européen, les CRPV remplissent auprès du Ministre chargé de la santé et du Directeur général de l’ANSM une mission d’expertise notamment en procédant à l’évaluation des informations relatives aux effets indésirables médicamenteux."
    4_prefix: "5.37"
    4_desc: "Ils conduisent et collaborent aux enquêtes, travaux et expertises en matière de pharmacovigilance nationale ou européenne (cf. chapitre 6 des présentes bonnes pratiques)."
    5_prefix: "5.38"
    5_desc: "Ils participent à la demande de l’agence nationale de sécurité du médicament et des produits de santé, de façon adaptée, à la gestion des éventuelles crises sanitaires ou médiatiques dans le domaine des vigilances."
  6:
    prefix: ""
    title: "Contribution au progrès scientifique"
    1_prefix: "5.39"
    1_desc: "Les CRPV contribuent au progrès scientifique en participant à l’amélioration des méthodes de travail en pharmacovigilance ainsi qu’à la connaissance et à la compréhension de la nature et des mécanismes des pathologies médicamenteuses ainsi que leur prévention."
    2_prefix: "5.40"
    2_desc: "Les CRPV publient des articles originaux ou didactiques portant sur la pharmacovigilance, la pharmacoépidémiologie, le risque médicamenteux, et le bon usage des médicaments."
  7:
    prefix: ""
    title: "Confidentialité"
    1_prefix: "5.41"
    1_desc: "Toute personne travaillant dans un CRPV (y compris temporairement) est tenue au respect du secret médical, ainsi qu’au respect du secret professionnel pour toute information dont elle pourrait être amenée à avoir connaissance dans le cadre de ses missions. Cela concerne en particulier les documents scientifiques, le contenu de la base nationale de pharmacovigilance et les informations échangées avec l’Agence, les échanges oraux ou écrits effectués lors des groupes de travail ou de toutes autres instances de l'Agence."
6:
  prefix: "Chapitre 6"
  title: "Enquête nationale de pharmacovigilance"
  desc: "ℹ️ OBJECTIF DE L’ENQUETE NATIONALE DE PHARMACOVIGILANCE \n Une enquête nationale de pharmacovigilance a pour objectif la revue des données disponibles de pharmacovigilance remontées par les CRPV et/ou par le(s) titulaire(s) d’AMM ou exploitant(s) et/ou issues de la bibliographie du ou des médicaments concernés et/ou toutes autres données de vigilance pertinente afin de : \n\t - confirmer un signal potentiel ; \n\t - caractériser un signal avéré ; \n\t - surveiller le profil de risque d’un médicament. L’enquête est réalisée par un ou plusieurs experts rapporteurs selon les besoins de l’enquête, assisté d’un expert relecteur, membres de CRPV, sur demande de l’ANSM. La conduite de l’enquête doit répondre aux objectifs fixés et permettre l’évaluation continue des données de sécurité selon les recommandations émises par l’Agence. L’identification de signaux et leur niveau de risque dans le cadre d’une enquête est transmise à l’ANSM dans les meilleurs délais. \n\nℹ️ CHAMP D’APPLICATION \n Une enquête nationale peut concerner tout médicament entrant dans le champ d’exercice de la pharmacovigilance, quelle que soit la procédure par laquelle il a été autorisé. Toute procédure d’enquête nationale inclut le médicament de référence et sa ou ses spécialités génériques ou biosimilaires ou hybrides autorisées, sauf cas particulier."
  1:
    prefix: ""
    title: "Ouverture de l'enquête nationale de pharmacovigilance"
    1_prefix: "6.1"
    1_desc: "L’ouverture de l’enquête nationale est décidée par le Directeur général de l’ANSM. Elle peut s’inscrire dans le cadre plus large d’une évaluation européenne."
    2_prefix: "6.2"
    2_desc: "Il désigne, dans le respect des règles générales de déontologie et de gestion des conflits d’intérêt et selon le domaine d’expertise nécessaire, un expert rapporteur et un expert relecteur. \n Selon les besoins de l’enquête, plusieurs experts rapporteurs et/ou plusieurs experts relecteurs peuvent être désignés. Le cas échéant, il peut être fait appel à des experts ponctuels dont l’avis complémentaire est requis en raison de leur domaine d’expertise et auxquels les règles générales de déontologie et de gestion des conflits d’intérêt s’appliquent également."
    3_prefix: "6.3"
    3_desc: "L’ANSM notifie aux experts rapporteurs et relecteurs désignés leur nomination et, en concertation avec eux, formalise, lors d’une réunion préparatoire, le périmètre de l’enquête, son objectif, la méthodologie et le planning prévisionnel."
    4_prefix: "6.4"
    4_desc: "Un courrier d’ouverture de l’enquête est également adressé par l’ANSM au(x) titulaire(s) d’AMM ou exploitant(s) du ou des médicaments objet(s) de l’enquête. Ce courrier précisera notamment les modalités du déroulement de l’enquête, son périmètre, ses objectifs ainsi que, le cas échéant, la liste des données devant être fournies, les délais impartis et les modalités d’envoi."
    5_prefix: "6.5"
    5_desc: "Ces modalités pourront être ajustées durant l’enquête. Un courrier précisant ces nouvelles modalités est alors adressé par l’ANSM à l’expert rapporteur et au(x) titulaire(s) d’AMM ou exploitant(s)."
  2:
    prefix: ""
    title: "Collecte de données"
    1_prefix: "6.6"
    1_desc: "L’expert rapporteur collecte les données selon les modalités et procédures préalablement définies avec l’ANSM lors de la réunion préparatoire : \n\t - données transmises par l’ANSM (rapports d’évaluation européens, données issues de la ou des requêtes effectuées dans la BNPV et/ou d’autres bases de données…) ; \n\t - transmises par le(s) titulaire(s) d’AMM ou exploitant(s) du ou des médicaments selon les modalités préalablement précisées ; \n\t - données collectées par l’expert lui-même (recherche bibliographique…). \n L’ANSM lui communique, dans les plus brefs délais, toute information utile au bon déroulement de l’enquête."
    2_prefix: "6.7"
    2_desc: "L’expert rapporteur peut demander, au cours de l’enquête, par écrit, au(x) titulaire(s) d’AMM ou exploitant(s) du ou des médicament(s), toute information complémentaire nécessaire à l’enquête nationale."
    3_prefix: "6.8"
    3_desc: "Le cas échéant, une réunion/visioconférence peut être organisée entre l’expert rapporteur, le(s) titulaire(s) d’AMM ou exploitant(s) concerné(s) et l’ANSM."
  3:
    prefix: ""
    title: "Gestion et évaluation des données confirmées"
    1_prefix: "6.9"
    1_desc: "L’expert rapporteur rassemble, valide et analyse toutes ces données. Il rédige un rapport présentant les résultats de l’enquête dans un format conforme aux principes méthodologiques préétablis par l’ANSM lors de la réunion préparatoire. Ce rapport est ensuite transmis à l’ANSM selon le calendrier prévisionnel défini lors de la réunion préparatoire, ou le cas échéant, dans un délai défini à la demande de l’ANSM, notamment en cas d’élément(s) nouveau(x) de sécurité."
    2_prefix: "6.10"
    2_desc: "L’expert relecteur apporte son soutien à l’expert rapporteur tout au long de l’enquête et effectue une relecture critique du rapport d’enquête avant sa transmission à l’ANSM. Il s’assure la cohérence et de la pertinence des conclusions émises sur la base des données présentées. Il peut être sollicité à tout moment afin de rendre un avis sur la conduite de l’enquête, les résultats et le rapport."
    3_prefix: "6.11"
    3_desc: "A la demande de l’ANSM, les conclusions de l’enquête peuvent être présentées le cas échéant, pour avis ou pour information, devant l’une de ses instances consultatives."
    4_prefix: "6.12"
    4_desc: "Dans le cas où l’enquête nationale concerne un médicament autorisé au terme d’une procédure européenne d’AMM, l’expert rapporteur de l’enquête nationale peut être sollicité par l’ANSM pour participer à l’évaluation des données européennes de pharmacovigilance."
  4:
    prefix: ""
    title: "Cloture de l’enquête"
    1_prefix: "6.13"
    1_desc: "Le Directeur général de l’ANSM, au regard des conclusions de l’enquête et/ou de l’avis émis par l’une des instances consultatives de l’ANSM, peut décider : \n\t - la poursuite de l’enquête avec, le cas échéant des compléments d’enquête ; \n\t - la clôture de l’enquête. \n\n Il prend, si nécessaire, les mesures appropriées visant à prévenir, réduire ou supprimer le(s) risque(s) telles que décrites aux points 1.23 et suivants des présentes bonnes pratiques."
    2_prefix: "6.14"
    2_desc: "La clôture ou toute modification de l’enquête nationale est notifiée par l’ANSM aux experts rapporteur(s), relecteur(s) et au(x) titulaire(s) d’AMM ou exploitant(s) par un courrier."
  5:
    prefix: ""
    title: "Communication des résultats d’une enquête nationale de pharmacovigilance"
    1_prefix: "6.15"
    1_desc: "Les publications, les communications, les thèses et les résultats issus de travaux de recherche ou les études réalisés par le CRPV qui utilisent des données issues de la base nationale de pharmacovigilance doivent être transmises, pour information, à l’ANSM avant leur publication."
7:
  prefix: "Chapitre 7"
  title: "Bonnes pratiques de communication sur la sécurité d’emploi des médicaments"
  desc: "La communication est un outil de gestion des risques essentiel pour atteindre les objectifs de la pharmacovigilance en termes de promotion du bon usage des médicaments et de prévention des risques. Elle peut s’adresser aux professionnels de santé, aux patients et aux usagers du système de santé en général. \n\n Le présent chapitre porte uniquement sur la communication d’informations de sécurité susceptibles de modifier le rapport bénéfices/risques d’un médicament et/ou ses conditions d’utilisation. \n\n Il ne concerne donc ni la publication des documents de référence relatifs aux produits (AMM, rapport public d'évaluation, etc.), ni la diffusion des rapports et comptes rendus des instances de l’ANSM publiés dans un objectif de transparence de ses activités. \n\n ℹ️ Principes: \n 7.1 La communication sur la sécurité d'emploi de médicaments suit les principes énoncés dans le module XV des GVP, en particulier la communication : \n\t - est claire et adaptée aux destinataires afin de répondre à leurs attentes ; \n\t - est présentée de manière objective et non trompeuse ; \n\t - présente toujours le risque en perspective du bénéfice attendu ; \n\t - fait état des éventuelles incertitudes ; \n\t - est précédée si possible de la consultation des patients et des professionnels de santé, particulièrement lorsque la situation est complexe ; \n\t - est cohérente et coordonnée entre les différents acteurs concernés ; \n\t - tient compte des exigences réglementaires en matière de protection des données individuelles et de confidentialité ; \n\t - est suivie, si possible et au regard du risque identifié, d'une évaluation de son impact ; \n\t - ne doit présenter aucun caractère promotionnel. \n\n 7.2 Une communication est envisagée dans les situations suivantes : \n\t - à l'occasion d'une décision de police sanitaire en lien avec les activités de pharmacovigilance (suspension, retrait ou non renouvellement de l'AMM) ; \n\t - à l'occasion d'une modification de l'AMM qui nécessite une information spécifique des professionnels de santé et des usagers du système de santé (par exemple : nouvelle contre- indication ou mise en garde, modification des indications thérapeutiques ou de la posologie, …) \n\t - lorsqu'il est nécessaire de modifier ou de rappeler les conditions de bon usage du médicament (risques de mésusage, d'erreur médicamenteuse) ou en cas de nouvelles recommandations pour la prise en charge ou la prévention d'un effet indésirable (réduction d'un risque). \n\n 7.3 Une communication peut également être envisagée : \n\t - dans certains cas, lorsqu'une autorité compétente européenne ou un pays tiers communique sur le risque d'un médicament autorisé en France ; \n\t - lorsqu'un risque potentiel est en cours d'évaluation et qu'il est nécessaire de poursuivre la surveillance et/ou de communiquer des informations sur la gestion de ce risque ; \n\t - lorsqu'un risque potentiel ou avéré fait l'objet d'un fort intérêt médiatique et nécessite une clarification."
  2:
    prefix: ""
    title: "Planification de la communication"
    1_prefix: ""
    1_desc: "Toute action de communication respecte le plan de communication défini en amont qui précise les objectifs, le contenu et les cibles tels que définis dans le module XV des GVP, ainsi que les outils, les acteurs, le calendrier et les éventuelles mesures d’impact de la communication."
  3:
    prefix: ""
    title: "Acteurs"
    1_prefix: "7.4"
    1_label: "ANSM"
    1_desc: "Au niveau national, l’ANSM coordonne la communication en matière de pharmacovigilance. Elle définit le plan de communication, si nécessaire avec le ou les titulaires et/ou exploitants concernés, qu’elle informe dans tous les cas, et élabore et/ou valide le contenu de l’information délivrée."
    2_prefix: "7.5"
    2_label: "ANSM"
    2_desc: "L’ANSM peut s’appuyer sur le réseau des CRPV, d’autres réseaux de vigilance, ses comités d’interface avec les professionnels de santé, les associations des patients et d’usagers et les industriels, à toutes les étapes : définition du plan de communication, élaboration des contenus, choix des outils, diffusion de l’information et mesure d’impact."
    3_prefix: "7.6"
    3_label: "ANSM"
    3_desc: "Exception faite des cas où la protection de la santé publique requiert une communication publique urgente, l’ANSM informe l’EMA avant la diffusion au grand public d’un avis portant sur des informations de pharmacovigilance, qui relaye alors le cas échéant à la Commission européenne et aux États membres."
    4_prefix: "7.7"
    4_label: "ANSM"
    4_desc: "L’ANSM coopère avec l’EMA, la Commission européenne et les autres États membres pour l’élaboration et la diffusion d’un message commun relatif à la sécurité d’emploi des médicaments autorisés dans plusieurs États membres dans le cadre des instances européennes."
    5_prefix: "7.8"
    5_label: "Titulaire d’AMM ou exploitant"
    5_desc: "Le titulaire d’AMM ou l’exploitant informe la ou les autorités nationales compétentes de son intention de diffuser une information de pharmacovigilance, ainsi que l’EMA et la Commission européenne s’il s’agit d’un médicament autorisé dans plusieurs États."
    6_prefix: "7.9"
    6_label: "Titulaire d’AMM ou exploitant"
    6_desc: "Lorsqu’il souhaite diffuser une information de pharmacovigilance, le titulaire d’AMM ou l’exploitant transmet à l’ANSM au préalable ses projets de communication. L’ANSM se réserve le droit de faire modifier le contenu et ou le calendrier."
    7_prefix: "7.10"
    7_label: "Titulaire d’AMM ou exploitant"
    7_desc: "Lorsqu’il communique à la demande des autorités compétentes, le titulaire et/ou l’exploitant respecte le plan de communication et les messages demandés par celles-ci."
    8_prefix: "7.11"
    8_label: "Titulaire d’AMM ou exploitant"
    8_desc: "Dans le cas d’une diffusion d’une lettre aux professionnels de santé (DHPC pour Direct Health Care Professional Communication comme prévu au module XV des GVP) : \n\t - il respecte le modèle de DHPC en vigueur disponible sur le site internet de l’ANSM ; \n\t - lorsque la communication est décidée au niveau national, il soumet le projet de courrier à l’ANSM pour validation ; \n\t - lorsque le projet de DHPC est élaboré au niveau européen, il, respecte également le modèle de DHPC défini dans le module XV des GVP et il soumet le projet de traduction à l’ANSM pour validation avant envoi ; \n\t - il respecte les modalités de diffusion définies au niveau national ainsi que les règles de portage financier par les industriels décrites dans la convention entre l’ANSM et les organisations professionnelles de l’industrie (LEEM/GEMME/NERES)."
  4:
    prefix: ""
    title: "Outils et canaux de diffusion"
    1_prefix: "7.12"
    1_label: "Les outils et canaux de diffusion sont multiples et choisis en fonction du degré d’urgence, de l’objectif et de la ou des cibles à atteindre."
    2_prefix: "7.13"
    2_desc: "Les outils de communication comprennent notamment : \n\t - une information publiée par l’ANSM : elle est rédigée par l’ANSM et prend la forme d’un article, mis en ligne sur son site Internet et diffusé par mail à l’ensemble des abonnés à la veille du site. Il peut être relayé aux organisations représentatives de professionnels de santé (ordres, syndicats, sociétés savantes), aux associations de patients concernées, à la presse spécialisée et/ou grand public, permettant ainsi une diffusion large et immédiate au public ; \n\t - des documents d’information destinés aux patients et/ou aux professionnels de santé (brochures d’information patients, plaquettes, documents de réduction de risque …) ; \n\t - une information adressée directement aux professionnels de santé (courrier ou e-mailing) concernés. Elle peut être diffusée par : \n\t - le ou les titulaires d’AMM ou le ou les exploitants ; \n\t - l’ANSM, de façon exceptionnelle, lorsque l’importance ou l’urgence de l’information le nécessite. \n\t - des rencontres avec la presse peuvent être organisées dans l’objectif d’expliquer et ou clarifier avec pédagogie l’action ainsi que les décisions de l’ANSM notamment sur des dossiers particuliers ; \n\t - d’autres mesures d’information peuvent être mises en place dans le cadre de la réduction des risques, lorsqu’un besoin ou une opportunité nouvelle a été identifié par les autorités compétentes, selon les modalités prévues au module XVI des GVP."
    3_prefix: "7.14"
    3_label: "Les canaux de diffusion"
    3_desc: "Les canaux de diffusion suivants peuvent être envisagés : site Internet, télécopie, courrier électronique, courrier postal, réseaux sociaux, médias (télévision, radio, Internet etpresse généraliste ou spécialisée), alertes diffusées par les autorités sanitaires en situation de crise (mailing aux professionnels de santé, dossier pharmaceutique, DGS-urgent), numéro vert (ligne téléphonique dédiée), autres."
    4_prefix: "7.15"
    4_label: "Les canaux de diffusion"
    4_desc: "En complément, des relais d’information peuvent participer à la diffusion d’information : le réseau des CRPV, d’autres réseaux de vigilance, réseaux de soins, partenaires institutionnels, organisations représentatives de professionnels de santé, associations de patients et d’usagers du système de santé (voir chapitres dédiés), etc..."
  5:
    prefix: ""
    title: "Calendrier"
    1_prefix: "7.16"
    1_desc: "Un calendrier définit au préalable les différentes étapes de la communication et la durée allouée à chaque étape. Il est adopté et respecté par tous les acteurs concernés, en particulier lorsque cette communication est sous embargo."
    2_prefix: "7.17"
    2_desc: "Lorsque le sujet reste en débat ou lorsque des informations complémentaires sont attendues, des points réguliers d’étape peuvent être diffusés."
    3_prefix: "7.18"
    3_desc: "Les représentants des professionnels de santé et des associations de patients concernés sont informés si possible avant le grand public pour leur permettre d’anticiper, de relayer l’information et de répondre au mieux aux interrogations de leurs adhérents."
  6:
    prefix: ""
    title: "Suivi et mesure d'impact"
    1_prefix: "7.19"
    1_desc: "Toute communication pourra être amenée à être évaluée afin de mesurer la réception du message par la ou les cibles définies dans le plan de communication, la compréhension/l’assimilation du message, voir l’impact sur les comportements et les pratiques des usagers et des professionnels de santé. \n Les principes sont décrits dans les modules XV et XVI des GVP."
    2_prefix: "7.20"
    2_desc: "Du résultat peut découler une modification du plan de communication, notamment pour ouvrir vers une autre cible, ou une répétition du message tant que les objectifs n’ont pas été atteints."
