1:
  title: "Gouvernance"
  1:
    title: "L'entité recense ses systèmes d'informations"
    prefix: "1.1 Objectif de sécurité 1"
    desc: "Description de l'objectif de sécurité : \n\n Le recensement des systèmes d’information réglementés consiste, pour l’entité, en : \n\t- La réalisation d’une cartographie des activités et des services de l’entité et des systèmes les supportant ; \n\t- L'exclusion, si l’entité le décide, des systèmes d’information qui ne sont porteurs d’aucun risque impactant les activités ou les services fournis par l’entité. \nLes systèmes d’information qui ne sont pas exclus sont désignés dans la suite du document « systèmes d’information réglementés » (ou SIR). \n\nℹ️ Justification et risques associés : \n\n La directive NIS 2, s’agissant des mesures de sécurité obligatoires, vise l’ensemble des systèmes d’information de l’entité utilisés dans le cadre de ses activités et services. Pourtant si un incident de sécurité affecte certains de ces systèmes d’information, cela ne remettrait pas nécessairement en cause les activités ou les services de l’entité (par exemple : le site du comité d’entreprise ou le site d’actualité interne de l’entité). L’atteinte de cet objectif permettra aux entités importantes ou essentielles de concentrer leurs efforts sur les systèmes d’information pour lesquels un incident de sécurité pourrait entraîner : \n \t- La dégradation ou l’interruption des activités ou services de l’entité ; \n\t- La divulgation à des personnes non autorisées d’informations sensibles traitées par les activités ou services de l’entité ; \n\t- L’altération des informations nécessaires aux activités ou services de l’entité."
    1_prefix: "1.1.(a)"
    1_desc: "L’entité liste l’ensemble de ses activités et services, y compris les activités et services qui ne correspondent pas aux critères pour lesquels l’entité est devenue une entité importante ou essentielle (par exemple : une entité devenue entité essentielle car elle exploite un oléoduc liste, en plus des activités et services participant à l’exploitation de l’oléoduc, toutes les autres activités et services qu’elle fournit). \n Pour chaque entrée de cette liste, l’entité : \n\t - identifie un responsable de l’activité ou du service ; \n\t - liste les systèmes d’information les supportant."
    2_prefix: "1.1.(b)"
    2_desc: "L’entité peut, au cas par cas et en le justifiant, exclure des systèmes d’information, parmi ceux listés en (a), pour lesquels il n’existe aucun besoin en disponibilité, en intégrité, en confidentialité ou en authenticité dont la non-satisfaction serait susceptible d’entraîner au moins un des risques suivants : \n\t - La dégradation ou l’interruption des activités ou services de l’entité ; \n\t - La divulgation à des personnes non autorisées d’informations sensibles traitées par les activités ou services de l’entité ; \n\t - L’altération des informations nécessaires aux activités ou services de l’entité."
    3_prefix: "1.1.(c)"
    3_desc: "Les systèmes d’information exclus conformément au (c) sont distingués des autres systèmes d’information dans la liste prévue au (a). \n La justification de l’exclusion doit figurer dans cette liste."
    4_prefix: "1.1.(d)"
    4_desc: "L’entité valide et réexamine annuellement, ou en tant que de besoin notamment en cas de mise en service d’un nouveau système d’information, la pertinence des exclusions prévues en (c)."
  2:
    title: "L'entité dispose d'un cadre de gouvernance de la sécurité numérique"
    prefix: "1.2 Objectif de sécurité 2"
    desc: "Description de l'objectif de sécurité : \n\n Placé sous la responsabilité du dirigeant exécutif de l’entité, le cadre de gouvernance de la sécurité numérique consiste en la mise en place, au sein de l’entité : \n\n\t - D’une organisation claire en termes de rôles et de responsabilités ; \n\t - D’une politique de sécurité des systèmes d’information et des politiques : \n\t\t - D’usage du chiffrement, \n\t\t - De contrôle d’accès physique et logique, \n\t\t - De revue de l’application des mesures de sécurité mises en œuvre, \n\t\t - De maintien en condition de sécurité prévues par l’article 21.2 de NIS 2 ; \n\t - De processus de gestion de la conformité. \n L’entité communique à l’Agence nationale de la sécurité des systèmes d’information les coordonnées du point de contact, au sein de l’entité, pour les sujets relatifs à la sécurité numérique ainsi que la mise à jour de ces coordonnées. \n\nℹ️ Justification et risques associés : \n\n Ce cadre de gouvernance de la sécurité numérique permet l’allocation de ressources financières, techniques et humaines, adaptées aux besoins de l’entité en matière de sécurité numérique au regard de la menace à laquelle elle est exposée. \ L’atteinte de cet objectif permet à l’entité de piloter efficacement la sécurité numérique dans toutes ses dimensions, au bon niveau et dans la durée, en responsabilisant les rôles de décision et en mobilisant l’ensemble des parties prenantes concernées, afin de réduire l’exposition de l’entité à la menace d’origine cyber et pouvant affecter la réalisation de ses activités ou la fourniture de ses services. \n\nℹ️ \n\n La mise en place d’un système de management de la sécurité de l’information (SMSI) conforme aux exigences prévues dans la norme ISO/CEI 27001:2022 et dont le domaine d’application couvre au minimum les systèmes d’information réglementés permet d’apporter une présomption de conformité à cet objectif. "
    1_prefix: "1.2 Rôles et responsabilités (a)"
    1_desc: "Le dirigeant exécutif de l’entité est responsable de la sécurité numérique au sein de son entité et en particulier du suivi de la conformité des systèmes d’information réglementés aux présentes mesures."
    2_prefix: "1.2 Rôles et responsabilités (b)"
    2_desc: "Il désigne au moins une personne qui le conseille et l’accompagne dans l’exercice de cette responsabilité. Cette personne est le point de contact privilégié de l’Agence nationale de la sécurité des systèmes d’information pour tous les sujets relatifs à la sécurité numérique."
    3_prefix: "1.2 Rôles et responsabilités (c)"
    3_desc: "L’entité définit et met en œuvre une organisation adaptée pour assurer sa sécurité numérique (par exemple : la désignation d’un responsable de la sécurité numérique)."
    4_prefix: "1.2 Politique et sécurité des systèmes d'information (a)"
    4_desc: "L’entité définit et met en œuvre une politique de sécurité des systèmes d’information (PSSI)."
    5_prefix: "1.2 Politique et sécurité des systèmes d'information (b)"
    5_desc: "Cette PSSI comprend : \n\t - L’organisation de la gouvernance de la sécurité numérique et notamment les rôles et les responsabilités du personnel interne et externe (par exemple : prestataires, fournisseurs) ; \n\t - Les orientations et objectifs stratégiques en matière de sécurité numérique déclinés de la stratégie globale de l’entité ; \n\t - L’engagement du dirigeant exécutif de l’entité à assurer la sécurité numérique des systèmes d’information réglementés dont il est responsable ; \n\t - L’engagement du dirigeant exécutif de l’entité à assurer la conformité aux exigences légales et réglementaires et en particulier celles définies dans la transposition nationale de la directive NIS 2."
    6_prefix: "1.2 Politique et sécurité des systèmes d'information (c)"
    6_desc: "Le dirigeant exécutif de l’entité approuve la PSSI."
    7_prefix: "1.2 Politique et sécurité des systèmes d'information (d)"
    7_desc: "La PSSI est revue annuellement et mise à jour lorsque nécessaire, notamment en cas d’évolutions majeures du contexte métier, technique ou organisationnel intervenues après son approbation."
    8_prefix: "1.2 Politique et sécurité des systèmes d'information (e)"
    8_desc: "L’entité décline, en tant que de besoin, la PSSI en politiques de sécurité relatives à des thèmes précis et permettant de couvrir tout ou partie des présentes mesures."
    9_prefix: "1.2 Politique et sécurité des systèmes d'information (f)"
    9_desc: "En particulier, et conformément à la directive NIS 2, l’entité définit et met en œuvre des politiques de sécurité en matière : \n\t - D’usage du chiffrement ; \n\t - De contrôle d’accès physique et logique ; \n\t - De revue de l’application des mesures de sécurité mises en œuvre ; \n\t - De maintien en condition de sécurité."
    10_prefix: "1.2 Gestion de la conformité (a)"
    10_desc: "Pour chaque système d’information réglementé, l’entité réalise et maintient à jour une analyse de la conformité du système d’information réglementé vis-à-vis des présentes mesures. \n L’analyse de la conformité identifie les écarts entre les mesures mises en œuvre par l’entité, les présentes mesures et les objectifs fixés par la réglementation."
    11_prefix: "1.2 Gestion de la conformité (b)"
    11_desc: "L’entité établit, met en œuvre et suit dans la durée un plan d’action pour corriger ces écarts et atteindre les objectifs fixés par la réglementation. \n Ce plan d’action prévoit, au minimum, une échéance et un responsable pour la réalisation de chaque action."
    12_prefix: "1.2 Gestion de la conformité (c)"
    12_desc: "En cas de recours à une ou plusieurs alternatives prévues dans les présentes mesures, l’entité les renseigne dans l’analyse de la conformité avec les justifications associées."
    13_prefix: "1.2 Gestion de la conformité (d)"
    13_desc: "L’entité est capable de démontrer à tout moment l’atteinte des objectifs fixés par la réglementation, notamment en cas de contrôle. \n L’atteinte des objectifs fixés par la réglementation est présumée lorsque l’entité respecte les présentes mesures. Dans le cas contraire, elle est en capacité de fournir les éléments nécessaires pour démontrer l’atteinte des objectifs fixés par la réglementation."
  3:
    title: "L'entité essentielle met en oeuvre une approche par les risques"
    prefix: "1.3 Objectif de sécurité 3."
    desc: "Description de l'objectif de sécurité : \n\n l’approche par les risques est placée sous la responsabilité du dirigeant exécutif de l’entité et permet à ce dernier : \n\t - De prendre connaissance et de suivre dans le temps : \n\t\t - Les risques numériques pesant sur ses systèmes d’information réglementés, \n\t\t - Les mesures de sécurité mises en œuvre ou planifiées pour maîtriser ces risques ; \n\t - D’accepter les risques résiduels. \n\nℹ️ Justification et risques associés : \n\n L’atteinte de cet objectif permet à une entité essentielle de maîtriser les risques numériques pesant sur ces systèmes d’information réglementés en tenant compte des contextes organisationnel et technique spécifiques à son entité. À défaut, l’entité essentielle ne peut pas s’adapter aux risques numériques liés à ses contextes organisationnel (par exemple : le nomadisme ou le télétravail) ou technique (par exemple : le recours à l’informatique en nuage). \n\nℹ️ \n\n La mise en place d’un système de management de la sécurité des systèmes d’information (SMSI) conforme aux exigences prévues dans la norme ISO/CEI 27001:2022 et dont le domaine d’application couvre au minimum les systèmes d’information réglementés permet d’apporter une présomption de conformité à cet objectif. \n Le recours à un prestataire d’accompagnement et de conseil en sécurité (PACS), qualifié par l’Agence nationale de sécurité des systèmes d’information en application de l'article 10 du décret n° 2015-350 du 27 mars 2015 modifié , pour la réalisation de l’analyse de risques dont le périmètre de la prestation couvre au minimum les systèmes d’information réglementés et le suivi par l’entité du plan d’amélioration continue de la sécurité issue de la prestation permettent d’apporter une présomption de conformité à cet objectif."
    1_prefix: "1.3.(a)"
    1_desc: "L’entité définit, met en œuvre et maintient à jour une gouvernance par les risques. \n Cette gouvernance vise à s’assurer que le risque numérique est pris en compte par le dirigeant exécutif de l’entité et les responsables d’activité ou de service de l’entité et que les moyens financiers, humains ou techniques adéquats sont alloués pour maîtriser ce risque. \n Cette gouvernance intègre les éléments issus de l’approche par la conformité (cf. Objectif de sécurité 2) et la complète par une approche par les risques, réalisée dans les conditions définies ci-après. Ces approches sont complémentaires et peuvent être mutualisées, notamment en termes de livrables attendus."
    2_prefix: "1.3.(b)"
    2_desc: "L’entité s’assure que chaque système d’information réglementé fait l’objet d’une analyse de risques. \n Cette exigence peut être satisfaite via la réalisation et le maintien à jour d’une analyse de risques \n pour chaque activité ou service qu’elle fournit, couvrant l’ensemble des systèmes d’information réglementés supportant cette activité ou ce service. \n Cette analyse de risques s’appuie sur les éléments issus : \n\t - De la PSSI (cf. Objectif de sécurité 2) ; \n\t - De la maîtrise de l’écosystème (cf. Objectif de sécurité 4) ; \n\t - De la maîtrise du système d’information réglementé (cf. Objectif de sécurité 7) ; \n\t - De l’approche par conformité (cf. section Objectif de sécurité 3) ; \n\t - Des audits (cf. Objectif de sécurité 5)."
    3_prefix: "1.3.(c)"
    3_desc: "L’entité valide l’analyse de risques, accepte les risques résiduels et met en œuvre le plan d’action pour maîtriser ces risques. \n Le plan d’action prévoit, au minimum, une échéance et un responsable pour la réalisation de chaque action."
    4_prefix: "1.3.(d)"
    4_desc: "L’entité réexamine de l’analyse de risques au minimum tous les 3 ans et en tant que de besoin, notamment en cas d’incident de sécurité ou d’évolutions majeures du contexte métier, technique ou organisationnel."
  4:
    title: "L'entité maîtrise son écosystème"
    prefix: "1.4 Objectif de sécurité 4."
    desc: "Description de l'objectif de sécurité : \n\n La maîtrise de l’écosystème consiste, pour l’entité, en la mise en place : \n\t - D’une cartographie des prestataires et fournisseurs informatiques intervenant dans la réalisation des activités ou la fourniture des services de l’entité ; \n\t - De processus visant à prendre en compte la sécurité numérique dans la relation contractuelle avec ces prestataires et fournisseurs. \n\nℹ️ Justification et risques associés : \n\n La cartographie de l’écosystème et la prise en compte de la sécurité numérique dans les contrats avec les prestataires et fournisseurs informatiques permettent à l’entité de limiter les incidents de sécurité dont l’origine est la compromission de la chaîne de sous-traitance. \n  En l’absence d’une telle mesure, l’entité s’expose à des attaques dont l’origine est la compromission d’un de ses prestataires ou fournisseurs informatiques, en particulier lorsque ces derniers sont interconnectés aux systèmes d’information réglementés de l’entité."
    1_prefix: "1.4 Cartographie de l'écosystème (a)"
    1_desc: "L’entité définit et maintient à jour une cartographie de l’écosystème dans lequel ses systèmes d’information réglementés sont mis en œuvre et contenant, au minimum, les informations suivantes : \n\t - La liste des prestataires et fournisseurs informatiques contribuant à la réalisation des activités ou des services de l’entité ; \n\t - La liste des interconnexions avec les systèmes d’information réglementés de l’entité."
    2_prefix: "1.4 Cartographie de l'écosystème (b)"
    2_desc: "L’entité renseigne les coordonnées d’au moins un point de contact pour chaque entrée figurant dans la cartographie de l’écosystème."
    3_prefix: "1.4 Sécurité numérique dans les contacts avec les prestataires et fournisseurs informatiques (a)"
    3_desc: "En cas de recours à un prestataire, l’entité s’assure de la conformité de la prestation aux exigences de la directive NIS 2, et dispose des assurances contractuelles de cette conformité. \n La vérification de la conformité peut s’appuyer sur des audits dont les conditions sont précisées par les moyens acceptables de conformité (b), (d) et (e) relatifs à l’audit (cf. Objectif de sécurité 5)."
  5:
    title: "L'entité essentielle audite la sécurité de ses systèmes d'information réglementés"
    prefix: "1.5 Objectif de sécurité 5."
    desc: "Description de l'objectif de sécurité : \n\n L’entité essentielle audite à intervalle planifié ses systèmes d’information réglementés. Ces audits permettent à l’entité essentielle : \n\t - De vérifier l’atteinte des objectifs fixés par la réglementation ; \n\t - D’évaluer l’exposition de ses systèmes d’information réglementés aux menaces cyber via la vérification de la présence de vulnérabilités sur ces deniers. \n\nℹ️ Justification et risques associés : \n\n Les audits de sécurité permettent de vérifier la conformité des systèmes d’information réglementés aux objectifs fixés par la réglementation ainsi que d’évaluer le niveau de sécurité du système d’information réglementé. En l’absence d’audit, des vulnérabilités peuvent être présentes sur les systèmes d’information réglementés qui, si elles venaient à être exploitées, peuvent entraîner la dégradation ou l’interruption des activités ou des services fournis par l’entité essentielle. \n\nℹ️ \n\n Le recours à un prestataire d’audit en sécurité des systèmes d’information (PASSI), qualifié par l’Agence nationale de la sécurité des systèmes d’information en application de l'article 10 du décret n° 2015-350 du 27 mars 2015 modifié, dont le périmètre de la prestation couvre les systèmes d’information réglementés et l’application des mesures correctives issues de la prestation permettent d’apporter une présomption de conformité à cet objectif."
    1_prefix: "1.5.(a)"
    1_desc: "L’entité définit et met en œuvre un programme d’audit et s’assure que l’ensemble de ses systèmes d’information réglementés font l’objet d’un audit au moins tous les trois ans."
    2_prefix: "1.5.(b)"
    2_desc: "L’audit de sécurité permet : \n\t - De vérifier, sur le périmètre défini, l’atteinte des objectifs fixés par la réglementation via \n\t\t - La conformité aux présentes mesures, ou \n\t\t - La mise en œuvre de mesures alternatives ; et \n\t - D’évaluer le niveau de sécurité du ou des systèmes d’information couverts au regard des menaces et des vulnérabilités connues."
    3_prefix: "1.5.(c)"
    3_desc: "L’audit de sécurité comprend un test d’intrusion (couvrant au minimum les interfaces exposées à des SI tiers), un audit de configuration, un audit d’architecture, un audit organisationnel et physique et, lorsque cela est pertinent, un audit de code."
    4_prefix: "1.5.(d)"
    4_desc: "Le rapport de l’audit de sécurité présente : \n\t - Une synthèse de la conformité aux présentes mesures ou aux mesures définies par l’entité pour atteindre les objectifs fixés par la réglementation et du niveau de sécurité des systèmes d’information audités ; \n\t - Les constats de non-conformité et les vulnérabilités identifiées ; \n\t - Les recommandations pour y remédier."
    5_prefix: "1.5.(e)"
    5_desc: "L’entité définit et met en œuvre un plan d’action visant à corriger les non-conformités et les vulnérabilités identifiées. \n Ce plan d’action prévoit, au minimum, une échéance et un responsable pour la réalisation de chaque action."
  6:
    title: "L'entité prend en compte la sécurité numérique dans la gestion de ses ressources humaines"
    prefix: "1.6 Objectif de sécurité 6."
    desc: "Description de l'objectif de sécurité : \n\n La prise en compte de la sécurité numérique dans la gestion des ressources humaines consiste, pour l’entité, en : \n\t - La sensibilisation des utilisateurs, ainsi que la formation pour les fonctions les plus critiques, à la sécurité numérique ; \n\t - La mise en place de processus prenant en compte la sécurité numérique dès l’arrivée d’un nouveau personnel et jusqu’à son départ de l’entité. \n\nℹ️ Justification et risques associés : \n\n Par l’atteinte de cet objectif, les utilisateurs sont responsabilisés à l’usage des systèmes d’information réglementés de l’entité. En l’absence d’une telle responsabilisation, les utilisateurs peuvent être à l’origine de comportements dangereux du point de vue de la sécurité numérique (par exemple : connexion d’un support amovible infecté sur un système d’information réglementé de l’entité) pouvant être à l’origine d’incident de sécurité entraînant une dégradation ou une interruption des activités ou des services fournis par l’entité."
    1_prefix: "1.6.(a)"
    1_desc: "L’entité définit et met en œuvre une charte d’usage des systèmes d’information, applicable au minimum aux systèmes d’information réglementés, et la rend opposable à chacun des utilisateurs de ces systèmes d’information."
    2_prefix: "1.6.(b)"
    2_desc: "L’entité définit et met en œuvre un programme de sensibilisation à la sécurité numérique de l’ensemble des utilisateurs des systèmes d’information réglementés."
    3_prefix: "1.6.(c)"
    3_desc: "L’entité prévoit des clauses de sécurité dans les contrats de travail."
    4_prefix: "1.6.(d)"
    4_desc: "L’entité définit et met en œuvre un processus de gestion des arrivées, des départs et des changements de fonction des personnels et des tiers accédant aux systèmes d’information réglementés. Ce processus prévoit : \n\t - La prise de connaissance par le personnel des règles de sécurité en vigueur lors de son arrivée ; \n\t - La mise à jour des accès lors d’un changement de fonction ; \n\t - Lors du départ d’un personnel, la restitution de l’ensemble du matériel qui lui a été mis à disposition et la désactivation de l’ensemble de ses accès logiques aux SI et physiques aux locaux et salles."
    5_prefix: "1.6.(e)"
    5_desc: "L’entité définit et met en œuvre, pour les fonctions assumant des responsabilités dans le domaine du numérique, un programme de formations dédiées à la sécurité numérique adapté à leurs responsabilités."
2:
  title: "Protection"
  1:
    title: "L'entité maîtrise ses systèmes d'information réglementés"
    prefix: "2.1 Objectif de sécurité 7."
    desc: "Description de l'objectif de sécurité : \n\n La maîtrise des systèmes d’information réglementés consiste, pour l’entité, en la mise en place : \n\t - D’une ou plusieurs cartographie(s) de ses systèmes d’information réglementés suffisamment détaillée(s) pour faciliter le maintien en condition opérationnelle et de sécurité et améliorer la réactivité de l’entité en cas d’incident de sécurité affectant ces systèmes d’information ; \n\t - De processus de maintien en condition opérationnelle et de sécurité de ses systèmes d’information réglementés incluant notamment la veille sur les vulnérabilités diffusées par l’ANSSI, les fournisseurs et fabricants de produits, les prestataires mandatés ou les CSIRT. \n\nℹ️ Justification et risques associés : \n\n La ou les cartographie(s) permet(tent) à l’entité de faciliter le maintien en condition opérationnelle et de sécurité des systèmes d’information réglementés par l’identification rapide, en cas de publication d’une alerte de sécurité, des ressources affectées. La ou les cartographie(s) permet(tent) également à l’entité de pouvoir réagir rapidement en cas d’incident de sécurité par l’identification des ressources affectées et la mise en œuvre de mesures permettant de limiter la propagation de l’incident et de réduire les conséquences de l’incident. L’absence de cartographie expose l’entité au maintien de ressources vulnérables sur ses systèmes d’information réglementés et, par conséquent, à l’exploitation de ces vulnérabilités pouvant entraîner la dégradation ou l’interruption des activités ou des services fournis par l’entité. \n Le processus de maintien en condition opérationnelle et de sécurité permet à l’entité de s’assurer que les ressources de ses systèmes d’information réglementés sont à jour et maintenues par l’éditeur ou le fournisseur. En l’absence d’un tel processus, des vulnérabilités peuvent être présentes sur les systèmes d’information réglementés qui, si elles venaient à être exploitées, peuvent entraîner la dégradation ou l’interruption des activités ou des services fournis par l’entité."
    1_prefix: "2.1 Cartographie des systèmes d'information réglementés (a)"
    1_desc: "L’entité élabore et maintient à jour une cartographie de ses systèmes d’information réglementés dont le niveau de détail est suffisant pour lui permettre : \n\t - d’assurer le maintien en condition opérationnel et de sécurité de ces systèmes (par exemple : être capable d’identifier les ressources matérielles ou logicielles vulnérables suite à la publication d’un bulletin d’alerte) ; \n\t - de pouvoir réagir dans un délai raisonnable à un incident de sécurité affectant ces systèmes d’information (par exemple : être capable d’identifier les ressources matérielles ou logicielles affectées par un incident de sécurité et ainsi limiter les conséquences de l’incident)."
    2_prefix: "2.1 Maintien en condition opérationnelle et de sécurité (a)"
    2_desc: "L’entité élabore, met en œuvre et maintient à jour une procédure de maintien en conditions opérationnelle et de sécurité des ressources matérielles et logicielles de ses systèmes d’information réglementés."
    3_prefix: "2.1 Maintien en condition opérationnelle et de sécurité (b)"
    3_desc: "L’entité maintient à jour des bases de connaissances des outils de protection contre les codes malveillants (par exemple : la mise à jour de la base antivirale de l’antivirus, la mise à jour des signatures utilisées par la solution d’EDR)."
    4_prefix: "2.1 Maintien en condition opérationnelle et de sécurité (c)"
    4_desc: "L’entité met en œuvre une veille sur les vulnérabilités, les correctifs de sécurité et des mesures d’atténuation préconisées susceptibles de concerner les ressources de ses systèmes d’information réglementés (SIR), qui sont diffusées notamment par les fournisseurs ou les fabricants de ces ressources, par un prestataire mandaté ou par des centres de prévention et d’alerte en matière de cyber sécurité tels que le CERT-FR (centre gouvernemental de veille, d’alerte et de réponse aux attaques informatiques) ou les CSIRT."
    5_prefix: "2.1 Maintien en condition opérationnelle et de sécurité (d)"
    5_desc: "L’entité installe sans délai les correctifs de sécurité sur les ressources exposées à des réseaux tiers (par exemple : un serveur Web, un pare-feu exposé sur Internet, un serveur de messagerie) et les postes de travail des utilisateurs."
    6_prefix: "2.1 Maintien en condition opérationnelle et de sécurité (e)"
    6_desc: "L’entité essentielle planifie et installe sur l’ensemble de ses ressources les correctifs de sécurité."
    7_prefix: "2.1 Maintien en condition opérationnelle et de sécurité (f)"
    7_desc: "Lorsque des raisons techniques ou opérationnelles ne permettent pas l’installation des correctifs de sécurité sur les ressources concernées, l’entité met en œuvre des mesures d’atténuation pour réduire les risques liés à l’utilisation d’une version comportant des vulnérabilités connues."
    8_prefix: "2.1 Maintien en condition opérationnelle et de sécurité (g)"
    8_desc: "L’entité installe et maintient à jour les ressources logicielles de ses SIR, y compris les logiciels embarqués, dans des versions supportées par leurs fournisseurs ou leurs fabricants et comportant les mises à jour de sécurité."
    9_prefix: "2.1 Maintien en condition opérationnelle et de sécurité (h)"
    9_desc: "L’entité vérifie que toute nouvelle version est téléchargée depuis les ressources mises à disposition par les éditeurs ou les fournisseurs."
    10_prefix: "2.1 Maintien en condition opérationnelle et de sécurité (i)"
    10_desc: "Lorsque des raisons techniques ou opérationnelles ne permettent pas l’installation d’une version supportée par le fournisseur ou l’éditeur, l’entité met en œuvre des mesures pour réduire les risques liés à l’utilisation d’une version obsolète."
    11_prefix: "2.1 Maintien en condition opérationnelle et de sécurité (j)"
    11_desc: "L’entité définit et met en œuvre des mécanismes permettant de prendre connaissance, dans les meilleurs délais, des alertes émises par l’Agence nationale de sécurité des systèmes d’information, les éditeurs de produits utilisés par l’entité ou le prestataire mandaté par l’entité."
    12_prefix: "2.1 Maintien en condition opérationnelle et de sécurité (k)"
    12_desc: "L’entité s’assure de la mise en œuvre d’une procédure pour traiter ces alertes et le cas échéant appliquer les mesures préconisées."
  2:
    title: "L'entité maîtrise les accès physique à ses locaux"
    prefix: "2.2 Objectif de sécurité 8."
    desc: "Description de l'objectif de sécurité : \n\n La maîtrise des accès physiques consiste, pour l’entité, en la mise en place de mécanismes de contrôle d’accès, la mise en œuvre de processus de gestion des droits d’accès et de gestion des visiteurs. \n\nℹ️ Justification et risques associés : \n\n Par l’atteinte de cet objectif, l’entité s’assure que seules les personnes autorisées (personnels de l’entité, prestataires ou visiteurs) ont accès à ses locaux, ses salles serveurs ou ses locaux techniques. En l’absence d’un tel objectif, l’entité s’expose à ce que des personnes non autorisées et potentiellement malveillantes s’introduisent dans ses locaux pouvant entraîner, par exemple, le vol d’information sensible ou l’introduction de codes malveillants dans un système d’information réglementé par la connexion de supports amovibles infectés."
    1_prefix: "2.2.(a)"
    1_desc: "L’entité met en place des mesures de sécurité permettant de limiter l’accès de personnes non autorisées à ses locaux, ses salles serveurs et ses locaux techniques."
    2_prefix: "2.2.(b)"
    2_desc: "L’entité s’assure de la protection physique des locaux, salles serveurs et locaux techniques (par exemple : vidéosurveillance, gardiennage, alarme). \n Cette protection physique permet de prévenir, de surveiller et de réagir aux accès non autorisés à ces locaux."
    3_prefix: "2.2.(c)"
    3_desc: "L’entité s’assure du contrôle des accès aux locaux, aux salles serveurs et aux locaux techniques."
    4_prefix: "2.2.(d)"
    4_desc: "L’entité s’assure que les droits d'accès physique sont attribués au regard du besoin strictement nécessaire à l’exécution des missions des personnes."
    5_prefix: "2.2.(e)"
    5_desc: "L'entité s'assure que les personnes externes accédant aux locaux techniques et salles serveurs de l’entité sont accompagnées."
  3:
    title: "L'entité sécurise l'architecture de ses systèmes d'information réglementés"
    prefix: "2.3 Objectif de sécurité 9."
    desc: "Description de l'objectif de sécurité : \n\n La sécurisation de l’architecture des systèmes d’information consiste, pour l’entité, en : \n\t - L’identification des besoins d’exposition et d’interconnexion des activités et services fournis par l’entité à de réseaux tiers ; \n\t - Le filtrage des communications entrantes et sortantes de ses systèmes d’information réglementés, en particulier les flux dont l’origine, le transit ou la destination est un système d’information tiers. \n Pour les entités essentielles, cela consiste également cloisonner les systèmes d’information réglementés en zones de sécurité cohérentes et le contrôle des points d’entrée et de sortie des systèmes d’information réglementés pour les utilisateurs, les prestataires et les fournisseurs. \n\nℹ️ Justification et risques associés : \n\n Par l’atteinte de cet objectif, l’entité réduit son exposition à la menace d’origine cyber. \n En l’absence d’un tel objectif, l’entité augmente son exposition à la menace d’origine cyber facilitant la compromission de ses systèmes d’information réglementés. Les conséquences de cette compromission peuvent être aggravées par les possibilités de l’attaquant à étendre son attaque à d’autres systèmes d’information (par exemple : latéralisation à des systèmes d’information réglementés depuis la compromission de systèmes d’information non réglementés). La réalisation des activités de l’entité ou la fourniture de ses services peuvent être dégradées voire interrompues."
    1_prefix: "2.3 Cloisonnement (a)"
    1_desc: "L’entité cloisonne physiquement ou logiquement l’ensemble de ses systèmes d’information réglementés vis-à-vis des autres systèmes d’information (les systèmes d’information non réglementés et systèmes d’information tiers)."
    2_prefix: "2.3 Cloisonnement (b)"
    2_desc: "L’entité cloisonne physiquement ou logiquement chaque système d’information réglementé vis-à-vis des autres systèmes d’information (les autres systèmes d’information réglementés, les systèmes d’information non réglementés et systèmes d’information tiers)."
    3_prefix: "2.3 Cloisonnement (c)"
    3_desc: "L’entité mène des réflexions, pour chaque système d’information réglementé, sur la pertinence de définir des sous-systèmes. Lorsqu’elle n’identifie aucun sous-système, l’entité en apporte la justification. \n Un sous-système regroupe des ressources assurant des fonctionnalités similaires et ayant des niveaux de sensibilité, d’exposition et de sécurité homogènes."
    4_prefix: "2.3 Cloisonnement (d)"
    4_desc: "Les sous-systèmes identifiés à la mesure (b) sont cloisonnés entre eux physiquement ou logiquement."
    5_prefix: "2.3 Cloisonnement (e)"
    5_desc: "L’entité met en œuvre au moins un sous-système “passerelle sortante” permettant : \n\t - aux ressources des SIR d’accéder aux SI tiers; \n\t - d’authentifier, de filtrer et de tracer les accès aux SI tiers (par exemple : un serveur mandataire)."
    6_prefix: "2.3 Cloisonnement (f)"
    6_desc: "L’entité met en œuvre au moins un sous-système “passerelle entrante” permettant : \n\t - d’exposer des ressources des SIR aux SI tiers; \n\t - de filtrer et de tracer les accès depuis des SI tiers (par exemple : un serveur mandataire inverse ou un relai)"
    7_prefix: "2.3 Cloisonnement (g)"
    7_desc: "Seules les interconnexions nécessaires à la réalisation des activités et services de l’entité ou au maintien en condition opérationnelle ou de sécurité sont mises en œuvre entre l’ensemble des systèmes d’information réglementés et les autres systèmes d’information."
    8_prefix: "2.3 Cloisonnement (h)"
    8_desc: "Seules les interconnexions nécessaires à la réalisation des activités et services de l’entité ou au maintien en condition opérationnelle ou de sécurité sont mises en œuvre entre chaque système d’information réglementé et les autres systèmes d’information, ou entre les sous-systèmes du système d’information réglementé."
    9_prefix: "2.3 Filtrage des communications (a)"
    9_desc: "L’entité définit et documente les communications nécessaires à la réalisation des activités et services de l’entité ou au maintien en condition opérationnelle de sécurité circulant entre l’ensemble des systèmes d’information réglementés et les autres systèmes d’information."
    10_prefix: "2.3 Filtrage des communications (b)"
    10_desc: "L’entité définit et documente les communications nécessaires à la réalisation des activités et services de l’entité ou au maintien en condition opérationnelle de sécurité circulant entre chaque système d’information réglementé et les autres systèmes d’information, ou entre les sous-systèmes du système d’information réglementé."
    11_prefix: "2.3 Filtrage des communications (c)"
    11_desc: "L’entité met en œuvre, au niveau des interconnexions, les règles de filtrage pour n’autoriser que les communications identifiées à la mesure (a) ou (b). Les autres communications sont bloquées par défaut."
    12_prefix: "2.3 Filtrage des communications (d)"
    12_desc: "Au minimum, les communications entre les systèmes d’information réglementés de l’entité et les SI tiers sont filtrés par un ou des pares-feux dédiés à cet usage. \n (par exemple : une entité mettant en œuvre un pare-feu pour filtrer les communications entre ses systèmes d’information (réglementés ou non) d’une part et les SI tiers d’autre part est une solution acceptable)"
    13_prefix: "2.3 Filtrage des communications (e)"
    13_desc: "L’entité effectue annuellement une revue de la mise en œuvre technique des règles de filtrage mentionnées à la mesure (c)."
  4:
    title: "L'entité sécurise les accès distant à ses systèmes d’information réglementés"
    prefix: "2.4 Objectif de sécurité 10."
    desc: "Description de l'objectif de sécurité : \n\n La sécurisation des accès distants consiste, pour l’entité, en la mise en place : \n\t - De mécanismes d’identification et d’authentification des personnes accédant aux systèmes d’information réglementés de l’entité depuis des SI tiers (par exemple : internet ou le système d’information d’un prestataire) ; \n\t - De mécanismes de sécurisation du canal de communication, des points d’entrée et de sortie et des d’accès aux systèmes d’information réglementés depuis des systèmes d’information tiers. \n\nℹ️ Justification et risques associés : \n\n L’atteinte de cet objectif doit permettre à l’entité de concilier les besoins opérationnels nécessitant une forte interconnexion (par exemple : interconnexion avec un fournisseur, pratique du télétravail et du nomadisme) sans remettre en cause la sécurité des informations, des activités et des services de l’entité. \n  En l’absence d’un tel objectif, l’entité s’expose, par exemple, à des vols de secrets d’authentification et à des accès illégitimes à ses SIR via les accès distants légitimes des personnels de l’entité, des processus automatiques ou des prestataires de l’entité, pouvant entraîner la dégradation voire l’interruption des activités ou services qu’elle fournit ou encore la divulgation d’informations sensibles."
    1_prefix: "2.4.(a)"
    1_desc: "L’entité protège les accès à ses systèmes d’information réglementés (SIR) effectués à travers un système d’information tiers au moyen de mécanismes de chiffrement conformes aux règles préconisées par l'Agence nationale de la sécurité des systèmes d'information."
    2_prefix: "2.4.(b)"
    2_desc: "De plus, lorsque les accès visés à la mesure (a) sont effectués par l’entité ou un prestataire qu’elle a mandaté à cet effet, l’entité protège les accès aux SIR par un mécanisme d'authentification conforme aux mesures de l’Objectif de sécurité 13."
    3_prefix: "2.4.(c)"
    3_desc: "Pour les accès visés à la mesure (b), le mécanisme d’authentification s’appuie sur une authentification multifacteur reposant au moins sur un facteur de connaissance."
    4_prefix: "2.4.(d)"
    4_desc: "Lorsque des raisons techniques ou opérationnelles ne permettent pas la mise en œuvre d’une authentification multifacteur, l’entité met en œuvre des mesures permettant de réduire le risque associé."
    5_prefix: "2.4.(e)"
    5_desc: "Les mémoires de masse (par exemple : les « disques ») des postes de travail et équipements mobiles permettant aux personnels et prestataires de l’entité d’accéder à distance au SIR depuis un lieu qui n’est pas maîtrisé par l’entité, sont en permanence protégées par des mécanismes de chiffrement et d’authentification conformes à l’état de l’art tel que préconisé par l’Agence nationale de la sécurité des systèmes d’information."
  5:
    title: "L'entité protège ses systèmes d'informations réglementés contre les codes malveillants"
    prefix: "2.5 Objectif de sécurité 11."
    desc: "Description de l'objectif de sécurité : \n\n La protection contre les codes malveillants consiste, pour l’entité, en l’installation ou l’activation de solutions de protection contre les codes malveillants sur les ressources de ses systèmes d’informations réglementés. \n\nℹ️ Justification et risques associés : \n\n L’atteinte de cet objectif permet à l’entité de se protéger des codes malveillants qui pourraient être introduits sur ses systèmes d’information réglementés (par exemple : par la mise en œuvre ou l’activation d’un antivirus)."
    1_prefix: "2.5.(a)"
    1_desc: "Seules les ressources matérielles de l’entité, de ses personnels ou de ses prestataires clairement identifiées et participant à la réalisation des activités ou la fourniture des services de l’entité ou au maintien en condition opérationnelle et de sécurité se connectent aux systèmes d’information réglementés."
    2_prefix: "2.5.(b)"
    2_desc: "Seules les ressources matérielles dont l’entité, ou le prestataire qu’elle a mandaté, assure la gestion et participant à la réalisation des activités ou la fourniture des services de l’entité ou au maintien en condition opérationnelle et de sécurité se connectent aux systèmes d’information réglementés."
    3_prefix: "2.5.(c)"
    3_desc: "L’entité met en œuvre des mesures organisationnelles ou techniques visant à empêcher la connexion des ressources matérielles autres que celles identifiées à la mesure (a) sur ses systèmes d’information réglementés."
    4_prefix: "2.5.(d)"
    4_desc: "L’entité met en œuvre des mesures organisationnelles ou techniques visant à empêcher la connexion des ressources matérielles autres que celles identifiées à la mesure (b) sur ses systèmes d’information réglementés."
    5_prefix: "2.5.(e)"
    5_desc: "Seuls les supports amovibles réinscriptibles nécessaires à la réalisation des activités et services de l’entité ou au maintien en condition opérationnelle ou de sécurité se connectent à ses systèmes d’information réglementés."
    6_prefix: "2.5.(f)"
    6_desc: "Les postes de travail, les serveurs et les équipements mobiles maîtrisés par l’entité, qui sont amenés à traiter de données provenant de sources externes (comme par exemple les supports amovibles, la messagerie ou la navigation web), disposent de mécanismes de protection contre les risques d'exécution de codes malveillants."
    7_prefix: "2.5.(g)"
    7_desc: "L’entité procède à l’analyse des données provenant de sources externes lors de leur réception, pour y rechercher des codes malveillants."
  6:
    title: "L'entité essentielle sécurise la configuration des ressources de ses systèmes d'information réglementés"
    prefix: "2.6 Objectif de sécurité 12."
    desc: "Description de l'objectif de sécurité : \n\n La sécurisation de la configuration consiste, pour l’entité, en la mise en place de configurations durcies sur les ressources de ses systèmes d’information réglementés. \n\nℹ️ Justification et risques associés : \n\n En l’absence d’un tel objectif, un attaquant est capable de compromettre un système d’information par l’exploitation de vulnérabilités sur les services non essentiels à l’activité ou au service fourni par l’entité, maintenus sur un système d’information réglementé, mais non supervisés. L’entité s’expose également à l’exécution de codes malveillants sur ses systèmes d’information. Ces deux scénarios peuvent entraîner la dégradation ou l’interruption des activités et des services fournis par l’entité, la divulgation ou l’altération d’informations sensibles."
    1_prefix: "2.6.(a)"
    1_desc: "Seules les ressources logicielles nécessaires à la réalisation des activités et services de l’entité ou au maintien en condition opérationnelle ou de sécurité sont installées ou conservées sur les systèmes d’information réglementés."
    2_prefix: "2.6.(b)"
    2_desc: "Lorsque des raisons techniques ou opérationnelles ne permettent pas de désactiver ou désinstaller une ressource logicielle, l’entité met en œuvre des mesures permettant de réduire le risque associé."
    3_prefix: "2.6.(c)"
    3_desc: "L’entité configure les ressources de ses SIR de manière sécurisée et en s’appuyant sur les recommandations de l’éditeur de la fonctionnalité, du fabricant de la ressource ou de l’autorité nationale de sécurité des systèmes d’information."
    4_prefix: "2.6.(d)"
    4_desc: "L’entité effectue annuellement une revue de configuration des ressources de ses SIR pour vérifier l’application des mesures précédentes. Il est recommandé que cette revue s’appuie sur un ou des outils automatisés."
  7:
    title: "L'entité gère les identités et les accès des utilisateurs à ses systèmes d'information réglementés"
    prefix: "2.7 Objectif de sécurité 13."
    desc: "Description de l'objectif de sécurité : \n\n La gestion des identités et des accès consiste, pour l’entité, en la mise en place : \n\t - De mécanismes d’identification et d’authentification des utilisateurs des systèmes d’information réglementés ainsi que des processus automatiques ; \n\t - De processus de gestion des droits d’accès permettant l’accès aux ressources mises à disposition qu’aux utilisateurs et processus automatiques authentifiés et justifiant d’un besoin opérationnel. \n\nℹ️ Justification et risques associés : \n\n L’atteinte de cet objectif permet à l’entité de maîtriser les utilisateurs accédant à ses systèmes d’information réglementés, que ces derniers soient internes ou externes à l’entité (par exemple : les prestataires) ainsi que les processus automatiques (par exemple : les agents de supervision ou de sauvegarde) via des mécanismes d’identification et d’authentification à l’état de l’art. L’atteinte de cet objectif permet également à l’entité de maîtriser les accès afin que ces utilisateurs n’accèdent qu’aux seules ressources utiles pour l’accomplissement de leurs missions. \n En l’absence d’un tel objectif, l’entité s’expose à ce qu’un attaquant, profitant de l’absence de mécanismes d’authentification ou mécanismes d’authentification faibles (par exemple : mots de passe pas suffisamment robustes) usurpe l’identité d’un utilisateur légitime du système d’information, accède à celui-ci et exfiltre des informations sensibles ou encore interrompe les activités ou services de l’entité reposant sur ce système d’information."
    1_prefix: "2.7 Identification (a)"
    1_desc: "Les utilisateurs et les processus automatiques accédant aux ressources des systèmes d’information réglementés (SIR) de l’entité importante ou essentielle disposent de comptes individuels. Les utilisateurs peuvent, le cas échéant, disposer de plusieurs comptes individuels."
    2_prefix: "2.7 Identification (b)"
    2_desc: "L’emploi d’un compte individuel du SIR est réservé à l’utilisateur ou au processus automatique auquel ce compte a été attribué."
    3_prefix: "2.7 Identification (c)"
    3_desc: "Lorsque des raisons techniques ou opérationnelles ne permettent pas de créer de comptes individuels pour les utilisateurs ou pour les processus automatiques, l’entité met en place des mesures permettant de réduire le risque lié à l'utilisation de comptes partagés et d'assurer la traçabilité de l'utilisation de ces comptes."
    4_prefix: "2.7 Identification (d)"
    4_desc: "Lorsqu'un SIR est utilisé pour diffuser de l'information au public, l’entité n'est pas tenue de créer de comptes pour l'accès du public à cette information."
    5_prefix: "2.7 Identification (e)"
    5_desc: "L’entité désactive sans délai les comptes qui ne sont plus nécessaires."
    6_prefix: "2.7 Authentification (a)"
    6_desc: "L’entité protège les accès des utilisateurs et processus automatiques aux ressources de ses systèmes d’information réglementés (SIR) au moyen d'un mécanisme d'authentification (par exemple : un mécanisme d’authentification mono- ou multi-facteur) impliquant au moins un élément secret (par exemple : un facteur de connaissance tel qu’un mot de passe)."
    7_prefix: "2.7 Authentification (b)"
    7_desc: "L’entité définit, conformément à sa politique de contrôle d’accès physique et logique, les règles de gestion des facteurs d'authentification mis en œuvre dans ses SIR."
    8_prefix: "2.7 Authentification (c)"
    8_desc: "L’entité change les éléments secrets configurés par défaut, avant la mise en service d’une ressource. À cet effet, l’entité s'assure auprès du fabricant ou du fournisseur de la ressource qu'elle dispose des moyens et des droits permettant d’effectuer ces changements."
    9_prefix: "2.7 Authentification (d)"
    9_desc: "L’élément secret d'un compte partagé est renouvelé à chaque retrait d'un utilisateur de ce compte."
    10_prefix: "2.7 Authentification (e)"
    10_desc: "L’élément secret d’un compte n’est connu, accessible en clair ou modifiable que des utilisateurs qui en ont la responsabilité."
    11_prefix: "2.7 Authentification (f)"
    11_desc: "Les facteurs d’authentification sont conformes à l’état de l'art préconisé par l'Agence nationale de la sécurité des systèmes d'information en matière de complexité, en tenant compte du niveau de complexité maximal permis par la ressource concernée, et en matière de fréquence de renouvellement."
    12_prefix: "2.7 Authentification (g)"
    12_desc: "L’entité modifie sans délai l’élément secret associé à un compte désactivé."
    13_prefix: "2.7 Authentification (h)"
    13_desc: "Lorsque des raisons techniques ou opérationnelles ne permettent pas de modifier l'élément secret, l’entité met en œuvre un contrôle d'accès approprié à la ressource concernée ainsi que des mesures de réduction du risque lié à l'utilisation d'un élément secret d'authentification fixe."
    14_prefix: "2.7 Authentification (i)"
    14_desc: "Dans le cadre de cette exception, l’entité met également en œuvre des mesures de sécurité permettant d'assurer la traçabilité des accès."
    15_prefix: "2.7 Droits d'accès (a)"
    15_desc: "L’entité n’attribue des droits qu’aux utilisateurs et processus automatiques authentifiés."
    16_prefix: "2.7 Droits d'accès (b)"
    16_desc: "Pour chaque utilisateur ou chaque processus automatique, l’entité n'attribue les droits d'accès qu’aux seules ressources nécessaires à la réalisation des activités et services de l’entité ou au maintien en condition opérationnelle ou de sécurité."
    17_prefix: "2.7 Droits d'accès (c)"
    17_desc: "Pour chaque ressource du SIR, l’entité n’attribue les droits d’accès qu’aux seuls utilisateurs et processus automatiques justifiant d’un besoin au regard de leurs missions."
    18_prefix: "2.7 Droits d'accès (d)"
    18_desc: "L’entité effectue périodiquement, au moins annuellement, une revue des droits d’accès. Cette revue doit notamment vérifier le respect de la présente mesure et, le cas échéant, corriger les anomalies."
  8:
    title: "L'administration maîtrise l'administration de ses systèmes d'information réglementés"
    prefix: "2.8 Objectif de sécurité 14."
    desc: "Description de l'objectif de sécurité : \n\n La maîtrise de l’administration des systèmes d’information réglementés consiste, pour l’entité ou le prestataire mandaté pour réaliser cette activité, en la mise en œuvre de comptes d’administration dédiés à cet usage est utilisé par les personnes autorisées. Cela consiste également en la sécurisation de l’administration des annuaires qui représente le cœur de confiance des systèmes d’information réglementés de l’entité. \n\nℹ️ Justification et risques associés : \n\n L’administration des systèmes d’information est une activité indispensable pour le maintien en condition opérationnelle et de sécurité de ces systèmes. De plus cette activité est extrêmement sensible, car elle permet d’avoir des droits étendus sur les ressources administrées. Cette capacité est extrêmement recherchée par les attaquants dans le déroulement de leurs attaques. \n L’atteinte de cet objectif permet à l’entité de s’assurer que les droits d’administration sont délivrés aux seuls personnels dont c’est la responsabilité et uniquement lorsqu’ils se sont authentifiés. Il permet également que les ressources utilisées pour les actions d’administration sur le cœur de confiance soient maîtrisées par l’entité. \n En l’absence d’un tel objectif, l’entité s’expose à ce qu’un attaquant usurpe l’identité d’une personne disposant des droits d’administration ou exploite une vulnérabilité d’une ressource d’administration exposée lui permettant : \n\t - De désactiver des mesures de sécurité mise en place par l’entité complexifiant les capacités de l’entité à détecter les activités malveillantes sur ses systèmes d’information réglementés ; ou \n\t - D’introduire et d’exécuter des codes malveillants sur le système d’information. avec pour conséquence la dégradation ou l’interruption des activités ou des services fournis par l’entité. \n Lorsque l’attaquant dispose des droits d’administration sur le cœur de confiance, il est considéré que les systèmes d’information de l’entité (réglementés ou non) liés à ce cœur de confiance sont totalement compromis avec des conséquences pour l’entité pouvant aller jusqu’à la nécessité de reconstruire tout ou partie de ses systèmes d’information. \n\nℹ️ Comptes d'administration \n Le recours à un prestataire d’administration et de maintenance sécurisée (PAMS), qualifié par l’Agence nationale de sécurité des systèmes d’information en application de l'article 10 du décret n° 2015-350 du 27 mars 2015 modifié , dont le périmètre de la prestation couvre au minimum les systèmes d’information réglementés permet à l’entité de bénéficier d’une présomption de conformité à cet objectif."
    1_prefix: "2.8 Comptes d'administration (a)"
    1_desc: "Les actions d’administration sur les systèmes d’information réglementés sont effectuées au moyen de comptes d’administration dédiés à cet usage."
    2_prefix: "2.8 Comptes d'administration (b)"
    2_desc: "Les comptes d’administration ne sont utilisés que par des administrateurs ou des personnes autorisées."
    3_prefix: "2.8 Comptes d'administration (c)"
    3_desc: "Les comptes d’administration sont des comptes qui respectent les mesures relatives à l’identification (cf. Objectif de sécurité 13)."
    4_prefix: "2.8 Comptes d'administration (d)"
    4_desc: "Un compte d'administration est utilisé exclusivement pour se connecter à un système d'information d'administration, ou à une ressource pour effectuer des actions d’administration."
    5_prefix: "2.8 Comptes d'administration (e)"
    5_desc: "Les actions d'administration sont effectuées exclusivement à partir de comptes d'administration, et inversement, les comptes d'administration sont utilisés exclusivement pour les actions d'administration"
    6_prefix: "2.8 Comptes d'administration (f)"
    6_desc: "L’octroi de privilèges administrateur à un compte utilisateur est interdit."
    7_prefix: "2.8 Comptes d'administration (g)"
    7_desc: "Lorsque des raisons techniques ou opérationnelles ne permettent pas d’effectuer des actions d’administration à partir d'un compte d'administration, l’entité met en œuvre des mesures permettant d'assurer le contrôle de ces actions d'administration et des mesures de réduction du risque lié à l'utilisation d'un compte non spécifique à l'administration."
    8_prefix: "2.8 Comptes d'administration (h)"
    8_desc: "L’entité met également en œuvre des mesures permettant d'assurer la traçabilité des actions d'administration réalisées."
    9_prefix: "2.8 Comptes d'administration (i)"
    9_desc: "L’entité établit et tient à jour la liste des comptes d'administration de ses SIR."
    10_prefix: "2.8 Comptes d'administration (j)"
    10_desc: "L’attribution des droits aux comptes d’administration est limitée aux droits nécessaires aux actions d’administration de ce compte, sur les seuls périmètres techniques et fonctionnels qu’il administre. \n En particulier, afin de limiter la portée des droits individuels, ils sont attribués à chaque compte d’administration en les restreignant autant que possible au périmètre fonctionnel et technique de ce dernier. Pour ceci, il est recommandé d’octroyer les droits d’administration au travers des groupes dont les comptes d’administration sont membres."
    11_prefix: "2.8 Comptes d'administration (k)"
    11_desc: "Les administrateurs ne réutilisent pas les éléments secrets entre comptes d’administration, ou entre un compte d’administration et un compte utilisateur."
    12_prefix: "2.8 Comptes d'administration (l)"
    12_desc: "Lors de toute modification d'un compte d’administration (ajout, suppression, suspension ou modification des droits associés), l’entité vérifie que les droits d'accès aux ressources et fonctionnalités sont attribués en cohérence avec les besoins d'utilisation du compte."
    13_prefix: "2.8 Sécurité des annuaires (a)"
    13_desc: "La sécurité des systèmes d’information réglementés (SIR) de l’entité repose en grande partie sur la sécurité du ou des annuaires gérant les utilisateurs ou les ressources des SIR. \n L’ensemble des ressources regroupant ces annuaires, les ressources matérielles et logicielles hébergeant ces annuaires ou permettant de prendre le contrôle de ces annuaires est désigné par « cœur de confiance »."
    14_prefix: "2.8 Sécurité des annuaires (b)"
    14_desc: "Les actions d’administration du cœur de confiance sont réalisées via des comptes d’administration dédiés exclusivement à cet usage."
    15_prefix: "2.8 Sécurité des annuaires (c)"
    15_desc: "Les actions d'administration du cœur de confiance sont réalisées via des ressources dédiées exclusivement à cet usage."
    16_prefix: "2.8 Sécurité des annuaires (d)"
    16_desc: "Les connexions externes au cœur de confiance, à destination des ressources d’administration du cœur de confiance sont interdites par un dispositif de filtrage sur les ressources d’administration."
    17_prefix: "2.8 Sécurité des annuaires (e)"
    17_desc: "L’entité effectue annuellement une revue de la configuration des annuaires gérant les utilisateurs ou les ressources de ses SIR, afin d’identifier tout élément inutile ou anormal. Il est recommandé que cette revue s’appuie sur un outil automatisé."
3:
  title: "Défense"
  1:
    title: " L’entité essentielle réalise les actions d’administration depuis des ressources dédiées"
    prefix: "3.1 Objectif de sécurité 15."
    desc: "Description de l'objectif de sécurité : \n\n Cet objectif consiste, pour l’entité, en la mise en place d’un système d’information dédié à l’administration des systèmes d’information réglementés avec des ressources dédiées à ces actions et maîtrisées par l’entité ou le prestataire qu’elle a mandaté. \n\nℹ️ Justification et risques associés : \n\n L’atteinte de cet objectif permet à l’entité de s’assurer que les ressources utilisées pour l’administration de ces systèmes d’information réglementés sont sous sa maîtrise et qu’elles sont dédiées à cet usage. En l’absence d’un tel objectif, un attaquant pourrait compromettre, via de l’hameçonnage, le poste de travail d’un administrateur utilisé pour des activités bureautiques (par exemple : navigation Internet, messagerie). Une fois le poste de travail compromis, l’attaquant usurpe l’identité d’une personne disposant des droits d’administration ou exploite une vulnérabilité d’une ressource d’administration exposée lui permettant : \n\t - De désactiver des mesures de sécurité mise en place par l’entité complexifiant les capacités de l’entité à détecter les activités malveillantes sur ses systèmes d’information réglementés ; ou \n\t - D’introduire et d’exécuter des codes malveillants sur le système d’information. \n avec pour conséquence la dégradation ou l’interruption des activités ou des services fournis par l’entité \n\nℹ️ Le recours à un prestataire d’administration et de maintenance sécurisée (PAMS), qualifié par l’Agence nationale de sécurité des systèmes d’information en application de l'article 10 du décret n° 2015-350 du 27 mars 2015 modifié , dont le périmètre de la prestation couvre au minimum les systèmes d’information réglementés permet à l’entité de bénéficier d’une présomption de conformité à cet objectif."
    1_prefix: "3.1.(a)"
    1_desc: "Les actions d’administration sur les systèmes d’information réglementés sont effectuées au moyen d’un système d’information d’administration."
    2_prefix: "3.1.(b)"
    2_desc: "Les ressources des systèmes d'information d'administration sont gérées et configurées par l’entité ou le prestataire qu'elle a mandaté pour réaliser les actions d'administration."
    3_prefix: "3.1.(c)"
    3_desc: "Les ressources matérielles des systèmes d’information d’administration sont utilisées exclusivement pour réaliser des actions d’administration."
    4_prefix: "3.1.(d)"
    4_desc: "Le système d’exploitation utilisé pour effectuer des actions d'administration est utilisé exclusivement pour réaliser des actions d’administration."
    5_prefix: "3.1.(e)"
    5_desc: "La connexion des administrateurs à un système d’information d’administration s’effectue au moyen d’un système d’exploitation utilisé exclusivement pour des actions d’administration."
    6_prefix: "3.1.(f)"
    6_desc: "Lorsque des raisons techniques ou opérationnelles ne permettent pas de dédier le poste de travail physique de l'administrateur pour les actions d'administration, l’entité met en œuvre des mesures de durcissement et de cloisonnement du système d'exploitation du poste de travail permettant d'isoler le système d’exploitation utilisé pour les actions d'administration du système d’exploitation utilisé pour les autres actions."
    7_prefix: "3.1.(g)"
    7_desc: "Les systèmes d'information d'administration sont connectés aux ressources du SIR à administrer au travers d'une liaison réseau physique utilisée exclusivement pour les actions d'administration. Ces ressources sont administrées au travers de leur interface d'administration physique."
    8_prefix: "3.1.(h)"
    8_desc: "Lorsque des raisons techniques ou opérationnelles ne permettent pas d'administrer une ressource au travers d'une liaison réseau physique ou de son interface d'administration physique, l’entité met en œuvre des mesures de réduction du risque telles que des mesures de sécurité logique."
    9_prefix: "3.1.(i)"
    9_desc: "Les communications associées à des actions d’administration sont protégées par des mécanismes de chiffrement et d’authentification conformes à l’état de l'art tel que celui préconisé par l’Agence nationale de la sécurité des systèmes d’information."
    10_prefix: "3.1.(j)"
    10_desc: "Les communications associées à des actions d’administration qui transitent sur des réseaux non dédiés à ces communications sont cloisonnées au moyen de mécanismes de chiffrement et d’authentification conformes aux mesures préconisées par l’Agence nationale de la sécurité des systèmes d’information."
    11_prefix: "3.1.(k)"
    11_desc: "Lorsque des raisons techniques ou opérationnelles ne permettent pas de recourir à des mécanismes de chiffrement ou d’authentification de ces communications, l’entité met en œuvre des mesures permettant de protéger la confidentialité et l’intégrité de ces flux et de renforcer le contrôle et la traçabilité des actions d’administration."
  2:
    title: "L’entité essentielle supervise la sécurité de ses systèmes d’information réglementés"
    prefix: "3.2 Objectif de sécurité 16."
    desc: "Description de l'objectif de sécurité : \n\n La supervision de sécurité consiste, pour l’entité essentielle, en la mise en place de moyens de journalisation, de détection et d’analyse des événements de sécurité sur ses systèmes d’information réglementés. \n\nℹ️ Justification et risques associés : \n\n L’atteinte de cet objectif permet à l’entité essentielle de disposer de capacité lui permettant d’identifier les potentiels incidents de sécurité au plus tôt et ainsi permettre de réagir rapidement et d’en réduire les conséquences. \n En l’absence d’un tel objectif, l’entité essentielle n’est pas en mesure de détecter une éventuelle compromission de toute ou partie de ses systèmes d’information réglementés. L’attaquant a la possibilité d’étendre le périmètre de son attaque via la latéralisation sans être détecté et par conséquent d’aggraver les conséquences de celle-ci. C’est lorsque ces conséquences seront significatives et potentiellement perceptibles des utilisateurs et des usagers des services qu’elle fournit que l’entité aura la capacité de réagir (par exemple : en cas de dégradation ou d’interruption des activités et services fournis par l’entité). \n\nℹ️ Le recours à un prestataire de détection des incidents de sécurité (PDIS), qualifié par l’Agence nationale de la sécurité des systèmes d’information en application de l'article 10 du décret no 2015-350 du 27 mars 2015 modifié, dont le périmètre de la prestation couvre au minimum les systèmes d’information réglementés permet d’apporter une présomption de conformité à cet objectif."
    1_prefix: "3.2.(a)"
    1_desc: "L’entité essentielle élabore, tient à jour et met en œuvre, conformément à sa politique de sécurité des systèmes d'information, une procédure de détection des incidents de sécurité susceptibles d'affecter ses systèmes d’information réglementés (SIR)."
    2_prefix: "3.2.(b)"
    2_desc: "Cette procédure prévoit des mesures organisationnelles et techniques destinées à détecter les incidents de sécurité. \n Les mesures organisationnelles comprennent les modalités : \n\t - De collecte des journaux nécessaires à la détection ; \n\t - D'exploitation des dispositifs de détection ; \n\t - D’analyse des événements de sécurité ; \n\t - D’amélioration des techniques de détection dans le temps. \n Les mesures techniques précisent notamment la nature et le positionnement des dispositifs de détection."
    3_prefix: "3.2.(c)"
    3_desc: "Pour chacun de ses SIR, l’entité essentielle configure les ressources suivantes afin qu’ils journalisent des évènements de sécurité : \n\t - Les serveurs applicatifs ; \n\t - Les serveurs d'infrastructure ; \n\t - Les équipements de sécurité ; \n\t - Les équipements réseau ; \n\t - Les postes de travail des administrateurs ; \n\t - Les stations d’ingénierie, les postes de maintenance et les consoles de programmation des systèmes industriels et des systèmes de sûreté des personnes et des installations. Les évènements de sécurité issus de ces ressources incluent au moins les évènements liés : \n\t - À l'authentification des utilisateurs ; \n\t - À la gestion des comptes et des droits d'accès ; \n\t - À l'accès aux ressources ; \n\t - Aux modifications des règles de sécurité du SIR ; \n\t - Au fonctionnement du SIR. \n Les journaux et événements de sécurité sont configurés de façon à ne pas enregistrer des champs supposés inclure des mots de passe ou autres éléments secrets d'authentification, en clair ou sous forme d’empreinte cryptographique."
    4_prefix: "3.2.(d)"
    4_desc: "L’entité met en œuvre des dispositifs de détection analysant notamment l'ensemble des communications entre les SIR et les systèmes d'information tiers. \n L’entité essentielle veille à ce que l'installation et l'exploitation de ces dispositifs de détection n'affectent pas la sécurité et le fonctionnement de ses SIR. \n L’entité essentielle s’assure que les événements de sécurité issus des journaux et des dispositifs de détections sont horodatés au moyen de sources de temps synchronisées."
    5_prefix: "3.2.(e)"
    5_desc: "L’entité essentielle enregistre et centralise les événements de sécurité issus des journaux et des dispositifs de détection de ses SIR dans un système de corrélation et d’analyse. \n Le système d'analyse conserve les événements de sécurité sur une durée d'au moins six mois, notamment pour permettre une exploitation à postériori. \n Le système d'analyse de journaux est installé et exploité sur un système d’information mis en place exclusivement à des fins de détection des incidents de sécurité."
    6_prefix: "3.2.(f)"
    6_desc: "Dans le cas particulier d'un SIR en charge du transit de communications pour le compte de tiers (par exemple l’appairage pour l'échange de trafic internet), l’entité essentielle ne met en œuvre des dispositifs de détection que pour les flux de données autres que ceux correspondant aux flux des tiers."
  3:
    title: "L’entité est en capacité de réagir aux incidents de sécurité"
    prefix: "3.3 Objectif de sécurité 17."
    desc: "Description de l'objectif de sécurité : \n\n La capacité de réagir aux incidents de sécurité consiste, pour l’entité, en la mise en place d’une organisation, de processus et d’outils adaptés à la gestion de ce type d’événements.\n\nℹ️ Justification et risques associés : \n\n Cet objectif permet à l’entité de se préparer, de s’organiser pour faire face à des événements adverses pouvant impacter la réalisation de ses activités ou la fourniture des services qu’elle fournit et de revenir rapidement à la normale limitant ainsi les conséquences pour l’entité. \n En l’absence d’un tel objectif, l’entité peut ne pas être en mesure de gérer les incidents de sécurité se traduisant par une aggravation des conséquences liées à ces incidents (par exemple : allongement de la durée de résolution et de retour à la normale) notamment sur les utilisateurs et les usa \n\nℹ️Le recours à un prestataire d’assistance et de conseil en sécurité (PACS), qualifié par l’Agence nationale de la sécurité des systèmes d’information en application de l'article 10 du décret n° 2015-350 du 27 mars 2015 modifié, pour la préparation du dispositif de gestion des incidents et le suivi par l’entité du plan d’action issu de la prestation permettent de bénéficier d’une présomption de conformité à l’objectif."
    1_prefix: "3.3.(a)"
    1_desc: "Le dirigeant exécutif de l’entité désigne un ou plusieurs points de contact sur les sujets relatifs à la sécurité numérique. \n L’entité communique à l’Agence nationale de la sécurité des systèmes d’information et, le cas échéant, aux autorités nationales compétentes les coordonnées de ces points de contact et leurs mises à jour."
    2_prefix: "3.3.(b)"
    2_desc: "Le dirigeant exécutif de l’entité essentielle s’assure de l’élaboration, du maintien à jour et de la mise en œuvre d’une procédure de traitement des incidents de sécurité affectant ses systèmes d’information réglementés."
    3_prefix: "3.3.(c)"
    3_desc: "Le dirigeant exécutif de l’entité s’assure de la notification des incidents qui ont ou sont susceptibles d’avoir, compte tenu notamment du nombre d’utilisateurs et de la zone géographique touchés ainsi que de la durée de l’incident, un impact significatif sur la continuité de ses activités et de ces services via le guichet mis à sa disposition par l’Agence nationale de la sécurité des systèmes d’information."
    4_prefix: "3.3.(d)"
    4_desc: "Le dirigeant exécutif de l’entité s’assure de la mise en œuvre des outils permettant de collecter les signalements remontés, en particulier par les sources suivantes : \n\t - Les employés de l’entité essentielle ; \n\t - Les clients et les usagers des activités et services mis en œuvre par l’entité essentielle ; \n\t - Les prestataires ou fournisseurs contractant avec l’entité essentielle."
    5_prefix: "3.3.(e)"
    5_desc: "Le dirigeant exécutif de l’entité essentielle s’assure de la définition et de la mise en œuvre des mécanismes permettant d’analyser et de qualifier les événements remontés et d’identifier les incidents potentiels ou avérés."
    6_prefix: "3.3.(f)"
    6_desc: "Le dirigeant exécutif de l’entité essentielle s’assure de la définition et de la mise en œuvre des mécanismes organisationnels et techniques permettant de réagir en cas d’incident et de limiter les conséquences sur la fourniture des services. \n Ces mécanismes sont repris, le cas échéant, dans la définition des plans de continuité et de reprise d’activité."
    7_prefix: "3.3.(g)"
    7_desc: "Après chaque incident majeur, le dirigeant exécutif de l’entité essentielle s’assure qu’une analyse des causes de l’incident a été réalisée. \n L’analyse des causes vise à définir et mettre en œuvre les mesures de sécurité permettant de limiter la vraisemblance d’un nouvel incident ou d’en réduire l’impact."
    8_prefix: "3.3.(h)"
    8_desc: "L’entité conserve les relevés techniques produits dans le cadre de la gestion des incidents et pouvant être utilisés comme éléments de preuve en cas de judiciarisation. Ces relevés techniques sont conservés hors ligne pour une durée pertinente au regard de la protection des données à caractère personnel et en particulier la finalité du traitement."
    9_prefix: "3.3.(i)"
    9_desc: "Un système d’information spécifique doit être mis en place pour traiter les incidents, notamment pour stocker les relevés techniques relatifs aux analyses des incidents. Ce système est cloisonné vis-à-vis du système d’information réglementé concerné par l’incident."
4:
  title: "Résilience"
  1:
    title: "L’entité dispose de capacité de continuité et de reprise d’activité"
    prefix: "4.1 Objectif de sécurité 18."
    desc: "Description de l'objectif de sécurité : \n\n La capacité de continuité et de reprise d’activité consiste, pour l’entité, en la mise en place : \n\t - de mécanismes de sauvegarde et de restauration opérationnels et testés régulièrement ; \n\t - de plans de continuité et de reprise d’activité. \n\nℹ️ Justification et risques associés : \n\n Pour l’atteinte de cet objectif, l’entité s’assure de disposer de moyens lui permettant, suite à un incident de sécurité, de maintenir ses activités ou ses services dans un mode dégradé et de faciliter le retour à la normale. En l’absence d’un tel objectif, le manque de préparation de l’entité combiné éventuellement à l’inefficacité des outils disponibles (par exemple : échec de la restauration des sauvegardes, échec de la bascule sur un site de secours) permet à l’incident de prendre de l’ampleur et d’aggraver ses conséquences jusqu’à ces dernières soient perceptibles des utilisateurs ou usagers (par exemple : dégradation ou interruption des activités ou services fournis par l’entité)."
    1_prefix: "4.1.(a)"
    1_desc: "L’entité définit et met en œuvre des procédures de sauvegarde et de restauration de ses systèmes d’information réglementés (SIR) et des données qu’ils manipulent."
    2_prefix: "4.1.(b)"
    2_desc: "Les mécanismes de sauvegarde sont dimensionnés pour répondre aux besoins de disponibilité associés aux différents services et aux différentes activités fournis par l’entité."
    3_prefix: "4.1.(c)"
    3_desc: "L’entité s’assure que le processus de sauvegardes est testé au minimum une fois par an. Ces tests visent notamment à vérifier la bonne réalisation des sauvegardes et leur bonne restauration."
    4_prefix: "4.1.(d)"
    4_desc: "Les sauvegardes sont protégées d’un incident les rendant inexploitables (par exemple : le stockage hors-ligne pour répondre à un incident de type rançongiciel)."
    5_prefix: "4.1.(e)"
    5_desc: "L’entité, pour chacun de ses activités et services, définit et documente la durée maximale d’interruption admissible (DMIA) et la perte de données maximale admissible (PDMA)."
    6_prefix: "4.1.(f)"
    6_desc: "L’entité définit et met en œuvre un plan de continuité d’activité (PCA) et un plan de reprise d’activité (PRA) adaptés aux scénarios de crises d’origine cyber et cohérent avec la durée maximale d’interruption admissible et la perte de données maximale admissible."
    7_prefix: "4.1.(g)"
    7_desc: "L’identification de ces mesures de continuité s’appuie notamment : \n\t - Sur la cartographie de l’écosystème (cf. Objectif de sécurité 4) ; \n\t - Sur la procédure de gestion des incidents pour détecter et réagir au plus tôt aux incidents ; \n\t - Sur la procédure de gestion des crises d’origine cyber pour permettre la reprise au plus tôt des services."
  2:
    title: "L’entité est en capacité de réagir aux crises d’origine cyber"
    prefix: "4.2 Objectif de sécurité 19."
    desc: "Description de l'objectif de sécurité : \n\n La capacité de réagir aux crises d’origine cyber consiste, pour l’entité, en la mise en place d’une organisation, de processus et d’outils adaptés à la gestion de ce type d’événements. \n\nℹ️ Justification et risques associés : \n\n Cet objectif permet à l’entité de se préparer, de s’organiser pour faire face à des événements adverses pouvant impacter les activités ou les services qu’elle fournit et de revenir rapidement à la normale limitant ainsi les conséquences pour l’entité. \n En l’absence d’un tel objectif, l’entité peut ne pas être en capacité de gérer les crises d’origine cyber se traduisant par une aggravation des conséquences liés à ces crises (par exemple : allongement de la durée de résolution et de retour à la normale) notamment sur les utilisateurs et les usagers en cas de dégradation ou d’interruption des activités et services fournis par l’entité. \n\nℹ️ Le recours à un prestataire d’assistance et de conseil en sécurité (PACS), qualifié par l’Agence nationale de la sécurité des systèmes d’information en application de l'article 10 du décret n° 2015-350 du 27 mars 2015 modifié, pour la préparation du dispositif de gestion des crises d’origine cyber et le suivi par l’entité du plan d’action issu de la prestation permettent de bénéficier d’une présomption de conformité à l’objectif."
    1_prefix: "4.2.(a)"
    1_desc: "L’entité s’assure de la définition, du maintien à jour et de la mise en œuvre d’une procédure de gestion de crises en cas d’incident de sécurité significatif sur les systèmes d’information réglementés."
    2_prefix: "4.2.(b)"
    2_desc: "L’entité s’assure du maintien à jour d’une liste des personnes mobilisables dans la gestion de la crise sur les sujets relatifs à la sécurité numérique ainsi que leurs coordonnées."
    3_prefix: "4.2.(c)"
    3_desc: "L’entité s’assure du maintien à jour d’un annuaire des parties prenantes externes à l’entité pertinente dans la gestion de la crise en s’appuyant sur la cartographie de l’écosystème. \n Ces informations sont tenues à la disposition des autorités nationales compétentes et en particulier de l’Agence nationale de la sécurité des systèmes d’information."
    4_prefix: "4.2.(d)"
    4_desc: "L’entité s’assure de la définition et de la mise en œuvre des mécanismes de retour d’expérience (RETEX) permettant d’identifier les axes d’amélioration et les mesures associées à mettre en œuvre suite à un entraînement, un exercice ou une crise réelle."
    5_prefix: "4.2.(e)"
    5_desc: "L’entité essentielle s’assure de la définition et de la mise en œuvre des critères permettant d’activer et de désactiver le dispositif de gestion de crise prenant en compte les menaces cyber."
    6_prefix: "4.2.(f)"
    6_desc: "L’entité essentielle s’assure de la définition et de la mise en œuvre des procédures et des mécanismes de gestion de la crise adaptés à la menace cyber en s’appuyant sur les recommandations de l’Agence nationale de la sécurité des systèmes d’information."
    7_prefix: "4.2.(g)"
    7_desc: "L’entité essentielle s’assure de la définition et de la mise en œuvre des mesures pour isoler, protéger et, le cas échéant, reconstruire les systèmes d’information réglementés concernés, activables en cas d’incident de sécurité significatif. \n Ces mesures prennent en compte les infrastructures, applicatifs et services numériques externalisés à des prestataires et sont mises en place en cohérence avec les plans de continuité et de reprise d’activité."
    8_prefix: "4.2.(h)"
    8_desc: "L’entité essentielle s’assure de la définition d’une stratégie de communication adaptée aux crises d’origine cyber, incluant des scénarios de crise, le schéma d’organisation de la communication de crise, les outils de pilotage de la communication et des éléments de langage sur des sujets sensibles ou de crise. Cette stratégie prend en compte les scénarios de menaces cyber identifiés."
    9_prefix: "4.2.(i)"
    9_desc: "L’entité essentielle s’assure de la disponibilité de moyens de communication de secours en temps de crise lorsque les moyens de communication habituels sont indisponibles."
  3:
    title: "L’entité dispose de moyens pour vérifier le fonctionnement de ses capacités opérationnelles"
    prefix: "4.3 Objectif de sécurité 20."
    desc: "Description de l'objectif de sécurité : \n\n La vérification des capacités opérationnelles consiste, pour l’entité, en la mise en place d’exercices et d’entraînements à intervalles planifiés pour tester la préparation de l’entité en cas d’incident de sécurité ou de crises d’origine cyber. \n\nℹ️ Justification et risques associés : \n\n L’atteinte de cet objectif permet à l’entité d’être familière avec les processus et mécanismes qu’elle met en œuvre pour accroître sa réactivité et améliorer sa gestion des incidents de sécurité ou des crises d’origine cyber. \n En l’absence d’un tel objectif, l’entité n’est pas préparée à la survenance d’un incident de sécurité ou de crises d’origine cyber notamment par la méconnaissance des responsabilités des personnes impliquées dans la gestion de ces événements, des procédures et processus existants pour les gérer. De plus, les mécanismes techniques appuyant la gestion des incidents de sécurité ou les crises d’origines qui n’ont pas été testés peuvent dysfonctionner au moment de les utiliser (par exemple : échec de la restauration des sauvegardes, échec d’une bascule sur un site de secours). \n\nℹ️ Le recours à un prestataire d’assistance et de conseil en sécurité (PACS), qualifié par l’Agence nationale de la sécurité des systèmes d’information en application de l'article 10 du décret n° 2015-350 du 27 mars 2015 modifié, pour la réalisation d’exercices de crise d’origine cyber et le suivi par l’entité du plan d’action issu de la prestation permettent de bénéficier d’une présomption de conformité à l’objectif."
    1_prefix: "4.3.(a)"
    1_desc: "L’entité s’assure de la sensibilisation et de l’entraînement des personnes mobilisables dans le dispositif de gestion des crises d’origine cyber."
    2_prefix: "4.3.(b)"
    2_desc: "L’entité définit et met en œuvre une stratégie d’entraînement qui comporte, au minimum, les éléments suivants : \n\t - Une liste des acteurs amenés à participer aux différents dispositifs exigés dans les présentes règles à entraîner et/ou à tester ; \n\t - Une liste d’exercices permettant d’entraîner ou de tester les capacités opérationnelles ; \n\t - Les moyens de vérification ou d’évaluation d’atteinte de ces objectifs ; \n\t - Les scénarios de risques ou d’attaques à tester en priorité ; \n\t - La comitologie de suivi de la stratégie."
    3_prefix: "4.3.(c)"
    3_desc: "Cette stratégie d’entraînement vise à tester les dispositifs mis en œuvre par l’entité essentielle en matière : \n\t - De gestion des alertes relatives aux incidents, aux vulnérabilités et menaces ; \n\t - De continuité et de reprise d’activité ; \n\t - De gestion des crises d’origine cyber."
    4_prefix: "4.3.(d)"
    4_desc: "L’entité décline cette stratégie dans la définition et la mise en œuvre d’un programme triennal d’entraînement et d’exercice. Ce programme précise notamment la fréquence de ces entraînements et exercices ainsi que leur nature et que leurs objectifs."
