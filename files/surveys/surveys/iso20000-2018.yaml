4:
  title: "Contexte de l’organisme"
  1_label: "Compréhension de l’organisme et de son contexte"
  1_desc: "L’organisme doit déterminer les facteurs externes et internes pertinents par rapport à sa finalité, et qui influent sur sa capacité à atteindre le ou les résultats attendus de son SMS.\n\nℹ️ NOTE\nLe mot «facteur» dans ce contexte peut désigner des facteurs qui ont un impact positif ou négatif. Ce sont là des facteurs importants pour l’organisme dans le contexte de sa capacité à fournir à ses clients des services ayant la qualité convenue."
  2_label: "Compréhension des besoins et attentes des parties intéressées"
  2_desc: "L’organisme doit déterminer:\n\t\t a. les parties intéressées qui sont pertinentes dans le cadre du SMS et au regard des services; \n\t\tb. les exigences de ces parties intéressées.\n\nℹ️ NOTE\nLes exigences des parties intéressées peuvent inclure le service, la performance, des exigences légales et réglementaires et des obligations contractuelles relatives au SMS et aux services."
  3_label: "Détermination du périmètre d’application du système de management des services"
  3_desc: "L’organisme doit déterminer les limites et l’applicabilité du SMS afin d’établir son périmètre d’application.\n Lorsque l'organisme établit ce périmètre, il doit prendre en compte: \n\t\ta. les facteurs externes et internes auxquels il est fait référence en 4.1; \n\t\tb. les exigences auxquelles il est fait référence en 4.2;\n\t\tc. les services fournis par l’organisme.\n La définition du périmètre d'application du SMS doit inclure les services contenus dans le périmètre et le nom de l’organisme qui gère et fournit les services.\n Le périmètre d’application du SMS doit être disponible et tenu à jour sous la forme d'une information documentée.\n\nℹ️ NOTE 1\nL’ISO/IEC 20000-3 fournit des recommandations relatives à la détermination du périmètre.\nℹ️ NOTE 2\nLa détermination du périmètre du SMS établit les services compris dans le périmètre. Ces derniers peuvent être tous les services fournis par l’organisme ou une partie d'entre eux."
  4_label: "Système de management des services"
  4_desc: "L'organisme doit établir, mettre en œuvre, tenir à jour et améliorer en continu un SMS, y compris les processus nécessaires et leurs interactions, en accord avec les exigences du présent document."
5:
  title: "Leadership"
  1_label: "Leadership et engagement"
  1_desc: "La direction doit démontrer son leadership et son engagement vis-à-vis du SMS en: \n\t\ta. s’assurant que la politique et les objectifs sont établis pour le système de management des services et qu'ils sont compatibles avec l’orientation stratégique de l’organisme; \n\t\tb. garantissant que le plan de gestion des services est créé, implémenté et tenu à jour pour appuyer la politique de gestion des services, atteindre les objectifs de gestion des services et satisfaire aux exigences de services; \n\t\tc. s’assurant que les niveaux d’autorité appropriés ont bien été attribués pour les prises de décisions relatives au SMS et aux services; \n\t\td. s’assurant que tout ce qui peut représenter une valeur pour l’organisme et ses clients a bien été déterminé; \n\t\te. s'assurant que les autres parties impliquées dans le cycle de vie des services sont bien maîtrisées; \n\t\tf. s’assurant que les exigences liées au SMS sont intégrées aux processus métiers de l’organisme; \n\t\tg. s’assurant que les ressources requises pour le SMS et les services sont disponibles; \n\t\th. communiquant sur l’importance de disposer d’une gestion des services efficace répondant aux objectifs de gestion des services, créant de la valeur et conforme aux exigences liées au SMS; \n\t\ti. veillant à ce que le SMS atteigne le ou les résultats attendus; \n\t\tj. dirigeant et soutenant les personnes pour qu’elles contribuent à l’efficacité du SMS et des services; \n\t\tk. promouvant l'amélioration continue du SMS et des services;\n\t\tl. soutenant les autres rôles managériaux pertinents afin de démontrer leurs responsabilités dans leurs domaines respectifs.\n\nℹ️ NOTE\nDans le présent document, il convient d'interpréter le terme «métier» au sens large, c'est-à-dire comme se référant aux activités liées à la finalité de l’organisme."
  2:
    title: "Politique"
    1_label: "Établissement de la politique de gestion des services"
    1_desc: "La direction doit établir une politique de gestion des services qui: \n\t\ta. est adaptée à la mission de l'organisme; \n\t\tb. fournit un cadre pour l’établissement des objectifs de gestion des services; \n\t\tc. inclut l'engagement de satisfaire aux exigences applicables; \n\t\td. inclut l’engagement pour l’amélioration continue du SMS et des services."
    2_label: "Communication relative à la politique de gestion des services"
    2_desc: "La politique de gestion des services doit: \n\t\ta. être tenue à jour sous la forme d’une information documentée; \n\t\tb. être communiquée au sein de l’organisme; \n\t\tc. être disponible vis-à-vis des parties intéressées, le cas échéant."
  3_label: "Rôles, responsabilités et autorités au sein de l’organisme"
  3_desc: "La direction doit s’assurer que les responsabilités et autorités des rôles pertinents dans le cadre du SMS et au regard des services sont attribuées et communiquées au sein de l’organisme. \nLa direction doit attribuer la responsabilité et l’autorité pour: \n\t\ta. s'assurer que le SMS est conforme aux exigences du présent document; \n\t\tb. rendre compte de la performance du SMS et des services à la direction."
6:
  title: "Planification"
  1:
    title: "Actions à mettre en œuvre face aux risques et opportunités"
    1_desc: "Dans le cadre de la planification de son SMS, l'organisme doit tenir compte des facteurs mentionnés en 4.1 et des exigences mentionnées en 4.2 et déterminer les risques et opportunités qu’il est nécessaire de prendre en compte pour:\n\t\ta. assurer que le SMS peut atteindre le ou les résultats attendus; \n\t\tb. prévenir ou réduire les effets indésirables; \n\t\tc. réaliser l’amélioration continue du SMS et des services."
    2_desc: "L'organisme doit déterminer et documenter :\n\ta. les risques liés à:\n\t\t1. l’organisme;\n\t\t2. la non-satisfaction des exigences de services;\n\t\t3. l’implication des autres parties dans le cycle de vie des services;\n\tb. l’impact des risques et opportunités associés au SMS et aux services, sur les clients; \n\tc. les critères d'acceptation des risques; \n\td. l’approche à adopter pour la gestion des risques."
    3_desc: "L'organisme doit planifier:\n\ta. les actions à mettre en œuvre face aux risques et opportunités, et leur ordre de priorité; \n\tb. comment \n\t\t1. intégrer et de mettre en œuvre ces actions au sein des processus de son SMS;\n\t\t2. évaluer l’efficacité de ces actions.\n\nℹ️ NOTE 1\nFace aux risques et opportunités, les options suivantes se présentent: éviter le risque, prendre ou augmenter le risque afin de saisir une opportunité, éliminer la source du risque, modifier la probabilité de son occurrence ou de ses conséquences en le réduisant au moyen d'actions convenues, partager le risque avec une autre partie ou accepter le risque sur la base d'une décision éclairée.\n\nℹ️ NOTE 2\nL’ISO 31000 fournit des principes et des recommandations générales relatives à la gestion des risques."
  2:
    title: "Objectifs de la gestion des services et planification des actions pour les atteindre"
    1_label: "Établissement des objectifs"
    1_desc: "L’organisme doit établir, aux fonctions et niveaux concernés, des objectifs de gestion des services. Les objectifs de gestion des services doivent: \n\t\ta. être en cohérence avec la politique de gestion des services;\n\t\tb. être mesurables;\n\t\tc. tenir compte des exigences applicables;\n\t\td. être surveillés;\n\t\te. être communiqués;\n\t\tf. être mis à jour en tant que de besoin.\nL'organisme doit conserver des informations documentées sur les objectifs liés à la gestion des services."
    2_label: "Planification pour atteindre les objectifs"
    2_desc: "Lorsque l'organisme planifie la façon dont ses objectifs de gestion des services seront atteints, il doit déterminer: \n\t\ta. ce qui sera fait; \n\t\tb. quelles ressources seront nécessaires; \n\t\tc. qui sera responsable; \n\t\td. les échéances;\n\t\te. comment les résultats seront évalués."
  3_label: "Planification du système de management des services"
  3_desc: "L’organisme doit créer, mettre en œuvre et maintenir un plan de gestion des services. La planification doit tenir compte de la politique de gestion des services, des objectifs de la gestion des services, des risques et opportunités, des exigences de services et des exigences spécifiées dans le présent document. Le plan de gestion des services doit contenir ou comprendre une référence concernant: \n\t\ta. la liste des services; \n\t\tb. les limitations connues qui peuvent impacter le SMS et les services; \n\t\tc. les obligations comme les politiques pertinentes, les normes, les exigences contractuelles, réglementaires et légales, et leur application au SMS et aux services; \n\t\td. les autorités et responsabilités relatives au SMS et aux services; \n\t\te. les ressources humaines, techniques, financières et d'information nécessaires à l'exécution du SMS et des services; \n\t\tf. l'approche à respecter pour la collaboration avec les autres parties impliquées dans le cycle de vie des services; \n\t\tg. les technologies utilisées à l'appui du SMS; \n\t\th. les moyens permettant de mesurer, d’auditer, de rendre compte et d'améliorer l'efficacité du SMS et des services. \nLes autres activités de planification doivent rester alignées sur le plan de gestion des services."
7:
  title: "Support du système de management des services"
  1_label: "Ressources"
  1_desc: "L’organisme doit identifier et fournir les ressources humaines, techniques, financières et d'information nécessaires à l’établissement, la mise en œuvre, la mise à jour et l’amélioration continue du SMS ainsi qu’à l’exécution des services afin de satisfaire aux exigences de services convenues et d’atteindre les objectifs de gestion des services."
  2_label: "Compétences"
  2_desc: "L'organisme doit: \n\t\ta. déterminer les compétences nécessaires des personnes effectuant, sous son contrôle, un travail qui a une incidence sur les performances et l'efficacité du SMS et des services; \n\t\tb. s’assurer que ces personnes sont compétentes sur la base d'une formation initiale ou continue ou d'une expérience appropriée; \n\t\tc. le cas échéant, mener des actions pour acquérir les compétences nécessaires et évaluer l’efficacité de ces actions;\n\t\td. conserver des informations documentées appropriées comme preuves desdites compétences.\n\nℹ️ NOTE\nLes actions envisageables peuvent notamment inclure la formation, l’encadrement ou la réaffectation du personnel en activité ou le recrutement, direct ou en sous-traitance, de personnes compétentes."
  3_label: "Sensibilisation"
  3_desc: "Les personnes effectuant un travail sous le contrôle de l'organisme doivent être sensibilisées: \n\t\ta. à la politique de gestion des services; \n\t\tb. aux objectifs de management des services; \n\t\tc. aux services pertinents pour leur travail; \n\t\td. à l'importance de leur contribution à l’efficacité du SMS, y compris aux effets bénéfiques d’une amélioration des performances; \n\t\te. aux répercussions d'un non-respect des exigences du SMS."
  4_label: "Communication"
  4_desc: "L’organisme doit déterminer les besoins de communication interne et externe pertinents pour le SMS et les services, y compris:\n\t\ta. sur quels sujets communiquer; \n\t\tb. à quels moments communiquer; \n\t\tc. avec qui communiquer; \n\t\td. comment communiquer;\n\t\te. qui sera responsable de la communication."
  5:
    title: "Informations documentées"
    1_label: "Généralités"
    1_desc: "Le SMS de l’organisme doit inclure:\n\t\ta. les informations documentées exigées par le présent document;\n\t\tb. les informations documentées que l’organisme juge nécessaires à l’efficacité du SMS.\n\nℹ️ NOTE\nL’étendue des informations documentées dans le cadre d’un SMS peut différer selon l’organisme en fonction de:\n\t- la taille de l’organisme, de ses domaines d’activité et de ses processus, produits et services;\n\t- la complexité des processus, des services et de leurs interfaces;\n\t- la compétence des personnes."
    2_label: "Création et mise à jour des informations documentées"
    2_desc: "Lors de la création et de la mise à jour des informations documentées, l'organisme doit s’assurer que les éléments suivants sont appropriés:\n\t\ta. identification et description (par exemple titre, date, auteur, numéro de référence);\n\t\tb. leur format (par exemple langue, version logicielle, graphiques) et support (par exemple électronique, papier);\n\t\tc. la revue effectuée (et leur approbation pour en déterminer la pertinence et l’adéquation)."
    3_prefix: "7.5.3.1"
    3_desc: "Maîtrise des informations documentées - Les informations documentées exigées par le SMS et par le présent document doivent être maîtrisées pour s'assurer:\n\t\ta. qu'elles sont disponibles et conviennent à l'utilisation, quand et là où elles sont nécessaires;\n\t\tb. qu'elles sont correctement protégées (par exemple, de toute perte de confidentialité, utilisation inappropriée ou perte d'intégrité)."
    4_prefix: "7.5.3.2"
    4_desc: "Maîtrise des informations documentées - Pour maîtriser les informations documentées, l'organisme doit mettre en œuvre les activités suivantes, quand elles sont applicables: \n\t\ta. distribution, accès, récupération et utilisation;\n\t\tb. stockage et protection, y compris préservation de la lisibilité;\n\t\tc. maîtrise des modifications (par exemple contrôle des versions);\n\t\td. conservation et élimination.\n\nLes informations documentées d’origine externe que l’organisme juge nécessaires à la planification et au fonctionnement du SMS doivent être identifiées comme il convient et maîtrisées.\n\nℹ️ NOTE\nL’accès peut impliquer une décision relative à l’autorisation de consulter les informations documentées uniquement, ou l’autorisation et l’autorité de consulter et modifier les informations documentées."
    5_prefix: "7.5.4"
    5_label: "Informations documentées du système de management des services"
    5_desc: "Les informations documentées relatives au SMS doivent comprendre les éléments suivants: \n\t\ta. le périmètre du SMS;\n\t\tb. la politique et les objectifs de gestion des services;\n\t\tc. le plan de gestion des services;\n\t\td. la politique de gestion des changements, la politique de sécurité de l'information et le ou les plans de continuité des services;\n\t\te. les processus du SMS de l’organisme;\n\t\tf. les exigences de services;\n\t\tg. le ou les catalogues des services;\n\t\th. le ou les accords sur les niveaux de services (SLA);\n\t\ti. les contrats signés avec des fournisseurs externes;\n\t\tj. les accords passés avec des fournisseurs internes ou des clients agissant en tant que fournisseur;\n\t\tk. les procédures qui sont requises par le présent document;\n\t\tl. les enregistrements requis permettant d’apporter des preuves de conformité aux exigences du présent document et au SMS de l’organisme.\n\nℹ️ NOTE\nL’Article 7.5.4 fournit une liste des documents clés dans le cadre d’un SMS. D'autres exigences spécifiées dans le présent document concernent des informations devant être maintenues en tant qu’informations documentées, qui doivent être documentées ou enregistrées. L’ISO/IEC 20000-2 fournit des recommandations supplémentaires."
  6_prefix: "7.6"
  6_label: "Connaissances"
  6_desc: "L’organisme doit déterminer et tenir à jour les connaissances nécessaires pour soutenir les opérations associées au SMS et aux services.\n\nLes connaissances doivent être pertinentes, utilisables et mises à la disposition des personnes concernées.\n\nℹ️ NOTE\nLes connaissances sont spécifiques à l’organisme, à son SMS, à ses services et à ses parties intéressées. Les connaissances sont utilisées et partagées pour soutenir les opérations associées au SMS et aux services, et atteindre les résultats attendus."
8:
  title: "Fonctionnement du système de management des services"
  1_label: "Planification et maîtrise opérationnelles"
  1_desc: "L’organisme doit planifier, mettre en œuvre et maîtriser les processus nécessaires pour satisfaire aux exigences et réaliser les actions déterminées en l’Article 6, en:\n\t\ta. établissant des critères de performance des processus sur la base des exigences;\n\t\tb. mettant en œuvre la maîtrise de ces processus conformément aux critères, et\n\t\tc. conservant des informations documentées dans une mesure suffisante pour avoir l’assurance que les processus ont été réalisés comme prévu. \nL’organisme doit maîtriser les modifications prévues du SMS, analyser les conséquences des modifications imprévues, et si nécessaire, mener des actions pour limiter tout effet négatif (voir 8.5.1). \nIl doit s'assurer que les processus externalisés sont maîtrisés (voir 8.2.3)."
  2:
    title: "Portefeuille des services"
    1_label: "Fourniture des services"
    1_desc: "L’organisme doit opérer le SMS en s'assurant de la coordination des activités requises et des ressources. L’organisme doit réaliser les activités requises pour la fourniture des services.\n\nℹ️ NOTE\nUn portefeuille des services est utilisé pour gérer la totalité du cycle de vie de tous les services y compris les services proposés, ceux en cours de développement, les services en production décrits dans le ou les catalogues des services et les services qui doivent être supprimés. La gestion du portefeuille de services garantit que le fournisseur de services dispose de la bonne combinaison de services. Les activités du portefeuille de services du présent document comprennent la planification des services, la maîtrise des parties impliquées dans le cycle de vie du service, la gestion du catalogue de services, la gestion des actifs et la gestion de la configuration."
    2_label: "Planification des services"
    2_desc: "Les exigences de services pour les services existants, les nouveaux services et les changements concernant les services doivent être déterminées et documentées. \n\nL’organisme doit déterminer la criticité des services sur la base des besoins de l’organisme, des clients, des utilisateurs et des autres parties intéressées. \n\nL’organisme doit déterminer et gérer les dépendances et les doublons entre les services. L’organisme doit, si besoin, proposer des changements pour aligner les services sur la politique et les objectifs de gestion des services et les exigences de service en tenant compte pour cela des limitations et des risques connus.\n\nL’organisme doit prioriser les demandes de changement et les propositions de nouveaux services ou de services modifiés pour s’aligner sur les besoins du métier et les objectifs de gestion des services, en tenant compte des ressources disponibles."
    3_prefix: "8.2.3.1"
    3_desc: "Maîtrise des parties impliquées dans le cycle de vie du service - L’organisme reste responsable vis-à-vis des exigences spécifiées dans le présent document et pour la fourniture des services, indépendamment de la partie impliquée dans la réalisation des activités qui contribuent au cycle de vie du service. \n\nL'organisme doit déterminer et appliquer des critères pour évaluer et sélectionner les autres parties impliquées dans le cycle de vie des services. Les autres parties peuvent être un fournisseur externe, un fournisseur interne ou un client agissant en tant que fournisseur. \n\nLes autres parties ne doivent pas fournir ou opérer tous les services, les composants de services ou les processus dans le périmètre du SMS. \n\nL'organisme doit déterminer et documenter:\n\t\ta. les services fournis ou opérés par d'autres parties;\n\t\tb. les composants de services fournis ou opérés par d'autres parties;\n\t\tc. les processus, ou parties de processus dans le SMS de l’organisme qui sont opérés par d'autres parties. \n\nL’organisme doit intégrer les services, les composants de services et les processus du SMS qui sont fournis ou exécutés par l’organisme ou d’autres parties afin de satisfaire aux exigences de services. L’organisme doit coordonner les activités avec les autres parties impliquées dans le cycle de vie des services, en incluant les activités de planification, conception, transition, fourniture et amélioration des services."
    4_prefix: "8.2.3.2"
    4_desc: "Maîtrise des parties impliquées dans le cycle de vie du service - L’organisme doit définir et appliquer les contrôles pertinents suivants aux autres parties: \n\t\ta. la mesure et l’évaluation de la performance des processus;\n\t\tb. la mesure et l’évaluation de l’efficacité des services et des composants de services pour satisfaire aux exigences du service.\n\nℹ️ NOTE\nL’ISO/IEC 20000-3 fournit des recommandations pour la maîtrise des autres parties impliquées dans le cycle de vie des services."
    5_prefix: "8.2.4"
    5_label: "Gestion du catalogue de services"
    5_desc: "L’organisme doit créer et tenir à jour un ou plusieurs catalogues de services. Le ou les catalogues de services doivent contenir les informations destinées à l’organisme, aux clients, aux utilisateurs et aux autres parties intéressées pour décrire les services, les résultats attendus et les dépendances entre les services.\n\n L’organisme doit fournir à ses clients, utilisateurs et autres parties intéressées un accès aux parties appropriées du catalogue de services."
    6_prefix: "8.2.5"
    6_label: "Gestion des actifs"
    6_desc: "L’organisme doit s’assurer que les actifs utilisés pour fournir les services sont gérés de manière à pouvoir répondre aux exigences de services et aux obligations prévues en 6.3 c).\n\nℹ️ NOTE 1\nLes normes ISO 55001 et ISO/IEC 19770-1 spécifient des exigences pour aider à la mise en œuvre et à l'exploitation des actifs ainsi qu'à la gestion des actifs issus des technologies de l’information.\n\nℹ️ NOTE 2\nVoir aussi la gestion des configurations lorsqu’un actif est également un élément de configuration (CI)."
    7_prefix: "8.2.6"
    7_label: "Gestion des configurations"
    7_desc: "Les types de CI doivent être définis. Les services doivent être classifiés en tant que CI. \n\nLes informations de configuration doivent être enregistrées à un niveau de détail approprié à la criticité et au type de service. L'accès aux informations de configuration doit être maîtrisé. Les informations de configuration enregistrées pour chaque CI doivent inclure:\n\t\ta. une identification unique; \n\t\tb. le type de CI;\n\t\tc. la description du CI;\n\t\td. la relation avec d’autres CI;\n\t\te. le statut. \n\nLes CI doivent être maîtrisés. Tout changement apporté aux CI doit être tracé et vérifiable afin d'assurer l'intégrité des informations de configuration. Les informations de configuration doivent être mises à jour après le déploiement des changements apportés aux CI. \n\nÀ intervalles planifiés, l’organisme doit vérifier la fiabilité des informations de configuration. Si des défaillances sont identifiées, l’organisme doit prendre les mesures nécessaires. \n\nLes informations de configuration doivent être mises à la disposition des autres activités de gestion des services selon leurs besoins."
  3:
    title: "Relations et accords"
    1_label: "Généralités"
    1_desc: "L’organisme peut recourir à des fournisseurs pour:\n\t\ta. réaliser ou exploiter des services;\n\t\tb. réaliser ou exploiter des composants de services;\n\t\tc. exécuter des processus ou parties de processus, compris dans son SMS.\n\n La Figure 2 présente l'utilisation, les accords et les relations entre la gestion des relations commerciales, la gestion des niveaux de services et la gestion des fournisseurs.\n\nℹ️ NOTE 1\nL’ISO/IEC 20000-3 fournit des exemples de relations dans la chaîne logistique et leur applicabilité et périmètre éventuels.\n\nℹ️ NOTE 2\nDans le cadre du présent document, la gestion des fournisseurs exclut les appels d’offres de fournisseurs."
    2_label: "Gestion des relations commerciales"
    2_desc: "Les clients, les utilisateurs et les autres parties intéressées par les services doivent être identifiés et documentés. L’organisme doit désigner un ou plusieurs individus responsables de la gestion des relations client et du maintien de la satisfaction client.\n\n L’organisme doit établir les règles de communication avec ses clients et les autres parties intéressées. La communication doit promouvoir la compréhension de l'environnement métier qui évolue dans lequel les services sont opérés et doit permettre à l’organisme de répondre aux exigences liées aux services nouveaux ou modifiés.\n\n L’organisme doit passer en revue à intervalles planifiés les tendances des performances et les résultats des services.\n\n L’organisme doit mesurer à intervalles planifiés la satisfaction par rapport aux services auprès d’un échantillon représentatif de clients. Les résultats doivent être analysés, passés en revue afin d'identifier les opportunités d'amélioration, et rapportés.\n\n Les réclamations concernant les services doivent être enregistrées, closes et faire l'objet d'un rapport. Lorsqu'une réclamation concernant les services n'est pas résolue par les voies normales, une procédure d'escalade doit être fournie."
    3_label: "Gestion des niveaux de services"
    3_desc: "L’organisme et le client doivent convenir des services à fournir.\n\n Pour chaque service fourni, l’organisme doit établir un ou plusieurs accords sur les niveaux de services (SLA) sur la base des exigences de services documentées. Les SLA doivent inclure des objectifs de niveaux de service, des limites et des exceptions relatives à la charge de travail.\n\nÀ intervalles planifiés, l’organisme doit surveiller, passer en revue et rendre compte:\n\t\ta. des performances en les comparant aux objectifs de niveaux de services;\n\t\tb. des changements réels et périodiques de la charge de travail en les comparant aux limites de charge de travail des SLA.\n\n Si les objectifs de niveaux de service ne sont pas atteints, l’organisme doit identifier les opportunités d’amélioration.\n\nℹ️ NOTE \nL’accord sur les services à fournir conclu entre l’organisme et ses clients peut prendre de nombreuses formes telles qu’un accord documenté, un procès-verbal de réunion relatant un accord oral, un accord transmis par courriel ou un accord concernant les termes du service."
    4_prefix: "8.3.4.1"
    4_label: "Gestion des fournisseurs - Gestion des fournisseurs externes"
    4_desc: "L’organisme doit désigner un ou plusieurs individus responsables de la gestion des relations, des contrats et de la performance des fournisseurs externes.\n\n Pour chaque fournisseur externe, l’organisme doit approuver un contrat documenté. Ce contrat doit contenir ou inclure une référence: \n\t\ta. au périmètre des services, des composants de services, des processus, ou parties des processus, devant être fournis ou exploités par le fournisseur externe;\n\t\tb. aux exigences à satisfaire par le fournisseur externe;\n\t\tc. aux objectifs des niveaux de service ou aux autres obligations contractuelles; \n\t\td. aux autorités et responsabilités de l’organisme et du fournisseur externe.\n\n L’organisme doit évaluer si les objectifs de niveaux de service ou des autres obligations contractuelles du fournisseur externe sont bien alignés sur les SLA avec les clients, et gérer les risques identifiés.\n\n L’organisme doit définir et gérer les interfaces avec le fournisseur externe.\n\n À intervalles planifiés, l’organisme doit surveiller la performance du fournisseur externe. Si les objectifs des niveaux de service ou aux autres obligations contractuelles ne sont pas atteints, l’organisme doit s’assurer que les opportunités d'amélioration sont identifiées.\n\n À intervalles planifié, l’organisme doit passer en revue le contrat au regard des exigences de services courantes. Les changements identifiés au contrat doivent être évalués au regard de l’impact du changement sur le SMS et les services avant d'être approuvées.\n\n Les conflits entre l’organisme et le fournisseur externe doivent être enregistrés et gérés jusqu'à leur clôture."
    5_prefix: "8.3.4.2"
    5_label: "Gestion des fournisseurs - Gestion des fournisseurs internes et des clients agissant en tant que fournisseur"
    5_desc: "Pour chaque fournisseur interne ou client agissant en tant que fournisseur, l’organisme doit développer, valider et tenir à jour un accord documenté définissant les objectifs de niveaux de services, les autres engagements, les activités et les interfaces entre les deux parties.\n\n À intervalles planifiés, l’organisme doit surveiller les performances du fournisseur interne ou du client agissant en tant que fournisseur. Si les objectifs des niveaux de service ou aux autres engagements convenus ne sont pas atteints, l’organisme doit s’assurer que les opportunités d'amélioration sont identifiées."
  4:
    title: "Offre et demande"
    1_label: "Budgétisation et comptabilisation des services"
    1_desc: "L’organisme doit budgéter et comptabiliser les services ou groupes de services conformément à ses politiques et processus de gestion financière.\n\n Les coûts doivent être budgétisés afin de permettre un contrôle financier et des prises de décisions efficaces pour les services. \n\nÀ intervalles planifiés, l’organisme doit surveiller et rendre compte des coûts réels par rapport au budget, passer en revue les prévisions financières et gérer les coûts.\n\nℹ️ NOTE \nUn grand nombre d’organismes, mais pas tous, facturent leurs services. La budgétisation et la comptabilisation des services dans le cadre du présent document excluent toute facturation afin d’assurer leur applicabilité à tous les organismes."
    2_label: "Gestion de la demande"
    2_desc: "À intervalles planifiés, l’organisme doit: \n\t\ta. déterminer les demandes de services actuelles et prévoir les futures demandes;\n\t\tb. surveiller et rendre compte de la demande et de la consommation de services.\n\nℹ️ NOTE \nLa gestion de la demande est responsable de la bonne compréhension de la demande de services actuelle et future du client. La gestion de la capacité travaille avec la gestion de la demande pour planifier et fournir une capacité suffisante permettant de répondre à la demande."
    3_label: "Gestion de la capacité"
    3_desc: "Les exigences relatives à la capacité des ressources humaines, techniques, financières et d'information doivent être déterminées, documentées et tenues à jour en tenant compte des exigences de service et de performance.\n\n L’organisme doit planifier la capacité pour qu'elle comprenne: \n\t\ta. la capacité actuelle et prévue basée sur la demande de services;\n\t\tb. l’impact attendu sur la capacité des objectifs de niveaux de services convenus, sur les exigences de disponibilité et de continuité des services;\n\t\tc. les calendriers et les seuils des changements de capacité des services.\n\n L’organisme doit fournir une capacité suffisante afin de satisfaire aux exigences de capacité et de performances qui ont été approuvées. Il doit surveiller l’utilisation de la capacité, analyser les données de capacité et de performances, et identifier les opportunités d’amélioration des performances."
  5:
    title: "Conception, construction et transition du service"
    1_prefix: "8.5.1.1"
    1_label: "Gestion des changements - Politique de gestion des changements"
    1_desc: "Une politique de gestion des changements doit être établie et documentée, pour définir: \n\t\ta. les composants de services et les autres éléments contrôlés par la gestion des changements;\n\t\tb. les catégories de changement, y compris les changements urgents, et leur mode de gestion imposée;\n\t\tc. les critères déterminant les changements pouvant potentiellement avoir un impact majeur sur les clients ou les services."
    2_prefix: "8.5.1.2"
    2_label: "Gestion des changements - Initialisation des changements"
    2_desc: "Les demandes de changement, y compris les propositions d’ajout, de retrait ou de transfert de services doivent être enregistrées et classifiées.\n\n L’organisme doit utiliser le processus de conception et transition du service décrit en 8.5.2 pour: \n\t\ta. les nouveaux services pouvant avoir un impact majeur sur les clients et les autres services tel que déterminés par la politique de gestion des changements;\n\t\tb. les changements dans les services pouvant potentiellement avoir un impact majeur sur les clients et les autres services tel que déterminés par la politique de gestion des changements;\n\t\tc. les catégories de changements qui doivent être gérées par le processus de conception et transition du service conformément à la politique de gestion des changements;\n\t\td. la suppression d’un service;\n\t\te. le transfert d’un service existant de l’organisme vers un client ou une autre partie;\n\t\tf. le transfert d’un service existant d'un client ou une autre partie vers l’organisme.\n\n L'évaluation, l'approbation, la planification et la revue des services nouveaux ou modifiés couverts par le paragraphe 8.5.2 doivent être gérées par les activités de gestion des changements définies en 8.5.1.3.\n\n Les demandes de changements non gérées par les dispositions prévues en 8.5.2 doivent l'être par les activités de gestion des changements définies en 8.5.1.3."
    3_prefix: "8.5.1.3"
    3_label: "Gestion des changements - Activités de gestion des changements"
    3_desc: "L’organisme et les parties intéressées doivent prendre des décisions concernant l'approbation et la priorité des demandes de changements. La prise de décision doit prendre en compte les risques, les bénéfices des métiers, la faisabilité et l'impact financier. La prise de décision doit aussi tenir compte des impacts éventuels des changements sur:\n\t\ta. les services existants;\n\t\tb. les clients, les utilisateurs et les autres parties intéressées;\n\t\tc. les politiques et plans exigés par le présent document; \n\t\td. la capacité, la disponibilité du service, la continuité du service et la sécurité de l'information;\n\t\te. les autres demandes de changements, les mises en production et les plans de déploiement.\n\n Les changements approuvés doivent être préparés, vérifiés et, lorsque cela est possible, soumis à essai. Les dates et autres détails de déploiement proposés pour les changements approuvés doivent être communiqués aux parties intéressées.\n\n Les activités pour réaliser un retour arrière sur un changement ayant échoué ou pour apporter un correctif à un tel changement doivent être planifiées et, lorsque cela est possible, soumises à essai. Les changements ayant échoué doivent faire l'objet d'une investigation et les actions consécutives qui ont été approuvées doivent être entreprises.\n\n L’organisme doit passer en revue l'efficacité des changements et entreprendre les actions approuvées avec les parties intéressées.\n\nA intervalles planifiés, les enregistrements des demandes de changements doivent être analysés afin de repérer des tendances. Les résultats et les conclusions tirées de l'analyse doivent être enregistrés et passés en revue afin d'identifier les opportunités d'amélioration."
    4_prefix: "8.5.2.1"
    4_label: "Conception et transition du service - Planification des services nouveaux ou modifiés"
    4_desc: "La planification doit utiliser les exigences de services pour les services nouveaux ou modifiés déterminés en 8.2.2 et doit inclure ou contenir une référence concernant:\n\t\ta. les autorités et les responsabilités pour les activités de conception, de construction et de transition;\n\t\tb. les activités qui doivent être effectuées par l’organisme et les autres parties avec leurs calendriers;\n\t\tc. les ressources humaines, techniques, financières et d'information;\n\t\td. les dépendances par rapport à d'autres services;\n\t\te. les tests nécessaires aux services nouveaux ou modifiés;\n\t\tf. les critères d'acceptation des services;\n\t\tg. les résultats attendus de la fourniture des services nouveaux ou modifiés, exprimés en termes mesurables;\n\t\th. l’impact sur le SMS, les autres services, les changements planifiés, les clients, les utilisateurs et les autres parties intéressées.\n\n Pour les services qui doivent être supprimés, la planification doit de plus inclure la ou les dates de suppression des services et des activités d’archivage, de destruction ou de transfert de données, des informations documentées et des composants de services.\n\n Pour les services qui doivent être transférés, la planification doit de plus inclure la ou les dates de transfert des services et les activités de transfert des données, des informations documentées, des connaissances et des composants de services.\n\n Les CI impactés par des services nouveaux ou modifiés doivent être gérés dans le cadre du processus de gestion des configurations."
    5_prefix: "8.5.2.2"
    5_label: "Conception et transition du service - Conception"
    5_desc: "Les services nouveaux ou modifiés doivent être conçus et documentés afin de satisfaire aux exigences de services déterminées en 8.2.2. La conception doit contenir les éléments pertinents suivants: \n\t\ta. les autorités et les responsabilités des parties impliquées dans la fourniture des services nouveaux ou modifiés;\n\t\tb. les exigences de changements concernant les ressources humaines, techniques, financières et d'information;\n\t\tc. les exigences en matière de formation initiale et professionnelle et d’expérience;\n\t\td. les SLA nouveaux ou modifiés, les contrats et autres accords documentés qui accompagnent les services;\n\t\te. les changements affectant le SMS, y compris les ajouts ou modifications dans les politiques, plans, processus, procédures, mesures et connaissances;\n\t\tf. l’impact sur les autres services;\n\t\tg. les mises à jour du ou des catalogue de services."
    6_prefix: "8.5.2.3"
    6_label: "Conception et transition du service - Construction et transition"
    6_desc: "Les services nouveaux ou modifiés doivent être construits et soumis à essai afin de vérifier qu’ils satisfont aux exigences de services, qu’ils sont conformes à la conception documentée et qu’ils répondent aux critères d'acceptation des services. Si les critères d'acceptation de services ne sont pas satisfaits, l’organisme et les parties intéressées doivent décider des actions nécessaires à entreprendre et du déploiement. \n\nLe processus de gestion des mises en production et de leur déploiement doit être utilisé afin de déployer dans l'environnement de production les services nouveaux ou modifiés qui ont été approuvés. \n\nUne fois les activités de transition terminées, l’organisme doit rendre compte aux parties intéressées des résultats obtenus au regard des résultats attendus."
    7_prefix: "8.5.3"
    7_label: "Gestion des mises en production et de leur déploiement"
    7_desc: "L’organisme doit définir les types de mises en production, y compris les mises en production urgentes, leur fréquence et leur mode de gestion imposée.\n\n L’organisme doit planifier le déploiement dans l'environnement de production des services nouveaux ou modifiés et des composants de services. La planification doit être coordonnée avec le processus de gestion des changements et doit inclure les références aux demandes de changements associées, aux erreurs connues ou aux problèmes qui ont été clôturés par la mise en production. La planification doit inclure les dates de déploiement de chaque mise en production, les livrables et les méthodes de déploiement.\n\n La mise en production doit être vérifiée par rapport aux critères d'acceptation documentés et doit être approuvée avant tout déploiement. Si les critères d'acceptation ne sont pas satisfaits, l’organisme et les parties intéressées doivent décider des actions nécessaires à entreprendre et du déploiement.\n\n Avant le déploiement d’une mise en production dans l'environnement de production, une configuration de référence doit être créée pour les CI impactés par la mise en production.\n\n La mise en production doit être déployée dans l'environnement de production de manière que l'intégrité des services et des composants de service soit maintenue. \n\nLe succès ou l'échec des mises en production doit être surveillé et analysé. Les mesures doivent inclure les incidents relatifs à chaque mise en production pendant un laps de temps qui suit le déploiement de cette mise en production. Les résultats et les conclusions tirées de l'analyse doivent être enregistrés et passés en revue afin d'identifier les opportunités d'amélioration.\n\n Les informations relatives au succès ou à l'échec des mises en production, ainsi que les dates des mises en production futures, doivent être mises à disposition des autres activités de gestion des services selon les besoins."
  6:
    title: "Résolution et satisfaction"
    1_label: "Gestion des incidents"
    1_desc: "Les incidents doivent être: \n\t\ta. enregistrés et classifiés;\n\t\tb. classés par priorité en prenant en considération l’impact et l’urgence;\n\t\tc. soumis à une procédure d'escalade, si besoin;\n\t\td.  résolus;\n\t\te. clôturés.\n\nLes enregistrements des incidents doivent être mis à jour en ajoutant les mesures prises. \n\nL’organisme doit déterminer les critères permettant d’identifier un incident majeur. Les incidents majeurs doivent être classifiés et gérés conformément à une procédure documentée. La direction doit être tenue informée de tout incident majeur. L’organisme doit attribuer les responsabilités pour gérer chaque incident majeur. Après résolution de l’incident, l’incident majeur doit faire l'objet d'un rapport et être passé en revue afin d'identifier les opportunités d'amélioration."
    2_prefix: "8.6.2"
    2_label: "Gestion de la demande de services"
    2_desc: "Les demandes de services doivent être:\n\t\ta. enregistrées et classifiées;\n\t\tb. classées par priorité;\n\t\tc. traitées;\n\t\td. clôturées. Les enregistrements des demandes de services doivent être mis à jour en ajoutant les mesures prises.\n\n Les instructions spécifiques de travail pour le traitement des demandes de services doivent être à la disposition des personnes impliquées dans le traitement des demandes de services."
    3_prefix: "8.6.3"
    3_label: "Gestion des problèmes"
    3_desc: "L’organisme doit analyser les données et les tendances concernant les incidents afin d'identifier les problèmes. L’organisme doit analyser la cause première et déterminer les éventuelles actions à mettre en œuvre pour éviter la survenance ou la répétition des incidents.\n\nLes problèmes doivent être:\n\t\ta. enregistrés et classifiés;\n\t\tb. classés par priorité;\n\t\tc. soumis à une procédure d'escalade, si besoin;\n\t\td. résolus, si possible;\n\t\te. clôturés.\n\nLes enregistrements des problèmes doivent être mis à jour en ajoutant les mesures prises. Les changements nécessaires à la résolution d’un problème doivent être gérés conformément à politique de gestion des changements.\n\nLorsque la cause première a été identifiée mais que le problème n'a pas été définitivement résolu, l’organisme doit déterminer les actions à mener pour réduire ou éliminer l'impact du problème sur les services. Les erreurs connues doivent être enregistrées. Les informations à jour sur les erreurs connues et les résolutions des problèmes doivent être mises à disposition des autres activités de gestion des services selon leurs besoins.\n\nÀ intervalles planifiés, l'efficacité de la résolution des problèmes doit être surveillée, passée en revue et faire l'objet d'une fourniture de rapports."
  7:
    title: "Garantie de services"
    1_label: "Gestion de la disponibilité des services"
    1_desc: "À intervalles planifiés, les risques relatifs à la disponibilité des services doivent être évalués et documentés. L'organisme doit déterminer les exigences et les objectifs de disponibilité du service. Les exigences approuvées par les parties doivent prendre en compte les exigences métier pertinentes, les exigences de services, les SLA et les risques. \n\nLes exigences et les objectifs de disponibilité des services doivent être documentés et tenus à jour.\n\nLa disponibilité des services doit être surveillée. Les résultats doivent être enregistrés et comparés aux objectifs. Toute indisponibilité non planifiée doit faire l'objet d'une enquête et les actions nécessaires doivent être entreprises.\n\nℹ️ NOTE \nLes risques identifiés en 6.1 peuvent fournir des éléments d'entrée aux risques relatifs à la disponibilité du service, à la continuité du service et à la sécurité de l'information."
    2_label: "Gestion de la continuité des services"
    2_desc: "À intervalles planifiés, les risques liés à la continuité des services doivent être évalués et documentés. L'organisme doit déterminer les exigences de continuité des services. Les exigences approuvées par les parties doivent prendre en compte les exigences métier pertinentes, les exigences de services, les SLA et les risques. \n\nL’organisme doit créer, mettre en œuvre et tenir à jour un ou plusieurs plans de continuité des services. Le ou les plans de continuité des services doivent inclure ou contenir une référence concernant:\n\t\ta. les critères et les responsabilités d’invocation de la continuité des services;\n\t\tb. les procédures à mettre en œuvre en cas de perte majeure de services;\n\t\tc. les objectifs de disponibilité des services lorsque le plan de continuité des services est invoqué;\n\t\td. les exigences de rétablissement des services;\n\t\te. les procédures permettant un retour aux conditions normales de fonctionnement.\n\n Le ou les plans de continuité des services et la liste des personnes à contacter doivent être accessibles lorsque l'accès aux lieux d'exécution des services normaux est devenu impossible. \n\nÀ intervalles planifiés, le ou les plans de continuité des services doivent être soumis à essai en tenant compte des exigences de continuité des services. Le ou les plans de continuité des services doit être soumis à essai chaque fois qu'un changement majeur est apporté dans l'environnement de production des services. Les résultats des tests doivent être enregistrés. Des revues doivent être conduites après chaque test et après la mise en application du ou des plans de continuité des services. Si des défaillances sont identifiées, l’organisme doit prendre les mesures nécessaires. \n\nSi le ou les plans de continuité des services ont été invoqués, l’organisme doit établir un rapport sur la cause, l’impact et le rétablissement."
    3_prefix: "8.7.3.1"
    3_label: "Management de la sécurité de l'information - Politique de sécurité de l'information"
    3_desc: "Un membre de la direction ayant l'autorité appropriée doit approuver une politique de sécurité de l'information pertinente pour l’organisme. La politique de sécurité de l'information doit être documentée en prenant en compte les exigences de services et les obligations prévues en 6.3 c).\n\nLa politique de sécurité de l'information doit être rendue disponible comme il convient. Il doit communiquer sur l’importance de se conformer à cette politique et de l'appliquer au SMS et aux services aux personnes concernées:\n\t\ta. en son sein;\n\t\tb. chez les clients et utilisateurs;\n\t\tc. chez les fournisseurs externes, les fournisseurs internes et les autres parties intéressées."
    4_prefix: "8.7.3.2"
    4_label: "Management de la sécurité de l'information - Contrôles de la sécurité de l'information"
    4_desc: "À intervalles planifiés, les risques en rapport avec la sécurité de l’information pour le SMS et les services doivent être évalués et documentés. Les contrôles relatifs à la sécurité de l’information doivent être déterminés, mis en œuvre et exécutés pour appuyer la politique de sécurité de l’information et traiter les risques de sécurité de l’information identifiés. Les décisions concernant les contrôles de la sécurité de l'information doivent être documentées. \n\nL’organisme doit obtenir un accord et mettre en œuvre des contrôles de sécurité de l’information pour faire face aux risques en rapport avec la sécurité de l’information liés à des organisations externes. \n\nL’organisme doit surveiller et passer en revue l'efficacité des contrôles de sécurité de l’information et prendre les mesures qui s’imposent."
    5_prefix: "8.7.3.3"
    5_label: "Management de la sécurité de l'information - Incidents affectant la sécurité de l'information"
    5_desc: "Les incidents liés à la sécurité de l'information doivent être:\n\t\ta. enregistrés et classifiés;\n\t\tb. classifiés par une priorité correspondant au risque pouvant affecter la sécurité de l’information;\n\t\tc. soumis à une procédure d'escalade, si besoin;\n\t\td. résolus;\n\t\te. clôturés.\n\n L’organisme doit analyser les incidents affectant la sécurité de l'information par type, volume et impact sur le SMS, services et parties intéressées. Les incidents en rapport avec la sécurité de l'information doivent faire l'objet d'un rapport et être passés en revue afin d'identifier les opportunités d'amélioration.\n\nℹ️ NOTE \nLa série de normes ISO/IEC  27000 spécifie des exigences et fournit des recommandations pour aider à la mise en œuvre et à l'exploitation d'un système de management de la sécurité de l'information. L’ISO/ IEC 27013 fournit des recommandations relatives à l’intégration de l’ISO/IEC 27001 et de l’ISO/IEC 20000-1 (le présent document)."
9:
  title: "Évaluation des performances"
  1_label: "Surveillance, mesures, analyse et évaluation"
  1_desc: "L’organisme doit déterminer:\n\t\ta. ce qu'il est nécessaire de surveiller et de mesurer pour le SMS et les services;\n\t\tb. les méthodes de surveillance, de mesurage, d'analyse et d'évaluation, selon le cas, pour assurer la validité des résultats;\n\t\tc. quand la surveillance et les mesures doivent être effectuées;\n\t\td. quand les résultats de la surveillance et de la mesure doivent être analysés et évalués.\n\nL'organisme doit conserver des informations documentées pertinentes comme preuves des résultats.\n\nIl doit évaluer le SMS, les performances par rapport aux objectifs de gestion des services et l’efficacité du SMS. L’organisme doit évaluer l’efficacité des services par rapport aux exigences de services."
  2:
    title: "Audit interne"
    1_desc: "L’organisme doit réaliser des audits internes à des intervalles planifiés pour fournir des informations permettant de déterminer si le SMS:\n\ta. est conforme: \n\t\t1. à ses propres exigences concernant le SMS;\n\t\t2. aux exigences du présent document; \n\tb. est efficacement mis en œuvre et tenu à jour."
    2_desc: "L'organisme doit: \n\ta.planifier, établir, mettre en œuvre et maintenir un ou plusieurs programmes d'audit, couvrant notamment la fréquence, les méthodes, les responsabilités, les exigences de planification et le compte rendu, qui doivent tenir compte de: \n\t\t1. l’importance des processus concernés;\n\t\t2. des changements ayant un impact sur l’organisme;\n\t3. des résultats des audits précédents;\n\tb. définir les critères d’audit et le périmètre de chaque audit;\n\tc. sélectionner des auditeurs et réaliser des audits pour assurer l'objectivité et l'impartialité du processus d'audit;\n\td. veiller à ce que les résultats des audits soient rapportés à la direction concernée;\n\te. conserver des informations documentées comme preuves de la mise en œuvre du ou des programmes d’audit et des résultats d’audit.\n\nℹ️ NOTE\nL'ISO 19011 fournit des lignes directrices pour l'audit des systèmes de management."
  3_prefix: "9.3"
  3_label: "Revue de direction"
  3_desc: "À intervalles planifiés, la direction doit procéder à la revue du SMS et des services mis en place par l’organisme, afin de s’assurer qu’ils sont toujours appropriés, adaptés et efficaces. La revue de direction doit prendre en compte:\n\ta. l’état d'avancement des actions décidées à l’issue des revues de direction précédentes;\n\tb. les modifications des facteurs externes et internes pertinents pour le SMS;\n\tc. les informations sur la performance et l'efficacité du SMS, y compris les tendances concernant:\n\t\t1. les non-conformités et les actions correctives;\n\t\t2. les résultats de l'évaluation de la surveillance et des mesures;\n\t\t3. les résultats d’audit;\n\td. les opportunités d’amélioration continue;\n\te. les retours d’information des clients et des autres parties intéressées;\n\tf. l’adhésion et la pertinence de la politique de gestion des services et des autres politiques requises par le présent document;\n\tg. l'atteinte des objectifs de gestion des services;\n\th. les performances des services;\n\ti. les performances des autres parties impliquées dans la fourniture des services;\n\tj. les niveaux actuels et prévus des ressources humaines, techniques, financières et d'information, et les capacités en ressources humaines et techniques, actuelles et prévues;\n\tk. les résultats de l’évaluation des risques et l'efficacité des actions mises en œuvre face aux risques et opportunités;\n\t. les changements qui peuvent avoir un impact sur le SMS et les services.\n\n Les éléments de sortie de la revue de direction doivent inclure les décisions relatives aux opportunités d’amélioration continue et aux éventuels changements à apporter au SMS et aux services.\n\n L’organisme doit conserver des informations documentées comme preuves des éléments de sortie des revues de direction."
  4_prefix: "9.4"
  4_label: "Fourniture des rapports de service"
  4_desc: "L’organisme doit déterminer les exigences en matière de comptes rendus et leur objectif. \n\nLes comptes rendus sur les performances et l’efficacité du SMS et des services doivent être élaborés à l’aide des informations issues des activités du SMS et de la fourniture des services. Les comptes rendus sur les services doivent inclure les tendances. \n\nL’organisme doit prendre des décisions et agir en fonction des résultats des rapports de services. Les actions validées doivent être communiquées aux parties intéressées.\n\nℹ️ NOTE\nLes rapports requis sont spécifiés dans les articles du présent document. D’autres rapports peuvent également être produits."
10:
  title: "Amélioration"
  1:
    title: "Non-conformité et actions correctives"
    1_desc: "Lorsqu’une non-conformité se produit, l’organisme doit:\n\ta. réagir à la non-conformité, et le cas échéant:\n\t\t1. agir pour la maîtriser et la corriger;\n\t\t2. faire face aux conséquences;\n\tb. évaluer s’il est nécessaire de mener des actions pour éliminer les causes de la non-conformité afin qu’elle ne se reproduise pas ou n'apparaisse pas ailleurs, en:\n\t\t1. effectuant la revue de la non-conformité;\n\t\t2. recherchant et analysant les causes de la non-conformité;\n\t\t3. recherchant si des non-conformités similaires existent ou pourraient éventuellement se produire;\n\tc. mettre en œuvre toutes les actions requises;\n\td. examiner l'efficacité de toute action corrective mise en œuvre;\n\te. modifier, si nécessaire, le SMS.\n\n Les actions correctives doivent être à la mesure des effets des non-conformités rencontrées."
    2_desc: "L'organisme doit conserver des informations documentées comme preuves:\n\t\ta. de la nature des non-conformités et de toute action menée ultérieurement;\n\t\tb. des résultats de toute action corrective."
  2_label: "Amélioration continue"
  2_desc: "L’organisme doit améliorer en continu la pertinence, l’adéquation et l’efficacité du SMS et des services. Lors de la prise de décisions visant à approuver les opportunités d'amélioration, l’organisme doit déterminer les critères d’évaluation devant leur être appliqués. Les critères d’évaluation doivent comprendre l'alignement de l'amélioration sur les objectifs de gestion des services. Les opportunités d'amélioration doivent être documentées. L’organisme doit gérer les activités d'améliorations approuvées, ce qui inclut de:\n\t\ta. définir les objectifs d'amélioration pour un ou plusieurs des facteurs suivants: qualité, production de valeur, aptitude, coût, productivité, utilisation des ressources et réduction des risques;\n\t\tb. garantir que les améliorations ont été classées par priorité, qu’elles ont été planifiées et mises en œuvre;\n\t\tc. modifier, si nécessaire, le SMS;\n\t\td. mesurer les améliorations mises en œuvre et les comparer à ou aux objectifs définis et, si le ou les objectifs ne sont pas atteints, prendre les mesures nécessaires;\n\t\te. générer les rapports relatifs aux améliorations mises en œuvre.\n\nℹ️ NOTE\nLes améliorations peuvent inclure des actions réactives et proactives telles que corrections, actions correctives, actions préventives, perfectionnements, innovations et réorganisations."
