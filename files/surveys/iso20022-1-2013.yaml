5:
  title: "Metamodel packages"
  1_label: "General"
  1_desc: "The metamodel describes the structure of models built in accordance with this International Standard. All models produced according to this International Standard shall comply with this one model."
  2_label: "The metamodel's use of ISO20022::TypeLibrary"
  2_desc: "The metamodel imports the ISO20022::TypeLibrary Package and its subpackages, which are defined in Annex A. It uses the types defined therein to define the metamodel. \n\n ℹ️NOTE \n The ISO20022::TypeLibrary Package is not contained within the ISO20022::Metamodel Package because it is used by both the metamodel and the UML Profile defined in ISO 20022-2, which also imports it. The ISO20022::TypeLibrary::XMLSchema Package contains definitions of the W3C XML Schema built-in Datatypes in a form that makes it possible for modellers to use these Datatypes in UML and MOF models. \n\n cf. Figure 3 ó ISO 20022 level structure"
  3:
    title: "Levels"
    desc: "The metamodel has four levels of model, each of increasing realization. These four levels are based upon the first four levels of the Zachman Framework. \n\n cf. Figure 4 - ISO 20022 level structure \n\n The Zachmann Framework has two further levels. These are regarded as being under the aegis of the implementers of this International Standard. \n\n For a BusinessArea being modelled, each level is modelled completely and precisely. \n\n The number of levels may not be added to or reduced. \n\n \n\n ℹ️NOTE \n 1 Adding or removing levels introduces redundancy or discontinuity. Each level is disjointed. \n\n ℹ️NOTE \n 2 No concept may appear at more than one level without a change in the level of realization. \n\n There is no relationship between the levels other than realization. \n\n There is no sequence, other than the ordering of realization, implicit in the levels. Any level may be completed in any order. \n\n ℹ️NOTE \n 3 This might be further constrained in a modelling method. \n\n ℹ️NOTE \n 4 The levels do not subsume each other. \n\n ℹ️NOTE \n 5 The metaclasses used to explain the different levels are detailed in Annex B."
    1_label: "Scope level"
    1_desc: "The purpose of the Scope level is to acquire an understanding of the BusinessArea for which an ISO 20022 compliant BusinessTransaction and MessageSet is to be developed. Describing the BusinessProcesses helps in the identification of the communication problems that exist among the business actors (modelled as BusinessRoles) that take part in these processes. Those communication problems will be the main drivers for the Conceptual level. Identifying the Business Information that is manipulated in a BusinessArea is also important for the later Logical level, because the MessageDefinitions will contain data elements that are related to this business information. \n\n cf. Figure 4 ó Scope level"
    2_prefix: "5.3.2.1"
    2_label: "Conceptual level - Creation of a semantic model of all artefacts (static part)"
    2_desc: "The Conceptual level starts by using a \"black box perspective\" in order to avoid prematurely tackling architectural issues regarding the issues encountered during the implementation. A \"black box\" perspective means that one does not try to define BusinessTransactions and MessageDefinitions. The focus is only on defining \"who needs what\" in order to execute the BusinessProcesses. There is no attempt yet to define how to get the information at the right moment to the right business user. All BusinessConcepts that are involved in the BusinessTransactions shall firstly be identified. \n\n cf. Figure 5 ó ConceptualStatic level"
    3_prefix: "5.3.2.2"
    3_label: "Conceptual level - Identification of the requirements related to communication (dynamic part)"
    3_desc: "Define the dynamic part (i.e. the process description of the full interaction between all involved Participants) by specifying the details of the BusinessTransaction and MessageSet that will be developed. This means that the focus is moving from the \"black box\" perspective to a \"white box\" perspective. A \"white box\" perspective means that one looks into all the details of the BusinessTransaction and MessageSet. The focus is now on defining the MessageFlows and MessageDefinitions that are needed to get the required information at the right time to the right business user. \n\n cf. Figure 6 ó ConceptualDynamic level"
    4_prefix: "5.3.3"
    4_label: "Logical level"
    4_desc: "The purpose of the Logical level is to create the MessageSets with their MessageDefinitions: \n\t- the MessageSet is still characterized from a pure business perspective; \n\t- the focus moves from defining the dynamics to defining the static part (i.e. the precise structure of the MessageInstances) of the BusinessTransaction and MessageSet, which is done in MessageDefinition Diagrams. \n\n cf. Figure 7 ó Logical level"
    5_prefix: "5.3.4"
    5_label: "Physical level"
    5_desc: "The physical level delivers the physical implementation of MessageDefinitions and Constraints in an appropriate syntax, such as ISO 20022 XML. Specific design rules are used to build the physical representation of the MessageDefinitions from the deliverables of the Logical level. \n\n The key deliverable of the Physical level is: \n\t- a set of ISO 20022 Syntax Message Schemes; \n\t- the Message Choreography. \n\n cf. Figure 8 ó Syntax artefacts"
  4:
    title: "Models Transformation"
    desc: "Model transformation is inspired by the principles of OMG's MDA (Model Driven Architecture). To maintain consistency and facilitate realization, there is a transformation of the model at each level to its immediately subsequent level. \n\n EXAMPLE The Conceptual level may be transformed to the Logical level. \n\n The model at each level is transformed to the next level through being decorated with traces. Each trace is a map from one level to the next. \n\n cf. Figure 9 ó Traces \n\n cf. Table 2 ó Transformation levels"
    1_label: "Scope to Conceptual"
    1_desc: "During the Conceptual level, the communication problem is described (the required information is scattered amongst the Participants). This means that for each BusinessProcess with its BusinessRoles, one or more BusinessTransactions with its Participants will have to be defined. A trace is defined for each Scope artefact to its corresponding Conceptual artefact. \n\n cf. Figure 10 ó Scope to Conceptual level mapping"
    2_label: "Conceptual to Logical"
    2_desc: "MessageDefinitions are created by populating them with MessageComponentTypes. These MessageComponentTypes (which are contextual to the MessageDefinition in which they are used) may be derived from their more generic BusinessComponents. In such cases they shall be traced. MessageTransmissions defined in BusinessTransaction Diagrams (identified as Signals in Sequence Diagrams) trace to MessageDefinitions. \n\n cf. Figure 11 ó Conceptual to Logical level mapping"
    3_label: "This transformation is defined in ISO 20022-4."
    3_desc: "cf. Figure 12 ó Logical to Physical level mapping"
6:
  title: "Repository"
  1:
    title: "ISO 20022 Repository structure"
    1_label: "Overview"
    1_desc: "Figure 13 shows a high level view of the structure of the ISO 20022 Repository. As indicated, the ISO 20022 Repository consists of two major parts: the BusinessProcessCatalogue and the DataDictionary. \n\n cf. Figure 13 ó Global concepts \n\n The DataDictionary contains BusinessConcepts, MessageConcepts, Constraints and DataTypes. All these items are re-usable and are TopLevelDictionaryEntries. The DataDictionary as a whole is under release control. \n\n The BusinessProcessCatalogue consists of TopLevelCatalogueEntries. The communication requirements and the interaction requirements in the various BusinessAreas are supported by BusinessTransactions, BusinessActivities and MessageDefinitions. All items that are stored in the BusinessProcessCatalogue are called Catalogue Items. Within the BusinessProcessCatalogue, the TopLevelCatalogueEntries are under release control. A BusinessProcessCatalogue release is always based on one single DataDictionary release. \n\n The main relationships between Dictionary Items and Catalogue Items are as follows. \n\t- Within the DataDictionary: MessageConcepts are derived from BusinessConcepts. \n\t- Within the BusinessProcessCatalogue: BusinessTransactions support BusinessAreas. \n\t- Between the BusinessProcessCatalogue and the DataDictionary: BusinessAreas are described using BusinessConcepts and BusinessTransactions are composed of MessageConcepts. \n\n All Dictionary Items and Catalogue Items are uniquely identified, registered and managed within the Repository. The ISO 20022 Repository contains change history records, which contain the \"change log\" of those items, reflecting the life cycle of the items. Change history records are maintained and controlled by the Registration Authority. \n\n The following change history record information is associated with every item: \n\t- Change Type: identifies purpose of this change history record, in terms of item creation, amendment or deletion. \n\t- Request By: identifies the institution or community of users that submitted the item's change request to the Registration Authority. \n\t- Replaces: indicates, when applicable, the item that has been replaced by this item. \n\t- Change description: provides the business justification to change the item. \n\t- ChangeDate: date at which the change to the item has been registered."
  2:
    title: "DataDictionary"
    1_label: "Overview"
    1_desc: "A DataDictionary Release contains Dictionary Items, namely BusinessConcepts, DataTypes and MessageConcepts. Each Dictionary Item is accompanied by some descriptive information and has a change history record containing information about its life cycle. \n\n Figure 5 and Figure 7 show the main relationships between Dictionary Items: \n\t- a BusinessComponent contains BusinessElements and Constraints; \n\t- a MessageComponentType contains MessageElements and Constraints; \n\t- a Code is a possible value of a CodeSet; \n\t- a DataType defines the set of valid values of BusinessAttributes and of MessageElements; \n\t- a DataType is based on a DataType representation; \n\t- a MessageComponentType can be derived from a BusinessComponent; \n\t- a MessageElement can be derived from a BusinessElement or BusinessComponent."
    2_prefix: "6.2.2.1"
    2_label: "List of Dictionary Items - BusinessConcepts"
    2_desc: "The DataDictionary contains the following types of BusinessConcept, which reflect the nature of the Dictionary Items that are defined and used during the Scope and Conceptual level activities. They form the basic items with which the Business Model of a BusinessArea is built. \n\t- BusinessComponents; \n\t- BusinessElements."
    3_prefix: "6.2.2.2"
    3_label: "List of Dictionary Items - DataTypes"
    3_desc: "The objective of a DataType is to specify unambiguously the value space of a BusinessAttribute, MessageBuildingBlock or a MessageAttribute. \n\n XSD's Built-in DataTypes can be used directly as types of BusinessAttributes, MessageBuildingBlocks and MessageAttributes where, in contrast to the user-defined DataTypes, they cannot be further constrained. Every datatype imported from the XSD built-in library represents a set of values (i.e. its value space). \n\n The DataType metaclass represents the set of all sets of values without identity. Therefore, datatypes imported from XSD built-in Datatypes library are instances of the DataType metaclass, which do not provide values for the metaproperties. Figure 14 illustrates the allowed instances and the relationship between the datatypes and their metaclass. \n\n cf. Figure 14 ó XSD built-in DataType instantiations \n\n The user-defined DataTypes are categorized in a limited number of datatype representations, such as Amount, IdentifierSet, Quantity, CodeSet, Date, Time, Text, etc. The full list of DataType representations is defined in the metamodel. \n\n cf. Figure 15 ó User-defined DataTypes \n\n Each DataType representation defines the following information. \n\ta. The XSD Built-in DataType that will be used for all DataTypes based on this DataType representation, and therefore its value space, e.g.: \n\t\t- DataTypes based on DataType representation \"Text\" will restrict XSD String; \n\t\t- DataTypes based on DataType representation \"Amount\" will restrict XSD Decimal. \n\tb. The additional information that shall be specified to distinguish DataTypes based on the same DataType representation. This additional information will constrain the value space for a particular DataType. This can be done in the following two ways. \n\t\t- Defining explicitly the set of possible values, by exhaustive enumeration or by referencing a list. For the DataType representation \"CodeSet\", the Registration Authority will either use an existing set of Codes or the Registration Authority will define a new set of Codes within the ISO 20022 Repository. In the latter case, all Codes will be of 1 up to 4 alphanumeric characters where the first shall be upper alphabetic. \n\t\t- Specifying a format restriction, e.g. by defining the allowed length of a string, using the DataType properties. \n\n EXAMPLE 1 DataTypes based on DataType representation \"IdentifierSet\" can specify the list that contains the possible values of this identifier, e.g. the DataType \"ISIN\" contains its possible values in the \"ISIN directory\". \n\n EXAMPLE 2 DataTypes based on DataType representation \"Text\" can specify the maximum length that is allowed, e.g. the DataType \"Max35Text\", which is used, among others, for the street name, has a maximum of 35 characters. \n\n The list of possible values for DataTypes that have the DataType representation \"CodeSet\" will be included in the DataDictionary if the set of Codes is maintained by the ISO 20022 Registration Authority."
    4_prefix: "6.2.2.3"
    4_label: "List of Dictionary Items - MessageConcepts"
    4_desc: "The DataDictionary contains the following types of Message Concept, which reflect the nature of the Dictionary Items that are defined and used during the Logical level activities. They form the basic items of MessageDefinitions. \n\t- MessageComponentTypes are the re-usable Dictionary Items with which the MessageDefinitions shall be built. A MessageComponentType, when it has a business meaning, is derived from one single BusinessComponent. It can be considered as a \"view\" on that BusinessComponent that will be used in MessageDefinitions. \n\n Several MessageComponentTypes can be derived from the same BusinessComponent. These MessageComponentTypes will be different because of their specific subset of MessageElements or because of specific constraints such as cross-element Constraints or multiplicity constraints. \n\n In some cases a MessageComponentType can be based on a set of related BusinessComponents or can even be defined for message-specific reasons without being derived from any BusinessComponent at all. \n\t- MessageElements: these are usually derived from the BusinessElements of the BusinessComponent corresponding to the MessageComponentType. There might be situations where MessageElements in one MessageComponentType come from multiple related BusinessComponents. The MessageElements will then be linked to the relevant BusinessElement or BusinessComponent. When the MessageElement has no business meaning it is not derived from any BusinessElement at all. \n\n If a MessageElement is derived from other MessageElements, then a Constraint should specify how this MessageElement is derived. \n\n The value space of a MessageElement is either defined by a DataType or by another MessageComponentType."
    5_prefix: "6.2.3"
    5_label: "Dictionary Item Registration Status"
    5_desc: "Each Dictionary Item is assigned a \"Registration Status\". The Registration Status can take the following values: \n\t- PROVISIONALLY REGISTERED: the Dictionary Item is pending final approval (see ISO 20022-7). This enables the Registration Authority to inform a community of users of Dictionary Items that the item will potentially become \"REGISTERED\" in the near future. \n\t- REGISTERED: the ISO 20022 compliant Dictionary Item is approved and can be used. \n\t- OBSOLETE [<REMOVAL-DATE>]: the Dictionary Item is no longer considered as ISO 20022 compliant and may no longer be used for registering updates to the ISO 20022 Repository. The Dictionary Item will, however, be kept in the DataDictionary as long as it is used in other Dictionary or Catalogue Items. The optional <REMOVAL-DATE> enables the Registration Authority to inform a community of users that the Dictionary Item will be physically removed from the DataDictionary at the date specified as <REMOVAL-DATE>."
    6_prefix: "6.2.4"
    6_label: "Dictionary Items description information"
    6_desc: "The semantics of each Dictionary Item is defined by the following information1); \n\t- Name: official name of the Dictionary Item (uniqueness is defined in the metamodel). It may include versioning information. \n\t- Definition: precise description of the meaning of the Dictionary Item. \n\t- Removal date: the date at which a Dictionary Item having an \"OBSOLETE\" Registration status is removed from the Repository. \n\t- SemanticMarkup: markup of elements of the Dictionary with semantic metadata. \n\t- Examples: examples of the use of the Dictionary Item in its business context. \n\t- Multiplicity: indicates whether the Dictionary Item is mandatory, optional and/or repetitive. This information is only applicable to BusinessElements in BusinessComponents and to MessageElements in MessageComponentTypes. \n\t- Constraint: a semantic condition or restriction."
    7_prefix: "6.2.5"
    7_label: "DataDictionary life cycle"
    7_desc: "On a regular basis, the Registration Authority makes publicly available the current release of the DataDictionary. This published DataDictionary contains all Dictionary Items, i.e. with status PROVISIONALLY REGISTERED, REGISTERED or OBSOLETE [<REMOVAL-DATE>]2) . This allows the Registration Authority to inform communities of users of Dictionary Items that will either become registered, or will be removed from the Dictionary in the near future. \n\n At any time, only the latest release of the DataDictionary is available as the official point of reference. It replaces any previously released DataDictionary and contains at least all Dictionary Items that are referenced in the current issue of the BusinessProcessCatalogue. \n\n The Registration Authority will also publish an archive of Message Definitions with status OBSOLETE and a <REMOVAL-DATE> less than than the current release publication date. This allows a user community to find information about previous versions of Message Definitions that are no longer officially supported. \n\n\t1. This list of information is not exhaustive but is provided in the scope of the information that might be required for the submission requests to the Registration Authority. \n\t2. \"<REMOVAL-DATE>\" is greater than the release publication date. \n\n Change history records are published at the same time as the DataDictionary. The change history records reflect the evolution of the Dictionary Items."
  3:
    title: "BusinessProcessCatalogue"
    1_label: "Overview"
    1_desc: "The BusinessProcessCatalogue contains BusinessAreas. A BusinessArea can be described in more details using Business Processes. The communication requirements and the interaction requirements in the various BusinessAreas and Business Processes are supported by BusinessTransactions, which include a detailed description of the possible message flows in BusinessTransaction Diagrams. A BusinessTransaction Diagram contains one or more MessageTransmissions. Each MessageTransmission is described in a MessageDefinition, which is also converted into an ISO 20022 Syntax Message Representation. \n\n Every MessageDefinition is thus associated with the following context information when it is used to support the communication requirements of a business activity: \n\t- a specific BusinessTransaction Diagram, itself being used in support of a BusinessTransaction; \n\t- a specific BusinessArea, detailed in a specific BusinessProcess. \n\n All this information is required to understand the precise function, role and application of a MessageDefinition in the considered BusinessProcess and/or BusinessArea."
    2_label: "List of BusinessProcessCatalogue Items"
    2_desc: "The following items may be contained in the BusinessProcessCatalogue: \n\t- BusinessArea with its MessageDefinitions (Diagram); \n\t- BusinessProcess (Diagram) with its BusinessRoles; \n\t- BusinessTransaction (Diagram) with its Participants; \n\t- MessageSet with its MessageDefinitions (Diagram); \n\t- SyntaxMessageScheme; \n\t- MessageChoreography; \n\t- MessageTransportMode."
    3_label: "Catalogue Item Registration Status"
    3_desc: "Each Catalogue Item is assigned a \"Registration Status\". The Registration Status may take the following values: \n\t- PROVISIONALLY REGISTERED: the Catalogue Item is pending final approval (see ISO 20022-7). Note that, unlike for DataDictionary Items, Catalogue Items with this status are not made publicly available; \n\t- REGISTERED: the ISO 20022 compliant Catalogue Item is approved; \n\t- OBSOLETE [<REMOVAL-DATE>]: the Catalogue Item is no longer considered as ISO 20022 compliant and may no longer be used for registering updates to the ISO 20022 Repository. The Catalogue Item will, however, be kept in the BusinessProcessCatalogue as long as it is used. The optional <REMOVAL-DATE> enables the Registration Authority to inform a community of users that the Catalogue Item will be physically removed from the BusinessProcessCatalogue at the date specified as <REMOVAL-DATE>."
    4_label: "Catalogue Item description information"
    4_desc: "The semantics of each Catalogue Item is defined by the following information3): \n\t- Name: official name of the Catalogue Item, which may include versioning information. \n\t- Definition: precise description of the meaning of the Catalogue Item. \n\t- Removal date: the date at which a Catalogue Item having an \"OBSOLETE\" Registration status is removed from the Repository. \n\t- Example: examples of the use of the Catalogue Item in its business context. \n\t- semanticMarkup: markup of elements of the Catalogue with semantic metadata. \n\t- constraint: a semantic condition or restriction."
    5_label: "BusinessProcessCatalogue life cycle"
    5_desc: "On a regular basis, the Registration Authority makes publicly available the current release of the BusinessProcessCatalogue. This published BusinessProcessCatalogue contains all Catalogue Items with status REGISTERED or OBSOLETE [<REMOVAL-DATE>]. Catalogue Items that have the status <PROVISIONALLY REGISTERED> will not be accessible via the public BusinessProcessCatalogue. The experts nominated by ISO/TC 68 (see ISO 20022-7) who are responsible for the approval of these Catalogue Items will, however, get the necessary documentation in an alternative, off-line way via the Registration Authority. \n\n At any time, only the latest release of the BusinessProcessCatalogue is available as the official point of reference. It replaces any previously released BusinessProcessCatalogue and is always associated with the latest DataDictionary Release. Note that a BusinessTransaction may only have the REGISTERED status if all its related Catalogue Items and Dictionary Items have the status REGISTERED or OBSOLETE with a <REMOVAL-DATE> greater than the release publication date. \n\n The Registration Authority will also publish archive Releases of the BusinessProcessCatalogue. This allows a user community to find information about Catalogue Items that are no longer officially supported. \n\n Change history records are published at the same time as the BusinessProcessCatalogue. The change history records reflect the evolution of the Catalogue Items."
7:
  title: "Registration"
  1_label: "General"
  1_desc: "This clause provides specifications about the submission requests to the Registration Authority for updates to the DataDictionary or BusinessProcessCatalogue. The following information is provided: \n\t- the required format of the input; \n\t- the means by which the input can be conveyed to the Registration Authority. Further information on submission of requests and related Registration Authority service levels can be found in ISO 20022-7. \n\n\t3. This list is not exhaustive but is provided in the scope of the information that might be required for the submission requests to the Registration Authority."
  2_label: "Submission format"
  2_desc: "The submission will include new or updated Business Processes, Business Transactions and Message Definitions. The models shall be compliant with the metamodel and, if submitted in UML, with ISO 20022-2 and ISO 20022-3. New or updated Repository items shall be identified. \n\n The format of the submission is to be agreed with the Registration Authority. Acceptable formats and related conventions will be published on the ISO 20022 website."
  3_label: "Submission media"
  3_desc: "An e-mail, sent to the Registration Authority e-mail address, will be the authorized submission media. With the evolution of technology, the Registration Authority might accept other submission media. The full list of valid submission means shall be maintained on the ISO 20022 website."
8:
  title: "Repository Access"
  1_label: "General"
  1_desc: "It is the responsibility of the Registration Authority to provide public access to the ISO 20022 Repository information. This access will give the users the possibility to search, identify and get the full description of the available ISO 20022 DataDictionary, BusinessTransactions and MessageSets."
  2_label: "Repository output types"
  2_desc: "The Registration Authority shall provide access to the ISO 20022 Repository information via the following output types. \n\ta. Interactive search/queries on: \n\t\t- the DataDictionary, giving access to all DataDictionary Items and exploiting the relations between DataDictionary Items; \n\t\t- the BusinessProcessCatalogue, giving access to all Catalogue Items and exploiting the relations between Catalogue Items. \n\tb. A set of predefined downloadable extracts providing information about: \n\t\t- the DataDictionary, listing all DataDictionary Items with all relevant information, e.g. Name, Definition, etc.; \n\t\t- the BusinessProcessCatalogue (Business Processes and their related BusinessTransactions, BusinessTransaction Diagrams, MessageDefinitions and ISO 20022 Syntax Message Representations)."
  3_label: "Output format"
  3_desc: "The interactive queries shall be provided free of charge via a \"web query\" interface on the ISO 20022 website. The downloadable extracts shall be provided free of charge in at least one of the following formats via the ISO 20022 website: \n\t- RTF; \n\t- HTML; \n\t- PDF. \n\n The Registration Authority shall also provide repository extracts in XMI and may agree, on a case-by-case basis, to deliver ISO 20022 Repository information in other structured languages or processable formats. The Registration Authority may charge a reasonable fee to the requesting community of users for these deliverables."
