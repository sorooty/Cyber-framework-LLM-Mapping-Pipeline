1:
  prefix: "A"
  title: "Dispositions générales"
  1_prefix: "111.5"
  1_label: "D'autres dispositions législatives et réglementaires s'appliquent-elles ?"
  1_desc: "En plus de cette partie, vous devez vous conformer aux autres dispositions législatives et réglementaires applicables en vertu de la loi relative aux compléments alimentaires. Pour les importateurs de compléments alimentaires et de composants de compléments alimentaires, la réglementation sur les programmes de vérification des fournisseurs étrangers se trouve dans la sous-partie L de la partie 1 de ce chapitre."
2:
  prefix: "B"
  title: "Personnel"
  1_prefix: "111.8"
  1_label: "Quelles sont les exigences de cette sous-partie B concernant les procédures écrites ?"
  1_desc: "Vous devez établir et suivre des procédures écrites pour satisfaire aux exigences de cette sous-partie."
  2_prefix: "111.10"
  2_label: "Quelles sont les exigences pour prévenir la contamination microbienne par le personnel malade ou infecté et pour les pratiques d'hygiène ?"
  2_desc: "a. Prévention de la contamination microbienne. Vous devez prendre des mesures pour exclure de toute opération toute personne susceptible d'être une source de contamination microbienne, en raison d'un état de santé, lorsque cette contamination peut survenir, de tout matériau, y compris les composants, les compléments alimentaires et les surfaces de contact utilisés dans la fabrication, l'emballage, l'étiquetage ou la détention d'un complément alimentaire. Ces mesures incluent ce qui suit : \n\t1. Exclure de toute opération pouvant entraîner une contamination toute personne qui, par examen médical, par sa propre déclaration ou par observation de la supervision, est atteinte ou semble atteinte d'une maladie, d'une infection, d'une lésion ouverte ou de toute autre source anormale de contamination microbienne, susceptible d'entraîner une contamination microbienne des composants, des compléments alimentaires ou des surfaces de contact, jusqu'à ce que l'état de santé n'existe plus ; et \n\t2. Instruire vos employés d'informer leur(s) superviseur(s) s'ils présentent ou s'il existe une possibilité raisonnable qu'ils présentent un état de santé décrit au paragraphe (a)(1) de cette section, susceptible d'entraîner une contamination microbienne des composants, des compléments alimentaires ou des surfaces de contact. \n\nb. Pratiques d'hygiène. Si vous travaillez dans une opération au cours de laquelle une altération des composants, des compléments alimentaires ou des surfaces de contact pourrait se produire, vous devez utiliser des pratiques hygiéniques dans la mesure nécessaire pour protéger contre une telle contamination des composants, des compléments alimentaires ou des surfaces de contact. Ces pratiques hygiéniques incluent ce qui suit : \n\t1. Porter des vêtements de protection de manière à éviter la contamination des composants, des compléments alimentaires ou des surfaces de contact ; \n\t2. Maintenir une propreté personnelle adéquate ; \n\t3. Se laver soigneusement les mains (et les désinfecter si nécessaire pour éviter une contamination par des micro-organismes) dans un espace de lavage des mains adéquat : \n\t\ti. Avant de commencer le travail ; et \n\t\tii. À chaque fois que les mains pourraient être souillées ou contaminées ; \n\t4. Retirer tous les bijoux non fixés et autres objets pouvant tomber dans les composants, les compléments alimentaires, l'équipement ou l'emballage, et retirer les bijoux portés aux mains qui ne peuvent pas être correctement désinfectés pendant les périodes où les composants ou les compléments alimentaires sont manipulés à la main. Si les bijoux ne peuvent pas être retirés, ils doivent être recouverts d'un matériau maintenu intact, propre et sanitaire, et qui protège efficacement contre la contamination des composants, des compléments alimentaires ou des surfaces de contact ; \n\t5. Maintenir les gants utilisés pour manipuler les composants ou les compléments alimentaires dans un état intact, propre et sanitaire. Les gants doivent être en matériau imperméable ;\n\t6. Porter, lorsque cela est approprié et de manière efficace, des filets à cheveux, des bonnets, des protège-barbes ou d'autres dispositifs de retenue des cheveux ; \n\t7. Ne pas stocker de vêtements ou d'effets personnels dans les zones où les composants, les compléments alimentaires ou les surfaces de contact sont exposés ou où les surfaces de contact sont lavées ; \n\t8. Ne pas manger, mâcher de chewing-gum, boire ou utiliser des produits du tabac dans les zones où les composants, les compléments alimentaires ou les surfaces de contact sont exposés, ou où les surfaces de contact sont lavées ; et \n\t9. Prendre toute autre précaution nécessaire pour protéger contre la contamination des composants, des compléments alimentaires ou des surfaces de contact par des micro-organismes, des saletés ou tout autre matériau étranger, y compris la transpiration, les cheveux, les cosmétiques, le tabac, les produits chimiques et les médicaments appliqués sur la peau."
  3_prefix: "111.12"
  3_label: "Quelles sont les exigences de qualification du personnel ?"
  3_desc: "a. Vous devez disposer d'employés qualifiés pour fabriquer, emballer, étiqueter ou détenir des compléments alimentaires. \n\nb. Vous devez identifier la personne responsable de vos opérations de contrôle qualité. Chaque personne identifiée pour effectuer des opérations de contrôle qualité doit être qualifiée pour le faire et avoir des responsabilités distinctes et séparées liées à l'exécution de ces opérations, différentes de celles qu'elle a par ailleurs lorsqu'elle n'effectue pas ces opérations. \n\nc. Chaque personne impliquée dans la fabrication, l'emballage, l'étiquetage, la détention ou l'exécution d'opérations de contrôle qualité doit avoir la formation, l'éducation ou l'expérience nécessaire pour accomplir les fonctions qui lui sont assignées."
  4_prefix: "111.13"
  4_label: "Quelles sont les exigences pour les superviseurs ?"
  4_desc: "a. Vous devez désigner du personnel qualifié pour superviser la fabrication, l'emballage, l'étiquetage ou la détention des compléments alimentaires. \n\nb. Chaque superviseur que vous utilisez doit être qualifié par sa formation, son éducation ou son expérience pour superviser."
  5_prefix: "111.14"
  5_label: "Quels enregistrements devez-vous établir et conserver selon cette sous-partie B ?"
  5_desc: "a. Vous devez établir et conserver les enregistrements requis par cette sous-partie B conformément à la sous-partie P de cette partie. \n\nb. Vous devez établir et conserver les enregistrements suivants : \n\t1. Les procédures écrites pour satisfaire aux exigences de cette sous-partie B ; et \n\t2. La documentation des formations, y compris la date de la formation, le type de formation et la ou les personnes formées."
3:
  prefix: "C"
  title: "Installations physiques et terrains"
  1_prefix: "111.15"
  1_label: "Quelles sont les exigences d'hygiène applicables à vos installations physiques et terrains ?"
  1_desc: "a. Terrains. Vous devez maintenir les terrains de vos installations physiques dans un état qui protège contre la contamination des composants, des compléments alimentaires ou des surfaces de contact. Les méthodes d'entretien adéquat des terrains incluent :\n\t1. Le stockage approprié des équipements, l'élimination des déchets et des ordures, et la tonte des mauvaises herbes ou de l'herbe à proximité immédiate des installations physiques afin qu'ils n'attirent pas les nuisibles, ne les abritent pas ou ne leur offrent pas un lieu de reproduction ;\n\t2. L'entretien des routes, des cours et des parkings de manière à ce qu'ils ne constituent pas une source de contamination dans les zones où les composants, les compléments alimentaires ou les surfaces de contact sont exposés ;\n\t3. Le drainage adéquat des zones pouvant contribuer à la contamination des composants, des compléments alimentaires ou des surfaces de contact par infiltration, saleté ou tout autre matériau étranger, ou en fournissant un lieu de reproduction pour les nuisibles ;\n\t4. Le fonctionnement adéquat des systèmes de traitement et d'élimination des déchets afin qu'ils ne constituent pas une source de contamination dans les zones où les composants, les compléments alimentaires ou les surfaces de contact sont exposés ; et\n\t5. Si les terrains de votre usine sont bordés par des terrains qui ne sont pas sous votre contrôle, et si ces autres terrains ne sont pas entretenus de la manière décrite dans cette section, vous devez prendre des précautions dans l'usine par inspection, extermination ou autres moyens pour exclure les nuisibles, la saleté et les ordures ou tout autre matériau étranger pouvant être une source de contamination.\n\nb. Installations physiques.\n\t1. Vous devez maintenir vos installations physiques dans un état propre et sanitaire ; et\n\t2. Vous devez maintenir vos installations physiques en bon état de réparation pour empêcher les composants, les compléments alimentaires ou les surfaces de contact de devenir contaminés.\n\nc. Composés de nettoyage, agents de désinfection, pesticides et autres matériaux toxiques.\n\t1. Vous devez utiliser des composés de nettoyage et des agents de désinfection exempts de micro-organismes significatifs pour la santé publique et qui sont sûrs et adéquats dans les conditions d'utilisation.\n\t2. Vous ne devez pas utiliser ou stocker de matériaux toxiques dans une installation physique où des composants, des compléments alimentaires ou des surfaces de contact sont fabriqués ou exposés, à moins que ces matériaux ne soient nécessaires pour :\n\t\ti. Maintenir des conditions propres et sanitaires ;\n\t\tii. Être utilisés dans des procédures de test en laboratoire ;\n\t\tiii. Maintenir ou faire fonctionner les installations physiques ou les équipements ; ou\n\t\tiv. Être utilisés dans les opérations de l'usine.\n\t3. Vous devez identifier et stocker les composés de nettoyage, les agents de désinfection, les pesticides, les produits chimiques pesticides et autres matériaux toxiques de manière à protéger contre la contamination des composants, des compléments alimentaires ou des surfaces de contact.\n\nd. Lutte antiparasitaire.\n\t1. Vous ne devez pas permettre la présence d'animaux ou de nuisibles dans une zone quelconque de vos installations physiques. Les chiens de garde ou de guidage sont autorisés dans certaines zones de vos installations physiques si leur présence ne risque pas de contaminer les composants, les compléments alimentaires ou les surfaces de contact ;\n\t2. Vous devez prendre des mesures efficaces pour exclure les nuisibles des installations physiques et pour protéger contre la contamination des composants, des compléments alimentaires et des surfaces de contact sur les lieux par les nuisibles ; et\n\t3. Vous ne devez pas utiliser d'insecticides, de fumigènes, de fongicides ou de raticides, à moins de prendre des précautions pour protéger contre la contamination des composants, des compléments alimentaires ou des surfaces de contact.\n\ne. Approvisionnement en eau.\n\t1. Vous devez fournir de l'eau sûre et sanitaire, à des températures appropriées et sous pression si nécessaire, pour toutes les utilisations où l'eau ne devient pas un composant du complément alimentaire.\n\t2. L'eau utilisée de manière à ce qu'elle puisse devenir un composant du complément alimentaire, par exemple lorsqu'elle entre en contact avec des composants, des compléments alimentaires ou toute surface de contact, doit, au minimum, se conformer aux exigences fédérales, étatiques et locales applicables et ne pas contaminer le complément alimentaire.\n\nf. Plomberie. La plomberie de vos installations physiques doit être de taille et de conception adéquates et être correctement installée et entretenue pour :\n\t1. Fournir des quantités suffisantes d'eau aux emplacements requis dans toute l'installation physique ;\n\t2. Évacuer correctement les eaux usées et les déchets liquides de vos installations physiques ;\n\t3. Éviter d'être une source de contamination pour les composants, les compléments alimentaires, les approvisionnements en eau ou toute surface de contact, ou créer une condition insalubre ;\n\t4. Fournir un drainage adéquat du sol dans toutes les zones où les sols sont soumis à un nettoyage de type inondation ou où les opérations normales libèrent ou rejettent de l'eau ou d'autres déchets liquides sur le sol ; et\n\t5. Ne pas permettre de refoulement ou de connexion croisée entre les systèmes de tuyauterie qui évacuent les eaux usées ou les eaux résiduaires et les systèmes de tuyauterie qui transportent l'eau utilisée pour la fabrication de compléments alimentaires, pour le nettoyage des surfaces de contact, ou pour une utilisation dans les toilettes ou les installations de lavage des mains.\n\ng. Évacuation des eaux usées. Vous devez évacuer les eaux usées dans un système d'égouts adéquat ou par d'autres moyens adéquats.\n\nh. Toilettes. Vous devez fournir à vos employés des toilettes adéquates et facilement accessibles. Les toilettes doivent être maintenues propres et ne doivent pas être une source potentielle de contamination pour les composants, les compléments alimentaires ou les surfaces de contact.\n\ni. Installations de lavage des mains. Vous devez fournir des installations de lavage des mains conçues pour garantir que les mains d'un employé ne soient pas une source de contamination des composants, des compléments alimentaires ou de toute surface de contact, en fournissant des installations adéquates, pratiques et fournissant de l'eau courante à une température appropriée.\n\nj. Élimination des déchets. Vous devez transporter, stocker et éliminer les déchets pour :\n\t1. Minimiser le développement des odeurs ;\n\t2. Minimiser le potentiel des déchets à attirer, abriter ou devenir un lieu de reproduction pour les nuisibles ;\n\t3. Protéger contre la contamination des composants, des compléments alimentaires, des surfaces de contact, des approvisionnements en eau et des terrains entourant vos installations physiques ; et\n\t4. Contrôler les déchets dangereux pour éviter la contamination des composants, des compléments alimentaires et des surfaces de contact.\n\nk. Superviseurs de l'hygiène. Vous devez désigner un ou plusieurs employés pour superviser l'hygiène globale. Chacun de ces superviseurs doit être qualifié par l'éducation, la formation ou l'expérience pour développer et superviser les procédures d'hygiène."
  2_prefix: "111.16"
  2_label: "Quelles sont les exigences de cette sous-partie C concernant les procédures écrites ?"
  2_desc: "Vous devez établir et suivre des procédures écrites pour le nettoyage des installations physiques et pour la lutte antiparasitaire."
  3_prefix: "111.20"
  3_label: "Quelles sont les exigences de conception et de construction applicables à vos installations physiques ?"
  3_desc: "Toute installation physique que vous utilisez pour la fabrication, l'emballage, l'étiquetage ou la détention de compléments alimentaires doit :\n\na. Être de taille, de construction et de conception appropriées pour faciliter les opérations de maintenance, de nettoyage et de désinfection ;\n\nb. Disposer d'un espace adéquat pour le placement ordonné des équipements et la détention des matériaux nécessaires aux opérations de maintenance, de nettoyage et de désinfection et pour éviter la contamination et les mélanges de composants et de compléments alimentaires pendant la fabrication, l'emballage, l'étiquetage ou la détention ;\n\nc. Permettre l'utilisation de précautions appropriées pour réduire le potentiel de mélanges ou de contamination des composants, des compléments alimentaires ou des surfaces de contact, par des micro-organismes, des produits chimiques, de la saleté ou d'autres matériaux étrangers. Vos installations physiques doivent avoir, et vous devez utiliser, des zones séparées ou définies de taille adéquate ou d'autres systèmes de contrôle, tels que des contrôles informatisés des stocks ou des systèmes automatisés de séparation, pour éviter la contamination et les mélanges de composants et de compléments alimentaires pendant les opérations suivantes :\n\t1. Réception, identification, détention et retrait de l'utilisation des composants, des compléments alimentaires, des emballages et des étiquettes qui seront utilisés dans ou pendant la fabrication, l'emballage, l'étiquetage ou la détention de compléments alimentaires ;\n\t2. Séparation, si nécessaire, des composants, des compléments alimentaires, des emballages et des étiquettes qui doivent être utilisés dans la fabrication des composants, des compléments alimentaires, des emballages ou des étiquettes en attente de révision des matériaux et de décision de disposition, de retraitement, ou en attente d'élimination après rejet ;\n\t3. Séparation de la fabrication, de l'emballage, de l'étiquetage et de la détention de différents types de produits, y compris différents types de compléments alimentaires et d'autres aliments, cosmétiques et produits pharmaceutiques ;\n\t4. Réalisation d'analyses en laboratoire et détention des fournitures et échantillons de laboratoire ;\n\t5. Nettoyage et désinfection des surfaces de contact ;\n\t6. Opérations d'emballage et d'étiquetage ; et\n\t7. Détention des composants ou des compléments alimentaires.\n\nd. Être conçues et construites de manière à empêcher la contamination des composants, des compléments alimentaires ou des surfaces de contact.\n\t1. La conception et la construction doivent inclure :\n\t\ti. Des sols, murs et plafonds qui peuvent être adéquatement nettoyés et maintenus propres et en bon état ;\n\t\tii. Des installations, conduits et tuyaux qui ne contaminent pas les composants, les compléments alimentaires ou les surfaces de contact par égouttement ou autre fuite, ou condensation ;\n\t\tiii. Une ventilation ou un équipement de contrôle environnemental adéquat, tel que des systèmes de circulation d'air, y compris des filtres, des ventilateurs et autres équipements de soufflage d'air, qui minimisent les odeurs et les vapeurs (y compris la vapeur et les fumées nocives) dans les zones où elles peuvent contaminer les composants, les compléments alimentaires ou les surfaces de contact ;\n\t\tiv. Des équipements qui contrôlent la température et l'humidité, lorsque ces équipements sont nécessaires pour garantir la qualité du complément alimentaire ; et\n\t\tv. Des allées ou espaces de travail entre les équipements et les murs qui sont suffisamment dégagés et de largeur adéquate pour permettre à toutes les personnes d'accomplir leurs tâches et pour protéger contre la contamination des composants, des compléments alimentaires ou des surfaces de contact par les vêtements ou le contact personnel.\n\t2. Lorsque des ventilateurs et autres équipements de soufflage d'air sont utilisés, ces ventilateurs et équipements doivent être situés et utilisés de manière à minimiser le potentiel de contamination des composants, des compléments alimentaires ou des surfaces de contact par des micro-organismes et des particules.\n\ne. Fournir un éclairage adéquat dans :\n\t1. Toutes les zones où les composants ou les compléments alimentaires sont examinés, traités ou détenus ;\n\t2. Toutes les zones où les surfaces de contact sont nettoyées ; et\n\t3. Les zones de lavage des mains, les vestiaires et les toilettes.\n\nf. Utiliser des ampoules de sécurité, des luminaires, des puits de lumière ou d'autres matériaux en verre ou similaires au verre lorsque les ampoules, luminaires, puits de lumière ou autres matériaux en verre ou similaires au verre sont suspendus au-dessus de composants ou de compléments alimentaires exposés à toute étape de préparation, sauf si vos installations physiques sont autrement construites de manière à protéger contre la contamination des composants ou des compléments alimentaires en cas de bris de verre ou de matériaux similaires au verre.\n\ng. Fournir une protection efficace contre la contamination des composants et des compléments alimentaires dans les cuves de fermentation en vrac, par exemple :\n\t1. Utilisation de couvertures protectrices ;\n\t2. Placement dans des zones où vous pouvez éliminer les refuges pour les nuisibles au-dessus et autour des cuves ;\n\t3. Placement dans des zones où vous pouvez vérifier régulièrement la présence de nuisibles, d'infestation par des nuisibles, de saleté ou de tout autre matériau étranger ; et\n\t4. Utilisation d'équipements d'écumage.\n\nh. Utiliser un écran ou une autre protection adéquate contre les nuisibles, lorsque cela est nécessaire."
  4_prefix: "111.23"
  4_label: "Selon cette sous-partie C, quels enregistrements devez-vous établir et conserver ?"
  4_desc: "a. Vous devez établir et conserver les enregistrements requis par cette sous-partie C conformément à la sous-partie P de cette partie.\n\nb. Vous devez établir et conserver les enregistrements des procédures écrites pour le nettoyage des installations physiques et pour la lutte antiparasitaire.\n\nc. Vous devez établir et conserver des enregistrements montrant que l'eau, lorsqu'elle est utilisée de manière à ce qu'elle puisse devenir un composant du complément alimentaire, respecte les exigences de § 111.15(e)(2)."
4:
  prefix: "D"
  title: "Équipements et ustensiles"
  1_prefix: "111.25"
  1_label: "Quelles sont les exigences de cette sous-partie D concernant les procédures écrites ?"
  1_desc: "Vous devez établir et suivre des procédures écrites pour satisfaire aux exigences de cette sous-partie D, y compris des procédures écrites pour :\n\na. L'étalonnage des instruments et des commandes que vous utilisez dans la fabrication ou le test d'un composant ou d'un complément alimentaire ;\n\nb. L'étalonnage, l'inspection et la vérification des équipements automatisés, mécaniques et électroniques ; et\n\nc. La maintenance, le nettoyage et la désinfection, si nécessaire, de tous les équipements, ustensiles et autres surfaces de contact utilisés pour fabriquer, emballer, étiqueter ou détenir des composants ou des compléments alimentaires."
  2_prefix: "111.27"
  2_label: "Quelles exigences s'appliquent aux équipements et ustensiles que vous utilisez ?"
  2_desc: "a. Vous devez utiliser des équipements et des ustensiles de conception, de construction et de qualité de fabrication appropriées pour qu'ils soient adaptés à leur usage prévu et puissent être adéquatement nettoyés et correctement entretenus.\n\t1. Les équipements et ustensiles incluent les éléments suivants :\n\t\ti. Équipements utilisés pour contenir ou transporter ;\n\t\tii. Équipements utilisés pour mesurer ;\n\t\tiii. Équipements utilisant de l'air ou du gaz comprimé ;\n\t\tiv. Équipements utilisés pour effectuer des processus dans des tuyaux et des récipients fermés ; et\n\t\tv. Équipements utilisés dans des systèmes automatisés, mécaniques ou électroniques.\n\t2. Vous devez utiliser des équipements et des ustensiles de conception et de construction appropriées de manière à ce que leur utilisation ne entraîne pas la contamination des composants ou des compléments alimentaires par :\n\t\ti. Des lubrifiants ;\n\t\tii. Du carburant ;\n\t\tiii. Des réfrigérants ;\n\t\tiv. Des fragments de métal ou de verre ;\n\t\tv. De la saleté ou tout autre matériau étranger ;\n\t\tvi. De l'eau contaminée ; ou\n\t\tvii. Tout autre contaminant.\n\t3. Tous les équipements et ustensiles que vous utilisez doivent être :\n\t\ti. Installés et entretenus de manière à faciliter le nettoyage des équipements, des ustensiles et de tous les espaces adjacents ;\n\t\tii. Résistants à la corrosion si l'équipement ou les ustensiles entrent en contact avec des composants ou des compléments alimentaires ;\n\t\tiii. Fabriqués à partir de matériaux non toxiques ;\n\t\tiv. Conçus et construits pour résister à l'environnement dans lequel ils sont utilisés, à l'action des composants ou des compléments alimentaires, et, le cas échéant, aux composés de nettoyage et aux agents de désinfection ; et\n\t\tv. Entretenus pour protéger les composants et les compléments alimentaires de toute contamination.\n\t4. Les équipements et ustensiles que vous utilisez doivent avoir des joints qui sont lissés ou entretenus pour minimiser l'accumulation de saleté, de saletés, de matière organique, de particules de composants ou de compléments alimentaires, ou de tout autre matériau étranger ou contaminant.\n\t5. Chaque congélateur, réfrigérateur et autre compartiment de stockage à froid que vous utilisez pour conserver des composants ou des compléments alimentaires :\n\t\ti. Doit être équipé d'un thermomètre indicateur, d'un dispositif de mesure de la température ou d'un dispositif d'enregistrement de la température qui indique et enregistre, ou permet d'enregistrer manuellement, la température de manière précise à l'intérieur du compartiment ; et\n\t\tii. Doit disposer d'un dispositif automatisé pour réguler la température ou d'un système d'alarme automatisé pour indiquer un changement significatif de température dans une opération manuelle.\n\t6. Les instruments ou commandes utilisés dans la fabrication, l'emballage, l'étiquetage ou la détention d'un complément alimentaire, et les instruments ou commandes que vous utilisez pour mesurer, réguler ou enregistrer les températures, la concentration en ions hydrogène (pH), l'activité de l'eau ou d'autres conditions, pour contrôler ou prévenir la croissance de micro-organismes ou d'autres contaminations doivent être :\n\t\ti. Précis et exacts ;\n\t\tii. Correctement entretenus ; et\n\t\tiii. En nombre suffisant pour leurs usages désignés.\n\t7. L'air comprimé ou d'autres gaz que vous introduisez mécaniquement dans ou sur un composant, un complément alimentaire ou une surface de contact, ou que vous utilisez pour nettoyer une surface de contact, doit être traité de manière à ce que le composant, le complément alimentaire ou la surface de contact ne soit pas contaminé.\n\nb. Vous devez étalonner les instruments et commandes que vous utilisez dans la fabrication ou le test d'un composant ou d'un complément alimentaire. Vous devez étalonner :\n\t1. Avant la première utilisation ; et\n\t2. À la fréquence spécifiée par écrit par le fabricant de l'instrument et de la commande ; ou\n\t3. À intervalles réguliers ou selon les besoins pour garantir la précision et l'exactitude de l'instrument et de la commande.\n\nc. Vous devez réparer ou remplacer les instruments ou commandes qui ne peuvent pas être ajustés pour correspondre à la norme de référence.\n\nd. Vous devez entretenir, nettoyer et désinfecter, si nécessaire, tous les équipements, ustensiles et autres surfaces de contact utilisés pour fabriquer, emballer, étiqueter ou détenir des composants ou des compléments alimentaires.\n\t1. Les équipements et ustensiles doivent être démontés si nécessaire pour un entretien, un nettoyage et une désinfection approfondis.\n\t2. Vous devez vous assurer que toutes les surfaces de contact, utilisées pour la fabrication ou la détention de composants ou de compléments alimentaires à faible teneur en humidité, sont dans un état sec et sanitaire lors de leur utilisation. Lorsque les surfaces sont nettoyées à l'humide, elles doivent être désinfectées, si nécessaire, et soigneusement séchées avant leur utilisation ultérieure.\n\t3. Si vous utilisez un traitement humide pendant la fabrication, vous devez nettoyer et désinfecter toutes les surfaces de contact, si nécessaire, pour protéger contre l'introduction de micro-organismes dans les composants ou les compléments alimentaires. Lorsque le nettoyage et la désinfection sont nécessaires, vous devez nettoyer et désinfecter toutes les surfaces de contact avant utilisation et après toute interruption pendant laquelle la surface de contact peut avoir été contaminée. Si vous utilisez des surfaces de contact dans une opération de production continue ou dans des opérations consécutives impliquant différents lots du même complément alimentaire, vous devez nettoyer et désinfecter adéquatement les surfaces de contact, si nécessaire.\n\t4. Vous devez nettoyer les surfaces qui n'entrent pas en contact direct avec les composants ou les compléments alimentaires aussi souvent que nécessaire pour protéger contre la contamination des composants ou des compléments alimentaires.\n\t5. Les articles à usage unique (tels que les ustensiles destinés à un usage unique, les gobelets en papier et les serviettes en papier) doivent être :\n\t\ti. Stockés dans des conteneurs appropriés ; et\n\t\tii. Manipulés, distribués, utilisés et éliminés de manière à protéger contre la contamination des composants, des compléments alimentaires ou de toute surface de contact.\n\t6. Les composés de nettoyage et les agents de désinfection doivent être adéquats pour leur usage prévu et sûrs dans leurs conditions d'utilisation ;\n\t7. Vous devez stocker les équipements et ustensiles portables nettoyés et désinfectés ayant des surfaces de contact dans un endroit et de manière à les protéger de la contamination."
  3_prefix: "111.30"
  3_label: "Quelles exigences s'appliquent aux équipements automatisés, mécaniques ou électroniques ?"
  3_desc: "Pour tout équipement automatisé, mécanique ou électronique que vous utilisez pour fabriquer, emballer, étiqueter ou détenir un complément alimentaire, vous devez :\n\na. Concevoir ou sélectionner l'équipement pour garantir que les spécifications des compléments alimentaires sont constamment respectées ;\n\nb. Déterminer l'adéquation de l'équipement en vous assurant que votre équipement est capable de fonctionner de manière satisfaisante dans les limites de fonctionnement requises par le processus ;\n\nc. Étalonner, inspecter ou vérifier régulièrement l'équipement pour garantir un bon fonctionnement. Votre personnel de contrôle qualité doit périodiquement examiner ces étalonnages, inspections ou vérifications ;\n\nd. Établir et utiliser des contrôles appropriés pour les équipements automatisés, mécaniques et électroniques (y compris les logiciels pour un processus contrôlé par ordinateur) pour garantir que tout changement apporté à la fabrication, l'emballage, l'étiquetage, la détention ou d'autres opérations soit approuvé par le personnel de contrôle qualité et mis en œuvre uniquement par du personnel autorisé ; et\n\ne. Établir et utiliser des contrôles appropriés pour garantir que l'équipement fonctionne conformément à son usage prévu. Ces contrôles doivent être approuvés par le personnel de contrôle qualité."
  4_prefix: "111.35"
  4_label: "Selon cette sous-partie D, quels enregistrements devez-vous établir et conserver ?"
  4_desc: "a. Vous devez établir et conserver les enregistrements requis par cette sous-partie D conformément à la sous-partie P de cette partie.\n\nb. Vous devez établir et conserver les enregistrements suivants :\n\t1. Les procédures écrites pour satisfaire aux exigences de cette sous-partie, y compris les procédures écrites pour :\n\t\ti. L'étalonnage des instruments et des commandes que vous utilisez dans la fabrication ou le test d'un composant ou d'un complément alimentaire ;\n\t\tii. L'étalonnage, l'inspection et la vérification des équipements automatisés, mécaniques et électroniques ; et\n\t\tiii. La maintenance, le nettoyage et la désinfection, si nécessaire, de tous les équipements, ustensiles et autres surfaces de contact utilisés pour fabriquer, emballer, étiqueter ou détenir des composants ou des compléments alimentaires ;\n\t2. La documentation, dans des journaux d'équipement individuels, de la date d'utilisation, de maintenance, de nettoyage et de désinfection de l'équipement, sauf si cette documentation est conservée avec l'enregistrement du lot ;\n\t3. La documentation de tout étalonnage, à chaque fois que l'étalonnage est effectué, pour les instruments et commandes que vous utilisez dans la fabrication ou le test d'un composant ou d'un complément alimentaire. Dans votre documentation, vous devez :\n\t\ti. Identifier l'instrument ou la commande étalonnée ;\n\t\tii. Fournir la date de l'étalonnage ;\n\t\tiii. Identifier la norme de référence utilisée, y compris la certification de l'exactitude de la norme de référence connue et un historique de recertification de l'exactitude ;\n\t\tiv. Identifier la méthode d'étalonnage utilisée, y compris les limites appropriées pour l'exactitude et la précision des instruments et commandes lors de l'étalonnage ;\n\t\tv. Fournir la ou les lectures d'étalonnage trouvées ;\n\t\tvi. Identifier la méthode de réétalonnage utilisée, et la ou les lectures trouvées, si les limites d'exactitude ou de précision, ou les deux, pour les instruments et commandes n'ont pas été respectées ; et\n\t\tvii. Inclure les initiales de la personne qui a effectué l'étalonnage et tout réétalonnage.\n\t4. Les enregistrements écrits des étalonnages, inspections et vérifications des équipements automatisés, mécaniques et électroniques ;\n\t5. Un ou des fichiers de sauvegarde des programmes logiciels actuels (et des logiciels obsolètes nécessaires pour récupérer les enregistrements que vous êtes tenu de conserver conformément à la sous-partie P de cette partie, lorsque le logiciel actuel ne peut pas récupérer ces enregistrements) et des données entrées dans les systèmes informatiques que vous utilisez pour fabriquer, emballer, étiqueter ou détenir des compléments alimentaires.\n\t\ti. Votre fichier de sauvegarde (par exemple, une copie papier des données que vous avez entrées, des disquettes, des bandes, des microfilms ou des disques compacts) doit être un enregistrement exact et complet des données que vous avez entrées.\n\t\tii. Vous devez conserver vos programmes logiciels et données de sauvegarde sécurisés contre les altérations, les effacements involontaires ou la perte ; et\n\t6. La documentation des contrôles que vous utilisez pour garantir que l'équipement fonctionne conformément à son usage prévu."
5:
  prefix: "E"
  title: "Exigence d'établir un système de contrôle de la production et des processus"
  1_prefix: "111.55"
  1_label: "Quelles sont les exigences pour la mise en œuvre d'un système de contrôle de la production et des processus ?"
  1_desc: "Vous devez mettre en œuvre un système de contrôle de la production et des processus qui couvre toutes les étapes de la fabrication, de l'emballage, de l'étiquetage et de la détention du complément alimentaire pour garantir la qualité du complément alimentaire et que le complément alimentaire est emballé et étiqueté comme spécifié dans le registre de fabrication principal."
  2_prefix: "111.60"
  2_label: "Quelles sont les exigences de conception pour le système de contrôle de la production et des processus ?"
  2_desc: "a. Votre système de contrôle de la production et des processus doit être conçu pour garantir que le complément alimentaire est fabriqué, emballé, étiqueté et détenu de manière à assurer la qualité du complément alimentaire et que le complément alimentaire est emballé et étiqueté comme spécifié dans le registre de fabrication principal ; et\n\nb. Le système de contrôle de la production et des processus doit inclure toutes les exigences des sous-parties E à L de cette partie et doit être examiné et approuvé par le personnel de contrôle qualité."
  3_prefix: "111.65"
  3_label: "Quelles sont les exigences pour les opérations de contrôle qualité ?"
  3_desc: "Vous devez mettre en œuvre des opérations de contrôle qualité dans vos opérations de fabrication, d'emballage, d'étiquetage et de détention pour produire le complément alimentaire afin de garantir la qualité du complément alimentaire et que le complément alimentaire est emballé et étiqueté comme spécifié dans le registre de fabrication principal."
  4_prefix: "111.70"
  4_label: "Quelles spécifications devez-vous établir ?"
  4_desc: "a. Vous devez établir une spécification pour tout point, étape ou stade du processus de fabrication où le contrôle est nécessaire pour garantir la qualité du complément alimentaire et que le complément alimentaire est emballé et étiqueté comme spécifié dans le registre de fabrication principal.\n\nb. Pour chaque composant que vous utilisez dans la fabrication d'un complément alimentaire, vous devez établir des spécifications de composant comme suit :\n\t1. Vous devez établir une spécification d'identité ;\n\t2. Vous devez établir des spécifications de composant nécessaires pour garantir que les spécifications de pureté, de force et de composition des compléments alimentaires fabriqués à l'aide des composants sont respectées ; et\n\t3. Vous devez établir des limites sur les types de contamination qui peuvent altérer ou peuvent conduire à l'altération du lot fini du complément alimentaire pour garantir la qualité du complément alimentaire.\n\nc. Pour la production en cours :\n\t1. Vous devez établir des spécifications en cours de processus pour tout point, étape ou stade du registre de fabrication principal où le contrôle est nécessaire pour aider à garantir que les spécifications sont respectées pour l'identité, la pureté, la force et la composition des compléments alimentaires et, si nécessaire, pour les limites sur les types de contamination qui peuvent altérer ou peuvent conduire à l'altération du lot fini du complément alimentaire ;\n\t2. Vous devez fournir une documentation adéquate de votre justification expliquant pourquoi le respect des spécifications en cours de processus, en combinaison avec le respect des spécifications des composants, aidera à garantir que les spécifications sont respectées pour l'identité, la pureté, la force et la composition des compléments alimentaires et pour les limites sur les types de contamination qui peuvent altérer ou peuvent conduire à l'altération du lot fini du complément alimentaire ; et\n\t3. Le personnel de contrôle qualité doit examiner et approuver la documentation que vous fournissez conformément au paragraphe (c)(2) de cette section.\n\nd. Vous devez établir des spécifications pour les étiquettes des compléments alimentaires (spécifications d'étiquettes) et pour les emballages pouvant entrer en contact avec les compléments alimentaires (spécifications d'emballage). Les emballages pouvant entrer en contact avec les compléments alimentaires doivent être sûrs et adaptés à leur usage prévu et ne doivent pas être réactifs ou absorbants ou autrement affecter la sécurité ou la qualité du complément alimentaire.\n\ne. Pour chaque complément alimentaire que vous fabriquez, vous devez établir des spécifications de produit pour l'identité, la pureté, la force et la composition du lot fini du complément alimentaire, et pour les limites sur les types de contamination qui peuvent altérer, ou qui peuvent conduire à l'altération du lot fini du complément alimentaire pour garantir la qualité du complément alimentaire.\n\nf. Si vous recevez un produit d'un fournisseur pour l'emballage ou l'étiquetage en tant que complément alimentaire (et pour la distribution plutôt que pour le retour au fournisseur), vous devez établir des spécifications pour fournir une assurance suffisante que le produit que vous recevez est adéquatement identifié et est conforme à votre bon de commande.\n\ng. Vous devez établir des spécifications pour l'emballage et l'étiquetage des compléments alimentaires finis emballés et étiquetés, y compris des spécifications qui garantissent que vous avez utilisé l'emballage spécifié et que vous avez appliqué l'étiquette spécifiée."
  5_prefix: "111.73"
  5_label: "Quelle est votre responsabilité pour déterminer si les spécifications établies sont respectées ?"
  5_desc: "Vous devez déterminer si les spécifications que vous établissez conformément à la section 111.70 sont respectées."
  6_prefix: "111.75"
  6_label: "Que devez-vous faire pour déterminer si les spécifications sont respectées ?"
  6_desc: "a. Avant d'utiliser un composant, vous devez :\n\t1.\n\t\ti. Effectuer au moins un test ou un examen approprié pour vérifier l'identité de tout composant qui est un ingrédient alimentaire, sauf si vous présentez une pétition à l'agence conformément au paragraphe (a)(1)(ii) de cette section et que l'agence vous en exonère ;\n\t\tii. Vous pouvez soumettre une pétition, conformément au 21 CFR 10.30, pour demander une exemption des exigences de test prévues au paragraphe (a)(1)(i) de cette section. La pétition doit exposer la justification scientifique et doit être accompagnée des données et informations à l'appui, pour des tests alternatifs proposés qui démontreront qu'il n'y a pas de diminution significative de l'assurance, par rapport à l'assurance fournie par un test d'identité à 100 %, de l'identité de l'ingrédient alimentaire avant utilisation lorsque l'ingrédient alimentaire est obtenu d'un ou plusieurs fournisseurs identifiés dans la pétition. Si la FDA accorde la pétition, vous devez effectuer les tests et examens pour l'ingrédient alimentaire, autrement requis en vertu de § 111.75(a)(1)(i), selon les termes spécifiés par la FDA lorsque la pétition est accordée ; et\n\t2. Confirmer l'identité des autres composants et déterminer si les autres spécifications de composant applicables établies conformément à § 111.70(b) sont respectées. Pour ce faire, vous devez soit :\n\t\ti. Effectuer des tests ou examens appropriés ; ou\n\t\tii. Vous fier à un certificat d'analyse du fournisseur du composant que vous recevez, à condition que :\n\t\t\tA. Vous qualifiiez d'abord le fournisseur en établissant la fiabilité du certificat d'analyse du fournisseur par la confirmation des résultats des tests ou examens du fournisseur ;\n\t\t\tB. Le certificat d'analyse inclut une description de la ou des méthodes de test ou d'examen utilisées, les limites des tests ou examens, et les résultats réels des tests ou examens ;\n\t\t\tC. Vous conserviez une documentation de la manière dont vous avez qualifié le fournisseur ;\n\t\t\tD. Vous reconfirmiez périodiquement le certificat d'analyse du fournisseur ; et\n\t\t\tE. Votre personnel de contrôle qualité examine et approuve la documentation exposant les bases de la qualification (et de la requalification) de tout fournisseur.\n\nb. Vous devez surveiller les points, étapes ou stades en cours de processus où le contrôle est nécessaire pour garantir la qualité du lot fini de complément alimentaire afin de :\n\t1. Déterminer si les spécifications en cours de processus sont respectées ; et\n\t2. Détecter toute déviation ou occurrence imprévue qui pourrait entraîner un non-respect des spécifications.\n\nc. Pour un sous-ensemble de lots finis de compléments alimentaires que vous identifiez par un plan d'échantillonnage statistique solide (ou pour chaque lot fini), vous devez vérifier que votre lot fini de complément alimentaire respecte les spécifications de produit pour l'identité, la pureté, la force, la composition et pour les limites sur les types de contamination qui peuvent altérer ou qui peuvent conduire à l'altération du lot fini du complément alimentaire. Pour ce faire :\n\t1. Vous devez sélectionner une ou plusieurs spécifications établies pour l'identité, la pureté, la force, la composition et les limites sur les types de contamination qui peuvent altérer ou qui peuvent conduire à l'altération du complément alimentaire qui, si testées ou examinées sur les lots finis du complément alimentaire, vérifieraient que le système de contrôle de la production et des processus produit un complément alimentaire qui respecte toutes les spécifications de produit (ou seulement celles des spécifications de produit non autrement exemptées de cette disposition par le personnel de contrôle qualité conformément au paragraphe (d) de cette section) ;\n\t2. Vous devez effectuer des tests ou examens appropriés pour déterminer la conformité aux spécifications sélectionnées au paragraphe (c)(1) de cette section ;\n\t3. Vous devez fournir une documentation adéquate de votre justification pour déterminer que la conformité aux spécifications sélectionnées au paragraphe (c)(1) de cette section, par l'utilisation de tests ou examens appropriés effectués conformément au paragraphe (c)(2) de cette section, garantira que votre lot fini de complément alimentaire respecte toutes les spécifications de produit pour l'identité, la pureté, la force et la composition, et les limites sur les types de contamination qui peuvent altérer, ou qui peuvent conduire à l'altération du complément alimentaire ; et\n\t4. Votre personnel de contrôle qualité doit examiner et approuver la documentation que vous fournissez conformément au paragraphe (c)(3) de cette section.\n\nd.\n\t1. Vous pouvez exempter une ou plusieurs spécifications de produit des exigences de vérification prévues au paragraphe (c)(1) de cette section si vous déterminez et documentez que les spécifications que vous sélectionnez conformément au paragraphe (c)(1) de cette section pour la détermination de la conformité aux spécifications ne sont pas en mesure de vérifier que le système de contrôle de la production et des processus produit un complément alimentaire qui respecte la spécification de produit exemptée et qu'il n'existe aucune méthode scientifiquement valide pour tester ou examiner une telle spécification de produit exemptée au stade du lot fini. Dans un tel cas, vous devez documenter pourquoi, par exemple, tout test, examen ou surveillance des composants et en cours de processus, et toute autre information, garantira que cette spécification de produit exemptée est respectée sans vérification par des tests périodiques du lot fini ; et\n\t2. Votre personnel de contrôle qualité doit examiner et approuver la documentation que vous fournissez conformément au paragraphe (d)(1) de cette section.\n\ne. Avant d'emballer ou d'étiqueter un produit que vous recevez pour l'emballage ou l'étiquetage en tant que complément alimentaire (et pour la distribution plutôt que pour le retour au fournisseur), vous devez examiner visuellement le produit et disposer d'une documentation pour déterminer si les spécifications que vous avez établies conformément à § 111.70(f) sont respectées.\n\nf.\n\t1. Avant d'utiliser un emballage, vous devez, au minimum, effectuer une identification visuelle des conteneurs et des fermetures et examiner la facture, la garantie ou la certification du fournisseur pour déterminer si les spécifications d'emballage sont respectées ; et\n\t2. Avant d'utiliser des étiquettes, vous devez, au minimum, effectuer un examen visuel de l'étiquette et examiner la facture, la garantie ou la certification du fournisseur pour déterminer si les spécifications d'étiquette sont respectées.\n\ng. Vous devez, au minimum, effectuer un examen visuel de l'emballage et de l'étiquetage des compléments alimentaires finis emballés et étiquetés pour déterminer si vous avez utilisé l'emballage spécifié et appliqué l'étiquette spécifiée.\n\nh.\n\t1. Vous devez vous assurer que les tests et examens que vous utilisez pour déterminer si les spécifications sont respectées sont des méthodes appropriées et scientifiquement valides.\n\t2. Les tests et examens que vous utilisez doivent inclure au moins l'une des méthodes suivantes :\n\t\ti. Analyse organoleptique globale ;\n\t\tii. Analyse macroscopique ;\n\t\tiii. Analyse microscopique ;\n\t\tiv. Analyse chimique ; ou\n\t\tv. Autres méthodes scientifiquement valides.\n\ni. Vous devez établir des plans d'action corrective pour une utilisation lorsqu'une spécification établie n'est pas respectée."
  7_prefix: "111.77"
  7_label: "Que devez-vous faire si les spécifications établies ne sont pas respectées ?"
  7_desc: "a. Pour les spécifications établies conformément à § 111.70(a), (b)(2), (b)(3), (c), (d), (e) et (g) qui ne sont pas respectées, le personnel de contrôle qualité, conformément aux exigences de la sous-partie F de cette partie, doit rejeter le composant, le complément alimentaire, l'emballage ou l'étiquette, à moins que ce personnel n'approuve un traitement, un ajustement en cours de processus ou un retraitement qui garantira la qualité du complément alimentaire fini et que le complément alimentaire est emballé et étiqueté comme spécifié dans le registre de fabrication principal. Aucun lot fini de compléments alimentaires ne peut être libéré pour distribution s'il ne respecte pas § 111.123(b).\n\nb. Pour les spécifications établies conformément à § 111.70(b)(1) qui ne sont pas respectées, le personnel de contrôle qualité doit rejeter le composant et le composant ne doit pas être utilisé dans la fabrication du complément alimentaire.\n\nc. Pour les spécifications établies conformément à § 111.70(f) qui ne sont pas respectées, le personnel de contrôle qualité doit rejeter le produit et le produit ne peut pas être emballé ou étiqueté pour distribution en tant que complément alimentaire."
  8_prefix: "111.80"
  8_label: "Quels échantillons représentatifs devez-vous prélever ?"
  8_desc: "Les échantillons représentatifs que vous devez prélever incluent :\n\na. Des échantillons représentatifs de chaque lot unique de composants, d'emballages et d'étiquettes que vous utilisez pour déterminer si les composants, les emballages et les étiquettes respectent les spécifications établies conformément à § 111.70(b) et (d), et le cas échéant, § 111.70(a) (et, lorsque vous recevez des composants, des emballages ou des étiquettes d'un fournisseur, des échantillons représentatifs de chaque expédition unique, et de chaque lot unique au sein de chaque expédition unique) ;\n\nb. Des échantillons représentatifs de matériaux en cours de processus pour chaque lot fabriqué aux points, étapes ou stades du processus de fabrication, comme spécifié dans le registre de fabrication principal, où le contrôle est nécessaire pour garantir l'identité, la pureté, la force et la composition des compléments alimentaires afin de déterminer si les matériaux en cours de processus respectent les spécifications établies conformément à § 111.70(c), et le cas échéant, § 111.70(a) ;\n\nc. Des échantillons représentatifs d'un sous-ensemble de lots finis de chaque complément alimentaire que vous fabriquez, que vous identifiez par un plan d'échantillonnage statistique solide (ou sinon chaque lot fini), avant la libération pour distribution afin de vérifier que le lot fini de complément alimentaire respecte les spécifications de produit établies conformément à § 111.70(e), et le cas échéant, § 111.70(a) ;\n\nd. Des échantillons représentatifs de chaque expédition unique, et de chaque lot unique au sein de chaque expédition unique, de produit que vous recevez pour l'emballage ou l'étiquetage en tant que complément alimentaire (et pour la distribution plutôt que pour le retour au fournisseur) afin de déterminer si le produit reçu respecte les spécifications établies conformément à § 111.70(f), et le cas échéant, § 111.70(a) ; et\n\ne. Des échantillons représentatifs de chaque lot de compléments alimentaires emballés et étiquetés pour déterminer si l'emballage et l'étiquetage des compléments alimentaires finis emballés et étiquetés respectent les spécifications établies conformément à § 111.70(g), et le cas échéant, § 111.70(a)."
  9_prefix: "111.83"
  9_label: "Quelles sont les exigences pour les échantillons de réserve ?"
  9_desc: "a. Vous devez prélever et conserver des échantillons de réserve de chaque lot de compléments alimentaires emballés et étiquetés que vous distribuez.\n\nb. Les échantillons de réserve doivent :\n\t1. Être conservés en utilisant le même système de fermeture de conteneur dans lequel le complément alimentaire emballé et étiqueté est distribué, ou, si vous distribuez des compléments alimentaires à emballer et étiqueter, en utilisant un système de fermeture de conteneur qui offre essentiellement les mêmes caractéristiques pour protéger contre la contamination ou la détérioration que celui dans lequel il est distribué pour l'emballage et l'étiquetage ailleurs ;\n\t2. Être identifiés avec le numéro de lot, de lot ou de contrôle ;\n\t3. Être conservés pendant 1 an après la date de péremption (si une date de péremption est utilisée), ou pendant 2 ans à partir de la date de distribution du dernier lot de compléments alimentaires associé à l'échantillon de réserve, pour une utilisation dans les investigations appropriées ; et\n\t4. Être constitués d'au moins le double de la quantité nécessaire pour tous les tests ou examens visant à déterminer si le complément alimentaire respecte ou non les spécifications de produit."
  10_prefix: "111.87"
  10_label: "Qui effectue une révision des matériaux et prend une décision de disposition ?"
  10_desc: "Le personnel de contrôle qualité doit effectuer toutes les révisions de matériaux requises et prendre toutes les décisions de disposition requises."
  11_prefix: "111.90"
  11_label: "Quelles exigences s'appliquent aux traitements, ajustements en cours de processus et retraitements lorsqu'il y a une déviation ou une occurrence imprévue ou lorsqu'une spécification établie conformément à § 111.70 n'est pas respectée ?"
  11_desc: "a. Vous ne devez pas retraiter un complément alimentaire rejeté ou traiter ou apporter un ajustement en cours de processus à un composant, un emballage ou une étiquette pour le rendre apte à l'utilisation dans la fabrication d'un complément alimentaire, à moins que :\n\t1. Le personnel de contrôle qualité effectue une révision des matériaux et prenne une décision de disposition pour approuver le retraitement, le traitement ou l'ajustement en cours de processus ; et\n\t2. Le retraitement, le traitement ou l'ajustement en cours de processus soit autorisé par § 111.77 ;\n\nb. Vous ne devez pas retraiter un complément alimentaire ou traiter ou apporter un ajustement en cours de processus à un composant pour le rendre apte à l'utilisation dans la fabrication d'un complément alimentaire, à moins que :\n\t1. Le personnel de contrôle qualité effectue une révision des matériaux et prenne une décision de disposition basée sur une raison scientifiquement valide et approuve le retraitement, le traitement ou l'ajustement en cours de processus ; et\n\t2. Le retraitement, le traitement ou l'ajustement en cours de processus soit autorisé par § 111.77 ;\n\nc. Tout lot de complément alimentaire qui est retraité, qui contient des composants que vous avez traités, ou auquel vous avez apporté des ajustements en cours de processus pour les rendre aptes à l'utilisation dans la fabrication du complément alimentaire doit être approuvé par le personnel de contrôle qualité et respecter § 111.123(b) avant d'être libéré pour distribution."
  12_prefix: "111.95"
  12_label: "Selon cette sous-partie E, quels enregistrements devez-vous établir et conserver ?"
  12_desc: "a. Vous devez établir et conserver les enregistrements requis par cette sous-partie E conformément à la sous-partie P de cette partie.\n\nb. Selon cette sous-partie E, vous devez établir et conserver les enregistrements suivants :\n\t1. Les spécifications établies ;\n\t2. La documentation de votre qualification d'un fournisseur dans le but de vous fier au certificat d'analyse du fournisseur ;\n\t3. La documentation expliquant pourquoi le respect des spécifications en cours de processus, en combinaison avec le respect des spécifications des composants, aide à garantir que le complément alimentaire respecte les spécifications pour l'identité, la pureté, la force et la composition ; et pour les limites sur les types de contamination qui peuvent altérer ou peuvent conduire à l'altération du lot fini du complément alimentaire ; et\n\t4. La documentation expliquant pourquoi les résultats de tests ou examens appropriés pour les spécifications de produit sélectionnées conformément à § 111.75(c)(1) garantissent que le complément alimentaire respecte toutes les spécifications de produit ;\n\t5. La documentation expliquant pourquoi tout test, examen ou surveillance des composants et en cours de processus, et toute autre information, garantira qu'une spécification de produit exemptée conformément à § 111.75(d) est respectée sans vérification par des tests périodiques du lot fini, y compris la documentation indiquant que les spécifications sélectionnées testées ou examinées conformément à § 111.75(c)(1) ne sont pas en mesure de vérifier que le système de contrôle de la production et des processus produit un complément alimentaire qui respecte la spécification de produit exemptée et qu'il n'existe aucune méthode scientifiquement valide pour tester ou examiner une telle spécification de produit exemptée au stade du lot fini.\n\t6. La documentation de la réponse de la FDA à une pétition soumise conformément à § 111.75(a)(1)(ii) prévoyant une exemption des dispositions de § 111.75(a)(1)(i)."
6:
  prefix: "F"
  title: "Système de contrôle de la production et des processus : Exigences pour le contrôle qualité"
  1_prefix: "111.103"
  1_label: "Quelles sont les exigences de cette sous-partie F concernant les procédures écrites ?"
  1_desc: "Vous devez établir et suivre des procédures écrites pour les responsabilités des opérations de contrôle qualité, y compris des procédures écrites pour effectuer une révision des matériaux et prendre une décision de disposition, ainsi que pour approuver ou rejeter tout retraitement."
  2_prefix: "111.105"
  2_label: "Que doit faire le personnel de contrôle qualité ?"
  2_desc: "Le personnel de contrôle qualité doit s'assurer que vos opérations de fabrication, d'emballage, d'étiquetage et de détention garantissent la qualité du complément alimentaire et que le complément alimentaire est emballé et étiqueté comme spécifié dans le registre de fabrication principal. Pour ce faire, le personnel de contrôle qualité doit effectuer des opérations qui incluent :\n\na. Approuver ou rejeter tous les processus, spécifications, procédures écrites, contrôles, tests et examens, ainsi que les écarts ou modifications à ceux-ci, qui peuvent affecter l'identité, la pureté, la force ou la composition d'un complément alimentaire ;\n\nb. Examiner et approuver la documentation exposant les bases de la qualification de tout fournisseur ;\n\nc. Examiner et approuver la documentation exposant les bases pour lesquelles le respect des spécifications en cours de processus, en combinaison avec le respect des spécifications des composants, aidera à garantir que l'identité, la pureté, la force et la composition du complément alimentaire sont respectées ;\n\nd. Examiner et approuver la documentation exposant les bases pour lesquelles les résultats de tests ou examens appropriés pour chaque spécification de produit sélectionnée conformément à § 111.75(c)(1) garantiront que le lot fini du complément alimentaire respecte les spécifications du produit ;\n\ne. Examiner et approuver les bases et la documentation expliquant pourquoi une spécification de produit est exemptée des exigences de vérification de § 111.75(c)(1), et pourquoi tout test, examen ou surveillance des composants et en cours de processus, ou d'autres méthodes, garantira que cette spécification de produit exemptée est respectée sans vérification par des tests périodiques du lot fini ;\n\nf. S'assurer que les échantillons représentatifs requis sont prélevés ;\n\ng. S'assurer que les échantillons de réserve requis sont prélevés et conservés ;\n\nh. Déterminer si toutes les spécifications établies conformément à § 111.70(a) sont respectées ; et\n\ni. Effectuer d'autres opérations requises par cette sous-partie."
  3_prefix: "111.110"
  3_label: "Quelles opérations de contrôle qualité sont requises pour les opérations de laboratoire associées au système de contrôle de la production et des processus ?"
  3_desc: "Les opérations de contrôle qualité pour les opérations de laboratoire associées au système de contrôle de la production et des processus doivent inclure :\n\na. Examiner et approuver tous les processus de contrôle de laboratoire associés au système de contrôle de la production et des processus ;\n\nb. S'assurer que tous les tests et examens requis conformément à § 111.75 sont effectués ; et\n\nc. Examiner et approuver les résultats de tous les tests et examens requis conformément à § 111.75."
  4_prefix: "111.113"
  4_label: "Quelles opérations de contrôle qualité sont requises pour une révision des matériaux et une décision de disposition ?"
  4_desc: "a. Le personnel de contrôle qualité doit effectuer une révision des matériaux et prendre une décision de disposition si :\n\t1. Une spécification établie conformément à § 111.70 n'est pas respectée ;\n\t2. Un lot s'écarte du registre de fabrication principal, y compris lorsqu'une étape établie dans le registre de fabrication principal n'est pas terminée et incluant tout écart par rapport aux spécifications ;\n\t3. Il y a une occurrence imprévue pendant les opérations de fabrication qui altère ou pourrait entraîner l'altération du composant, du complément alimentaire ou de l'emballage, ou pourrait conduire à l'utilisation d'une étiquette non spécifiée dans le registre de fabrication principal ;\n\t4. L'étalonnage d'un instrument ou d'un contrôle suggère un problème qui pourrait avoir entraîné une défaillance dans la garantie de la qualité d'un ou plusieurs lots d'un complément alimentaire ; ou\n\t5. Un complément alimentaire est retourné.\n\nb.\n\t1. Lorsqu'il y a un écart ou une occurrence imprévue pendant le système de contrôle de la production et des processus qui entraîne ou pourrait entraîner l'altération d'un composant, d'un complément alimentaire ou d'un emballage, ou pourrait conduire à l'utilisation d'une étiquette non spécifiée dans le registre de fabrication principal, le personnel de contrôle qualité doit rejeter le composant, le complément alimentaire, l'emballage ou l'étiquette, à moins qu'il n'approuve un traitement, un ajustement en cours de processus ou un retraitement pour corriger l'écart ou l'occurrence applicable.\n\t2. Lorsqu'une spécification établie conformément à § 111.70 n'est pas respectée, le personnel de contrôle qualité doit rejeter le composant, le complément alimentaire, l'emballage ou l'étiquette, à moins que le personnel de contrôle qualité n'approuve un traitement, un ajustement en cours de processus ou un retraitement, comme autorisé par § 111.77.\n\nc. La personne qui effectue une révision des matériaux et prend la décision de disposition doit, au moment de l'exécution, documenter cette révision des matériaux et cette décision de disposition."
  5_prefix: "111.117"
  5_label: "Quelles opérations de contrôle qualité sont requises pour les équipements, instruments et contrôles ?"
  5_desc: "Les opérations de contrôle qualité pour les équipements, instruments et contrôles doivent inclure :\n\na. Examiner et approuver tous les processus d'étalonnage des instruments et des contrôles ;\n\nb. Examiner périodiquement tous les enregistrements d'étalonnage des instruments et des contrôles ;\n\nc. Examiner périodiquement tous les enregistrements d'étalonnages, inspections et vérifications des équipements automatisés, mécaniques ou électroniques ; et\n\nd. Examiner et approuver les contrôles pour s'assurer que les équipements automatisés, mécaniques ou électroniques fonctionnent conformément à leur usage prévu."
  6_prefix: "111.120"
  6_label: "Quelles opérations de contrôle qualité sont requises pour les composants, emballages et étiquettes avant leur utilisation dans la fabrication d'un complément alimentaire ?"
  6_desc: "Les opérations de contrôle qualité pour les composants, emballages et étiquettes avant leur utilisation dans la fabrication d'un complément alimentaire doivent inclure :\n\na. Examiner tous les enregistrements de réception des composants, emballages et étiquettes ;\n\nb. Déterminer si tous les composants, emballages et étiquettes sont conformes aux spécifications établies conformément à § 111.70(b) et (d) ;\n\nc. Effectuer toute révision des matériaux requise et prendre toute décision de disposition requise ;\n\nd. Approuver ou rejeter tout traitement et ajustement en cours de processus des composants, emballages ou étiquettes pour les rendre aptes à l'utilisation dans la fabrication d'un complément alimentaire ; et\n\ne. Approuver, et libérer de la quarantaine, tous les composants, emballages et étiquettes avant leur utilisation."
  7_prefix: "111.123"
  7_label: "Quelles opérations de contrôle qualité sont requises pour le registre de fabrication principal, le registre de production de lot et les opérations de fabrication ?"
  7_desc: "a. Les opérations de contrôle qualité pour le registre de fabrication principal, le registre de production de lot et les opérations de fabrication doivent inclure :\n\t1. Examiner et approuver tous les registres de fabrication principaux et toutes les modifications apportées aux registres de fabrication principaux ;\n\t2. Examiner et approuver tous les enregistrements liés à la production de lot ;\n\t3. Examiner toute la surveillance requise par la sous-partie E ;\n\t4. Effectuer toute révision des matériaux requise et prendre toute décision de disposition requise ;\n\t5. Approuver ou rejeter tout retraitement ;\n\t6. Déterminer si toutes les spécifications en cours de processus établies conformément à § 111.70(c) sont respectées ;\n\t7. Déterminer si chaque lot fini est conforme aux spécifications de produit établies conformément à § 111.70(e) ; et\n\t8. Approuver et libérer, ou rejeter, chaque lot fini pour distribution, y compris tout lot fini retraité.\n\nb. Le personnel de contrôle qualité ne doit pas approuver et libérer pour distribution :\n\t1. Tout lot de complément alimentaire pour lequel un composant du lot ne respecte pas sa spécification d'identité ;\n\t2. Tout lot de complément alimentaire, y compris tout lot retraité, qui ne respecte pas toutes les spécifications de produit établies conformément à § 111.70(e) ;\n\t3. Tout lot de complément alimentaire, y compris tout lot retraité, qui n'a pas été fabriqué, emballé, étiqueté et détenu dans des conditions empêchant l'altération conformément aux sections 402(a)(1), (a)(2), (a)(3) et (a)(4) de la loi ; et\n\t4. Tout produit reçu d'un fournisseur pour l'emballage ou l'étiquetage en tant que complément alimentaire (et pour la distribution plutôt que pour le retour au fournisseur) pour lequel une assurance suffisante n'est pas fournie pour identifier adéquatement le produit et déterminer que le produit est conforme à votre bon de commande."
  8_prefix: "111.127"
  8_label: "Quelles opérations de contrôle qualité sont requises pour les opérations d'emballage et d'étiquetage ?"
  8_desc: "Les opérations de contrôle qualité pour les opérations d'emballage et d'étiquetage doivent inclure :\n\na. Examiner les résultats de tout examen visuel et de la documentation pour s'assurer que les spécifications établies conformément à § 111.70(f) sont respectées pour tous les produits que vous recevez pour l'emballage et l'étiquetage en tant que complément alimentaire (et pour la distribution plutôt que pour le retour au fournisseur) ;\n\nb. Approuver, et libérer de la quarantaine, tous les produits que vous recevez pour l'emballage ou l'étiquetage en tant que complément alimentaire (et pour la distribution plutôt que pour le retour au fournisseur) avant leur utilisation pour l'emballage ou l'étiquetage ;\n\nc. Examiner et approuver tous les enregistrements des opérations d'emballage et d'étiquetage ;\n\nd. Déterminer si le complément alimentaire emballé et étiqueté fini est conforme aux spécifications établies conformément à § 111.70(g) ;\n\ne. Effectuer toute révision des matériaux requise et prendre toute décision de disposition requise ;\n\nf. Approuver ou rejeter tout réemballage d'un complément alimentaire emballé ;\n\ng. Approuver ou rejeter tout réétiquetage d'un complément alimentaire emballé et étiqueté ; et\n\nh. Approuver pour libération, ou rejeter, tout complément alimentaire emballé et étiqueté (y compris un complément alimentaire réemballé ou réétiqueté) pour distribution."
  9_prefix: "111.130"
  9_label: "Quelles opérations de contrôle qualité sont requises pour les compléments alimentaires retournés ?"
  9_desc: "Les opérations de contrôle qualité pour les compléments alimentaires retournés doivent inclure :\n\na. Effectuer toute révision des matériaux requise et prendre toute décision de disposition requise, y compris :\n\t1. Déterminer si des tests ou examens sont nécessaires pour déterminer la conformité aux spécifications de produit établies conformément à § 111.70(e) ; et\n\t2. Examiner les résultats de tout test ou examen effectué pour déterminer la conformité aux spécifications de produit établies conformément à § 111.70(e) ;\n\nb. Approuver ou rejeter toute récupération et redistribution de tout complément alimentaire retourné ;\n\nc. Approuver ou rejeter tout retraitement de tout complément alimentaire retourné ; et\n\nd. Déterminer si le complément alimentaire retraité respecte les spécifications de produit et soit approuver pour libération, soit rejeter, tout complément alimentaire retourné qui est retraité."
  10_prefix: "111.135"
  10_label: "Quelles opérations de contrôle qualité sont requises pour les plaintes concernant les produits ?"
  10_desc: "Les opérations de contrôle qualité pour les plaintes concernant les produits doivent inclure l'examen et l'approbation des décisions concernant l'opportunité d'enquêter sur une plainte concernant un produit et l'examen et l'approbation des conclusions et des mesures de suivi de toute enquête effectuée."
  11_prefix: "111.140"
  11_label: "Selon cette sous-partie F, quels enregistrements devez-vous établir et conserver ?"
  11_desc: "a. Vous devez établir et conserver les enregistrements requis par cette sous-partie F conformément à la sous-partie P de cette partie.\n\nb. Vous devez établir et conserver les enregistrements suivants :\n\t1. Les procédures écrites pour les responsabilités des opérations de contrôle qualité, y compris les procédures écrites pour effectuer une révision des matériaux et prendre une décision de disposition, et les procédures écrites pour approuver ou rejeter tout retraitement ;\n\t2. Une documentation écrite, au moment de l'exécution, attestant que le personnel de contrôle qualité a effectué les exigences d'examen, d'approbation ou de rejet en enregistrant les éléments suivants :\n\t\ti. La date à laquelle l'examen, l'approbation ou le rejet a été effectué ; et\n\t\tii. La signature de la personne effectuant l'examen, l'approbation ou le rejet ; et\n\t3. La documentation de toute révision des matériaux et décision de disposition et suivi. Cette documentation doit être incluse dans le registre de production de lot approprié et doit comprendre :\n\t\ti. L'identification de l'écart spécifique ou de l'occurrence imprévue ;\n\t\tii. La description de votre enquête sur la cause de l'écart par rapport à la spécification ou de l'occurrence imprévue ;\n\t\tiii. L'évaluation de savoir si l'écart ou l'occurrence imprévue a entraîné ou pourrait entraîner une défaillance dans la garantie de la qualité du complément alimentaire ou une défaillance dans l'emballage et l'étiquetage du complément alimentaire comme spécifié dans le registre de fabrication principal ;\n\t\tiv. L'identification des actions entreprises pour corriger et éviter la récurrence de l'écart ou de l'occurrence imprévue ;\n\t\tv. Une explication de ce que vous avez fait avec le composant, le complément alimentaire, l'emballage ou l'étiquette ;\n\t\tvi. Une raison scientifiquement valable pour tout retraitement d'un complément alimentaire rejeté ou tout traitement ou ajustement en cours de processus d'un composant rejeté ; et\n\t\tvii. La signature de la ou des personnes désignées pour effectuer l'opération de contrôle qualité, qui ont effectué la révision des matériaux et pris la décision de disposition, et de chaque personne qualifiée qui fournit des informations pertinentes pour cette révision des matériaux et cette décision de disposition."
7:
  prefix: "G"
  title: "Système de contrôle de la production et des processus : Exigences pour les composants, emballages et étiquettes et pour les produits que vous recevez pour l'emballage ou l'étiquetage en tant que complément alimentaire"
  1_prefix: "111.153"
  1_label: "Quelles sont les exigences de cette sous-partie G concernant les procédures écrites ?"
  1_desc: "Vous devez établir et suivre des procédures écrites pour satisfaire aux exigences de cette sous-partie G."
  2_prefix: "111.155"
  2_label: "Quelles exigences s'appliquent aux composants des compléments alimentaires ?"
  2_desc: "a. Vous devez examiner visuellement chaque conteneur immédiat ou groupe de conteneurs immédiats dans un envoi que vous recevez pour vérifier l'étiquette de contenu appropriée, les dommages au conteneur ou les scellés brisés afin de déterminer si l'état du conteneur pourrait avoir entraîné une contamination ou une détérioration des composants ;\n\nb. Vous devez examiner visuellement la facture, la garantie ou la certification du fournisseur dans un envoi que vous recevez pour vous assurer que les composants sont conformes à votre bon de commande ;\n\nc. Vous devez mettre en quarantaine les composants avant de les utiliser dans la fabrication d'un complément alimentaire jusqu'à ce que :\n\t1. Vous préleviez des échantillons représentatifs de chaque lot unique de composants (et, pour les composants que vous recevez, de chaque envoi unique, et de chaque lot unique au sein de chaque envoi unique) ;\n\t2. Le personnel de contrôle qualité examine et approuve les résultats de tout test ou examen effectué sur les composants ; et\n\t3. Le personnel de contrôle qualité approuve les composants pour une utilisation dans la fabrication d'un complément alimentaire, y compris l'approbation de tout traitement (y compris les ajustements en cours de processus) des composants pour les rendre aptes à l'utilisation dans la fabrication d'un complément alimentaire, et les libère de la quarantaine.\n\nd.\n\t1. Vous devez identifier chaque lot unique au sein de chaque envoi unique de composants que vous recevez et chaque lot de composants que vous produisez de manière à pouvoir retracer le lot jusqu'au fournisseur, à la date de réception, au nom du composant, au statut du composant (par exemple, en quarantaine, approuvé ou rejeté) ; et au complément alimentaire que vous avez fabriqué et distribué.\n\t2. Vous devez utiliser cet identifiant unique chaque fois que vous enregistrez la disposition de chaque lot unique au sein de chaque envoi unique de composants que vous recevez et de chaque lot de composants que vous produisez.\n\ne. Vous devez conserver les composants dans des conditions qui protègent contre la contamination et la détérioration, et évitent les mélanges."
  3_prefix: "111.160"
  3_label: "Quelles exigences s'appliquent aux emballages et étiquettes reçus ?"
  3_desc: "a. Vous devez examiner visuellement chaque conteneur immédiat ou groupe de conteneurs immédiats dans un envoi pour vérifier l'étiquette de contenu appropriée, les dommages au conteneur ou les scellés brisés afin de déterminer si l'état du conteneur pourrait avoir entraîné une contamination ou une détérioration des emballages et des étiquettes.\n\nb. Vous devez examiner visuellement la facture, la garantie ou la certification du fournisseur dans un envoi pour vous assurer que les emballages ou les étiquettes sont conformes à votre bon de commande.\n\nc. Vous devez mettre en quarantaine les emballages et les étiquettes avant de les utiliser dans la fabrication d'un complément alimentaire jusqu'à ce que :\n\t1. Vous préleviez des échantillons représentatifs de chaque envoi unique, et de chaque lot unique au sein de chaque envoi unique, d'emballages et d'étiquettes et, au minimum, effectuiez une identification visuelle des conteneurs immédiats et des fermetures ;\n\t2. Le personnel de contrôle qualité examine et approuve les résultats de tout test ou examen effectué sur les emballages et les étiquettes ; et\n\t3. Le personnel de contrôle qualité approuve les emballages et les étiquettes pour une utilisation dans la fabrication d'un complément alimentaire et les libère de la quarantaine.\n\nd.\n\t1. Vous devez identifier chaque lot unique au sein de chaque envoi unique d'emballages et d'étiquettes de manière à pouvoir retracer le lot jusqu'au fournisseur, à la date de réception, au nom de l'emballage et de l'étiquette, au statut de l'emballage et de l'étiquette (par exemple, en quarantaine, approuvé ou rejeté) ; et au complément alimentaire que vous avez distribué ; et\n\t2. Vous devez utiliser cet identifiant unique chaque fois que vous enregistrez la disposition de chaque lot unique au sein de chaque envoi unique d'emballages et d'étiquettes.\n\ne. Vous devez conserver les emballages et les étiquettes dans des conditions qui protègent contre la contamination et la détérioration, et évitent les mélanges."
  4_prefix: "111.165"
  4_label: "Quelles exigences s'appliquent à un produit reçu pour l'emballage ou l'étiquetage en tant que complément alimentaire (et pour la distribution plutôt que pour le retour au fournisseur) ?"
  4_desc: "a. Vous devez examiner visuellement chaque conteneur immédiat ou groupe de conteneurs immédiats dans un envoi de produit que vous recevez pour l'emballage ou l'étiquetage en tant que complément alimentaire (et pour la distribution plutôt que pour le retour au fournisseur) pour vérifier l'étiquette de contenu appropriée, les dommages au conteneur ou les scellés brisés afin de déterminer si l'état du conteneur pourrait avoir entraîné une contamination ou une détérioration du produit reçu.\n\nb. Vous devez examiner visuellement la facture, la garantie ou la certification du fournisseur dans un envoi du produit reçu pour vous assurer que le produit reçu est conforme à votre bon de commande.\n\nc. Vous devez mettre en quarantaine le produit reçu jusqu'à ce que :\n\t1. Vous préleviez des échantillons représentatifs de chaque envoi unique, et de chaque lot unique au sein de chaque envoi unique, de produit reçu ;\n\t2. Le personnel de contrôle qualité examine et approuve la documentation pour déterminer si le produit reçu respecte les spécifications que vous avez établies conformément à § 111.70(f) ; et\n\t3. Le personnel de contrôle qualité approuve le produit reçu pour l'emballage ou l'étiquetage en tant que complément alimentaire et libère le produit reçu de la quarantaine.\n\nd.\n\t1. Vous devez identifier chaque lot unique au sein de chaque envoi unique de produit reçu de manière à pouvoir retracer le lot jusqu'au fournisseur, à la date de réception, au nom du produit reçu, au statut du produit reçu (par exemple, en quarantaine, approuvé ou rejeté), et au produit que vous avez emballé ou étiqueté et distribué en tant que complément alimentaire.\n\t2. Vous devez utiliser cet identifiant unique chaque fois que vous enregistrez la disposition de chaque lot unique au sein de chaque envoi unique du produit reçu.\n\ne. Vous devez conserver le produit reçu dans des conditions qui protègent contre la contamination et la détérioration, et évitent les mélanges."
  5_prefix: "111.170"
  5_label: "Quelles exigences s'appliquent aux composants, emballages et étiquettes rejetés, et aux produits rejetés que vous recevez pour l'emballage ou l'étiquetage en tant que complément alimentaire ?"
  5_desc: "Vous devez clairement identifier, conserver et contrôler dans un système de quarantaine pour une disposition appropriée tout composant, emballage et étiquette, et tout produit que vous recevez pour l'emballage ou l'étiquetage en tant que complément alimentaire (et pour la distribution plutôt que pour le retour au fournisseur), qui est rejeté et inapte à l'utilisation dans les opérations de fabrication, d'emballage ou d'étiquetage."
  6_prefix: "111.180"
  6_label: "Selon cette sous-partie G, quels enregistrements devez-vous établir et conserver ?"
  6_desc: "a. Vous devez établir et conserver les enregistrements requis par cette sous-partie G conformément à la sous-partie P de cette partie.\n\nb. Vous devez établir et conserver les enregistrements suivants :\n\t1. Les procédures écrites pour satisfaire aux exigences de cette sous-partie.\n\t2. Les enregistrements de réception (y compris les enregistrements tels que les certificats d'analyse, les factures des fournisseurs et les garanties des fournisseurs) pour les composants, emballages et étiquettes et pour les produits que vous recevez pour l'emballage ou l'étiquetage en tant que complément alimentaire (et pour la distribution plutôt que pour le retour au fournisseur) ; et\n\t3. La documentation attestant que les exigences de cette sous-partie ont été respectées.\n\t\ti. La personne qui effectue l'opération requise doit documenter, au moment de l'exécution, que l'opération requise a été effectuée.\n\t\tii. La documentation doit inclure :\n\t\t\tA. La date à laquelle les composants, emballages, étiquettes ou produits que vous recevez pour l'emballage ou l'étiquetage en tant que complément alimentaire ont été reçus ;\n\t\t\tB. Les initiales de la personne effectuant l'opération requise ;\n\t\t\tC. Les résultats de tout test ou examen effectué sur les composants, emballages ou étiquettes, et de tout examen visuel du produit que vous recevez pour l'emballage ou l'étiquetage en tant que complément alimentaire ; et\n\t\t\tD. Toute révision des matériaux et décision de disposition effectuée sur les composants, emballages, étiquettes ou produits que vous recevez pour l'emballage ou l'étiquetage en tant que complément alimentaire."
8:
  prefix: "H"
  title: "Système de contrôle de la production et des processus : Exigences pour le registre de fabrication principal"
  1_prefix: "111.205"
  1_label: "Quelle est l'exigence d'établir un registre de fabrication principal ?"
  1_desc: "a. Vous devez préparer et suivre un registre de fabrication principal écrit pour chaque formulation unique de complément alimentaire que vous fabriquez, et pour chaque taille de lot, afin de garantir l'uniformité du lot fini d'un lot à l'autre.\n\nb. Le registre de fabrication principal doit :\n\t1. Identifier les spécifications pour les points, étapes ou stades du processus de fabrication où le contrôle est nécessaire pour garantir la qualité du complément alimentaire et que le complément alimentaire est emballé et étiqueté comme spécifié dans le registre de fabrication principal ; et\n\t2. Établir des contrôles et des procédures pour garantir que chaque lot de complément alimentaire que vous fabriquez respecte les spécifications identifiées conformément au paragraphe (b)(1) de cette section.\n\nc. Vous devez établir et conserver les registres de fabrication principaux conformément à la sous-partie P de cette partie."
  2_prefix: "111.210"
  2_label: "Que doit inclure le registre de fabrication principal ?"
  2_desc: "Le registre de fabrication principal doit inclure :\n\na. Le nom du complément alimentaire à fabriquer et la force, la concentration, le poids ou la mesure de chaque ingrédient alimentaire pour chaque taille de lot ;\n\nb. Une liste complète des composants à utiliser ;\n\nc. Une déclaration exacte du poids ou de la mesure de chaque composant à utiliser ;\n\nd. L'identité et le poids ou la mesure de chaque ingrédient alimentaire qui sera déclaré sur l'étiquette des faits relatifs aux compléments alimentaires et l'identité de chaque ingrédient qui sera déclaré sur la liste des ingrédients du complément alimentaire ;\n\ne. Une déclaration de tout excédent intentionnel d'un ingrédient alimentaire ;\n\nf. Une déclaration du rendement théorique d'un complément alimentaire fabriqué attendu à chaque point, étape ou stade du processus de fabrication où le contrôle est nécessaire pour garantir la qualité du complément alimentaire, et le rendement attendu lorsque vous terminez la fabrication du complément alimentaire, y compris les pourcentages maximum et minimum de rendement théorique au-delà desquels une enquête sur les écarts d'un lot est nécessaire et une révision des matériaux est effectuée et une décision de disposition est prise ;\n\ng. Une description de l'emballage et une étiquette représentative, ou une référence croisée à l'emplacement physique de l'étiquette réelle ou représentative ;\n\nh. Des instructions écrites, y compris les éléments suivants :\n\t1. Les spécifications pour chaque point, étape ou stade du processus de fabrication où le contrôle est nécessaire pour garantir la qualité du complément alimentaire et que le complément alimentaire est emballé et étiqueté comme spécifié dans le registre de fabrication principal ;\n\t2. Les procédures d'échantillonnage et une référence croisée aux procédures pour les tests ou examens ;\n\t3. Les actions spécifiques nécessaires pour effectuer et vérifier les points, étapes ou stades du processus de fabrication où le contrôle est nécessaire pour garantir la qualité du complément alimentaire et que le complément alimentaire est emballé et étiqueté comme spécifié dans le registre de fabrication principal.\n\t\ti. Ces actions spécifiques doivent inclure la vérification du poids ou de la mesure de tout composant et la vérification de l'ajout de tout composant ; et\n\t\tii. Pour les opérations manuelles, ces actions spécifiques doivent inclure :\n\t\t\tA. Une personne pesant ou mesurant un composant et une autre personne vérifiant le poids ou la mesure ; et\n\t\t\tB. Une personne ajoutant le composant et une autre personne vérifiant l'ajout.\n\t4. Les notations spéciales et précautions à suivre ; et\n\t5. Les plans d'action corrective à utiliser lorsqu'une spécification n'est pas respectée."
9:
  prefix: "I"
  title: "Système de contrôle de la production et des processus : Exigences pour le registre de production de lot"
  1_prefix: "111.255"
  1_label: "Quelle est l'exigence d'établir un registre de production de lot ?"
  1_desc: "a. Vous devez préparer un registre de production de lot chaque fois que vous fabriquez un lot de complément alimentaire ;\n\nb. Votre registre de production de lot doit inclure des informations complètes relatives à la production et au contrôle de chaque lot ;\n\nc. Votre registre de production de lot doit suivre avec précision le registre de fabrication principal approprié et vous devez effectuer chaque étape de la production du lot ; et\n\nd. Vous devez établir et conserver les registres de production de lot conformément à la sous-partie P de cette partie."
  2_prefix: "111.260"
  2_label: "Que doit inclure le registre de lot ?"
  2_desc: "Le registre de production de lot doit inclure les éléments suivants :\n\na. Le numéro de lot, de lot ou de contrôle :\n\t1. Du lot fini de complément alimentaire ; et\n\t2. Que vous attribuez conformément à § 111.415(f) pour les éléments suivants :\n\t\ti. Chaque lot de complément alimentaire emballé et étiqueté issu du lot fini de complément alimentaire ;\n\t\tii. Chaque lot de complément alimentaire, issu du lot fini de complément alimentaire, que vous distribuez à une autre personne pour l'emballage ou l'étiquetage ;\n\nb. L'identité de l'équipement et des lignes de traitement utilisées dans la production du lot ;\n\nc. La date et l'heure de la maintenance, du nettoyage et de la désinfection de l'équipement et des lignes de traitement utilisées dans la production du lot, ou une référence croisée aux enregistrements, tels que les journaux individuels de l'équipement, où ces informations sont conservées ;\n\nd. L'identifiant unique que vous avez attribué à chaque composant (ou, le cas échéant, à un produit que vous recevez d'un fournisseur pour l'emballage ou l'étiquetage en tant que complément alimentaire), emballage et étiquette utilisés ;\n\ne. L'identité et le poids ou la mesure de chaque composant utilisé ;\n\nf. Une déclaration du rendement réel et une déclaration du pourcentage de rendement théorique aux phases appropriées du traitement ;\n\ng. Les résultats réels obtenus pendant toute opération de surveillance ;\n\nh. Les résultats de tout test ou examen effectué pendant la production du lot, ou une référence croisée à ces résultats ;\n\ni. La documentation attestant que le complément alimentaire fini respecte les spécifications établies conformément à § 111.70(e) et (g) ;\n\nj. La documentation, au moment de l'exécution, de la fabrication du lot, y compris\n\t1. La date à laquelle chaque étape du registre de fabrication principal a été effectuée ; et\n\t2. Les initiales des personnes effectuant chaque étape, y compris :\n\t\ti. Les initiales de la personne responsable de la pesée ou de la mesure de chaque composant utilisé dans le lot ;\n\t\tii. Les initiales de la personne responsable de la vérification du poids ou de la mesure de chaque composant utilisé dans le lot ;\n\t\tiii. Les initiales de la personne responsable de l'ajout du composant au lot ; et\n\t\tiv. Les initiales de la personne responsable de la vérification de l'ajout des composants au lot ;\n\nk. La documentation, au moment de l'exécution, des opérations d'emballage et d'étiquetage, y compris :\n\t1. L'identifiant unique que vous avez attribué aux emballages et étiquettes utilisés, la quantité des emballages et étiquettes utilisés, et, lorsque la réconciliation des étiquettes est requise, la réconciliation de toute divergence entre l'émission et l'utilisation des étiquettes ;\n\t2. Une étiquette réelle ou représentative, ou une référence croisée à l'emplacement physique de l'étiquette réelle ou représentative spécifiée dans le registre de fabrication principal ; et\n\t3. Les résultats de tout test ou examen effectué sur les compléments alimentaires emballés et étiquetés (y compris les compléments alimentaires réemballés ou réétiquetés), ou une référence croisée à l'emplacement physique de ces résultats ;\n\nl. La documentation, au moment de l'exécution, attestant que le personnel de contrôle qualité :\n\t1. A examiné le registre de production de lot, y compris :\n\t\ti. L'examen de toute opération de surveillance requise par la sous-partie E de cette partie ; et\n\t\tii. L'examen des résultats de tout test et examen, y compris les tests et examens effectués sur les composants, les matériaux en cours de traitement, les lots finis de compléments alimentaires et les compléments alimentaires emballés et étiquetés ;\n\t2. A approuvé ou rejeté tout retraitement ou réemballage ; et\n\t3. A approuvé et libéré, ou rejeté, le lot pour distribution, y compris tout lot retraité ; et\n\t4. A approuvé et libéré, ou rejeté, le complément alimentaire emballé et étiqueté, y compris tout complément alimentaire réemballé ou réétiqueté.\n\nm. La documentation, au moment de l'exécution, de toute révision de matériel requise et de toute décision de disposition.\n\nn. La documentation, au moment de l'exécution, de tout retraitement."
10:
  prefix: "J"
  title: "Système de contrôle de la production et des processus : Exigences pour les opérations de laboratoire"
  1_prefix: "111.303"
  1_label: "Quelles sont les exigences de cette sous-partie J concernant les procédures écrites ?"
  1_desc: "Vous devez établir et suivre des procédures écrites pour les opérations de laboratoire, y compris des procédures écrites pour les tests et examens que vous effectuez pour déterminer si les spécifications sont respectées."
  2_prefix: "111.310"
  2_label: "Quelles sont les exigences pour les installations de laboratoire que vous utilisez ?"
  2_desc: "Vous devez utiliser des installations de laboratoire adéquates pour effectuer tous les tests et examens nécessaires afin de déterminer si :\n\na. Les composants que vous utilisez respectent les spécifications ;\n\nb. Les spécifications en cours de processus sont respectées comme spécifié dans le registre de fabrication principal ; et\n\nc. Les compléments alimentaires que vous fabriquez respectent les spécifications."
  3_prefix: "111.315"
  3_label: "Quelles sont les exigences pour les processus de contrôle de laboratoire ?"
  3_desc: "Vous devez établir et suivre des processus de contrôle de laboratoire qui sont examinés et approuvés par le personnel de contrôle qualité, y compris les éléments suivants :\n\na. L'utilisation de critères pour établir des spécifications appropriées ;\n\nb. L'utilisation de plans d'échantillonnage pour obtenir des échantillons représentatifs, conformément à la sous-partie E de cette partie, de :\n\t1. Composants, emballages et étiquettes ;\n\t2. Matériaux en cours de traitement ;\n\t3. Lots finis de compléments alimentaires ;\n\t4. Produits que vous recevez pour l'emballage ou l'étiquetage en tant que complément alimentaire (et pour la distribution plutôt que pour le retour au fournisseur) ; et\n\t5. Compléments alimentaires emballés et étiquetés.\n\nc. L'utilisation de critères pour sélectionner des méthodes d'examen et de test appropriées ;\n\nd. L'utilisation de critères pour sélectionner des matériaux de référence standard utilisés dans la réalisation des tests et examens ; et\n\ne. L'utilisation de méthodes de test et d'examens conformément aux critères établis."
  4_prefix: "111.320"
  4_label: "Quelles exigences s'appliquent aux méthodes de laboratoire pour les tests et examens ?"
  4_desc: "a. Vous devez vérifier que les méthodologies d'examen et de test de laboratoire sont appropriées pour leur usage prévu.\n\nb. Vous devez identifier et utiliser une méthode scientifiquement valide appropriée pour chaque spécification établie pour laquelle un test ou un examen est requis afin de déterminer si la spécification est respectée."
  5_prefix: "111.325"
  5_label: "Selon cette sous-partie J, quels enregistrements devez-vous établir et conserver ?"
  5_desc: "a. Vous devez établir et conserver les enregistrements requis par cette sous-partie J conformément à la sous-partie P de cette partie.\n\nb. Vous devez établir et conserver les enregistrements suivants :\n\t1. Les procédures écrites pour les opérations de laboratoire, y compris les procédures écrites pour les tests et examens que vous effectuez pour déterminer si les spécifications sont respectées ;\n\t2. La documentation attestant que la méthodologie de laboratoire établie conformément à cette sous-partie J est suivie.\n\t\ti. La personne qui effectue les tests et examens doit documenter, au moment de l'exécution, que la méthodologie de laboratoire établie conformément à cette sous-partie J est suivie.\n\t\tii. La documentation des tests et examens de laboratoire doit inclure les résultats des tests et examens."
11:
  prefix: "K"
  title: "Système de contrôle de la production et des processus : Exigences pour les opérations de fabrication"
  1_prefix: "111.353"
  1_label: "Quelles sont les exigences de cette sous-partie K concernant les procédures écrites ?"
  1_desc: "Vous devez établir et suivre des procédures écrites pour les opérations de fabrication."
  2_prefix: "111.355"
  2_label: "Quelles sont les exigences de conception pour les opérations de fabrication ?"
  2_desc: "Vous devez concevoir ou sélectionner des processus de fabrication pour garantir que les spécifications des produits sont constamment respectées."
  3_prefix: "111.360"
  3_label: "Quelles sont les exigences pour l'hygiène ?"
  3_desc: "Vous devez mener toutes les opérations de fabrication conformément à des principes d'hygiène adéquats."
  4_prefix: "111.365"
  4_label: "Quelles précautions devez-vous prendre pour prévenir la contamination ?"
  4_desc: "Vous devez prendre toutes les précautions nécessaires pendant la fabrication d'un complément alimentaire pour prévenir la contamination des composants ou des compléments alimentaires. Ces précautions incluent :\n\na. Effectuer les opérations de fabrication dans des conditions et avec des contrôles qui protègent contre la croissance potentielle de micro-organismes et le risque de contamination ;\n\nb. Laver ou nettoyer les composants qui contiennent de la terre ou d'autres contaminants ;\n\nc. Utiliser de l'eau qui, au minimum, respecte les exigences fédérales, étatiques et locales applicables et ne contamine pas le complément alimentaire lorsque l'eau peut devenir un composant du lot fini de complément alimentaire ;\n\nd. Effectuer des tests chimiques, microbiologiques ou autres, si nécessaire, pour prévenir l'utilisation de composants contaminés ;\n\ne. Stériliser, pasteuriser, congeler, réfrigérer, contrôler la concentration en ions hydrogène (pH), contrôler l'humidité, contrôler l'activité de l'eau (aw), ou utiliser tout autre moyen efficace pour éliminer, détruire ou prévenir la croissance de micro-organismes et prévenir la décomposition ;\n\nf. Conserver les composants et les compléments alimentaires qui peuvent soutenir la croissance rapide de micro-organismes significatifs pour la santé publique de manière à empêcher les composants et les compléments alimentaires de devenir altérés ;\n\ng. Identifier et conserver tout composant ou complément alimentaire, pour lequel une révision des matériaux et une décision de disposition sont requises, de manière à protéger les composants ou les compléments alimentaires qui ne font pas l'objet d'une révision des matériaux contre la contamination et les mélanges avec ceux qui font l'objet d'une révision des matériaux ;\n\nh. Effectuer des étapes de fabrication mécaniques (telles que la coupe, le tri, l'inspection, le déchiquetage, le séchage, le broyage, le mélange et le tamisage) par tout moyen efficace pour protéger les compléments alimentaires contre la contamination, par exemple :\n\t1. Nettoyer et désinfecter les surfaces de contact ;\n\t2. Utiliser des contrôles de température ; et\n\t3. Utiliser des contrôles de temps.\n\ni. Utiliser des mesures efficaces pour protéger contre l'inclusion de métal ou d'autres matériaux étrangers dans les composants ou les compléments alimentaires, par exemple :\n\t1. Filtres ou passoires,\n\t2. Pièges,\n\t3. Aimants, ou\n\t4. Détecteurs de métal électroniques.\n\nj. Séparer et identifier tous les conteneurs pour un lot spécifique de compléments alimentaires afin d'identifier leur contenu et, si nécessaire, la phase de fabrication ; et\n\nk. Identifier toutes les lignes de traitement et les équipements majeurs utilisés pendant la fabrication pour indiquer leur contenu, y compris le nom du complément alimentaire et le numéro de lot ou de lot spécifique et, si nécessaire, la phase de fabrication."
  5_prefix: "111.370"
  5_label: "Quelles exigences s'appliquent aux compléments alimentaires rejetés ?"
  5_desc: "Vous devez clairement identifier, conserver et contrôler dans un système de quarantaine pour une disposition appropriée tout complément alimentaire qui est rejeté et inapte à l'utilisation dans les opérations de fabrication, d'emballage ou d'étiquetage."
  6_prefix: "111.375"
  6_label: "Selon cette sous-partie K, quels enregistrements devez-vous établir et conserver ?"
  6_desc: "a. Vous devez établir et conserver les enregistrements requis par cette sous-partie K conformément à la sous-partie P de cette partie.\n\nb. Vous devez établir et conserver les enregistrements des procédures écrites pour les opérations de fabrication."
12:
  prefix: "L"
  title: "Système de contrôle de la production et des processus : Exigences pour les opérations d'emballage et d'étiquetage"
  1_prefix: "111.403"
  1_label: "Quelles sont les exigences de cette sous-partie L concernant les procédures écrites ?"
  1_desc: "Vous devez établir et suivre des procédures écrites pour les opérations d'emballage et d'étiquetage."
  2_prefix: "111.410"
  2_label: "Quelles exigences s'appliquent aux emballages et aux étiquettes ?"
  2_desc: "a. Vous devez prendre les mesures nécessaires pour déterminer si les emballages pour les compléments alimentaires respectent les spécifications afin que l'état de l'emballage garantisse la qualité de vos compléments alimentaires ;\n\nb. Vous devez contrôler l'émission et l'utilisation des emballages et des étiquettes et la réconciliation de toute divergence entre l'émission et l'utilisation. La réconciliation des étiquettes n'est pas requise pour les étiquettes coupées ou en rouleau si un examen à 100 % pour vérifier les étiquettes correctes est effectué par un équipement électronique ou électromécanique approprié pendant ou après l'achèvement des opérations de finition ; et\n\nc. Vous devez examiner, avant les opérations d'emballage et d'étiquetage, les emballages et les étiquettes pour chaque lot de complément alimentaire afin de déterminer si les emballages et les étiquettes sont conformes au registre de fabrication principal ; et\n\nd. Vous devez être en mesure de déterminer l'historique complet de la fabrication et le contrôle du complément alimentaire emballé et étiqueté tout au long de la distribution."
  3_prefix: "111.415"
  3_label: "Quelles exigences s'appliquent aux opérations de remplissage, d'assemblage, d'emballage, d'étiquetage et aux opérations connexes ?"
  3_desc: "Vous devez remplir, assembler, emballer, étiqueter et effectuer d'autres opérations connexes de manière à garantir la qualité du complément alimentaire et que le complément alimentaire est emballé et étiqueté comme spécifié dans le registre de fabrication principal. Vous devez le faire en utilisant tout moyen efficace, y compris les éléments suivants :\n\na. Nettoyer et désinfecter tout l'équipement de remplissage et d'emballage, les ustensiles et les emballages de compléments alimentaires, selon les besoins ;\n\nb. Protéger les compléments alimentaires fabriqués contre la contamination, en particulier la contamination par voie aérienne ;\n\nc. Utiliser des procédures de manipulation sanitaires ;\n\nd. Établir une séparation physique ou spatiale des opérations d'emballage et d'étiquetage des opérations sur d'autres composants et compléments alimentaires pour éviter les mélanges ;\n\ne. Identifier, par tout moyen efficace, les conteneurs de compléments alimentaires remplis qui sont mis de côté et conservés sans étiquette pour les opérations d'étiquetage futures, afin d'éviter les mélanges ;\n\nf. Attribuer un numéro de lot, de lot ou de contrôle à :\n\t1. Chaque lot de complément alimentaire emballé et étiqueté issu d'un lot fini de complément alimentaire ; et,\n\t2. Chaque lot de complément alimentaire, issu d'un lot fini de complément alimentaire, que vous distribuez à une autre personne pour l'emballage ou l'étiquetage.\n\ng. Examiner un échantillon représentatif de chaque lot de complément alimentaire emballé et étiqueté pour déterminer si le complément alimentaire respecte les spécifications établies conformément à § 111.70(g) ; et\n\nh. Éliminer de manière appropriée les étiquettes et les emballages pour les compléments alimentaires qui sont obsolètes ou incorrects pour garantir qu'ils ne sont pas utilisés dans de futures opérations d'emballage et d'étiquetage."
  4_prefix: "111.420"
  4_label: "Quelles exigences s'appliquent au réemballage et au réétiquetage ?"
  4_desc: "a. Vous ne pouvez réemballer ou réétiqueter des compléments alimentaires qu'après que le personnel de contrôle qualité a approuvé ce réemballage ou réétiquetage.\n\nb. Vous devez examiner un échantillon représentatif de chaque lot de compléments alimentaires réemballés ou réétiquetés pour déterminer si les compléments alimentaires réemballés ou réétiquetés respectent toutes les spécifications établies conformément à § 111.70(g).\n\nc. Le personnel de contrôle qualité doit approuver ou rejeter chaque lot de complément alimentaire réemballé ou réétiqueté avant sa libération pour distribution."
  5_prefix: "111.425"
  5_label: "Quelles exigences s'appliquent à un complément alimentaire emballé et étiqueté qui est rejeté pour la distribution ?"
  5_desc: "Vous devez clairement identifier, conserver et contrôler dans un système de quarantaine pour une disposition appropriée tout complément alimentaire emballé et étiqueté qui est rejeté pour la distribution."
  6_prefix: "111.430"
  6_label: "Selon cette sous-partie L, quels enregistrements devez-vous établir et conserver ?"
  6_desc: "a. Vous devez établir et conserver les enregistrements requis par cette sous-partie L conformément à la sous-partie P de cette partie.\n\nb. Vous devez établir et conserver les enregistrements des procédures écrites pour les opérations d'emballage et d'étiquetage."
13:
  prefix: "M"
  title: "Stockage et distribution"
  1_prefix: "111.453"
  1_label: "Quelles sont les exigences de cette sous-partie M concernant les procédures écrites ?"
  1_desc: "Vous devez établir et suivre des procédures écrites pour les opérations de stockage et de distribution."
  2_prefix: "111.455"
  2_label: "Quelles exigences s'appliquent au stockage des composants, des compléments alimentaires, des emballages et des étiquettes ?"
  2_desc: "a. Vous devez stocker les composants et les compléments alimentaires dans des conditions appropriées de température, d'humidité et de lumière afin que l'identité, la pureté, la force et la composition des composants et des compléments alimentaires ne soient pas affectées.\n\nb. Vous devez stocker les emballages et les étiquettes dans des conditions appropriées afin que les emballages et les étiquettes ne soient pas altérés.\n\nc. Vous devez stocker les composants, les compléments alimentaires, les emballages et les étiquettes dans des conditions qui ne conduisent pas au mélange, à la contamination ou à la détérioration des composants, des compléments alimentaires, des emballages et des étiquettes."
  3_prefix: "111.460"
  3_label: "Quelles exigences s'appliquent au stockage des matériaux en cours de traitement ?"
  3_desc: "a. Vous devez identifier et stocker les matériaux en cours de traitement dans des conditions qui protègent contre le mélange, la contamination et la détérioration.\n\nb. Vous devez stocker les matériaux en cours de traitement dans des conditions appropriées de température, d'humidité et de lumière."
  4_prefix: "111.465"
  4_label: "Quelles exigences s'appliquent au stockage des échantillons de réserve de compléments alimentaires ?"
  4_desc: "a. Vous devez stocker les échantillons de réserve de compléments alimentaires de manière à les protéger contre la contamination et la détérioration. Cela inclut :\n\t1. Stocker les échantillons de réserve dans des conditions conformes aux étiquettes des produits ou, si aucune condition de stockage n'est recommandée sur l'étiquette, dans des conditions de stockage ordinaires ; et\n\t2. Utiliser le même système de fermeture de conteneur dans lequel le complément alimentaire emballé et étiqueté est distribué, ou, si vous distribuez des compléments alimentaires à emballer et étiqueter, utiliser un système de fermeture de conteneur qui offre essentiellement les mêmes caractéristiques pour protéger contre la contamination ou la détérioration que celui dans lequel vous distribuez le complément alimentaire pour l'emballage et l'étiquetage ailleurs.\n\nb. Vous devez conserver les échantillons de réserve pendant 1 an après la date de péremption (si une date de péremption est utilisée), ou pendant 2 ans à partir de la date de distribution du dernier lot de compléments alimentaires associé aux échantillons de réserve, pour une utilisation dans les investigations appropriées."
  5_prefix: "111.470"
  5_label: "Quelles exigences s'appliquent à la distribution des compléments alimentaires ?"
  5_desc: "Vous devez distribuer les compléments alimentaires dans des conditions qui protégeront les compléments alimentaires contre la contamination et la détérioration."
  6_prefix: "111.475"
  6_label: "Selon cette sous-partie M, quels enregistrements devez-vous établir et conserver ?"
  6_desc: "a. Vous devez établir et conserver les enregistrements requis par cette sous-partie M conformément à la sous-partie P de cette partie.\n\nb. Vous devez établir et conserver les enregistrements suivants :\n\t1. Les procédures écrites pour les opérations de stockage et de distribution ; et\n\t2. Les enregistrements de la distribution des produits."
14:
  prefix: "N"
  title: "Compléments alimentaires retournés"
  1_prefix: "111.503"
  1_label: "Quelles sont les exigences de cette sous-partie N concernant les procédures écrites ?"
  1_desc: "Vous devez établir et suivre des procédures écrites pour satisfaire aux exigences de cette sous-partie."
  2_prefix: "111.510"
  2_label: "Quelles exigences s'appliquent lorsqu'un complément alimentaire retourné est reçu ?"
  2_desc: "Vous devez identifier et mettre en quarantaine les compléments alimentaires retournés jusqu'à ce que le personnel de contrôle qualité effectue une révision des matériaux et prenne une décision de disposition."
  3_prefix: "111.515"
  3_label: "Quand un complément alimentaire retourné doit-il être détruit ou autrement éliminé de manière appropriée ?"
  3_desc: "Vous devez détruire, ou autrement éliminer de manière appropriée, tout complément alimentaire retourné, sauf si le résultat d'une révision des matériaux et d'une décision de disposition est que le personnel de contrôle qualité fasse ce qui suit :\n\na. Approuve la récupération du complément alimentaire retourné pour redistribution ou\n\nb. Approuve le complément alimentaire retourné pour retraitement."
  4_prefix: "111.520"
  4_label: "Quand un complément alimentaire retourné peut-il être récupéré ?"
  4_desc: "Vous pouvez récupérer un complément alimentaire retourné uniquement si le personnel de contrôle qualité effectue une révision des matériaux et prend une décision de disposition pour autoriser la récupération."
  5_prefix: "111.525"
  5_label: "Quelles exigences s'appliquent à un complément alimentaire retourné que le personnel de contrôle qualité approuve pour le retraitement ?"
  5_desc: "a. Vous devez vous assurer que tout complément alimentaire retourné qui est retraité respecte toutes les spécifications de produit établies conformément à § 111.70(e) ; et\n\nb. Le personnel de contrôle qualité doit approuver ou rejeter la libération pour distribution de tout complément alimentaire retourné qui est retraité."
  6_prefix: "111.530"
  6_label: "Quand une enquête doit-elle être menée sur vos processus de fabrication et d'autres lots ?"
  6_desc: "Si la raison pour laquelle un complément alimentaire est retourné implique d'autres lots, vous devez mener une enquête sur vos processus de fabrication et chacun de ces autres lots pour déterminer la conformité aux spécifications."
  7_prefix: "111.535"
  7_label: "Selon cette sous-partie N, quels enregistrements devez-vous établir et conserver ?"
  7_desc: "a. Vous devez établir et conserver les enregistrements requis par cette sous-partie N conformément à la sous-partie P de cette partie.\n\nb. Vous devez établir et conserver les enregistrements suivants :\n\t1. Les procédures écrites pour satisfaire aux exigences de cette sous-partie N.\n\t2. Toute révision des matériaux et décision de disposition concernant un complément alimentaire retourné ;\n\t3. Les résultats de tout test ou examen effectué pour déterminer la conformité aux spécifications de produit établies conformément à § 111.70(e) ; et,\n\t4. La documentation de la réévaluation par le personnel de contrôle qualité de tout complément alimentaire qui est retraité et la détermination par le personnel de contrôle qualité de savoir si le complément alimentaire retraité respecte les spécifications de produit établies conformément à § 111.70(e)."
15:
  prefix: "O"
  title: "Réclamations concernant les produits"
  1_prefix: "111.553"
  1_label: "Quelles sont les exigences de cette sous-partie O concernant les procédures écrites ?"
  1_desc: "Vous devez établir et suivre des procédures écrites pour satisfaire aux exigences de cette sous-partie O."
  2_prefix: "111.560"
  2_label: "Quelles exigences s'appliquent à l'examen et à l'enquête sur une réclamation concernant un produit ?"
  2_desc: "a. Une personne qualifiée doit :\n\t1. Examiner toutes les réclamations concernant les produits pour déterminer si la réclamation implique un éventuel défaut d'un complément alimentaire à respecter l'une de ses spécifications, ou toute autre exigence de cette partie 111, y compris les spécifications et autres exigences qui, si elles ne sont pas respectées, peuvent entraîner un risque de maladie ou de blessure ; et\n\t2. Enquêter sur toute réclamation concernant un produit qui implique un éventuel défaut d'un complément alimentaire à respecter l'une de ses spécifications, ou toute autre exigence de cette partie, y compris les spécifications et autres exigences qui, si elles ne sont pas respectées, peuvent entraîner un risque de maladie ou de blessure.\n\nb. Le personnel de contrôle qualité doit examiner et approuver les décisions concernant l'opportunité d'enquêter sur une réclamation concernant un produit et examiner et approuver les conclusions et les mesures de suivi de toute enquête effectuée.\n\nc. L'examen et l'enquête sur la réclamation concernant le produit par une personne qualifiée, ainsi que l'examen par le personnel de contrôle qualité concernant l'opportunité d'enquêter sur une réclamation concernant un produit, et les conclusions et les mesures de suivi de toute enquête effectuée, doivent s'étendre à tous les lots et enregistrements pertinents."
  3_prefix: "111.570"
  3_label: "Selon cette sous-partie O, quels enregistrements devez-vous établir et conserver ?"
  3_desc: "a. Vous devez établir et conserver les enregistrements requis par cette sous-partie O conformément à la sous-partie P de cette partie.\n\nb. Vous devez établir et conserver les enregistrements suivants :\n\t1. Les procédures écrites pour satisfaire aux exigences de cette sous-partie,\n\t2. Un enregistrement écrit de chaque réclamation concernant un produit qui est liée aux bonnes pratiques de fabrication,\n\t\ti. La personne qui effectue les exigences de cette sous-partie doit documenter, au moment de l'exécution, que l'exigence a été remplie.\n\t\tii. L'enregistrement écrit de la réclamation concernant le produit doit inclure les éléments suivants :\n\t\t\tA. Le nom et la description du complément alimentaire ;\n\t\t\tB. Le numéro de lot, de lot ou de contrôle du complément alimentaire, si disponible ;\n\t\t\tC. La date à laquelle la réclamation a été reçue et le nom, l'adresse ou le numéro de téléphone du plaignant, si disponible ;\n\t\t\tD. La nature de la réclamation, y compris, si connu, la manière dont le produit a été utilisé ;\n\t\t\tE. La réponse au plaignant, le cas échéant ; et\n\t\t\tF. Les conclusions de l'enquête et les mesures de suivi prises lorsqu'une enquête est effectuée."
16:
  prefix: "P"
  title: "Enregistrements et tenue des enregistrements"
  1_prefix: "111.605"
  1_label: "Quelles exigences s'appliquent aux enregistrements que vous établissez et conservez ?"
  1_desc: "a. Vous devez conserver les enregistrements écrits requis par cette partie pendant 1 an après la date de péremption, si une date de péremption est utilisée, ou 2 ans après la date de distribution du dernier lot de compléments alimentaires associés à ces enregistrements.\n\nb. Les enregistrements doivent être conservés sous forme d'enregistrements originaux, de copies conformes (telles que des photocopies, microfilms, microfiches ou autres reproductions exactes des enregistrements originaux), ou sous forme d'enregistrements électroniques.\n\nc. Tous les enregistrements électroniques doivent être conformes à la partie 11 de ce chapitre."
  2_prefix: "111.610"
  2_label: "Quels enregistrements doivent être mis à la disposition de la FDA ?"
  2_desc: "a. Vous devez avoir tous les enregistrements requis par cette partie, ou des copies de ces enregistrements, facilement disponibles pendant la période de conservation pour inspection et copie par la FDA, sur demande.\n\nb. Si vous utilisez des techniques de réduction, telles que le microfilmage, vous devez mettre à la disposition de la FDA un lecteur approprié et un équipement de photocopie."
