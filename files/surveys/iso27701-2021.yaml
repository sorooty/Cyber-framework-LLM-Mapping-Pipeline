4:
  title: "Généralités"
  1_label: "Structure du présent document"
  1_desc: "Il s'agit d'un document spécifique à un secteur lié à l'ISO/IEC 27001:2013 et à l'ISO/IEC 27002:2013.\n\nLe présent document se focalise sur les exigences spécifiques au PIMS. La conformité au présent document se fonde sur l'adhésion à ces exigences et aux exigences de l'ISO/IEC 27001:2013. Le présent document étend les exigences de l'ISO/IEC 27001:2013 afin de prendre en compte la protection de la vie privée des personnes concernées telle que potentiellement affectée par le traitement des DCP, en plus de la sécurité de l'information. Pour une meilleure compréhension, des recommandations de mise en œuvre et des informations supplémentaires relatives aux exigences sont incluses.\n\nL'Article 5 fournit des exigences spécifiques au PIMS et des informations supplémentaires relatives aux exigences en matière de sécurité de l'information contenues dans l'ISO/IEC 27001 appropriées pour une organisation agissant comme responsable de traitement de DCP ou comme sous-traitant de DCP.\n\n ℹ️NOTE 1\nDans un souci d'exhaustivité, l'Article 5 contient un paragraphe pour chacun des paragraphes de l'ISO/IEC 27001:2013 contenant des exigences, même dans les cas où il n'existe pas d'exigences spécifiques au PIMS ou d'informations supplémentaires.\n\nL'Article 6 fournit des recommandations spécifiques au PIMS et des informations supplémentaires relatives aux mesures de sécurité de l'information contenues dans l'ISO/IEC 27002 et des recommandations spécifiques au PIMS pour une organisation agissant comme responsable de traitement de DCP ou comme sous-traitant de DCP.\n\n ℹ️NOTE 2\nDans un souci d'exhaustivité, l'Article 6 contient un paragraphe pour chacun des paragraphes de l'ISO/IEC 27002:2013 contenant des objectifs ou des mesures, même dans les cas où il n'existe pas de recommandations spécifiques au PIMS ou d'informations supplémentaires.\n\nL'Article 7 fournit des recommandations supplémentaires de l'ISO/IEC 27002 pour les responsables de traitement de DCP, et l'Article 8 fournit des recommandations supplémentaires de l'ISO/IEC 27002 pour les sous-traitants de DCP.\n\nL'Annexe A énumère les objectifs et mesures spécifiques au PIMS pour une organisation agissant comme responsable de traitement de DCP (qu'elle fasse appel à un sous-traitant de DCP ou non, et qu'elle agisse conjointement avec un autre responsable de traitement de DCP ou non).\n\nL'Annexe B énumère les objectifs et mesures spécifiques au PIMS pour une organisation agissant comme sous-traitant de DCP (qu'elle sous-traite le traitement des DCP à un sous-traitant de DCP distinct ou non, et y compris ceux qui traitent les DCP comme sous-traitants de sous-traitants de DCP).\n\nL'Annexe C contient un tableau de correspondance avec l'ISO/IEC 29100.\n\nL'Annexe D contient un tableau de correspondance des mesures du présent document avec le Règlement général sur la protection des données.\n\nL'Annexe E contient un tableau de correspondance avec l'ISO/IEC 27018 et l'ISO/IEC 29151.\n\nL'Annexe F explique comment l'ISO/IEC 27001 et l'ISO/IEC 27002 sont étendues à la protection de la vie privée lors du traitement de DCP."
  2_label: "Application des exigences de l'ISO/IEC 27001:2013"
  2_desc: "Le Tableau 1 indique l'emplacement des exigences spécifiques au PIMS contenues dans le présent document par rapport à l'ISO/IEC 27001.\n\n ℹ️NOTE \nL'interprétation étendue de «sécurité de l'information» conformément au paragraphe 5.1 s'applique toujours, même en l'absence d'exigences spécifiques au PIMS."
  3_label: "Application des lignes directrices de l'ISO/IEC 27002:2013"
  3_desc: "Le Tableau 2 indique l'emplacement des recommandations spécifiques au PIMS contenues dans le présent document par rapport à l'ISO/IEC 27002.\n\n ℹ️NOTE \nL'interprétation étendue de «sécurité de l'information» conformément au paragraphe 6.1 s'applique toujours, même en l'absence de recommandations spécifiques au PIMS."
  4_label: "Client"
  4_desc: "Selon le rôle de l'organisation (voir 5.2.1), le terme «client» peut être compris comme signifiant:\n\n\t\ta) une organisation qui a conclu un contrat avec un responsable de traitement de DCP (par exemple: le client du responsable de traitement de DCP);\n\n\t\t ℹ️NOTE 1\n\t\tCela peut être le cas d'une organisation qui est un responsable conjoint de traitement.\n\n\t\t ℹ️NOTE 2\n\t\tUne personne physique ayant, avec une organisation, une relation de consommateur à entreprise est qualifiée de «personne concernée» dans le présent document.\n\n\t\tb) un responsable de traitement de DCP qui a conclu un contrat avec un sous-traitant de DCP (par exemple: le client du sous-traitant de DCP); ou\n\n\t\tc) un sous-traitant de DCP qui a conclu un contrat avec un sous-traitant pour le traitement de DCP (par exemple: le client du sous-traitant du sous-traitant).\n\n\t\t ℹ️NOTE 3\n\t\tLorsque le terme «client» est mentionné dans l'Article 6, les dispositions afférentes peuvent être applicables dans les contextes a), b) ou c).\n\n\t\t ℹ️NOTE 4\n\t\tLorsque le terme «client» est mentionné dans l'Article 6, les dispositions afférentes peuvent être applicables dans les contextes a), b) ou c).\n\n\t\t ℹ️NOTE 5\n\t\tLorsque le terme «client» est mentionné dans l'Article 6, les dispositions afférentes peuvent être applicables dans les contextes a), b) ou c)."
5:
  title: "Exigences spécifiques au PIMS liées à l'ISO/IEC 27001"
  1_label: "Généralités"
  1_desc: "Les exigences de l'ISO/IEC 27001:2013 mentionnant la «sécurité de l'information» doivent être étendues à la protection de la vie privée telle que potentiellement affectée par le traitement des DCP. \n\n ℹ️NOTE \nDans la pratique, lorsque le terme «sécurité de l'information» est utilisé dans l'ISO/IEC 27001:2013, «sécurité de l'information et protection de la vie privée» s'applique à la place."
  2:
    title: "Contexte de l'organisation"
    1_label: "Compréhension de l'organisation et de son contexte"
    1_desc: "Exigence supplémentaire par rapport au paragraphe 4.1 de l'ISO/IEC 27001:2013: \n\nL'organisation doit déterminer son rôle comme responsable de traitement de DCP (y compris comme responsable conjoint de traitement) et/ou comme sous-traitant de DCP. \nL'organisation doit déterminer les facteurs externes et internes pertinents pour son contexte, et qui influent sur sa capacité à atteindre le ou les résultat(s) attendu(s) de son PIMS. Par exemple, ceux-ci peuvent comprendre: \n\n\t- législation applicable en matière de protection de la vie privée;\n\t- réglementations applicables;\n\t- décisions judiciaires applicables;\n\t- contexte, gouvernance, politiques et procédures organisationnels applicables;\n\t- décisions administratives applicables;\n\t- exigences contractuelles applicables.\n\nLorsque l'organisation agit dans les deux rôles (par exemple: comme responsable de traitement de DCP et comme sous-traitant de DCP), les différents rôles doivent être déterminés, chacun d'entre eux faisant l'objet d'une série de mesures distinctes. \n\n ℹ️NOTE \n Le rôle de l'organisation peut être différent pour chaque instance du traitement des DCP, étant donné qu'il dépend de qui détermine les finalités et les moyens du traitement."
    2_label: "Compréhension des besoins et des attentes des parties intéressées"
    2_desc: "Exigence supplémentaire par rapport au paragraphe 4.2 de l'ISO/IEC 27001:2013:\n\nL'organisation doit inclure parmi ses parties intéressées, les parties ayant des intérêts ou des responsabilités associés au traitement des DCP, y compris les personnes concernées. \n\n ℹ️NOTE \n Les autres parties intéressées peuvent inclure les clients (voir 4.4), les autorités de contrôle, d'autres responsables de traitement de DCP, les sous-traitants de DCP et leurs sous-traitants. \n\n ℹ️NOTE \n Les exigences pertinentes pour le traitement des DCP peuvent être déterminées par les exigences légales et réglementaires, par les obligations contractuelles et les objectifs que l'organisation s'impose elle-même. Les principes de protection de la vie privée énoncés dans l'ISO/IEC 29100 fournissent des recommandations concernant le traitement des DCP. \n\n ℹ️NOTE \n En guise d'élément démontrant la conformité aux obligations de l'organisation, certaines parties intéressées peuvent attendre de l'organisation qu'elle se conforme à des normes spécifiques, telles que le système de management spécifié dans le présent document, et/ou à tout ensemble pertinent de spécifications. Ces parties peuvent demander que la conformité à ces normes fasse l'objet d'un audit indépendant."
    3_label: "Détermination du domaine d'application du système de management de la sécurité de l'information"
    3_desc: "Exigence supplémentaire par rapport au paragraphe 4.3 de l'ISO/IEC 27001:2013:\n\nLors de la détermination du périmètre du PIMS, l'organisation doit inclure le traitement des DCP. \n\n ℹ️NOTE \n La détermination du périmètre du PIMS peut nécessiter de réviser le périmètre du système de management de la sécurité de l'information, en raison de l'interprétation étendue de «sécurité de l'information» conformément au paragraphe 5.1"
    4_label: "Système de management de la sécurité de l'information"
    4_desc: "Exigence supplémentaire par rapport au paragraphe 4.4 de l'ISO/IEC 27001:2013\n\n L'organisation doit créer, mettre en œuvre, tenir à jour et améliorer continuellement un PIMS conformément aux exigences des Articles 4 à 10 de l'ISO/IEC 27001:2013, étendus par les exigences de l'Article 5."
  3:
    title: "Leadership"
    1_label: "Engagement du leadership"
    1_desc: "Les exigences énoncées au paragraphe 5.1 de l'ISO/IEC 27001:2013, ainsi que l'interprétation spécifiée en 5.1, s'appliquent."
    2_label: "Politique"
    2_desc: "Les exigences énoncées au paragraphe 5.2 de l'ISO/IEC 27001:2013, ainsi que l'interprétation spécifiée en 5.1, s'appliquent."
    3_label: "Rôles, responsabilités et autorités au sein de l'organisation"
    3_desc: "Les exigences énoncées au paragraphe 5.3 de l'ISO/IEC 27001:2013, ainsi que l'interprétation spécifiée en 5.1, s'appliquent."
  4:
    title: "Planification"
    1_label: "Actions face aux risques et opportunités"
    2_prefix: "5.4.1.1"
    2_label: "Généralités"
    2_desc: "Les exigences énoncées au paragraphe 6.1.1 de l'ISO/IEC 27001:2013, ainsi que l'interprétation spécifiée en 5.1, s'appliquent."
    3_prefix: "5.4.1.2"
    3_label: "Appréciation des risques de sécurité de l'information"
    3_desc: "Les exigences énoncées au paragraphe 6.1.2 de l'ISO/IEC 27001:2013 s'appliquent, avec les affinements suivants: \n\nL'ISO/IEC 27001:2013, 6.1.2 c) 1) est affinée comme suit:\nL'organisation doit appliquer le processus d'appréciation des risques de sécurité de l'information pour identifier les risques liés à la perte de confidentialité, d'intégrité et de disponibilité entrant dans le périmètre du PIMS. \nL'organisation doit appliquer un processus d'appréciation des risques sur la vie privée pour identifier les risques liés au traitement des DCP, entrant dans le périmètre du PIMS.\nL'organisation doit s'assurer tout au long des processus d'appréciation des risques que la relation entre la sécurité de l'information et la protection des DCP est gérée de façon appropriée.\n\n ℹ️NOTE \nL'organisation peut appliquer un processus d'appréciation des risques de sécurité de l'information et de risques sur la vie privée intégré ou deux processus distincts pour la sécurité de l'information et les risques associés au traitement des DCP.\n\nL'ISO/IEC 27001:2013, 6.1.2 d) 1) est affinée comme suit:\nL'organisation doit évaluer les conséquences potentielles pour l'organisation et pour les personnes concernées si les risques identifiés dans l'ISO/IEC 27001:2013, 6.1.2 c) telle qu'affinée ci-dessus, se concrétisaient."
    4_prefix: "5.4.1.3"
    4_label: "Traitement des risques de sécurité de l'information"
    4_desc: "Les exigences énoncées au paragraphe 6.1.3 de l'ISO/IEC 27001:2013 s'appliquent, avec les ajouts suivants:\nL'ISO/IEC 27001:2013, 6.1.3 c) est affinée comme suit:\nLes mesures déterminées dans l'ISO/IEC 27001:2013 6.1.3 b) doivent être comparées aux mesures de l'Annexe A et/ou de l'Annexe B et de l'ISO/IEC 27001:2013, Annexe A afin de vérifier qu'aucune mesure nécessaire n'a été omise.\nLors de l'évaluation de l'applicabilité des objectifs et des mesures de l'Annexe A de l'ISO/IEC 27001:2013 pour le traitement des risques, les objectifs et les mesures doivent être envisagés dans le contexte tant des risques pour la sécurité de l'information que des risques liés au traitement des DCP, y compris les risques pour les personnes concernées.\nL'ISO/IEC 27001:2013, 6.1.3 d) est affinée comme suit:\nProduire une Déclaration d'applicabilité contenant:\n\t— les mesures nécessaires [voir l'ISO/IEC 27001:2013, 6.1.3 b) et c)];\n\t— la justification de leur insertion;\n\t- si les mesures nécessaires sont mises en oeuvre ou non; et\n\t- la justification de l'exclusion de toute mesure de l'Annexe A et/ou de l'Annexe B et de l'ISO/IEC 27001:2013, Annexe A conformément à la détermination, par l'organisation, de son rôle (voir 5.2.1).\nIl n'est pas nécessaire d'inclure tous les objectifs et toutes les mesures énumérés dans les annexes dans la mise en oeuvre d'un PIMS. La justification de l'exclusion peut inclure les cas où les mesures ne sont pas jugées nécessaires par l'appréciation des risques, et ceux où elles ne sont pas requises par (ou sont soumises à des exceptions en vertu de) la législation et/ou la règlementation, y compris celles applicables à la personne concernée."
    5_prefix: "5.4.2"
    5_label: "Objectifs de sécurité de l'information et plans pour les atteindre"
    5_desc: "Les exigences énoncées au paragraphe 6.2 de l'ISO/IEC 27001:2013, ainsi que l'interprétation spécifiée en 5.1, s'appliquent."
  5:
    title: "Support"
    1_label: "Ressources"
    1_desc: "Les exigences énoncées au paragraphe 7.1 de l'ISO/IEC 27001:2013, ainsi que l'interprétation spécifiée en 5.1, s'appliquent."
    2_label: "Compétences"
    2_desc: "Les exigences énoncées au paragraphe 7.2 de l'ISO/IEC 27001:2013, ainsi que l'interprétation spécifiée en 5.1, s'appliquent."
    3_label: "Sensibilisation"
    3_desc: "Les exigences énoncées au paragraphe 7.3 de l'ISO/IEC 27001:2013, ainsi que l'interprétation spécifiée en 5.1, s'appliquent."
    4_label: "Communication"
    4_desc: "Les exigences énoncées au paragraphe 7.4 de l'ISO/IEC 27001:2013, ainsi que l'interprétation spécifiée en 5.1, s'appliquent."
  6:
