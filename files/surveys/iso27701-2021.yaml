  7:
    title: "Fonctionnement"
    1_label: "Planification et contrôle opérationnels"
    1_desc: "Les exigences énoncées au paragraphe 8.1 de l'ISO/IEC 27001:2013, ainsi que l'interprétation spécifiée en 5.1, s'appliquent."
    2_label: "Appréciation des risques de sécurité de l'information"
    2_desc: "Les exigences énoncées au paragraphe 8.2 de l'ISO/IEC 27001:2013, ainsi que l'interprétation spécifiée en 5.1, s'appliquent."
    3_label: "Traitement des risques de sécurité de l'information"
