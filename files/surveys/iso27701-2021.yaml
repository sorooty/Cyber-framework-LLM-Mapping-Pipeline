6:
  title: "Recommandations spécifiques au PIMS liées à l'ISO/IEC 27002"
  1_label: "Généralités"
  1_desc: "Il convient que les lignes directrices de l'ISO/IEC 27002:2013 mentionnant la «sécurité de l'information» soient étendues à la protection de la vie privée telle que potentiellement affectée par le traitement des DCP.\n\n ℹ️NOTE 1 \nDans la pratique, lorsque le terme «sécurité de l'information» est utilisé dans l'ISO/IEC 27002:2013, «sécurité de l'information et protection de la vie privée» s'applique à la place (voir l'Annexe F).\n\nIl convient que tous les objectifs et toutes les mesures soient envisagés dans le contexte tant des risques pour la sécurité de l'information que des risques sur la vie privée liés au traitement des DCP.\n\n ℹ️NOTE 2 \nSauf indication contraire contenue dans des dispositions spécifiques de l'Article 6, ou tel que déterminé par l'organisation conformément aux juridictions applicables, les mêmes recommandations s'appliquent aux responsables de traitement de DCP et aux sous-traitants de DCP."
  2:
    title: "Politiques de sécurité de l'information"
    1_prefix: "6.2.1.1"
    1_label: "Politiques de sécurité de l'information"
    1_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 5.1.1, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 5.1.1, Politiques de sécurité de l'information, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nQue ce soit par l'élaboration de politiques de protection de la vie privée distinctes, ou par l'augmentation des politiques en matière de sécurité de l'information, il convient que l'organisation produise une déclaration concernant le soutien et l'engagement à atteindre la conformité avec la législation et/ou la règlementation applicable relative à la protection des DCP ainsi qu'avec les conditions contractuelles convenues entre l'organisation et ses partenaires, ses sous-traitants de DCP et ses tiers applicables (clients, fournisseurs, etc.), et il convient que ces conditions contractuelles attribuent de façon claire les responsabilités de chacun.\n\nLes autres informations supplémentaires pour le paragraphe 5.1.1, Politiques de sécurité de l'information, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nIl convient que toute organisation qui traite des DCP, qu'il s'agisse d'un responsable de traitement de DCP ou d'un sous-traitant de DCP, tienne compte de la législation et/ou de la règlementation applicable en matière de protection des DCP lors de l'élaboration et du maintien des politiques de sécurité de l'information."
    2_prefix: "6.2.1.2"
    2_label: "Revue des politiques de sécurité de l'information"
    2_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 5.1.2, s'appliquent:"
  3:
    title: "Organisation de la sécurité de l'information"
    1_prefix: "6.3.1.1"
    1_label: "Fonctions et responsabilités liées à la sécurité de l'information"
    1_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 6.1.1, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 6.1.1, Fonctions et responsabilités liées à la sécurité de l'information, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nIl convient que l'organisation désigne un point de contact destiné au client en ce qui concerne le traitement des DCP. Lorsque l'organisation est un responsable de traitement de DCP, il convient de désigner un point de contact pour les personnes concernées en ce qui concerne le traitement de leurs DCP (voir 7.3.2).\n\nIl convient que l'organisation nomme une ou plusieurs personnes chargées de l'élaboration, de la mise en œuvre, du maintien et de la surveillance d'un programme de gouvernance et de protection de la vie privée à l'échelle de l'organisation, afin de garantir la conformité avec l'ensemble des lois et règlementations applicables relatives au traitement des DCP.\n\nIl convient, le cas échéant, que la personne responsable:\n\n\t\t- soit indépendante et soit placée sous l'autorité directe du niveau de direction de l'organisation approprié afin de garantir un management efficace des risques sur la vie privée;\n\t\t- soit impliquée dans la gestion de toutes les questions se rapportant au traitement des DCP;\n\t\t- possède une expertise dans le domaine de la législation, de la règlementation et de la pratique en matière de protection des données;\n\t\t- serve d'interlocuteur pour les autorités de contrôle;\n\t\t- informe la direction et les employés de l'organisation au sujet de leurs obligations en ce qui concerne le traitement des DCP;\n\t\t- fournisse des conseils en ce qui concerne les études de l'impact sur la vie privée réalisées par l'organisation.\n\n ℹ️NOTE \n Cette personne est appelée «délégué à la protection des données» dans certaines juridictions, qui définissent les cas où un poste de ce type est requis, ainsi que la fonction et leur rôle. Ce poste peut être occupé par un membre du personnel ou être externalisé."
    2_prefix: "6.3.1.2"
    2_label: "Séparation des tâches"
    2_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 6.1.2, s'appliquent"
    3_prefix: "6.3.1.3"
    3_label: "Relations avec les autorités"
    3_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 6.1.3, s'appliquent."
    4_prefix: "6.3.1.4"
    4_label: "Relations avec des groupes de travail spécialisés"
    4_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 6.1.4, s'appliquent."
    5_prefix: "6.3.1.5"
    5_label: "La sécurité de l'information dans la gestion de projet"
    5_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 6.1.5, s'appliquent."
    9_prefix: "6.3.2.1"
    6_label: "Politique en matière d'appareils mobiles"
    6_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 6.2.1, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLa mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 6.2.1, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nIl convient que l'organisation s'assure que l'utilisation d'appareils mobiles n'entraîne pas une compromission des DCP."
    7_prefix: "6.3.2.2"
    7_label: "Télétravail"
    7_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 6.2.2, s'appliquent."
  4:
    title: "La sécurité des ressources humaines"
    1_prefix: "6.4.1.1"
    1_label: "Sélection des candidats"
    1_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 7.1.1, s'appliquent."
    2_prefix: "6.4.1.2"
    2_label: "Termes et conditions d'embauche"
    2_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 7.1.2, s'appliquent."
    3_prefix: "6.4.2.1"
    3_label: "Responsabilités de la direction"
    3_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 7.2.1, s'appliquent."
    4_prefix: "6.4.2.2"
    4_label: "Sensibilisation, apprentissage et formation à la sécurité de l'information"
    4_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 7.2.2, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 7.2.2, Sensibilisation, apprentissage et formation à la sécurité de l'information, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nIl convient de mettre en place des mesures, y compris la sensibilisation à la signalisation des incidents, afin de s'assurer que le personnel concerné est conscient des conséquences possibles pour l'organisation (par exemple: conséquences juridiques, perte d'activités et détérioration de l'image de marque et de la réputation), pour le membre du personnel (par exemple: conséquences disciplinaires) et pour la personne concernée (par exemple: conséquences physiques, matérielles et émotionnelles) d'une violation des règles et procédures de protection de la vie privée ou de sécurité, en particulier celles applicables au traitement des DCP.\n\n ℹ️NOTE \nCes mesures peuvent inclure le recours à des formations périodiques appropriées pour le personnel ayant accès aux DCP."
    5_prefix: "6.4.2.3"
    5_label: "Processus disciplinaire"
    5_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 7.2.3, s'appliquent."
    6_prefix: "6.4.3.1"
    6_label: "Achèvement ou modification des responsabilités associées au contrat de travail"
    6_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 7.3.1, s'appliquent."
  5:
    title: "Gestion des actifs"
    1_prefix: "6.5.1.1"
    1_label: "Inventaire des actifs"
    1_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 8.1.1, s'appliquent."
    2_prefix: "6.5.1.2"
    2_label: "Propriété des actifs"
    2_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 8.1.2, s'appliquent."
    3_prefix: "6.5.1.3"
    3_label: "Utilisation correcte des actifs"
    3_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 8.1.3, s'appliquent."
    4_prefix: "6.5.1.4"
    4_label: "Restitution des actifs"
    4_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 8.1.4, s'appliquent."
    5_prefix: "6.5.2.1"
    5_label: "Classification des informations"
    5_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 8.2.1, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 8.2.1, Classification des informations, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nIl convient que le système de classification des informations de l'organisation tienne explicitement compte des DCP comme faisant partie du plan qu'elle met en œuvre. Tenir compte des DCP au sein du système global de classification est essentiel pour comprendre quelles DCP l'organisation traite (par exemple: type, catégories spéciales), où ces DCP sont stockées et quels sont les systèmes via lesquels elles peuvent circuler."
    6_prefix: "6.5.2.2"
    6_label: "Marquage des informations"
    6_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 8.2.2, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 8.2.2, Marquage des informations, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nIl convient que l'organisation s'assure que les personnes placées sous son autorité sont informées de la définition de DCP et de la façon de reconnaître les informations qui sont des DCP."
    7_prefix: "6.5.2.3"
    7_label: "Manipulation des actifs"
    7_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 8.2.3, s'appliquent."
    8_prefix: "6.5.3.1"
    8_label: "Gestion des supports amovibles"
    8_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 8.3.1, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 8.3.1, Gestion des supports amovibles, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nIl convient que l'organisation documente toute utilisation de supports et/ou de dispositifs amovibles à des fins de stockage de DCP. Dans la mesure du possible, il convient que l'organisation utilise des dispositifs et/ou supports physiques amovibles qui permettent le chiffrement lors du stockage de DCP. Il convient que les supports non chiffrés ne soient utilisés que lorsque cela est inévitable, et dans les cas où des supports et/ou dispositifs non chiffrés sont utilisés, il convient que l'organisation mette en œuvre des procédures et des mesures compensatoires (par exemple: emballage inviolable) permettant d'atténuer les risques pour les DCP.\n\nLes autres informations supplémentaires pour le paragraphe 8.3.1, Gestion des supports amovibles, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nLes supports amovibles qui sont transportés en dehors des limites physiques de l'organisation sont sujets à des pertes, à des dommages et à un accès inapproprié. Le chiffrement des supports amovibles ajoute un niveau de protection des DCP qui réduit les risques pour la sécurité et la vie privée dans l'éventualité où le support amovible serait compromis."
    9_prefix: "6.5.3.2"
    9_label: "Mise au rebut des supports"
    9_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 8.3.2, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 8.3.2, Mise au rebut des supports, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nLorsqu'un support amovible sur lequel des DCP sont stockées est mis au rebut, il convient que des procédures de mise au rebut sécurisées soient incluses dans les informations documentées et soient mises en œuvre afin de garantir que les DCP précédemment stockées ne seront pas accessibles."
    10_prefix: "6.5.3.3"
    10_label: "Transfert physique des supports"
    10_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 8.3.3, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 8.3.3, Transfert physique des supports, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nSi des supports physiques sont utilisés pour un transfert de l'information, il convient de mettre en place un système pour consigner les supports physiques entrants et sortants qui contiennent des DCP, y compris le type de support physique, l'expéditeur/les destinataires autorisés, la date et l'heure, ainsi que le nombre de supports physiques. Dans la mesure du possible, il convient que des mesures supplémentaires telles que le chiffrement soient mises en œuvre afin de s'assurer que l'accès aux données n'est possible qu'au point de destination et non pas pendant le transit.\n\nIl convient que l'organisation soumette les supports physiques qui contiennent des DCP avant de quitter ses locaux à une procédure d'autorisation et s'assure que les DCP ne sont accessibles à personne d'autre que les membres du personnel autorisés.\n\n ℹ️NOTE \nUne mesure possible permettant de s'assurer que les DCP contenues sur les supports physiques quittant les locaux de l'organisation ne soient généralement pas accessibles consiste à chiffrer les DCP concernées et à limiter les capacités de déchiffrement au personnel autorisé."
  6:
    title: "Contrôle d'accès"
    1_prefix: "6.6.1.1"
    1_label: "Politique de contrôle d'accès"
    1_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 9.1.1, s'appliquent."
    2_prefix: "6.6.1.2"
    2_label: "Accès aux réseaux et aux services en réseau"
    2_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 9.1.2, s'appliquent."
    3_prefix: "6.6.2.1"
    3_label: "Enregistrement et désinscription des utilisateurs"
    3_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 9.2.1, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 9.2.1, Enregistrement et désinscription des utilisateurs, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nIl convient que les procédures d'inscription et de désinscription des utilisateurs qui administrent ou utilisent les systèmes et les services qui traitent des DCP couvrent la situation où le contrôle d'accès des utilisateurs pour ces utilisateurs est compromis, par exemple en cas de corruption ou de violation de mots de passe ou d'autres données d'inscription des utilisateurs (découlant, par exemple, d'une divulgation accidentelle).\n\nIl convient que l'organisation ne réattribue pas aux utilisateurs des identifiants utilisateurs désactivés ou arrivés à expiration pour les systèmes et les services qui traitent des DCP.\n\nDans le cas où l'organisation fournit le traitement des DCP comme un service, le client peut être responsable de tout ou partie des aspects liés à la gestion des identifiants utilisateurs. Il convient que ces cas soient inclus dans les informations documentées.\n\nCertaines juridictions imposent des exigences particulières en ce qui concerne la fréquence des contrôles portant sur les justificatifs d'authentification inutilisés associés aux systèmes qui traitent des DCP. Il convient que les organisations qui opèrent dans ces juridictions prennent en compte la conformité à ces exigences."
    4_prefix: "6.6.2.2"
    4_label: "Maîtrise de la gestion des accès utilisateur"
    4_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 9.2.2, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 9.2.2, Maîtrise de la gestion des accès utilisateur, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nIl convient que l'organisation tienne un registre exact et à jour des profils d'utilisateurs créés pour les utilisateurs qui ont été autorisés à accéder au système d'information et aux DCP qu'il contient. Ce profil comprend l'ensemble des données relatives à cet utilisateur, y compris l'identifiant de l'utilisateur, nécessaires pour mettre en œuvre les mesures techniques identifiées permettant de fournir un accès autorisé.\n\nLa mise en œuvre d'identifiants d'accès utilisateur individuels permet aux systèmes correctement configurés d'identifier qui a accédé aux DCP et quels ajouts, suppressions ou modifications ils ont effectués. En plus de protéger l'organisation, les utilisateurs sont également protégés car ils peuvent identifier ce qu'ils ont traité et ce qu'ils n'ont pas traité.\n\nDans le cas où l'organisation fournit le traitement des DCP comme un service, le client peut être responsable de tout ou partie des aspects liés à la gestion de l'accès. Le cas échéant, il convient que l'organisation fournisse au client les moyens d'effectuer la gestion de l'accès, par exemple en fournissant des droits administratifs permettant de gérer ou de résilier les accès. Il convient que ces cas soient inclus dans les informations documentées."
    5_prefix: "6.6.2.3"
    5_label: "Gestion des privilèges d'accès"
    5_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 9.2.3, s'appliquent:"
    6_prefix: "6.6.2.4"
    6_label: "Gestion des informations secrètes d'authentification des utilisateurs"
    6_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 9.2.4, s'appliquent."
    7_prefix: "6.6.2.5"
    7_label: "Revue des droits d'accès utilisateur"
    7_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 9.2.5, s'appliquent."
    8_prefix: "6.6.2.6"
    8_label: "Suppression ou adaptation des droits d'accès"
    8_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 9.2.6, s'appliquent."
    9_prefix: "6.6.3.1"
    9_label: "Utilisation d'informations secrètes d'authentification"
    9_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 9.3.1, s'appliquent."
    10_prefix: "6.6.4.1"
    10_label: "Contrôle d'accès physique"
    10_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 9.4.1, s'appliquent."
    11_prefix: "6.6.4.2"
    11_label: "Sécuriser les procédures de connexion"
    11_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 9.4.2, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 9.4.2, Sécuriser les procédures de connexion, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nLorsque cela est exigé par le client, il convient que l'organisation fournisse une capacité de procédures de connexion sécurisées pour tous les comptes d'utilisateurs sous le contrôle du client."
    12_prefix: "6.6.4.3"
    12_label: "Système de gestion des mots de passe"
    12_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 9.4.3, s'appliquent."
    13_prefix: "6.6.4.4"
    13_label: "Utilisation de programmes utilitaires à privilèges"
    13_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 9.4.4, s'appliquent."
    14_prefix: "6.6.4.5"
    14_label: "Contrôle d'accès au code source des programmes"
    14_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 9.4.5, s'appliquent."
  7:
    title: "Cryptographie"
    1_prefix: "6.7.1.1"
    1_label: "Cryptographie"
    1_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 10.1.1, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 10.1.1, Politique d'utilisation des mesures cryptographiques, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nCertaines juridictions peuvent exiger le recours à la cryptographie pour protéger des types particuliers de DCP, telles que des données de santé, des numéros d'immatriculation de résidents, des numéros de passeport et des numéros de permis de conduire.\n\nIl convient que l'organisation fournisse au client des informations concernant les situations dans lesquelles elle utilise la cryptographie pour protéger les DCP qu'elle traite. Il convient également que l'organisation fournisse au client des informations concernant toute fonctionnalité qu'elle fournit et qui peut aider le client à appliquer sa propre protection cryptographique."
    2_prefix: "6.7.1.2"
    2_label: "Gestion des clés"
    2_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 10.1.2, s'appliquent."
  8:
    title: "Sécurité physique et environnementale"
    1_prefix: "6.8.1.1"
    1_label: "Périmètre de sécurité physique"
    1_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 11.1.1, s'appliquent."
    2_prefix: "6.8.1.2"
    2_label: "Contrôles physiques des accès"
    2_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 11.1.2, s'appliquent."
    3_prefix: "6.8.1.3"
    3_label: "Sécurisation des bureaux, des salles et des équipements"
    3_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 11.1.3, s'appliquent."
    4_prefix: "6.8.1.4"
    4_label: "Protection contre les menaces extérieures et environnementales"
    4_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 11.1.4, s'appliquent."
    5_prefix: "6.8.1.5"
    5_label: "Travail dans les zones sécurisées"
    5_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 11.1.5, s'appliquent."
    6_prefix: "6.8.1.6"
    6_label: "Zones de livraison et de chargement"
    6_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 11.1.6, s'appliquent."
    7_prefix: "6.8.2.1"
    7_label: "Emplacement et protection du matériel"
    7_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 11.2.2, s'appliquent."
    8_prefix: "6.8.2.2"
    8_label: "Services généraux"
    8_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 11.2.2, s'appliquent."
    9_prefix: "6.8.2.3"
    9_label: "Sécurité du câblage"
    9_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 11.2.3, s'appliquent."
    10_prefix: "6.8.2.4"
    10_label: "Maintenance du matériel"
    10_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 11.2.4, s'appliquent."
    11_prefix: "6.8.2.5"
    11_label: "Sortie des actifs"
    11_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 11.2.5, s'appliquent."
    12_prefix: "6.8.2.6"
    12_label: "Sécurité du matériel et des actifs hors des locaux"
    12_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 11.2.6, s'appliquent."
    13_prefix: "6.8.2.7"
    13_label: "Mise au rebut ou recyclage sécurisé(e) du matériel"
    13_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 11.2.7, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 11.2.7, Mise au rebut ou recyclage sécurisé(e) du matériel, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nIl convient que l'organisation veille à ce que, chaque fois que de l'espace de stockage est réaffecté, toute DCP auparavant présente sur cet espace de stockage ne soit pas accessible.\n\nLors de la suppression de DCP contenues dans un système d'information, des problèmes de performances peuvent rendre l'effacement explicite de ces DCP impossible. Cela soulève un risque qu'un autre utilisateur puisse être en mesure d'accéder aux DCP. Il convient d'éviter un tel risque au moyen de mesures techniques spécifiques.\n\nAfin d'assurer une mise au rebut ou une réutilisation sécurisée, il convient que les matériels qui contiennent des supports de stockage pouvant potentiellement contenir des DCP soient traités comme s'ils en contenaient réellement."
    14_prefix: "6.8.2.8"
    14_label: "Matériel utilisateur laissé sans surveillance"
    14_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 11.2.8, s'appliquent."
    15_prefix: "6.8.2.9"
    15_label: "Politique du bureau propre et de l'écran vide"
    15_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 11.2.9, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 11.2.9, Politique du bureau propre et de l'écran vide, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nIl convient que l'organisation limite la création de documents sur papier contenant des DCP au minimum nécessaire à la réalisation des finalités de traitement identifiées."
  9:
    title: "Sécurité liée à l'exploitation"
    1_prefix: "6.9.1.1"
    1_label: "Procédures d'exploitation documentées"
    1_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 12.1.1, s'appliquent."
    2_prefix: "6.9.1.2"
    2_label: "Gestion des changements"
    2_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 12.1.2, s'appliquent."
    3_prefix: "6.9.1.3"
    3_label: "Dimensionnement"
    3_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 12.1.3, s'appliquent."
    4_prefix: "6.9.1.4"
    4_label: "Séparation des environnements de développement, de test et d'exploitation"
    4_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 12.1.4, s'appliquent."
    5_prefix: "6.9.2.1"
    5_label: "Mesures contre les logiciels malveillants"
    5_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 12.2.1, s'appliquent."
    6_prefix: "6.9.3.1"
    6_label: "Sauvegarde des informations"
    6_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 12.3.1, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 12.3.1, Sauvegarde des informations, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nIl convient que l'organisation dispose d'une politique qui traite des exigences en matière de sauvegarde, de récupération et de restauration des DCP (qui peut faire partie d'une politique globale de sauvegarde des informations) ainsi que toute exigence supplémentaire (par exemple: les exigences contractuelles et/ou légales) relative à l'effacement des DCP contenues dans des informations conservées à des fins de sauvegarde.\n\nLes responsabilités spécifiques aux DCP à cet égard peuvent dépendre du client. Il convient que l'organisation s'assure que le client a été informé des limites du service en ce qui concerne les sauvegardes.\n\nLorsque l'organisation fournit de façon explicite des services de sauvegarde et de restauration aux clients, il convient que l'organisation leur fournisse des informations claires au sujet de leurs capacités en matière de sauvegarde et de restauration des DCP.\n\nCertaines juridictions imposent des exigences particulières en ce qui concerne la fréquence de sauvegarde des DCP, la fréquence des revues et des tests de sauvegarde, ou en ce qui concerne les procédures de récupération des DCP. Il convient que les organisations qui opèrent dans ces juridictions démontrent qu'elles sont en conformité avec ces exigences.\n\nIl peut y avoir des situations où il est nécessaire de restaurer des DCP, peut-être en raison d'un dysfonctionnement du système, d'une attaque ou d'une catastrophe. Lorsque des DCP sont restaurées (généralement à partir d'un support de sauvegarde), il est nécessaire que des processus soient en place afin de garantir que les DCP sont restaurées dans un état où l'intégrité des DCP peut être garantie et/ ou l'inexactitude ou l'incomplétude des DCP est identifiée et que des processus sont en place pour les résoudre (ce qui peut impliquer la personne concernée).\n\nIl convient que l'organisation dispose d'une procédure relative aux opérations de restauration de DCP, ainsi qu'un journal les enregistrant. Il convient que le journal des opérations de restauration de DCP contienne au minimum:\n\t\t- le nom de la personne responsable de la restauration;\n\t\t- une description des DCP restaurées.\n\nCertaines juridictions imposent le contenu des journaux des opérations de restauration de DCP. Il convient que les organisations soient en mesure de documenter la conformité avec toute exigence spécifique à la juridiction applicable relative au contenu du journal de restauration. Il convient que les conclusions de ces délibérations soient incluses dans les informations documentées.\n\nLe recours à des sous-traitants pour stocker des copies répliquées ou de sauvegarde des DCP traitées est couvert par les mesures décrites dans le présent document qui s'appliquent au traitement des DCP soustraitées (voir 6.5.3.3, 6.12.1.2). Les éventuels transferts physiques des supports liés aux sauvegardes et aux restaurations sont également couverts par les mesures du présent document (6.10.2.1)."
    7_prefix: "6.9.4.1"
    7_label: "Journalisation des événements"
    7_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 12.4.1, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 12.4.1, Journalisation des événements, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nIl convient de mettre en place un processus permettant de passer en revue les journaux d'événements à l'aide de processus de surveillance et d'alerte continus et automatisés, ou bien manuels lorsqu'il convient que cette revue soit effectuée à une périodicité spécifiée et documentée, afin d'identifier les irrégularités et de proposer des actions correctives.\n\nDans la mesure du possible, il convient que les journaux d'événements enregistrent l'accès aux DCP, y compris par qui, quand, quelles DCP ont été consultées et les personnes concernées, et quels changements (le cas échéant) ont été apportés (ajouts, modifications ou suppressions) en raison de l'événement.\n\nLorsque plusieurs fournisseurs de services sont impliqués dans la fourniture de services, des rôles divers et partagés peuvent être impliqués dans la mise en œuvre de ces recommandations. Il convient que ces rôles soient clairement définis et inclus dans les informations documentées, et il convient qu'un accord portant sur tout accès au journal entre fournisseurs soit traité.\n\nRecommandations de mise en œuvre pour les sous-traitants de DCP:\n\nIl convient que l'organisation définisse des critères pour établir si, quand et comment les informations des journaux peuvent être mises à disposition du client ou être utilisables par celui-ci. Il convient que ces critères soient mis à la disposition du client.\n\nLorsque l'organisation permet à ses clients d'accéder aux enregistrements des journaux contrôlés par l'organisation, il convient que l'organisation mette en œuvre des mesures appropriées afin de s'assurer que le client peut uniquement accéder aux enregistrements qui ont trait aux activités de ce client, qu'il ne peut accéder à aucun enregistrement de journal se rapportant aux activités d'autres clients, et qu'il ne peut en aucune façon modifier les journaux."
    8_prefix: "6.9.4.2"
    8_label: "Protection de l'information journalisée"
    8_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 12.4.2, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 12.4.2, Protection de l'information journalisée, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nLes informations de journal consignées, par exemple, pour la surveillance de la sécurité et les diagnostics opérationnels, peuvent contenir des DCP. Il convient de mettre en place des mesures, telles que le contrôle d'accès (voir l'ISO/IEC 27002:2013, 9.2.3), pour s'assurer que les informations journalisées sont utilisées uniquement tel que prévu.\n\nIl convient de mettre en place une procédure, de préférence automatique, pour s'assurer que les informations journalisées sont soit supprimées, soit dé-identifiées tel que spécifié dans le programme de conservation (voir 7.4.7)."
    9_prefix: "6.9.4.3"
    9_label: "Journaux administrateur et opérateur"
    9_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 12.4.3, s'appliquent."
    10_prefix: "6.9.4.4"
    10_label: "Synchronisation des horloges"
    10_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 12.4.4, s'appliquent."
    11_prefix: "6.9.5.1"
    11_label: "Installation de logiciels sur des systèmes en exploitation"
    11_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 12.5.1, s'appliquent."
    12_prefix: "6.9.6.1"
    12_label: "Gestion des vulnérabilités techniques"
    12_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 12.6.1, s'appliquent."
    13_prefix: "6.9.6.2"
    13_label: "Restrictions liées à l'installation de logiciels"
    13_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 12.6.2, s'appliquent."
    14_prefix: "6.9.7.1"
    14_label: "Mesures relatives à l'audit des systèmes d'information"
    14_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 12.7.1, s'appliquent."
  10:
    title: "Sécurité des communications"
    1_prefix: "6.10.1.1"
    1_label: "Contrôle des réseaux"
    1_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 13.1.1, s'appliquent."
    2_prefix: "6.10.1.2"
    2_label: "Sécurité des services de réseau"
    2_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 13.1.2, s'appliquent."
    3_prefix: "6.10.1.3"
    3_label: "Cloisonnement des réseaux"
    3_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 13.1.3, s'appliquent."
    4_prefix: "6.10.2.1"
    4_label: "Politiques et procédures de transfert de l'information"
    4_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 13.2.1, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 13.2.1, Politiques et procédures de transfert de l'information, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nIl convient que l'organisation envisage des procédures permettant de garantir que les règles relatives au traitement des DCP sont appliquées dans l'ensemble du système ainsi qu'à l'extérieur du système, le cas échéant."
    5_prefix: "6.10.2.2"
    5_label: "Accords en matière de transfert d'information"
    5_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 13.2.2, s'appliquent."
    6_prefix: "6.10.2.3"
    6_label: "Messagerie électronique"
    6_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 13.2.3, s'appliquent."
    7_prefix: "6.10.2.4"
    7_label: "Engagements de confidentialité ou de non-divulgation"
    7_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 13.2.4, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 13.2.4, Engagements de confidentialité ou de non-divulgation, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nIl convient que l'organisation s'assure que les personnes travaillant sous sa responsabilité et ayant accès à des DCP sont soumises à une obligation de confidentialité. Il convient que l'engagement de confidentialité, qu'il fasse partie d'un contrat ou qu'il soit indépendant, précise la durée pendant laquelle il convient de respecter ces obligations.\n\nLorsque l'organisation est un sous-traitant de DCP, il convient qu'un engagement de confidentialité, sous quelque forme que ce soit, entre l'organisation, ses employés et ses agents, garantisse que les employés et les agents se conforment à la politique et aux procédures relatives à la manipulation et à la protection des données."
  11:
    title: "Acquisition, développement et maintenance des systèmes d'information"
    1_prefix: "6.11.1.1"
    1_label: "Analyse et spécification des exigences de sécurité de l'information"
    1_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 14.1.1, s'appliquent."
    2_prefix: "6.11.1.2"
    2_label: "Sécurisation des services d'application sur les réseaux publics"
    2_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 14.1.2, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 14.1.2, Sécurisation des services d'application sur les réseaux publics, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nIl convient que l'organisation s'assure que les DCP qui sont transmises via des réseaux de transmission de données non fiables sont chiffrées en vue de leur transmission. Les réseaux non fiables peuvent inclure l'Internet public et autres installations échappant au contrôle opérationnel de l'organisation.\n\n ℹ️NOTE\n Dans certains cas (par exemple: l'échange de courriers électroniques), les caractéristiques inhérentes des réseaux de transmission de données non fiables peuvent exiger que certaines données d'en-tête ou de trafic soient exposées pour permettre une transmission efficace."
    3_prefix: "6.11.1.3"
    3_label: "Protection des transactions liées aux services d'application"
    3_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 14.1.3, s'appliquent."
    4_prefix: "6.11.2.1"
    4_label: "Politique de développement sécurisé"
    4_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 14.2.1, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 14.2.1, Politique de développement sécurisé, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nIl convient que les politiques en matière de conception et de développement du système incluent des recommandations relatives aux besoins de traitement de DCP par l'organisation, sur la base des obligations à l'égard des personnes concernées et/ou de toute législation et/ou règlementation applicable et des types de traitement effectués par l'organisation. Les Articles 7 et 8 fournissent des considérations relatives aux mesures pour le traitement des DCP, qui peuvent être utiles pour l'élaboration des politiques en matière de protection de la vie privée dans la conception des systèmes.\n\nLes recommandations supplémentaires sont les suivantes:\n\n\t\ta) Recommandations sur la protection des données personnelles (DCP) et la mise en œuvre des principes de protection de la vie privée (voir l'ISO/IEC 29100) dans le cycle de vie du développement d'un logiciel;\n\n\t\tb) Exigences en matière de protection de la vie privée et de traitement des DCP dans la phase de conception, basées sur une appréciation des risques sur la vie privée ou une étude de l'impact sur la vie privée (voir 7.2.5);\n\n\t\tc) Points de contrôle de protection des DCP à différentes étapes clés du projet;\n\n\t\td) Connaissance requise en matière de protection de la vie privée et de traitement des DCP;\n\n\t\te) Minimiser par défaut le traitement des données personnelles."
    5_prefix: "6.11.2.2"
    5_label: "Procédures de contrôle des changements apportés au système"
    5_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 14.2.2, s'appliquent."
    6_prefix: "6.11.2.3"
    6_label: "Revue technique des applications après changement apporté à la plateforme d'exploitation"
    6_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 14.2.3, s'appliquent."
    7_prefix: "6.11.2.4"
    7_label: "Restrictions relatives aux changements apportés aux progiciels"
    7_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 14.2.4, s'appliquent."
    8_prefix: "6.11.2.5"
    8_label: "Principes d'ingénierie de la sécurité des systèmes"
    8_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 14.2.5, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 14.2.5, Principes d'ingénierie de la sécurité des systèmes, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nIl convient que les systèmes et/ou les composants associés au traitement des DCP soient conçus conformément aux principes de la protection de la vie privée dès la conception et de la protection de la vie privée par défaut, et anticipent et facilitent la mise en œuvre des mesures pertinentes (tel que décrit aux Articles 7 et 8, pour les responsables de traitement de DCP et les sous-traitants de DCP, respectivement), particulièrement de sorte que la collecte et le traitement des DCP dans ces systèmes se limitent à ce qui est nécessaire pour les finalités identifiées du traitement des DCP (voir 7.2). \n\nPar exemple, il convient qu'une organisation qui traite des DCP s'assure que, en fonction de la juridiction concernée, elle mette les DCP au rebut après une durée déterminée. Il convient que le système qui traite les DCP soit conçu de façon à faciliter cette exigence de suppression."
    9_prefix: "6.11.2.6"
    9_label: "Environnement de développement sécurisé"
    9_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 14.2.6, s'appliquent."
    10_prefix: "6.11.2.7"
    10_label: "Développement externalisé"
    10_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 14.2.7, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 14.2.7, Développement externalisé, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nIl convient que les mêmes principes (voir 6.11.2.5) de protection de la vie privée dès la conception et de protection de la vie privée par défaut soient appliqués, le cas échéant, aux systèmes d'information externalisés."
    11_prefix: "6.11.2.8"
    11_label: "Phase de test de la sécurité du système"
    11_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 14.2.8, s'appliquent."
    12_prefix: "6.11.2.9"
    12_label: "Test de conformité du système"
    12_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 14.2.9, s'appliquent."
    13_prefix: "6.11.3.1"
    13_label: "Protection des données de test"
    13_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 14.3.1, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 14.3.1, Protection des données de test, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nIl convient de ne pas utiliser de DCP à des fins de test; il convient d'utiliser des DCP fictives ou fausses. Lorsque l'utilisation de DCP à des fins de test ne peut être évitée, il convient que des mesures techniques et organisationnelles équivalentes à celles utilisées dans l'environnement de production soient mises en œuvre afin de minimiser les risques. Lorsque ces mesures équivalentes ne sont pas possibles, il convient qu'une appréciation des risques soit effectuée et soit utilisée afin d'éclairer le choix des mesures d'atténuation appropriées."
  12:
    title: "Relations avec les fournisseurs"
    1_prefix: "6.12.1.1"
    1_label: "Politique de sécurité de l'information dans les relations avec les fournisseurs"
    1_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 15.1.1, s'appliquent."
    2_prefix: "6.12.1.2"
    2_label: "La sécurité dans les accords conclus avec les fournisseurs"
    2_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 15.1.2, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 15.1.2, La sécurité dans les accords conclus avec les fournisseurs, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nIl convient que l'organisation spécifie, dans les accords conclus avec les fournisseurs, si des DCP sont traitées ainsi que les mesures techniques et organisationnelles minimales que le fournisseur doit satisfaire pour que l'organisation puisse satisfaire à ses obligations en matière de sécurité de l'information et de protection des DCP (voir 7.2.6 et 8.2.1).\n\nIl convient que les accords conclus avec les fournisseurs attribuent clairement les responsabilités entre l'organisation, ses partenaires, ses fournisseurs et ses tiers applicables (clients, fournisseurs, etc.) en tenant compte du type de DCP traitées.\n\nIl convient que les accords conclus entre l'organisation et ses fournisseurs prévoient un mécanisme permettant de garantir que l'organisation soutient et gère la conformité avec l'ensemble des législations et/ou règlementations applicables. Il convient que les accords prévoient que la conformité fasse l'objet d'audits indépendants, acceptables pour le client.\n\n ℹ️NOTE\nÀ de telles fins d'audit, la conformité à des normes de sécurité et de protection de la vie privée pertinentes et applicables telles que l'ISO/IEC 27001 ou le présent document peut être envisagée.\n\nRecommandations de mise en œuvre pour les sous-traitants de DCP\n\nIl convient que l'organisation spécifie dans les contrats conclus avec tout fournisseur que les DCP seront uniquement traitées selon ses instructions."
    3_prefix: "6.12.1.3"
    3_label: "Chaîne d'approvisionnement informatique"
    3_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 15.1.3, s'appliquent."
    4_prefix: "6.12.2.1"
    4_label: "Surveillance et revue des services des fournisseurs"
    4_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 15.2.1, s'appliquent."
    5_prefix: "6.12.2.2"
    5_label: "Gestion des changements apportés dans les services des fournisseurs"
    5_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 15.2.2, s'appliquent."
  13:
    title: "Gestion des incidents liés à la sécurité de l'information"
    1_prefix: "6.13.1.1"
    1_label: "Responsabilités et procédures"
    1_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 16.1.1, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 16.1.1, Responsabilités et procédures, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nDans le cadre du processus global de gestion des incidents liés à la sécurité de l'information, il convient que l'organisation établisse des responsabilités et des procédures pour l'identification et l'enregistrement des violations de DCP. En outre, il convient que l'organisation mette en place des responsabilités et des procédures liées à la notification aux parties concernées des violations des DCP (y compris le moment de ces notifications) et à la divulgation aux autorités, en tenant compte de la législation et/ou de la règlementation applicable.\n\nCertaines juridictions imposent une réglementation spécifique en ce qui concerne les réponses aux violations, y compris la notification. Il convient que les organisations qui opèrent dans ces juridictions s'assurent qu'elles peuvent démontrer qu'elles sont en conformité avec ces règlementations."
    2_prefix: "6.13.1.2"
    2_label: "Signalement des événements liés à la sécurité de l'information"
    2_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 16.1.2, s'appliquent."
    3_prefix: "6.13.1.3"
    3_label: "Signalement des failles liées à la sécurité de l'information"
    3_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 16.1.3, s'appliquent."
    4_prefix: "6.13.1.4"
    4_label: "Appréciation des événements liés à la sécurité de l'information et prise de décision"
    4_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 16.1.4, s'appliquent."
    5_prefix: "6.13.1.5"
    5_label: "Réponse aux incidents liés à la sécurité de l'information"
    5_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 16.1.5, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 16.1.5, Réponse aux incidents liés à la sécurité de l'information, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nRecommandations de mise en œuvre pour les responsables de traitement de DCP\n\nIl convient qu'un incident impliquant des DCP déclenche une revue par l'organisation, dans le cadre de son processus de gestion des incidents liés à la sécurité de l'information, afin de déterminer si une violation impliquant des DCP et exigeant une réponse s'est produite.\n\nUn événement n'entraîne pas systématiquement le déclenchement d'une telle revue.\n\nℹ️NOTE 1\nUn événement lié à la sécurité de l'information n'entraîne pas nécessairement un cas réel, ou une forte probabilité d'accès non autorisé à des DCP ou à tout matériel ou toute installation de l'organisation stockant des DCP. Ces évènements peuvent inclure, sans que cela s'y limite, des pings et autres attaques de diffusion sur des pare-feu ou des serveurs périphériques, des analyses de ports, des tentatives infructueuses de connexion, des attaques par déni de service et des analyses de paquets.\n\nLorsqu'une violation de DCP s'est produite, il convient que les procédures de réponse incluent des notifications et enregistrements pertinents.\n\nCertaines juridictions définissent les cas où il convient que la violation soit notifiée à l'autorité de contrôle, et quand il convient qu'elle soit notifiée aux personnes concernées.\n\nIl convient que les notifications soient claires et elles peuvent être exigées.\n\nℹ️NOTE 2\nLa notification peut contenir des détails tels que:\n\t\t- un interlocuteur auprès duquel des informations complémentaires peuvent être obtenues;\n\t\t- une description de la violation et ses conséquences probables;\n\t\t- une description de la violation, y compris le nombre de personnes concernées ainsi que le nombre d'enregistrements concernés;\n\t\t- les mesures prises ou prévues.\n\nℹ️NOTE 3\nDes informations sur la gestion des incidents liés à la sécurité sont disponibles dans la série de normes ISO/IEC 27035.\n\nSi une violation impliquant des DCP est survenue, il convient de tenir à jour un enregistrement contenant suffisamment d'informations pour fournir un rapport à des fins règlementaires et/ou juridiques, telles que:\n\t\t- une description de l'incident;\n\t\t- la durée de l'incident;\n\t\t- les conséquences de l'incident;\n\t\t- le nom du déclarant;\n\t\t- la ou les personne(s) à qui l'incident a été signalé;\n\t\t- la ou les personne(s) à qui l'incident a été signalé;\n\t\t- le fait que l'incident ait entraîné une indisponibilité, une perte, une divulgation ou une altération de DCP.\n\nSi une violation impliquant des DCP est survenue, il convient que l'enregistrement inclue également une description des DCP compromises, si elles sont connues; et, si des notifications ont été effectuées, les mesures prises pour notifier les personnes concernées, les organismes règlementaires ou les clients.\n\nRecommandations de mise en œuvre pour les sous-traitants\n\nIl convient que les dispositions relatives à la notification d'une violation impliquant des DCP fassent partie intégrante du contrat conclu entre l'organisation et le client. Il convient que le contrat spécifie de quelle manière l'organisation fournira les informations nécessaires pour permettre au client de satisfaire à son obligation d'informer les autorités compétentes. Cette obligation de notification ne s'étend pas à une violation causée par le client ou par une personne concernée, ou qui intervient au sein de composants du système dont il ou elle a la responsabilité. Il convient que le contrat définisse également les limites prévues et imposées de façon externe en matière de délai de réponse à la notification.\n\nDans certaines juridictions, il convient que le sous-traitant de DCP notifie le responsable de traitement de DCP de l'existence d'une violation sans délai excessif (c'est-à-dire dès que possible), de préférence dès qu'elle est découverte, de façon que le responsable de traitement de DCP puisse prendre des mesures appropriées.\n\nSi une violation impliquant des DCP est survenue, il convient de tenir à jour un enregistrement contenant suffisamment d'informations pour fournir un rapport à des fins règlementaires et/ou juridiques, telles que:\n\t\t- une description de l'incident;\n\t\t- la durée de l'incident;\n\t\t- les conséquences de l'incident;\n\t\t- le nom du déclarant;\n\t\t- la ou les personne(s) à qui l'incident a été signalé;\n\t\t- les mesures prises pour résoudre l'incident (y compris la personne responsable et les données récupérées);\n\t\t- le fait que l'incident ait entraîné une indisponibilité, une perte, une divulgation ou une altération de DCP.\n\nSi une violation impliquant des DCP est survenue, il convient que l'enregistrement inclue également une description des DCP compromises, si elles sont connues; et, si des notifications ont été effectuées, les mesures prises pour notifier le client et/ou les organismes réglementaires.\n\nDans certaines juridictions, la législation et/ou la réglementation applicable peuvent exiger de l'organisation qu'elle notifie directement les organismes réglementaires compétents (par exemple: une autorité de protection des DCP) d'une violation impliquant des DCP."
    6_prefix: "6.13.1.6"
    6_label: "Tirer des enseignements des incidents liés à la sécurité de l'information"
    6_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 16.1.6, s'appliquent."
    7_prefix: "6.13.1.7"
    7_label: "Recueil de preuves"
    7_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 16.1.7, s'appliquent."
  14:
    title: "Aspects de la sécurité de l'information dans la gestion de la continuité de l'activité"
    1_prefix: "6.14.1.1"
    1_label: "Organisation de la continuité de la sécurité de l'information"
    1_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 17.1.1, s'appliquent."
    2_prefix: "6.14.1.2"
    2_label: "Mise en œuvre de la continuité de la sécurité de l'information"
    2_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 17.1.2, s'appliquent."
    3_prefix: "6.14.1.3"
    3_label: "Vérifier, réviser et évaluer la continuité de la sécurité de l'information"
    3_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 17.1.3, s'appliquent."
    4_prefix: "6.14.2.1"
    4_label: "Disponibilité des moyens de traitement de l'information"
    4_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 17.2.1, s'appliquent."
  15:
    title: "Conformité"
    1_prefix: "6.15.1.1"
    1_label: "Identification de la législation et des exigences contractuelles applicables"
    1_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 18.1.1, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes autres informations supplémentaires pour le paragraphe 18.1.1, Identification de la législation et des exigences contractuelles applicables, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nIl convient que l'organisation identifie toute sanction judiciaire potentielle (pouvant découler du nonrespect de certaines obligations) liée au traitement des DCP, y compris les amendes conséquentes infligées directement par l'autorité de contrôle locale. Dans certaines juridictions, les normes internationales telles que le présent document peuvent être utilisées pour constituer la base d'un contrat entre l'organisation et le client, détaillant leurs responsabilités respectives en matière de sécurité, de protection de la vie privée et de protection des DCP. Les termes du contrat peuvent fournir une base pour des sanctions contractuelles en cas de manquement à ces responsabilités."
    2_prefix: "6.15.1.2"
    2_label: "Droits de propriété intellectuelle"
    2_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 18.1.2, s'appliquent."
    3_prefix: "6.15.1.3"
    3_label: "Protection des enregistrements"
    3_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 18.1.3, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 18.2.1, Revue indépendante de la sécurité de l'information, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nLorsqu'une organisation agit comme sous-traitant de DCP, et que les audits client individuels sont impossibles ou peuvent augmenter les risques pour la sécurité, il convient que l'organisation mette à la disposition des clients, avant de conclure un contrat, et pour la durée du contrat, des preuves indépendantes démontrant que la sécurité de l'information est mise en œuvre et exploitée en conformité avec les politiques et les procédures de l'organisation. Il convient qu'un audit indépendant pertinent, choisi par l'organisation, constitue normalement une méthode acceptable de satisfaction de l'intérêt du client à passer en revue les opérations de traitement de l'organisation, s'il couvre les besoins des utilisateurs prévus et si les résultats sont fournis de façon suffisamment transparente."
    4_prefix: "6.15.1.4"
    4_label: "Protection de la vie privée et protection des données à caractère personnel"
    4_desc: "La mesure, les recommandations de mise en oeuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 18.1.4, s'appliquent."
    5_prefix: "6.15.1.5"
    5_label: "Réglementation relative aux mesures cryptographiques"
    5_desc: "La mesure, les recommandations de mise en oeuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 18.1.5, s'appliquent."
    6_prefix: "6.15.2.1"
    6_label: "Revue indépendante de la sécurité de l'information"
    6_desc: "La mesure, les recommandations de mise en oeuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 18.2.1, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en oeuvre supplémentaires pour le paragraphe 18.2.1, Revue indépendante de la sécurité de l'information, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nLorsqu'une organisation agit comme sous-traitant de DCP, et que les audits client individuels sont impossibles ou peuvent augmenter les risques pour la sécurité, il convient que l'organisation mette à la disposition des clients, avant de conclure un contrat, et pour la durée du contrat, des preuves indépendantes démontrant que la sécurité de l'information est mise en oeuvre et exploitée en conformité avec les politiques et les procédures de l'organisation. Il convient qu'un audit indépendant pertinent, choisi par l'organisation, constitue normalement une méthode acceptable de satisfaction de l'intérêt du client à passer en revue les opérations de traitement de l'organisation, s'il couvre les besoins des utilisateurs prévus et si les résultats sont fournis de façon suffisamment transparente."
    7_prefix: "6.15.2.2"
    7_label: "Conformité avec les politiques et les normes de sécurité"
    7_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 18.2.2, s'appliquent."
    8_prefix: "6.15.2.3"
    8_label: "Examen de la conformité technique"
    8_desc: "La mesure, les recommandations de mise en œuvre et les informations supplémentaires fournies dans l'ISO/IEC 27002:2013, 18.2.3, ainsi que les recommandations supplémentaires suivantes, s'appliquent.\n\nLes recommandations de mise en œuvre supplémentaires pour le paragraphe 18.2.3, Examen de la conformité technique, de l'ISO/IEC 27002:2013 sont les suivantes:\n\nDans le cadre des examens techniques de la conformité aux politiques et normes de sécurité, il convient que l'organisation inclue des méthodes permettant d'examiner les outils et les composants associés au traitement des DCP. Cela peut inclure:\n\t\t- une surveillance continue afin de vérifier que seules les opérations de traitement autorisées ont lieu; et/ou\n\t\t- des tests spécifiques de pénétration ou de vulnérabilité (par exemple: des ensembles de données dé-identifiées peuvent être soumis à un test d'intrusion motivée afin de valider que les méthodes de dé-identification sont conformes aux exigences de l'organisation)."
7:
  title: "Recommandations supplémentaires de l'ISO/IEC 27002 pour les responsables de traitement de DCP"
  1_label: "Généralités"
  1_desc: "Les recommandations de l'Article 6 et les ajouts du présent article créent des recommandations spécifiques au PIMS pour les responsables de traitement de DCP. Les recommandations de mise en œuvre documentées dans le présent article se rapportent aux mesures énumérées dans l'Annexe A."
  2:
    title: "Conditions de collecte et de traitement"
    1_label: "Identifier et documenter la finalité"
    1_desc: "Mesure\n\nIl convient que l'organisation identifie et documente les fins spécifiques pour lesquelles les DCP seront traitées.\n\nRecommandations de mise en œuvre\n\nIl convient que l'organisation s'assure que les personnes concernées comprennent la finalité pour laquelle leurs DCP sont traitées. Il incombe à l'organisation de documenter et de communiquer ceci de façon claire aux personnes concernées. Sans une déclaration claire des finalités du traitement, il n'est pas possible de donner son consentement et de formuler un choix de façon adéquate.\n\nIl convient que la documentation de la ou des finalité(s) du traitement des DCP soit suffisamment claire et détaillée pour être utilisable dans les informations requises à fournir aux personnes concernées (voir 7.3.2). Cela comprend les informations nécessaires à l'obtention du consentement (voir 7.2.3), ainsi que les enregistrements des politiques et des procédures (voir 7.2.8).\n\nInformations supplémentaires\n\nPour le déploiement de services d'informatique en nuage, la taxonomie et les définitions de l'ISO/IEC 19944 peuvent être utiles et fournir des termes permettant de décrire les finalités du traitement des DCP."
    2_label: "Identifier le fondement juridique"
    2_desc: "Mesure\n\nIl convient que l'organisation détermine, documente et se conforme au fondement juridique pertinent pour le traitement des DCP pour les finalités identifiées.\n\nRecommandations de mise en œuvre\n\nCertaines juridictions exigent de l'organisation qu'elle soit en mesure de démontrer que la légalité du traitement a été dûment établie avant le traitement.\n\nLe fondement juridique pour le traitement des DCP peut inclure:\n\t\t- le consentement des personnes concernées;\n\t\t- l'exécution d'un contrat;\n\t\t- la conformité à une obligation légale;\n\t\t- la protection des intérêts vitaux des personnes concernées;\n\t\t- l'exécution d'une tâche effectuée dans l'intérêt général;\n\t\t- des intérêts légitimes du responsable de traitement de DCP.\n\nIl convient que l'organisation documente ce fondement pour chaque activité de traitement de DCP (voir 7.2.8).\n\nLes intérêts légitimes de l'organisation peuvent inclure, par exemple, les objectifs de sécurité de l'information, qu'il convient de mettre en balance face aux obligations vis-à-vis des personnes concernées en ce qui concerne la protection de la vie privée.\n\nChaque fois que des catégories spéciales de DCP sont définies, soit par la nature des DCP (par exemple: informations de santé) ou par les personnes concernées (par exemple: les DCP relatives aux enfants), il convient que l'organisation inclue ces catégories de DCP dans ses systèmes de classification.\n\nLa classification des DCP qui entrent dans ces catégories peut varier d'une juridiction à une autre et peut varier entre différents cadres règlementaires qui s'appliquent à différents types d'activités, c'est pourquoi il est nécessaire que l'organisation ait connaissance de la ou des classification(s) qui s'applique(nt) au traitement des DCP effectué.\n\nL'utilisation de catégories spéciales de DCP peut également faire l'objet de mesures plus rigoureuses.\n\nModifier ou étendre les finalités du traitement de DCP peut nécessiter de mettre à jour et/ou de réviser le fondement juridique. Cela peut également nécessiter d'obtenir un consentement supplémentaire de la part de la ou des personnes concernée(s)."
    3_label: "Déterminer quand et comment le consentement doit être obtenu"
    3_desc: "Mesure\n\nIl convient que l'organisation détermine et documente un processus par lequel elle peut démontrer si, quand et comment le consentement pour le traitement des DCP a été obtenu des personnes concernées.\n\nRecommandations de mise en œuvre\n\nLe consentement peut être requis pour le traitement des DCP, sauf si d'autres motifs licites s'appliquent. Il convient que l'organisation documente clairement quand il est nécessaire d'obtenir le consentement ainsi que les exigences relatives à l'obtention du consentement. Il peut être utile d'établir une corrélation entre la ou les finalité(s) du traitement et les informations indiquant si et comment le consentement est obtenu.\n\nCertaines juridictions ont des exigences spécifiques sur la façon dont le consentement est collecté et enregistré (par exemple: non regroupé avec d'autres accords). De plus, certains types de collecte de données (pour la recherche scientifique, par exemple) et certains types de personnes concernées, tels que les enfants, peuvent être soumis à des exigences supplémentaires. Il convient que l'organisation tienne compte de ces exigences et documente la manière dont les mécanismes d'obtention du consentement satisfont à ces exigences."
    4_label: "Obtenir et enregistrer le consentement"
    4_desc: "Mesure\n\nIl convient que l'organisation obtienne et enregistre le consentement des personnes concernées conformément aux procédures documentées.\n\nRecommandations de mise en œuvre\n\nIl convient que l'organisation obtienne et enregistre le consentement des personnes concernées de manière à pouvoir fournir sur demande des précisions sur le consentement donné (par exemple: le moment où le consentement a été donné, l'identification de la personne concernée, et la déclaration de consentement).\n\nIl convient que les informations fournies à la personne concernée avant le processus d'obtention du consentement suivent les recommandations du paragraphe 7.3.3.\n\nIl convient que le consentement soit:\n\t\t- donné librement;\n\t\t- spécifique en ce qui concerne la finalité du traitement; et\n\t\t- exempt d'ambiguïté et explicite."
    5_label: "Étude de l'impact sur la vie privée"
    5_desc: "Mesure\n\nIl convient que l'organisation évalue la nécessité de, et mette en œuvre lorsque cela est approprié, une étude de l'impact sur la vie privée à chaque fois qu'un nouveau traitement de DCP ou que des modifications à un traitement de DCP existant sont prévus.\n\nRecommandations de mise en œuvre\n\nLe traitement des DCP peut entraîner des risques pour les personnes concernées. Il convient que ces risques soient évalués au moyen d'une étude de l'impact sur la vie privée. Certaines juridictions définissent des cas pour lesquels une étude de l'impact sur la vie privée est imposée. Les critères peuvent inclure la prise de décision automatisée produisant des effets juridiques pour les personnes concernées, le traitement à grande échelle de catégories spéciales de DCP (par exemple: informations liées à la santé, origine raciale ou ethnique, opinions politiques, croyances religieuses ou philosophiques, appartenance syndicale, données génétiques ou biométriques), ou une surveillance systématique d'une zone accessible au public à grande échelle.\n\nIl convient que l'organisation détermine les éléments qui sont nécessaires à l'exécution d'une étude de l'impact sur la vie privée. Ceux-ci peuvent inclure une liste des types de DCP traitées, l'emplacement où les DCP sont stockées et où elles peuvent être transférées. Des diagrammes de flux de données et des cartes de données peuvent également être utiles dans ce contexte (voir 7.2.8 pour des détails relatifs aux enregistrements du traitement des DCP qui peuvent renseigner une étude de l'impact sur la vie privée ou une autre appréciation des risques).\n\nInformations supplémentaires\n\nDes recommandations relatives aux études de l'impact sur la vie privée liées au traitement des DCP sont disponibles dans l'ISO/IEC 29134."
    6_label: "Contrats conclus avec les sous-traitants de DCP"
    6_desc: "Mesure\n\nIl convient que l'organisation dispose d'un contrat écrit avec tout sous-traitant de DCP auquel elle fait appel, et il convient qu'elle s'assure que les contrats qu'elle conclut avec les sous-traitants de DCP traitent de la mise en œuvre des mesures appropriées indiquées à l'Annexe B.\n\nRecommandations de mise en œuvre\n\nIl convient que le contrat conclu entre l'organisation et tout sous-traitant traitant des DCP en son nom exige du sous-traitant de DCP qu'il mette en œuvre les mesures appropriées spécifiées à l'Annexe B, en tenant compte du processus d'appréciation des risques pour la sécurité de l'information (voir 5.4.1.2) et du périmètre du traitement des DCP effectué par le sous-traitant de DCP (voir 6.12). Par défaut, il convient de présumer que toutes les mesures spécifiées à l'Annexe B sont pertinentes. Si l'organisation décide de ne pas exiger du sous-traitant de DCP qu'il mette en œuvre une mesure contenue dans l'Annexe B, il convient qu'elle justifie son exclusion (voir 5.4.1.3).\n\nUn contrat peut définir les responsabilités de chaque partie de façon différente mais, afin d'être en conformité avec le présent document, il convient que toutes les mesures soient prises en compte et incluses dans les informations documentées."
    7_label: "Responsable conjoint de traitement"
    7_desc: "Mesure\n\nIl convient que l'organisation détermine les responsabilités et les rôles respectifs pour le traitement des DCP (y compris les exigences en matière de sécurité et de protection des DCP) avec tout responsable conjoint de traitement.\n\nRecommandations de mise en œuvre\n\nIl convient que les rôles et les responsabilités en matière de traitement des DCP soient déterminés de manière transparente.\n\nIl convient que ces rôles et responsabilités soient documentés dans un contrat ou dans tout autre document juridiquement contraignant qui contient les termes et conditions relatifs au traitement conjoint des DCP. Dans certaines juridictions, cet accord est appelé «accord de partage de données».\n\nUn accord conclu avec un responsable conjoint de traitement peut comprendre (la présente liste n'est ni définitive, ni exhaustive):\n\t\t- la finalité du partage de DCP/de la relation de responsable conjoint de traitement;\n\t\t- l'identité des organisations (responsables de traitement de DCP) qui font partie de la relation de responsable conjoint de traitement;\n\t\t- les catégories de DCP à partager et/ou à transférer et à traiter en vertu de l'accord;\n\t\t- un aperçu des opérations de traitement (par exemple: transfert, utilisation);\n\t\t- une description des responsabilités et des rôles respectifs;\n\t\t- la responsabilité de la mise en œuvre des mesures de sécurité techniques et organisationnelles pour la protection des DCP; \n\t\t- une définition de la responsabilité en cas de violation des DCP (par exemple: qui procèdera à la notification et quand, information mutuelle);\n\t\t- les conditions de conservation et/ou de mise au rebut des DCP;\n\t\t- les responsabilités en cas de non-respect de l'accord;\n\t\t- comment les obligations vis-à-vis des personnes concernées sont satisfaites;\n\t\t- comment fournir aux personnes concernées des informations couvrant l'essence de l'accord conclu entre les responsables conjoints de traitement;\n\t\t- comment les personnes concernées peuvent obtenir les autres informations qu'elles ont le droit de recevoir; et\n\t\t- les coordonnées d'un interlocuteur pour les personnes concernées."
    8_label: "Enregistrements liés au traitement des DCP"
    8_desc: "Mesure\n\nIl convient que l'organisation détermine et tienne à jour de façon sécurisée les enregistrements nécessaires à l'appui de ses obligations pour le traitement des DCP.\n\nRecommandations de mise en œuvre\n\nUne façon de tenir à jour les enregistrements liés au traitement des DCP consiste à dresser un inventaire ou une liste des activités de traitement des DCP que l'organisation effectue. Cet inventaire peut comprendre:\n\t\t- le type de traitement;\n\t\t- les finalités du traitement;\n\t\t- une description des catégories de DCP et des personnes concernées (par exemple: des enfants);\n\t\t- les catégories de destinataires à qui des DCP ont été ou seront divulguées, y compris les destinataires dans des pays tiers ou des organisations internationales;\n\t\t- une description générale des mesures de sécurité techniques et organisationnelles; et\n\t\t- un rapport d'étude de l'impact sur la vie privée.\n\nIl convient que cet inventaire ait un propriétaire, responsable de son exactitude et de sa complétude."
  3:
    title: "Obligations vis-à-vis des personnes concernées"
    1_label: "Identifier les obligations vis-à-vis des personnes concernées et y satisfaire"
    1_desc: "Mesure\n\nIl convient que l'organisation identifie et documente ses obligations légales, règlementaires et organisationnelles vis-à-vis des personnes concernées liées au traitement de leurs DCP, et qu'elle prévoie les moyens de satisfaire à ces obligations.\n\nRecommandations de mise en œuvre\n\nLes obligations vis-à-vis des personnes concernées et les moyens permettant de les soutenir varient d'une juridiction à une autre.\n\nIl convient que l'organisation s'assure qu'elle fournit les moyens appropriés permettant de satisfaire aux obligations vis-à-vis des personnes concernées de façon accessible et au moment adéquat. Il convient qu'une documentation claire soit fournie aux personnes concernées, décrivant la mesure dans laquelle les obligations à leur égard sont satisfaites et comment elles le sont, ainsi que les coordonnées d'un interlocuteur à jour à qui elles peuvent adresser leurs demandes.\n\nIl convient que le point de contact soit fourni de la même façon que celle utilisée pour collecter les DCP et le consentement (par exemple: si les DCP sont collectées par courrier électronique ou via un site Internet, il convient que l'interlocuteur soit joignable par courrier électronique ou via le site Internet, et non par un autre moyen tel que le téléphone ou la télécopie)."
    2_label: "Déterminer les informations destinées aux personnes concernées"
    2_desc: "Mesure\n\nIl convient que l'organisation détermine et documente les informations à fournir aux personnes concernées en ce qui concerne le traitement de leurs DCP et le moment pour le faire.\n\nRecommandations de mise en œuvre\n\nIl convient que l'organisation détermine les exigences légales, règlementaires et/ou organisationnelles applicables aux situations où des informations doivent être fournies aux personnes concernées (par exemple: avant le traitement, dans un certain délai à partir du moment où elles sont demandées, etc.) et applicables au type d'informations à fournir.\n\nSelon les exigences, les informations peuvent prendre la forme d'une déclaration écrite. Exemples de types d'informations qui peuvent être fournies aux personnes concernées:\n\t\t- informations sur les finalités du traitement;\n\t\t- coordonnées du responsable de traitement de DCP ou de son représentant;\n\t\t- informations relatives au fondement juridique du traitement;\n\t\t- informations sur l'emplacement où les DCP ont été obtenues, si elles n'ont pas été obtenues directement auprès de la personne concernée;\n\t\t- informations indiquant si la fourniture de DCP est une exigence statutaire ou contractuelle, et le cas échéant, les conséquences éventuelles d'une non-fourniture des DCP;\n\t\t- informations relatives aux obligations vis-à-vis des personnes concernées, tel que déterminé au paragraphe 7.3.1, et sur la façon dont les personnes concernées peuvent en bénéficier, particulièrement en ce qui concerne l'accès, la modification, la correction, la demande de suppression, la réception d'une copie de leurs DCP et l'opposition à leur traitement;\n\t\t- informations sur la façon dont la personne concernée peut retirer son consentement;\n\t\t- informations relatives aux transferts de DCP;\n\t\t- informations relatives aux destinataires ou aux catégories de destinataires de DCP;\n\t\t- informations relatives à la durée pendant laquelle les DCP seront conservées;\n\t\t- informations relatives à l'utilisation de la prise de décisions automatisée fondée sur le traitement automatisé des DCP;\n\t\t- informations relatives au droit de déposer une réclamation et sur la procédure de dépôt de réclamation;\n\t\t- informations relatives à la fréquence à laquelle les informations sont fournies (par exemple: notification «juste à temps», fréquence définie par l'organisation, etc.). \n\nIl convient que l'organisation fournisse des informations mises à jour si les finalités du traitement des DCP sont modifiées ou étendues."
    3_label: "Fournir des informations aux personnes concernées"
    3_desc: "Mesure\n\nIl convient que l'organisation fournisse aux personnes concernées des informations claires et facilement accessibles identifiant le responsable de traitement de DCP et décrivant le traitement de leurs DCP.\n\nRecommandations de mise en œuvre\n\nIl convient que l'organisation fournisse les informations indiquées au paragraphe 7.3.2 aux personnes concernées de façon opportune, concise, exhaustive, transparente, intelligible et facilement accessible, en utilisant un langage simple et clair adapté au public cible.\n\nLe cas échéant, il convient que les informations soient fournies au moment de la collecte des DCP. Il convient également qu'elles soient accessibles de façon permanente.\n\nℹ️NOTE\nLes icônes et images peuvent être utiles à la personne concernée car elles fournissent un aperçu visuel du traitement prévu."
    4_label: "Fournir un mécanisme permettant de modifier ou de retirer le consentement"
    4_desc: "Mesure\n\nIl convient que l'organisation fournisse un mécanisme permettant aux personnes concernées de modifier ou de retirer leur consentement.\n\nRecommandations de mise en œuvre\n\nIl convient que l'organisation informe les personnes concernées de leurs droits en matière de retrait de leur consentement (qui peuvent varier selon la juridiction) à tout moment, et qu'elle fournisse le mécanisme permettant de le faire. Le mécanisme utilisé pour le retrait dépend du système; il convient dans la mesure du possible qu'il soit cohérent avec les mécanismes utilisés pour l'obtention du consentement. Par exemple, si le consentement est recueilli par courrier électronique ou via un site Internet, il convient que le mécanisme permettant de le retirer soit le même, et non une autre solution telle que le téléphone ou la télécopie. Modifier le consentement peut inclure d'imposer des restrictions sur le traitement des DCP, qui peuvent inclure l'interdiction pour le responsable de traitement de DCP de supprimer les DCP dans certains cas. Certaines juridictions imposent des restrictions sur le moment et la façon dont une personne concernée peut modifier ou retirer son consentement. Il convient que l'organisation enregistre toute demande de retrait ou de modification du consentement de la même façon que l'enregistrement du consentement en lui-même. Il convient que toute modification du consentement soit diffusée, via des systèmes appropriés, aux utilisateurs autorisés et aux tiers concernés. Il convient que l'organisation définisse un délai de réponse et il convient que les demandes soient traitées en conséquence.\n\nInformations complémentaires\n\nLorsque le consentement pour un traitement de DCP particulier est retiré, il convient que l'ensemble du traitement de DCP effectué avant le retrait soit normalement considéré comme étant approprié, mais il convient que les résultats de ce traitement ne soient pas utilisés pour un nouveau traitement. Par exemple, si une personne concernée retire son consentement au profilage, il convient que son profil ne soit plus utilisé ou consulté."
    5_label: "Fournir un mécanisme permettant de s'opposer au traitement des DCP"
    5_desc: "Mesure\n\nIl convient que l'organisation fournisse un mécanisme permettant aux personnes concernées de s'opposer au traitement de leurs DCP.\n\nRecommandations de mise en œuvre\n\nCertaines juridictions accordent aux personnes concernées le droit de s'opposer au traitement de leurs DCP. Il convient que les organisations soumises à la législation et/ou la règlementation de ces juridictions s'assurent qu'elles mettent en œuvre des mesures appropriées pour permettre aux personnes concernées d'exercer ce droit. Il convient que l'organisation documente les exigences légales et réglementaires liées à l'opposition au traitement par les personnes concernées (par exemple: opposition liée au traitement des DCP à des fins de prospection commerciale). Il convient que l'organisation fournisse aux personnes concernées des informations sur la capacité à s'opposer dans ces situations. Les mécanismes d'opposition peuvent varier, mais il convient qu'ils soient cohérents avec le type de service fourni (par exemple: il convient que les services en ligne offrent cette capacité en ligne)."
    6_label: "Accès, rectification et/ou suppression"
    6_desc: "Mesure\n\nIl convient que l'organisation mette en œuvre des politiques, des procédures et/ou des mécanismes permettant de satisfaire à ses obligations vis-à-vis des personnes concernées en matière d'accès, de rectification et/ou de suppression de leurs DCP.\n\nRecommandations de mise en œuvre\n\nIl convient que l'organisation mette en œuvre des politiques, des procédures et/ou des mécanismes permettant aux personnes concernées d'accéder à, de corriger et d'effacer leurs DCP, sur demande et sans délai excessif. Il convient que l'organisation définisse un délai de réponse et il convient que les demandes soient traitées en conséquence. Il convient que toute correction ou suppression soit diffusée à l'ensemble du système et/ou des utilisateurs autorisés, et il convient qu'elle soit transmise aux tiers (voir 7.3.7) auxquels les DCP ont été transférées.\n\nℹ️NOTE\nLes enregistrements produits par la mesure spécifiée au paragraphe 7.5.3 peuvent aider à cet égard.\n\nIl convient que l'organisation mette en œuvre des politiques, des procédures et/ou des mécanismes à utiliser lorsqu'il peut exister un litige relatif à l'exactitude ou à la correction des données par la personne concernée. Il convient que ces politiques, procédures et/ou mécanismes incluent la communication des modifications apportées à la personne concernée, et des raisons pour lesquelles il n'est pas possible d'effectuer des corrections (le cas échéant). Certaines juridictions imposent des restrictions sur le moment et la façon dont une personne concernée peut demander la correction et la suppression de ses DCP. Il convient que l'organisation détermine ces restrictions en fonction des cas et se maintienne à jour à leur sujet."
    7_label: "Obligation d'information des tiers des responsables de traitement de DCP"
    7_desc: "Mesure\n\nIl convient que l'organisation informe les tiers avec lesquels des DCP ont été partagées de toute modification, suppression ou opposition relatives aux DCP partagées, et qu'elle mette en œuvre des politiques, des procédures et/ou des mécanismes appropriés permettant de le faire.\n\nRecommandations de mise en œuvre\n\nIl convient que l'organisation prenne des mesures appropriées, en gardant à l'esprit la technologie disponible, pour informer les tiers de toute modification ou de tout retrait du consentement, ou de toute opposition relatifs aux DCP partagées. Certaines juridictions imposent une exigence légale d'information des tiers au sujet de ces actions. Il convient que l'organisation identifie et tienne à jour des canaux de communication actifs avec les tiers. Les responsabilités associées peuvent être attribuées à des personnes en charge de leur fonctionnement et de leur entretien. Il convient que l'organisation, lorsqu'elle informe des tiers, vérifie qu'ils accusent réception des informations.\n\nℹ️NOTE\nLes modifications découlant des obligations vis-à-vis des personnes concernées peuvent inclure la modification ou le retrait du consentement, les demandes de correction, la suppression ou les restrictions relatives au traitement, ou les oppositions au traitement des DCP tel que demandé par la personne concernée."
    8_label: "Fourniture de copies des DCP traitées"
    8_desc: "Mesure\n\nIl convient que l'organisation soit en mesure de fournir une copie des DCP qui sont traitées sur demande de la personne concernée.\n\nRecommandations de mise en œuvre\n\nIl convient que l'organisation fournisse une copie des DCP traitées dans un format structuré, couramment utilisé, accessible par la personne concernée. Certaines juridictions définissent des cas où il convient que l'organisation fournisse une copie des DCP traitées dans un format permettant la portabilité au profit des personnes concernées ou des responsables de traitement de DCP destinataires (généralement dans un format structuré, couramment utilisé et lisible par machine). Il convient que l'organisation s'assure que toute copie des DCP fournie à une personne concernée se rapporte spécifiquement à cette personne concernée. Lorsque les DCP demandées ont déjà été supprimées sous réserve de la politique en matière de conservation et de mise au rebut (tel que décrit en 7.4.7), il convient que le responsable de traitement de DCP informe la personne concernée que les DCP demandées ont été supprimées. Dans les cas où l'organisation n'est plus en mesure d'identifier la personne concernée (par exemple: suite à un processus de dé-identification), il convient que l'organisation ne cherche pas à (ré)identifier les personnes concernées au seul motif de mise en œuvre de cette mesure. Toutefois, dans certaines juridictions, des demandes légitimes peuvent imposer que des informations supplémentaires soient demandées à la personne concernée afin de permettre la ré-identification et la divulgation ultérieure. Lorsque cela est techniquement possible, il convient qu'il soit possible de transférer une copie des DCP d'une organisation directement à une autre organisation, à la demande de la personne concernée."
    9_label: "Gestion des demandes"
    9_desc: "Mesure\n\nIl convient que l'organisation définisse et documente les politiques et procédures de gestion et de réponse aux demandes légitimes émanant de personnes concernées.\n\nRecommandations de mise en œuvre\n\nLes demandes légitimes peuvent comprendre les demandes de copie des DCP traitées, ou les demandes de dépôt de réclamation. Certaines juridictions autorisent l'organisation à facturer des frais dans certains cas (par exemple: demandes excessives ou répétées). Il convient que les demandes soient traitées dans les délais de réponse définis appropriés. Certaines juridictions définissent des délais de réponse, en fonction de la complexité et du nombre des demandes, ainsi que des exigences d'information des personnes concernées pour tout retard. Il convient que les délais de réponse appropriés soient définis dans la politique de protection de la vie privée."
    10_label: "Prise de décision automatisée"
    10_desc: "Mesure\n\nIl convient que l'organisation identifie et traite les obligations, y compris les obligations légales, vis-à-vis des personnes concernées découlant des décisions prises par l'organisation qui sont liées à la personne concernée et qui sont uniquement fondées sur le traitement automatisé des DCP.\n\nRecommandations de mise en œuvre\n\nCertaines juridictions définissent des obligations spécifiques vis-à-vis des personnes concernées lorsqu'une décision fondée uniquement sur le traitement automatisé des DCP les affecte de manière significative, comme le fait de notifier l'existence d'une prise de décision automatisée, autoriser les personnes concernées à s'opposer à cette prise de décision et/ou à obtenir une intervention humaine.\n\nℹ️NOTE\nDans certaines juridictions, certains traitements de DCP ne peuvent pas être entièrement automatisés.\n\nIl convient que les organisations qui opèrent dans ces juridictions prennent en compte la conformité à ces obligations."
  4:
    title: "Protection de la vie privée dès la conception et protection de la vie privée par défaut"
    1_label: "Limiter la collecte"
    1_desc: "Mesure\n\nIl convient que l'organisation limite la collecte des DCP au minimum de ce qui est pertinent, proportionnel et nécessaire pour les finalités identifiées.\n\nRecommandations de mise en œuvre\n\nIl convient que l'organisation limite la collecte des DCP à ce qui est adéquat, pertinent et nécessaire pour les finalités identifiées. Cela inclut le fait de limiter la quantité de DCP que l'organisation collecte de façon indirecte (par exemple: au travers des journaux web, des journaux système, etc.).\nLa protection de la vie privée par défaut implique que, lorsqu'il existe des options dans la collecte et le traitement des DCP, il convient que chaque option soit désactivée par défaut et ne soit activée que par un choix explicite de la personne concernée."
    2_label: "Limiter le traitement"
    2_desc: "Mesure\n\nIl convient que l'organisation limite le traitement des DCP à ce qui est adéquat, pertinent et nécessaire pour les finalités identifiées.\n\nRecommandations de mise en œuvre\n\nIl convient que la limitation du traitement des DCP soit gérée par le biais des politiques de sécurité de l'information et de protection de la vie privée (voir 6.2) ainsi que des procédures documentées pour leur adoption et leur conformité. Il convient que le traitement des DCP, y compris:\n\t\t- leur divulgation;\n\t\t- la durée de stockage des DCP; et\n\t\t- qui est en mesure d'accéder aux DCP;\nsoit limité par défaut au minimum nécessaire par rapport aux finalités identifiées."
    3_label: "Exactitude et qualité"
    3_desc: "Mesure\n\nIl convient que l'organisation s'assure et documente que les DCP sont exactes, complètes et à jour tel que nécessaire pour les finalités pour lesquelles elles sont traitées, tout au long du cycle de vie des DCP.\n\nRecommandations de mise en œuvre\n\nIl convient que l'organisation mette en œuvre des politiques, des procédures et/ou des mécanismes permettant de minimiser les inexactitudes dans les DCP qu'elle traite. Il convient qu'il existe également des politiques, des procédures et/ou des mécanismes permettant de répondre aux cas de DCP inexactes. Il convient que ces politiques, ces procédures et/ou ces mécanismes soient inclus dans les informations documentées (par exemple: par le biais de configurations du système technique, etc.) et il convient qu'ils s'appliquent tout au long du cycle de vie des DCP.\n\nInformations complémentaires\n\nPour plus d'informations sur le cycle de vie de traitement des DCP, voir l'ISO/IEC 29101:2018, 6.2."
    4_label: "Objectifs de minimisation des DCP"
    4_desc: "Mesure\n\nIl convient que l'organisation définisse et documente des objectifs de minimisation des données et quels mécanismes (tels que la dé-identification) sont utilisés pour atteindre ces objectifs.\n\nRecommandations de mise en œuvre\nIl convient que les organisations identifient comment les DCP spécifiques et la quantité de DCP collectées et traitées sont limitées par rapport aux finalités identifiées. Cela peut inclure l'utilisation de la dé-identification ou d'autres techniques de minimisation des données.\nLa finalité identifiée (voir 7.2.1) peut exiger le traitement de DCP qui n'ont pas été dé-identifiées, auquel cas il convient que l'organisation soit en mesure de décrire ce traitement.\nDans d'autres cas, la finalité identifiée n'exige pas le traitement des DCP d'origine, et le traitement des DCP qui ont été dé-identifiées peut suffire à atteindre la finalité identifiée. Dans ces cas, il convient que l'organisation définisse et documente la mesure dans laquelle les DCP ont besoin d'être associées à la personne concernée, ainsi que les mécanismes et les techniques conçus pour traiter les DCP, de sorte que la dé-identification et/ou les objectifs de minimisation des DCP soient atteints.\nLes mécanismes utilisés pour minimiser les DCP varient en fonction du type de traitement et des systèmes utilisés pour le traitement. Il convient que l'organisation documente tout mécanisme (configurations du système technique, etc.) utilisé pour mettre en œuvre la minimisation des données.\nDans les cas où le traitement des données dé-identifiées est suffisant pour les finalités, il convient que l'organisation documente tout mécanisme (configurations du système technique, etc.) destiné à mettre en œuvre les objectifs de dé-identification établis par l'organisation au moment adéquat. Par exemple, la suppression d'attributs associés aux personnes concernées peut être suffisante pour permettre à l'organisation d'atteindre sa finalité identifiée. Dans d'autres cas, d'autres techniques de dé-identification, telles que la généralisation (par exemple: arrondissement) ou des techniques de randomisation (par exemple: ajout de bruit) peuvent être utilisées pour atteindre un niveau adéquat de dé-identification.\n\nℹ️NOTE 1\nPour plus d'informations sur les techniques de dé-identification, se référer à l'ISO/IEC 20889.\n\nℹ️NOTE 2\nPour l'informatique en nuage, l'ISO/IEC 19944 fournit une définition des qualificateurs d'identification des données qui peuvent être utilisés pour classer la mesure dans laquelle les données peuvent identifier une personne concernée ou associer une personne concernée avec un ensemble de caractéristiques des DCP."
    5_label: "Dé-identification et suppression des DCP à la fin du traitement"
    5_desc: "Mesure\n\nIl convient que l'organisation supprime les DCP ou les transforme au point de rendre impossible l'identification ou la ré-identification des personnes concernées, dès que les DCP d'origine ne sont plus nécessaires à la (ou aux) finalité(s) identifiée(s).\n\nRecommandations de mise en œuvre\n\nIl convient que l'organisation ait mis en place des mécanismes permettant d'effacer les DCP lorsqu'aucun autre traitement n'est prévu. Autrement, certaines techniques de dé-identification peuvent être utilisées tant que les données dé-identifiées obtenues ne peuvent raisonnablement pas permettre la réidentification des personnes concernées."
    6_label: "Fichiers temporaires"
    6_desc: "Mesure\n\nIl convient que l'organisation s'assure que les fichiers temporaires créés à la suite du traitement de DCP sont mis au rebut (par exemple: effacés ou détruits) conformément aux procédures documentées et dans un délai spécifié, documenté.\n\nRecommandations de mise en œuvre\n\nIl convient que l'organisation effectue des contrôles périodiques afin de vérifier que les fichiers temporaires sont supprimés dans le délai identifié.\n\nInformations supplémentaires\n\nLes systèmes d'information peuvent créer des fichiers temporaires pendant le déroulement normal de leur fonctionnement. Ces fichiers sont spécifiques au système ou à l'application, mais peuvent inclure les journaux de restauration du système de fichiers ainsi que les fichiers temporaires associés à la mise à jour des bases de données et à l'exploitation d'autres logiciels d'application. Les fichiers temporaires ne sont pas nécessaires une fois que la tâche de traitement de l'information associée est terminée, mais il existe certaines situations où ils ne peuvent pas être supprimés. La durée pendant laquelle ces fichiers sont utilisés n'est pas toujours établie de façon déterministe, mais il convient qu'une procédure de «récupération de place» identifie les fichiers pertinents et détermine depuis combien de temps ils n'ont pas été utilisés."
    7_label: "Conservation"
    7_desc: "Mesure\n\nIl convient que l'organisation ne conserve pas les DCP plus longtemps que nécessaire pour les finalités pour lesquelles les DCP sont traitées.\n\nRecommandations de mise en œuvre\n\nIl convient que l'organisation élabore et tienne à jour des programmes de conservation pour les informations qu'elle conserve, en tenant compte de l'exigence de conservation des DCP pendant une durée n'excédant pas celle qui est nécessaire. Il convient que ces programmes tiennent compte des exigences légales, règlementaires et organisationnelles. Lorsque ces exigences sont contradictoires, il est nécessaire de prendre une décision opérationnelle (fondée sur une appréciation des risques) et de la documenter dans le programme approprié."
    8_label: "Mise au rebut"
    8_desc: "Mesure\n\nIl convient que l'organisation ait mis en place des politiques, des procédures et/ou des mécanismes documentés pour la mise au rebut des DCP.\n\nRecommandations de mise en œuvre\n\nLe choix des techniques de mise au rebut des DCP dépend d'un certain nombre de facteurs, étant donné que les techniques de mise au rebut diffèrent en termes de propriétés et de résultats (par exemple: en matière de granularité des supports physiques produits, ou de capacité à récupérer des informations supprimées sur des supports électroniques). Les facteurs à prendre en compte lors du choix d'une technique de mise au rebut appropriée incluent, sans que cela s'y limite, la nature et l'étendue des DCP à mettre au rebut, le fait que des métadonnées soient associées ou non aux DCP, et les caractéristiques physiques du support sur lequel les DCP sont stockées."
    9_label: "Mesures de transmission des DCP"
    9_desc: "Mesure\n\nIl convient que l'organisation soumette les DCP transmises (par exemple: envoyées à une autre organisation) via un réseau de transmission de données à des mesures appropriées conçues pour garantir que les données atteignent leur destination prévue.\n\nRecommandations de mise en œuvre\n\nIl est nécessaire que la transmission des DCP soit contrôlée, généralement en s'assurant que seules les personnes autorisées ont accès aux systèmes de transmission, et en suivant les processus appropriés (y compris la conservation des journaux d'audit) afin de s'assurer que les DCP sont transmises sans être compromises aux bons destinataires."
  5:
    title: "Partage, transfert et divulgation des DCP"
    1_label: "Identifier la base du transfert de DCP entre juridictions"
    1_desc: "Mesure\n\nIl convient que l'organisation identifie et documente la base pertinente pour les transferts de DCP entre juridictions.\n\nRecommandations de mise en œuvre\n\nLe transfert de DCP peut être soumis à la législation et/ou à la réglementation selon la juridiction ou l'organisation internationale à laquelle il est prévu de transférer les données (et selon leur point d'origine). Il convient que l'organisation documente la conformité à ces exigences comme base du transfert.\nCertaines juridictions peuvent exiger que les accords de transfert d'information soient examinés par une autorité de contrôle désignée. Il convient que les organisations opérant dans ces juridictions aient connaissance de ces exigences.\n\nℹ️NOTE\nLorsque les transferts ont lieu à l'intérieur d'une juridiction donnée, la législation et/ou la règlementation applicable sont les mêmes pour l'expéditeur et pour le destinataire."
    2_label: "Pays et organisations internationales auxquels les DCP peuvent être transférées"
    2_desc: "Mesure\n\nIl convient que l'organisation spécifie et documente les pays et organisations internationales auxquels des DCP peuvent éventuellement être transférées.\n\nRecommandations de mise en œuvre\n\nIl convient que le nom des pays et des organisations internationales auxquels des DCP peuvent éventuellement être transférées dans le cadre d'opérations normales soit mis à la disposition des clients. Il convient d'inclure le nom des pays découlant de l'utilisation d'un traitement de DCP soustraité. Il convient que les pays inclus soient envisagés par rapport au paragraphe 7.5.1.\nEn dehors des opérations normales, il peut exister des cas de transfert effectué à la demande d'une autorité chargée de l'application de la loi, pour lesquels le nom des pays ne peut pas être spécifié à l'avance, ou n'est pas autorisé à être divulgué d'après les juridictions applicables afin de préserver la confidentialité d'une enquête policière (voir 7.5.1, 8.5.4 et 8.5.5)."
    3_label: "Enregistrements des transferts de DCP"
    3_desc: "Mesure\n\nIl convient que l'organisation enregistre les transferts de DCP à destination de ou provenant de tiers et veille à la coopération avec ces parties afin de soutenir les demandes futures liées aux obligations visà-vis des personnes concernées.\n\nRecommandations de mise en œuvre\n\nL'enregistrement peut inclure les transferts, par des tiers, de DCP qui ont été modifiées du fait de la gestion, par des responsables de traitement de DCP, de leurs obligations, ou les transferts à des tiers destinés à mettre en œuvre des demandes légitimes de personnes concernées, y compris les demandes de suppression de DCP (par exemple: après un retrait de consentement).\nIl convient que l'organisation ait mis en place une politique définissant la durée de conservation de ces enregistrements.\nIl convient que l'organisation applique le principe de minimisation des données aux enregistrements de transferts en conservant uniquement les informations strictement nécessaires."
    4_label: "Enregistrements de la divulgation de DCP à des tiers"
    4_desc: "Mesure\n\nIl convient que l'organisation enregistre les divulgations de DCP à des tiers, y compris quelles DCP ont été divulguées, à qui et à quel moment.\n\nRecommandations de mise en œuvre\n\nDes DCP peuvent être divulguées pendant le déroulement normal des activités. Il convient que ces divulgations soient enregistrées. Il convient également d'enregistrer toute divulgation supplémentaire à des tiers, par exemple les divulgations découlant d'enquêtes judiciaires ou d'audits externes. Il convient d'inclure dans les enregistrements la source de la divulgation et la source de l'autorité demandant la divulgation."
8:
  title: "Recommandations supplémentaires de l'ISO/IEC 27002 pour les soustraitants de DCP"
  1_label: "Généralités"
  1_desc: "Les recommandations de l'Article 6 et les ajouts du présent article créent des recommandations spécifiques au PIMS pour les sous-traitants de DCP. Les recommandations de mise en œuvre documentées dans le présent article se rapportent aux mesures énumérées dans l'Annexe B."
  2:
    title: "Conditions de collecte et de traitement"
    1_label: "Gestion des risques"
    1_desc: "Mesure\n\nIl convient que l'organisation s'assure, le cas échéant, que le contrat relatif au traitement des DCP traite du rôle de l'organisation dans la fourniture d'aide relative aux obligations du client (en tenant compte de la nature du traitement et des informations disponibles pour l'organisation).\n\nRecommandations de mise en œuvre\n\nIl convient que le contrat conclu entre l'organisation et le client inclue les éléments suivants lorsque cela est pertinent, et en fonction du rôle du client (responsable de traitement de DCP ou sous-traitant de DCP) (cette liste n'est ni définitive, ni exhaustive):\n\t\t- protection de la vie privée dès la conception et protection de la vie privée par défaut (voir 7.4, 8.4);\n\t\t- parvenir à la sécurité du traitement;\n\t\t- notification des violations impliquant des DCP à une autorité de contrôle;\n\t\t- notification des violations impliquant des DCP aux clients et aux personnes concernées;\n\t\t- réalisation d'études de l'impact sur la vie privée (PIA); et\n\t\t- l'assurance de l'aide du sous-traitant de DCP si des consultations préalables avec les autorités de protection des DCP correspondantes sont nécessaires.\n\nCertaines juridictions exigent que le contrat inclue le sujet et la durée du traitement, la nature et la finalité du traitement, le type de DCP et les catégories de personnes concernées."
    2_label: "Finalités de l'organisation"
    2_desc: "Mesure\n\nIl convient que l'organisation s'assure que les DCP traitées au nom d'un client sont uniquement traitées dans le cadre des finalités exprimées dans les instructions documentées du client.\n\nRecommandations de mise en œuvre\n\nIl convient que le contrat conclu entre l'organisation et le client inclue, sans que cela s'y limite, l'objectif et le calendrier que le service doit atteindre.\nPour concrétiser la finalité du client, il peut y avoir des raisons techniques justifiant qu'il est approprié pour l'organisation de déterminer la méthode de traitement des DCP, conformément aux instructions générales du client, mais sans instruction explicite de la part du client. Par exemple, pour utiliser efficacement une capacité de réseau ou de traitement, il peut être nécessaire d'affecter des ressources de traitement spécifiques selon certaines caractéristiques de la personne concernée.\nIl convient que l'organisation permette au client de vérifier qu'elle est en conformité avec la spécification de la finalité et les principes de limitation. Cela garantit également qu'aucune DCP n'est traitée par l'organisation ou l'un quelconque de ses sous-traitants pour d'autres finalités que celles exprimées dans les instructions documentées du client."
    3_label: "Utilisation à des fins de prospection et de publicité"
    3_desc: "Mesure\n\nIl convient que l'organisation n'utilise pas de DCP traitées en vertu d'un contrat à des fins de prospection et de publicité sans établir que le consentement préalable a été obtenu de la personne concernée correspondante. Il convient que l'organisation ne fasse pas du don de ce consentement une condition pour la réception du service.\n\nRecommandations de mise en œuvre\nIl convient que la conformité des sous-traitants de DCP aux exigences contractuelles du client soit documentée, en particulier lorsque des actions de prospection et/ou de publicité sont prévues.\nIl convient que les organisations n'insistent pas sur l'inclusion d'utilisations à des fins de prospection et/ou de publicité lorsque le consentement explicite des personnes concernées n'a pas été obtenu de façon loyale.\n\nℹ️NOTE\nCette mesure s'ajoute à la mesure plus générale donnée en 8.2.2 et ne la remplace ni ne l'annule."
    4_label: "Instruction en infraction"
    4_desc: "Mesure\n\nIl convient que l'organisation informe le client si, selon elle, une instruction de traitement enfreint la législation et/ou la réglementation applicable.\n\nRecommandations de mise en œuvre\n\nLa capacité de l'organisation à vérifier si l'instruction enfreint la législation et/ou la réglementation peut dépendre du contexte technologique, de l'instruction elle-même, et du contrat entre l'organisation et le client."
    5_label: "Obligations du client"
    5_desc: "Mesure\n\nIl convient que l'organisation fournisse au client les informations appropriées de sorte que le client puisse démontrer qu'il est en conformité avec ses obligations.\n\nRecommandations de mise en œuvre\n\nLes informations dont le client a besoin peuvent inclure la question de savoir si l'organisation autorise et contribue aux audits réalisés par le client ou par un autre auditeur mandaté ou autrement convenu par le client."
    6_label: "Enregistrements liés au traitement des DCP"
    6_desc: "Mesure\n\nIl convient que l'organisation identifie et tienne à jour les enregistrements nécessaires démontrant qu'elle est en conformité avec ses obligations (tel que spécifié dans le contrat applicable) en ce qui concerne le traitement des DCP effectué au nom d'un client.\n\nRecommandations de mise en œuvre\n\nCertaines juridictions peuvent exiger de l'organisation qu'elle enregistre des informations telles que:\n\t\t- les catégories de traitement effectué au nom de chaque client;\n\t\t- les transferts à des organisations internationales ou des pays tiers; et\n\t\t- une description générale des mesures de sécurité techniques et organisationnelles."
  3:
    title: "Obligations vis-à-vis des personnes concernées"
    1_label: "Obligations vis-à-vis des personnes concernées"
    1_desc: "Mesure\n\nIl convient que l'organisation fournisse au client les moyens de se conformer à ses obligations liées aux personnes concernées.\n\nRecommandations de mise en œuvre\n\nLes obligations d'un responsable de traitement de DCP peuvent être définies par la législation, par la réglementation et/ou par un contrat. Ces obligations peuvent inclure des cas où le client utilise les services de l'organisation pour la mise en œuvre de ces obligations. Cela peut comprendre, par exemple, la correction ou la suppression de DCP au moment opportun.\nLorsqu'un client dépend de l'organisation pour obtenir des informations ou des mesures techniques qui aident à satisfaire aux obligations vis-à-vis des personnes concernées, il convient que les informations ou les mesures techniques pertinentes soient spécifiées dans un contrat."
  4:
    title: "Protection de la vie privée dès la conception et protection de la vie privée par défaut"
    1_label: "Fichiers temporaires"
    1_desc: "Mesure\n\nIl convient que l'organisation s'assure que les fichiers temporaires créés à la suite du traitement de DCP sont mis au rebut (par exemple: effacés ou détruits) conformément aux procédures documentées et dans un délai spécifié, documenté.\n\nIl convient que l'organisation vérifie de façon périodique que les fichiers temporaires inutilisés sont supprimés dans le délai identifié.\n\nIl convient que l'organisation vérifie de façon périodique que les fichiers temporaires inutilisés sont supprimés dans le délai identifié.\n\nInformations supplémentaires\n\nLes systèmes d'information peuvent créer des fichiers temporaires pendant le déroulement normal de leur fonctionnement. Ces fichiers sont spécifiques au système ou à l'application, mais peuvent inclure les journaux de restauration du système de fichiers ainsi que les fichiers temporaires associés à la mise à jour des bases de données et à l'exploitation d'autres logiciels d'application. Les fichiers temporaires ne sont pas nécessaires une fois que la tâche de traitement de l'information associée est terminée, mais il existe certaines situations où ils ne peuvent pas être supprimés. La durée pendant laquelle ces fichiers sont utilisés n'est pas toujours établie de façon déterministe, mais il convient qu'une procédure de «récupération de place» identifie les fichiers pertinents et détermine depuis combien de temps ils n'ont pas été utilisés."
    2_label: "Restitution, transfert ou mise au rebut des DCP"
    2_desc: "Mesure\n\nIl convient que l'organisation offre la capacité de restituer, de transférer et/ou de mettre au rebut les DCP de façon sécurisée. Il convient également qu'elle mette sa politique à disposition du client.\n\nRecommandations de mise en œuvre\n\nIl peut être nécessaire à un certain moment de mettre au rebut les DCP d'une manière donnée. Cela peut impliquer de restituer les DCP au client, de les transférer à une autre organisation ou à un responsable de traitement de DCP (par exemple: à la suite d'une fusion), de les supprimer ou autrement de les détruire, de les dé-identifier ou de les archiver. Il convient que la capacité de restitution, de transfert et/ ou de mise au rebut des DCP soit gérée de façon sécurisée.\nIl convient que l'organisation fournisse l'assurance nécessaire pour permettre au client de s'assurer que les DCP traitées dans le cadre d'un contrat sont supprimées (par l'organisation ou l'un quelconque de ses sous-traitants) partout où elles sont stockées, y compris pour les besoins de sauvegarde et de continuité d'activité, dès lors qu'elles ne sont plus nécessaires aux finalités identifiées du client.\nIl convient que l'organisation élabore et mette en œuvre une politique concernant la mise au rebut des DCP, et il convient qu'elle mette cette politique à disposition du client sur demande.\nIl convient que la politique couvre la période de conservation des DCP avant leur mise au rebut après la résiliation d'un contrat, afin de protéger le client contre une perte de DCP en cas de caducité accidentelle du contrat.\n\nℹ️NOTE\nCette mesure et ces recommandations sont également pertinentes en vertu du principe de conservation (voir 7.4.7)."
    3_label: "Mesures de transmission des DCP"
    3_desc: "Mesure\n\nIl convient que l'organisation soumette les DCP transmises via un réseau de transmission de données à des mesures appropriées conçues pour garantir que les données atteignent leur destination prévue.\n\nRecommandations de mise en œuvre\n\nIl est nécessaire que la transmission des DCP soit contrôlée, généralement en s'assurant que seules les personnes autorisées ont accès aux systèmes de transmission, et en suivant les processus appropriés (y compris la conservation des données d'audit) afin de s'assurer que les DCP sont transmises sans être compromises aux bons destinataires. Les exigences relatives aux mesures de transmission peuvent être incluses dans le contrat conclu entre le sous-traitant de DCP et le client.\nLorsqu'aucune exigence contractuelle associée à la transmission n'est en place, il peut être approprié de consulter le client avant la transmission."
  5:
    title: "Partage, transfert et divulgation des DCP"
    1_label: "Base du transfert de DCP entre juridictions"
    1_desc: "Mesure\n\nIl convient que l'organisation informe le client en temps opportun de la base des transferts de DCP entre juridictions et de toute modification prévue à cet égard, afin que le client soit en mesure de s'opposer à ces modifications ou de résilier le contrat.\n\nRecommandations de mise en œuvre\n\nLe transfert de DCP entre juridictions peut être soumis à la législation et/ou à la réglementation selon la juridiction ou l'organisation à laquelle il est prévu de transférer les DCP (et selon leur point d'origine). Il convient que l'organisation documente la conformité à ces exigences comme base du transfert.\nIl convient que l'organisation informe le client de tout transfert de DCP, y compris les transferts à destination de:\n\t\t- fournisseurs;\n\t\t- autres parties;\n\t\t- autres pays ou organisations internationales.\n\nEn cas de modification, il convient que l'organisation informe le client à l'avance, selon un calendrier convenu, afin que le client soit en mesure de s'opposer à ces modifications ou de résilier le contrat.\nL'accord conclu entre l'organisation et le client peut comporter des articles stipulant que l'organisation peut mettre en œuvre des modifications sans en informer le client. Dans ces cas, il convient que les limites de cette latitude soient définies (par exemple: l'organisation peut changer de fournisseur sans en informer le client, mais ne peut pas transférer de DCP vers d'autres pays).\nEn cas de transfert international de DCP, il convient d'identifier des accords tels que des clauses contractuelles types, des règles d'entreprise contraignantes ou des règles transfrontalières en matière de protection de la vie privée, les pays impliqués et les situations dans lesquelles ces accords s'appliquent."
    2_label: "Pays et organisations internationales auxquels les DCP peuvent être transférées"
    2_desc: "Mesure\n\nIl convient que l'organisation spécifie et documente les pays et organisations internationales auxquels des DCP peuvent éventuellement être transférées.\n\nRecommandations de mise en œuvre\n\nIl convient que le nom des pays et des organisations internationales auxquels des DCP peuvent éventuellement être transférées dans le cadre d'opérations normales soit mis à la disposition des clients. Il convient d'inclure le nom des pays découlant de l'utilisation d'un traitement de DCP soustraité. Il convient que les pays inclus soient envisagés par rapport au paragraphe 8.5.1.\nEn dehors des opérations normales, il peut exister des cas de transfert effectué à la demande d'une autorité chargée de l'application de la loi, pour lesquels le nom des pays ne peut pas être spécifié à l'avance, ou n'est pas autorisé à être divulgué d'après les juridictions applicables afin de préserver la confidentialité d'une enquête policière (voir 7.5.1, 8.5.4 et 8.5.5)."
    3_label: "Enregistrements de la divulgation de DCP à des tiers"
    3_desc: "Mesure\n\nIl convient que l'organisation enregistre les divulgations de DCP à des tiers, y compris quelles DCP ont été divulguées, à qui et quand.\n\nRecommandations de mise en œuvre\n\nDes DCP peuvent être divulguées pendant le déroulement normal des activités. Il convient que ces divulgations soient enregistrées. Il convient également d'enregistrer toute divulgation supplémentaire à des tiers, par exemple les divulgations découlant d'enquêtes judiciaires ou d'audits externes. Il convient d'inclure dans les enregistrements la source de la divulgation et la source de l'autorité demandant la divulgation."
    4_label: "Notification des demandes de divulgation de DCP"
    4_desc: "Mesure\n\nIl convient que l'organisation informe le client de toute demande juridiquement contraignante de divulgation de DCP.\n\nRecommandations de mise en œuvre\n\nL'organisation peut recevoir des demandes de divulgation de DCP juridiquement contraignantes (par exemple: de la part des autorités chargées de l'application de la loi). Dans ces cas, il convient que l'organisation informe le client de toute demande de ce type dans les délais convenus et conformément à une procédure convenue (qui peut être incluse dans le contrat conclu avec le client).\nDans certains cas, les demandes juridiquement contraignantes comprennent l'obligation pour l'organisation de n'informer personne au sujet de l'événement (un exemple d'une éventuelle interdiction de divulgation serait une interdiction en vertu du droit pénal destinée à préserver la confidentialité d'une enquête policière)."
    5_label: "Divulgations de DCP juridiquement contraignantes"
    5_desc: "Mesure\n\nIl convient que l'organisation refuse toute demande de divulgation de DCP qui n'est pas juridiquement contraignante, qu'elle consulte le client correspondant avant de procéder à toute divulgation de DCP et d'accepter toute demande de divulgation de DCP convenue par contrat autorisée par le client correspondant.\n\nRecommandations de mise en œuvre\n\nLes détails relatifs à la mise en œuvre de la mesure peuvent être inclus dans le contrat conclu avec le client.\nCes demandes peuvent émaner de plusieurs sources, y compris les tribunaux administratifs, les tribunaux et les autorités administratives. Elles peuvent être soumises par n'importe quelle juridiction."
    6_label: "Divulgation des sous-traitants utilisés pour traiter des DCP"
    6_desc: "Mesure\n\nIl convient que l'organisation divulgue au client tout recours à des sous-traitants pour le traitement des DCP avant qu'il soit fait appel à eux.\n\nRecommandations de mise en œuvre\n\nIl convient que des dispositions relatives au recours aux sous-traitants pour le traitement des DCP soient incluses dans le contrat conclu avec le client.\nIl convient que les informations divulguées couvrent le fait qu'il est fait appel à la sous-traitance, ainsi que le nom des sous-traitants correspondants. Il convient que les informations divulguées incluent également les organisations internationales et les pays auxquels les sous-traitants peuvent transférer des données (voir 8.5.2) et les moyens par lesquels les sous-traitants sont tenus de satisfaire à ou de dépasser les obligations de l'organisation (voir 8.5.7).\nLorsqu'il est déterminé qu'une divulgation publique d'informations relatives à un sous-traitant augmente le risque pour la sécurité au-delà des limites acceptables, il convient que cette divulgation soit effectuée en vertu d'un contrat de non-divulgation et/ou à la demande du client Il convient que le client soit informé du fait que les informations sont disponibles.\nCeci ne concerne pas la liste des pays où les DCP peuvent être transférées. Il convient que cette liste soit divulguée au client dans tous les cas d'une façon qui leur permet d'informer les personnes concernées."
    7_label: "Recrutement d'un sous-traitant pour le traitement de DCP"
    7_desc: "Mesure\n\nIl convient que l'organisation recrute un sous-traitant uniquement pour traiter les DCP conformément au contrat conclu avec le client.\n\nRecommandations de mise en œuvre\n\nLorsque l'organisation sous-traite tout ou partie du traitement de ces DCP à une autre organisation, une autorisation écrite du client est requise avant le début du traitement des DCP par le sous-traitant. Cela peut être sous la forme d'articles appropriés dans le contrat conclu avec le client, ou peut être un accord revêtant un caractère ponctuel.\nIl convient que l'organisation dispose d'un contrat écrit avec tout fournisseur auquel elle fait appel pour traiter des DCP en son nom, et il convient qu'elle s'assure que les contrats qu'elle conclut avec les soustraitants traitent de la mise en œuvre des mesures appropriées indiquées à l'Annexe B.\nIl convient que le contrat conclu entre l'organisation et tout sous-traitant traitant des DCP en son nom exige du sous-traitant qu'il mette en œuvre les mesures appropriées spécifiées à l'Annexe B, en tenant compte du processus d'appréciation des risques pour la sécurité de l'information (voir 5.4.1.2) et du périmètre du traitement des DCP effectué par le sous-traitant de DCP (voir 6.12). Par défaut, il convient de présumer que toutes les mesures spécifiées à l'Annexe B sont pertinentes. Si l'organisation décide de ne pas exiger du sous-traitant qu'il mette en œuvre une mesure contenue dans l'Annexe B, il convient qu'elle justifie son exclusion.\nUn contrat peut définir les responsabilités de chaque partie de façon différente mais, afin d'être en conformité avec le présent document, il convient que toutes les mesures soient prises en compte et incluses dans les informations documentées."
    8_label: "Changement de sous-traitant pour le traitement de DCP"
    8_desc: "Mesure\n\nIl convient que l'organisation, si elle dispose d'une autorisation générale écrite, informe le client de toute modification prévue concernant l'ajout ou le remplacement de sous-traitants pour le traitement des DCP, ce qui donne au client la possibilité de s'opposer à ces changements.\n\nRecommandations de mise en œuvre\n\nLorsque l'organisation change l'organisation à laquelle elle sous-traite tout ou partie du traitement de ces DCP, une autorisation écrite du client est alors nécessaire pour le changement, avant le début du traitement des DCP par le nouveau sous-traitant. Cela peut être sous la forme d'articles appropriés dans le contrat conclu avec le client, ou peut être un accord revêtant un caractère ponctuel."
9:
  title: "Objectifs et mesures de référence spécifiques au PIMS (responsables de traitement de DCP)"
  prefix: "Annexe A"
  2:
    title: "Conditions de collecte et de traitement"
    1_prefix: "A.7.2.1"
    1_label: "Identifier et documenter la finalité"
    1_desc: "Mesure\n\nL'organisation doit identifier et documenter les finalités spécifiques pour lesquelles les DCP seront traitées."
    2_prefix: "A.7.2.2"
    2_label: "Identifier le fondement juridique"
    2_desc: "Mesure\n\nL'organisation doit déterminer, documenter et se conformer au fondement juridique pertinent pour le traitement des DCP pour les finalités identifiées."
    3_prefix: "A.7.2.3"
    3_label: "Déterminer quand et comment le consentement doit être obtenu"
    3_desc: "Mesure\n\nL'organisation doit déterminer et documenter un processus par lequel elle peut démontrer si, quand et comment le consentement pour le traitement des DCP a été obtenu des personnes concernées."
    4_prefix: "A.7.2.4"
    4_label: "Obtenir et enregistrer le consentement"
    4_desc: "Mesure\n\nL'organisation doit obtenir et enregistrer le consentement des personnes concernées conformément aux procédures documentées."
    5_prefix: "A.7.2.5"
    5_label: "Étude de l'impact sur la vie privée"
    5_desc: "Mesure\n\nL'organisation doit évaluer la nécessité de, et mettre en œuvre lorsque cela est approprié, une étude de l'impact sur la vie privée à chaque fois qu'un nouveau traitement de DCP ou que des modifications à un traitement de DCP existant sont prévus."
    6_prefix: "A.7.2.6"
    6_label: "Contrats conclus avec les sous-traitants de DCP"
    6_desc: "Mesure\n\nL'organisation doit disposer d'un contrat écrit avec tout soustraitant de DCP auquel elle fait appel, et elle doit s'assurer que les contrats qu'elle conclut avec les sous-traitants de DCP traitent de la mise en œuvre des mesures appropriées indiquées à l'Annexe B."
    7_prefix: "A.7.2.7"
    7_label: "Responsable conjoint de traitement"
    7_desc: "Mesure\n\nL'organisation doit déterminer les responsabilités et les rôles respectifs pour le traitement des DCP (y compris les exigences en matière de sécurité et de protection des DCP) avec tout responsable conjoint de traitement."
    8_prefix: "A.7.2.8"
    8_label: "Enregistrements liés au traitement des DCP"
    8_desc: "Mesure\n\nL'organisation doit déterminer et tenir à jour de façon sécurisée les enregistrements nécessaires à l'appui de ses obligations pour le traitement des DCP."
  3:
    title: "Obligations vis-à-vis des personnes concernées"
    1_prefix: "A.7.3.1"
    1_label: "Identifier les obligations vis-à-vis des personnes concernées et y satisfaire"
    1_desc: "Mesure\n\nL'organisation doit identifier et documenter ses obligations légales, règlementaires et organisationnelles vis-à-vis des personnes concernées liées au traitement de leurs DCP, et prévoir les moyens de satisfaire à ces obligations."
    2_prefix: "A.7.3.2"
    2_label: "Déterminer les informations destinées aux personnes concernées"
    2_desc: "Mesure\n\nL'organisation doit déterminer et documenter les informations à fournir aux personnes concernées en ce qui concerne le traitement de leurs DCP et le moment pour le faire."
    3_prefix: "A.7.3.3"
    3_label: "Fournir des informations aux personnes concernées"
    3_desc: "Mesure\n\nL'organisation doit fournir aux personnes concernées des informations claires et facilement accessibles identifiant le responsable de traitement de DCP et décrivant le traitement de leurs DCP."
    4_prefix: "A.7.3.4"
    4_label: "Fournir un mécanisme permettant de modifier ou de retirer le consentement"
    4_desc: "Mesure\n\nL'organisation doit fournir un mécanisme permettant aux personnes concernées de modifier ou de retirer leur consentement."
    5_prefix: "A.7.3.5"
    5_label: "Fournir un mécanisme permettant de s'opposer au traitement des DCP"
    5_desc: "Mesure\n\nL'organisation doit fournir un mécanisme permettant aux personnes concernées de s'opposer au traitement de leurs DCP."
    6_prefix: "A.7.3.6"
    6_label: "Accès, rectification et/ ou suppression"
    6_desc: "Mesure\n\nL'organisation doit mettre en œuvre des politiques, des procédures et/ou des mécanismes permettant de satisfaire à ses obligations visà-vis des personnes concernées en matière d'accès, de rectification et/ou de suppression de leurs DCP."
    7_prefix: "A.7.3.7"
    7_label: "Obligation d'information des tiers des responsables de traitement de DCP"
    7_desc: "Mesure\n\nL'organisation doit informer les tiers avec lesquels des DCP ont été partagées de toute modification, suppression ou opposition relatives aux DCP partagées, et mettre en œuvre des politiques, des procédures et/ou des mécanismes appropriés permettant de le faire."
    8_prefix: "A.7.3.8"
    8_label: "Fourniture de copies des DCP traitées"
    8_desc: "Mesure\n\nL'organisation doit être en mesure de fournir une copie des DCP qui sont traitées sur demande de la personne concernée."
    9_prefix: "A.7.3.9"
    9_label: "Gestion des demandes"
    9_desc: "Mesure\n\nL'organisation doit définir et documenter les politiques et procédures de gestion et de réponse aux demandes légitimes émanant de personnes concernées."
    10_prefix: "A.7.3.10"
    10_label: "Prise de décision automatisée"
    10_desc: "Mesure\n\nL'organisation doit identifier et traiter les obligations, y compris les obligations légales, vis-à-vis des personnes concernées découlant des décisions prises par l'organisation qui sont liées à la personne concernée et qui sont uniquement fondées sur le traitement automatisé des DCP."
  4:
    title: "Protection de la vie privée dès la conception et protection de la vie privée par défaut"
    1_prefix: "A.7.4.1"
    1_label: "Limiter la collecte"
    1_desc: "Mesure\n\nL'organisation doit limiter la collecte des DCP au minimum de ce qui est pertinent, proportionnel et nécessaire pour les finalités identifiées."
    2_prefix: "A.7.4.2"
    2_label: "Limiter le traitement"
    2_desc: "Mesure\n\nL'organisation doit limiter le traitement des DCP à ce qui est adéquat, pertinent et nécessaire pour les finalités identifiées."
    3_prefix: "A.7.4.3"
    3_label: "Exactitude et qualité"
    3_desc: "Mesure\n\nL'organisation doit s'assurer et documenter que les DCP sont exactes, complètes et à jour tel que nécessaire pour les finalités pour lesquelles elles sont traitées, tout au long du cycle de vie des DCP."
    4_prefix: "A.7.4.4"
    4_label: "Objectifs de minimisation des DCP"
    4_desc: "Mesure\n\nL'organisation doit définir et documenter des objectifs de minimisation des données et quels mécanismes (tels que la dé-identification) sont utilisés pour atteindre ces objectifs."
    5_prefix: "A.7.4.5"
    5_label: "Dé-identification et suppression des DCP à la fin du traitement"
    5_desc: "Mesure\n\nL'organisation doit supprimer les DCP ou les transformer au point de rendre impossible l'identification ou la ré-identification des personnes concernées, dès que les DCP d'origine ne sont plus nécessaires à la (ou aux) finalité(s) identifiée(s)."
    6_prefix: "A.7.4.6"
    6_label: "Fichiers temporaires"
    6_desc: "Mesure\n\nL'organisation doit s'assurer que les fichiers temporaires créés à la suite du traitement de DCP sont mis au rebut (par exemple: effacés ou détruits) conformément aux procédures documentées et dans un délai spécifié, documenté."
    7_prefix: "A.7.4.7"
    7_label: "Conservation"
    7_desc: "Mesure\n\nL'organisation ne doit pas conserver les DCP plus longtemps que nécessaire pour les finalités pour lesquelles les DCP sont traitées."
    8_prefix: "A.7.4.8"
    8_label: "Mise au rebut"
    8_desc: "Mesure\n\nL'organisation doit avoir mis en place des politiques, des procédures et/ou des mécanismes documentés pour la mise au rebut des DCP."
    9_prefix: "A.7.4.9"
    9_label: "Mesures de transmission des DCP"
    9_desc: "Mesure\n\nL'organisation doit soumettre les DCP transmises (par exemple: envoyées à une autre organisation) via un réseau de transmission de données à des mesures appropriées conçues pour garantir que les données atteignent leur destination prévue."
  5:
    title: "Partage, transfert et divulgation des DCP"
    1_prefix: "A.7.5.1"
    1_label: "Identifier la base du  transfert de DCP entre juridictions"
    1_desc: "Mesure\n\nL'organisation doit identifier et documenter la base pertinente pour les transferts de DCP entre juridictions."
    2_prefix: "A.7.5.2"
    2_label: "Pays et organisations internationales auxquels les DCP peuvent être transférées"
    2_desc: "Mesure\n\nL'organisation doit spécifier et documenter les pays et organisations internationales auxquels des DCP peuvent éventuellement être transférées."
    3_prefix: "A.7.5.3"
    3_label: "Enregistrements des transferts de DCP"
    3_desc: "Mesure\n\nL'organisation doit enregistrer les transferts de DCP à destination de ou provenant de tiers et veiller à la coopération avec ces parties afin de soutenir les demandes futures liées aux obligations vis-à-vis des personnes concernées."
    4_prefix: "A.7.5.4"
    4_label: "Enregistrements de la divulgation de DCP à des tiers"
    4_desc: "Mesure\n\nL'organisation doit enregistrer les divulgations de DCP à des tiers, y compris quelles DCP ont été divulguées, à qui et à quel moment."
10:
  title: "Objectifs et mesures de référence spécifiques au PIMS (soustraitants de DCP)"
  prefix: "Annexe B"
  2:
    title: "Conditions de collecte et de traitement"
    1_prefix: "B.8.2.1"
    1_label: "Contrat client"
    1_desc: "Mesure\n\nL'organisation doit s'assurer, le cas échéant, que le contrat relatif au traitement des DCP traite du rôle de l'organisation dans la fourniture d'aide relative aux obligations du client (en tenant compte de la nature du traitement et des informations disponibles pour l'organisation)."
    2_prefix: "B.8.2.2"
    2_label: "Finalités de l'organisation"
    2_desc: "Mesure\n\nL'organisation doit s'assurer que les DCP traitées au nom d'un client sont uniquement traitées dans le cadre des finalités exprimées dans les instructions documentées du client."
    3_prefix: "B.8.2.3"
    3_label: "Utilisation à des fins de prospection et de publicité"
    3_desc: "Mesure\n\nL'organisation ne doit pas utiliser de DCP traitées en vertu d'un contrat à des fins de prospection et de publicité sans établir que le consentement préalable a été obtenu de la personne concernée correspondante. L'organisation ne doit pas faire du don de ce consentement une condition pour la réception du service."
    4_prefix: "B.8.2.4"
    4_label: "Instruction en infraction"
    4_desc: "Mesure\n\nL'organisation doit informer le client si, selon elle, une instruction de traitement enfreint la législation et/ou la réglementation applicable."
    5_prefix: "B.8.2.5"
    5_label: "Obligations du client"
    5_desc: "Mesure\n\nL'organisation doit fournir au client les informations appropriées de sorte que le client puisse démontrer qu'il est en conformité avec ses obligations."
    6_prefix: "B.8.2.6"
    6_label: "Enregistrements liés au traitement des DCP"
    6_desc: "Mesure\n\nL'organisation doit identifier et tenir à jour les enregistrements nécessaires démontrant qu'elle est en conformité avec ses obligations (tel que spécifié dans le contrat applicable) en ce qui concerne le traitement des DCP effectué au nom d'un client"
  3:
    title: "Obligations vis-à-vis des personnes concernées"
    1_prefix: "B.8.3.1"
    1_label: "Obligations vis-àvis des personnes concernées"
    1_desc: "Mesure\n\nL'organisation doit fournir au client les moyens de se conformer à ses obligations liées aux personnes concernées."
  4:
    title: "Protection de la vie privée dès la conception et protection de la vie privée par défaut"
    1_prefix: "B.8.4.1"
    1_label: "Fichiers temporaires"
    1_desc: "Mesure\n\nL'organisation doit s'assurer que les fichiers temporaires créés à la suite du traitement de DCP sont mis au rebut (par exemple: effacés ou détruits) conformément aux procédures documentées et dans un délai spécifié, documenté."
    2_prefix: "B.8.4.2"
    2_label: "Restitution, transfert ou mise au rebut des DCP"
    2_desc: "Mesure\n\nL'organisation doit offrir la capacité de restituer, de transférer et/ ou de mettre au rebut les DCP de façon sécurisée. Elle doit également mettre sa politique à disposition du client."
    3_prefix: "B.8.4.3"
    3_label: "Mesures de transmission des DCP"
    3_desc: "Mesure\n\nL'organisation doit soumettre les DCP transmises via un réseau de transmission de données à des mesures appropriées conçues pour garantir que les données atteignent leur destination prévue."
  5:
    title: "Partage, transfert et divulgation des DCP"
    1_prefix: "B.8.5.1"
    1_label: "Base du transfert de DCP entre juridictions"
    1_desc: "Mesure\n\nL'organisation doit informer le client en temps opportun de la base des transferts de DCP entre juridictions et de toute modification prévue à cet égard, afin que le client soit en mesure de s'opposer à ces modifications ou de résilier le contrat."
    2_prefix: "B.8.5.2"
    2_label: "Pays et organisations internationales auxquels les DCP peuvent être transférées"
    2_desc: "Mesure\n\nL'organisation doit spécifier et documenter les pays et organisations internationales auxquels des DCP peuvent éventuellement être transférées."
    3_prefix: "B.8.5.3"
    3_label: "Enregistrements de la divulgation de DCP à des tiers"
    3_desc: "Mesure\n\nL'organisation doit enregistrer les divulgations de DCP à des tiers, y compris quelles DCP ont été divulguées, à qui et quand."
    4_prefix: "B.8.5.4"
    4_label: "Notification des demandes de divulgation de DCP"
    4_desc: "Mesure\n\nL'organisation doit informer le client de toute demande juridiquement contraignante de divulgation de DCP."
    5_prefix: "B.8.5.5"
    5_label: "Divulgations de DCP juridiquement contraignantes"
    5_desc: "Mesure\n\nL'organisation doit refuser toute demande de divulgation de DCP qui n'est pas juridiquement contraignante, consulter le client correspondant avant de procéder à toute divulgation de DCP et accepter toute demande de divulgation de DCP convenue par contrat autorisée par le client correspondant."
    6_prefix: "B.8.5.6"
    6_label: "Divulgation des sous-traitants utilisés pour traiter des DCP"
    6_desc: "Mesure\n\nL'organisation doit divulguer au client tout recours à des sous-traitants pour le traitement des DCP avant qu'il soit fait appel à eux."
    7_prefix: "B.8.5.7"
    7_label: "Recrutement d'un sous-traitant pour le traitement de DCP"
    7_desc: "Mesure\n\nL'organisation doit engager un sous-traitant uniquement pour traiter les DCP conformément au contrat conclu avec le client."
    8_prefix: "B.8.5.8"
    8_label: "Changement de sous-traitant pour le traitement de DCP"
    8_desc: "Mesure\n\nL'organisation doit, si elle dispose d'une autorisation générale écrite, informer le client de toute modification prévue concernant l'ajout ou le remplacement de sous-traitants pour le traitement des DCP, ce qui donne au client la possibilité de s'opposer à ces changements."
